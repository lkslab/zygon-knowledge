# METHOD SCHEMA — how to author one method card
# ============================================================================
# A method card captures, for ONE modelling METHOD (e.g. `mga-near-optimal-space`),
# what the method is called in the literature, what question it answers, how it is
# implemented as practised, which papers do it — and, per model, what pypsa-eur and
# pypsa-earth actually offer to implement it, at which boundary rung.
#
# RELATIONSHIP TO THE OTHER BOOKS — read this first, it defines the scope:
#   topics/                 keyed by QUESTION   ("how much storage does X need")
#   generation_conversion/  keyed by THING      ("grid-scale batteries")
#   demand/                 keyed by THING      ("electricity load")
#   methods/  (this book)   keyed by HOW        ("myopic optimisation", "MGA")
#
# It is derived from contracts/RECIPE.schema.yaml so that harmonisation is a merge,
# not a rewrite. Fields shared with that contract keep their names and semantics.
#
# WHAT THIS BOOK DOES NOT DO: it does not re-derive model capabilities.
# cookbooks/<model>/topics/FUNCTIONALITY.yaml already owns those — 105 grep-verified
# entries for pypsa-eur, 68 for pypsa-earth, each with status/surface/consumer. A
# method card CITES those ids. The card adds the five things that registry cannot
# hold: the literature definition, the procedure, the variants, the prevalence, and
# the ASSEMBLY recipe for when a method is several registry surfaces wired together.
#
# GROUNDING (the golden rule, inherited unchanged): every factual claim about a
# model — a config key, rule, script, symbol — MUST carry `provenance` as
# `file:symbol` that the author actually grepped. NEVER a line number (they rot).
# Claims about the LITERATURE carry a paper filename instead. A line with neither
# is a hallucination risk and is INVALID, not "best effort".
# ============================================================================

# ── LITERATURE SIDE (model-agnostic) ────────────────────────────────────────

id:
  description: "Method slug, kebab-case, == filename stem. Must be in _qa/SLUGS.yaml."
  shape: "string   # e.g. 'mga-near-optimal-space'"

title:
  description: "Human-readable method name, including the acronym if it has one."
  shape: "string"

summary:
  description: "ONE line: what the method IS. No code, no model, no config key."
  shape: "string"

question:
  description: >
    ONE line: the question the method answers. Deliberately the SAME field name as
    topics/ cards use, so the two books share a vocabulary at harmonisation time.
  shape: "string"

aliases:
  description: >
    The names the LITERATURE uses — the grep targets. Distinct from `when_to_use`,
    which is USER phrasing. Both are needed; they serve different indexes.
  shape: "[ string, ... ]   # e.g. ['MGA', 'near-optimal feasible space', 'broad ranges']"

when_to_use:
  description: >
    The retrieval surface — natural-language shapes of USER requests that route here.
    Cast wide; include the layperson phrasing, not just the modelling term.
  shape: "[ string, ... ]"

family:
  description: "One of the nine families defined in _qa/SLUGS.yaml:families."
  shape: "enum: uncertainty-and-robustness | foresight-and-pathways | spatial-resolution |
          temporal-resolution | grid-and-security | markets-and-prices | sector-coupling |
          storage | tooling-and-reproducibility"

prevalence:
  description: >
    How much of this corpus uses the method, kept AUDITABLE rather than asserted.
    `papers` must equal len(literature) and tier1+tier2 must equal papers — the
    checker enforces the arithmetic. `sweep_hits` is what the regex screen in
    _qa/SWEEP.csv found, recorded so a disagreement with the hand-coded pass is
    visible rather than silently resolved.
  shape: "{ papers: int, tier1: int, tier2: int, sweep_hits: int, basis: 'string' }"

procedure:
  description: >
    The algorithm AS PRACTISED, in numbered steps — the centre of gravity of the
    card. Each step names its `handle`: the concrete callable or config that
    performs it. A step with `handle: null` is a step you must WRITE, which makes
    the card self-summarising about where the L5 work actually is. Bare prose steps
    rot into hallucination; a step that names its handle is checkable.
  item:
    step:       "string (what happens, model-agnostic)"
    handle:     "string | null (the callable/config that does it; null = you write it)"
    provenance: "file:symbol | null (must be null iff handle is null)"

variants:
  description: >
    The distinguishable ways the method is done. `boundary[].variant` MUST join
    `variants[].id` — that join is what stops the ladder drifting from the taxonomy.
    Use a variant, not a new card, when the difference is a parameter or a
    post-processing choice rather than a different procedure.
  item:
    id:     "string (kebab-case, joined by boundary[].variant)"
    what:   "string (what distinguishes it, and what it buys)"
    papers: "[ string, ... ]   # subset of literature[].paper"

literature:
  description: >
    The corpus evidence. `paper` is the EXACT filename under papers/tierN_*/ (the
    checker resolves it against _qa/CORPUS.yaml and enforces that `tier` matches
    the directory). `note` says what THIS paper contributes to THIS method — not
    what the paper is about in general.
  item:
    paper: "string (exact filename incl. .pdf)"
    tier:  "1 | 2"
    role:  "enum: defines | extends | canonical-use | routine-use | critiques"
    note:  "string"
  role_legend:
    defines:       "introduced the method to this literature"
    extends:       "modified or generalised the method (e.g. MGA over weather ensembles)"
    canonical-use: "the reference application people cite for how to do it"
    routine-use:   "applies it as standard machinery, contributes no method content"
    critiques:     "a paper about how the method MISLEADS you — see `pitfalls`"

pitfalls:
  description: >
    How the method misleads you when it DOES run. Distinct from a model's
    `available.missing`, which is about what you cannot run at all. This is where
    the `critiques` literature lands as actionable text — a card that can cite its
    own critique is worth more than one that cannot.
  item:
    pitfall:  "string"
    evidence: "string (a literature[].paper)"
    note:     "string (what to do about it)"

requires_methods:
  description: >
    Hard prerequisites — you cannot do this method without those. Cycle-detected by
    the checker.
  shape: "[ slug, ... ]"

combines_with:
  description: "Optional compositions the literature actually performs. A suggestion graph."
  shape: "[ slug, ... ]"

topics:
  description: >
    The topics/ card slugs this method serves. The harmonisation seam: it lets the
    interview reach a method from a question.
  shape: "[ slug, ... ]   # resolved against cookbooks/pypsa-eur/topics/"

pypsa_primitive:
  description: >
    The book's sharpest field: whether the OPTIMISATION PRIMITIVE exists one layer
    down, in PyPSA the library, even when no workflow exposes it. `exposed_by` and
    `reachable_via` separate two different facts — "the primitive exists" and "the
    workflow can reach it". A primitive one layer down turns L5-from-scratch into
    L5-with-a-handle, which is the difference between a week and a quarter.
    Null when no primitive exists. NOTE: pypsa is a pip/conda dependency, not a
    submodule, so this claim is pinned to a version string, not a SHA — a soft
    anchor, and the checker skips it with a warning if the env is absent.
  shape: "{ symbol: 'file:symbol relative to site-packages', pypsa_version: 'string',
            exposed_by: 'string (which model calls it, or neither)',
            reachable_via: 'string (what it takes to call it from the workflow)',
            note: 'string' }"

# ── MODEL SIDE (one section per model; BOTH required) ───────────────────────

models:
  description: >
    Exactly two sections, pypsa-eur then pypsa-earth. Both are REQUIRED — the
    asymmetry between them is the payload of this book, and an omitted section is
    indistinguishable from an unexamined one. When a method genuinely does not
    apply to a model, set `not_applicable` with a reason rather than omitting.
  item:

    model:
      shape: "enum: pypsa-eur | pypsa-earth"

    version_anchor:
      description: >
        The models/<model> submodule SHA the claims were verified against. When the
        submodule moves, the checker re-greps every provenance symbol and stale
        claims fail loudly.
      shape: "{ ref: 'string (commit sha)', date: 'YYYY-MM-DD' }"

    not_applicable:
      description: "Optional escape. If set, the rest of the section may be omitted."
      shape: "string (the reason)"

    functionality:
      description: >
        The capability ids in THIS model's cookbooks/<model>/topics/FUNCTIONALITY.yaml
        that the method rests on — including ids whose status is `absent`, because
        'the registry says this is absent' is exactly the fact the card needs. The
        ids are per-registry and only partly overlap between models, which is why
        this lives inside the model section and not at top level.
      item:
        id:   "string (must resolve in that model's FUNCTIONALITY.yaml)"
        role: "string (what this capability does FOR this method)"

    available:
      description: >
        Replaces RECIPE's `out_of_box`. The question for a method is not "does the
        model represent this thing" but "can the workflow EXECUTE this procedure,
        and how much of it". `missing` names the `procedure` steps that have no
        handle here — the honest statement of what you would be writing.
      shape: "{ verdict: enum, how: 'string', missing: 'string', provenance: 'file:symbol' }"
      verdict_legend:
        turnkey:        "a config flip runs the method"
        assemble:       "every surface exists; you wire them together (see `assembly`)"
        primitive-only: "PyPSA has the primitive; the workflow does not expose it"
        absent:         "neither layer has it — this is new formulation work"

    levers:
      description: >
        Config keys that turn the method on or parameterise it WITHOUT touching code
        (L0/L1). Same shape and same dot-path validation as RECIPE recipes.

        BROADER THAN THE RECIPE SENSE, deliberately: for a method whose verdict is
        `absent` or `primitive-only` there is no key that turns it on, but there are
        usually keys that decide what the method would be applied TO, what it would
        cost to run, and which nearby substitute exists. Those belong here — three
        cards converged on this independently, and the information has nowhere better
        to live. Say so in `effect` when a key is of that kind (the house phrasing is
        e.g. "not a cascade lever, but the one config value that changes every cascade
        result"). A lever is therefore not a claim that the method is available; the
        verdict is the only thing that claims that.
      item:
        key:        "string (full config path)"
        effect:     "string"
        default:    "string (the out-of-box value)"
        provenance: "file:symbol"

    assembly:
      description: >
        THE key model-side field, and the one the registry cannot hold: the ordered
        recipe for wiring several existing surfaces into the method. Most methods in
        this book are not one config key — `balancing-and-ancillary-services` is
        four registry entries, none of which alone is the method. Omit only when
        `available.verdict` is `turnkey` (one lever is the whole story).
      item:
        step:       "string"
        uses:       "[ functionality-id, ... ]   # resolved against this model's registry"
        config:     "string | null (config keys this step sets)"
        code:       "string | null (the file/function this step edits or adds)"
        provenance: "file:symbol"

    boundary:
      description: >
        The config->data->code LADDER, one row per variant: the 'from which point
        must I write Python' answer, quantified. `variant` MUST be one of the
        top-level `variants[].id`.
      item:
        variant: "string (a variants[].id)"
        rung:    "enum: L0 | L1 | L2 | L3 | L4 | L5"
        note:    "string (why it sits there / what it takes)"
      rung_legend:
        L0: "config key exists — flip it"
        L1: "config key exists — needs a specific non-default value/combination"
        L2: "no key, but a script parameterises it — small localised edit"
        L3: "needs a new/edited DATA input or resource"
        L4: "needs a new/edited snakemake rule + wildcard plumbing"
        L5: "bespoke Python — new component logic, a custom constraint, or a run harness"

    where:
      description: "For each change above L1, the STABLE ANCHOR to touch. Required if any rung >= L2."
      item:
        change:     "string"
        anchor:     "string (rule / script / function / config path — NEVER a line number)"
        provenance: "file:symbol"

    data_dependencies:
      description: "Inputs the method needs to FUNCTION, and whether they exist. Required if any rung == L3."
      item:
        input:        "string"
        required_for: "string (which variant needs it)"
        availability: "string (exists by default | must be built | region-dependent | absent)"

    cost_profile:
      description: >
        METHOD-SPECIFIC and load-bearing for the interview: methods are the layer
        where compute cost becomes a first-class answer. MGA at 40 solves on a
        sector-coupled 100-node network is a different conversation from MGA on a
        37-node electricity-only one, and the corpus makes that tradeoff explicitly.
      shape: "{ solves: 'string (formula in the study's parameters)',
                relative: 'string (vs a single solve)', note: 'string (the mitigations)' }"

    verifies:
      description: >
        Replaces RECIPE's `asserts`, which is a postcondition over ONE network `n`.
        A method's postcondition is usually over an ENSEMBLE of runs — MGA's is
        "N solutions, all within (1+epsilon)*c*", which no single `n` can express.
        Keep them about presence, count and bound, never result quality.
        (ZYGON EXTENSION — backfilled per-method as evals demand, not wholesale.
        referee/check_ensemble.py does not exist yet; the field is authored so it
        exists when the referee catches up.)
      item:
        variant: "string (must match a boundary variant)"
        check:   "string (python expression; truthy = pass)"
        over:    "enum: ensemble | run"
        note:    "string (what a failure means, in plain language)"

# ── FORBIDDEN FIELDS ────────────────────────────────────────────────────────
# `asserts`, `invalidates`, `out_of_box` are REJECTED by check_methods.py rather
# than ignored. Reasons: `asserts` and `invalidates` are executed by
# referee/check_network.py and check_dag.py, which glob the recipe books — a method
# card carrying them would be silently mis-executed. `out_of_box` is replaced by
# `available`. A copy-pasted recipe must fail loudly, not half-work.
#
# ── the golden rule, restated ───────────────────────────────────────────────
# NO claim may reference a config key, rule, script, symbol or paper that the author
# did not open and confirm. Model claims carry file:symbol provenance; literature
# claims carry a paper filename. Ungrounded lines are invalid.
