# METHOD EXEC SCHEMA (v2) — normative for cookbooks/methods/*.yaml carrying
# `schema_version: 2`. Replaces the v1 essay format file-by-file as methods
# are hand-converted; v1 files keep validating against METHOD.schema.yaml
# until converted, and are invisible to interviews and the method evals.
#
# Design rule: a method file is an EXECUTABLE SPEC, not literature. Prose has
# hard caps (enforced by check_method_exec.py); overflow context lives in
# _qa/paper_methods/. The test of a good spec is mechanical: an agent that
# reads ONLY this file (plus cited recipes) must be able to produce a bundle
# implementing the method, and the success_metric must decide — from the
# run's artifacts alone — whether the method actually applied.
#
# Field reference (— required unless marked optional):

schema_version: 2          # literal 2
id: <slug>                 # = filename without .yaml, kebab-case
title: <short title>
what: >                    # <= 600 chars, ONE paragraph: what the method
  ...                      # does and when it is the right tool
when_to_use:               # optional, <= 4 short trigger phrases
  - "..."

models:                    # >= 1 entry; only models where the method is
  - model: pypsa-eur       # actually executable in THIS harness
    version_anchor:        # submodule SHA the anchors were verified at
      ref: <full sha>
      date: "YYYY-MM-DD"
    status: draft          # draft | verified — `verified` is WRITTEN BY THE
                           # METHOD EVAL on a passing run, never by hand
    baseline: null         # optional: fixtures config.<x>.yaml best suited
                           # for testing (e.g. config.de1.yaml for temporal
                           # methods); null = the model default
    execution:             # 1..8 ordered steps; each kind-typed:
      - kind: config       #   config | code | rule | data | invocation
        key: <dot.path>    #   (config) must resolve in the default config
        value: <yaml>
        note: "..."        #   optional, <= 200 chars
      - kind: code
        where: "scripts/x.py:symbol"   # file:symbol anchor, grep-verified
        do: "..."          #   <= 300 chars, imperative and concrete
      # rule: where (rules/*.smk:rule_name) + do
      # data: target (model-relative path) + do
      # invocation: note only (extra targets/wildcards)
    invalidates:           # expected invalidation set — rule names the
      - <rule_name>        # oracle's dry-run diff should contain (subset ok)
    budget:                # honest cost class so the gate can refuse early
      jobs: <int>          # ~expected job count
      class: minutes       # minutes | hour | hours
    success_metric:        # >= 1 — THE POINT. Mechanical, artifact-only.
      - name: <slug>
        needs: solved      # prepared | solved  (pair: reserved, see below)
        check: "<python expr over n/np/pd; truthy = method applied>"
                           # multi-horizon runs additionally get `ns`:
                           # {horizon:int -> Network} over every artifact of
                           # the stage (n = final horizon's network), and
                           # check_method writes capacity_expansion.csv
                           # (horizon x component x carrier, total +
                           # new_build) into the run dir automatically.
                           # multi-VARIANT runs (multi-scenario) get `nv`:
                           # {variant:str -> Network} from the
                           # {stage}-{variant}--{basename} artifact naming,
                           # and `collected`: {quantity:str -> DataFrame}
                           # from collected-*.csv artifacts
        expect: "..."      # <= 200 chars: what a pass means, humanly

notes: >                   # optional, <= 800 chars total; anything longer
  ...                      # belongs in _qa/paper_methods/

# `pair` metrics (method-on vs method-off run comparison) are deliberately
# NOT in v2.0: they need two runs plumbed through the eval driver. Reserve
# the enum value; referee/check_method.py will reject it with a clear
# message until supported. Write metrics decidable on ONE affordable run.
