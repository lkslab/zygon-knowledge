paper: "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
tier: 2
model_used: >
  PyPSA library only (called "pyPSA" in the paper, version pre-1.0, Pyomo-based),
  embedded as an economic dispatch sub-tool within a bespoke Excel-driven generation
  expansion planning (GEP) framework for two isolated mini-grids in Saudi Arabia.
  No spatial network; single-bus dispatch with hourly time series for one year.
scope: >
  Generation expansion planning for two isolated mini-grids in Saudi Arabia (Sharourah
  and Al Ula), sweeping PV/Wind/CSP/GT capacity additions from 5–150% of peak demand
  to find the most economic penetration level, while assessing economy-of-scale effects,
  RES curtailment economics, and whether ELCC remains a relevant planning metric as RES
  costs fall.
methods:
  - slug: operational-dispatch-and-rolling-horizon
    role: routine-use
    evidence: >
      "This work added an additional dispatch method where the ED does consider the
      hourly net load (or residual load)… by calling the Python based ED tool 'Python
      for Power System Analysis' (pyPSA)." (Sec. IV.B Methodology). PyPSA is used for
      economic dispatch at fixed installed capacities for each technology scenario.
    procedure_notes: >
      PyPSA called as an external economic dispatch tool from within an Excel-based GEP
      workflow (Fig. 5 control-flow diagram). Full-year hourly dispatch at fixed capacity;
      no rolling window — the whole year is solved. Variable O&M and fuel costs are inputs;
      annuity for new generation is added outside PyPSA to compute total annual cost.
      Solver: GLPK (open-source). The paper explicitly notes pyPSA "does not consider
      spinning reserve or forecasting errors within the dispatch" and ramp rates were not
      applied for this case study (Sec. IV.C).
    variant: full-year-fixed-capacity
    parameters: {time_resolution: "hourly", horizon: "single year", solver: "GLPK"}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "pyPSA… is able to consider static, linear, and security-constrained linear optimal
      power flow" and is used here for the dispatch. (Sec. IV.B Methodology, Ref. [23]).
      The paper explicitly excludes active/reactive power and VVC (Sec. III), so only the
      linear (DC) power balance is exercised.
    procedure_notes: >
      Single-bus linear dispatch (no transmission network); Pyomo-based formulation
      via pyPSA with GLPK solver. Active and reactive power, voltage limits and VVC
      explicitly excluded as out of scope for ELCC assessment (Sec. III).
    variant: single-bus-linear-dispatch
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      The GEP framework optimises candidate technology additions for a single planning
      horizon; all capacity decisions are made once, then dispatched over one year of
      hourly data. "This work is based on a single year of data only." (Sec. V Conclusions).
    procedure_notes: >
      Overnight / greenfield investment planning: capacity candidates are enumerated
      (Table 2, 5%–150% of peak demand in 5% steps for each technology), each scenario
      is dispatched independently, and annual cost is compared across scenarios. No
      sequential investment periods; no myopic iteration.
    variant: overnight-scenario-enumeration
    parameters: {candidate_step: "5% of peak demand", max_addition: "150% of peak demand", life_time: "20 years"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The annuity… method used in this work considers a project life time of 20 years…
      discount rates (DR) of 15–30%… DR coincides with the weighted average cost of
      capital (WACC)." LCoE formula (Eq. 1) includes discount rate d explicitly. Multiple
      DR values (0%, 6%, 15%) are compared in Figs. 3–4 and SI Figs. 15–17. (Sec. IV.A
      and SI Appendix).
    procedure_notes: >
      Annuity method converts capex to annual equivalent at project life = 20 years.
      Nominal DR of 6% used as base case; 0% and 15% explored as sensitivity. Inflation
      2%, zero salvage value. WACC interpretation: DR set equal to expected return
      (private/commercial 15–30%, utility 6%). LCoE computed per Eq. 1; compared with
      LCoF (fuel + variable O&M only) to judge break-even fuel price.
    variant: annuity-wacc
    parameters: {base_dr: "6%", sensitivity_dr: ["0%", "15%"], inflation: "2%", project_life: "20 years", salvage: "0"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "Capex assumptions of ±25% are considered as a sensitivity in Figure 18." SI also
      sweeps fuel prices from $10 to $100/bbl (Fig. 16–17) and DR from 0% to 15%
      (Figs. 3–4, 15). (SI Appendix, Sec. IV.A).
    procedure_notes: >
      One-at-a-time sensitivity: (1) capex ±25% for both locations; (2) fuel price grid
      $10–$100/bbl at DR 0% and 6%; (3) DR scenarios 0%, 6%, 15%. Results shown as
      LCoE/LCoF crossover charts. No Monte Carlo or global sensitivity — deterministic
      parameter sweeps only.
    variant: one-at-a-time-deterministic
    parameters: {capex_range: "±25%", fuel_price_range: "$10–$100/bbl", dr_range: "0%–15%"}

unmatched_methods:
  - name: economy-of-scale cost functions
    evidence: >
      "EoS is considered for all covered technologies (PV, Wind, CSP, and GT)" — capital
      cost and O&M are modelled as power-law functions of installed size (Table 1:
      cost = a * size^b). This is a nonlinear cost-curve parameterisation used directly
      in the GEP objective, distinct from any existing slug. No slug covers endogenous
      size-dependent cost curves in a dispatch/expansion model (as opposed to learning
      curves over cumulative deployment). (Sec. III.B, IV.A, Table 1).
