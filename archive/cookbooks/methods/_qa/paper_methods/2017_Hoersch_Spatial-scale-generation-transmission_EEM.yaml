paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model (PyPSA v0.8.0), pan-European electricity-only network,
  k = 37–362 buses, 8760/3 ≈ 2920 time steps (every 3rd hour of 2012).
scope: >
  Quantifies how spatial resolution (number of k-means clusters) affects
  joint generation and transmission capacity optimisation for a 95% CO2-reduced
  European electricity system, and studies the cost-benefit trade-off of
  transmission volume caps from no expansion to 3× today.
methods:
  - slug: spatial-clustering-and-resolution
    role: defines
    evidence: >
      Sec. II "Methodology for Network Reduction" defines a load-and-generation-
      weighted k-means clustering of the European ENTSO-E network, reducing 4653
      substations to k = 37, 45, 64, 90, 128, 181, 256, 362 buses. The paper
      is explicitly a systematic study of how this aggregation affects
      optimisation results ("a clustering methodology called 'k-means' is used
      to successively reduce the number of nodes… The effects on the results of
      the optimal investments in generation and transmission are then studied as
      the spatial resolution is changed").
    procedure_notes: >
      Six-step procedure: (1) iterative aggregation of univalent (stub) buses;
      (2) weight each bus by local load and conventional generation; (3) run
      k-means (scikit-learn) on geographic coordinates with 10 random starts,
      keep best; constrain so each country/synchronous zone gets clusters
      proportional to mean load; (4–6) create equivalent buses, aggregate
      generators by technology (availability series averaged with weighting,
      potentials summed), replace inter-cluster lines with a single equivalent
      (length = 1.25 × crow-flies, capacity = sum, impedance = parallel
      equivalent). Topology and electrical distance deliberately ignored;
      geographic distance used because it determines grid expansion cost.
    variant: load-weighted-geographic-kmeans
    parameters:
      k_values: "37, 45, 64, 90, 128, 181, 256, 362"
      kmeans_starts: 10
      line_length_factor: 1.25

  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      Sec. III defines the investment model co-optimising generation and
      transmission capacity under a line-volume cap (Eq. 10): "the sum of all
      transmission line capacities (HVAC and HVDC) multiplied by their lengths
      l_ℓ is restricted by a line volume cap CAPtrans". Six cap scenarios are
      studied (x = 1.0, 1.125, 1.25, 1.5, 2.0, 3.0 times today's volume).
      Iterative impedance update (up to 4 iterations) follows [23] to keep the
      linearised formulation consistent as capacities expand (Sec. III).
    procedure_notes: >
      Line costs are set to zero in the optimisation (they are dual to the volume
      cap) and added in post-processing. No new grid topologies; only existing
      corridors expanded. Impedances x_ℓ held fixed per iteration, updated, then
      re-optimised — up to 4 iterations for convergence. Shadow price of the
      volume cap µtrans reported in Fig. 7 and interpreted as the maximum
      line cost per MWkm that still makes expansion worthwhile.
    variant: volume-cap-with-iterative-impedance-update
    parameters:
      cap_multipliers: "1.0, 1.125, 1.25, 1.5, 2.0, 3.0"
      max_iterations: 4

  - slug: linearised-optimal-power-flow
    role: canonical-use
    evidence: >
      Sec. III and Eq. 7–8: the model enforces both Kirchhoff's Current Law
      (nodal power balance, Eq. 7) and Kirchhoff's Voltage Law via cycle flows
      (Eq. 8, "C_{ℓc} x_ℓ f_{ℓt} = 0 ∀ c,t"), implementing the linearised
      (DC) power flow. "In this paper it is assumed that the linear load flow
      is a good approximation for a well-compensated transmission network."
      HVDC links are exempt from KVL (point-to-point, only KCL applies).
    procedure_notes: >
      Cycle formulation (not angle/PTDF). Series inductive reactance x_ℓ used.
      Flow bounded by line capacity F_ℓ (Eq. 9). Losses not modelled.
    variant: cycle-flow-kvl
    parameters: {}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      Eq. 6 introduces an annual CO2 cap CAPCO2 with dual variable µCO2:
      "CO2 emissions are limited by a cap CAPCO2… In all simulations this cap
      was set at a reduction of 95% of the electricity sector emissions from 1990."
    procedure_notes: >
      Electricity-sector-only cap; gas OCGT is the only fossil technology, with
      assumed efficiency 39%. Shadow price µCO2 not analysed separately; CO2
      constraint is fixed across all spatial-resolution scenarios — only the
      transmission cap is varied.
    variant: annual-sector-cap
    parameters:
      co2_reduction: "95% vs 1990 electricity sector"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      Sec. III: "the model is run over every third hour of a full historical year
      of weather and demand data assuming perfect foresight, with 2012 chosen as
      the representative year." Investment decisions are made in a single overnight
      optimisation for a future target state (95% CO2 reduction). The conclusions
      explicitly flag the greenfield assumption: "an important next step is to
      confirm our greenfield results accounting for this inertia."
    procedure_notes: >
      Overnight/greenfield: all capacity co-optimised in one shot, no retirement
      or existing-fleet inheritance (existing hydro fixed, all other capacities
      freely expandable from zero). Single representative weather year (2012).
      Time-step weighting wt = 3 to account for the 3-hourly sampling.
    variant: overnight-greenfield
    parameters:
      weather_year: 2012
      time_step_hours: 3
      time_step_weight: 3

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      Sec. IV: "protected sites as listed in Natura2000 are excluded, as well as
      areas with certain land use types from the Corine Land Cover database… to
      avoid building, e.g., wind turbines in urban areas. The maximum water depths
      for offshore wind turbines is assumed to be 50 m. The maximum installable
      capacity per bus and generator type is then determined by scaling these
      layouts until the first site reaches a maximum installation density of 2 and
      1.7 MW/km² for wind and solar, respectively."
    procedure_notes: >
      Aarhus renewable energy atlas (40×40 km² NCEP reanalysis, 2012) used for
      capacity factor time series. Generator distribution proportional to
      local capacity factor × max installable capacity. Wind/solar potentials
      aggregated per cluster by summing max-expansion limits and averaging
      availability series with site-quality weighting.
    variant: exclusion-zone-with-density-cap
    parameters:
      wind_density_cap: "2 MW/km²"
      solar_density_cap: "1.7 MW/km²"
      offshore_depth_limit: "50 m"

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      Sec. V-B and Fig. 7: "the shadow price of the transmission cap, µtrans…
      indicates the marginal value of an increase in line volume at each level
      of network expansion; it can also be interpreted as the transmission line
      cost per MWkm necessary for the optimal solution to have the transmission
      line volume CAPtrans." Also Eq. 6 names the CO2 cap dual µCO2.
    procedure_notes: >
      µtrans plotted against CAPtrans for 256 clusters; used to identify the
      economically optimal expansion level for overhead lines (400 €/MWkm) and
      underground cables (4–8× overhead cost). No correction for snapshot
      weighting issues discussed — straight LP dual read-out.
    variant: volume-cap-shadow-price
    parameters:
      overhead_line_cost: "400 EUR/MWkm"

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      Sec. IV, Table I: "For the annualisation of overnight costs a discount rate
      of 7% is used." Capital costs annualised from overnight cost, FOM and
      lifetime (Table I) for all generation, storage and transmission assets.
    procedure_notes: >
      Single uniform discount rate applied to all technologies. Annualised
      fixed cost cn,s used directly in the objective (Eq. 2). No country- or
      technology-specific WACC differentiation.
    variant: uniform-discount-rate
    parameters:
      discount_rate: "7%"

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      Sec. IV: "The model contains two extendable types of storage units:
      batteries and hydrogen storage… the energy capacity En,s = hmax,s * Gn,s
      is proportional to this power capacity. The factor hmax,s… is set to
      hmax = 6 h for batteries and to 168 h for H2 storage."
    procedure_notes: >
      Fixed energy-to-power ratio (not independently optimised). Cyclic state
      of charge enforced (en,s,t=0 = en,s,t=T, Eq. 5). Standing loss η0,
      separate charge/discharge efficiencies η1 and η2, and inflow/spillage
      included for hydro.
    variant: fixed-duration-ratio
    parameters:
      battery_max_hours: 6
      h2_max_hours: 168

  - slug: n-1-security-and-contingency
    role: routine-use
    evidence: >
      Sec. II: "N-1 security is modelled by scaling down the available
      transmission capacity to 0.7 times nominal capacity for high resolution
      networks ≥ 200 clusters and linearly shrinking it down until reaching half
      the nominal values at 37 clusters to account for cluster-internal
      bottlenecks."
    procedure_notes: >
      Security margin applied as a derating of line capacity, not as explicit
      contingency constraints. Derating is resolution-dependent: interpolates
      between 0.5 (37 clusters) and 0.7 (≥200 clusters) to account for
      intra-cluster network effects.
    variant: resolution-dependent-derating
    parameters:
      s_max_pu_high_res: 0.7
      s_max_pu_low_res: 0.5
      derating_threshold_clusters: 200

unmatched_methods: []
