paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model (PyPSA library, version 0.9.0), 30-node electricity-only
  model of Europe (one node per country), hourly resolution, full year 2011.
scope: >
  Techno-economic LP co-optimisation of generation and transmission capacities
  for a highly renewable European electricity system under a 95% CO2 reduction
  target, sweeping the allowed transmission volume from zero to unconstrained to
  quantify the non-linear cost benefits of international grid cooperation.
methods:
  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      "We run techno-economic cost optimizations for the capacity investment and
      dispatch of wind, solar, hydroelectricity, natural gas power generation and
      transmission, as well as storage options." (Abstract). The objective (Eq. 1)
      minimises fixed annualised generation, storage and transmission costs plus
      variable dispatch costs jointly. Transmission capacity Fℓ is a decision
      variable, bounded above by the line-volume cap CAPLV (Eq. 9, Sec. 2.5).
    procedure_notes: >
      Transport model with controllable dispatch (not DC power flow); absolute
      flows bounded by thermal limits (Eq. 8). Transmission investment =
      400 EUR/kW/km × 1.25 × line length + converter pair costs, with n-1 safety
      factor fn-1 = 1.5 applied a posteriori by scaling NTCs. Line volume
      CAPLV swept from 0 to ~500 TWkm across many scenarios. Lengths set to
      great-circle distance between country centroids plus 25% detour factor.
      Solver: Gurobi logarithmic barrier algorithm, 1-2 hours per scenario.
    variant: volume-capped-sweep
    parameters:
      line_volume_cap_range: "0 to ~500 TWkm"
      line_cost: "400 EUR/kW/km (overhead), converter pair 150000 EUR/MW"
      n1_safety_factor: "fn-1 = 1.5 (a posteriori scaling)"
      nodes: 30
      duality_gap: "< 2e-6"

  - slug: carbon-constraints-and-pricing
    role: canonical-use
    evidence: >
      "CO2 emissions are also limited by a cap CAPCO2, implemented using the
      specific emissions es in CO2-tonne-per-MWh of the fuel of generator type s
      and the efficiency ηs of the generator" (Eq. 10, Sec. 2.6). The KKT
      multiplier µCO2 is the shadow CO2 price.
    procedure_notes: >
      Annual European-wide CO2 cap fixed at 95% reduction vs 1990 in all scenarios.
      Only OCGT is the dispatchable backup (emission intensity 0.19 t/MWhth).
      Gas generation is limited to ~5.1% of demand across all transmission scenarios.
    variant: annual-cap
    parameters:
      co2_reduction: "95% vs 1990"

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "The Karush-Kuhn-Tucker (KKT) multiplier λn,t associated with the constraint
      indicates the marginal price of supplying additional demand at node n in hour t,
      also known as the Locational Marginal Price (LMP)." (Sec. 2.2). Shadow price
      µLV of the line volume constraint is analysed in Sec. 4.5 and Fig. 8 as the
      marginal value of additional transmission volume.
    procedure_notes: >
      LMPs λn,t derived from KKT duality of the nodal energy balance constraint
      (Eq. 2). CO2 shadow price µCO2 from Eq. 10. Line-volume shadow price µLV
      from Eq. 9 plotted as function of allowed CAPLV and compared to overnight
      capital costs of overhead lines (400 EUR/MWkm) and underground cables
      (~2000 EUR/MWkm). Average LMPs reported per node and per scenario
      (Table 2, Fig. 7).
    variant: nodal-lmp-plus-line-shadow
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      The model is a single-year greenfield overnight optimisation: "The model is
      run for a full year with hourly resolution" (Sec. 3.2); generation and
      transmission capacities are co-optimised in one LP solve without multi-year
      investment periods.
    procedure_notes: >
      Greenfield overnight: no existing fleet except fixed hydro and PHS capacities,
      which are treated as amortized. No transition pathway; target year cost
      assumptions taken from DIW 2030 estimates (ref [42]).
    variant: overnight-greenfield
    parameters:
      discount_rate: "7%"
      target_year_cost_vintage: "2030 estimates"

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The given overnight capital costs were converted to net present costs with a
      discount rate of 7% over the economic lifetime." (Sec. 3.8, Table 1).
    procedure_notes: >
      Single uniform discount rate of 7% applied to all technologies. Technology
      lifetimes vary: wind/solar 25 years, OCGT 30 years, storage 20 years,
      transmission 40 years, hydro 80 years.
    variant: uniform-social-rate
    parameters:
      discount_rate: "7%"

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "The storage energy capacities are assumed to be proportional to the power
      capacities such that a storage unit can be fully charged or discharged at
      maximum power in a fixed amount of time hs,max." (Sec. 3.7, Eq. 7).
      Three storage types modelled: PHS (hmax=6h), batteries (hmax=6h),
      H2 storage (hmax=168h).
    procedure_notes: >
      Fixed energy-to-power ratio per technology (not co-optimised independently);
      simplification acknowledged as being due to computational limits and data
      availability. Cyclic state-of-charge assumed (Eq. 6, socn,s,t=0 = socn,s,t=T).
      Standing losses not modelled. PHS capacity fixed at existing levels (no expansion).
    variant: fixed-duration-ratio
    parameters:
      hmax_phs: "6 h"
      hmax_battery: "6 h"
      hmax_h2: "168 h (1 week)"
      phs_roundtrip: "0.75"
      battery_roundtrip: "0.81"
      h2_roundtrip: "0.435"

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "The available area was restricted by the following constraints: Onshore wind
      and PV can only be built in areas with certain land use types defined by the
      CORINE database, following the selection reported by [3]. Offshore wind sites
      were restricted to a maximum water depth of 50 m. Additionally, all nature
      reserves and restricted areas defined in the Natura database are excluded."
      (Sec. 3.3).
    procedure_notes: >
      Capacity layout proportional to usable area × potential full load hours per
      ~40×40 km raster cell. Maximum installation density: 10 MW/km2 for wind,
      effective 2 MW/km2 after 20% competing-use factor; 1% area × 145 MW/km2 for
      PV. Geographic potential Gmax_n,s derived from these layouts (Eq. 5). Ten
      largest countries split into up to four equal-area wind sub-regions with
      similar full load hours to increase effective spatial resolution within country nodes.
    variant: corine-natura-exclusion
    parameters:
      wind_max_density: "10 MW/km2 (effective 2 MW/km2)"
      pv_area_fraction: "1%"
      pv_nominal_density: "145 MW/km2"
      offshore_depth_limit: "50 m"

  - slug: sensitivity-and-uncertainty-sweeps
    role: canonical-use
    evidence: >
      "The main innovation of this work is to interpolate smoothly between a
      continent-scale network-dominated system and a locally-balanced
      storage-dominated system by continuously varying the allowed volume of
      transmission inter-connectors, from zero up to unlimited interconnection."
      (Sec. 1). The paper runs many LP solves across a grid of CAPLV values.
    procedure_notes: >
      Systematic one-dimensional sweep of the transmission volume cap CAPLV from
      0 to ~500 TWkm. Each point is an independent full LP solve. No other
      parameters are swept in this paper; the authors mention forthcoming sweeps
      of CO2 cap, import restrictions, and onshore wind limits as future work (Sec. 5).
    variant: one-at-a-time-transmission-sweep
    parameters:
      swept_parameter: "CAPLV (line volume cap)"
      range: "0 to ~500 TWkm"

  - slug: n-1-security-and-contingency
    role: routine-use
    evidence: >
      "To satisfy n-1 security requirements, a safety margin of 33% of the
      installed capacity can be used [9, 29]. This can be emulated a posteriori by
      increasing the optimized NTCs by a factor of fn-1 = (1 − margin)^{-1} = 1.5."
      (Sec. 2.5).
    procedure_notes: >
      N-1 not enforced as contingency constraints in the optimisation; applied as
      a simple derating/scaling factor of 1.5 on optimised NTCs post-hoc. The same
      factor is embedded in the transmission investment cost formula. No explicit
      contingency enumeration.
    variant: derating-margin-aposteriori
    parameters:
      n1_factor: "fn-1 = 1.5 (33% safety margin)"

unmatched_methods: []
