paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
tier: 1
model_used: >
  PyPSA library only (tooling/framework paper introducing PyPSA v0.11.0).
  Demo runs on SciGRID Germany (585 buses) and GridKit Europe (clustered to 256 buses).
scope: >
  Introduces PyPSA as a free, open-source Python toolbox for multi-period power system
  simulation and optimisation — covering power flow, linearised OPF, unit commitment,
  security-constrained LOPF, sector coupling, storage, and network clustering — and
  positions it against other power system and energy system tools.
methods:
  - slug: linearised-optimal-power-flow
    role: defines
    evidence: >
      Sec. II-C: "PyPSA is a partial equilibrium model that can optimise both short-term
      operation and long-term investment in the energy system as a linear problem using
      the linear power flow equations." Eq. 4 defines the angle-based DC linearisation;
      Eq. 15 presents the cycle-flow KVL formulation. Both voltage-angle and PTDF
      formulations are also implemented and "deliver identical results."
    procedure_notes: >
      Three LOPF formulations implemented: voltage-angle (standard), PTDF, and cycle-flow
      (Eq. 15). The cycle-flow formulation is noted (citing [30]) to solve up to 20x
      faster than angle formulations. Objective (Eq. 5) minimises annuitised capex plus
      opex over multiple weighted snapshots. Branch capacities, generator capacities,
      storage power and energy capacities are co-optimised. Snapshot weightings wt
      allow annual annuitisation. Branch impedances x_ell held fixed per optimisation
      run; iterative update used for transmission expansion (up to 5 iterations).
    variant: cycle-flow-primary
    parameters: {solver: "COIN-OR Clp (example)", demo_snapshots: 4, demo_buses: 585, demo_time_seconds: 5}

  - slug: unit-commitment-and-ramping
    role: defines
    evidence: >
      Sec. II-E: "Unit commitment can be turned on for any generator. This introduces a
      time series of new binary status variables u_{n,r,t} in {0,1}." Eqs. 16-20 define
      binary on/off, minimum up/down times, and start-up/shut-down costs. Ramp-rate
      constraints (Eq. 7) can also be supplemented by ramping limits at start-up and
      shut-down.
    procedure_notes: >
      Binary variable u_{n,r,t} gates generator output (Eq. 16). Minimum up time
      T^{min_up}_{n,r} and minimum down time T^{min_down}_{n,r} enforced via rolling
      summation constraints (Eqs. 17-18). Start-up cost suc_{n,r,t} and shut-down cost
      sdc_{n,r,t} are continuous auxiliary variables with inequality linking them to
      binary transitions (Eqs. 19-20), added to objective. Ramp limits r^u_{n,r},
      r^d_{n,r} per unit of nominal power (Eq. 7). MILP; the paper does not specify a
      particular MILP solver in the demo.
    variant: milp-uc-with-startup-costs
    parameters: {}

  - slug: n-1-security-and-contingency
    role: defines
    evidence: >
      Sec. II-F: "PyPSA has functionality to examine the steady state of the power system
      after outages of passive branches, based on an analysis of the linear power flow.
      PyPSA calculates the Branch Outage Distribution Factor (BODF) from the Power
      Transfer Distribution Factors (PTDF)." Eq. 22 defines SCLOPF constraints:
      |f^{(k)}_{ell,t}| = |f_{ell,t} + BODF_{ell,k} * f_{k,t}| <= |F_ell| for all
      ell, t per outage k.
    procedure_notes: >
      BODF computed from PTDFs (reference [46]). For each contingency branch k, post-outage
      flows on all other branches are constrained not to exceed capacity F_ell (Eq. 22).
      The set of monitored contingencies is user-specified. Listed in feature comparison
      table (Table III) as a capability distinguishing PyPSA from most other tools.
    variant: sclopf-bodf
    parameters: {}

  - slug: sector-coupled-network-assembly
    role: defines
    evidence: >
      Sec. II-D: "PyPSA can also optimise operation and investment in other energy sectors,
      such as natural gas, heating and transport. These sectors can be modelled using a
      network of links with efficiencies for energy conversion losses." Fig. 2 shows an
      example coupling electricity to transport, hydrogen, gas and heating via carrier buses
      and conversion links.
    procedure_notes: >
      Multi-carrier network assembled with one Bus per energy carrier. Links represent
      energy conversion with (possibly time-varying) efficiencies eta_{ell,t}. KCL
      (Eq. 12) is enforced at each bus; KVL applies only to passive-branch networks.
      Depletable resources (e.g. gas) modelled as Stores. Heat pumps can have
      time-varying COP. CHPs require additional back-pressure and fuel-consumption
      constraints (referenced to PyPSA examples, not detailed in paper).
    variant: bus-per-carrier-with-links
    parameters: {}

  - slug: storage-sizing-and-duration
    role: defines
    evidence: >
      Sec. II-C: Storage unit power capacity H_{n,s} and energy capacity E_{n,s} are
      both optimisation variables with separate capital costs c_{n,s} and chat_{n,s}
      (Eq. 5). Energy state-of-charge dynamics given by Eq. 10 with charging/discharging
      efficiencies, standing loss, inflow and spillage. Cyclic SOC condition:
      e_{n,s,t=0} = e_{n,s,t=T}.
    procedure_notes: >
      Power capacity and energy capacity sized independently (no fixed duration ratio).
      Standing loss eta_{n,s,0}, charging efficiency eta_{n,s,+}, discharging efficiency
      eta_{n,s,-} all represented. Installable potentials (min/max bounds) on both
      H_{n,s} and E_{n,s}. Demo (Fig. 5, Europe 256-node) shows battery storage
      (short-term) and hydrogen storage (long-term/seasonal) co-optimised. The Store
      component is a simpler variant with no power limits or charge/discharge efficiencies.
    variant: independent-power-energy-sizing
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: defines
    evidence: >
      Sec. II-C: "Since branch capacities F_ell can be continuously expanded to represent
      the addition of new circuits to an aggregated transmission corridor ell, the
      impedances x_ell of the branches would also decrease. To keep the optimisation
      problem linear ... x_ell can be left fixed in each optimisation problem, updated
      and then the optimisation problem rerun, in up to 5 iterations to ensure
      convergence, following the methodology of [43]."
    procedure_notes: >
      Continuous transmission expansion co-optimised with generation and storage in the
      LOPF. Bilinear coupling between impedance x_ell and flow f_{ell,t} handled by
      iterative impedance update (up to 5 iterations). Branch capital costs c_ell
      appear in objective (Eq. 5). Integer expansion via big-M MILP mentioned as an
      external extension [34], not yet in main codebase at time of writing.
    variant: iterative-impedance-update
    parameters: {max_iterations: 5}

  - slug: shadow-prices-and-marginal-values
    role: defines
    evidence: >
      Eq. 12 and surrounding text: "lambda_{n,t} is the marginal price at the bus."
      Fig. 4 shows locational marginal prices (LMPs) for Germany. Eq. 11: "mu_{CO2}
      is the shadow price of [the CO2 cap] constraint." KKT multipliers mu-bar_{ell,t}
      and mu-underbar_{ell,t} defined for branch flow limits (Eq. 13-14, Sec. II-C).
    procedure_notes: >
      Dual variables of the nodal power-balance constraint (Eq. 12) read as locational
      marginal prices. Shadow price of global CO2 cap read as carbon price (Eq. 11).
      Branch KKT multipliers defined. Demo in Sec. VII shows LMPs for Germany with
      high wind and low load, illustrating spatial price separation from transmission
      bottlenecks.
    variant: lopf-duals-as-lmp
    parameters: {}

  - slug: carbon-constraints-and-pricing
    role: defines
    evidence: >
      Eq. 11: "CO2 emissions can be limited by a cap CAP_{CO2}, implemented using the
      specific emissions e_r in CO2-tonne-per-MWhth of the fuel r and the efficiency
      eta_{n,r} of the generator: sum_{n,r,t} w_t * g_{n,r,t} * e_r / eta_{n,r} <=
      CAP_{CO2}." Mentioned in Sec. II-C as a global constraint on primary energy.
      Demo (Fig. 5) applies a 95% CO2 reduction vs 1990 levels for European system.
    procedure_notes: >
      Annual CO2 cap implemented as a single global linear constraint over all
      generators, time periods and snapshots. Shadow price mu_{CO2} is read as the
      carbon price dual. In Fig. 5 demo: 95% CO2 reduction relative to 1990 levels,
      no grid expansion allowed. Fuel-specific emission factors e_r and generator
      efficiencies eta_{n,r} enter the constraint.
    variant: annual-cap
    parameters: {demo_co2_reduction: "95% vs 1990"}

  - slug: spatial-clustering-and-resolution
    role: canonical-use
    evidence: >
      Sec. II-G: "PyPSA also implements a variety of network clustering algorithms to
      reduce the number of buses in a network while preserving important transmission
      lines. For example, the k-means clustering algorithm was recently used in [32] to
      examine the effect of clustering on investment optimisation results."
      Demo (Sec. VII, Fig. 5): GridKit European network clustered from 5000 buses to
      256 buses.
    procedure_notes: >
      k-means is one of several clustering algorithms implemented. The paper implements
      clustering as a feature of PyPSA but does not provide methodological detail here;
      detail is in the cited reference [32] (Hörsch & Brown 2017). Demo uses 256-bus
      clustering of Europe for investment optimisation.
    variant: k-means
    parameters: {demo_input_buses: 5000, demo_output_buses: 256}

  - slug: custom-constraints-with-linopy
    role: defines
    evidence: >
      Sec. III: "Optimisation problems are formulated using the Python-based optimization
      modeling language Pyomo [53],[54], which is solver agnostic and intuitive to
      extend. The use of Pyomo also allows inter-operability with other energy system
      frameworks that use Pyomo." The paper defines extensibility as a core design goal
      (Sec. I, Sec. III); CHP back-pressure constraints referenced as an example of
      additional constraints added via the modelling interface.
    procedure_notes: >
      At the time of this paper (v0.11.0), the custom-constraint interface used Pyomo,
      not linopy (linopy was introduced later). The paper notes that "lower-level
      functions in Pyomo have been exploited to improve computational performance."
      Extensibility via Pyomo is a first-class design feature. Note: slug
      custom-constraints-with-linopy is used here as the closest vocabulary match even
      though the actual framework here is Pyomo; the procedure_notes record this
      distinction.
    variant: pyomo-based
    parameters: {}

  - slug: demand-side-flexibility-representation
    role: defines
    evidence: >
      Sec. II-C: "The Store component ... allows the demand-side management model of
      [42] to be implemented in PyPSA. The energy capacity E_{n,s} can also be
      optimised within installable potentials." Eq. 14: "time-dependent per unit
      availabilities f-tilde_{ell,t}, f-bar_{ell,t} ... allows, for example,
      time-dependent demand-side management schemes to be modelled [42]."
    procedure_notes: >
      DSM modelled via Store components with time-series bounds on energy levels
      (ẽ_{n,s,t}, ē_{n,s,t} per unit of E_{n,s}), following [42] (Kleinhans 2014).
      Links also support time-dependent flow bounds (Eq. 14) for DSM. The paper
      does not demonstrate a DSM application directly; it describes the formulation
      capability and cites a reference implementation.
    variant: store-with-time-series-bounds
    parameters: {}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      Sec. II-C, Eq. 5: "the investment costs must then be annuitised for the total
      period sum_t w_t (typically a full year)." Branch, generator and storage capital
      costs (c_ell, c_{n,r}, c_{n,s}, chat_{n,s}) appear in the objective as annuitised
      fixed costs per unit capacity.
    procedure_notes: >
      The paper states that capital costs in the objective function are annuitised but
      does not specify the discount rate or annuity formula; it delegates that to the
      user's input data. No social vs private discount rate discussion.
    variant: null
    parameters: {}

