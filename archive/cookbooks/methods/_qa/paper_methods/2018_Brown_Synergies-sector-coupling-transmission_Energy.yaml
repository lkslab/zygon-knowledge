paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec-30: a bespoke PyPSA sector-coupled model of Europe, 30 nodes
  (one per country), hourly resolution over a full year (2011), electricity +
  transport + heat sectors, HVDC inter-connectors.
scope: >
  Compares sector-coupling flexibility (BEV DSM/V2G, power-to-gas, thermal
  storage, district heating) against transmission reinforcement for integrating
  high shares of renewables in a 95%-CO2-reduction European energy system,
  using co-optimised investment and dispatch across all three sectors.

methods:
  - slug: sector-coupled-network-assembly
    role: defines
    evidence: >
      "The model uses linear optimisation to minimise annual operational and
      investment costs … Each of the 30 European countries … consists of
      individual 'buses' for electricity, heat, transport, hydrogen and methane.
      The electric buses are connected together with transmission represented by
      HVDC lines; the buses of the different sectors are connected within a node
      with energy converters." (Sec. 2, Fig. 1). This paper introduces
      PyPSA-Eur-Sec-30, described as "the first open, spatially-resolved,
      temporally-resolved and sector-coupled energy model of Europe."
    procedure_notes: >
      Five carrier buses per node (electricity, heat, transport, hydrogen,
      methane). Converters include heat pumps (temperature-dependent COP),
      resistive heaters, gas boilers, CHP (extraction-condensing model), solar
      thermal, electrolysis, methanation+DAC, fuel cells, HVDC links. Storage
      includes batteries, hydrogen tanks, hot-water TES (τ=3 d short-term,
      τ=180 d long-term), methane store. Investment optimised jointly with
      dispatch over all 8760 hours. Implemented in PyPSA; solved with Gurobi,
      2 threads, 3–5 h per run.
    variant: country-nodes-hvdc
    parameters: {nodes: 30, carriers: 5, year: 2011, solver: "Gurobi"}

  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      "The sum of transmission line capacities multiplied by their lengths l_ℓ
      can be restricted by a line volume cap CAP_LV, which is then varied in
      different simulations" (Eq. 7, Sec. 2). Scenarios with no transmission
      (CAP_LV=0) through cost-optimal expansion (CAP_LV=∞) are compared, and
      the non-linear cost-benefit curve is plotted as a function of allowed
      transmission volume (Fig. 11).
    procedure_notes: >
      Line capacity weighted by length (km) because length increases both cost
      and public-acceptance concerns. HVDC overhead line costs from [11].
      "Compromise grid" at 4× today's NTC already captures 66–78% of cost
      benefit. Optimal volumes range from 201 TWkm (electricity-only) to
      557 TWkm (heating-only), shrinking as sector-coupling flexibility is added.
    variant: line-volume-cap-sweep
    parameters: {cap_metric: "TWkm", today_NTC: "~31 TWkm"}

  - slug: carbon-constraints-and-pricing
    role: canonical-use
    evidence: >
      "CO2 emissions are also limited by a cap CAP_CO2 … The KKT multiplier
      µ_CO2 indicates the carbon dioxide price necessary to obtain this reduction
      in an open market." (Eq. 8, Sec. 2). The CO2 shadow price is reported for
      every scenario in Table 3 and used to infer retrofitting economics.
    procedure_notes: >
      Annual cap of 151 MtCO2/a (95% below 1990 levels for electricity,
      transport and heating sectors). Specific emissions ε_s in tCO2/MWhth
      applied to gas consumption; non-cyclic methane store depletion also
      counted. µ_CO2 ranges from 77 €/tCO2 (All-Flex-Central + transmission)
      to 1184 €/tCO2 (Heating, no transmission).
    variant: annual-sectoral-cap
    parameters: {reduction_vs_1990: "95%", cap: "151 MtCO2/a", reference_year: 1990}

  - slug: demand-side-flexibility-representation
    role: canonical-use
    evidence: >
      BEV demand-side management (DSM) and vehicle-to-grid (V2G) are modelled
      in detail: "In the DSM scenarios, a fixed fraction of cars make a battery
      capacity of 50 kWh per car available … to shift the BEV charging to times
      which minimise the total system costs." State of charge forced to 75–100%
      at 5 am every day. V2G scenarios also allow discharge back to grid.
      (Secs. 3.4–3.5, 4.3–4.4)
    procedure_notes: >
      BEV modelled in aggregate per country using time-series constraints on
      en,s,t (Eq. 5). Charging power availability inversely proportional to
      transport demand profile; min availability ~62%, avg 80%, peak 95%.
      DSM fractions swept at 25%, 50%, 100%; V2G fractions swept at 25%, 50%,
      100%. Constraint: SoC ≥ 75% at 5 am daily prevents synoptic/seasonal
      shifting by BEVs.
    variant: bev-dsm-v2g-aggregate
    parameters: {battery_per_car: "50 kWh", DSM_fractions: "25/50/100%", V2G_fractions: "25/50/100%", min_SoC_constraint: "75% at 05:00"}

  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      "For batteries, it is assumed that the charging and discharging power
      capacities of the inverter are equal; the energy storage capacity is
      optimised independently." Similarly, hydrogen storage power (electrolysis,
      fuel cell) and energy (steel tanks) are optimised independently, as is
      hot-water TES with two duration classes τ=3 days and τ=180 days. (Sec. 3,
      Table 1)
    procedure_notes: >
      Energy and power capacity co-optimised independently for batteries,
      hydrogen, and TES. Seasonal (LTES, τ=180 d) vs short-term TES (τ=3 d)
      treated as distinct technologies with different cost, decay parameters.
      Methane store energy capacity exogenous (existing gas network). BEV battery
      capacity exogenous (50 kWh × fleet size × participation fraction).
    variant: independent-e-p-sizing
    parameters: {battery_tau: null, h2_storage: "steel tanks", TES_short: "tau=3 days", TES_long: "tau=180 days"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Investment and operation are optimised over a full historical year of
      hourly weather and demand data assuming perfect foresight, with 2011
      chosen as the representative year." (Sec. 2)
    procedure_notes: >
      Single-year overnight optimisation (greenfield for new capacity; hydro
      fixed at current size). No multi-year pathway. The paper acknowledges
      modelling only one weather year as a limitation and cites an upcoming paper
      [117] that tests sensitivity to weather year choice.
    variant: overnight-perfect-foresight
    parameters: {horizon: "single year", weather_year: 2011, cost_vintage: 2030}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "For the annualisation of overnight costs a discount rate of 7% is used
      for large, utility and central assets, while a rate of 4% is used for
      decentral individual units (including rooftop solar PV and building
      retrofitting)." (Sec. 3.8)
    procedure_notes: >
      Technology-specific discount rates: 7% for wind, utility PV, OCGT,
      grid, central heating; 4% for rooftop PV, individual heating units,
      building retrofitting. Costs oriented to 2030 projections. Annuity
      computed from overnight cost, lifetime and FOM (Table 1).
    variant: technology-specific-wacc
    parameters: {rate_central: "7%", rate_decentral: "4%"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Protected sites as listed in Natura2000 are excluded, as well as areas
      with certain land use types, as specified by [4] from the Corine Land
      Cover database, to avoid, for example, placing wind turbines in urban
      areas … The maximum water depth for offshore wind turbines is assumed
      to be 50 m." (Sec. 3.3). Maximum installable capacity per country derived
      by scaling layouts until one site on a 40×40 km2 lattice reaches the
      maximum installation density.
    procedure_notes: >
      Wind density cap: 10 MW/km2 theoretical, 20% of that used (2 MW/km2).
      Solar density cap: 145 MW/km2 theoretical, 1% used (1.45 MW/km2).
      Distribution proportional to local capacity factor. Natura2000 and
      Corine Land Cover exclusions applied. Offshore max depth 50 m.
    variant: corine-natura2000-exclusion
    parameters: {wind_density: "2 MW/km2", solar_density: "1.45 MW/km2", offshore_depth: "50 m", grid_res: "40x40 km2"}

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "The Karush-Kuhn-Tucker (KKT)/Lagrange multiplier λ_n,t represents the
      market price of the energy carrier at this bus in this hour." (Eq. 2,
      Sec. 2). Average load-weighted marginal prices for electricity and heating
      are reported for all scenarios in Table 3, and compared to marginal
      heating costs to estimate economically efficient retrofitting levels (Sec. 4.6).
    procedure_notes: >
      Duals of nodal energy balance constraints interpreted as carrier-specific
      hourly market prices. CO2 shadow price µ_CO2 from Eq. 8 reported per
      scenario. Marginal heat prices used to estimate whether building
      retrofitting is economically justified (using Fig. 5 cost curves for
      Germany and Denmark). KKT relation used to link CO2 price, fuel cost
      and heating price at the margin.
    variant: kkt-duals-as-prices
    parameters: {}

