paper: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
tier: 1
model_used: >
  PyPSA-Eur, full ENTSO-E area, 3657 substations / 6001 lines, electricity-only,
  dataset paper (no capacity optimisation run; LOPF validation only).
scope: >
  Introduces the PyPSA-Eur open dataset: automated pipeline assembling the
  European transmission network, a deduplicated conventional power-plant
  database, land-eligibility-filtered renewable potentials, and ERA5-derived
  capacity-factor time series, validated against official statistics and other
  open network models.
methods:
  - slug: powerplant-matching-and-fleet-assembly
    role: defines
    evidence: >
      "The powerplantmatching (PPM) tool and database we present in this section
      achieves good coverage by (1) standardising the records of several freely
      available databases, (2) linking them using a deduplication and record
      linkage application and (3) reducing the connected claims about fuel type,
      technology, capacity and location to the most likely ones." (Sec. 2.2)
    procedure_notes: >
      Seven databases (OPSD, ENTSO-E PPL, ESE, GEO, CARMA, GPD) standardised to
      a common tabular structure. Duke java library run in deduplication mode
      (within same database) and record-linkage mode (across database pairs) using
      Naive-Bayes probability with Jaro, Q-gram, numeric and geo comparators.
      Threshold 0.985. Cliques in the resulting directed graph are aggregated as
      single plants; fuel type taken by majority vote, capacity by median, location
      by mean lat/lon. Final dataset: 3501 plants, 663 GW (Sec. 2.2, Table 3, Eq. 1).
    variant: naive-bayes-record-linkage
    parameters: {match_threshold: 0.985, databases: 7, plants: 3501, total_capacity_GW: 663}

  - slug: land-eligibility-and-potentials
    role: defines
    evidence: >
      "The usable area is restricted by the following constraints: Onshore wind can
      only be built in land use types of the CORINE Land Cover database associated
      to Agricultural areas and Forest and semi natural areas and furthermore a
      minimum distance of 1000 m from Urban fabric … Offshore wind can only be
      constructed in water depths up to 50 m. Additionally, all nature reserves …
      listed in the Natura2000 database are excluded." (Sec. 2.4)
    procedure_notes: >
      ERA5 weather raster (0.28° × 0.28°) used for wind speeds and solar
      irradiance via the atlite package. Wind capacity factors computed from
      Vestas V112 (onshore, 3 MW, 80 m) and NREL Reference Turbine (offshore,
      5 MW, 90 m) power curves, smoothed with Gaussian kernel (η=0.95, Δu=1.27 m/s,
      σ₀=2.29 m/s). Technical density 10 MW/km² onshore at 30% land fraction.
      Solar from SARAH-2 irradiance; 145 MW/km² technical density at 1% permitted
      fraction. Capacity distributed across Voronoi cells weighted by capacity
      factor × installable area (Eqs. 5–7, Sec. 2.4–2.5).
    variant: corine-natura2000-era5-atlite
    parameters:
      onshore_density_MW_km2: 10
      onshore_land_fraction: 0.3
      offshore_max_depth_m: 50
      solar_density_MW_km2: 145
      solar_land_fraction: 0.01
      min_distance_urban_m: 1000
      weather_resolution_deg: 0.28

  - slug: spatial-clustering-and-resolution
    role: extends
    evidence: >
      "We present a new technique of applying k-means clustering to measure the
      similarity of several geo-located network models … The buses of all networks
      are jointly clustered together into k clusters by minimizing the distances in
      each cluster … In the kernel of the scalar product we propose Ka,b = exp(−‖a−b‖²/N) + νBᵀa,b"
      (Sec. 3.2, Eqs. 9–10)
    procedure_notes: >
      Novel kernel k-means used for cross-model topology validation (not for
      network reduction per se). Kernel combines radial basis function over
      Euclidean distance and pseudo-inverse of admittance matrix B (electrical
      reactance distance). Applied jointly to PyPSA-Eur, osmTGmod and ELMOD-DE
      German networks; k=80 clusters (also tested 20–40), 20 random restarts,
      weights w=5 for PyPSA-Eur/ELMOD-DE vs w=1 for osmTGmod, ν=200. Clustering
      to 362–1500 buses also mentioned as a remedy for local load-assignment errors
      (Sec. 3.2, 3.4).
    variant: kernel-kmeans-topology-comparison
    parameters: {k: 80, random_restarts: 20, nu: 200}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "The linear optimal power flow of the European peak-load hour is considered
      to check the feasibility of the combined network, generation and demand data
      for supplying the most extreme demand, so that line-loading is below 70% to
      approximate the N−1 stability constraint." (Sec. 3.4)
    procedure_notes: >
      Single-snapshot LOPF run on the European peak-load hour (17:00, 17-01-2013,
      0.51 TW). Wind and solar feed-in excluded; hydro dispatched at full power.
      Line loading capped at 70% as N-1 proxy. Run via PyPSA framework v0.13.1.
      Used only for dataset validation, not for planning optimisation.
    variant: single-snapshot-validation
    parameters: {peak_load_TW: 0.51, line_loading_limit_pct: 70}

  - slug: distribution-and-voltage-aware-aggregation
    role: routine-use
    evidence: >
      "The restriction to buses and transmission lines of the voltage levels 220 kV,
      300 kV and 380 kV … The countries are partitioned into Voronoi cells as
      catchment areas, each of which is assumed to be connected to the substation
      by lower voltage network layers." (Sec. 2.1)
      "Using Voronoi cells to aggregate load and generator data to transmission
      network substations ignores the topology of the underlying distribution
      network." (Sec. 4 Limitations)
    procedure_notes: >
      AC lines at 220/300/380 kV plus all HVDC lines included; sub-220 kV
      excluded. Voronoi cells used to assign load (60% GDP, 40% population from
      NUTS3 Eurostat data) and generator data to substations. Paper explicitly
      acknowledges this ignores sub-transmission topology, leading to local
      assignment errors remedied by clustering. No distribution layer modelled.
    variant: voronoi-transmission-only
    parameters: {voltage_levels_kV: [220, 300, 380], hvdc: true}

unmatched_methods: []
