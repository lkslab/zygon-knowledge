paper: "2018_Pfenninger_Opening-black-box-energy-modelling_EnergyStratRev.pdf"
tier: 1
model_used: >
  no model (review/tooling paper). This is a how-to guide for opening energy model
  code and data; no energy system model is run.
scope: >
  Practical guide for energy modellers on how to open their code and data: IP
  ownership, licence choice, modelling language, distribution, and community
  building, illustrated with four case studies (OSeMOSYS, OPSD, PYPOWER lineage,
  oemof).
methods: []
unmatched_methods:
  - name: "no methods used"
    evidence: >
      The paper is entirely a policy/opinion piece on open-source practices in energy
      modelling. All references to technical methods (temporal resolution reduction
      [Refs. 10-15], spatial scale [Ref. 12], etc.) appear only as cited motivation in
      the introduction (Sec. 2.1), not as methods the authors implement or analyse.
      No model is run; no optimisation, simulation, aggregation, or quantitative
      analysis is performed. The screening hits (temporal-aggregation-and-segmentation,
      weather-year-ensembles, etc.) are each a single sentence citing prior work.
      Rule 2 applies: a mention is not a use.
