paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model: 31-node (one per Chinese province), hourly, electricity-only,
  greenfield investment optimisation, solved with Gurobi. References PyPSA library [19]
  and PyPSA-Eur [20] but is not either of those models.
scope: >
  Cost-optimal decarbonisation of the Chinese power system under CO2 emission reduction
  targets (0–100%), co-optimising generation (wind, solar, OCGT, coal, hydro), storage
  (battery, H2), and transmission across three grid topologies (RG, RGDC, FCG), using
  a 38-year weather dataset with a novel calibrated reservoir hydro cascade model.
methods:
  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      "We study cost-optimal highly-renewable Chinese power systems… by deploying a
      31-node hourly-resolved techno-economic optimization model." Generation, storage
      and transmission capacities are co-optimised simultaneously (Sec. 2, Eq. 1).
      Transmission volume is additionally constrained by a cap CAP_LV = sum(l_ell * F_ell)
      (Eq. 9, Sec. 2.5). Three distinct grid topologies are compared: regional AC only
      (RG), regional AC plus unidirectional HVDC (RGDC), and fully connected UHVAC (FCG)
      (Sec. 3.4, Table 2).
    procedure_notes: >
      Line capacities F_ell are decision variables. Thermal limits constrain flows
      (Eq. 8). Transmission investment cost includes converter-pair costs for DC lines
      and an n-1 security factor f_n-1 = 1.5 applied to line capacities (Sec. 3.5).
      Total transmission volume (MWkm) is swept from 0.25 to 1.5× the unconstrained
      optimum (Sec. 6, Fig. 11). Optimal volumes at 90% CO2 reduction: 2231 TWkm (RGDC)
      and 1851 TWkm (FCG).
    variant: volume-cap-sweep
    parameters:
      nodes: 31
      topology_variants: "RG, RGDC, FCG"
      volume_cap_sweep: "0.25x to 1.50x optimal"
      n1_security_factor: 1.5
      converter_pair_cost: "150000 EUR/MW (DC lines)"

  - slug: carbon-constraints-and-pricing
    role: canonical-use
    evidence: >
      "CO2 emissions are also limited by a cap CAP_CO2… This cap is varied under
      different simulations to satisfy emission reductions goals" (Sec. 2.5, Eq. 10).
      The shadow price mu_CO2 is reported as the KKT multiplier of this constraint
      (Sec. 2.5, Sec. 5).
    procedure_notes: >
      Annual CO2 cap applied across all combustion generators (OCGT and coal only;
      manufacturing emissions excluded). Cap swept from 0% to 100% emission reduction
      relative to today's ~6 billion tCO2/year from China's power sector. Shadow price
      mu_CO2 rises from 228 to 293, 809 and 1307 EUR/tCO2 (RGDC) as hydro and storage
      are progressively removed (Sec. 5).
    variant: cap-sweep
    parameters:
      baseline_emissions: "~6 billion tCO2/year"
      reduction_range: "0%–100%"
      shadow_price_range: "228–1307 EUR/tCO2 (RGDC, varying flexibility)"

  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      Two storage technologies are co-optimised: lithium-ion battery (h_battery,max = 6 h)
      and hydrogen storage (h_H2,max = 168 h = one week) (Sec. 2.3, Table 3). Energy
      capacity is fixed as E_n,s = h_s,max * G_n,s, so power and energy are scaled
      together at fixed duration ratios.
    procedure_notes: >
      State-of-charge is cyclic (Eq. 7, Sec. 2.3). Battery round-trip efficiency 0.81
      (0.9/0.9); H2 round-trip 0.435 (0.75 electrolysis × 0.58 fuel cell). Storage
      cost per energy: battery 192 EUR/kWh, H2 11.2 EUR/kWh (Table 3). Reservoir hydro
      is also modelled as a storage unit with fixed power capacity and uncontrollable
      inflow (Sec. 3.3). Sensitivity to storage removal is reported at 90% CO2 reduction.
    variant: fixed-duration-ratio
    parameters:
      battery_hmax: 6
      h2_hmax: 168
      battery_roundtrip_efficiency: 0.81
      h2_roundtrip_efficiency: 0.435
      battery_energy_cost: "192 EUR/kWh"
      h2_energy_cost: "11.2 EUR/kWh"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "In all scenarios, only one year is solved at a time, due to computational
      limitations." (Sec. 2). Described as "greenfield investment planning, meaning we
      ignore existing plants and infrastructure." (Sec. 4.1).
    procedure_notes: >
      Single-year overnight greenfield optimisation. No multi-year pathway or myopic
      stepping. The paper resolves a single target year (2050 demand, 2030 cost
      assumptions) at hourly resolution. Solved per weather year, with 38 individual
      years run independently.
    variant: overnight-greenfield
    parameters:
      target_year: 2050
      cost_year: 2030
      temporal_resolution: "1h"
      weather_years_run: 38

  - slug: weather-year-ensembles
    role: canonical-use
    evidence: >
      "We consider the range of weather conditions that affect wind, solar and hydro
      power generation as well as electricity demand with a single, consistent
      38-year-long dataset." (Abstract). "We employed 38 individual years of reanalysis
      dataset from 1979 to 2016 [34], used weather year 2016 as an example and plotted
      other years' results for reference in Figure 8." (Sec. 5).
    procedure_notes: >
      Each of the 38 weather years is run as a separate full optimisation (one year
      solved at a time). Results show mean and standard deviation across years for
      installed capacities, curtailment, and transmission costs (Fig. 8 error bars).
      CFSR reanalysis data used for wind, solar, hydro inflow and temperature/cooling
      demand (Sec. 3.2). The 38-year ensemble is the primary tool for demonstrating
      design robustness.
    variant: full-ensemble-separate-runs
    parameters:
      weather_dataset: "CFSR reanalysis"
      years: "1979–2016"
      n_years: 38

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The given overnight capital costs were annualized with a discount rate of 7%
      over the economic lifetime." (Sec. 3.5, Table 3).
    procedure_notes: >
      Single uniform discount rate of 7% applied to all technologies. Lifetimes
      vary by technology (Table 3): wind/solar 25 yr, OCGT 30 yr, coal 30 yr, H2/battery
      storage 20 yr, transmission 40 yr, hydro 80 yr. No WACC differentiation by
      technology or country. Transmission O&M set at 2% of investment cost.
    variant: null
    parameters:
      discount_rate: "7%"
      technology_lifetimes: "20–80 years depending on technology"

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "The transmission is simplified as a transport model with controllable directed
      flows rather than modeling the node-by-node current and voltage [19, 66]. And
      the power flows are approximated as linear DC power flows assuming small
      voltage-angle differences, low resistance and flat voltage profile." (Sec. 7,
      Discussions).
    procedure_notes: >
      Transport model (not full DC power flow with PTDFs): each line has a controllable
      bidirectional or unidirectional flow bounded by thermal limits |f_ell,t| <= F_ell
      (Eq. 8). Power balance enforced via the network incidence matrix K_n,ell (Eq. 2).
      Linearisation explicitly discussed as a limitation in Sec. 7. HVDC lines are
      modelled as unidirectional (RGDC topology), UHVAC lines as bidirectional (FCG).
    variant: transport-model
    parameters:
      nodes: 31
      line_types: "regional AC, unidirectional HVDC, bidirectional UHVAC"

  - slug: n-1-security-and-contingency
    role: routine-use
    evidence: >
      "To satisfy n-1 security requirements, a safety margin of 33% of the installed
      capacity can be used [28]. This can be emulated a posteriori by increasing the
      optimized NTCs by a factor of f_n-1 = (1 - margin)^{-1} = 1.5." (Sec. 2.4).
    procedure_notes: >
      N-1 not enforced as explicit contingency constraints inside the optimisation.
      Instead applied as a post-hoc derating: optimised line capacities are scaled up
      by factor 1.5 when reporting net transfer capacities. Same factor applied in
      transmission investment cost formula (Sec. 3.5).
    variant: derating-margin
    parameters:
      security_margin: "33%"
      ntc_upscale_factor: 1.5

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The KKT multiplier mu_CO2 indicates, in an unconstrained market, the CO2 price
      necessary to obtain this reduction in emissions, i.e. shadow prices." (Sec. 2.5).
      Shadow price of the CO2 constraint is reported under multiple flexibility
      configurations (Sec. 5).
    procedure_notes: >
      The dual variable of the annual CO2 cap constraint (Eq. 10) is read out and
      interpreted as the implied carbon price. Values reported for RGDC at 90%
      reduction with/without hydro and storage: 228, 293, 809, 1307 EUR/tCO2 (Sec. 5).
      No spatial nodal price analysis; shadow prices used purely for the CO2 constraint.
    variant: co2-constraint-dual
    parameters:
      shadow_price_values: "228–1307 EUR/tCO2 (RGDC, 90% reduction)"

  - slug: cost-allocation-and-equity-metrics
    role: routine-use
    evidence: >
      "Figure 5 shows geographical distribution of power generation as well as
      transmission volume, while in Figure 6 we map the component-wise storage costs,
      both for cost-optimal systems under RGDC and FCG." (Sec. 4.2). Section is titled
      "Cost allocation."
    procedure_notes: >
      Node-level cost breakdown by technology component (generation, storage, transmission)
      mapped across 31 provinces. Used to compare spatial investment distribution between
      RGDC and FCG grid strategies. No formal equity metric (e.g. Gini); allocation is
      descriptive (Fig. 5, 6) showing concentration of storage and generation in northwest
      provinces. Levelized transmission cost reported as EUR/MWh averaged over scenarios
      (Fig. 8).
    variant: nodal-cost-mapping
    parameters: {}

