paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec-30: one node per country (30 nodes), electricity + heating +
  transport sectors, hourly resolution, single target year with 2030 cost
  projections.
scope: >
  Investigates the cost-optimal role of solar PV in a highly renewable European
  energy system under variable CO2 emissions caps, transmission expansion limits,
  and technology cost assumptions, using PyPSA-Eur-Sec-30.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "The PyPSA-Eur-Sec-30 model is an open-source, hourly-resolved,
      one-node-per-country network model of the European energy system. It
      currently includes the electricity, heating, and transport sectors."
      (Sec. 2 Methods, Model). Figure 2 shows three buses per node (electricity,
      heating, transport) with conversion links (heat pumps, electrolysers, fuel
      cells, CHPs).
    procedure_notes: >
      30 nodes (28 EU member states minus Malta and Cyprus, plus Norway,
      Switzerland, Serbia, Bosnia-Herzegovina). Sectors connected via conversion
      links (heat pumps, electrolysers, fuel cells, CHP). HVDC links connect
      neighbouring countries. Capacity and dispatch of all generation, storage
      and transmission assets jointly optimised.
    variant: null
    parameters: {nodes: 30, sectors: "electricity, heating, transport", resolution: "hourly"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Greenfield optimisation is implemented, i.e., the European energy system
      is built from scratch. Cost assumptions correspond to projections for 2030
      for all technologies." (Sec. 2 Methods, Model). "The capacity and dispatch
      of every asset ... are jointly optimised assuming perfect foresight and
      competition as well as long-term market equilibrium." (Sec. 2 Methods).
    procedure_notes: >
      Single overnight target year (2030 cost assumptions). Greenfield — no
      existing fleet. Perfect foresight over the full 8760-hour optimisation.
      Hydro capacity exogenously fixed and considered fully amortised.
    variant: overnight-greenfield
    parameters: {target_year: 2030, weather_year: 2015}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "a maximum CO2 emissions CAPCO2 ... is imposed by [Eq. 2]: sum of
      gn,s,t / (eps_s * eta_n,s) <= CAPCO2 ↔ µCO2" (Sec. 2 Methods, Eq. 2).
      Figure 6(a) sweeps CO2 cap from 5% to 95% of 1990 level and reports
      optimal PV/wind generation and CO2 shadow price at each level.
    procedure_notes: >
      Annual CO2 emissions cap applied globally across the European network.
      Main scenario: 5% of 1990 level. Full sweep from 5% to 95% reported
      in Fig. 6(a). CO2 constraint is binding only below 40% of 1990 level
      under the paper's cost assumptions. Lagrange multiplier (µCO2) read as
      the required carbon price.
    variant: global-annual-cap
    parameters: {co2_levels: "5–95% of 1990 emissions", main_scenario: "5%"}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The Lagrange/Karush-Kuhn-Tucker multiplier µCO2 represents the CO2
      shadow price, i.e., the required CO2 price to achieve the emissions
      reduction in an open market." (Sec. 2 Methods, Eq. 2). "Market value is
      defined as the average price of electricity produced by PV relative to
      the average load-weighted price" (Sec. 3, CO2 emissions limit).
    procedure_notes: >
      CO2 shadow price extracted as KKT multiplier of the global CO2 cap
      constraint and plotted as a function of the emissions level. PV market
      value used to discuss curtailment and value reduction at high PV
      penetration. Both duals used as analytical outputs, not as market
      simulation inputs.
    variant: null
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "HVDC transmission lines, whose capacities can be expanded if it is
      cost-effective." (Sec. 2 Methods). Figure 6(b) shows wind/PV generation
      and system cost as a function of the transmission expansion cap
      (from today's volume up to fully unconstrained).
    procedure_notes: >
      HVDC interconnector capacity co-optimised with generation and storage.
      Reference scenario: transmission capped to 2× today's volume. Sensitivity
      sweep releases this cap progressively. Main finding: most cost benefit
      captured at ~3× today's volume for 30-node network.
    variant: null
    parameters: {reference_cap: "2× today's volume"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The PyPSA-Eur-Sec-30 model ... comprises 30 nodes, the 28 European
      Union member states as of 2018 excluding Malta and Cyprus but including
      Norway, Switzerland, Serbia, and Bosnia-Herzegovina." (Sec. 2 Methods).
      Spatial resolution discussed as a limitation: "the coarse-grained
      network, one node per country, might have important consequences."
      (Sec. 3, Limitations).
    procedure_notes: >
      One administrative node per country (30 nodes total). Country-aggregate
      PV/wind capacity factors used. Limitations explicitly acknowledged:
      single-node per country may produce binary technology choices; higher
      resolution (256-node) results from [32] cited for comparison showing
      1.25× transmission suffices in finer network.
    variant: administrative-zones
    parameters: {nodes: 30, aggregation: "one node per country"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "a sensitivity analysis to evaluate the impact of CO2 emissions cap,
      transmission expansion, and cost assumptions is included." (Sec. 1
      Introduction). Figure 6 panels (a)–(f) sweep CO2 cap, transmission
      expansion, PV cost, wind cost, battery cost, and hydrogen storage cost.
    procedure_notes: >
      One-at-a-time sensitivity sweeps reported in Fig. 6: (a) CO2 cap 5–95%
      of 1990 level; (b) transmission expansion cap from today's volume to
      unconstrained; (c) solar PV cost 25–200% of reference; (d) wind cost
      25–200% of reference; (e) battery cost 25–200% of reference; (f)
      hydrogen storage cost 25–200% of reference. Metric reported: optimal
      wind/PV generation shares and total annualised system cost.
    variant: one-at-a-time
    parameters: {parameters_swept: 6, cost_range: "25–200% of reference"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "Their discharge time at maximum power, which is independently optimised,
      is in the range of 6 hours to counterbalance the strong daily pattern of
      PV generation." ... "hydrogen storage is installed. It has a discharge
      time of approximately 2 days necessary to balance the synoptic
      fluctuations of wind generation." (Sec. 3, Storage).
    procedure_notes: >
      Energy and power capacity of batteries and hydrogen storage optimised
      independently (separate cost terms cn,s for power and ĉn,s for energy
      in Eq. 1). Battery discharge time ~6 h (daily cycle, PV-driven);
      hydrogen storage discharge time ~2 days (synoptic wind cycle). PHS
      capacity exogenously fixed.
    variant: null
    parameters: {battery_duration: "~6 h", h2_duration: "~2 days"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "Costs are annualised assuming a discount rate of 0.07." (Table 1,
      footnote a). "4% and 7% discount rate has been assumed" for rooftop and
      utility-scale PV respectively (Table 1, footnote c).
    procedure_notes: >
      Single social discount rate of 7% applied to all technologies except
      rooftop PV (4%). Overnight capital costs converted to annuities using
      these rates and technology lifetimes (Table 1). Utility-scale PV
      annualised cost 38 €/kW·year; rooftop 47 €/kW·year under these
      assumptions.
    variant: null
    parameters: {discount_rate_default: "7%", discount_rate_rooftop_pv: "4%"}

