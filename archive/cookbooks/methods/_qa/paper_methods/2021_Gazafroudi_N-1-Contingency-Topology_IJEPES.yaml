paper: "2021_Gazafroudi_N-1-Contingency-Topology_IJEPES.pdf"
tier: 1
model_used: >
  PyPSA library only (bespoke model); the paper uses PyPSA for LOPF simulation
  on a 3-bus triangular network, several small-scale European country networks,
  and a 50-bus Germany network derived from PyPSA-Eur. No investment
  optimisation is run — dispatch-only with fixed capacities.
scope: >
  Proposes topology-based heuristic approximations for N-1 contingency
  constraints in linearised optimal power flow, replacing the full set of
  SCLOPF constraints with a single buffer capacity factor per line (or uniform),
  derived from polytope geometry rather than dispatch-dependent screening.
methods:
  - slug: n-1-security-and-contingency
    role: defines
    evidence: >
      "We introduce a heuristic approach to model the fully secured N-1 feasible
      space using a smaller number of constraints in a way that only depends on
      the topology of transmission networks." (Abstract). The paper defines three
      approaches — robust, approximate, and line-specific — each assigning a
      buffer capacity factor c_l to derate line limits instead of adding explicit
      post-contingency flow constraints (Eqs. 14–15, Sec. 3).
    procedure_notes: >
      Full N-1 adds 2*L*(N-1) constraints per snapshot (Eq. 15 via LODF/PTDF);
      the heuristic replaces these with a single multiplicative derating c_l on
      each line's thermal limit (Eq. 16). Three variants: (i) robust — c_R is
      the smallest c such that the derating polytope Q^R ⊆ Q^{N-1}, guaranteed
      feasible for all contingencies; (ii) approximate — c_A chosen so
      volume(Q^A) = volume(Q^{N-1}) via hit-miss Monte Carlo with Halton
      quasi-random sequences (Eq. 22); (iii) line-specific — c_l determined
      individually using the redundant capacity factor t_l from the
      Edmonds-Karp max-flow algorithm (Algorithm 1). For large networks (50-bus
      Germany), buses are partitioned into subsets by k-means geographic
      clustering or random sampling, and polytope volumes are estimated on
      lower-dimensional projections to avoid the curse of dimensionality
      (Sec. 3.3). Simulated in PyPSA on 3-bus, small-scale European country
      networks (Fig. 5), and 50-bus Germany network (Fig. 7). Germany study uses
      a full year of hourly weather/load data, 90% CO2 reduction scenario.
    variant: topology-buffer-capacity
    parameters:
      networks: "3-bus triangular; 6 small-scale European country networks; 50-bus Germany"
      c_R_germany: "0.59"
      c_A_germany: "0.74"
      c_l_range_germany: "0.59 to 1.0 (line-specific)"
      CO2_reduction: "90% vs 1990 electricity sector"
      random_samples_for_c_R: "100 random subsets to cover all lines"
      computational_speedup: "~14x faster than full N-1 (270s vs 3786s for uniform; Table 3)"

  - slug: linearised-optimal-power-flow
    role: canonical-use
    evidence: >
      "We consider the linearized AC optimal power flow (LOPF) problem that
      seeks to minimize the operational cost of generator dispatch under network
      constraints with fixed capacities." (Sec. 2.1). The PTDF/LODF formulation
      is central to deriving both the N-0 and N-1 polytopes (Eqs. 7, 12–13).
    procedure_notes: >
      LP formulation minimising generation cost (Eq. 1) subject to KCL nodal
      balance (Eq. 2), generator limits (Eq. 4), optional CO2 cap (Eq. 5), and
      line flow limits via PTDF (Eq. 10). Power losses are ignored for
      simplicity. No capacity expansion — fixed generation fleet. Solved in
      PyPSA (cited as [21]). The susceptance matrix B and incidence matrix K
      define PTDF = B K^T Λ^* (Eq. 7); LODF derived from PTDF (Eq. 13).
    variant: ptdf-cycle-flow
    parameters: {}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "subsets can be selected by random selections or by clustering buses that
      are geographically close to each other using k-means algorithm" (Sec. 3.3).
      For the 50-bus Germany network, 13 subsets are formed by geographic k-means
      to make polytope volume estimation tractable (Table 2).
    procedure_notes: >
      k-means clustering is used as a dimensionality-reduction tool for the
      polytope estimation problem, not for network aggregation per se. Each
      subset defines a lower-dimensional cross-section of the feasible polytope.
      The 50-bus Germany network is derived from PyPSA-Eur (cited as [33]).
      k-means alone does not guarantee N-1 robustness (cross-cluster lines are
      missed), so 100 random bus subsets are also sampled to confirm c_R = 0.59.
    variant: null
    parameters:
      n_clusters_germany: "13"
      n_buses: "50"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "A sensitivity analysis of the proposed approaches is performed in different
      network topologies and German transmission networks." (Sec. 1.3). Fig. 11a
      sweeps buffer capacity factor c from 0 to 1 and reports annual operational
      cost; Fig. 11b sweeps c and reports number of overloaded lines/snapshots.
    procedure_notes: >
      One-at-a-time sweep of the scalar buffer capacity factor c over [0, 1]
      on the 50-bus Germany network. Metrics tracked: annual operational cost
      (Eq. 1 summed over 8760 hours), number of N-1 overloaded transmission
      lines, and number of time snapshots with any overloading (Fig. 11a–b).
      Also evaluated across 6 small-scale European country networks to test
      topology sensitivity (Table 1, Fig. 6).
    variant: null
    parameters:
      sweep_variable: "buffer capacity factor c in [0, 1]"
      networks_tested: "3-bus, 6 small-scale European, 50-bus Germany"

