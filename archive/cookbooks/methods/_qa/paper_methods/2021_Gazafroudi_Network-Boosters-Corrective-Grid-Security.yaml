paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model — 50-bus German transmission network built from PyPSA-Eur
  data (load, renewable time series, existing power plants), electricity-only,
  single target year (overnight investment).
scope: >
  Investigates long-term cost savings from corrective N-1 security using
  network boosters (fast-acting storage/DSM) versus preventive N-1 in a
  German capacity-expansion model, comparing sequential and simultaneous
  co-optimisation of generation and booster investment.
methods:
  - slug: n-1-security-and-contingency
    role: defines
    evidence: >
      "we investigate the impact on renewable integration of a corrective network
      security strategy, whereby storage or other flexibility assets are used to
      correct overloading shortly after line outages" (Abstract). The NB model is
      defined in Sec. 2 via explicit PTDF/LODF contingency constraints (Eqs. 1–7)
      enforced for all single line outages. Both sequential (NB placed after
      generation investment) and simultaneous (joint co-optimisation) variants
      are introduced in Sec. 3.
    procedure_notes: >
      Preventive N-1 sets line flows below PATL for all pre-contingency states.
      Corrective N-1 (NB model) allows temporary overloading up to TATL (Eq. 8–9)
      until NB dispatch (p+/p-, Eqs. 1–6) counteracts overloading within minutes.
      LODF matrix (Eq. 7) computed from PTDF and incidence matrix. All 50 single
      line outages are enumerated explicitly. TATL factor varied from 1.0 to 1.5;
      default f_tatl=1.3 (30% above PATL). Sequential model solves generation
      investment (Eq. 10, subject to Eqs. 8,9,11–15) then NB placement (Eq. 16,
      subject to Eqs. 1–7). Simultaneous model combines both in one LP (Eq. 17,
      subject to Eqs. 1–9, 11–15). Memory limit was 100 GB RAM.
    variant: corrective-with-tatl
    parameters:
      network_buses: "50 (German transmission)"
      line_outages: "all single line outages (N-1)"
      tatl_factor: "1.0–1.5, default 1.3"
      nb_power_cost: "23 EUR/kW/a (reference, annualised at 7%)"
      nb_energy: "0.5 MWh per MW of power capacity"
      co2_reduction_range: "10%–90% vs 1990"

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "The combined network booster and generation planning problem is
      computationally demanding (requiring 100 GB memory for the German case
      study), which motivates the linearisation of all network and generation
      constraints." (Sec. 3). PTDF matrix relates nodal injections to line flows
      (Sec. 2, Eq. 6 and citation [24]).
    procedure_notes: >
      DC (linearised) power flow throughout. PTDF matrix and LODF matrix computed
      analytically (Eq. 7). Reactive power and losses explicitly acknowledged as
      ignored in Sec. 5 Limitations: "the power flow has been linearized, but
      this neglects reactive power flows and losses." All sub-problems are LP.
    variant: ptdf-lodf
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      In the simultaneous model "investment in generation and network boosters is
      optimized jointly" (Sec. 3.2, Eq. 17). Generation capacity Gs and NB
      capacities Pi+/Pi- are co-decision variables subject to a shared objective
      and shared contingency constraints.
    procedure_notes: >
      Network topology is fixed (no new lines); co-optimisation is between
      generation siting/sizing and NB (storage/flexibility) placement and sizing.
      The sequential model separates these stages; simultaneous model solves them
      as one LP. New investments allowed at each bus in wind, solar and gas (Eq. 12,
      installable potential constraint Gs_max).
    variant: null
    parameters:
      investment_technologies: "wind, solar PV, fossil gas, network boosters"

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "one hundred typical hours are chosen to represent typical demand and weather
      conditions. The hours are selected from historical data using the k-means
      algorithm and weighted according to their frequency of occurrence using the
      tsam library" (Sec. 4, citing [29]).
    procedure_notes: >
      k-means clustering on historical demand and renewable availability time
      series via tsam. Different numbers of typical hours tested; above 50 hours
      the objective was stable; 100 chosen as upper limit for the simultaneous
      model within 100 GB RAM. Weights proportional to frequency of occurrence.
    variant: k-means-typical-hours
    parameters:
      typical_hours: 100
      minimum_tested: 50

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The results are evaluated in a 50-bus German transmission network using
      data from the open-source PyPSA-Eur model of the European transmission
      power system, including time-series for load and renewable availability
      for each region and existing power plants" (Sec. 4, citing [28]).
    procedure_notes: >
      50-node aggregation of Germany from PyPSA-Eur data; aggregation method not
      described in detail — taken as given from PyPSA-Eur. Spatial resolution
      affects NB placement results (Sec. 4.1 discusses North–South wind pattern).
    variant: null
    parameters:
      nodes: 50
      region: "Germany"

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "Furthermore, the model features a constraint that limits the CO2 emissions
      to a desired target level, ΓCO2" (Sec. 3.1.1, Eq. 15). Swept across
      "different levels of CO2 emission reduction levels compared to levels in
      the year 1990 in the electricity sector" (Sec. 4).
    procedure_notes: >
      Annual CO2 cap as equality/inequality constraint (Eq. 15) using generator-
      specific emissions es and efficiency ηs. CO2 reduction targets serve as
      proxy for renewable penetration. Varied from 10% to 90% relative to 1990
      German electricity sector. Shadow price of the cap not reported.
    variant: annual-cap
    parameters:
      co2_reduction_range: "10%–90% vs 1990 electricity sector"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "we explore the benefit as a function of different levels of renewable
      energy, as a function of the network booster cost and as a function of the
      allowed temporary overloading of the lines" (Sec. 1.3). Results reported
      for CO2 targets, TATL factors and NB costs in Figs. 5–8.
    procedure_notes: >
      Three swept parameters: (1) CO2 reduction target 10–90% (proxy for
      renewable share), (2) TATL factor 1.0–1.5, (3) NB flexibility cost Cf
      from 10 to 23000 EUR/MW/a. Each sweep is one-at-a-time; no joint design of
      experiments. Sensitivity shown for both sequential and simultaneous models.
    variant: one-at-a-time
    parameters:
      swept_parameters: "CO2 target, TATL factor, NB cost"
      co2_range: "10%–90%"
      tatl_range: "1.0–1.5"
      nb_cost_range: "10–23000 EUR/MW/a"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The objective function for the electricity generation investment problem is
      to minimise annual system costs, composed of the capital and operation costs
      of the generation fleet" (Sec. 3.1.1, Eq. 10). Single target year solved
      in one pass; T+1 operational periods for investment dimensioning (Fig. 2).
    procedure_notes: >
      Overnight single-year investment model. No multi-period pathway; no myopic
      rolling or perfect-foresight multi-decade path. Capital costs annualised
      at 7% discount rate (stated for NB costs; generation costs referenced to
      Danish Energy Agency 2030 assumptions). Unit commitment, discrete expansion
      and intra-day uncertainty explicitly ignored (Sec. 5).
    variant: overnight
    parameters:
      discount_rate: "7%"
      target_year: "2030 cost assumptions"

unmatched_methods:
  - name: "corrective-scopf-with-network-boosters"
    evidence: >
      The paper's central methodological contribution is a security-constrained
      OPF where flexibility assets (network boosters) are used correctively after
      line outages, sized to restore flows within TATL. This is a variant of
      n-1-security-and-contingency but with the specific corrective-action
      planning (capacity sizing of NB) being the novelty. It fits closest under
      n-1-security-and-contingency (used above) but the simultaneous
      generation+NB co-optimisation is a planning method that sits between
      n-1-security-and-contingency and transmission-expansion-cooptimisation.
      No existing slug cleanly captures "corrective action capacity sizing
      co-optimised with generation investment."
