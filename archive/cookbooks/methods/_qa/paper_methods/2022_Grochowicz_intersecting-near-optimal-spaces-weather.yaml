paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
tier: 2
model_used: >
  PyPSA-Eur v0.4, electricity-only, one node per country (with split nodes for
  DK/ES/IT/GB), 3-hourly temporal resolution, 41 weather years (1980–2020),
  partial greenfield.
scope: >
  Introduces a methodology for designing energy systems that are robust to
  inter-annual weather variability by computing, projecting and intersecting
  near-optimal feasible spaces for 41 individual weather years, then selecting
  the Chebyshev centre of the intersection as the most robust investment
  allocation.
methods:
  - slug: mga-near-optimal-space
    role: extends
    evidence: >
      "We suggest a new methodology for designing robust energy systems. For
      this, we investigate so-called near-optimal solutions to energy system
      optimisation models; solutions whose objective values deviate only
      marginally from the optimum. Using a refined method for obtaining explicit
      geometric descriptions of these near-optimal feasible spaces, we find
      designs that are as robust as possible to perturbations." (Abstract).
      The paper formalises the epsilon-near-optimal feasible space as a convex
      polytope (Eq. 3), then projects it onto investment variables (Eq. 4) and
      further onto a k=5 dimensional reduced space via a linear aggregation map
      sigma (Eq. 5–6). It extends prior MGA/MAA work (Neumann & Brown 2021;
      Pedersen et al. 2021) with explicit polytope approximation, intersection
      across weather-year instances, and Chebyshev-centre selection (Sec. 2).
    procedure_notes: >
      Algorithm 1 approximates the reduced near-optimal space A_epsilon by
      iteratively solving the original LP with alternative objectives (extreme
      points in chosen directions); first along 2k cardinal directions, then
      guided by normals to the largest facets or the Chebyshev-ball-tangent
      facets ("maximal-centre-then-facets" method). 150 iterations per year
      were used as a compromise between accuracy and compute. Three direction
      strategies were compared (random-uniform, facets, maximal-centre-then-
      facets); the last was adopted as default. Slack epsilon = 5% above the
      most expensive weather year's optimum (Sec. 3.3). Dimensions k=5
      (transmission, PV, onshore wind, offshore wind, gas), weighted by capital
      cost. Convex hull computed with qhull. 41 separate near-optimal spaces
      are intersected; their intersection A_epsilon is computed as the polytope
      intersection of the 41 approximated A^(i)_epsilon (Sec. 2.3).
    variant: intersection-chebyshev-centre
    parameters:
      slack_epsilon: "5% above max single-year optimum cost"
      dimensions_k: 5
      iterations_per_year: 150
      weather_years: 41
      spatial_resolution: "one node per country (30 countries)"
      temporal_resolution: "3-hourly"

  - slug: weather-year-ensembles
    role: extends
    evidence: >
      "For the first time, we run a capacity expansion model of the European
      power system (one node per country) with a three-hourly temporal
      resolution and 41 years of weather data." (Abstract). The paper runs 41
      separate single-year capacity expansion optimisations using ERA5 reanalysis
      data 1980–2020 for renewable capacity factors and temperature-driven load
      (Sec. 3.1–3.2). It also validates robust designs by simulating dispatch
      over all 41 years (Sec. 4.3, Table 2).
    procedure_notes: >
      41 model instances, one per weather year 1980–2020, each solved
      independently as a full capacity expansion LP. Renewable capacity factor
      time series generated from ERA5 via Atlite. Load time series generated by
      regression on ENTSO-E 2010–2014 data using HDD/CDD and weekly profiles
      (Appendix B). Each single-year optimisation requires 3.5–4 GB RAM and
      ~23 min CPU time with Gurobi (2 threads). A joint 41-year optimisation
      was also run for validation, requiring ~134 GB RAM and 1–2 days wall time
      (Sec. 4.4). Robust allocations were validated by dispatch-only simulation
      over all 41 years.
    variant: full-ensemble-intersection
    parameters:
      weather_years: "1980–2020 (41 years)"
      data_source: "ERA5 reanalysis"
      processing_tool: "Atlite"
      single_year_ram: "3.5–4 GB"
      single_year_cpu_time: "~23 min (Gurobi, 2 threads)"
      joint_41year_ram: "~134 GB"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "We use PyPSA-Eur with a partial greenfield approach under perfect
      foresight, including existing transmission (expandable), hydropower and
      nuclear capacities (both non-extendable), but optimising renewables
      (onshore & offshore wind power, solar power), gas turbines and storage
      from zero." (Sec. 3.1). "The model is run with a single investment period
      and perfect foresight." (Sec. 3.1).
    procedure_notes: >
      Overnight / single-period perfect-foresight capacity expansion for a
      target year of 2030. Each of the 41 weather years is treated as a
      different potential realisation of 2030 conditions, not as a transition
      pathway. Cost assumptions from PyPSA-Eur v0.4 costs.csv for 2030 (in
      2013 EUR).
    variant: overnight
    parameters:
      target_year: 2030
      cost_year: "2013 EUR (2030 projections)"

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "A one-node-per-country spatial resolution and a 3-hourly temporal
      resolution is chosen." (Sec. 3.1). Countries in multiple synchronous zones
      (Denmark, Spain, Italy, UK) are represented through two nodes (footnote 6).
    procedure_notes: >
      Administrative aggregation to country-level nodes (30 countries, some
      split into two synchronous-zone nodes). Chosen to allow extensive
      validation of the MGA/intersection methodology rather than for accuracy;
      the authors note higher resolutions are computationally feasible with
      their parallelised single-year approach.
    variant: country-level
    parameters:
      nodes: "~30 countries (some with 2 nodes)"

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "The extendable technologies included in the model are transmission (both
      AC and relevant DC connections), battery and hydrogen storage, onshore and
      offshore wind power, solar power and open-cycle gas turbines." (Sec. 3.1).
      Transmission investment is one of the five dimensions of the reduced
      near-optimal space sigma (Sec. 2.2, Sec. 3.3).
    procedure_notes: >
      Transmission capacity co-optimised with generation and storage in each
      single-year LP. AC and DC interconnectors treated as extendable. Existing
      transmission included at 2020 capacities as a starting point (partial
      greenfield). Transmission expansion investment is explicitly tracked as
      one of the five dimensions in the reduced near-optimal space.
    variant: null
    parameters: {}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "We limit annual CO2 emissions to 95% of 1990 levels." (Sec. 3.1).
      An additional scenario with 100% emission reduction is presented in
      Appendix C, where gas is excluded and storage dimensions replace the
      gas dimension in the reduced near-optimal space.
    procedure_notes: >
      Annual CO2 cap applied in each single-year capacity expansion LP and in
      the dispatch validation runs. In the 100% reduction scenario, gas turbines
      are removed and the near-optimal space is redefined with battery and
      hydrogen storage as replacement dimensions.
    variant: annual-cap
    parameters:
      co2_reduction_main: "95% below 1990 levels"
      co2_reduction_appendix: "100% below 1990 levels"

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "The extendable technologies included in the model are transmission (both
      AC and relevant DC connections), battery and hydrogen storage, onshore and
      offshore wind power, solar power and open-cycle gas turbines." (Sec. 3.1).
      In the 100% emission reduction scenario, investment in battery and hydrogen
      storage becomes a dimension in the reduced near-optimal space (Appendix C).
    procedure_notes: >
      Battery and hydrogen storage co-optimised. In the main scenario (95%
      reduction), storage is extendable but not a tracked dimension in sigma.
      In the 100% scenario, battery and hydrogen storage replace the gas
      dimension in the 5-dimensional near-optimal space, showing their increased
      importance for full decarbonisation.
    variant: null
    parameters: {}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "We use reanalysis data to generate capacity factors for the renewable
      energy sources; our source is the hourly ERA5 dataset for the time period
      from 1980 up to and including 2020. The open-source tool Atlite translates
      weather data to hourly capacity factors for solar PV, on- and offshore
      wind." (Sec. 3.2). The model inherits land eligibility and potential
      constraints from PyPSA-Eur v0.4 defaults (Sec. 3.1).
    procedure_notes: >
      Capacity factor time series generated via Atlite from ERA5 for all 41
      years. Land eligibility limits and installable potentials inherited
      from PyPSA-Eur v0.4 defaults without modification. Hydropower inflow
      profiles also generated via Atlite and scaled to EIA country-level
      historical generation data (Appendix B.2).
    variant: null
    parameters:
      weather_data: "ERA5 hourly, 1980–2020"
      tool: "Atlite"

unmatched_methods:
  - name: "near-optimal-space intersection and Chebyshev-centre robust design"
    evidence: >
      The core method of intersecting N near-optimal polytopes (one per weather
      year) and selecting the Chebyshev centre of the intersection as the robust
      solution (Sec. 2.3–2.4, Eq. 9–12) is a novel combination not covered by
      any single SLUGS entry. It sits between mga-near-optimal-space (which it
      extends) and stochastic-and-robust-optimisation (which it deliberately
      avoids — see Sec. 5: "our form of robustness is a geometric concept and
      is only loosely connected to robust optimisation"). The polytope
      intersection-plus-Chebyshev-centre procedure is the paper's primary
      methodological contribution and has no exact slug match.
