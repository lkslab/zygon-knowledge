paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
tier: 1
model_used: >
  PyPSA-Eur v0.1.0, 250 nodes, electricity-only, 4380 snapshots (2-hourly), greenfield
  except existing transmission and fixed hydro.
scope: >
  Comprehensive comparison of linear power-flow and transmission-loss approximations
  (transport, lossy transport, lossless LOPF, lossy LOPF, iterative variants) in a
  continental-scale capacity expansion problem, evaluated against ex-post nonlinear
  AC power flow simulation.
methods:
  - slug: linearised-optimal-power-flow
    role: defines
    evidence: >
      Sec. 4 develops five linear flow formulations from first principles: transport
      model (KCL only), lossy transport (constant efficiency), lossless linearised
      power flow (KCL + KVL via cycle basis, Eq. 31), lossy linearised power flow
      (convex tangent envelope around ψ = r·p², Eqs. 39-43), and iterative variants
      that update impedances as line capacities change. The paper introduces an
      extended loss approximation that combines the cycle-based KVL formulation with
      a convex envelope of the quadratic loss curve, using 2n evenly spaced tangents
      (Sec. 4.4). Results validate these against AC Newton-Raphson simulation (Sec. 6.3,
      Table 3).
    procedure_notes: >
      Cycle-based KVL formulation (Eq. 31) used exclusively for computational speed
      (vs. angle-based). Loss approximation uses a convex envelope with upper bound
      ψ ≤ r(p̄P)² (Eq. 41) and 2n tangents (Eqs. 42-43); 6 tangents used in
      experiments (Sec. 5.1). N-1 security approximated by capping line utilisation
      at 70% (p̄ parameter, Eq. 12). Both HVAC and HVDC losses modelled where
      applicable. Transport model variants benchmarked for comparison. Pyomo interface
      used; PyPSA v0.17.0. Tolerances set to 0.1%.
    variant: lossy-lopf-with-convex-tangent-envelope
    parameters:
      nodes: 250
      snapshots: 4380
      temporal_resolution: "2-hourly"
      tangents_for_loss_envelope: 6
      n_minus_1_security_margin: "70% of nominal rating"
      loss_formulations_compared: ["transport", "lossy-transport", "lossless", "iterative-lossless", "lossy", "iterative-lossy"]

  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      Sec. 2 (Power System Planning Problem) formulates joint co-optimisation of
      generation capacity G_{i,r}, storage capacity H_{i,s}, and transmission line
      capacities P_ℓ in a single LP (Eq. 1). Sec. 4.5 introduces iterative impedance
      updates: "We sequentially solve the optimisation problem from Section 2 and in
      each iteration update the line impedances according to their optimised capacities."
      Results show lossy models yield 20% less network reinforcement than transport
      model (Sec. 6.1, Table 2).
    procedure_notes: >
      Continuous line expansion (not discrete). HVAC lines can be expanded up to max
      of doubled capacity or additional 5 GW. HVDC links up to 20 GW each. Planned
      TYNDP 2018 projects included. Existing transmission can only be reinforced, not
      removed. Iterative impedance update runs 3 iterations; final iteration fixes line
      capacities so impedances stabilise (Sec. 4.5). Convergence criterion: line
      expansion choices unchanged between iterations.
    variant: continuous-with-iterative-impedance-update
    parameters:
      iterations: 3
      hvac_expansion_cap: "max(2x existing, +5 GW)"
      hvdc_expansion_cap: "20 GW per link"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      Sec. 5.1 states: "solar PV, onshore and offshore wind capacities are co-optimised
      with battery storage, hydrogen storage, and transmission infrastructure in a
      greenfield planning approach" targeting 100% emission reduction in the power
      sector for a single target year.
    procedure_notes: >
      Overnight/greenfield single-year optimisation. Existing transmission and fixed
      hydro are exceptions to the greenfield assumption. No multi-year pathway or
      myopic rolling.
    variant: overnight-greenfield
    parameters:
      target_year: "single-year (no pathway)"
      co2_reduction: "100% in power sector"

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      Sec. 5.1: "We choose a spatial resolution of 250 nodes." Sec. 6.5 notes
      "consistent results for spatial aggregation to 100, 200 and 250 nodes" were
      observed, and discusses how line length and angle differences depend on
      aggregation level.
    procedure_notes: >
      250 nodes used as primary configuration (maximum tractable for all six flow
      models). Sensitivity across 100, 200, 250 nodes mentioned for robustness check.
      Network from PyPSA-Eur v0.1.0.
    variant: null
    parameters:
      nodes: 250
      sensitivity_nodes: [100, 200, 250]

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      Sec. 5.1: "a temporal resolution of 4380 snapshots, one for every two hours of
      a full year. This reflects the maximum for which all flow models presented in
      Section 4 could be solved." Snapshot weights w_t appear in Eqs. 1, 5, 8.
    procedure_notes: >
      2-hourly averaging of ERA5-derived capacity factor time series; snapshot
      weighting w_t = 2h ensures annual sums are preserved (Eq. 1: ∑w_t = 8760h).
      Resolution chosen by computational feasibility ceiling across all flow model
      variants.
    variant: n-hourly-averaging
    parameters:
      resolution: "2-hourly"
      snapshots: 4380

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      Sec. 2 (Eqs. 6-10) formulates storage with separate power rating H_{i,s} and
      energy level e_{i,s,t}, linked by a fixed duration parameter T_s: "we link the
      energy storage volume to power ratings using a technology-specific parameter T_s
      that describes the maximum duration a storage unit can discharge at full power
      rating." Battery and hydrogen storage are co-optimised. Table C.7 shows
      optimised capacities by technology.
    procedure_notes: >
      Both power and energy capacity co-optimised subject to T_s max-hours constraint
      (Eq. 10). Cyclic state of charge enforced (Eq. 9). Charging/discharging
      efficiencies and standing losses modelled (Eq. 8). Pumped hydro not extendable
      (geographical constraints).
    variant: null
    parameters: {}

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      Sec. 6.1: "we also compare electricity prices in an idealised nodal market by
      using the dual variables of the nodal balance constraints." Figure 5 shows nodal
      price duration curves. Paper discusses negative nodal prices arising from KVL
      constraints (Sec. 6.1): "Negative nodal prices are a consequence of KVL and
      occur when increasing demand at a bus relieves a transmission line."
    procedure_notes: >
      Dual variables of nodal balance constraint (Eq. 23 or variants) read as
      locational marginal prices. Transport model cannot produce negative prices;
      KVL models can. Price duration curves compared across all six flow model
      variants (Figure 5). Price differences across lines used to explain zero-flow
      degeneracy in lossy transport (Figure 11).
    variant: null
    parameters: {}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      Sec. 2 footnote 1: "The annuity factor (1-(1+τ)^{-n})/τ converts the overnight
      investment of an asset to annual payments considering its lifetime n and cost of
      capital τ." Capital costs c* in Eq. 1 are annualised.
    procedure_notes: >
      Standard annuity formula used; specific discount rate values not stated in the
      text (inherits PyPSA-Eur defaults). Technology lifetimes and cost of capital
      taken from the model dataset.
    variant: null
    parameters: {}

