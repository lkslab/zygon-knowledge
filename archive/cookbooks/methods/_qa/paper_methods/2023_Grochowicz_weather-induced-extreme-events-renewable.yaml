paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
tier: 2
model_used: >
  PyPSA-Eur, 181 generation nodes / 90 network nodes, electricity-only, 1-hourly,
  version 0.6.1 with small modifications.
scope: >
  Proposes using electricity shadow prices from a European capacity expansion model
  (run over 40 ERA5 weather years) to identify and classify "system-defining events"
  — multi-day periods that drive renewable infrastructure investment — and compares
  this approach to meteorology-only and load-shedding-based event identification.
methods:
  - slug: weather-year-ensembles
    role: defines
    evidence: >
      "The model is solved for forty individual weather years (July 1980 – June 2020,
      preserving winters)." (Sec. 2.1.2). Each year is solved as a separate
      capacity-expansion optimisation, yielding 40 distinct optimal system designs
      whose shadow prices are the primary analysis object (Sec. 2.2).
    procedure_notes: >
      40 independent annual LP optimisations, one per ERA5 weather year (Jul–Jun
      windows to preserve winters). The 40 separate designs are the basis for
      identifying system-defining events within each year. The authors note that
      single-year optimisations allow higher spatial/temporal resolution than a
      full 40-year joint optimisation, which has only been accomplished at moderate
      resolution elsewhere (Sec. 2.2). Cross-year validation (Approach 3) then runs
      1600 dispatch simulations (all 40×40 combinations of design year × weather year).
    variant: separate-annual-optimisations
    parameters: {years: 40, window: "July–June", era5_period: "1980–2020"}

  - slug: extreme-event-and-dunkelflaute-analysis
    role: defines
    evidence: >
      "In this paper a system-defining event is a period where the incurred electricity
      costs surpass a specified threshold within a limited time frame. We restrict the
      duration of a system-defining event to a maximum of two weeks, and set the minimum
      cost threshold to 100 bn EUR." (Sec. 2.3). The method proposes using shadow prices
      from a capacity expansion model — rather than net load or meteorological proxies —
      as the identifier of system stress events.
    procedure_notes: >
      Threshold-based event selection: sum over all nodes of demand × shadow price ≥
      100 bn EUR over T ≤ 336 hours (Eq. 1). Overlapping events filtered to a disjoint
      set by ordering from shorter/more-expensive to longer events (SI Sec. A.3). Events
      are then extended on either side as long as event-average hourly cost does not
      decrease (SI Sec. A.3). Threshold chosen to yield approximately one event per year
      (~32 events over 40 years), averaging ~7 days in length — matching hydrogen storage
      discharge duration. Weather regimes (Z500 k-means, 4 clusters) and near-surface
      k-means clustering applied to the extracted events (Secs. 2.4–2.5).
    variant: shadow-price-threshold
    parameters: {cost_threshold_bn_eur: 100, max_duration_hours: 336, events_identified: 32}

  - slug: shadow-prices-and-marginal-values
    role: defines
    evidence: >
      "The dual variables corresponding to the constraints ensuring that a fixed demand
      is met at each network node n and timestep t are denoted λ_{n,t} … These dual
      variables — also called shadow prices of electricity — can be interpreted as the
      modelled price of electricity (in EUR/MWh) at the given node and time." (Sec. 2.2).
      The paper's central methodological contribution is using these shadow prices as an
      indicator for system-defining events rather than as an economic price signal per se.
    procedure_notes: >
      Shadow prices derived from the LP dual (Supplementary Sec. A.1 gives formal
      derivation). Congestion rents (dual of line capacity constraints) and value of
      stored energy (dual of inter-hour storage constraints) also extracted and used
      to diagnose roles of transmission and storage during events (Sec. 2.2, SI A.2).
      The paper notes that in a capacity expansion setting shadow prices are driven by
      investment needs rather than marginal operating costs, making them different from
      market prices (Sec. 2.2 and SI A.1).
    variant: investment-driven-shadow-prices
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "We minimise total system costs of the European power system by optimising
      investment and dispatch of electricity generation, storage, and transmission to
      meet prescribed hourly national demand over a year." (Sec. 2.1.2). Each
      single-year optimisation has perfect foresight over the full year.
    procedure_notes: >
      Overnight/perfect-foresight capacity expansion for a 2030 modelling horizon,
      solved separately for each of the 40 weather years. The paper notes "Perfect
      foresight also limits the ability of our model to react realistically to
      multi-week or longer events." (Sec. 4 Discussion). Partial greenfield: existing
      transmission (2019), hydropower and nuclear capacities (2022) are included but
      existing renewables are excluded.
    variant: overnight-perfect-foresight
    parameters: {target_year: 2030, horizon_per_run: "1 year"}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "The model performs a partial greenfield optimisation, i.e. with existing
      transmission network (2019) and capacities of hydropower and nuclear power
      (2022), but without existing renewable capacities." (Sec. 2.1.2).
    procedure_notes: >
      Hydro and nuclear are fixed (non-expandable); transmission can be expanded up
      to 25% beyond current (2019) levels. Solar, onshore wind, offshore wind and
      storage (battery, hydrogen) are greenfield. Biomass is included but non-expandable.
    variant: partial-greenfield
    parameters: {transmission_expansion_cap: "25% above current", nuclear_hydro: "fixed at 2022 capacities"}

  - slug: operational-dispatch-and-rolling-horizon
    role: routine-use
    evidence: >
      "we run a capacity expansion model with one weather year y1, and perform a
      dispatch optimisation over a different weather year y2. Periods of system stress
      in weather year y2 can then be recognised by high load shedding in this dispatch
      optimisation." (Sec. 2.6). This Approach 3 dispatch runs at fixed capacities.
    procedure_notes: >
      1600 dispatch optimisations (40 designs × 40 weather years). Each dispatch run
      adds an artificial high-cost generator at every node to allow load shedding.
      Average load shedding across 40 designs (excluding the in-sample design) gives
      a time series comparable to shadow prices. Used for cross-validation only; Approach
      2 (shadow prices) is the main method.
    variant: dispatch-only-fixed-capacity
    parameters: {runs: 1600, designs: 40, weather_years: 40}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "PyPSA-Eur is configured with high spatial (181 generation and 90 network nodes)
      and temporal resolution (1-hourly)." (Sec. 2.1.2). The network resolution is
      taken from Hörsch & Brown [29] and Frysztacki et al. [34].
    procedure_notes: >
      181 generation nodes and 90 transmission nodes for the European electricity
      network. Resolution is stated but the paper does not re-examine or vary the
      clustering choice — it uses the existing PyPSA-Eur configuration as given.
    variant: null
    parameters: {generation_nodes: 181, network_nodes: 90}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "Transmission can be expanded (overnight) by 25% compared to current levels
      (Fig. 6 in Hörsch & Brown [29])." (Sec. 2.1.2). Co-optimised with generation
      and storage in each annual LP.
    procedure_notes: >
      AC and DC transmission capacity co-optimised subject to a 25% volume cap above
      the 2019 grid. Congestion rents (shadow prices of line constraints) are extracted
      post-solve to diagnose which events drove transmission investment (SI Sec. A.2).
    variant: null
    parameters: {expansion_cap: "25% above 2019 grid"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Weather-dependent power systems time series are mainly generated using the
      open-source software Atlite [15]. In Atlite, 100m wind speeds from ERA5 are
      first extrapolated to turbine hub height using a logarithm law and passed through
      a reference power curve to obtain capacity factors." (Sec. 2.1.1).
    procedure_notes: >
      Atlite used to compute wind capacity factors (Vestas V112 3MW turbine reference
      curve, logarithmic extrapolation from ERA5 10m to hub height) and PV capacity
      factors (ERA5 direct+diffuse shortwave, fixed 35° tilt, no tracking). Demand
      time series generated from historical ENTSO-E data adjusted with heating/cooling
      degree days. These form the hourly inputs to PyPSA-Eur for all 40 years.
    variant: null
    parameters: {wind_turbine: "Vestas V112 3MW", pv_tilt_deg: 35, era5_period: "1980–2021"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "electricity can be stored through hydro reservoirs (non-expandable), battery
      storage and hydrogen storage." (Sec. 2.1.2). The value of stored energy dual
      variables are extracted to examine storage dynamics during system-defining events
      (Sec. 2.2, Fig. 3d, Fig. 4d).
    procedure_notes: >
      Battery and hydrogen storage sized endogenously (energy and power co-optimised).
      Hydro reservoirs fixed at 2022 capacities. The paper uses hydrogen storage discharge
      duration (~7 days) as a calibration anchor for the cost threshold of system-defining
      events. Dual variables of inter-hour state-of-charge linking constraints are read
      as marginal value of stored energy (SI Sec. A.2).
    variant: null
    parameters: {hydrogen_storage_duration_days: "~7 (used as calibration anchor)"}

unmatched_methods:
  - name: "k-means clustering of meteorological fields for event classification"
    evidence: >
      Sec. 2.4–2.5 and Fig. 5–6: Two separate k-means procedures applied — one on
      Z500 geopotential height anomalies to define Euro-Atlantic weather regimes
      (4 clusters, following Cassou [43]), and one on near-surface temperature and
      wind speed fields during system-defining events (4 clusters chosen by silhouette
      score, 14 PCs explaining 56% variance). This is a meteorological clustering
      method applied to power-system outputs, not an energy-system modelling method,
      so no SLUGS.yaml entry fits.
