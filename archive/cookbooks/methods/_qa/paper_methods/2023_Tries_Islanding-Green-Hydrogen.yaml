paper: "2023_Tries_Islanding-Green-Hydrogen.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model (not PyPSA-Eur or PyPSA-Earth); two-location per-country
  greenfield capacity expansion, electricity + hydrogen carriers, hourly dispatch,
  four countries (Germany, Spain, United Kingdom, Australia).
scope: >
  Compares integrated vs islanded electrolyser deployment across a sweep of
  hydrogen demand shares and capital cost advantages for islanded BoP equipment,
  identifying three investment regimes (Integration, Hybrid, Island) and
  quantifying Portfolio and Superiority Benefits.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "We employ a streamlined model using the open-source toolbox PyPSA to
      analyse joint electricity and hydrogen production in individual countries."
      The model has two electricity buses and two hydrogen buses (mainland and
      island), connected by electrolysers, a hydrogen pipeline, batteries, and
      hydrogen cavern storage (Sec. 2 Methods, Figure 1).
    procedure_notes: >
      Three subsystems per country: mainland electricity grid, mainland hydrogen
      grid, and hydrogen island. Conversion assets include integrated electrolysers
      (grid-connected), islanded electrolysers (off-grid), green-fuel turbine,
      battery storage, and large-scale underground hydrogen storage. Pipeline
      connects island H2 bus to mainland H2 bus with capacity- and
      distance-based costs. Country-specific designs: offshore-only wind for
      Germany and Great Britain island locations; submarine pipeline for those
      two, overground for Spain and Australia.
    variant: null
    parameters: {electrolyser_efficiency: "67%", battery_inverter_efficiency: "95%", green_fuel_turbine_efficiency: "60%"}

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      "Hydrogen produced on the island can be transported to the mainland via
      pipelines, with costs calculated based on capacity and distance" (Sec. 2.1
      Model Setup). Pipeline capital costs are 0.226 €/kW/km (overground) and
      0.329 €/kW/km (submarine), sized endogenously to meet hourly hydrogen
      demand (Table A4).
    procedure_notes: >
      A single hydrogen pipeline link from the island H2 bus to the mainland H2
      bus is co-optimised with generation and storage capacity. No electricity
      grid expansion or multi-node electricity network is modelled; spatial
      routing is fixed to two nodes per country. Pipeline compressor capital cost
      4.48 €/kW with 1.7% O&M, 20-year lifetime.
    variant: null
    parameters: {pipeline_overground: "0.226 €/kW/km", pipeline_submarine: "0.329 €/kW/km", compressor: "4.48 €/kW", island_distances_km: "269–1783"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Country-specific weather data for wind and solar generation are prepared
      using the open-source package 'atlite'" (Sec. 2 Methods). Hourly capacity
      factors are spatially aggregated values "with weightings prioritising sites
      with good renewable resources, i.e. assuming renewable resources are
      distributed within a country proportionally to the square of the average
      capacity factor" (Sec. 2.1).
    procedure_notes: >
      Atlite used to derive capacity factor time series for two fixed geographic
      locations per country (mainland and island). Island locations chosen for
      superior renewable resources (e.g., North Sea offshore for Germany and UK,
      remote solar/wind sites for Spain and Australia). No explicit land
      exclusion layer applied; spatial aggregation replaces full spatial
      optimisation.
    variant: null
    parameters: {locations_per_country: 2, tool: "atlite"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model performs greenfield capacity expansion and hourly dispatch in
      systems based on wind and solar power, aiming to minimise annualised system
      costs" (Sec. 2 Methods). Technology costs are "projected for the year 2050"
      (Sec. 2 Methods, Table A3).
    procedure_notes: >
      Single target-year overnight optimisation for 2050; no myopic pathway or
      perfect foresight across multiple periods. All 1800 runs (4 countries × 3
      scenarios × 25 hydrogen demand shares × 6 BoP cost advantage levels) are
      independent single-year greenfield problems.
    variant: overnight
    parameters: {target_year: 2050, total_runs: 1800}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "Rather than use the actual or projected demand for 2050, we instead
      explore the space of possibilities by sweeping the relative shares of
      hydrogen and electricity in final energy demand, going from 100%
      electricity to 100% hydrogen" (Sec. 2.2). Additionally, "we run each
      country, scenario, and hydrogen demand with six levels of these
      BoP-related capital cost advantages, ranging from 0% … to 25%"
      (Sec. 2.2, Table 2).
    procedure_notes: >
      Two-dimensional structured parameter sweep: (1) hydrogen share of final
      energy demand at 25 steps from 0% to 100%, and (2) islanded BoP capital
      cost advantage at 6 levels (0, 5, 10, 15, 20, 25%). Cost advantage applied
      uniformly to wind, solar, electrolysers, and battery inverters on the
      island. Three scenario types (Integration, Island, Optimisation) run for
      each combination. Results compared to identify regime transition points
      (Competitiveness Point and Winout Point).
    variant: structured-grid
    parameters: {hydrogen_share_steps: 25, bop_cost_advantage_levels: 6, scenarios: 3, countries: 4, total_runs: 1800}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      The model incorporates "large-scale underground hydrogen storage" and
      "short-term batteries" sized endogenously (Sec. 2 Methods). The paper
      analyses specific hydrogen storage cost components as a key driver of
      regime transitions: "The Optimisation scenario benefits from synergies
      between the mainland and the island, which reduce the need for hydrogen
      storage" (Fig. 7 caption, Sec. 3.2).
    procedure_notes: >
      Battery storage modelled with separate inverter (400 €/kW, 95% efficiency)
      and battery (60 €/kWh, 95% efficiency) components. Hydrogen cavern storage
      at 75 €/kW, 15-year lifetime. Both energy and power capacity co-optimised.
      Hydrogen storage reduction is identified as one of two mechanisms behind
      the Portfolio Benefit in the Hybrid Regime for Germany.
    variant: null
    parameters: {battery_inverter_cost: "400 €/kW", battery_cost: "60 €/kWh", h2_storage_cost: "75 €/kW"}

