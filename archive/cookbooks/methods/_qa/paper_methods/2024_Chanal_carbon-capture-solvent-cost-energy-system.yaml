paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
tier: 2
model_used: >
  PyPSA-Eur-Sec, extended biomass and technology portfolio fork (humpage/pypsa-eur-sec branch
  "solvent"), 37 nodes, full sector-coupled, 5-hourly temporal resolution, single target year.
scope: >
  Quantifies the effect of carbon capture solvent/sorbent production cost and energy use
  (MEA, KOH, PEI-silica) on technology cost-competitiveness and total European energy system
  cost, across 8 scenario combinations varying fossil fuel use, biomass availability and
  emission target.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "PyPSA-Eur-Sec [22, 23] is an open-source, sector-coupled European energy system
      optimisation model including the power sector, transport (including also international
      shipping and aviation), space and water heating, industry and industrial feedstocks.
      The model minimises total system costs by co-optimising capacity expansion and operation
      of all energy generation and conversion, as well as of storage and transmission of
      electricity, hydrogen and gas." (Sec. 2.2 Model)
    procedure_notes: >
      Uses an extended fork of PyPSA-Eur-Sec with a broader biomass and technology portfolio
      [refs 2, 26]. Solvent and sorbent production chains (MEA, KOH, PEI) are added as
      explicit conversion links with their own energy inputs and costs, isolated from other
      CAPEX/VOM so their effect can be assessed separately. Final energy demands are
      perfectly inelastic; energy carrier production is endogenous.
    variant: null
    parameters: {}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "A 37-node spatial resolution and a 5-hourly temporal resolution over a full year in
      overnight green-field scenarios was used." (Sec. 2.2 Model)
    procedure_notes: >
      37 nodes for all of Europe (including non-EU countries per refs 23, 29). No further
      detail on the clustering algorithm is given.
    variant: null
    parameters: {nodes: "37"}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "A 37-node spatial resolution and a 5-hourly temporal resolution over a full year in
      overnight green-field scenarios was used." (Sec. 2.2 Model)
    procedure_notes: >
      5-hourly snapshots over a full year. No typical-period or TSAM compression mentioned;
      appears to be uniform n-hourly averaging across 8760 hours.
    variant: n-hourly
    parameters: {hours_per_snapshot: "5", year_coverage: "full year"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "A 37-node spatial resolution and a 5-hourly temporal resolution over a full year in
      overnight green-field scenarios was used." (Sec. 2.2 Model). Technology cost values
      for 2040 are used (Sec. 2.2).
    procedure_notes: >
      Single target year (2040) overnight greenfield optimisation; no transition pathway or
      myopic rolling. Technology costs from PyPSA technology data v0.6.0 for the year 2040.
    variant: overnight
    parameters: {target_year: "2040"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "Net-zero and -110% net-negative emissions targets are analysed." (Sec. 2.3 Scenarios).
      Two emission caps are applied as scenario parameters across all 8 scenario combinations.
    procedure_notes: >
      Emission targets are imposed as annual caps (net-zero = 0% relative to baseline;
      net-negative = -110%). Crossed with fossil fuel inclusion/exclusion and two biomass
      availability levels (domestic residues only vs. including imports) to form 8 scenarios,
      each run with optimistic and pessimistic solvent assumptions and with/without L-DAC.
    variant: null
    parameters: {targets: "net-zero and -110% net-negative"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The discount rate is uniform across countries, and set to 7%, except for rooftop solar
      PV and decentral space/water heating technologies, for which it is set to 4%." (Sec. 2.2
      Model). Capital recovery factor applied to CAPEX in LCOC calculation (Eq. 2).
    procedure_notes: >
      Single social discount rate of 7% (4% for rooftop PV and decentral heating). CRF formula
      shown as Eq. 2: CRF = i(1+i)^n / ((1+i)^n - 1). Used both in system optimisation and
      in the standalone LCOC/LCOE cost metrics (Eqs. 1, 3, 4).
    variant: null
    parameters: {discount_rate_default: "7%", discount_rate_rooftop_heating: "4%"}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "transmission is constrained to expand to at most double the total line volume in 2022"
      (Sec. 2.2 Model). A lossy transport model for electricity transmission is used.
    procedure_notes: >
      Transmission capacity co-optimised subject to a volume cap of 2× the 2022 total line
      volume. Lossy transport approximation chosen as suitable for 37-node resolution, citing
      ref [27] (Neumann et al., Applied Energy 2022).
    variant: null
    parameters: {volume_cap: "2x 2022 line volume"}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "A lossy transport model for electricity transmission was used which is suitable at this
      resolution [27]" (Sec. 2.2 Model), citing Neumann et al. [27] on linear power flow and
      transmission loss approximations.
    procedure_notes: >
      Lossy transport approximation (a linearised power-flow variant) applied at 37-node
      resolution. The paper does not describe the formulation in detail beyond citing [27];
      the choice is presented as appropriate for this spatial resolution.
    variant: null
    parameters: {}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "three factors are varied, resulting in 8 main scenario combinations: fossil fuel usage,
      biomass availability and emission target." (Sec. 2.3 Scenarios). Additionally, "an
      optimistic and a pessimistic scenarios represent the lower and the higher bounds for
      costs and energy use" for each solvent/sorbent (Sec. 2.1 Data).
    procedure_notes: >
      8 main scenarios from a 2×2×2 factorial design (fossil/no-fossil × biomass import/no-import
      × net-zero/net-negative). Each of the 8 is run with optimistic and pessimistic solvent
      consumption ranges (MEA 0.27-3.98 kg/tCO2, KOH 0.4-38 kg/tCO2, PEI 2.3-14 kg/tCO2)
      and with L-DAC included/excluded, yielding a substantial ensemble. Primary outputs are
      system cost, LCOC, and energy/material use impacts.
    variant: structured-scenario-grid
    parameters: {
      scenarios: "8 (2x2x2 factorial)",
      mea_consumption_range: "0.27-3.98 kg/tCO2",
      koh_consumption_range: "0.4-38 kg/tCO2",
      pei_consumption_range: "2.3-14 kg/tCO2"
    }

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      PyPSA-Eur-Sec "minimises total system costs by co-optimising capacity expansion and
      operation of all energy generation and conversion, as well as of storage and transmission
      of electricity, hydrogen and gas." (Sec. 2.2 Model). CO2 captured is routed to storage
      or utilisation endogenously.
    procedure_notes: >
      H2 and gas transmission co-optimised as part of the multi-carrier network. CO2 is
      tracked on a shared CO2 accounting bus; captured CO2 can be sequestered (CCS) or used
      as feedstock (CCU). The solvent production chains feed into this carrier network (e.g.
      KOH production yields H2 as a by-product via chlor-alkali process). No explicit
      standalone CO2 pipeline routing description beyond what PyPSA-Eur-Sec includes.
    variant: null
    parameters: {}

unmatched_methods: []
