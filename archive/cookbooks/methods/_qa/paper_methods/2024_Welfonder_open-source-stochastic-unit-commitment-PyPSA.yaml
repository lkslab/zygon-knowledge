paper: "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
tier: 2
model_used: >
  PyPSA library only — a bespoke single-portfolio PyPSA network (waste-to-energy
  plant + BESS + heat storage, single node, hourly, Germany).
scope: >
  Presents an open-source stochastic unit-commitment tool built as modular
  extensions to PyPSA, demonstrated on a small CHP portfolio trading on the
  German day-ahead and aFRR markets under price and heat-demand uncertainty.
methods:
  - slug: unit-commitment-and-ramping
    role: defines
    evidence: >
      "The optimization problem is formulated … as a MILP problem" with binary
      on/off variables, minimum load, start-up/shut-down times and ramping
      constraints for generators and BESS (Sec. 2, Eqs. 1–11). PyPSA's
      'committable' generator components are used as the UC basis.
    procedure_notes: >
      MILP with binary commitment variable x_delta^{t,g}; minimum load and
      maximum power constraints enforced per generator and per BESS; applied to
      a 60 MWth waste-to-energy plant, 6 MW/6 MWh BESS and 10 MW/50 MWh heat
      storage. Solved with PyPSA's standard MILP interface (solver not named).
    variant: milp-with-bess
    parameters: {portfolio: "WtE 15 MW_e + BESS 6 MW/6 MWh + heat storage 10 MW/50 MWh"}

  - slug: stochastic-and-robust-optimisation
    role: defines
    evidence: >
      "To find the optimal UC for an uncertain future, the deterministic model
      … is modified to" a scenario-based stochastic MILP with expected-value
      objective and non-anticipativity (coupling) constraints across scenarios
      (Sec. 2.2, Eq. 12). Uncertain inputs are DAM prices, aFRR prices and
      district heat demand.
    procedure_notes: >
      Two-stage (here multi-stage) scenario-based stochastic program: 1000
      ARIMAX realisations drawn per uncertain variable, reduced to n_clust=5
      clusters via K-means; scenario probabilities set as cluster-membership
      fractions. Non-anticipativity enforced by equality constraints on bid
      decision variables across scenarios (Eqs. 12c and explicit bid-coupling
      constraints). Independent variables assumed across uncertain inputs;
      scenarios combined combinatorially for multi-variable case.
    variant: scenario-based-expected-value
    parameters: {n_samples: 1000, n_scenarios: 5, uncertain_inputs: "DAM price, aFRR price, heat demand"}

  - slug: operational-dispatch-and-rolling-horizon
    role: defines
    evidence: >
      "Using a rolling horizon, also called receding horizon, the optimal UC
      strategy for, e.g., the next 36h is calculated, but is only applied for
      the next hour or the next day, after which the optimal strategy is
      recalculated" (Sec. 2.3). Extended to multistaging aligned with
      market-closure times (aFRR at 09:00, DAM at 12:00, delivery day).
    procedure_notes: >
      Three-stage rolling horizon: Stage 1 before aFRR market closure (highest
      uncertainty, all inputs stochastic); Stage 2 before DAM closure (aFRR
      bids fixed, updated DAM forecasts); Stage 3 at delivery day start
      (deterministic, all auction results known). Optimization horizon 36h,
      applied interval one day (re-optimised at midnight). Each stage runs a
      fresh MILP with updated ARIMAX scenario draws.
    variant: multistage-market-aligned
    parameters: {horizon: "36h", stages: 3, re_optimisation_interval: "daily at midnight"}

  - slug: balancing-and-ancillary-services
    role: defines
    evidence: >
      The aFRR (Automatic Frequency Restoration Reserve) market bidding and
      physical reserve constraints are fully modelled: bid discretisation,
      pay-as-bid clearing, and capacity reservation constraints for both
      generators and BESS (Sec. 2.1.2, Eqs. 6–11 and objective update).
    procedure_notes: >
      Positive and negative aFRR bids at discrete price levels; accepted bids
      determined by binary indicator beta^{t,k} comparing bid price to market
      clearing price. Physical constraints: generator reserve bounded by
      [P_min, P_max] around committed output; BESS reserve requires 1h
      deliverability (German regulation), enforced via state-of-charge
      constraints (Eqs. 10–11). Revenue added to objective as pay-as-bid
      (bid price × accepted volume). German market structure only.
    variant: afrr-day-ahead-cojoint
    parameters: {markets: "DAM (pay-as-clear) + aFRR (pay-as-bid)", country: "Germany"}

  - slug: custom-constraints-with-linopy
    role: extends
    evidence: >
      "PyPSA does not have built-in functionality for stochastic optimization,
      nor for market mechanisms … Several functionalities are added to PyPSA"
      as modular extensions (Sec. 2). The tool is released as open-source
      extensions on GitHub (PyPSA-stochUC).
    procedure_notes: >
      Extensions implemented via PyPSA's extra_functionality hook or equivalent
      modular add-on pattern (paper does not name the hook explicitly but
      describes adding variables and constraints to the PyPSA network object).
      Three modules: market/bidding mechanisms, stochastic scenario coupling,
      rolling-horizon/multistaging. Each module can be used independently.
    variant: market-and-stochastic-extensions
    parameters: {}

unmatched_methods:
  - name: "ARIMAX scenario generation"
    evidence: >
      Sec. 2.2.2 describes ARIMAX (autoregressive integrated moving-average
      with exogenous inputs) time-series models used to generate 1000 price/
      demand realisations, with sinh^{-1} variance stabilisation for market
      prices and sine/cosine exogenous variables for seasonality. This is a
      forecasting/scenario-generation pipeline, not one of the 34 vocabulary
      slugs (closest slug, sensitivity-and-uncertainty-sweeps, does not cover
      forecast-driven scenario generation for stochastic UC).
