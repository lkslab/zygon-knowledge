paper: "2025_Burghardt_material-needs-energy-technologies.pdf"
tier: 2
model_used: >
  PyPSA-Eur, sector-coupled, Germany + direct-link neighbours, single target
  year 2045, greenfield overnight.
scope: >
  Integrates bulk material demand (steel, cement, HVC) and industrial production
  routes endogenously into a sector-coupled energy system optimisation to study
  how energy-material feedbacks affect cost-optimal system design for Germany's
  2045 climate neutrality target.
methods:
  - slug: sector-coupled-network-assembly
    role: extends
    evidence: >
      "We enhance the open-source energy system model PyPSA-Eur with two
      modifications. First, we directly link material demands to energy
      infrastructure expansion. Second, we model industrial processes for bulk
      materials, making production routes and fuel choices endogenous."
      (Sec. I Introduction). The industry module covers steel, cement, HVC and
      process heat at three temperature levels; it is coupled to PyPSA-Eur
      through a shared energy balance for each carrier (Sec. II Methodology).
    procedure_notes: >
      An optimisation model of energy-intensive industry is developed alongside
      PyPSA-Eur. The energy balance for each carrier ensures that generation,
      storage, conversion and transmission must meet exogenous demand plus
      endogenous industrial consumption. Material balances ensure each bulk
      material demand (steel, cement, HVC) is met by industrial production.
      Material demands from technology expansion are annualised by distributing
      them equally over technology lifetimes. Resource caps (biomass, CO2
      storage, waste) are shared between industry and energy system. Capital
      costs of energy technologies exclude the cost of domestically produced
      bulk materials to avoid double-counting.
    variant: energy-material-feedback-loop
    parameters: {domestic_share_scenarios: "0%, 25%, 50%, 75%, 100%", target_year: "2045"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The objective function minimizes annual system costs for expansion and
      operation of technologies, under emission and resource caps, in an
      overnight (no pathway), greenfield (no current technology capacities
      considered) approach for the year 2045." (Sec. II Methodology).
    procedure_notes: >
      Single target year (2045), greenfield (no existing capacities), overnight
      investment — no pathway or myopic rolling horizon. The paper notes in
      Sec. IV that future work could apply the method in a pathway study to
      capture material requirements before 2045.
    variant: overnight-greenfield
    parameters: {target_year: "2045"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The emission limit is set to zero, corresponding to the limit of the
      German climate law for 2045." (Sec. II Methodology). Limits for resource
      consumption and emissions are set jointly for industry and energy system.
    procedure_notes: >
      A zero-emission cap is applied jointly to the industrial and energy system
      sectors; no CO2 price is used — the cap is the binding instrument. Biomass
      and CO2 storage capacity are also subject to shared resource caps.
    variant: null
    parameters: {co2_limit: "0 (net-zero)", scope: "industry + energy system jointly"}

  - slug: import-and-trade-representation
    role: routine-use
    evidence: >
      "Electricity and hydrogen can be exchanged between the countries when
      networks are expanded in the optimization, and hydrogen ship imports are
      enabled at a price of 84 €/MWh." (Sec. II Methodology). Results show
      increasing H2 ship imports (up to 36 TWh) as domestic material share rises
      (Sec. III B).
    procedure_notes: >
      H2 ship imports enter at an exogenous price of 84 €/MWh from outside the
      modelled region and do not induce domestic material demand (material cost
      reflected in the import price). Electricity and hydrogen cross-border
      exchange is endogenously expanded within the optimisation for Germany and
      directly linked countries.
    variant: null
    parameters: {h2_import_price: "84 €/MWh"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      Six scenarios are run varying the domestic production share of bulk
      materials: 0%, 25%, 50%, 75%, 100% domestic, plus an additional
      increased-material reference (100%, not linked). Results are compared
      across scenarios in Figs. 2–5 (Sec. III).
    procedure_notes: >
      The sweep is a structured one-at-a-time variation of a single parameter
      (domestic production share, stepped at 0/25/50/75/100 %). An additional
      scenario (100%, not linked) separates the effect of increased material
      demand from the feedback linkage, allowing isolation of the technology
      preference shift. Each scenario is a full optimisation run.
    variant: structured-scenario-sweep
    parameters: {parameter: "domestic production share", values: "0%, 25%, 50%, 75%, 100%, 100%-not-linked"}

unmatched_methods:
  - name: "endogenous-material-factor-linking"
    evidence: >
      The paper's novel contribution is introducing per-technology annualised
      material demand factors (steel, cement, HVC per MW of installed capacity)
      as endogenous constraints inside the optimisation, so that technology
      expansion directly triggers industrial production requirements. This is
      distinct from sector-coupled-network-assembly (which describes the
      multi-carrier bus/link structure) — it is a new constraint type that
      couples investment variables to material balance constraints via
      technology-specific intensity coefficients. No existing slug captures
      the concept of endogenous material-intensity-factor constraints on
      investment decisions. (Sec. II Methodology; material factors shown in
      appendix.)
