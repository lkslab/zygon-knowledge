paper: "2025_Franken_Geothermal-Market-Integration.pdf"
tier: 1
model_used: >
  PyPSA-Eur, sector-coupled, 72 nodes, 3-hourly resolution, electricity-only +
  multi-sector (heat, transport, industry, agriculture), single target year
  (carbon-neutral, net-zero).
scope: >
  Analyses market integration pathways for Enhanced Geothermal Systems (EGS)
  in a carbon-neutral European energy system across varying drilling cost
  reduction scenarios, identifying two deployment phases and spatial distribution
  of market opportunities.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "We conduct our analysis in the sector-coupled model of the European-level
      energy system PyPSA-Eur [21]. It optimises investment and operation of
      energy generation, transport, storage and conversion over a full year with
      a three-hourly resolution, covering demands from the power, heat, transport,
      industry and agriculture sectors while maintaining a neutral carbon balance."
      (Methods: Energy System Model)
    procedure_notes: >
      Standard PyPSA-Eur sector-coupled assembly. EGS added as a new technology
      in three modes: electricity only (ORC), combined low-grade heat and power
      (ORC + heat exchanger), and low-grade heat only (heat exchanger only).
      EGS connected to district heating and low-temperature industrial heat
      buses. Fischer-Tropsch waste heat also available as district heat source.
    variant: null
    parameters: {nodes: 72, temporal_resolution: "3h", sectors: "power, heat, transport, industry, agriculture"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model faces the conflict between the single-year optimisation horizon
      and the need to account for the value of technologies accrued over their
      lifetimes, which exceed a single year many times over [21]. Therefore, the
      model is provided with annuitised yearly payments using the annuity factor"
      (Eq. 1, Methods: Energy System Model).
    procedure_notes: >
      Single-year overnight optimisation for a carbon-neutral target year.
      Capital costs annuitised using annuity factor with 7% discount rate and
      technology-specific lifetimes. No transition pathway modelled — authors
      explicitly note this as a limitation, choosing carbon neutrality as the
      common denominator framing.
    variant: overnight
    parameters: {discount_rate: "7%", horizon: "single target year (carbon-neutral)"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The model is provided with annuitised yearly payments using the annuity
      factor α = [1 − (1 + τ)^−n] / τ where n is an asset's lifetime and τ is
      the discount rate, assumed to be 7% throughout the study." (Eq. 1,
      Methods: Energy System Model). Yearly cost is (α + FOM) · CAPEX (Eq. 2).
    procedure_notes: >
      Uniform 7% discount rate across all technologies and regions. Annuity
      factor applied to CAPEX to convert to annual cost. FOM added as a
      percentage of CAPEX.
    variant: null
    parameters: {discount_rate: "7%"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "To reflect the energy system's geographical context in terms of renewable
      potentials, energy transport and demand, the model represents Europe in
      72 zones." (Methods: Energy System Model).
    procedure_notes: >
      72-zone representation of Europe. Each zone assigned atlite-based weather
      time series for renewable capacity factors. EGS geological suitability
      (1°×1° gridded data from Aghahosseini & Breyer 2020) aggregated to model
      regions by area-weighted averaging of heat potential.
    variant: null
    parameters: {nodes: 72}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "It optimises investment and operation of energy generation, transport,
      storage and conversion over a full year with a three-hourly resolution"
      (Methods: Energy System Model).
    procedure_notes: >
      3-hourly snapshots for a full year (8760/3 = 2920 time steps). No
      time-series aggregation or typical periods applied — full 3-hourly year.
      Paper notes that 3h resolution captures EGS-relevant flexible operation
      dynamics.
    variant: n-hourly
    parameters: {resolution: "3h", snapshots: 2920}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Suitability for EGS is highly heterogeneous across Europe. We use data
      from [2] to represent the spatial aspects of geological suitability in
      the model … the 1°×1° gridded data … estimates, for each square, the
      cost-optimal EGS depth by optimising the trade-off between higher costs
      through deeper drilling and lower surface plant costs achieved by higher
      temperatures." (Methods: Data on Geological Suitability). Renewable
      capacity factor time series from atlite [22].
    procedure_notes: >
      EGS potential from Aghahosseini & Breyer (2020), gridded at 1°×1°,
      aggregated to 72 model regions by heat-potential-weighted average of
      drilling CAPEX. Renewable potentials (wind, solar) computed with atlite.
      Drilling costs vary by region to reflect geological conditions; relative
      magnitudes preserved across cost reduction scenarios.
    variant: null
    parameters: {}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "It optimises … while maintaining a neutral carbon balance." (Methods:
      Energy System Model). The carbon-neutrality constraint is the binding
      policy instrument throughout all scenarios.
    procedure_notes: >
      Net-zero carbon balance enforced as an annual emissions cap at zero.
      No explicit carbon price — the shadow price of the CO2 constraint is
      implicit. All scenarios share this constraint; the paper notes that
      results are less relevant for the current (non-carbon-neutral) system.
    variant: emissions-cap
    parameters: {co2_budget: "net-zero"}

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "A secondary predictor is the marginal price of electricity, with a
      correlation of around 0.4. High marginal prices are partially caused by
      low renewable capacity factors" (Spatial Aspects of EGS Adoption).
      "For the rows representing electricity and district heat marginal price,
      the values refer to marginal prices in a system without EGS." (Figure 6
      caption).
    procedure_notes: >
      Nodal marginal prices for electricity and district heat are read from LP
      dual variables of the dispatch optimisation in a counterfactual
      (EGS-free) model run. These prices are used as predictors in a Pearson
      correlation analysis against regional EGS adoption across scenarios.
      Marginal prices are not corrected for snapshot weightings (not mentioned).
    variant: null
    parameters: {}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "In the following, we consider three sensitivities … (i) test increased
      and decreased costs of renewable generation by 20%, (ii) vary the district
      heating rollout, and (iii) disable the system's capacity to utilise waste
      heat for district heating. We further investigate the impact of (iv)
      enabling flexible operation for EGS and (v) the role played by transmission
      network capacity expansion." (Sensitivities section; Table A.1).
    procedure_notes: >
      One-at-a-time sensitivity sweeps. Five sensitivity dimensions: renewable
      cost (±20% CAPEX), district heating rollout (today's level / doubled
      progress / 30% / 60% of urban demand), waste heat (Fischer-Tropsch
      deactivated), flexible EGS operation (reservoir-as-storage), and
      transmission capacity expansion (+12.5% and +25% line volume). Base cases:
      heat-generating EGS at 40% cost level, electricity-generating EGS at 20%.
    variant: one-at-a-time
    parameters: {renewable_cost_variation: "±20%", transmission_expansion: "12.5% and 25% additional GWkm"}

  - slug: endogenous-technology-learning
    role: extends
    evidence: >
      "We use a standard formulation of technology learning, where a learning
      rate quantifies the technology cost reduction per doubling of installed
      capacity of that technology … Starting with the power law equation C(x) =
      C₀ · x^−b … we obtain the learning rate from LR = 1 − 2^−b." (Eqs. 3–4,
      Methods: Technology Learning Rate). "We find that the learning rate to be
      around 20%" (Heat Generating EGS as Market Entry).
    procedure_notes: >
      Learning rate is NOT endogenous inside the optimisation; instead it is
      computed post-hoc from model outputs. For each pair of cost reduction
      levels (y), the model is run separately and the installed EGS capacity Cy
      is recorded. The learning exponent b = ln(1/y) / ln(Cy/C0) (Eq. 6) is
      then derived from successive model runs, and the implied learning rate LR
      follows from Eq. 4. This is an ex-post technology learning analysis, not
      a within-optimisation learning curve. Initial capacity C₀ taken from the
      run without cost reductions (cost reduction factor = 1).
    variant: ex-post-learning-rate-estimation
    parameters: {learning_rate_found: "~20% (25% for early phase)", initial_capacity_anchor: "model run at factor 1"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "For heat (co-)generating EGS at low cost reduction, hot water storages
      are initially added to the model to provide flexibility for the more
      base-load operation of EGS." (Results). Flexible EGS sensitivity:
      "we additionally treat the geothermal reservoir as storage … the reservoir
      can accommodate a build-up of 24 hours, which can be discharged through a
      generation surplus of up to 25%." (Methods: Modelling Enhanced Geothermal
      Systems).
    procedure_notes: >
      Hot water tanks (short-duration thermal storage) co-optimised with EGS.
      Battery and H2 storage also co-optimised. Flexible EGS adds a reservoir
      storage component: 24h charge capacity, 25% discharge surplus above
      nameplate capacity. Standard PyPSA-Eur storage sizing (energy and power
      independently optimised for batteries; max_hours-style constraints for
      hot water tanks).
    variant: null
    parameters: {flexible_egs_reservoir: "24h build-up, 25% discharge surplus"}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "For the transmission grid, we have opted, based on the small impact
      observed in our sensitivity analyses, to prohibit the model from expanding
      the line capacities in an effort to reduce computational overhead."
      (Methods: Energy System Model). Sensitivity: "We consider the impact of a
      12.5% and 25% expansion in additional volume, measured in GWkm, on EGS
      capacity." (Table A.1).
    procedure_notes: >
      Base case: no transmission expansion (fixed at existing network).
      Sensitivity cases allow +12.5% and +25% additional line volume (GWkm).
      Decision to fix transmission in base case was motivated by small sensitivity
      effect and computational overhead reduction.
    variant: fixed-network
    parameters: {base_case: "no expansion", sensitivity: "+12.5% and +25% GWkm"}

unmatched_methods: []
