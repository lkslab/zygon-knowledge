paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
tier: 2
model_used: >
  Bespoke PyPSA model; single-node copper-plate national model for Denmark and Spain,
  electricity + heating sectors, hourly resolution, one weather year (2015 data).
scope: >
  Assesses the system-level role of Power-to-Heat-to-Power Storage (PHPS / Carnot
  batteries) in wind-dominated (Denmark) and solar-dominated (Spain) sector-coupled
  energy systems, comparing individual vs district heating configurations and waste-heat
  recovery options.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "The model developed using the open-source software PyPSA [34], simulates the
      operation of a single European country energy system of a full year with hourly
      resolution under perfect foresight. The system incorporates both power and heating
      sectors, each composed of various elements such as generators, demand loads and
      energy storage units." (Sec. 2 Methodology). The heating sector is fully
      electrified; heat pumps and resistance heaters link the electricity and heat buses;
      PHPS waste heat is routed to the heating bus.
    procedure_notes: >
      Two buses: AC Electrical and Heating. Generators (wind, solar PV, OCGT) and
      electrical storages (Li-ion, PHPS) attach to the electrical bus. Heat pumps and
      resistive heaters act as links between buses with fixed efficiencies. CTES and ITES
      thermal stores attach to the heating bus. PHPS waste heat from the H2P converter
      is an additional heat input to the heating bus, with a fixed heat-to-power ratio
      (H2P efficiency = 0.3 assumed constant). Each country is a single copper-plate node
      with no inter-country transmission.
    variant: null
    parameters: {countries: "Denmark, Spain", sectors: "electricity + heating", nodes: 1}

  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      "The capacities of the components (e.g., generators or energy storages) and their
      dispatch are jointly optimized to meet the demands, while minimizing the annualized
      total system cost." (Sec. 2). The paper independently sizes P2H charging power,
      H2P discharging power, and thermal energy capacity of PHPS, and separately sizes
      Li-ion AC-DC converter power and energy capacity; storage duration is an output.
      "The possibility of decoupling charging and discharging power capacities, allows
      the system to invest in higher charging power and energy capacities, taking advantage
      of their relatively low cost, while reducing the discharging power." (Sec. 3.1).
    procedure_notes: >
      Three independent cost components for PHPS: P2H converter (€/kWel charge), H2P
      converter (€/kWel discharge), and thermal energy storage (€/kWh). Li-ion battery
      modelled with separate AC-DC converter cost (169 €/kWel) and energy storage cost
      (150 €/kWh). Optimal discharge duration for PHPS in wind-dominated Denmark
      decentralized scenario: ~42 h. Results expressed in "average hourly load" (av.h.l)
      metric to emphasize long-duration role. ITES capacity is capped by a maximum
      (Eq. A.7) to prevent it acting as seasonal storage.
    variant: decoupled-charge-discharge-power
    parameters:
      PHPS_P2H_cost: "88 €/kWel"
      PHPS_H2P_cost: "1000 €/kWel"
      PHPS_energy_cost: "10 €/kWh"
      PHPS_H2P_efficiency: "0.30"
      PHPS_standing_loss: "5 %/day"
      Li_ion_converter_cost: "169 €/kWel"
      Li_ion_energy_cost: "150 €/kWh"
      CTES_cost: "0.6 €/kWh"
      ITES_cost: "20 €/kWh"
      discount_rate: "7 %"
      target_year: 2030

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model developed using the open-source software PyPSA [34], simulates the
      operation of a single European country energy system of a full year with hourly
      resolution under perfect foresight." (Sec. 2 Methodology).
    procedure_notes: >
      Single-year overnight optimisation for 2030 technology costs; capacities and
      dispatch co-optimised simultaneously over all 8760 hours. No myopic or
      multi-period investment pathway. The cost assumptions correspond to projected 2030
      values from PyPSA technology-data.
    variant: overnight
    parameters: {target_year: 2030, horizon_type: "overnight"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "A key constraint in the optimization is the limitation of CO2 emissions to 5% of
      the 1990 values for each country." (Sec. 2). The shadow price µCO2 is obtained from
      the CO2 constraint dual (Appendix A, Eq. A.6).
    procedure_notes: >
      Annual CO2 emissions cap derived per country: 7 Mt/yr for Spain, 2 Mt/yr for
      Denmark. Specific emissions εs in CO2-tonne/MWhth applied to OCGT dispatch;
      generator efficiency ηs,t included in emission accounting. Shadow price of CO2
      constraint is reported as the CO2 price that would be needed to achieve the cap.
    variant: annual-cap
    parameters:
      CO2_cap_fraction_of_1990: "5 %"
      CO2_cap_Spain: "7 Mt/yr"
      CO2_cap_Denmark: "2 Mt/yr"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "In this section, we aim to assess the robustness of our results and determine
      whether any uncertain techno-economic assumptions are hindering PHPS feasibility."
      (Sec. 4 Sensitivity Analysis). Six parameters are swept one at a time for the
      wind-dominated system; results for solar-dominated included in Appendix B (Fig. B.4).
    procedure_notes: >
      One-at-a-time (OAT) sensitivity over: (a) PHPS cost per energy capacity CPE
      (€/kWh), (b) standing losses (%/day), (c) cost per discharge power CPPdisch (€/kW),
      (d) cost per charge power CPPch (€/kW), (e) H2P conversion efficiency (%), and
      (f) Li-ion battery cost variation (relative to 2030 reference). Performed for
      wind-dominated system across four scenario lines (decentralized/centralized × no
      waste heat/waste heat). Solar-dominated results in Fig. B.4. Key finding: CPE must
      be ≤10 €/kWh for PHPS viability; ≤~3 €/kWh when competing with CTES.
    variant: one-at-a-time
    parameters:
      parameters_swept: 6
      primary_location: "wind-dominated (Denmark)"
      secondary_location: "solar-dominated (Spain, Appendix B)"

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "𝜆𝑡 is the Lagrange multiplier, indicating the marginal price of the energy carrier
      at each timestep." (Appendix A, Eq. A.1). "The shadow price for the CO2, µCO2, is
      obtained from this constraint, representing the price of CO2 that should be added
      to obtain a system with the required emissions." (Appendix A, Eq. A.6).
    procedure_notes: >
      Dual variables extracted for the electricity balance constraint (𝜆𝑡, hourly marginal
      prices) and the CO2 cap constraint (µCO2, carbon shadow price). Used to interpret
      cost structure and CO2 price implications rather than as the primary result metric.
    variant: null
    parameters: {}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The financial discount rate to annualize components cost is 7 %." (Sec. 2,
      Table 1 caption). Capital costs are annualised using lifetime and discount rate for
      each technology (Table 1 lists FOM and lifetime per component).
    procedure_notes: >
      Single uniform discount rate of 7% applied to all technologies. Annualised
      investment cost cs in the objective function (Eq. A.2) is derived from overnight
      capital cost, lifetime, and discount rate (standard capital recovery factor). FOM
      (% of investment per year) added separately. Technology lifetimes range from 10 y
      (Li-ion converter) to 40 y (solar PV).
    variant: single-rate
    parameters: {discount_rate: "7 %"}

