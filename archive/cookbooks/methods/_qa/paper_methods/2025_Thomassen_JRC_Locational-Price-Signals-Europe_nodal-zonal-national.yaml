paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
tier: 2
model_used: >
  Bespoke PyPSA model built with PyPSA-Eur workflow, 1024 nodes (k-means clustering of
  substations), electricity-only, hourly resolution for operational stages, 2013 climate
  year, target years 2030 and 2040.
scope: >
  Compares three European wholesale market clearing resolutions (Status Quo zonal,
  101-zone Multi Split, and nodal LMP) combined with or without locational investment
  signals, assessing system cost, consumer cost, security of supply, and renewable
  profitability for 2030 and 2040.
methods:
  - slug: zonal-nodal-and-redispatch
    role: defines
    evidence: >
      "We rely on a 1024 node model... For the zonal scenarios, representations of zonal
      market configurations are generated, which are cleared using a representation of
      flow-based market coupling (FBMC). In a second step, redispatch optimization is
      performed to achieve a physically feasible dispatch." (Sec. 3 Methodology). Three
      market configurations are explicitly built and compared: Status Quo (current bidding
      zones), Multi Split (101 zones via k-means), and Locational (1024-node LMP). The
      redispatch optimizer minimises cost and volume jointly (Sec. 3.4).
    procedure_notes: >
      Zonal dispatch uses flow-based market coupling with PTDFs and CNECs; an optimized
      GSK calculation predicts per-hour nodal contributions to net position changes (Sec.
      3.3.1). Redispatch minimises a weighted sum of cost and volume (penalty factor beta
      exceeds max marginal-cost spread). Cross-zonal countertrading capped at 30% of all
      remedial actions (Sec. 3.4.1). LMP runs require only the market dispatch stage —
      no redispatch needed. Load shedding under zonal runs triggers grid reserve
      procurement via a secondary redispatch-based investment optimization.
    variant: fbmc-plus-redispatch-vs-lmp
    parameters:
      nodes: 1024
      zonal_zones_multi_split: 101
      flow_reliability_margin: "10% of thermal rating"
      cross_zonal_redispatch_cap: "30% of all remedial actions"
      weather_year: 2013
      target_years: "2030, 2040"

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "The PyPSA model uses energy balances for various components, such as buses,
      generators, storage units, lines and links, and determines the least-cost dispatch
      through linear optimization." (Sec. 3). PTDFs are used explicitly for FBMC: "The
      impact of these flows on the critical network elements with contingencies (CNECs)
      is calculated with the help of zonal power transfer distribution factors (PTDFs)."
      (Sec. 3.3).
    procedure_notes: >
      DC/linearised OPF used throughout — for the nodal LMP market dispatch and for
      computing PTDFs underpinning the FBMC domains. Kirchhoff conditions enforced at
      node level in the Locational scenario. Dynamic line rating applied using standard
      PyPSA-Eur functionality with a 50% capacity uplift cap (Sec. 3.2.6.1).
    variant: null
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "For each regulatory scenario, the grid expansion needs are determined individually...
      All AC and DC lines are considered as expandable, taking into consideration the
      standard PyPSA-Eur cost assumptions." (Sec. 3.2.6.1). Three expansion levels are
      assessed: system-optimal, capped at 40%, capped at 20% of initial MWkm per country.
    procedure_notes: >
      Grid expansion co-optimised with dispatch in the investment model. Country-level
      MWkm cap applied for constrained scenarios; cross-border capacity further bounded
      by the system-optimal expansion level of the constrained country (Eq. in Sec.
      3.2.6.1). HVDC candidate projects sourced from TYNDP and national NDPs.
    variant: volume-capped
    parameters:
      cap_variants: "system-optimal, 40%, 20% of initial country MWkm"

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "We rely on a 1024 node model generated with the standard PyPSA-Eur workflow –
      which uses a k-means clustering algorithm based on the physical location of the
      substations." (Sec. 3). The Multi Split scenario uses the same clustering
      functionality: "These zones have been generated through the PyPSA network
      clustering functionality using a k-means clustering algorithm." (Sec. 3.1).
    procedure_notes: >
      Full model is 1024 nodes (k-means on substation locations). The 101-zone Multi
      Split is generated by applying PyPSA's clustering to the same network. Country load
      curves distributed inside each cell by GDP and population (citing Hörsch et al.,
      2018). The investment model for renewables uses a time-reduced version of the full
      grid model.
    variant: k-means-substation
    parameters:
      nodes: 1024
      zones_multi_split: 101

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "In every market setting, grid infrastructure generates revenue for the TSO. In
      the zonal scenarios, congestion rents are generated when flows occur between
      bidding zones with different prices... In the Locational scenario, congestion
      revenue is further generated on each connection between two nodes." (Sec. 3.2.6.2).
      Nodal prices (LMPs) are the core output used to assess consumer cost changes,
      producer profits, and CfD strike-price calculations throughout Sec. 4.
    procedure_notes: >
      Dual variables of the dispatch LP read as zonal or nodal prices depending on
      scenario. CfD strike prices computed ex-post from annuitised investment cost and
      realised hourly production at local price (Eq. in Sec. 3.2.2). Consumer costs
      distributed geographically to 1024 cells. Market values of renewables compared
      across scenarios to assess merchant-tail risk.
    variant: null
    parameters: {}

  - slug: price-formation-and-scarcity-rents
    role: canonical-use
    evidence: >
      "We further assume that energy production is only remunerated for as long as the
      market price is positive" (Sec. 3.2.2). The paper's central finding is that zonal
      market clearing produces systematically wrong price signals for flexibility,
      causing storage to operate against system needs: "Storage units also engaged in a
      charging process... while the system actually needed them to discharge." (Sec. 4.2).
      Revenue sufficiency for dispatchable capacity is handled outside the market via
      grid reserves and assumed capacity markets (Sec. 3.2.3, 3.2.5).
    procedure_notes: >
      No scarcity pricing assumed in market — adequate capacity is procured exogenously
      to ensure market clears. Revenue gap for dispatchable assets assumed covered by
      capacity markets or scarcity pricing from marginal under-investment. CfDs settle
      against local market prices, including negative-price hours where CfD income is
      zero. Congestion rents redistributed to consumers via lowered grid charges.
    variant: null
    parameters: {}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "For the zonal market designs (Status Quo and Multi Split), we applied a WACC of
      7%... For the LMP case, we used an 8% WACC estimate." (Sec. 3.2.3). CfD strike
      prices are derived from annuitised investment cost: "annuity_g being calculated
      from the annuitized investment cost and the fixed operation and maintenance cost."
      (Sec. 3.2.2).
    procedure_notes: >
      Technology- and scenario-specific WACC: 7% for zonal scenarios (citing French and
      Belgian CONE reports), 8% for LMP (citing PJM and ERCOT Brattle reports), to
      reflect higher merchant risk in nodal markets. Break-even hurdle rate increases
      computed separately (Table 3) for sensitivity analysis on renewable risk.
    variant: scenario-differentiated-wacc
    parameters:
      wacc_zonal: "7%"
      wacc_lmp: "8%"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "We further assess three different levels of grid expansion." (Sec. 3.1). A
      sensitivity on the auction effectiveness parameter is reported in Sec. 4.5:
      "Finally, we assess the impact of the auction effectiveness on the final results.
      As indicated in section 3.2.1, we assume an efficiency of 60% as the standard
      value."
    procedure_notes: >
      Two structured sweeps: (1) three grid expansion levels (system-optimal, 40% cap,
      20% cap) crossed with three market scenarios and two target years — approx. 18
      combinations; (2) auction effectiveness varied in 20% steps (0%, 20%, 40%, 60%,
      80%) to test sensitivity of system cost savings and renewable siting. No Latin
      hypercube or Monte Carlo — all one-at-a-time.
    variant: one-at-a-time
    parameters:
      auction_effectiveness_base: "60%"
      auction_effectiveness_range: "0%-80% in 20% steps"
      grid_expansion_variants: "system-optimal, 40%, 20% of initial MWkm"

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "A similar constraint was added for storage capacity to achieve deployment in line
      with the Impact Assessment (European Commission, 2024)." (Sec. 3.2.3). Storage
      operation is a central result variable: "storage operation was found to operate
      regularly against the system needs" (Sec. 4.2) and "profits of storage operators
      are increased in every configuration of the Locational scenario" (Sec. 4.4).
    procedure_notes: >
      Storage capacity targets set exogenously per the EC 2040 Impact Assessment;
      investment model places them locationally (nodal in Locational, zonal otherwise).
      Storage dispatch optimised in the hourly market dispatch. Suboptimal storage
      operation under zonal pricing identified by comparing market positions against a
      reference LMP solve of the same system.
    variant: null
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Based on this model, we build representations of the European system in 2030 and
      2040, in line with the Impact Assessment for the proposed 2040 target." (Sec. 3).
      Investment decisions are made for each target year snapshot separately; no
      multi-period optimisation is described.
    procedure_notes: >
      Overnight/greenfield investment for each target year independently. Renewable
      capacity targets and storage targets sourced from EC 2040 Impact Assessment.
      Existing nuclear receives lifetime extension (cost-based CfD). No myopic pathway
      or perfect-foresight multi-period model — each year solved as a standalone
      investment problem.
    variant: overnight
    parameters:
      target_years: "2030, 2040"

unmatched_methods:
  - name: "flow-based-market-coupling"
    evidence: >
      The paper implements and extends FBMC (Sec. 3.3) including PTDFs, CNECs, RAM
      calculations, and an optimized GSK method (Sec. 3.3.1). This is a market clearing
      mechanism rather than a modelling method in the SLUGS vocabulary. The closest
      slug is zonal-nodal-and-redispatch which covers the broader zonal/nodal choice,
      but FBMC as a specific cross-zonal capacity allocation method with GSK optimisation
      is an independently implemented procedure that does not map cleanly to any single
      slug.
