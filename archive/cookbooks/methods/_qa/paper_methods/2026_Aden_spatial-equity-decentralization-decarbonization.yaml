paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
tier: 2
model_used: >
  PyPSA-Eur, 37 nodes, electricity-only, 1h resolution, single weather year (2013),
  projected 2050 loads and technology costs.
scope: >
  Investigates the trade-off between decarbonisation and spatial equity in the European
  electricity system using a novel load-weighted renewable capacity constraint (K-parameter)
  that enforces decentralisation across 105 scenarios spanning 14 decarbonisation levels
  and 8 decentralisation levels.
methods:
  - slug: cost-allocation-and-equity-metrics
    role: extends
    evidence: >
      The paper introduces the Standard Deviation of Nodal Renewable Capacity per Load
      (SDRCL) as a spatial equity metric, and the K-constraint (Eq. 7) as a linear
      load-weighted renewable capacity bound: (1/K)·ω_n·R_total ≤ R_cap,n ≤ K·ω_n·R_total.
      "A low value of SDRCL indicates that the renewable capacity is more evenly distributed
      across the nodes relative to their load." (Sec. 2.4)
    procedure_notes: >
      SDRCL (Eq. 9) is the primary equity metric; calculated post-optimisation for each of
      105 networks. The K-parameter scales the decentralisation constraint proportionally to
      total renewable deployment, avoiding implicit tightening of the decarbonisation target.
      K ∈ {∞, 7, 6, 5, 4, 3, 2, 1} crossed with 14 decarbonisation levels C ∈ {0%, 10%,
      ..., 100%}. Cost-equity trade-off is quantified as equity benefit vs. cost premium
      relative to K=∞ (Table 1).
    variant: load-weighted-spatial-equity
    parameters: {K_levels: "8 (∞,7,6,5,4,3,2,1)", decarb_levels: "14", scenarios: "105"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      Decarbonised scenarios are defined by adding a CO2 emissions cap: "total emissions_C ≤
      (1−C)·baseline emissions ↔ µ_C" (Eq. 5, Sec. 2.3). The dual variable µ_C is
      interpreted as the carbon price at each decarbonisation level.
    procedure_notes: >
      A baseline is first optimised without CO2 constraint, then 13 additional systems each
      enforce a fractional emissions cap at levels C ∈ {10%, 20%, ..., 100%}. The shadow
      price µ_C of the CO2 constraint is reported across scenarios.
    variant: emissions-cap
    parameters: {decarb_levels: "14 including baseline", C_range: "0%–100%"}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      The dual variable λ_n,t of the nodal load balance constraint (Eq. 4) "can be interpreted
      as the shadow price, or marginal price of electricity in node n at time t." The mean
      marginal demand-weighted price and LCOE are compared across scenarios (Fig. 7, Sec. 3.2).
    procedure_notes: >
      KKT multipliers are read from the solved LP for both the nodal balance (λ, electricity
      price) and the CO2 constraint (µ, carbon price). Scarcity rents are computed as the
      divergence between LCOE and mean marginal demand-weighted price. Analysis tracks how
      dominant contributors to scarcity rents shift from fossil to renewable/storage as
      decarbonisation increases (Sec. 3.3).
    variant: null
    parameters: {}

  - slug: price-formation-and-scarcity-rents
    role: canonical-use
    evidence: >
      "The mean marginal electricity price initially decreases during early decarbonisation
      due to merit-order effects associated with low-marginal-cost renewable generation.
      However, at high decarbonisation levels both marginal prices and total system costs
      increase rapidly as storage, transmission, and renewable overcapacity become dominant
      balancing mechanisms." (Sec. 3.2). Scarcity rents manifest when "the optimizer ideally
      would increase capacity to meet demand, but is constrained by a binding capacity
      constraint." (Sec. 3.3)
    procedure_notes: >
      Scarcity rents are identified via divergence between LCOE (system cost / total generation)
      and mean demand-weighted marginal price (Fig. 7). The paper tracks how dominant
      contributors shift from fossil capacity limits to renewable/storage at the 80–90%
      decarbonisation transition.
    variant: null
    parameters: {}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The study uses a clustered 37-node representation of the European transmission system
      with hourly temporal resolution and projected 2050 electricity demand. The reduced
      spatial resolution was chosen to enable large-scale scenario exploration while preserving
      continental-scale transmission structure." (Sec. 2.1)
    procedure_notes: >
      PyPSA-Eur's built-in clustering is used to reduce the full network to 37 nodes. The
      paper cites prior work (ref [20]) showing relatively small sensitivity to node count
      changes at comparable resolutions.
    variant: null
    parameters: {nodes: "37", AC_lines: "51", HVDC_links: "43"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      The model is a single target-year (2050) overnight optimisation: "projected 2050
      loads and technology costs" (Abstract). No transition pathway or myopic rolling
      investment is mentioned; cost assumptions are fixed externally from DEA catalogues
      and IEA data (Sec. 2.2).
    procedure_notes: >
      Greenfield expansion (plus brownfield existing fleet that cannot expand fossil) for
      a single 2050 snapshot. Sector coupling and transition pathways are explicitly noted
      as "beyond the scope of this paper" (Sec. 2.2).
    variant: overnight
    parameters: {target_year: "2050"}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "fossil-based generation technologies are not allowed to expand their capacity"
      (Sec. 3.1). The baseline precompiled network comes with existing capacities preloaded;
      only renewables, storage, and transmission can be expanded.
    procedure_notes: >
      Existing fossil fleet is carried into the model with fixed (non-expandable) capacity.
      The constraint is structural: fossil capacity is treated as committed and only renewable
      plus storage technologies are free to expand. No age-based retirement vintaging is
      implemented; it is a fixed brownfield constraint on fossil expansion.
    variant: null
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "Balancing is primarily achieved through transmission expansion and battery storage
      deployment" (Sec. 3.1). "The total transmission capacity sees a large increase at very
      high levels of decarbonization as the system relies more and more on non-dispatchable
      renewable generation." (Sec. 3.2)
    procedure_notes: >
      Transmission capacity (AC lines and HVDC links) is co-optimised with generation and
      storage capacity in the LP. Both AC and HVDC are reported separately; AC capacity
      increases substantially with decarbonisation while HVDC contribution stays roughly constant.
    variant: null
    parameters: {}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      Battery and hydrogen storage are sized endogenously, with energy and power capacity
      separated and costed independently (Appendix A, Table A.3). "Above approximately 90%
      decarbonisation, storage deployment accelerates sharply." (Sec. 3.2)
    procedure_notes: >
      Battery (cells + inverter), hydrogen (tank + electrolyser + fuel cell) storage are
      co-optimised with generation and transmission. Pumped hydro and hydro storage are also
      present. Conservative hydrogen assumptions (noted as a limitation) reduce hydrogen
      storage competitiveness. Storage power capacity reaches ~1909 GW in some scenarios (Fig. 5).
    variant: null
    parameters: {battery_energy_CAPEX: "142 EUR/kWh", hydrogen_tank_CAPEX: "57 EUR/kWh", discount_rate: "0.07"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      A uniform 7% discount rate is applied to all technologies: Appendix A Table A.2 shows
      "Discount rate: 0.07" for all generation technologies. Annualised costs are shown for
      storage in Table A.3.
    procedure_notes: >
      Single discount rate of 7% used for all technologies and regions with no country- or
      technology-specific WACC differentiation. Cost assumptions sourced from Danish Energy
      Agency technology catalogues (ref [23]) and IEA (ref [24]).
    variant: null
    parameters: {discount_rate: "0.07", lifetime_range: "20–60 years by technology"}

unmatched_methods:
  - name: "load-weighted-decentralisation-constraint (K-parameter)"
    evidence: >
      The paper's primary methodological contribution is the K-constraint (Eq. 7): a novel
      linear bound on nodal renewable capacity as a fraction of total system renewable capacity,
      weighted by each node's load share. This is not a standard optimisation method from the
      vocabulary — it is a custom spatial equity enforcement constraint. It is closest to
      `cost-allocation-and-equity-metrics` (which covers distributional outcomes) and
      `custom-constraints-with-linopy` (which covers how bespoke constraints are added to
      PyPSA), but neither captures the specific procedural content: deriving a load-proportional
      capacity allocation bound and sweeping its parameter K across 8 levels.
