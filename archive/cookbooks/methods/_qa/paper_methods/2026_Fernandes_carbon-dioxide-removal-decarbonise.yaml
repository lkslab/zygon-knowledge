paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
tier: 2
model_used: >
  PyPSA-Eur (version 2025.01.0), sector-coupled, 90 nodes, 3-hourly resolution,
  full year, electricity + heating + transport + industry + agriculture + feedstocks.
scope: >
  Extends PyPSA-Eur with four additional CDR strategies (afforestation,
  perennialisation, biochar, enhanced rock weathering) and assesses their role
  in achieving climate-neutral Europe by 2050, analysing cost impacts, technology
  interactions, and spatial/temporal deployment patterns.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "PyPSA-Eur assumes long-term market equilibrium, perfect competition, and
      perfect foresight. It employs linear programming to optimise the cost-effective
      configuration of the energy system subject to various constraints." The model
      encompasses electricity, heating, land transport, shipping, aviation,
      agriculture, industry, and feedstocks with detailed CO2 capture, transport,
      conversion and sequestration (Sec. 5.1 Model).
    procedure_notes: >
      Standard PyPSA-Eur sector-coupled build extended with four new CDR components
      (afforestation, perennialisation, biochar, ERW) as additional sequestration
      sinks. Transmission capacities fixed exogenously per ENTSO-E TYNDP 2020.
      Gas pipelines from SciGRID_gas project at fixed capacities. No pipeline
      repurposing for H2 in baseline. Sensitivity analyses allow CO2 and H2
      transport networks.
    variant: null
    parameters: {nodes: 90, temporal_resolution: "3-hourly", sectors: "electricity, heating, transport, shipping, aviation, agriculture, industry, feedstocks", version: "2025.01.0"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model performs an overnight greenfield optimisation using a 90-node
      spatial resolution with 3-hourly temporal resolution over the full year"
      (Sec. 5.1). The Limitations section notes: "the model is based on an
      overnight greenfield optimisation. Because the transition pathway is not
      explicitly modelled, potential technological lock-ins and path-dependent
      effects during the system transformation are not captured" (Sec. 6).
    procedure_notes: >
      Single target year 2050 (cost assumptions for 2030 technology projections),
      perfect foresight, greenfield (existing transmission network and hydropower
      capacities included but fossil generation excluded). Authors flag this as
      a limitation and suggest future work on transition pathways.
    variant: overnight-greenfield
    parameters: {target_year: 2050, cost_assumption_year: 2030}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The model minimises the annualised system cost of the European energy system
      under net-zero CO2 emissions." The CO2 constraint is expressed formally in
      Supplemental 1 (Eq. S2): sum of emissions across all nodes <= CO2 limit,
      with dual value µ_CO2 representing the CO2 shadow price. Results report CO2
      shadow price of 723 EUR/tCO2 without additional CDRs, falling to 649
      EUR/tCO2 with full CDR portfolio (Sec. 2.1).
    procedure_notes: >
      Continental-level net-zero CO2 constraint applied collectively across all
      model nodes. The paper also runs sensitivity cases at different CO2 reduction
      targets (30%, 20% relative to 1990 levels) to determine deployment order of
      CDR strategies (Figure S8).
    variant: null
    parameters: {constraint: "net-zero CO2", scope: "continental Europe", co2_shadow_price_baseline: "723 EUR/tCO2", co2_shadow_price_with_cdrs: "649 EUR/tCO2"}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The dual value λ_n,t of this constraint represents the electricity shadow
      price for node n at time step t." and "The dual value µ_CO2 of this constraint
      represents the CO2 shadow price for the entire Europe." (Supplemental 1, Eqs.
      S1, S2). CO2 shadow price is used as a key result metric (Sec. 2.1).
    procedure_notes: >
      Shadow prices extracted from LP dual variables. CO2 shadow price reported as
      a scalar for the whole continent; electricity shadow prices not reported
      explicitly but implied in the mathematical formulation.
    variant: null
    parameters: {}

  - slug: land-eligibility-and-potentials
    role: extends
    evidence: >
      "The total land available for afforestation was estimated using the 250m-resolution
      CORINE Land Cover dataset with the class 'transitional woodland/shrub'." ERW land
      derived from CORINE "non-irrigated arable land", "permanently irrigated arable
      land", and "rice fields", filtered by mean annual temperature >= 10 °C. Biochar
      land from CORINE arable land classes. Perennialisation from JRC ENSPRESO
      first-generation biofuel crop land (Secs. 5.3.2–5.3.5, Supplemental 2).
    procedure_notes: >
      The paper extends standard PyPSA-Eur land eligibility (renewable capacity
      factors via atlite/ERA5) with new CDR-specific land potential derivations:
      (1) afforestation potential: 60% of CORINE transitional woodland area x
      country biomass density / 30 years x 1.83 tCO2/tbiomass = 83 MtCO2/a;
      (2) perennialisation: first-generation biofuel crop land from JRC ENSPRESO
      medium scenario = 21 Mha, 43 MtCO2/a; (3) biochar: 20% of CORINE arable
      land, 15 t/ha application, 25-year annualisation = 23 Mha, 30 MtCO2/a;
      (4) ERW: 20% of arable land in regions >= 10°C mean annual temperature =
      14 Mha, 43 MtCO2/a. All potentials resolved at 90-node level.
    variant: cdr-land-potentials
    parameters: {afforestation_potential: "83 MtCO2/a", perennialisation_potential: "43 MtCO2/a", biochar_potential: "30 MtCO2/a", erw_potential: "43 MtCO2/a", afforestation_land: "15 Mha", perennialisation_land: "21 Mha", biochar_land: "23 Mha", erw_land: "14 Mha"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "To assess the influence of this adoption, a sensitivity analysis of the
      cost projections year is presented in Figure S26." The paper runs extensive
      one-at-a-time sensitivity analyses over CDR-specific parameters, spatial and
      temporal resolution, biomass availability, underground sequestration potential,
      and transport assumptions (Secs. 2.5, 5.1–5.3.5, Figures S7–S37).
    procedure_notes: >
      Over 30 sensitivity figures covering: underground sequestration potential
      (200 vs 600 MtCO2/a), sequestration cost, afforestation land availability
      and cost, biochar application rate and heat integration, ERW potential in
      warm vs temperate regions and VOM cost and electricity consumption,
      perennialisation CO2 reduction rate, solid biomass availability scenario
      (JRC ENSPRESO low/medium/high), spatial resolution (90 vs 39 nodes),
      temporal resolution (3-hourly vs annual), CO2 transport network, H2
      transport network, solid biomass transport, biochar transport, cost
      projection year. All are one-at-a-time (OAT) parameter sweeps.
    variant: one-at-a-time
    parameters: {n_sensitivity_figures: ">30"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "Coarsening the model's spatial resolution from 90 to 39 nodes largely
      preserves the system configuration while reducing total system costs by 5%,
      mainly due to lower investments in solar and DAC" (Sec. 2.5). The paper
      uses 90-node spatial resolution as baseline and explicitly tests 39 nodes
      as a sensitivity case (Figure S18–S21).
    procedure_notes: >
      Baseline 90-node network. Sensitivity at 39 nodes shows CO2 capture via DAC
      significantly reduced at coarser resolution, partially offset by increased
      process emission capture and solid biomass use in industry. Spatial
      distribution of CDR strategies differs markedly across resolutions.
    variant: null
    parameters: {baseline_nodes: 90, sensitivity_nodes: 39}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "Coarsening the model's temporal resolution to a single time step representing
      an entire year, as commonly done in some IAMs, reduces total system costs by
      more than 30%" (Sec. 2.5, Figures S22, S25). Baseline is 3-hourly full-year
      resolution (8760/3 = 2920 time steps).
    procedure_notes: >
      Baseline 3-hourly resolution over full year chosen to "capture European
      spatial heterogeneity and wind-solar variability at daily, weekly, and
      seasonal scales" (Sec. 5.1, citing Pfenninger et al. 2017). Sensitivity
      comparison against annual single time step (IAM-style) shows >30% cost
      underestimation driven by implicit balancing of renewables at no cost.
    variant: n-hourly
    parameters: {baseline_resolution: "3-hourly", sensitivity_resolution: "annual single time step"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "Cost assumptions, including a discount rate of 7%, are applied uniformly
      across Europe." (Sec. 5.1). Uniform cost of capital assumed to "avoid
      masking the main drivers of optimal infrastructure deployment levels and
      spatial allocation by uncertain financial assumptions" (Sec. 6).
    procedure_notes: >
      Single uniform discount rate of 7% across all technologies and countries.
      Technology cost projections from Energy System Technology Data v0.14.1
      (Danish Energy Agency) for year 2030. A sensitivity analysis on the cost
      projection year is performed (Figure S26).
    variant: null
    parameters: {discount_rate: "7%", technology_cost_year: 2030}

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      "In the baseline scenario, the transport of solid biomass, biochar, CO2, and
      H2 is not allowed. To assess the influence of this limitation, sensitivity
      analyses of the transport of these materials are presented in Figures S11,
      S12, S14, and S15, respectively." Equipping the system with a CO2 transport
      network "substantially reduces reliance on costly DAC" (Sec. 2.3).
    procedure_notes: >
      Baseline: no CO2 or H2 transport networks (solid biomass and biochar also
      constrained to no transport). Sensitivity cases: (1) CO2 pipeline network
      enabling regional sequestration and synthetic fuels production; (2) H2
      pipeline network. Results show CO2 network makes DAC redundant when combined
      with full CDR portfolio. Gas pipelines from SciGRID_gas fixed; no repurposing
      for H2 in baseline.
    variant: null
    parameters: {}

