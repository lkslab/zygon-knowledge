paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
tier: 1
model_used: >
  PyPSA-Eur, sector-coupled, 100 nodes, 2190 time steps (TSAM segmentation on
  weather year 2013), overnight, techno-economic assumptions for 2030.
scope: >
  Compares five carrier-network scenarios (all networks, H2-only, CH4-only,
  no gaseous networks, minimal methanol backstop) for a net-zero European
  energy system to quantify the cost premium of replacing hydrogen and methane
  infrastructure with methanol as a liquid gap-filler for hard-to-electrify sectors.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "For our analysis, we employ the open-source, sector-coupled energy system
      optimization model PyPSA-Eur... PyPSA-Eur encompasses multiple sectors,
      including electricity, heat, industry, agriculture, shipping, aviation, and
      land transport." (Sec. Methods: Overview of European energy system model PyPSA-Eur)
    procedure_notes: >
      Full sector coupling with electricity, gas, oil, methanol, hydrogen, biomass,
      heat and ammonia carriers. Endogenous capacity and operation co-optimisation.
      Conversion technologies include electrolysis, methanol synthesis
      (biomethanol, e-biomethanol, e-methanol), Fischer-Tropsch, Haber-Bosch,
      direct reduced iron, CHPs, heat pumps. Five scenarios toggle hydrogen and
      methane transmission and distribution networks on/off.
    variant: null
    parameters: {regions: 100, sectors: "electricity/heat/industry/transport/shipping/aviation/agriculture"}

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      "The model co-optimizes the capacity and operation of generation, storage,
      transport, and conversion technologies... For transmission, the model includes
      the high-voltage electricity grid and pipelines for hydrogen, methane and CO2
      to transport energy and CO2 over longer distances." (Sec. Methods). Five
      scenarios vary which pipeline networks are available, including CO2 pipelines.
    procedure_notes: >
      Hydrogen, methane and CO2 pipeline capacities treated as continuous expansion
      variables (post-discretization sensitivity also run, Fig. S3). CO2 pipelines
      route captured carbon from inland sources to sequestration or methanol
      synthesis sites. Methanol and oil transport is not modelled as explicit
      infrastructure but given a uniform cost: 4 €/MWh for methanol (derived
      from a supplementary run with endogenous truck transport at 80 €/tMeOH/1000 km),
      0.1 €/km/MWh for solid biomass.
    variant: null
    parameters: {co2_pipeline_cost: "2116 €/km/(tCO2/h)", h2_pipeline_cost: "282 €/km/MW",
                 ch4_pipeline_cost: "87 €/km/MW", methanol_distribution: "4 €/MWh uniform"}

  - slug: import-and-trade-representation
    role: routine-use
    evidence: >
      "When considering imports from overseas, we only include green energy carriers
      and products. These include green hydrogen, Fischer-Tropsch oil, methanol,
      ammonia, hot briquetted iron and crude steel." (Sec. Fossil fuels and green
      energy imports). Default runs disallow imports; an 'imports' sensitivity
      activates them.
    procedure_notes: >
      Default scenario excludes all imports from outside Europe. Sensitivity
      'imports' allows green methanol at 140 €/MWh, hydrogen at 100 €/MWh,
      FT oil at 160 €/MWh, ammonia at 110 €/MWh, hot briquetted iron at 480 €/t
      (prices from Neumann et al. 2025). Import shares emerge endogenously; in
      the sensitivity run 100% of steel and ammonia are imported, 37% of methanol.
    variant: null
    parameters: {methanol_import_price: "140 €/MWh", h2_import_price: "100 €/MWh",
                 FT_oil_import_price: "160 €/MWh", ammonia_import_price: "110 €/MWh"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The optimization process aims to determine a cost-optimal energy system...
      constrained to have net-zero carbon dioxide emissions... carbon dioxide
      sequestration is constrained to 200 MtCO2 per year." (Introduction and
      Sec. Methods). CO2 shadow prices reported across all scenarios (Fig. 10).
    procedure_notes: >
      Net-zero CO2 constraint applied system-wide. Sequestration cap of 200 MtCO2/a
      in default; sensitivities at 400 MtCO2/a and unlimited, and at 90% and 95%
      reduction targets vs 1990. CO2 price derived as shadow price of the emission
      constraint; default 'all networks' scenario yields 429 €/tCO2 in the minimal
      methanol backstop scenario.
    variant: emissions-cap-with-sequestration-limit
    parameters: {default_sequestration_cap: "200 MtCO2/a", co2_target: "net-zero",
                 shadow_price_range: "57–650 €/tCO2 across sensitivities"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "In this section, we explore how the cost of the 'minimal methanol backstop'
      scenario reacts to altering the input parameters with high uncertainty and
      high impact on the system." (Sec. Sensitivity on various input parameters).
      15 sensitivity settings are run.
    procedure_notes: >
      One-at-a-time parameter sweeps across: low electrification, no power
      transmission, high demand (+30%), low biomass potential (840 TWh/a),
      today's transmission, no biomass backup, no CO2 transport, relocation of
      steel/ammonia, imports, 400 Mt/a and infinite sequestration, high biomass
      (3320 TWh/a), 2050 techno-economics, 90%/95% CO2 targets, and combined
      high biomass + infinite sequestration. Each sweep reports cost premium of
      min. MeOH vs. all networks and absolute cost of min. MeOH vs. default.
    variant: one-at-a-time
    parameters: {n_settings: 15, cost_premium_range: "1.8–5.4%"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The optimization process aims to determine a cost-optimal energy system,
      accounting for both capital and operational expenditures, without considering
      the transition pathway–i.e., assuming an overnight scenario." (Sec. Methods)
    procedure_notes: >
      Single target year, greenfield overnight optimisation. Techno-economic
      assumptions for 2030 used in default; 2050 assumptions run as a sensitivity.
      No transition pathway modelled.
    variant: overnight
    parameters: {target_year: 2030, sensitivity_year: 2050}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "For our analysis, we resolve 100 representative regions... The 100
      representative regions are selected based on regional electricity demand,
      using the k-means algorithm." (Sec. Methods: Temporal and spatial resolution)
    procedure_notes: >
      k-means clustering on regional electricity demand to 100 nodes covering EU
      plus Norway, Switzerland, UK and Balkans. High-demand countries (Germany,
      France, UK) receive more nodes. Electricity transmission grid derived from
      OpenStreetMap data.
    variant: k-means-demand-weighted
    parameters: {nodes: 100}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "we resolve... 2190 time steps obtained from a segmentation clustering on
      the weather year 2013 using TSAM." (Sec. Methods: Temporal and spatial
      resolution). "The time series aggregation clusters by wind, solar and load
      series to sequential periods of varying durations."
    procedure_notes: >
      TSAM (time series aggregation method) with segmentation to 2190 time steps
      from 8760 hours of weather year 2013. Sequential periods of varying
      duration — fine resolution for midday solar peaks, coarser for stable
      night-time hours. Accuracy validated against hourly solution in prior work
      (Neumann et al. 2023, Joule).
    variant: tsam-segmentation
    parameters: {time_steps: 2190, weather_year: 2013, method: "TSAM segmentation"}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The CO2 price necessary to reach these scenarios can be derived from the
      shadow price of the carbon dioxide emissions constraint in the models."
      (Sec. Sensitivity) and "For the levelized cost calculation, we consider the
      model-endogenous prices for the fuels, electricity and CO2 which include the
      cost for production, storage and transport." (Sec. Results: Fig. 6 caption)
    procedure_notes: >
      CO2 shadow prices extracted from emission constraint dual variable and
      reported across all 15 sensitivity settings (range 57–650 €/tCO2). Regional
      endogenous hydrogen and fuel prices used for levelized cost merit-order
      analysis of methanol production routes; costs are demand-weighted averages
      across the 100 regions.
    variant: null
    parameters: {co2_price_default_min_meoh: "429 €/tCO2"}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "electricity transmission can be expanded by up to 25% in MWkm volume, in
      line with the transmission system operators' Ten Year Network Development Plan."
      (Introduction). Fig. S9 shows transmission expansion map; current 265 TWkm
      optimises to 332 TWkm (+25%).
    procedure_notes: >
      Electricity transmission co-optimised with generation and storage under a
      25% MWkm volume cap. Hydrogen, methane and CO2 pipeline capacities
      also co-optimised without an explicit volume cap (continuous variables).
      Sensitivity 'today's transmission' fixes electricity grid at current capacity;
      'no power transmission' removes it entirely.
    variant: null
    parameters: {elec_expansion_cap: "25% MWkm", current_grid: "265 TWkm",
                 optimised_grid: "332 TWkm"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Biomass potentials are restricted to residual products... The regional
      potentials are taken from the medium scenario for 2030 of the JRC ENSPRESO
      database." (Sec. Methods: Biomass supply). Atlite used for renewable
      generation profiles (Sec. Methods).
    procedure_notes: >
      Renewable capacity factors and time series generated with Atlite for weather
      year 2013. Biomass potentials from JRC ENSPRESO medium 2030 scenario: 347 TWh/a
      wet biomass (biogas), 1050 TWh/a solid biomass, 151 TWh/a biogenic MSW.
      Sensitivities span ENSPRESO low (840 TWh/a total) to high (3320 TWh/a) scenarios.
    variant: null
    parameters: {biomass_default: "1550 TWh/a medium ENSPRESO 2030",
                 biomass_low: "840 TWh/a", biomass_high: "3320 TWh/a",
                 weather_year: 2013}

