paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
tier: 2
model_used: >
  PyPSA-Eur (adapted fork, v2025.01.0_co2_stores), sector-coupled, 39 nodes,
  750 aggregated time steps (segmentation), greenfield, single target year 2050,
  electricity + heating + industry + transport sectors, extended with alternative
  CDR strategies (afforestation, biochar, enhanced rock weathering, perennialization).
scope: >
  Explores the near-optimal solution space for carbon capture, conversion,
  sequestration, and CDR strategies (including non-geological removal options)
  in a net-zero European energy system using MGA, to assess which carbon
  management configurations are necessary versus optional within a 1-5% cost
  slack.
methods:
  - slug: mga-near-optimal-space
    role: extends
    evidence: >
      "We apply a combination of Min/Max and Random vectors approaches using the
      spatially aggregated capacities of carbon management options as decision
      variables" (Sec. 2.3). The paper implements the MGA method of Lau et al.
      [21] combining minimization, maximization, and random vectors, and applies
      it specifically to carbon management technologies rather than the usual
      generation/transmission variables. Convergence is assessed via volume
      expansion of 2D-subspace projections across pairwise combinations of
      decision variables (Supplementary Note 1.2).
    procedure_notes: >
      Cost-optimal solution found first; then MGA relaxes total system cost by
      epsilon = 1%, 3%, or 5% (Eq. 2). Decision variable weights v sampled
      either from uniform distribution over [-1,1] (about one quarter of runs)
      or from integer set [-1,0,1]; first vector inverted to ensure each variable
      is both minimized and maximized at least once. Convergence criterion: change
      in summed 2D-subspace volume across pairwise combinations must be below 1%
      for last three calculations (checked every 5 new results). Additional
      targeted minimization scenarios for each individual technology are manually
      included. Decision variables are spatially aggregated capacities (all nodes
      of a technology get same weight) for 17 carbon management technologies
      listed in Tab. 1.
    variant: min-max-random-vectors
    parameters: {slack: "1%, 3%, 5%", decision_variables: "17 carbon management technologies (aggregated node capacities)", convergence: "2D-subspace volume expansion < 1% over last 3 checks"}

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "This study uses PyPSA-Eur, an open European energy system model of the
      electricity, heating, industry, and transport sectors" (Sec. 2.1). The
      model includes conversion links for CO2 hydrogenation (Sabatier, Fischer-
      Tropsch, methanol synthesis), CHP plants, SMR, DAC, and biogas upgrading,
      all within a multi-carrier network with a shared CO2 accounting bus.
    procedure_notes: >
      Uses PyPSA-Eur v2025.01.0 adapted fork (github.com/ricnogfer/pypsa-eur/
      tree/v2025.01.0_co2_stores). Following demands set exogenously: aviation
      oil, agricultural machinery oil, naphtha as feedstock, methanol for
      shipping, industrial heat from biomass and gas, and process emissions.
      90% capture rate assumed for all point-source capture processes.
    variant: null
    parameters: {nodes: 39, time_steps: 750, target_year: 2050, co2_sequestration_cap: "200 MtCO2/a"}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "the available hourly time resolution is clustered to 750 time steps based
      on a segmentation approach, which was shown to be more accurate than a
      corresponding uniform aggregation [20]" (Sec. 2.1). Supplementary Note 2.2
      and Fig. S7 show explicit comparison of carbon management outcomes for
      different temporal resolutions (700SEG, 750SEG, 876SEG, 2920SEG, 8760SEG,
      3H, 10H, 168H) to validate the 750-segment choice.
    procedure_notes: >
      Segmentation method (not uniform n-hourly averaging) used for temporal
      aggregation to 750 time steps. Sensitivity analysis in SI compares 7
      different temporal resolutions; 750SEG chosen as baseline. Results show
      3H uniform resolution deviates by up to 3.7% in system cost and notable
      differences in carbon management compared to high-resolution benchmarks.
    variant: segmentation
    parameters: {time_steps: 750, benchmark_resolutions_tested: "700SEG, 750SEG, 876SEG, 2920SEG, 8760SEG, 3H, 10H, 168H"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "Regions are clustered to 39 nodes" (Sec. 2.1). Spatial distribution of
      carbon management strategies is also analysed per node for various MGA
      scenarios (Supplementary Notes 2.3, Figs. S8-S11).
    procedure_notes: >
      39-node clustering of the European network. No details given on the
      clustering algorithm in this paper; the paper references PyPSA-Eur as
      the base model. Spatial results (per node) for CDR and CCUS strategies
      are reported in SI to assess geographic concentration.
    variant: null
    parameters: {nodes: 39}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "We followed a greenfield approach with perfect foresight for the full year"
      (Sec. 2.1). This is a single-year overnight optimisation for the 2050
      target year.
    procedure_notes: >
      Greenfield, perfect foresight, single target year 2050. No existing
      capacity vintaging. The paper explicitly states the greenfield assumption
      and notes that transmission expansion and H2/CO2 network expansion were
      excluded from scope to isolate carbon management interactions.
    variant: overnight-greenfield
    parameters: {target_year: 2050, weather_years: 1}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      The model enforces net-zero emissions as a hard constraint across all
      near-optimal solutions: "all near-optimal solutions must be carbon-neutral,
      which means that the sum of CO2 removals is equal to the sum of CO2
      emissions" (Sec. 3.1). A cap of 200 MtCO2/a is imposed on underground
      CO2 sequestration (Sec. 2.2).
    procedure_notes: >
      Carbon neutrality enforced as an equality constraint (net emissions = 0).
      Underground sequestration hard-capped at 200 MtCO2/a based on planetary
      boundary reasoning. CDR potentials (afforestation, ERW, perennialization,
      biochar) are node-wise capped by land use and climate constraints; values
      given in Tab. S1.
    variant: null
    parameters: {co2_target: "net-zero 2050", sequestration_cap: "200 MtCO2/a", afforestation_potential: "83 MtCO2/a", perennialization_potential: "42 MtCO2/a", biochar_potential: "30 MtCO2/a", ERW_potential: "42 MtCO2/a"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "In the model, the capacities of afforestation, biochar, ERW, and
      perennialization are node-wise restricted due to land use and climate
      restraints. CO2 underground sequestration is also spatially resolved based
      on the availability of offshore salt deep salt caverns and depleted
      hydrocarbon reservoirs." (Sec. 2.2). Tab. S1 lists land availability in
      Mha and CO2 removal potential per CDR strategy.
    procedure_notes: >
      Land availability constraints applied per node for four CDR strategies.
      Sequestration potential spatially resolved based on geological data.
      Biomass potential set conservatively at 1386 TWh/a (exogenous cap across
      the whole system). At least 72% of biomass potential exogenously allocated
      to high-temperature industrial heat demand, limiting biochar and bio-oil
      production.
    variant: null
    parameters: {biomass_potential: "1386 TWh/a", afforestation_land: "21 Mha", perennialization_land: "23 Mha", biochar_land: "14 Mha", ERW_land: null}

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      The model includes CO2 capture, transport and conversion pathways as
      carrier-level network elements (CO2 bus), but the paper explicitly excludes
      infrastructure expansion: "We decided to assess the impact of removal,
      capture, conversion, and sequestration independently of wide infrastructure
      changes such as the expansion of transmission lines or building a H2-network
      and CO2 network." (Sec. 2.1).
    procedure_notes: >
      CO2 carrier network used for internal accounting (capture to sequestration
      or conversion), but no endogenous pipeline routing or capacity expansion.
      H2 network expansion also excluded. This is a deliberate scope restriction
      to isolate carbon management decisions.
    variant: null
    parameters: {}

unmatched_methods: []
