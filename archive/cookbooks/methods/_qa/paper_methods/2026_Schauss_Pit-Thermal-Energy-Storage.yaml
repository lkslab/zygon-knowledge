paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
tier: 1
model_used: >
  PyPSA-DE, sector-coupled capacity expansion model of Germany and neighbouring
  countries, 49 regions (30 Germany + sub-regions for 40 largest district heating
  systems), 3-hourly temporal resolution, 2045 net-zero target year.
scope: >
  Assesses the system-level role of pit thermal energy storage (PTES) in a
  sector-coupled German energy system under current and reduced district heating
  network temperatures, explicitly modelling temperature-dependent discharge
  boosting requirements and their effect on PTES value and operation.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "PyPSA-DE solves a linear optimization problem that minimizes annualized
      investment and operation costs ... covers the demand sectors households,
      services, industry, and transport, and includes a broad set of energy
      carriers such as electricity, heat, hydrogen, methane, oil, biomass, and
      methanol. The material flow of carbon dioxide is additionally represented
      to account for emissions and carbon management." (Sec. S2.1)
    procedure_notes: >
      PyPSA-DE builds on PyPSA-Eur. The paper extends the district heating
      representation with explicit forward and return network temperatures, PTES
      boosting constraints, and multiple heat sources (geothermal, river water,
      sea water, electrolyser waste heat). 15 scenarios run across 4 PTES
      boosting configurations x 3 district heating temperature levels plus
      NoPTES baselines.
    variant: null
    parameters: {regions: 49, temporal_resolution: "3h", target_year: 2045, countries: 15}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "In this study, we apply a brownfield approach towards 2045 carbon
      neutrality, which retains those of today's electricity generation and
      transmission capacities, including combined heat-and-power (CHP) plants,
      with lifetimes exceeding 2045." (Sec. S2.1). "Today's CHP capacities are
      assigned to district heating systems using the German Marktstammdatenregister." (Sec. S2.2.3)
    procedure_notes: >
      Existing electricity generation and transmission capacities with lifetimes
      beyond 2045 are locked in; only incremental investment is optimised. CHP
      plants are initialised from a national plant registry. No vintaging of
      district heating assets beyond CHP.
    variant: null
    parameters: {}

  - slug: storage-sizing-and-duration
    role: extends
    evidence: >
      "PTES investment are determined through the product of investment cost per
      m3 and storage volume v_n^max ... the energetic storage capacity e_n is
      given by the product of the volumetric heat capacity c_p, the storage
      volume v_n^max, and the temperature delta (T_n^top - T_n^bottom)." (Sec.
      S2.3.1, Eq. 2a). The energy-to-power ratio mu_{e2p} sets permitted peak
      charge and discharge rates relative to volumetric capacity (Eq. 2d).
    procedure_notes: >
      The paper extends standard storage sizing by making the energetic capacity
      a function of the achievable temperature spread rather than a fixed
      parameter. PTES volumetric capacity is the investment decision variable;
      energetic capacity derives from it via temperature assumptions set
      exogenously to maintain linearity. TTES also sized, with no upper limit on
      installable capacity. PTES potential capped by land-eligibility constraints.
      Standing losses assumed 0.18%/day.
    variant: temperature-dependent-capacity
    parameters: {standing_loss: "0.18%/day", PTES_top_temp: "90°C", PTES_investment_cost: "68 EUR/m3"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Eligible areas must be categorized as arable land, pastures,
      shrub/herbaceous, or open spaces with little vegetation according to the
      OpenStreetMap landcover data. Furthermore, they must be outside protected
      areas according to the NATURA 2000 guidelines and have a groundwater depth
      >= 10 m." (Sec. S2.2.4). "Land eligibility for PTES and heat sources is
      restricted to the respective base/sub-region." (Sec. S2.2.1)
    procedure_notes: >
      Land eligibility is intersected for PTES from OpenStreetMap land cover,
      NATURA 2000 protected areas, and groundwater depth data. Minimum area of
      25,000 m2 required per PTES installation. Heat source potentials for river
      water, sea water, and geothermal are also spatially constrained with 5 km
      buffer zones. VRES capacity factors derived using atlite from 2019 ERA5
      weather data.
    variant: null
    parameters: {min_area: "25000 m2", buffer: "5 km", groundwater_depth: ">=10 m"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "PyPSA-DE is configured to achieve carbon neutrality by 2045." (Sec.
      S2.1). The model "is further subject to technical and physical constraints,
      such as a carbon budget and hourly VRES availability." (Sec. S2.1)
    procedure_notes: >
      A binding net-zero carbon constraint for Germany by 2045 is imposed.
      Carbon accounting includes fossil fuel use, fuel synthesis, DAC, industrial
      carbon capture, and BECCS. No explicit CO2 price; the shadow price of the
      carbon budget constraint functions as an implicit price.
    variant: annual-cap
    parameters: {target: "net-zero 2045"}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "PyPSA-DE solves a linear optimization problem ... the dual variable of
      this constraint is interpreted as the price of the respective carrier in
      time and space." (Sec. S2.1). Results report demand-weighted district
      heating prices derived from these dual variables and their changes across
      scenarios.
    procedure_notes: >
      The dual variable of the energy balance constraint is used as the carrier
      price at each node and time step. District heating prices are reported as
      demand-weighted averages across the 40 largest German systems. Price
      reductions under PTES scenarios are a key result metric.
    variant: null
    parameters: {}

  - slug: extreme-event-and-dunkelflaute-analysis
    role: routine-use
    evidence: >
      "The cold spell coincides with a Dunkelflaute, which is reflected in
      spiking electricity prices." (Sec. S3.1). "During the cold Dunkelflaute,
      however, the additional energy required for boosting limits PTES
      discharge." (Sec. S3.1). "the heat pump advantage at higher temperatures
      follows from higher efficiency: less electricity is required to enable PTES
      discharge, reducing the additional power load when VRES are scarce, as it
      often is the case during winter, particularly during cold Dunkelflaute
      events." (Sec. S3.4)
    procedure_notes: >
      Dunkelflaute events (coincident cold spell + low VRES output) are used as
      stress-test episodes to illustrate PTES operational limits under resistive
      boosting. The paper does not define or extract Dunkelflauten algorithmically;
      they arise naturally in the single 2019 weather year and are identified in
      the dispatch plots. A single weather year is acknowledged as a limitation
      in Sec. S4.2.
    variant: null
    parameters: {weather_year: 2019}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The model comprises 49 regions (30 for Germany, 3 for Italy, 2 each for
      Denmark, the UK and Spain, 1 each for Austria, Belgium, Switzerland, Czech
      Republic, France, Luxembourg, the Netherlands, Poland and Sweden and
      Norway)." (Sec. S2.1). "We model 30 German base regions ... The 40 largest
      German district heating systems ... are then modelled as district heating
      sub-regions of the respective base regions." (Sec. S2.2.1)
    procedure_notes: >
      The spatial resolution is inherited from PyPSA-Eur/PyPSA-DE. The 40
      largest district heating systems are modelled as explicit sub-regions
      nested within the 30 German base regions, sharing base-region connections
      for electricity, gas, biomass, and hydrogen. Sub-regions are restricted
      geographically to city-level census data for district heating areas.
    variant: null
    parameters: {total_regions: 49, german_base_regions: 30, DH_sub_regions: 40}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "49 regions ... at a 3-hourly temporal resolution, which has been shown to
      be a good compromise between accuracy and runtime." (Sec. S2.1, citing
      [38])
    procedure_notes: >
      3-hourly snapshots are used throughout, inherited from prior PyPSA-DE
      work. The choice is motivated by accuracy-runtime trade-off. No TSAM or
      typical-period selection is applied; 2019 is used as a single full weather
      year.
    variant: n-hourly
    parameters: {resolution: "3h", weather_year: 2019}

unmatched_methods:
  - name: "temperature-dependent-storage-boosting-constraints"
    evidence: >
      The paper's central methodological contribution is the explicit
      formulation of temperature-dependent discharge boosting constraints for
      PTES integrated into a linear optimisation model. Boosting ratio alpha is
      precomputed as a parameter from exogenous temperature assumptions and
      enforced as a linear coupling between PTES discharge and resistive heater
      or heat pump operation (Sec. S2.3.2-S2.3.3, Eqs. 4a-6c). This is a
      bespoke extension to the storage representation in PyPSA-DE and does not
      map to any existing slug, which covers storage sizing and duration but not
      temperature-physics constraints on storage dispatch.
