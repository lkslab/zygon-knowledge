paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
tier: 2
model_used: >
  PyPSA library only (bespoke model assembled using the PyPSA-Eur model-building
  pipeline for generator/load data, but with spatial aggregation step skipped and
  replaced by NPAP; electricity-only; European high-voltage network at 220 kV and
  380 kV; 6795 buses in full grid, aggregated to k=250/500/1000/3000 nodes; 3
  representative 24-hour periods; 2050 planning horizon; 2013 weather year).
scope: >
  Proposes a voltage-aware (VA) network partitioning and aggregation methodology
  that preserves individual voltage levels and transformers during spatial aggregation,
  and compares it against conventional voltage-unaware (VU) aggregation for
  transmission expansion planning accuracy in a European case study.
methods:
  - slug: distribution-and-voltage-aware-aggregation
    role: defines
    evidence: >
      "we propose a novel voltage-aware network partitioning and aggregation
      methodology that preserves individual voltage levels and transformers"
      (Abstract). The VA partitioning requires all nodes within a single cluster to
      share the same voltage level, implemented by assigning infinite distance between
      nodes of different voltage levels in the distance matrix D (Sec. II-A, Appendix A).
      Compared against the voltage-unaware (VU) baseline using k=250/500/1000/3000
      nodes.
    procedure_notes: >
      Partitioning uses k-medoids clustering on geographical distances via
      NPAP's geographical_kmedoids_haversine strategy; block-diagonal distance matrix
      enforces voltage-level separation (infinity between cross-voltage node pairs).
      Aggregation follows copperplate approach: buses within a cluster merged into one
      node; capacities summed; renewable capacity factors averaged; intra-cluster lines
      removed; parallel inter-cluster lines aggregated by summing capacity and deriving
      equivalent reactance. Transformers treated as lines in DC power flow. Implemented
      in the open-source NPAP Python package integrated into the PyPSA-Eur workflow
      (Sec. II-A, Sec. III-B).
    variant: voltage-level-preserving-kmedoids
    parameters: {k_nodes: "250, 500, 1000, 3000", voltage_levels: "220 kV and 380 kV", transformers_preserved_at_k500: "344 out of 1756"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "we perform the VU and VA network partitioning and aggregation ... based on
      k-medoids clustering and geographical distances using NPAP's
      geographical_kmedoids_haversine partitioning strategy" (Sec. III-B). Four
      aggregation levels (k=250/500/1000/3000) are compared against the full grid
      (6795 buses).
    procedure_notes: >
      k-medoids on haversine geographical distances; nonhierarchical partitioning so
      cluster mappings vary substantially as k changes (noted as a drawback in
      Sec. IV-B). VU approach uses the same k-medoids without voltage constraints.
      NPAP's GEOGRAPHICAL aggregation mode used for PyPSA compatibility (Sec. III-B).
    variant: k-medoids-geographical
    parameters: {k_nodes: "250, 500, 1000, 3000", full_grid_buses: 6795}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "solving a network expansion problem for a European case study using PyPSA"
      with DC power flow (Abstract, Index Terms). "Because transformers are effectively
      represented as lines in DC power flow, the same aggregation strategy applies to
      them" (Sec. II-A). Barrier method without crossover used in Gurobi v.13.0.0
      (Sec. III-B).
    procedure_notes: >
      Standard DC/linearised OPF as implemented in PyPSA; transformers modelled as
      lines within the DC formulation. Continuous (not MILP) transmission expansion
      planning. Solver: Gurobi v.13.0.0 with Barrier method, no crossover (Sec. III-B).
    variant: null
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "we solve the continuous transmission expansion planning problem for the full,
      VU, and VA aggregated networks" (Sec. III-B). Investment candidates are lines and
      transformers whose loading exceeds 70% across all time steps or 90% at least once
      (Sec. III-B). Results compared in Table II across k and aggregation type.
    procedure_notes: >
      Expansion is reinforcement-only (not greenfield); investment candidates identified
      by a prior operational dispatch run. Continuous (LP, not MILP) expansion
      optimisation. Annualised costs reported. Technology-specific average investment
      costs used per voltage level (Table I). Only existing lines/transformers are
      expansion candidates (Sec. III-A, Sec. III-B).
    variant: reinforcement-only-continuous
    parameters: {candidate_threshold_loading: "70% all steps or 90% at least once", solver: "Gurobi v13.0.0 Barrier no crossover"}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "we further temporally aggregate the 8760 hourly time steps into three
      representative 24-hour periods using k-means clustering" (Sec. III-B, citing
      Hoffmann et al. 2022 [35]).
    procedure_notes: >
      k-means clustering of 8760 hours into 3 representative 24-hour periods (72 time
      steps total). Weather year 2013 used as the single historical year (Sec. III-B).
    variant: typical-days-kmeans
    parameters: {representative_periods: 3, period_length_h: 24, total_snapshots: 72, weather_year: 2013}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "We configure the case study with a 2050 planning horizon" (Sec. III-B). Single
      target-year overnight investment optimisation; no pathway or myopic stepping
      described.
    procedure_notes: >
      Single target year 2050; greenfield-style investment in the aggregated model
      (no existing fleet vintaging mentioned); reinforcement context means only
      pre-screened candidate components are expandable (Sec. III-A).
    variant: overnight
    parameters: {target_year: 2050}

  - slug: operational-dispatch-and-rolling-horizon
    role: routine-use
    evidence: >
      "Before running the transmission expansion planning problem, we first solve an
      operational problem across the entire grid to identify investment candidates for
      lines and transformers" (Sec. III-B). Components are flagged as candidates based
      on loading thresholds from this dispatch run.
    procedure_notes: >
      Dispatch-only run at fixed capacity over the full grid (6795 buses); used purely
      as a pre-screening step to identify congested components before aggregation and
      expansion optimisation. Loading thresholds: >70% across all time steps or >90%
      at least once (Sec. III-B).
    variant: dispatch-only-prescreening
    parameters: {loading_threshold_all: "70%", loading_threshold_peak: "90%"}

unmatched_methods: []
