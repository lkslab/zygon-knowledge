paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
tier: 1
model_used: >
  PyPSA-Eur (sector-coupled, v2025.01.0), 99 onshore regions plus offshore buses,
  three planning horizons 2030/2040/2050, 2190 representative time steps.
scope: >
  Assesses the long-term system value of EU Projects of Common Interest / Projects
  of Mutual Interest (PCI-PMI) for hydrogen and CO2 transport infrastructure across
  five infrastructure build-out scenarios and a regret analysis over three short-term
  uncertainty scenarios (reduced targets, delayed pipelines, no pipelines).
methods:
  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Using a myopic, iterative modelling approach, we simulate energy system
      development from 2030 to 2050 under non-anticipative foresight, reflecting the
      reality that market participants do not have perfect knowledge of long-term
      developments." (Section: Research gaps and contribution; Methods: Geographical
      and temporal resolution)
    procedure_notes: >
      Three planning horizons: 2030, 2040, 2050. Each horizon is solved sequentially;
      capacity from the previous horizon is carried forward as brownfield (committed
      infrastructure). Investment decisions are non-anticipative across horizons.
      The authors explicitly contrast this with "overly optimistic outcomes of long-term
      perfect foresight models."
    variant: myopic
    parameters: {horizons: "2030, 2040, 2050"}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "The myopic approach ensures that investment decisions across all planning
      horizons are non-anticipative and build on top of the previous planning horizon."
      (Methods: Geographical and temporal resolution). PCI-PMI projects are added
      at their planned build year and carried into subsequent horizons.
    procedure_notes: >
      Exogenously specified PCI-PMI assets (pipelines, sequestration sites, H2 storage)
      are inserted at their stated commissioning year and treated as committed capacity
      in subsequent horizons. Existing power plant stocks from [42] are included.
      The regret analysis fixes long-term pipeline capacities and assesses the effect of
      not having built them.
    variant: null
    parameters: {}

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "We build on the open-source, sector-coupled energy system model PyPSA-Eur
      to optimise investment and dispatch decisions in the European energy system ...
      PyPSA-Eur integrates multiple energy carriers (e.g., electricity, heat, hydrogen,
      CO2, methane, methanol, liquid hydrocarbons, and biomass) with corresponding
      conversion technologies across multiple sectors." (Methods: Overview)
    procedure_notes: >
      Full sector coupling covering electricity, transport, heating, biomass, industry,
      shipping, aviation, agriculture and fossil fuel feedstock. Conversion technologies
      include electrolysis, SMR, SMR CC, Fischer-Tropsch, methanolisation, and DAC.
      Gas transmission is copper-plated (not spatially resolved) to reduce computational
      burden; H2 and CO2 networks are explicitly routed.
    variant: null
    parameters: {}

  - slug: carrier-network-routing-h2-co2
    role: canonical-use
    evidence: >
      "We add all CO2 sequestration sites and connected pipelines, H2 pipelines and
      storage sites ... to the PyPSA-Eur model." "Lengths are calculated using the
      haversine formula multiplied by a factor of 1.25 to account for the non-straight
      shape of pipelines." (Methods: PCI-PMI H2 and CO2 transport, storage, and
      sequestration)
    procedure_notes: >
      PCI-PMI projects sourced from EC REST API and project sheets. Pipelines mapped
      to 99 NUTS regions; haversine distances x 1.25. Standardised cost assumptions
      applied uniformly (CAPEX: CO2 onshore 2116 €/tCO2/hkm, H2 onshore
      304 €/MWH2/km, offshore at 2x and 1.5x respectively; Table A1). CO2 sequestration
      potential from depleted offshore oil/gas fields (286 Mt p.a.) and PCI-PMI sites
      (114 Mt p.a.) clustered within 50 km buffer per offshore bus. H2 storage from
      PCI-PMI list plus endogenous salt cavern repurposing. Gas grid copper-plated;
      only H2 and CO2 pipelines are explicitly expanded. Five long-term scenarios vary
      the degree of pipeline freedom (DI, PCI, PCI-n, PCI-in, CP).
    variant: explicit-pipeline-routing
    parameters: {haversine_detour_factor: 1.25, co2_sequestration_cost: "15 €/tCO2", discount_rate: "7%"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The yearly emission budget follows the EU's 2030 (-55%) and 2040 (-90%) targets,
      translating into a carbon budget of 2072 Mt p.a. in 2030 and 460 Mt p.a. in 2040."
      (Methods: Energy demand and CO2 emissions; Table 4)
    procedure_notes: >
      GHG emission reduction targets implemented as annual CO2 caps per planning
      horizon: -55% by 2030, -90% by 2040, -100% (net-zero) by 2050. CO2 sequestration
      minimum targets also imposed (50, 150, 250 Mt p.a.). Green H2 production and
      electrolyser capacity targets added as minimum constraints. In the "Reduced targets"
      short-term scenario, all targets except GHG reduction are removed.
    variant: annual-cap
    parameters: {cap_2030: "2072 Mt CO2/a", cap_2040: "460 Mt CO2/a", cap_2050: "net-zero"}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "We use a time series aggregation technique to solve the model with 2190
      representative time steps. The aggregation is done with the Python package tsam
      developed by Kotzur et al. [47] which ensures that intertemporal characteristics
      including renewable infeed variability, demand fluctuations, and seasonal storage
      needs are preserved." (Methods: Geographical and temporal resolution)
    procedure_notes: >
      2190 representative time steps (equivalent to 3 x 730 h periods, i.e. quarterly
      typical periods at hourly resolution). Package: tsam (Kotzur et al. 2018).
      Aggregation designed to preserve renewable variability, demand fluctuations,
      and seasonal storage dynamics.
    variant: tsam-typical-periods
    parameters: {representative_timesteps: 2190}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "Regional clustering is based on administrative NUTS boundaries, with higher
      spatial resolution applied to regions hosting planned PCI-PMI infrastructure,
      producing 99 onshore regions." (Methods: Geographical and temporal resolution;
      Table A2)
    procedure_notes: >
      34 European countries. NUTS2 resolution for FI, NO; NUTS1 for BE, CH, CZ, DE,
      DK, ES, FR, GB, IT, NL, PL, SE; NUTS0 for smaller countries. Higher resolution
      applied where PCI-PMI projects are located to capture pipeline topology correctly.
      Additional offshore buses for sequestration sites and offshore PCI-PMI projects.
      Authors note "geographic and temporal clustering" as a limitation.
    variant: nuts-admin
    parameters: {onshore_regions: 99, countries: 34}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "We use values projected for 2030 and apply a discount rate of 7%, reflecting
      the weighted average cost of capital (WACC)." (Methods: Technology assumptions)
      NPV discounted at 7% p.a. reported in Results (Fig. 8).
    procedure_notes: >
      Single uniform WACC of 7% applied across all technologies and countries.
      Costs from technology-data v0.10.1 repository (Danish Energy Agency catalogues).
      Annualised capital costs used throughout. NPV of total system costs computed
      over asset lifetimes for comparison across scenarios.
    variant: null
    parameters: {discount_rate: "7%"}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "The model's endogenous decisions include the expansion and dispatch of ...
      transmission infrastructure for power, hydrogen, and CO2." (Methods: Overview).
      Electricity transmission projects from TYNDP and German NEP are enabled.
    procedure_notes: >
      Electricity grid expansion co-optimised alongside generation and storage.
      TYNDP 2020 and German NEP 2037/2045 projects included. H2 and CO2 pipeline
      capacities are either fixed (PCI scenario) or endogenously expandable (PCI-n,
      PCI-in, CP scenarios). Pipeline capacity is continuous (not discretised), noted
      as a simplification that may underestimate true costs.
    variant: null
    parameters: {}

unmatched_methods:
  - name: regret-analysis
    evidence: >
      "To quantify the economic value associated with PCI-PMI projects across scenarios
      reflecting a selected set of uncertainties ... we use a regret-based approach."
      (Research gaps section; Scenarios section). A 5x3 regret matrix (15 long-term
      scenarios × 3 short-term realisations × 3 horizons = 60 optimisation problems)
      is constructed. Regret is defined as the cost difference between a planned
      long-term scenario and the realised short-term outcome. This is distinct from
      stochastic-and-robust-optimisation (no scenario tree or recourse inside the
      optimiser) and from sensitivity-and-uncertainty-sweeps (not a parameter sweep —
      it is a structured two-stage scenario comparison to quantify investment regret).
      No existing slug captures this two-stage scenario-difference approach used
      specifically to evaluate infrastructure lock-in risk.
