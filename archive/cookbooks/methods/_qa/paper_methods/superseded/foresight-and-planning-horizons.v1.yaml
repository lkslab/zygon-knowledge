pypsa_primitive:
  symbol: "pypsa/optimization/optimize.py:multi_investment_periods; pypsa/components.py:investment_period_weightings"
  pypsa_version: "0.30.3"
  exposed_by: >
    pypsa-eur only. scripts/solve_network.py:collect_kwargs sets
    model_kwargs["multi_investment_periods"] = (config["foresight"] == "perfect"), so
    the config key reaches the primitive directly. pypsa-earth never passes the
    argument anywhere — grep for `multi_investment_periods` across models/pypsa-earth
    returns nothing.
  reachable_via: >
    Already reached in eur. In earth it would take: build one network per horizon, set
    a (period, snapshot) MultiIndex, populate n.investment_periods and
    n.investment_period_weightings[["years","objective"]], then pass
    multi_investment_periods=True into n.optimize / create_model. The pypsa side needs
    nothing new — it is the network assembly and the period-aware global constraints
    that are missing. pypsa also carries the hour-scale twin,
    optimize_with_rolling_horizon, which eur exposes via
    solving.options.rolling_horizon and earth does not expose at all.
  note: >
    This is the sharpest primitive statement in the book: perfect foresight is NOT new
    formulation work at the library layer for either model. pypsa 0.30.3 implements
    period-aware capacity accounting and objective weighting; eur's ~200-line
    prepare_perfect_foresight.py is the assembly on top, and that assembly is what earth
    lacks. Soft anchor — pypsa is a conda dependency, not a submodule, so this is pinned
    to a version string. Note also the version ceiling eur itself enforces: perfect
    foresight raises under pypsa >= 1.0, so the primitive's availability is
    version-bounded on BOTH sides.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: overnight-foresight
        role: >
          the default mode and the entry point: `foresight: overnight` with a
          one-element planning_horizons; registry status `working`
      - id: myopic-foresight
        role: >
          the sequential pathway mode; `working`, and the registry note says
          "battle-tested in eur (unlike earth)" — this is the asymmetry in one line
      - id: perfect-foresight
        role: >
          the intertemporal mode; `working` in eur and ABSENT FROM EARTH'S REGISTRY
          ENTIRELY. The mechanism is investment-period weightings plus inter-period
          carbon budget/atmosphere constraints
      - id: existing-baseyear-brownfield
        role: >
          seeds build years for power AND heating fleets at the base horizon; `working`,
          and the shared first rule of both the myopic and perfect chains
      - id: land-use-constraint
        role: >
          stops later vintages double-booking land occupied by earlier ones; `working`,
          automatic in myopic and perfect solves, with a SEPARATE implementation per mode
      - id: co2-budget-pathway
        role: >
          the per-horizon policy trajectory that makes a pathway mean something;
          `working`, with cb<f>ex/be tokens for exponential/beta budget distribution
      - id: discount-rate-dimension
        role: >
          `partial` — social_discountrate only reaches the objective in perfect
          foresight; in myopic it is inert, which is the pitfall above
      - id: max-growth-limits
        role: >
          per-carrier deployment growth caps between periods; `partial` and wired ONLY
          for perfect foresight at this ref, not myopic
      - id: rolling-horizon-dispatch
        role: >
          the hour-scale foresight lever for the dispatch variant; `working` via
          solving.options.rolling_horizon + horizon/overlap
      - id: global-summary
        role: >
          cumulative discounted pathway cost — the myopic chain's answer object, since
          the objective itself never sums across horizons
      - id: technology-cost-year
        role: "one costs_<year>_processed.csv per horizon; what makes deferral cheaper in-model"
    available:
      verdict: turnkey
      how: >
        A single top-level config key selects all three modes and the Snakefile includes
        a different solve chain for each: `foresight: overnight` -> rules/solve_overnight.smk
        (one rule, solve_sector_network); `myopic` -> rules/solve_myopic.smk
        (add_existing_baseyear -> add_brownfield -> solve_sector_network_myopic, chained
        horizon by horizon via solved_previous_horizon); `perfect` -> rules/solve_perfect.smk
        (add_existing_baseyear -> prepare_perfect_foresight -> solve_sector_network_perfect
        -> make_summary_perfect). All three rule files exist at this ref and were read.
        Horizon count is `scenario.planning_horizons`. Land-use accounting, per-horizon
        cost tables and the co2 budget trajectory all follow automatically from the mode.
      missing: >
        Nothing in procedure steps 1-10 lacks a handle. Two honest caveats rather than
        gaps: (a) perfect foresight is self-declared unhardened — the module logs "Running
        perfect foresight is not properly tested and may not work as expected" and raises
        under pypsa >= 1.0, and add_CCL_constraints is documented as not implemented for
        it; (b) step 11 (rolling horizon) is turnkey too but is mutually exclusive with
        cyclic storage, which prepare_network silently disables. Cross-period discounting
        in myopic mode does not exist by design, not by omission.
      provenance: "Snakefile:config[\"foresight\"] == \"overnight\"; rules/solve_perfect.smk:prepare_perfect_foresight; rules/solve_myopic.smk:solve_sector_network_myopic"
    levers:
      - key: "foresight"
        effect: >
          Selects the solve chain: overnight | myopic | perfect. Top-level key, read at
          Snakefile parse time to decide which rules module is included, so changing it
          changes the DAG rather than a parameter.
        default: "'overnight'"
        provenance: "config/config.default.yaml:foresight; Snakefile:config[\"foresight\"] == \"perfect\""
      - key: "scenario.planning_horizons"
        effect: >
          The horizon list. One element = a single target year (overnight, or a
          degenerate pathway). Several = the pathway. Element [0] is special: it is the
          base year, constrained by wildcard to be the only horizon
          add_existing_baseyear runs on.
        default: "[2050]"
        provenance: "config/config.default.yaml:planning_horizons; rules/solve_perfect.smk:prepare_perfect_foresight"
      - key: "costs.social_discountrate"
        effect: >
          The inter-period discount rate. Feeds get_social_discount / get_investment_weighting,
          which set n.investment_period_weightings["objective"]. Effective ONLY under
          `foresight: perfect`; inert in overnight and myopic. Also settable via the
          sector_opts `sdr<f>` token.
        default: "0.02"
        provenance: "config/config.default.yaml:social_discountrate; scripts/prepare_perfect_foresight.py:get_investment_weighting and get_social_discount"
      - key: "co2_budget"
        effect: >
          Per-horizon emission share of the base year, e.g. {2020: 0.72, ..., 2050: 0.0}.
          The policy trajectory that makes a myopic pathway differ from a sequence of
          unconstrained years. A cb<f>ex / cb<f>be sector_opts token instead distributes
          a total GtCO2 budget exponentially or via a beta curve.
        default: "{2020: 0.72, 2025: 0.648, 2030: 0.45, 2035: 0.25, 2040: 0.1, 2045: 0.05, 2050: 0.0}"
        provenance: "config/config.default.yaml:co2_budget; scripts/prepare_sector_network.py:build_carbon_budget"
      - key: "existing_capacities.grouping_years_power"
        effect: >
          Vintage bins the existing fleet is grouped into at the base year. Coarser bins
          are cheaper; finer bins matter when the question is about retirement timing.
          Detail in `brownfield-and-capacity-vintaging`.
        default: "[1900, 1950, 1955, ..., 2020, 2025, 2030]"
        provenance: "config/config.default.yaml:grouping_years_power; scripts/add_existing_baseyear.py:add_build_year_to_new_assets"
      - key: "existing_capacities.threshold_capacity"
        effect: >
          Drops inherited assets below this MW threshold, and is also read by
          add_brownfield when deciding what to carry forward between horizons.
        default: "10"
        provenance: "config/config.default.yaml:threshold_capacity; scripts/add_brownfield.py:add_brownfield"
      - key: "sector.limit_max_growth.enable"
        effect: >
          Turns on per-carrier absolute and relative deployment growth caps between
          investment periods — the constraint that stops a pathway building 400 GW of
          anything in one five-year step. Wired only for `foresight: perfect` at this ref.
        default: "false"
        provenance: "config/config.default.yaml:limit_max_growth; scripts/solve_network.py:add_max_growth"
      - key: "solving.options.rolling_horizon"
        effect: >
          Switches the solve to sequential overlapping windows via
          n.optimize.optimize_with_rolling_horizon. Disables cyclic storage state of
          charge (prepare_network sets state_of_charge_cyclic / e_cyclic to False), which
          is a real modelling change, not a technicality.
        default: "false"
        provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:optimize_with_rolling_horizon"
      - key: "solving.options.horizon"
        effect: "Window length in snapshots for the rolling-horizon solve (corpus practice: 96 hours)."
        default: "365"
        provenance: "config/config.default.yaml:horizon; scripts/solve_network.py:collect_kwargs"
      - key: "solving.options.overlap"
        effect: >
          Overlap between consecutive windows; only the non-overlapping head is
          committed. Corpus practice is 48 hours against a 96-hour window. Zero overlap
          means each window ends with an artificially empty store.
        default: "0"
        provenance: "config/config.default.yaml:overlap; scripts/solve_network.py:collect_kwargs"
    assembly:
      - step: >
          Choose the mode and the horizon list. This is the whole intervention for the
          three main variants — everything below is what the workflow then does on its
          own, recorded here so a reader can tell config-driven behaviour from bespoke work.
        uses: [overnight-foresight, myopic-foresight, perfect-foresight]
        config: "foresight; scenario.planning_horizons"
        code: null
        provenance: "config/config.default.yaml:foresight; Snakefile:config[\"foresight\"] == \"myopic\""
      - step: >
          (pathway modes) Seed the base horizon's fleet. add_existing_baseyear runs on
          planning_horizons[0] ONLY — enforced by a wildcard_constraints on the rule — and
          assigns build years to power and heating assets.
        uses: [existing-baseyear-brownfield]
        config: "existing_capacities.grouping_years_power; existing_capacities.threshold_capacity"
        code: "scripts/add_existing_baseyear.py"
        provenance: "scripts/add_existing_baseyear.py:add_build_year_to_new_assets; rules/solve_myopic.smk:add_existing_baseyear"
      - step: >
          (myopic) Chain the horizons. add_brownfield takes the PREVIOUS horizon's solved
          network via solved_previous_horizon, carries forward surviving capacity as
          non-extendable, and hands it to solve_sector_network_myopic. A ruleorder
          statement gives add_existing_baseyear priority over add_brownfield so the base
          horizon is not double-processed.
        uses: [myopic-foresight, land-use-constraint]
        config: "scenario.planning_horizons; co2_budget"
        code: "scripts/add_brownfield.py"
        provenance: "scripts/add_brownfield.py:add_brownfield; rules/common.smk:solved_previous_horizon"
      - step: >
          (perfect) Concatenate horizons into one multi-period network. prepare_perfect_foresight
          runs concat_networks over all horizons, sets n.investment_periods from the
          snapshot MultiIndex levels, derives investment_period_weightings["years"] from
          the horizon spacing, and objective weightings from social_discountrate; then
          set_carbon_constraints installs the cumulative Co2Budget plus a terminal
          carbon_neutral constraint and set_all_phase_outs applies exogenous phase-outs.
        uses: [perfect-foresight, co2-budget-pathway, discount-rate-dimension]
        config: "costs.social_discountrate; co2_budget"
        code: "scripts/prepare_perfect_foresight.py"
        provenance: "scripts/prepare_perfect_foresight.py:concat_networks; scripts/prepare_perfect_foresight.py:set_carbon_constraints and set_all_phase_outs"
      - step: >
          Solve. collect_kwargs sets multi_investment_periods from the foresight key, and
          prepare_network branches the vintage constraints: add_land_use_constraint for
          myopic (needs the planning horizon), add_land_use_constraint_perfect plus
          optional add_max_growth for perfect.
        uses: [land-use-constraint, max-growth-limits]
        config: "sector.limit_max_growth.enable"
        code: "scripts/solve_network.py"
        provenance: "scripts/solve_network.py:collect_kwargs; scripts/solve_network.py:add_land_use_constraint_perfect and add_max_growth"
      - step: >
          Aggregate into the pathway answer. Myopic: make_cumulative_costs produces
          csvs/cumulative_costs.csv, and rule all requests it conditionally on
          `foresight == "myopic"`. Perfect: make_summary_perfect writes the whole csv set
          from the single multi-period network. Overnight has no cross-horizon step.
        uses: [global-summary]
        config: null
        code: "scripts/make_cumulative_costs.py / scripts/make_summary_perfect.py"
        provenance: "rules/postprocess.smk:make_cumulative_costs; rules/solve_perfect.smk:make_summary_perfect"
      - step: >
          (rolling-horizon dispatch variant only) Fix capacities from a prior expansion
          run, then switch to windowed solving. The capacity-fixing half is the
          operations rule; the windowing half is the config pair.
        uses: [operations-only-solve, rolling-horizon-dispatch]
        config: "solving.options.rolling_horizon; solving.options.horizon; solving.options.overlap"
        code: "scripts/solve_operations_network.py"
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities; scripts/solve_network.py:optimize_with_rolling_horizon"
    boundary:
      - variant: overnight-greenfield
        rung: L0
        note: >
          The default. `foresight: overnight` and `planning_horizons: [2050]` are already
          the shipped values, so this variant is what you get by doing nothing. Partial
          greenfield (the corpus norm) is also L0-to-L1: existing transmission and hydro
          are inherited by the electricity chain regardless, and choosing to inherit MORE
          is `existing_capacities.*` tuning.
      - variant: single-vs-multi-horizon
        rung: L1
        note: >
          Put several years in `scenario.planning_horizons` while leaving
          `foresight: overnight`. The scenario grammar expands them combinatorially into
          independent parallel runs with per-horizon cost tables and no capacity link —
          exactly the Millinger 2022 / Franken 2025 pattern. One non-default value, fully
          parallel, and the cheapest way to show several target years honestly.
      - variant: myopic-sequential
        rung: L1
        note: >
          `foresight: myopic` plus a multi-element planning_horizons; the Snakefile then
          includes solve_myopic.smk and the chain builds itself. L1 rather than L0 only
          because both keys must move together and the horizon list must be consistent
          across scenarios (the wildcard_constraints on add_existing_baseyear pins the
          base year, and snakemake cannot take a function there — the rule carries a TODO
          about it). The registry rates this `working` and battle-tested.
      - variant: perfect-foresight-multi-period
        rung: L1
        note: >
          `foresight: perfect` — one config value, and solve_perfect.smk builds the
          multi-period network. Genuinely L1 on the config surface, but read the caveat:
          the module warns it is "not properly tested", raises under pypsa >= 1.0, and
          add_CCL_constraints is not implemented for it. Custom constraints from other
          methods will usually need period-awareness added, and THAT is L5 work — so
          quote L1 for the mode and L5 for anything bespoke layered on top.
      - variant: myopic-rolling-horizon-dispatch
        rung: L1
        note: >
          `solving.options.rolling_horizon: true` with horizon/overlap set (corpus: 96/48
          hours), on a network whose capacities are already fixed. Two non-default values.
          The one behavioural surprise is silent: cyclic storage is switched off, so
          seasonal storage results are not comparable to the whole-year run they came from.
    where:
      - change: >
          per-horizon constraint or capacity-carry-forward logic beyond what add_brownfield
          does (e.g. conditioning a horizon on the previous horizon's SOLUTION SET rather
          than its capacities, as vanGreevenbroek 2024 does)
        anchor: "scripts/add_brownfield.py::add_brownfield, driven by rules/common.smk::solved_previous_horizon"
        provenance: "scripts/add_brownfield.py:add_brownfield; rules/common.smk:solved_previous_horizon"
      - change: "period weightings, discounting or the cumulative carbon budget under perfect foresight"
        anchor: "scripts/prepare_perfect_foresight.py::get_investment_weighting / set_carbon_constraints"
        provenance: "scripts/prepare_perfect_foresight.py:get_investment_weighting; scripts/prepare_perfect_foresight.py:set_carbon_constraints"
      - change: "making a custom constraint period-aware so it survives `foresight: perfect`"
        anchor: "scripts/solve_network.py::extra_functionality (branch on n.investment_periods)"
        provenance: "scripts/solve_network.py:extra_functionality; scripts/solve_network.py:add_carbon_budget_constraint"
      - change: "cross-vintage stock accounting other than land (water, biomass, material stocks)"
        anchor: "scripts/solve_network.py::add_land_use_constraint / add_land_use_constraint_perfect as the template"
        provenance: "scripts/solve_network.py:add_land_use_constraint_perfect"
      - change: "pathway-level result aggregation (cumulative discounted cost, transformation timing)"
        anchor: "rule make_cumulative_costs -> scripts/make_cumulative_costs.py"
        provenance: "rules/postprocess.smk:make_cumulative_costs; scripts/make_cumulative_costs.py:make_cumulative_costs"
    cost_profile:
      solves: >
        overnight-greenfield: 1. single-vs-multi-horizon: H independent solves, fully
        parallel. myopic-sequential: H solves, STRICTLY SEQUENTIAL (H = 3 to 7 in the
        corpus). perfect-foresight-multi-period: 1 solve of roughly H times the variable
        count, with inter-period coupling so it is superlinear in practice, not H times a
        single solve. rolling-horizon: ceil(T / (horizon - overlap)) small solves per run.
      relative: >
        ~1x, ~Hx wall-clock-parallel, ~Hx wall-clock-serial, and >>Hx respectively. The
        corpus anchor for a single overnight solve is Parzen 2021: 181 nodes electricity-only
        hourly, ~13 h on 8 cores / 180 GB. Multiply by 6-7 sequential for a myopic
        pathway; perfect foresight at that resolution is out of reach, which is why the
        corpus's only perfect-foresight study used ONE node.
      note: >
        The mitigations are all L0/L1 and are what the corpus's pathway studies actually
        did: TSAM segmentation (vanGreevenbroek 2024 at 750 steps/year, Xiong 2026 at
        2190), coarser nH (3-hourly is the pathway norm vs hourly for overnight), fewer
        nodes (Victoria 2020/2022 at 30-37), and fewer horizons (three, not seven —
        DiBella 2025, Xiong 2026, Geis 2026). Because myopic horizons cannot be
        parallelised, buying resolution back matters more here than for a scenario sweep.
        Budget rule of thumb from the corpus: horizons, nodes, snapshots and scenario
        count all draw on one budget, and pathway studies pay for horizons with snapshots.
    verifies:
      - variant: myopic-sequential
        check: "all(ns[i].generators.p_nom.sum() >= ns[i-1].generators.p_nom_opt.sum() * 0 for i in range(1, len(ns))) and all('p_nom' in ns[i].generators for i in range(len(ns)))"
        over: ensemble
        note: >
          Placeholder-weak by design: the real postcondition is that each horizon's
          network carries the previous horizon's surviving capacity as non-extendable
          input. A failure means add_brownfield did not run or ran on the wrong
          predecessor, which silently turns the pathway into a sequence of unlinked
          overnight runs — the exact confusion this card's fourth pitfall warns about.
      - variant: myopic-sequential
        check: "len(ns) == len(config['scenario']['planning_horizons'])"
        over: ensemble
        note: >
          A short ensemble means horizons were dropped by wildcard expansion rather than
          solved. The run reports success and the pathway simply stops early.
      - variant: perfect-foresight-multi-period
        check: "not n.investment_periods.empty and set(n.investment_period_weightings.columns) >= {'years', 'objective'}"
        over: run
        note: >
          If investment_periods is empty or the weightings are missing, the network was
          not built by prepare_perfect_foresight and multi_investment_periods=True is
          being passed to a single-period network. That is the worst silent failure in
          this method: the solve succeeds, and every horizon's annuity is counted
          undiscounted.
      - variant: perfect-foresight-multi-period
        check: "(n.investment_period_weightings['objective'].diff().dropna() <= 0).all()"
        over: run
        note: >
          Objective weightings must be non-increasing across periods for a positive
          social discount rate. Increasing weightings mean the discount factor was applied
          the wrong way round and the model prefers late investment for arithmetic reasons.
      - variant: overnight-greenfield
        check: "len(n.investment_periods) == 0 and len(config['scenario']['planning_horizons']) == 1"
        over: run
        note: >
          Confirms the run really is single-horizon. A multi-element planning_horizons
          under `foresight: overnight` is legal and produces INDEPENDENT runs — useful,
          but it is single-vs-multi-horizon, not a pathway, and must not be reported as one.
      - variant: myopic-rolling-horizon-dispatch
        check: "not n.storage_units.state_of_charge_cyclic.any() and not n.stores.e_cyclic.any()"
        over: run
        note: >
          Rolling horizon forcibly disables cyclic storage. If cyclic flags survive, the
          run is not actually windowed; if they are off in a run you believed was
          whole-year, seasonal storage results are not comparable to your baseline.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: myopic-foresight
        role: >
          the pathway mode, and the ONLY foresight id earth's registry carries. Status
          `partial`, note: "sector chain, less battle-tested than overnight". Note what
          is NOT in earth's registry: no `overnight-foresight` id (the default is
          undocumented rather than absent), no `perfect-foresight` id at all, and no
          `land-use-constraint` id
      - id: existing-baseyear-brownfield
        role: >
          the base-year seed; `partial`, and the registry names the specific defect —
          "heating brownfield call is commented out in prepare_sector_network"
      - id: discount-rate-dimension
        role: >
          `partial`. Structurally different from eur: earth has `costs.discountrate` (a
          LIST that feeds a filename wildcard) and NO `costs.social_discountrate`, so
          there is no inter-period discounting surface at all — consistent with there
          being no perfect-foresight mode to use one
      - id: technology-cost-year
        role: "one costs_<year>_sec.csv per horizon; `working`, same mechanism as eur"
      - id: scenario-matrix
        role: >
          `working`. planning_horizons is one of eight scenario dimensions that expand
          combinatorially, so multiple INDEPENDENT target years is the cheap path here too
      - id: fleet-retirement-filter
        role: >
          `working` — electricity.powerplants_filter as a pandas query on DateIn/DateOut.
          Earth's most reliable lever for representing time in the fleet without invoking
          the pathway machinery at all
      - id: operations-only-solve
        role: >
          registry status `absent` (present in the registry, verdict: not there) — no
          operations rule and no rolling horizon, so the dispatch-side foresight variant
          has no surface in earth
      - id: co2-cap
        role: >
          `working` — the per-year Co2L cap. The policy instrument a pathway needs; note
          earth has NO `co2-budget-pathway` registry id even though a co2_budget config
          key with a live consumer exists (see `available.how`)
    available:
      verdict: assemble
      how: >
        Two of the three modes exist and one does not, and the split is sharper than the
        registry alone shows.
        OVERNIGHT: turnkey. `foresight: overnight` is the shipped default and the
        Snakefile branches on it to define rule solve_sector_network. Earth's registry has
        no id for it, which is a registry gap, not a capability gap — all four
        earth-family papers in this corpus are overnight runs.
        MYOPIC: assemble, and the `partial` grade is earned. The chain exists
        (add_existing_baseyear -> add_brownfield -> solve_network_myopic, linked by a
        solved_previous_horizon function, with the same ruleorder as eur) and
        add_land_use_constraint IS called when foresight == "myopic" even though the
        registry lists no land-use id. But inputs are commented out in the rules —
        `unpack(input_profile_tech_brownfield)` and `clustered_pop_layout` in
        add_brownfield/add_existing_baseyear — so renewable-profile updates and population
        layouts do not reach the brownfield step, and the registry records the heating
        brownfield call as commented out in prepare_sector_network. Expect to re-enable
        and debug those before trusting a pathway.
        PERFECT: absent. `grep -rn 'perfect' models/pypsa-earth/Snakefile` returns ONE
        hit — a comment on planning_horizons reading "investment years for myopic and
        perfect" — and there is no `if config["foresight"] == "perfect"` branch, no rules/
        directory, no prepare_perfect_foresight equivalent, no `multi_investment_periods`
        anywhere in the repo, and no `costs.social_discountrate` key. The config comment
        promises a mode the code does not implement.
      missing: >
        Procedure step 6 (multi-period network assembly and investment-period weightings)
        and step 7's cumulative-budget half have NO handle: that is the perfect-foresight
        mode in full, and it is the single largest eur/earth asymmetry in this book. Step
        10 (pathway aggregation) has no handle either — no make_cumulative_costs or
        make_summary_perfect equivalent, so cumulative discounted pathway cost must be
        computed outside the workflow. Step 11 (rolling horizon) has no surface at all:
        `rolling_horizon` appears once in earth's solve_network.py inside a COMMENT
        (`# and not rolling_horizon`), and `operations-only-solve` is registry-`absent`.
        Steps 1-5 and 8-9 are present but at `partial` quality for the sector chain.
      provenance: "Snakefile:config[\"foresight\"] == \"myopic\"; scripts/add_brownfield.py:add_brownfield; scripts/solve_network.py:add_land_use_constraint"
    levers:
      - key: "foresight"
        effect: >
          overnight | myopic ONLY. The value `perfect` parses and is named in the
          planning_horizons comment, but no Snakefile branch matches it, so a `perfect`
          run silently produces a DAG with no solve rule rather than an error — the dead
          config value to warn users about.
        default: "'overnight'"
        provenance: "config.default.yaml:foresight; Snakefile:config[\"foresight\"] == \"myopic\""
      - key: "scenario.planning_horizons"
        effect: >
          The horizon list, and simultaneously a filename wildcard on every sector
          resource. Its own config comment reads "investment years for myopic and perfect;
          or costs year for overnight" — note that under overnight it is a COST vintage
          selector, not a horizon.
        default: "[2030]"
        provenance: "config.default.yaml:planning_horizons; Snakefile:solved_previous_horizon"
      - key: "costs.discountrate"
        effect: >
          A LIST of discount rates feeding the annuity calculation and a sector filename
          wildcard. Not a social discount rate: it is per-run WACC, and earth has no
          inter-period equivalent. The registry warns the wildcard "labels runs but the
          value must be kept consistent in costs config by hand".
        default: "[0.071]"
        provenance: "config.default.yaml:discountrate; scripts/process_cost_data.py:annuity"
      - key: "existing_capacities.grouping_years_power"
        effect: >
          Vintage bins for the inherited fleet at the base horizon. Note the range starts
          at 1960 (eur starts at 1900) — for regions with older hydro this drops or
          mis-bins assets, a data-quality issue rather than a code one.
        default: "[1960, 1965, 1970, ..., 2020, 2025, 2030]"
        provenance: "config.default.yaml:grouping_years_power; scripts/add_existing_baseyear.py:add_build_year_to_new_assets"
      - key: "existing_capacities.threshold_capacity"
        effect: "MW floor below which inherited assets are dropped; also read by add_brownfield."
        default: "10"
        provenance: "config.default.yaml:threshold_capacity; scripts/add_brownfield.py:add_brownfield"
      - key: "co2_budget.enable"
        effect: >
          Turns on a per-horizon emission-share trajectory (co2_budget.year, default
          {2020: 1.0 ... 2050: 0.1}) applied by add_co2_budget in prepare_sector_network.
          A live consumer with a real config surface that earth's FUNCTIONALITY registry
          does not list at all — the nearest thing earth has to eur's co2-budget-pathway,
          and off by default.
        default: "false"
        provenance: "config.default.yaml:co2_budget; scripts/prepare_sector_network.py:add_co2_budget"
      - key: "electricity.powerplants_filter"
        effect: >
          A pandas query on the powerplant table's DateIn/DateOut — the mechanical lever
          for retirement and commissioning windows without any pathway machinery. Earth's
          most reliable way to make a single overnight run represent a specific year's
          fleet. Note it ships ALREADY ON, unlike most earth toggles.
        default: "'(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)' — an active-in-2022/23 filter, not off"
        provenance: "config.default.yaml:powerplants_filter; scripts/add_electricity.py:attach_conventional_generators"
    assembly:
      - step: >
          Overnight (turnkey): leave `foresight: overnight` and set planning_horizons to
          the single COST year you want. Under overnight, planning_horizons is a cost
          vintage selector, not a horizon — its own config comment says so.
        uses: [technology-cost-year, scenario-matrix]
        config: "foresight; scenario.planning_horizons"
        code: null
        provenance: "config.default.yaml:foresight; Snakefile:config[\"foresight\"] == \"overnight\""
      - step: >
          Several independent target years: leave foresight at overnight and put several
          years in planning_horizons. The scenario grammar expands eight dimensions
          combinatorially, so this is a parallel fan-out with no capacity link — the
          honest multi-target-year answer, and the pattern all four earth papers in this
          corpus effectively use.
        uses: [scenario-matrix, technology-cost-year]
        config: "scenario.planning_horizons"
        code: null
        provenance: "Snakefile:scenario; config.default.yaml:planning_horizons"
      - step: >
          Myopic pathway: set `foresight: myopic` with a multi-element planning_horizons.
          The Snakefile then defines add_existing_baseyear (wildcard-pinned to
          planning_horizons[0]), add_brownfield (fed by solved_previous_horizon) and
          solve_network_myopic, with `ruleorder: add_existing_baseyear > add_brownfield`.
          add_land_use_constraint fires automatically at solve time.
        uses: [myopic-foresight, existing-baseyear-brownfield]
        config: "foresight; scenario.planning_horizons"
        code: "scripts/add_brownfield.py; scripts/add_existing_baseyear.py"
        provenance: "Snakefile:config[\"foresight\"] == \"myopic\"; scripts/add_brownfield.py:add_brownfield; scripts/solve_network.py:add_land_use_constraint"
      - step: >
          Re-enable the commented-out brownfield inputs before trusting the pathway. In
          the myopic block, `unpack(input_profile_tech_brownfield)` is commented out in
          add_brownfield and `clustered_pop_layout` in add_existing_baseyear, so renewable
          profiles are not refreshed per horizon and population layouts do not reach the
          base-year step; the registry separately records the heating brownfield call as
          commented out in prepare_sector_network. This is the concrete content of the
          `partial` grade and it is L4 work (rule inputs plus wildcard plumbing).
        uses: [myopic-foresight, existing-baseyear-brownfield]
        config: null
        code: "Snakefile (myopic block: rule add_brownfield, rule add_existing_baseyear)"
        provenance: "Snakefile:input_profile_tech_brownfield; scripts/add_existing_baseyear.py:add_build_year_to_new_assets"
      - step: >
          Give the pathway a policy trajectory. `co2_budget.enable: true` activates
          add_co2_budget, which sets a per-horizon share of the base year. This is the
          nearest equivalent to eur's co2_budget/cb tokens; it is off by default and
          carries no registry entry, so verify it fires for your sector configuration.
        uses: [co2-cap]
        config: "co2_budget.enable"
        code: "scripts/prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_co2_budget"
      - step: >
          Perfect foresight: no surface exists. You would port eur's
          prepare_perfect_foresight — concatenate per-horizon networks on a (period,
          snapshot) MultiIndex, populate n.investment_periods and
          n.investment_period_weightings, add a cumulative Co2Budget global constraint with
          an investment_period attribute — add a `perfect` Snakefile branch, and pass
          multi_investment_periods=True at solve time. The pypsa primitive is present in
          the same 0.30.3 environment; nothing new is needed at the library layer.
        uses: [myopic-foresight, discount-rate-dimension]
        config: "a new inter-period discount key (earth has no costs.social_discountrate)"
        code: "new scripts/prepare_perfect_foresight.py + a new Snakefile foresight branch"
        provenance: "pypsa/optimization/optimize.py:multi_investment_periods; pypsa/components.py:investment_period_weightings"
      - step: >
          Pathway aggregation: no handle. There is no make_cumulative_costs or
          make_summary_perfect equivalent, so cumulative discounted cost and
          transformation timing must be computed from the per-horizon postnetworks
          outside the workflow.
        uses: [summary-outputs]
        config: null
        code: "external post-processing over RESDIR postnetworks"
        provenance: "scripts/make_summary.py:calculate_capacity"
      - step: >
          Cheap substitute when the pathway is unaffordable or untrustworthy: represent
          the year through the FLEET instead of through horizons. powerplants_filter is a
          date query on DateIn/DateOut, so a single overnight run can be pinned to a
          specific year's active fleet. This is the pragmatic earth answer to "what does
          2035 look like" and it is L1.
        uses: [fleet-retirement-filter]
        config: "electricity.powerplants_filter"
        code: null
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
    boundary:
      - variant: overnight-greenfield
        rung: L0
        note: >
          The shipped default (`foresight: overnight`, planning_horizons [2030]) and the
          only mode any earth-family paper in this corpus ran. Earth's registry has no
          `overnight-foresight` id, which is a registry gap rather than a capability gap —
          the Snakefile branch and rule exist and were read. Logged in GAPS.md.
      - variant: single-vs-multi-horizon
        rung: L1
        note: >
          Several years in planning_horizons under overnight; the eight-dimension scenario
          grammar fans them out in parallel. Genuinely as cheap as in eur, and the right
          recommendation for earth users who want more than one target year — it needs
          none of the `partial` myopic machinery.
      - variant: myopic-sequential
        rung: L4
        note: >
          The config surface is L1 (`foresight: myopic` + a horizon list) but the honest
          rung is L4, because reaching a trustworthy pathway means editing rule inputs in
          the Snakefile: `unpack(input_profile_tech_brownfield)` and `clustered_pop_layout`
          are commented out, and the heating brownfield call is commented out in
          prepare_sector_network. Registry status is `partial` for both myopic-foresight
          and existing-baseyear-brownfield, and that is the reason. Contrast with eur,
          where the same variant is L1 and rated battle-tested — the single most
          actionable asymmetry on this card.
      - variant: perfect-foresight-multi-period
        rung: L5
        note: >
          ABSENT. No `perfect` Snakefile branch, no rules/ directory, no
          prepare_perfect_foresight equivalent, no `multi_investment_periods` anywhere in
          the repo, no costs.social_discountrate key, and no registry id — while eur rates
          it `working`. The config comment on planning_horizons naming "perfect" is a dead
          promise: setting `foresight: perfect` yields a DAG with no matching solve rule
          rather than an error. L5 rather than L4 because the multi-period network
          assembly and period-aware global constraints are new Python (~200 lines,
          following eur's file), though the pypsa primitive underneath is present, so this
          is L5-with-a-handle: a port, not a formulation. If a user needs perfect
          foresight, the routing answer is "use pypsa-eur", and that is a MODEL-SELECTION
          verdict, not a work estimate.
      - variant: myopic-rolling-horizon-dispatch
        rung: L5
        note: >
          No surface at either end. `rolling_horizon` appears in earth's solve_network.py
          only inside a comment, there are no horizon/overlap config keys, and
          `operations-only-solve` is registry-`absent` (no operations rule; the nearest
          route is setting extendable=false everywhere and re-solving). The pypsa
          primitive optimize_with_rolling_horizon exists in the same environment, so this
          too is a wiring job rather than new formulation — but both halves (fix
          capacities, then window the solve) must be written.
    where:
      - change: "re-enable the commented-out brownfield rule inputs (the `partial` grade)"
        anchor: "Snakefile, myopic block: rule add_brownfield input `unpack(input_profile_tech_brownfield)`; rule add_existing_baseyear input `clustered_pop_layout`"
        provenance: "Snakefile:input_profile_tech_brownfield; Snakefile:solved_previous_horizon"
      - change: "capacity carry-forward logic between horizons"
        anchor: "scripts/add_brownfield.py::add_brownfield"
        provenance: "scripts/add_brownfield.py:add_brownfield"
      - change: "cross-vintage land accounting (present but registry-unlisted)"
        anchor: "scripts/solve_network.py::add_land_use_constraint / _add_land_use_constraint_m"
        provenance: "scripts/solve_network.py:add_land_use_constraint; scripts/solve_network.py:_add_land_use_constraint_m"
      - change: "per-horizon carbon trajectory"
        anchor: "scripts/prepare_sector_network.py::add_co2_budget (gated on co2_budget.enable)"
        provenance: "scripts/prepare_sector_network.py:add_co2_budget"
      - change: "port perfect foresight: multi-period network assembly + period weightings"
        anchor: "new script modelled on eur's prepare_perfect_foresight, plus a `perfect` branch beside Snakefile's myopic branch"
        provenance: "Snakefile:config[\"foresight\"] == \"myopic\"; scripts/solve_network.py:add_land_use_constraint"
      - change: "represent a target year through the fleet instead of through horizons"
        anchor: "electricity.powerplants_filter -> scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
    data_dependencies:
      - input: "regional powerplant fleet with credible DateIn/DateOut commissioning dates"
        required_for: "myopic-sequential (and any fleet-based year pinning)"
        availability: >
          region-dependent — this is earth's real blocker for pathways, and it is DATA,
          not code. Vintage carry-forward is only as good as the build years behind it,
          and `existing_capacities.grouping_years_power` starts at 1960 (eur starts at
          1900), so older assets are dropped or mis-binned. Check the country's grade in
          cookbooks/pypsa-earth/data_quality before promising a pathway; a C/D-grade fleet
          makes a myopic pathway less trustworthy than an honest overnight run.
      - input: "per-horizon technology cost tables (costs_<year>_sec.csv)"
        required_for: "myopic-sequential, single-vs-multi-horizon"
        availability: >
          exists by default via technology-data (technology-cost-year is `working`), but
          the cost projections are European-derived; country_specific_data is limited, so
          treat non-European cost trajectories as an assumption to sign off with the user.
      - input: "regional emission baseline for a co2_budget trajectory"
        required_for: "myopic-sequential with a policy pathway"
        availability: >
          must be built — co2_budget.enable is false by default and co2base_value must be
          configured; earth has no registry entry for the budget pathway, and per-country
          historical baselines are not shipped the way eur's are.
    cost_profile:
      solves: >
        overnight: 1. single-vs-multi-horizon: H parallel. myopic-sequential: H strictly
        sequential, plus a realistic debugging multiplier while the commented-out inputs
        are re-enabled. perfect foresight and rolling horizon: not applicable — no
        implementation to cost.
      relative: >
        ~1x / ~Hx-parallel / ~Hx-serial. Earth's base cases are usually far cheaper than
        eur's (smaller regions, 10-14 nodes typical in this corpus, often electricity-only),
        so a myopic pathway is mechanically MORE affordable here than on a sector-coupled
        eur run — the compute tradeoff runs opposite to the capability tradeoff.
      note: >
        Compute is not earth's binding constraint for this method; correctness is. Budget
        engineering time for the commented-out brownfield inputs and validation time
        against the regional fleet data, not solver hours. If the pathway cannot be made
        trustworthy, the better answer is one overnight run per target year plus
        powerplants_filter to pin the fleet — cheap, parallel, and honest about not being
        a pathway.
    verifies:
      - variant: myopic-sequential
        check: "all(not ns[i].generators.query('p_nom > 0 and not p_nom_extendable').empty for i in range(1, len(ns)))"
        over: ensemble
        note: >
          Every non-base horizon must contain inherited non-extendable capacity. An empty
          result means add_brownfield produced nothing and each horizon solved as an
          independent greenfield run — the specific silent failure the commented-out rule
          inputs make likely here, and the reason this variant is L4 rather than L1.
      - variant: myopic-sequential
        check: "len(ns) == len(config['scenario']['planning_horizons'])"
        over: ensemble
        note: >
          A short ensemble means horizons were dropped by wildcard expansion. Earth's
          eight-dimension wildcard grammar makes this easier to trip than in eur.
      - variant: overnight-greenfield
        check: "len(n.investment_periods) == 0"
        over: run
        note: >
          Earth should never produce a multi-period network — there is no code path that
          would. A non-empty investment_periods means the network came from somewhere
          other than this workflow.
      - variant: perfect-foresight-multi-period
        check: "False"
        over: run
        note: >
          Deliberately unsatisfiable: there is no perfect-foresight implementation in
          pypsa-earth at this ref, so any run claiming the variant is misconfigured.
          Setting `foresight: perfect` matches no Snakefile branch and yields a DAG with
          no solve rule rather than an error — this check exists so the referee fails
          loudly where the workflow would fail quietly.
      - variant: myopic-rolling-horizon-dispatch
        check: "False"
        over: run
        note: >
          Same: no rolling-horizon surface in pypsa-earth (comment-only in solve_network.py,
          no horizon/overlap keys, operations-only-solve registry-`absent`). Route this
          variant to pypsa-eur.
