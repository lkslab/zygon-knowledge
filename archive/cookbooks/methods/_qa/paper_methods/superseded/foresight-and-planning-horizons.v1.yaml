id: foresight-and-planning-horizons
title: "Foresight mode and planning horizons (overnight / myopic / perfect foresight)"
summary: >
  Whether investment is decided once for a single target year, horizon by horizon
  without knowing the future, or for all horizons simultaneously — the choice of what
  the investor is assumed to know when it commits capital.
question: >
  Is the answer a target-year end state, or a sequence of decisions — and does the
  investor in the model know what comes next?
aliases:
  - "myopic optimisation"
  - "myopic optimization"
  - "myopic foresight"
  - "myopic pathway"
  - "non-anticipative foresight"
  - "limited foresight"
  - "perfect foresight"
  - "multi-investment-period optimisation"
  - "multi-horizon optimisation"
  - "overnight scenario"
  - "overnight optimisation"
  - "greenfield optimisation"
  - "partial greenfield"
  - "planning horizon"
  - "investment period"
  - "transition path / transition pathway"
  - "pathway optimisation"
  - "sequential investment planning"
when_to_use:
  - "what should the system look like in 2050"
  - "what should we build first, and when"
  - "give me a transition pathway, not just an end state"
  - "how much does it cost to delay action by ten years"
  - "is it cheaper to decarbonise early or late"
  - "which investments are stranded if we build the wrong thing now"
  - "should the model know about future carbon prices when it invests"
  - "we need 2030 and 2040 milestones, not one target year"
  - "why does the model build something in 2030 that it tears out in 2040"
  - "how sensitive is the answer to assuming investors are clairvoyant"
family: foresight-and-pathways
prevalence:
  papers: 81
  tier1: 52
  tier2: 29
  sweep_hits: 65
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) coded 81 papers — the most
    prevalent method in the book, because every capacity-expansion study makes this
    choice whether or not it names it. The regex screen returned only 65, so here it
    UNDER-counts: a paper that simply optimises 2050 once never writes the word
    "overnight" or "greenfield", it just reports a target year. That is exactly why
    the method is worth a card — the default is invisible in the text. Role split is
    2 canonical-use / 79 routine-use and 0 `defines`: PyPSA inherited the taxonomy
    from the wider energy-modelling literature (Gerbaulet et al. is cited for the
    myopic/perfect contrast by Victoria 2020, but is not in this corpus), so no paper
    here introduced it. `EVIDENCE_INDEX.md` flags three of these as mention-only
    suspects (2026_Duque-Perez, 2026_Fernandes, 2026_Geis_Price-Formation); all three
    are KEPT, because their flagged notes describe an explicit, quoted foresight
    choice ("overnight greenfield optimisation", "myopic foresight in 5-year steps"),
    and for this method making the choice IS exercising it. The heuristic misfires
    because a routine foresight choice reads like a passing remark.
procedure:
  - step: >
      Decide what the answer is about: an end state (one target year) or a sequence
      (several horizons). This is a question-scoping decision, not a modelling one,
      and it fixes everything below. 33 of 81 corpus papers never revisit it — they
      pick one year and stop.
    handle: "scenario.planning_horizons (a one-element list vs a list of years)"
    provenance: "config/config.default.yaml:planning_horizons; rules/common.smk:solved_previous_horizon"
  - step: >
      Choose the foresight mode. Overnight: one horizon, all capital decided at once
      against that year's costs and constraints. Myopic: each horizon solved in turn,
      seeing only inherited capacity and its own targets. Perfect: all horizons in one
      LP, so the objective trades a 2030 euro against a 2045 euro.
    handle: "foresight: overnight | myopic | perfect"
    provenance: "config/config.default.yaml:foresight; Snakefile:config[\"foresight\"] == \"overnight\""
  - step: >
      Set the cost vintage per horizon. Overnight studies pick ONE technology-cost
      year, and the corpus routinely decouples it from the target year (2050 system
      built at 2030 costs is the single most common combination). Pathway studies pull
      one cost table per horizon, which is what makes deferral cheaper in-model.
    handle: "costs.year / one costs_<year>_processed.csv per planning horizon"
    provenance: "rules/retrieve.smk:retrieve_cost_data; rules/common.smk:solved_previous_horizon"
  - step: >
      Seed the base year: read the existing fleet, assign build years and lifetimes,
      and decide which assets are non-extendable. Pure greenfield skips this; the
      corpus's dominant practice is PARTIAL greenfield (existing transmission and
      hydro fixed, everything else from zero). Detail lives in
      `brownfield-and-capacity-vintaging`.
    handle: "rule add_existing_baseyear"
    provenance: "scripts/add_existing_baseyear.py:add_build_year_to_new_assets"
  - step: >
      (myopic only) Between horizons, carry forward the previous horizon's SOLVED
      capacities that have not reached end of life, fix them as non-extendable, and
      hand the network to the next solve. This is the sequencing itself: the previous
      solve's output is the next solve's input, so horizons cannot be parallelised.
    handle: "rule add_brownfield, fed by solved_previous_horizon"
    provenance: "scripts/add_brownfield.py:add_brownfield; rules/common.smk:solved_previous_horizon"
  - step: >
      (perfect only) Concatenate the per-horizon networks into ONE network with a
      MultiIndex (period, snapshot), set investment_periods, and derive year
      weightings plus discounted objective weightings from the social discount rate.
      This is the mechanism: without period weightings the objective would sum
      undiscounted annuities across three decades.
    handle: "rule prepare_perfect_foresight"
    provenance: "scripts/prepare_perfect_foresight.py:concat_networks; scripts/prepare_perfect_foresight.py:get_investment_weighting and get_social_discount"
  - step: >
      Re-express the policy constraint in the chosen mode's terms. Overnight/myopic
      take a per-year cap. Perfect foresight needs a CUMULATIVE budget over periods
      plus a terminal net-zero constraint, because a single-year cap in period 3 says
      nothing about periods 1-2.
    handle: "co2_budget per horizon; set_carbon_constraints / add_carbon_budget_constraint"
    provenance: "scripts/prepare_sector_network.py:build_carbon_budget; scripts/prepare_perfect_foresight.py:set_carbon_constraints; scripts/solve_network.py:add_carbon_budget_constraint"
  - step: >
      Add the constraints that only exist because there are vintages: land use must
      account for what earlier vintages already occupy (or later horizons double-book
      the same hectare), and deployment growth caps between periods keep the pathway
      physically plausible.
    handle: "add_land_use_constraint / add_land_use_constraint_perfect; add_max_growth"
    provenance: "scripts/solve_network.py:add_land_use_constraint; scripts/solve_network.py:add_land_use_constraint_perfect; scripts/solve_network.py:add_max_growth"
  - step: >
      Solve. Overnight and myopic are single-period LPs (one per horizon for myopic);
      perfect foresight passes multi_investment_periods=True into model creation,
      which switches pypsa to period-aware capacity accounting and objective
      weighting.
    handle: "collect_kwargs -> model_kwargs['multi_investment_periods']"
    provenance: "scripts/solve_network.py:collect_kwargs"
  - step: >
      Aggregate across horizons into the pathway result: cumulative discounted system
      cost, per-horizon capacity trajectories, and the timing of each transformation.
      An overnight study has nothing to aggregate; this step is what makes a pathway
      answer a pathway answer.
    handle: "rule make_cumulative_costs (myopic) / rule make_summary_perfect (perfect)"
    provenance: "rules/postprocess.smk:make_cumulative_costs; rules/solve_perfect.smk:make_summary_perfect"
  - step: >
      (dispatch-side variant) If the question is about operation rather than
      investment, replace whole-year perfect foresight with sequential overlapping
      windows: solve H hours, keep the first H-overlap, roll forward. This is the
      foresight question at the hour scale rather than the decade scale.
    handle: "solving.options.rolling_horizon + horizon/overlap"
    provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:optimize_with_rolling_horizon"
variants:
  - id: overnight-greenfield
    what: >
      One target year, all capacity decided at once, no inherited fleet (or only
      fixed hydro and transmission — "partial greenfield", which is what the corpus
      actually does far more often than pure greenfield). Cheapest and by far the
      most common: 54 of 81 papers. Buys you an end-state answer and nothing about
      timing. The near-universal default combination is a mid-century target year
      priced at 2030 cost projections.
    papers:
      - "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
      - "2025_Burghardt_material-needs-energy-technologies.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
  - id: single-vs-multi-horizon
    what: >
      The horizon-COUNT dimension, orthogonal to the foresight mode: several
      independent single-year runs at different target years, compared side by side
      but NOT linked by inherited capacity. Millinger 2022 states it exactly —
      "capacities built in scenarios for 2040 are not considered in scenarios for
      2060". Cheap and parallelisable, and it is the honest way to show cost-decline
      effects without claiming a pathway. Distinct from myopic-sequential, which
      links them; distinct from overnight-greenfield, which runs one year only. The
      failure mode is presenting the sequence AS a pathway.
    papers:
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
      - "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
      - "2025_Che_space-based-solar-power-european-decarbonization.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
  - id: myopic-sequential
    what: >
      Several horizons solved in order, each seeing only inherited capacity and its
      own targets. The corpus standard is 5-year steps from 2020/2025 to 2045/2050
      (6-7 horizons), though 3-horizon variants (2030/2040/2050) are used when
      compute binds. Buys timing, stranded-asset visibility and per-horizon prices;
      costs you global optimality and multiplies solve count by the number of
      horizons with NO parallelism, because horizon k needs horizon k-1's solution.
      Note the subtlety most papers state explicitly: foresight is myopic BETWEEN
      periods and perfect WITHIN each year's 8760 hours.
    papers:
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
      - "2025_Lindner_PyPSA-DE_EEM.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
  - id: perfect-foresight-multi-period
    what: >
      All horizons co-optimised in ONE model with investment-period weightings, so
      capital in period 1 is chosen knowing period 7's constraints. The only mode in
      which a CUMULATIVE carbon budget is a real constraint and in which endogenous
      learning is meaningful (you must anticipate the cost decline to invest into
      it). Buys the globally optimal pathway and a genuine intertemporal tradeoff;
      costs you one LP roughly N_periods times the size of a single horizon — the
      corpus's only user collapsed Europe to a SINGLE node to afford 7 periods.
      Rarest variant in the corpus (1 of 81) and rarest in the wild for the same
      reason.
    papers:
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
  - id: myopic-rolling-horizon-dispatch
    what: >
      The same foresight question at the hour scale, on the dispatch side: solve a
      window of H hours, commit the first H-overlap of it, roll forward, instead of
      seeing the whole year. Answers "does this storage strategy survive an operator
      who cannot see next month" — a question whole-year perfect foresight cannot
      even pose. Corpus practice is a 96-hour window with 48-hour overlap, with a
      48-hour sensitivity. Requires fixed capacities (see
      `operational-dispatch-and-rolling-horizon` for the dispatch-side card).
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
literature:
  # ── the papers that make foresight the SUBJECT ─────────────────────────────
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference myopic study in this literature and the one to quote when a user
      asks whether foresight mode matters. Two CO2-budget-EQUIVALENT paths (Early &
      Steady vs Late & Rapid) over seven 5-year myopic steps 2020-2050, 30 nodes,
      hourly, sector-coupled: front-loading saves ~350 bn EUR cumulative even though
      both paths emit the same total. Defines the house wording every later paper
      reuses — "optimised in every time step ... no information about the future" —
      and is explicit that each step is internally a perfect-foresight single-year LP.
      It is also the paper that made 5-year steps 2020-2050 the corpus default.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      The other half of the same programme, and the clearest in-corpus statement of
      the myopic penalty: "Contrary to assuming perfect foresight, the myopic approach
      provides a more expensive solution." Six carbon budgets (1.5-2 degC) over seven
      myopic steps at 37 nodes / 3-hourly / full sector coupling, with the per-step CO2
      cap set by an exogenous exponential decay. Its discount-rate and social-cost-of-
      carbon sensitivities are the evidence that in a myopic pathway the discount rate
      is doing much of the timing work — see `discounting-and-cost-of-capital`.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      The only corpus paper to extend a method (MGA) ONTO the myopic multi-horizon
      structure rather than merely inheriting it: near-optimal sets per horizon,
      conditioned on reachability from the previous horizon's set. 6 horizons
      2025-2050, 50 nodes, 750 segments, 216 scenarios, 7% discount rate. Contributes
      the honest limitation to relay verbatim: "Modelling with myopic foresight over
      the planning horizons (as opposed to perfect foresight) can lead to sub-optimal
      transition pathways", and separately that greedy per-horizon sequences are not
      globally optimal.
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: canonical-use
    note: >
      The canonical reference for foresight AT THE HOUR SCALE, and the only corpus
      paper that runs three foresight regimes side by side on the same system: (1)
      long-term perfect-foresight capacity expansion over a 70-year hourly weather
      series, (2) short-term perfect-foresight dispatch at those fixed capacities, (3)
      short-term MYOPIC dispatch on a 96-hour rolling window with 48-hour overlap (48-h
      sensitivity too). Its finding — that myopic storage dispatch with a constant
      marginal-storage-value bid recovers most of the perfect-foresight outcome — is
      the reason to take rolling horizon seriously rather than treat whole-year
      foresight as harmless. States the objection plainly: "Assuming perfect foresight
      over multiple years ... is unrealistic."
  - paper: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      The corpus's ONLY perfect-foresight multi-period study, and therefore the whole
      empirical basis for that variant: 7 investment periods 2020-2050 at 5-year
      intervals, all co-optimised in one MILP. Shows what the mode costs you
      spatially — Europe collapsed to a SINGLE node with six representative renewable
      regions to afford it. Also demonstrates why the mode is not optional for its
      question: endogenous learning-by-doing only bites if investment anticipates the
      cost decline. Sets the social discount rate to zero deliberately, which is a
      reminder that in perfect foresight the discount rate IS the intertemporal
      preference, not a bookkeeping detail.
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: routine-use
    note: >
      Benchmarks whole-year perfect-foresight dispatch AGAINST a rolling horizon on
      five historical years (2020-2024, 39 nodes, hourly, fixed capacities), using
      perfect foresight as the baseline the rolling horizon is measured against. The
      corpus's evidence that the foresight assumption is testable against reality
      rather than merely arguable; pairs with `model-validation-and-backtesting`.
  - paper: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      The most precise statement in the corpus of the within/between distinction:
      "perfect foresight with 3-hourly time resolution inside each investment year,
      but myopic foresight between the investment periods ... investments cannot
      anticipate future CO2 budgets or energy prices." Five periods 2025-2050, 39
      regions, full sector coupling. Investigates the CONSEQUENCE of that limited
      foresight directly via a zero-emission-vehicle mandate sensitivity — i.e. uses
      a policy instrument to substitute for the foresight the model lacks, which is
      the practical answer when perfect foresight is unaffordable.
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      Argues the myopic mode as a FEATURE rather than a compromise: "non-anticipative
      foresight, reflecting the reality that market participants do not have perfect
      knowledge", explicitly against "overly optimistic outcomes of long-term perfect
      foresight models". Three horizons 2030/2040/2050 at 99 onshore regions with
      committed infrastructure carried forward, plus a regret analysis over short-term
      uncertainty scenarios. The card's best citation for a user who wants a defensible
      reason to choose myopic over perfect.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Same within/between framing on PyPSA-DE at 3 investment periods (2025/2035/2045),
      hourly 8760 per period, 49 regions. Useful because its Limitations section names
      the specific distortion: "perfect foresight within each optimisation year implies
      fully optimised storage operation" — i.e. the within-year foresight, not the
      between-period myopia, is what flatters storage.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Names the consequence nobody else states: "As we use a myopic modelling approach
      with independent yearly optimisations, the time value of money across years is
      not considered." Six independent 5-year-step optimisations 2020-2045, each an
      overnight problem with annuitised capital costs. That is the correct reading of
      what myopic mode in pypsa-eur actually does to discounting — there is no
      cross-period discount factor, only per-year annuities, which is exactly why
      `costs.social_discountrate` has no effect outside perfect foresight.
  # ── myopic-sequential, the remaining pathway users ─────────────────────────
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      Myopic 5-year steps 2020-2050 on the PyPSA-Eur-Sec-30-path fork descended from
      Victoria 2020, inheriting its beta-distribution CO2 path. Contributes the
      mechanism of the myopic penalty in one clause — myopic optimisation "may incur
      higher overall system costs compared to perfect foresight optimization due to
      STRANDED INVESTMENTS" — which is the causal story to give a user, not just the
      magnitude.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      A 3-horizon myopic run (2030/2040/2050) on PyPSA-Eur at 39 nodes / 3-hourly,
      contrasted in-text against the greenfield-2050 studies it builds on. Its stated
      reason for choosing myopic is the one interviews should reuse: "Modelling myopic
      transition pathways captures how investment timing affects final prices" — i.e.
      choose myopic when the ANSWER is a price or a timing, not a capacity.
  - paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      Six myopic horizons 2025-2050 at 37 nodes / 3-hourly, each horizon carrying a
      carbon budget. Contributes the pattern for a pathway whose first horizon is
      partly exogenous: 2025's land-transport mix is fixed at 96% ICE / 4% EV and only
      from 2030 does the model choose powertrains. Pinning the base horizon to observed
      reality is standard practice worth copying, since a myopic 2025 solved freely
      will not resemble 2025.
  - paper: "2025_Lindner_PyPSA-DE_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Myopic 5-year steps 2020-2045 across 49 regions with full sector coupling and
      both electricity and hydrogen transmission — the reference for what a myopic
      pathway costs at national high resolution. Notably runs a single scenario and
      reports NO perfect-foresight comparison, which is the honest norm: almost nobody
      can afford to run both.
  # ── single-vs-multi-horizon: several unlinked target years ─────────────────
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The cleanest statement of the multi-horizon-without-a-pathway pattern:
      overnight 2040 and 2060 run separately, and "capacities built in scenarios for
      2040 are not considered in scenarios for 2060". 37 nodes, hourly for main runs,
      237 representative steps for sensitivities. The template for showing two target
      years honestly without implying a transition.
  - paper: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    tier: 1
    role: routine-use
    note: >
      Three independent overnight optimisations (2030/2040/2050) of islanded energy
      supply chains, with exogenously projected CAPEX per year and NO vintaging:
      "we use a greenfield approach ... and disregard existing infrastructure". Shows
      what the pattern is FOR — isolating the technology-cost-decline effect on LCoE,
      which a single target year cannot display and a myopic pathway would confound
      with inheritance.
  - paper: "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: >
      Two separate overnight optimisations (2025 and 2030) at 37 bidding zones /
      3-hourly rather than a pathway. Contributes the mixed-boundary pattern common in
      consumer-procurement studies: greenfield for the participating consumers' own
      assets, brownfield for the background system.
  - paper: "2025_Che_space-based-solar-power-european-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      2020 and 2050 solved independently at 37 nodes / 3-hourly, with 2020 serving as
      a reference/validation year and 2050 as the decarbonisation scenario on an
      identical network with updated costs and a zero CO2 cap. The lightest-weight way
      to anchor an overnight future run against a validated present one.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Six target years (2025-2050 in 5-year steps) each solved as an INDEPENDENT
      overnight run, with renewable capacities fixed exogenously from the GB Future
      Energy Scenarios and only dispatchable capacity and distribution grid endogenous.
      The pattern for when an external scenario supplies the trajectory: you get
      horizon-by-horizon results without needing myopic machinery, at the price of not
      optimising the trajectory at all.
  - paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    tier: 2
    role: routine-use
    note: >
      2030 and 2040 built independently at 1024 nodes, with capacity targets taken from
      the EC 2040 Impact Assessment rather than optimised as a pathway. Evidence that at
      very high spatial resolution the horizon count is the first thing sacrificed.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The important structural case: 14 single-year perfect-foresight-within-the-year
      PyPSA-Eur networks (2030-2150) solved in PARALLEL, with the intertemporal
      foresight supplied entirely by the coupled IAM (REMIND, perfect foresight to
      2100) rather than by PyPSA. Shows the third option a user should know about — if
      you need a pathway and cannot afford perfect foresight in PyPSA, you can borrow
      one from an IAM and keep PyPSA single-period. See `soft-linking-with-iam`.
  # ── myopic-rolling-horizon-dispatch ────────────────────────────────────────
  - paper: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Six independent dispatch-only years (2013-2018) at up to 306 nodes with
      historically fixed capacities and no investment variables at all. The degenerate
      end of the foresight ladder — with capacities fixed, foresight mode reduces to a
      dispatch-window question — and the reference for what "no investment decision"
      looks like as a deliberate choice for historical reproduction.
  # ── overnight-greenfield: the field's actual default ───────────────────────
  - paper: "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Single-year overnight greenfield on a pre-PyPSA 30-node European model, 8 years
      of hourly weather, no storage, 4%/yr discount rate with technology-specific
      lifetimes (wind/solar 25 y, CCGT 30 y, transmission 40 y). The earliest data
      point for the field's default and evidence that it predates PyPSA-Eur: chose
      overnight because there was no pathway machinery to choose otherwise.
  - paper: "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
    tier: 2
    role: routine-use
    note: >
      Overnight investment done by ENUMERATION rather than optimisation: candidate
      capacities stepped in 5%-of-peak increments to 150%, each dispatched
      independently for one year with PyPSA as the dispatch engine inside an
      Excel-driven expansion framework. Useful as the boundary case — a study can make
      the overnight choice without an expansion LP at all.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight greenfield at 37-362 buses, every third hour of 2012, 95% CO2
      reduction; existing hydro fixed, everything else expandable from zero. Records
      the founding wording of the field's default — "assuming perfect foresight, with
      2012 chosen as the representative year" — where "perfect foresight" means over
      the year, not over horizons. That ambiguity is the single most common source of
      confusion in this method and is why the card separates within-year from
      between-period foresight everywhere.
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Single-year greenfield overnight, 30 country nodes, hourly, 2011 weather, 7%
      discount rate, 2030 cost estimates; only hydro and PHS inherited and treated as
      fully amortised. The canonical "amortised inheritance" shortcut: assets you do
      not want to optimise are given zero capital cost rather than a build year.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Same 30-node overnight greenfield model swept over weather years; 7% discount
      rate, 2030 costs. Notes the one place overnight can span multiple years without
      becoming a pathway — "one or multiple years with hourly resolution" in a SINGLE
      solve, which is a longer weather sample, not more horizons.
  - paper: "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Explicit per-interval greenfield across climate sub-intervals: "For each period,
      the problem is solved as a green field investment problem, i.e., without initial
      capacities", with 6-8-year sub-intervals solved independently. Contributes the
      diagnostic reading a user needs: capacity differences between adjacent
      independent runs are weather artefacts, NOT investment dynamics — which is
      precisely the misreading that makes people mistake a horizon sweep for a pathway.
  - paper: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight single target year at 64 k-means nodes, 3-hourly, 2012 weather. A
      representative routine user: the foresight choice is never named in the paper,
      only implied by the single annual objective — the invisible default this card
      exists to make visible.
  - paper: "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Dispatch-only 2015 at 128 German nodes with all capacities fixed, alongside a
      separate single-year 2020 run of the non-PyPSA IKARUS model. Chose 2020 for a
      structural reason worth reusing — "before the complete nuclear phase-out in
      Germany (2022) such that mixing effects can be avoided": the target year can be
      chosen to avoid a vintage transition rather than to represent one.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight greenfield single year (2015 weather) on PyPSA-Eur-Sec-30 with urban
      and rural heat buses; existing hydro fixed at 2011, all else from zero. Notes
      transition pathways as future work — one of the earliest in-corpus admissions
      that the overnight choice was a capability limit rather than a preference.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      States the compute reason for the default outright: "only one year is solved at a
      time, due to computational limitations", plus "greenfield investment planning,
      meaning we ignore existing plants and infrastructure". 31 provincial nodes,
      hourly, 2050 demand at 2030 costs, and 38 weather years run independently — the
      corpus's clearest example of spending the horizon budget on weather years
      instead.
  - paper: "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Single-target-year greenfield generation-plus-transmission expansion, 20-100
      German nodes, 100-400 TSAM-reduced snapshots, no storage. Representative of the
      methods-development subset: when the paper's contribution is an algorithm, the
      foresight mode is held at the cheapest setting on purpose.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      "Greenfield optimisation is implemented, i.e., the European energy system is
      built from scratch. Cost assumptions correspond to projections for 2030" —
      30 nodes, sector-coupled, hourly. By the same group that later built the myopic
      pathway model, so it dates the field's shift from end state to pathway to
      2019-2020.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight greenfield per scenario/CO2-cap combination at 30 nodes, 7% discount
      rate, PHS and reservoir hydro the only inherited assets and treated as fully
      amortised. Names the framing that makes overnight coherent — "long-term market
      equilibrium" — which is the right way to describe an overnight result to a user:
      an equilibrium end state, not a plan.
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      The most quotable disclaimer in the corpus, and the sentence to reuse when
      telling a user what an overnight answer is not: "This formulation does not
      include pathway optimization (i.e. no sequences of investments), but searches for
      a cost-optimal layout corresponding to a given GHG emission reduction level."
      100 nodes, 2-hourly, greenfield except existing transmission and hydro.
  - paper: "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Single-period overnight expansion at 250-1000 nodes on 1-75 representative
      snapshots. Shows the standard tradeoff shape: horizons traded away entirely to
      buy spatial resolution and a hard MILP formulation. The annuity factor is the
      only intertemporal object in the model.
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Greenfield long-term equilibrium — "The model completely rebuilds the existing
      generation system ('greenfield investment') except for pumped hydro storage" —
      5 nodes, 2010 weather, 7% discount rate. Relevant because the paper's subject is
      market value, and overnight greenfield is the mode in which long-run equilibrium
      market-value theory holds exactly; choosing myopic here would have broken the
      theory the paper tests.
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight single year (2013 weather, 2030 costs, 95% CO2 cut) swept across
      37-1024 nodes with the 2018 grid as the fixed starting topology. Gives the
      standard justification for the cost-vintage/target-year decoupling: 2030 costs
      are "the earliest feasible transformation date and result in conservative cost
      assumptions".
  - paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight single-year investment on a 50-bus German network at 7% discount rate,
      2030 cost assumptions. Representative of security-focused studies: with unit
      commitment and corrective contingency dimensioning in the model, one horizon is
      already all the compute there is.
  - paper: "2021_Glismann_ancillary-services-acquisition-model.pdf"
    tier: 2
    role: routine-use
    note: >
      One simulated day, 96 fifteen-minute steps, agents optimising over the remaining
      day-ahead schedule horizon — no investment at all. The extreme short end of the
      horizon axis: the same look-ahead question this card poses at decade scale,
      posed at intraday scale inside an agent-based market simulation.
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      "the model assumes perfect competition and foresight for one reference year" —
      181 nodes, hourly, 2030 target, greenfield wind/solar over a fixed existing
      conventional fleet, ~13 h on 8 cores / 180 GB. The corpus's most concrete
      overnight compute datapoint, and the number to base a multi-horizon estimate on.
  - paper: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Overnight greenfield 16-node German system, hourly, 100% GHG reduction, "perfect
      foresight ... with an hourly temporal resolution". Its subject is storage
      distortions, which makes it the natural pairing for the pitfall that whole-year
      foresight flatters storage; the paper controls for other distortions while
      leaving that one in place.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Single-year overnight net-zero 2050 at 48 nodes, sector-coupled, with existing
      network capacities used as UPPER BOUNDS rather than fixed values. That is a third
      inheritance pattern beyond greenfield and brownfield — inherit the topology as a
      cap — and it is the cheapest way to stop an overnight run proposing a
      physically implausible grid.
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: routine-use
    note: >
      The clearest definition of PARTIAL greenfield in the corpus: "a partial greenfield
      approach under perfect foresight, including existing transmission (expandable),
      hydropower and nuclear capacities (both non-extendable), but optimising renewables
      ... gas turbines and storage from zero." 41 weather years at 3-hourly, each
      treated as a possible realisation of 2030 — an explicit statement that repeated
      single-year runs are an ensemble over conditions, not a time series.
  - paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight greenfield at 250 nodes / 4380 snapshots, 100% power-sector emission
      cut, existing transmission and hydro the only exceptions. Another
      methods-development paper holding foresight at the cheapest setting to afford a
      harder power-flow formulation.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: routine-use
    note: >
      The pypsa-earth reference paper, and the direct evidence for this card's earth
      verdict: it LISTS "single or multi-year optimization" as a feature but the
      demonstration runs only single target years — 2020 dispatch validation and 2060
      net-zero expansion, at 4-54 nodes for Nigeria and 420 for Africa. Documented
      capability, undemonstrated pathway; treat earth's multi-horizon claim as
      untested rather than absent.
  - paper: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    tier: 2
    role: routine-use
    note: >
      "This study covered year 2050 only", with capacities taken exogenously from the
      GB Future Energy Scenarios rather than optimised, so the run is operational
      balancing at ~15 cluster nodes. The pattern for when the pathway is an INPUT: no
      foresight machinery needed because no investment decision is made.
  - paper: "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight greenfield expansion at 37-217 clustered nodes, then disaggregated and
      re-solved at 1250 nodes for dispatch with capacities FIXED — "no re-investment".
      A two-stage single-horizon design, and a reminder that fixing capacities between
      stages is the same operation myopic mode performs between horizons, used here
      for spatial rather than temporal reasons.
  - paper: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      "All scenarios represent overnight scenarios in the year 2050 considering a fully
      decarbonized energy system taking cost assumptions for 2030" — 64 onshore + 66
      offshore regions, 3-hourly. The single most typical sentence in the corpus, and
      the best one-line illustration of the target-year/cost-year decoupling.
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: routine-use
    note: >
      Overnight partial greenfield for a 2030 horizon, solved once per weather year
      across 40 years at hourly / 90 network nodes. Contributes the pitfall this card
      needs most on the operational side: "Perfect foresight also limits the ability of
      our model to react realistically to multi-week or longer events" — within-year
      foresight is precisely what makes a Dunkelflaute look survivable.
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: routine-use
    note: >
      "it assumes perfect foresight for a single reference year based on which
      capacities are optimised. It does not include pathway optimisation" — two
      fidelity levels (37 nodes/4-hourly and 128 nodes/2-hourly) to afford hundreds of
      MGA solves. The corpus's clearest demonstration of the budget rule this card
      turns on: horizons and solve count compete for the same compute, and an MGA study
      spends it on directions.
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight single year (2011 weather, 2030 costs) on PyPSA-Eur-Sec-30, 30 nodes,
      hourly, electricity + transport + heat — "investment and operation are optimised
      over a full historical year ... assuming perfect foresight". The founding
      sector-coupled overnight run, and evidence that sector coupling arrived years
      before pathway machinery did.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      181 nodes, sector-coupled, 3-hourly, greenfield apart from existing electricity
      and gas transmission and hydro. Contributes the sharpest statement of what the
      overnight choice forfeits, in the authors' own words: "Owing to the absence of
      pathway optimisation, our results cannot offer insights into the required
      transition steps." Quote this to a user who asks an overnight model when to build
      something.
  - paper: "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
    tier: 2
    role: routine-use
    note: >
      A pypsa-earth overnight 2050 run for Nigeria at 10 nodes / 8760 h, with demand
      scaled to SSP projections from a 2013 weather base. One of only four earth-family
      studies in this slice, and all four are overnight — the empirical basis for
      treating overnight as earth's only demonstrated mode.
  - paper: "2023_Tries_Islanding-Green-Hydrogen.pdf"
    tier: 1
    role: routine-use
    note: >
      1800 independent single-year 2050 greenfield runs (4 countries x 3 scenarios x 25
      hydrogen demand shares x 6 cost levels). The clearest case of the horizon/solve-
      count tradeoff resolved the other way: overnight is chosen precisely BECAUSE it is
      cheap enough to run 1800 times.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Partial greenfield 2050 at 60 nodes / 1500 segments, with existing transmission
      and gas networks (2019) and nuclear/biomass/hydro (2022) at today's capacities.
      Notable because the same author's 2024 paper moves to myopic multi-horizon — the
      two together are the corpus's only within-author overnight-to-myopic progression
      and show what changing the mode costs in resolution.
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: routine-use
    note: >
      A single-node PtX hub, 8760 h, 2030 investment costs, with the within-year
      foresight assumption spelled out unusually explicitly: the model "assumes a level
      of foresight capable of accurately anticipating energy supply and demand
      throughout the year", so storage held against uncertainty is by construction not
      valued. The cleanest small-system statement of the storage-flattering pitfall.
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: >
      "overnight green-field scenarios" at 37 nodes / 5-hourly for a single 2040 target
      year on a sector-coupled fork. Representative routine user; its contribution to
      this card is the datapoint that 5-hourly is where overnight sector-coupled runs
      land when the study needs many scenario variants.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: routine-use
    note: >
      A national PyPSA-Eur fork "initially conceived as a tool to perform analyses of
      the power system for a specific time horizon", solving 2030 at 2-100 nodes with
      hydro/nuclear/biomass fixed exogenously — and naming multi-horizon modelling as
      explicit future work. Evidence that single-horizon is where downstream national
      forks START, which matters when a user arrives with a regional fork.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Defines partial greenfield with a different inheritance set from the usual —
      "there are only existing capacities for transmission lines, hydropower, wind and
      solar" — i.e. existing VRE inherited too, at 130 nodes / 3-hourly for a
      carbon-neutral 2030. Worth flagging because inheriting existing wind and solar
      changes an overnight answer far more than inheriting hydro does.
  - paper: "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Single-year overnight 2025 at 37 zones / 8760 h with a datacentre fleet embedded
      in a brownfield background system. Illustrates the common asymmetric setup: the
      subject of the study is greenfield and overnight, the surrounding system is
      inherited — an inheritance boundary drawn by relevance, not by data availability.
  - paper: "2025_Burghardt_material-needs-energy-technologies.pdf"
    tier: 2
    role: routine-use
    note: >
      The most explicit definition of the default in the whole corpus: "an overnight (no
      pathway), greenfield (no current technology capacities considered) approach for
      the year 2045". Also names the specific loss for its own subject — cumulative
      material requirements BEFORE the target year are invisible to an overnight run,
      which is a general property of any stock-accumulation question.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: >
      Sector-coupled 72-node carbon-neutral target year at 3-hourly, 7% discount rate.
      Names the conceptual tension the annuity is patching over: "the conflict between
      the single-year optimisation horizon and the need to account for the value of
      technologies accrued over their lifetimes, which exceed a single year many times
      over". That is the precise reason overnight results are annuitised rather than
      summed, and worth explaining to any user reading overnight costs.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: routine-use
    note: >
      80 independent overnight runs, one per weather year 1941-2021, at 90 nodes /
      hourly with partial greenfield. States the assumption compactly — "inelastic
      demand and perfect foresight for the entire year" — and is the corpus's largest
      single-horizon ensemble, i.e. the strongest example of spending the whole compute
      budget on weather years rather than horizons.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight 2050 at 90 nodes / 3-hourly with 2040 costs. Its limitation note frames
      within-year foresight as a REPRODUCIBILITY problem rather than an optimism one:
      "The model's perfect foresight may lead to non-reproducible technology dispatch
      which neglects uncertainties from long-term predictions" — the right caveat when
      a user wants to compare modelled dispatch against observed operation.
  - paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Single-node national models (Denmark, Spain), 8760 h, 2030 costs, "under perfect
      foresight". A minimal-scale routine user, and evidence that even at one node the
      overnight choice persists — it is not driven by compute at the small end, it is
      simply the default.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      "no pathway optimisation is conducted, but a greenfield approach is pursued except
      for existing hydroelectricity and transmission infrastructure targeting net-zero
      CO2 emissions" — 110 nodes, all sectors, 4-hourly equivalent, 2030 costs as a
      proxy for mid-century build-out. The standard formula, stated in one sentence with
      the standard inheritance set.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Gives the positive case for overnight rather than an apology for it: "The overnight
      approach allows for fast optimization and parallel running of many alternative
      scenarios." 37 nodes, 2-hourly, full sector coupling, 2030 costs. This is the
      sentence to give a user who wants many scenario variants — overnight is the mode
      that makes a scenario matrix affordable.
  - paper: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      A pypsa-earth-sec Morocco model at 14 nodes / 3-hourly, 2030 overnight, with 264
      runs sweeping scenario parameters rather than time periods. Explicitly: earth's
      sector-coupled extension used in "overnight scenarios" — the second earth data
      point for the overnight-only pattern, and an example of the same
      scenarios-instead-of-horizons budget choice.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      A fourth inheritance pattern: "all dispatchable and renewable generation
      capacities from today reached their end of life but include existing
      infrastructure" — greenfield generation over an inherited grid (OpenStreetMap +
      TYNDP) plus committed offshore wind. Deliberate retirement-by-assumption at a 2050
      target year, which is how an overnight run can represent age without vintaging.
  - paper: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight 2030 at 318 NUTS2 nodes / 8760 h used as a VALIDATION harness comparing
      two grid representations, with grid expansion switched off. Representative of the
      data-paper subset: when the object under test is an input dataset, a single
      horizon is the control, and adding horizons would confound the comparison.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Overnight 2050 at 37 nodes / hourly with projected 2050 loads and costs, existing
      fossil fleet present but non-expandable. Names pathways as "beyond the scope of
      this paper" — the honest form of the default, and the phrasing an interview should
      expect when a user's reference paper has no pathway.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      Overnight 2030 on PyPSA-USA at 134 load zones / 3-hourly, multi-sector, with each
      US state solved independently and existing stock (generators, furnaces, EVs)
      ingested as a starting fleet. Shows a NEAR-TERM overnight target year — 2030
      rather than 2050 — where brownfield inheritance matters more than the expansion
      does, and where the horizon is short enough that a pathway would add little.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      A pypsa-earth-sec Morocco model, 14 GADM-L1 nodes, hourly, overnight/greenfield
      for target year 2035 with no vintaging; the two scenarios differ by demand
      allocation, not by horizon. Third earth data point for the overnight-only pattern,
      and a useful example of choosing a MID-TERM horizon (2035) "aligned with typical
      project cycles" rather than a mid-century one.
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: >
      Overnight greenfield 2050 at 90 nodes / 3-hourly, sector-coupled, with the
      limitation stated and its consequence drawn: "the model is based on an overnight
      greenfield optimisation. Because the transition pathway is not explicitly
      modelled..." — and CDR is exactly the technology class where that bites, since
      cumulative removals depend on the trajectory, not the end state.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      "aims to determine a cost-optimal energy system, accounting for both capital and
      operational expenditures, without considering the transition pathway–i.e., assuming
      an overnight scenario" — 100 nodes, 2190 TSAM segments, 2030 costs with a 2050
      sensitivity. A clean example of substituting a COST-VINTAGE sensitivity for a
      pathway: the cheapest available proxy for "what if this were later".
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      "a greenfield approach with perfect foresight for the full year" — 2050, 39 nodes,
      750 segments, sector-coupled with CDR extensions, deliberately excluding
      transmission and H2/CO2 network expansion from scope. Another study spending its
      whole budget on MGA directions rather than horizons; segmentation to 750 steps is
      the mechanism that makes that affordable.
  - paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    tier: 2
    role: routine-use
    note: >
      "We configure the case study with a 2050 planning horizon" — single-year overnight
      on a 6795-bus European network assembled through the PyPSA-Eur pipeline with the
      aggregation step replaced. The extreme spatial end of the tradeoff: at this bus
      count a second horizon is not a budget question but an infeasibility.
  - paper: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    tier: 1
    role: routine-use
    note: >
      Overnight optimisation repeated independently at eight CO2 levels (58% down to 0%
      of 1990) at 600 nodes / 3-hourly, 2013 weather, 2030 costs. The important
      distinction for interviews: a sequence of tightening CO2 caps is a SCENARIO sweep
      over stringency, not a pathway — no capacity crosses between the eight runs.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      "A 39-node spatial resolution and a 3-hourly temporal resolution were applied over
      a full year in overnight greenfield scenarios, chosen as a trade-off between
      computational effort and the difference in results compared to a 1-hour
      resolution." The corpus's most recent restatement of the default, complete with
      the resolution justification — and a demonstration that in 2026 overnight
      greenfield at 39 nodes / 3-hourly is still where the field's centre of mass sits.
pitfalls:
  - pitfall: >
      "Perfect foresight" means two entirely different things and the corpus uses the
      phrase for both without distinguishing them: perfect foresight WITHIN a year (the
      solver sees all 8760 hours — true in essentially every PyPSA run including every
      overnight and every myopic one) and perfect foresight BETWEEN investment periods
      (the intertemporal mode, `foresight: perfect`, which almost nobody runs). A user
      told their overnight run "has perfect foresight" will hear the second.
    evidence: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    note: >
      Always say which. In this book: "within-year foresight" vs "between-period
      foresight". Hoersch 2017 says "assuming perfect foresight, with 2012 chosen as the
      representative year" for a SINGLE-year overnight run — that is the within-year
      sense, and 33 corpus papers use the phrase the same way. Zeyen 2025 and Geis 2026
      show the disciplined phrasing to imitate: "perfect foresight within each investment
      year, myopic foresight between the investment periods".
  - pitfall: >
      A myopic pathway is NOT a cheaper approximation of a perfect-foresight pathway; it
      is a different question with a systematically different answer. Myopic costs more
      because early decisions strand, and that extra cost is a RESULT (the value of
      foresight), not an error to be apologised for.
    evidence: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    note: >
      Victoria 2022 states it directly ("the myopic approach provides a more expensive
      solution") and Xie 2024 gives the mechanism (stranded investments). Decide from the
      question, not from cost: if the user is a planner asking what to build next, myopic
      is the RIGHT model of their epistemic position (Xiong 2026 argues exactly this). If
      the user wants the theoretical least-cost trajectory or is studying learning
      effects, only perfect foresight answers it.
  - pitfall: >
      In pypsa-eur's myopic mode there is no cross-period discounting at all — each
      horizon is an independent annuitised single-year problem, so `costs.social_discountrate`
      has no effect and only per-technology WACC from the cost table enters. Users who
      set a social discount rate in a myopic run and see nothing change conclude the key
      is broken; it is simply out of scope for that mode.
    evidence: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    note: >
      Geis 2026 names it: "As we use a myopic modelling approach with independent yearly
      optimisations, the time value of money across years is not considered." The
      registry agrees — `discount-rate-dimension` is `partial` in both models and its note
      says social_discountrate "only affects inter-period weighting in perfect foresight".
      Cumulative discounted pathway cost is a POST-PROCESSING step in myopic mode
      (make_cumulative_costs), not an objective term. See
      `discounting-and-cost-of-capital`.
  - pitfall: >
      Running several independent target years and presenting them as a trajectory. The
      capacities do not connect: a 2040 run's build is not available to the 2050 run, so
      the "pathway" can show capacity vanishing and reappearing, and its per-year costs
      cannot be summed into a transition cost.
    evidence: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    note: >
      Millinger 2022 handles it correctly by stating the disconnection outright
      ("capacities built in scenarios for 2040 are not considered in scenarios for
      2060"). Schlott 2018 gives the diagnostic: differences between adjacent independent
      runs are input artefacts, not investment dynamics. If the user wants a trajectory,
      that is `myopic-sequential` and it is an L1 change, not a presentation choice.
  - pitfall: >
      Within-year foresight systematically flatters storage and understates the value of
      firm capacity: the solver knows every future hour, so it charges a store exactly
      when needed and never holds inventory against uncertainty. This is baked into
      overnight, myopic and perfect modes alike, and it is invisible in the output.
    evidence: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    note: >
      Grochowicz 2023: "Perfect foresight also limits the ability of our model to react
      realistically to multi-week or longer events" — so a Dunkelflaute looks survivable
      because the model saw it coming. Geis 2026 (Managing the Mismatch) and Alamia 2024
      name the same effect on storage operation. The remedy is `myopic-rolling-horizon-dispatch`
      at fixed capacities, which Brown 2025 shows recovers most of the value with a
      constant marginal-storage-value bid, and Karkossa 2026 benchmarks against reality.
  - pitfall: >
      Land use and other stock constraints must be accounted ACROSS vintages or a
      multi-horizon run double-books the same resource — horizon 2 builds wind on land
      horizon 1 already occupies, and p_nom_max is silently violated in aggregate. The
      run succeeds; the pathway is physically impossible.
    evidence: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    note: >
      pypsa-eur implements this separately per mode (`add_land_use_constraint` for
      myopic, `add_land_use_constraint_perfect` for perfect) and applies it
      automatically — do not disable it, and do not assume a fork inherited it. If you
      hand-roll a horizon loop instead of using `foresight: myopic`, this is the
      constraint you will forget. Registry: `land-use-constraint`, eur-only.
  - pitfall: >
      Perfect foresight in pypsa-eur is real but explicitly unhardened: the workflow
      logs "Running perfect foresight is not properly tested and may not work as
      expected. Use at your own risk!" on every import, refuses to run under pypsa >=1.0,
      and several constraint families (add_CCL_constraints) are documented as not
      implemented for it. Treating the registry's `working` status as production-ready
      over-promises.
    evidence: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    note: >
      Budget debugging time, pin the pypsa version, and expect to check every custom
      constraint for period-awareness. The corpus's single perfect-foresight study
      collapsed Europe to ONE node with six representative regions — read that as the
      realistic starting resolution, not as an unambitious choice.
  - pitfall: >
      An overnight target year priced at a much earlier cost vintage (2050 system at
      2030 costs is the corpus's dominant combination) is a deliberate conservatism, not
      an oversight — but it means the answer is not "the 2050 system", it is "the
      2050-constrained system at 2030 prices". Reporting it as the former overstates
      cost and understates deployment of fast-learning technologies.
    evidence: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    note: >
      Frysztacki 2021 gives the standard justification (2030 costs are the earliest
      feasible transformation date and are conservative). Always state target year AND
      cost year separately in the answer. Glaum 2026 shows the cheap mitigation: run the
      later cost vintage as a sensitivity rather than switching to a pathway.
  - pitfall: >
      Myopic horizons cannot be parallelised — horizon k's input is horizon k-1's
      solution — so wall-clock time scales linearly in the number of horizons even on a
      large cluster, unlike a scenario sweep. Users who have budgeted "7 runs" have
      budgeted 7 SEQUENTIAL runs.
    evidence: "2025_Lindner_PyPSA-DE_EEM.pdf"
    note: >
      Quote the compute early. Lindner 2025 ran 6 horizons at 49 regions / 3-hourly
      sector-coupled and reports no perfect-foresight comparison — nobody in the corpus
      ran both modes on the same system, which is itself the honest statement about
      affordability. Mitigate with segmentation (vanGreevenbroek 2024 used 750 steps per
      year) or fewer horizons (Xiong 2026, DiBella 2025 both used three).
requires_methods:
  - brownfield-and-capacity-vintaging
