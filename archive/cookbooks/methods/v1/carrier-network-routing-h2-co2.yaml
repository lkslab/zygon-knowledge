id: carrier-network-routing-h2-co2
title: "Endogenous carrier-network routing and sizing (H2 and CO2 pipelines)"
summary: >
  Make hydrogen and CO2 pipeline capacities decision variables on a candidate graph
  between regions, so the optimiser decides where the network goes, how thick each
  segment is, and whether an existing methane pipe is repurposed instead.
question: >
  Where should the hydrogen and CO2 pipelines go, how much capacity does each corridor
  need, and is it cheaper to retrofit the gas grid or to transport the electricity?
aliases:
  - "hydrogen network"
  - "hydrogen backbone"
  - "H2 pipeline network"
  - "CO2 network"
  - "carbon dioxide transport network"
  - "pipeline repurposing"
  - "gas network retrofitting"
  - "gas-to-hydrogen conversion of pipelines"
  - "carrier network co-optimisation"
  - "multi-carrier transmission expansion"
  - "point-to-point vs meshed"
  - "CO2 transport and storage (CTS) infrastructure"
when_to_use:
  - "where should we build the hydrogen backbone"
  - "is it cheaper to move hydrogen or to move electricity"
  - "can we reuse the existing gas pipelines for hydrogen"
  - "how much of the gas grid would be repurposed"
  - "do we need a CO2 pipeline network to reach the storage sites"
  - "where does captured CO2 go and how does it get there"
  - "what does the system cost if no hydrogen network is allowed"
  - "how many GW per corridor, and how many actual pipelines is that"
  - "should the offshore wind come ashore as electricity or as hydrogen"
  - "compare a meshed network against point-to-point connections"
  - "how much does the H2 network reduce electricity grid expansion"
family: sector-coupling
prevalence:
  papers: 16
  tier1: 11
  tier2: 5
  sweep_hits: 41
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 16 papers that actually put
    a carrier pipeline capacity in the decision vector. The regex screen returned 41,
    over-counting badly: its pattern matches "retrofit" (buildings), "repurpos" (salt
    caverns, sites) and any mention of a hydrogen backbone in a related-work paragraph.
    The role split is the story here — only 1 `extends` and 4 `canonical-use` against
    11 `routine-use`. This is a SETTLED method: PyPSA-Eur ships it working, so most
    papers just switch it on and report the resulting network. Three papers in the
    slice were flagged as mention-only suspects (Dergunova, Seibold, Glaum-Methanol)
    and all three were KEPT after judging: each endogenously sizes pipeline capacity
    (a tree topology across 15 GB clusters; new-plus-retrofit H2 with a 20 GW per-link
    cap; five scenarios over which of H2/CH4/CO2 networks exist plus a
    post-discretization sensitivity). The flag fired on their prose disclaiming a
    DIFFERENT carrier, not on the method.
procedure:
  - step: >
      Build the candidate graph. Nobody optimises over all node pairs: the candidate
      edge set is inherited from an existing topology. The corpus uses three sources —
      the clustered real gas grid (SciGRID_gas / IGGIELGN in Europe, GGIT globally),
      the electricity transmission topology projected onto carrier buses, or a
      published project list (PCI-PMI). Edge length is haversine distance times a
      detour factor of 1.25 to account for non-straight routing.
    handle: "create_network_topology(n, prefix, carriers=[...]) / build_clustered_gas_network(..., length_factor=1.25)"
    provenance: "scripts/prepare_sector_network.py:create_network_topology; scripts/cluster_gas_network.py:build_clustered_gas_network"
  - step: >
      Give each carrier its own bus per region so a flow between regions is meaningful
      at all. This is the prerequisite the card does NOT own — see
      sector-coupled-network-assembly. Its per-carrier spatial switches decide whether
      the routing problem exists: collapse CO2 to one EU bus and the CO2 network
      becomes a set of self-loops.
    handle: "define_spatial (co2_spatial / gas_network switch the bus set)"
    provenance: "scripts/prepare_sector_network.py:define_spatial"
  - step: >
      Add one extendable Link per candidate edge, with capital_cost proportional to
      length and p_min_pu = -1 so a single variable serves both directions. Reported
      unit costs in the corpus: new H2 onshore 250-304 EUR/MW/km, retrofitted H2 117
      EUR/MW/km, submarine H2 0.5 EUR/kW/km, CH4 87 EUR/km/MW, CO2 onshore 2116
      EUR/km/(tCO2/h).
    handle: "n.add('Link', ..., p_nom_extendable=True, p_min_pu=-1, capital_cost=length*cost)"
    provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:add_co2_network"
  - step: >
      (retrofit variant) Add a PARALLEL H2 link on every existing methane edge, capped
      at a fixed fraction of the methane pipe's capacity — 60% in the PyPSA family,
      80% in pypsa-earth's hardcoded variant — priced at the repurposing cost, and make
      the parent methane link extendable downward (p_nom_min = 0) so decommissioning is
      a decision.
    handle: "sector.H2_retrofit + H2_retrofit_capacity_per_CH4"
    provenance: "scripts/prepare_sector_network.py:H2_retrofit_capacity_per_CH4"
  - step: >
      (retrofit variant, THE technically interesting constraint) Couple the two: the
      retrofitted H2 capacity and the surviving methane capacity share one physical
      pipe. p_nom(gas) + (1/ratio) * p_nom(H2_retrofitted) == p_nom_today(gas), as an
      EQUALITY, per edge. Without it retrofit is free capacity: you get the H2 pipe AND
      the methane pipe out of one steel tube.
    handle: "add_pipe_retrofit_constraint (called from extra_functionality)"
    provenance: "scripts/solve_network.py:add_pipe_retrofit_constraint"
  - step: >
      Apply length-dependent transport losses and compression electricity. Because a
      lossy link cannot be bidirectional in one variable, the bidirectional link is
      SPLIT into a forward link and a mirrored '-reversed' twin carrying capital_cost=0
      and length=0 (the true length preserved in a new `length_original` column), with
      the two capacities forced equal at solve time. Corpus values: H2 1.2-2% per
      1000 km, CO2 0.8% per 1000 km, CO2 compression 250 kWh/t per 1000 km.
    handle: "lossy_bidirectional_links + add_lossy_bidirectional_link_constraints"
    provenance: "scripts/prepare_sector_network.py:lossy_bidirectional_links; scripts/solve_network.py:add_lossy_bidirectional_link_constraints"
  - step: >
      (CO2 variant) Terminate the CO2 graph in sinks with real potential: per-region
      sequestration stores sized from a geological database with a per-tonne injection
      cost, plus a system-wide annual injection budget. Without a spatially bounded
      sink the CO2 network has nothing to route TO and DAC anywhere is as good as
      capture at the source.
    handle: "sector.regional_co2_sequestration_potential + add_co2_sequestration_limit"
    provenance: "scripts/build_co2_sequestration_potentials.py:create_capacity_map_storage; scripts/solve_network.py:add_co2_sequestration_limit"
  - step: >
      Co-optimise the whole thing with generation, conversion, storage and the
      ELECTRICITY network in one LP. The finding the literature cares about is the
      substitution between the carrier network and the power grid, which only appears
      if both are extendable in the same solve.
    handle: "the standard solve; electricity.transmission_limit governs the power-grid half"
    provenance: "scripts/prepare_network.py:set_transmission_limit"
  - step: >
      Run the scenario cross: {no network} x {network} per carrier. Every corpus paper
      does this rather than reporting one network, because the answer of interest is
      the network's system VALUE, not its shape. Reported deltas are small and
      consistent: 0.5% of cumulative cost for the H2 network alone.
    handle: "sector.{H2_network,co2_network,gas_network} booleans; sector_opts noH2network token"
    provenance: "scripts/_helpers.py:noH2network"
  - step: >
      (optional post-processing) Discretise the continuous corridor capacities into
      integer pipeline counts: solve continuously, round segments above a threshold
      share to a unit size (1200 MW per H2 pipeline), fix, and re-solve dispatch. A
      "37.4 GW corridor" is not an answer an infrastructure planner can act on.
    handle: "solving.options.post_discretization.link_unit_size"
    provenance: "scripts/solve_network.py:post_discretization"
  - step: >
      Extract the result as network volume (sum of p_nom_opt * length, in TWkm), the
      retrofit share of that volume, and per-corridor capacities — after excluding the
      '-reversed' twins, which would double every number.
    handle: null
    provenance: null
variants:
  - id: greenfield-routing-on-candidate-graph
    what: >
      New-build pipelines only, on a candidate edge set inherited from an existing
      topology (the gas grid, or the electricity graph when there is no gas grid).
      Capacity continuous, cost linear in length. The default entry point and what most
      of the corpus runs; it is also what you fall back to when retrofit is disabled
      for tractability.
    papers:
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2025_Lindner_PyPSA-DE_EEM.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
  - id: gas-network-retrofit
    what: >
      The interesting variant. A parallel H2 link on every methane edge, capped at a
      fraction of the parent pipe (60%), priced at roughly half the new-build cost
      (117 vs 250 EUR/MW/km), and coupled to the surviving methane capacity by an
      EQUALITY constraint so one tube cannot serve both. The coupling is what makes
      "decommission methane to gain hydrogen" a real trade-off rather than free
      capacity, and it is why the corpus reports retrofit shares (63.5-69.1% of network
      volume) rather than just totals.
    papers:
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
  - id: co2-transport-to-sequestration-sites
    what: >
      The same graph problem on the captured-carbon carrier, but the objective is
      geographic: connect inland capture points to coastal/offshore geological storage
      and to synthetic-fuel synthesis sites. Requires spatially resolved CO2 buses AND
      a regional sequestration potential map — without the bounded sink the routing is
      vacuous. The corpus finding is that a CO2 network makes expensive DAC largely
      redundant, because captured CO2 can reach the sink instead.
    papers:
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
  - id: discrete-vs-continuous-pipeline-capacity
    what: >
      Post-processing the continuous corridor capacities into integer pipeline counts
      at a fixed unit size (1200 MW per H2 pipeline), or imposing the integrality as a
      per-link cap expressed in whole pipelines (50.7 GW = three 48-inch; 20 GW = one
      48-inch plus one 36-inch). The cheap route is round-then-refix, not a MILP.
      Reported as a sensitivity rather than a headline, but it is the difference
      between a number a planner can build and one they cannot.
    papers:
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
  - id: point-to-point-vs-meshed
    what: >
      Restrict the candidate graph rather than the capacities: allow only radial
      connections from each production site to shore/hub (point-to-point), versus
      allowing the full neighbour graph (meshed), and read the cost difference. The
      offshore application is where this bites — an offshore H2 graph mirroring the
      offshore HVDC graph, with the H2-vs-electricity choice made per corridor. Also
      the shape of the GB study's tree-versus-star topology decision.
    papers:
      - "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
      - "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
      - "2023_Tries_Islanding-Green-Hydrogen.pdf"
  - id: exogenous-project-list-routing
    what: >
      Replace the synthetic candidate graph with a real named project list — EU
      PCI-PMI H2 and CO2 pipelines, storage and sequestration sites — mapped onto the
      model's regions, and vary which subset is permitted to be built. Turns the
      question from "where would a network go" into "what is this specific pipeline
      worth", including regret under delay and cancellation scenarios.
    papers:
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
  - id: network-value-scenario-cross
    what: >
      Not a formulation change but the study design every corpus paper wraps around
      the others: the {no network} x {network} cross per carrier, often crossed again
      with electricity grid expansion permissions. The deliverable is a cost delta
      (0.5% for the H2 network alone) and a substitution statement, not a map.
    papers:
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
literature:
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference application for the retrofit variant and the source of the numbers
      the whole family reuses: 60% of a decommissioned gas pipe's capacity becomes
      available for hydrogen, new pipeline 250 EUR/MW/km against 117 EUR/MW/km
      retrofitted, candidate topology from SciGRID_gas. 181 nodes, 3-hourly,
      sector-coupled, self-sufficient. The design is a 2x2 cross of electricity-grid
      expansion against H2-network expansion, which is what isolates the substitution
      between the two. Results to quote: network volume 204-307 TWkm, of which
      63.5-69.1% retrofitted. Pipelines are pure transport links — capacity and nodal
      balance only, no gaseous-flow physics.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The paper that makes H2 and CO2 one method rather than two: both networks
      co-optimised on the SAME candidate topology (identical to the electricity
      network, connecting all neighbouring regions), with a four-way scenario cross —
      Baseline (no networks), CO2-Grid, H2-Grid, Hybrid — so the competition and
      synergy between them is the result. 90 nodes, 3-hourly, 2050 overnight. Loss and
      compression figures: H2 1.2% and 1.8% per 1000 km, CO2 0.8% per 1000 km and 250
      kWh/t per 1000 km. Notably does NOT consider gas-pipeline retrofit, so it is the
      clean greenfield-plus-CO2 reference rather than the retrofit one.
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: canonical-use
    note: >
      The exogenous-project-list variant, and the most operationally detailed routing
      recipe in the corpus: PCI-PMI H2 and CO2 pipelines, H2 storage and CO2
      sequestration sites pulled from the EC REST API and mapped onto 99 NUTS regions,
      lengths as haversine x 1.25. Five long-term scenarios varying pipeline freedom
      plus a regret analysis over delay/cancellation. Also the source of the
      sequestration sink numbers: 286 Mt/a from depleted offshore fields and 114 Mt/a
      from PCI-PMI sites, clustered into a 50 km buffer per offshore bus, at 15
      EUR/tCO2. Gas grid copperplated — only H2 and CO2 are expanded.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: extends
    note: >
      The one `extends` in the slice, and it extends the candidate graph rather than
      the formulation: every offshore region gets a hydrogen platform, so the H2
      network inherits the offshore HVDC topology exactly and the electricity-versus-
      hydrogen choice is made per offshore corridor. 130 nodes (64 onshore, 66
      offshore). Four scenarios spanning no-H2, point-to-point H2 and meshed H2 — the
      source of the point-to-point-vs-meshed variant. Offshore platform 440 EUR/kWel,
      submarine H2 pipeline 0.5 EUR/kW/km at 1.9% loss per 1000 km.
  - paper: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    tier: 2
    role: canonical-use
    note: >
      The small-scale, industrial-cluster end of the method: ~15 GB clusters, hourly,
      2050, across three FES scenarios. Two contributions to this card. First, the
      topology is a MODELLING CHOICE stated as such — a tree network adopted rather
      than a star. Second, an explicit statement of what the transport-link abstraction
      throws away: "modelled as energy flows, disregarding thermodynamic properties and
      loss of energy associated with frictional pressure drop", with pipeline packing
      and compression excluded and operating pressure (40-80 barg) noted but not
      represented.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      Runs new-build and retrofit H2 together with a CO2 network in one sector-coupled
      German-focused model, and contributes the integrality-as-a-cap trick: interregional
      H2 pipeline expansion capped at 20 GW per link, chosen because it equals one
      48-inch plus one 36-inch pipeline. Sequestration budget 200 MtCO2/a for Europe.
      Methane transport assumed unconstrained, which is the standard simplification
      once H2 is the carrier of interest.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Documents the two most common retreats from the full method, both for stated
      computational reasons: retrofit DISABLED so all H2 pipelines are new-build, and
      no CO2 network at all "since CO2 is not spatially resolved in this model
      version" — the cleanest corpus statement of the co2_spatial prerequisite. Also
      the per-link integrality cap in physical units: 50.7 GW = three parallel 48-inch
      pipelines. H2 compression 2% per 1000 km, gas 1% per 1000 km.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Five-way carrier-network scenario cross (all networks / H2-only / CH4-only / no
      gaseous networks / methanol backstop) on 100 nodes, which is the network-value
      design taken to its limit: the question is which pipeline networks you need at
      all. Contributes the cost triple used in this card (CO2 2116 EUR/km/(tCO2/h), H2
      282 EUR/km/MW, CH4 87 EUR/km/MW) and runs a post-discretization sensitivity on
      the continuous capacities, which is the only corpus instance of that check.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      The early PyPSA-Eur-Sec statement of the greenfield default — "a greenfield H2
      network connecting the different nodes is built if it is cost-effective" — plus
      the sensitivity that gives this card its headline number: disallowing the H2
      network raises cumulative system cost by only 0.5%. Also the asymmetry worth
      relaying: CO2 transport unconstrained and methane freely transported, i.e. the
      networks that were NOT the study's subject were copperplated.
  - paper: "2025_Lindner_PyPSA-DE_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Regional-resolution application (49 regions, 30 in Germany, myopic 2020-2045)
      whose contribution here is validation-shaped: the endogenously routed H2 network
      is compared against Germany's official hydrogen network development plan. Restates
      the transport-link abstraction explicitly ("without explicit consideration of gas
      flow physics"), and reports the siting consequence — electrolysis clusters near
      the coast to absorb offshore wind, which is a routing result, not a generation one.
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: >
      Inverts the default: baseline forbids CO2, H2, solid-biomass and biochar
      transport, and the networks appear only as sensitivities. Contributes the
      sharpest CO2-network finding in the corpus — equipping the system with a CO2
      transport network "substantially reduces reliance on costly DAC", because
      captured CO2 can reach a regional sink instead of being captured wherever the
      sink is. Gas pipelines from SciGRID_gas fixed, no repurposing in baseline.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      A clean quantification of how carrier networks change a technology verdict: with
      H2 and CO2 infrastructure co-optimised, e-biofuel deployment share falls by up to
      6%, while total system cost moves at most 0.5%. Baseline treats H2 and CO2 as
      locally balanced at each node — the "no network" pole of the scenario cross, and
      a reminder that a nodally balanced carrier is a strong implicit assumption.
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: >
      Sector-coupled fork in which H2 and gas transmission are co-optimised as part of
      the multi-carrier network and captured CO2 is routed endogenously to sequestration
      or utilisation on a shared accounting bus. Contributes no routing method content;
      its value here is as evidence that the CO2 carrier network is routinely load-bearing
      for CCU chains (the solvent production pathways feed into it) even when the paper
      is about something else entirely.
  - paper: "2023_Tries_Islanding-Green-Hydrogen.pdf"
    tier: 1
    role: routine-use
    note: >
      The degenerate case of the routing problem, and useful precisely because it is
      degenerate: two nodes per country, one endogenously sized H2 pipeline from island
      to mainland, no electricity network at all. Shows what survives when the graph is
      removed — capacity sizing and the transport-cost trade-off against local
      conversion. Cost points: 0.226 EUR/kW/km overground, 0.329 submarine, 4.48 EUR/kW
      compressor, distances 269-1783 km.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      The only pypsa-earth instance of the method in the corpus: 14 GADM-L1 nodes in
      Morocco, hourly, H2 pipeline capacity endogenously sized alongside electrolysers
      and conversion plant (S1 needs ~2 GW of additional pipeline). Sets the realistic
      scale expectation for the earth side — a handful of nodes, H2 only, no retrofit
      question because there is no gas grid worth repurposing, and CO2 from cement CCS
      handled as a feedstock stream rather than a routed network.
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      In the slice as a deliberate NEGATIVE case, and worth citing to users for that:
      an explicit decision to exclude both H2 and CO2 network expansion — "independently
      of wide infrastructure changes" — so that the carbon-management technology choices
      can be isolated. The CO2 carrier is kept for accounting (capture to sequestration
      or conversion) with no pipeline routing. Demonstrates that "we did not model the
      network" is a legitimate, statable scope decision, not an omission.
pitfalls:
  - pitfall: >
      The '-reversed' twin links double-count everything. A lossy bidirectional pipeline
      exists twice in n.links: the forward link, and a mirror with '-reversed' appended,
      capital_cost=0 and length=0, whose capacity is forced equal to the forward one.
      Sum p_nom_opt over carrier == 'H2 pipeline' and you report twice the network
      capacity; sum p_nom_opt * length and the twins contribute zero, so THAT total is
      accidentally right — two different aggregations of the same result disagree by 2x.
    evidence: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    note: >
      Filter on ~n.links.reversed before any capacity aggregation, and use
      `length_original` (not `length`) whenever you need the physical length of a split
      link — `length` is zeroed on the twin. Network volume in TWkm is the corpus's
      reporting unit precisely because it is robust to this; capacity totals are not.
  - pitfall: >
      Retrofit without the coupling constraint gives you free capacity. If
      H2_retrofit is on but no `gas pipeline` links are extendable — the case when
      gas_network is false, so methane is copperplated to a single EU bus —
      add_pipe_retrofit_constraint finds an empty gas-pipe index and returns silently.
      The retrofitted H2 links still exist, still capped per-edge at 60% of the pipe,
      and now cost 117 EUR/MW/km with no methane capacity given up in exchange. The run
      succeeds and the retrofit looks unreasonably attractive.
    evidence: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    note: >
      Never set H2_retrofit true with gas_network false. Assert the constraint exists
      after solving ('Link-pipe_retrofit' in n.model.constraints) rather than trusting
      the config, and sanity-check that the surviving methane capacity plus the
      retrofitted H2 capacity divided by the ratio equals today's pipe capacity.
  - pitfall: >
      A CO2 network on a non-spatial CO2 carrier is a set of self-loops. co2_spatial
      false collapses every regional 'co2 stored' bus into one EU bus, but co2_network
      is an independent boolean that still runs add_co2_network — which builds links
      between bus0 and bus1 that are now the same bus. No error, no flow, no cost, and
      the study reports "with CO2 network" results that are identical to without.
    evidence: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    note: >
      The corpus paper that hit this states the dependency plainly ("a CO2 network is
      not explicitly co-optimised since CO2 is not spatially resolved"). Require
      co2_spatial true whenever co2_network is true, and verify by counting distinct
      'co2 stored' buses before believing any CO2 routing result.
  - pitfall: >
      Continuous corridor capacities are not buildable pipelines. The LP returns
      fractional GW per corridor; a 0.4 GW result is not a thin pipeline, it is
      four-tenths of the smallest pipe anyone builds, and the reported network volume
      quietly includes a long tail of such segments. Rounding after the fact changes
      the answer, which is why the one paper that checked ran it as a sensitivity.
    evidence: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    note: >
      Either post-discretise (unit size 1200 MW per H2 pipeline) and report the
      integer-pipeline result alongside the continuous one, or express the answer in
      whole-pipeline units the way the corpus does (50.7 GW = three 48-inch, 20 GW =
      one 48-inch plus one 36-inch). Do not present fractional corridor capacities as
      an infrastructure recommendation.
  - pitfall: >
      Losses and compression electricity apply only to the carriers listed in
      transmission_efficiency.enable, and the compression demand lands on bus2 at the
      INFLOW end. Drop 'H2 pipeline retrofitted' from that list while keeping 'H2
      pipeline' and retrofit becomes lossless relative to new-build — a silent thumb on
      the scale of the very trade-off the study is about.
    evidence: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    note: >
      Enable every H2 and gas carrier you have instantiated, or none of them, and state
      which. If any carrier is left lossless, say so in the write-up: 1.2-2% per 1000 km
      compounds over a continental network.
  - pitfall: >
      The candidate graph decides the answer, and it is chosen before any solving.
      Routing along the clustered gas grid, along the electricity topology, or along a
      published project list gives three different networks from the same LP, and none
      of them can propose a corridor the graph omitted. The corpus states its topology
      choice explicitly (tree not star; identical to the electricity network; PCI-PMI
      list) because the choice is a result, not a detail.
    evidence: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    note: >
      Report the candidate edge set and the detour factor (1.25) as part of the method,
      and if the user's question is "where should pipelines go" rather than "how thick
      should these corridors be", say up front that the model answers the second.
  - pitfall: >
      Pipelines are transport links, not gas flows. No pressure, no linepack, no
      frictional drop, no compressor placement — capacity limits and nodal balance
      only. The consequence users care about: intra-hour pipeline storage (linepack) is
      absent, so the model cannot use the pipe as short-duration storage and will
      substitute dedicated H2 storage instead.
    evidence: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    note: >
      Fine for capacity-planning questions, wrong for operability ones. If the user
      asks about pressure management, compressor siting or linepack flexibility, this
      method does not answer it and no config key changes that — flag it before the
      study rather than after.
