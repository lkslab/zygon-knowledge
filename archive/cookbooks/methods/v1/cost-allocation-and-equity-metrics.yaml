id: cost-allocation-and-equity-metrics
title: "Cost allocation, burden sharing and distributional (equity) metrics"
summary: >
  Splitting total system cost, benefit and burden across regions, countries or
  consumers, and either measuring the resulting distribution as a metric or imposing
  a target distribution as a constraint and pricing what it costs.
question: >
  Who pays for this system and who gains from it — and what does making the split
  more even cost?
aliases:
  - "cost allocation"
  - "burden sharing"
  - "distributional effects"
  - "distributional impact"
  - "spatial equity"
  - "regional equity"
  - "Gini coefficient"
  - "Lorenz curve"
  - "equity metric"
  - "benefits of cooperation"
  - "flow tracing"
  - "generalised flow tracing"
  - "proportional sharing / perfect mixing"
  - "self-sufficiency constraint"
  - "autarky"
  - "decentralisation constraint"
  - "grandfathering"
  - "producer surplus / consumer surplus split"
  - "congestion rent allocation"
  - "financial transmission rights"
when_to_use:
  - "who pays and who benefits from this build-out"
  - "which countries gain from cooperating and which lose"
  - "is this plan fair across regions"
  - "how much more expensive is a more evenly distributed system"
  - "what if every country had to supply most of its own electricity"
  - "what if we cut the interconnectors — what does isolation cost each country"
  - "split the total system cost by country / by region"
  - "who uses the transmission line and should pay for it"
  - "how much do consumers save and how much do generators lose under this reform"
  - "compensate the losers from this policy change"
  - "will this reform hit poorer households harder"
  - "measure how concentrated the renewable build-out is"
family: markets-and-prices
prevalence:
  papers: 6
  tier1: 4
  tier2: 2
  sweep_hits: 22
  basis: >
    Hand-coded pass 1 attributed 4 papers directly (Liu 2019, Neumann 2020, Franken
    2025, Aden 2026). Two more are added here from `EVIDENCE.yaml:unmatched_methods`,
    where pass 1 recorded a full methodological description under a technique name it
    had no slug for: Tranberg 2018 ("flow-tracing for storage attribution") and
    vanGreevenbroek 2023 ("self-sufficiency constraint (custom linear constraint)").
    Both are attribution/equity machinery and both are cited only for that content.
    The regex screen returned 22 and OVER-counts badly — the pattern includes bare
    `equity` and `affordability`, which appear in framing and motivation sentences of
    papers that never split a cost (Weber 2018 at 8 hits, Riepin 2024 at 4, Parzen
    2021 at 3, Grochowicz 2025 at 3, Barnes 2026 at 3 are all mention-only on the
    evidence pass 1 recorded). Note the role split: 1 `defines`, 3 `extends`,
    2 `routine-use`, and NO `critiques` — the corpus does the method and does not
    examine it, which is why `pitfalls` below is derived from the arithmetic and from
    papers' own caveats rather than from a critique paper.
procedure:
  - step: >
      Decide which of the two halves you are doing, because they answer different
      questions and share almost no machinery. EX-POST ATTRIBUTION takes one solved
      system and divides its cost/benefit among actors. EX-ANTE CONSTRAINT imposes a
      distributional target on the optimisation and reads the cost premium. Only the
      ex-ante half changes the system; only the ex-post half needs an allocation rule.
    handle: null
    provenance: null
  - step: >
      (ex-post, 1) Fix the accounting boundary: the set of actors (nodes, countries,
      zones, generator units, consumer classes) and the set of cost terms
      (annualised capex, opex, transmission, congestion rent, policy transfers). Both
      are choices, not model outputs, and both must be stated with the result.
    handle: null
    provenance: null
  - step: >
      (ex-post, 2) Pull the per-actor quantities the allocation rule needs. The
      standard denominators are per-location annualised capex + opex, per-location
      energy balance (supply and withdrawal), nodal marginal prices, and line/link
      flows and their duals.
    handle: "n.statistics.capex(groupby=['location','carrier']) / .opex(...) / .energy_balance(...) / .revenue(...)"
    provenance: "scripts/make_summary.py:calculate_nodal_costs"
  - step: >
      (ex-post, 3) Apply an allocation RULE to turn those quantities into a per-actor
      share. The corpus uses, in increasing sophistication: (a) locate the asset —
      cost sits where the plant sits; (b) load-proportional — divide the system total
      by each actor's demand share; (c) price-based — each actor pays its consumption
      times its own nodal price, so the residual (congestion rent + scarcity rent) is
      a separate pot to allocate; (d) flow-tracing — attribute network usage and
      storage throughput to the generation that caused it under a proportional-sharing
      ("perfect mixing") assumption at each bus. NONE of these is derivable from the
      model; the rule is an assumption, and different defensible rules give different
      answers for the same network (see pitfalls).
    handle: null
    provenance: null
  - step: >
      (ex-post, 4) Reduce the resulting distribution to a reportable metric. The
      corpus's choices: a map or bar chart of per-region shares (the honest minimum),
      a Lorenz curve of cumulative generation share against cumulative demand share
      with its Gini coefficient, or a standard deviation of a per-load-normalised
      quantity. Report the metric alongside the distribution, never instead of it.
    handle: null
    provenance: null
  - step: >
      (ex-post, 5) Interpret against an explicit counterfactual. An attribution alone
      says nothing about fairness; "benefit" and "burden" are differences between two
      runs (cooperation vs autarky, zonal vs national pricing, K vs K=infinity). Run
      the counterfactual with everything else held fixed.
    handle: "electricity.autarky.{enable,by_country} for the isolation counterfactual"
    provenance: "scripts/prepare_network.py:enforce_autarky"
  - step: >
      (ex-ante, 1) Express the distributional target as a linear constraint over
      optimisation variables. The three forms in the corpus: a per-country/per-node
      self-sufficiency floor (annual local production >= share x annual local
      consumption); a hard topological cut (delete cross-border lines/links, i.e.
      autarky as a limit case of the floor); and a two-sided load-weighted capacity
      band around each node's proportional share of the system total.
    handle: "solving.constraints.EQ (eur) / opts token EQ<f>[c] (earth)"
    provenance: "scripts/solve_network.py:add_EQ_constraints"
  - step: >
      (ex-ante, 2) Sweep the constraint's tightness and re-solve at each level. This
      is the whole point: one run tells you nothing, the sequence gives you the
      cost-of-equity curve. The corpus sweeps 8 decentralisation levels and, crossed
      with a decarbonisation axis, 105 scenarios.
    handle: "run.scenarios / the {opts} wildcard as the sweep axis"
    provenance: "scripts/_helpers.py:get_scenarios"
  - step: >
      (ex-ante, 3) Report the cost premium relative to the unconstrained optimum
      against the equity metric from step (ex-post, 4) — the trade-off curve. Scale
      the constraint so it does not implicitly tighten the other targets: Aden's
      K-constraint is written as a fraction of TOTAL deployed renewable capacity
      precisely so that tightening K does not smuggle in a lower renewable share.
    handle: null
    provenance: null
  - step: >
      (either half, extension) Push the actor granularity below the model's spatial
      resolution — to households, income deciles or vehicle owners. The models have no
      such representation, so this step is always an external model fed by model
      outputs (prices, fuel costs, capital cost per unit); see `combines_with`.
    handle: null
    provenance: null
variants:
  - id: ex-post-cost-attribution
    what: >
      Split a solved system's annualised cost among nodes/countries/units by asset
      location, by load share, or by price times consumption, and map or tabulate the
      result. The cheapest variant — pure post-processing on one existing solve, no
      re-optimisation — and the most sensitive to the allocation rule. Franken's
      unit-level producer-surplus decomposition (wholesale + certificates + CfD
      top-ups + balancing, over 437 assets) and Liu's per-province generation /
      storage / transmission cost breakdown are the two ends of the granularity range.
    papers:
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
  - id: flow-tracing-network-usage
    what: >
      Attribute network (and storage) usage to the generation that caused it, by
      assuming proportional sharing / perfect mixing at every bus and propagating
      nodal mixes through the flows. Turns "who should pay for this line" from an
      argument into an arithmetic — at the price of one strong, unverifiable mixing
      assumption. Tranberg's contribution is extending the tracing through storage
      charge/discharge so that a stored MWh keeps its origin, separating local from
      non-local storage usage.
    papers:
      - "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
  - id: self-sufficiency-or-autarky-constraint
    what: >
      Impose a floor on each country's or node's own annual production as a share of
      its own consumption, and re-solve. Autarky (all cross-border capacity removed)
      is the 100% limit case implemented topologically rather than as a constraint.
      This is the variant with real config surface in both models, and it doubles as
      the counterfactual that turns an attribution into a "benefit of cooperation".
    papers:
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
  - id: decentralisation-share-constraint
    what: >
      Aden's K-parameter: a two-sided load-weighted band on each node's renewable
      capacity, (1/K)·w_n·R_total <= R_n <= K·w_n·R_total, where w_n is the node's
      load share and R_total is total deployed renewable capacity. K = infinity is
      unconstrained, K = 1 forces exactly load-proportional deployment. Because the
      bound scales with R_total rather than with a fixed number, tightening K does not
      implicitly weaken the decarbonisation target — the design detail that makes the
      sweep interpretable. Distinct from the self-sufficiency floor: it constrains
      CAPACITY SITING, not annual energy balance, and it is two-sided.
    papers:
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
  - id: distributional-metric-reporting
    what: >
      Reduce a per-actor distribution to a scalar and track it across scenarios:
      Lorenz curve + Gini coefficient over regional generation against regional
      demand (Neumann, tracked against transmission volume across four MGA search
      directions), or the standard deviation of nodal renewable capacity per load
      (Aden's SDRCL). Post-processing only, so it composes with any other variant —
      and both corpus uses compute it as an OBSERVED side-effect of solutions found
      for other reasons, never as an objective.
    papers:
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
  - id: household-or-consumer-class-incidence
    what: >
      Carry the split below the model's spatial resolution to households, income
      groups or consumer classes. Neither model has any household representation, so
      this is always an external incidence model consuming model outputs. Listed as a
      variant because users ask for it constantly and the card must be able to say
      "not in this model" with a reason.
    papers: []
literature:
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: defines
    note: >
      The corpus's most complete distributional analysis and the one that treats
      allocation as a policy design problem rather than an accounting exercise.
      Computes producer surplus unit-by-unit for 437 BMUs across wholesale, RO
      certificates, CfD top-ups and balancing revenue under both national and six-zone
      market designs, then analyses three grandfathering policies that redistribute the
      resulting winners' gains to the losers: CfD strike-price grandfathering,
      production-based FTRs allocating intra-GB congestion rent in proportion to actual
      dispatch (removes price risk), and a grandfathered merit order that splits
      dispatch from revenue so curtailed units are covered too (removes volume risk).
      Total payout is constrained to the available congestion rent, with 0-100%
      allocation to generators as the sweep. The lesson to relay: the aggregate welfare
      number and the distributional number are different results, and the second one is
      what decides whether the reform happens.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: extends
    note: >
      Source of the self-sufficiency constraint as a formulation: a 75% net
      self-sufficiency floor on annual energy demand for every represented country,
      derived as a linear bound on the ratio of total annual local production to total
      annual imports, and generalised to multi-bus links by efficiency weighting —
      which is the non-obvious part, since a sector-coupled link's "production" depends
      on which port you read. The paper calls this a novelty for sector-coupled
      European models. It states the mathematics only, not the implementation, which is
      exactly why the eur/earth `add_EQ_constraints` (electricity-only, generators and
      storage spill only) is not a drop-in substitute.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: extends
    note: >
      The ex-ante half done properly: PyPSA-Eur at 37 nodes, electricity-only, hourly,
      2013 weather, 2050 loads and costs, with the load-weighted K-constraint (Eq. 7)
      swept over K in {inf,7,6,5,4,3,2,1} crossed with 14 decarbonisation levels =
      105 solved networks. Introduces SDRCL (standard deviation of nodal renewable
      capacity per load, Eq. 9) as the equity metric, computed post-optimisation on
      each network, and reports equity benefit against cost premium relative to
      K=infinity. Two design choices to copy: scale the bound by total deployed
      renewable capacity so the equity axis is orthogonal to the decarbonisation axis,
      and make the band two-sided so you constrain concentration and under-deployment
      at once.
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: extends
    note: >
      Contributes the metric half and the composition with MGA: Lorenz curves relating
      cumulative regional electricity generation to cumulative regional demand across
      the 100 model regions, with the Gini coefficient as twice the area between the
      curve and the identity line, computed for every near-optimal solution and plotted
      against transmission network volume (TWkm) for four MGA search directions
      (min/max transmission, min/max storage). Equity is an OBSERVED property of
      solutions found for other reasons, not an objective — which is what makes it a
      cheap addition to any existing ensemble. Also the corpus's pointer to the
      external equity literature (Sasse, Drechsler) that the models do not contain.
  - paper: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
    tier: 1
    role: extends
    note: >
      Extends generalised flow tracing (proportional sharing under a perfect-mixing
      assumption at each bus) to storage charging and discharging, so that stored
      energy retains the identity of the generation that produced it. Derives nodal
      mixes q_n,m and internal mixes r_n,alpha and propagates them through the network
      to separate local from non-local storage usage. Post-processing on a solved
      network, entirely outside the optimisation. This is the corpus's machinery for
      attributing NETWORK AND STORAGE USAGE rather than asset cost, and the only
      variant on this card with no implementation in either model or in pypsa itself.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Descriptive nodal cost mapping as routine reporting, in a section literally
      titled "Cost allocation": component-wise generation, storage and transmission
      cost broken out across 31 Chinese provinces and compared between two grid
      topologies (RGDC and FCG), plus levelised transmission cost in EUR/MWh averaged
      over scenarios. No formal equity metric — no Gini, no constraint. Included
      because it is the honest baseline this card should recommend first: map the
      per-region cost before reaching for a coefficient, since the map shows the
      northwest-province concentration that a scalar would hide.
pitfalls:
  - pitfall: >
      Cost attribution is NOT UNIQUE. Asset location, load-proportional, price-times-
      consumption and flow-tracing are all defensible rules, and they give materially
      different per-actor numbers for the same solved network. There is no
      model-internal fact that selects one; the LP's objective is a system total and
      the split is an assumption layered on top of it.
    evidence: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
    note: >
      This is the card's central honesty point. Always state the rule with the number,
      and where the decision is contested, report at least two rules and show the
      spread. A single allocation presented without its rule is a negotiating position
      dressed as a result. Flow tracing does not escape this — it replaces the
      arbitrariness of the split with one strong assumption (perfect mixing at every
      bus), which is a different arbitrariness, not the absence of one.
  - pitfall: >
      A scalar equity metric destroys the information the user actually needs. A Gini
      coefficient (or SDRCL) is invariant to WHICH regions are disadvantaged, and two
      systems with identical Gini can be politically opposite. The metrics also depend
      on the model's spatial clustering: the same physical system reported at 37 and
      100 nodes gives different Ginis because the regions being compared are different
      objects.
    evidence: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    note: >
      Report the distribution (map or Lorenz curve) alongside any scalar, and never
      compare a metric across runs at different cluster counts. Fix the clustering
      before sweeping the equity axis.
  - pitfall: >
      Equity and self-sufficiency constraints are not the same thing, and the models'
      surfaces encourage conflating them. `add_EQ_constraints` in BOTH repos is a floor
      on total generation (all carriers, plus hydro spillage bookkeeping) as a share of
      local load — it is a SELF-SUFFICIENCY constraint, not a renewable-share floor and
      not a fairness constraint. Aden's K-constraint bounds renewable CAPACITY SITING
      two-sidedly. A user asking for "a fairer build-out" who is given EQ0.7 gets a
      different study.
    evidence: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    note: >
      Read the docstring of `add_EQ_constraints` before promising semantics, and
      confirm with the user which of the three they mean: energy self-sufficiency,
      capacity siting proportionality, or cost/benefit incidence. Note also that
      pypsa-earth's registry note claims EQ's trailing `c` means "carbon-free sources
      only"; the code shows `c` switches the grouper from bus to country. The registry
      note is wrong and the code is the authority.
  - pitfall: >
      A distributional result with no counterfactual is not a result. "Country X bears
      12% of system cost" is meaningless without "…versus 19% under autarky". Autarky
      is a violent counterfactual: eur's `enforce_autarky` DELETES every line and every
      DC link (or the cross-border subset), which can render a region infeasible rather
      than merely expensive, and silently changes the network topology the summary
      tables are computed over.
    evidence: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    note: >
      Prefer a graded self-sufficiency floor (EQ0.5, EQ0.75, EQ0.9) over the binary
      autarky switch, so the counterfactual is a curve rather than a cliff, and so
      infeasibility is diagnosable as "the floor bites here" rather than "the solver
      failed". Check the line/link counts before and after.
  - pitfall: >
      Tightening an equity constraint can silently tighten an unrelated target.
      A fixed per-node capacity bound written as an absolute number, or a
      self-sufficiency floor applied while a renewable-share constraint is also active,
      makes the "cost of equity" you measure a mixture of two effects.
    evidence: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    note: >
      Write the equity bound relative to the endogenous total (Aden's R_total scaling),
      and verify orthogonality by checking that the constrained runs hit the same
      emissions/renewable-share value as the unconstrained one before attributing any
      cost difference to equity.
  - pitfall: >
      Redistribution schemes are budget-constrained, and the budget is itself a model
      output whose size depends on the market design being evaluated. Allocating 100%
      of congestion rent to generators is an extreme case, not a neutral default, and
      the rent available shrinks as the reform succeeds in relieving congestion.
    evidence: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    note: >
      Report the payout as a fraction of the available rent and sweep it (Franken
      sweeps 0-100%), and state whether the rent is computed in the reformed or the
      counterfactual world — they differ, and the difference is the whole compensation
      argument.
requires_methods:
  - shadow-prices-and-marginal-values
combines_with:
