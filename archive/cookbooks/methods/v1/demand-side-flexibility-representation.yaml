id: demand-side-flexibility-representation
title: "Demand-side flexibility representation (DSM, smart charging, V2G, load shifting)"
summary: >
  Turning a fixed load profile into a shiftable one by adding a Store that buffers the
  service demand plus Links that meter the flow into and out of it, bounded by
  availability and restriction time series that encode when the shift is physically or
  behaviourally allowed.
question: >
  How much does it change the system if this demand can move in time (or space) rather
  than being served the hour it arrives, and how much flexibility is worth paying for?
aliases:
  - "demand-side management"
  - "DSM"
  - "demand response"
  - "demand-side flexibility"
  - "smart charging"
  - "controlled charging"
  - "vehicle-to-grid"
  - "V2G"
  - "load shifting"
  - "load shedding / curtailable load"
  - "peak shaving"
  - "spatio-temporal load shifting"
  - "building thermal inertia / thermal mass flexibility"
  - "price-elastic demand"
  - "price-responsive / price-sensitive demand"
  - "behavioural flexibility"
  - "flexible load"
  - "virtual storage representation of DSM"
when_to_use:
  - "what if EV charging were smart instead of plug-and-charge"
  - "how much storage do we avoid building if cars charge flexibly"
  - "is vehicle-to-grid worth it"
  - "can heat pumps and hot water tanks shift load off the evening peak"
  - "how much can industry shift its electricity use within the day"
  - "what does demand response do to prices and to peak capacity"
  - "our data centres can move compute between sites and hours — model that"
  - "make the load respond to price instead of being fixed"
  - "how much flexibility does the system need, and who provides it"
  - "what happens if consumers just use less at peak times"
family: sector-coupling
prevalence:
  papers: 20
  tier1: 14
  tier2: 6
  sweep_hits: 40
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 20 papers that actually build
    a flexibility construction, against 40 regex hits. The screen OVER-counts by 2x
    because "demand-side management" and "flexibility" are boilerplate in
    sector-coupling abstracts and related-work sections; a paper that merely lists DSM
    among the options it did not enable is not in this literature. The one borderline
    inclusion is 2025_Lindner_PyPSA-DE_EEM, flagged as a mention-only suspect in
    EVIDENCE_INDEX.md and kept because it does attribute flexibility PROVISION by time
    scale to BEV charging management with a named method (Artelys decomposition), which
    is a use of the construction rather than a citation of it. The role split is the
    tell: 11 of 20 are `routine-use`, i.e. EV smart charging plus V2G at a 50%
    participation share with a 75%-by-7am floor is now default furniture in
    sector-coupled European studies, and only the 3 `defines` and 4 `extends` papers
    contribute construction content.
procedure:
  - step: >
      Decide what the flexible quantity IS. This is the modelling decision that fixes
      everything downstream, because PyPSA has no flexible-load component: the demand
      must be re-expressed as a SERVICE (km driven, degrees of comfort, tonnes produced,
      compute jobs) delivered from an intermediate carrier, not as electricity consumed
      at the electricity bus. A Load whose p_set is fixed cannot be shifted; a Load on
      an intermediate bus that is FED by a Link can be.
    handle: null
    provenance: null
  - step: >
      Add a Bus for that intermediate carrier at each location, and move the fixed Load
      onto it. The load profile is unchanged and still exogenous — what changes is that
      the profile now constrains an internal bus rather than the electricity bus.
      pypsa-eur's `EV battery` bus is exactly this: the `land transport EV` Load sits on
      it, not on the AC bus.
    handle: "n.add('Bus', ..., carrier='EV battery') then n.add('Load', ..., bus=nodes + ' EV battery')"
    provenance: "scripts/prepare_sector_network.py:add_EVs"
  - step: >
      Add a Link from the supplying bus to the intermediate bus. Its p_nom is the
      physical connection rating (chargers installed x kW per charger x electric share);
      its efficiency is the charging/conversion efficiency. This Link is the metered
      pathway whose timing the optimiser now controls.
    handle: "n.add('Link', ..., suffix=' BEV charger', bus0=nodes, bus1=nodes + ' EV battery', p_nom=number_cars * bev_charge_rate * electric_share, efficiency=bev_charge_efficiency)"
    provenance: "scripts/prepare_sector_network.py:add_EVs"
  - step: >
      Bound that Link with an AVAILABILITY time series p_max_pu. This is the first of the
      two restriction series and it encodes when the flexible asset is physically
      connected. The corpus's standard construction derives it from mobility data:
      plugged-in share is highest when traffic count is lowest, scaled linearly between a
      mean and a maximum (0.8 / 0.95 in every paper that reports it, min ~0.62 realised).
    handle: "bev_availability_profile(fn, snapshots, nodes, options) -> p_max_pu on the BEV charger Link"
    provenance: "scripts/build_transport_demand.py:bev_availability_profile"
  - step: >
      Add a Store on the intermediate bus. Its e_nom is the aggregate buffer available to
      the model — for a lumped EV fleet, cars x kWh per car x the PARTICIPATION share, not
      the whole fleet. e_cyclic=True closes the annual energy balance so the flexibility
      cannot create or destroy energy over the year. This Store IS the flexibility; nothing
      else in the construction stores anything.
    handle: "n.add('Store', ..., bus=nodes + ' EV battery', e_cyclic=True, e_nom=number_cars * bev_energy * bev_dsm_availability * electric_share)"
    provenance: "scripts/prepare_sector_network.py:add_EVs"
  - step: >
      Bound that Store with a RESTRICTION time series on its energy level — the second
      series, and the one that separates a credible model from a battery pretending to be
      a car fleet. The corpus's construction is a weekly e_min_pu profile that is zero at
      every hour except one per day, where it is set to the required state of charge
      (0.75-0.8 at 6-7am is the consensus). Without it the fleet performs seasonal
      arbitrage; with it, shifting is confined to within a day.
    handle: "bev_dsm_profile(snapshots, nodes, options) -> e_min_pu on the EV battery Store, from sector.bev_dsm_restriction_{value,time}"
    provenance: "scripts/build_transport_demand.py:bev_dsm_profile"
  - step: >
      (optional, and a separate decision) Add the REVERSE Link, intermediate bus back to
      the supplying bus, for discharge — V2G. Same availability p_max_pu, same efficiency
      (so round-trip is efficiency squared), and its p_nom should be scaled by the
      participation share because only participating vehicles can export. Enabling
      discharge without also enabling the Store is meaningless: there is nothing to
      discharge from.
    handle: "n.add('Link', ..., suffix=' V2G', bus0=nodes + ' EV battery', bus1=nodes, p_nom=p_nom * bev_dsm_availability, p_max_pu=avail_profile)"
    provenance: "scripts/prepare_sector_network.py:add_EVs"
  - step: >
      (thermal variant — a genuinely different construction) For building thermal inertia
      there is no intermediate bus and no Link. Instead put a Store DIRECTLY on the
      existing heat bus with a SIGNED bound: e_max_pu = +profile permits pre-heating
      (overheat), e_min_pu = -profile permits coasting on stored warmth (undercool), and
      the profile is zeroed at checkpoint hours to force the buffer empty and cap the
      shift window. e_nom is scaled off peak space-heat demand; standing_loss carries the
      building's thermal decay. A NEGATIVE e_min_pu is what makes this work — the store
      may run a deficit, which no ordinary storage may do.
    handle: "heat_dsm_profile(nodes, options) -> e_max_pu / (-1)*e_min_pu on the '{heat_system} heat dsm' Store"
    provenance: "scripts/build_hourly_heat_demand.py:heat_dsm_profile; scripts/prepare_sector_network.py:add_heat"
  - step: >
      (industrial variant) For a process whose technology is fixed but whose timing is
      partly free, skip the Store and put a p_min_pu FLOOR on the conversion Link
      instead. must_run = 0.8 means 80% of the process must run every hour and 20% is
      shiftable within whatever the surrounding constraints allow. This is a
      must-run/curtailable representation, not a buffer: shifted energy is not stored, it
      is redistributed, and the redistribution window is implicit rather than declared.
    handle: "p_min_pu=must_run on the industrial process Links, from sector.industry_t.must_run"
    provenance: "scripts/prepare_sector_network.py:add_t_industry100_200"
  - step: >
      (spatial variant) For a load that can move between LOCATIONS as well as hours, add
      a complete graph of "virtual" Links between the flexible sites — pathways that carry
      the service, not electricity, and are therefore not limited by the transmission
      network — plus a conservation constraint over each shifting period (a calendar day)
      so total service delivered is preserved, and a per-site band [(1-f)*d, (1+f)*d] on
      the dispatched load. The flexibility parameter f is exogenous and swept.
    handle: null
    provenance: null
  - step: >
      (elastic variant) For price-responsive rather than shiftable demand, replace the
      fixed Load with a decision variable carrying a utility term in the objective. The
      corpus's numerically-stable formulation substitutes d = D - g, which turns the
      elastic demand into a load-shedding GENERATOR at the willingness-to-pay price, so a
      piecewise-linear demand curve becomes N shedding generators with N marginal costs.
      A single high-cost shedding generator is the degenerate one-step case of this.
    handle: "add_load_balance_components(n, config, sign=1) — one shedding Generator per bus per carrier at a configurable EUR/MWh; the multi-step curve is not built"
    provenance: "scripts/solve_network.py:add_load_balance_components"
  - step: >
      Sweep the participation share and the restriction parameters, and report against a
      no-flexibility baseline. Every paper in this corpus does this rather than reporting
      one flexibility case: shares of 20-100%, restriction floors of 0.75-0.8, shift
      windows of 4h to 24h. The flexibility VALUE is the difference between runs, so the
      baseline construction must be stated as carefully as the flexible one.
    handle: "run.scenarios.enable + a scenario file over the sector.bev_* / residential_heat.dsm.* keys"
    provenance: "scripts/_helpers.py:get_scenarios"
variants:
  - id: ev-smart-charging
    what: >
      Charging timing is optimised within plugged-in availability and a daily
      state-of-charge floor; no export back to the grid. The cheapest and most widely
      deployed construction — Store + forward Link + two time series. Consensus
      parameters across the corpus: 50 kWh per car (60-67 in the later papers), 11 kW
      charger, 90% efficiency, 50% participation, SoC >= 75% at 6-7am.
    papers:
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
      - "2025_Lindner_PyPSA-DE_EEM.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
  - id: v2g-bidirectional
    what: >
      Smart charging plus the reverse discharge Link, making the parked fleet a
      distributed battery. Reported as the single largest flexibility lever in the
      corpus: up to 30% less H2 storage, 3-8% less stationary battery, up to 20% less
      distribution grid capacity, and 130 bn EUR cumulative savings against 9 bn EUR for
      smart charging alone in the one paper that separates them. Sensitive to the
      participation share in a way smart charging is not.
    papers:
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
  - id: building-thermal-inertia
    what: >
      Heat demand shifted by over- or under-heating the building fabric within a comfort
      band: a signed Store on the heat bus with checkpoint hours, no Link, thermal
      standing loss. Reported shift capability ~12 h at 2%/h loss, or 2-3 h if restricted
      to pre-heating only. Distinct from thermal-storage-in-a-tank, which is an ordinary
      Store plus charger/discharger Links and belongs to storage sizing.
    papers:
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
  - id: industrial-load-shifting
    what: >
      Electricity demand of an industrial process moved within the day, bounded by a
      shiftable power capacity and a maximum holding duration. Two representations in the
      corpus: a debt-tracking virtual store with a 24 h cycling constraint and a uniform
      4 h holding duration (6-10 GW for Germany), or a p_min_pu must-run floor on the
      process Link with the shiftable remainder free. The window is the parameter that
      matters; the buffer size follows from it.
    papers:
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
  - id: spatio-temporal-shifting
    what: >
      Load moves between REGIONS as well as hours. A complete bipartite graph of virtual
      links between flexible sites carries the service outside the transmission network,
      a daily usage-conservation constraint bounds the temporal shift, and a flexibility
      band [(1-f)d, (1+f)d] bounds the per-site deviation. Genuinely a different
      construction: the Store is replaced by a conservation constraint over a set of
      buses, and the three exploitable signals are resource-quality differences, wind
      correlation falloff with distance, and solar time-lag.
    papers:
      - "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
      - "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
  - id: price-elastic-demand
    what: >
      Demand as a welfare-maximising decision variable with a sloped willingness-to-pay
      curve, not a shiftable quantity. Four functional forms in the corpus: perfectly
      inelastic, a VOLL step, linear (quadratic utility, so a QP), and piecewise-linear
      log-log (three segments, -5% elasticity at 100 EUR/MWh). Explicitly NOT reducible to
      a virtual store, and the only construction in this card that changes the objective
      rather than the network.
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
  - id: exogenous-profile-alteration
    what: >
      Not endogenous flexibility at all: the load profile is edited BEFORE optimisation —
      a uniform percentage reduction, or peak-shaved to a threshold fraction of
      peak-minus-minimum. Included because it is what users usually mean by "demand
      response", it is the only variant that is free in both models, and the corpus
      measures it against the endogenous constructions to show they answer different
      questions.
    papers:
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
  - id: curtailable-load-shedding
    what: >
      Demand that can simply not be served, at a stated cost — a shedding Generator with
      zero capex and a high marginal cost. The one-step degenerate case of
      price-elastic-demand, and the only endogenous demand-side surface either model
      exposes outside the sector chain. Used both as an economic instrument (a swept
      100-400 EUR/MWh threshold representing a one-step utility function, or a 2000
      EUR/MWh VOLL) and as an infeasibility diagnostic.
    papers:
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
  - id: flexible-electrolysis-and-ptx
    what: >
      A conversion process whose output carrier is storable is flexible for free: relax
      its minimum part load and its ramp limit and it absorbs surplus by itself, with the
      output store doing the buffering. The corpus's DSM/no-DSM contrast is 10% vs 30%
      minimum load plus a +/-5%/h ramp limit, or a 50 EUR/MWh strike price above which
      the electrolyser stops. Cheapest flexibility in the book because the Store is
      already there for another reason.
    papers:
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
literature:
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      The formulation statement this whole card rests on, and the reason `absent` is the
      honest verdict for elastic demand: PyPSA offers DSM as a Store with time-series
      per-unit energy bounds (e_min_pu, e_max_pu scaling e_nom) plus Links with
      time-dependent flow bounds, following Kleinhans 2014. It describes the CAPABILITY
      and demonstrates no application — which is exactly the situation the workflows
      inherited. Quote to users: there is no flexible-load component, only these two
      primitives.
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference implementation of the aggregate BEV construction, and the source of
      the parameter conventions every later paper reuses: 50 kWh per car made available
      by a swept fraction of the fleet (25/50/100% for DSM and separately for V2G),
      charging availability inversely proportional to the transport demand profile
      (min ~62%, mean 80%, max 95%), and state of charge forced to 75-100% at 5am daily.
      It is also the paper that states the consequence of that last constraint plainly:
      it prevents BEVs from doing synoptic or seasonal shifting, so the fleet is a daily
      resource by construction.
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for how the construction is USED in a pathway: fleet size exogenous,
      smart-charging share fixed at 50% and V2G share at 25% in every 5-year step, with
      no sensitivity (deferred to prior work). The finding to relay is the substitution
      effect — V2G and smart charging reduce stationary battery need and shift the
      optimum toward solar PV, i.e. the flexibility construction changes the GENERATION
      mix, not just the storage mix.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Establishes the thermal side of the taxonomy: tank thermal storage with an
      exponential decay time constant, seasonal (tau = 180 d) in district-heated urban
      areas and short-term only (tau = 3 d) decentrally, plus hybrid heat pumps with gas
      backup for peaks and retrofitting as a demand-REDUCING supply technology. Useful
      here mainly as the boundary case: a tank is a Store with charger/discharger Links
      and belongs to storage sizing; building fabric inertia is the signed store this
      card describes.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      The clearest statement of the restriction parameter and its purpose: 50% of the
      fleet smart-charges and does V2G, and SoC is forced above 75% at 7am "to ensure the
      batteries are close to full in the morning peak usage" — which restricts shifting to
      within a day. Also records the exclusion that matters for cost interpretation: the
      EV battery capital cost is not charged to the power system, being treated as a
      mobility investment.
  - paper: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    tier: 2
    role: routine-use
    note: >
      Flexibility defined SPATIALLY and not temporally — can a hydrogen-consuming sector
      locate adjacent to production? — with synthetic fuels, rail and road transport held
      temporally flat and only heating given an hourly temperature-driven profile.
      Included as the weak form of spatio-temporal-shifting: siting freedom is a
      pre-optimisation degree of freedom over WHERE the load sits, with no hour-to-hour
      shifting at all, and it is worth naming so an interview does not confuse the two.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Standard-furniture application of the full construction (50% of the fleet in demand
      response and V2G, 11 kW, 50 kWh, 90% efficiency, 80% mean / 62% minimum
      availability, SoC >= 75% at 7am), and the useful adjacent observation that
      electrolysers were also run flexibly to absorb surplus at 35-41% average
      utilisation — the flexible-electrolysis variant appearing as a by-product of
      building an H2 network rather than as a designed flexibility study.
  - paper: "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
    tier: 2
    role: routine-use
    note: >
      The most explicit multi-construction study in a purely OPERATIONAL setting (1024
      nodes, exogenous capacities, no expansion): heat-pump load shifted via thermal
      storage with a COP formula converting heat to electricity, EV charging bounded by a
      2-hour average residence time derived from German highway activity data and NO V2G,
      and electrolysis as price-sensitive demand with a 50 EUR/MWh strike price. Also the
      only paper that ties flexibility placement to the grid question: flexible consumers
      are sited by population/GDP for heat pumps and EVs but correlated with renewable
      capacity for electrolysers, which is what makes them a congestion instrument.
  - paper: "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
    tier: 1
    role: defines
    note: >
      Introduces the spatial construction and is the reason this card has a variant no
      other paper touches. Spatial shifts travel over VIRTUAL links (a complete bipartite
      graph between all datacenter pairs, non-physical, explicitly unconstrained by the
      transmission network and bounded only by computing capacity); temporal shifts are
      bounded by a daily compute-usage conservation constraint; the dispatched load is
      held within [(1-f)d, (1+f)d] with f swept 0-40%. The three exploitable signals it
      identifies — resource-quality differences between regions, wind correlation falloff
      with distance, solar time-lag across longitudes — are what an interview should use to
      judge whether a spatial study is worth running for a given geography.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      Records the aggregate SCALE the standard construction reaches, which is the number
      to sanity-check a run against: 50% V2G participation with 80% average grid
      connection gives ~5.2 TWh of European storage by 2050, sized exogenously off the
      fleet electrification pathway and not optimised. Same 75%-by-7am floor.
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: extends
    note: >
      The paper that makes price-elastic-demand a separate variant rather than a footnote,
      and the source of this card's most important negative claim. It implements four
      demand-curve forms (perfectly inelastic, VOLL step, linear via quadratic utility,
      three-segment piecewise-linear log-log at a=(8000,400,200), b=(80,40,20),
      D=(95,5,10) MW giving -5% elasticity at 100 EUR/MWh), tests cross-price elasticity
      between hours over a 4 h window, and states directly that "modelling DSM with
      virtual storage units is not sufficient to resolve pricing problems... sloped
      demand curves with smoothly varying WTP are what is needed". It also supplies the
      implementation trick that makes elastic demand cheap to add: substitute d = D - g so
      the demand variable becomes a load-shedding generator, one per curve segment.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: defines
    note: >
      The systematic treatment of the RESTRICTION parameters as the object of study rather
      than as fixed conventions. Three modes per sector — fully flexible (model controls
      dispatch under a SoC floor), constrained (EV: a 4-hour overnight window with 12%
      daily opt-out; heat: pre-heating only in the 2-3 h before the morning and afternoon
      peaks, with no battery), and off (charge on plug-in, heat follows demand) — with
      demand TOTALS identical across modes so only timing changes. Heat flexibility is a
      12 h shift at 2%/h loss. Its cross-sectoral rollout sweep (EV 0-100% x heat 0-100%)
      is the design an interview should copy when asked what flexibility is worth.
  - paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    tier: 2
    role: extends
    note: >
      Writes down the lumped-fleet construction as three explicit constraints rather than
      leaving it implicit in code, which is what makes it citable when reimplementing:
      a DSM store decoupling charging from driving with SoC >= 75% at 6am, charging
      capacity scaled to 5x the cost-optimal minimum to represent parked-vehicle
      simultaneity, and the lumped battery energy capacity tied to that charging capacity.
      Availability is inversely proportional to transport demand with av_max 0.95 and
      av_mean 0.8; 11 kW charger, 67 kWh battery, 90% each direction, 50% participation
      with a 100% sensitivity.
  - paper: "2025_Lindner_PyPSA-DE_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Borderline inclusion (flagged mention-only in EVIDENCE_INDEX.md), kept for one
      contribution: it attributes flexibility NEEDS by time scale and finds daily
      flexibility needs rise 10x between 2020 and 2045, met by a mix of EV charging
      management and stationary batteries. That is the framing an interview needs to
      answer "how much flexibility does the system need" — a time-scale decomposition of
      the residual, not a technology capacity.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: extends
    note: >
      The card's taxonomy paper: four stylised mechanisms applied independently per sector
      across 124 scenarios, and it is the split between them that matters. (i) constant
      service-demand reduction (5-40%) and (ii) peak shaving to a threshold are
      PRE-optimisation profile edits; (iii) temporal shifting is an endogenous cost-free
      ideal lossless store at the demand bus, sized 0.01-0.1% of annual demand with no
      power limit; (iv) demand curtailment is an endogenous zero-capex high-marginal-cost
      shedding generator swept 100-400 EUR/MWh, explicitly a one-step utility function.
      (iii) and (iv) are the two endogenous constructions either model can host today;
      (i) and (ii) are what users usually mean and cost nothing to do.
  - paper: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      The only paper that isolates the value of each layer, and therefore the one to quote
      on whether V2G is worth it. Main scenarios deliberately use INFLEXIBLE charging as a
      conservative baseline; sensitivities add DSM alone and DSM+V2G. V2G reduces H2
      storage by up to 30%, battery storage by 3-8%, distribution grid capacity by up to
      20%, and total system cost by only ~0.4% — cumulative savings 9 bn EUR for DSM
      against 130 bn EUR for V2G at a 2% social discount rate. The small system-cost delta
      alongside the large capacity deltas is the honest headline.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      A price-based demand-response construction outside the European models: load can
      shift forward OR backward in time and be held for any period, at a per-MWh cost
      charged for each hour stored — i.e. an unrestricted store with a marginal cost
      instead of a restriction time series, which is the opposite design choice from the
      corpus's checkpoint-hour convention. EVs are represented as must-run Links pinned to
      the EV load profile (min = max), which is the no-flexibility baseline expressed
      through the same primitive.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The industrial-shifting reference and the most complete scenario design in the
      corpus: BEV flexible-charging share 20/50/80% by scenario with an 80% SoC floor at
      07:00 and daily cycling periodicity; V2G only from 2035 and only in the high-flex
      case at 80% of the fleet, 90% per direction; industrial DSM as a debt-tracking
      virtual storage shifting within the same day under a 24 h cycling constraint with a
      uniform 4 h holding duration, sized 6 GW in 2035 and 10 GW in 2045 for Germany. It
      also names power-to-heat as an IMPLICIT DSM channel via thermal storage, which is
      the flexible-electrolysis argument applied to heat.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Records what the fixed-load assumption costs you at the PRICE layer: inelastic
      residential/commercial/industrial/agricultural demand as fixed profiles with load
      shedding at 2000 EUR/MWh, against which BEV chargers, electrolysis, heat pumps,
      resistive heaters, methanolisation and DAC bid at the opportunity cost of their
      output carrier and become the dominant price setters from 2035. Its most useful line
      for this card is the negative one: price elasticity was tested and EXCLUDED as
      computationally infeasible, which is a real warning about the QP form of
      price-elastic-demand at sector-coupled scale.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: extends
    note: >
      Generalises the construction across four demand sectors at once and, unusually,
      specifies the NO-DSM counterfactual as carefully as the DSM case — which is the
      methodological contribution. DSM: electrolysers at 10% minimum load with no ramp
      limit, EVs 60 kWh with an 80% floor at 7am and 50% participation, heat-pump thermal
      storage at E/P = 3 h of peak load, resistive heating at E/P = 2 h. NoDSM:
      electrolysers at 30% minimum load with a +/-5%/h ramp limit, EVs on a
      smoothed/time-shifted profile with no storage, heat served instantly. Thermal
      storage is implemented as equivalent ELECTRICITY storage, a simplification worth
      flagging when reusing the design.
pitfalls:
  - pitfall: >
      Without the restriction time series the flexible asset becomes a seasonal battery.
      A Store with e_cyclic=True and no e_min_pu floor will arbitrage across weeks and
      months, so an EV fleet that should shift within a day silently becomes multi-TWh of
      long-duration storage and displaces the hydrogen and pumped-hydro the study was
      meant to size.
    evidence: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    note: >
      Always set sector.bev_dsm_restriction_value (>= 0.75) and _restriction_time, and
      check the realised e_t series has a daily period. This is the single most common
      silent failure in this method, and it inflates the flexibility benefit rather than
      erroring.
  - pitfall: >
      Virtual-storage DSM does not fix price formation. Representing flexible demand as a
      store gives a vertical demand curve at every hour plus an intertemporal constraint,
      so zero-price and price-spike hours persist and cost recovery is not restored. The
      pricing problem the user is actually asking about needs a SLOPED willingness-to-pay
      curve, which is a different construction.
    evidence: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    note: >
      If the question is about prices, scarcity rents or cost recovery, route to
      price-elastic-demand (absent in both registries, so L5) and do not offer the DSM
      store as a substitute. If the question is about capacity and dispatch, the store is
      fine.
  - pitfall: >
      Flexibility looks nearly free in total-system-cost terms while moving capacity
      numbers a lot. The corpus's cleanest isolation finds V2G cuts H2 storage by up to
      30%, batteries by 3-8% and distribution grid capacity by up to 20% for a total system
      cost change of about 0.4%.
    evidence: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    note: >
      Report capacity and cumulative-cost deltas, not the single-year percentage cost
      delta, or the answer reads as "flexibility does not matter" when the study says the
      opposite. Note also that the EV battery capital cost is normally charged to mobility
      and not to the power system.
  - pitfall: >
      The participation share is exogenous and the results are close to linear in it, so
      the headline number is a direct restatement of an assumption nobody validated. The
      corpus spans 20% to 100% with 50% as a convention, not a finding.
    evidence: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    note: >
      Sweep the share rather than picking one, and present the flexibility value as a
      curve. A single-share result should always be labelled with the share in the same
      sentence.
  - pitfall: >
      Pre-optimisation profile edits and endogenous flexibility answer different
      questions and are routinely conflated under "demand response". A constant reduction
      or a peak shave changes the demand the system must serve; a store or a shedding
      generator changes when and whether it is served, at a cost.
    evidence: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    note: >
      Establish in the interview which one the user means before choosing a rung — the
      exogenous forms are L1/L3 and nearly free, the endogenous forms are L0-L5 depending
      on the sector, and they are not substitutes.
  - pitfall: >
      Idealised shifting stores that are lossless, cost-free and unconstrained in power
      overstate flexibility. The corpus's own idealised case makes this explicit: a
      cost-free lossless store sized at only 0.01-0.1% of annual demand with NO power
      limit already captures most of the benefit, which means the result is driven by the
      absent power limit rather than by the energy capacity.
    evidence: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    note: >
      Give every flexibility store a power limit (the Link p_nom), a round-trip
      efficiency, and either a standing loss or a shift window. If the answer is
      insensitive to all four, the model is measuring an assumption.
  - pitfall: >
      Spatial shifting over virtual links bypasses the transmission network by
      construction, so a spatio-temporal result assumes the grid can accommodate the
      relocated load without saying so. The defining paper bounds spatial shifts only by
      computing capacity.
    evidence: "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
    note: >
      Either state the assumption explicitly, or place the flexible sites on real buses
      inside a network with expansion limits so the relocation pays a transmission cost.
      Check whether the geography actually has the three signals (resource-quality gap,
      decorrelated wind, longitudinal solar lag) before promising a benefit.
  - pitfall: >
      The QP form of price-elastic demand (linear demand, quadratic utility) can be
      computationally infeasible at sector-coupled scale — one corpus paper tested it and
      dropped it for that reason.
    evidence: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    note: >
      Use the piecewise-linear log-log form implemented as N shedding generators with N
      marginal costs, which keeps the problem an LP. Three segments were enough in the
      corpus.
  - pitfall: >
      Shifting the whole demand profile is not the same as shifting a technology's demand,
      because the availability window may be far tighter than a day. The most detailed
      operational study bounds EV flexibility by a 2-hour average residence time from
      activity data, not by an overnight window.
    evidence: "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
    note: >
      Derive the availability profile from mobility or occupancy data for the region in
      question. The shipped weekly profile is German traffic-count data and its shape does
      not transfer to a country with different commuting patterns.
