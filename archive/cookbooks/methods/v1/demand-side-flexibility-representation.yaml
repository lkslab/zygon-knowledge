pypsa_primitive:
  symbol: "pypsa/optimization/constraints.py:define_operational_constraints_for_non_extendables"
  pypsa_version: "0.30.3"
  exposed_by: >
    both — every DSM construction in either workflow is this one function plus
    define_store_constraints, and neither model has to ask for it
  reachable_via: >
    Nothing: it is unconditional for any Store. pypsa/variables.csv classifies Store `e` as
    "not nominal and not handle_separately", so the optimize loop calls
    define_operational_variables(n, sns, 'Store', 'e') and then this function, which reads
    min_pu, max_pu = get_bounds_pu(n, 'Store', sns, fix_i, 'e') — i.e. the e_min_pu and
    e_max_pu COLUMNS of n.stores_t, broadcast against e_nom. Writing a time-indexed
    DataFrame into n.stores_t.e_min_pu is therefore the entire mechanism; there is no DSM
    component and no DSM constraint. The intertemporal link is
    define_store_constraints (previous_e - p*eh == e, with standing_loss and e_cyclic),
    and the Link's p_max_pu goes through the same get_bounds_pu path for attr 'p'.
  note: >
    This is the sharpest fact on the card. A "flexible load" in PyPSA is not a component
    and not a formulation — it is a Store whose per-unit energy bounds happen to vary over
    time, plus Links whose per-unit power bounds happen to vary over time. Both bounds are
    read by one generic function that knows nothing about demand. That is why every variant
    here is `assemble` rather than `absent` at the primitive layer, and why the choice of
    construction (which bus, which Store, which two time series) IS the method: the
    optimiser cannot tell a car fleet from a hot water tank from an industrial buffer, so
    the modeller's restriction series is the only thing that makes the answer physical.
    Negative e_min_pu is legal and is what makes building thermal inertia expressible at
    all. What the primitive does NOT give you is a sloped demand curve: the objective is
    linear in dispatch with fixed marginal costs, so price-elastic demand needs either a
    quadratic objective term or the d = D - g substitution into shedding generators. Soft
    anchor: pypsa is a conda dependency, not a submodule, so this claim is pinned to a
    version string.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: bev-dsm-v2g
        role: >
          the flagship construction and the only turnkey one — `working`, ON by default
          (bev_dsm: true, v2g: true), with both restriction series built by their own rule
      - id: residential-heat-dsm
        role: >
          building thermal inertia as a signed store on the heat bus — `working` but OFF by
          default; a capability pypsa-earth has no entry for at all
      - id: industry-t-endogenous
        role: >
          the industrial partial-flexibility surface: must_run as a p_min_pu floor on
          process links — `working`, off by default, brand-new machinery
      - id: demand-elasticity
        role: >
          `absent` — the headline negative. Loads are fixed profiles; no sloped demand
          curve exists, so price-elastic-demand is code addition, not configuration
      - id: tes-constraints
        role: >
          `working` and unconditional in heating runs; couples tank store size to
          (dis)charger power, so thermal flexibility inherits a duration it did not choose
      - id: load-shedding-voll
        role: >
          the only endogenous demand-side surface reachable WITHOUT the sector chain —
          per-carrier shedding costs across every bus carrier, the one-step utility function
      - id: distribution-grid-lv
        role: >
          where the flexible assets actually sit: BEV chargers, V2G, heat pumps and home
          batteries are moved behind the LV bus, so flexibility relieves a reinforcement
          cost as well as generation
      - id: exogenous-transport-shares
        role: >
          gates the whole EV construction — electric_share multiplies p_nom and e_nom, so
          zero electrification means zero flexibility regardless of the bev_* keys
      - id: sector-master-switches
        role: "sector.transport / sector.heating gate add_land_transport and add_heat entirely"
      - id: custom-constraint-hook
        role: >
          the landing point for the two constructions with no surface: the daily
          conservation constraint for spatial shifting, and the shift-window constraint for
          industrial DSM
      - id: carrier-attribute-scaling
        role: >
          the sweep lever for participation-share and cost sensitivities on the BEV
          charger / V2G carriers without editing config per run
      - id: scenario-matrix
        role: "the harness for the flexibility-share sweep every paper in this corpus runs"
    available:
      verdict: assemble
      how: >
        Three of the constructions ship complete and one is turnkey. add_EVs builds the
        entire canonical construction unconditionally when transport is on and
        electric_share > 0 — EV battery Bus, land transport EV Load on it, BEV charger Link
        with p_max_pu from the availability profile, EV battery Store with e_cyclic and
        e_min_pu from the DSM profile, and the V2G reverse Link with p_nom scaled by
        bev_dsm_availability. Both time series are built by rule build_transport_demand
        from mobility data and the sector.bev_* keys, so the restriction parameters are
        L0/L1. Building thermal inertia is a second, DIFFERENT construction that also
        ships: add_heat puts a `{heat_system} heat dsm` Store straight onto the heat bus
        with e_max_pu = +profile and e_min_pu = -profile from build_hourly_heat_demand's
        checkpoint-hour profile, scaled by a per-horizon restriction_value, with the
        decentral water tank's standing loss as the building's thermal decay. Industrial
        partial flexibility is a third: sector.industry_t.must_run sets p_min_pu on every
        endogenised process-heat Link, so 1 - must_run of that load is shiftable. Load
        shedding gives a one-step demand curve per carrier at solve time. What makes the
        verdict `assemble` and not `turnkey` is that no single flip gives you a
        flexibility STUDY: the constructions are per-sector, three of the five are off by
        default, and two of the eight variants have no surface at all.
      missing: >
        Procedure steps 1, 10 and 11 have no handle. Step 10 (spatio-temporal shifting):
        nothing in the repo creates virtual links between locations, no daily
        usage-conservation constraint exists, and no per-site flexibility band exists — a
        grep for virtual link / spatio-temporal / datacenter across scripts/ returns
        nothing. Step 11 (price-elastic demand): the registry rates demand-elasticity
        `absent` and that is correct — add_load_balance_components gives ONE shedding
        generator per bus per carrier at one cost, which is the degenerate one-step curve;
        the multi-segment sloped curve, the quadratic utility form and the d = D - g
        substitution are all unwritten. Industrial load shifting has a must-run floor but
        no declared shift WINDOW and no buffer, so the debt-tracking virtual store with a
        24 h cycling constraint that the corpus uses is not expressible without the custom
        hook. There is also no cross-run flexibility-value post-processing: make_summary
        aggregates capacities, nothing differences a flexible run against a baseline.
      provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/prepare_sector_network.py:add_heat; scripts/solve_network.py:add_load_balance_components"
    levers:
      - key: "sector.bev_dsm"
        effect: >
          Master switch for EV smart charging. When true, adds the EV battery Store with
          e_cyclic=True; when false the BEV charger Link still exists but has no buffer, so
          charging is pinned to the load profile — that is the correct no-flexibility
          baseline, not a broken model.
        default: "true"
        provenance: "config/config.default.yaml:bev_dsm; scripts/prepare_sector_network.py:add_EVs"
      - key: "sector.v2g"
        effect: >
          Adds the reverse discharge Link, EV battery bus back to the (low-voltage)
          electricity bus, at p_nom * bev_dsm_availability with the same availability
          profile. Nested INSIDE the bev_dsm branch here, so v2g: true with bev_dsm: false
          is silently a no-op — the safe ordering.
        default: "true"
        provenance: "config/config.default.yaml:v2g; scripts/prepare_sector_network.py:V2G"
      - key: "sector.bev_dsm_availability"
        effect: >
          The PARTICIPATION share, and the parameter the corpus sweeps (20-100%, 50% by
          convention). Multiplies both the Store's e_nom and the V2G Link's p_nom, so it
          scales the buffer and the export capacity together. Not the same thing as
          plugged-in availability.
        default: "0.5"
        provenance: "config/config.default.yaml:bev_dsm_availability; scripts/prepare_sector_network.py:add_EVs"
      - key: "sector.bev_dsm_restriction_value"
        effect: >
          The state-of-charge floor imposed once per day, as a fraction of e_nom, written
          into the Store's e_min_pu. THE parameter that keeps the fleet a daily resource;
          set to 0 for no restriction and the fleet becomes seasonal storage.
        default: "0.8"
        provenance: "config/config.default.yaml:bev_dsm_restriction_value; scripts/build_transport_demand.py:bev_dsm_profile"
      - key: "sector.bev_dsm_restriction_time"
        effect: >
          The hour of day at which that floor binds (corpus convention 6-7am, before the
          morning peak). One hour per day in the weekly profile; every other hour is 0.
        default: "7"
        provenance: "config/config.default.yaml:bev_dsm_restriction_time; scripts/build_transport_demand.py:bev_dsm_profile"
      - key: "sector.bev_avail_mean"
        effect: >
          Mean plugged-in share, the anchor of the availability p_max_pu on both the BEV
          charger and V2G Links. Scaled linearly against the traffic count so availability
          is highest when traffic is lowest.
        default: "0.8"
        provenance: "config/config.default.yaml:bev_avail_mean; scripts/build_transport_demand.py:bev_availability_profile"
      - key: "sector.bev_avail_max"
        effect: >
          Maximum plugged-in share. With bev_avail_mean it fixes the whole availability
          profile; the script warns and can produce infeasibility if the linear scaling
          goes negative, which is the failure mode when these two are set too far apart.
        default: "0.95"
        provenance: "config/config.default.yaml:bev_avail_max; scripts/build_transport_demand.py:bev_availability_profile"
      - key: "sector.bev_energy"
        effect: >
          Battery energy per car in MWh (0.05 = 50 kWh, the corpus convention; later papers
          use 60-67 kWh). With number_cars and the electric share it sets the Store e_nom.
        default: "0.05"
        provenance: "config/config.default.yaml:bev_energy; scripts/prepare_sector_network.py:add_EVs"
      - key: "sector.bev_charge_rate"
        effect: >
          Charger power per car in MW (0.011 = 11 kW). Sets the BEV charger Link p_nom and,
          via bev_dsm_availability, the V2G p_nom — i.e. the POWER limit on the
          flexibility, which the pitfalls flag as the parameter idealised studies omit.
        default: "0.011"
        provenance: "config/config.default.yaml:bev_charge_rate; scripts/prepare_sector_network.py:add_EVs"
      - key: "sector.bev_charge_efficiency"
        effect: >
          One-way efficiency on both the charger and the V2G Link, so V2G round-trip is
          this value squared (0.81 at default). The only loss term in the EV construction.
        default: "0.9"
        provenance: "config/config.default.yaml:bev_charge_efficiency; scripts/prepare_sector_network.py:add_EVs"
      - key: "sector.residential_heat.dsm.enable"
        effect: >
          Turns on building thermal inertia — the signed Store on residential rural,
          residential urban decentral and urban central heat buses. Off by default, so any
          heat-flexibility question is a config change the user must be told about.
        default: "false"
        provenance: "config/config.default.yaml:residential_heat; scripts/prepare_sector_network.py:heat_dsm_profile"
      - key: "sector.residential_heat.dsm.direction"
        effect: >
          Which side of the comfort band is allowed: `overheat` sets e_max_pu = +profile
          (pre-heating), `undercool` sets e_min_pu = -profile (coasting on stored warmth).
          Listing only one halves the flexibility and makes it asymmetric; both is the
          default list.
        default: "[overheat, undercool]"
        provenance: "config/config.default.yaml:direction; scripts/prepare_sector_network.py:heat_dsm_profile"
      - key: "sector.residential_heat.dsm.restriction_value"
        effect: >
          Per-horizon multiplier on the DSM profile, i.e. the fraction of peak residential
          space-heat demand the building fabric may shift. Ramps 0.06 (2020) to 0.40 (2050),
          so it doubles as an exogenous smart-buildings ROLLOUT pathway.
        default: "{2020: 0.06, 2030: 0.27, 2040: 0.38, 2050: 0.4}"
        provenance: "config/config.default.yaml:restriction_value; scripts/prepare_sector_network.py:heat_dsm_profile"
      - key: "sector.residential_heat.dsm.restriction_time"
        effect: >
          The checkpoint hours at which the fabric store is forced empty (profile = 0),
          which is what caps the shift window. Default [10, 22] gives two 12-hour periods
          (9am-9pm day, 9pm-9am night) per the smartEn/DNV methodology named in the script.
        default: "[10, 22]"
        provenance: "config/config.default.yaml:restriction_time; scripts/build_hourly_heat_demand.py:heat_dsm_profile"
      - key: "sector.industry_t.endogen"
        effect: >
          Turns on endogenous process-heat technology choice, which is the prerequisite for
          the must_run floor to exist at all — without it there are no per-band process
          Links to put a p_min_pu on.
        default: "false"
        provenance: "config/config.default.yaml:endogen; scripts/prepare_sector_network.py:industry_t"
      - key: "sector.industry_t.must_run"
        effect: >
          p_min_pu on every endogenised industrial process Link. 1 - must_run is the
          shiftable fraction, so 0.8 means 20% of industrial process heat may move. A
          must-run floor, NOT a buffer: there is no store and no declared shift window.
        default: "0.8"
        provenance: "config/config.default.yaml:must_run; scripts/prepare_sector_network.py:add_t_industry100_200"
      - key: "sector.min_part_load_electrolysis"
        effect: >
          Minimum part load on the H2 Electrolysis Link — the whole flexible-PtX variant in
          one number. At the shipped 0 the electrolyser is already fully flexible and the
          H2 store does the buffering; the corpus's no-DSM counterfactual raises it to 0.3.
          Live key, but absent from BOTH registries (see GAPS.md).
        default: "0"
        provenance: "config/config.default.yaml:min_part_load_electrolysis; scripts/prepare_sector_network.py:min_part_load_electrolysis"
      - key: "solving.options.load_shedding.enable"
        effect: >
          Adds one shedding Generator per bus per carrier — the one-step demand curve, and
          the only endogenous demand-side surface that does not require the sector chain.
        default: "false"
        provenance: "config/config.default.yaml:load_shedding; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.load_shedding.default_cost"
        effect: >
          The VOLL in EUR/MWh. Swept 100-400 in the corpus when used as a demand-curtailment
          instrument, or set to 2000 as a genuine VOLL; the shipped 100000 is an
          infeasibility-diagnosis value that will never bind economically.
        default: "100000"
        provenance: "config/config.default.yaml:default_cost; scripts/solve_network.py:add_load_balance_components"
      - key: "sector.electricity_distribution_grid"
        effect: >
          Moves BEV chargers, V2G, heat pumps and home batteries behind an LV bus with a
          reinforcement cost, so flexibility earns a distribution-capacity saving (up to
          20% in the corpus) instead of only a generation saving. On by default; turning it
          off silently removes that entire benefit channel.
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: "sector.land_transport_electric_share"
        effect: >
          Per-horizon electrification pathway. Multiplies the charger p_nom, the Store e_nom
          and the Load, so it is the outer gate on EV flexibility magnitude — a 2030 study at
          0.2 has one fifth the flexible fleet of a 2050 study at 1.0.
        default: "{2020: 0, 2030: 0.2, 2040: 0.7, 2050: 1}"
        provenance: "config/config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:add_land_transport"
      - key: "sector.tes"
        effect: >
          Water-tank thermal storage on every heat bus. Not fabric DSM, but in practice the
          dominant heat-flexibility channel and the one the corpus's heat-pump studies mean
          by thermal storage; its duration comes from a cost-table column, not from here.
        default: "true"
        provenance: "config/config.default.yaml:tes; scripts/solve_network.py:add_TES_energy_to_power_ratio_constraints"
      - key: "run.scenarios.enable"
        effect: >
          Fans the flexibility-share sweep out as managed parallel runs, which is how every
          paper in this corpus reports flexibility value (a curve over the share, not a
          point).
        default: "false"
        provenance: "config/config.default.yaml:scenarios; scripts/_helpers.py:get_scenarios"
      - key: "solving.options.custom_extra_functionality"
        effect: >
          The landing point for the two constructions with no surface: the daily
          usage-conservation constraint for spatio-temporal shifting, and the shift-window /
          debt-tracking constraint for industrial DSM.
        default: "'../data/custom_extra_functionality.py' (present, a no-op stub)"
        provenance: "config/config.default.yaml:custom_extra_functionality; scripts/solve_network.py:custom_extra_functionality"
    assembly:
      - step: >
          Establish the baseline first, and establish it as a CONSTRUCTION rather than as
          an absence. Set bev_dsm: false (which leaves the charger Link but removes the
          Store, pinning charging to the load profile) and residential_heat.dsm.enable:
          false. Every flexibility number in this corpus is a difference against such a
          run, so it must be a real solve at the same resolution.
        uses: [bev-dsm-v2g, residential-heat-dsm]
        config: "sector.bev_dsm: false; sector.v2g: false; sector.residential_heat.dsm.enable: false"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_EVs"
      - step: >
          Set the electrification gate before touching any flexibility key. electric_share
          multiplies the charger p_nom, the Store e_nom and the Load, so the size of the
          flexible fleet is decided here, not by the bev_* keys. An interview that skips
          this reports flexibility value for a fleet that does not exist in the study year.
        uses: [exogenous-transport-shares, sector-master-switches]
        config: "sector.transport: true; sector.land_transport_electric_share per planning_horizon"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - step: >
          Turn on the EV construction and set its two restriction series. bev_dsm: true
          plus bev_dsm_restriction_value >= 0.75 and _restriction_time at 6 or 7 gives the
          corpus-standard daily-shifting fleet; bev_avail_mean / bev_avail_max fix the
          plugged-in profile. Then set bev_dsm_availability to the participation share you
          intend to SWEEP, not to a single believed value.
        uses: [bev-dsm-v2g]
        config: "sector.bev_dsm; sector.bev_dsm_availability; sector.bev_dsm_restriction_value; sector.bev_dsm_restriction_time; sector.bev_avail_mean; sector.bev_avail_max"
        code: null
        provenance: "scripts/build_transport_demand.py:bev_dsm_profile; scripts/build_transport_demand.py:bev_availability_profile"
      - step: >
          Decide V2G separately from smart charging and report them separately. v2g: true
          adds the reverse Link at p_nom * bev_dsm_availability. Because the corpus finds
          V2G worth roughly 14x smart charging cumulatively, collapsing the two into one
          "flexibility on" case destroys the most useful result the method produces.
        uses: [bev-dsm-v2g]
        config: "sector.v2g"
        code: null
        provenance: "scripts/prepare_sector_network.py:V2G"
      - step: >
          If heat flexibility is in scope, enable the fabric construction — it is a
          different mechanism and must be switched on explicitly. Set
          residential_heat.dsm.enable: true, keep both directions unless the user has a
          reason to forbid one, set restriction_value for the study horizon (this is the
          smart-buildings rollout share) and restriction_time to bracket the shift window
          the user believes in (default [10, 22] = 12 h; the corpus's constrained case is
          2-3 h pre-peak only).
        uses: [residential-heat-dsm, tes-constraints]
        config: "sector.residential_heat.dsm.{enable,direction,restriction_value,restriction_time}"
        code: null
        provenance: "scripts/prepare_sector_network.py:heat_dsm_profile; scripts/build_hourly_heat_demand.py:heat_dsm_profile"
      - step: >
          Keep the LV bus on. With electricity_distribution_grid: true the flexible assets
          sit behind a reinforcement cost, so the study can report the distribution-capacity
          saving (up to 20% in the corpus) that is often the largest single benefit and is
          invisible without it.
        uses: [distribution-grid-lv]
        config: "sector.electricity_distribution_grid: true"
        code: null
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - step: >
          For industrial shifting, enable industry_t.endogen and lower must_run to the
          shiftable fraction. This gives partial flexibility only — a p_min_pu floor with no
          buffer and no declared window. If the user needs a stated shift window (the
          corpus's 4 h holding / 24 h cycling design), that is a linopy constraint over the
          process Links' p in the custom hook, not a config change.
        uses: [industry-t-endogenous, custom-constraint-hook]
        config: "sector.industry_t.endogen: true; sector.industry_t.must_run"
        code: "solving.options.custom_extra_functionality module, for the window constraint"
        provenance: "scripts/prepare_sector_network.py:add_t_industry100_200; scripts/solve_network.py:custom_extra_functionality"
      - step: >
          For flexible electrolysis / PtX, this is one number: min_part_load_electrolysis at
          0 (shipped) is already fully flexible with the H2 store buffering. The
          no-flexibility counterfactual is 0.3 plus a ramp limit, and there is no ramp-limit
          key on this Link, so the counterfactual is the harder half.
        uses: [custom-constraint-hook]
        config: "sector.min_part_load_electrolysis"
        code: "ramp_limit_up/down on the H2 Electrolysis links, for the no-DSM counterfactual"
        provenance: "scripts/prepare_sector_network.py:min_part_load_electrolysis"
      - step: >
          For a price-elastic demand curve, add N shedding generators per bus with N
          marginal costs rather than writing a QP. add_load_balance_components already
          builds one shedding Generator per bus per carrier from a cost mapping; the
          extension is to call it once per curve segment with a segment-specific p_nom and
          cost, which reproduces the corpus's d = D - g substitution and keeps the problem
          an LP. This is the cheapest honest route to the `absent` capability.
        uses: [load-shedding-voll, demand-elasticity]
        config: "solving.options.load_shedding.{enable,default_cost,carriers}"
        code: "scripts/solve_network.py:add_load_balance_components — generalise to a per-segment loop"
        provenance: "scripts/solve_network.py:add_load_balance_components"
      - step: >
          For spatio-temporal shifting, nothing exists: add a Link between every pair of
          flexible sites carrying the service carrier (not electricity, so it must be its own
          carrier on its own buses, which is the sector-coupled-network-assembly primitive
          reused), then a linopy constraint in the custom hook summing dispatched load over
          each calendar day per site-group to the requested total, plus per-site
          p_max_pu/p_min_pu bands at (1+f) and (1-f). The Links are network assembly; the
          conservation constraint is the new formulation.
        uses: [custom-constraint-hook]
        config: "solving.options.custom_extra_functionality"
        code: "a new add_flexible_sites function in scripts/prepare_sector_network.py plus the daily conservation constraint in the hook module"
        provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/solve_network.py:custom_extra_functionality"
      - step: >
          Sweep the participation share as managed runs and difference the results. There is
          no flexibility-value post-processing in the repo; make_summary aggregates
          capacities across runs and is the cheapest place to hang the baseline-vs-flexible
          difference the corpus reports.
        uses: [scenario-matrix, summary-outputs]
        config: "run.scenarios.enable; run.scenarios.file"
        code: "scripts/make_summary.py"
        provenance: "scripts/_helpers.py:get_scenarios; scripts/make_summary.py:calculate_capacities"
    boundary:
      - variant: ev-smart-charging
        rung: L0
        note: >
          The one genuinely turnkey construction in this card: bev_dsm is true in the
          shipped config and the entire Bus/Load/Link/Store/two-series assembly is built by
          add_EVs whenever transport is on and electric_share > 0. A study that wants the
          default is a plain solve.
      - variant: v2g-bidirectional
        rung: L0
        note: >
          Also shipped on (v2g: true), nested inside the bev_dsm branch so the unsafe
          combination is impossible. Only reason to touch config at all is to sweep
          bev_dsm_availability or to build the no-V2G comparison, which is L1.
      - variant: building-thermal-inertia
        rung: L1
        note: >
          Every surface exists — the signed Store, the checkpoint profile rule, the
          per-horizon restriction_value, the direction list — but enable defaults to false,
          so it needs a specific non-default combination. Changing the SHIFT WINDOW is
          still L1 (restriction_time is a list of hours); changing the fabric's thermal
          decay is L3 because standing_loss is read from the decentral water tank cost row.
      - variant: industrial-load-shifting
        rung: L2
        note: >
          L1 gets you the must_run floor (industry_t.endogen: true plus a lower must_run),
          which is partial flexibility with no window. The corpus's actual construction — a
          buffer with a 24 h cycling constraint and a 4 h holding duration — has no surface;
          it is a linopy constraint over the process Links in the custom hook plus a Store
          on the process bus, i.e. a localised edit in the sanctioned place, not new
          machinery. L2 rather than L5 only because both the hook and the Links exist.
      - variant: spatio-temporal-shifting
        rung: L5
        note: >
          Nothing exists. The virtual-link graph is network assembly (cheap, and the
          multi-port Link primitive is already there), but the daily usage-conservation
          constraint over a set of sites and the per-site (1 +/- f) band are a new
          formulation with no analogue in the repo. The custom hook is the landing point,
          so this is L5-with-a-handle: a constraint to write, not a solver to modify.
      - variant: price-elastic-demand
        rung: L5
        note: >
          The registry says demand-elasticity is `absent` and that is exactly right. The
          cheapest route is not new formulation but a generalisation of
          add_load_balance_components from one shedding generator per bus to N per bus with
          N willingness-to-pay levels, which reproduces the corpus's d = D - g substitution
          and stays an LP. Still L5 because it edits solve-time component creation and adds
          a data structure (the curve) that no config key describes.
      - variant: exogenous-profile-alteration
        rung: L1
        note: >
          A constant percentage reduction is already expressible — sector.
          reduce_space_heat_exogenously_factor for heat, load.scaling_factor for
          electricity. Peak shaving to a threshold is not: it needs the profile edited after
          it is built, which is L3 (a modified resource) unless done as a one-off script.
      - variant: curtailable-load-shedding
        rung: L1
        note: >
          solving.options.load_shedding.enable plus a believable default_cost. Genuinely L1
          rather than L0 because the shipped 100000 EUR/MWh is a diagnostic value that never
          binds; using shedding as an economic instrument means choosing a real VOLL and,
          usually, restricting it per carrier.
      - variant: flexible-electrolysis-and-ptx
        rung: L0
        note: >
          min_part_load_electrolysis ships at 0, so the electrolyser is already fully
          flexible and the H2 store buffers it. The no-flexibility counterfactual is the
          L2 half: raising min part load is L1, but there is no ramp-limit key on that Link,
          so the +/-5%/h comparison needs a small edit where the Link is created.
    where:
      - change: "industrial shift-window / holding-duration constraint over process Links"
        anchor: "solving.options.custom_extra_functionality -> the user module's entry function, over n.model['Link-p'] for the industry_t carriers"
        provenance: "scripts/solve_network.py:custom_extra_functionality; scripts/prepare_sector_network.py:add_t_industry100_200"
      - change: "virtual links between flexible sites (spatio-temporal)"
        anchor: "a new add_* function in scripts/prepare_sector_network.py, called from the same place as add_land_transport"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "daily usage-conservation constraint and per-site (1 +/- f) band"
        anchor: "solving.options.custom_extra_functionality -> the user module, grouping snapshots by calendar day"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
      - change: "multi-segment willingness-to-pay curve (price-elastic demand)"
        anchor: "scripts/solve_network.py::add_load_balance_components — the per-carrier cost mapping generalised to a per-segment list"
        provenance: "scripts/solve_network.py:add_load_balance_components"
      - change: "electrolyser ramp limit for the no-DSM counterfactual"
        anchor: "the H2 Electrolysis n.add('Link', ...) call in prepare_sector_network.py — add ramp_limit_up/ramp_limit_down"
        provenance: "scripts/prepare_sector_network.py:min_part_load_electrolysis"
      - change: "building fabric thermal decay (standing_loss)"
        anchor: "the 'decentral water tank storage' standing_losses row of the processed cost table, read in add_heat"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "flexibility-value differencing across the share sweep"
        anchor: "scripts/make_summary.py (rule make_summary), over the scenario runs"
        provenance: "scripts/make_summary.py:calculate_capacities"
    data_dependencies:
      - input: "mobility traffic-count profiles (kfz.csv, pkw.csv) driving the availability profile"
        required_for: "ev-smart-charging, v2g-bidirectional"
        availability: >
          exists by default — retrieved as the mobility-profiles dataset and consumed by
          rule build_transport_demand. But it is GERMAN highway/car count data applied to
          every node in the model, so the availability SHAPE does not transfer to a country
          with different commuting patterns; replacing it is the L3 work behind a
          region-specific EV flexibility study
      - input: "region-specific charging-window or residence-time data"
        required_for: "ev-smart-charging (constrained variants)"
        availability: >
          absent — the corpus's 4-hour overnight window and 2-hour average residence time
          come from national activity surveys, none of which is shipped. A constrained-window
          study needs a new weekly profile as a resource
      - input: "building-stock thermal capacity per node"
        required_for: building-thermal-inertia
        availability: >
          must be built — the shipped construction sizes e_nom off PEAK residential space-heat
          demand times a per-horizon restriction_value, a proxy rather than a fabric
          measurement, and reuses the decentral water tank's standing loss as the building's
          decay. A physically grounded fabric model is a new data input
      - input: "shiftable industrial capacity and holding duration per subsector and region"
        required_for: industrial-load-shifting
        availability: >
          absent — the corpus's 6-10 GW / 4 h Germany figures are study assumptions, not
          shipped data. industry_t.must_run is a single scalar applied to every endogenised
          subsector, so per-subsector shiftability is a new input
      - input: "flexible-site locations, sizes and flat load profiles (data centres)"
        required_for: spatio-temporal-shifting
        availability: >
          absent — no data-centre or flexible-site layer exists in either model. The defining
          study placed 100 MW flat baseload sites by hand across 37 bidding zones
      - input: "willingness-to-pay / elasticity estimates per consumer class"
        required_for: price-elastic-demand
        availability: >
          absent — the corpus's -5% at 100 EUR/MWh comes from an external empirical study of
          the German market. There is no elasticity data in either repo and no config surface
          to hold it
    cost_profile:
      solves: >
        2 for the minimum credible answer (baseline plus flexible), because the result IS a
        difference. The corpus's real designs are 5-11 for a single-dimension share sweep,
        ~100 for a two-sector rollout grid (EV 0-100% x heat 0-100% at 11 steps each), and
        124 in the most systematic mechanism comparison.
      relative: >
        ~2-10x a single solve for a normal flexibility study; the flexible run itself is
        usually SLOWER than the baseline, because the Store adds an intertemporal coupling
        across all snapshots that the fixed-load version does not have.
      note: >
        Two cost traps specific to this method. First, the flexibility question is inherently
        temporal, so the usual affordability lever works against you: coarsening to 3-hourly
        or segmenting destroys exactly the intra-day structure the flexibility exploits, and
        the corpus's flexibility papers run hourly far more often than its capacity-expansion
        papers do. Prefer fewer clusters or a shorter horizon over coarser time. Second, a
        flexibility study wants the LV bus on and the sector chain complete, which is the
        expensive configuration — so budget the sector-coupled solve first and the sweep
        multiplier second.
    verifies:
      - variant: ev-smart-charging
        check: "(n.stores.carrier == 'EV battery').sum() > 0 and n.stores_t.e_min_pu.filter(like='EV battery').max().max() > 0"
        over: run
        note: >
          Catches the method's signature silent failure. If the Store exists but e_min_pu is
          all zero, bev_dsm_restriction_value was 0 or the DSM profile never reached the
          network, and the "EV fleet" is unconstrained seasonal storage. The run succeeds
          and overstates flexibility.
      - variant: ev-smart-charging
        check: "n.links.loc[n.links.carrier == 'BEV charger', 'p_nom'].sum() > 0 and n.links_t.p_max_pu.filter(like='BEV charger').max().max() <= 1.0"
        over: run
        note: >
          A zero charger p_nom means electric_share was 0 for this horizon, so there is no
          flexible fleet at all and any reported flexibility value is spurious.
      - variant: v2g-bidirectional
        check: "(n.links.carrier == 'V2G').sum() == 0 or (n.stores.carrier == 'EV battery').sum() > 0"
        over: run
        note: >
          V2G links with no EV battery Store would be discharge from nothing. pypsa-eur
          nests the branches so this cannot happen here; the check exists because
          pypsa-earth does not nest them.
      - variant: building-thermal-inertia
        check: "n.stores.carrier.str.contains('heat dsm').sum() == 0 or n.stores_t.e_min_pu.filter(like='heat dsm').min().min() < 0"
        over: run
        note: >
          The fabric store is the only Store in the model that may legitimately go negative.
          If e_min_pu is not negative anywhere, `undercool` was dropped from the direction
          list and the flexibility is one-sided — a halved and asymmetric result that looks
          normal.
      - variant: ev-smart-charging
        check: "abs(nf.loads_t.p_set.filter(like='land transport EV').sum().sum() - nb.loads_t.p_set.filter(like='land transport EV').sum().sum()) < 1e-6 * nb.loads_t.p_set.filter(like='land transport EV').sum().sum()"
        over: ensemble
        note: >
          The baseline and flexible runs must serve the SAME total service demand; only the
          timing may differ. If the totals diverge, the flexibility comparison is measuring a
          demand reduction, which is a different (and much larger) effect.
      - variant: curtailable-load-shedding
        check: "(n.generators.carrier.str.contains('load').sum() > 0) and n.generators.loc[n.generators.carrier.str.contains('load'), 'marginal_cost'].min() > 0"
        over: run
        note: >
          Shedding generators at zero marginal cost would let the model discard demand for
          free, which silently turns a capacity-adequacy answer into an unconstrained one.
      - variant: industrial-load-shifting
        check: "n.links.loc[n.links.carrier.str.contains('industry'), 'p_min_pu'].max() > 0"
        over: run
        note: >
          A p_min_pu of zero on every process Link means must_run never applied — either
          industry_t.endogen was false so no endogenised Links exist, or the shiftable
          fraction is 100%, which is not what a must-run floor is for.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: bev-dsm-v2g
        role: >
          the ONLY endogenous demand-flexibility construction earth has — `working`, on by
          default, and the registry's own note says so ("the only endogenous demand
          flexibility besides storage")
      - id: demand-elasticity
        role: >
          `absent`, same as eur, and the registry note here is even blunter: "loads are
          fixed profiles; only BEV DSM shifts endogenously"
      - id: load-shedding-voll
        role: >
          the only demand-side surface that survives outside the sector chain — one shedding
          Generator per bus, sized from the network rather than unbounded
      - id: end-use-fuel-share-switches
        role: >
          earth's electrification gate: land_transport_electric_share keyed by DEMAND
          SCENARIO and horizon, not by horizon alone. Zero electric share means no EV bus,
          no charger, no store, no V2G — the flexibility vanishes silently
      - id: sector-coupled-workflow
        role: >
          the hard gate. Every flexibility construction earth has lives in
          prepare_sector_network.py, so an electricity-only run has NO endogenous demand
          flexibility whatsoever beyond load shedding
      - id: distribution-grid-lv
        role: >
          `partial` here (eur is `working`): V2G's bus1 is moved to the low-voltage bus so
          flexibility does relieve a reinforcement cost, but the surrounding machinery is
          thinner
      - id: custom-constraint-hook
        role: >
          one extra_functionality entry point, the landing place for every construction
          earth lacks — which is most of them
      - id: carrier-attribute-scaling
        role: "opts-token sweeps on the BEV charger / V2G carriers for the share sensitivity"
      - id: monte-carlo-sampling
        role: >
          earth's one structural advantage for this method: a real multi-solve harness, and a
          flexibility study is inherently a multi-solve study (baseline vs flexible, then a
          share sweep). eur has no equivalent
      - id: scenario-matrix
        role: "combinatorial run expansion for the participation-share sweep"
    available:
      verdict: assemble
      how: >
        One construction, complete, and nothing else. add_land_transport builds the same
        five pieces as eur — an `EV battery` Bus per node carrying the `land transport EV`
        Load, a `BEV charger` Link with p_max_pu from the availability profile, a Store with
        e_cyclic and e_min_pu from the DSM profile, and a `V2G` Link back to the (low
        voltage) bus — with both time series produced by prepare_transport_data from the
        same traffic-count method eur uses. The keys are flat under `sector.*`
        (bev_dsm, v2g, bev_availability, bev_dsm_restriction_{value,time}, bev_avail_{max,
        mean}, bev_energy, bev_charge_efficiency) and all ship on. Water-tank thermal
        storage also exists (sector.tes, charger and discharger Links plus a store, all
        extendable), which gives heat flexibility of the ordinary-storage kind. That is the
        complete inventory.
      missing: >
        Everything except EV smart charging and V2G. Procedure steps 8, 9, 10 and 11 have no
        handle at all: grep finds no residential_heat, no heat dsm, no overheat/undercool, no
        industry_t and no must_run anywhere in scripts/ — building thermal inertia and
        industrial load shifting are not merely off, they do not exist, and neither has a
        registry entry to be absent from (see GAPS.md). There is no
        min_part_load_electrolysis either (only min_part_load_fischer_tropsch), so the
        flexible-electrolysis variant has no lever. No TES energy-to-power or charger-ratio
        constraint exists, so thermal storage duration and charger power are unbounded and
        uncoupled — the opposite failure from eur's. And the sector gate is the big one: all
        of the above lives in prepare_sector_network.py, so an electricity-only earth run has
        exactly one demand-side surface, load shedding. Two defects in the EV construction
        itself are also unfixed here (see boundary and where).
      provenance: "scripts/prepare_sector_network.py:add_land_transport; scripts/prepare_transport_data.py:prepare_transport_data; scripts/solve_network.py:get_load_shedding_capacity"
    levers:
      - key: "sector.bev_dsm"
        effect: >
          Adds the EV battery Store. Note the asymmetry with eur: here the branch is
          `if electric_share > 0 and options["bev_dsm"]`, a SEPARATE top-level branch from
          the V2G one rather than nested inside it, which is what makes the v2g-without-store
          combination reachable.
        default: "true"
        provenance: "config.default.yaml:bev_dsm; scripts/prepare_sector_network.py:bev_dsm"
      - key: "sector.v2g"
        effect: >
          Adds the reverse discharge Link. Two differences from eur that both push the same
          way: p_nom is the FULL charger rating with no participation scaling (eur uses
          p_nom * bev_dsm_availability), and the branch is independent of bev_dsm. So earth's
          default configuration gives twice eur's V2G export capacity for the same fleet, and
          v2g: true with bev_dsm: false builds discharge links with no store behind them.
        default: "true"
        provenance: "config.default.yaml:v2g; scripts/prepare_sector_network.py:V2G"
      - key: "sector.bev_availability"
        effect: >
          The participation share — note the NAME differs from eur's bev_dsm_availability, so
          a bundle written against eur's key silently does nothing here. Scales the Store
          e_nom only; unlike eur it does not scale the V2G p_nom.
        default: "0.5"
        provenance: "config.default.yaml:bev_availability; scripts/prepare_sector_network.py:bev_availability"
      - key: "sector.bev_dsm_restriction_value"
        effect: >
          The daily state-of-charge floor written into the Store's e_min_pu — the parameter
          that keeps the fleet a daily rather than seasonal resource. Ships at 0.75, matching
          the corpus consensus.
        default: "0.75"
        provenance: "config.default.yaml:bev_dsm_restriction_value; scripts/prepare_transport_data.py:bev_dsm_restriction_value"
      - key: "sector.bev_dsm_restriction_time"
        effect: "The hour at which that floor binds. Ships at 7, matching the corpus."
        default: "7"
        provenance: "config.default.yaml:bev_dsm_restriction_time; scripts/prepare_transport_data.py:bev_dsm_restriction_time"
      - key: "sector.bev_avail_mean"
        effect: >
          Mean plugged-in share anchoring the availability p_max_pu on both Links. Read via
          options.get with a hardcoded 0.8 fallback, so a typo in the key name degrades
          silently to the default rather than erroring.
        default: "0.8"
        provenance: "config.default.yaml:bev_avail_mean; scripts/prepare_transport_data.py:bev_avail_mean"
      - key: "sector.bev_avail_max"
        effect: >
          Maximum plugged-in share. Same linear traffic scaling as eur, but WITHOUT eur's
          negative-value warning, so an inconsistent max/mean pair here produces a negative
          availability and an infeasible or nonsensically-bounded charger with no log message.
        default: "0.95"
        provenance: "config.default.yaml:bev_avail_max; scripts/prepare_transport_data.py:bev_avail_max"
      - key: "sector.bev_energy"
        effect: "Battery energy per car in MWh (0.05 = 50 kWh); with car count and share sets the Store e_nom."
        default: "0.05"
        provenance: "config.default.yaml:bev_energy; scripts/prepare_sector_network.py:bev_energy"
      - key: "sector.bev_charge_efficiency"
        effect: >
          One-way efficiency on both Links, so V2G round-trip is 0.81. Note there is no
          bev_charge_rate key in earth's config at all — the charger power per car falls back
          to a hardcoded 0.011 inside options.get, so the POWER limit on EV flexibility is
          not configurable here. That is the parameter the pitfalls identify as the one
          idealised studies omit.
        default: "0.9"
        provenance: "config.default.yaml:bev_charge_efficiency; scripts/prepare_sector_network.py:bev_charge_efficiency"
      - key: "sector.land_transport_electric_share"
        effect: >
          The electrification gate, keyed by demand scenario AND horizon (BU/AP/NZ/DF_2030,
          _2050) rather than by horizon alone. Below 0.42 for the ambitious 2050 case, so an
          earth EV-flexibility study is working with a much smaller flexible fleet than an
          eur one at the same horizon unless the shares are overridden.
        default: "{AP_2030: 0.075, NZ_2030: 0.13, AP_2050: 0.42, NZ_2050: 0.68}"
        provenance: "config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:land_transport_electric_share"
      - key: "sector.dynamic_transport.enable"
        effect: >
          Switches the share lookup from the demand-scenario key to the CO2-target wildcard,
          so the electrification share (and hence the flexible fleet size) becomes a function
          of the emission target rather than a scenario input. Useful for a
          flexibility-under-decarbonisation sweep; off by default.
        default: "false"
        provenance: "config.default.yaml:dynamic_transport; scripts/prepare_sector_network.py:dynamic_transport"
      - key: "solving.options.load_shedding"
        effect: >
          A bare number in EUR/kWh (not the nested mapping eur uses, and the units differ by
          1000 — the script multiplies by 1000 to reach EUR/MWh). Shedding capacity is sized
          from the network with a 1.2 safety margin rather than left unbounded, which is
          better behaviour than eur's for adequacy work.
        default: "100"
        provenance: "config.default.yaml:load_shedding; scripts/solve_network.py:get_load_shedding_capacity"
      - key: "sector.tes"
        effect: >
          Water-tank thermal storage on the heat buses. Present and on, but with NO
          energy-to-power or charger-ratio constraint anywhere in solve_network, so both
          links and the store are fully extendable and uncoupled — thermal duration is a free
          variable rather than a technology property, the mirror image of eur's constrained
          version.
        default: "true"
        provenance: "config.default.yaml:tes; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.electricity_distribution_grid"
        effect: >
          Moves V2G's bus1 to the low-voltage bus so flexibility relieves a distribution
          reinforcement cost. Registry rates the surrounding machinery `partial`.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:electricity_distribution_grid"
      - key: "monte_carlo.options.add_to_snakefile"
        effect: >
          Wires the multi-solve harness into the DAG. A flexibility study is a difference
          between runs, so this is the nearest existing machinery for the share sweep, and it
          has no eur counterpart.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/monte_carlo.py:monte_carlo_sampling_chaospy"
    assembly:
      - step: >
          Establish that the study is in SECTOR mode before anything else. Every endogenous
          flexibility surface earth has is inside prepare_sector_network.py, so an
          electricity-only run cannot answer a demand-flexibility question at all — the
          honest answer to "can my electricity-only earth model do smart charging" is no,
          not "set a key". This is the single most important routing fact in this section.
        uses: [sector-coupled-workflow]
        config: "the sector rule chain (scenario.sopts / demand / planning_horizons), not a boolean"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - step: >
          Set the electrification share for the demand scenario AND horizon you are studying.
          Earth's shares are keyed BU/AP/NZ/DF_<year> and top out at 0.68 (NZ_2050), so the
          flexible fleet is materially smaller than eur's for the same year unless overridden.
          electric_share = 0 removes the EV bus, charger, store and V2G links silently.
        uses: [end-use-fuel-share-switches]
        config: "sector.land_transport_electric_share; optionally sector.dynamic_transport.enable to key it off the CO2 target instead"
        code: null
        provenance: "scripts/prepare_sector_network.py:land_transport_electric_share"
      - step: >
          Solve the no-flexibility baseline with bev_dsm: false AND v2g: false. Both must be
          set here, unlike eur: because the V2G branch is independent of bev_dsm, leaving
          v2g: true in a "flexibility off" run builds discharge Links from an EV bus with no
          store, which is not a clean baseline. This is the most likely way to get a wrong
          flexibility number out of earth.
        uses: [bev-dsm-v2g]
        config: "sector.bev_dsm: false; sector.v2g: false"
        code: null
        provenance: "scripts/prepare_sector_network.py:bev_dsm"
      - step: >
          Turn the construction on and set the two restriction series. The shipped
          bev_dsm_restriction_value 0.75 at hour 7 already matches the corpus, so this is
          usually a no-op — but check bev_avail_max against bev_avail_mean, because earth
          omits eur's negative-availability warning and an inconsistent pair yields a
          silently broken p_max_pu.
        uses: [bev-dsm-v2g]
        config: "sector.bev_dsm; sector.bev_availability; sector.bev_dsm_restriction_value; sector.bev_dsm_restriction_time; sector.bev_avail_mean; sector.bev_avail_max"
        code: null
        provenance: "scripts/prepare_transport_data.py:bev_dsm_restriction_value; scripts/prepare_transport_data.py:bev_avail_mean"
      - step: >
          Correct the V2G p_nom before reporting any V2G result. As shipped, the V2G Link
          gets the full charger rating while the Store gets only bev_availability of the
          fleet energy, so a 50%-participation run exports at 100% of fleet charger power.
          Multiply p_nom by options["bev_availability"] to match eur and the literature. This
          is a two-word edit in a known place, but it is a code edit, not a config change.
        uses: [bev-dsm-v2g]
        config: "sector.v2g"
        code: "scripts/prepare_sector_network.py — the ' V2G' n.madd call: p_nom=p_nom * options['bev_availability']"
        provenance: "scripts/prepare_sector_network.py:V2G"
      - step: >
          If the charger POWER limit matters to the answer (it usually does — see pitfalls),
          add the missing key. There is no bev_charge_rate in earth's config; the per-car
          charger rating is a hardcoded 0.011 fallback inside options.get, so an 11 kW
          assumption cannot be varied from config. Adding the key is L1-shaped work in a
          config file plus nothing else, since the consumer already reads it via options.get.
        uses: [bev-dsm-v2g]
        config: "sector.bev_charge_rate (add it — the consumer already reads it)"
        code: null
        provenance: "scripts/prepare_sector_network.py:bev_charge_rate"
      - step: >
          For heat flexibility, the only available mechanism is the water tank: sector.tes
          with its charger and discharger Links. Be explicit with the user that this is
          ordinary thermal storage, not building fabric inertia, and that earth applies no
          energy-to-power or charger-ratio constraint to it — so the optimiser may build a
          physically implausible tank/charger combination. Constraining it is the
          custom-hook route, mirroring eur's add_TES_* functions.
        uses: [custom-constraint-hook]
        config: "sector.tes: true"
        code: "scripts/solve_network.py:extra_functionality — port eur's TES ratio constraints"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/solve_network.py:extra_functionality"
      - step: >
          For building thermal inertia, industrial shifting, price-elastic demand or
          spatio-temporal shifting: port the construction. None exists here. The cheapest of
          the four is fabric inertia, because it is a single signed Store on an existing heat
          bus plus a checkpoint-hour profile — eur's implementation is ~40 lines in add_heat
          plus a profile function, and earth's heat buses are already there.
        uses: [custom-constraint-hook, demand-elasticity]
        config: null
        code: "scripts/prepare_sector_network.py:add_heat (fabric store) and scripts/solve_network.py:extra_functionality (windows, conservation)"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/solve_network.py:extra_functionality"
      - step: >
          Fan the share sweep out. Earth has the better machinery for this: the monte-carlo
          harness already enumerates samples, rewrites the network per sample and collects
          results, which is structurally what a flexibility-share sweep needs. Point its
          uncertainties at sector.bev_availability rather than writing a loop.
        uses: [monte-carlo-sampling, scenario-matrix]
        config: "monte_carlo.options.add_to_snakefile; monte_carlo.uncertainties"
        code: "scripts/monte_carlo.py"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling_chaospy"
    boundary:
      - variant: ev-smart-charging
        rung: L1
        note: >
          The construction is complete and on by default, so mechanically this is L0 — but it
          is rated L1 because reaching it requires the sector chain, and because earth's
          shipped electric shares (0.075-0.13 at 2030) give a fleet small enough that a
          default run answers the question with a near-zero flexible capacity. A usable study
          needs the shares set deliberately. Add L3 if the region's charging behaviour matters
          (see data_dependencies).
      - variant: v2g-bidirectional
        rung: L2
        note: >
          L1 for the switch, L2 in practice because of two defects that must be fixed before
          the result is reportable: the V2G Link takes the full charger p_nom with no
          participation scaling (eur scales it), and the V2G branch is independent of bev_dsm
          so discharge links can exist with no store. Both are small localised edits at a
          known call site, which is exactly L2 — but they are not optional, because the first
          one inflates V2G capacity by 1/bev_availability, i.e. 2x at the default.
      - variant: building-thermal-inertia
        rung: L5
        note: >
          Does not exist and has no registry entry to be absent from. Porting eur's version
          means a signed Store on each residential heat bus with e_max_pu = +profile /
          e_min_pu = -profile, a checkpoint-hour weekly profile builder, a per-horizon
          restriction value, and a fabric standing loss. New component logic in add_heat, so
          L5 — but L5-with-a-template, since eur's implementation is small and earth's heat
          buses already exist.
      - variant: industrial-load-shifting
        rung: L5
        note: >
          Nothing: no industry_t, no must_run, no shiftable industrial capacity anywhere in
          scripts/. Both the buffer and the shift-window constraint must be written, and
          earth's industrial demand representation is coarser than eur's, so there are fewer
          per-subsector Links to attach a floor to. The hardest of the four ports.
      - variant: spatio-temporal-shifting
        rung: L5
        note: >
          Same as eur — nothing exists in either model. Marginally cheaper here for the wrong
          reason: earth studies are often smaller and electricity-only, so the base solve is
          affordable. But it needs the sector chain for nothing, so it is the one variant
          where earth is not disadvantaged.
      - variant: price-elastic-demand
        rung: L5
        note: >
          `absent` in the registry, correctly. Slightly further away than in eur: earth's
          shedding generator is created inline in solve_network with capacity sized from the
          network and a single cost, not through a per-carrier mapping, so generalising it to
          N willingness-to-pay segments has less structure to build on.
      - variant: exogenous-profile-alteration
        rung: L3
        note: >
          Earth's demand side is data-driven rather than key-driven: the fuel/electrification
          shares come from data/demand/fuel_shares.csv and the load profiles from the demand
          scenario bundles, so a percentage reduction or a peak shave is an edited resource,
          not a config value. Cheap, but L3 rather than L1.
      - variant: curtailable-load-shedding
        rung: L0
        note: >
          The one place earth is ahead: solving.options.load_shedding ships at 100 (EUR/kWh),
          i.e. ON, and the capacity is sized from the network with a 1.2 safety margin rather
          than left unbounded. It is also the only demand-side surface reachable WITHOUT the
          sector chain, which makes it the honest answer for an electricity-only earth study.
      - variant: flexible-electrolysis-and-ptx
        rung: L2
        note: >
          No min_part_load_electrolysis key exists (only min_part_load_fischer_tropsch, which
          ships at 0.9), so the electrolyser is fully flexible by default with no lever to
          make it inflexible. Building the no-DSM counterfactual — a minimum part load and a
          ramp limit on the electrolysis Link — is a localised edit where that Link is
          created.
    where:
      - change: "V2G p_nom participation scaling (defect fix, required before reporting V2G)"
        anchor: "scripts/prepare_sector_network.py — the ' V2G' n.madd call inside add_land_transport"
        provenance: "scripts/prepare_sector_network.py:V2G"
      - change: "nest the V2G branch inside bev_dsm (defect fix)"
        anchor: "scripts/prepare_sector_network.py — the `if electric_share > 0 and options[\"v2g\"]` branch in add_land_transport"
        provenance: "scripts/prepare_sector_network.py:V2G"
      - change: "add the missing sector.bev_charge_rate key"
        anchor: "config.default.yaml sector: block — the consumer already reads it via options.get with a 0.011 fallback"
        provenance: "scripts/prepare_sector_network.py:bev_charge_rate"
      - change: "negative-availability guard on the p_max_pu profile"
        anchor: "scripts/prepare_transport_data.py:prepare_transport_data — after the avail linear scaling, mirroring eur's warning"
        provenance: "scripts/prepare_transport_data.py:bev_avail_max"
      - change: "building fabric inertia store (port of eur's residential heat DSM)"
        anchor: "scripts/prepare_sector_network.py:add_heat — a signed Store on the residential heat buses, plus a checkpoint weekly profile"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "TES energy-to-power and charger-ratio constraints (port of eur's)"
        anchor: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "industrial shift buffer and window constraint"
        anchor: "scripts/solve_network.py:extra_functionality, over the industrial process Links' p"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "multi-segment willingness-to-pay curve"
        anchor: "scripts/solve_network.py:get_load_shedding_capacity and the shedding Generator creation beside it"
        provenance: "scripts/solve_network.py:get_load_shedding_capacity"
      - change: "share sweep as a many-solve fan-out"
        anchor: "scripts/monte_carlo.py + the monte_carlo rule, with uncertainties pointed at sector.bev_availability"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling_chaospy"
    data_dependencies:
      - input: "traffic-count profiles (data/emobility/Pkw__count) driving the availability profile"
        required_for: "ev-smart-charging, v2g-bidirectional"
        availability: >
          exists by default and is the sharpest data-quality problem in this section: it is
          GERMAN car-count data, shipped as a single file and applied to every node of every
          country earth can model. The plugged-in availability SHAPE of a Nigerian or Indian
          fleet is not the German weekly commuting shape, so an earth EV-flexibility result
          inherits German driving behaviour. Replacing it is L3 and should be raised with the
          user before the study, not after
      - input: "vehicle fleet size per node (number cars)"
        required_for: "ev-smart-charging, v2g-bidirectional"
        availability: >
          region-dependent — built by prepare_transport_data from nodal energy totals and
          population layout. Both the Store e_nom and the charger p_nom are proportional to
          it, so flexibility magnitude is only as good as the fleet estimate, and earth's
          energy-total coverage varies sharply by country (check
          cookbooks/pypsa-earth/data_quality before quoting a number)
      - input: "per-car battery energy and charger rating for the region's fleet"
        required_for: "ev-smart-charging, v2g-bidirectional"
        availability: >
          exists as config defaults only (50 kWh, and 11 kW hardcoded), both European
          assumptions. A two-wheeler-dominated or minibus-dominated fleet has neither, and
          the charger rating is not even a key here
      - input: "residential building-stock thermal properties"
        required_for: building-thermal-inertia
        availability: >
          absent — earth has no building-stock layer at all (eur's retrofit cost curves are
          EU-only and the registry lists building-retrofit-endogenous as an eur-only
          capability). Fabric inertia would need both the code and the data
      - input: "shiftable industrial capacity and holding duration"
        required_for: industrial-load-shifting
        availability: >
          absent — no industrial process-heat band structure exists to attach a shiftable
          fraction to
      - input: "willingness-to-pay / elasticity estimates per consumer class"
        required_for: price-elastic-demand
        availability: >
          absent, and harder than in eur: outside the OECD there is little published
          short-run price elasticity for electricity, so this variant should generally be
          declined rather than assumed
      - input: "flexible-site (data centre) locations and load profiles"
        required_for: spatio-temporal-shifting
        availability: "absent — no flexible-site layer in either model"
    cost_profile:
      solves: >
        2 minimum (baseline vs flexible), 5-11 for a share sweep. Earth's monte-carlo harness
        makes the sweep cheap to ORGANISE; the solves themselves are the cost.
      relative: >
        ~2-10x a single solve, with the same caveat as eur that the flexible run is slower
        than the baseline because the Store couples all snapshots.
      note: >
        Earth's usual advantage applies — smaller regions and coarser networks make the base
        solve cheaper than a sector-coupled eur run — but it is partly cancelled here, because
        the flexibility question forces the sector chain on (there is no flexibility in
        electricity-only mode) and forces fine time resolution (coarsening destroys the
        intra-day structure the flexibility exploits). Budget the sector-coupled solve, not
        the electricity-only one. The real constraint on an earth flexibility study is
        usually the mobility data, not the compute.
    verifies:
      - variant: ev-smart-charging
        check: "(n.stores.carrier == 'EV battery storage').sum() > 0 and n.stores_t.e_min_pu.filter(like='EV battery').max().max() > 0"
        over: run
        note: >
          Same signature failure as eur, plus a naming trap: earth's store carrier is
          'EV battery storage' and its bus carrier is 'Li ion', where eur uses 'EV battery'
          for both. A check written against eur's names passes vacuously here.
      - variant: v2g-bidirectional
        check: "(n.links.carrier == 'V2G').sum() == 0 or (n.stores.carrier == 'EV battery storage').sum() > 0"
        over: run
        note: >
          THE earth-specific check. Because the V2G branch is not nested inside bev_dsm, this
          can fail on a real configuration (v2g: true, bev_dsm: false) and the run still
          solves — discharge links from a bus with no store, which the optimiser will happily
          use as a free path if anything else feeds that bus.
      - variant: v2g-bidirectional
        check: "n.links.loc[n.links.carrier == 'V2G', 'p_nom'].sum() <= bev_availability * n.links.loc[n.links.carrier == 'BEV charger', 'p_nom'].sum() + 1e-6"
        over: run
        note: >
          Fails on the shipped code, by design: this is the participation-scaling defect
          asserted as a check, so that any bundle claiming to fix it can be verified. Until
          the fix is applied, V2G export capacity is 1/bev_availability times too large — 2x
          at the default 0.5.
      - variant: curtailable-load-shedding
        check: "(n.generators.carrier.str.contains('load').sum() > 0) and n.generators.loc[n.generators.carrier.str.contains('load'), 'p_nom'].max() < float('inf')"
        over: run
        note: >
          Earth sizes shedding capacity from the network with a 1.2 margin rather than leaving
          it unbounded. An infinite p_nom means the sizing helper was bypassed, which turns an
          adequacy result into an unconstrained one.
      - variant: ev-smart-charging
        check: "abs(nf.loads_t.p_set.filter(like='land transport EV').sum().sum() - nb.loads_t.p_set.filter(like='land transport EV').sum().sum()) < 1e-6 * nb.loads_t.p_set.filter(like='land transport EV').sum().sum()"
        over: ensemble
        note: >
          Baseline and flexible runs must serve identical total transport service; only timing
          may differ. Particularly worth checking here because earth's shares are keyed by
          demand scenario, so it is easy to change the scenario and the flexibility switch in
          the same edit and compare two different demands.
