  - high-resolution-spatial-modelling
pypsa_primitive:
  symbol: "pypsa/clustering/spatial.py:get_clustering_from_busmap"
  pypsa_version: "0.30.3"
  exposed_by: "both — each model calls it from scripts/cluster_network.py"
  reachable_via: >
    Directly for the aggregation half, and this is where the voltage-aware variant becomes
    L5-with-a-handle rather than L5-from-scratch. Two library affordances do most of the
    work. First, `busmap_by_hac(n, n_clusters, feature=, affinity='precomputed',
    linkage=)` accepts a PRECOMPUTED DISTANCE MATRIX — which is exactly the interface
    Stoeckl's block-diagonal, infinite-cross-voltage-distance matrix needs; ward linkage
    forces euclidean, so use complete/average/single with 'precomputed'. Second,
    `busmap_by_stubs(n, matching_attrs=['v_nom'])` already implements "only merge buses
    that agree on these bus attributes", i.e. voltage-respecting stub reduction, as
    library code. Then `get_clustering_from_busmap(n, busmap, bus_strategies=,
    line_strategies=, custom_line_groupers=)` performs the aggregation. The distribution
    half has NO primitive: an LV bus and a costed link are ordinary `n.add` calls, not an
    optimisation feature.
  note: >
    Two hard limits to plan around. (1) `get_clustering_from_busmap` handles Bus, Line,
    Link, one-ports and Carrier and never touches `n.transformers` — transformers are
    silently lost, so a voltage-aware implementation must convert Transformer to Line
    before the call (what the defining paper does) or write transformer aggregation
    itself. (2) `busmap_by_kmeans` has no attribute-matching argument at all, so the
    k-means path cannot be made voltage-aware without a precomputed-distance detour; the
    defining paper's k-medoids is not in pypsa either. Both models also accept a busmap as
    a FILE, so a metric prototyped outside the workflow is re-importable at L1 — but see
    the pitfall: that entry point is downstream of voltage flattening, so the L1 route is
    only usable if the flattening is bypassed too. Soft anchor: pypsa is a conda
    dependency, so this is pinned to a version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: distribution-grid-lv
        role: >
          the distribution half of the method, and `working` — LV bus + costed
          bidirectional link per node, on by DEFAULT, hosting rooftop PV, home batteries,
          EV chargers and decentral heat
      - id: distribution-grid-cost-factor
        role: >
          the knob you would reach for and must not: registry status `dead-key`. Set by
          config and by the `dist<f>` wildcard, read by no script
      - id: distribution-power-flow
        role: >
          registry status `absent` — the fact that bounds every hosting-capacity,
          feeder-limit and local-voltage question on this card
      - id: network-simplification
        role: >
          the voltage-FLATTENING step this method's aggregation variant must defeat:
          maps everything to 380 kV and removes transformers, unconditionally
      - id: spatial-clustering
        role: >
          the substrate (see requires_methods) — and the schema pin that makes a novel
          aggregation algorithm L2 here: `algorithm` is Literal["kmeans","hac"]
      - id: custom-busmap
        role: >
          the L1 route for an externally-computed busmap — but it enters at
          cluster_network, i.e. AFTER flattening, so it cannot carry voltage information
      - id: base-network-source
        role: >
          which voltage levels can exist at all: `osm` (default) | `tyndp` |
          `entsoegridkit`, all European transmission-only datasets
      - id: cost-data-pipeline
        role: >
          where the 'electricity distribution grid' capital cost and lifetime come from,
          and the live override channel now the cost factor is dead
      - id: bev-dsm-v2g
        role: >
          the components re-pointed to the LV bus whose flexibility reduces the
          distribution link's optimal capacity — the mechanism behind Zeyen's -20%
      - id: sector-master-switches
        role: >
          the gate: the LV layer only exists in a sector-coupled run, so an
          electricity-only study is the voronoi-transmission-only variant by construction
    available:
      verdict: assemble
      how: >
        Split by variant, and the split is the whole story here. The DISTRIBUTION half is
        turnkey and already ON: `sector.electricity_distribution_grid: true` is the shipped
        default, and `insert_electricity_distribution_grid` builds the LV bus, the
        extendable bidirectional link at cost, the loss deduction, the rooftop PV
        generator with a population-derived cap, the home battery store with separate
        charger/discharger, and re-points loads, BEV chargers, V2G, heat pumps, resistive
        heaters and micro-CHP to LV. The VOLTAGE-AWARE half is assemble-shading-to-L5:
        every ingredient exists — voltage-keyed `lines.types` down to 63 kV, real
        Transformer components in `base_extended.nc`, a library clustering primitive that
        accepts a precomputed distance matrix, and a custom-busmap file channel — but they
        are wired in the wrong ORDER. `simplify_network` flattens to 380 kV and deletes
        every transformer before `cluster_network` ever sees the network, and no config key
        disables it.
      missing: >
        Procedure steps 3 (the block-diagonal cross-voltage-infinite distance matrix) and
        the last step (any distribution power flow) have no handle. Step 4 has a partial
        handle: the library aggregation exists but drops Transformer. Concretely you would
        be writing: a bypass or conditional around `simplify_network_to_380`, a
        voltage-respecting busmap function, a Transformer-to-Line conversion or a
        transformer aggregation, and — because eur's pydantic config schema pins
        `clustering.cluster_network.algorithm` to Literal["kmeans","hac"] — a schema edit
        to name any new algorithm at all. Also absent: any config route to the rooftop
        potential density (hardcoded `0.1 * 20`), and any sub-220 kV AC asset in the
        retrieved European dataset.
      provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/simplify_network.py:simplify_network_to_380"
    levers:
      - key: "sector.electricity_distribution_grid"
        effect: >
          Master switch for the whole distribution half: adds the LV bus and costed link
          per node and re-points every behind-the-meter component to it. Turning it OFF
          collapses to the voronoi-transmission-only variant and removes rooftop PV and
          home batteries from the model entirely.
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: "sector.transmission_efficiency"
        effect: >
          Holds the distribution loss assumption: the `electricity distribution grid` entry
          carries `efficiency_static: 0.97`, and the carrier must ALSO be listed in the
          sibling `enable:` list for the loss to be applied. Losses are deducted from the
          electricity load series, not modelled on the link (the link keeps efficiency 1).
        default: "electricity distribution grid: {efficiency_static: 0.97}, and the carrier IS in the default enable list"
        provenance: "config/config.default.yaml:efficiency_static; scripts/prepare_sector_network.py:efficiency_static"
      - key: "adjustments.sector"
        effect: >
          The LIVE distribution-cost scaling route, and the shipped example in this very
          block: `factor.Link['electricity distribution grid'].capital_cost`. Use this
          instead of the dead cost-factor key. Also the only lever for a
          "what if distribution reinforcement is twice as expensive" sensitivity.
        default: "factor.Link['electricity distribution grid'].capital_cost: 1.0 (a no-op at 1.0); absolute: false"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
      - key: "sector.electricity_distribution_grid_cost_factor"
        effect: >
          DEAD KEY — listed here deliberately so an interview that reads only `levers`
          still sees the trap. Documented in the pydantic schema, settable from the
          `dist<f>` wildcard token, read by no script. Has no effect on any result.
        default: "1.0"
        provenance: "config/config.default.yaml:electricity_distribution_grid_cost_factor; scripts/_helpers.py:electricity_distribution_grid_cost_factor"
      - key: "sector.electricity_grid_connection"
        effect: >
          The HV-side counterpart: adds grid-connection cost to onshore wind and utility
          solar. Relevant because it is half of the HV/LV cost asymmetry — turning it off
          while leaving the LV link on biases the model toward utility-scale.
        default: "true"
        provenance: "config/config.default.yaml:electricity_grid_connection; scripts/prepare_sector_network.py:add_electricity_grid_connection"
      - key: "electricity.voltages"
        effect: >
          Which AC voltage levels are admitted to the base network at all; `_load_buses`
          keeps buses within min..max of this list (DC buses exempt). Lowering the minimum
          is accepted by the config and by `lines.types` (which reaches 63 kV) but yields
          nothing, because the retrieved European dataset carries no sub-220 kV AC — an L3
          data problem dressed as an L1 lever.
        default: "[220.0, 300.0, 330.0, 380.0, 400.0, 500.0, 750.0]"
        provenance: "config/config.default.yaml:voltages; scripts/base_network.py:_load_buses"
      - key: "lines.types"
        effect: >
          Maps nominal voltage to a standard line type, i.e. to the electrical parameters
          that make a voltage level physically distinguishable. Already carries 63/66/90/
          110/132/150 kV entries that the default `voltages` list never reaches — the
          config is readier for sub-transmission than the data is.
        default: "13 entries, 63.0 -> '94-AL1/15-ST1A 20.0' through 750.0 -> 'Al/St 560/50 4-bundle 750.0'"
        provenance: "config/config.default.yaml:types; scripts/base_network.py:_get_linetype_by_voltage"
      - key: "clustering.simplify_network"
        effect: >
          The only configurable part of the simplification stage: `to_substations`,
          `remove_stubs`, `remove_stubs_across_borders`. Note what is NOT here — the
          380 kV flattening and transformer removal have no switch, so this lever cannot
          preserve voltage levels no matter how it is set.
        default: "{to_substations: false, remove_stubs: true, remove_stubs_across_borders: false}"
        provenance: "config/config.default.yaml:simplify_network; scripts/simplify_network.py:simplify_network_to_380"
      - key: "clustering.mode"
        effect: >
          `busmap` (default) | `administrative` | `custom_busmap` | `custom_busshapes`.
          `custom_busmap` is the L1 import channel for an externally computed partition —
          from `data/busmaps/base_s_{clusters}_{base_network}.csv` — and the only way a
          voltage-aware busmap re-enters the workflow without new rules. Downstream of
          flattening: see pitfalls.
        default: "'busmap'"
        provenance: "config/config.default.yaml:mode; scripts/cluster_network.py:custom_busmap"
      - key: "clustering.cluster_network.algorithm"
        effect: >
          kmeans | hac. Pinned by the pydantic config schema to Literal["kmeans","hac"]
          even though `busmap_for_n_clusters` also implements a `modularity` branch — so
          naming ANY new aggregation algorithm, voltage-aware included, requires editing
          the validation schema as well as the script. This is what makes the
          voltage-aware variant L2 in eur where it is L1 in earth.
        default: "'kmeans'"
        provenance: "scripts/lib/validation/config/clustering.py:Literal[\"kmeans\", \"hac\"]; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "electricity.base_network"
        effect: >
          Which European transmission dataset builds the topology: `osm` (default),
          `tyndp`, or the deprecated `entsoegridkit`. Determines what voltage-level and
          transformer information exists to preserve — all three are transmission-only, so
          none of them makes `low-voltage-ingestion` reachable in eur.
        default: "'osm'"
        provenance: "config/config.default.yaml:base_network; scripts/base_network.py:entsoegridkit"
    assembly:
      - step: >
          Confirm the run is sector-coupled. The LV layer is built inside
          prepare_sector_network and does not exist in an electricity-only run — an
          electricity-only study IS the voronoi-transmission-only variant, whatever the
          config says about distribution. This is the first thing to check when a user
          reports "the distribution cost is missing".
        uses: [sector-master-switches, distribution-grid-lv]
        config: "the sector chain must be active (scenario.planning_horizons + the sector rules)"
        code: null
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - step: >
          Leave `sector.electricity_distribution_grid: true` (the default) and verify the
          loss assumption: `electricity distribution grid` must appear BOTH as a key under
          `sector.transmission_efficiency` with `efficiency_static` AND in that block's
          `enable:` list, or the 3% deduction is silently skipped while the link is still
          built and still costed.
        uses: [distribution-grid-lv]
        config: "sector.electricity_distribution_grid; sector.transmission_efficiency"
        code: null
        provenance: "scripts/prepare_sector_network.py:efficiency_static; config/config.default.yaml:efficiency_static"
      - step: >
          Scale the distribution cost through `adjustments.sector.factor.Link` on the
          'electricity distribution grid' carrier — NOT through
          `electricity_distribution_grid_cost_factor`, which is dead. The adjustment is
          applied by prepare_sector_network at the end of the build, so it lands on the
          link's capital_cost before solve.
        uses: [cost-data-pipeline, carrier-attribute-scaling]
        config: "adjustments.sector.factor.Link['electricity distribution grid'].capital_cost"
        code: null
        provenance: "scripts/prepare_network.py:maybe_adjust_costs_and_potentials; scripts/prepare_sector_network.py:maybe_adjust_costs_and_potentials"
      - step: >
          If the rooftop potential is load-bearing for the answer, edit
          build_clustered_solar_rooftop_potentials.py: the density is the literal
          `0.1 * 20` and there is no config key. This is a two-number L2 edit, but it must
          be a bundle change with a stated assumption, not a silent default.
        uses: [distribution-grid-lv, renewable-potentials-land-eligibility]
        config: null
        code: "scripts/build_clustered_solar_rooftop_potentials.py"
        provenance: "scripts/build_clustered_solar_rooftop_potentials.py:potentials"
      - step: >
          (voltage-aware branch) Bypass the flattening. `simplify_network_to_380` is called
          unconditionally from simplify_network's main block; there is no key. Either add a
          guard around that call and its transformer removal, or — the route the defining
          paper took — take `networks/base_extended.nc` out of the workflow, aggregate it
          externally, and re-enter downstream. Everything after this step depends on which
          of the two you chose.
        uses: [network-simplification]
        config: null
        code: "scripts/simplify_network.py:simplify_network_to_380"
        provenance: "scripts/simplify_network.py:simplify_network_to_380"
      - step: >
          (voltage-aware branch) Convert Transformer components to Line before aggregating,
          because pypsa's `get_clustering_from_busmap` never touches `n.transformers` and
          will drop them without warning. The defining paper's "transformers treated as
          lines in DC power flow" is this necessity, not a modelling preference.
        uses: []
        config: null
        code: "a new helper in scripts/simplify_network.py or the external driver"
        provenance: "pypsa/clustering/spatial.py:get_clustering_from_busmap"
      - step: >
          (voltage-aware branch) Build the voltage-respecting busmap. Two library routes,
          both cheaper than writing a clusterer: build the block-diagonal distance matrix
          (infinite between differing `v_nom`) and call `busmap_by_hac(...,
          affinity='precomputed', linkage='complete')`, or use
          `busmap_by_stubs(matching_attrs=['v_nom'])` where stub reduction is the whole
          need. k-medoids as in the paper is not in pypsa.
        uses: [spatial-clustering]
        config: null
        code: "a new busmap function alongside scripts/cluster_network.py:busmap_for_n_clusters"
        provenance: "pypsa/clustering/spatial.py:busmap_by_hac; pypsa/clustering/spatial.py:busmap_by_stubs"
      - step: >
          (voltage-aware branch) Name the new algorithm in BOTH places or the run will not
          start: the branch in `busmap_for_n_clusters` and the pydantic
          `Literal["kmeans","hac"]`. The existing `modularity` branch in the script is the
          proof that editing only the script is not enough — it is unreachable from config
          for exactly this reason.
        uses: [spatial-clustering, config-schema-validation]
        config: "clustering.cluster_network.algorithm"
        code: "scripts/lib/validation/config/clustering.py + scripts/cluster_network.py:busmap_for_n_clusters"
        provenance: "scripts/lib/validation/config/clustering.py:Literal[\"kmeans\", \"hac\"]; scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          (voltage-aware branch, cheap alternative) Skip the code path entirely for a
          one-off: compute the busmap offline, write it to
          `data/busmaps/base_s_{clusters}_{base_network}.csv` and set
          `clustering.mode: custom_busmap`. L1, no code — but ONLY meaningful if the
          flattening was bypassed, since the busmap otherwise groups buses whose `v_nom`
          is already a constant 380.
        uses: [custom-busmap]
        config: "clustering.mode: custom_busmap"
        code: null
        provenance: "scripts/cluster_network.py:custom_busmap; rules/build_electricity.smk:input_custom_busmap"
    boundary:
      - variant: voronoi-transmission-only
        rung: L0
        note: >
          This is what you get by default in an electricity-only run, and by setting
          `sector.electricity_distribution_grid: false` in a sector-coupled one. Nothing to
          build; the work is telling the user that "no distribution grid" means "an
          assumption that one exists and is unconstrained", per Hoersch's own limitations
          section.
      - variant: hv-lv-single-link
        rung: L0
        note: >
          `sector.electricity_distribution_grid: true` is the shipped DEFAULT and the whole
          variant is one already-flipped key. The only genuine L1 work is the cost
          sensitivity, and there it matters which key you use: `adjustments.sector.factor`
          is L1 and live, `electricity_distribution_grid_cost_factor` is a dead key that
          looks like L1.
      - variant: osm-voltage-aware-topology
        rung: L3
        note: >
          `electricity.base_network: osm` is already the default and the OSM path already
          builds transformers into `base_extended.nc` — so the ingestion side of voltage
          awareness EXISTS here upstream of simplification. What makes it L3 rather than L0
          is that the retrieved European dataset is transmission-only: preserving voltage
          levels below 220 kV requires a different input dataset, not a different key.
          Xiong's >=200 kV threshold is roughly what the shipped pipeline already achieves.
      - variant: voltage-level-preserving-kmedoids
        rung: L5
        note: >
          Four pieces of new code, in dependency order: a bypass of
          `simplify_network_to_380` (no config key exists), a Transformer-to-Line
          conversion (the library aggregation drops transformers), a voltage-respecting
          busmap function, and a pydantic schema edit to name the algorithm. The busmap is
          the cheapest piece — `busmap_by_hac(affinity='precomputed')` or
          `busmap_by_stubs(matching_attrs=['v_nom'])` are library calls — so this is L5 for
          the plumbing, not for the algorithm. The schema pin is what makes it L5 here and
          L1-to-L2 in earth. For a one-off, the `custom_busmap` file channel drops the
          last two pieces but not the first two.
      - variant: low-voltage-ingestion
        rung: L3
        note: >
          Config-accepted, data-blocked. `electricity.voltages` would take a lower minimum
          and `lines.types` already carries 63-150 kV standard types, but no shipped
          European base_network option (osm / tyndp / entsoegridkit) supplies sub-220 kV AC
          assets. This is a new input dataset, i.e. L3, and for most European studies the
          honest answer is to use pypsa-earth for this variant instead.
      - variant: distribution-power-flow
        rung: L5
        note: >
          Registry `absent`, and absent at the primitive layer too — pypsa has no
          distribution power flow, hosting-capacity routine or LinDistFlow. This is not a
          harness but a new model class: a feeder-level network, its data, and a
          formulation. Refuse it and hand the user to a distribution tool; the LV cost
          proxy is not a weak version of this, it is a different quantity.
    where:
      - change: "bypass the unconditional 380 kV flattening and transformer removal"
        anchor: "scripts/simplify_network.py::simplify_network_to_380, called from the script's main block"
        provenance: "scripts/simplify_network.py:simplify_network_to_380"
      - change: "add a voltage-respecting busmap algorithm"
        anchor: "scripts/cluster_network.py::busmap_for_n_clusters (the algorithm if/elif chain, where `modularity` already sits)"
        provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
      - change: "admit the new algorithm name through config validation"
        anchor: "scripts/lib/validation/config/clustering.py — the `algorithm` Field's Literal"
        provenance: "scripts/lib/validation/config/clustering.py:algorithm"
      - change: "import an externally computed busmap without code (L1 alternative)"
        anchor: "clustering.mode: custom_busmap -> data/busmaps/base_s_{clusters}_{base_network}.csv"
        provenance: "rules/build_electricity.smk:input_custom_busmap; scripts/cluster_network.py:custom_busmap"
      - change: "make the rooftop PV potential density an assumption you control"
        anchor: "scripts/build_clustered_solar_rooftop_potentials.py — the `potentials` expression"
        provenance: "scripts/build_clustered_solar_rooftop_potentials.py:potentials"
      - change: "scale distribution grid cost (the LIVE route)"
        anchor: "adjustments.sector.factor.Link['electricity distribution grid'].capital_cost -> maybe_adjust_costs_and_potentials"
        provenance: "scripts/prepare_sector_network.py:maybe_adjust_costs_and_potentials"
      - change: "inspect / assert the built LV layer"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (carriers 'low voltage', 'electricity distribution grid', 'home battery')"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
    data_dependencies:
      - input: "sub-220 kV AC lines and substations for the study region"
        required_for: "low-voltage-ingestion"
        availability: >
          absent — no shipped base_network option provides them for Europe. Would require
          a national TSO/DSO dataset or a lower-threshold OSM extraction, neither of which
          the workflow retrieves. Flag before promising; do not download.
      - input: "voltage-resolved base topology with Transformer components"
        required_for: "osm-voltage-aware-topology, voltage-level-preserving-kmedoids"
        availability: >
          exists by default in `networks/base_extended.nc` (the OSM path builds
          transformers and multi-voltage buses) — but is destroyed by simplify_network
          before clustering, so the dependency is on intercepting that file, not on
          acquiring data
      - input: "population layout raster + per-class regions for rooftop potential"
        required_for: "hv-lv-single-link"
        availability: >
          exists by default — built by build_clustered_solar_rooftop_potentials from
          pop_layout_total.nc and the solar class regions; the kW/m2 and m2/person
          assumptions inside it are hardcoded, not data
      - input: "'electricity distribution grid' capital cost and lifetime in the cost table"
        required_for: "hv-lv-single-link"
        availability: >
          exists by default via the technology-data cost pipeline; it is a single European
          average per-MW figure, so any country-specific distribution cost claim is an
          override you must state
    cost_profile:
      solves: >
        1 — neither variant adds a solve. The distribution half adds, per node, 2 buses
        (low voltage, home battery), 1 extendable link, 1 extendable rooftop generator and
        1 store with 2 links: roughly 5-7 extra components and ~4 extra decision variables
        per node per snapshot-independent dimension.
      relative: >
        The LV layer is a few percent on LP size at typical node counts — small, and its
        cost is dominated by the sector chain it presupposes. The voltage-aware variant is
        the opposite: preserving voltage levels means MORE buses at the same nominal
        cluster count k (one cluster per level per region, plus surviving transformers as
        branches), so a voltage-aware k=500 network is materially larger than a
        voltage-unaware k=500 one. Budget on bus and branch counts after aggregation, not
        on k.
      note: >
        Two practical consequences. First, the LV layer's cost is not compute but
        DIAGNOSTIC: extra carriers make cost breakdowns and marginal-price series harder to
        read, and LV bus prices differ from HV bus prices by the link's dual — a common
        source of confusion when a user asks "what is the electricity price at this node".
        Second, for the voltage-aware variant do not compare against a voltage-unaware run
        at the same k; compare at matched bus count, or the comparison confounds voltage
        awareness with resolution.
    verifies:
      - variant: hv-lv-single-link
        check: "(n.buses.carrier == 'low voltage').sum() == (n.buses.carrier == 'AC').sum()"
        over: run
        note: >
          One LV bus per AC bus is the structural promise of the variant. A mismatch means
          the LV insertion ran on a different bus set than you think — usually because the
          run was electricity-only, or because carriers were renamed upstream. The run
          still succeeds and still reports a distribution cost.
      - variant: hv-lv-single-link
        check: "n.links.query(\"carrier == 'electricity distribution grid'\").p_nom_extendable.all() and (n.links.query(\"carrier == 'electricity distribution grid'\").p_min_pu == -1).all()"
        over: run
        note: >
          The link must be BOTH extendable (or its capital cost is never paid and the
          'distribution reinforcement' result is meaningless) and bidirectional (or rooftop
          PV cannot export and the LV layer becomes a one-way sink). Either failing gives a
          plausible-looking run with a silently wrong distribution answer.
      - variant: hv-lv-single-link
        check: "set(n.generators.query(\"carrier == 'solar rooftop'\").bus).issubset(set(n.buses.query(\"carrier == 'low voltage'\").index))"
        over: run
        note: >
          Rooftop PV on an HV bus means the HV/LV cost-and-loss asymmetry — the mechanism
          behind Rahdan's rooftop-versus-utility result — is absent, so any comparison of
          rooftop against utility PV is invalid even though the model solves.
      - variant: voltage-level-preserving-kmedoids
        check: "n.buses.groupby(busmap).v_nom.nunique().max() == 1"
        over: run
        note: >
          The defining property: no cluster spans two voltage levels. A value above 1 means
          the block-diagonal distance matrix leaked (a common cause: v_nom NaN on some
          buses, which compares unequal to everything and merges anyway), and the run is a
          voltage-unaware aggregation wearing the label.
      - variant: voltage-level-preserving-kmedoids
        check: "len(n.transformers) > 0"
        over: run
        note: >
          Zero transformers after aggregation is the silent failure this variant exists to
          prevent, and it is the DEFAULT behaviour of both the workflow (simplify_network
          removes them) and the library (get_clustering_from_busmap ignores them). If this
          fails, the expansion-planning bias the method was adopted to remove is still
          fully present.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: distribution-grid-lv
        role: >
          the distribution half, registry status `partial` — LV bus + costed link + rooftop
          PV + home battery all exist and default on, but with fewer components re-pointed
          and no cost-factor surface
      - id: distribution-power-flow
        role: "registry status `absent`, same as eur — the same hard bound on the question"
      - id: spatial-clustering
        role: >
          the substrate (see requires_methods), and the reason the voltage-aware variant is
          cheaper here: `cluster_options.cluster_network.algorithm` is a plain config
          string with no schema Literal to fight
      - id: custom-busmap
        role: >
          the L1 import channel for an externally computed partition, via
          `enable.custom_busmap` and a wildcard-named csv
      - id: gadm-admin-clustering
        role: >
          the alternative partition source, and the thing NOT to combine with a
          voltage-aware busmap — it overrides the clusters wildcard entirely
      - id: sector-coupled-workflow
        role: >
          the gate: `add_electricity_distribution_grid` runs inside
          prepare_sector_network, so the LV layer needs the sector chain
      - id: renewable-potentials-land-eligibility
        role: >
          feeds the rooftop potential — and in earth there are TWO routes, population-based
          and building-footprint-based, where eur has only the first
      - id: bev-dsm-v2g
        role: >
          re-pointed to the LV bus, so smart charging shows up as reduced distribution link
          capacity here too
      - id: hvdc-as-lines
        role: >
          earth-specific representation switch on the same base_network stage; relevant
          because it changes what survives the base-voltage flattening
    available:
      verdict: assemble
      how: >
        The distribution half is turnkey and defaults on, as in eur:
        `sector.electricity_distribution_grid: true` triggers
        `add_electricity_distribution_grid`, which adds the LV bus, the extendable
        bidirectional costed link, the static loss deduction, rooftop PV and the home
        battery with charger/discharger links, and re-points AC loads, industry/rail/
        agriculture/services electricity, BEV chargers, V2G, heat pumps, resistive heaters
        and micro-CHP. Earth then goes FURTHER than eur in two ways that matter: rooftop
        potential is a real config surface (`sector.solar_rooftop.{enable,kW_per_m2,
        m2_per_person}`) with an optional building-footprint route
        (`use_building_size: true` -> `cluster_global_buildings.py`, with a size-dependent
        `install_ratio` curve and a `tolerance` for assigning buildings to bus shapes),
        and the OSM ingestion pipeline can admit voltage levels BELOW transmission —
        `clean_osm_data_options.threshold_voltage: 51000` by default, 35000 in the tutorial
        config, 33000 in the shipped Ghana scenario, with `electricity.voltages` starting
        at 132 kV against eur's 220 kV. That combination is the one place in either model
        where the sub-transmission grid can be real network rather than a priced link.
      missing: >
        Procedure step 3 (the cross-voltage-infinite distance matrix) and the final step
        (any distribution power flow) have no handle, as in eur. Step 4's handle again
        drops Transformer. Earth-specific gaps: no
        `electricity_distribution_grid_cost_factor` key at all, so the ONLY distribution
        cost lever is editing the cost csv or a custom override channel; no `enable:` gate
        on `transmission_efficiency`, so the loss deduction is unconditional once the key
        exists; and `base_network.min_voltage_rebase_voltage` is present in the config,
        the docs snippet and three scenario files but read by NO script — a dead key that
        looks exactly like the low-voltage-ingestion lever a user would reach for.
      provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid; scripts/simplify_network.py:simplify_network_to_base_voltage"
    levers:
      - key: "sector.electricity_distribution_grid"
        effect: >
          Master switch: adds the LV bus and costed bidirectional link per node and
          re-points AC loads, industry/rail/agriculture/services electricity, BEV chargers,
          V2G, heat pumps, resistive heaters and micro-CHP to it. Also the precondition for
          `solar_rooftop` and `home_battery`, both of which are built inside the same
          function and silently do nothing if this is false.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: "sector.solar_rooftop"
        effect: >
          The rooftop PV block eur does not have: `enable` toggles the generator,
          `kW_per_m2` and `m2_per_person` set the population-proxy potential (the two
          numbers eur hardcodes as `0.1 * 20`), and `use_building_size: true` switches to a
          building-footprint potential built by cluster_global_buildings, where
          `install_ratio` is a footprint-size -> suitable-fraction curve and `tolerance` is
          the max km for assigning a building to a bus shape. Accepts a bare bool for
          backwards compatibility.
        default: "{enable: true, kW_per_m2: 0.1, m2_per_person: 20, use_building_size: false, install_ratio: {0: 0, 10: 0.3, 100: 0.36, 200: 0.41, 450: 0.49, 2300: 0.66}, tolerance: 100}"
        provenance: "config.default.yaml:solar_rooftop; scripts/prepare_sector_network.py:use_building_size"
      - key: "sector.home_battery"
        effect: >
          Adds the home battery bus, cyclic extendable store and separate charger/
          discharger links on the LV bus. In eur this is unconditional inside the LV
          insertion; here it is a separate key, so a study can have an LV layer WITHOUT
          behind-the-meter storage — useful for isolating what the home battery does.
        default: "true"
        provenance: "config.default.yaml:home_battery; scripts/prepare_sector_network.py:home battery charger"
      - key: "sector.transmission_efficiency"
        effect: >
          Holds `electricity distribution grid: {efficiency_static: 0.97}`, deducted from
          the AC load series. Unlike eur there is NO sibling `enable:` list, so the
          deduction applies whenever the key is present — simpler, and one fewer silent
          failure.
        default: "electricity distribution grid: {efficiency_static: 0.97}"
        provenance: "config.default.yaml:efficiency_static; scripts/prepare_sector_network.py:efficiency_static"
      - key: "sector.enable_electricity_connection_cost"
        effect: >
          The HV-side counterpart to the LV link: adds grid-connection cost to solar and
          onwind capital costs. Note the default differs from eur, where the equivalent
          `electricity_grid_connection` is true — so earth ships a WEAKER HV-side cost and
          therefore a smaller HV/LV asymmetry out of the box.
        default: "false"
        provenance: "config.default.yaml:enable_electricity_connection_cost; scripts/prepare_sector_network.py:add_electricity_grid_connection"
      - key: "electricity.voltages"
        effect: >
          Which AC voltage levels the base network admits, and earth's real advantage: the
          list starts at 132 kV where eur's starts at 220 kV, and `lines.ac_types` supplies
          a 132 kV standard type to match. This is what lets a sub-transmission level be
          network rather than a synthetic link.
        default: "[132.0, 220.0, 300.0, 380.0, 500.0, 750.0]"
        provenance: "config.default.yaml:voltages; scripts/base_network.py:_get_linetype_by_voltage"
      - key: "clean_osm_data_options.threshold_voltage"
        effect: >
          The ingestion floor, in VOLTS: OSM lines, cables, buses and generators below it
          are dropped during cleaning. 51000 by default, 35000 in the tutorial config and
          33000 in the shipped Ghana scenario — i.e. earth routinely ingests
          sub-transmission where eur's European dataset has none. Bounded by OSM coverage
          per country, not by code.
        default: "51000"
        provenance: "config.default.yaml:threshold_voltage; scripts/clean_osm_data.py:filter_voltage"
      - key: "base_network.min_voltage_substation_offshore"
        effect: >
          The other voltage floor, applied when marking offshore substations in the base
          network build. Live (read by base_network.py) and worth setting deliberately in
          coastal studies, but it governs offshore substation eligibility, not the general
          ingestion threshold.
        default: "51000"
        provenance: "config.default.yaml:min_voltage_substation_offshore; scripts/base_network.py:min_voltage_substation_offshore"
      - key: "base_network.min_voltage_rebase_voltage"
        effect: >
          DEAD KEY — listed deliberately, because its name and its comment ("minimum
          voltage in base network") make it look like THE low-voltage-ingestion lever. It
          appears in config.default.yaml, config.tutorial.yaml, the Ghana scenario config
          and a docs snippet, and is read by no script. Use
          `clean_osm_data_options.threshold_voltage` and `electricity.voltages` instead.
        default: "51000"
        provenance: "config.default.yaml:min_voltage_rebase_voltage; doc/configtables/snippets/base_network.yaml:min_voltage_rebase_voltage"
      - key: "electricity.base_voltage"
        effect: >
          The single voltage every bus and line is mapped onto by
          `simplify_network_to_base_voltage`, which then deletes all transformers. Earth
          makes the TARGET configurable where eur hardcodes 380 — but the step itself is
          still unconditional, so this cannot preserve voltage levels either. Must be a key
          of `lines.ac_types` or the script raises on the linetype lookup.
        default: "380.0"
        provenance: "config.default.yaml:base_voltage; scripts/simplify_network.py:simplify_network_to_base_voltage"
      - key: "cluster_options.cluster_network.algorithm"
        effect: >
          kmeans | hac, read as a plain string with no pydantic Literal guarding it — so
          adding a voltage-aware branch to `busmap_for_n_clusters` is reachable from config
          immediately. This single difference is why the voltage-aware variant is one rung
          cheaper in earth than in eur.
        default: "'kmeans'"
        provenance: "config.default.yaml:cluster_network; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "enable.custom_busmap"
        effect: >
          L1 import channel for an externally computed partition, from
          `data/custom_busmap_elec_s{simpl}_{clusters}.csv`. Same caveat as eur: it enters
          at cluster_network, downstream of the base-voltage flattening.
        default: "false"
        provenance: "config.default.yaml:custom_busmap; scripts/cluster_network.py:custom_busmap"
      - key: "cluster_options.simplify_network"
        effect: >
          The configurable part of simplification (`to_substations`, `remove_stubs`,
          `remove_stubs_across_borders`, plus earth-specific isolated-network thresholds).
          As in eur, the voltage flattening and transformer removal are NOT among them.
        default: "{to_substations: false, algorithm: kmeans, feature: 'solar+onwind-time', remove_stubs: true, remove_stubs_across_borders: false, p_threshold_drop_isolated: 20, p_threshold_merge_isolated: 300}"
        provenance: "config.default.yaml:simplify_network; scripts/simplify_network.py:simplify_network_to_base_voltage"
    assembly:
      - step: >
          Confirm the sector chain is active — `add_electricity_distribution_grid` is called
          from prepare_sector_network's build, so an electricity-only earth run has no LV
          layer, no rooftop PV and no home battery regardless of the sector config values.
        uses: [sector-coupled-workflow, distribution-grid-lv]
        config: "the sector rules + sector.* tree"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - step: >
          Leave `sector.electricity_distribution_grid: true` and decide the rooftop
          potential route explicitly. Population proxy (`use_building_size: false`) needs
          only pop_layout; the building-footprint route needs
          `data/global_buildings/{country}_global_buildings_raw.parquet` per country and
          runs `cluster_global_buildings` per country — check that data exists for the
          study region BEFORE promising it, since the rule is branch()-gated and will
          otherwise silently produce no layout.
        uses: [distribution-grid-lv, renewable-potentials-land-eligibility]
        config: "sector.solar_rooftop.{enable,use_building_size,kW_per_m2,m2_per_person,install_ratio,tolerance}"
        code: null
        provenance: "scripts/cluster_global_buildings.py:calculate_solar_rooftop_area; scripts/prepare_sector_network.py:use_building_size"
      - step: >
          For a distribution-cost sensitivity there is no factor key here. Override the
          'electricity distribution grid' capital cost through the custom cost/data
          override channel, or edit the cost csv as a tracked data change in the bundle.
          Do not look for a `dist` wildcard token — earth has none.
        uses: [custom-data-overrides, technology-cost-year]
        config: "the custom cost override channel"
        code: null
        provenance: "scripts/prepare_sector_network.py:electricity distribution grid"
      - step: >
          (low-voltage-ingestion) Lower BOTH floors together and check they agree:
          `clean_osm_data_options.threshold_voltage` (volts, the OSM cleaning filter) and
          `electricity.voltages` (kV, the base-network admission list), and add a matching
          `lines.ac_types` entry for any new level or `_get_linetypes_config` raises on the
          symmetric-difference check. Ignore `min_voltage_rebase_voltage` — it is dead.
          The shipped Ghana scenario at 33000 V is the worked example.
        uses: [data-retrieval-bundles, spatial-clustering]
        config: "clean_osm_data_options.threshold_voltage; electricity.voltages; lines.ac_types"
        code: null
        provenance: "scripts/clean_osm_data.py:filter_voltage; scripts/base_network.py:_get_linetypes_config"
      - step: >
          (low-voltage-ingestion) Verify OSM coverage at the new threshold for the actual
          countries before reporting anything. Lower voltages are exactly where
          crowd-sourced coverage degrades, and the failure mode is not an error but a
          sparser network that still solves. Cross-check the per-country grade in
          cookbooks/pypsa-earth/data_quality before committing to a sub-transmission claim.
        uses: [data-retrieval-bundles]
        config: null
        code: null
        provenance: "scripts/clean_osm_data.py:filter_voltage"
      - step: >
          (voltage-aware branch) Bypass or guard `simplify_network_to_base_voltage`, which
          is called unconditionally from simplify_network's main block and removes all
          transformers. `electricity.base_voltage` changes the target, never the fact.
        uses: [spatial-clustering]
        config: null
        code: "scripts/simplify_network.py:simplify_network_to_base_voltage"
        provenance: "scripts/simplify_network.py:simplify_network_to_base_voltage"
      - step: >
          (voltage-aware branch) Convert Transformer to Line before aggregating (the
          library primitive drops transformers), then add a voltage-respecting branch to
          `busmap_for_n_clusters` using `busmap_by_hac(affinity='precomputed')` on a
          block-diagonal distance matrix, or `busmap_by_stubs(matching_attrs=['v_nom'])`.
          Unlike eur, NO config-schema edit is needed — the algorithm string is
          unvalidated, so the new branch is reachable as soon as it exists.
        uses: [spatial-clustering]
        config: "cluster_options.cluster_network.algorithm"
        code: "scripts/cluster_network.py:busmap_for_n_clusters"
        provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          Do NOT combine a voltage-aware busmap with `cluster_options.alternative_clustering:
          true`. GADM clustering replaces the busmap wholesale and ignores the clusters
          wildcard, so the voltage-aware partition is computed and then discarded while the
          run succeeds — see the spatial-clustering card's pitfall on this.
        uses: [gadm-admin-clustering, custom-busmap]
        config: "cluster_options.alternative_clustering: false"
        code: null
        provenance: "scripts/cluster_network.py:busmap_for_gadm_clusters"
    boundary:
      - variant: voronoi-transmission-only
        rung: L0
        note: >
          Default in an electricity-only run, or `sector.electricity_distribution_grid:
          false`. Same caveat as eur: absence of a distribution grid is an assumption of an
          unconstrained one.
      - variant: hv-lv-single-link
        rung: L0
        note: >
          Shipped default and one already-flipped key, as in eur, with two earth-specific
          notes: `home_battery` is a separate key here (so the LV layer can exist without
          behind-the-meter storage), and there is no cost-factor key at all, so a cost
          sensitivity is a data-override (L3-ish) rather than an L1 lever.
      - variant: osm-voltage-aware-topology
        rung: L1
        note: >
          Cheapest of any variant on either model. Earth's OSM pipeline already cleans per
          voltage, keeps voltage on buses and lines, builds real Transformer components
          from `_load_transformers_from_osm`, and its default `voltages` list reaches
          132 kV — so voltage-resolved ingestion is a matter of setting the two thresholds,
          not of new code. Purely L1 as long as the target voltage level is inside OSM
          coverage for the country.
      - variant: low-voltage-ingestion
        rung: L1
        note: >
          The genuine earth advantage over eur, and the reason this variant exists.
          `clean_osm_data_options.threshold_voltage` down to 33000 V is a shipped scenario
          (config.GH.yaml), 35000 V is the tutorial default, and `electricity.voltages`
          plus `lines.ac_types` accept the matching level. L1 rather than L3 because the
          data source (OSM) is the same one already retrieved — the risk moves from
          "does the dataset exist" to "is coverage good enough at this voltage in this
          country", which is a data_quality lookup, not a build. Beware
          `min_voltage_rebase_voltage`, which is dead and looks like this lever.
      - variant: voltage-level-preserving-kmedoids
        rung: L5
        note: >
          Still L5 — the flattening bypass and the Transformer-to-Line conversion are new
          code either way — but materially cheaper than in eur: no pydantic Literal to
          amend, so the algorithm branch is reachable from config the moment it is written,
          and the two library busmap routes (`affinity='precomputed'`,
          `matching_attrs=['v_nom']`) are the same. Combined with low-voltage-ingestion
          this is also the only place either model can do voltage-aware aggregation over
          MORE than two voltage levels, which is where the method's value should be
          largest.
      - variant: distribution-power-flow
        rung: L5
        note: >
          Registry `absent`, and absent at the primitive layer. Same refusal as eur, with a
          sharper edge: earth's typical users ask distribution questions more often
          (electrification, mini-grids, access), and the LV cost proxy is the wrong tool
          for all of them. Route to `geospatial-access-electrification` (also `absent`) for
          access questions and to a distribution tool for hosting capacity.
    where:
      - change: "bypass the unconditional base-voltage flattening and transformer removal"
        anchor: "scripts/simplify_network.py::simplify_network_to_base_voltage, called from the script's main block"
        provenance: "scripts/simplify_network.py:simplify_network_to_base_voltage"
      - change: "add a voltage-respecting busmap algorithm (no schema edit needed here)"
        anchor: "scripts/cluster_network.py::busmap_for_n_clusters"
        provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
      - change: "lower the OSM ingestion voltage floor"
        anchor: "clean_osm_data_options.threshold_voltage -> scripts/clean_osm_data.py::filter_voltage"
        provenance: "scripts/clean_osm_data.py:filter_voltage"
      - change: "admit a new voltage level to the base network"
        anchor: "electricity.voltages + lines.ac_types -> scripts/base_network.py::_get_linetypes_config"
        provenance: "scripts/base_network.py:_get_linetypes_config"
      - change: "switch rooftop potential from population proxy to building footprints"
        anchor: "sector.solar_rooftop.use_building_size -> rule cluster_global_buildings"
        provenance: "scripts/cluster_global_buildings.py:calculate_solar_rooftop_area"
      - change: "inspect / assert the built LV layer"
        anchor: "scripts/prepare_sector_network.py::add_electricity_distribution_grid (carriers 'low voltage', 'electricity distribution grid', 'home battery')"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
    data_dependencies:
      - input: "OSM lines/cables/substations below the transmission threshold for the study countries"
        required_for: "low-voltage-ingestion, osm-voltage-aware-topology"
        availability: >
          region-dependent, and this is the whole risk of the variant — the retrieval
          pipeline already fetches OSM, so no new source is needed, but sub-transmission
          coverage varies sharply by country. Consult
          cookbooks/pypsa-earth/data_quality for the per-country grade before promising a
          sub-transmission result; a sparse network at 33 kV solves and misleads.
      - input: "data/global_buildings/{country}_global_buildings_raw.parquet"
        required_for: "hv-lv-single-link with use_building_size: true"
        availability: >
          must be built/fetched per country — the cluster_global_buildings rule is
          branch()-gated on `solar_rooftop.enable and use_building_size`, so a missing
          parquet yields no layout rather than an error. Falls back to the population proxy
          if the flag is left false.
      - input: "'electricity distribution grid' capital cost and lifetime in the cost table"
        required_for: "hv-lv-single-link"
        availability: >
          exists by default via technology-data, but it is a European figure applied
          globally. For any non-European study the distribution cost is an assumption to
          state explicitly — and with no cost-factor key here, changing it is a data
          override, which is precisely why this shows up as a data dependency rather than a
          lever.
    cost_profile:
      solves: >
        1 — same as eur; neither variant adds a solve. Component count per node is slightly
        lower than eur's because fewer carriers are re-pointed (no industrial heat pump
        split, and `home_battery` can be switched off independently).
      relative: >
        The LV layer is negligible on LP size. The variant with real cost here is
        low-voltage-ingestion: dropping the ingestion floor from 220 kV to 33-51 kV
        multiplies the raw bus and line count before any clustering, which lands on
        clean_osm_data, base_network and simplify_network runtime and memory rather than on
        the solve. Budget the BUILD, not the solve, and expect the network-build stages to
        dominate a low-voltage study.
      note: >
        Earth's usual advantage applies — smaller regions and often electricity-only base
        cases make this the cheaper model to prototype a voltage-aware aggregation in.
        Against that, the LV-ingestion variant is the one place in this card where compute
        is a real constraint, and the mitigation is geographic scope (fewer countries)
        rather than temporal or spatial resolution.
    verifies:
      - variant: hv-lv-single-link
        check: "(n.buses.carrier == 'low voltage').sum() == len(spatial.nodes)"
        over: run
        note: >
          One LV bus per sector node. A mismatch means the LV insertion saw a different
          node set than the sector build — commonly because the run was electricity-only,
          or because GADM clustering changed the node count after the busmap was written.
      - variant: hv-lv-single-link
        check: "(n.generators.carrier == 'solar rooftop').any() == bool(config['sector']['solar_rooftop']['enable'])"
        over: run
        note: >
          Rooftop PV silently absent while `enable: true` means the LV layer did not run at
          all — `solar_rooftop` and `home_battery` are built INSIDE
          add_electricity_distribution_grid and do nothing if
          `electricity_distribution_grid` is false. The run succeeds with no rooftop PV and
          no warning, which invalidates any rooftop-saturation or prosumer answer.
      - variant: low-voltage-ingestion
        check: "n.buses.v_nom.min() <= config['electricity']['voltages'][0] + 1e-6"
        over: run
        note: >
          Assert that a bus at the newly admitted voltage level actually EXISTS. Lowering
          the thresholds and getting no low-voltage buses means OSM coverage, not config,
          is the binding constraint — the run succeeds and looks like a transmission-only
          model while the config claims otherwise.
      - variant: voltage-level-preserving-kmedoids
        check: "n.buses.groupby(busmap).v_nom.nunique().max() == 1 and len(n.transformers) > 0"
        over: run
        note: >
          The two defining properties in one check: no cluster spans voltage levels, and
          transformers survived. Either half failing means the aggregation is
          voltage-unaware in effect, and the expansion-planning bias the method targets is
          still fully present.
