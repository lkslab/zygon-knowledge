id: distribution-and-voltage-aware-aggregation
title: "Distribution-grid representation and voltage-aware network aggregation"
summary: >
  Two ways of answering "what about the grid below the transmission level": hang an
  aggregate low-voltage layer off every transmission node as a cost-and-losses device,
  or aggregate the network in a way that preserves voltage levels and transformers
  instead of flattening everything onto one voltage.
question: >
  What does the sub-transmission and distribution grid cost, where do rooftop PV, home
  batteries and heat pumps actually connect, and does aggregating voltage levels away
  bias where the model says congestion is?
aliases:
  - "distribution grid"
  - "electricity distribution grid"
  - "low-voltage bus"
  - "LV layer"
  - "HV/LV link"
  - "distribution grid reinforcement cost"
  - "sub-transmission"
  - "voltage-aware aggregation"
  - "voltage-aware network partitioning"
  - "voltage-unaware aggregation"
  - "voltage-level-preserving clustering"
  - "transformer-preserving aggregation"
  - "multi-voltage network reduction"
  - "network equivalencing"
  - "hosting capacity"
  - "MV/LV"
  - "distribution power flow"
when_to_use:
  - "does the model include the distribution grid"
  - "how much will distribution grid reinforcement cost"
  - "where does rooftop solar connect in the model"
  - "can the model tell me if the local grid can host all these heat pumps"
  - "what happens below 220 kV / below the transmission network"
  - "will smart EV charging reduce distribution grid investment"
  - "home batteries and behind-the-meter storage"
  - "prosumers, self-consumption, behind-the-meter"
  - "hosting capacity of a feeder / a substation"
  - "my grid has 110 kV and 132 kV lines that matter — can the model see them"
  - "the model flattens everything to 380 kV, is that a problem"
  - "I want the aggregation to respect voltage levels"
  - "transformers disappear when I cluster — does that matter"
  - "does clustering put the congestion in the wrong place"
  - "distribution network capacity as a co-optimised investment"
family: spatial-resolution
prevalence:
  papers: 5
  tier1: 3
  tier2: 2
  sweep_hits: 42
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 5 papers with actual method
    content here. The regex screen returned 42 — the largest over-count of any method in
    this book, and instructively so: the sweep patterns `distribution (grid|network)`,
    `low.voltage` and `voltage level` fire on every sector-coupled PyPSA-Eur paper,
    because `sector.electricity_distribution_grid: true` is the shipped DEFAULT and the
    "electricity distribution grid" line item therefore appears in ~all of their system
    cost breakdowns. Those papers pay for a distribution layer without studying it; they
    are mention-only and excluded. The two `routine-use` papers kept (Rahdan, Zeyen) are
    kept because each says something a card can use: Rahdan documents the HV/LV split and
    which technologies attach where, and Zeyen reports the co-optimised distribution
    capacity RESPONDING to V2G by up to -20%, which is the only quantified statement in
    the corpus about that component behaving like a decision variable. Hoersch 2018 is
    `routine-use` in the mirror sense: it defines the sub-220 kV EXCLUSION and states the
    resulting error in its own limitations section. The genuinely method-defining pair is
    Xiong 2025 (voltage-level-preserving OSM topology construction) and Stoeckl 2026
    (voltage-aware partitioning as an aggregation algorithm). Two `defines` on five papers
    is unusually top-heavy: this is a small, young literature about a component almost
    every study switches on and almost none examines.
procedure:
  - step: >
      Decide which voltage levels enter the model at all. This precedes every other
      choice: a level excluded at ingestion cannot be recovered by any later aggregation,
      and the exclusion threshold is what makes the low-voltage layer a synthetic proxy
      rather than a network. European practice keeps 220 kV and above; OSM-based pipelines
      can go substantially lower where the crowd-sourced data exists.
    handle: "electricity.voltages (both models); clean_osm_data_options.threshold_voltage (earth)"
    provenance: "scripts/base_network.py:_load_buses; scripts/clean_osm_data.py:filter_voltage"
  - step: >
      (voltage-aware branch) Build the base topology so that voltage-level structure
      SURVIVES ingestion: distinguish buses of different voltage at the same physical
      substation, connect them with explicit transformers, and split multi-voltage line
      entries into one entry per level. Line electrical parameters come from
      voltage-specific standard types, not from one uniform voltage.
    handle: "lines.types / lines.ac_types keyed by v_nom; Transformer components from the source dataset"
    provenance: "scripts/base_network.py:_get_linetype_by_voltage; scripts/base_network.py:_load_transformers"
  - step: >
      (voltage-aware branch) Partition the buses for aggregation with a distance matrix
      that FORBIDS cross-voltage merges — assign infinite distance between any pair of
      buses at different nominal voltages, giving a block-diagonal matrix, then run the
      clustering (k-medoids on haversine distance in the defining paper) on it. Every
      resulting cluster is single-voltage by construction, so transformers between
      clusters remain meaningful branches.
    handle: null
    provenance: null
  - step: >
      (voltage-aware branch) Aggregate within clusters as usual — sum capacities, average
      capacity factors, delete intra-cluster lines, merge parallel inter-cluster lines
      into one equivalent branch with a derived reactance — but additionally KEEP the
      surviving inter-cluster transformers, representing them as branches in the
      linearised power flow rather than deleting them.
    handle: "pypsa.clustering.spatial.get_clustering_from_busmap (aggregates Bus/Line/Link only)"
    provenance: "pypsa/clustering/spatial.py:get_clustering_from_busmap; pypsa/clustering/spatial.py:aggregatelines"
  - step: >
      (distribution-layer branch) For every transmission node, add one synthetic
      low-voltage bus and one extendable link from the node to it. The link's capacity is
      a decision variable carrying the distribution grid's capital cost, so "distribution
      reinforcement" becomes a co-optimised investment with a price rather than a physical
      network. Set p_min_pu = -1 so the link is bidirectional (rooftop export).
    handle: "sector.electricity_distribution_grid"
    provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
  - step: >
      Deduct distribution losses from electricity demand rather than modelling them on the
      link, because reported load figures already include them. A static efficiency
      (0.97 in both models) multiplies the electricity load time series; the link itself
      keeps efficiency = 1.
    handle: "sector.transmission_efficiency['electricity distribution grid'].efficiency_static"
    provenance: "config/config.default.yaml:efficiency_static; scripts/prepare_sector_network.py:efficiency_static"
  - step: >
      Re-point every behind-the-meter and end-use component from the transmission bus to
      the new LV bus: electricity loads (including industry/agriculture/rail electricity),
      BEV chargers and V2G, decentral heat pumps, resistive heaters and micro-CHP. This
      re-pointing IS the method's mechanism — it is what makes rooftop PV and a home
      battery avoid the distribution link while a utility-scale plant does not.
    handle: "the bus reassignment inside insert_electricity_distribution_grid"
    provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
  - step: >
      Attach the distributed generation and storage that only exists behind the meter:
      rooftop PV with a population- or building-footprint-derived potential cap, and a
      home battery store with separate charger and discharger links, all on the LV bus.
      Existing utility solar is simultaneously re-costed to utility rather than blended
      rooftop/utility capital cost so the two are not double-counted.
    handle: "the rooftop/home-battery block of insert_electricity_distribution_grid"
    provenance: "scripts/prepare_sector_network.py:solar rooftop; scripts/prepare_sector_network.py:home battery charger"
  - step: >
      Scale the distribution grid cost to the case. The intended knob is a multiplier on
      the LV link's capital cost; where that knob is dead, the live route is the generic
      per-component cost adjustment applied to the 'electricity distribution grid' Link
      carrier.
    handle: "adjustments.sector.factor.Link['electricity distribution grid'].capital_cost"
    provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
  - step: >
      Read the result correctly. The outputs the LV layer supports are: the annualised
      cost of the distribution component, its co-optimised capacity, and the SHIFT in that
      capacity between scenarios (e.g. with and without smart charging). It does not
      support any statement about a feeder, a voltage limit, a hosting capacity or a
      binding local constraint — there is no distribution power flow anywhere in either
      workflow.
    handle: "scripts/make_summary.py cost/capacity tables, filtered to the carrier"
    provenance: "scripts/make_summary.py:calculate_costs"
  - step: >
      (absent everywhere) If the question really is about a feeder, thermal rating or
      voltage limit, the procedure the literature would need — a distribution network
      model, an AC or LinDistFlow power flow on it, and a hosting-capacity computation —
      exists in neither model at any layer. This step is named so the interview can refuse
      it explicitly rather than answering it with the cost proxy.
    handle: null
    provenance: null
variants:
  - id: voronoi-transmission-only
    what: >
      The baseline both models actually ship: keep only transmission voltages, and assign
      load and generators to substations by Voronoi catchment on the assumption that
      lower-voltage layers connect them. There is NO distribution representation at all —
      the sub-transmission grid is an assumption of perfect internal connectivity. This is
      the honest starting point for the interview because it is what an
      electricity-only run gives you by default, and its error is documented by its own
      authors.
    papers:
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
  - id: hv-lv-single-link
    what: >
      One synthetic LV bus per node with one extendable, bidirectional, cost-carrying link
      from the HV bus, plus static loss deduction. Rooftop PV, home batteries, EV chargers,
      heat pumps and resistive heaters move to LV; utility PV, wind and grid-scale storage
      stay on HV. Buys a priced distribution-reinforcement decision variable and — the
      part that changes results — a genuine HV/LV transport cost asymmetry that makes
      behind-the-meter assets cheaper than their nameplate cost suggests. Costs nothing in
      solve time and is on by default in both models.
    papers:
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
  - id: voltage-level-preserving-kmedoids
    what: >
      Voltage-aware partitioning: cluster with a block-diagonal distance matrix that
      assigns infinite distance between buses of different nominal voltage, so no cluster
      spans two voltage levels, then keep the surviving transformers as branches. Buys an
      aggregated network whose impedances still describe a multi-voltage grid, which
      matters specifically for transmission expansion planning accuracy. In the defining
      study 344 of 1756 transformers survived at k=500 over a 6795-bus 220/380 kV European
      network. Implemented outside both workflows (the NPAP package), bypassing the
      workflow's own aggregation step entirely.
    papers:
      - "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
  - id: osm-voltage-aware-topology
    what: >
      The ingestion-side half of voltage awareness: build the base network from OSM so that
      voltage structure exists BEFORE any aggregation — cluster raw buses within a radius
      but aggregate by station id AND voltage/AC-DC type, insert transformers between
      different-voltage AC buses at the same station, split multi-voltage ways, and map
      line capacities to voltage-specific standard types. Produces 5848 buses, 7320 AC
      lines and 1059 transformers for Europe at a >=200 kV threshold. Necessary condition
      for the previous variant: you cannot preserve a voltage level the base network never
      had.
    papers:
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
  - id: low-voltage-ingestion
    what: >
      Push the ingestion threshold BELOW transmission voltage so real sub-transmission
      lines enter the model as network rather than as a synthetic link. Only reachable in
      pypsa-earth, whose OSM cleaning threshold and `electricity.voltages` list both go
      lower than eur's European dataset allows, and which ships a country config at 33 kV.
      This is the only route in either model from "distribution as a cost proxy" toward
      "distribution as a network", and it is bounded by OSM coverage rather than by code.
      No corpus paper exercises it — the variant is inferred from the config surface, not
      from the literature.
    papers: []
  - id: distribution-power-flow
    what: >
      An actual distribution network model with a power flow — AC, LinDistFlow or similar —
      supporting thermal and voltage limits, hosting capacity and per-feeder constraints.
      Named as a variant so the ladder can carry an honest `absent` row and the interview
      can refuse the question instead of answering it with the LV cost proxy. No paper in
      this corpus does it; neither model has it at any layer.
    papers: []
literature:
  - paper: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: >
      Defines the baseline this method departs from, and — unusually — states its own
      error. Restricts buses and AC lines to 220/300/380 kV (all HVDC kept regardless of
      voltage), then partitions countries into Voronoi catchment cells around substations,
      "each of which is assumed to be connected to the substation by lower voltage network
      layers", with load split 60% GDP / 40% population from NUTS3. The limitations
      section says plainly that "using Voronoi cells to aggregate load and generator data
      to transmission network substations ignores the topology of the underlying
      distribution network", and that the resulting local assignment errors are remedied
      only by clustering. Quote this to any user who assumes an electricity-only run
      contains a distribution grid: it contains an assumption that one exists.
  - paper: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    tier: 1
    role: defines
    note: >
      Defines the ingestion side of voltage awareness. A four-step OSM-to-PyPSA workflow
      that explicitly preserves voltage-level information: step 2 cleans tag columns per
      voltage level (220-750 kV) and splits ways carrying several voltages into separate
      entries; step 3 clusters buses within a 5000 m radius but aggregates by station id
      AND voltage/AC-DC type, so two voltage levels at one substation stay two buses;
      transformers are then added ex-post between different-voltage AC buses at the same
      station and converters link DC endpoints to the nearest AC bus. Line capacities map
      to voltage-level-specific pandapower standard types rather than one uniform voltage.
      Result for Europe at a >=200 kV AC filter: 5848 buses, 7320 AC lines/cables, 36 DC
      links, 1059 transformers, 261757 route-km. The paper validates two grid
      representations (OSM vs ENTSO-E map) on statistics and on model outcomes at 318
      NUTS2 nodes, 8760 h, 2030 — i.e. it treats the grid dataset itself as the object of
      study, which is why it is `defines` here as well as being cited in
      spatial-clustering-and-resolution.
  - paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    tier: 2
    role: defines
    note: >
      Defines voltage-aware aggregation as an algorithm and measures what the conventional
      alternative costs you. Proposes "a novel voltage-aware network partitioning and
      aggregation methodology that preserves individual voltage levels and transformers",
      implemented by assigning infinite distance between buses of different voltage in the
      distance matrix D — a block-diagonal matrix — before k-medoids clustering on
      haversine distances (NPAP's geographical_kmedoids_haversine). Aggregation is
      otherwise the standard copperplate approach: merge buses in a cluster, sum
      capacities, average renewable capacity factors, delete intra-cluster lines,
      aggregate parallel inter-cluster lines with an equivalent reactance; transformers are
      treated as lines in the DC power flow. Benchmarked against voltage-unaware (VU)
      aggregation at k = 250/500/1000/3000 on a 6795-bus European 220/380 kV network, 3
      representative 24-hour periods, 2050 horizon, 2013 weather. 344 of 1756 transformers
      survive at k=500. Two facts to relay: the target application is transmission
      EXPANSION planning accuracy specifically, and the implementation deliberately SKIPS
      PyPSA-Eur's own spatial aggregation step while reusing its generator and load data
      pipeline — so this is a fork of the workflow's clustering stage, not a config option.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      The clearest published description of the hv-lv-single-link variant as configured by
      default, and of why the HV/LV split changes results rather than only costs. "The
      distribution grid is modeled in each node as a single connection from the
      high-voltage (HV) to the low-voltage (LV) electricity bus with a 97% efficiency."
      Rooftop PV attaches to LV; utility PV and grid-scale storage attach to HV;
      demand-shifting and curtailment for electricity, plus the free storage and
      load-shedding generator, sit at LV. The paper then uses that distinction as the
      EXPLANATION for a result: rooftop PV grows more than utility PV under demand
      shifting, because it avoids HV->LV transport losses. 37 nodes (synchronous zones),
      sector-coupled, 2-hourly. Use this to answer "does it matter where things connect" —
      yes, through losses and the link's cost, not through any local constraint.
  - paper: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      The corpus's only quantified statement about the distribution component behaving as
      a decision variable. "Electricity distribution grid" appears as a line item in the
      system cost breakdown, and in the V2G sensitivity: "If V2G is available, the capacity
      of the electricity distribution grid can be reduced by up to 20%." The paper does not
      describe the sub-transmission representation — it is the shipped default — but this
      is the number to cite when a user asks whether smart charging defers distribution
      reinforcement: the model can answer that question, in aggregate MW and EUR, and only
      that way. 39 regions, 3-hourly, five investment periods 2025-2050, full sector
      coupling.
pitfalls:
  - pitfall: >
      The aggregate LV layer is a COST ACCOUNTING DEVICE, not a network. One bus and one
      extendable link per node, with efficiency 1 and no impedance, cannot express a
      distribution constraint binding, a thermal limit on a feeder, a voltage excursion, a
      phase imbalance or a hosting-capacity limit. A run with
      `electricity_distribution_grid: true` will happily report a distribution cost while
      being structurally incapable of saying the distribution grid is a problem anywhere.
    evidence: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    note: >
      State this before the user forms an expectation. The registry is explicit —
      `distribution-power-flow` is `absent` in BOTH models with the note "no feeder-level
      network model; nearest: distribution-grid-lv linear cost proxy". Legitimate answers
      from the LV layer: annualised distribution cost, co-optimised distribution capacity,
      and the DELTA in that capacity between scenarios (Zeyen's -20% under V2G is the
      model form of "smart charging defers reinforcement"). Illegitimate: any per-feeder,
      per-street or voltage-limit statement, and any claim that the grid "can" or "cannot"
      host a given DER penetration. If the user's question is hosting capacity, route them
      to a distribution tool (pandapower/OpenDSS class) and use PyPSA for the system-level
      envelope only.
  - pitfall: >
      Voltage levels are flattened UNCONDITIONALLY, before any clustering choice you get
      to make. Both workflows map every bus and line onto a single voltage and delete every
      transformer as the first step of network reduction; there is no config key to skip
      it. An aggregated network's impedances therefore describe a single-voltage
      abstraction of a multi-voltage grid, which biases transmission expansion planning
      specifically.
    evidence: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    note: >
      Grep-verified rather than inferred: `simplify_network_to_380` sets
      `n.buses["v_nom"] = 380.0`, rewrites `num_parallel` to preserve s_nom, maps
      components through a transformer map and then calls `n.remove("Transformer", ...)`.
      pypsa-earth's `simplify_network_to_base_voltage` is the same operation with the
      target voltage read from `electricity.base_voltage` — so earth at least makes the
      target configurable, while neither makes the step optional. For a
      transmission-expansion or grid-security study on a mixed-voltage subsystem this is a
      known unmodelled bias with no config remedy.
  - pitfall: >
      Voltage-flattening aggregation MISATTRIBUTES WHERE CONGESTION OCCURS, and the bias
      is not a scalar you can correct. Merging buses deletes intra-cluster lines rather
      than derating them, so every cluster becomes an internal copperplate; swept from 306
      to 6 nodes the SIGN of the curtailment bias changes across four qualitative stages,
      so no post-hoc correction factor exists.
    evidence: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    note: >
      Do not re-derive this here — it is the substrate card's territory. Read
      `spatial-clustering-and-resolution` pitfalls: the intra-cluster copperplating
      mechanism (Frysztacki 2022, verified by the copperplate sensitivity in Frysztacki
      2023) and the non-monotone curtailment bias (Frysztacki 2020) are stated there with
      their own evidence. What THIS card adds is that voltage-aware partitioning does not
      fix any of that: it constrains WHICH buses may merge, so it keeps transformers and
      multi-voltage impedances, but clusters are still internally copperplated. It is a
      fix for one specific bias (expansion planning on a mixed-voltage grid), not for
      aggregation error in general.
  - pitfall: >
      A voltage level excluded at INGESTION is unrecoverable. eur's `electricity.voltages`
      starts at 220 kV and its base dataset carries nothing below; no clustering
      cleverness, no custom busmap and no LV layer puts a real 110 kV or 132 kV line back
      into the network. The synthetic LV link is not that line — it is a price.
    evidence: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
    note: >
      Check the ceiling before promising the study. eur's default voltages list is
      [220, 300, 330, 380, 400, 500, 750] and `_load_buses` filters buses to
      min..max of that list (DC buses exempted); `lines.types` does contain entries down
      to 63 kV, so the CONFIG would accept a lower minimum, but the OSM/TYNDP European
      dataset the workflow retrieves does not supply sub-220 kV AC assets, making a lower
      threshold a data problem (L3), not a config one. pypsa-earth is the genuine
      exception and the honest answer to "can I see my 132 kV network" — see the
      `low-voltage-ingestion` variant.
  - pitfall: >
      Rooftop PV potential is a POPULATION PROXY, not a roof survey, and in pypsa-eur the
      assumed density is hardcoded. A "rooftop solar saturation" answer from a default run
      is 0.1 kW/m2 x 20 m2/person applied to a population raster — an assumption with no
      config key and no per-country calibration.
    evidence: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    note: >
      Grep-verified: `build_clustered_solar_rooftop_potentials.py` computes
      `potentials = 0.1 * 20 * pd.Series(pop, ...)` with both numbers as literals; nothing
      in eur's config tree contains `kW_per_m2` or `m2_per_person`. pypsa-earth exposes
      both as `sector.solar_rooftop.{kW_per_m2,m2_per_person}` AND offers a
      building-footprint route (`use_building_size: true` -> `cluster_global_buildings.py`
      with a size-dependent `install_ratio` curve). For any question where the rooftop CAP
      is load-bearing rather than slack, say which of the two you used and sign the
      assumption off with the user.
  - pitfall: >
      The advertised distribution cost knob is a DEAD KEY in pypsa-eur.
      `sector.electricity_distribution_grid_cost_factor` exists in the config, is
      documented in the pydantic schema, and is settable from the `dist<f>` wildcard token
      — and is read by no script. Setting it changes nothing, the run succeeds, and the
      reported distribution cost is the unscaled default.
    evidence: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    note: >
      This is the archetypal silent-failure class the harness exists to catch. Verified by
      grep: the only occurrences in eur are the config default, the pydantic Field, the
      `find_opt(opts, "dist")` assignment in `_helpers.py` that WRITES it, and a
      results/baseline config echo. `insert_electricity_distribution_grid` reads
      `costs.at["electricity distribution grid", "capital_cost"]` directly and never
      consults the factor. (`gas_distribution_grid_cost_factor`, by contrast, IS read — by
      `insert_gas_distribution_costs` — which is exactly why the electricity one looks
      alive.) The live route is `adjustments.sector.factor.Link['electricity distribution
      grid'].capital_cost`, consumed by `maybe_adjust_costs_and_potentials`, and it is
      already the shipped example in that config block. pypsa-earth does not have the key
      at all, which is at least not misleading.
  - pitfall: >
      A custom busmap cannot make the workflow voltage-aware, because it enters AFTER the
      flattening. `clustering.mode: custom_busmap` is consumed by `cluster_network`, whose
      input is `base_s.nc` — the already-simplified network in which `v_nom == 380` for
      every bus and no Transformer exists. A voltage-aware busmap fed in this way is
      grouping buses by a voltage attribute that has been overwritten to a constant.
    evidence: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    note: >
      Grep-verified from the rule graph: `rule simplify_network` takes
      `networks/base_extended.nc` and emits `networks/base_s.nc`; `rule cluster_network`
      takes `networks/base_s.nc` and `input_custom_busmap`. This is precisely why the
      defining paper skips PyPSA-Eur's aggregation step rather than configuring it, and it
      is the single most important structural fact on this card: the voltage-aware entry
      point is upstream of every config surface the workflow offers.
  - pitfall: >
      PyPSA's own clustering primitive DROPS TRANSFORMERS. `get_clustering_from_busmap`
      rebuilds Bus, Line, Link, the one-port components and Carriers onto the clustered
      network — and never touches `n.transformers`. So even a correct voltage-aware busmap
      passed to the library loses the transformers the method exists to preserve, silently
      and with no warning.
    evidence: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    note: >
      Verified by reading pypsa 0.30.3 `pypsa/clustering/spatial.py`: the function
      aggregates buses, aggregates lines via `aggregatelines`, remaps `n.links` bus0/bus1,
      imports one-ports and carriers, then returns. This explains the defining paper's
      "transformers treated as lines in DC power flow" choice — converting Transformer to
      Line BEFORE clustering is not a modelling shortcut, it is the only way the library
      call preserves them. Any L5 implementation must do the same conversion or write its
      own transformer aggregation; asserting a transformer count on the clustered network
      is the cheap way to catch it.
requires_methods:
