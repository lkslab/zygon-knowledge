id: import-and-trade-representation
title: "Import and trade representation of energy carriers and green commodities"
summary: >
  Represent energy and commodity flows crossing the model boundary — as a priced
  supply option, as an exogenous fixed volume at a border node, or as an explicitly
  modelled counterparty region — with an accounting rule for their embodied emissions.
question: >
  Is it cheaper to import this carrier than to make it here, how much of it, from
  where, and what does the import do to my emissions balance?
aliases:
  - "energy imports"
  - "green fuel imports"
  - "import supply curves"
  - "energy supply chains"
  - "ESC"
  - "levelised cost of energy exports"
  - "hydrogen export"
  - "green commodity trade"
  - "green intermediates"
  - "hot briquetted iron imports"
  - "PtX imports"
  - "soft-linked supply curves"
  - "TRACE"
  - "import dependence"
  - "autarky assumption"
  - "cross-border trade at exogenous prices"
  - "nested-model border prices"
when_to_use:
  - "is it cheaper to import hydrogen than to produce it domestically"
  - "how much green ammonia or methanol would Europe import"
  - "what happens to my results if I allow imports from outside the region"
  - "should we build electrolysers here or buy the hydrogen from Morocco"
  - "model my country as a hydrogen exporter to Europe"
  - "what is the levelised cost of delivered hydrogen from Australia"
  - "how import-dependent does this scenario make us"
  - "compare relocating steel production abroad against decarbonising it at home"
  - "what does exporting 100 TWh of hydrogen do to domestic electricity prices"
  - "which port should the export terminal be at"
  - "how do I set the electricity price at my border with France"
  - "does importing hydrogen just move the emissions somewhere else"
  - "put an annual cap on how much fuel we are allowed to import"
family: sector-coupling
prevalence:
  papers: 17
  tier1: 10
  tier2: 7
  sweep_hits: 29
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 17 papers that actually
    represent a boundary-crossing flow with a price, a volume or an explicit
    counterparty. The regex screen returned 29 and over-counts badly here, because
    "import" is the most overloaded word in this corpus: every Python file starts with
    it, and "gas imports"/"import dependence" appear rhetorically in introductions of
    papers whose models have no import vector. Two judgement calls on the 17.
    (1) 2025_Hofmann is KEPT despite its evidence being "Europe is self-sufficient and
    does not import any fuels" — the autarky assumption is stated, defended and its
    consequences discussed in a Limitations appendix, which makes it the corpus's
    documented statement of the DEFAULT, and it is coded `critiques` rather than
    `routine-use` for exactly that reason. (2) 2025_Schumm is flagged
    mention-only in EVIDENCE_INDEX.md and that flag is WRONG: the flag fired on the
    note "transport mode beyond the border is not modelled", but export volume is the
    paper's independent variable across 264 runs. It stays, as `canonical-use`.
    Roles are unusually top-heavy — 1 defines, 5 extends, 1 canonical-use — because
    every group that has done this built its own boundary treatment; there is no
    settled convention, which is why `variants` is long and the three formulations in
    `procedure` step 1 genuinely disagree with each other.
procedure:
  - step: >
      Decide WHAT the import is, mechanically. This is the modelling choice that IS the
      method and it fixes the answer before anything is solved. Three formulations:
      (a) an unlimited-capacity SUPPLY OBJECT on the carrier bus inside the region — a
      Generator, or a Link from the CO2 bus for carbonaceous fuels — with a marginal
      cost equal to the delivered price, so import volume is endogenous and the
      exporter is a price-taking infinite well; (b) an EXOGENOUS FIXED quantity at a
      border node — a Load for export, a fixed-p_set Generator for import — so volume
      is an input and the question becomes what the volume does to the domestic system;
      (c) an EXPLICITLY MODELLED counterparty region inside the same optimisation, or a
      separate optimisation of it whose result is fed in, so the exporter's own capital
      and operating cost is endogenised. Only (c) can answer "is importing cheaper"
      without assuming the answer, because in (a) the price is exogenous and in (b) the
      volume is.
    handle: null
    provenance: null
  - step: >
      Obtain the delivered price. The corpus does this three ways: a single literature
      scalar per carrier (the cheap default); a step/piecewise supply curve where the
      marginal price rises with volume; or a full techno-economic optimisation of the
      exporting chain whose levelised cost becomes the scalar. The third is what makes
      formulation (c) a soft link rather than an assumption.
    handle: "sector.imports.price (a per-carrier EUR/MWh dict)"
    provenance: "config/config.default.yaml:price; scripts/prepare_sector_network.py:import_options"
  - step: >
      Place the entry point. Unspatialised carriers (ammonia, methanol, liquid fuels,
      steel) attach to a single EU-wide bus, which silently assumes free internal
      transport of the imported commodity. Spatialised carriers attach at real
      infrastructure — LNG terminals for methane, pipeline entry points for hydrogen,
      seaports for shipped commodities — which is what makes the import compete
      geographically with domestic production.
    handle: "gas_input_nodes['lng'] / gas_input_nodes['pipeline'] from the clustered gas-entry geojson"
    provenance: "scripts/build_gas_input_locations.py:build_gas_input_locations; scripts/prepare_sector_network.py:gas_input_nodes"
  - step: >
      Decide the EMBODIED-EMISSIONS rule, and write it down. Three choices, all in the
      corpus: count nothing (the import is carbon-neutral by declaration); charge a
      fraction of the carrier's CO2 intensity to the domestic atmosphere as an upstream
      factor; or model the exporter's system and let its emissions appear in its own
      balance. Choice one is the default in every model here and it is the pitfall this
      card exists to flag.
    handle: "sector.solid_biomass_import.upstream_emissions_factor (the only vector that charges any)"
    provenance: "config/config.default.yaml:upstream_emissions_factor; scripts/prepare_sector_network.py:biomass_import_upstream_emissions"
  - step: >
      Bound the volume. Either a per-carrier/per-entry-point nameplate (p_nom on the
      supply object, e.g. terminal capacity times an expansion factor), or a
      system-wide annual energy cap summed across all import vectors in MWh_fuel, or a
      relational cap (imports may not exceed domestic production of the same carrier).
      The cap is what turns an unlimited price-taker into a scenario dimension.
    handle: "sector.imports.{limit,limit_sense} enforced at solve time"
    provenance: "scripts/solve_network.py:add_import_limit_constraint"
  - step: >
      Solve, then sweep the boundary. No study in this corpus reports a single import
      run: the import price, the volume cap and the admissible carrier SUBSET are all
      swept, because the result is a corner solution — a carrier is either 100%
      imported or 0% imported over most of the price range, so the interesting output
      is the switching threshold and not the level.
    handle: "run.scenarios + the {run} wildcard"
    provenance: "scripts/_helpers.py:get_scenarios; rules/common.smk:scenario_config"
  - step: >
      Report the boundary as its own result, not as a residual. The corpus's reporting
      conventions are: import share per carrier; a levelised-cost decomposition of the
      delivered carrier by chain component (generation / electrolysis / synthesis /
      storage / transport / feedstock), which is how exporter-side studies present
      themselves; and the delta in domestic infrastructure — electrolysers, pipelines,
      renewables not built because the carrier was bought.
    handle: null
    provenance: null
variants:
  - id: priced-import-generator
    what: >
      Formulation (a) at its simplest: one supply object per carrier on the carrier bus,
      marginal cost = a literature scalar delivered price, capacity effectively
      unlimited, volume endogenous. Cheapest possible import representation and the one
      pypsa-eur ships. Answers "at what price does this carrier get imported"; cannot
      answer whether that price is achievable, because the exporter is not modelled.
    papers:
      - "2025_Burghardt_material-needs-energy-technologies.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
  - id: stepped-supply-curve
    what: >
      Formulation (a) with a rising marginal price: a piecewise-linear or stepped
      cost-supply curve so that the first TWh is cheap and the hundredth is not. Removes
      the corner-solution artefact of a flat price and is the minimum honest treatment
      when the import volume is large relative to world supply. Costs one extra
      parameter (the slope) and nothing structural.
    papers:
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
  - id: volume-capped-import
    what: >
      Formulation (a) plus a binding bound: a system-wide annual energy cap across all
      import vectors, a per-entry-point nameplate tied to existing terminal capacity, or
      a relational cap (total imports <= domestic green production). Converts import
      availability from an assumption into a scenario dimension, which is how every
      multi-scenario import study in the corpus is structured.
    papers:
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
  - id: exogenous-border-volume
    what: >
      Formulation (b): the boundary flow is a fixed profile — a Load at a border/port
      node for export, a fixed injection for import — and the volume is swept as the
      independent variable. Inverts the question from "how much would be traded" to
      "what does trading this much do to the domestic system", which is the only way to
      study distributional effects on domestic consumers. The exporter-side default.
    papers:
      - "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
  - id: hourly-price-nested-model
    what: >
      Formulation (c) done cheaply and in one direction: run a coarse model of the
      OUTSIDE first, harvest its hourly nodal price, and use that time series as the
      marginal cost of a virtual import generator (and a virtual demand for export) at
      the border. Price arbitrage then sets the hourly direction of flow. Far better
      than a scalar for a single-country model whose neighbours matter hourly; still
      assumes the neighbour's price is unaffected by your flows.
    papers:
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
      - "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
  - id: multi-carrier-supply-chain
    what: >
      Formulation (c) as the whole study: build an end-to-end optimisation of the
      exporting chain per carrier and per route — renewables, electrolysis, feedstock
      (DAC, desalination, air separation), synthesis, conditioning, transport schedule,
      optional re-cracking at the importer — and compare the resulting levelised
      delivered costs across carriers. The exporter's capital cost is endogenous; the
      importer's system is not modelled at all. This is where import PRICES come from.
    papers:
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
  - id: soft-linked-supply-curves
    what: >
      Formulation (c) coupled to a consumer-side model: a global supply-chain model
      builds a stand-alone greenfield system per exporting country, meets that country's
      own demand FIRST, then expands for export, and the resulting per-country supply
      curve is fed into the importing model. One-directional — no iteration to a
      consistent price — but it is the only treatment in the corpus where the exporter's
      domestic demand competes with the export.
    papers:
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
  - id: endogenous-electricity-import
    what: >
      The one carrier that can be traded without a price assumption: import electricity
      by putting the exporting region's wind, solar, storage and the HVDC link itself
      into the same optimisation as extendable capacity. No exogenous price at all —
      the delivered cost falls out. Only tractable for a handful of exporting regions,
      which is why it is done for electricity and not for the derivatives.
    papers:
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
  - id: green-commodity-imports
    what: >
      Extend the traded set past energy to embodied-energy MATERIALS — hot briquetted
      iron, crude steel, ammonia and methanol as industrial feedstock rather than fuel —
      priced per tonne. Changes the question from energy import dependence to industrial
      relocation, and it is the variant where the embodied-emissions accounting matters
      most and is handled least.
    papers:
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
  - id: autarky-baseline
    what: >
      The deliberate absence of the method: assume the region imports nothing, state it,
      and treat imports as a limitation rather than a scenario. Not a null variant — it
      is the default of every model in this book, it is what a user gets if they do not
      ask, and naming it is how the interview surfaces the assumption instead of
      inheriting it silently.
    papers:
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
literature:
  - paper: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    tier: 1
    role: defines
    note: >
      The card's definitional paper and the source of most import prices used downstream.
      Builds nine islanded end-to-end Energy Supply Chain models — HVDC, H2 pipeline,
      CH4 pipeline, and H2/CH4/NH3/MeOH/LOHC/FT ship — from the exporter's generation to
      delivery in Germany, each as a separate PyPSA optimisation, over 8 exporters
      (AR/AU/DE/DK/EG/ES/MA/SA) and 2030/2040/2050. Two method details worth relaying:
      the exporter's own domestic electricity demand is carved out of the cheapest
      supply-curve classes BEFORE the export optimisation, and the import volume is
      fixed at 120 TWh/yr so the output is a levelised cost per chain rather than a
      traded quantity. It is greenfield and islanded — no grid, no heat coupling.
      Uses the pypsa LIBRARY, not pypsa-eur or pypsa-earth: nothing in either workflow
      builds this, which is why the exporter-side variants sit at L5.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: extends
    note: >
      The most complete import treatment in the corpus, and the one to imitate. Couples
      TRACE (the global supply-chain model, descended from Hampp) to a 110-node
      sector-coupled PyPSA-Eur: 8 import vectors (electricity, H2 pipeline and ship,
      methane, ammonia, methanol, Fischer-Tropsch, steel) from 11 exporting regions into
      12 European entry points, at 500 TWh or 100 Mt steel reference export per region.
      The methodological payload is the SPLIT: electricity imports are endogenously
      co-optimised (exporter wind/solar/storage plus HVDC sizing inside the same LP,
      3%/1000 km plus 2% converter losses), while the derivatives enter as constant
      levelised costs from TRACE. Hydrogen and methane entry points are constrained to
      existing/planned LNG terminals and pipeline entries with a 2.5x expansion cap;
      ammonia, carbonaceous fuels and steel are NOT spatially resolved. Its price table
      is what Glaum, DiBella and van Greevenbroek all cite.
  - paper: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference exporter-side study and the reason pypsa-earth belongs on this card:
      a 14-node sector-coupled PyPSA-Earth model of Morocco, export volume as an
      exogenous parameter swept 0-120 TWh/a (sensitivity to 200), crossed with four
      temporal hydrogen-regulation regimes (no rule / annual / monthly / hourly
      matching) over 264 runs. Export is a fixed constant-profile demand at port nodes;
      the model chooses which port(s) endogenously and each port may build underground
      or steel-tank storage per its geology. Transport beyond the border is not
      modelled. The finding to relay is that the export volume redistributes welfare
      onto DOMESTIC electricity consumers — an effect invisible in every
      importer-side formulation, because in those the exporter has no consumers.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: extends
    note: >
      The clearest statement of the soft-link and of WHY it is a soft link: "expanding
      the spatial scope to incorporate non-European partners is computationally
      expensive", so TRACE supply curves stand in for 51 exporting countries fed into
      PyPSA-DE. TRACE builds a stand-alone greenfield system per exporting country,
      meets its domestic demand, then expands for export, capped at 500 TWh/a (238 Mt
      HBI); transport losses and ship fuel are included; weather and cost assumptions
      are harmonised across the two models. Explicitly one-directional with no
      iteration to consistency — the honest caveat to repeat. Five scenarios
      progressively relax the boundary (Base no-imports, European H2, global H2,
      European H2+precursors, global H2+precursors), which is the scenario ladder to
      copy for any import study.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: extends
    note: >
      Extends the traded set from fuels to industrial INTERMEDIATES on a 39-node
      sector-coupled PyPSA-Eur myopic pathway: green hot briquetted iron for EAF at
      395 EUR/t, plus ammonia and methanol, available as exogenous fixed-price supply
      from 2040 and competing with domestic production as alternative supply nodes.
      Prices are literature averages (ammonia/methanol from Neumann 2025) with a price
      RANGE shown as a sensitivity band rather than a point value — the right way to
      present a scalar import price. No volume cap is stated, which makes the
      corner-solution pitfall live in this paper's own results.
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: extends
    note: >
      The corpus's stepped-supply-curve source, and the only paper here that derives its
      import curve from outside the energy-model literature: 20 EJ of solid biomass
      importable at 15 EUR/GJ with the marginal price rising 0.25 EUR/GJ per additional
      EJ, taken from an IAM model-comparison of global biomass supply. Only solid biomass
      may be imported — direct biofuel imports are excluded — and the base import price
      is swept +/-33% (36-72 EUR/MWh around 54). The import price only becomes a
      significant sensitivity at high biofuel mandates, which is the general shape:
      import assumptions are inert until a constraint forces the import.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Useful for two things. It documents the default: on a 100-node sector-coupled
      PyPSA-Eur, the base runs DISALLOW all imports from outside Europe and imports are
      a named sensitivity. And it gives a clean price set consistent with Neumann 2025 —
      green methanol 140, hydrogen 100, FT oil 160, ammonia 110 EUR/MWh, HBI 480 EUR/t,
      restricted to green carriers only. The corner-solution warning comes from its own
      results: with imports on, 100% of steel and 100% of ammonia are imported while
      methanol is only 37% — the two unspatialised, uncapped commodities go to the
      corner and the spatially-competing one does not.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      An import treatment typical of national models: PyPSA-DE with 30 German regions
      plus 19 neighbouring-country nodes, cross-border ELECTRICITY co-optimised over AC/DC
      links (expansion capped at 150% of 2025 NTC), while H2, e-fuels, biomass, oil and
      gas are exogenous-price commodities whose volume differs by scenario. The
      two-tier boundary — electrical neighbours modelled, chemical imports priced — is
      the standard national-model compromise. Its LowFlex case raises combined H2 and
      e-fuel imports 47%, i.e. imports absorb missing domestic flexibility, which is a
      coupling users rarely anticipate.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: critiques
    note: >
      Coded `critiques` because its contribution to this card is the honest negative:
      a 90-node net-zero sector-coupled European study that assumes total autarky
      ("Europe is self-sufficient in energy and does not import any fuels") and then
      devotes a Limitations appendix to what green hydrogen or synthetic-fuel imports
      would change about its H2/CO2 network conclusions. Since the paper's result IS
      infrastructure sizing, and imports substitute directly for domestic H2 pipeline
      and electrolyser capacity, this is the corpus's cleanest demonstration that the
      autarky default is not a neutral choice — it inflates the domestic infrastructure
      answer. Cite it whenever a user asks about network buildout without mentioning
      imports.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      Exercises pypsa-eur's solid-biomass import surface as a scenario dimension on a
      39-node sector-coupled run: import quantity is an endogenous variable bounded by a
      swept cap at 0 / 1390 / 2500 TWh/a (1390 is the shipped default). Two exclusions
      are stated as limitations and both matter: liquid fuel and liquid hydrogen imports
      are not allowed at all, and upstream emissions from the biomass imports are NOT
      counted — despite the model having a config key for exactly that. The clearest
      corpus instance of the embodied-emissions pitfall being left at zero by choice.
  - paper: "2025_Burghardt_material-needs-energy-technologies.pdf"
    tier: 2
    role: routine-use
    note: >
      A minimal, well-documented instance of the one-scalar formulation: sector-coupled
      PyPSA-Eur for Germany plus direct neighbours, H2 ship imports enabled at a flat
      84 EUR/MWh, electricity and hydrogen cross-border exchange endogenous within the
      modelled countries. Its value here is the interaction it exposes — as the endogenous
      domestic material share rises, H2 imports rise to 36 TWh, and the imported H2 does
      NOT induce domestic material demand because the material cost is buried inside the
      import price. That is the general leakage: a scalar import price hides whatever the
      model would otherwise have had to build.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      Contributes the RELATIONAL volume cap, which nothing in either model implements:
      PyPSA-Eur v0.13 modified so gas, oil, ammonia, methanol and hydrogen can be
      imported as carbon-neutral "green" fuels at Hampp-derived prices declining
      2025-2050, under two regimes — (a) total imports may not exceed domestic green
      hydrogen production by energy content, (b) unrestricted. Import availability is
      one of six scenario dimensions across 216 runs. The spatially-resolved carriers
      (gas, hydrogen) may be imported at any node, which is more permissive than
      upstream pypsa-eur's terminal-constrained entry points.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Shows why the import boundary leaks across sectors even when nobody is studying
      imports. On a 37-node sector-coupled PyPSA-Eur v0.11 comparing four demand-side
      mechanisms, methane may be imported as LNG from outside Europe and fossil oil is
      available for aviation and industry; import volumes then move ENDOGENOUSLY with
      the demand scenario, so reducing aviation demand increases methane imports for
      heating. Any study with an open import vector has an implicit fossil-import
      degree of freedom that will absorb the effect being measured.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: extends
    note: >
      The nested-model border price, and the recipe to copy for any single-country
      pypsa-eur fork. Each interconnection becomes a border node carrying a
      zero-capital-cost Generator whose variable cost is the neighbouring country's
      HOURLY electricity price, plus a virtual demand for the export direction; hourly
      arbitrage then sets the flow direction. The prices are pre-computed from a
      one-node-per-country PyPSA-Eur run under a consistent CO2 target, which is what
      keeps the two models from contradicting each other. Four interconnections at
      Spanish NECP 2030 capacities (5000 MW to France, 4000 MW to Portugal).
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: routine-use
    note: >
      The same price-taker interface at the opposite scale: a single-node PtX hub
      (GreenLab Skive) trading with "external energy systems" at exogenous historical
      2019 and 2022 spot prices — electricity imports priced at DK1 spot plus tariffs
      plus a CO2 adder, natural gas plus CO2 tax, exports of RE electricity at spot
      minus tariffs, district heat at 54 EUR/MWh. Contributes a modelling trick worth
      knowing: RE export is bounded by a profile-following external demand served by a
      zero-cost generator, so the export cap binds without distorting the objective.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      The second pypsa-earth exporter study, and evidence that the exogenous-volume
      formulation is the earth house style: a 14-node sector-coupled Morocco model to
      2035 where export volumes for hydrogen, ammonia, methanol, HBI and steel are
      fixed annual targets per scenario (17.10 TWh H2 in the export-oriented case,
      derived by quadratic fit to near-term national-strategy targets; 2327-3616 kt/y
      steel). No endogenous price formation for exports at all — the export is a demand
      the system must serve, and the result is the cost of serving it.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      A non-European instance of the historically-bounded boundary flow, and the
      corpus's strongest quantitative claim about why import assumptions matter. In
      PyPSA-USA (134 zones, 48 states solved independently), interstate gas trade is
      endogenous pipeline links while trade with regions outside CONUS is an exogenous
      boundary condition constrained MONTHLY to historical flows with configurable
      multipliers. Across a ~350-parameter Morris screening plus Monte Carlo, natural
      gas export cost, gas import cost and petrol cost were in the top three
      sensitivities for 43, 32 and 24 of the 48 states respectively — the boundary
      price is a first-order driver, not a detail.
pitfalls:
  - pitfall: >
      EMBODIED EMISSIONS ARE NOT COUNTED. In pypsa-eur every carbonaceous import vector
      is a Link FROM the `co2 atmosphere` bus at the carrier's own CO2 intensity, so
      importing methanol, oil or methane WITHDRAWS CO2 from the atmosphere and the later
      combustion returns it: net zero, by construction, regardless of how the fuel was
      actually made. H2 and NH3 imports are bare Generators with no CO2 bus at all.
      Imported hydrogen produced from unabated fossil energy abroad is therefore
      indistinguishable from green hydrogen inside the CO2 cap, and buying it is the
      cheapest way for the model to satisfy a net-zero target.
    evidence: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    note: >
      The keys assume `green` imports and only the naming says so. Either restrict the
      price dict to carriers you can defend as green and say so in the write-up, or
      charge upstream emissions explicitly — solid biomass import is the one vector that
      already can (`sector.solid_biomass_import.upstream_emissions_factor`, default 0.1,
      wired to a `co2 atmosphere` efficiency2 term), and it is the pattern to copy for
      the others. Zhang runs biomass imports and still leaves upstream emissions out;
      do not repeat that silently.
  - pitfall: >
      A flat import price plus an uncapped, unspatialised carrier produces a CORNER
      SOLUTION: the carrier is 100% imported or 0% imported over most of the plausible
      price range, and the reported percentage is an artefact of which side of the
      threshold the assumed price fell on.
    evidence: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    note: >
      Glaum's own import sensitivity shows it — 100% of steel and 100% of ammonia
      imported (both unspatialised and uncapped) against 37% of methanol. Never report
      an import share from a single price; report the switching threshold from a price
      sweep, or add a rising supply curve (stepped-supply-curve), or cap the volume
      (volume-capped-import).
  - pitfall: >
      An exogenous price makes the exporter an infinitely deep, perfectly elastic well
      that has no domestic demand, no capital constraint and no opinion. Every
      importer-side study in this corpus therefore CANNOT answer "is importing cheaper"
      — it answers "at what assumed price would importing be cheaper", which is a
      different question and is often reported as the first.
    evidence: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    note: >
      If the user's decision turns on whether the import is achievable rather than on
      what it costs, the formulation must be (c): multi-carrier-supply-chain,
      soft-linked-supply-curves, or endogenous-electricity-import. If it turns only on
      the level, an exogenous price plus a sweep is honest and much cheaper. Make the
      user choose before quoting a number.
  - pitfall: >
      Import assumptions look inert and are not. They sit dormant until some other
      constraint binds, then absorb the entire effect being measured — a demand
      reduction in one sector reappears as an import increase in another, and a
      flexibility restriction reappears as a fuel import.
    evidence: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    note: >
      Rahdan's aviation-demand reduction raises methane imports for heating; Geis's
      LowFlex case raises combined H2 and e-fuel imports 47%. When the study question is
      about something else entirely, either close the import vector or report import
      volume alongside the headline result so the substitution is visible.
  - pitfall: >
      Autarky is the DEFAULT, not the neutral case. `sector.imports.enable: false` and
      `sector.solid_biomass_import.enable: false` are both shipped off, so a user who
      does not raise imports gets a self-sufficient region — and since imports
      substitute directly for domestic electrolysers, pipelines and renewables, the
      default inflates every domestic-infrastructure result.
    evidence: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    note: >
      Hofmann states the assumption and discusses it in a Limitations appendix, which is
      the standard to hold. Surface the autarky-baseline variant at interview time
      whenever the question is about infrastructure sizing, and run at least an import
      sensitivity beside the headline case.
  - pitfall: >
      Unspatialised import carriers arrive on a single EU-wide bus and are then
      transported internally for free, so an unspatialised commodity systematically
      out-competes a domestic producer that has to pay for transport. In pypsa-eur this
      splits the carrier set: methane arrives only at LNG terminals and hydrogen only at
      pipeline entry points, while ammonia, methanol and oil arrive everywhere at once.
    evidence: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    note: >
      Neumann handles it by constraining H2 and methane entries to real terminals with a
      2.5x expansion cap and stating plainly that ammonia, carbonaceous fuels and steel
      are not spatially resolved. Repeat the disclosure, and treat a spatial import
      result for an unspatialised carrier as meaningless.
  - pitfall: >
      Export-side studies that model only the export flow miss the effect their users
      most often care about — what the export does to DOMESTIC consumers. And in
      pypsa-earth specifically, the hydrogen colour-share constraint is written over
      `n.loads` matching the carriers `H2`, `H2 for industry` and `H2 for shipping`,
      while the export load carries carrier `H2 export`: the certification constraint
      therefore does not apply to the exported hydrogen at all.
    evidence: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    note: >
      Schumm's whole finding is welfare redistribution from the export onto Moroccan
      electricity consumers, which required building temporal-matching regimes on top of
      the shipped model. If a user asks about regulated (RFNBO-style) export, verify by
      hand that the matching constraint's carrier set includes the export load — the run
      succeeds either way and the unregulated case is silently cheaper.
