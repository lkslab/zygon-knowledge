pypsa_primitive:
  symbol: "pypsa/optimization/global_constraints.py:define_operational_limit"
  pypsa_version: "0.30.3"
  exposed_by: >
    neither, for import purposes — pypsa-eur writes its own import cap in
    scripts/solve_network.py:add_import_limit_constraint rather than using this
  reachable_via: >
    Add a row to `n.global_constraints` with type `operational_limit`, a
    `carrier_attribute` naming ONE carrier, a `sense` and a `constant`; the constraint
    is then built automatically at optimize() time. It sums weighted Generator-p plus
    non-cyclic StorageUnit/Store end-state for that carrier, which is exactly an annual
    energy volume cap.
  note: >
    Two reasons this is only a partial handle, and they explain why pypsa-eur wrote its
    own. The primitive is per-carrier (one `carrier_attribute` per constraint), whereas
    an import cap must span several import carriers at once; and it covers Generators,
    StorageUnits and Stores but NOT Links, whereas pypsa-eur's carbonaceous import
    vectors are Links whose p must be converted to MWh_fuel by multiplying through
    `efficiency` before summing. There is no library primitive at all for the rest of
    this card: an import is a Generator or a Link on a carrier bus, i.e. the base
    component API, so `priced-import-generator` is not "missing a primitive" — it is
    three lines of n.add(). Soft anchor: pypsa is a conda dependency, not a submodule,
    so this is pinned to a version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: green-energy-imports
        role: >
          the method itself, importer-side — registry status `working`. One config flip
          adds priced import options for H2, NH3, methanol, gas and oil at gas entry
          points. This is the turnkey core of the card.
      - id: import-limit-constraint
        role: >
          the volume bound — a system-wide annual cap in MWh_fuel summed across every
          import Generator and Link, active only when imports are enabled
      - id: co2-atmosphere-constraint
        role: >
          where the embodied-emissions pitfall lands: carbonaceous imports are Links
          FROM the co2 atmosphere store this constraint bounds, so they read as
          carbon-neutral by construction
      - id: co2-cap
        role: >
          the constraint that makes an import attractive in the first place — without a
          carbon cap or price, cheap fossil beats every green import
      - id: sector-master-switches
        role: >
          `sector.fossil_fuels` is the other, older import surface: it is what adds
          fossil coal/gas/oil/lignite supply at fuel cost, and it is a separate switch
          from `sector.imports`
      - id: ammonia-value-chain
        role: >
          NH3 imports are silently SKIPPED with a warning unless the ammonia carrier
          exists — a hard prerequisite for one of the five import vectors
      - id: methanol-suite
        role: >
          methanol imports need the methanol carrier and buses that this suite creates;
          the import Link's efficiency is derived from the methanolisation CO2 input
      - id: h2-export-chain
        role: >
          registry status `absent` — eur models the CONSUMER side only. There is no
          export wildcard and no endogenous export pricing, which is precisely the
          asymmetry with pypsa-earth
      - id: scenario-matrix
        role: >
          the run harness for the price/volume/carrier-subset sweep that every import
          study in the corpus performs
      - id: autarky
        role: >
          the ELECTRICAL boundary, distinct from the chemical one — it removes or caps
          cross-border lines, and the ATK/ATKc wildcard token is broken at this ref
    available:
      verdict: turnkey
      how: >
        `sector.imports.enable: true` runs the importer-side method as shipped. It adds
        five priced import vectors: Generators on the H2 and NH3 buses, and Links from
        the `co2 atmosphere` bus to the methanol, oil and gas buses at
        `price / co2_intensity` so that carbonaceous imports are carbon-neutral. H2 and
        gas are placed at REAL entry points from the clustered gas-entry-locations layer
        (pipeline entries for H2, LNG terminals for gas, with p_nom set from terminal
        capacity); NH3, methanol and oil get p_nom 1e7 on their EU-wide buses.
        `sector.imports.{limit,limit_sense}` then adds a system-wide annual cap in
        MWh_fuel at solve time. Solid biomass import is a SECOND, independent surface
        (`sector.solid_biomass_import.enable`) built as a finite Store draining into the
        biomass buses, and it is the only vector with an upstream-emissions term. All
        import carriers have entries in the plotting palette, so they appear in
        summaries without extra work.
      missing: >
        Procedure steps 1 (only formulation (a) is available), 4 (upstream emissions
        exist for solid biomass ONLY) and 7 (no levelised-cost decomposition, no import
        share reporting beyond the generic carrier summary) have no full handle. Also
        absent, and each one is a fork in the corpus: steel/HBI or any non-energy
        commodity as an import vector (grep for hbi/briquett/steel-import finds
        nothing); a stepped or piecewise supply curve — `price` is one scalar per
        carrier; a relational cap (imports <= domestic production), which van
        Greevenbroek wrote by hand; hourly time-varying import prices; and any exporter
        representation whatsoever. Note a live trap: the config schema declares
        `sector.imports.price` as an open dict (`additionalProperties: number`), but
        `add_import_options` handles exactly five hard-coded carrier names — adding
        `steel: 500` validates against the schema and is then silently ignored.
      provenance: "scripts/prepare_sector_network.py:add_import_options; scripts/solve_network.py:add_import_limit_constraint"
    levers:
      - key: "sector.imports.enable"
        effect: >
          Master switch for the five priced green-import vectors. Off by default, which
          is the autarky-baseline variant.
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:add_import_options"
      - key: "sector.imports.price"
        effect: >
          Per-carrier delivered price in EUR/MWh. Only the keys H2, NH3, methanol, gas
          and oil are consumed; the shipped values (74 / 97 / 121 / 122 / 125) are close
          to Neumann 2025's price set. Dropping a key removes that import vector
          entirely, which is how the corpus builds carrier-subset scenarios.
        default: "{H2: 74, NH3: 97, methanol: 121, gas: 122, oil: 125}"
        provenance: "config/config.default.yaml:price; scripts/prepare_sector_network.py:import_options"
      - key: "sector.imports.limit"
        effect: >
          System-wide annual import cap in TWh_fuel, summed over every import Generator
          and Link (Link p converted through efficiency). Infinite by default, i.e.
          unbounded imports once enabled — the corner-solution risk.
        default: ".inf"
        provenance: "config/config.default.yaml:limit; scripts/solve_network.py:add_import_limit_constraint"
      - key: "sector.imports.limit_sense"
        effect: >
          Sense of that cap. Setting it to `>=` turns the cap into a MINIMUM import
          mandate, which is the cheapest way to force a prescribed import volume and is
          the nearest shipped approximation to the exogenous-border-volume variant.
        default: "'<='"
        provenance: "config/config.default.yaml:limit_sense; scripts/solve_network.py:limit_sense"
      - key: "sector.solid_biomass_import.enable"
        effect: >
          A second, independent import surface: a finite EU-wide Store of imported solid
          biomass draining through extendable Links into the regional biomass buses.
        default: "false"
        provenance: "config/config.default.yaml:solid_biomass_import; scripts/prepare_sector_network.py:solid_biomass_import"
      - key: "sector.solid_biomass_import.max_amount"
        effect: >
          Annual importable volume in TWh, set as the Store's e_nom and e_initial. The
          shipped 1390 is the mid level of Zhang's 0 / 1390 / 2500 sweep.
        default: "1390"
        provenance: "config/config.default.yaml:max_amount; scripts/prepare_sector_network.py:biomass_import_max_amount"
      - key: "sector.solid_biomass_import.price"
        effect: >
          Import price in EUR/MWh on the Store, above the domestic residue price so
          domestic potential is used first. 54 is Millinger's base value.
        default: "54"
        provenance: "config/config.default.yaml:solid_biomass_import; scripts/prepare_sector_network.py:biomass_import_price"
      - key: "sector.solid_biomass_import.upstream_emissions_factor"
        effect: >
          THE key that fixes the embodied-emissions pitfall, for this one vector: the
          import Link gets a third bus on `co2 atmosphere` with
          efficiency2 = factor * solid-biomass CO2 intensity, so 10% of the carrier's
          carbon content is charged to the domestic atmosphere. No equivalent exists for
          H2, NH3, methanol, gas or oil imports.
        default: "0.1"
        provenance: "config/config.default.yaml:upstream_emissions_factor; scripts/prepare_sector_network.py:biomass_import_upstream_emissions"
      - key: "sector.ammonia"
        effect: >
          Hard prerequisite for the NH3 import vector — `add_import_options` logs a
          warning and skips ammonia imports if the carrier is absent.
        default: "true"
        provenance: "config/config.default.yaml:ammonia; scripts/prepare_sector_network.py:add_ammonia"
      - key: "sector.fossil_fuels"
        effect: >
          The unpriced-origin import channel that predates `sector.imports`: adds
          unlimited coal/gas/oil/lignite supply at fuel cost. Leaving it true while
          studying green imports keeps a fossil substitute in the model.
        default: "true"
        provenance: "config/config.default.yaml:fossil_fuels; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: "run.scenarios.enable"
        effect: >
          Fans the import price / volume / carrier-subset sweep out as managed parallel
          runs rather than a hand-rolled loop.
        default: "false"
        provenance: "config/config.default.yaml:scenarios; scripts/_helpers.py:get_scenarios"
    assembly:
      - step: >
          Turn the shipped surface on and choose the carrier subset by editing the price
          dict — dropping a carrier's key removes that vector. This alone is
          priced-import-generator, and for many questions it is the whole study.
        uses: [green-energy-imports, ammonia-value-chain, methanol-suite]
        config: "sector.imports.enable: true; sector.imports.price"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_import_options"
      - step: >
          Bound the volume. `sector.imports.limit` for a system-wide annual cap
          (volume-capped-import), or `limit_sense: '>='` to force a minimum import — the
          cheapest available stand-in for a prescribed border volume.
        uses: [import-limit-constraint]
        config: "sector.imports.limit; sector.imports.limit_sense"
        code: null
        provenance: "scripts/solve_network.py:add_import_limit_constraint"
      - step: >
          Decide the emissions accounting DELIBERATELY. Enable biomass imports with a
          non-default upstream factor if that vector is in scope, and either justify
          zero upstream emissions for the other five or copy the biomass pattern — a
          third bus on `co2 atmosphere` with efficiency2 = factor * CO2 intensity — onto
          them, which is a localised edit inside add_import_options.
        uses: [co2-atmosphere-constraint, co2-cap]
        config: "sector.solid_biomass_import.upstream_emissions_factor; sector.imports.enable"
        code: "scripts/prepare_sector_network.py (add_import_options: add bus2/efficiency2 terms)"
        provenance: "scripts/prepare_sector_network.py:biomass_import_upstream_emissions; scripts/solve_network.py:add_co2_atmosphere_constraint"
      - step: >
          For a rising supply curve (stepped-supply-curve), replace the single priced
          object per carrier with N parallel objects at increasing marginal cost and
          decreasing p_nom, inside add_import_options. Cheap in code, and it is what
          removes the corner-solution artefact.
        uses: [green-energy-imports]
        config: null
        code: "scripts/prepare_sector_network.py (add_import_options)"
        provenance: "scripts/prepare_sector_network.py:add_import_options"
      - step: >
          For a new commodity vector (green-commodity-imports: HBI, steel), add the
          priced supply object on the existing industrial feedstock bus. Nothing named
          steel or HBI import exists at this ref, so this is new code, but the receiving
          bus and the industry demand it serves already do.
        uses: [green-energy-imports, sector-master-switches]
        config: null
        code: "scripts/prepare_sector_network.py (add_import_options + add_industry)"
        provenance: "scripts/prepare_sector_network.py:add_import_options; scripts/prepare_sector_network.py:add_industry"
      - step: >
          For hourly border prices (hourly-price-nested-model), run the coarse outer
          model first, harvest its nodal price time series, and attach it as a
          marginal_cost_t series on a border-node Generator plus a virtual demand for
          the export direction. The price harvest is post-processing on a solved
          network; the attachment is a new rule input.
        uses: [green-energy-imports, scenario-matrix]
        config: null
        code: "new rule + script under scripts/, consumed by prepare_sector_network"
        provenance: "scripts/prepare_sector_network.py:add_import_options; scripts/_helpers.py:get_scenarios"
      - step: >
          For soft-linked-supply-curves or multi-carrier-supply-chain, build the
          exporter model OUTSIDE this workflow (TRACE, or a bespoke pypsa model as in
          Hampp) and feed its levelised costs back in as the price dict or as a supply
          curve. This is where the eur workflow stops entirely: it has no exporter
          representation of any kind.
        uses: [green-energy-imports]
        config: "sector.imports.price (as the interface)"
        code: "an external exporter model; no rule in this repo"
        provenance: "scripts/prepare_sector_network.py:import_options"
      - step: >
          Sweep the boundary and report it. Price, volume cap and carrier subset all
          become scenario dimensions; the import carriers already have plotting colours
          so they surface in the standard summaries.
        uses: [scenario-matrix]
        config: "run.scenarios.enable; run.scenarios.file"
        code: null
        provenance: "scripts/_helpers.py:get_scenarios; config/plotting.default.yaml:import H2"
    boundary:
      - variant: priced-import-generator
        rung: L0
        note: >
          One flip: `sector.imports.enable: true`. Five carriers, real entry points for
          H2 and gas, shipped prices already aligned with the corpus's price set. The
          only genuinely turnkey variant on this card.
      - variant: volume-capped-import
        rung: L1
        note: >
          `sector.imports.limit` plus `limit_sense`, or
          `sector.solid_biomass_import.max_amount` for the biomass vector. Specific
          non-default values, no code. A per-carrier or per-entry-point cap, as opposed
          to the system-wide one, is L2 — p_nom on the individual objects.
      - variant: autarky-baseline
        rung: L0
        note: >
          The shipped default (`enable: false` on both import surfaces). Listed as a
          rung because the interview's job is to make it a CHOICE: pair it with
          `electricity.autarky` if the electrical boundary should close too, noting the
          ATK/ATKc wildcard token is broken at this ref.
      - variant: stepped-supply-curve
        rung: L2
        note: >
          `price` is one scalar per carrier, so a rising curve means N parallel supply
          objects at increasing cost inside add_import_options. Localised, ~20 lines,
          no new rule or data. The highest value-per-line change on this card.
      - variant: green-commodity-imports
        rung: L2
        note: >
          No steel/HBI import exists at this ref (nothing greps). But the industrial
          feedstock buses and demands do, so it is a priced object on an existing bus
          plus a price in EUR/t — an edit in add_import_options, not a reformulation.
          Both DiBella and Seibold did this as a fork.
      - variant: hourly-price-nested-model
        rung: L4
        note: >
          Needs a price time series per border node, which means a new rule producing it
          from a prior coarse solve plus a new input to prepare_sector_network. The
          formulation is trivial (a marginal_cost_t series); the DAG plumbing is the
          work. Gallego-Castillo pre-computed the prices outside the workflow entirely,
          which is the cheaper route if reproducibility is negotiable.
      - variant: exogenous-border-volume
        rung: L4
        note: >
          Approximable at L1 for a scalar annual volume via `limit_sense: '>='`, which
          forces total imports to at least the limit. Anything Schumm-shaped — a
          time-profiled Load at a chosen port node, with the port set as a wildcard —
          needs a new rule and wildcard, i.e. reimplementing what pypsa-earth already
          ships. This is the asymmetry: for export studies, use earth.
      - variant: soft-linked-supply-curves
        rung: L5
        note: >
          The eur workflow has no exporter representation, so this is an entire second
          model (TRACE or equivalent) plus a harmonisation of weather and cost
          assumptions across the two, plus the supply-curve interface. Neumann 2025 and
          Seibold 2025 both did it; both report it as the expensive part of the study,
          and both left the coupling one-directional rather than iterating to a
          consistent price.
      - variant: multi-carrier-supply-chain
        rung: L5
        note: >
          Not a pypsa-eur study at all. Hampp built nine islanded pypsa models against
          the LIBRARY, with GIS potentials, feedstock chains (DAC, desalination, air
          separation), conditioning and ship schedules. Reusing pypsa-eur's resource
          layer for a non-European exporter is itself the hard part — see the
          data_dependencies below.
      - variant: endogenous-electricity-import
        rung: L5
        note: >
          Requires the exporting region inside the same LP: its own buses, extendable
          wind/solar/storage from its own cutout and land-eligibility layers, and an
          extendable HVDC link with distance losses. The pypsa-eur machinery for all of
          that exists — it is the machinery for European nodes — so the work is
          extending the region definition and the cutout, not new formulation. That is
          why Neumann 2025 endogenised electricity and only electricity.
    where:
      - change: "the priced import objects themselves (carrier set, supply curve, new commodities, CO2 terms)"
        anchor: "scripts/prepare_sector_network.py::add_import_options, called under options['imports']['enable']"
        provenance: "scripts/prepare_sector_network.py:add_import_options"
      - change: "the system-wide annual import volume cap"
        anchor: "scripts/solve_network.py::add_import_limit_constraint, called from extra_functionality"
        provenance: "scripts/solve_network.py:add_import_limit_constraint; scripts/solve_network.py:extra_functionality"
      - change: "the solid-biomass import Store/Link chain and its upstream-emissions term"
        anchor: "scripts/prepare_sector_network.py::add_biomass, under options['solid_biomass_import']['enable']"
        provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:biomass_import_upstream_emissions"
      - change: "entry-point geography for spatialised import carriers"
        anchor: "rule build_gas_input_locations -> gas_input_locations_s_{clusters}_simplified.csv (lng / pipeline columns)"
        provenance: "rules/build_sector.smk:build_gas_input_locations; scripts/build_gas_input_locations.py:build_gas_input_locations"
      - change: "a border-node price time series for the nested-model variant"
        anchor: "a new rule producing a per-border price CSV, added as an input to rule prepare_sector_network"
        provenance: "rules/build_sector.smk:prepare_sector_network; scripts/prepare_sector_network.py:add_import_options"
      - change: "boundary sweep fan-out"
        anchor: "run.scenarios + the {run} wildcard; config/scenarios.yaml"
        provenance: "scripts/_helpers.py:get_scenarios; rules/common.smk:scenario_config"
    data_dependencies:
      - input: >
          delivered import prices per carrier (and per exporter/route, if the study is
          spatial about origins)
        required_for: "priced-import-generator, stepped-supply-curve, green-commodity-imports"
        availability: >
          exists by default as five hard-coded scalars in config; NO cost or
          supply-curve data FILE ships with the repo — nothing under data/ or resources/
          holds import costs, and no rule produces them. Anything beyond the five
          scalars is a literature value the user must supply and sign off. The corpus's
          reference sets are Hampp 2023 (via TRACE) and Neumann 2025.
      - input: "gas/H2 entry-point locations and capacities (LNG terminals, pipeline entries)"
        required_for: "priced-import-generator (the spatialised H2 and gas vectors)"
        availability: >
          must be built — rule build_gas_input_locations from GEM/EntsoG source data,
          part of the standard sector chain, so already in a settled baseline. Europe
          only.
      - input: >
          exporter-side resource data (cutout, land eligibility, cost assumptions) for a
          non-European region
        required_for: "endogenous-electricity-import, multi-carrier-supply-chain"
        availability: >
          absent for pypsa-eur — its cutout and eligibility layers are European. Getting
          a non-European exporter into the same LP means building the resource stack for
          it, which is what pypsa-earth is for. This is the single strongest reason to
          consider earth for an exporter-side question.
      - input: "hourly electricity prices for neighbouring regions"
        required_for: "hourly-price-nested-model"
        availability: >
          must be built from a prior coarse solve (Gallego-Castillo used a
          one-node-per-country PyPSA-Eur run under a matched CO2 target). Historical
          observed prices are an alternative but then the two models' policy
          assumptions diverge.
    cost_profile:
      solves: >
        1 for the base import case. Corpus studies are all sweeps: Glaum's import
        sensitivity is 1 extra run on top of 5 network scenarios; van Greevenbroek
        crosses import availability (2 levels) into 216 scenarios; Zhang sweeps biomass
        import at 3 levels; Seibold uses 5 progressively-relaxed import scenarios.
        Budget 2 x (levels per swept dimension), and note that price and volume cap are
        usually swept together.
      relative: >
        Enabling imports is roughly FREE per solve — a handful of Generators and Links
        and one extra global constraint on an already sector-coupled LP. Two caveats
        that cut the other way: an unbounded cheap import vector can make the LP degenerate
        (many near-equal-cost import mixes), and the exporter-side variants replace
        "cheap" with "a second model" — Neumann's and Seibold's TRACE couplings are the
        expensive part of those studies, not the PyPSA-Eur solve.
      note: >
        The affordability story here is not solve time but SWEEP COUNT, because the
        result is a threshold rather than a level. Sweep price and volume on a coarse
        model (TSAM segmentation, fewer clusters) to locate the switching point, then
        spot-check at full resolution — the threshold moves much less with resolution
        than the level does.
    verifies:
      - variant: priced-import-generator
        check: "n.generators.carrier.str.contains('import').any() or n.links.carrier.str.contains('import').any()"
        over: run
        note: >
          The single most valuable check on this card. `sector.imports.enable: true` is
          a config flip whose failure mode is silent: if the ammonia or methanol carrier
          is absent, add_import_options logs a warning and skips that vector, and the
          run succeeds having imported nothing. An import study that imported nothing
          looks exactly like an import study that found imports uneconomic.
      - variant: volume-capped-import
        check: "'import_limit' in n.model.constraints"
        over: run
        note: >
          The cap is only built when imports are enabled AND `limit` is finite AND some
          import object exists. Leave `limit` at .inf and there is no constraint, no
          warning, and unbounded imports — the corner-solution generator.
      - variant: green-commodity-imports
        check: "set(config['sector']['imports']['price']) <= {'H2','NH3','methanol','gas','oil'}"
        over: run
        note: >
          Guards the schema trap. The config schema accepts any carrier name in the
          price dict, but only these five are consumed. A `steel: 500` entry validates,
          is ignored, and the study silently answers a question about a commodity that
          was never importable.
      - variant: autarky-baseline
        check: "not config['sector']['imports']['enable'] and not config['sector']['solid_biomass_import']['enable']"
        over: run
        note: >
          Asserts the autarky claim is actually true of the run. Both surfaces are
          independent and both default off, so a study that describes itself as
          self-sufficient while having left biomass imports on is a real and easy error.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: h2-export-chain
        role: >
          the method itself, EXPORTER-side — registry status `working`, and the mirror
          image of eur. A dedicated rule, a dedicated script and a `{h2export}` wildcard
          threaded through the entire sector chain.
      - id: fuel-import-supply
        role: >
          registry status `absent`, and the point of the asymmetry: earth has no import
          terminals, no import volumes, no origins and no green-fuel imports. Fossil
          purchases are implicit unlimited fuel-priced Generators.
      - id: h2-color-accounting
        role: >
          the certification layer Schumm's regulation study needs — production-share
          constraints by electricity origin. Crucially it is written over `n.loads` and
          does NOT cover the export load's carrier.
      - id: sector-coupled-workflow
        role: >
          the chain the export bus attaches to; add_export runs between
          prepare_sector_network and solve_network on the prenetwork
      - id: ammonia-value-chain
        role: >
          NH3 exists as a carrier, so NH3 export is reachable — but export is H2-only in
          add_export, so exporting a derivative is an edit, not a config value
      - id: custom-data-overrides
        role: >
          `custom_data.export_ports` replaces the auto-derived port set with a
          user-supplied CSV — the escape hatch from the coarse default port selection
      - id: co2-cap
        role: >
          without a domestic carbon constraint, an export volume is met by whatever is
          cheapest, so the export study's answer is set by this key
      - id: scenario-matrix
        role: >
          combinatorial expansion of the export-volume sweep, which is how Schumm's 264
          runs and Duque-Perez's scenario set are produced
      - id: autarky
        role: >
          the ELECTRICAL boundary, and unlike eur the ATK/ATKc token works here —
          relevant because an exporting country's neighbours are usually not modelled
    available:
      verdict: assemble
      how: >
        Earth ships the EXPORT half turnkey and the IMPORT half not at all. `rule
        add_export` runs `scripts/add_export.py` on the prenetwork: `select_ports` picks
        the H2 buses at seaports (falling back to ALL H2 buses if no port is found),
        `add_export` creates one `H2 export bus`, extendable export Links from each port
        bus, and — depending on `export.endogenous` — either a Load with the export
        profile (exogenous volume, the default) or a negative-`sign` Generator with
        marginal_cost = -endogenous_price (endogenous volume against a fixed offer
        price). `export.store: true` adds a cyclic H2 store at the export bus so the
        export profile need not be met hour-by-hour. `create_export_profile` builds
        either a constant profile or a ship-schedule profile from
        `rule build_ship_profile`, and RAISES if the resampled annual total misses the
        wildcard by more than 0.001 TWh. The volume itself is the `{h2export}` wildcard,
        which appears in every sector-chain filename from the prenetwork through
        summaries, so an export sweep is free wildcard expansion rather than a harness.
      missing: >
        Everything importer-side: procedure steps 1(a), 2, 3, 4 and 5 have no handle for
        imports. Fossil fuels are added as unlimited extendable Generators at fuel cost
        with no origin, no terminal, no volume cap and no distinction between domestic
        and imported (`fuel-import-supply` is `absent` in the registry). No green-fuel
        import vector exists at all. On the export side the gaps are narrower but sharp:
        export is H2-only (exporting NH3, methanol or steel means editing add_export);
        the export price is a single scalar with no supply curve and no time variation;
        the export profile is constant or a ship schedule, nothing else; and
        `set_h2_colors` constrains only domestic H2 loads, so the export volume escapes
        the colour/certification constraint. Nothing computes a levelised export cost.
      provenance: "scripts/add_export.py:add_export; scripts/add_export.py:create_export_profile; scripts/prepare_sector_network.py:add_industry"
    levers:
      - key: "export.h2export"
        effect: >
          The export volume list in TWh/yr, expanded into the `{h2export}` wildcard.
          This IS the exogenous-border-volume sweep: `[0, 20, 40, ...]` is Schumm's
          study design as a config list. Ignored when `export.endogenous` is true.
        default: "[10]"
        provenance: "config.default.yaml:h2export; scripts/add_export.py:h2export"
      - key: "export.endogenous"
        effect: >
          Switches the boundary object from a fixed Load to a negative-sign Generator at
          `endogenous_price`, so the exported volume becomes an optimisation variable
          against a fixed offer price. The only price-driven boundary flow either model
          ships.
        default: "false"
        provenance: "config.default.yaml:endogenous; scripts/add_export.py:export_endogenous"
      - key: "export.endogenous_price"
        effect: >
          The offer price in EUR/MWh applied as marginal_cost = -price on the export
          generator. Sweeping it traces the country's H2 export supply curve, which is
          the closest thing in either model to endogenous export price formation.
        default: "400"
        provenance: "config.default.yaml:endogenous_price; scripts/add_export.py:endogenous_price"
      - key: "export.export_profile"
        effect: >
          `constant` (pipeline-like, flat every hour — Schumm's choice) or `ship` (a
          batch schedule from build_ship_profile). Changes what flexibility the domestic
          system must supply for the same annual volume, and therefore the storage and
          capacity answer.
        default: "'ship'"
        provenance: "config.default.yaml:export_profile; scripts/add_export.py:create_export_profile"
      - key: "export.store"
        effect: >
          Adds a cyclic, extendable H2 store at the export bus, decoupling production
          from the export schedule. With it off, the export profile is a hard hourly
          obligation on the domestic system — a large and easily overlooked difference.
        default: "true"
        provenance: "config.default.yaml:store; scripts/add_export.py:store"
      - key: "export.store_capital_costs"
        effect: >
          `no_costs` or `standard_costs`. The default gives the export terminal FREE
          storage, which understates export cost — flip it for any cost-comparison
          study.
        default: "'no_costs'"
        provenance: "config.default.yaml:store_capital_costs; scripts/add_export.py:store_capital_costs"
      - key: "export.ship.ship_capacity"
        effect: >
          Ship size in the batch schedule (with fill_time, travel_time, unload_time),
          which sets the lumpiness of the export draw. Only used when
          `export_profile: ship`.
        default: "0.4"
        provenance: "config.default.yaml:ship_capacity; scripts/build_ship_profile.py:ship_capacity"
      - key: "custom_data.export_ports"
        effect: >
          Replaces the auto-derived export-port set with data/custom/export_ports.csv.
          Necessary for any serious siting question, because the default keeps only the
          largest harbour size-class per country.
        default: "false"
        provenance: "config.default.yaml:export_ports; scripts/prepare_ports.py:custom_export"
      - key: "sector.hydrogen.set_color_shares"
        effect: >
          Turns on production-share constraints by electricity origin (green/pink/blue),
          the shipped proxy for a certification regime. Read the pitfall first: the
          constraint is built over domestic H2 loads and does not reach the export load.
        default: "false"
        provenance: "config.default.yaml:set_color_shares; scripts/solve_network.py:set_h2_colors"
    assembly:
      - step: >
          Pick the export volume set. `export.h2export: [0, 20, 40, 60, ...]` expands
          into the `{h2export}` wildcard and the whole sector chain re-runs per value.
          This is the exogenous-border-volume variant, complete, at L1.
        uses: [h2-export-chain, scenario-matrix]
        config: "export.h2export"
        code: null
        provenance: "scripts/add_export.py:h2export; Snakefile:h2export"
      - step: >
          Choose the profile and the storage assumption together: `export_profile`
          constant vs ship, and `export.store` / `store_capital_costs`. These decide how
          much of the export's intermittency burden lands on the domestic system, which
          for a welfare question is more consequential than the volume.
        uses: [h2-export-chain]
        config: "export.export_profile; export.store; export.store_capital_costs; export.ship.ship_capacity"
        code: null
        provenance: "scripts/add_export.py:create_export_profile; scripts/build_ship_profile.py:ship_capacity"
      - step: >
          Fix the port set. The shipped default downloads the World Port Index and keeps
          only the largest harbour size-class per country, then drops duplicates per GADM
          region — too coarse for a siting answer. Supply data/custom/export_ports.csv
          and set `custom_data.export_ports: true`. Note the download: flag it before
          running.
        uses: [custom-data-overrides, h2-export-chain]
        config: "custom_data.export_ports: true"
        code: "data/custom/export_ports.csv (user-supplied)"
        provenance: "scripts/prepare_ports.py:filter_ports; scripts/prepare_ports.py:custom_export"
      - step: >
          For an endogenous export volume, set `export.endogenous: true` and sweep
          `endogenous_price` to trace the export supply curve. Do NOT leave both this
          and an h2export list expecting both to apply — the wildcard volume is simply
          unused in this mode.
        uses: [h2-export-chain]
        config: "export.endogenous: true; export.endogenous_price"
        code: null
        provenance: "scripts/add_export.py:export_endogenous; scripts/add_export.py:endogenous_price"
      - step: >
          For a regulated export (Schumm's annual/monthly/hourly matching), enable
          `set_color_shares` and then FIX its scope: the shipped `set_h2_colors` sums
          `n.loads` with carriers H2 / H2 for industry / H2 for shipping, so the export
          load (carrier `H2 export`) is excluded. Add the temporal-matching constraint
          in extra_functionality over a carrier set that includes the export load.
        uses: [h2-color-accounting, custom-constraint-hook]
        config: "sector.hydrogen.set_color_shares: true"
        code: "scripts/solve_network.py (set_h2_colors / extra_functionality)"
        provenance: "scripts/solve_network.py:set_h2_colors; scripts/solve_network.py:extra_functionality"
      - step: >
          To export a derivative (NH3, methanol, steel) rather than H2, edit add_export:
          `select_ports` hardcodes the `" H2"` bus suffix and `add_export` builds an
          `H2 export bus`. The carriers exist upstream (ammonia-value-chain), so this is
          a parameterisation of an existing script, not new physics.
        uses: [h2-export-chain, ammonia-value-chain]
        config: null
        code: "scripts/add_export.py (select_ports, add_export)"
        provenance: "scripts/add_export.py:select_ports; scripts/add_export.py:add_export"
      - step: >
          For any IMPORT question, there is no surface to assemble from. Fossil supply is
          an unlimited extendable Generator at fuel cost added inside add_industry — add
          a priced, capacity- or volume-bounded supply object on the target carrier bus
          there, copying pypsa-eur's add_import_options as the reference pattern.
        uses: [fuel-import-supply, sector-coupled-workflow]
        config: null
        code: "scripts/prepare_sector_network.py (add_industry, where the oil/gas generators are added)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
    boundary:
      - variant: exogenous-border-volume
        rung: L1
        note: >
          Earth's home ground and the reason this card names both models. `export.h2export`
          is a list of TWh values expanded into a wildcard that reaches every sector-chain
          output; the profile, the port choice, the terminal store and the
          annual-total assertion all ship. Schumm's 264-run design is a config list plus
          the matching constraint. In eur this same variant is L4.
      - variant: priced-import-generator
        rung: L2
        note: >
          Nothing exists — `fuel-import-supply` is `absent` and fossil fuels arrive as
          unlimited fuel-priced Generators with no origin. But the pattern is small and
          eur's add_import_options is the template: a priced Generator (or a Link from
          the CO2 bus) on the target carrier bus inside add_industry. Localised edit, no
          new rule, no new data.
      - variant: volume-capped-import
        rung: L5
        note: >
          Requires both the import object (L2 above) AND a cap. Earth has no
          import-limit constraint; the generic pypsa `operational_limit` primitive is
          per-carrier and Generator/Store-only, so a multi-carrier cap spanning Links is
          a hand-written linopy constraint in extra_functionality.
      - variant: autarky-baseline
        rung: L0
        note: >
          The default for chemical carriers, and stronger than eur's: there is no green
          import surface to leave off. For the electrical boundary the ATK/ATKc opts
          token WORKS here (it is broken in eur at this ref), which matters because an
          exporting country's neighbours are usually outside the model anyway.
      - variant: stepped-supply-curve
        rung: L2
        note: >
          On the EXPORT side this is the more interesting direction: several export
          generators at increasing offer prices instead of one `endogenous_price`, giving
          a demand curve for the exported carrier rather than a single price point. An
          edit in add_export's endogenous branch.
      - variant: green-commodity-imports
        rung: L3
        note: >
          Import side is unbuilt (as priced-import-generator), and the binding
          constraint is DATA rather than code: regional industrial feedstock demand and
          per-tonne commodity prices for the study country. Duque-Perez exported HBI and
          steel from Morocco by supplying exogenous annual targets, which is the
          practical route.
      - variant: hourly-price-nested-model
        rung: L5
        note: >
          Nothing here consumes a border price time series in either direction, and
          earth's typical single-country scope means the neighbour model does not exist
          either. Harder than in eur, where the nested outer model is the standard
          workflow.
      - variant: endogenous-electricity-import
        rung: L3
        note: >
          The one variant where earth is structurally AHEAD, and the strongest reason to
          choose it for an exporter-side study: its cutout, land-eligibility and GADM
          clustering machinery is global, so putting a non-European region in the LP with
          endogenous renewables is a data build (cutout for the region, `enable.build_cutout`),
          not new formulation. In eur the same variant is L5 because the resource stack
          is European.
      - variant: soft-linked-supply-curves
        rung: L5
        note: >
          Note the direction: earth is the natural SUPPLIER-side model, so the honest
          composition is to run earth as the exporter and feed its levelised costs into
          eur — which is exactly what Schumm and Duque-Perez do for Morocco and what
          TRACE does generically. Either way the coupling code and the harmonisation of
          cost/weather assumptions across the two models is bespoke.
      - variant: multi-carrier-supply-chain
        rung: L5
        note: >
          Earth gets you further toward Hampp than eur does — global potentials, real
          ports, a sector chain covering H2/NH3/methanol — but the shipped export is
          H2-only, transport beyond the border is not modelled at all, and nothing
          computes a levelised delivered cost. Nine parallel chain models remain a
          bespoke build.
    where:
      - change: "the export bus, links, store and the exogenous-vs-endogenous boundary object"
        anchor: "rule add_export -> scripts/add_export.py::add_export"
        provenance: "scripts/add_export.py:add_export; Snakefile:add_export"
      - change: "the export volume and its temporal profile"
        anchor: "scripts/add_export.py::create_export_profile, fed by rule build_ship_profile and the {h2export} wildcard"
        provenance: "scripts/add_export.py:create_export_profile; Snakefile:build_ship_profile"
      - change: "which ports may export"
        anchor: "rule prepare_ports -> export_ports.csv, via filter_ports or data/custom/export_ports.csv; then add_export.py::select_ports"
        provenance: "scripts/prepare_ports.py:filter_ports; scripts/add_export.py:select_ports"
      - change: "certification / temporal-matching scope over the export volume"
        anchor: "scripts/solve_network.py::set_h2_colors and ::extra_functionality"
        provenance: "scripts/solve_network.py:set_h2_colors; scripts/solve_network.py:extra_functionality"
      - change: "a priced import supply object (the absent half)"
        anchor: "scripts/prepare_sector_network.py::add_industry, where the unlimited oil/gas Generators are added"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "export volume sweep fan-out"
        anchor: "export.h2export -> the {h2export} wildcard, constrained in Snakefile wildcard_constraints"
        provenance: "Snakefile:h2export; config.default.yaml:h2export"
    data_dependencies:
      - input: "export port locations (World Port Index, or a user CSV)"
        required_for: "exogenous-border-volume, multi-carrier-supply-chain"
        availability: >
          must be built, and `rule prepare_ports` DOWNLOADS the World Port Index live
          from msi.nga.mil — flag it before running under zygon's no-downloads rule.
          The default `filter_ports` then keeps only the largest harbour size-class per
          country and `select_ports` drops duplicates per GADM region, so the default
          port set is coarse; if no port resolves at all, add_export silently makes
          EVERY H2 bus an export node. Supply data/custom/export_ports.csv for anything
          siting-sensitive.
      - input: "regional cutout + land eligibility for the exporting region"
        required_for: "endogenous-electricity-import, multi-carrier-supply-chain"
        availability: >
          region-dependent, built per region via enable.build_cutout — global coverage
          is the point of earth, and this is why an exporter-side study belongs here
          rather than in eur. Check cookbooks/pypsa-earth/data_quality for the country's
          grade before promising it.
      - input: "per-tonne prices and regional demand for green commodities (HBI, steel, NH3, MeOH)"
        required_for: "green-commodity-imports"
        availability: >
          absent — no commodity price or industrial-feedstock-demand data ships for
          non-European regions. Duque-Perez supplied exogenous annual national targets
          instead of prices, which is the workable substitute.
      - input: "regional technology costs and WACC for the exporting country"
        required_for: "exogenous-border-volume, endogenous-electricity-import"
        availability: >
          exists by default via technology-data, but the values are European-centric and
          the cost of capital dominates a levelised export cost — Hampp's 5% vs 10% WACC
          comparison moved his ranking of carriers. Treat a non-European WACC as an
          assumption to sign off explicitly with the user.
    cost_profile:
      solves: >
        One solve per `{h2export}` value, times the other wildcards. Schumm: ~264 runs
        (export volumes x four regulation regimes x sensitivities). Duque-Perez: a
        handful of scenarios crossed with weather years and WACC levels. The volume
        sweep is the cheap dimension; the regulation/matching dimension is what
        multiplies it.
      relative: >
        A single export run costs about the same as the base sector-coupled run — one
        bus, a few links, one store, one load. But earth base cases are usually much
        smaller than eur's (one country, 10-20 nodes), so a 20-point volume sweep here
        is comparable to a couple of full eur solves. This is the practical reason
        exporter-side studies live on earth.
      note: >
        Two earth-specific traps that cost runs rather than solve time.
        `create_export_profile` RAISES a ValueError if the resampled profile's annual
        total misses the wildcard by more than 0.001 TWh, so coarse `sopts` resampling
        can fail the rule outright — validate the profile at the intended temporal
        resolution before launching a sweep. And `export.store: true` with
        `store_capital_costs: no_costs` is the shipped default, which gives free
        terminal storage and makes every export volume look cheaper and smoother than it
        is; flip it before quoting an export cost.
    verifies:
      - variant: exogenous-border-volume
        check: "abs(n.loads_t.p_set['H2 export load'].mul(n.snapshot_weightings.generators, axis=0).sum() - float(h2export) * 1e6) < 1e3"
        over: run
        note: >
          Confirms the annual export actually equals the wildcard. add_export resamples
          the profile to the run's snapshots, and although create_export_profile asserts
          this at build time, a later temporal-aggregation step can silently rescale it —
          which would make the whole volume sweep measure the wrong x-axis.
      - variant: exogenous-border-volume
        check: "len(n.links.index[n.links.index.str.contains('export')]) >= 1 and 'H2 export bus' in n.buses.index"
        over: run
        note: >
          The export chain is off by default in the sense that it only exists if
          add_export ran. If the port selection found nothing, add_export logs and makes
          every H2 bus an export node — the run succeeds with a very different, and much
          more permissive, geography than intended.
      - variant: priced-import-generator
        check: "n.generators.query('carrier in [\"oil\",\"gas\"]').p_nom_extendable.all()"
        over: run
        note: >
          Diagnostic for the absent import surface: fossil supply here is unlimited
          extendable Generators, i.e. an implicit import with no volume, origin or
          terminal. If this is true, the run has no import representation at all and any
          import-dependence claim about it is unfounded.
      - variant: exogenous-border-volume
        check: "not config['sector']['hydrogen']['set_color_shares'] or any('export' in i for i in n.model.constraints)"
        over: run
        note: >
          Guards the certification-scope pitfall. `set_h2_colors` builds its constraint
          over domestic H2 loads only, so enabling colour shares in an export study
          leaves the exported hydrogen unregulated — the run succeeds and the regulated
          scenario is indistinguishable from the unregulated one.
