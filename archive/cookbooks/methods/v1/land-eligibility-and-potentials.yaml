id: land-eligibility-and-potentials
title: "Land eligibility and renewable potentials (GIS exclusion + weather-to-power conversion)"
summary: >
  Turn weather reanalysis and land-cover rasters into two per-region numbers: an
  installable-capacity ceiling from eligible area times an allowed deployment density,
  and an hourly capacity-factor series from a turbine power curve or PV panel model.
question: >
  How much wind and solar can physically be built in each region, and what does the
  weather let it produce hour by hour?
aliases:
  - "land eligibility"
  - "land availability"
  - "land-use availability"
  - "availability matrix"
  - "exclusion zones"
  - "eligible area"
  - "GIS exclusion analysis"
  - "renewable potentials"
  - "installable capacity potential"
  - "technical potential"
  - "capacity density / power density (MW/km2)"
  - "capacity factor time series"
  - "atlite"
  - "GLAES"
  - "GlobalEnergyGIS / GEGIS"
  - "resource classes / resource quality classes"
  - "supply curves"
  - "cutout"
  - "reanalysis-to-power conversion"
when_to_use:
  - "how much wind could my country actually build"
  - "what is the maximum solar capacity in this region"
  - "the model builds far more wind than would ever get planning permission"
  - "I want to restrict wind expansion to reflect public acceptance"
  - "how do I exclude national parks / protected areas from the siting"
  - "can we include floating offshore wind in deeper water"
  - "keep turbines away from shipping lanes and settlements"
  - "what water depth limit is assumed for offshore wind"
  - "the capacity factors look too high / too low versus what we actually measure"
  - "which weather year is the model using and can I change it"
  - "I want to model a different turbine or a tracking PV system"
  - "how do I run this for a country outside Europe"
  - "split each region into good and bad wind sites instead of one average"
  - "the good sites should be built first, not an average site"
  - "where does the model's rooftop-vs-utility solar split come from"
family: spatial-resolution
prevalence:
  papers: 49
  tier1: 33
  tier2: 16
  sweep_hits: 59
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 49 papers that state a land
    eligibility / potentials procedure with parameters — the 5th most prevalent method in
    the corpus. The regex screen returned 59; the surplus is papers that name "atlite" or
    "capacity factor" only in a data-availability or related-work sentence. No paper in
    this slice is flagged in _qa/EVIDENCE_INDEX.md's mention-only list. The role split is
    the tell: 41 of 49 are `routine-use`. This is infrastructure — almost nobody in the
    PyPSA literature re-derives it, they inherit Hörsch's 2018 defaults and at most
    override one density number. That is exactly why it is the highest-leverage silent
    assumption in the book: a 2 vs 3 vs 1.5 MW/km2 onshore density changes the answer more
    than most scenario choices, and 41 papers took it as given.
procedure:
  - step: >
      Build (or fetch) a CUTOUT: a rectangular, time-sliced subset of a reanalysis
      dataset, stored as netCDF with the weather features the later conversions need.
      ERA5 is the universal base (0.25-0.3 deg, hourly); SARAH-2/SARAH-3 satellite
      irradiance (0.05 deg, 30 min) is substituted for solar influx where available, and
      GEBCO supplies bathymetry. The cutout's spatial extent and year range fix, once and
      for all, which regions and which weather years the study can address.
    handle: "Cutout(...).prepare() -> era5.get_data / sarah.get_data"
    provenance: "atlite/cutout.py:def prepare; atlite/datasets/era5.py:get_data; atlite/datasets/sarah.py:get_data"
  - step: >
      Assemble the exclusion stack for one technology: a container of raster and vector
      layers, each either excluding or (inverted) restricting to its codes. The corpus's
      canonical stack is (a) land-cover codes — keep agriculture/forest/semi-natural for
      onshore wind, keep a wider set for PV; (b) protected areas (Natura 2000 in Europe,
      WDPA/protectedplanet globally); (c) a buffered distance rule around settlement
      codes, 1000 m in the reference implementation; (d) offshore only: a bathymetry
      threshold, a shore-distance buffer, and in later work a shipping-density threshold.
    handle: "atlite.ExclusionContainer(crs=, res=).add_raster / .add_geometry"
    provenance: "atlite/gis.py:ExclusionContainer; atlite/gis.py:def add_raster; atlite/gis.py:def add_geometry"
  - step: >
      Rasterise every region against that stack at the excluder resolution (100 m onshore,
      200 m offshore in the reference config) and reduce to an AVAILABILITY MATRIX
      A[region, x, y]: the eligible-area overlap of region r with cutout cell (x,y). This
      is the expensive step — it is a reprojection and per-region mask over a
      continental-scale raster, and it is what `nprocesses` parallelises.
    handle: "cutout.availabilitymatrix(regions, excluder) -> compute_availabilitymatrix"
    provenance: "atlite/cutout.py:availabilitymatrix; atlite/gis.py:compute_availabilitymatrix; atlite/gis.py:shape_availability"
  - step: >
      Convert weather to a per-cell capacity factor. Wind: extrapolate the reanalysis wind
      speed to hub height by a logarithmic/power law, then evaluate a named turbine power
      curve, optionally Gaussian-smoothed to represent within-cell speed spread. PV:
      compute solar position and surface orientation (fixed slope/azimuth, latitude-optimal,
      or single-axis tracking), split influx into direct/diffuse/ground components, then
      apply a panel efficiency model (Huld or Bofinger) that includes the temperature
      derate.
    handle: "cutout.wind(turbine=, ...) / cutout.pv(panel=, orientation=, tracking=)"
    provenance: "atlite/convert.py:def wind; atlite/convert.py:def pv; atlite/wind.py:extrapolate_wind_speed; atlite/resource.py:get_windturbineconfig; atlite/resource.py:windturbine_smooth; atlite/pv/orientation.py:SurfaceOrientation; atlite/pv/solar_panel_model.py:SolarPanelModel"
  - step: >
      Compute the per-region installable ceiling. atlite deliberately does NOT place
      individual turbines: p_nom_max = capacity_per_sqkm * (A @ cell_area). The whole
      siting question therefore collapses into ONE number per technology, the allowed
      deployment density, which the corpus reports anywhere from 1.0 to 10 MW/km2 onshore
      and 1.45 to 145 MW/km2 for PV depending on whether the number is a technical density
      or a technical density already multiplied by an area-utilisation fraction.
    handle: "capacity_per_sqkm * availability @ area"
    provenance: "scripts/build_renewable_profiles.py:capacity_per_sqkm"
  - step: >
      Build the deployment LAYOUT — the assumed spatial distribution of capacity inside a
      region — and aggregate the per-cell capacity factors against it into ONE per-region
      p_max_pu series. The house default is layout = capacity_factor * area * density, i.e.
      capacity proportional to local resource quality; the corpus also uses CF-squared
      weighting and uniform layouts. This weighting is a modelling choice, not a
      measurement, and it sets how optimistic the aggregated profile is.
    handle: "convert_and_aggregate(matrix=, layout=, per_unit=True)"
    provenance: "atlite/convert.py:convert_and_aggregate"
  - step: >
      (extension) Bin the cells of each region into RESOURCE CLASSES by capacity factor
      and emit one (p_nom_max, p_max_pu) pair per class, so the optimiser sees a step
      supply curve per region instead of one average site and builds the good sites first.
      The corpus spans 3 classes (percentile bands) to 100 (GEGIS supply curves).
    handle: "resource_classes -> class_masks"
    provenance: "scripts/build_renewable_profiles.py:resource_classes; scripts/build_renewable_profiles.py:class_masks"
  - step: >
      Attach the pair to the network as an extendable generator with p_nom_max as the
      capacity bound and p_max_pu as the dispatch bound, clipping tiny p_max_pu values to
      zero and dropping regions below a minimum potential so the LP is not polluted with
      near-useless generators.
    handle: "attach_wind_and_solar(...) with clip_p_max_pu"
    provenance: "scripts/add_electricity.py:attach_wind_and_solar; scripts/build_renewable_profiles.py:clip_p_max_pu"
  - step: >
      Reconcile the ceiling with what already exists and with policy: subtract existing
      vintages from p_nom_max so brownfield capacity consumes the land budget; make
      technologies that compete for the same land (fixed vs tracking PV) share one budget;
      and optionally impose per-period build-rate caps so the ceiling is not reached
      instantaneously.
    handle: "add_land_use_constraint / add_solar_potential_constraints / add_max_growth"
    provenance: "scripts/solve_network.py:add_land_use_constraint; scripts/solve_network.py:add_solar_potential_constraints; scripts/solve_network.py:add_max_growth"
  - step: >
      (extension) Bias-correct the resulting profiles against observation — a global
      multiplicative factor, a linear regression, or a quantile-to-quantile mapping onto
      metered generation. Reanalysis-derived profiles are known to be biased regionally,
      and every correction in the corpus is applied AFTER conversion, never inside it.
    handle: "correction_factor (scalar only)"
    provenance: "scripts/build_renewable_profiles.py:correction_factor"
  - step: >
      (extension, hydro) The same runoff field becomes reservoir/ROR inflow via a
      basin-routed potential-energy conversion, then is rescaled so the annual total
      matches reported national generation — the one place in this method where an
      observational anchor is applied by default rather than as an extension.
    handle: "cutout.runoff(normalize_using_yearly=) / cutout.hydro"
    provenance: "atlite/convert.py:def runoff; atlite/hydro.py:shift_and_aggregate_runoff_for_plants"
variants:
  - id: corine-natura-density-cap
    what: >
      The reference European recipe and the one 30+ corpus papers inherit verbatim: CORINE
      land-cover code whitelist + Natura 2000 exclusion + a settlement-distance buffer +
      a 50-60 m offshore depth limit, reduced to p_nom_max by a single MW/km2 density. The
      only knob most studies touch is that density.
    papers:
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
      - "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
  - id: availability-matrix-tooling
    what: >
      The generic, projection-agnostic formulation that made the above reusable: an
      ExclusionContainer of arbitrary rasters and geometries reduced to an availability
      matrix, with potential = eligible area x allowed density and NO explicit placement
      algorithm. Buys portability to any region and any exclusion layer; the price is that
      "siting" is one scalar density.
    papers:
      - "2021_Hofmann_atlite-renewable-power-potentials_JOSS.pdf"
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2023_Mockert_Dunkelflauten-Germany_MetApps.pdf"
      - "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
      - "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
      - "2023_Tries_Islanding-Green-Hydrogen.pdf"
      - "2025_Che_space-based-solar-power-european-decarbonization.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
      - "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
      - "2025_Franken_Geothermal-Market-Integration.pdf"
  - id: global-non-corine-landcover
    what: >
      The same procedure outside Europe, where CORINE does not exist: Copernicus Global
      Land Service 100 m land cover plus WDPA/protectedplanet protected areas, and a
      cutout that must be built or staged per continent rather than downloaded ready-made.
      Densities are re-derived from observed plants (4.6 MW/km2 PV, 3 MW/km2 onshore) and
      applied uniformly regardless of land-cover type — conservative in deserts.
    papers:
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
      - "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
      - "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
      - "2021_Kirli_PyPSA-meets-Africa-open-electricity-network.pdf"
  - id: offshore-depth-banded-and-shipping
    what: >
      Offshore refinement: subdivide offshore regions by EEZ or to a maximum area
      (~10,000 km2), split the resource into depth bands with different technologies
      (fixed-bottom below 60 m, floating 60-1000 m), exclude busy shipping lanes, and let
      investment cost vary with depth and distance. Buys a near-shore/far-shore
      distinction that a single offshore potential per country destroys.
    papers:
      - "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
      - "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
  - id: resource-class-supply-curves
    what: >
      Bin each region's cells by capacity factor and emit one generator per class, so the
      region presents a step supply curve. Corpus range: 3 percentile classes, 3 classes
      per country in a dispatch hindcast, up to 100 CF classes in GEGIS-based export
      studies. The fix for the average-site bias that aggregation otherwise bakes in.
    papers:
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
  - id: acceptance-restricted-potential
    what: >
      Deliberately shrink the geographic ceiling to represent public acceptance or
      observed build rates rather than physics: sweep onshore potential from 0-100% of the
      geographic limit, cut utility PV land to one third, or set onshore density to
      1.0-1.5 MW/km2. Cheap to do and among the most consequential single assumptions in
      the corpus.
    papers:
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
  - id: profile-bias-correction
    what: >
      Correct the converted profiles against metered output: a global scalar (x0.9 wind,
      x0.8 solar; PV -21%), a linear regression onto OPSD, or a quantile-to-quantile
      mapping. Distinct from the density knob — it fixes the TIME SERIES, not the ceiling,
      and only the scalar form is expressible in config.
    papers:
      - "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
      - "2023_Mockert_Dunkelflauten-Germany_MetApps.pdf"
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
  - id: non-vre-land-potentials
    what: >
      Reuse the land-cover raster to derive a potential for something that is not a
      turbine or a panel: afforestation and enhanced rock weathering area from CORINE
      classes, pit thermal storage siting from land-cover categories, EGS geothermal
      suitability, biomass from ENSPRESO. Same exclusion machinery, new target, and
      always a new script — this is where the method reaches beyond its config surface.
    papers:
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
      - "2025_Franken_Geothermal-Market-Integration.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
  - id: climate-projection-cutout
    what: >
      Replace reanalysis with downscaled climate-model output (EURO-CORDEX,
      CNRM-ALADIN63 under RCP4.5) so potentials and profiles reflect a future climate
      rather than a historical year. The exclusion side is unchanged; only the cutout
      source moves, which is precisely why it is a data problem and not a code one.
    papers:
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
literature:
  - paper: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
    tier: 1
    role: defines
    note: >
      The recipe 30+ later papers inherit. Fixes the European stack: CORINE codes for
      agricultural + forest/semi-natural for onshore wind, 1000 m minimum distance from
      urban fabric, Natura 2000 excluded, offshore capped at 50 m depth; ERA5 at 0.28 deg
      via atlite with Vestas V112 3 MW (onshore) and NREL 5 MW (offshore) power curves
      Gaussian-smoothed; and — the numbers that matter — 10 MW/km2 onshore technical
      density at 30% land fraction, 145 MW/km2 solar at 1% permitted fraction. Capacity is
      then distributed across Voronoi cells weighted by capacity factor x installable
      area. Note the two-number form (technical density x permitted fraction); later work
      collapses it to one effective density, which is why corpus densities look
      inconsistent until you check which convention is meant.
  - paper: "2021_Hofmann_atlite-renewable-power-potentials_JOSS.pdf"
    tier: 2
    role: defines
    note: >
      The tooling paper: what the harness should verify by name. Defines the Availability
      Matrix A[r,x,y] as the eligible-area overlap of region r with cell (x,y), computed
      from an ExclusionContainer of arbitrary rasters or vector geometries in arbitrary
      projections (CLC codes, protected-area polygons), and states the design decision
      that governs everything downstream: "atlite does not use an explicit placement
      algorithm ... but the product of available area and allowed deployment density".
      Capacity factors aggregate as phi_r(t) = sum_xy I_rxy lambda_xy phi_xy(t) with a
      user-supplied layout weighting lambda. Defaults ERA5 0.25 deg / 1 h, SARAH-2
      0.05 deg / 30 min. Credits GLAES (Ryberg 2018) as the inspiration.
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference demonstration that potentials resolution is a first-order result
      driver, not a preprocessing detail. Uses GLAES rather than atlite for the
      exclusions (nature reserves, cities, streets) with ERA5 for wind and SARAH-2 for
      solar, and decomposes capacity-expansion outcomes into a resource-resolution effect
      and a network-resolution effect at 37-1024 nodes: similar magnitude, OPPOSITE sign,
      very different technology mixes. The single most useful citation when a user asks
      whether a coarse model's potentials are good enough.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference for doing this outside Europe, and the source of pypsa-earth's
      defaults. Substitutes Copernicus Global Land Service land cover for CORINE and
      protectedplanet.net for Natura 2000, builds the eligible-area raster at 0.25 deg and
      area-weight-averages it down to the shapes, and re-derives socio-technical densities
      against 41 large PV plants and 7 utility wind farms: 4.6 MW/km2 PV, 3 MW/km2
      onshore, 2 MW/km2 offshore. Also rescales atlite hydro runoff to EIA reported
      national production. Explicitly flags that one density applied irrespective of land
      cover is conservative for desert regions.
  - paper: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    tier: 1
    role: extends
    note: >
      The offshore extension that has since landed in pypsa-eur's defaults. Three changes:
      exclude busy shipping lanes on top of nature reserves and depth; subdivide offshore
      regions by exclusive economic zone for near/far-shore differentiation; and split the
      resource at 60 m into fixed-bottom and floating, at 5 MW/km2 with an NREL 12 MW
      turbine. Site-specific investment cost from the Danish Energy Agency model as a
      function of depth, rotor diameter, hub height, specific power and farm size — the
      "depth-dependent offshore cost model" that pass 1 could not slug, and the piece that
      is still NOT in the config surface.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: extends
    note: >
      Pushes offshore spatial resolution to its useful limit: 66 offshore regions capped at
      ~10,000 km2 each, three offshore wind technologies with separate potentials AND
      separate profiles (near fixed-bottom 1-30 km <60 m, far fixed-bottom >30 km <60 m,
      floating >1 km <1000 m), ERA5 at 30 km with exclusions rasterised at 100 m. Adds
      piecewise wake losses by cumulative build-out (9% for the first 2 GW, 21% for the
      next 10, 32% beyond) — a potential-dependent derate with no handle in either model.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: extends
    note: >
      The most explicit audit of the exclusion stack in the corpus, and the source of the
      bias-correction variant. Documents the exact CORINE codes per technology (onshore
      wind: 12-32 included, 1-6 excluded with a 1 km buffer; PV: 1-32) and reports the
      resulting eligible fractions for Spain — 64.65% for onshore wind, 41.97% for PV —
      then applies a deliberately conservative 1 MW/km2 for public acceptance. Separately
      adds a quantile-to-quantile bias correction of the atlite profiles against observed
      generation, which is a shape correction the scalar `correction_factor` cannot express.
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: extends
    note: >
      Extends the machinery past electricity: derives four CDR land potentials from the same
      CORINE raster at 90-node resolution — afforestation from 60% of "transitional
      woodland/shrub" (15 Mha, 83 MtCO2/a), enhanced rock weathering from 20% of arable land
      filtered to regions with mean annual temperature >= 10 C (14 Mha, 43 MtCO2/a), biochar
      from 20% of arable land (23 Mha, 30 MtCO2/a), perennialisation from JRC ENSPRESO
      first-generation biofuel cropland (21 Mha, 43 MtCO2/a). The template for "use the
      land raster for a non-VRE potential": a climate filter plus a utilisation fraction.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Pre-atlite ancestor: Natura 2000 + CORINE exclusion with the Aarhus renewable atlas
      (40x40 km NCEP, 2012) for profiles, and densities of 2 MW/km2 wind / 1.7 MW/km2
      solar reached by scaling layouts until the first site saturates. Records the
      aggregation rule the whole family uses when clustering: sum the per-cell maxima,
      average the availability series with site-quality weighting.
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: routine-use
    note: "Same CORINE + Natura land-type restriction supplying per-node installable maxima on a 30-node European model; contributes no method content beyond confirming the stack was already standard by 2017."
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Useful because it states the two-number convention explicitly: 10 MW/km2 theoretical
      onshore of which 20% is used (2 MW/km2 effective), 145 MW/km2 theoretical solar of
      which 1% is used (1.45 MW/km2 effective). Offshore 50 m depth. Anyone comparing
      corpus densities needs this sentence.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      The acceptance-sweep precedent: per-country CORINE-2006 + Natura 2000 caps that
      explicitly include "likely public acceptance", then a policy sensitivity reducing
      onshore wind's cap from 100% down to 0% of the geographic potential while leaving
      offshore at the geographic limit. The template for turning a potential into a
      scenario axis.
  - paper: "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Two contributions to the periphery of the method: it swaps reanalysis for EURO-CORDEX
      climate projections while keeping the CORINE-2012/Natura exclusion unchanged (the
      climate-projection-cutout variant), and it applies a blanket -21% correction to PV
      capacity factors to match observation.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: "Natura 2000 + CORINE with the 20%-of-area wind / 1%-of-area PV convention and 50 m offshore depth, plus a 50/50 rooftop-vs-utility PV split at different costs — the origin of the rooftop share question users ask about."
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: "Land eligibility at CFSR raster-cell level with the same 20%/1% coverage ratios (2 MW/km2 wind, 1.5 MW/km2 PV) and 50 m offshore limit; PV bias-corrected against satellite data."
  - paper: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      The clearest statement of the crude bias correction: capacity factors from weather
      are uniformly scaled by 0.9 (wind) and 0.8 (solar) at every point in space and time
      to match historical production. Also substitutes registry-based capacity placement
      (Marktstammdatenregister, nearest-substation assignment) for the resource-weighted
      layout — a different answer to "where inside the region is the capacity".
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: routine-use
    note: "Inherits the CORINE-2012/Natura stack at 3 MW/km2 onshore and 1.45 MW/km2 PV as LP upper bounds; states plainly that the potentials were not varied in the study, which is representative of the 41 routine-use papers."
  - paper: "2021_Kirli_PyPSA-meets-Africa-open-electricity-network.pdf"
    tier: 2
    role: routine-use
    note: "Announces the intended atlite + land-cover + protected-area + GEBCO pipeline for Africa but shows no results from it; kept because it documents the design intent that became pypsa-earth's build_renewable_profiles."
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: routine-use
    note: "Cites atlite as the land-availability and profile tool for the underlying model; no independent procedure content."
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: "Standard renewable potentials, plus a land-requirement argument used to restrict ground-source heat pumps to rural regions — a reminder that land constraints in this family are not only about VRE."
  - paper: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    tier: 1
    role: routine-use
    note: "GLAES exclusions (nature reserves, cities, streets) bounding installable capacity from above and today's fleet from below; ERA5 0.281 deg wind, SARAH-2 0.05 deg solar, 80 m hub height, 35 deg south-facing PV. The concrete parameter set behind the clustering comparison."
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: routine-use
    note: "Uses ERA5-derived atlite capacity factors across many weather years; the potentials side is standard and unvaried, which is what makes the weather ensemble interpretable."
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: "Per-region onshore, offshore and PV maxima from the standard estimate, used unchanged across a large pathway ensemble; an instance of the acceptance-restricted framing applied as a fixed assumption rather than a sweep."
  - paper: "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
    tier: 1
    role: routine-use
    note: "Formalises the land-use bound as an explicit constraint G_vs <= G_vs^max in the disaggregation problem — useful for the wording of the constraint when it must be written by hand."
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: routine-use
    note: "Documents the conversion chain a user should be told about: ERA5 100 m wind extrapolated logarithmically to hub height through a Vestas V112 3 MW reference curve, PV from direct+diffuse shortwave at fixed 35 deg tilt with no tracking, over 40 years."
  - paper: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    tier: 1
    role: routine-use
    note: >
      The supply-curve extreme, and the main non-atlite alternative in the corpus:
      GlobalEnergyGIS on a 1 km2 grid excluding protected areas, unsuitable land, high
      population density and anything outside 400 km of GDP density 100,000 USD/km2,
      yielding 100 CF quality classes per technology per country at 1.45 MW/km2 PV and
      3 MW/km2 wind, up to 300 independent hourly series per exporting country.
  - paper: "2023_Mockert_Dunkelflauten-Germany_MetApps.pdf"
    tier: 1
    role: routine-use
    note: >
      Names the conversion models a user might want changed (Huld PV model, azimuth 180,
      slope 35; Vestas V112 3 MW onshore; NREL 5 MW offshore; ERA5 0.25 deg / 1 h), and is
      candid that assuming capacity is distributed proportionally to capacity factor is
      optimistic — hence a linear-regression correction to observed OPSD output.
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: routine-use
    note: "Per-technology eligible area computed inside each node's Voronoi cell, unvaried across the near-optimal sweep; the potentials are the fixed frame within which the ranges are reported."
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: "ERA5 + SARAH-2 with CORINE/Natura exclusions and offshore EEZ Voronoi regions, plus a restricted-onshore-wind sensitivity — the acceptance restriction used as a robustness check on a network result."
  - paper: "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
    tier: 2
    role: routine-use
    note: "ERA5-derived potentials via the pypsa-earth pipeline; inherits the Copernicus/protectedplanet stack without modification."
  - paper: "2023_Tries_Islanding-Green-Hydrogen.pdf"
    tier: 1
    role: routine-use
    note: >
      The degenerate case worth knowing: atlite used for two fixed points per country with
      NO exclusion layer at all, and spatial aggregation weighted by the SQUARE of the mean
      capacity factor to represent siting at the best resource. Shows how far the layout
      weighting alone can move a profile.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: "Cuts utility PV land to one third of the pypsa-eur default as a deliberate acceptance restriction — the clearest single-line example of the lever most users actually want."
  - paper: "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: "atlite feed-in profiles as standard machinery; no potentials content beyond confirming the default chain."
  - paper: "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: "Weather-dependent potentials and profiles for PV and onshore wind from the default chain, used as fixed inputs to a load-shifting study."
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: routine-use
    note: "CORINE-based aggregation of suitable land per reanalysis grid cell as the standard potential bound; no modification."
  - paper: "2025_Che_space-based-solar-power-european-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: "Standard land-eligibility filters on ERA5 2020, with hydro pinned at p_nom_max = p_nom — the routine way to say a technology has no expansion potential."
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: routine-use
    note: "Keeps atlite land eligibility but drives it with downscaled climate projections (CNRM-CERFACS-CM5 / CNRM-ALADIN63, RCP 4.5) instead of a historical reanalysis year; hydro fixed. The practical instance of the climate-projection-cutout variant."
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: "Spatially heterogeneous EGS suitability introduced as a per-region potential from external geological data — the non-VRE land potential pattern applied to geothermal."
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: "Land-use-class and protected-area restricted expansion as inherited defaults in a large sector-coupled network study."
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Two things worth quoting to users. First, a deliberately restrictive 1.5 MW/km2
      onshore density justified by observed low European build rates — the corpus's
      most explicit reality-check on the default 3. Second, it replaces GEGIS with atlite
      for the non-European exporting countries, i.e. the global variant used in anger.
  - paper: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    tier: 1
    role: routine-use
    note: "The pypsa-earth chain stated plainly: atlite with ERA5 + SARAH-2 for time series and Copernicus Global Land Service at 100 m for land availability, at 14-node resolution — the reference sentence for a non-European study."
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: "CORINE + Natura 2000 land availability as inherited defaults; representative routine use in a national industry study."
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      A Boolean overlay of exclusion layers (forest, urban, cropland, water, snow, mixed)
      plus non-land criteria the standard stack cannot express: a minimum suitability
      score, within 30 km of the grid, and PtX restricted to coastal or low-water-stress
      areas. Results binned into three percentile resource classes (top 5% / next 10% /
      remainder) — the cleanest small-N instance of resource-class supply curves.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: "atlite potentials and profiles with land-use restrictions as inherited defaults."
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: "Same inherited atlite chain; relevant here only because price formation is read off a system whose VRE ceiling came from this method."
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: "Regional biomass potentials from JRC ENSPRESO restricted to residues — a land-derived potential that enters the same p_nom_max/e_nom_max slot but comes from a spreadsheet, not a raster."
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: routine-use
    note: "Node-wise land-use and climate restrictions on afforestation, biochar, ERW and perennialisation capacities, inherited from the CDR extension; confirms those potentials are treated as hard per-node bounds."
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: routine-use
    note: >
      The most operationally specific citation in the slice, and the one to use when a user
      asks whether profiles are trustworthy: atlite v0.4.1, 3 resource classes per
      technology per country, ERA5 for wind and hydro inflow, SARAH3 for solar. Identifies
      a known ERA5 wind-speed bias over the Iberian Peninsula as a cause of Spanish
      dispatch discrepancies — a concrete regional failure of the conversion step.
  - paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    tier: 1
    role: routine-use
    note: "Siting eligibility for pit thermal storage from land-cover categories (arable, pasture, shrub/herbaceous, sparsely vegetated) — the exclusion raster reused for a storage technology."
pitfalls:
  - pitfall: >
      The entire siting question is one scalar. Because potential = eligible area x
      capacity_per_sqkm with no placement algorithm, the ceiling is linear in a number the
      corpus reports across a 7x range for onshore wind (1.0 to 10 MW/km2) — and half those
      numbers are technical densities awaiting an area-utilisation multiplier while the
      other half already include it. Comparing two studies' potentials without checking
      which convention each used is meaningless.
    evidence: "2021_Hofmann_atlite-renewable-power-potentials_JOSS.pdf"
    note: >
      Always state the density AND whether a land-use fraction is already folded in. When a
      user says "the model builds too much wind", the first question is the density, not the
      cost assumption. 2018_Brown states the two-number convention explicitly; quote it.
  - pitfall: >
      Physical eligibility is not permittable land. The default stack encodes land cover,
      protection status and distance, none of which capture planning refusal, local
      opposition or grid-connection queues. The corpus's own practitioners routinely
      override it downward — to 1.5 MW/km2, or to one third of the default PV area — and
      say so in the text.
    evidence: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    note: >
      Treat the geographic potential as an upper bound to be restricted, not as a forecast.
      Offer the acceptance-restricted-potential variant as a sweep (0-100% of geographic
      potential) rather than picking one number silently.
  - pitfall: >
      Aggregating a region to one generator assumes the whole region has the region's
      AVERAGE resource, and the default layout weighting (capacity proportional to local
      capacity factor) then quietly makes it better than average. Resource resolution and
      network resolution bias expansion results by similar magnitudes in OPPOSITE
      directions, so a coarse model can look right by cancellation and be wrong in mix.
    evidence: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    note: >
      Use resource classes (3 is usually enough) before adding buses. It is far cheaper
      than clustering finer and it targets the actual bias.
  - pitfall: >
      Reanalysis-derived profiles carry regional biases that survive into dispatch and
      price results, and the standard remedy is a blunt scalar. A known ERA5 wind-speed bias
      over the Iberian Peninsula shows up directly as Spanish dispatch error; historical
      practice has been to multiply wind by 0.9 and solar by 0.8 everywhere.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      A scalar correction_factor fixes the annual energy and leaves the SHAPE wrong. If the
      question is about hours (prices, Dunkelflaute, hourly matching), use the
      profile-bias-correction variant with a quantile mapping, and validate against metered
      generation for the specific region before promising anything hour-resolved.
  - pitfall: >
      The cutout silently fixes the study's geography and weather years. Its bounding box
      and year range are decided before any modelling, and a region partly outside it
      produces a warning, not an error — so profiles can be built from incomplete weather
      coverage and look plausible.
    evidence: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    note: >
      Check cutout extent against the study region before anything else, and check the log
      for partial-coverage warnings. Changing the weather year is cheap only if the cutout
      already spans it; otherwise it is a data build with an API key.
  - pitfall: >
      Land is shared but the model does not know it unless told. Fixed and tracking PV
      compete for the same hectares, existing turbines already occupy part of the ceiling,
      and CDR/biomass/thermal-storage land potentials derived from the same raster classes
      can double-count the same arable land across separate potential calculations.
    evidence: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    note: >
      When a study adds a second land-consuming technology, check whether a shared-budget
      constraint exists for it (pypsa-eur has one for solar/solar-hsat and one for
      vintages; nothing generic). Otherwise the sum of potentials exceeds the land.
  - pitfall: >
      Offshore, a single potential per country hides the economics. Depth drives both
      technology choice and cost, distance drives cable cost, and cumulative build-out
      drives wake losses of 9-32% — none of which a per-country offshore ceiling can
      express, and the cost side of it is not in any config surface.
    evidence: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    note: >
      For any offshore-focused question use depth-banded technologies and finer offshore
      regions. Be explicit that depth-dependent capital cost and build-out-dependent wake
      losses remain bespoke code in both models.
requires_methods:
