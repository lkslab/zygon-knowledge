id: model-validation-and-backtesting
title: "Model validation and backtesting (hindcasting against observed reality)"
summary: >
  Run the model over a period for which reality is known, then score its output
  against the observed record — dispatch, prices, flows, grid statistics — and
  correct the inputs whose bias the score exposes.
question: >
  Does this model resemble the real system, and by how much is it wrong where I can
  actually check?
aliases:
  - "hindcast"
  - "hindcasting"
  - "backcast"
  - "backcasting"
  - "backtest"
  - "model validation"
  - "technical validation"
  - "benchmarking against historical data"
  - "sMAPE / MAE / RMSE scoring"
  - "bias correction"
  - "quantile mapping"
  - "quantile-to-quantile (Q2Q) transformation"
  - "calibration to observed data"
  - "line tuning factor"
  - "goodness of fit"
when_to_use:
  - "how do I know the model is right"
  - "can it reproduce last year"
  - "validate the model against real data before I trust the scenario"
  - "the modelled prices look nothing like the actual market"
  - "the model underestimates wind generation compared to what we actually produced"
  - "prove this grid model matches the real network"
  - "how accurate is this model"
  - "calibrate the model to my system before running scenarios"
  - "my regulator will ask for a backtest"
  - "compare modelled and historical generation mix"
family: tooling-and-reproducibility
prevalence:
  papers: 5
  tier1: 3
  tier2: 2
  sweep_hits: 0
  basis: >
    This slug was ADDED AT PASS 1.5 (see _qa/RECONCILE.md), so it has no pass-1
    evidence slice: the four papers that make validation their method were logged
    under EVIDENCE.yaml:unmatched_methods as "hindcast-validation-smape",
    "quantile-to-quantile renewable profile bias correction" and "data-driven network
    capacity calibration (daily line-tuning)". sweep_hits is 0 because the pass-0
    regex was DEFECTIVE, not because nobody does this: SLUGS.yaml carried no
    validation pattern at all and the exploratory validation/backtest key returned
    zero papers, which read as "absent from the corpus" when the truth was "the
    screen cannot see it". The replacement regex is now in SLUGS.yaml. Hand count is
    5: the four RECONCILE papers plus 2018_Hoersch_PyPSA-Eur, whose entire Section 3
    is a four-part validation (circuit lengths vs ENTSO-E, kernel-k-means topology
    comparison, potentials vs literature, peak-hour LOPF feasibility) — the
    EVIDENCE_INDEX flags its kernel-k-means claim as mention-only for the CLUSTERING
    card precisely because the technique belongs here, and that judgement is
    accepted. Excluded after checking: 2021_Hofmann_atlite JOSS, which CITES
    validation studies (Andresen 2015, Staffell & Pfenninger 2016) in its reference
    list but performs none — a mention, not a use. The corpus number is genuinely
    small and that is the finding: five of a hundred PyPSA papers check the model
    against reality, and four of the five do it as a side-effect of introducing a new
    dataset or region rather than as the study's question.
procedure:
  - step: >
      Choose the target: which observed quantity you will be scored against, and where
      the observation actually comes from. The corpus uses ENTSO-E Transparency
      day-ahead prices and actual generation, national TSO load, Elexon balancing
      volumes, ENTSO-E's transmission inventory, and published capacity-factor studies.
      This step decides everything downstream, and it is the one the model cannot help
      with — no observed series ships in either repo except the demand record itself.
    handle: null
    provenance: null
  - step: >
      Pin the historical period on every axis at once, not just the snapshot window:
      snapshots, the weather cutout year, the demand year, the fleet as it stood, and
      renewable capacities as installed that year. A hindcast that runs 2022 weather
      against a 2030 fleet is not a hindcast.
    handle: "snapshots.start/end + atlite.cutouts.<name>.time + load.fixed_year + electricity.powerplants_filter + electricity.estimate_renewable_capacities.year"
    provenance: "scripts/_helpers.py:get_snapshots; scripts/build_electricity_demand.py:fixed_year; scripts/add_electricity.py:estimate_renewable_capacities"
  - step: >
      Remove the investment decision. Capacities must be what existed, not what the
      optimiser would have built, or you are validating a counterfactual. Two routes:
      empty every extendable_carriers list so the expansion LP degenerates to dispatch,
      or run the expansion and then re-solve with capacities fixed from it.
    handle: "electricity.extendable_carriers all-empty, or n.optimize.fix_optimal_capacities()"
    provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
  - step: >
      Replace assumed input prices with the observed record. Karkossa's static-vs-dynamic
      contrast is the corpus's single cleanest result on this: swapping flat fuel and CO2
      assumptions for the actual daily/weekly series is what moves the score most, far
      more than the foresight choice does.
    handle: "conventional.dynamic_fuel_price: true + the Ept opts token (costs.emission_prices.dynamic)"
    provenance: "scripts/add_electricity.py:dynamic_fuel_price; scripts/prepare_network.py:add_dynamic_emission_prices"
  - step: >
      Constrain foresight to something an operator could have had. A whole-year perfect-
      foresight solve gives storage and hydro knowledge nobody had; a rolling window of
      one to two weeks is the corpus's compromise. See
      operational-dispatch-and-rolling-horizon for the window/overlap semantics.
    handle: "solving.options.rolling_horizon + horizon + overlap"
    provenance: "scripts/solve_network.py:optimize_with_rolling_horizon"
  - step: >
      Solve, and extract the modelled counterpart of the observed quantity. For prices
      this is the power-balance dual, i.e. n.buses_t.marginal_price — validating a price
      means validating a shadow price, with all the caveats on
      shadow-prices-and-marginal-values.
    handle: "n.buses_t.marginal_price; make_summary's prices / weighted_prices / market_values tables"
    provenance: "scripts/make_summary.py:calculate_market_values; scripts/make_summary.py:calculate_metrics"
  - step: >
      Score. The corpus's metric set is MAE (interpretable EUR/MWh), RMSE (punishes
      spikes) and sMAPE (comparable across years whose price levels differ by an order
      of magnitude), each computed at hourly, daily and weekly aggregation because the
      answer depends strongly on which. Nothing in either repo computes any of them.
    handle: null
    provenance: null
  - step: >
      Diagnose, then correct the INPUT the error points at rather than tuning the output.
      The corpus's three corrections: quantile-map simulated capacity factors onto the
      observed generation distribution; scale line ratings until modelled congestion
      volume matches the observed one; rescale hydro inflow to reported annual
      generation. Each is a different layer of the input chain.
    handle: "renewable.<tech>.correction_factor (scalar only); lines.s_max_pu; renewable.hydro.eia_norm_year"
    provenance: "scripts/build_renewable_profiles.py:correction_factor; scripts/prepare_network.py:set_line_s_max_pu; scripts/build_hydro_profile.py:eia_norm_year"
  - step: >
      Iterate the correction to a fixed point where the correction is a fitted parameter
      rather than a constant. Franken re-solves per day, adjusting the global line-tuning
      factor until modelled balancing volume matches the Elexon-observed
      congestion-flagged volume; Gallego-Castillo fits the Q2Q map once per country and
      technology and then applies it per Voronoi cell.
    handle: null
    provenance: null
  - step: >
      Report the residual honestly, naming what is structurally out of reach rather than
      absorbing it into the fit. Karkossa's own list: one bidding zone per country, fuel
      prices uniform across countries (so the Iberian exception is unrepresentable), no
      CHP, no unit commitment, no plant outages, lignite priced off a coal proxy.
    handle: null
    provenance: null
variants:
  - id: dispatch-and-price-hindcast
    what: >
      Fix capacities to a historical year, feed observed load, fuel and CO2 prices, solve
      the year (whole or rolling), and score modelled generation and/or nodal price
      against the observed series with sMAPE/MAE/RMSE. The reference variant, and the one
      users mean when they say "can it reproduce last year".
    papers:
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
  - id: profile-bias-correction
    what: >
      Correct simulated renewable capacity factors against observed generation. Two
      strengths: a scalar mean correction (what both models ship) or a quantile-to-
      quantile map g* = CDF_obs^-1(CDF_sim(g)), which matches the whole distribution and
      therefore fixes shape as well as level. Fitted at country level against the national
      observed series, then applied per Voronoi cell — the scale mismatch between fitting
      and application scale is the delicate part, and the normalisation scheme that
      handles it best differs between wind and solar.
    papers:
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
  - id: network-capacity-calibration
    what: >
      Tune transmission ratings until modelled congestion matches observed congestion,
      instead of trusting the thermal ratings. Franken's form: set boundary capacities
      from TSO thermal limits to fix RELATIVE magnitudes, then fit one global scalar
      line-tuning factor per DAY so modelled redispatch volume equals the
      congestion-flagged balancing volume Elexon reports for that day. The fitted scalar
      absorbs everything the network model gets wrong at once, which is the point and
      also the pitfall.
    papers:
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
  - id: topology-and-statistics-validation
    what: >
      Validate the built network as a DATASET, before any solve: total route and circuit
      length per country and per voltage level against the TSO/ENTSO-E inventory (Pearson
      rho, or mean absolute deviation per voltage class), line volume and cross-border
      capacity per NUTS region, and topology against an independently-built model. Cheap,
      needs no optimisation, and the only variant that can be run before the model is
      solvable at all.
    papers:
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
  - id: cross-model-differential-validation
    what: >
      Where no observation exists, substitute an independently-constructed model: run the
      same setup on two datasets and compare, or aggregate two networks onto a common
      cluster set and compare per-cluster quantities. Xiong's OSM-vs-GridKit run pair and
      Hoersch's kernel-k-means comparison against osmTGmod and ELMOD-DE. This validates
      ROBUSTNESS to a data choice, not agreement with reality — say so when reporting it.
    papers:
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
  - id: feasibility-stress-validation
    what: >
      The cheapest validation of all: solve one extreme historical hour (the observed
      European peak-load hour) with a load-shedding valve open, and read the shed volume
      and its location as a diagnostic of where the input data is wrong. Hoersch's
      20.4 GW of shedding at Paris and London was diagnosed as local network-assignment
      error, not a real adequacy finding — and the confirmation was that clustering the
      network away made it disappear.
    papers:
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
literature:
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: defines
    note: >
      The reference hindcast recipe for this family and the source of the metric set.
      Hourly dispatch for 2020-2024, 35 countries, 39 nodes, PyPSA-Eur v2025.07.0,
      electricity only, capacities fixed (powerplantmatching v0.7.1 at 2020 for
      conventional and hydro; IRENA per-country per-year for renewables), observed
      ENTSO-E/TSO load imposed exogenously, load shedding at 5000 EUR/MWh, no unit
      commitment. Three scenarios factorise the two design choices: static vs dynamic
      fuel/CO2 prices, and perfect foresight vs a 336-hour rolling window with NO
      overlap. Scored against ENTSO-E day-ahead prices with MAE, RMSE and sMAPE at
      hourly / daily / weekly aggregation. Headline numbers to quote to users:
      dynamic-prices-plus-rolling-horizon reaches 20.76% sMAPE on daily load-weighted
      European price; the static run is worst; hourly sMAPE reaches ~100% for the
      static run in some years; median weekly sMAPE for both dynamic variants is
      20-26%. The result users must hear first is that the price-input swap dominates
      the foresight choice.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: extends
    note: >
      Defines the profile-bias-correction variant. States plainly that PyPSA-Eur ships
      only a constant capacity-factor correction factor and a Gaussian power-curve
      filter, and that neither addresses UNDERestimation of wind — so it adds a
      quantile-to-quantile transform Q(g) = CDF_hist^-1(CDF_sim(g)) fitted on the
      national observed generation PDF and then applied to each Voronoi cell's hourly
      capacity factor. Because it is fitted end-to-end it corrects every error in the
      wind-to-power chain jointly without attributing any of them, which the paper
      names as the method's own limitation. Three normalisation schemes handle the
      country-vs-cell scale mismatch and are compared on bias and on RMSE at hourly,
      daily and weekly averaging; scheme 3 (each series by its own max) wins for wind
      and scheme 1 (installed capacity) for solar PV — i.e. the answer is
      technology-specific, and the fitted map is invalid if the turbine model or
      meteorological year changes.
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: extends
    note: >
      Defines the network-capacity-calibration variant, and is the corpus's only case of
      calibrating a network parameter to an observed BEHAVIOURAL quantity rather than to a
      reported physical one. Method M.7: ~300-bus GB grid from PyPSA-Eur with Line
      components replaced by Link (dropping KVL), boundary capacities scaled to NESO
      thermal limits across five critical boundaries (SSE-SP, SCOTEX/B6, SSHARN, FLOWSTH,
      SEIMP), then a global line-tuning factor fitted per day by iterating
      simulate-national-schedule -> re-dispatch on the nodal layout -> compare the
      resulting redispatch volume against Elexon congestion-flagged balancing volume, in
      order to make the FREQUENCY of congestion match reality. The paper is explicit that
      the thermal boundary limits therefore only set relative magnitudes and the fit is
      the driving force. Because the calibrated model is then used counterfactually
      (national vs zonal), it is the cleanest demonstration of why calibration matters:
      the whole result is a difference between two market designs that only exists in the
      hours the model says are congested.
  - paper: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for validating a network DATASET rather than a solve. Two steps,
      named "Technical Validation": (1) against ENTSO-E's 2023 transmission inventory —
      per-country total route and circuit length, with Pearson rho improving from
      0.9497/0.9862 (GridKit ENTSO-E-map grid) to 0.9636/0.9980 (OSM grid), plus line
      volume per NUTS1 (rho 0.9484) and cross-border capacity and line-crossing counts
      per NUTS1 border (rho 0.8491 / 0.8573), and a geo-referenced 50Hertz static grid
      model as a third reference; (2) a differential PyPSA-Eur run pair, identical except
      the grid, with expansion disabled and DLR off to isolate the grid's effect. Two
      transferable habits: it reports where agreement is WORSE (Sweden overestimated by
      both grids; outliers traced to buses sitting near region borders), and it warns
      that continent-aggregated statistics smooth errors out, so differences are shown
      regionally. Closes by stating that only TSOs can confirm correctness — the honest
      ceiling on this whole variant.
  - paper: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
    tier: 1
    role: canonical-use
    note: >
      The original PyPSA-Eur validation section, and the reason four of this card's five
      variants have a precedent inside the family. Section 3 runs four independent checks:
      circuit length vs ENTSO-E statistics per voltage level (MAE 15% at 220 kV, 7% at
      300 kV, 9% at 380 kV, with the deviation attributed to the ENTSO-E map being an
      artistic rather than geometric representation); a NEW kernel-k-means technique for
      comparing geo-located networks with different bus counts (kernel K = exp(-||a-b||^2
      / N) + nu * B^dagger, i.e. a radial basis function plus the pseudo-inverse of the
      admittance matrix as an electrical-distance term, bus weights balancing the
      networks' differing sizes, 80 clusters across PyPSA-Eur, osmTGmod and ELMOD-DE)
      whose own reported failure mode is instructive — at 80 clusters buses on distinct
      lines get joined and only per-cluster line VOLUME is robust, so 20-40 clusters is
      the usable range; renewable potentials against literature ranges; and a peak-hour
      LOPF whose 20.4 GW of load shedding is correctly read as a local network-assignment
      artefact rather than an adequacy result. Karkossa reports its own findings as
      consistent with this validation's successor (the 2019 dispatch validation in the
      PyPSA-Eur docs), including the same nuclear summer-overestimate /
      winter-underestimate pattern, plausibly from unmodelled planned outages.
pitfalls:
  - pitfall: >
      A fitted correction absorbs every upstream error at once, without attributing any
      of it. A quantile map that makes national wind generation match history is also
      silently compensating for wake losses, the wrong turbine curve, wrong installed
      capacity and reanalysis bias — so it cannot be transported to another turbine, year
      or region, and it will hide a genuine data bug rather than surface it.
    evidence: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    note: >
      Treat every fitted factor as scoped to the exact configuration it was fitted under,
      record that configuration alongside it, and re-fit rather than reuse. Report the
      pre-correction error too, so the size of what was absorbed is visible.
  - pitfall: >
      Calibrating to a BEHAVIOURAL observable is circular when the study's answer is that
      same behaviour. Fitting line ratings until modelled congestion volume equals
      observed congestion volume guarantees the congestion frequency is right, which is
      exactly the quantity a market-design counterfactual is most sensitive to.
    evidence: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    note: >
      Legitimate when the calibrated quantity is an INPUT to the question and the answer
      is a DIFFERENCE between two designs sharing the fit (which is how Franken uses it),
      not when the answer is the level of the calibrated quantity itself. State which
      case you are in before the run.
  - pitfall: >
      A good score can come from a wrong system. Karkossa's 2022 mix showed less gas and
      more coal than reality while prices tracked, and the gas error reverses sign in
      other years and countries; German biomass and nuclear capacities were underestimated
      in a direction that should have RAISED prices.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      Never score one variable alone. Report the generation mix per carrier alongside the
      price metric, and check that the error signs are consistent across years — a sign
      flip between years is a data problem, not a model property.
  - pitfall: >
      Shortening the foresight window does not monotonically improve realism, because the
      cyclic storage constraint is applied PER WINDOW. Two-week windows forced Norwegian
      reservoir hydro to return to its starting state fortnightly, destroying seasonal
      balancing and causing load shedding that reality did not have; Spain, with weaker
      hydro seasonality, was barely affected.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      The corpus's recommended fix — drop the cyclic constraint and impose a marginal
      water value as the storage opportunity cost — was NOT implemented in the paper, and
      is not implemented in either model. Expect it to be your work. Size the window
      against the seasonality of the system's largest store, not against a forecast
      horizon.
  - pitfall: >
      Metrics disagree with each other and with the aggregation level, so the reported
      number is a choice. Hourly sMAPE reached ~100% where weekly sMAPE was 20-26% on the
      same runs; RMSE and bias ranked the same set of quantile-mapping schemes
      differently.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      Fix the metric AND the aggregation before looking at any result, report at least
      two, and state which timescale the user's decision depends on. A single headline
      sMAPE is not a validation.
  - pitfall: >
      Continent- or country-aggregated agreement hides regional error, and a single
      correlation coefficient hides where the model is worst.
    evidence: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    note: >
      Score at the finest resolution the observation supports and show the residual map,
      not just the scalar. Name the specific outlier regions in the write-up — that is
      what makes a validation reusable by the next person.
  - pitfall: >
      Comparing two models is not validation. Two independently-built grids agreeing, or
      two clustered networks matching per cluster, bounds the sensitivity to a data choice
      and says nothing about whether either resembles the real network — which only the
      TSO can confirm.
    evidence: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    note: >
      Label cross-model-differential-validation as a robustness check, never as accuracy.
      If it is the only check available (common outside Europe), say that the model is
      unvalidated and that this is a lower bound on the uncertainty.
  - pitfall: >
      A validation-shaped diagnostic can be misread as a system finding. Peak-hour load
      shedding at Paris and London looked like an adequacy result and was a
      network-assignment artefact — confirmed by the shedding vanishing when short lines
      were unconstrained or the network was clustered.
    evidence: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
    note: >
      Before reporting any infeasibility or shortfall as physical, re-run at coarser
      spatial resolution. If it disappears, it was an assignment error. This test is cheap
      and both models support it as a config change.
requires_methods:
  - operational-dispatch-and-rolling-horizon
combines_with:
  - shadow-prices-and-marginal-values
  - price-formation-and-scarcity-rents
  - powerplant-matching-and-fleet-assembly
  - spatial-clustering-and-resolution
  - zonal-nodal-and-redispatch
  - weather-year-ensembles
  - linearised-optimal-power-flow
topics:
  - model-reproducibility
  - open-input-data-assembly
  - locational-electricity-markets
  - power-market-reform-spot-markets
  - non-expert-model-usability
pypsa_primitive:
  symbol: "pypsa/optimization/optimize.py:fix_optimal_capacities"
  pypsa_version: "0.30.3"
  exposed_by: >
    pypsa-eur, via rule solve_operations_network. NOT pypsa-earth, which has no
    operations-only rule and never calls it.
  reachable_via: >
    On pypsa-eur a config-and-target choice: request the `_op.nc` output. From a driver:
    n.optimize.fix_optimal_capacities() takes no arguments and, for every component with
    a nominal attribute, copies <attr>_opt into <attr> and sets <attr>_extendable to
    False — i.e. it is the third procedure step and nothing more.
  note: >
    The important half of this card has NO primitive. pypsa 0.30.3 ships the hindcast
    SETUP (fix_optimal_capacities, optimize_with_rolling_horizon) and the extraction side
    (pypsa/statistics.py, n.buses_t.marginal_price), but there is no scoring function
    anywhere in the library: no sMAPE, no MAE, no RMSE, no bias-correction or
    quantile-mapping helper. pypsa/consistency.py checks a network against ITSELF, not
    against reality. So the pypsa layer moves the run-setup steps down a rung and leaves
    steps 1, 7, 9 and 10 — target selection, scoring, iteration to a fit, and residual
    reporting — entirely as user code. Soft anchor: pypsa is a conda dependency, not a
    submodule, so this is pinned to a version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: operations-only-solve
        role: >
          the third procedure step as a dedicated rule — registry status `working`, and a
          rule pypsa-earth does not have at all
      - id: rolling-horizon-dispatch
        role: >
          the fifth step: limited-foresight windows, config-reachable and `working` here
      - id: hydro-inflow-normalization
        role: >
          the one input-correction-against-observed-statistics that ships turnkey: ERA5
          runoff rescaled to EIA annual generation, optionally capacity-corrected
      - id: nodal-marginal-prices
        role: >
          the modelled counterpart of an observed market price — the validation target in
          the corpus's defining paper is a power-balance dual
      - id: base-network-source
        role: >
          the object under test in topology-and-statistics-validation, and the switch that
          makes cross-model-differential-validation a config change (osm | tyndp |
          entsoegridkit)
      - id: load-shedding-voll
        role: >
          two roles: the feasibility valve a hindcast needs so an imperfect year still
          solves, and the diagnostic quantity in feasibility-stress-validation
      - id: weather-year-selection
        role: >
          the second step: any ERA5 year 1940-2024 is a snapshot-window move, so the
          historical period is free here
      - id: workflow-reproducibility
        role: >
          the neighbouring-but-different check: solving.check_objective hard-fails on
          objective drift, i.e. the model against ITS OWN past self rather than against
          reality
      - id: summary-outputs
        role: >
          where the modelled series to be scored comes out (prices, weighted_prices,
          market_values, metrics) — the extraction half, never the scoring half
      - id: fleet-retirement-filter
        role: >
          pins the fleet to the historical year via a DateIn/DateOut query plus
          custom_powerplants injection
    available:
      verdict: assemble
      how: >
        Everything the RUN needs exists, and the repo ships the configuration:
        config/examples/config.validation.yaml is a hindcast setup — run.name
        "validation", 37 clusters, opts 'Ept' (dynamic CO2 price), snapshots for the whole
        of 2019, a 2019-only ERA5 cutout, every extendable_carriers list EMPTY,
        powerplants_filter 'not (DateOut < 2019)', estimate_renewable_capacities.year
        2019, conventional.dynamic_fuel_price true, conventional.nuclear.p_max_pu pointed
        at data/nuclear_p_max_pu.csv (observed per-country nuclear availability
        2009-2024), biomass p_max_pu 0.65, hydro flatten_dispatch 0.01, lines.s_max_pu
        0.23, load_shedding enabled, horizon 1000 / overlap 48. That is Karkossa's
        published setup minus rolling_horizon (shipped as false) and minus the year. Note
        also rule build_fossil_fuel_prices (World Bank monthly commodity series) and rule
        build_co2_prices, which supply the observed input prices step 4 needs, and rule
        make_network_comparison, which plots per-country transmission line lengths between
        two networks — the closest thing in-repo to
        topology-and-statistics-validation, though it compares two PyPSA networks, not a
        network against a reported inventory.
      missing: >
        Steps 1, 7, 9 and 10 have no handle. There is no observed generation, price or
        flow series in the repo to score against — the ONLY observed series that ships is
        electricity demand (rule build_electricity_demand over OPSD / ENTSO-E / NESO
        actuals), and it is consumed as an input, never as a validation reference. There
        is no validation or scoring rule and no scripts/validate*.py at this ref: `ls
        scripts/ | grep valid` returns only scripts/lib/validation/, which is pydantic
        CONFIG-schema validation and unrelated. No sMAPE/MAE/RMSE anywhere. Bias
        correction exists only as a per-technology SCALAR (renewable.<tech>.correction_
        factor) plus atlite's Gaussian power-curve smoothing (renewable.<tech>.resource.
        smooth) — the corpus's finding is that a scalar cannot fix a distribution, so
        quantile mapping is new code and a new resource. And the hindcast's own validity
        is compromised on route B: the three silent defects in
        scripts/solve_operations_network.py documented on
        operational-dispatch-and-rolling-horizon (solve_kwargs discarded so the solve
        silently falls back to highs with no options; prepare_network called without
        rolling_horizon= so cyclic storage is never torn down — precisely Karkossa's
        Norway failure mode; extra_functionality absent entirely, dropping CO2 caps and
        reserves) all land on the operations re-solve. Prefer route A
        (config.validation.yaml's empty extendable_carriers) for any hindcast at this ref.
      provenance: "config/examples/config.validation.yaml:dynamic_fuel_price; scripts/solve_operations_network.py:fix_optimal_capacities; rules/build_electricity.smk:build_fossil_fuel_prices; rules/development.smk:make_network_comparison"
    levers:
      - key: "electricity.extendable_carriers"
        effect: >
          Empty every list (Generator/StorageUnit/Store/Link) and the expansion LP becomes
          a dispatch LP — route A to procedure step 3, and the route
          config/examples/config.validation.yaml takes. Cheaper than route B and free of
          solve_operations_network.py's defects.
        default: "Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]; Store: [battery, H2]; StorageUnit/Link empty"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: "conventional.dynamic_fuel_price"
        effect: >
          Swaps flat annual fuel-cost assumptions for the monthly World Bank commodity
          series built by rule build_fossil_fuel_prices. Per Karkossa this single flip
          moves the price score more than the foresight choice does.
        default: "false"
        provenance: "config/config.default.yaml:dynamic_fuel_price; scripts/add_electricity.py:dynamic_fuel_price"
      - key: "costs.emission_prices.dynamic"
        effect: >
          Observed CO2 allowance price time series instead of a constant, via
          add_dynamic_emission_prices. Also set by the `Ept` opts token, which is what
          config.validation.yaml uses; costs.emission_prices.rolling_window smooths it.
        default: "false"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_network.py:add_dynamic_emission_prices"
      - key: "load.fixed_year"
        effect: >
          Pins the demand series to a specific observed year and re-labels its index onto
          the snapshot year — the lever that decouples the demand year from the weather
          year, and the one that makes "observed load, counterfactual weather" possible.
        default: "false"
        provenance: "config/config.default.yaml:fixed_year; scripts/build_electricity_demand.py:fixed_year"
      - key: "conventional.nuclear.p_max_pu"
        effect: >
          Path to a per-country per-year availability CSV, read by column matching
          n.snapshots[0].year. data/nuclear_p_max_pu.csv ships observed nuclear
          availability for 2009-2024 — the generic conventional.<carrier>.<attr> mechanism
          means any observed availability series can be injected the same way.
        default: "'data/nuclear_p_max_pu.csv'"
        provenance: "config/config.default.yaml:nuclear; scripts/add_electricity.py:attach_conventional_generators; rules/build_electricity.smk:input_conventional"
      - key: "electricity.estimate_renewable_capacities.year"
        effect: >
          The year whose installed renewable capacity is reproduced. Must be moved with
          the snapshot window or the hindcast runs historical weather against a different
          fleet — the silent error Karkossa avoided by taking IRENA capacities per year.
        default: "2024"
        provenance: "config/config.default.yaml:estimate_renewable_capacities; scripts/add_electricity.py:estimate_renewable_capacities"
      - key: "electricity.powerplants_filter"
        effect: >
          pandas query on DateIn/DateOut fixing the conventional fleet as it stood.
          config.validation.yaml uses 'not (DateOut < 2019)'.
        default: "'(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)'"
        provenance: "config/config.default.yaml:powerplants_filter; scripts/add_electricity.py:attach_conventional_generators"
      - key: "lines.s_max_pu"
        effect: >
          Global scalar on every AC line rating — structurally Franken's global
          line-tuning factor, already a config key. The default 0.7 is an N-1 proxy, not a
          calibrated value; config.validation.yaml drops it to 0.23, which is a
          calibration-by-hand for the 37-cluster network.
        default: "0.7"
        provenance: "config/config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "renewable.onwind.correction_factor"
        effect: >
          Scalar multiplier on the capacity-factor field. The only profile bias correction
          in-repo, and per Gallego-Castillo a mean-only fix: it cannot correct the
          distribution's shape. Note the shipped values are already an uncalibrated
          judgement — offwind-* default to 0.8855, onwind and solar to 1.0.
        default: "1.0"
        provenance: "config/config.default.yaml:correction_factor; scripts/build_renewable_profiles.py:correction_factor"
      - key: "renewable.hydro.eia_norm_year"
        effect: >
          Rescales ERA5-runoff inflow to EIA reported annual generation for a chosen year;
          eia_correct_by_capacity additionally corrects for capacity change. The one
          calibration-against-observed-statistics that ships turnkey — the template for
          what a quantile-mapping resource would look like.
        default: "false"
        provenance: "config/config.default.yaml:eia_norm_year; scripts/build_hydro_profile.py:eia_norm_year"
      - key: "solving.check_objective.expected_value"
        effect: >
          Hard-fails the run if the objective drifts from a stored value beyond atol/rtol.
          NOT a validation against reality — a regression check of the model against its
          own past self. Worth setting for a hindcast so a data-version bump cannot
          silently change the score.
        default: "None (enable: false, atol: 1e6, rtol: 0.01)"
        provenance: "config/config.default.yaml:check_objective; scripts/solve_network.py:check_objective_value"
      - key: "electricity.base_network"
        effect: >
          osm | tyndp | entsoegridkit. Makes cross-model-differential-validation of the
          grid a one-key change: run the same setup twice and diff, which is exactly
          Xiong's second validation step.
        default: "'osm'"
        provenance: "config/config.default.yaml:base_network; scripts/base_network.py:entsoegridkit"
    assembly:
      - step: >
          Start from config/examples/config.validation.yaml rather than config.default.
          It already performs procedure steps 2, 3 and 4 and is the closest thing in the
          PyPSA family to a shipped hindcast. Retarget its year in FIVE places at once:
          snapshots.start/end, the atlite cutout name and its time range,
          powerplants_filter, estimate_renewable_capacities.year, and (if the demand year
          differs from the weather year) load.fixed_year.
        uses: [weather-year-selection, fleet-retirement-filter]
        config: "snapshots.start/end; atlite.cutouts; electricity.powerplants_filter; electricity.estimate_renewable_capacities.year; load.fixed_year"
        code: null
        provenance: "config/examples/config.validation.yaml:dynamic_fuel_price; scripts/_helpers.py:get_snapshots"
      - step: >
          Decide route A vs route B for fixing capacities. Route A — keep the example's
          all-empty extendable_carriers, so rule solve_network is itself the dispatch run.
          Route B — leave expansion on and request the `_op.nc` target from rule
          solve_operations_network, which calls fix_optimal_capacities(). Route A at this
          ref, because route B silently discards solver settings, never tears down cyclic
          storage, and drops extra_functionality (see
          operational-dispatch-and-rolling-horizon).
        uses: [operations-only-solve]
        config: "electricity.extendable_carriers (all lists empty)"
        code: null
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - step: >
          Turn on the observed input prices. dynamic_fuel_price pulls in rule
          build_fossil_fuel_prices; the Ept opts token (or costs.emission_prices.dynamic)
          pulls in rule build_co2_prices. Check the granularity against the observation
          you are scoring: these are MONTHLY commodity series with a rolling window, where
          Karkossa used daily gas/CO2 and weekly coal/oil — so the shipped series is
          coarser than the published hindcast's, and that gap is yours to close with a
          replacement CSV.
        uses: []
        config: "conventional.dynamic_fuel_price; costs.emission_prices.dynamic (or opts 'Ept'); conventional.fuel_price_rolling_window"
        code: null
        provenance: "rules/build_electricity.smk:build_fossil_fuel_prices; rules/build_electricity.smk:build_co2_prices"
      - step: >
          Set the foresight window. rolling_horizon with horizon in SNAPSHOTS (336 for
          Karkossa's two weeks at hourly; the example ships 1000 with overlap 48) — and
          overlap strictly less than horizon or pypsa raises. Read this card's
          cyclic-storage pitfall first: on a hydro-heavy region the window can make the
          score worse, not better.
        uses: [rolling-horizon-dispatch]
        config: "solving.options.rolling_horizon; solving.options.horizon; solving.options.overlap"
        code: null
        provenance: "scripts/solve_network.py:optimize_with_rolling_horizon"
      - step: >
          Keep the load-shedding valve open and price it deliberately. A hindcast on an
          imperfect fleet WILL have infeasible hours; Karkossa used 5000 EUR/MWh, whereas
          the repo default is 100000 EUR/MWh after the internal scaling. If the valve is
          the price-setter in any hour, that hour's price is your VOLL assumption, not a
          model result — filter those hours out of the score explicitly.
        uses: [load-shedding-voll]
        config: "solving.options.load_shedding.enable; solving.options.load_shedding.default_cost"
        code: null
        provenance: "scripts/solve_network.py:add_load_balance_components"
      - step: >
          Extract the modelled series. make_summary already emits prices,
          weighted_prices, market_values and metrics per run; for an hourly hindcast read
          n.buses_t.marginal_price directly and aggregate to the observation's zone
          definition with a demand-weighted busmap average.
        uses: [nodal-marginal-prices, summary-outputs]
        config: "solving.options.assign_all_duals"
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_market_values; scripts/make_summary.py:calculate_metrics"
      - step: >
          WRITE THE SCORER. No observed reference series and no metric function exists in
          the repo. New script + new rule: fetch or vendor the observed series (ENTSO-E
          Transparency for prices and actual generation per country), align timezone and
          resolution, and emit MAE / RMSE / sMAPE at hourly, daily and weekly aggregation
          plus a per-carrier generation comparison. This is the L4 core of the card. Model
          it on rule make_network_comparison, which is the existing precedent for a
          comparison rule with a plot output.
        uses: [summary-outputs]
        config: null
        code: "new scripts/validate_dispatch.py + a new rule in rules/postprocess.smk"
        provenance: "rules/development.smk:make_network_comparison; scripts/make_network_comparison.py:prepare_comparison_data"
      - step: >
          For profile-bias-correction, fit the quantile map outside the workflow (national
          simulated vs national observed generation, one map per technology, and pick the
          normalisation scheme per technology — the corpus's answer differs between wind
          and solar), then apply it inside build_renewable_profiles.py where
          correction_factor is currently applied as a scalar. The map becomes a new
          tracked resource, so this is L3 on the data side as well as L2 on the code side.
        uses: [renewable-potentials-land-eligibility]
        config: "renewable.<tech>.correction_factor (the scalar it replaces)"
        code: "scripts/build_renewable_profiles.py (at the correction_factor multiplication) + a new Q2Q resource"
        provenance: "scripts/build_renewable_profiles.py:correction_factor"
      - step: >
          For network-capacity-calibration, wrap the solve in a fitting loop over
          lines.s_max_pu (or a per-boundary scaling), scoring modelled redispatch or
          congestion volume against the observed one. The scaled quantity is already a
          config key, so the new code is the loop and the objective, not the model change.
          Two consequences to state up front: each fit iteration is a full solve, and if
          the fitted period is a day you are fitting once per day.
        uses: [operations-only-solve]
        config: "lines.s_max_pu"
        code: "new driver looping the solve; scripts/prepare_network.py:set_line_s_max_pu is where the value lands"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - step: >
          For topology-and-statistics-validation, extend rule make_network_comparison. It
          already attributes lines to countries by spatial intersection with
          country_shapes and plots per-country lengths for two networks — swap one network
          for a reported inventory table and you have Xiong's first validation step. Its
          config block (osm_network_release.compare_to.version) ships only in
          config/examples/config.osm-release.yaml, NOT in config.default.yaml, so the rule
          is reachable but its key must be supplied.
        uses: [base-network-source]
        config: "osm_network_release.compare_to.version (example config only, absent from config.default.yaml)"
        code: "scripts/make_network_comparison.py:get_lines_by_country"
        provenance: "scripts/make_network_comparison.py:get_lines_by_country; rules/development.smk:make_network_comparison"
    boundary:
      - variant: dispatch-and-price-hindcast
        rung: L4
        note: >
          The RUN is L1 and shipped: config/examples/config.validation.yaml plus a year
          swap. The SCORE is L4 — a new rule and script, plus an observed reference series
          the repo does not contain. Split the estimate accordingly when quoting this to a
          user: the model run is an afternoon, the validation harness is the project.
      - variant: profile-bias-correction
        rung: L3
        note: >
          Scalar correction is L0/L1 (renewable.<tech>.correction_factor, already a key,
          already non-1.0 for offwind). Quantile mapping is L3: a fitted CDF map per
          country and technology is a NEW tracked resource, and the observed national
          generation series it is fitted against is not in the repo. The application point
          in build_renewable_profiles.py is a one-line change, so the data is the binding
          constraint, not the code.
      - variant: network-capacity-calibration
        rung: L5
        note: >
          The scaled quantity is a config key (lines.s_max_pu), and dynamic_line_rating
          shows the per-line time-varying s_max_pu path exists. What is L5 is the fitting
          LOOP: an outer iteration that re-solves until a modelled congestion statistic
          matches an observed one, with the observed one supplied by the user. Franken
          fitted per day, so budget the solve count before promising it.
      - variant: topology-and-statistics-validation
        rung: L2
        note: >
          The cheapest variant here and the only one below L3, because rule
          make_network_comparison already does the geometry: per-country line attribution
          by spatial intersection, length aggregation, comparison plot. Point one side at
          a reported inventory table instead of a second network. The reported table is
          user-supplied but small — a CSV, not a dataset.
      - variant: cross-model-differential-validation
        rung: L1
        note: >
          Genuinely turnkey-adjacent: electricity.base_network switches between osm, tyndp
          and entsoegridkit, so Xiong's differential run pair is two runs of the same
          config under run.name/run.prefix isolation. Disable expansion and DLR as Xiong
          did to isolate the grid's effect, then diff the summaries.
      - variant: feasibility-stress-validation
        rung: L1
        note: >
          Set the snapshot window to the observed peak hour, enable load shedding, solve,
          read the shed volume per bus. Then re-run at coarser clustering to distinguish
          assignment artefact from genuine shortfall — both halves are config changes.
    where:
      - change: "the scorer: observed series in, MAE/RMSE/sMAPE out"
        anchor: "new scripts/validate_dispatch.py + a rule in rules/postprocess.smk, modelled on rule make_network_comparison"
        provenance: "rules/development.smk:make_network_comparison; scripts/make_network_comparison.py:prepare_comparison_data"
      - change: "quantile map replacing the scalar profile correction"
        anchor: "scripts/build_renewable_profiles.py -> the `correction_factor * func(...)` multiplication"
        provenance: "scripts/build_renewable_profiles.py:correction_factor"
      - change: "line-rating fitting loop"
        anchor: "lines.s_max_pu -> scripts/prepare_network.py::set_line_s_max_pu (the value's landing point); the loop is a new driver above the rule"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - change: "network-vs-reported-inventory comparison"
        anchor: "scripts/make_network_comparison.py::get_lines_by_country (swap one input network for an inventory table)"
        provenance: "scripts/make_network_comparison.py:get_lines_by_country"
      - change: "observed availability injected per carrier and country"
        anchor: "conventional.<carrier>.<attr> -> a CSV of country rows x year columns, resolved by rules/build_electricity.smk::input_conventional"
        provenance: "rules/build_electricity.smk:input_conventional; scripts/add_electricity.py:attach_conventional_generators"
      - change: "route-B defects that invalidate a hindcast run through solve_operations_network"
        anchor: "scripts/solve_operations_network.py -> the collect_kwargs(mode='single') return and the prepare_network(...) call"
        provenance: "scripts/solve_operations_network.py:collect_kwargs; scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "observed hourly day-ahead prices and/or actual generation per country (ENTSO-E Transparency, or national TSO for non-members)"
        required_for: dispatch-and-price-hindcast
        availability: >
          absent — nothing in the repo. The retrieve rules cover model INPUTS, not
          validation references. ENTSO-E Transparency needs an API token; treat acquiring
          it as a prerequisite to promising this variant.
      - input: "observed national renewable generation time series for the fitting year"
        required_for: profile-bias-correction
        availability: >
          absent for the fitting target; the fitted Q2Q map itself becomes a new tracked
          resource. Gallego-Castillo published Spain's maps for 2022 in the PyPSA-Spain
          repository, which is a template rather than a reusable artefact — the paper
          states the map is invalid under a different turbine or meteorological year.
      - input: "observed congestion / redispatch volume per settlement period"
        required_for: network-capacity-calibration
        availability: >
          absent, and jurisdiction-specific: Franken used Elexon's congestion-flagged
          balancing-market volumes, which exist for GB. Most countries publish nothing
          equivalent, so this variant does not port.
      - input: "reported transmission inventory (route/circuit length per country and voltage level)"
        required_for: topology-and-statistics-validation
        availability: >
          must be supplied but small — ENTSO-E's annual statistical factsheet, one CSV.
          Xiong notes it is INCOMPLETE (route lengths missing for BA, CH, GB; circuit
          lengths for ME, MK; UA and MD absent from the 2023 edition), so the score is
          over a subset of countries and the gaps must be named.
      - input: "an independently-built network for the same region"
        required_for: cross-model-differential-validation
        availability: >
          exists by default inside eur — electricity.base_network offers osm, tyndp and
          entsoegridkit. External references (osmTGmod, ELMOD-DE, a TSO static grid model)
          are per-region and mostly Germany-only.
    cost_profile:
      solves: >
        1 for topology-and-statistics-validation (0, in fact — no solve needed for the
        statistics half). 1 per hindcast year for dispatch-and-price-hindcast, which
        Karkossa ran 5 years x 3 scenarios = 15. 2 for
        cross-model-differential-validation. For network-capacity-calibration, 2 solves
        per fit iteration (schedule then re-dispatch) times iterations times fitted
        periods — Franken fitted per day, so a year is O(1000) solves.
      relative: >
        A hindcast is CHEAPER than the study it validates: no investment variables, so the
        LP is dispatch-only, and Karkossa ran full 8760-hour years at 39 nodes. Rolling
        horizon further decomposes it into windows that each solve in isolation. The
        expensive variant is the calibration loop, where the multiplier is the fitting
        period count, not the model size.
      note: >
        The real cost of this method is not compute, it is data acquisition and the
        scoring harness. Budget the ENTSO-E/TSO data work and the new rule explicitly, and
        note that a hindcast must run at the resolution the OBSERVATION has — nH averaging
        and TSAM segmentation, the usual affordability levers, are unavailable here
        because they destroy the hours you are being scored on.
    verifies:
      - variant: dispatch-and-price-hindcast
        check: "(n.generators.p_nom_extendable.sum() == 0) and (n.storage_units.p_nom_extendable.sum() == 0) and (n.links.p_nom_extendable.sum() == 0)"
        over: run
        note: >
          Any extendable asset left in the network means the run optimised capacity and
          the 'hindcast' is a counterfactual. This is the silent failure of route A: one
          forgotten list in extendable_carriers, and the run still succeeds.
      - variant: dispatch-and-price-hindcast
        check: "n.snapshots[0].year == n.snapshots[-1].year == int(observed_year)"
        over: run
        note: >
          Year misalignment between the snapshot window and the year being scored — the
          error that survives every other check because both series have 8760 rows and
          align positionally.
      - variant: dispatch-and-price-hindcast
        check: "n.generators.filter(like='load shedding', axis=0).pipe(lambda g: n.generators_t.p[g.index].sum().sum()) < 0.001 * n.loads_t.p_set.sum().sum()"
        over: run
        note: >
          More than 0.1% of demand shed means the hindcast's prices are largely a VOLL
          assumption, not a model result. Karkossa's Norway case is the worked example:
          the cyclic-storage-per-window interaction produced shedding reality did not
          have.
      - variant: profile-bias-correction
        check: "abs(n.generators_t.p_max_pu.mean().mean() - observed_mean_cf) < 0.02"
        over: run
        note: >
          The corrected fleet-mean capacity factor should land on the observed one. Failing
          this means the map was fitted at one scale and applied at another without the
          normalisation scheme the corpus warns about, or that it was fitted on a
          different technology's series.
      - variant: cross-model-differential-validation
        check: "len(ns) == 2 and ns[0].meta['electricity']['base_network'] != ns[1].meta['electricity']['base_network']"
        over: ensemble
        note: >
          Both runs used the same grid — the whole comparison is then a check of solver
          determinism. n.meta carries the full config, so this is directly readable.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: operations-only-solve
        role: >
          the method's third step — registry status `absent` here, and verified so: no
          operations rule, and `fix_optimal_capacities` does not appear anywhere in
          scripts/. This is the single biggest eur/earth gap on this card.
      - id: hydro-inflow-normalization
        role: >
          the one calibration-against-observed-statistics earth DOES ship, and it is
          arguably better exposed than eur's: renewable.hydro.normalization.{method:
          irena|eia|hydro_capacities, year} rather than eur's EIA-only key
      - id: nodal-marginal-prices
        role: "the modelled price to be scored; duals available on any solved network"
      - id: load-shedding-voll
        role: "the feasibility valve, and the diagnostic in feasibility-stress-validation"
      - id: weather-year-selection
        role: >
          the second step, and where earth's danger is: the demand year lives in a
          SEPARATE key (load_options.weather_year) from the snapshot window, so a hindcast
          can silently mix years here in a way eur cannot
      - id: solve-statistics
        role: >
          earth's advantage: rule make_statistics collects network topology, line lengths
          and renewable shares across runs — the emitting half of
          topology-and-statistics-validation, which eur has no equivalent of. It reports
          the model's own numbers only; no reference set is compared against.
      - id: workflow-reproducibility
        role: >
          `working`, but thinner than eur's: pixi.lock plus config, with no dataset-version
          registry and no objective-value regression check
      - id: summary-outputs
        role: "where the modelled series comes out; prices are a mean of nodal duals"
      - id: fleet-retirement-filter
        role: "pins the conventional fleet to the historical year by DateIn/DateOut query"
    available:
      verdict: assemble
      how: >
        The dispatch half can be assembled from config alone by the route-A pattern —
        empty every electricity.extendable_carriers list, pin snapshots and
        load_options.weather_year to the historical year, set powerplants_filter, and
        solve. Two calibration surfaces ship and are worth naming because they are BETTER
        exposed than eur's: renewable.hydro.normalization.{method,year} takes
        irena | eia | hydro_capacities rather than eur's EIA-only key, and
        renewable.solar.correction_factor ships at 0.854337 BY DEFAULT — a value the
        config comments derive by comparing uncorrected area-weighted full-load hours
        against Pietzcker et al. (2014), i.e. a literature-calibrated bias correction
        active out of the box, where eur's solar factor is 1.0. rule make_statistics
        (scripts/make_statistics.py) is the closest thing in either model to a validation
        report: it collects OSM topology stats, line lengths, renewable shares and
        computational metrics across runs. costs.country_specific_data pulls a
        region-specific technology-data directory, but only "" and "US" are supported.
      missing: >
        More than eur, and the gaps are different in kind. CODE: no operations-only rule
        and no rolling_horizon — `rolling_horizon` occurs in scripts/solve_network.py only
        inside a commented-out condition, so procedure step 5 (limited foresight) is L4
        here rather than L0, and step 3 has no dedicated path. No validation or scoring
        script; make_statistics reports the model's own numbers with nothing to compare
        them to. No dynamic fuel price and no dynamic CO2 price mechanism at all, so
        procedure step 4 — the step Karkossa found dominates the score — has no handle.
        DATA, and this is the harder blocker: earth has no observed demand series. Both
        load sources are MODELLED — load_options.source 'gegis' reads the
        GEGIS/SSP synthetic demand rasters, and the 'demcast' alternative reads a column
        literally named "Forecast load (MW)" from the DemandCast dataset. eur's hindcast
        rests on OPSD/ENTSO-E/NESO measured load; earth has no equivalent, so a hindcast
        outside ENTSO-E's footprint is validating a model against a model on the demand
        side before it starts. Finally solving.options.noisy_costs defaults to true here
        as in eur (a +/-1e-3 EUR/MWh marginal-cost jitter), which is harmless for
        capacities and unhelpful when the scored variable is a price dual.
      provenance: "scripts/build_demand_profiles.py:read_demcast_load; scripts/build_renewable_profiles.py:rescale_hydro; scripts/make_statistics.py:collect_network_osm_stats; scripts/solve_network.py:noisy_costs"
    levers:
      - key: "electricity.extendable_carriers"
        effect: >
          Empty every list to degenerate the expansion LP into dispatch — the only route
          to procedure step 3 here, since there is no operations rule to fall back on.
        default: "Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT]; Store: [battery, H2]; StorageUnit/Link empty"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: "load_options.weather_year"
        effect: >
          The demand year, SEPARATE from snapshots.start/end. Both default to 2013 and
          nothing enforces agreement, so this is the key that silently invalidates an
          earth hindcast. Set it and the snapshot window together, every time.
        default: "2013"
        provenance: "config.default.yaml:weather_year; scripts/build_demand_profiles.py:weather_year"
      - key: "load_options.source"
        effect: >
          gegis | ssp | demcast. Selects the demand dataset — and the honest reading of
          this key is that neither option is an observation: gegis is synthetic and
          demcast is a forecast. Tell the user which of the two they are validating
          against before running anything.
        default: "'gegis'"
        provenance: "config.default.yaml:source; scripts/build_demand_profiles.py:read_demcast_load"
      - key: "renewable.hydro.normalization.method"
        effect: >
          irena | eia | hydro_capacities — rescales ERA5-runoff inflow to a reported
          annual generation statistic. Better exposed than eur's equivalent and the one
          input-vs-observed calibration that is turnkey here; normalization.year picks the
          reference year.
        default: "'irena' (year: 2023)"
        provenance: "config.default.yaml:normalization; scripts/build_renewable_profiles.py:rescale_hydro"
      - key: "renewable.solar.correction_factor"
        effect: >
          Scalar on the solar capacity factor, shipped ACTIVE at 0.854337 with the config
          comments deriving it from a comparison against published full-load hours. The
          same key is commented out for onwind and offwind. Whatever you fit must be
          composed with this, not applied instead of it.
        default: "0.854337"
        provenance: "config.default.yaml:correction_factor; scripts/build_renewable_profiles.py:correction_factor"
      - key: "lines.s_max_pu"
        effect: >
          Global scalar on line ratings — the same structural handle as eur for
          network-capacity-calibration, applied in prepare_network.
        default: "0.7"
        provenance: "config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "solving.options.noisy_costs"
        effect: >
          Adds a small random jitter to marginal costs to break LP degeneracy. Turn it OFF
          for a price hindcast: the jitter is tiny but it is noise added directly to the
          variable being scored, and it makes the run non-reproducible across seeds.
        default: "true"
        provenance: "config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
      - key: "costs.country_specific_data"
        effect: >
          Redirects cost inputs to a country-specific technology-data directory. Relevant
          because a hindcast's prices are only as good as its marginal costs — but only ""
          and "US" are supported, and a mismatch with `countries` raises a warning rather
          than an error.
        default: "'' (empty)"
        provenance: "config.default.yaml:country_specific_data; Snakefile:country_specific_data"
      - key: "electricity.custom_powerplants"
        effect: >
          Injects a user-supplied plant table, the practical route to a
          nationally-reported fleet where powerplantmatching's coverage outside Europe is
          thin. Check the data_quality book's per-country grade before assuming the
          default fleet is hindcastable.
        default: "false"
        provenance: "config.default.yaml:custom_powerplants; scripts/add_electricity.py:attach_conventional_generators"
    assembly:
      - step: >
          Check the data-quality grade for the country FIRST, before any config work. A
          hindcast is the one method whose feasibility is decided entirely by input data
          quality, and earth's blocker is data rather than code. Specifically: is there an
          observed demand series (there is none in-repo), an observed price or generation
          series, and a plant fleet good enough that fixing it to a historical year is
          meaningful.
        uses: [fleet-retirement-filter]
        config: "countries; electricity.custom_powerplants"
        code: null
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          Align the year in THREE places, not two: snapshots.start/end, the atlite cutout,
          and load_options.weather_year. eur folds the demand year into one key
          (load.fixed_year); earth splits it, and nothing cross-checks them.
        uses: [weather-year-selection]
        config: "snapshots.start/end; atlite.cutouts; load_options.weather_year"
        code: null
        provenance: "scripts/build_demand_profiles.py:weather_year"
      - step: >
          Empty every electricity.extendable_carriers list. There is no
          fix_optimal_capacities path here, so this is the only route to a fixed-capacity
          run, and it must be verified rather than assumed — see `verifies` below.
        uses: [operations-only-solve]
        config: "electricity.extendable_carriers"
        code: null
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          Turn noisy_costs off, keep load shedding on (default 100, in EUR/kWh here rather
          than eur's nested block), and record the shedding volume as part of the result
          rather than discarding it.
        uses: [load-shedding-voll]
        config: "solving.options.noisy_costs: false; solving.options.load_shedding"
        code: null
        provenance: "scripts/solve_network.py:get_load_shedding_capacity; scripts/solve_network.py:noisy_costs"
      - step: >
          For limited foresight, write it: no config key exists. Per
          operational-dispatch-and-rolling-horizon this is a new script that loads the
          prepared network, sets state_of_charge_cyclic / e_cyclic to False, and calls
          n.optimize.optimize_with_rolling_horizon(...) — pypsa is already in earth's
          environment at the same version — plus a new rule threaded through the
          Snakefile's two conditional solve_network definitions. Cite that card; do not
          re-derive it.
        uses: [scenario-matrix]
        config: "new keys under solving.options mirroring eur's names"
        code: "new scripts/solve_operations_network.py + a new rule in Snakefile"
        provenance: "pypsa/optimization/abstract.py:optimize_with_rolling_horizon"
      - step: >
          For observed fuel and CO2 prices there is nothing to switch on — earth has no
          dynamic_fuel_price and no emission-price time series. Either accept flat prices
          (Karkossa's worst-performing scenario, and now you know its size: hourly sMAPE
          up to ~100%) or inject observed marginal costs directly onto the generators in a
          new step. Say which you did.
        uses: []
        config: null
        code: "new script writing generators.marginal_cost / generators_t.marginal_cost from an observed series"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          WRITE THE SCORER, as in eur. rule make_statistics is the natural host: it
          already collects per-run network statistics across the scenario matrix, so
          adding a reference-comparison column set is an extension rather than a new rule.
          That is genuinely cheaper than eur's route, where no comparable collector exists.
        uses: [solve-statistics, summary-outputs]
        config: null
        code: "scripts/make_statistics.py (add reference-vs-modelled columns) or a new validate script"
        provenance: "scripts/make_statistics.py:collect_network_osm_stats"
    boundary:
      - variant: dispatch-and-price-hindcast
        rung: L4
        note: >
          Fixing capacities is L1 (empty extendable_carriers), but there is no operations
          rule and no rolling_horizon, so limited foresight is a new script plus a new rule
          threaded through the Snakefile's two conditional solve_network branches — L4 —
          and the observed-price scorer is a second new rule. eur is L1-for-the-run here
          and earth is not; that asymmetry is this card's headline.
      - variant: profile-bias-correction
        rung: L3
        note: >
          Same shape as eur: the scalar exists (and for solar is already non-1.0 by
          default, derived from a published comparison), quantile mapping needs a fitted
          map as a new resource. Harder here because the observed national generation
          series to fit against is region-dependent and often absent — check the
          data_quality book before promising it.
      - variant: network-capacity-calibration
        rung: L5
        note: >
          lines.s_max_pu exists and lands in prepare_network exactly as in eur, so the
          scaled quantity is free; the fitting loop is bespoke. Worse than eur in one
          respect: there is no dynamic_line_rating machinery to borrow a time-varying
          s_max_pu pattern from. And the observed congestion volume the loop fits against
          is published almost nowhere in earth's footprint.
      - variant: topology-and-statistics-validation
        rung: L2
        note: >
          The one variant where earth is AHEAD. rule make_statistics already collects OSM
          topology, per-country line lengths and renewable shares across the run matrix;
          adding a reported-inventory column is a localised edit to
          scripts/make_statistics.py. eur has no equivalent collector — only the
          two-network make_network_comparison plot.
      - variant: cross-model-differential-validation
        rung: L3
        note: >
          No base_network switch here: OSM extraction is the only topology path, so a
          second independently-built network must be supplied as data. Xiong's paper is
          itself the record of porting earth's OSM extraction into eur, which is why eur
          has the switch and earth does not.
      - variant: feasibility-stress-validation
        rung: L1
        note: >
          Config only, as in eur: narrow the snapshot window to the stress hour, keep load
          shedding on (default 100), read the shed volume per bus, then re-run at coarser
          clustering to separate assignment artefact from genuine shortfall. Arguably more
          useful here than in eur, because earth's input data is more often the thing at
          fault.
    where:
      - change: "limited-foresight operations solve"
        anchor: "new scripts/solve_operations_network.py + a rule in Snakefile, mirroring pypsa-eur's names; the library call is n.optimize.optimize_with_rolling_horizon"
        provenance: "scripts/solve_network.py:solve_network"
      - change: "reference-vs-modelled comparison columns"
        anchor: "scripts/make_statistics.py::collect_network_osm_stats and its callers"
        provenance: "scripts/make_statistics.py:collect_network_osm_stats"
      - change: "quantile map replacing the scalar profile correction"
        anchor: "scripts/build_renewable_profiles.py -> the `correction_factor * func(...)` multiplication"
        provenance: "scripts/build_renewable_profiles.py:correction_factor"
      - change: "line-rating fitting loop"
        anchor: "lines.s_max_pu -> scripts/prepare_network.py::set_line_s_max_pu; the loop is a new driver above the rule"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - change: "observed marginal costs in place of flat fuel prices"
        anchor: "scripts/add_electricity.py::attach_conventional_generators -> the marginal_cost argument"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "an observed demand series, replacing the synthetic/forecast default"
        anchor: "scripts/build_demand_profiles.py -> the load_source branch (a fourth source alongside gegis/ssp/demcast)"
        provenance: "scripts/build_demand_profiles.py:read_demcast_load"
    data_dependencies:
      - input: "observed hourly demand for the hindcast year"
        required_for: dispatch-and-price-hindcast
        availability: >
          ABSENT, and this is earth's binding constraint. Both shipped sources are
          modelled: 'gegis' is synthetic demand from the GEGIS/SSP rasters and 'demcast'
          reads a "Forecast load (MW)" column. Inside ENTSO-E's footprint you can vendor
          measured load as eur does; outside it, a hindcast is validating a model against
          a model on the demand side.
      - input: "observed prices or generation to score against"
        required_for: dispatch-and-price-hindcast
        availability: >
          region-dependent and usually absent. Transparency-platform equivalents exist in
          only a handful of earth's target countries; check the data_quality book's
          per-country grade before offering this method at all.
      - input: "reported grid statistics for the region"
        required_for: topology-and-statistics-validation
        availability: >
          region-dependent. Xiong notes public statistics are scarce even inside Europe for
          some asset classes; outside it, expect none. make_statistics will happily emit
          the model's own numbers with nothing to compare them against, which is a
          validation-shaped output that is not a validation.
      - input: "observed national renewable generation for the Q2Q fitting target"
        required_for: profile-bias-correction
        availability: >
          region-dependent. IRENA annual totals are broadly available and would support a
          scalar recalibration (the same idea as the shipped solar factor); the HOURLY
          series a quantile map needs mostly is not.
      - input: "a second independently-built network for the region"
        required_for: cross-model-differential-validation
        availability: >
          absent — OSM extraction is the only topology path here, unlike eur's
          osm | tyndp | entsoegridkit switch.
    cost_profile:
      solves: >
        1 per hindcast year for the dispatch variant; 0 for the statistics variant; 2 per
        fit iteration times iterations times fitted periods for the calibration loop.
      relative: >
        Cheaper per solve than eur in absolute terms — smaller regions, electricity-only
        base cases — which makes the compute side of a hindcast comfortable here. The
        binding cost is not compute.
      note: >
        For this method earth's usual advantage inverts. Compute is cheaper and the code
        gap is larger (no operations rule, no rolling horizon, no dynamic input prices),
        but the decisive factor is that the observation itself is usually missing. An
        earth hindcast should be scoped by asking "what observed series exists for this
        country" first and "how long will the run take" last — the reverse of every other
        method card's ordering.
    verifies:
      - variant: dispatch-and-price-hindcast
        check: "(n.generators.p_nom_extendable.sum() == 0) and (n.storage_units.p_nom_extendable.sum() == 0) and (n.stores.e_nom_extendable.sum() == 0)"
        over: run
        note: >
          The only route to fixed capacities here is emptying config lists, with no
          fix_optimal_capacities safety net, so this check is load-bearing rather than
          belt-and-braces. Note `stores` as well as `storage_units`: battery and H2 are in
          extendable_carriers.Store by default and are the easiest pair to forget.
      - variant: dispatch-and-price-hindcast
        check: "n.snapshots[0].year == n.meta['load_options']['weather_year'] == int(observed_year)"
        over: run
        note: >
          Earth's characteristic silent failure: snapshots and load_options.weather_year
          are independent keys that both default to 2013, so a hindcast can run the right
          weather against the wrong demand year and look entirely healthy.
      - variant: dispatch-and-price-hindcast
        check: "n.meta['solving']['options']['noisy_costs'] is False"
        over: run
        note: >
          noisy_costs defaults to true and perturbs marginal costs, i.e. it adds noise to
          the exact variable a price hindcast scores. Small, but it also makes the score
          seed-dependent.
      - variant: topology-and-statistics-validation
        check: "set(reference_table.index) <= set(modelled_stats.index)"
        over: ensemble
        note: >
          A reference row with no modelled counterpart silently drops out of the score
          rather than failing it — Xiong's incomplete-inventory problem. Assert the join
          is total, or report which entities were excluded.
