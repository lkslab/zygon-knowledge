        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_metrics"
    boundary:
      - variant: uniform-derating-margin
        rung: L0
        note: >
          lines.s_max_pu exists, defaults to 0.7 and has a live consumer. This is the entry
          rung of the card and it is already on — the honest framing for a user is not "can
          we do N-1" but "you are already doing a crude version of it; do you want it
          examined". Changing the value or bracketing it is one config edit.
      - variant: resolution-dependent-derating
        rung: L1
        note: >
          Same key, a specific non-default value chosen as a function of clustering.clusters.
          No code: the modeller supplies the interpolation (0.5 at 37 -> 0.7 at >=200) when
          setting the scenario. L1 rather than L0 because the value is only defensible in
          combination with the cluster count.
      - variant: dynamic-line-rating
        rung: L1
        note: >
          lines.dynamic_line_rating.activate plus a cutout that covers the study region —
          the machinery is built (build_line_rating -> attach_line_rating writes
          n.lines_t.s_max_pu). L1 not L0 because the registry rates it `partial`, it needs
          the correction_factor / max_line_rating guards set deliberately, and it only
          covers overhead lines (an explicit TODO in attach_line_rating).
      - variant: explicit-contingency-constraints
        rung: L5
        note: >
          No config path and no workflow code — but optimize_security_constrained does the
          formulation, so this is a driver plus an outage list, not a new constraint
          derivation. Days for a small network. The load-bearing risk is the constraint
          count, not the code.
      - variant: two-stage-proxy-then-sclopf
        rung: L5
        note: >
          The cheapest honest route to real N-1 here, because both halves already exist:
          stage one is the default solve, stage two is solve_operations_network with the
          optimize call swapped for optimize_security_constrained. New code is the swap plus
          the outage selection — L5 but small and well-anchored.
      - variant: lodf-based-screening
        rung: L5
        note: >
          Nothing to build on: no LODF or BODF code in the repo, and pypsa's BODF is dense
          PTDF-derived with no decay pruning. Implementing Ronellenfitsch's dual formulation
          means new linear algebra over the cycle basis. The highest-leverage unbuilt piece
          in this family (it is what makes the explicit variant affordable) and the most
          expensive.
      - variant: topology-derived-buffer-factors
        rung: L5
        note: >
          A pre-solve computation (polytope containment, Halton volume matching, or
          Edmonds-Karp max-flow per line) producing a per-line s_max_pu vector. The OUTPUT
          lands on an existing surface — n.lines.s_max_pu is per-line, so writing a vector
          instead of a scalar is a one-line change to set_line_s_max_pu — which makes this
          the best value-for-effort L5 on the card: real derivation, no constraint growth.
      - variant: corrective-scopf-with-post-contingency-actions
        rung: L5
        note: >
          The hardest variant, and the one where the pypsa primitive does NOT help:
          optimize_security_constrained implements only the preventive form. TATL, corrective
          device dispatch variables and their co-optimisation with generation are new
          formulation work in custom_extra_functionality. Months, not days.
    where:
      - change: "the derating scalar (or a per-line vector) applied to line ratings"
        anchor: "scripts/prepare_network.py::set_line_s_max_pu (called from prepare_network's main); also stamped in scripts/base_network.py"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu; scripts/base_network.py:s_max_pu"
      - change: "post-contingency flow constraints inside the workflow LP"
        anchor: "solving.options.custom_extra_functionality -> the user module's entry function"
        provenance: "scripts/solve_network.py:custom_extra_functionality; rules/common.smk:input_custom_extra_functionality"
      - change: "call the SCLOPF primitive instead of the plain optimize"
        anchor: "a new driver script, or rule solve_operations_network for the two-stage pattern"
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - change: "weather-dependent ratings replacing the static margin"
        anchor: "rule build_line_rating -> calculate_line_rating; attach_line_rating writes n.lines_t.s_max_pu"
        provenance: "scripts/build_line_rating.py:calculate_line_rating; scripts/add_transmission_projects_and_dlr.py:attach_line_rating"
      - change: "keep BODF sensitivities consistent with expanded capacities"
        anchor: "solving.options.skip_iterations: false -> optimize_transmission_expansion_iteratively"
        provenance: "scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - change: "report which contingency bound and how much headroom was reserved"
        anchor: "scripts/make_summary.py (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_metrics"
    data_dependencies:
      - input: "ERA5 cutout with temperature, wind and irradiance over the line geometries"
        required_for: dynamic-line-rating
        availability: >
          exists by default for Europe (the default cutout), but the rating is computed for
          OVERHEAD lines only — an explicit TODO in attach_line_rating — so cable-heavy
          subnetworks silently keep the static value
      - input: "line types / conductor properties for the thermal model"
        required_for: dynamic-line-rating
        availability: >
          exists by default via n.line_types (lines.types maps voltage to a standard
          conductor); calculate_resistance uses R_ref with alpha=0.00403, so any non-standard
          conductor is approximated by its voltage class
    cost_profile:
      solves: >
        uniform-derating-margin and resolution-dependent-derating: 1 solve (it is a
        coefficient). dynamic-line-rating: 1 solve plus the cutout-based rating build.
        Bracketing s_max_pu: 2-3 solves. explicit-contingency-constraints: 1 solve, but with
        up to 2 * L * |outages| extra constraints per snapshot. two-stage: 2 solves, the
        second on a fixed-capacity dispatch problem. corrective: 1-2 solves plus new
        variables per contingency.
      relative: >
        The derating routes are free — same LP, different coefficient; only the ANSWER
        changes, not the runtime. Explicit N-1 is where cost lives and it does not scale with
        solve count but with problem size: Gazafroudi hit 100 GB RAM at 50 buses / 50
        outages, and full N-1 there was 3786s against 270s for the buffer-factor
        approximation (~14x). A 300-node European network at 8760 snapshots with all outages
        monitored is not a run anyone in the corpus has attempted in one stage.
      note: >
        Mitigations, in the order to try them: (1) screen the outage set hard — a handful of
        critical corridors, not branch_outages=None; (2) monitor few snapshots, not all 8760
        (the binding contingency recurs, so a peak-loading subset captures most of it); (3)
        two-stage, so the expensive investment problem never carries the constraints; (4)
        topology-derived-buffer-factors, which buys most of the fidelity at zero constraint
        growth; (5) coarsen temporally or spatially. Note the sparsity interaction Hoersch
        2017 flags: the dense BODF matrix erodes the Kirchhoff cycle formulation's advantage,
        so the SCLOPF LP is disproportionately slower than its constraint count suggests.
    verifies:
      - variant: uniform-derating-margin
        check: "(n.lines.s_max_pu == config['lines']['s_max_pu']).all()"
        over: run
        note: >
          The margin was never applied, or was overwritten downstream. The run succeeds
          either way and the network simply has more usable capacity than intended — the
          classic silent failure of this method, because nothing in the output announces the
          margin.
      - variant: dynamic-line-rating
        check: "(not n.lines_t.s_max_pu.empty) and n.lines_t.s_max_pu.shape[0] == len(n.snapshots)"
        over: run
        note: >
          DLR was configured but the time-varying rating never landed, so every line silently
          fell back to the static scalar. Indistinguishable from a successful run in the
          results.
      - variant: explicit-contingency-constraints
        check: "any('security-for' in name for name in n.model.constraints)"
        over: run
        note: >
          The SCLOPF constraints were never added — optimize_security_constrained names them
          '...-s-<bound>-security-for-<outage>-in-<subnetwork>'. If the outage list resolved
          empty, or the network had no passive branches, the primitive falls through to a
          plain optimize() and you get an UNSECURED solution reported as secure.
      - variant: two-stage-proxy-then-sclopf
        check: "(ns[1].generators.p_nom == ns[0].generators.p_nom_opt).all()"
        over: ensemble
        note: >
          Stage two re-optimised capacity instead of only dispatch, which collapses the
          two-stage design into an inconsistent single one: the reported capacities no longer
          correspond to the security-constrained dispatch.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: line-security-margin
        role: >
          the shipped method, identical to eur — registry status `working`, same 0.7 default,
          same set_line_s_max_pu consumer
      - id: contingency-scopf
        role: >
          the real method — registry status `absent`, and earth's registry note names ONLY
          line-security-margin as the substitute, because there is no DLR entry to name
      - id: operational-reserves
        role: >
          the generator-side contingency reserve; same GenX formulation as eur but shipped
          with contingency: 0 instead of 4000
      - id: custom-constraint-hook
        role: >
          the single extra_functionality entry point where bespoke post-contingency
          constraints would land
      - id: transmission-expansion-limits
        role: >
          the ll wildcard (lopt/copt/lv/cc) caps nominal volume while the LP is bounded by
          the derated value — the same read-them-together caveat as eur
      - id: hvdc-as-lines
        role: >
          earth-specific and load-bearing for this method: HVDC can be modelled as Lines
          rather than Links, which changes whether those corridors are passive branches at
          all — and pypsa's SCLOPF operates on n.passive_branches()
      - id: augmented-line-connection
        role: >
          earth-specific: k-edge connectivity augmentation adds candidate lines to raise
          meshedness, which is the structural precondition for N-1 to be satisfiable at all
      - id: iterative-impedance-expansion
        role: "reactance-consistency for any BODF-based work under expansion"
    available:
      verdict: primitive-only
      how: >
        Byte-for-byte the same shipped treatment as eur: lines.s_max_pu defaults to 0.7,
        prepare_network's set_line_s_max_pu writes it onto every line with the same "N-1
        security margin of lines" log line, and base_network stamps it at build time. No
        contingency code — `branch_outages`, `BODF` and `LODF` appear nowhere in scripts/.
        The asymmetry with eur is what is MISSING alongside it: earth has no dynamic line
        rating at all (no registry entry, no lines.dynamic_line_rating key in
        config.default.yaml, no build_line_rating script), so the static scalar is the only
        rating mechanism that exists. In exchange earth has two surfaces eur lacks that bear
        on security: hvdc_as_lines, which decides whether DC corridors are passive branches
        and therefore whether SCLOPF sees them, and augmented_line_connection, which adds
        k-edge-augmentation candidate lines. The primitive is the same pypsa 0.30.3
        optimize_security_constrained — indeed this repo's checkers run against exactly that
        env.
      missing: >
        Everything eur is missing, plus the dynamic-line-rating fallback: procedure steps 1,
        2, 6, 7, 8 have no handle, steps 4-5 only in the library, and there is no
        weather-dependent rating path to substitute when a flat scalar is indefensible. The
        deeper blocker is upstream and is DATA, not code: the derating is a margin on a line
        rating derived from an OSM-inferred topology with assumed conductor types, so a 30%
        security margin sits on a base capacity whose own uncertainty is often larger.
      provenance: "scripts/prepare_network.py:set_line_s_max_pu; scripts/base_network.py:s_max_pu; scripts/solve_network.py:extra_functionality"
    levers:
      - key: "lines.s_max_pu"
        effect: >
          The whole shipped method, same as eur: the LP sees s_max_pu * s_nom on every line.
          Outside Europe this is the number to renegotiate with the user rather than inherit,
          because 0.7 encodes European meshedness.
        default: "0.7"
        provenance: "config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "electricity.hvdc_as_lines"
        effect: >
          false (default) models HVDC as controllable Links, true as Lines. Decisive for
          explicit N-1: pypsa's SCLOPF enumerates n.passive_branches(), so HVDC-as-Links is
          invisible to contingency analysis while HVDC-as-Lines becomes both a monitored
          branch and a credible outage. Also note s_max_pu is applied to n.lines, so this
          switch changes which corridors carry the security margin at all.
        default: "false"
        provenance: "config.default.yaml:hvdc_as_lines; scripts/base_network.py:hvdc_as_lines"
      - key: "electricity.operational_reserve.activate"
        effect: >
          The generator-side reserve, same GenX formulation as eur. Not network security —
          listed to keep the two contingency concepts apart.
        default: "false"
        provenance: "config.default.yaml:operational_reserve; scripts/solve_network.py:add_operational_reserve_margin_constraint"
      - key: "electricity.operational_reserve.contingency"
        effect: >
          Fixed MW reserve adder. Ships at 0 here against eur's 4000, so activating the
          reserve in earth gives ONLY the epsilon_load + epsilon_vres terms unless this is set
          — a quiet cross-model asymmetry that makes the same config flip mean different
          things.
        default: "0 (MW)"
        provenance: "config.default.yaml:contingency; scripts/solve_network.py:add_operational_reserve_margin_constraint"
      - key: "augmented_line_connection.add_to_snakefile"
        effect: >
          Adds k-edge-augmentation candidate lines (networkx) to raise network connectivity.
          Upstream of security rather than part of it: in a radial subnetwork N-1 is
          infeasible by construction, and this is the only surface that can make it
          satisfiable.
        default: "false"
        provenance: "config.default.yaml:augmented_line_connection; scripts/augmented_line_connections.py:haversine"
      - key: "solving.options.skip_iterations"
        effect: >
          When false, reactances are updated with capacities — the same BODF-staleness
          concern as eur.
        default: "true"
        provenance: "config.default.yaml:skip_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
    assembly:
      - step: >
          Interrogate the base rating before the margin. The derating multiplies a capacity
          that came from OSM topology plus assumed line types; if that base is grade C/D for
          the region, 0.7 versus 0.6 is noise. Check
          cookbooks/pypsa-earth/data_quality for the country's grid grade first.
        uses: [line-security-margin]
        config: "lines.s_max_pu"
        code: null
        provenance: "scripts/base_network.py:s_max_pu"
      - step: >
          Set and bracket the margin. Same L0 lever as eur, but bracket WIDER outside Europe —
          sparsely meshed networks need a larger margin because there are fewer parallel paths
          to absorb a lost flow, so 0.7 is optimistic in exactly the regions earth targets.
        uses: [line-security-margin, scenario-matrix]
        config: "lines.s_max_pu across scenario.* runs"
        code: null
        provenance: "scripts/prepare_network.py:set_line_s_max_pu; Snakefile:scenario"
      - step: >
          Decide the HVDC representation BEFORE any contingency work. With hvdc_as_lines
          false, DC corridors are Links: they carry no s_max_pu margin and are invisible to
          optimize_security_constrained's passive-branch enumeration. If DC interconnectors
          matter to the user's security question, this switch is a prerequisite, not a detail.
        uses: [hvdc-as-lines]
        config: "electricity.hvdc_as_lines: true"
        code: null
        provenance: "scripts/base_network.py:hvdc_as_lines"
      - step: >
          Check feasibility of the security question at all: if the region's network is
          largely radial, no derating and no SCLOPF makes it N-1 secure. Either enable
          augmented line connection to add candidate corridors, or reframe the question as
          "what would it take to become N-1 secure" — which is the more useful study anyway.
        uses: [augmented-line-connection]
        config: "augmented_line_connection.add_to_snakefile: true; augmented_line_connection.connectivity_upgrade"
        code: null
        provenance: "scripts/augmented_line_connections.py:haversine"
      - step: >
          (explicit route) Select the outage subset externally, then call
          n.optimize.optimize_security_constrained(n, branch_outages=<subset>) from a driver,
          or add post-contingency constraints in extra_functionality. Same primitive, same
          absence of screening support as eur.
        uses: [contingency-scopf, custom-constraint-hook]
        config: null
        code: "new driver script; or scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - step: >
          For the two-stage pattern, note earth has NO operations-only rule (registry:
          `absent`) — stage two must be assembled by fixing capacities and re-solving by
          hand. This is the concrete extra work relative to eur for the recommended
          explicit-N-1 route.
        uses: [contingency-scopf]
        code: "scripts/solve_network.py — a fix-capacities-and-re-solve path does not exist"
        config: null
        provenance: "scripts/solve_network.py:extra_functionality"
    boundary:
      - variant: uniform-derating-margin
        rung: L0
        note: >
          lines.s_max_pu: 0.7 with a live consumer, identical to eur. The entry rung, and
          already on. The difference from eur is epistemic not mechanical: here the base
          rating it multiplies is itself uncertain.
      - variant: resolution-dependent-derating
        rung: L1
        note: >
          Same key, value chosen per cluster count. Weaker footing than in eur: the
          Hoersch 2017 (EEM) 0.5-0.7 interpolation was calibrated on the European network,
          and there is no equivalent calibration for earth's regions. Use it as a shape, not
          as numbers.
      - variant: dynamic-line-rating
        rung: L5
        note: >
          The sharpest eur/earth asymmetry on this card: earth has NO dynamic line rating —
          no config key, no build_line_rating rule, no registry entry. Implementing it means
          a new rule, a new script and cutout-derived weather per line, i.e. L5 with an L3
          data component, where eur is a single L1 flip.
      - variant: explicit-contingency-constraints
        rung: L5
        note: >
          Same primitive-driven L5 as eur, with two extra prerequisites: decide hvdc_as_lines
          (or DC corridors are simply not in the contingency set), and confirm the topology is
          meshed enough for the constraints to be feasible.
      - variant: two-stage-proxy-then-sclopf
        rung: L5
        note: >
          More expensive here than in eur precisely because of a missing surface: eur reuses
          solve_operations_network for stage two, earth has no operations-only rule (registry
          `absent`), so the fix-capacities-and-re-solve half must also be written.
      - variant: lodf-based-screening
        rung: L5
        note: >
          Identical to eur — nothing to build on in either repo, and the dual cycle-flow
          formulation is new linear algebra. Arguably more valuable here, since earth's larger,
          sparser networks are where LODF decay prunes hardest.
      - variant: topology-derived-buffer-factors
        rung: L5
        note: >
          The best-fit L5 for earth, and better motivated than in eur: the factors are derived
          from TOPOLOGY alone, which is the one thing earth's OSM pipeline does provide, and
          they replace a European convention with a network-specific number. Output is a
          per-line s_max_pu vector, which n.lines.s_max_pu already accepts.
      - variant: corrective-scopf-with-post-contingency-actions
        rung: L5
        note: >
          Hardest variant, and the primitive does not help (preventive only). Worth flagging
          that the underlying idea — flexibility as a substitute for grid redundancy — is
          especially relevant to weakly meshed developing grids, so this is a high-value,
          high-cost combination rather than an exotic one.
    where:
      - change: "the derating scalar (or per-line vector) applied to line ratings"
        anchor: "scripts/prepare_network.py::set_line_s_max_pu; also stamped in scripts/base_network.py"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu; scripts/base_network.py:s_max_pu"
      - change: "post-contingency flow constraints inside the workflow LP"
        anchor: "scripts/solve_network.py::extra_functionality (the single constraint hook)"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "whether HVDC corridors are passive branches (and so contingency-visible)"
        anchor: "electricity.hvdc_as_lines -> scripts/base_network.py"
        provenance: "scripts/base_network.py:hvdc_as_lines"
      - change: "raise meshedness so N-1 is satisfiable at all"
        anchor: "augmented_line_connection.add_to_snakefile -> scripts/augmented_line_connections.py"
        provenance: "scripts/augmented_line_connections.py:haversine"
      - change: "a dynamic line rating path (does not exist — new rule + script)"
        anchor: "no anchor in this repo; the eur analogue is rule build_line_rating"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - change: "security reporting"
        anchor: "scripts/make_summary.py (rule make_summary)"
        provenance: "scripts/make_summary.py:make_summary"
    data_dependencies:
      - input: "a transmission topology whose line ratings are trustworthy enough to derate"
        required_for: uniform-derating-margin
        availability: >
          region-dependent — ratings come from OSM geometry plus assumed conductor types via
          lines.ac_types; where the grid grade is C/D the base capacity uncertainty exceeds
          the 30% margin, so consult cookbooks/pypsa-earth/data_quality before treating
          s_max_pu as the binding assumption
      - input: "a sufficiently meshed network for N-1 to be feasible"
        required_for: explicit-contingency-constraints
        availability: >
          region-dependent — many earth regions are radial or weakly meshed; explicit N-1 will
          be infeasible rather than expensive, and augmented_line_connection is the surface
          that adds candidate corridors
      - input: "weather fields over line geometries plus conductor properties"
        required_for: dynamic-line-rating
        availability: >
          absent as a pipeline — cutouts exist (enable.build_cutout) but no rule or script
          converts them to line ratings, and there is no lines.dynamic_line_rating config
          surface to consume the result
    cost_profile:
      solves: >
        Same structure as eur: derating variants are 1 solve (a coefficient), bracketing is
        2-3, explicit N-1 is 1 solve carrying up to 2 * L * |outages| extra constraints per
        snapshot, two-stage is 2.
      relative: >
        Free for the derating routes. Explicit N-1 is more tractable here than on a
        sector-coupled eur run — earth base cases are typically smaller and electricity-only,
        which is the same model-choice inversion MGA shows — but the tractable-network
        advantage is partly cancelled by sparse meshedness making N-1 infeasible rather than
        merely costly. Gazafroudi's 100 GB at 50 buses / 50 outages is the scale reference
        either way.
      note: >
        Mitigations as in eur (screen the outage set, monitor a snapshot subset, two-stage,
        buffer factors), with two earth-specific notes: the missing operations-only rule makes
        two-stage costlier to assemble, and topology-derived-buffer-factors is the mitigation
        best matched to what earth actually has — topology — rather than to what it lacks,
        which is calibrated ratings.
    verifies:
      - variant: uniform-derating-margin
        check: "(n.lines.s_max_pu == config['lines']['s_max_pu']).all()"
        over: run
        note: >
          The margin never landed on the lines. Same silent failure as eur: the run succeeds
          with more usable capacity than intended and nothing in the output says so.
      - variant: explicit-contingency-constraints
        check: "len(n.passive_branches()) > 0 and any('security-for' in name for name in n.model.constraints)"
        over: run
        note: >
          Two failures in one check. If the network has no passive branches — the likely case
          when hvdc_as_lines is false and the region's interconnection is all DC —
          optimize_security_constrained silently falls through to a plain optimize() and
          reports an unsecured solution. If branches exist but no 'security-for' constraints
          were built, the outage list resolved empty.
      - variant: topology-derived-buffer-factors
        check: "n.lines.s_max_pu.nunique() > 1"
        over: run
        note: >
          The per-line factors collapsed back to a single value, meaning the derived vector
          was overwritten by set_line_s_max_pu's scalar assignment — which runs unconditionally
          from the config and will silently undo a per-line vector written earlier in the chain.
