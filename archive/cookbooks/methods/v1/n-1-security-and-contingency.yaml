id: n-1-security-and-contingency
title: "N-1 security and contingency-constrained OPF (SCLOPF)"
summary: >
  Require that the dispatch (and the capacities that support it) stay feasible after the
  loss of any single transmission element, either by enforcing post-contingency flow
  limits explicitly or by derating pre-contingency capacity as a proxy for that headroom.
question: >
  Would this system still be operable if any one line failed — and how much of the
  transmission capacity I built is actually usable rather than reserved as N-1 headroom?
aliases:
  - "N-1 security"
  - "n-1 criterion"
  - "N-1 security margin"
  - "SCLOPF"
  - "security-constrained linear optimal power flow"
  - "security-constrained OPF"
  - "SCOPF"
  - "contingency analysis"
  - "contingency constraints"
  - "post-contingency flow limits"
  - "line outage distribution factor"
  - "LODF"
  - "branch outage distribution factor"
  - "BODF"
  - "line derating"
  - "70% loading cap"
  - "buffer capacity factor"
  - "preventive versus corrective security"
  - "PATL / TATL"
  - "dynamic line rating"
when_to_use:
  - "is the grid still secure if a line trips"
  - "how much of the line capacity can actually be used"
  - "why does the model only use 70% of the transmission capacity"
  - "should I model N-1 properly instead of a derating factor"
  - "which lines are critical for security"
  - "how much transmission do I really need once I include security margins"
  - "can storage or demand response replace grid reinforcement for security"
  - "does the 0.7 factor over- or under-state my grid's usable capacity"
  - "can I use weather-dependent line ratings instead of a flat margin"
  - "how much does enforcing N-1 cost the system"
family: grid-and-security
prevalence:
  papers: 13
  tier1: 13
  tier2: 0
  sweep_hits: 23
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 13 papers that actually apply
    an N-1 treatment, all 13 in tier 1 — this method is concentrated in the PyPSA core
    group, not in the wider application corpus. The regex screen returned 23; the 10-paper
    excess is almost all mention-only ("N-1 security" named in a limitations paragraph
    without any margin, factor or constraint stated). Two evidence-index suspects were
    judged IN: Hoersch 2017 (Cycle Flows) states both the SCLOPF formulation and the 70%
    investment convention as method content, and Xiong 2025 states the derating
    quantitatively as S_n-1 = 0.7 * S_nom. The role split is the tell: 4 `defines` and 8
    `routine-use` with almost nothing between. Two papers define the PRIMITIVE (PyPSA's
    BODF-based SCLOPF, and the dual cycle-flow LODF theory it could use), two define
    APPROXIMATIONS to it (topology-derived buffer factors, corrective network boosters),
    and the eight routine users all apply the same flat 0.7 derating without variation.
    That gap between what the literature knows how to do and what applied studies actually
    do is the single most important fact on this card.
procedure:
  - step: >
      Decide what "secure" means before anything else: which elements are credible
      contingencies (single AC lines is the near-universal choice; HVDC links,
      transformers and generators are usually excluded), and whether security is
      PREVENTIVE (pre-contingency dispatch must already be post-contingency feasible) or
      CORRECTIVE (post-contingency overload is allowed for minutes while a corrective
      device acts). The corpus is overwhelmingly preventive.
    handle: null
    provenance: null
  - step: >
      Choose the layer at which security enters. Three genuinely different choices, not
      three fidelities of one: (a) derate capacity pre-solve, so the LP never sees a
      contingency; (b) add explicit post-contingency flow constraints inside the LP; (c)
      solve unsecured, then re-solve or post-check with security enforced.
    handle: null
    provenance: null
  - step: >
      For the derating route, multiply every line's rating by a single factor: flow_l <=
      s_max_pu * s_nom_l with s_max_pu = 0.7. This is what both workflows ship and what 8
      of the 13 corpus papers do. The equivalent post-hoc form (Schlachtberger 2017, Liu
      2019) scales the OPTIMISED capacity up by f_n-1 = (1 - 0.33)^-1 = 1.5 when reporting
      NTCs instead of scaling the limit down inside the LP — algebraically the same margin,
      but the constraint the optimiser saw differs, so cost and dispatch differ.
    handle: "lines.s_max_pu -> set_line_s_max_pu(n, s_max_pu)"
    provenance: "scripts/prepare_network.py:set_line_s_max_pu"
  - step: >
      For the explicit route, build the sensitivity matrix that maps a lost branch's
      pre-outage flow onto the surviving branches. Two equivalent constructions: BODF from
      PTDFs (Brown 2018, and what pypsa implements: BODF_kl = branch_PTDF * denominator
      with BODF_ll = -1), or LODFs from cycle flows via the dual Woodbury identity
      (Ronellenfitsch 2017), which is cheaper on sparse networks and extends to multiple
      simultaneous outages and to arbitrary reactance changes, not just full outages.
    handle: "sub_network.calculate_BODF()"
    provenance: "pypsa/contingency.py:calculate_BODF"
  - step: >
      Add, for every monitored branch l and every outage k, the post-contingency limit
      |f_l + LODF_lk * f_k| <= F_l, at every snapshot. This is 2*L*(N-1) constraints per
      snapshot in the full form (Gazafroudi 2021, IJEPES) — the cost driver, and the reason
      screening and approximation exist at all.
    handle: "n.optimize.optimize_security_constrained(branch_outages=...)"
    provenance: "pypsa/optimization/abstract.py:optimize_security_constrained"
  - step: >
      Screen, because you cannot afford the full set. The corpus's three screening
      strategies: restrict branch_outages to a critical subset (Hoersch 2017 states the
      subset is the user's choice); exploit LODF decay — Ronellenfitsch 2017 proves outage
      effects vanish between edges joined by only one independent path in planar networks,
      so most of the matrix is structurally zero; or replace the constraint set entirely
      with a per-line buffer factor derived from the polytope geometry (Gazafroudi 2021,
      ~14x speedup, 270s vs 3786s).
    handle: null
    provenance: null
  - step: >
      Solve, and — if the design is two-stage — re-solve. Titz 2026's pattern: stage one
      optimises investment and dispatch with the 70% cap as proxy, stage two re-solves
      generator dispatch under explicit SCLOPF with storage operation fixed from stage one.
      This buys explicit N-1 on a tractable problem, at the price of capacities that were
      chosen under the proxy rather than under the true constraint.
    handle: null
    provenance: null
  - step: >
      Report what the margin cost you: how much capacity is reserved as headroom, whether
      the binding contingency was identified at all, and (for corrective designs) how much
      corrective capacity was needed and where. A derating run cannot answer the second of
      these, which is the honest limit of the proxy.
    handle: null
    provenance: null
variants:
  - id: uniform-derating-margin
    what: >
      One scalar applied to every line's rating: s_max_pu = 0.7, or equivalently a 33%
      margin recovered post-hoc as f_n-1 = 1.5 on reported NTCs. Static, uniform,
      topology-blind and not validated against any contingency calculation. Both workflows
      default to it, so it is what a user gets whether or not they asked for N-1 — the
      single most prevalent variant in the corpus and the entry rung of this whole card.
    papers:
      - "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2025_Lindner_PyPSA-DE_EEM.pdf"
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
  - id: resolution-dependent-derating
    what: >
      The same scalar, but made a function of spatial resolution to absorb cluster-internal
      bottlenecks the clustered network no longer represents: Hoersch 2017 (EEM)
      interpolates linearly from 0.5 at 37 clusters to 0.7 at >=200 clusters. Recognises
      that the derating is doing two unrelated jobs at once — security headroom and
      aggregation error — and is the cheapest correction available (still just a config
      value, chosen per clustering).
    papers:
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
  - id: explicit-contingency-constraints
    what: >
      Real SCLOPF: enumerate the monitored outage set and add post-contingency flow
      constraints |f_l + LODF_lk*f_k| <= F_l for every monitored pair at every snapshot.
      Identifies WHICH contingency binds and where, which no derating can. In pypsa this is
      a library call over a constraint-copy formulation; the cost is the constraint count.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
  - id: lodf-based-screening
    what: >
      Compute the outage sensitivities cheaply and use them to prune, rather than to
      constrain. Ronellenfitsch 2017's dual formulation derives LODFs from cycle flows via
      the Woodbury identity (LODF_kl = -(u_k^t M u_l)/(u_l^t M u_l), M = CA^-1 C^t), extends
      to multiple simultaneous outages, and proves monotonic decay so that most pairs can
      be discarded a priori. The natural companion to the Kirchhoff cycle formulation pypsa
      already uses — the same C matrix serves both.
    papers:
      - "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
      - "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
  - id: topology-derived-buffer-factors
    what: >
      Keep the cheap shape of a derating but stop guessing the number: derive a per-line (or
      uniform) buffer capacity factor c_l from the geometry of the N-1 feasible polytope, so
      the derating is provably conservative rather than conventional. Gazafroudi 2021
      (IJEPES) gives three: robust (c_R = smallest c with Q^R contained in Q^N-1),
      approximate (c_A matching polytope volumes via Halton hit-miss Monte Carlo), and
      line-specific (c_l from Edmonds-Karp max-flow redundant capacity). On a 50-bus Germany
      network: c_R = 0.59, c_A = 0.74, c_l in 0.59-1.0 — i.e. 0.7 is roughly the volume-
      matched value system-wide while being wrong per line in both directions.
    papers:
      - "2021_Gazafroudi_N-1-Contingency-Topology_IJEPES.pdf"
  - id: corrective-scopf-with-post-contingency-actions
    what: >
      Drop the preventive requirement: allow temporary post-contingency overload up to a
      TATL (transiently admissible loading, f_tatl 1.0-1.5, default 1.3 x PATL) and invest
      in fast-acting devices — Gazafroudi 2021's "network boosters", storage or DSM sized at
      0.5 MWh per MW — that relieve it within minutes. Turns security from a capacity
      reservation into a flexibility investment, and co-optimises where that flexibility
      goes (sequential: generation then boosters; or simultaneous in one LP).
    papers:
      - "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
  - id: dynamic-line-rating
    what: >
      Replace the static scalar with a weather-dependent per-line, per-snapshot rating
      (ambient temperature, wind cooling, solar gain), so s_max_pu becomes a time series
      instead of a constant. Strictly a different question from N-1 — it changes the THERMAL
      limit, not the contingency headroom — but it occupies the same config surface and the
      two are routinely confused. Xiong 2025 explicitly disables it to isolate the topology
      effect, which is the right instinct.
    papers:
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
  - id: two-stage-proxy-then-sclopf
    what: >
      Proxy for the expensive decision, explicit for the cheap one: stage one does
      investment + dispatch under the 70% cap, stage two re-solves dispatch under full
      SCLOPF with storage operation frozen. The only corpus design that gets explicit N-1
      onto a 600-node European network, and the pattern to recommend when a user wants real
      contingency constraints at scale.
    papers:
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
literature:
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      Defines the primitive this whole card rests on. Sec. II-F: PyPSA computes the Branch
      Outage Distribution Factor from the PTDFs and constrains post-outage flows as
      |f_l^(k)| = |f_l + BODF_lk * f_k| <= |F_l| for all l, t, per outage k (Eq. 22); the
      monitored contingency set is user-specified. Listed in the tool comparison table as a
      capability distinguishing PyPSA from most other frameworks — and, 8 years later, still
      not reachable from either workflow's config. Quote this paper when a user asks whether
      "PyPSA can do N-1": the library can, the workflows cannot.
  - paper: "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      The source of BOTH routes on this card, stated side by side. Sec. 4.3 gives the SCLOPF
      requirement ("no lines become overloaded if there is an outage of any branches in a
      critical subset") and its two implementations — network-constraint copies, or LODFs
      with |f_l^(k)| = |f_l + LODF_lk f_k| <= F_l (Eq. 28) — while Sec. 4.2 records that for
      INVESTMENT problems it is common to approximate contingencies by "limiting loading to
      70% of thermal limits". Also flags the tension this card must relay: LODF matrices are
      dense, so they can blunt the sparse cycle formulation's advantage, and the paper
      explicitly defers that trade-off analysis. SCLOPF is described but not benchmarked.
  - paper: "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
    tier: 1
    role: defines
    note: >
      The theory that makes explicit N-1 affordable, and the one piece of this card with no
      implementation anywhere in either model. Derives LODFs in the DUAL (cycle-flow) basis
      rather than from nodal angles: LODF_k,l = -(u_k^t M u_l)/(u_l^t M u_l) with M = C
      A^-1 C^t (Prop. 1, Eq. 29), generalises the same Woodbury trick to multiple
      simultaneous outages (Sec. V-B), covers arbitrary reactance changes (FACTS devices,
      not just xi -> infinity), and proves LODFs vanish between edges connected by only one
      independent path (Prop. 2) — the structural sparsity that justifies screening.
      Validated on MATPOWER test grids, not on PyPSA. Its basis is the same cycle basis
      pypsa's Kirchhoff formulation already builds, which is why this is the highest-value
      unbuilt piece in this family.
  - paper: "2021_Gazafroudi_N-1-Contingency-Topology_IJEPES.pdf"
    tier: 1
    role: defines
    note: >
      The paper that turns "0.7 is a convention" into "0.7 is a number you can derive, and
      here is how wrong it is". Full N-1 costs 2*L*(N-1) constraints per snapshot; the
      heuristic replaces them with one multiplicative buffer factor c_l per line, derived
      from the topology alone rather than from dispatch-dependent screening. Three
      constructions (robust via polytope containment, approximate via Halton hit-miss volume
      matching, line-specific via Edmonds-Karp redundant capacity), evaluated on a 3-bus
      triangle, six small European country networks and a 50-bus Germany network from
      PyPSA-Eur data at 90% CO2 reduction. Results to quote: c_R = 0.59, c_A = 0.74, c_l
      spanning 0.59-1.0, ~14x faster than full N-1. The line-specific spread is the direct
      evidence that uniform derating mis-prices individual corridors.
  - paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    tier: 1
    role: defines
    note: >
      Defines corrective (as opposed to preventive) N-1 in a PyPSA capacity-expansion
      setting, and is the only corpus paper where security is an INVESTMENT question rather
      than a constraint tightness. Preventive N-1 holds all pre-contingency flows below
      PATL; the corrective model allows overload up to TATL (f_tatl 1.0-1.5, default 1.3)
      until network-booster dispatch counteracts it. Explicit PTDF/LODF contingency
      constraints for all 50 single line outages on a 50-bus German network built from
      PyPSA-Eur data; booster reference cost 23 EUR/kW/a annualised at 7%, 0.5 MWh per MW;
      CO2 reduction swept 10-90%; sequential vs simultaneous co-optimisation compared.
      100 GB RAM limit on a 50-bus network is the number to quote when someone proposes
      explicit N-1 on a European model. Appears in EVIDENCE.yaml:unmatched_methods as
      `corrective-scopf-with-network-boosters` — it straddles this card and
      transmission-expansion-cooptimisation, and lives here as a variant.
  - paper: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference application for getting explicit N-1 onto a real PyPSA-Eur model, and
      the boundary case with cascading-failure-analysis. "Dispatch is optimized under the
      constraint that N-1 security is satisfied in every time step, ensuring that no outage
      of a single transmission line leads to secondary overloads" (Sec. II), delivered by
      the two-stage design in Appendix B: stage one investment/dispatch under a CO2 cap with
      lines limited to 70%, stage two generator dispatch re-solved under explicit SCLOPF
      with storage operation fixed. 600 nodes, 3h, weather year 2013, CO2 from 58% to 0% of
      1990. Cite this for the pattern; the cascade simulation that follows is the other
      card's territory.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      The one corpus paper that makes the derating factor resolution-dependent instead of
      constant: "N-1 security is modelled by scaling down the available transmission
      capacity to 0.7 times nominal capacity for high resolution networks >= 200 clusters
      and linearly shrinking it down until reaching half the nominal values at 37 clusters
      to account for cluster-internal bottlenecks" (Sec. II). Names out loud what everyone
      else leaves implicit — that s_max_pu absorbs aggregation error as well as security
      headroom — and is the citation to hand a user who asks what value to use at their
      chosen cluster count. 37-362 buses, 3-hourly, 95% CO2.
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Source of the a-posteriori form of the margin: "To satisfy n-1 security requirements,
      a safety margin of 33% of the installed capacity can be used. This can be emulated a
      posteriori by increasing the optimized NTCs by a factor of f_n-1 = (1 - margin)^-1 =
      1.5" (Sec. 2.5), with the same factor embedded in the transmission investment cost
      formula. Important as a distinct practice, not a restatement: the LP here optimised
      UNDERATED capacities and the margin was applied afterwards, so the reported NTC and
      the constraint the optimiser saw are different objects. 30-node one-node-per-country
      Europe, hourly, 2011, 95% CO2.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Carries the Schlachtberger a-posteriori 1.5 factor verbatim into a non-European
      setting (31 Chinese provinces, hourly, greenfield, three grid topologies, 38 weather
      years), including in the transmission cost formula. Evidence that the margin travels
      as an unexamined convention across regions with entirely different grid codes and
      redundancy levels — the pitfall about regional transferability is grounded here.
  - paper: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      States the convention most plainly — "each flow in the transmission grid is
      constrained by the line capacity multiplied by a factor of 0.7, a convention used in
      the past decades to account for N-1 security" (Eq. 4) — applied uniformly across 6-306
      nodes and 2013-2018 in a dispatch-only PyPSA-Eur validation of measured German
      curtailment. The most useful paper on this card for the pitfalls section, because it
      is a BACKTEST: the derating is held fixed while resolution varies, so the reported
      curtailment bias is partly attributable to the margin being resolution-blind.
  - paper: "2025_Lindner_PyPSA-DE_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      "Based on [17], the N-1 criterium is approximated by restricting the maximal line
      loading to 70%" (Sec. III.C) — and notably the citation is to Gazafroudi, i.e. this
      study cites the paper that derived per-line buffer factors and then applies the
      uniform one anyway. The clearest single illustration of the gap between the method's
      literature and its practice. 49 regions, 3-hourly, full sector coupling, 2020-2045,
      and a 92 bn EUR transmission-investment claim resting on a 0.7 assumption.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      "Grid expansion is allowed, but line use is capped at 70% to approximate N-1
      security" (Sec. 3.2) — the derating co-existing with endogenous transmission
      expansion, which is the combination the pitfalls warn about: the margin scales with
      whatever capacity the model chooses to build, so it silently inflates the built
      volume. 39 nodes, 34 countries, 3-hourly, myopic 2030/2040/2050.
  - paper: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    tier: 1
    role: routine-use
    note: >
      The cleanest statement of the derating as an equation, S_n-1 = 0.7 * S_nom (Eq. 2),
      applied inside the OSM grid construction step and described as configurable in the
      PyPSA-Eur config file — the direct paper-to-config-key link for lines.s_max_pu. Also
      the only corpus paper that deliberately DISABLES dynamic line rating in its validation
      runs to isolate the topology effect, which is the correct discipline when comparing
      grid representations and the reason dynamic-line-rating is a separate variant here.
      318 NUTS2 nodes, 8760h, 2030.
pitfalls:
  - pitfall: >
      A uniform derating does not identify a contingency. It reserves headroom everywhere in
      the same proportion, so it over-derates corridors no outage would ever stress and
      under-derates the critical ones. Gazafroudi's line-specific factors on a 50-bus German
      network run from 0.59 to 1.0 — the flat 0.7 is simultaneously too tight on some lines
      and unsafe on others, and the run gives you no signal about which.
    evidence: "2021_Gazafroudi_N-1-Contingency-Topology_IJEPES.pdf"
    note: >
      Never report a derated run as "N-1 secure". Report it as "a 30% capacity margin
      applied as a proxy for N-1". If the user's question is WHICH element is critical, the
      derating cannot answer it at any resolution and you need
      explicit-contingency-constraints or lodf-based-screening.
  - pitfall: >
      s_max_pu is silently doing two jobs — security headroom and cluster-internal bottleneck
      correction. At 37 clusters most of the real congestion is inside a bus and invisible;
      at 300 nodes it is represented. Holding 0.7 fixed across resolutions therefore changes
      the effective security margin as you re-cluster.
    evidence: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    note: >
      Use resolution-dependent-derating: interpolate toward 0.5 as clusters fall toward ~37,
      and state the value alongside the cluster count as a single joint assumption. Any
      resolution sensitivity study that holds s_max_pu constant is confounding two effects.
  - pitfall: >
      Deriving the margin post-hoc (scale optimised NTCs up by 1.5) and deriving it pre-solve
      (scale limits down by 0.7) are not the same experiment, even though the algebra looks
      identical. In the post-hoc form the optimiser never saw the margin, so its dispatch,
      congestion rents and expansion decisions are all those of an unsecured system, and
      only the reported capacity number carries the margin.
    evidence: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    note: >
      Pick one and say which. For anything where dispatch, prices or curtailment is the
      answer, the margin must be inside the LP (lines.s_max_pu). The post-hoc form is only
      defensible when the deliverable is a headline transmission volume.
  - pitfall: >
      With endogenous transmission expansion the derating is applied to a DECISION variable,
      so the model must build 1/0.7 = 1.43x the transfer capability it actually wants. That
      inflation lands directly in the reported reinforcement volume and cost, and compounds
      with whatever transmission limit is set.
    evidence: "2025_DiBella_European-green-industrial-transformation.pdf"
    note: >
      When the answer is "how much grid must we build", state the margin explicitly and
      report both the derated usable capacity and the nominal built capacity. Check the
      transmission_limit interaction: a volume cap counts NOMINAL capacity while the LP is
      limited by the derated value.
  - pitfall: >
      The 33%/0.7 convention is European transmission practice imported without
      re-derivation. It is applied unchanged to Chinese provincial grids and, via
      pypsa-earth's identical default, to networks whose redundancy, meshedness and grid
      codes are entirely different — and where the topology itself is OSM-inferred and
      uncertain.
    evidence: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    note: >
      Outside Europe treat 0.7 as an assumption to sign off with the user, not a default.
      In sparsely meshed networks the true N-1 margin is larger (fewer parallel paths to
      absorb a lost flow), so 0.7 is optimistic exactly where the data is weakest.
  - pitfall: >
      The proxy is un-backtested. Frysztacki holds 0.7 fixed while sweeping 6-306 nodes and
      six years against measured German curtailment; the derating is never itself validated
      against a contingency calculation anywhere in the corpus, so its residual error is
      folded into whatever the study is measuring.
    evidence: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    note: >
      If a result is sensitive to congestion (curtailment, redispatch volume, nodal price
      spread), run at minimum a two-point sensitivity on s_max_pu — it is an L0 flip — and
      report the spread rather than a point value.
  - pitfall: >
      Explicit SCLOPF does not scale by adding hardware. 2*L*(N-1) constraints per snapshot
      hit 100 GB RAM on a FIFTY-bus network with 50 outages in Gazafroudi's corrective study.
      A user asking for "proper N-1 on Europe" at 8760 snapshots is asking for something the
      corpus has never done in one stage.
    evidence: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    note: >
      Route them to two-stage-proxy-then-sclopf (Titz's pattern: proxy for investment,
      explicit for dispatch, storage frozen) or to a screened outage subset. Budget the
      constraint count before promising, and note that the dense LODF matrix also erodes the
      cycle formulation's sparsity advantage.
  - pitfall: >
      electricity.operational_reserve.contingency looks like N-1 and is not. It is a fixed-MW
      adder to an hourly GENERATOR reserve requirement (GenX-style: epsilon_load * load +
      epsilon_vres * VRE + contingency MW), enforced on generator headroom with no reference
      to the network at all. Turning it on secures nothing about line outages; leaving it off
      does not mean generator contingencies are covered.
    evidence: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    note: >
      Keep the two concepts separate in the interview. Line N-1 -> lines.s_max_pu or SCLOPF;
      largest-generator-loss reserve -> electricity.operational_reserve. Note the defaults
      differ across models: eur ships contingency: 4000 (MW), earth ships 0, so the same
      activate: true gives materially different reserve requirements.
