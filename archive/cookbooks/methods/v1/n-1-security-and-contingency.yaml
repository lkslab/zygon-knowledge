        default: "true"
        provenance: "config/config.default.yaml:skip_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
    assembly:
      - step: >
          Set the proxy honestly first — this is the L0 baseline and for many questions the
          right final answer. Choose s_max_pu jointly with the cluster count (interpolate
          toward 0.5 at ~37 clusters) and record it as a stated assumption, not a default.
        uses: [line-security-margin]
        config: "lines.s_max_pu"
        code: null
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - step: >
          Bracket it. Solve at two or three s_max_pu values and report the spread on whatever
          congestion-sensitive quantity is the deliverable. Pure config, and it converts an
          un-validated convention into a stated sensitivity — the single highest
          value-per-effort step on this card.
        uses: [line-security-margin, scenario-matrix]
        config: "lines.s_max_pu via run.scenarios"
        code: null
        provenance: "scripts/prepare_network.py:set_line_s_max_pu; Snakefile:get_scenarios"
      - step: >
          (explicit route) Choose the monitored outage set OUTSIDE the model. Nothing at any
          layer helps: pypsa's branch_outages default is every passive branch, which is the
          failure mode. Select by voltage level, by pre-contingency loading from a proxy run,
          or by LODF magnitude if you implement the screening yourself.
        uses: []
        config: null
        code: "new driver script under scripts/ — no existing rule owns this"
        provenance: "pypsa/optimization/abstract.py:optimize_security_constrained"
      - step: >
          (explicit route) Call n.optimize.optimize_security_constrained(n,
          branch_outages=<subset>) from that driver on the prepared network. The BODF
          construction and the constraint copies are library code; do NOT reimplement them in
          the hook unless you need a formulation pypsa does not have (corrective/TATL is such
          a case — pypsa has only the preventive form).
        uses: [contingency-scopf]
        config: null
        code: "new driver script; or scripts/solve_network.py:custom_extra_functionality for a bespoke formulation"
        provenance: "pypsa/optimization/abstract.py:optimize_security_constrained; pypsa/contingency.py:calculate_BODF"
      - step: >
          (two-stage route, Titz's pattern and the recommended one at scale) Run stage one as
          a normal expansion solve under the 0.7 proxy, then re-solve dispatch under explicit
          SCLOPF with capacities fixed. solve_operations_network already fixes optimal
          capacities and re-solves, so stage two is that rule with the optimize call swapped.
        uses: [operations-only-solve, contingency-scopf]
        config: "the standard solve, then rule solve_operations_network"
        code: "scripts/solve_operations_network.py:fix_optimal_capacities"
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - step: >
          If expansion is on and you enforce explicit N-1, enable the iterative mode so
          reactances track capacities, and consider post-discretization — fractional line
          capacity is not a topology any contingency calculation should be trusted on.
        uses: [iterative-impedance-expansion, post-discretization]
        config: "solving.options.skip_iterations: false; solving.options.post_discretization.enable"
        code: null
        provenance: "scripts/solve_network.py:optimize_transmission_expansion_iteratively; scripts/solve_network.py:post_discretization"
      - step: >
          Report the security result, which no existing output holds: which contingency bound
