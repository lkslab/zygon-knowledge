        default: "'../data/custom_extra_functionality.py' (present but a no-op stub)"
        provenance: "config/config.default.yaml:custom_extra_functionality; scripts/solve_network.py:custom_extra_functionality; rules/common.smk:input_custom_extra_functionality"
      - key: "solving.options.skip_iterations"
        effect: >
          When false, line reactances are updated as capacities grow. Relevant to explicit
