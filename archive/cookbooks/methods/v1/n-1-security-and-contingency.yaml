pypsa_primitive:
  symbol: "pypsa/optimization/abstract.py:optimize_security_constrained"
  pypsa_version: "0.30.3"
  exposed_by: "neither — no config key or rule in pypsa-eur or pypsa-earth calls it, and neither repo contains the string `branch_outages`, `BODF` or `LODF` anywhere"
  reachable_via: >
    A driver script that loads a prepared or solved network and calls
    n.optimize.optimize_security_constrained(). Signature at 0.30.3:
    optimize_security_constrained(n, snapshots=None, branch_outages=None,
    multi_investment_periods=False, model_kwargs={}, **kwargs). `branch_outages` is the only
    method-specific argument: a list/Index (interpreted as Line names) or a MultiIndex
    (component, asset); None means EVERY passive branch, which is the setting that explodes.
    It is validated against n.passive_branches().index and raises on unknown names.
  note: >
    This is the field that reclassifies the whole card. Mechanism, verified by reading the
    implementation: it builds the model via n.optimize.create_model(), then per sub_network
    calls sn.calculate_BODF() (pypsa/contingency.py:calculate_BODF — BODF from branch_PTDF,
    dense num_branch x num_branch, diagonal set to -1) and for each (outage component,
    affected component) pair COPIES the existing s-limit constraints with the additional
    term flow_outage * bodf added to the lhs, naming them
    "...-s-<bound>-security-for-<outage>-in-<subnetwork>". So it is CONSTRAINT COPIES
    computed from BODFs, not sparse LODF screening: no outage pre-filtering, no LODF-decay
    pruning, no Ronellenfitsch dual formulation. It also degrades gracefully — with no
    passive branches it falls through to a plain n.optimize(). Consequences for a bundle:
    (a) explicit N-1 is L5-with-a-handle, not L5-from-scratch — the formulation exists and
    the wiring is a driver plus an outage list; (b) the screening step of the procedure has
    NO handle at any layer, so branch_outages must be chosen upstream by the user's own
    logic, and choosing it badly (None) is the failure mode; (c) it optimises, it does not
    merely check, so it composes with expansion in principle while being the thing that
    blows the constraint count in practice. Soft anchor: pypsa is a conda dependency, not a
    submodule, so this is pinned to a version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: line-security-margin
        role: >
          the shipped method — registry status `working`, and the ONLY N-1 treatment any
          default pypsa-eur run performs
      - id: contingency-scopf
        role: >
          the real method — registry status `absent`, and the registry's own note names the
          nearest substitutes as line-security-margin plus dynamic-line-rating
      - id: dynamic-line-rating
        role: >
          eur's advantage over earth: makes s_max_pu a per-line time series from the cutout,
          registry status `partial`, off by default
      - id: operational-reserves
        role: >
          the OTHER contingency concept, and the confusion to head off — a generator-side
          fixed-MW reserve adder, nothing to do with line outages
      - id: custom-constraint-hook
        role: >
          where hand-written post-contingency constraints land if SCLOPF is implemented
          inside the workflow rather than in an external driver
      - id: transmission-expansion-limits
        role: >
          interacts with the derating: the volume/cost cap counts nominal capacity while the
          LP is bounded by s_max_pu * s_nom, so the two must be read together
      - id: iterative-impedance-expansion
        role: >
          matters for explicit N-1 because BODFs depend on reactance; if capacities change,
          the sensitivities the constraints were built from are stale
      - id: operations-only-solve
        role: >
          the substrate for the two-stage pattern — stage two is a dispatch re-solve with
          capacities fixed, which this rule already does
      - id: post-discretization
        role: >
          relevant to security realism: fractional line expansion is not an N-1 topology,
          and this is the only surface that rounds it to unit sizes
    available:
      verdict: primitive-only
      how: >
        The workflow performs exactly one N-1 treatment: prepare_network sets every line's
        s_max_pu to the config scalar (default 0.7) with a log line calling it an "N-1
        security margin of lines". base_network also stamps the same value onto lines at
        build time. Nothing else in the repo touches contingencies — `branch_outages`, `BODF`
        and `LODF` do not appear in scripts/ or rules/ at all. Two adjacent surfaces exist
        and are worth knowing: dynamic line rating replaces the scalar with a weather-driven
        per-line time series (n.lines_t.s_max_pu, off by default), and the
        custom_extra_functionality hook is a sanctioned landing point for extra linear
        constraints. The real formulation is one layer down as pypsa 0.30.3's
        optimize_security_constrained.
      missing: >
        Procedure steps 1, 2, 6, 7 and 8 have no handle, and steps 4-5 have one only in the
        library: no contingency set definition, no BODF/LODF construction in the workflow, no
        post-contingency constraints, no screening (this one has no handle at ANY layer — not
        even in pypsa, which defaults branch_outages to every passive branch), no two-stage
        orchestration, and no security reporting. There is no preventive/corrective
        distinction and no TATL concept anywhere. Every corpus study that enforced explicit
        N-1 on PyPSA-Eur did so outside the workflow.
      provenance: "scripts/prepare_network.py:set_line_s_max_pu; scripts/base_network.py:s_max_pu; scripts/solve_network.py:custom_extra_functionality"
    levers:
      - key: "lines.s_max_pu"
        effect: >
          The whole shipped method: multiplies every AC line's rating, so the LP sees
          s_max_pu * s_nom. 1.0 disables the margin; 0.5-0.7 is the corpus range; make it
          resolution-dependent per the Hoersch 2017 (EEM) interpolation.
        default: "0.7"
        provenance: "config/config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "lines.dynamic_line_rating.activate"
        effect: >
          Switches the static scalar for a weather-dependent per-line, per-snapshot rating
          built from the cutout. Changes the THERMAL limit, not the contingency headroom —
          combining it with a security margin needs an explicit decision about which factor
          survives.
        default: "false"
        provenance: "config/config.default.yaml:dynamic_line_rating; scripts/build_line_rating.py:calculate_line_rating; scripts/add_transmission_projects_and_dlr.py:attach_line_rating"
      - key: "lines.dynamic_line_rating.correction_factor"
        effect: >
          Derates the computed weather rating (a second, independent margin on top of
          s_max_pu). Note attach_line_rating writes n.lines_t.s_max_pu = (rating / s_nom) *
          correction_factor, so this is the DLR path's version of the security scalar.
        default: "0.95"
        provenance: "config/config.default.yaml:correction_factor; scripts/add_transmission_projects_and_dlr.py:attach_line_rating"
      - key: "lines.dynamic_line_rating.max_line_rating"
        effect: >
          Caps the weather uplift as a multiple of nominal — the guard against DLR handing
          back more capacity than a security margin was meant to reserve.
        default: "false"
        provenance: "config/config.default.yaml:max_line_rating; scripts/add_transmission_projects_and_dlr.py:attach_line_rating"
      - key: "electricity.operational_reserve.activate"
        effect: >
          Turns on the GENERATOR reserve constraint. Included here to be excluded: it does
          not secure the network. Flip it only if the user's contingency is a generator trip.
        default: "false"
        provenance: "config/config.default.yaml:operational_reserve; scripts/solve_network.py:add_operational_reserve_margin"
      - key: "electricity.operational_reserve.contingency"
        effect: >
          Fixed MW added to every snapshot's reserve requirement, on top of epsilon_load *
          load and epsilon_vres * VRE — conventionally the largest single generator. Inert
