id: operational-dispatch-and-rolling-horizon
title: "Operational (dispatch-only) optimisation and rolling-horizon / limited-foresight solving"
summary: >
  Optimise only the dispatch of a system whose capacities are already fixed — either
  as one solve over the whole period, or as a sequence of shorter overlapping windows
  that each see only a limited look-ahead.
question: >
  Given this fleet, how would it actually be operated — and how much of the answer is
  an artefact of the optimiser knowing the entire year in advance?
aliases:
  - "dispatch-only optimisation"
  - "operational optimisation"
  - "economic dispatch"
  - "unit dispatch / production cost model"
  - "PCM (production cost modelling)"
  - "rolling horizon"
  - "receding horizon"
  - "moving window optimisation"
  - "limited foresight"
  - "myopic dispatch"
  - "myopic foresight"
  - "perfect foresight dispatch"
  - "look-ahead horizon"
  - "hindcast / backcast dispatch"
  - "operational feasibility check"
when_to_use:
  - "how would this system actually be operated, not what should we build"
  - "run the model with capacities fixed, don't let it build anything"
  - "reproduce what happened in 2022 with this model"
  - "simulate a market year at existing capacity"
  - "does the optimiser cheat by knowing the whole year in advance"
  - "the model's storage looks too good — it knows the future"
  - "solve it day by day like a day-ahead market would"
  - "what does dispatch look like with only 24/48 hours of foresight"
  - "how much load shedding does this design cause in a bad weather year"
  - "check whether the capacities from the coarse model are actually operable"
  - "production cost model / PCM run"
  - "hourly generation and prices for a fixed fleet"
family: temporal-resolution
prevalence:
  papers: 9
  tier1: 4
  tier2: 5
  sweep_hits: 17
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 9 papers that actually run a
    dispatch-only optimisation at fixed capacity. The regex screen returned 17; the 8
    extra are papers where "dispatch" appears once as ordinary vocabulary for the
    operational half of a capacity-expansion LP (Brown 2018 sector coupling, Victoria
    2019 storage, Neumann 2022 losses, Neumann 2023 hydrogen, Zhu 2018, Zeyen 2025,
    Geis 2026, Xie 2024) — co-optimised dispatch inside an expansion run is NOT this
    method, and none of those fixes capacity or limits foresight. Odenweller 2026
    (REMIND-PyPSA soft-link, 4 hits) was excluded on the same test. Groissbock 2017 is
    flagged in EVIDENCE_INDEX as a suspect but is KEPT: PyPSA there IS the economic
    dispatch engine, called per capacity scenario, which is the method even though the
    surrounding expansion loop is Excel. Roles skew hard to routine-use (5 of 9): this
    is infrastructure that most papers use without discussing, which is exactly why the
    perfect-foresight artefact below goes unremarked so often.
procedure:
  - step: >
      Obtain the fleet. Two routes: fix capacities from a prior capacity-expansion solve
      of the same model, or insert exogenous capacities from a historical/statistical
      fleet database. Which route you take decides whether the run is a feasibility test
      of a model output or a hindcast against reality.
    handle: "n.optimize.fix_optimal_capacities() (expansion route); electricity.powerplants_filter (historical route)"
    provenance: "scripts/solve_operations_network.py:fix_optimal_capacities; scripts/build_powerplants.py:powerplants_filter"
  - step: >
      Remove capacity from the variable set: every nominal attribute becomes fixed
      (p_nom_extendable = False for generators, links, stores, storage units; s_nom for
      lines). The objective collapses to variable operating cost only, so annualised
      capital cost no longer influences dispatch.
    handle: "n.optimize.fix_optimal_capacities(); or electricity.extendable_carriers emptied + transmission limit ll v1.0"
    provenance: "scripts/solve_operations_network.py:fix_optimal_capacities; scripts/prepare_network.py:set_transmission_limit"
  - step: >
      Add a feasibility valve. A dispatch-only LP over a fixed fleet is routinely
      infeasible where an expansion LP would simply have built more, so the corpus adds
      non-extendable load-shedding generators at a high but finite cost (5000 EUR/MWh in
      Karkossa, "high but non-extendable" in Frysztacki). Shed energy then becomes a
      RESULT — the adequacy metric — rather than an error.
    handle: "solving.options.load_shedding.{enable,default_cost}"
    provenance: "config/config.default.yaml:load_shedding; scripts/solve_network.py:add_load_balance_components"
  - step: >
      Decide the foresight regime. EITHER solve all snapshots at once (perfect foresight
      over the whole period), OR partition the snapshots into windows of `horizon` steps
      solved consecutively. This single choice is the method's payload and is discussed
      in step 5.
    handle: "solving.options.rolling_horizon"
    provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:optimize_with_rolling_horizon"
  - step: >
      If rolling: choose window length and overlap. Windows advance by
      (horizon - overlap) snapshots; the overlap region is solved twice and only the
      non-overlapping head is kept, which gives every retained hour some look-ahead
      beyond itself. Corpus values: 96h horizon / 48h overlap (Brown 2025), 336h / 0
      overlap (Karkossa 2026), 36h horizon re-optimised daily (Welfonder 2024), 24h / 0
      (Franken 2025). Zero overlap is the cheap default and the one that hurts storage.
    handle: "solving.options.horizon; solving.options.overlap"
    provenance: "config/config.default.yaml:horizon; config/config.default.yaml:overlap"
  - step: >
      Chain storage state across windows. Each window's terminal state of charge becomes
      the next window's initial state, and — critically — the CYCLIC state-of-charge
      constraint must be dropped, or every window is independently forced back to its
      own starting level and no energy can be moved between windows at all.
    handle: "prepare_network(..., rolling_horizon=True) sets state_of_charge_cyclic/e_cyclic = False; pypsa then carries e_initial forward"
    provenance: "scripts/solve_network.py:state_of_charge_cyclic"
  - step: >
      Supply a terminal value for stored energy, or accept the myopic bias. Inside a
      window the optimiser has no reason to end with energy in store, so it empties
      long-duration storage at every window boundary. The corpus's fix is an exogenous
      bid price: Brown 2025 bids chemical storage at a constant marginal storage value
      equal to the mean of the long-term model's storage shadow price. Nothing in either
      workflow does this.
    handle: null
    provenance: null
  - step: >
      Solve, then read the operational quantities the question actually needs: nodal
      prices from the duals, generation by carrier, curtailment, unserved energy, storage
      cycling. In a fixed-capacity run the bus dual is a short-run marginal price rather
      than a long-run one, which is what makes this the right run for a price study.
    handle: "n.buses_t.marginal_price; make_summary"
    provenance: "scripts/make_summary.py:marginal_price"
  - step: >
      (validation extension) Repeat over several historical years and score the modelled
      hourly series against observed market data. Karkossa 2026 scores SMAPE/MAE/RMSE on
      prices for 2020-2024 x 35 countries and compares perfect-foresight against
      rolling-horizon head to head — the only way to establish which foresight regime is
      the honest one for a given system.
    handle: null
    provenance: null
variants:
  - id: full-year-perfect-foresight-dispatch
    what: >
      One solve over the whole period at fixed capacity. Cheapest, simplest, and the
      corpus baseline — but the optimiser sees all 8760 hours, so every store is
      dispatched with knowledge of the future. Use when dispatch is a feasibility test
      or a pre-screen rather than a claim about how the system would be run.
    papers:
      - "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
      - "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
  - id: rolling-window-with-overlap
    what: >
      Sequential windows that overlap, so each retained hour has look-ahead beyond
      itself. The corpus's answer to the perfect-foresight artefact. Brown 2025's 96h/48h
      is the reference parameterisation; it costs roughly 2x the solves of a
      non-overlapping schedule of the same window length because the overlap is solved
      twice.
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
  - id: rolling-window-no-overlap
    what: >
      Windows tile the period without overlap: state of charge is chained but each
      window is blind to the next. Cheapest rolling variant and the one that most
      distorts storage, because the last hour of every window has zero incentive to
      retain energy. Karkossa's two-week windows; Franken's independent days.
    papers:
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
  - id: market-aligned-multistage-dispatch
    what: >
      Windows aligned to real market gate-closure times rather than a fixed stride, with
      the information set changing per stage: stochastic before the reserve auction,
      partially resolved after it, deterministic on the delivery day. The only variant
      that reproduces what an actual trader's optimisation looks like; requires unit
      commitment and a scenario generator.
    papers:
      - "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
  - id: dispatch-as-feasibility-screen
    what: >
      The dispatch run is not the answer but a filter: solve at fixed capacity to find
      out where the design fails. Frysztacki reads load shedding and curtailment to score
      three disaggregation algorithms; Stoeckl reads line loading (>70% always, >90%
      once) to select transmission expansion candidates; Grochowicz reads load shedding
      to cross-validate a shadow-price event detector. Cheap, and the most common use in
      the corpus.
    papers:
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
      - "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
  - id: historical-hindcast-dispatch
    what: >
      Fleet and fuel prices taken from history rather than from a prior model solve, run
      over past years so the output can be scored against observed prices and
      generation. Needs time-varying fuel and CO2 prices, a date-filtered fleet, and the
      real weather year — a data problem more than a code one.
    papers:
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
      - "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
literature:
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: extends
    note: >
      The key paper for this card and the only one in the corpus that tests the foresight
      regime as a hypothesis rather than assuming one. PyPSA-Eur v2025.07.0, 39 nodes,
      hourly, fixed capacities, 2020-2024, 35 countries, three scenarios: perfect
      foresight + static fuel prices, perfect foresight + dynamic fuel prices, rolling
      horizon + dynamic fuel prices. Rolling windows are 336h with NO overlap and final
      state of charge passed between windows; load shedding priced at 5000 EUR/MWh; no
      unit commitment. Best rolling-horizon result was 20.76% average SMAPE against
      observed prices. Contributes the card's sharpest concrete warning: a cyclic
      storage constraint requiring equal hydro reservoir levels at the start and end of
      each window caused load shedding in Norway — the exact failure mode the config key
      is supposed to prevent.
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference parameterisation for overlapping windows: "a rolling-horizon dispatch
      optimisation with a 96-hour look-ahead horizon and a 48-hour overlap between
      windows", only the first 48 hours of each window retained, capacities fixed from a
      long-term model. Also the source of the terminal-value fix: chemical storage is bid
      at a CONSTANT marginal storage value equal to the mean of the long-term model's
      storage shadow price, deliberately not state-of-charge dependent. Quantifies the
      cost of myopia directly — peak load shedding up 13.9% and average load served down
      0.5% versus perfect foresight — which is the number to quote to a user who asks
      whether foresight matters. PyPSA v0.27.1 library, single-node, three countries, 70
      weather years.
  - paper: "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for dispatch-as-feasibility-screen and the clearest statement of what
      the method IS: "the model is solved as a pure operational problem, where no further
      capacity can be built ... the technology capacities are removed from the set of
      optimisation variables and replaced by a fixed number". Full-year, 2-hourly, 1250
      nodes, capacities from three competing disaggregation algorithms, load-shedding
      generators with high non-extendable capacity to guarantee feasibility, Gurobi
      interior point (barrier tol 1e-9, feas tol 1e-6), 5-node HPC cluster at 48 CPU /
      256 GB per node. Run twice per design ("regular" vs "copperplate" intra-cluster
      transmission), which is a useful diagnostic pattern in its own right: it separates
      infeasibility caused by the fleet from infeasibility caused by the network.
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: routine-use
    note: >
      The most extreme foresight restriction in the corpus and an honest account of its
      cost: 1096 independent daily solves (2022-01-01 to 2024-12-31), 48 half-hourly
      settlement periods each, ~300 GSP buses, exogenous capacities from historical data,
      NTC links with Kirchhoff's law removed. "Each model run only uses a 24-hour
      optimisation horizon", and storage units carry NO state of charge between days. The
      paper itself names this a limitation for pumped hydro whose energy-to-power ratio
      implies inter-day optimisation — i.e. a worked example of the pitfall below, stated
      by the authors.
  - paper: "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
    tier: 2
    role: defines
    note: >
      Defines the rolling/receding-horizon pattern for this literature in the crispest
      terms — "the optimal UC strategy for, e.g., the next 36h is calculated, but is only
      applied for the next hour or the next day, after which the optimal strategy is
      recalculated" — and generalises it to a three-stage market-aligned scheme keyed to
      gate closures (aFRR at 09:00, day-ahead at 12:00, delivery day). 36h horizon,
      re-optimised daily at midnight, each stage a fresh MILP with updated ARIMAX
      scenario draws. Built as modular extensions to the PyPSA library, not to a
      workflow, which is why nothing in either model exposes any of it.
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: routine-use
    note: >
      Uses dispatch-only runs as the out-of-sample cross-validation for a different
      method: 1600 dispatch optimisations (40 capacity designs x 40 weather years),
      PyPSA-Eur 0.6.1, 181 generation / 90 network nodes, 1-hourly, an artificial
      high-cost generator at every node so load shedding is measurable. The scale is the
      lesson — dispatch-only runs are cheap enough to do 1600 of, which is why they are
      the natural inner loop of a weather-year ensemble.
  - paper: "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Full-year hourly dispatch of the German system for 2015 at 128 nodes with the
      existing fleet fixed, derived from PyPSA-Eur data, re-solved under a sweep of CO2
      caps and CO2 prices. Establishes the pattern of using a dispatch-only model as the
      testbed for a policy instrument, and is the corpus's warning that a dispatch model
      re-solved under a hard cap can produce genuinely counter-intuitive (Giffen-like)
      responses.
  - paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    tier: 2
    role: routine-use
    note: >
      Dispatch-only at fixed capacity used purely as a pre-screen at full grid resolution
      (6795 buses, 3 representative 24-hour periods, 2013 weather, 2050 horizon): solve
      the operational problem first, then flag lines and transformers as expansion
      candidates on loading thresholds (>70% across all time steps, or >90% at least
      once). The pattern to reuse when the expansion problem is too large to pose
      directly.
  - paper: "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
    tier: 2
    role: routine-use
    note: >
      PyPSA at its most reduced: called as an external economic-dispatch tool from an
      Excel-driven expansion loop for two isolated Saudi mini-grids, full-year hourly,
      single bus, no network, GLPK, one dispatch solve per capacity scenario (PV/wind/CSP/
      GT swept 5-150% of peak demand) with annuities added outside PyPSA. Two caveats the
      paper states explicitly and that generalise to every card in this book: the dispatch
      "does not consider spinning reserve or forecasting errors", and ramp rates were not
      applied. The template for soft-linking a dispatch engine into someone else's
      planning framework.
pitfalls:
  - pitfall: >
      A whole-year dispatch solve gives storage PERFECT FORESIGHT over all 8760 hours.
      No real operator has this, and the LP exploits it: storage is charged and
      discharged on the exact global optimum of the year, so its revenue, cycle count and
      contribution to adequacy are all systematically overstated, and the residual need
      for other flexibility is understated. Nothing in the run signals that this is
      happening — the solve simply succeeds.
    evidence: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    note: >
      Quantified in Brown 2025: moving from perfect foresight to a 96h/48h rolling regime
      raised peak load shedding 13.9% and cut average load served 0.5% on the SAME fleet.
      If the user's question is about storage value, price spikes, adequacy or dispatch
      realism, perfect foresight is the wrong regime and rolling-window-with-overlap is
      the answer. If the question is a feasibility screen (dispatch-as-feasibility-screen)
      the artefact is benign — it makes the screen optimistic, i.e. conservative about
      declaring a design infeasible.
  - pitfall: >
      Rolling horizon does not remove the foresight problem, it MOVES it to the window
      boundary. Inside a window the optimiser is still clairvoyant; at the end of a window
      stored energy has no value, so long-duration storage is drained into every seam. The
      shorter the window relative to the storage duration, the worse: Franken's 24-hour
      independent days cannot use pumped hydro inter-day at all.
    evidence: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    note: >
      Two mitigations, in order of preference. (1) Overlap: set `overlap` to at least the
      characteristic duration of the storage you care about — Brown's 48h overlap on a 96h
      window is the corpus reference. (2) A terminal value for stored energy, which no
      workflow implements; Brown's version is a constant bid at the long-term model's mean
      storage shadow price. Never present rolling-horizon storage revenues from a
      zero-overlap run as an arbitrage estimate.
  - pitfall: >
      The cyclic state-of-charge constraint is fatal in a rolling run. If
      state_of_charge_cyclic / e_cyclic survive, EVERY window is forced to end at its own
      starting level, which both forbids inter-window energy transfer and can make windows
      individually infeasible. pypsa-eur therefore clears the cyclic flags and zeroes the
      initial state when `rolling_horizon: true` — but ONLY in scripts/solve_network.py;
      scripts/solve_operations_network.py calls prepare_network without the
      `rolling_horizon` argument, so the dedicated operations rule does not get the fix.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      Karkossa reports exactly this failure in the wild: a cyclic constraint on hydro
      reservoir levels per window caused load shedding in Norway. Assert
      `not n.storage_units.state_of_charge_cyclic.any() and not n.stores.e_cyclic.any()`
      on the network before a rolling solve, and prefer the `rolling_horizon: true` path
      through rule solve_network over rule solve_operations_network until the latter is
      fixed upstream.
  - pitfall: >
      Fixing capacity changes what the bus dual MEANS. With capacity variable, the
      marginal price contains a long-run scarcity component; with capacity fixed it is a
      short-run marginal cost that can sit at zero for long stretches and then jump to the
      load-shedding cost. The choice of load-shedding price is therefore silently setting
      the price cap of the study.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      Report the load-shedding cost alongside any price result (Karkossa: 5000 EUR/MWh;
      pypsa-eur default: 100000 EUR/MWh, which will produce implausible price spikes if
      left alone in a hindcast). See shadow-prices-and-marginal-values and
      price-formation-and-scarcity-rents.
  - pitfall: >
      A dispatch-only LP with no unit commitment, no reserve requirement and no forecast
      error is not an operational simulation, however fine the time resolution. Groissbock
      states it plainly of PyPSA-as-dispatch-tool: it "does not consider spinning reserve
      or forecasting errors within the dispatch", and ramp rates were not applied.
    evidence: "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
    note: >
      If the user's question is about thermal cycling, minimum stable generation,
      start-up cost or reserve adequacy, this card is the wrong one on its own — compose
      with unit-commitment-and-ramping (and note Karkossa deliberately ran WITHOUT unit
      commitment, which is part of why its price SMAPE floors around 20%).
  - pitfall: >
      Perfect-foresight and rolling-horizon runs are not comparable on objective value.
      Rolling horizon is a heuristic: the sum of window objectives is an upper bound on
      the true single-solve optimum, and pypsa-eur's own objective-value check is skipped
      in the rolling path (`if not rolling_horizon: check_objective_value(...)`), while
      the returned status/condition are set to empty strings.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      Compare the two regimes on physical and market outputs (prices, generation mix,
      unserved energy, SMAPE against observation) as Karkossa does — never on total system
      cost. And be aware that a rolling run reports no solver status: a window that failed
      is a warning in the log, not a failed rule, so check the log rather than trusting
      the presence of an output file.
requires_methods: []
