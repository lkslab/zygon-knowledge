pypsa_primitive:
  symbol: "pypsa/statistics.py:market_value; pypsa/statistics.py:revenue; pypsa/optimization/optimize.py:assign_duals"
  pypsa_version: "0.30.3"
  exposed_by: "partly — pypsa-eur calls market_value in make_summary; pypsa-earth calls neither"
  reachable_via: >
    The INPUTS to this method are library-side and free: assign_duals writes
    n.buses_t.marginal_price on every solve, statistics.revenue and
    statistics.market_value give the correctly snapshot-weighted numerator and
    denominator of a capture price, and statistics.capex gives the annuity to compare it
    against. What has no primitive is everything this card is actually about: there is no
    price-regime decomposition, no bid-curve reconstruction from the duals, no
    price-setter identification, no scarcity-rent decomposition, no elastic demand and no
    revenue-concentration metric anywhere in pypsa 0.30.3. The marginal storage value is
    the one input that needs a flag rather than nothing: the storage energy-balance dual
    is only written when the solve is asked for all duals.
  note: >
    The primitive layer gives you the price and the revenue; it gives you nothing that
    explains either. That is the honest shape of this card — the extraction is L0/L1 on
    top of shadow-prices-and-marginal-values, and every interpretive step is L5. Soft
    anchor: pypsa is a conda/pip pin rather than a submodule, so this is a version claim,
    not a SHA claim.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: nodal-marginal-prices
        role: >
          the raw material — registry `working`; every solved network carries
          n.buses_t.marginal_price, and the whole method is interpretation on top of it
      - id: load-shedding-voll
        role: >
          the single most consequential lever on this card. OFF by default here, so an
          inadequate system is infeasible and scarcity prices are unbounded. When enabled
          it is a per-carrier mapping with p_nom=np.inf, so the ceiling is exact and
          absolute — no price can ever exceed default_cost
      - id: load-sinks
        role: >
          the FLOOR, and a capability earth has no entry for at all: the same
          add_load_balance_components with sign=-1, so negative prices are bounded at
          -default_cost. Determines the negative-price tail, which is where supported-VRE
          bidding shows up
      - id: curtailment-mode
        role: >
          the diagnostic that separates "price is zero because VRE are at the margin"
          from "price is zero because supply is being spilled" — it pins VRE to their
          profile and makes curtailment a dispatched carrier with marginal_cost -0.1.
          Another entry earth lacks entirely
      - id: numeric-stability-options
        role: >
          `noisy_costs: true` adds ~1e-2 EUR/MWh to every marginal cost, so a
          zero-marginal-cost carrier never bids exactly zero. Makes duals reproducible
          and slightly wrong — the reason every test on this card needs a tolerance
      - id: summary-outputs
        role: >
          the extraction layer that is already right: market_values delegates to
          n.statistics.market_value, and metrics carries electricity_price_mean/std plus
          the near-zero-hour share at a 0.1 threshold
      - id: emission-pricing
        role: >
          the policy instrument that determines whether the market-value trend is a
          cannibalisation curve or a cost-recovery curve. `costs.emission_prices` is a
          tax (raises fossil marginal cost, so prices rise when fossil is at the margin)
      - id: co2-cap
        role: >
          the other instrument — a cap rather than a tax, whose dual enters the
          zero-profit identity as MV = LCOE + e*mu_CO2. `co2limit_enable` is false by
          default, so the identity's policy term is absent from a default run
      - id: dynamic-emission-pricing
        role: >
          the hindcast lever: a time-varying CO2 price from ETS spot data, which the
          critique paper shows propagates straight into the price series
      - id: operations-only-solve
        role: >
          the ST half of the LT/ST fork, and a dedicated rule earth does not have — fixes
          capacities from a prior expansion run, which is the configuration whose prices
          are comparable to observed market data
      - id: operational-reserves
        role: >
          the nearest thing to a second market product: an hourly reserve requirement
          co-optimised with dispatch. Its own dual is a reserve price, which is as close
          as either model gets to an ancillary market
      - id: demand-elasticity
        role: >
          registry `absent` — loads are fixed profiles. This is the gap that matters most
          on this card, because elastic demand is the corpus's answer to whether an
          energy-only market recovers costs
      - id: market-design-mechanisms
        role: >
          registry `absent` — no bids, no capacity remuneration, no product
          co-optimisation. Every price here is a competitive-benchmark shadow price, so a
          "do we need a capacity market" question cannot be answered by simulating one
      - id: probabilistic-adequacy
        role: >
          registry `absent` — no forced-outage draws or LOLE, so the scarcity-hour set is
          driven by weather and demand only, never by unit unavailability
      - id: temporal-resolution-nh
        role: >
          the affordability lever that this method cannot use: coarsening destroys the
          price composition the method reports
      - id: time-segmentation-tsam
        role: "worse than nH here — merging similar hours removes the scarcity tail entirely"
      - id: perfect-foresight
        role: >
          `working` here and absent in earth, but the price extraction on that path is
          the weakest in the repo: make_summary_perfect's market values carry no snapshot
          weighting
    available:
      verdict: assemble
      how: >
        Every INPUT exists and most are already tabulated. A solved network carries
        n.buses_t.marginal_price; `rule make_summary` emits market_values (delegated to
        n.statistics.market_value, i.e. correctly snapshot-weighted revenue/supply),
        weighted_prices (demand-weighted and correctly `weights @` aggregated) and metrics
        carrying electricity_price_mean, electricity_price_std and
        electricity_price_zero_hours — the last computed as the share of prices below 0.1,
        which is already the noise-tolerant zero test this card recommends. The price
        ceiling and floor are both first-class config (load_shedding / load_sinks, each
        with per-carrier costs), the zero-marginal-cost premise is explicit
        (process_cost_data derives marginal_cost as VOM + fuel/efficiency with both
        fill_values zero, so VRE are exactly zero before noise), and the LT/ST fork is a
        real rule rather than a manual capacity freeze (solve_operations_network calls
        n.optimize.fix_optimal_capacities). Curtailment mode and load sinks are two
        diagnostics for reading a zero or negative price that pypsa-earth has no
        equivalent of at all. So the verdict is `assemble`, not `turnkey`: nothing has to
        be invented, but nothing in the repo composes these into a price-formation answer.
      missing: >
        Procedure steps 4, 5, 7, 8 and 9 have no handle. Concretely: (1) no price-regime
        decomposition — nothing anywhere attributes an hour's price to VRE, storage,
        thermal or scarcity; (2) no bid-curve reconstruction and no price-setter
        identification, which is the card's most valuable variant and is pure new code
        against the duals; (3) no revenue-concentration or scarcity-rent metric — metrics
        gives mean, std and zero-hour share and stops, so the "35% of cost in 1% of hours"
        result has no in-repo handle; (4) no cost-recovery comparison at all: market_values
        and capex are both computed, in the same script, and never divided by each other,
        so the zero-profit check that would validate the whole extraction is three lines
        that nobody wrote; (5) elastic demand is absent (registry `demand-elasticity`),
        so the corpus's central mechanism cannot be run — the nearest in-repo substitutes
        are a load-shedding step at a low default_cost (a one-step VOLL bid curve) and
        `sector.marginal_cost_heat_vent`, neither of which is a demand curve; (6) the
        marginal storage value needs `solving.options.assign_all_duals`, which
        solve_network reads via a bare .get() and which is NOT in config.default.yaml —
        so the storage-arbitrage variant is gated behind a key that must be added by hand
        and cannot be recovered after the solve.
      provenance: "scripts/make_summary.py:calculate_metrics; scripts/make_summary.py:calculate_market_values; scripts/solve_network.py:assign_all_duals; scripts/process_cost_data.py:prepare_costs"
    levers:
      - key: "solving.options.load_shedding.enable"
        effect: >
          Adds a slack generator with p_nom=np.inf at every bus, which puts an exact and
          absolute CEILING on every price in the run. Off by default, so a default eur run
          has unbounded scarcity prices and becomes INFEASIBLE rather than expensive when
          the system is inadequate. This is the first decision of any price-formation
          study and there is no neutral setting.
        default: "false"
        provenance: "config/config.default.yaml:load_shedding; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.load_shedding.default_cost"
        effect: >
          The VOLL in EUR/MWh, i.e. the numeric price cap. The shipped 100000 is ~50x the
          2000 EUR/MWh VOLL the corpus's price-formation study uses as its step demand
          curve, so leaving it at the default makes the scarcity tail two orders of
          magnitude larger than the literature's benchmark.
        default: "100000"
        provenance: "config/config.default.yaml:default_cost; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.load_shedding.carriers"
        effect: >
          Per-bus-carrier shedding costs, so heat, H2 and electricity can carry different
          VOLLs. The route to a carrier-specific willingness-to-pay ceiling in a
          sector-coupled run, and the closest the config gets to a demand bid.
        default: "{} (empty; all_carriers: true then applies default_cost everywhere)"
        provenance: "config/config.default.yaml:carriers; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.load_sinks.enable"
        effect: >
          The mirror image (add_load_balance_components with sign=-1): paid absorption of
          surplus, which puts a FLOOR on negative prices at -default_cost. Off by default,
          so the negative-price tail is whatever KVL and must-run structure produce. A
          capability with no pypsa-earth counterpart.
        default: "false"
        provenance: "config/config.default.yaml:load_sinks; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.curtailment_mode"
        effect: >
          Pins VRE to their profile (p_min_pu = p_max_pu) and adds negative-dispatch
          `curtailment` generators at marginal_cost -0.1 on every AC bus, so spilled
          energy becomes a dispatched carrier. The diagnostic that distinguishes a zero
          price with VRE at the margin from a zero price with energy being spilled — but
          note it also plants a -0.1 EUR/MWh bid, so it perturbs the very price it is
          being used to explain.
        default: "false"
        provenance: "config/config.default.yaml:curtailment_mode; scripts/solve_network.py:curtailment_mode"
      - key: "solving.options.noisy_costs"
        effect: >
          Adds 1e-2 + 2e-3*U(-0.5,0.5) EUR/MWh to every component's marginal_cost (and a
          length-scaled perturbation to line capital costs) to break degeneracy. Makes the
          dual vector reproducible and every bid slightly wrong: a zero-cost carrier bids
          ~0.01, which is why the summary's zero-hour test uses 0.1 and why a bid-curve
          reconstruction must either tolerate the noise or switch it off and accept
          non-unique duals instead.
        default: "true"
        provenance: "config/config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
      - key: "costs.marginal_cost"
        effect: >
          Per-technology marginal-cost overrides — the direct way to set what a
          zero-fuel-cost carrier actually bids. DEPRECATED but live: process_cost_data
          copies config['marginal_cost'] into config['overwrites']['marginal_cost'] "for
          backward compatibility" and then emits a DeprecationWarning when applying it, so
          it works and the sanctioned surface is costs.overwrites.marginal_cost. Empty by
          default, so VRE bids come from VOM + fuel/efficiency = 0.
        default: "{}"
        provenance: "config/config.default.yaml:marginal_cost; scripts/process_cost_data.py:overwrite_costs"
      - key: "costs.emission_prices.enable"
        effect: >
          Switches from a cap to a CO2 TAX, added onto every fossil generator's
          marginal_cost. Which instrument is active decides whether the market-value trend
          is the corpus's cannibalisation curve or its cost-recovery curve, so this key
          and electricity.co2limit_enable are the two settings a value-factor result must
          be reported alongside.
        default: "false"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: "costs.emission_prices.dynamic"
        effect: >
          Uses an ETS CO2 price time series instead of a scalar, so fossil marginal costs
          — and therefore the price series — vary hour to hour. The lever the hindcast
          critique shows propagating directly into price accuracy.
        default: "false"
        provenance: "config/config.default.yaml:dynamic; scripts/prepare_network.py:add_dynamic_emission_prices"
      - key: "solving.options.rolling_horizon"
        effect: >
          Solves dispatch in myopic windows. The corpus's finding is that once storage is
          priced at its MSV, myopic dispatch is adequate — so this is the lever that tests
          that claim rather than a mere tractability trick, and it is the right price for a
          market question and the wrong one for a long-run storage-value question.
        default: "false"
        provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:solve_network"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Sets the snapshot weightings. Hourly (false) is effectively mandatory for this
          card: an nH value averages away spikes and an nSEG value merges the similar
          hours the price composition is made of. Coarsen only if the deliverable is a mean.
        default: "false (hourly, all weights 1)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours"
    assembly:
      - step: >
          Decide LT or ST first, because it changes which rule runs and what the price
          means. LT is the ordinary expansion solve and its prices satisfy the zero-profit
          identity by construction; ST is rule solve_operations_network, which fixes
          capacities from a prior expansion run via n.optimize.fix_optimal_capacities and
          gives the merit-order price of that fleet. Any comparison to observed prices
          must be ST.
        uses: [operations-only-solve, perfect-foresight]
        config: "foresight; the solve_operations_network target"
        code: null
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities; scripts/solve_network.py:solve_network"
      - step: >
          Set the ceiling and the floor EXPLICITLY, and write both numbers into the answer.
          Enable load_shedding with a defensible default_cost (the corpus's benchmark is
          2000 EUR/MWh, not the shipped 100000) if you want scarcity hours to price
          finitely; enable load_sinks if the negative-price tail is part of the question.
          Neither can be changed after the solve.
        uses: [load-shedding-voll, load-sinks]
        config: "solving.options.load_shedding.{enable,default_cost,carriers}; solving.options.load_sinks.enable"
        code: null
        provenance: "scripts/solve_network.py:add_load_balance_components"
      - step: >
          Add `assign_all_duals: true` under solving.options BY HAND — it is read via a
          bare .get() in solve_network and is absent from config.default.yaml. Without it
          the storage energy-balance dual is not written and the marginal storage value,
          which is the whole storage-arbitrage variant, is unrecoverable without re-solving.
        uses: [nodal-marginal-prices]
        config: "solving.options.assign_all_duals (absent from config.default.yaml — add it)"
        code: null
        provenance: "scripts/solve_network.py:assign_all_duals"
      - step: >
          Pin the policy instrument, because it is a term in the zero-profit identity. A
          cap (electricity.co2limit_enable, a Co2L token, or the sector co2_budget) gives
          MV = LCOE + e*mu_CO2; a tax (costs.emission_prices.enable) raises fossil bids
          directly. Record which one the run used next to any market-value or value-factor
          number.
        uses: [co2-cap, emission-pricing, dynamic-emission-pricing]
        config: "electricity.co2limit_enable; costs.emission_prices.{enable,co2,dynamic}"
        code: null
        provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:add_emission_prices"
      - step: >
          Fix the bids of the zero-fuel-cost carriers rather than inheriting them. The
          default is exactly zero (VOM and fuel both fill to 0, so marginal_cost = 0)
          plus ~0.01 of noise; costs.overwrites.marginal_cost sets them explicitly, and
          noisy_costs: false removes the perturbation at the cost of degenerate duals.
        uses: [numeric-stability-options]
        config: "costs.overwrites.marginal_cost (or the deprecated costs.marginal_cost); solving.options.noisy_costs"
        code: null
        provenance: "scripts/process_cost_data.py:overwrite_costs; scripts/solve_network.py:noisy_costs"
      - step: >
          Run hourly. This is the one method in the book where the standard tractability
          levers are disqualifying rather than merely lossy: resolution_elec must stay
          false, and TSAM segmentation must not be used, because the deliverable is the
          composition of the price distribution.
        uses: [temporal-resolution-nh, time-segmentation-tsam]
        config: "clustering.temporal.resolution_elec: false"
        code: null
        provenance: "scripts/prepare_network.py:average_every_nhours"
      - step: >
          Take the already-correct aggregates from make_summary rather than recomputing:
          market_values for the capture price (n.statistics.market_value, snapshot-weighted
          revenue/supply), weighted_prices for the demand-weighted price, and metrics for
          electricity_price_mean / _std / _zero_hours. The value factor is the ratio of the
          first two and is not emitted anywhere.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_market_values; scripts/make_summary.py:calculate_metrics"
      - step: >
          Write the cost-recovery check, which is the cheapest high-value addition here:
          make_summary already computes n.statistics.capex() and n.statistics.opex() inside
          calculate_metrics and market_value inside calculate_market_values, and never
          compares them. Revenue over annualised cost per carrier is a few lines in the
          same script and validates the entire extraction against the zero-profit identity.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py::calculate_metrics (add a recovery ratio per carrier)"
        provenance: "scripts/make_summary.py:calculate_metrics"
      - step: >
          Write the interpretive layer: price-regime shares, the duration curve, revenue
          concentration in the top N hours, the scarcity rent as LCOE minus the
          demand-weighted price, and — the expensive one — the bid-curve reconstruction and
          price-setter labelling from the duals. All of this is new code against a solved
          network; none of it has a handle at any layer.
        uses: [nodal-marginal-prices, summary-outputs, curtailment-mode]
        config: "solving.options.curtailment_mode (to separate spilled-energy zeros from marginal-VRE zeros)"
        code: "a new extraction script beside scripts/make_summary.py"
        provenance: "scripts/solve_network.py:curtailment_mode; scripts/make_summary.py:calculate_metrics"
      - step: >
          If demand elasticity is in scope, it is a code addition: loads are fixed p_set
          profiles and the registry rates demand-elasticity `absent`. The cheapest
          approximation inside the existing surface is a load-shedding step at the
          willingness-to-pay level (a one-step VOLL bid curve, which is what the corpus's
          demand-curtailment study analyses over 100-400 EUR/MWh); a real linear or
          piecewise-linear bid curve means adding generators-as-demand-segments or a
          quadratic welfare objective.
        uses: [demand-elasticity, load-shedding-voll]
        config: "solving.options.load_shedding.{enable,default_cost} as the crude one-step substitute"
        code: "scripts/prepare_sector_network.py (add demand segments) or the custom_extra_functionality hook"
        provenance: "scripts/solve_network.py:add_load_balance_components; scripts/solve_network.py:custom_extra_functionality"
    boundary:
      - variant: price-duration-and-composition
        rung: L2
        note: >
          The price series is free (L0) and metrics already gives mean, std and the
          near-zero-hour share at a 0.1 threshold. Sorting into a duration curve and
          binning into regime shares is a small localised post-processing addition — L2 —
          with the real constraint being L1 upstream: resolution_elec must be hourly, or
          the curve's tail is an artefact.
      - variant: kkt-price-setter-identification
        rung: L5
        note: >
          The hardest variant and the card's centre of gravity. Needs per-technology bid
          reconstruction from the stationarity conditions (generators, converters,
          storage), assembly into hourly supply/demand curves, and a candidate-selection
          algorithm. No handle at any layer, in either model or in pypsa. The duals are
          free; everything that makes them legible is new code. Budget it as the published
          method's own contribution, because that is what it was.
      - variant: storage-arbitrage-as-fuel-cost
        rung: L2
        note: >
          L2 and gated: `solving.options.assign_all_duals` is consumed by solve_network but
          absent from config.default.yaml, so it must be added by hand BEFORE the solve.
          Once set, mu_energy_balance is on the storage components and dividing it by the
          discharge efficiency to get the effective bid is a short script — but nothing in
          the repo reads mu_energy_balance, and a missed flag means re-solving.
      - variant: zero-profit-cost-recovery-check
        rung: L2
        note: >
          The cheapest variant to add and the most useful. market_values (correctly
          snapshot-weighted) and capex/opex are both already computed in make_summary and
          never compared; a per-carrier revenue-over-annuity ratio is a localised edit to
          calculate_metrics. L2, not L0, only because nobody wrote the division.
      - variant: scarcity-rent-and-revenue-risk
        rung: L2
        note: >
          The LCOE-minus-weighted-price form is L2 — both terms exist in make_summary
          (total costs in metrics, weighted_prices per carrier) and need differencing. The
          revenue-concentration form (share of revenue from the top N hours) is also L2 as
          post-processing, but the ensemble version that makes it a RISK statement is a
          weather-year fan-out, which is L1 here (the default cutout spans 1940-2024, so
          moving the snapshots window is config) plus a run harness.
      - variant: elastic-demand-price-formation
        rung: L5
        note: >
          The registry rates demand-elasticity `absent`: loads are fixed p_set profiles
          with endogenous flexibility only via BEV DSM/V2G, residential heat DSM and an
          industry must_run slack. A VOLL step function is approximable at L1 with
          load_shedding at a low default_cost, but a linear or piecewise-linear bid curve
          means new components or a quadratic objective — and the corpus's central result
          (zero-price share falling from ~89% to ~31%) depends on the curve SHAPE, so the
          step approximation does not substitute for it.
      - variant: calibrated-bid-price-formation
        rung: L5
        note: >
          Nothing in the workflow estimates marginal costs from observed behaviour or
          encodes a per-unit support instrument. The ST scaffolding is real and helps
          (rule solve_operations_network, dynamic emission prices, powerplant matching for
          the unit list), but the SRMC estimation, the per-unit CfD/certificate bid and the
          balancing markup are all bespoke. L5 with good scaffolding rather than L5 from
          scratch.
    where:
      - change: "price regime decomposition, duration curve, revenue concentration, scarcity rent"
        anchor: "a new script beside scripts/make_summary.py; register it in rules/postprocess.smk::rule make_summary"
        provenance: "scripts/make_summary.py:calculate_metrics; rules/postprocess.smk:rule make_summary"
      - change: "cost-recovery / zero-profit ratio per carrier"
        anchor: "scripts/make_summary.py::calculate_metrics (capex/opex and market_value are already there)"
        provenance: "scripts/make_summary.py:calculate_metrics; scripts/make_summary.py:calculate_market_values"
      - change: "make the marginal storage value available at all"
        anchor: "solving.options.assign_all_duals -> scripts/solve_network.py::solve_network solve_kwargs"
        provenance: "scripts/solve_network.py:assign_all_duals"
      - change: "bid-curve reconstruction and price-setter labelling"
        anchor: "a new script consuming the solved network + assign_all_duals output; no existing rule owns this"
        provenance: "scripts/solve_network.py:assign_all_duals"
      - change: "elastic demand / willingness-to-pay bid curve"
        anchor: "scripts/prepare_sector_network.py (demand segments) or solving.options.custom_extra_functionality"
        provenance: "scripts/prepare_sector_network.py:add_electricity_grid_connection; scripts/solve_network.py:custom_extra_functionality"
      - change: "set the price ceiling / floor before solving"
        anchor: "solving.options.load_shedding | load_sinks -> scripts/solve_network.py::add_load_balance_components"
        provenance: "scripts/solve_network.py:add_load_balance_components"
    cost_profile:
      solves: >
        1 for a single-scenario price-formation answer — the duals come with the solve. The
        cost-recovery-as-risk question is one solve per weather year (the corpus uses 70-80)
        with capacities fixed after the first. A penetration or decarbonisation sweep of the
        market-value trend is one solve per level (the corpus uses 14 levels x 8
        decentralisation settings = 105 runs).
      relative: >
        ~3x a default study, before any ensemble: the binding cost is that hourly
        resolution is mandatory where a default sector run would be 3-hourly. An 80-year
        ensemble at fixed capacities is ~80x a dispatch solve, which is far cheaper than
        80x an expansion solve — fixing capacities first is the standard mitigation.
      note: >
        The usual savings are unavailable: segmentation and coarse nH destroy the price
        composition, and aggressive clustering destroys the locational spread that a
        market-design question is about. What IS affordable: electricity-only rather than
        sector-coupled for a pure price question, and ST dispatch at fixed capacities for
        every ensemble member after the first LT solve. assign_all_duals costs memory and
        file size, not solve time.
    verifies:
      - variant: zero-profit-cost-recovery-check
        check: "abs(revenue_by_carrier / annuity_by_carrier - 1).max() < 0.05"
        over: run
        note: >
          For extendable, unconstrained technologies this must hold by the KKT conditions,
          so a failure is a bug in the extraction — usually a missing snapshot weighting,
          a price cap that bound, or capex read at the wrong annuity — not an economic
          finding. Restrict the test to carriers with p_nom_extendable and no binding
          potential; a technology at its potential limit earns a rent and is SUPPOSED to
          exceed 1.
      - variant: price-duration-and-composition
        check: "not n.generators.query(\"carrier == 'load'\").empty or n.buses_t.marginal_price.max().max() < 1e5"
        over: run
        note: >
          Detects the unbounded-scarcity case: no load-shedding generators AND prices in
          the hundreds of thousands means the upper tail is a solver bound, not a system
          property, and every cost-recovery number derived from it is meaningless. The
          converse — shedding present and prices sitting exactly at default_cost — means
          the tail is a config number and must be reported as such.
      - variant: price-duration-and-composition
        check: "(n.snapshot_weightings.generators == 1).all()"
        over: run
        note: >
          Fails on any nH or nSEG run. A price composition (zero-hour share, spike
          frequency, percentiles) from unequally weighted snapshots is not a price
          composition — the metric silently becomes a statement about segments. Levels and
          weighted means survive coarsening; nothing else on this card does.
      - variant: storage-arbitrage-as-fuel-cost
        check: "n.storage_units.empty or (n.storage_units_t.mu_energy_balance.abs().to_numpy().max() > 0)"
        over: run
        note: >
          An all-zero mu_energy_balance frame means assign_all_duals was never set, so the
          marginal storage value is an uninitialised frame of zeros that looks exactly like
          'storage never has an opportunity cost'. Cannot be fixed after the solve.
      - variant: scarcity-rent-and-revenue-risk
        check: "revenue_share_top_1pct_hours < 0.99"
        over: run
        note: >
          A degenerate value near 1 means essentially all revenue arrives in a handful of
          hours, which in practice means the price cap or an infeasibility-adjacent
          scarcity event is carrying the whole result. Report the concentration explicitly
          rather than only the total, because the concentration is the investor's exposure.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: nodal-marginal-prices
        role: >
          the raw material — registry `working`, identical to eur because the duals are
          library-side. Everything that differs between the models on this card is in the
          layers above the dual
      - id: load-shedding-voll
        role: >
          the price ceiling, ON BY DEFAULT here at 100 EUR/kWh, so every default earth
          price series is capped at 100000 EUR/MWh without the user being told. Unlike
          eur the slack generator's p_nom is FINITE (max bus load x 1.2), so the cap is
          soft: if shedding capacity itself binds, the price goes above the nominal VOLL
      - id: summary-outputs
        role: >
          where the two models diverge hardest. earth's make_summary emits prices and
          weighted_prices and NEITHER applies snapshot weightings; there is no
          market_values implementation at all, so the capture price — the denominator of
          every cost-recovery statement on this card — cannot be produced
      - id: numeric-stability-options
        role: >
          `noisy_costs: true` with a fixed np.random.seed(174), so the perturbation is at
          least reproducible across runs. Same ~1e-2 EUR/MWh tie-breaking noise as eur
      - id: emission-pricing
        role: >
          the tax instrument (`costs.emission_prices`, added via the Ep opts token), which
          is the policy term in the zero-profit identity
      - id: co2-cap
        role: >
          the cap instrument, and unlike eur it is ON in the shipped default
          (`scenario.opts: ['Co2L-3h']`), so co2_shadow is populated out of the box and
          MV = LCOE + e*mu_CO2 is the live identity on a default earth run
      - id: sector-coupled-workflow
        role: >
          where multi-carrier price formation happens, and the path the corpus's earth
          study exercises. It is also the path whose summary rule is broken (see below)
      - id: gadm-admin-clustering
        role: >
          the route to prices on policy-meaningful regions rather than k-means clusters —
          necessary before a locational price-formation claim means anything
      - id: monte-carlo-sampling
        role: >
          registry `partial`, and earth's one structural advantage for this card: a real
          many-solve harness (LHS over network quantities, one solve per sample) that eur
          has no equivalent of. The natural fan-out for the weather-year cost-recovery
          ensemble
      - id: operations-only-solve
        role: >
          registry `absent` here where eur has a dedicated rule — so the LT/ST fork, which
          is procedure step 1 and the precondition for any comparison to observed prices,
          must be assembled by setting extendable=false and re-solving
      - id: operational-reserves
        role: "the nearest second product, same as eur: an hourly reserve requirement with its own dual"
      - id: demand-elasticity
        role: >
          registry `absent` — loads are fixed profiles, with only BEV DSM shifting
          endogenously. Same gap as eur and with less scaffolding around it
      - id: market-design-mechanisms
        role: >
          registry `absent` — no bids, no capacity remuneration. Every price is a
          competitive-benchmark shadow price
      - id: probabilistic-adequacy
        role: "registry `absent` — no outage draws or LOLE, so scarcity hours are weather-driven only"
      - id: safe-reserve-margin
        role: >
          registry `working` here (eur rates it `partial`): a planning reserve margin,
          which suppresses scarcity by fiat — it procures adequacy as a constraint instead
          of letting the price reveal it, so it must be off if scarcity pricing is the
          question
      - id: temporal-resolution-nh
        role: >
          the weighting trap live in the shipped default: `opts: ['Co2L-3h']` and
          `sopts: ['144h']`. 144h is 61 snapshots a year and cannot express a scarcity
          hour at all
      - id: time-segmentation-tsam
        role: "same hazard as eur, on top of already-coarse defaults"
    available:
      verdict: assemble
      how: >
        The duals are identical to eur — same library, same assign_duals, same per-MWh
        rescaling — so n.buses_t.marginal_price and n.global_constraints.mu are populated
        with no config change, and metrics carries co2_shadow and line_volume_shadow. Two
        things are genuinely better positioned here than in eur: the CO2 cap is on by
        default (`scenario.opts: ['Co2L-3h']`), so the policy dual that appears in the
        zero-profit identity exists out of the box; and scripts/monte_carlo.py is a real
        many-solve harness that already enumerates samples, rewrites the network per sample
        and collects results — the fan-out the cost-recovery-as-risk variant needs and
        that eur lacks entirely. Everything else about this card is weaker here.
      missing: >
        The same five interpretive steps as eur (4, 5, 7, 8, 9), plus four earth-specific
        blockers that come first. (1) NO market value anywhere: `calculate_market_values`
        does not exist in scripts/make_summary.py, the module-level `outputs` list has no
        market_values entry, and n.statistics.market_value is never called in the repo —
        yet the Snakefile's `rule make_sector_summary` declares BOTH market_values.csv and
        price_statistics.csv as outputs, so the sector summary cannot complete and the
        capture price has no implementation at all. Every cost-recovery statement on this
        card is therefore blocked on writing that function first. (2) NO snapshot weighting
        in the price code: calculate_prices is a plain `.mean()` and says so in a
        logger.warning ("Prices are time-averaged, not load-weighted"), while
        calculate_weighted_prices carries its own warning about excluding storage units as
        loads — and the shipped defaults are 3h and 144h. (3) NO `assign_all_duals`
        anywhere in earth's solve_network, so the storage energy-balance dual — the
        marginal storage value, the object the storage-arbitrage variant is about — is not
        reachable by config at all; it needs a code change, where eur needs a config
        addition. (4) NO load_sinks and NO curtailment_mode: neither key exists in earth's
        config nor in its solve_network, so the negative-price floor and the
        spilled-versus-marginal zero-price diagnostic, both of which eur ships, are absent.
      provenance: "scripts/make_summary.py:calculate_weighted_prices; scripts/make_summary.py:Prices are time-averaged; scripts/solve_network.py:get_load_shedding_capacity; Snakefile:market_values"
    levers:
      - key: "solving.options.load_shedding"
        effect: >
          A NUMBER in EUR/kWh (not a mapping as in eur), multiplied by 1000 into the slack
          generator's marginal_cost — the source comment says so verbatim ("convert to
          Eur/MWh"). The shipped 100 therefore caps every price in a default run at 100000
          EUR/MWh, silently. Two further asymmetries: the ceiling applies to all buses
          uniformly with no per-carrier override, and p_nom is finite (max bus load x 1.2,
          fallback 0.5e6 MW), so if shedding capacity binds the price exceeds the nominal
          VOLL and the cap is not the hard bound eur's np.inf makes it.
        default: "100 (i.e. ON, capping prices at 100000 EUR/MWh)"
        provenance: "config.default.yaml:load_shedding; scripts/solve_network.py:get_load_shedding_capacity"
      - key: "solving.options.noisy_costs"
        effect: >
          Adds 1e-2 + 2e-3*U(-0.5,0.5) EUR/MWh to every marginal cost, under a fixed
          np.random.seed(174) — so unlike eur the perturbation is reproducible run to run.
          A zero-cost carrier still never bids exactly zero, so every price-setter and
          zero-hour test needs a tolerance.
        default: "true"
        provenance: "config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
      - key: "costs.marginal_cost"
        effect: >
          Per-technology marginal-cost overrides, and unlike eur's empty dict this ships
          POPULATED with non-zero VRE bids: solar 0.01, onwind 0.015, offwind 0.015
          EUR/MWh, with hydro / H2 / electrolysis / fuel cell / battery / battery inverter
          at 0.0. So earth's "zero marginal cost" premise is not literally zero out of the
          box — the values are the same order as the noisy_costs perturbation, which means
          on a default earth run the VRE merit order among themselves is set by this dict
          plus noise rather than by anything physical. State it as an assumption.
        default: "{'solar': 0.01, 'onwind': 0.015, 'offwind': 0.015, 'hydro': 0.0, 'H2': 0.0, 'electrolysis': 0.0, 'fuel cell': 0.0, 'battery': 0.0, 'battery inverter': 0.0}"
        provenance: "config.default.yaml:marginal_cost; scripts/process_cost_data.py:load_costs"
      - key: "costs.emission_prices"
        effect: >
          The CO2 tax added onto fossil generators' marginal cost (applied via the Ep opts
          token). Which of this and the Co2L cap is active determines whether a
          market-value trend reads as cannibalisation or as cost recovery.
        default: "{'co2': 0.0}"
        provenance: "config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: "scenario.opts"
        effect: >
          Carries both the CO2 cap token and the power-chain resolution token. The default
          `Co2L-3h` is a mixed blessing for this card: Co2L means the policy dual in the
          zero-profit identity exists out of the box (better than eur), while `3h` means
          every snapshot has weight 3 and the price composition is already compromised on
          the very first default run.
        default: "['Co2L-3h']"
        provenance: "config.default.yaml:opts; scripts/prepare_network.py:add_co2limit"
      - key: "scenario.sopts"
        effect: >
          The sector chain's resolution token. The shipped `144h` gives 61 snapshots a
          year, which cannot represent a scarcity hour, a price spike or a storage
          arbitrage cycle. Must be hourly for anything on this card.
        default: "['144h']"
        provenance: "config.default.yaml:sopts; scripts/prepare_sector_network.py:average_every_nhours"
      - key: "scenario.clusters"
        effect: >
          The number of buses, hence whether a locational price-formation claim is about
          anything. The default 10 is a very coarse regional average with almost no
          resolvable spread.
        default: "[10]"
        provenance: "config.default.yaml:clusters; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "electricity.co2limit"
        effect: >
          The cap level in tCO2/a, and therefore the point on the abatement curve at which
          the policy dual in the zero-profit identity is read. Combined with
          electricity.automatic_emission for the baseline.
        default: "77500000.0"
        provenance: "config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: "monte_carlo.options.add_to_snakefile"
        effect: >
          Wires the many-solve fan-out into the DAG. The existing harness for the
          cost-recovery-as-risk variant (one solve per weather year or cost draw, results
          collected), and the one place earth is structurally ahead of eur on this card.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/monte_carlo.py:monte_carlo_sampling"
      - key: "monte_carlo.options.samples"
        effect: "Number of solves in the fan-out — becomes the ensemble size for the revenue-spread result."
        default: "9"
        provenance: "config.default.yaml:samples; scripts/monte_carlo.py:validate_parameters"
      - key: "solving.solver.options"
        effect: >
          Selects the tuning profile, which decides whether the duals are unique at all.
          `gurobi-default` is barrier with crossover off; the highs profile ships
          run_crossover on, so an open-source earth run is the configuration most exposed
          to degenerate non-unique duals — fatal for a bid-curve reconstruction, which
          reads every dual as a bid.
        default: "'gurobi-default'"
        provenance: "config.default.yaml:gurobi-default; scripts/solve_network.py:solver_options"
    assembly:
      - step: >
          FIRST, write calculate_market_values. Nothing on this card that involves cost
          recovery, capture prices or value factors can be done on earth until it exists:
          n.statistics.market_value(bus_carrier=...) is available in the pinned pypsa and
          already snapshot-weights both revenue and supply, so the function is short — but
          it must also be added to the module-level `outputs` list, because
          rule make_sector_summary already declares market_values.csv and
          price_statistics.csv as outputs that the script never writes.
        uses: [summary-outputs, sector-coupled-workflow]
        config: null
        code: "scripts/make_summary.py (add calculate_market_values + register in `outputs`)"
        provenance: "scripts/make_summary.py:make_summaries; Snakefile:market_values"
      - step: >
          SECOND, fix the price aggregation. Neither calculate_prices nor
          calculate_weighted_prices applies n.snapshot_weightings, while the shipped
          defaults are 3h and 144h — port eur's version of the same function, which
          computes `weights @ (load * price).sum(axis=1) / (weights @ load.sum(axis=1))`.
          Both functions carry their own logger.warning admitting the limitation, so this
          is a known gap rather than a hidden one.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py::calculate_weighted_prices"
        provenance: "scripts/make_summary.py:calculate_weighted_prices; scripts/make_summary.py:Prices are time-averaged"
      - step: >
          Decide the price ceiling explicitly — this step is mandatory on earth and merely
          advisable on eur. Leaving solving.options.load_shedding at its default 100
          (EUR/kWh, multiplied by 1000 in solve_network) caps every price at 100000
          EUR/MWh; set it to a defensible regional VOLL, or to false and accept
          infeasibility as the failure mode. Also record that the cap is SOFT: p_nom is
          max bus load x 1.2, so prices can exceed it if shedding capacity binds.
        uses: [load-shedding-voll]
        config: "solving.options.load_shedding"
        code: null
        provenance: "scripts/solve_network.py:get_load_shedding_capacity"
      - step: >
          Turn off the adequacy-by-fiat levers if scarcity pricing is the question. The
          registry rates safe-reserve-margin `working` here, and a planning reserve margin
          procures adequacy as a constraint — which suppresses exactly the scarcity hours
          whose prices the study is about.
        uses: [safe-reserve-margin, operational-reserves]
        config: "electricity.SAFE_reservemargin; electricity.operational_reserve.activate"
        code: null
        provenance: "scripts/prepare_network.py:add_co2limit; scripts/solve_network.py:add_operational_reserve_margin"
      - step: >
          Fix the resolution and the zoning before solving: `opts` for the power chain,
          `sopts` for the sector chain, scenario.clusters and GADM zoning for space. The
          shipped 3h / 144h / 10-cluster defaults are all disqualifying for this card, and
          none can be changed after the solve.
        uses: [temporal-resolution-nh, time-segmentation-tsam, gadm-admin-clustering]
        config: "scenario.opts; scenario.sopts; scenario.clusters"
        code: null
        provenance: "scripts/prepare_network.py:average_every_nhours; scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          State the zero-marginal-cost premise explicitly, because earth's default is not
          zero: costs.marginal_cost ships solar at 0.01 and on/offwind at 0.015 EUR/MWh,
          the same order as the noisy_costs perturbation. Either set them to 0.0 and let
          noise break the ties, or keep them and report that the VRE merit order is a
          config artefact.
        uses: [numeric-stability-options]
        config: "costs.marginal_cost; solving.options.noisy_costs"
        code: null
        provenance: "config.default.yaml:marginal_cost; scripts/solve_network.py:noisy_costs"
      - step: >
          Build the LT/ST fork by hand — the registry rates operations-only-solve `absent`
          here, so there is no solve_operations_network rule to call. Set every
          `p_nom_extendable` false from the prior solve's optimal capacities and re-solve.
          This is the precondition for any comparison to observed prices, and it is a code
          step on earth where it is a rule on eur.
        uses: [operations-only-solve]
        config: "electricity.extendable_carriers (emptied) as the crude route"
        code: "a new dispatch-only driver, or a rule modelled on eur's solve_operations_network"
        provenance: "scripts/solve_network.py:solve_network"
      - step: >
          If the marginal storage value is in scope, add the all-duals request to the solve
          call. earth's solve_network has no `assign_all_duals` option at all, so unlike eur
          this is a code change rather than a config addition — the extra_functionality hook
          is the sanctioned place for anything else that must be added at solve time.
        uses: [nodal-marginal-prices]
        config: null
        code: "scripts/solve_network.py::solve_network (pass assign_all_duals to n.optimize)"
        provenance: "scripts/solve_network.py:extra_functionality"
      - step: >
          For the cost-recovery-as-risk ensemble, reuse the monte-carlo fan-out rather than
          writing a loop: it already enumerates samples, rewrites the network per sample and
          collects results. This is the one step that is cheaper on earth than on eur.
        uses: [monte-carlo-sampling]
        config: "monte_carlo.options.add_to_snakefile; monte_carlo.options.samples"
        code: "scripts/monte_carlo.py"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling"
      - step: >
          Write the interpretive layer — regime shares, duration curve, revenue
          concentration, scarcity rent, bid curves — against the solved network, exactly as
          on eur but starting from a weaker base because the market values and the weighted
          aggregation must be built first.
        uses: [nodal-marginal-prices, summary-outputs]
        config: null
        code: "a new extraction script; port pypsa-eur's make_summary price functions as the base"
        provenance: "scripts/make_summary.py:calculate_metrics"
    boundary:
      - variant: price-duration-and-composition
        rung: L2
        note: >
          The dual is L0 as in eur, but the aggregation layer is not: prices are a plain
          `.mean()` with a logger.warning, and there is no zero-hour-share or price-std
          metric of any kind (earth's calculate_metrics carries only line volumes and
          co2_shadow). So the composition metrics are a localised script — L2 — plus L1
          upstream to force hourly opts/sopts away from the shipped 3h/144h.
      - variant: kkt-price-setter-identification
        rung: L5
        note: >
          Same L5 as eur and slightly worse: the bid reconstruction is new code either way,
          but it consumes duals that earth's solver default may not make unique (the highs
          profile ships run_crossover on) and it needs the storage duals that earth cannot
          request by config. Reconstructing bids from non-unique duals produces a
          plausible, irreproducible bid curve.
      - variant: storage-arbitrage-as-fuel-cost
        rung: L5
        note: >
          L5 here where eur is L2, and this is the sharpest rung asymmetry on the card:
          there is no `assign_all_duals` option in earth's solve_network at all, so the
          storage energy-balance dual is unreachable without editing the solve call. eur
          needs a config key added; earth needs code.
      - variant: zero-profit-cost-recovery-check
        rung: L2
        note: >
          L2 and blocked on a prerequisite rather than hard: `calculate_market_values` does
          not exist and n.statistics.market_value is never called in the repo, so the
          capture price must be written before the ratio can be formed. Small — the library
          does the weighting — but the sector summary rule is currently declaring an output
          the script cannot produce, so this fix is load-bearing beyond this card.
      - variant: scarcity-rent-and-revenue-risk
        rung: L3
        note: >
          The metrics are L2 post-processing, but the RISK statement needs a weather-year
          ensemble and on earth the binding constraint is DATA, not code: cutouts are built
          per region, so a multi-year ensemble means building one per year, and the load
          profile the rent is weighted by is often synthetic. The harness itself is the one
          piece that is cheaper here (monte_carlo.py). Check the region's grade in
          cookbooks/pypsa-earth/data_quality before promising a revenue spread.
      - variant: elastic-demand-price-formation
        rung: L5
        note: >
          registry `demand-elasticity` is `absent` with even less scaffolding than eur —
          only BEV DSM shifts endogenously, and there is no per-carrier load-shedding
          mapping to approximate a stepped bid curve with (earth's load_shedding is a single
          scalar applied to all buses). New components or a new objective term.
      - variant: calibrated-bid-price-formation
        rung: L5
        note: >
          The least tractable variant on earth, and mostly for data reasons: calibrating
          SRMCs against observed prices needs an observed day-ahead price series and a
          unit-level fleet with known support instruments, neither of which exists for most
          earth regions. There is also no operations-only rule to hang the dispatch run on.
          Treat as out of scope unless the region has a liquid published market.
    where:
      - change: "add the missing market-value / capture-price table (prerequisite for cost recovery)"
        anchor: "scripts/make_summary.py::outputs list + a new calculate_market_values; Snakefile rule make_sector_summary"
        provenance: "scripts/make_summary.py:make_summaries; Snakefile:market_values"
      - change: "apply snapshot weightings to the price aggregation"
        anchor: "scripts/make_summary.py::calculate_weighted_prices (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_weighted_prices"
      - change: "make the marginal storage value reachable at all"
        anchor: "scripts/solve_network.py::solve_network — pass assign_all_duals into n.optimize"
        provenance: "scripts/solve_network.py:solve_network"
      - change: "set or remove the default price ceiling"
        anchor: "solving.options.load_shedding -> scripts/solve_network.py::get_load_shedding_capacity"
        provenance: "scripts/solve_network.py:get_load_shedding_capacity"
      - change: "anything added at solve time (extra constraints to price, reserve products)"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "many-solve fan-out for the revenue-spread ensemble"
        anchor: "scripts/monte_carlo.py + the monte_carlo rule"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling"
      - change: "price regime / duration / concentration metrics"
        anchor: "a new script beside scripts/make_summary.py; port eur's calculate_metrics as the base"
        provenance: "scripts/make_summary.py:calculate_metrics"
    data_dependencies:
      - input: "multi-year ERA5 cutout covering the study region"
        required_for: scarcity-rent-and-revenue-risk
        availability: >
          region-dependent — cutouts are built per region in earth (enable.build_cutout), so
          the weather-year ensemble that turns cost recovery into a risk statement means
          building one cutout per year before any price exists
      - input: "regional demand time series of adequate quality"
        required_for: scarcity-rent-and-revenue-risk
        availability: >
          region-dependent — scarcity hours are defined by the load peak relative to
          available supply, so a synthetic or scaled load profile makes the entire
          scarcity-hour set an artefact of the load model. Check the country's demand grade
          in cookbooks/pypsa-earth/data_quality first; this is the assumption most likely to
          invalidate a cost-recovery result
      - input: "region-appropriate value of lost load"
        required_for: price-duration-and-composition
        availability: >
          absent — the shipped 100 EUR/kWh is a European placeholder and there is no
          regional VOLL registry in either model. It sets the whole upper price tail, so
          treat it as an assumption to sign off with the user, never as data
      - input: "observed day-ahead price series and unit-level support instruments"
        required_for: calibrated-bid-price-formation
        availability: >
          absent for most earth regions — the calibration needs a liquid published market
          and per-unit CfD/certificate information. Without it this variant is not
          approximable, only omitted
    cost_profile:
      solves: >
        1 for a single-scenario price answer. The revenue-spread ensemble is one solve per
        weather year, for which monte_carlo.options.samples is the existing fan-out; the
        corpus's earth study ran 264 scenario combinations at 3-hourly, which is the
        realistic upper end for a sector-coupled earth price study.
      relative: >
        A larger relative step up than on eur, because earth's defaults are far coarser: the
        move from 3h/144h/10-clusters to hourly at a usable cluster count is ~10x the
        default LP before any ensemble.
      note: >
        The compensating advantage is real: earth base cases are usually smaller (one region,
        fewer carriers), so hourly resolution is often affordable where the equivalent eur
        sector-coupled run is not — and monte_carlo.py supplies the many-solve harness eur
        lacks. The model-choice tradeoff runs in earth's favour for the COMPUTE and against
        it for the CODE, since the market-value function and the weighted aggregation must
        be written before any number is trustworthy.
    verifies:
      - variant: zero-profit-cost-recovery-check
        check: "'market_values' in outputs"
        over: run
        note: >
          Fails at this ref. The script's module-level `outputs` list has no market_values
          entry and calculate_market_values does not exist, while rule make_sector_summary
          declares market_values.csv as an output — so a sector summary run cannot produce a
          capture price, and every cost-recovery claim on earth is blocked until this passes.
      - variant: price-duration-and-composition
        check: "(n.snapshot_weightings.generators == 1).all()"
        over: run
        note: >
          Fails on every default earth run: opts `Co2L-3h` gives weight 3 and sopts `144h`
          gives weight 144. A price composition from 61 annual snapshots is not a price
          composition, and nothing in the workflow warns beyond a logger line about
          time-averaging.
      - variant: price-duration-and-composition
        check: "n.generators.query(\"carrier == 'load shedding'\").empty or (n.buses_t.marginal_price.to_numpy().max() < 1e5 - 1e-6)"
        over: run
        note: >
          Detects the silent default ceiling. Load shedding ships enabled at 100 EUR/kWh, so
          this fires by default whenever a scarcity hour occurs and the reported maximum is
          a config number. Note it can also be EXCEEDED rather than pinned: earth's shedding
          p_nom is finite (max bus load x 1.2), so if shedding capacity binds the price goes
          above 100000 — check both directions before interpreting the tail.
      - variant: storage-arbitrage-as-fuel-cost
        check: "n.storage_units.empty or (n.storage_units_t.mu_energy_balance.abs().to_numpy().max() > 0)"
        over: run
        note: >
          Fails unconditionally at this ref, because earth's solve_network never requests
          all duals — there is no config key for it. An all-zero frame reads as 'storage has
          no opportunity cost', which is the exact wrong conclusion for this card.
      - variant: scarcity-rent-and-revenue-risk
        check: "len(ns) == n_weather_years and all(not m.buses_t.marginal_price.empty for m in ns)"
        over: ensemble
        note: >
          A short ensemble means samples were dropped by the monte-carlo fan-out rather than
          solved, which narrows the reported revenue spread and makes the asset look safer
          than the model says it is. An empty price frame in any member means that solve
          failed and was written anyway.
