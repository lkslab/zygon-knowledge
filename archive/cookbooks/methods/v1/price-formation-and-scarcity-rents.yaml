id: price-formation-and-scarcity-rents
title: "Price formation and scarcity rents in zero-marginal-cost systems"
summary: >
  Interpret the model's energy price as the outcome of scarcity rather than fuel cost —
  set by storage arbitrage, binding capacity limits and willingness to pay — and check
  it against the long-term-equilibrium identity that each technology's market value
  equals its annualised cost.
question: >
  If wind and solar cost nothing to run, what sets the price, and does every asset in
  this system earn back what it cost to build?
aliases:
  - "price formation"
  - "scarcity rent"
  - "scarcity pricing"
  - "inframarginal rent"
  - "price duration curve"
  - "zero marginal cost"
  - "zero-price hours"
  - "negative prices"
  - "price spikes"
  - "cost recovery"
  - "revenue sufficiency"
  - "missing money"
  - "zero-profit condition"
  - "long-term equilibrium"
  - "market value"
  - "capture price"
  - "value factor"
  - "merit order effect"
  - "price-setting technology"
  - "bidding curve"
  - "supply and demand curve reconstruction"
  - "marginal storage value"
  - "energy-only market"
  - "value of lost load"
  - "VOLL"
when_to_use:
  - "if renewables have zero marginal cost, what sets the electricity price"
  - "will this battery / hydrogen plant / gas peaker recover its costs"
  - "does an energy-only market still work in a fully renewable system"
  - "why are prices zero so often in this scenario"
  - "why does the model show prices of tens of thousands of euros"
  - "which technology is setting the price in each hour"
  - "how much of the year is priced by storage rather than by generation"
  - "show me the price duration curve and explain its shape"
  - "do we need a capacity market in this scenario"
  - "what happens to wind revenues as more wind is built"
  - "is the missing-money problem real in this model"
  - "how much revenue comes from a handful of scarcity hours"
  - "why is the average price lower than the LCOE"
  - "what price cap is my model implicitly assuming"
family: markets-and-prices
prevalence:
  papers: 10
  tier1: 5
  tier2: 5
  sweep_hits: 19
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 10 papers that actually
    reason about WHERE the price comes from or whether assets recover their capital, as
    opposed to merely reporting a dual (that is the 45-paper
    `shadow-prices-and-marginal-values` slice). The regex screen returned 19 and
    OVER-counts by 9: the pattern includes "zero marginal cost" and "price duration",
    which any paper plotting a sorted price series matches without asking what sets the
    price. EVIDENCE_INDEX.md flags no mention-only suspects in this slice, so all 10
    stand. The role split is the unusual part and is the reason this card exists as a
    card: 3 `defines` and 5 `canonical-use` against only 1 `routine-use` — nobody does
    price-formation analysis by accident, which is the opposite of the dual-extraction
    method it sits on top of.
procedure:
  - step: >
      Decide FIRST whether the run is a long-term (LT) co-optimised investment model or
      a short-term (ST) dispatch-only model at fixed capacities. The two produce
      different prices from the same network, and the whole interpretation below forks
      here: LT prices carry investment pressure and satisfy the zero-profit identity by
      construction, ST prices are the merit-order price of an existing fleet and are the
      ones comparable to observed market data.
    handle: "rule solve_operations_network (ST) vs rule solve_sector_network (LT)"
    provenance: "scripts/solve_operations_network.py:fix_optimal_capacities; scripts/solve_network.py:solve_network"
  - step: >
      Set the price CEILING deliberately before solving. Without load shedding an
      inadequate system is infeasible rather than expensive, and with it every scarcity
      hour prices at exactly the value of lost load. There is no third option, and the
      choice sets the entire upper tail of the price distribution — which is where the
      cost recovery of peaking and long-duration assets lives.
    handle: "solving.options.load_shedding.{enable,default_cost}"
    provenance: "config/config.default.yaml:load_shedding; scripts/solve_network.py:add_load_balance_components"
  - step: >
      Solve and read the energy price as the nodal balance dual lambda_{n,t}, and the
      marginal storage value as the storage energy-balance dual lambda^s_t. The MSV is
      the key object of this method: divided by the discharge efficiency it acts exactly
      like a fuel cost, which is how a zero-marginal-cost system regains a merit order.
    handle: "n.buses_t.marginal_price; n.storage_units_t.mu_energy_balance (needs all duals)"
    provenance: "pypsa/optimization/optimize.py:assign_all_duals; pypsa/component_attrs/storage_units.csv:mu_energy_balance"
  - step: >
      Decompose the price series by WHAT IS SETTING IT. The corpus's categories are:
      zero/near-zero hours (VRE at the margin, supply exceeds inelastic demand), storage
      hours (charging or discharging bid at the MSV), thermal hours (fuel plus CO2 cost),
      and scarcity hours (a capacity constraint binds, or demand's willingness to pay
      clears the market). Report the SHARE of each, not just the mean.
    handle: null
    provenance: null
  - step: >
      Reconstruct the bid/ask of each technology ex post from the KKT stationarity
      condition of the Lagrangian at each timestep, assemble them into full hourly
      supply and demand curves, and identify the price setter as the candidate whose bid
      lies within a tolerance of the clearing price while being partly loaded. The
      corpus's algorithm: bid within 0.01 EUR/MWh, capacity utilisation 1-99%, minimum
      dispatch 10 MWh, supply preferred over demand, least-variance bidder among ties.
    handle: null
    provenance: null
  - step: >
      Compute per-technology REVENUE (dispatch times price, both snapshot-weighted) and
      compare it to annualised capital plus fixed cost. In a cost-optimal LP with free
      entry this comparison is not a test of the world but a test of your extraction:
      the KKT conditions guarantee that every endogenously sized technology recovers
      exactly its annualised cost, so a gap means the weighting, the price cap or the
      cost annuity is wrong somewhere.
    handle: "n.statistics.market_value(bus_carrier='AC'); n.statistics.capex; n.statistics.revenue"
    provenance: "pypsa/statistics.py:market_value; pypsa/statistics.py:revenue"
  - step: >
      Attribute the revenue over TIME. The corpus's finding is that a small number of
      hours carries a large share of it — ~35% of annual electricity cost accrues in
      ~1% of hours during system-defining events — so report the revenue concentration
      (share from the top N hours) alongside the total, because that concentration is
      the investor's risk exposure.
    handle: null
    provenance: null
  - step: >
      (extension) Repeat over an ensemble of weather years with capacities held fixed at
      one year's optimum. Cost recovery holds by construction only for the year the
      capacities were optimised for; the spread across years IS the financial-risk
      result, and for exogenously fixed capacity it can be a shortfall in every year.
    handle: null
    provenance: null
  - step: >
      (extension) Make demand price-elastic. With a downward-sloping inverse demand
      curve the price is set by willingness to pay whenever supply is unconstrained,
      which collapses the zero-price share and restores cost recovery without a capacity
      mechanism. Neither workflow has elastic demand; the corpus's implementations
      replace the fixed load with a step, linear or piecewise-linear bid curve.
    handle: null
    provenance: null
variants:
  - id: price-duration-and-composition
    what: >
      Sort the price series and report its shape plus the share of hours in each price
      regime — near-zero, moderate, spike — and how that composition shifts with
      decarbonisation level, penetration or policy. The entry point and the most
      commonly published form; needs an hourly run, because segmentation destroys
      exactly the tail the curve is about.
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
  - id: kkt-price-setter-identification
    what: >
      Map the duals back to per-technology bids via the KKT stationarity conditions,
      build the full hourly supply and demand curve, and label the price-setting
      technology in every timestep. The most informative variant and the only one that
      answers "why THIS price" rather than "what price"; extended to multi-carrier
      systems via the conversion incidence matrix, so a converter's bid is an
      opportunity cost across carriers.
    papers:
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
  - id: storage-arbitrage-as-fuel-cost
    what: >
      Treat the marginal storage value (the storage energy-balance dual) as the storage
      unit's effective fuel cost — divided by the discharge efficiency for asks,
      multiplied for bids — and show that storage bidding is what reintroduces a merit
      order into a system with no fuel. Also the variant that shows myopic storage
      dispatch is adequate once the MSV is priced, which matters because it means the
      market does not need perfect foresight to work.
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
  - id: zero-profit-cost-recovery-check
    what: >
      Compare each technology's market value against its annualised cost and confirm the
      long-term-equilibrium identity. Under a VRE support policy MV = LCOE - mu_support
      and under a CO2 policy MV = LCOE + e * mu_CO2, so the gap between capture price
      and LCOE is exactly the policy constraint's dual — which is why the observed
      decline of VRE market value with penetration is an artefact of the assumed policy
      instrument, not of variability.
    papers:
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
  - id: scarcity-rent-and-revenue-risk
    what: >
      Isolate the scarcity component of revenue: the rent that accrues when a capacity
      constraint binds rather than when a fuel cost is at the margin. Measured either as
      the divergence between system LCOE and the demand-weighted mean price, or as the
      share of annual revenue earned in the few hours of a system-defining event. The
      variant that answers "is this asset bankable".
    papers:
      - "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
  - id: elastic-demand-price-formation
    what: >
      Replace the fixed load with a demand bid curve (VOLL step, linear, or
      piecewise-linear log-log) so that willingness to pay sets the price when supply is
      unconstrained. Collapses the zero-price share dramatically — the corpus reports
      ~89% to ~31% of hours at a -5% elasticity — and is the mechanism by which an
      energy-only market recovers costs without a capacity payment.
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
  - id: calibrated-bid-price-formation
    what: >
      Do not derive marginal costs from technology data at all: estimate them from
      observed dispatch-versus-price behaviour, and encode the support instrument each
      unit actually holds (CfD units bid zero, RO units bid negative their certificate
      value), plus an exogenous balancing markup. The variant for a question about a
      real market rather than about a cost-optimal one, and the only route to prices
      that reproduce a historical period.
    papers:
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
literature:
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: defines
    note: >
      The card's anchor. Derives price formation in a zero-fuel-cost system from the KKT
      stationarity conditions and answers the field's standing objection — that an
      energy-only market breaks down without fuel costs — in the negative. Three results
      to relay verbatim. (1) The price is set by one of three things in every hour:
      demand's willingness to pay, a storage unit's charge/discharge bid at its marginal
      storage value, or VRE at zero cost. (2) The MSV is the storage balance dual
      lambda^s_t and enters the bid divided by the discharge efficiency, so it behaves
      exactly like a fuel cost — that is the mechanism that gives a fuel-free system a
      merit order. (3) Demand elasticity, not fuel cost, is what stabilises prices: a -5%
      elasticity at a 100 EUR/MWh average cuts the zero-price share from ~89% to ~31%,
      and it also makes MYOPIC storage dispatch adequate, so no perfect-foresight
      operator is needed. Compares LT (co-optimised) with ST (fixed-capacity) models and
      proves the prices coincide iff the inverse demand curve is a unique strictly
      decreasing map. Custom PyPSA build (v0.27.1, single node, DE/ES/UK, 70 weather
      years 1951-2020, wind/solar/battery/H2 LDES), not PyPSA-Eur.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: defines
    note: >
      Extends price formation to a sector-coupled system and contributes the method that
      makes model prices legible: an ex-post mapping from the dual variables to the bids
      and asks of every supplier and consumer, from which the FULL hourly supply and
      demand curve is reconstructed. Stationarity conditions are derived separately for
      generators, converters and storage-as-converter, generalised to multiple carriers
      through a conversion incidence matrix M_ikt — so a converter's bid on the
      electricity bus is an opportunity cost expressed in another carrier's price. The
      price-setter algorithm is the reusable part and is worth copying exactly: a
      candidate must bid within 0.01 EUR/MWh of the clearing price, run at 1-99% of
      capacity and dispatch at least 10 MWh; among candidates supply is preferred to
      demand and the least-variance bidder wins. Also the reference for the LT/ST
      comparison in a sector-coupled setting. PyPSA-DE, single-node Germany, 3-hourly,
      myopic 2020-2045.
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: defines
    note: >
      The theory that makes every price in this book interpretable, and the paper to cite
      whenever a user assumes VRE cannibalise their own value. Proves the
      long-term-equilibrium zero-profit identity from the KKT conditions: with free
      entry, each technology's market value equals its annualised cost, and the gap
      between capture price and LCOE is exactly the dual of the policy constraint —
      MV = LCOE - mu_support under a VRE quota or feed-in premium, MV = LCOE + e*mu_CO2
      under a CO2 policy. The substantive consequence contradicts the standard
      intuition: the declining market value of wind and solar with penetration is caused
      by the implicit support-policy assumption, not by variability; under a rising CO2
      cap or tax market values stay at cost recovery above 80% penetration. Also explains
      negative prices mechanically (supported VRE bid marginal cost minus the premium,
      which can go below zero) and shows via price duration curves that as CO2 intensity
      falls from 1.2 to 0.0 t/MWh, storage and transmission arbitrage replace singular
      price behaviour. Proofs cover storage, multi-node networks, limited potentials and
      non-linear costs. Bespoke five-node PyPSA reimplementation of EMMA, not PyPSA-Eur.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference application for the revenue-risk half of this card, and the sharpest
      demonstration of why cost recovery is a distributional statement and not a single
      number. Classifies weather-driven system-defining events from the shadow-price
      field, then computes the fraction of annualised capital cost each back-up
      technology recovers during those events versus over the full year, across 80
      weather years (1941-2021, PyPSA-Eur 0.13.0, 90 nodes, hourly). Two numbers to
      quote: ~35% of annual electricity cost accrues in the ~1% of hours that are SDEs,
      and fuel cells run at ~4% annual capacity factor. The asymmetry is the finding —
      ENDOGENOUSLY sized fuel cells recover their cost by optimality (that is the
      zero-profit identity in action), while EXOGENOUSLY fixed gas plants recover cost in
      none of the 80 years. Reliance on short-lived price spikes plus low utilisation is
      named as the financial-risk mechanism.
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: canonical-use
    note: >
      The calibrated-bid route, and the corpus's most complete answer to "what actually
      sets the price in a real market". Thermal SRMCs are not taken from technology data
      but estimated from a 30-day rolling correlation of dispatch behaviour against
      observed day-ahead prices, then corrected per settlement period to match the
      realised price; CfD units bid GBP 0/MWh and RO units bid negative their ROC value,
      so the support instrument each unit holds is explicit in its bid. A GBP 30/MWh
      balancing markup is assumed and the gap to the observed GBP 55/MWh premium is
      interpreted as strategic bidding rent. The price-formation result is the reason to
      read it: in 69% of hours wind is low enough that one gas-set price clears all of
      GB, while in high-wind hours northern zones are priced by zero-marginal-cost CfD
      units and southern zones by gas — i.e. the price regime, not just the price level,
      is what the market design changes. Bespoke ~300-bus GB PyPSA model, operations
      only, 30-minute, 2022-2024 solved day by day.
  - paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    tier: 2
    role: canonical-use
    note: >
      The counter-example on scarcity pricing, and the reason to ask a user whether they
      want scarcity in the model at all: this study deliberately excludes it. Adequate
      capacity is procured exogenously so the market always clears, the revenue gap for
      dispatchable assets is assumed to be covered outside the energy market by capacity
      mechanisms, and production is remunerated only while the price is positive
      (negative-price hours pay CfD holders nothing). What it contributes instead is the
      price-signal-quality result: zonal clearing gives systematically wrong flexibility
      signals, with storage charging while the system needed it to discharge — a failure
      of price FORMATION rather than of price level. Congestion rent is returned to
      consumers via lower grid charges. 1024 k-means buses from the PyPSA-Eur workflow,
      hourly, 2030 and 2040.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: canonical-use
    note: >
      Contributes the cheapest usable definition of a scarcity rent in a
      capacity-expansion model: the divergence between system LCOE (total system cost per
      unit generated) and the demand-weighted mean marginal price. Two things make it
      worth citing. First the mechanism — scarcity rent appears where "the optimizer
      ideally would increase capacity to meet demand, but is constrained by a binding
      capacity constraint", which is the operational definition this card uses. Second
      the non-monotonicity: the mean marginal price FALLS during early decarbonisation
      via the merit-order effect and then rises steeply at high decarbonisation as
      storage, transmission and VRE overcapacity become the balancing mechanisms, with
      the dominant rent contributor switching from fossil capacity limits to
      renewable/storage limits at the 80-90% transition. PyPSA-Eur, 37 nodes, hourly,
      2013, 105 scenarios.
  - paper: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The price duration curve used as the analytical instrument rather than as a plot,
      and the only PyPSA-Earth entry in this slice. Stricter hourly hydrogen matching
      shifts the whole domestic price duration curve leftward because the additional
      renewable capacity displaces higher-marginal-cost fossil generation, and the paper
      separates two distinct transmission channels — a PRICE spillover (renewables crowd
      out high-MC fossil) and an ENERGY spillover (excess capacity built for the
      export/matching rule supplies the domestic grid). Domestic electricity cost falls
      up to 31% under hourly matching. Evidence that the method is exercised on earth in
      practice: PyPSA-Earth-Sec, bespoke Morocco model, 14 nodes, 3-hourly, 264 runs.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      A useful negative result on what changes a price and what does not, across four
      stylised demand-side mechanisms in a net-zero sector-coupled run. A constant 5%
      demand reduction has negligible effect on price level or variability, because
      "although lower capacities are installed, the difficulty of meeting demand, which
      sets the price, remains unchanged" — the cleanest one-sentence statement of the
      scarcity mechanism in the corpus. Peak shaving and demand curtailment, by contrast,
      remove rarely-used back-up capacity (gas turbines, resistive heaters) and produce
      the largest price and volatility reductions. Its curtailment mechanism is a
      one-step willingness-to-pay threshold analysed over 100-400 EUR/MWh, i.e. a crude
      elastic-demand step function inside PyPSA-Eur. PyPSA-Eur 0.11.0, 37 nodes,
      2-hourly, full year with no temporal aggregation.
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: critiques
    note: >
      The critique that bounds this card's claims: an optimal-dispatch model's price
      formation is structurally too simple to reproduce a real price series. Hindcasts
      2020-2024 including the 2022 crisis on PyPSA-Eur v2025.07.0 (39 nodes, 35
      countries, hourly, fixed capacities) and names the causes of the residual gap
      explicitly — marginal-cost pricing assumes uniformity across similar plants,
      whereas unit-specific ramping constraints, efficiency spread, long-term fuel
      contracts, start-up costs and outages all drive real price variability. Two
      specific failures to relay: the model cannot reproduce intra-day price spikes, and
      it cannot reproduce an administrative intervention (the Iberian Exception price
      cap) at all. Also shows fuel-price time-series resolution (static versus dynamic)
      propagating straight into the price series, and gas/coal substitution as a
      persistent discrepancy between optimal and historical dispatch.
pitfalls:
  - pitfall: >
      Without a price ceiling the scarcity price is set by whatever bound the solver
      happens to hit, and cost recovery computed against it is meaningless. With one, the
      entire upper tail of the price distribution is a config number. There is no neutral
      setting: load shedding off means an inadequate system is INFEASIBLE rather than
      expensive, and load shedding on means every scarcity hour prices at exactly the
      VOLL.
    evidence: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    note: >
      Choose the VOLL explicitly, report it beside every price statistic, and report how
      many hours hit it and what share of each technology's revenue came from them. The
      corpus's own choice is a 2000 EUR/MWh VOLL step as one of four demand-curve shapes,
      which is 50x lower than pypsa-eur's 100000 default and 50x lower than pypsa-earth's
      shipped 100 EUR/kWh. The two models are NOT symmetric here: eur ships shedding off,
      earth ships it on, so an earth price series is capped by default and the user will
      not have been told.
  - pitfall: >
      Cost recovery in a cost-optimal LP with free entry is a THEOREM, not a finding.
      Every endogenously sized technology recovers exactly its annualised cost by the KKT
      conditions, so "the model says the battery breaks even" is information about your
      extraction pipeline and not about the world. The informative cases are the ones
      where the identity does NOT hold: exogenously fixed capacity, a binding potential,
      a non-zero slack on a policy constraint, or a different weather year than the one
      the capacities were optimised for.
    evidence: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    note: >
      Use the identity as a CHECK on the extraction (revenue should match annuity to
      within rounding for extendable assets) and answer the user's actual bankability
      question with a variant that breaks the identity on purpose: fix capacities and
      re-solve over a weather-year ensemble, which is what the corpus's resilience study
      does and what produced its negative result for exogenous gas plants.
  - pitfall: >
      A declining market value for wind and solar with rising penetration is usually read
      as self-cannibalisation. It is largely an artefact of the assumed policy
      instrument: under a VRE quota or feed-in premium MV = LCOE - mu_support, so the
      support dual mechanically depresses the capture price, whereas under a CO2 cap or
      tax MV = LCOE + e*mu_CO2 and market values stay at cost recovery above 80%
      penetration.
    evidence: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    note: >
      Before presenting any value-factor trend, state which policy instrument the run
      encodes — in pypsa-eur that is `electricity.co2limit_enable` / a Co2L token / the
      sector `co2_budget` for a cap, `costs.emission_prices` for a tax, and a
      hand-written constraint for a quota. A quota-driven cannibalisation curve and a
      cap-driven one point in opposite directions from the same network.
  - pitfall: >
      Segmentation and coarse nH resolution destroy exactly the object of this method.
      Price formation lives in the composition of the price distribution — the zero-price
      share, the spike frequency, the few hours carrying a third of annual revenue — and
      averaging or merging similar hours flattens all of it while leaving the mean
      plausible. A 144h sector run has 61 snapshots a year and cannot express a scarcity
      hour at all.
    evidence: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    note: >
      Run hourly for anything in this card, and refuse percentiles, zero-hour shares and
      revenue-concentration metrics from a segmented run. The corpus's price-formation
      papers are hourly (or 30-minute) without exception; the 3-hourly ones report only
      levels and shifts of a duration curve, never its tail.
  - pitfall: >
      A zero price is never exactly zero, and a "price-setting technology" identified by
      exact equality will find nothing. Both workflows add ~1e-2 EUR/MWh of random noise
      to every marginal cost by default to break degeneracy, and pypsa-earth additionally
      ships small non-zero marginal costs for VRE in its cost config (solar 0.01, onwind
      and offwind 0.015 EUR/MWh).
    evidence: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    note: >
      Use a tolerance everywhere: the corpus's price-setter algorithm matches bids within
      0.01 EUR/MWh, and pypsa-eur's own summary counts "zero hours" as price < 0.1. Note
      the tension — noisy_costs makes duals reproducible and slightly WRONG, so a
      bid-curve reconstruction is comparing against perturbed costs unless you switch it
      off and accept degenerate duals instead.
  - pitfall: >
      A price from a capacity-expansion model is not a market price, so a model that
      matches theory can still fail to match reality. Marginal-cost pricing assumes
      uniformity across similar plants and cannot reproduce intra-day spikes,
      unit-specific ramping and start-up effects, long-term fuel contracts, or
      administrative interventions such as a price cap.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      If the deliverable is a comparison to observed prices, run dispatch-only at fixed
      capacities with dynamic fuel prices — and even then present the residual as
      structural rather than as calibration error. If it is a scenario price, present it
      as a competitive-benchmark shadow price and say so; the registry rates
      market-design-mechanisms `absent` on both models, so there are no bids and no
      capacity payments anywhere in either workflow.
  - pitfall: >
      Scarcity pricing can be silently absent by construction rather than by result. A
      study that procures adequate capacity exogenously, or that assumes a capacity
      market covers the revenue gap, will show a well-behaved price series with no
      scarcity component — and that is an assumption, not a finding about the market
      design being tested.
    evidence: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    note: >
      Make the adequacy assumption explicit in the bundle: whether capacity is
      endogenous, whether load shedding is on, and whether revenue sufficiency is
      asserted or computed. Also decide the remuneration convention, because it changes
      the answer: the corpus's zonal study remunerates production only while the price is
      positive, so negative-price hours contribute zero rather than negative revenue.
  - pitfall: >
      Zero marginal cost is a modelling default, not a physical fact, and it is where a
      price-formation study is most sensitive to a data choice nobody documents. Whether
      VRE bid exactly zero, a small positive VOM, or negative (a supported unit bidding
      marginal cost minus its premium) determines the zero-price share, the negative-price
      share and which technology is at the margin in a large fraction of hours.
    evidence: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    note: >
      State the bid of every zero-fuel-cost carrier as an explicit assumption. pypsa-eur
      derives marginal_cost as VOM + fuel/efficiency with fill_values VOM = 0 and
      fuel = 0, so VRE are exactly zero before noise; pypsa-earth's config ships small
      positive values instead. For a real-market question, encode the support instrument
      per unit as the corpus does (CfD at zero, certificate holders negative) rather than
      relying on the technology-data default.
