pypsa_primitive:
  symbol: "pypsa/optimization/constraints.py:define_nodal_balance_constraints"
  pypsa_version: "0.30.3"
  exposed_by: "both — every sector-coupled build in either model relies on it, and neither has to ask for it"
  reachable_via: >
    Nothing: it is unconditional. The function assembles the per-bus energy balance from a
    fixed argument list plus, for every column matching `bus<i>` beyond bus0/bus1 discovered
    by descriptors.py:additional_linkports, one extra term
    ["Link", "p", f"bus{i}", efficiency{i}]. A Link therefore has exactly ONE decision
    variable p and each additional port contributes efficiency{i} * p to that bus's balance,
    with empty-string bus columns dropped. Adding bus5/efficiency5 to n.links needs no
    library change at all.
  note: >
    This is why the whole method is `assemble` rather than `absent` in both models: the
    multi-carrier, multi-output conversion primitive is not a feature either workflow
    implements — it falls out of the nodal balance being carrier-agnostic and the Link being
    arbitrarily many-ported. Everything above it (which buses, which efficiencies, which
    switches) is bookkeeping in prepare_sector_network.py. Soft anchor: pypsa is a conda
    dependency, not a submodule, so this claim is pinned to a version string.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: sector-master-switches
        role: >
          the entry point: eight flat booleans (sector.transport/heating/biomass/industry/
          shipping/aviation/agriculture/fossil_fuels) each gating one add_* call, all TRUE by
          default — so a sector run is all-sectors-on unless you switch things off
      - id: co2-network-sequestration
        role: >
          the shared carbon layer this card's step 4 is about: captured-carbon buses, CO2
          pipelines, CO2Stop-derived regional storage potentials, DAC
      - id: co2-atmosphere-constraint
        role: >
          closes the CO2 store's final state against the global budget in single-period
          solves; without it the atmosphere store is a free sink
      - id: district-heating-suite
        role: "the heat carrier's structure — GIS DH areas, dynamic temperatures, PTES"
      - id: exogenous-transport-shares
        role: "the transport carrier's demand split; imposed, not optimised (see pitfalls)"
      - id: industry-t-endogenous
        role: >
          the one shipped example of endogenising an end-use technology choice inside the
          assembly (industrial heat bands), off by default
      - id: h2-network-retrofit
        role: "the H2 carrier's transport layer; routing content belongs to the sibling card"
      - id: gas-network-links
        role: "the methane carrier's transport layer — real clustered pipelines, unlike earth"
      - id: methanol-suite
        role: "an entire carrier chain that exists in eur and has no earth counterpart"
      - id: ammonia-value-chain
        role: "NH3 as a first-class carrier with Haber-Bosch and cracker links"
      - id: distribution-grid-lv
        role: "the LV layer that EV, heat-pump and rooftop-PV coupling attaches to"
      - id: heat-systems-param
        role: >
          registry status `dead-key` — a cautionary entry: the param is plumbed through the
          rule but the key exists nowhere and the script never reads it
    available:
      verdict: turnkey
      how: >
        A config flip runs the method. `foresight` selects the solve chain and the
        `solve_sector_networks` collect target builds
        base_s_{clusters}_{opts}_{sector_opts}_{planning_horizons}.nc through
        prepare_sector_network, which assembles the entire multi-carrier network — carrier
        buses per define_spatial, the CO2 atmosphere/stored/sequestered layer per
        add_co2_tracking, conventional plants re-expressed as CO2-debiting links per
        add_generation, then every sector's add_* function behind its master switch. All
        eight switches default to true, so the out-of-box sector run is the full assembly.
        The electricity-only entry point is a genuinely different target
        (base_s_{clusters}_elec_{opts}.nc via solve_elec_networks) which never touches this
        script, so choosing between them is choosing a rule, not a flag.
      missing: >
        Only procedure step 9 has no handle: endogenising a coupling that ships as an
        exogenous share. sector.industry_t.endogen is the single shipped exception (industrial
        heat bands); drivetrain choice, process-route choice and renovation depth are all
        `retro_endogen: false`-style stubs or absent, and every corpus paper that did them
        used a fork. Everything in steps 1-8 is config-reachable.
      provenance: "scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:add_co2_tracking; rules/build_sector.smk:prepare_sector_network"
    levers:
      - key: "sector.heating"
        effect: >
          Gates add_heat AND add_waste_heat. Turning it off removes every heat bus, so PtX
          waste heat has nowhere to go and the CO2 baseline loses the residential/services
          non-elec sectors.
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.transport"
        effect: >
          Gates add_land_transport (EV/FCEV/ICE links plus BEV DSM and V2G) and adds rail and
          road non-elec to the CO2 cap baseline.
        default: "true"
        provenance: "config/config.default.yaml:transport; scripts/prepare_sector_network.py:add_land_transport"
      - key: "sector.industry"
        effect: >
          Gates add_industry and pulls industrial non-elec, industrial processes, and domestic
          and international aviation and navigation into the CO2 baseline — the largest single
          jump in the emissions denominator.
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
      - key: "sector.biomass"
        effect: "Gates add_biomass: the solid/digestible biomass buses, supply curves and bioenergy links."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
      - key: "sector.shipping"
        effect: "Gates add_shipping (methanol/H2/oil shares into a shipping demand)."
        default: "true"
        provenance: "config/config.default.yaml:shipping; scripts/prepare_sector_network.py:add_shipping"
      - key: "sector.aviation"
        effect: "Gates add_aviation (kerosene demand on the oil bus)."
        default: "true"
        provenance: "config/config.default.yaml:aviation; scripts/prepare_sector_network.py:add_aviation"
      - key: "sector.agriculture"
        effect: >
          Gates add_agriculture; the docstring notes it requires heating and industry to be on,
          so it is the one switch with an undeclared dependency.
        default: "true"
        provenance: "config/config.default.yaml:agriculture; scripts/prepare_sector_network.py:add_agriculture"
      - key: "sector.fossil_fuels"
        effect: >
          Read inside add_carrier_buses: decides whether fossil supply Generators are attached
          to the fuel buses at all. Off means the carrier bus exists but has no primary source.
        default: "true"
        provenance: "config/config.default.yaml:fossil_fuels; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: "sector.co2_spatial"
        effect: >
          Nodal captured-CO2 buses versus one EU bus. The single most consequential
          copperplating flag for any carbon-management siting question.
        default: "true"
        provenance: "config/config.default.yaml:co2_spatial; scripts/prepare_sector_network.py:define_spatial"
      - key: "sector.co2_network"
        effect: "Adds CO2 pipeline links between the stored-CO2 buses (add_co2_network)."
        default: "true"
        provenance: "config/config.default.yaml:co2_network; scripts/prepare_sector_network.py:add_co2_network"
      - key: "sector.biomass_spatial"
        effect: >
          Nodal biomass buses versus one EU biomass bus. Falls back to biomass_transport when
          unset, so the two keys interact.
        default: "true"
        provenance: "config/config.default.yaml:biomass_spatial; scripts/prepare_sector_network.py:define_spatial"
      - key: "sector.gas_network"
        effect: >
          Both a spatial flag (nodal gas buses in define_spatial) and the switch for real
          SciGRID_gas-derived pipeline links. Unlike earth's dead equivalent, this is live.
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: "sector.dac"
        effect: "Adds the DAC link (electricity + heat in, co2 stored out) — the atmospheric carbon source for synthetic fuels."
        default: "true"
        provenance: "config/config.default.yaml:dac; scripts/prepare_sector_network.py:add_dac"
      - key: "sector.electricity_distribution_grid"
        effect: >
          Inserts an LV bus and reinforcement link per node and REROUTES electricity demand,
          EV chargers, heat pumps, resistive heaters and micro-CHP onto it. A cost proxy, not
          a network.
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: "sector.use_fischer_tropsch_waste_heat"
        effect: >
          Fraction of Fischer-Tropsch waste heat routed into district heating by mutating the
          link's bus3/efficiency3. The template for all six use_*_waste_heat keys.
        default: "0.25"
        provenance: "config/config.default.yaml:use_fischer_tropsch_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: "sector.industry_t.endogen"
        effect: >
          Switches industrial process heat from an exogenous fuel mix to competing links per
          temperature band (heat100-200, heat200-500, heat>500). The only shipped
          endogenous-technology-choice lever.
        default: "false"
        provenance: "config/config.default.yaml:endogen; scripts/prepare_sector_network.py:add_t_industry100_200"
      - key: "sector.transmission_efficiency"
        effect: >
          Per-carrier static/per-1000km efficiency and compression. Listing a carrier under
          `enable` causes its bidirectional links to be split into forward and `-reversed`
          pairs — the double-counting trap in pitfalls.
        default: "enable: [DC, H2 pipeline, H2 pipeline retrofitted, gas pipeline, electricity distribution grid]"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: "pypsa_eur"
        effect: >
          The Bus/Link/Generator/StorageUnit/Store carrier allow-lists that seed the sector
          network: remove_elec_base_techs deletes every carrier NOT listed, so OCGT and
          battery/H2 storage units are stripped from the electricity-only network and re-added
          as links. Editing this list is how you keep an electricity-layer technology alive
          into the sector network.
        default: "Bus: [AC]; Link: [DC]; Generator: [onwind, offwind-ac, offwind-dc, offwind-float, solar-hsat, solar, ror, nuclear]; StorageUnit: [PHS, hydro]; Store: []"
        provenance: "config/config.default.yaml:pypsa_eur; scripts/prepare_sector_network.py:remove_elec_base_techs"
      - key: "scenario.sector_opts"
        effect: >
          The sector wildcard. Tokens T/H/B/I/A force the corresponding master switch to True
          (one-way only — there is no token that switches a sector off), and nH sets temporal
          resolution. Default empty, so config alone decides the sector set.
        default: "['']"
        provenance: "config/config.default.yaml:sector_opts; scripts/_helpers.py:update_config_from_wildcards"
    assembly:
      - step: >
          Choose the entry point first. `solve_elec_networks` builds
          base_s_{clusters}_elec_{opts}.nc and never runs prepare_sector_network;
          `solve_sector_networks` builds
          base_s_{clusters}_{opts}_{sector_opts}_{planning_horizons}.nc and does. This is a
          different target, not a flag — an electricity-only run cannot be "upgraded" by
          setting sector keys.
        uses: [sector-master-switches]
        config: "foresight (overnight|myopic|perfect) selects the solve rules; the collect target selects the chain"
        code: null
        provenance: "rules/collect.smk:solve_sector_networks; rules/solve_overnight.smk:solve_sector_network"
      - step: >
          Set the carrier set and per-carrier resolution BEFORE anything else, because
          define_spatial's flags decide bus names that every later add_* function indexes by
          string. co2_spatial, biomass_spatial, gas_network, regional_oil_demand,
          regional_coal_demand and methanol.regional_methanol_demand are the levers; each
          `false` copperplates that carrier onto one EU bus.
        uses: [co2-network-sequestration, gas-network-links, methanol-suite]
        config: "sector.co2_spatial; sector.biomass_spatial; sector.gas_network; sector.regional_oil_demand"
        code: null
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - step: >
          Decide which electricity-layer carriers survive into the sector network via the
          `pypsa_eur:` allow-lists. Anything not listed is deleted by remove_elec_base_techs on
          the assumption the sector layer re-adds it as a link. Forgetting to add a custom
          electricity-layer technology here makes it vanish with only a log line.
        uses: [sector-master-switches]
        config: "pypsa_eur.{Bus,Link,Generator,StorageUnit,Store}"
        code: null
        provenance: "scripts/prepare_sector_network.py:remove_elec_base_techs; scripts/prepare_sector_network.py:patch_electricity_network"
      - step: >
          Select the sector set with the eight master switches, and immediately read the
          absolute CO2 limit back out, because determine_emission_sectors makes the cap's
          baseline a function of exactly those switches.
        uses: [sector-master-switches, co2-atmosphere-constraint]
        config: "sector.{transport,heating,biomass,industry,shipping,aviation,agriculture,fossil_fuels}; co2_budget"
        code: null
        provenance: "scripts/prepare_sector_network.py:determine_emission_sectors; scripts/prepare_sector_network.py:add_co2limit"
      - step: >
          To ADD a conversion technology, write one n.add("Link", ...) inside the add_* function
          that owns the carrier it consumes, with bus0 as the input, bus1..busN as outputs, and
          a CO2 port whenever combustion or capture is involved. Sign convention: positive
          efficiencyN is an output at busN, negative is a second input. Match the existing
          `urban central {fuel} CHP CC` pattern for the four-port emitting-plus-capturing case.
          The efficiencies, costs and lifetimes themselves come from technology-data and belong
          to the generation_conversion recipe book — this card only owns where the link attaches.
        uses: [co2-network-sequestration, district-heating-suite]
        config: null
        code: "scripts/prepare_sector_network.py — the add_* function owning the input carrier"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:add_carrier_buses"
      - step: >
          If the new technology emits usable waste heat, extend add_waste_heat rather than
          hardcoding a heat port, and check which port index is still free — the function
          writes bus2, bus3 or bus4 depending on the technology, and runs last and only when
          sector.heating is on.
        uses: [district-heating-suite]
        config: "sector.use_*_waste_heat"
        code: "scripts/prepare_sector_network.py:add_waste_heat"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - step: >
          To ENDOGENISE an exogenous share, add a demand Bus for the SERVICE (as land transport
          already does) and one competing Link per technology into it, then add a turnover or
          share constraint so the fleet cannot flip in one horizon. industry_t is the shipped
          worked example; drivetrain and process-route choice are forks in the corpus.
        uses: [industry-t-endogenous, exogenous-transport-shares]
        config: "sector.industry_t.endogen for the shipped case; nothing for the others"
        code: "scripts/prepare_sector_network.py:add_t_industry100_200 as the pattern; a new/extended add_* plus solve-time constraint otherwise"
        provenance: "scripts/prepare_sector_network.py:add_t_industry100_200; scripts/prepare_sector_network.py:add_land_transport"
      - step: >
          If the extension needs a new data input (a potential map, a demand series, a cost
          curve), add the build rule in rules/build_sector.smk and wire it into
          prepare_sector_network's input block, which is where every sector resource is
          declared.
        uses: [co2-network-sequestration]
        config: null
        code: "rules/build_sector.smk — a new build_* rule plus an input line on prepare_sector_network"
        provenance: "rules/build_sector.smk:prepare_sector_network"
      - step: >
          Verify the build before solving: confirm the buses and links you expect exist by
          carrier, that every emitting link has a CO2 port, and that the absolute CO2 limit
          matches what you intended.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py for the cross-run view"
        provenance: "scripts/make_summary.py:calculate_capacities"
    boundary:
      - variant: carrier-buses-with-conversion-links
        rung: L0
        note: >
          The default sector run IS this. All eight master switches default true, so
          `snakemake solve_sector_networks` produces the full multi-carrier network with the
          shared CO2 layer and no edits at all.
      - variant: electricity-heat-only
        rung: L1
        note: >
          Switch off transport, industry, biomass, shipping, aviation and agriculture. Non-default
          combination rather than a flip, and note the CO2 baseline shrinks with them — the
          comparison to an all-sector run is not like-for-like unless you fix the absolute cap.
      - variant: electricity-heat-transport
        rung: L1
        note: >
          heating + transport on, industry/shipping/aviation/agriculture off. Also the
          combination the sector_opts tokens T and H express, though the tokens can only turn
          switches ON.
      - variant: full-sector-coupling-with-carbon-management
        rung: L0
        note: >
          The out-of-box configuration: co2_spatial, co2_network, dac, ammonia, H2_network and
          gas_network are all true by default and regional sequestration potentials are enabled.
          Nothing to change; the work is affording it.
      - variant: single-node-ptx-hub
        rung: L5
        note: >
          Not what this workflow builds. pypsa-eur assembles a continental network from clustered
          regions; a plant-scale hub with three heat temperature levels and two electricity buses
          is a bespoke script against the pypsa library, reusing this card's primitives but none
          of its rules. The corpus papers that did it wrote standalone models.
      - variant: endogenous-end-use-technology-choice
        rung: L5
        note: >
          L1 for the one shipped case (sector.industry_t.endogen, off by default). Everything else
          — drivetrain choice, industrial process routes, renovation depth beyond the
          retro_endogen stub — is new Links plus a turnover/share constraint, which is exactly
          what every corpus `extends` paper forked to do.
      - variant: new-conversion-chain-extension
        rung: L2
        note: >
          The common case and cheaper than it looks: one n.add("Link", ...) in the add_* function
          owning the input carrier, following the existing multi-port pattern. Rises to L3 when
          the technology needs a new potential or demand input, and to L4 when that input needs
          its own build rule and wildcard.
      - variant: power-sector-extraction-from-sector-model
        rung: L5
        note: >
          No supported path. The two entry points are separate targets, and retaining sectoral
          demand buses while deleting the rest of the sector network is a post-processing script
          on a prepared sector network. Cheap to write, but nothing in the repo does it.
    where:
      - change: "add or modify a conversion link"
        anchor: "scripts/prepare_sector_network.py — the add_* function owning the input carrier (add_heat, add_industry, add_biomass, add_land_transport, ...)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "add or change a carrier bus / its spatial resolution"
        anchor: "scripts/prepare_sector_network.py::define_spatial plus the matching sector.*_spatial config key"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "change the carbon accounting structure (new sink, new store, vent behaviour)"
        anchor: "scripts/prepare_sector_network.py::add_co2_tracking (and add_co2_network for transport)"
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking"
      - change: "route a new process's waste heat into district heating"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat — pick the next free bus index"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "keep an electricity-layer technology alive into the sector network"
        anchor: "config pypsa_eur.{Generator,StorageUnit,Store} allow-lists read by remove_elec_base_techs"
        provenance: "scripts/prepare_sector_network.py:remove_elec_base_techs"
      - change: "change which sectors the CO2 cap baseline covers"
        anchor: "scripts/prepare_sector_network.py::determine_emission_sectors"
        provenance: "scripts/prepare_sector_network.py:determine_emission_sectors"
      - change: "add a new sector data input"
        anchor: "rules/build_sector.smk — a new build_* rule plus an input line on rule prepare_sector_network"
        provenance: "rules/build_sector.smk:prepare_sector_network"
      - change: "endogenise an exogenous end-use share"
        anchor: "scripts/prepare_sector_network.py::add_t_industry100_200 as the in-repo pattern; a service demand bus plus competing links elsewhere"
        provenance: "scripts/prepare_sector_network.py:add_t_industry100_200"
    data_dependencies:
      - input: "a new technology's potential / demand / cost-curve input (e.g. a sequestration or resource map)"
        required_for: new-conversion-chain-extension
        availability: >
          must be built — rules/build_sector.smk owns ~60 build_* rules and a new resource means a
          new rule plus an input line on prepare_sector_network
      - input: "regional CO2 sequestration potentials (CO2Stop-derived)"
        required_for: full-sector-coupling-with-carbon-management
        availability: "exists by default (sector.regional_co2_sequestration_potential.enable is true), Europe-only"
      - input: "JRC-IDEES / eurostat energy balances for the sector demand split and the CO2 baseline"
        required_for: carrier-buses-with-conversion-links
        availability: "exists by default, European countries only — this is the hard geographic boundary of the eur chain"
    cost_profile:
      solves: >
        One solve per (clusters, opts, sector_opts, planning_horizons) combination; the sector
        network is roughly an order of magnitude more variables than the electricity-only network
        at the same clustering, because each node carries buses for heat (up to three systems),
        H2, gas, oil, methanol, ammonia, biomass, CO2 and low voltage rather than one AC bus.
      relative: >
        The corpus's practical envelope: 30-181 nodes at 1-4 hourly, or 750-2190 TSAM segments when
        nodes go up. Full-sector 100+ node hourly runs are not routine in the corpus; every study
        above ~90 nodes coarsened time (3-hourly or segmentation) to pay for it.
      note: >
        The affordability levers are all L0/L1 and orthogonal to the assembly: fewer clusters,
        coarser resolution, TSAM segmentation, and copperplating carriers you are not asking about
        (co2_spatial/biomass_spatial/gas_network false). Switching sectors off is the crudest lever
        and the one with a hidden cost — it moves the CO2 baseline. Prefer coarsening time to
        deleting sectors when the question is cross-sectoral.
    verifies:
      - variant: carrier-buses-with-conversion-links
        check: "{'AC','H2','co2','co2 stored','urban central heat'}.issubset(set(n.buses.carrier))"
        over: run
        note: >
          A missing carrier bus means the corresponding add_* function did not run — almost always
          a master switch left off, or an exception swallowed upstream. The solve still succeeds and
          simply answers a different question.
      - variant: carrier-buses-with-conversion-links
        check: "(n.links.carrier.str.contains('CHP').sum() == 0) or (n.links.loc[n.links.carrier.str.contains('CHP'), 'bus2'] != '').all()"
        over: run
        note: >
          A CHP link without a second output port is a boiler that was billed as a CHP. This is the
          canonical multi-port failure: the link builds, solves and silently discards the heat.
      - variant: full-sector-coupling-with-carbon-management
        check: "'co2 atmosphere' in n.stores.index and (n.stores.at['co2 atmosphere','e_min_pu'] < 0)"
        over: run
        note: >
          If the atmosphere store cannot go negative, net-negative emissions are structurally
          impossible and any CDR technology in the network is dead weight — the run will succeed
          and just never remove carbon.
      - variant: new-conversion-chain-extension
        check: "n.links.query(\"carrier == @new_carrier\").filter(like='bus').ne('').sum(axis=1).ge(2).all()"
        over: run
        note: >
          A newly added conversion link with fewer than two connected ports is not converting
          anything. Catches the most common extension typo — a bus name string that does not match
          any bus in the network, which pypsa leaves as an empty port.
      - variant: full-sector-coupling-with-carbon-management
        check: "n.global_constraints.query(\"type == 'co2_atmosphere'\").shape[0] == 1"
        over: run
        note: >
          No CO2 global constraint means the assembly is unconstrained on emissions and the answer
          is a fossil least-cost system. Two means a cap was added twice and the tighter one silently
          wins.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: sector-coupled-workflow
        role: >
          the entry point, and the whole story: ONE umbrella registry entry covers what eur
          splits across sector-master-switches, district-heating-suite,
          exogenous-transport-shares, industry-t-endogenous and methanol-suite. The registry
          asymmetry is not an oversight — earth's sector tree genuinely has less to enumerate.
      - id: co2-network-sequestration
        role: >
          the shared carbon layer: co2 atmosphere bus, per-location co2 stored bus+store,
          vents, optional CO2 pipelines, DAC. Status `working`, but flatter than eur's — there
          is no separate `co2 sequestered` bus/store tier and no regional potential map
      - id: h2-pipeline-routing
        role: "the H2 carrier's transport layer, routed along the clustered GGIT gas network or greenfield"
      - id: gas-network-links
        role: >
          registry status `dead-key` and the sharpest single difference from eur: the config
          comment reads 'ALWAYS FALSE for now (NOT USED)', pipelines are clustered but no gas
          Links are ever built, so methane is nodally unlimited
      - id: ammonia-value-chain
        role: "NH3 as a first-class carrier — one of the few sector chains earth matches eur on"
      - id: end-use-fuel-share-switches
        role: >
          the transport/shipping electrification levers, keyed by {demand}_{horizon} rather
          than by horizon alone — the `{demand}` wildcard IS the pathway selector
      - id: h2-export-chain
        role: >
          earth-only, and structurally load-bearing here: the sector target filename ends in
          `_{h2export}export.nc`, so every sector run passes through add_export whether or not
          it is an export study
      - id: distribution-grid-lv
        role: "registry status `partial` — the LV cost-proxy layer that heat/EV/rooftop coupling attaches to"
      - id: bev-dsm-v2g
        role: "the transport carrier's flexibility; the flexibility content itself belongs to the sibling card"
      - id: custom-data-overrides
        role: >
          the sanctioned 'impose it in data, optimise the response' channel (industry demand,
          pipelines, heat, export) — earth's answer to extensions that eur does in code
      - id: myopic-foresight
        role: >
          registry status `partial`; the sector+myopic combination is the least battle-tested
          part of this chain and the honest answer to a pathway request here is 'expect to debug'
      - id: discount-rate-dimension
        role: >
          registry status `partial`; the `{discountrate}` filename token that labels sector runs
          without any script reading it — see pitfalls
    available:
      verdict: assemble
      how: >
        The sector chain exists and works: `solve_sector_networks` expands to
        postnetworks/elec_s{simpl}_{clusters}_ec_l{ll}_{opts}_{sopts}_{planning_horizons}_
        {discountrate}_{demand}_{h2export}export.nc and prepare_sector_network.py assembles the
        multi-carrier network with the same primitives — define_spatial per carrier, add_co2 for
        the shared atmosphere/stored layer, and ten `sector.enable` flags gating add_heat,
        add_biomass, add_industry, add_shipping, add_aviation, add_land_transport,
        add_rail_transport, add_agriculture, add_residential and add_services. Earth has TWO
        add_* functions eur lacks (add_residential, add_services split the buildings demand
        explicitly) and one structurally better idea: convert_conventional_generators_to_links
        CONVERTS the existing electricity-layer generators in place, preserving p_nom, build_year,
        lifetime and extendability while attaching a fuel bus and a co2 atmosphere port — where
        eur deletes them via remove_elec_base_techs and rebuilds greenfield. For a brownfield
        non-European fleet that is the right primitive.
        It is `assemble` rather than `turnkey` because the pieces do not compose without work:
        the sector chain and the electricity chain use DIFFERENT wildcard sets, several carrier
        chains eur ships are absent, gas transport is a dead key, and the demand/horizon share
        dictionaries must be filled in for any combination outside the shipped ones.
      missing: >
        Procedure step 9 as in eur, plus real gaps in steps 1-8 that eur does not have.
        No methanol carrier at all (no add_methanol, no `methanol` in the config or the script) —
        so the entire methanol economy, methanol shipping fuel and methanol-to-power are absent
        and every corpus earth study that wanted them added the chains itself. No separate
        `co2 sequestered` tier: sequestration is the `co2 stored` Store with a scalar
        co2_sequestration_potential and no regional map, so spatially-explicit storage siting is
        not available. Gas transport is a dead key. District heating is a population-fraction
        share rather than GIS-derived areas, with no dynamic supply temperatures and no PTES/ATES
        machinery. Industrial process-heat technology choice is exogenous only — there is no
        industry_t equivalent. The CO2 cap is a flat scalar from electricity.co2limit/co2base and
        is NOT sector-scoped, so eur's baseline-moves-with-switches behaviour has no analogue here
        (which removes one pitfall and adds another: the cap does not track the sector set at all).
      provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links; scripts/prepare_sector_network.py:add_co2; scripts/prepare_sector_network.py:add_services"
    levers:
      - key: "sector.enable.heat"
        effect: >
          Gates add_heat: residential/services rural, urban decentral and urban central heat
          buses plus heat pumps, resistive heaters, boilers, CHP and TES.
        default: "true"
        provenance: "config.default.yaml:heat; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.enable.land_transport"
        effect: "Gates add_land_transport: EV/FCEV/ICE links, BEV DSM and V2G."
        default: "true"
        provenance: "config.default.yaml:land_transport; scripts/prepare_sector_network.py:add_land_transport"
      - key: "sector.enable.industry"
        effect: "Gates add_industry: industrial demand per carrier with exogenous fuel mix."
        default: "true"
        provenance: "config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
      - key: "sector.enable.biomass"
        effect: "Gates add_biomass: solid biomass and biogas buses and their conversion links."
        default: "true"
        provenance: "config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
      - key: "sector.enable.residential"
        effect: >
          Gates add_residential — an earth-only split that eur folds into heat and industry.
          Gives residential demand its own carriers, which is the right shape for a country
          where cooking and non-electric residential fuels dominate.
        default: "true"
        provenance: "config.default.yaml:residential; scripts/prepare_sector_network.py:add_residential"
      - key: "sector.enable.services"
        effect: "Gates add_services — the second earth-only demand split, paired with residential."
        default: "true"
        provenance: "config.default.yaml:services; scripts/prepare_sector_network.py:add_services"
      - key: "sector.enable.rail_transport"
        effect: >
          Gates add_rail_transport — earth models rail as its own sector where eur folds rail
          non-electric into the transport CO2 baseline only.
        default: "true"
        provenance: "config.default.yaml:rail_transport; scripts/prepare_sector_network.py:add_rail_transport"
      - key: "sector.enable.agriculture"
        effect: "Gates add_agriculture (machinery fuel and electricity demand)."
        default: "true"
        provenance: "config.default.yaml:agriculture; scripts/prepare_sector_network.py:add_agriculture"
      - key: "sector.enable.shipping"
        effect: "Gates add_shipping (H2/oil shares at ports; no methanol route exists here)."
        default: "true"
        provenance: "config.default.yaml:shipping; scripts/prepare_sector_network.py:add_shipping"
      - key: "sector.enable.aviation"
        effect: >
          Gates add_aviation. The in-script comment states plainly that aviation 'runs with
          dummy data' — treat any aviation result here as structural, not quantitative.
        default: "true"
        provenance: "config.default.yaml:aviation; scripts/prepare_sector_network.py:add_aviation"
      - key: "sector.gas.spatial_gas"
        effect: >
          Nodal gas buses versus one bus. Config comment says 'ALWAYS TRUE'. Note that nodal gas
          BUSES exist while gas transport LINKS do not, so gas is nodal in name and copperplated
          in effect.
        default: "true"
        provenance: "config.default.yaml:spatial_gas; scripts/prepare_sector_network.py:define_spatial"
      - key: "sector.gas.network"
        effect: >
          DEAD KEY. Config comment: 'ALWAYS FALSE for now (NOT USED)'. Pipelines are clustered by
          prepare_gas_network but no gas Links are built. Setting it true does not create a gas
          network — the worst silent failure in this chain.
        default: "false"
        provenance: "config.default.yaml:network; scripts/prepare_sector_network.py:define_spatial"
      - key: "sector.co2_network"
        effect: "Adds CO2 pipeline links between the stored-CO2 buses inside add_co2."
        default: "true"
        provenance: "config.default.yaml:co2_network; scripts/prepare_sector_network.py:add_co2"
      - key: "sector.co2_sequestration_potential"
        effect: >
          A single scalar (MtCO2) for the whole model, not a regional map — so sequestration is
          available uniformly wherever a co2 stored bus exists. eur's regional CO2Stop potentials
          have no counterpart.
        default: "200"
        provenance: "config.default.yaml:co2_sequestration_potential; scripts/prepare_sector_network.py:add_co2"
      - key: "sector.dac"
        effect: "Adds the DAC link — the atmospheric carbon source for synthetic fuels."
        default: "true"
        provenance: "config.default.yaml:dac; scripts/prepare_sector_network.py:add_dac"
      - key: "sector.land_transport_electric_share"
        effect: >
          The electrification pathway, keyed by "{demand}_{planning_horizons}" (e.g. AB_2030).
          The `{demand}` scenario wildcard therefore selects the transport pathway, which is a
          coupling eur does not have.
        default: "{BU_2030: 0.0, AP_2030: 0.075, NZ_2030: 0.13, DF_2030: 0.01, AB_2030: 0.01, BU_2050: 0.0, AP_2050: 0.42, NZ_2050: ..., DF_2050: ...} — note NO AB_2050"
        provenance: "config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:add_land_transport"
      - key: "sector.electricity_distribution_grid"
        effect: >
          Inserts LV buses and reinforcement links per node hosting rooftop PV, home batteries,
          EVs and heat. Registry rates the capability `partial`; a cost proxy, not a network.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: "sector.district_heating.potential"
        effect: >
          The maximum urban heat fraction served by district heating, combined with a population
          urban/rural split and a `progress` factor. This is the whole DH representation — there
          are no GIS-derived DH areas and no supply temperatures.
        default: "0.3"
        provenance: "config.default.yaml:potential; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: "sector.hydrogen.network"
        effect: >
          Builds H2 pipeline links, routed along the clustered gas network or greenfield along the
          power topology, with an optional repurposing cap.
        default: "true"
        provenance: "config.default.yaml:network; scripts/prepare_sector_network.py:add_hydrogen"
      - key: "scenario.demand"
        effect: >
          The demand-scenario wildcard. Selects both the demand projection and, via the
          "{demand}_{horizon}" dictionary keys, the transport and shipping fuel shares. Has no
          pypsa-eur counterpart.
        default: "['AB']"
        provenance: "config.default.yaml:demand; scripts/prepare_sector_network.py:add_land_transport"
      - key: "scenario.sopts"
        effect: >
          The sector wildcard — but ONLY temporal resolution (an `nh` token consumed by
          average_every_nhours). Unlike eur's sector_opts there are no sector on/off tokens; the
          sector set lives entirely in sector.enable.
        default: "['144h']"
        provenance: "config.default.yaml:sopts; scripts/prepare_sector_network.py:average_every_nhours"
      - key: "export.h2export"
        effect: >
          Supplies the `{h2export}` wildcard that terminates every sector target filename, so
          add_export runs on every sector network. Set to 0 for a non-export study rather than
          trying to remove the stage.
        default: "[10]"
        provenance: "config.default.yaml:h2export; scripts/add_export.py:export_profile"
      - key: "costs.discountrate"
        effect: >
          Supplies the `{discountrate}` filename token. No script reads wildcards.discountrate —
          annuities come from the costs table — so the token labels runs without changing them.
        default: "[0.071]"
        provenance: "config.default.yaml:discountrate; scripts/prepare_sector_network.py:discountrate"
    assembly:
      - step: >
          Check the country's data grades before anything else. The sector-side columns of the
          data-quality matrix are uniformly C for fuel-shares, district-heating-share and
          industry-growth-cagr and D for ammonia-plants across essentially every country, while
          the electricity-side columns (gadm-boundaries, osm-grid, era5-cutout, powerplant-fleet)
          are A/B. The chain runs anywhere; the sector INPUTS are the constraint, and this gate
          decides whether the study is answerable before any config is written.
        uses: [sector-coupled-workflow, custom-data-overrides]
        config: "countries; custom_data.* if you are supplying your own demand or industry data"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - step: >
          Pick the sector target, and accept its wildcard set. The sector chain is
          `..._{sopts}_{planning_horizons}_{discountrate}_{demand}_{h2export}export.nc`; the
          electricity chain is `elec_s{simpl}_{clusters}_ec_l{ll}_{opts}.nc`. There is no shared
          target, and solve_network.py discriminates on `"sopts" in snakemake.wildcards`. Set
          export.h2export to 0 rather than attempting to bypass add_export.
        uses: [sector-coupled-workflow, h2-export-chain]
        config: "scenario.sopts; scenario.demand; export.h2export; costs.discountrate"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_co2; scripts/add_export.py:export_profile"
      - step: >
          Fill the demand/horizon share dictionaries for the combination you actually intend to
          run. The shipped defaults cover AB_2030 and AP/BU/NZ/DF at 2030 and 2050 — the default
          `demand: [AB]` has NO 2050 entry, so `demand: AB` with `planning_horizons: 2050`
          raises a KeyError inside get(). Add the key rather than switching scenario.
        uses: [end-use-fuel-share-switches]
        config: "sector.land_transport_electric_share; sector.land_transport_fuel_cell_share; sector.shipping_hydrogen_share"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - step: >
          Set the carrier resolution. define_spatial's flags are per-carrier as in eur
          (gas.spatial_gas, coal.spatial_coal, lignite.spatial_lignite, oil.spatial_oil,
          ammonia.spatial_ammonia), but note that nodal gas BUSES with no gas transport LINKS is
          copperplating with extra bus names — do not read a gas siting result off it.
        uses: [gas-network-links]
        config: "sector.gas.spatial_gas; sector.oil.spatial_oil; sector.ammonia.spatial_ammonia"
        code: null
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - step: >
          Select the sector set with the ten `sector.enable` flags. Unlike eur, this does NOT
          move the CO2 baseline: add_co2_budget takes a flat scalar from electricity.co2limit or
          co2base and is off by default (co2_budget.enable: false), so a sector run with no
          emissions constraint at all is the shipped state. Turn it on deliberately.
        uses: [sector-coupled-workflow, co2-cap]
        config: "sector.enable.*; co2_budget.enable; co2_budget.co2base_value"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_co2_budget"
      - step: >
          Add missing carrier chains. This is the step that makes the verdict `assemble`: methanol
          does not exist here at all, and the corpus's two earth sector studies both had to add
          chains (Haber-Bosch ammonia is shipped; green methanol, DRI/HBI green steel and shipping
          defossilisation were not). Follow the eur pattern — one Link per process, bus0 the input,
          bus2/bus3 for co2 atmosphere and co2 stored — placed in the add_* function owning the
          input carrier, or supply it as data through custom_data.
        uses: [ammonia-value-chain, custom-data-overrides]
        config: "custom_data.industry_demand and friends where a data channel suffices"
        code: "scripts/prepare_sector_network.py — new n.madd('Link', ...) in the owning add_* function"
        provenance: "scripts/prepare_sector_network.py:add_ammonia; scripts/prepare_sector_network.py:h2_hc_conversions"
      - step: >
          Decide how the existing fleet enters. convert_conventional_generators_to_links is the
          better primitive of the two models for this: it preserves p_nom, p_nom_extendable,
          efficiency, build_year and lifetime from the electricity-layer generators while adding a
          fuel bus0 and a co2 atmosphere bus2, and zeroes the carrier's co2_emissions so emissions
          are counted once on the link. Reuse it rather than writing a brownfield conversion.
        uses: [sector-coupled-workflow]
        config: "sector.conventional_generation mapping (defaults to {OCGT: gas, CCGT: gas})"
        code: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - step: >
          If a pathway is needed, budget for debugging before results. The registry rates
          myopic-foresight and existing-baseyear-brownfield `partial` here, and the sector+myopic
          combination is the least exercised path in this chain — both corpus earth studies are
          single-horizon overnight runs.
        uses: [myopic-foresight, existing-baseyear-brownfield]
        config: "foresight: myopic; scenario.planning_horizons; existing_capacities.*"
        code: "scripts/add_brownfield.py"
        provenance: "scripts/add_brownfield.py:add_brownfield"
    boundary:
      - variant: carrier-buses-with-conversion-links
        rung: L1
        note: >
          The chain builds it, but not from defaults alone: you must pick the sector target, keep
          the {demand}/{planning_horizons} share keys consistent, and turn co2_budget on if you
          want an emissions constraint. L1 rather than eur's L0 because the shipped combination is
          not a complete study.
      - variant: electricity-heat-only
        rung: L1
        note: >
          Set sector.enable.heat true and the other nine false. Cheaper here than in eur and a
          genuinely good use of this model — heat is the sector where earth's representation is
          simplest but least wrong for a region with little district heating.
      - variant: electricity-heat-transport
        rung: L1
        note: >
          heat + land_transport (+ rail_transport) on. Requires the transport share dictionary to
          have a key for your {demand}_{horizon} pair — the most common first failure.
      - variant: full-sector-coupling-with-carbon-management
        rung: L3
        note: >
          Not reachable by config: gas transport is a dead key, there is no regional sequestration
          potential map, and methanol as a utilisation route does not exist. Rung L3 because the
          binding gaps are DATA-shaped (a regional storage-potential input, a country's industry
          and fuel-share data at grade C) rather than formulation-shaped. Delivering eur-equivalent
          carbon management here also needs the methanol chain written (L5).
      - variant: single-node-ptx-hub
        rung: L5
        note: >
          As in eur, not what this workflow builds — a bespoke pypsa script. Worth noting that the
          corpus's export-oriented earth studies are conceptually close to a hub study wrapped in a
          national network, so h2-export-chain is the nearer starting point here than in eur.
      - variant: endogenous-end-use-technology-choice
        rung: L5
        note: >
          Nothing shipped: no industry_t equivalent, and the transport shares are hard exogenous
          dictionary lookups. Every endogenous end-use choice is new Links plus a turnover
          constraint through custom-constraint-hook. Strictly more work than in eur, which at least
          has one worked example in-repo.
      - variant: new-conversion-chain-extension
        rung: L2
        note: >
          The realistic intervention here and the one both corpus earth studies performed. One
          n.madd("Link", ...) in the owning add_* function, following the same multi-port pattern.
          Rises to L3 whenever the new chain needs country data that the matrix grades C or D —
          which for industry and fuel shares is essentially always.
      - variant: power-sector-extraction-from-sector-model
        rung: L5
        note: >
          No path, and harder than in eur because the two chains' wildcard sets differ more:
          extracting the power system from a sector network means rebuilding the electricity-chain
          filename contract by hand. solve_network.py's `"sopts" in wildcards` discriminator is the
          seam to work against.
    where:
      - change: "add or modify a conversion link"
        anchor: "scripts/prepare_sector_network.py — the add_* function owning the input carrier (add_heat, add_industry, add_hydrogen, h2_hc_conversions, ...)"
        provenance: "scripts/prepare_sector_network.py:h2_hc_conversions"
      - change: "add or change a carrier bus / its spatial resolution"
        anchor: "scripts/prepare_sector_network.py::define_spatial plus the matching sector.<carrier>.spatial_<carrier> key"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "change the carbon accounting structure"
        anchor: "scripts/prepare_sector_network.py::add_co2 (atmosphere store, stored buses, vents, pipelines all in one function)"
        provenance: "scripts/prepare_sector_network.py:add_co2"
      - change: "bring the existing thermal fleet into the sector network as emitting links"
        anchor: "scripts/prepare_sector_network.py::convert_conventional_generators_to_links"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - change: "add the missing methanol carrier chain"
        anchor: "scripts/prepare_sector_network.py — a new add_methanol alongside add_ammonia, plus a spatial.methanol namespace in define_spatial"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "supply demand / industry / pipeline data instead of deriving it"
        anchor: "custom_data.* config keys and data/custom/*"
        provenance: "scripts/prepare_sector_network.py:custom_data"
      - change: "add a new sector data input or rule"
        anchor: "Snakefile — a new rule plus an input line on rule prepare_sector_network (earth has no rules/ split)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "constrain the emissions of the coupled system"
        anchor: "scripts/prepare_sector_network.py::add_co2_budget, gated on the top-level co2_budget.enable"
        provenance: "scripts/prepare_sector_network.py:add_co2_budget"
    data_dependencies:
      - input: "country fuel shares, district-heating share and industry growth for the sector demand split"
        required_for: carrier-buses-with-conversion-links
        availability: >
          region-dependent and the binding constraint — data_quality/MATRIX.csv grades fuel-shares,
          district-heating-share, industry-growth-cagr and demand-growth-cagr as C for essentially
          every country. The chain will run; the numbers are assumptions to sign off with the user.
      - input: "regional CO2 sequestration potential map"
        required_for: full-sector-coupling-with-carbon-management
        availability: >
          absent — only a single scalar sector.co2_sequestration_potential exists, so any
          spatially-explicit storage-siting question needs a new input and a new consumer
      - input: "industrial plant and ammonia-plant locations"
        required_for: new-conversion-chain-extension
        availability: >
          region-dependent: industrial-plant-database grades A/D by country and ammonia-plants is D
          almost everywhere — supply your own via custom_data for any industry-sited study
      - input: "a {demand}_{planning_horizons} entry in the fuel-share dictionaries"
        required_for: electricity-heat-transport
        availability: >
          must be built (by hand, in config) — the shipped set omits AB_2050, and any custom demand
          scenario label needs its own keys or add_land_transport raises KeyError
    cost_profile:
      solves: >
        One solve per (simpl, clusters, ll, opts, sopts, planning_horizons, discountrate, demand,
        h2export) combination — nine wildcard dimensions against eur's four, so a careless scenario
        block multiplies out much faster here. The default 144h sopts is already a heavy temporal
        aggregation, which is the chain's implicit admission of the cost.
      relative: >
        Cheaper than eur in absolute terms for the same ambition: the corpus's earth sector studies
        are 14-node single-country models at 1-3 hourly, where eur's are 30-181 nodes continental.
        Fewer carriers also means a smaller LP — no methanol chain, no sequestration tier, no gas
        network links.
      note: >
        The affordability levers are the same and mostly L0/L1 (clusters, the sopts nh token, TSAM
        segmentation). The real cost here is not solve time, it is the data and debugging budget:
        expect to spend more effort getting a defensible sector demand and a working myopic pathway
        than waiting for the solver. Price that into the estimate honestly.
    verifies:
      - variant: carrier-buses-with-conversion-links
        check: "{'AC','H2','co2','co2 stored'}.issubset(set(n.buses.carrier))"
        over: run
        note: >
          A missing carrier bus means the corresponding add_* function did not run — usually a
          sector.enable flag left false. The solve succeeds and answers a narrower question.
      - variant: carrier-buses-with-conversion-links
        check: "(n.links.bus2 == 'co2 atmosphere').sum() > 0"
        over: run
        note: >
          No link debiting the atmosphere means either no fossil conversion was built or
          convert_conventional_generators_to_links found nothing to convert. Emissions are then
          structurally zero and any CO2 target is trivially met.
      - variant: carrier-buses-with-conversion-links
        check: "n.carriers.loc[[c for c in ['gas','coal','oil'] if c in n.carriers.index], 'co2_emissions'].eq(0).all()"
        over: run
        note: >
          convert_conventional_generators_to_links zeroes the fuel carrier's co2_emissions because
          the link now carries them. If a fuel carrier still has a non-zero co2_emissions AND an
          emitting link exists, emissions are double-counted and the cap is twice as tight as intended.
      - variant: electricity-heat-transport
        check: "n.links.carrier.str.contains('BEV|EV|land transport').any()"
        over: run
        note: >
          No transport links after enabling land_transport almost always means the
          {demand}_{planning_horizons} share lookup returned zero shares rather than failing —
          check the dictionary key before trusting a 'no electrification is optimal' result.
      - variant: full-sector-coupling-with-carbon-management
        check: "n.links.query(\"carrier == 'gas pipeline'\").empty"
        over: run
        note: >
          Asserted the OTHER way round deliberately: this check PASSES on a correct earth run,
          documenting that sector.gas.network is dead and no gas transport links exist. If it ever
          fails, the dead key has been fixed upstream and this card's gas claims need re-grepping.
