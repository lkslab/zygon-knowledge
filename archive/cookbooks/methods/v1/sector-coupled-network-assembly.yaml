id: sector-coupled-network-assembly
title: "Sector-coupled multi-carrier network assembly (bus-per-carrier / link-as-converter)"
summary: >
  Represent every energy carrier as its own bus, every conversion process as a link
  with an efficiency, every carrier inventory as a store, and every emission as a
  flow on one shared CO2 bus — so that all sectors are one linear programme.
question: >
  How do I build a single optimisation that spans electricity, heat, transport,
  industry and fuels, with consistent conversion losses and one emissions account?
aliases:
  - "sector coupling"
  - "sector-coupled energy system model"
  - "multi-carrier network"
  - "multi-energy system"
  - "integrated energy system model"
  - "energy system optimisation model (ESOM)"
  - "cross-sector coupling"
  - "bus-per-carrier formulation"
  - "link with efficiency / multi-link / multi-port link"
  - "energy hub"
  - "whole-system modelling"
when_to_use:
  - "model electricity and heat and transport together, not just power"
  - "what does electrifying heating do to the power system"
  - "I need a whole-energy-system model, not a power-sector model"
  - "how do hydrogen, methane and electricity trade off against each other"
  - "where should the carbon come from for synthetic fuels"
  - "net-zero for the whole economy, not just the grid"
  - "does it make sense to build electrolysers here rather than import fuel"
  - "I want emissions from industry and transport counted in the same budget"
  - "add a new conversion technology to an existing energy system model"
  - "should I use the electricity-only model or the sector-coupled one"
family: sector-coupling
prevalence:
  papers: 44
  tier1: 31
  tier2: 13
  sweep_hits: 79
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 44 papers that actually
    build or run a multi-carrier network — the fourth-largest method in the corpus and
    the largest one that is a MECHANISM rather than a setting. The regex screen returned
    79, so it over-counts by ~35: "sector coupling" and "integrated energy system" are
    boilerplate in the introductions of electricity-only studies. No paper in this slice
    is flagged in EVIDENCE_INDEX.md's mention-only list, because the discriminator used
    was concrete (does the paper name its carrier buses / conversion links), not
    vocabulary. The role split is the tell: 2 `defines`, 4 `extends`, 8 `canonical-use`
    and 30 `routine-use`. The mechanism was settled by 2018 and is now infrastructure —
    30 papers assemble a sector-coupled network without contributing a word of method to
    it. That is why this card documents the mechanism and delegates the technologies.
procedure:
  - step: >
      Decide the carrier set and the spatial resolution PER CARRIER. This is the first
      and least reversible choice: each (carrier, location) pair becomes one Bus. The
      corpus never resolves every carrier nodally — electricity, heat and hydrogen are
      typically nodal while gas, oil, biomass, methanol, ammonia and CO2 are
      "copperplated" onto a single EU-wide bus to keep the LP tractable.
    handle: "define_spatial(nodes, options) — one SimpleNamespace per carrier, nodal or single-node per config flag"
    provenance: "scripts/prepare_sector_network.py:define_spatial"
  - step: >
      Start from a solved-shaped electricity network and strip it back to a carrier
      substrate: keep only the AC/DC buses and the generator/storage carriers that the
      sector layer will NOT re-add as links, because conventional plants must become
      links (they need a fuel bus and a CO2 port) rather than generators.
    handle: "patch_electricity_network -> remove_elec_base_techs(n, carriers_to_keep) driven by the `pypsa_eur:` carrier lists"
    provenance: "scripts/prepare_sector_network.py:remove_elec_base_techs; scripts/prepare_sector_network.py:patch_electricity_network"
  - step: >
      Add one Bus per carrier per location, plus a Store on each fuel bus so depletable
      resources have an inventory and a price rather than an infinite tap. Units are
      per-carrier (MWh_LHV for gas, MWh_th for other fuels, t_co2 for carbon).
    handle: "add_carrier_buses(n, carrier, ...) — adds Carrier + Bus + Store (+ Generator for fossil supply)"
    provenance: "scripts/prepare_sector_network.py:add_carrier_buses"
  - step: >
      Create ONE global CO2 accounting layer: a `co2 atmosphere` Bus with an unbounded
      Store that may go negative, a per-location `co2 stored` Bus+Store for captured
      carbon, and a `co2 sequestered` Bus+Store for permanent storage. Every combustion
      link debits the atmosphere bus and every capture link credits the stored bus. This
      single structure is what makes emissions accounting consistent across sectors:
      there is no per-sector emissions bookkeeping to reconcile.
    handle: "add_co2_tracking(n, costs, options, sequestration_potential_file, co2_price)"
    provenance: "scripts/prepare_sector_network.py:add_co2_tracking"
  - step: >
      Express every conversion process as a Link. The Link carries ONE decision variable
      p (the bus0 withdrawal) and each further port bus1..busN is a linear function of
      it with coefficient efficiencyN. A gas CHP is therefore bus0=gas, bus1=electricity
      (efficiency), bus2=heat (efficiency2), bus3=co2 atmosphere (efficiency3 = the fuel's
      CO2 intensity); adding capture makes it bus4=co2 stored with efficiency4 = the
      captured fraction and efficiency3 = the escaping fraction. Negative efficiencyN is
      a second INPUT (electricity consumed by a capture train), positive is an output.
      This is the single most reusable idea in the book: any multi-input, multi-output,
      emitting process is one Link plus a table of coefficients — no new component type,
      no new constraint.
    handle: "n.add('Link', ..., bus2=, bus3=, bus4=, efficiency2=, efficiency3=, efficiency4=) — e.g. the `urban central {fuel} CHP CC` link in add_heat"
    provenance: "scripts/prepare_sector_network.py:add_heat"
  - step: >
      Add each sector's demand and its supply menu, gated on that sector's master switch,
      in an order that respects the dependencies: fuels and CO2 first, then heat,
      biomass, industry, transport, shipping, aviation, agriculture. Every sector's
      add_* function assumes the carrier buses it consumes already exist.
    handle: "add_heat / add_land_transport / add_industry / add_biomass / add_shipping / add_aviation / add_agriculture, each behind `if options[<sector>]`"
    provenance: "scripts/prepare_sector_network.py:add_land_transport; scripts/prepare_sector_network.py:add_industry"
  - step: >
      Wire the cross-sector by-products that are the actual point of coupling — waste heat
      from PtX into district heating, captured CO2 into synthetic fuels, EV batteries into
      the electricity bus. Waste heat is added by MUTATING an already-built link's next
      free port rather than by adding a component, which is why it must run last.
    handle: "add_waste_heat(n, costs, options, cf_industry) — sets bus2/bus3/bus4 + efficiency2/3/4 on existing Fischer-Tropsch, Sabatier, Haber-Bosch, methanolisation, electrolysis and fuel-cell links"
    provenance: "scripts/prepare_sector_network.py:add_waste_heat"
  - step: >
      Close the system with a single global emissions constraint over the CO2 carrier,
      whose historical baseline is derived from exactly the sectors that were switched on.
      Optionally insert transport/distribution layers (H2 and gas pipelines, an LV bus
      per node) and split bidirectional carrier links into lossy forward/reverse pairs.
    handle: "add_co2limit -> GlobalConstraint(type='co2_atmosphere'), with determine_emission_sectors(options) choosing the baseline"
    provenance: "scripts/prepare_sector_network.py:add_co2limit; scripts/prepare_sector_network.py:determine_emission_sectors"
  - step: >
      (extension) Make a coupling that is exogenous by default endogenous: let the model
      choose the drivetrain mix, the industrial process route, or the retrofit depth
      instead of imposing a share pathway. This is the live research frontier in the
      corpus and always means new Links plus a share/turnover constraint, never a config
      key alone.
    handle: null
    provenance: null
variants:
  - id: carrier-buses-with-conversion-links
    what: >
      The base mechanism: one Bus per (carrier, location), Links with efficiency as the
      universal converter, Stores for inventories, one shared CO2 bus. Everything else in
      this card is this plus a choice. Cite this variant when the question is "how is the
      model built", not "which sectors are in it".
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
  - id: electricity-heat-only
    what: >
      The cheapest useful coupling: electricity plus one or two heat buses per node
      (urban central / decentral, rural) joined by heat pumps, resistive heaters, boilers
      and CHP. Buys the power-to-heat flexibility and thermal storage story at a fraction
      of the full model's solve time, and is the entry point the corpus used first.
    papers:
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
  - id: electricity-heat-transport
    what: >
      The classic three-bus-per-node PyPSA-Eur-Sec-30 configuration: electricity, heat and
      a land-transport bus, with BEV batteries providing demand-shifting and V2G. The
      configuration most of the 2018-2022 corpus reports, and the one whose headline
      finding is that sector-coupling flexibility substitutes for transmission.
    papers:
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
  - id: full-sector-coupling-with-carbon-management
    what: >
      All sectors on (power, heat, land transport, shipping, aviation, industry and
      feedstocks, agriculture) plus the carbon cycle as first-class structure: capture on
      point sources, DAC, CO2 transport, utilisation into synthetic fuels, and geological
      sequestration with a regional potential and a budget. This is the default shape of
      a 2023+ study and the most expensive to solve.
    papers:
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
  - id: single-node-ptx-hub
    what: >
      The same primitives at plant scale: one location, many carriers (two electricity
      voltages, three heat temperature levels, H2, CO2, biomethane, biochar), multi-port
      links for each synthesis unit, and storage-unit components deliberately replaced by
      store+link pairs so charge and discharge can be sized independently. Shows the
      mechanism is scale-free, and is the cheapest way to prototype a new conversion
      chain before putting it in a continental model.
    papers:
      - "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
      - "2023_Tries_Islanding-Green-Hydrogen.pdf"
  - id: endogenous-end-use-technology-choice
    what: >
      Replace an exogenous share pathway with a competition between Links: drivetrains
      (BEV/FCEV/ICE) per node, industrial process routes (BF-BOF, NG-DRI, H2-DRI,
      scrap-EAF), or industrial heat bands choosing between biomass/methane/H2/heat
      pumps. Requires fleet-turnover or minimum-part-load constraints to stop the model
      swapping the whole fleet in one horizon. The corpus's `extends` papers are almost
      all here.
    papers:
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2025_Burghardt_material-needs-energy-technologies.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
  - id: new-conversion-chain-extension
    what: >
      Leave the assembly alone and add conversion links for a technology it lacks:
      bioenergy portfolios, capture solvents, e-biofuels, EGS in heat-and-power modes,
      alternative CDR sinks, methanol pathways. The most common intervention in the
      corpus by a wide margin, and the one the generation_conversion recipe book exists
      to parameterise — this card only owns where the new link attaches.
    papers:
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2025_Franken_Geothermal-Market-Integration.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
  - id: power-sector-extraction-from-sector-model
    what: >
      Run the assembly backwards: build the sector-coupled model, then extract the power
      system alone while RETAINING the sectoral demand buses (EV, heat pump, resistive
      heating, electrolysis) as flexible loads. Gives the power-sector detail of an
      electricity-only model with sector-coupled flexibility, at electricity-only cost —
      the pragmatic answer when the full model will not fit the compute budget.
    papers:
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
literature:
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: defines
    note: >
      THE defining paper for this card. Introduces PyPSA-Eur-Sec-30 as "the first open,
      spatially-resolved, temporally-resolved and sector-coupled energy model of Europe"
      and states the mechanism in one sentence: each of 30 country nodes "consists of
      individual 'buses' for electricity, heat, transport, hydrogen and methane. The
      electric buses are connected together with transmission represented by HVDC lines;
      the buses of the different sectors are connected within a node with energy
      converters." Five carrier buses per node; converters are heat pumps with
      temperature-dependent COP, resistive heaters, gas boilers, extraction-condensing
      CHP, solar thermal, electrolysis, methanation+DAC and fuel cells; stores are
      batteries, H2 tanks, hot-water TES at two time constants (tau=3 d and tau=180 d) and
      a methane store. Investment co-optimised with dispatch over all 8760 hours. The
      headline result to quote to users is that sector-coupling flexibility and
      transmission reinforcement are substitutes, not complements.
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      Defines the PRIMITIVE the other paper defines the model with, and is the citation to
      use when justifying the formulation rather than the study: "These sectors can be
      modelled using a network of links with efficiencies for energy conversion losses."
      Fixes the three facts this card rests on — KCL is enforced at every bus regardless
      of carrier while KVL applies only to passive-branch subnetworks (so non-electric
      carriers need no impedance); link efficiencies may be time-varying eta_{l,t} (which
      is how a heat-pump COP enters); and depletable resources such as gas are Stores, not
      infinite generators. Notes that CHPs need extra back-pressure and fuel-consumption
      constraints beyond the bare link.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference application for the electricity-heat-only variant: 30 country nodes,
      one electricity bus and TWO heat buses each (urban and rural), with ground- and
      air-source heat pumps, resistive heaters and CHP as the coupling links, plus
      tau=180 d tanks on urban heat and tau=3 d tanks on rural. Transport excluded, hydro
      fixed exogenously. Useful as the worked example of the urban/rural split being a
      DEMAND-side partition that determines which supply technologies are even eligible.
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The canonical electricity-heat-transport pathway study and the source of the
      urban/rural heat framing most later papers inherit: heat demand split into urban
      (district-heating-eligible by population density) and rural (individual solutions
      only), transport as a lumped per-country demand with exogenous BEV penetration,
      half of BEVs smart-charging and a quarter offering V2G. Carriers: electricity, heat
      (urban/rural), hydrogen, synthetic methane, transport. Demonstrates the assembly
      surviving 5-year myopic steps 2020-2050 rather than a single target year.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: canonical-use
    note: >
      The clearest statement of the per-carrier spatial-resolution decision that this
      card's step 1 is about: at 181 regions, "gas, oil, biomass, CO2 carriers
      copperplated (no explicit transport) to reduce problem size; electricity, hydrogen
      and heat nodally resolved". Also the reference for the shared CO2 accounting bus
      tracking capture, usage, sequestration and emissions together. Read it before
      promising a user a nodally-resolved gas or biomass answer.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The most quotable justification for the mechanism's central discipline: "each
      carrier bus is explicitly separated to prevent unphysical cross-sector storage
      arbitrage". Splits electricity demand into four end-uses (baseload, EV, heat
      pumps/resistive, electrolysis) on separate buses precisely so that an EV battery
      cannot silently serve a heat load. This is the argument to give a user who asks why
      they cannot just add flexible load to the electricity bus.
  - paper: "2025_Lindner_PyPSA-DE_EEM.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for FORKING the assembly to a national model rather than using it as
      shipped: PyPSA-DE keeps PyPSA-Eur's carrier/link structure and swaps in national
      data (grid development plan, Marktstammdatenregister power and gas unit registers),
      49 regions with 30 in Germany, and adds waste as a sector. The pattern to point a
      user at when they want one country in detail inside a European boundary.
  - paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference implementation of the endogenous-end-use-technology-choice variant:
      three additional per-node links (EV, FCEV, ICE) converting their respective carriers
      into a shared land-transport demand bus, so the drivetrain mix becomes an investment
      variable instead of the exogenous share pathway the config imposes. Names the
      pattern this card recommends for any exogenous share you want to endogenise — a
      demand bus for the SERVICE, competing links into it.
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: canonical-use
    note: >
      The best evidence that the mechanism is scale-free, and the corpus's most explicit
      statement of the multi-port link: "only generator, load, bus, store and link
      components are used; storage unit components are replaced by store + link pairs",
      with multilink components carrying efficiency coefficients alpha_{n,l,t} across
      multiple input and output buses. Eight carriers on one site (two electricity
      voltages, three heat temperature levels, H2, CO2, biomethane, biochar). Also the
      source of the deliberate two-electricity-bus trick used to make RFNBO-eligible
      electricity distinguishable from grid electricity.
  - paper: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference pypsa-earth sector-coupled study, and the honest picture of what
      earth's chain does deliver: a 14-node Morocco model with electricity buses, gas
      pipeline buses, hydrogen pipelines, a CO2 network and a shared CO2 accounting bus;
      V2G, air heat pumps, DAC, Fischer-Tropsch, BEV chargers and resistive heaters all as
      conversion links. Demand distributed spatially by GDP or production sites over GADM
      level-1 regions. 264 scenario runs, so the chain is demonstrably robust enough to
      sweep — the caveat is data, not code.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: extends
    note: >
      Extends the industry module from exogenous fuel mix to endogenous process-route
      choice for five subsectors (iron/steel, cement, ammonia, methanol, HVCs), adding
      BF-BOF, NG-DRI-EAF, H2-DRI-EAF, scrap-EAF and BF-BOF+TGR retrofit as competing
      links with published efficiencies, emission factors and minimum part loads, plus
      end-of-life emissions on methanol and HVCs in the CO2 balance. The template for
      "make a sector's technology choice a decision variable" and the paper to cite for
      why minimum part load is not optional once processes compete.
  - paper: "2025_Burghardt_material-needs-energy-technologies.pdf"
    tier: 2
    role: extends
    note: >
      Extends the assembly in the one direction that breaks its usual one-way logic: bulk
      material demand (steel, cement, HVC) is linked back to energy-infrastructure
      expansion, so building wind turbines consumes steel the model must also produce.
      Material balances sit alongside carrier balances; material demand from technology
      expansion is annualised over technology lifetimes; capital costs of energy
      technologies must exclude domestically produced materials to avoid double-counting.
      The clearest example of an extension that is NOT expressible as another link.
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: extends
    note: >
      The template for the new-conversion-chain-extension variant done properly: adds
      solid and digestible biomass categories with JRC ENSPRESO supply-cost curves,
      conversion routes to BtL/CHP/BioSNG/biogas upgrading, OPTIONAL carbon capture on
      each process, and a biomass import link with a step supply-cost curve. Shows that a
      "technology" addition is usually a resource bus + a supply curve + several links,
      not one link. The blending mandate itself is a minimum-share constraint on liquid
      hydrocarbon production, i.e. custom-constraints work, not assembly work.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: extends
    note: >
      Extends the assembly by adding a demand REDUCTION as a supply-like technology:
      building renovation modelled as a generator that removes a constant fraction of the
      time-varying heat demand, linearised over two cost steps (moderate 40% savings at
      157 EUR/m2, ambitious to 20% of unrenovated demand at 224 EUR/m2) with
      country-specific cost curves. The trick to reach for when a user wants efficiency
      measures co-optimised rather than assumed. 48 nodes with electricity (transmission
      and distribution), heat (district and individual, rural/urban), transport, hydrogen,
      methane and biomass buses.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine full-sector assembly, cited here as the point at which the carrier list
      stabilises into what later papers assume: electricity, hydrogen, methane, liquid
      hydrocarbons, heating (district/individual) and a CO2 atmosphere bus, with
      electrolysers, fuel cells, heat pumps, SMR, Fischer-Tropsch, methanation, DAC and
      CHPs as links, all carrier balances and the CO2 cycle tracked jointly per time step.
      37 nodes, 3-hourly, myopic 2020-2050.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine three-bus-per-node PyPSA-Eur-Sec-30 use (electricity, heating, transport;
      30 nodes; heat pumps, electrolysers, fuel cells and CHP as the conversion links).
      Contributes no mechanism, but is useful as evidence that the same assembly answers a
      single-technology question (the role of solar PV) without modification.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: >
      Runs the assembly at FOUR levels of coupling (electricity only, +heating,
      +transport, +both) as the study design, which makes it the corpus's best evidence
      for what each sector switch actually buys. Confirms the shared CO2 constraint is
      applied across all active sectors jointly, and that the urban/rural split governs
      district-heating eligibility.
  - paper: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine sector-coupled use, cited for the hydrogen supply menu it assembles on the
      H2 bus (grey SMR, blue SMR+CC at 90% capture, green AEC electrolysis) feeding
      methanation, boilers, fuel cells, retrofitted OCGTs, industry and shipping, with
      OCGTs and gas boilers able to run on either gas or hydrogen. Also models the
      distribution grid explicitly with a co-optimised transfer capacity between voltage
      levels at 500 EUR/kW_elec.
  - paper: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Explicitly uses the standard sector-coupling structure "without modification",
      confining its extensions to offshore potentials and grid topology. The cleanest
      corpus example of the boundary this card draws: a study can be substantial while
      touching none of the assembly.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine full-sector assembly with bespoke offshore nodes bolted on (64 onshore + 66
      offshore, 33 countries, 3-hourly). Evidence that adding nodes for a subsystem does
      not require touching the carrier/link structure — the offshore extension is spatial,
      the assembly is unchanged.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine use of the full carbon-management assembly, and the corpus's clearest
      separation of the three carbon operations as distinct technology classes: capture
      (CC), utilisation (CU, via methanation / methanolisation / Fischer-Tropsch) and
      sequestration (CS), plus DAC. Carriers include electricity, heat, hydrogen, methane,
      methanol, liquid hydrocarbons, biomass and CO2 over 90 nodes.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine all-sector assembly at 110 nodes, cited for the density of PtX links it
      exercises at once (electrolysis, methanation, methanolisation, Haber-Bosch,
      Fischer-Tropsch, methanol-to-olefins/aromatics, methanol-to-power, steam reforming
      +/- CCS), with PtX waste heat routed into district heating and steel/ammonia
      industry allowed to relocate within Europe. The upper bound on how much conversion
      machinery one network carries in practice.
  - paper: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      Cited for its endogenous drivetrain investment (BEV/FCEV/ICE, light- and heavy-duty
      separately) with fleet-turnover rates anchored to country-specific JRC-IDEES car
      registration data, over five investment periods. Confirms the pattern of the
      endogenous variant and supplies the constraint type — turnover, not just share —
      that keeps it physically sensible.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine PyPSA-DE sector-coupled use with HBI, ammonia and methanol as traded
      intermediates alongside electricity, hydrogen and CO2. Notable for a deliberate
      assembly OMISSION stated as a method choice: synthesis exhaust heat is not
      integrated into district heating, in order to isolate input procurement costs. A
      good illustration that waste-heat coupling is a modelling decision with a magnitude.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: >
      Standard assembly plus one technology in three link configurations (electricity-only
      ORC, combined heat and power, heat-only exchanger) attached to district-heating and
      low-temperature industrial-heat buses. The compact worked example of "where does a
      new technology attach", including Fischer-Tropsch waste heat as a competing district
      heat source.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Routine seven-sector assembly, valuable for reporting the full bus inventory
      explicitly (HV and LV electricity, heat urban/rural and district, land transport,
      hydrogen, gas, CO2, methanol, oil) together with the numbers that make it concrete:
      distribution grid as an HV-to-LV link at 97% efficiency, 60% of urban heat via
      district heating with seasonal tanks. The demand-side mechanisms it compares belong
      to demand-side-flexibility-representation, not here.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Cited for stating the assembly ALGEBRAICALLY: carriers connected via a lossy
      incidence matrix M_{ikt}, which is exactly what the multi-port link with
      efficiency2..N is. The most compact formal description of the mechanism in the
      corpus, and the bridge to shadow-prices-and-marginal-values, where that matrix is
      what makes a heat price and an electricity price commensurable.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine PyPSA-DE assembly, cited for two structural details worth reusing: PtX
      processes (electrolysis, methanolisation, methanation, Fischer-Tropsch) share the CO2
      accounting bus, and waste heat from conversion is fed into district heating. Also
      exogenously switches 2035-vintage gas turbines to hydrogen in 2045 — the manoeuvre
      for fuel-switching an existing asset without a new component.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Runs five scenarios that toggle hydrogen and methane transmission AND distribution
      networks on and off, which makes it the corpus's best demonstration that carrier
      TRANSPORT is separable from carrier CONVERSION in this assembly — you can keep every
      conversion link and delete the pipelines. The routing content itself belongs to
      carrier-network-routing-h2-co2.
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      Routine full-sector assembly whose per-carrier resolution choice is stated plainly —
      gas copperplated to reduce computational burden while H2 and CO2 networks are
      explicitly routed. Corroborates step 1's claim that the corpus resolves carriers
      selectively, and that the choice is made on solve time.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      Adds four e-biofuel conversion links (e-biomass-to-liquid, e-biomethanol,
      e-biogas-methanol, e-bioSNG) to the existing multi-carrier network, and had to
      formulate a new carbon-energy allocation framework to do it. The instructive case
      where a "just add a link" extension turned out to need new constraint algebra
      because carbon and energy must be allocated consistently across co-products.
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: >
      Adds solvent and sorbent production chains (MEA, KOH, PEI-silica) as explicit
      conversion links with their own energy inputs, deliberately isolated from other
      CAPEX/VOM so their contribution is separable. The pattern for making a cost
      component auditable: give it its own link rather than folding it into an existing
      technology's capital cost.
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: >
      Extends the carbon side with four non-geological CDR strategies (afforestation,
      perennialisation, biochar, enhanced rock weathering) as additional sequestration
      sinks on the existing CO2 structure. Evidence that the single shared CO2 bus
      absorbs entirely new removal classes without restructuring — the payoff of step 4.
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Runs a 39-node sector-coupled fork with CO2 hydrogenation (Sabatier,
      Fischer-Tropsch, methanol synthesis), CHP, SMR, DAC and biogas upgrading on a shared
      CO2 accounting bus at a uniform 90% point-source capture rate. Useful for the list of
      demands it sets exogenously (aviation oil, agricultural machinery oil, naphtha
      feedstock, shipping methanol, industrial biomass/gas heat, process emissions) —
      i.e. what the assembly does NOT decide by default.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Routine use, cited for two reusable structural facts: CO2 is modelled endogenously
      across atmosphere, temporary storage and underground sequestration buses, and a
      SINGLE link per node represents the whole distribution grid connecting HV
      transmission to LV demand. The latter is the honest description of what the
      distribution layer in this assembly is — a cost proxy, not a network.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      Useful for stating the per-carrier resolution split as a design table: electricity,
      heat, hydrogen and gas spatially resolved; oil, biomass, ammonia and methanol on
      model-wide buses; CO2 tracked through temporary and permanent storage. Also
      endogenises industrial process heat into low/medium/high temperature segments via a
      modification tracking PyPSA-Eur PR #611 — a concrete precedent for the heat-band
      structure that is now `sector.industry_t`.
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      Routine four-carrier assembly (electricity, heating with urban/rural sub-buses,
      hydrogen, methane) with electrolysers, Sabatier, fuel cells, heat pumps, CHP, OCGT,
      CCGT, gas boilers and resistive heaters as links. Cited for a per-node eligibility
      detail that generalises: Italy is excluded from underground H2 storage on geological
      grounds, so a store's availability is a regional data question, not a switch.
  - paper: "2023_Tries_Islanding-Green-Hydrogen.pdf"
    tier: 1
    role: routine-use
    note: >
      A deliberately minimal bespoke assembly — two electricity buses and two hydrogen
      buses per country (mainland and island) joined by electrolysers, a pipeline, battery
      and cavern storage. The proof that the mechanism scales DOWN usefully: a four-bus
      model answers a real siting question, and duplicating a carrier bus is how you make
      "grid-connected" versus "off-grid" a distinguishable choice.
  - paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      The smallest coupling in the corpus: two buses (AC electrical, heating) per
      single-node country, heat pumps and resistive heaters as the links, CTES/ITES stores
      on the heat bus, and Carnot-battery waste heat as an additional heat input at a fixed
      heat-to-power ratio. The example to hand a user who wants a power-to-heat answer in
      a day rather than a week.
  - paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    tier: 1
    role: routine-use
    note: >
      Extends the district-heating side of the assembly with explicit forward and return
      network temperatures, PTES discharge-boosting constraints and multiple heat sources
      (geothermal, river, sea, electrolyser waste heat), sub-regionalising the 40 largest
      German DH systems. Evidence that heat is the carrier where the assembly's
      constant-efficiency assumption breaks first and temperature must become a variable.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      The second pypsa-earth sector-coupled study, and the honest read on extending
      earth's chain: five new PtX conversion chains (Haber-Bosch ammonia, green methanol,
      DRI/HBI green steel, shipping defossilisation) had to be ADDED for a 14-node Morocco
      2035 study, several of which pypsa-eur ships by default. Uses earth's modular custom
      constraint and data channels to do it.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      The mechanism transplanted outside both models: PyPSA-USA extended to multi-sector
      with 134 electricity load zones, state-level gas buses and service/industrial/
      transport demand buses, ASHP/GSHP with ERA5 temperature-dependent COP, and a
      CO2/CH4 accounting bus that also tracks upstream and downstream FUGITIVE methane.
      The one corpus example of extending the shared-emissions-bus idea beyond CO2, which
      is the natural next step for a user asking about methane leakage.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The source of the power-sector-extraction variant: extracts the power system from
      the full sector-coupled model "while also using sectoral demand profiles and
      flexibility settings from the full model", retaining hydrogen, battery, EV, heat-pump
      and resistive-heating buses linked to the main electricity bus with sector demands
      supplied exogenously. 4 nodes, hourly, 14 single-year networks per coupling
      iteration — the shape to propose when the full assembly will not fit the budget.
  - paper: "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Contributes the CONTRAST rather than an application: its full-national-energy-system
      comparator (IKARUS, "some thousand technologies" spanning primary energy through
      conversion and transport to final demand, at representative time slices) is the
      technology-rich, time-poor alternative to this card's time-rich, technology-lean
      assembly. Applies a cross-sectoral CO2 price uniformly rather than only to ETS
      sectors. Its counter-intuitive-cap findings are cited in `pitfalls`.
pitfalls:
  - pitfall: >
      Turning a sector switch OFF silently moves the CO2 cap's baseline, because the
      historical 1990 emission sectors summed into the limit are chosen from the same
      switches. An electricity+heat run and an all-sector run at "the same" 5%-of-1990 cap
      are enforcing two different absolute budgets, so their costs and emissions are not
      comparable.
    evidence: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    note: >
      determine_emission_sectors(options) is the mechanism; read the resulting absolute tCO2
      out of the GlobalConstraint and report it, not the fraction. When comparing coupling
      levels, either fix the absolute cap by hand or state that the baseline moved. The
      corpus's four-coupling-level study is the template for doing this deliberately.
  - pitfall: >
      A cross-sector cap plus a technology-forcing constraint can produce genuinely
      counter-intuitive optima — tightening a CO2 cap increasing the use of a dirtier fuel
      (Giffen-like behaviour), or an emission-minimising budget run behaving unlike a
      cost-minimising cap run. This is a property of the coupled LP, not a bug.
    evidence: "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
    note: >
      Whenever a coupled result is counter-intuitive, check the cap/price duality before
      believing the story: re-run with an emissions PRICE at the cap's shadow price and see
      whether the artefact survives. Never present a single cap run's sectoral shift as a
      policy finding without that check.
  - pitfall: >
      Putting several end-uses on one bus lets the model arbitrage between them
      unphysically — an EV battery serving a heat load, or thermal storage discharging into
      the grid — inflating apparent flexibility. The bus is the boundary of substitutability,
      and merging buses to "simplify" quietly deletes a physical constraint.
    evidence: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    note: >
      Give each end-use service its own bus and connect it with a link whose direction and
      efficiency you can defend. If a user asks for a simplification that merges buses,
      quantify what it makes fungible before agreeing.
  - pitfall: >
      Per-carrier copperplating is invisible in the results but decides the answer. With gas,
      biomass, oil, methanol or CO2 on one EU-wide bus, the model may site an electrolyser or
      a synthesis plant anywhere and move the feedstock for free — so "optimal siting"
      conclusions for those carriers are artefacts of the resolution choice.
    evidence: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    note: >
      Read define_spatial's flags (co2_spatial, biomass_spatial, gas_network,
      regional_oil_demand, regional_coal_demand, methanol.regional_methanol_demand) and state
      which carriers are copperplated alongside any siting result. If the question IS siting
      for one of those carriers, resolving it is an L1 config change with a real solve-time
      cost — quote both.
  - pitfall: >
      Waste-heat coupling works by writing into an existing link's next free port, so it
      depends on both ordering and port availability. A conversion technology you add that
      already uses bus2/bus3/bus4 for CO2 will collide with the hardcoded port index, and a
      run with heating switched off drops all PtX waste heat silently — changing the
      economics of Fischer-Tropsch and electrolysis without any warning.
    evidence: "2025_Seibold_Germany-Industry-Transformation.pdf"
    note: >
      add_waste_heat runs last and only under `if options["heating"]`. When adding a
      multi-output link, leave a free port or extend add_waste_heat explicitly, and check
      n.links.loc[..., "bus3"] after the build. The corpus paper that excluded synthesis
      exhaust heat did so deliberately and said so — treat it as a stated assumption either
      way.
  - pitfall: >
      Constant link efficiencies are a poor model of heat. A district-heating network's
      achievable output depends on forward/return temperatures, and a heat pump's COP on
      source and sink temperature; a fixed-efficiency link overstates both, and overstates
      pit-storage capacity that is temperature-limited.
    evidence: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    note: >
      Use the time-varying efficiency path (time_dep_hp_cop, the COP profiles, the
      district-heating supply-temperature approximation) rather than a scalar, and treat
      temperature-dependent storage boosting as L5 work if the study turns on it. pypsa-eur
      has this machinery; pypsa-earth has a scalar heat_pump_sink_T instead.
  - pitfall: >
      Exogenous share pathways look like assumptions but behave like results. The land
      transport electric/fuel-cell/ICE split, the shipping methanol share and the
      district-heating progress factor are all imposed per horizon, so any conclusion about
      "how much electrification is optimal" for those end-uses is circular.
    evidence: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    note: >
      Say out loud which shares are imposed before promising an answer. If the user's
      question is the share itself, the honest route is the
      endogenous-end-use-technology-choice variant (competing links into a service demand
      bus plus a turnover constraint), not a sweep over the exogenous value.
  - pitfall: >
      Adding a co-product conversion link is not always just a link. When a process yields
      both fuel and carbon (or fuel and heat) from a shared feedstock, energy and carbon must
      be allocated consistently or the CO2 balance leaks — which needs new constraint algebra
      on top of the efficiency table.
    evidence: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    note: >
      For any new link with more than one useful output, verify the carbon closes: sum the
      CO2-carrying ports against the feedstock's CO2 intensity. If it does not close by
      construction, budget for a custom constraint (see custom-constraints-with-linopy)
      rather than tuning efficiencies until the totals look right.
  - pitfall: >
      Bidirectional carrier links are SPLIT into a forward link and a `-reversed` twin when
      transmission_efficiency is enabled, with the reverse copy carrying zero capital cost and
      zero length. Any post-processing that sums link capacities, lengths or flows by carrier
      double-counts unless it filters on the `reversed` column.
    evidence: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    note: >
      lossy_bidirectional_links does the split for every carrier listed under
      sector.transmission_efficiency.enable (DC, H2 pipeline, H2 pipeline retrofitted, gas
      pipeline, electricity distribution grid by default). Filter `~n.links.reversed` in any
      extraction script, and use length_original rather than length.
  - pitfall: >
      The distribution grid in this assembly is one link per node with a reinforcement cost,
      not a network. It produces a plausible-looking "distribution cost" and hosting decision
      with no power flow, no feeder, and no voltage behind it.
    evidence: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    note: >
      Never present an LV result as a hosting-capacity or feeder-level finding. The registry
      is explicit that distribution-power-flow is absent in both models; route those questions
      to a distribution tool and use this layer only as a cost proxy.
requires_methods:
  - linearised-optimal-power-flow
combines_with:
