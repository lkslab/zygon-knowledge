id: temporal-aggregation-and-segmentation
title: "Temporal aggregation and segmentation (snapshot reduction with weightings)"
summary: >
  Replace the 8760 hourly time steps with a smaller snapshot set — uniform n-hourly
  means, adaptive variable-length segments, representative periods, or plain thinning —
  and carry a per-snapshot weighting so annual sums, costs and storage energy balances
  stay dimensionally correct.
question: >
  How few time steps can I get away with, which hours must survive, and what does the
  compression cost me in the answer?
aliases:
  - "temporal aggregation"
  - "time series aggregation"
  - "TSA"
  - "tsam"
  - "temporal resolution"
  - "n-hourly resolution"
  - "3-hourly resolution"
  - "downsampling"
  - "resampling"
  - "time series clustering"
  - "segmentation"
  - "sequential time step aggregation"
  - "chronological time-period clustering"
  - "adaptive segmentation"
  - "typical days"
  - "typical periods"
  - "representative days"
  - "representative periods"
  - "representative time steps"
  - "representative hours"
  - "typical hours"
  - "k-medoids clustering of time series"
  - "snapshot weightings"
  - "snapshot weights"
  - "time step weighting"
  - "full hourly resolution"
when_to_use:
  - "the model takes too long to solve, what can I coarsen"
  - "is 3-hourly good enough or do I need hourly"
  - "how many time steps do I need"
  - "how do I get a whole year into a model I can actually run"
  - "what resolution should I run this at"
  - "my run ran out of memory, what do I cut first"
  - "I need to run many scenarios, how do I make each one cheap"
  - "does coarsening the time steps change the answer"
  - "the model is not building any batteries, is that real"
  - "why did my annual generation come out three times too high"
  - "should I use typical days or a full chronological year"
  - "what does 144h mean in this config and is it sensible"
  - "can I model sub-hourly balancing or 15-minute markets"
  - "how do I keep the low-wind weeks in a reduced model"
family: temporal-resolution
prevalence:
  papers: 36
  tier1: 25
  tier2: 11
  sweep_hits: 62
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 36 papers that state a
    temporal-resolution choice specific enough to reproduce — the second most prevalent
    method in this book. The regex screen returned 62 and OVER-counts, because
    `temporal resolution` and `n-hourly` match any methods paragraph that merely
    mentions the model's time step in passing without saying what it is or how it was
    obtained. EVIDENCE_INDEX.md flags one suspect in this slice
    (2025_Rahdan_high-impact-consumers-behavioural-flexibility: "no temporal
    aggregation applied ... TSAM described in SI but not applied"); it is KEPT, because
    a stated 2-hourly full-year run IS a resolution choice under this method, and the
    `full-hourly-baseline` variant exists precisely so the no-aggregation decision is
    recordable rather than invisible. The role distribution is the story: 34 of 36 are
    `routine-use`. Almost nobody publishes ABOUT temporal aggregation in this corpus;
    everybody performs it, in one sentence, and moves on. That is what makes the
    pitfalls below high-value — the corpus's own reporting standard for this method is
    poor, and only 5 papers (Schlachtberger, Schyska, Neumann 2023 Joule,
    vanGreevenbroek 2024, Kalweit 2026) report an error against a higher-resolution
    benchmark at all.
procedure:
  - step: >
      Fix the snapshot WINDOW first — which calendar hours the study covers — before
      choosing how to compress them. Window and resolution are independent decisions and
      conflating them is the most common source of confusion ("3h" is not a year).
      Both models build every profile at hourly frequency from this window, so the
      window is also where the hourly floor is set.
    handle: "snapshots.start/end/inclusive"
    provenance: "scripts/_helpers.py:get_snapshots; config/config.default.yaml:inclusive"
  - step: >
      Choose the compression family. The corpus uses four: (a) uniform n-hourly means,
      (b) adaptive variable-length segments fitted to the series, (c) representative
      periods / typical days selected by clustering, (d) every-nth-snapshot thinning.
      (a) and (d) are equal-weight; (b) and (c) are not, which changes every downstream
      statistic.
    handle: null
    provenance: null
  - step: >
      For uniform averaging: resample every time-varying series (capacity factors,
      load, inflow, heat demand, COPs) to n-hour means, and set each new snapshot's
      weighting to the number of original hours it absorbed. The mean is what makes it a
      low-pass filter; the weighting is what makes the annual sum survive.
    handle: "average_every_nhours(n, offset, drop_leap_day)"
    provenance: "scripts/prepare_network.py:average_every_nhours"
  - step: >
      For segmentation: normalise the series to [0,1] per column (otherwise the largest
      column dominates the distance metric), concatenate them into one matrix, and fit
      one "typical period" spanning the whole horizon subdivided into k contiguous
      segments of unequal length. Segment boundaries land where the series change fast,
      so extreme hours stay narrow and flat nights get merged.
    handle: "tsam.TimeSeriesAggregation(..., hoursPerPeriod=len(df), noTypicalPeriods=1, noSegments=k, segmentation=True)"
    provenance: "scripts/time_aggregation.py:TimeSeriesAggregation; scripts/time_aggregation.py:noSegments"
  - step: >
      Read the segment durations back out and write them as the snapshot weightings.
      This is the load-bearing line of the whole method: durations come out of tsam as
      an index level, and if they are not transferred the model silently treats k
      unequal segments as k equal hours.
    handle: "segmented.index.get_level_values('Segment Duration') -> n.snapshot_weightings"
    provenance: "scripts/prepare_network.py:Segment Duration"
  - step: >
      For representative periods / typical days: cluster the hours (k-means on the
      series, or k-medoids to keep a real historical hour as the centre) into k groups,
      keep one representative per group, and weight it by the group's frequency of
      occurrence. Unlike (a)-(b) this breaks chronology, so inter-period storage state
      of charge must be handled explicitly or abandoned.
    handle: null
    provenance: null
  - step: >
      For thinning: keep every n-th snapshot untouched and multiply its weighting by n.
      No averaging, so peaks that fall on a kept snapshot survive at full amplitude and
      peaks that fall between snapshots vanish entirely — a different bias from (a),
      not a smaller one.
    handle: "set_temporal_aggregation(n, '<n>sn', ...)"
    provenance: "scripts/prepare_sector_network.py:set_temporal_aggregation"
  - step: >
      Propagate the weightings into all three columns PyPSA uses them in — `objective`
      (scales operational cost), `generators` (scales energy sums and global
      constraints like the CO2 cap) and `stores` (is the elapsed-hours term in the
      storage energy balance and standing-loss exponent). Both models set the whole
      DataFrame at once, which is why this normally works; a hand-written aggregation
      that sets only one column produces a model that solves and lies.
    handle: "n.snapshot_weightings[objective|generators|stores]"
    provenance: "pypsa/components.py:snapshot_weightings; pypsa/optimization/constraints.py:n.snapshot_weightings.stores"
  - step: >
      Validate against a higher-resolution benchmark before believing the run: re-solve
      at 2-3 finer resolutions and report the system-cost delta and the delta in
      whatever quantity the study is actually about. The corpus's benchmarks are
      -0.35% cost for 3h vs 1h, >2.5% for 6h, up to 3.7% for 3h against segmentation
      on carbon-management capacities, and >30% for a single annual time step.
    handle: null
    provenance: null
  - step: >
      Re-weight every reported statistic. Weighted means for prices and costs, weighted
      sums for energy, and NO unweighted percentiles, standard deviations or duration
      curves off unequal-weight snapshots. `shadow-prices-and-marginal-values` owns the
      price side of this; the weighting mechanics live here.
    handle: "n.snapshot_weightings.generators as the weight vector in summary tables"
    provenance: "scripts/make_summary.py:calculate_weighted_prices"
variants:
  - id: n-hourly-averaging
    what: >
      Uniform n-hour means over the full chronological year, all snapshots equal weight
      n. The corpus default by a wide margin — 3h (2920 snapshots) is the modal choice,
      with 2h, 4h and 5h also used. Cheapest to implement, cheapest to explain, and the
      one whose bias is best characterised: it is a low-pass filter, so it removes
      variability below n hours and with it the value of storage shorter than n.
    papers:
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
      - "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
      - "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
      - "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
      - "2025_Franken_Geothermal-Market-Integration.pdf"
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
  - id: tsam-segmentation
    what: >
      Adaptive contiguous segments of unequal duration fitted to the normalised series
      (Pineda & Morales / Kotzur lineage, implemented in tsam with segmentation=True).
      Chronology is preserved, so seasonal storage still works, but snapshot weights
      differ. Every paper that compared it says it beats the equal-hour uniform
      resolution of the same snapshot count: 750 segments beats ~11.6h, 1500 beats 6h,
      2190 and 4380 are used as "3h-equivalent" and "2h-equivalent". This is the
      recommended default when tractability binds and extremes matter.
    papers:
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
  - id: representative-periods
    what: >
      Cluster the year into k groups of hours or days and keep one representative each,
      weighted by frequency of occurrence. k-means gives a synthetic average centre;
      k-medoids keeps a real historical hour. Cheapest of all in snapshot count (72
      snapshots, 100 typical hours, 16-24 representative hours in the corpus) and the
      only variant that BREAKS CHRONOLOGY — inter-period storage is either constrained
      explicitly or lost. Used where the question is a per-hour network property
      (redispatch base cases, aggregation-error studies), not a seasonal balance.
    papers:
      - "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
  - id: every-nth-snapshot
    what: >
      Keep every n-th hour verbatim and weight it n; discard the rest with no averaging.
      Preserves instantaneous amplitude on the kept hours (unlike averaging) at the cost
      of a hard sampling bias on the discarded ones, and it is aliased to the diurnal
      cycle for n dividing 24. No corpus paper reports using it; it exists as a shipped
      surface in pypsa-eur's sector chain (`nsn`) and is listed here so the interview
      can recognise and steer away from the token.
    papers: []
  - id: full-hourly-baseline
    what: >
      No aggregation: 8760 snapshots per year at unit weight, the reference every other
      variant is validated against. Still used for headline runs where the deliverable
      is a peak, a price distribution, a flexibility value or a flow statistic that
      aggregation would destroy — and it is pypsa-eur's shipped default. Recording it as
      a variant is deliberate: "we did not aggregate" is a resolution decision and
      belongs in the bundle.
    papers:
      - "2018_Hofmann_Principal-flow-patterns_EPL.pdf"
      - "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
      - "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
  - id: resolution-sensitivity-sweep
    what: >
      The method applied to itself: solve at several resolutions and report the spread
      as the result. This is the variant that turns an unexamined assumption into a
      stated error bar, and it is what the five papers with a benchmark did. Costs
      several solves and is the only defensible way to answer "is 3h good enough".
    papers:
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
literature:
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: critiques
    note: >
      THE critique paper for this method and the one to quote. Introduces a misallocation
      pseudometric (cross-constrain solution A into scenario B's feasible region, measure
      the cost penalty) and finds PyPSA-Eur is MORE sensitive to temporal resolution than
      to capital costs or weather year. The mechanism is stated precisely: averaging over
      tau hours is a low-pass filter, and battery storage with a 6 h energy-to-power
      ratio disappears from the optimal mix once tau exceeds 6 h, while 168 h hydrogen
      storage survives. Misallocation is >=7.2 EUR/MWh across the 6h-12h boundary versus
      <=4.2 EUR/MWh within each block. The actionable rule: THE RESOLUTION MUST BE FINER
      THAN THE CHARACTERISTIC STORAGE HORIZON OF THE STORAGE YOU EXPECT TO DEPLOY.
      Confirms it applies the weightings (w_t = omega_t = tau), so this is a critique of
      correctly-weighted averaging, not of a weighting bug.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference resolution-sensitivity study: a 2x2 of (1 year, 3 years) x (1h, 3h)
      on a 30-node European model, i.e. the explicit statement of the tractability
      trade-off this whole method exists to make. Finds 3h means raise the solar share
      and LOWER battery capacity, because smoothing the intra-day solar ramp does the job
      short-term storage would otherwise be built for — the same mechanism Schyska later
      quantifies. Its conclusion is the corpus's working consensus and worth relaying
      verbatim: 3h sampling "seems reasonable for long-term planning studies, particularly
      if it enables more weather years to be considered." The trade is resolution FOR
      weather years, not resolution for nothing.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Supplies the most-cited numeric justification for 3-hourly in the PyPSA-Eur family:
      resampling hourly -> 3-hourly changes system cost by -0.35% on a 90-region
      sector-coupled model, while 6-hourly exceeds 2.5%. 181 nodes, 2920 snapshots,
      uniform weights, full chronological year. Later segmentation papers cite this run
      as the accuracy anchor they are matching, so it is the number to quote when a user
      asks "why 3h".
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      The most thorough resolution benchmark in the corpus and the best template for the
      resolution-sensitivity-sweep variant: seven resolutions compared (700SEG, 750SEG,
      876SEG, 2920SEG, 8760SEG, 3H, 10H, 168H) on the same 39-node sector-coupled model,
      with 750SEG chosen. Key finding to relay: uniform 3H deviates by up to 3.7% in
      system cost and shows notable differences in the carbon-management capacities that
      are the study's actual subject — i.e. the cost error understates the error in the
      quantity of interest.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      Cleanest statement of the segmentation-beats-averaging claim with a validated
      number: 8760 -> 750 segments, "known to be more accurate than the equivalent
      ~11.6-hourly uniform aggregation", validated against a 2000-segment/60-node model
      at a maximum relative error of 3.7% across evaluated metrics, over three horizons
      and two scenarios. 750 segments is also the aggressive end of what the corpus
      considers defensible, and it was chosen because 216 scenarios x 6 horizons had to
      fit — the canonical example of resolution being spent on ensemble breadth.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      1500 segments via sequential (chronological) aggregation on PyPSA-Eur-Sec 0.6.0,
      "which we have tested to be more accurate than a comparable 6-hourly time
      resolution". Cites Pineda & Morales (2018) and Kotzur (2018) — the method lineage
      the tsam segmentation implementation descends from. The 1500-vs-6h pairing is the
      useful data point: segmentation buys roughly a factor-2 resolution equivalence at
      equal snapshot count.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      110-node all-sector run at "4-hourly equivalent" resolution via tsam segmentation
      — note the phrasing, which is how segmentation is reported in this corpus (an
      equivalent uniform resolution, not a segment count). Explicitly states that weather
      variation between years is NOT considered for computational reasons, making the
      resolution/ensemble trade visible: the compute went into 110 nodes and all sectors
      rather than into weather years.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      2190 TSAM segments on a 100-node sector-coupled model, with the clearest one-line
      description of what segmentation does mechanically: "clusters by wind, solar and
      load series to sequential periods of varying durations" — fine around midday solar
      ramps, coarse through stable nights. Accuracy inherited by citation from Neumann
      2023 Joule rather than re-benchmarked, which is the corpus norm and worth flagging
      to a user who wants their own error bar.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      The only paper that states the extreme-preservation rationale as the REASON for
      choosing segmentation: the algorithm "refines the temporal resolution during
      extreme events such as low renewable availability or high demand while reducing it
      during periods with little variability". 4-hourly base (2190 snapshots) on PyPSA-DE.
      Also the only one that states in its appendix that the snapshot weights sum to
      8760 h/a — the invariant this card's `verifies` block encodes.
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      2190 representative time steps via tsam on a 99-region three-horizon sector-coupled
      run, described as preserving "renewable infeed variability, demand fluctuations, and
      seasonal storage needs". Useful as the H2/CO2-infrastructure precedent for 2190,
      and as an example of the ambiguity in corpus reporting: "representative time steps"
      here does not distinguish segmentation from typical periods, and the difference
      matters for whether seasonal storage is representable.
  - paper: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      The typical-days precedent, and the only corpus paper aggregating PER INVESTMENT
      PERIOD: 10 typical days per period via k-medoids in tsam, across 7 periods
      2020-2050, on a single-node-Europe sector-coupled model with six representative
      renewable regions. Stated as capturing "average statistics of weather and demand as
      well as more extreme events". The pattern pypsa-eur's dead
      apply_time_segmentation_perfect was written for.
  - paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    tier: 1
    role: routine-use
    note: >
      100 typical hours by k-means on demand and renewable availability via tsam, weighted
      by frequency of occurrence, on a 50-bus German network. Reports the convergence
      test this book recommends for representative periods: the objective was stable above
      50 typical hours, and 100 was the ceiling imposed by 100 GB RAM for the simultaneous
      co-optimisation. A rare case where the snapshot count is set by a stated memory
      budget rather than by convention.
  - paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    tier: 2
    role: routine-use
    note: >
      The extreme of compression in the corpus: 8760 hours -> three representative 24-hour
      periods (72 snapshots) by k-means, on a 6795-bus European network aggregated to
      k=250..3000. Defensible only because the question is a purely spatial
      aggregation-error question at fixed dispatch; it is the clearest illustration that
      acceptable resolution is a function of the QUESTION, not of the model.
  - paper: "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
    tier: 2
    role: routine-use
    note: >
      A hybrid worth knowing: full 8760-hour market and redispatch simulation, with
      k-medoids clustering used ONLY to build 16-24 representative hours for the
      flow-based market-coupling base case. Stratifies first (weekday/weekend x
      night/day x winter/summer = 8 groups), then 2-3 k-medoid clusters per group, chosen
      by dendrogram. The stratify-then-cluster recipe is the corpus's best answer to
      "k-means put all my representatives in the same season".
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: >
      Supplies the upper bound of the aggregation error: coarsening a 90-node
      sector-coupled PyPSA-Eur run from 3-hourly to a SINGLE annual time step (IAM style)
      reduces total system cost by more than 30%, because renewables get implicitly
      balanced at zero cost. The number to use when a user proposes annual or seasonal
      time slices, and the reason the baseline is 3-hourly "to capture wind-solar
      variability at daily, weekly, and seasonal scales".
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      States both the mechanism and its own limitation in one place: "temporal
      aggregation is done by averaging sequential timesteps (ie. all timesteps are
      weighted equally)" at 3h, and then in Limitations, "the 3-hour resolutions smooth
      demand peaks, potentially underrepresenting the value of capacity serving
      technologies". A PyPSA-USA multi-sector Morris/Monte-Carlo study, i.e. resolution
      spent on ~350-parameter sensitivity breadth — the same trade as vanGreevenbroek 2024.
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Two-tier design, the pattern to recommend for sweeps: main scenarios at full
      8760-hour hourly resolution, and the 64-combination x 4-scenario sensitivity block
      at 237 representative time-steps. Reports a DIRECTIONAL bias rather than a
      magnitude — "a lower temporal resolution tends to slightly overestimate the biofuel
      share among liquid fuels" — which is the minimum honest disclosure when a
      high-resolution benchmark exists for the headline runs only.
  - paper: "2018_Hofmann_Principal-flow-patterns_EPL.pdf"
    tier: 1
    role: routine-use
    note: >
      Full 8760x4 hourly snapshots 2011-2014 with no aggregation, up to 1024 nodes,
      because the method IS a covariance/PCA decomposition of the flow time series —
      aggregation would destroy the object being measured. The canonical case for
      full-hourly-baseline: when the deliverable is a variance structure, there is nothing
      to compress.
  - paper: "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Uses snapshot COUNT (100/200/300/400) as an explicit tractability dial for a
      heuristic transmission-expansion study while keeping annual sums referenced to
      8760 h. An early example of treating the number of snapshots as a first-class
      experimental parameter rather than a fixed assumption.
  - paper: "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Extreme snapshot-count scaling (1, 5, 25, 50, 75 snapshots) to isolate the effect
      of the cycle-flow formulation on solve time from the effect of the time dimension.
      Useful as precedent that tiny snapshot sets are legitimate for FORMULATION
      benchmarking and illegitimate for capacity results.
  - paper: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    tier: 1
    role: routine-use
    note: >
      2-hourly full year (4380 snapshots), weather year 2013 — the standard PyPSA-Eur
      spatial-clustering study configuration. Illustrates the usual division of budget:
      when the research question is spatial, resolution is held at a conventional coarse
      value and never varied, so spatial conclusions inherit an unquantified temporal bias.
  - paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      2-hourly, 4380 snapshots, for a transmission-loss linearisation study. Same pattern
      as Frysztacki 2022: 2h is the PyPSA-Eur electricity-only convention where 3h is the
      sector-coupled one, and neither is re-derived per study.
  - paper: "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      2-hourly averaging stated as a deliberate "size reduction factor 2" — the clearest
      framing of n-hourly as a linear problem-size dial (snapshots and therefore LP rows
      scale as 1/n), which is the arithmetic behind this card's cost_profile.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, 2920 snapshots per year, on a multi-decade transition-speed study. One of
      several papers establishing 3h as the sector-coupled European default; contributes
      the pathway context (many horizons is where the snapshot budget goes).
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: routine-use
    note: >
      The two-fidelity pattern made explicit: 4-hourly for the 500-draw low-fidelity MGA
      sweep, 2-hourly for the 15-draw high-fidelity validation, weather year 2013. The
      template to recommend whenever a method multiplies solves —
      `sensitivity-and-uncertainty-sweeps` and `mga-near-optimal-space` both pay for
      themselves in resolution.
  - paper: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, 2920 snapshots. Routine confirmation of the 3h sector-coupled convention
      in an offshore-focused study; contributes no method content beyond prevalence.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, weather year 2013. Same convention; the offshore/hydrogen pairing at 3h
      is a precedent for users asking whether 3h suffices for offshore hub studies.
  - paper: "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, 2920 snapshots, climate year 2013 — for a 24/7 hourly-matching study.
      Worth flagging as tension rather than error: a policy defined on HOURLY matching is
      evaluated on 3-hourly snapshots, so the matching constraint is enforced per
      3-hour block. See `additionality-and-24-7-matching`.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, 2920 snapshots. Routine; contributes prevalence and a precedent for
      baseload-technology studies at 3h.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, 2920 snapshots, for a hydrogen/CO2 network study. Routine; reinforces
      that carrier-network topology studies in this corpus are run at 3h uniform.
  - paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      3-hourly, 2920 snapshots, for endogenous transport-powertrain choice. Routine;
      notable only in that EV charging and V2G flexibility are represented at 3h, which
      is coarser than the timescale those assets actually operate on.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, weather year 2019, for a PRICE-FORMATION study — the combination this
      card and `shadow-prices-and-marginal-values` both warn about, since price
      distributions are the statistic most damaged by temporal averaging. Kept as routine
      use and cited as precedent, not as endorsement.
  - paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    tier: 1
    role: routine-use
    note: >
      3-hourly, weather year 2019, for seasonal pit thermal storage. Illustrates the
      Schyska rule from the safe side: the storage under study has a horizon of months,
      far above 3 h, so uniform averaging does not erase it — the opposite of the
      6-hourly battery case.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      2-hourly full year (4380 snapshots) with no further aggregation, and TSAM described
      in the SI as available but deliberately not applied — for a behavioural-flexibility
      study where the value being measured is short-timescale load shifting. The correct
      instinct: do not segment away the phenomenon you are measuring. Flagged as a
      mention-only suspect in EVIDENCE_INDEX.md and retained for exactly this reason.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Full 8760 hourly snapshots, weather year 2019, GB. The full-hourly-baseline case
      for demand-side flexibility: EV and heat flexibility is a sub-daily phenomenon, and
      an hourly floor is already a compromise for it.
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: >
      5 hours per snapshot over a full year — an unusual, non-divisor-of-24 uniform
      resolution. Worth knowing because 5h aliases against the diurnal cycle differently
      from 3h/4h/6h; nothing in either model warns about this and no paper in the corpus
      examines it.
pitfalls:
  - pitfall: >
      Aggregation destroys the extremes that size firm capacity and storage. Averaging is
      a low-pass filter, so any storage whose energy-to-power ratio is SHORTER than the
      averaging window simply stops being worth building — Schyska shows a 6 h battery
      disappearing from the optimal mix once tau exceeds 6 h, while 168 h hydrogen
      storage survives. Peak-serving capacity is understated by the same mechanism.
    evidence: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    note: >
      The rule: resolution must be FINER than the characteristic storage horizon of the
      storage you expect to deploy. If the deliverable is a battery capacity, a peaker
      capacity, a reserve requirement or a Dunkelflaute duration, do not aggregate beyond
      hourly-to-3-hourly — and if you must, use segmentation, not averaging. See
      `storage-sizing-and-duration` and `extreme-event-and-dunkelflaute-analysis`; the
      storage-distortion critique in that literature is precisely about this filter.
  - pitfall: >
      Segmentation preserves extremes far better than averaging but produces
      UNEQUAL-WEIGHT snapshots, which breaks every naive statistic computed off the
      solved network. `n.buses_t.marginal_price.mean()`, a duration curve, a standard
      deviation, a percentile or a `.sum()` over a time-varying series are all wrong by a
      factor that varies per snapshot, and none of them raises an error.
    evidence: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    note: >
      Weighted means and weighted sums only, using `n.snapshot_weightings` — the
      `generators` column for energy, `objective` for cost, `stores` for storage energy.
      Never report percentiles or duration curves off segmented snapshots. Both models'
      make_summary already weight correctly; a bespoke extraction script is where this
      goes wrong. `shadow-prices-and-marginal-values` owns the price-specific version of
      this trap.
  - pitfall: >
      pypsa-earth's shipped default is extremely coarse and users will not notice.
      `scenario.opts: [Co2L-3h]` averages to 3-hourly in the electricity chain, and then
      `scenario.sopts: ['144h']` re-averages the ALREADY-AVERAGED network in the sector
      chain — 8760 -> 2920 -> 61 snapshots per year, in 6-day blocks. Nothing warns. The
      weightings sum to 8760 h so annual totals look right, and a run that has erased all
      sub-weekly dynamics reports a plausible cost.
    evidence: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    note: >
      Always read BOTH `opts` and `sopts` before quoting any pypsa-earth sector result,
      and set `sopts` explicitly. Fernandes's >30% cost reduction at a single annual time
      step is the direction and rough magnitude of the error a 61-snapshot year is
      inheriting. 144h is a smoke-test value, not a study value; nothing coarser than
      ~24h belongs in a delivered answer.
  - pitfall: >
      The reported error is a SYSTEM-COST error, and system cost is the quantity least
      sensitive to resolution. Kalweit's 3H run is within 3.7% on cost while showing
      "notable differences" in the carbon-management capacities that were the study's
      actual subject; Millinger reports a directional bias in biofuel share with no cost
      number at all.
    evidence: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    note: >
      Benchmark the resolution against the QUANTITY THE STUDY REPORTS, not against total
      cost. Use the resolution-sensitivity-sweep variant with the study's own metric as
      the convergence criterion, and quote both numbers.
  - pitfall: >
      Representative periods / typical days break chronology, so storage cannot carry
      energy between periods. A seasonal storage answer computed on typical days is
      meaningless unless inter-period state of charge was explicitly reconstructed —
      which neither pypsa-eur nor pypsa-earth implements.
    evidence: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    note: >
      Segmentation, not typical periods, whenever seasonal storage or a hydrogen/heat
      store is in scope: it preserves the chronological order that the storage energy
      balance needs. Reserve typical periods for questions that are per-hour network
      properties. Zeyen's per-investment-period typical days work because the study's
      subject is learning-by-doing across decades, not intra-annual balancing.
  - pitfall: >
      Sub-hourly is not available in either model — the hourly floor comes from the ERA5
      cutouts and demand profiles, and `get_snapshots` is called with `freq="h"` by every
      data-building rule. Balancing, frequency response and 15-minute market value are
      invisible, and the aggregation levers only coarsen.
    evidence: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    note: >
      State this as a limit before promising a study. If the question is about
      sub-hourly balancing, either scope it to a proxy (operational reserve margins as a
      constraint, see `balancing-and-ancillary-services`) or decline. The registry records
      `sub-hourly-resolution` as `absent` for BOTH models; there is no L1 route.
  - pitfall: >
      Averaging and thinning have DIFFERENT biases, not different magnitudes of the same
      bias. `3h` averages three hours into one (peak amplitude reduced, every hour
      contributes); `3sn` keeps one hour verbatim and discards two (peak amplitude
      preserved if it lands on a kept hour, destroyed if it does not, and aliased to the
      diurnal cycle when n divides 24). They look interchangeable in a config file and
      are not.
    evidence: "2026_Barnes_near-term-emission-targets.pdf"
    note: >
      Prefer `nh` over `nsn` unless there is a specific reason; no corpus paper uses
      thinning. If a bundle contains an `nsn` token, treat it as a finding to raise with
      the user rather than a resolution choice.
  - pitfall: >
      Snapshot resolution is silently traded against every other dimension of the study,
      and the trade is almost never reported as a trade. Neumann 2025 drops weather-year
      variation entirely to afford 110 nodes and all sectors; vanGreevenbroek 2024 drops
      to 750 segments to afford 216 scenarios x 6 horizons; Barnes drops to 3h to afford
      350 uncertain parameters. Each is defensible and each shifts the error into a
      different place.
    evidence: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    note: >
      Make the trade explicit in the bundle: state snapshots x nodes x scenarios x
      horizons as one budget, and let the user choose which dimension pays. The corpus's
      standard resolution of this is the two-fidelity design (Millinger, Neumann 2023
      iScience): headline runs high-resolution, sweep runs coarse, with one overlapping
      validation point.
