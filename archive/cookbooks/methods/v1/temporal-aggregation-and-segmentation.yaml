pypsa_primitive:
  symbol: "pypsa/components.py:snapshot_weightings"
  pypsa_version: "0.30.3"
  exposed_by: "both — pypsa-eur and pypsa-earth write n.snapshot_weightings in their aggregation functions"
  reachable_via: >
    `n.set_snapshots(new_index)` then `n.snapshot_weightings = df`, where df has the
    three columns pypsa consumes: `objective` (multiplies operational cost in the
    objective, pypsa/optimization/optimize.py), `generators` (multiplies energy in
    global constraints such as the CO2 cap, pypsa/optimization/global_constraints.py)
    and `stores` (the elapsed-hours term `eh` in the storage/store energy balance and
    the exponent of the standing-loss factor, pypsa/optimization/constraints.py).
    `set_snapshots` also accepts `weightings_from_timedelta=True`, which derives the
    weights from a DatetimeIndex's own spacing — neither model uses it, but it is the
    least error-prone way to write a custom uniform aggregation.
  note: >
    This is why temporal aggregation is L0/L1 rather than L5: the WEIGHTING SEMANTICS are
    library code, applied consistently across the objective, the global constraints and
    the storage energy balance. What the models supply on top is only the resampling /
    segmentation of the time-varying data and the choice of new index. It also localises
    the risk: any bespoke aggregation that sets snapshots without setting all three
    weighting columns produces a network that solves and is wrong, and pypsa will not
    complain — `set_snapshots` fills missing weightings with 1.0 by default. Soft anchor:
    pypsa is a conda dependency, not a submodule, so this is pinned to a version string.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: temporal-resolution-nh
        role: >
          the primary lever — `clustering.temporal.resolution_elec` / `resolution_sector`,
          registry status `working`, consumed by prepare_network:average_every_nhours and
          the sector chain's set_temporal_aggregation
      - id: time-segmentation-tsam
        role: >
          the better lever, also `working`: the same two config keys accept an `NNNseg`
          string, and eur is the only one of the two models with a DEDICATED rule
          (`time_aggregation`) that computes the weightings as a standalone artefact
      - id: sub-hourly-resolution
        role: >
          registry status `absent` — this is the downward bound of the method. The hourly
          floor comes from `get_snapshots(freq="h")` and the ERA5 cutout, and the levers
          here only coarsen
      - id: weather-year-selection
        role: >
          the window half of step 1, `working`: snapshots.start/end select any ERA5 year
          1940-2024, and eur's get_snapshots accepts LISTS of start/end for
          non-contiguous windows, which time_aggregation handles per-year
      - id: multi-weather-year
        role: >
          `partial` — resolution is the currency multi-year runs are bought with
          (Schlachtberger's 3y x 3h), and time_aggregation resamples years separately so
          the multi-year path is at least aggregation-aware
      - id: perfect-foresight
        role: >
          `working` as a foresight mode, but its segmentation hook is NOT reachable:
          rules/solve_perfect.smk reads `clustering.temporal.sector`, a key absent from
          config.default.yaml and from schema.default.json
      - id: summary-outputs
        role: >
          where the weightings must be honoured downstream — make_summary already uses
          `snapshot_weightings.generators` for weighted prices and curtailment duration,
          so the shipped tables are safe and bespoke extraction is where risk lives
      - id: solver-choice
        role: >
          segmentation solves an auxiliary LP inside tsam using
          `solving.solver.name`, so a solver the tsam call cannot use fails at
          aggregation time, before the main solve
    available:
      verdict: turnkey
      how: >
        Fully wired, on both chains, for all three serious variants. The electricity
        chain reads `clustering.temporal.resolution_elec` as a params value in rule
        prepare_network and dispatches on the string suffix: `...h` -> resampling via
        average_every_nhours, `...seg` -> tsam via apply_time_segmentation. The sector
        chain is more developed: a DEDICATED rule `time_aggregation` computes the new
        snapshot weightings from `clustering.temporal.resolution_sector` and writes them
        to a CSV resource, and prepare_sector_network:set_temporal_aggregation then
        applies that CSV by grouping every time-varying frame onto it — with correct
        special-casing (min for stores' e_max_pu, max for e_min_pu, mean otherwise). The
        `{opts}` / `{sector_opts}` wildcard tokens still route here at this ref:
        _helpers.py:update_config_from_wildcards matches `^\d+(h|seg)$` into
        resolution_elec and `^\d+(h|sn|seg)$` into resolution_sector, so `3h`, `4380seg`
        and `3sn` remain valid run-naming tokens rather than legacy syntax.
      missing: >
        Procedure steps 2, 6 and 9 have no handle. Step 6 (representative periods /
        typical days) is the substantive gap: tsam is a dependency and supports
        `noTypicalPeriods > 1` and `clusterMethod='k_medoids'`, but both call sites
        hardcode `noTypicalPeriods=1, hoursPerPeriod=len(df), segmentation=True` — i.e.
        segmentation only, never typical periods, and no inter-period storage
        reconstruction exists either way. tsam's own extreme-value machinery
        (`extremePeriodMethod`, `addPeakMax`, `addPeakMin`) is likewise never passed, so
        peak preservation is whatever the segmentation optimum happens to give. Step 9
        (validation against a finer benchmark) is a run-harness question with no rule.
        Step 2 is a modelling decision.
      provenance: "scripts/prepare_network.py:average_every_nhours; scripts/prepare_network.py:apply_time_segmentation; scripts/time_aggregation.py:noSegments; scripts/prepare_sector_network.py:set_temporal_aggregation; scripts/_helpers.py:update_config_from_wildcards"
    levers:
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Electricity chain resolution. `false` = no aggregation (hourly). A string ending
          `h` (e.g. `'3h'`, `'24h'`) resamples to n-hour means with weightings summed. A
          string ending `seg` (e.g. `'4380seg'`) runs tsam segmentation to that many
          variable-length segments. Also settable via an `{opts}` token matching
          `^\d+(h|seg)$`. time_aggregation.py REJECTS any value other than
          false/1/'1h'/'1H' when the sector chain is in use.
        default: "false (i.e. full hourly, 8760 snapshots — pypsa-eur ships no aggregation)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours; scripts/_helpers.py:resolution_elec"
      - key: "clustering.temporal.resolution_sector"
        effect: >
          Sector chain resolution, and the one that matters for any sector-coupled study.
          Same `NNh` / `NNNseg` grammar plus a third form `NNsn` = keep every n-th
          snapshot and multiply its weighting by n (thinning, not averaging). Consumed by
          the `time_aggregation` rule, which writes a snapshot-weightings CSV that
          prepare_sector_network then applies. Also settable via a `{sector_opts}` token
          matching `^\d+(h|sn|seg)$`.
        default: "false (full hourly); the shipped test configs use '24h', and config.perfect.yaml uses '8760h'"
        provenance: "config/config.default.yaml:resolution_sector; scripts/time_aggregation.py:resolution_sector; scripts/prepare_sector_network.py:set_temporal_aggregation"
      - key: "snapshots.start"
        effect: >
          Start of the snapshot window — the other half of step 1. Accepts a LIST of
          starts (paired with a list of ends) for non-contiguous windows, which
          time_aggregation.py resamples year-by-year and then drops zero-weight rows
          from, so multi-window studies aggregate correctly rather than silently filling
          the gaps.
        default: "'2013-01-01'"
        provenance: "config/config.default.yaml:snapshots; scripts/_helpers.py:get_snapshots"
      - key: "snapshots.end"
        effect: >
          End of the window, exclusive when `inclusive: left`. Extending beyond one year
          is how multi-weather-year runs are requested; the snapshot count and therefore
          the solve cost scale directly with it, which is what makes the
          resolution-for-years trade concrete.
        default: "'2014-01-01'"
        provenance: "config/config.default.yaml:snapshots; scripts/_helpers.py:get_snapshots"
      - key: "enable.drop_leap_day"
        effect: >
          Drops 29 February so every year has 8760 hours. Where it actually bites for this
          method is `get_snapshots` at build time — every profile-building rule filters
          the leap day there, so the network prepare_network receives is already
          8760/year. time_aggregation honours it properly, FOLDING the leap day's weight
          onto 1 March so the weight sum stays 8760. CAVEAT, grepped at this ref:
          average_every_nhours accepts the flag, computes a filtered index into a local
          `sns`, and then calls set_snapshots on the UNFILTERED
          `snapshot_weightings.index` — the parameter is a no-op in that function. Benign
          today only because get_snapshots already dropped the day; it would bite anyone
          feeding a leap-year network in by another route. Off-by-24 annual sums across
          models usually trace to this key.
        default: "true"
        provenance: "config/config.default.yaml:drop_leap_day; scripts/prepare_network.py:drop_leap_day; scripts/time_aggregation.py:drop_leap_day"
      - key: "solving.solver.name"
        effect: >
          The solver tsam uses for the segmentation sub-problem, read directly from the
          config inside prepare_network and passed as `solver_name` by the
          time_aggregation rule. Segmentation fails at aggregation time, not solve time,
          if this solver is unavailable — a confusing failure mode worth pre-empting.
        default: "'gurobi'"
        provenance: "config/config.default.yaml:solver; scripts/prepare_network.py:solver_name; scripts/time_aggregation.py:solver_name"
      - key: "scenario.opts"
        effect: >
          Where an `NNh` / `NNNseg` token is placed to make resolution part of the run
          name and expand it combinatorially — the surface the resolution-sensitivity-sweep
          variant uses, since each token becomes a separate managed run and output path.
        default: "['']"
        provenance: "config/config.default.yaml:scenario; scripts/_helpers.py:update_config_from_wildcards"
      - key: "scenario.sector_opts"
        effect: >
          The sector-chain equivalent, accepting `NNh` / `NNsn` / `NNNseg`. This is the
          token the corpus's PyPSA-Eur sector studies vary (`Co2L0-24h-T-H-B-I-A-dist1`
          in the shipped mock).
        default: "['']"
        provenance: "config/config.default.yaml:scenario; scripts/_helpers.py:update_config_from_wildcards"
    assembly:
      - step: >
          Set the window before the resolution: `snapshots.start/end/inclusive`, and
          `enable.drop_leap_day` to match whatever the comparison baseline uses. Every
          profile-building rule reads this and builds at hourly frequency, so this step
          also fixes the floor.
        uses: [weather-year-selection, sub-hourly-resolution]
        config: "snapshots.start; snapshots.end; snapshots.inclusive; enable.drop_leap_day"
        code: null
        provenance: "scripts/_helpers.py:get_snapshots"
      - step: >
          Choose the chain. Electricity-only: set `clustering.temporal.resolution_elec`
          and leave resolution_sector false. Sector-coupled: set
          `clustering.temporal.resolution_sector` and leave resolution_elec FALSE —
          time_aggregation.py raises a ValueError if resolution_elec is anything other
          than false/1/'1h'/'1H' in the sector chain, which is the one hard guard rail
          this method has.
        uses: [temporal-resolution-nh]
        config: "clustering.temporal.resolution_elec OR clustering.temporal.resolution_sector"
        code: null
        provenance: "scripts/time_aggregation.py:resolution_sector; scripts/prepare_network.py:average_every_nhours"
      - step: >
          Choose the grammar for the value: `'3h'` for uniform averaging, `'2190seg'` for
          segmentation, `'3sn'` for thinning (sector chain only). Segmentation
          additionally needs a solver that tsam can drive — check
          `solving.solver.name`.
        uses: [time-segmentation-tsam, solver-choice]
        config: "clustering.temporal.resolution_sector; solving.solver.name"
        code: null
        provenance: "scripts/prepare_network.py:apply_time_segmentation; scripts/time_aggregation.py:noSegments"
      - step: >
          For a resolution-sensitivity sweep, do NOT edit the config per run: put the
          tokens in `scenario.opts` / `scenario.sector_opts` so
          update_config_from_wildcards writes resolution_elec/resolution_sector per run
          and each resolution lands in its own output path. This is the only route that
          keeps the runs comparable and separately cached.
        uses: [temporal-resolution-nh, time-segmentation-tsam, scenario-matrix]
        config: "scenario.opts; scenario.sector_opts"
        code: null
        provenance: "scripts/_helpers.py:update_config_from_wildcards; rules/common.smk:scenario_config"
      - step: >
          Verify the weightings before reading any result: `n.snapshot_weightings` must
          have all three columns populated and `objective.sum()` must equal the window's
          hour count (8760 per non-leap year). Then weight every statistic. make_summary
          already does this for prices and curtailment; bespoke extraction must.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_weighted_prices; scripts/make_summary.py:snapshot_weightings"
      - step: >
          For typical periods / typical days (procedure step 6) there is NO route through
          config. tsam supports it; both call sites hardcode segmentation. Fork
          apply_time_segmentation (or time_aggregation.py) to pass
          `noTypicalPeriods=k, hoursPerPeriod=24, segmentation=False`, and then decide
          what to do about inter-period storage — which nothing in the repo does.
        uses: [time-segmentation-tsam]
        config: null
        code: "scripts/time_aggregation.py (fork the tsam.TimeSeriesAggregation call); scripts/prepare_sector_network.py:set_temporal_aggregation"
        provenance: "scripts/time_aggregation.py:noTypicalPeriods; scripts/prepare_network.py:noTypicalPeriods"
    boundary:
      - variant: n-hourly-averaging
        rung: L0
        note: >
          One config key. `clustering.temporal.resolution_elec: '3h'` for the electricity
          chain, `resolution_sector: '3h'` for the sector chain. The single most
          load-bearing L0 flip in the whole book.
      - variant: tsam-segmentation
        rung: L1
        note: >
          Same key, non-default value form: `'2190seg'`. L1 rather than L0 only because
          it needs the `seg` suffix and a working `solving.solver.name` for tsam's
          sub-problem. The sector chain gives it a dedicated rule (`time_aggregation`)
          that emits the weightings as an inspectable CSV resource — worth using as the
          verification artefact.
      - variant: every-nth-snapshot
        rung: L1
        note: >
          `resolution_sector: '3sn'`. Sector chain ONLY —
          update_config_from_wildcards's electricity regex is `^\d+(h|seg)$` with no
          `sn`, and prepare_network has no thinning branch. Available but not
          recommended; see pitfalls.
      - variant: full-hourly-baseline
        rung: L0
        note: >
          The shipped default: `resolution_elec: false`, `resolution_sector: false`,
          `scenario.opts: ['']`. Nothing to do — which is exactly why an eur run's
          resolution must be stated explicitly in the bundle rather than assumed.
      - variant: representative-periods
        rung: L5
        note: >
          No config path. tsam is already a dependency and supports
          `noTypicalPeriods`/`clusterMethod='k_medoids'`, but both call sites hardcode
          `noTypicalPeriods=1, segmentation=True`. Forking the call is ~5 lines; the L5
          work is what follows — a non-chronological snapshot index that
          set_temporal_aggregation's `get_indexer(...).ffill()` mapping does not expect,
          and inter-period storage state of charge, which nothing implements. Do not
          quote this as a small change.
      - variant: resolution-sensitivity-sweep
        rung: L1
        note: >
          Pure config: list several resolution tokens in
          `scenario.opts` / `scenario.sector_opts` and let the run matrix expand. Cost is
          the only obstacle, and it is the cheapest sweep in the book because a coarse
          run is cheap by construction.
    where:
      - change: "typical-period / typical-day aggregation (fork the tsam call)"
        anchor: "scripts/time_aggregation.py -> the tsam.TimeSeriesAggregation(...) call (noTypicalPeriods/hoursPerPeriod/segmentation); mirrored in scripts/prepare_network.py:apply_time_segmentation"
        provenance: "scripts/time_aggregation.py:noTypicalPeriods; scripts/prepare_network.py:apply_time_segmentation"
      - change: "extreme-period preservation inside the aggregation"
        anchor: "the same tsam call — pass extremePeriodMethod / addPeakMax / addPeakMin, which neither call site sets"
        provenance: "scripts/time_aggregation.py:TimeSeriesAggregation; scripts/prepare_network.py:TimeSeriesAggregation"
      - change: "applying a non-chronological snapshot index to the sector network"
        anchor: "scripts/prepare_sector_network.py::set_temporal_aggregation -> the aggregation_map built from get_indexer(...).ffill()"
        provenance: "scripts/prepare_sector_network.py:aggregation_map"
      - change: "per-investment-period segmentation under perfect foresight (currently unreachable)"
        anchor: "rules/solve_perfect.smk::rule prepare_perfect_foresight -> params.time_resolution, which reads the nonexistent clustering.temporal.sector; scripts/prepare_perfect_foresight.py::apply_time_segmentation_perfect"
        provenance: "rules/solve_perfect.smk:prepare_perfect_foresight; scripts/prepare_perfect_foresight.py:apply_time_segmentation_perfect"
    cost_profile:
      solves: >
        1 per resolution. The resolution-sensitivity-sweep variant costs one solve per
        token: the corpus's benchmarks used 2 (Schlachtberger's 1h/3h x 1y/3y = 4),
        3 (Neumann 2023's 1h/3h/6h) and 7-8 (Kalweit's eight resolutions).
      relative: >
        LP size scales roughly linearly in snapshot count, and solve time super-linearly:
        8760 -> 2920 (3h) is a 3x reduction in rows, and reported wall-clock gains are
        larger. Segmentation at equal snapshot count costs the same solve as uniform
        averaging plus one tsam sub-problem at aggregation time (minutes, once per
        network, cached as a resource in the sector chain). The corpus's practical
        equivalences: 750 seg ~ 11.6h, 1500 seg ~ 6h, 2190 seg ~ 4h, 4380 seg ~ 2h — i.e.
        segmentation buys about a factor 2 of accuracy-equivalent resolution for free.
      note: >
        This is the cheapest tractability lever in the book and the one every other
        expensive method spends: MGA, weather-year ensembles, myopic pathways and
        parameter sweeps all pay for their solve count here. The corpus's discipline is
        the two-fidelity design — coarse for the sweep, fine for a validation point, one
        overlapping run to bound the error. Aggregation itself is nearly free; the tsam
        segmentation LP on a full sector-coupled 100-node network is the only non-trivial
        cost and it is cached.
    verifies:
      - variant: n-hourly-averaging
        check: "abs(n.snapshot_weightings.objective.sum() - 8760 * Nyears) < 1e-6"
        over: run
        note: >
          The weightings must still account for every hour of the window. A sum of
          len(n.snapshots) instead means the weightings were never set and every annual
          sum, every cost and the CO2 cap are all wrong by the aggregation factor — the
          single worst silent failure of this method.
      - variant: n-hourly-averaging
        check: "set(n.snapshot_weightings.columns) == {'objective', 'generators', 'stores'} and (n.snapshot_weightings > 0).all().all()"
        over: run
        note: >
          All three columns must be populated and positive. `objective` drives cost,
          `generators` drives energy sums and the CO2 cap, `stores` is the elapsed-hours
          term in the storage energy balance. A bespoke aggregation that sets only one
          leaves the other two at 1.0 and the model solves anyway.
      - variant: tsam-segmentation
        check: "n.snapshot_weightings.objective.nunique() > 1"
        over: run
        note: >
          Segmentation must produce UNEQUAL weights. All-equal weights mean the segment
          durations were not transferred from tsam's 'Segment Duration' index level, so
          the run is a uniform aggregation wearing a segmentation label — and any
          statistic computed off it is silently wrong in the other direction.
      - variant: tsam-segmentation
        check: "len(n.snapshots) == int(str(resolution)[:-3])"
        over: run
        note: >
          The snapshot count must equal the requested segment count. Fewer means tsam's
          sub-problem was truncated or the solver failed partway, which is a warning in
          the log and not an error in the workflow.
      - variant: resolution-sensitivity-sweep
        check: "abs(ns[0].objective - ns[-1].objective) / abs(ns[-1].objective) < 0.05"
        over: ensemble
        note: >
          A cost spread above ~5% between the coarsest and the finest resolution in the
          sweep means the coarse run is not a usable approximation of the fine one. The
          corpus's own acceptance thresholds sit at 0.35%-3.7%; 5% is a generous outer
          bound and >30% is what a single annual time step produces.
      - variant: full-hourly-baseline
        check: "len(n.snapshots) == 8760 * Nyears and (n.snapshot_weightings.objective == 1).all()"
        over: run
        note: >
          A claimed hourly run with fewer snapshots or non-unit weights has been
          aggregated by an `{opts}` token or a scenario override the config file did not
          show. Worth checking whenever a result is presented as hourly.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: temporal-resolution-nh
        role: >
          the only lever, `working`: an `NNh` token in `scenario.opts` for the
          electricity chain and in `scenario.sopts` for the sector chain, both consumed
          by an `average_every_nhours` — there is no `clustering.temporal` config section
          in earth at all
      - id: time-segmentation-tsam
        role: >
          `working` but ELECTRICITY-CHAIN ONLY: `scenario.opts` accepts `NNNseg` and
          prepare_network.py has the tsam branch; prepare_sector_network.py has no `seg`
          regex, so a sector-coupled earth study cannot segment
      - id: sub-hourly-resolution
        role: "`absent`, same hourly floor as eur — the downward bound of the method"
      - id: weather-year-selection
        role: >
          `working` via snapshots.start/end plus `load_options.weather_year`, which must
          be kept consistent with the cutout year — an extra coupling eur does not have
      - id: multi-weather-year
        role: >
          `absent` here (vs `partial` in eur): one weather year per network, so the
          resolution-for-weather-years trade Schlachtberger describes is not purchasable
          in earth without separate runs
      - id: scenario-matrix
        role: >
          the sweep surface: `scenario.opts` and `scenario.sopts` are lists that expand
          combinatorially, so a resolution sweep is a list literal
      - id: summary-outputs
        role: >
          make_summary multiplies every dispatch series by `snapshot_weightings.generators`
          (and stores by `.stores`), so the shipped summaries are weighting-correct
      - id: solver-choice
        role: >
          the solver tsam drives for the segmentation sub-problem, read from
          `solving.solver.name` inside prepare_network
    available:
      verdict: turnkey
      how: >
        Turnkey but thinner than eur, and configured entirely through wildcards rather
        than a config section. There is no `clustering` key in config.default.yaml at all
        (earth's spatial equivalent is `cluster_options`, which has no temporal member),
        so no dotted config path exists for resolution — only the wildcard tokens.
        prepare_network.py splits the `{opts}` wildcard and regex-matches `^\d+h$` ->
        average_every_nhours and `^\d+seg$` -> apply_time_segmentation (both structurally
        the same functions as eur's, minus the leap-day handling). The sector chain reads
        the separate `{sopts}` wildcard in prepare_sector_network.py and matches `^\d+h$`
        only, calling its own local copy of average_every_nhours. Both weight correctly
        (`snapshot_weightings.resample(offset).sum()`), and the Snakefile's `memory(w)`
        scales the solve rule's memory request from the `NNh`/`NNNseg` token — the same
        heuristic eur keeps in rules/common.smk. A reminder that the token is read in two
        independent places, so a resolution set in config rather than in the token leaves
        the memory estimate stale.
      missing: >
        Three gaps beyond eur's. (1) No segmentation in the sector chain:
        prepare_sector_network.py has no `seg` branch, so `NNNseg` in `sopts` is silently
        ignored and the network runs at whatever the electricity chain left. (2) No
        thinning equivalent of eur's `nsn`. (3) No `enable.drop_leap_day`: the only
        occurrence in the repo is a commented-out line in the Snakefile, so a leap-year
        window yields 8784 hours and every per-8760 normalisation is off by 24. As in
        eur, procedure step 6 (typical periods) is L5 and step 9 (validation) has no
        harness. Additionally there is no dedicated aggregation rule, so the weightings
        are never materialised as an inspectable artefact — the only way to check them is
        to open the .nc.
      provenance: "scripts/prepare_network.py:average_every_nhours; scripts/prepare_network.py:apply_time_segmentation; scripts/prepare_sector_network.py:average_every_nhours; Snakefile:memory"
    levers:
      - key: "scenario.opts"
        effect: >
          The electricity-chain resolution surface. An `NNh` token (`3h`, `24h`) resamples
          to n-hour means; an `NNNseg` token (`4380seg`) runs tsam segmentation. Matched
          case-insensitively, first match wins, and averaging is applied BEFORE
          segmentation is checked — so `3h-4380seg` in one opts string segments the
          already-averaged network, which is never what anyone means.
        default: "['Co2L-3h'] — earth ships 3-hourly averaging on by default, unlike eur"
        provenance: "config.default.yaml:opts; scripts/prepare_network.py:average_every_nhours; scripts/prepare_network.py:apply_time_segmentation"
      - key: "scenario.sopts"
        effect: >
          The sector-chain resolution surface, applied in prepare_sector_network on top of
          the already-aggregated electricity network. `NNh` ONLY — no `seg`, no `sn`. The
          shipped default of `144h` re-averages the 3-hourly network into 6-DAY blocks,
          giving 61 snapshots per year.
        default: "['144h']"
        provenance: "config.default.yaml:sopts; scripts/prepare_sector_network.py:average_every_nhours"
      - key: "snapshots.start"
        effect: >
          Start of the window. Single window only — no list form, unlike eur's
          get_snapshots — so non-contiguous windows are not expressible.
        default: "'2013-01-01'"
        provenance: "config.default.yaml:snapshots; scripts/prepare_network.py:snapshot_weightings"
      - key: "snapshots.end"
        effect: >
          End of the window, exclusive under `inclusive: 'left'`. With
          `multi-weather-year` absent from earth's registry, extending this past one year
          is not a supported path.
        default: "'2014-01-01'"
        provenance: "config.default.yaml:snapshots; scripts/prepare_network.py:snapshot_weightings"
      - key: "solving.solver.name"
        effect: >
          The solver tsam drives for the segmentation sub-problem, read from the config
          inside prepare_network's `seg` branch. Earth's open-source-capable HiGHS/CBC
          setup matters here: segmentation fails at aggregation time if the named solver
          is not installed.
        default: "'gurobi'"
        provenance: "config.default.yaml:solver; scripts/prepare_network.py:solver_name"
    assembly:
      - step: >
          Set the window (`snapshots.start/end`) and keep `load_options.weather_year`
          consistent with the cutout — an earth-specific coupling. Note there is no
          drop_leap_day, so avoid leap-year windows if any downstream number is
          normalised per 8760 h.
        uses: [weather-year-selection, sub-hourly-resolution]
        config: "snapshots.start; snapshots.end; snapshots.inclusive"
        code: null
        provenance: "scripts/build_demand_profiles.py:weather_year"
      - step: >
          Set the electricity-chain resolution as an `{opts}` token. Put exactly ONE
          resolution token per opts string: `Co2L-3h` for averaging or `Co2L-4380seg` for
          segmentation, never both.
        uses: [temporal-resolution-nh, time-segmentation-tsam, solver-choice]
        config: "scenario.opts; solving.solver.name"
        code: null
        provenance: "scripts/prepare_network.py:average_every_nhours; scripts/prepare_network.py:apply_time_segmentation"
      - step: >
          For a sector-coupled study, set `scenario.sopts` EXPLICITLY. Leaving the shipped
          `144h` compounds with the `3h` in opts and gives 61 snapshots per year. If the
          electricity chain is already at the intended resolution, set sopts to the same
          value the elec chain produced or accept the compounding knowingly — earth has no
          equivalent of eur's guard rail that refuses to double-aggregate.
        uses: [temporal-resolution-nh]
        config: "scenario.sopts"
        code: null
        provenance: "scripts/prepare_sector_network.py:average_every_nhours"
      - step: >
          For a resolution sweep, list several tokens in `scenario.opts` (and/or
          `scenario.sopts`) — they expand into the cartesian run matrix and each lands in
          its own output path. The Snakefile's `memory(w)` will scale the per-run memory
          request from the token automatically, which makes coarse sweep runs cheap in the
          scheduler as well as in the solver.
        uses: [scenario-matrix, temporal-resolution-nh]
        config: "scenario.opts; scenario.sopts"
        code: null
        provenance: "Snakefile:memory; Snakefile:scenario"
      - step: >
          To segment a SECTOR-COUPLED earth run, add the `seg` branch to
          prepare_sector_network's sopts loop, mirroring prepare_network's. The function
          it needs (apply_time_segmentation) already exists in prepare_network.py and can
          be imported or copied; this is the highest-value small patch in this card.
        uses: [time-segmentation-tsam]
        config: null
        code: "scripts/prepare_sector_network.py (add a ^\\d+seg$ branch to the sopts loop, calling prepare_network.apply_time_segmentation)"
        provenance: "scripts/prepare_sector_network.py:sopts; scripts/prepare_network.py:apply_time_segmentation"
      - step: >
          Verify the weightings by opening the network: `objective.sum()` must equal the
          window's hour count, and all three columns must be positive. Earth has no
          snapshot-weightings CSV resource to inspect, so this is the only check
          available, and it is worth doing on every earth sector run given the
          compounding default.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:snapshot_weightings"
    boundary:
      - variant: n-hourly-averaging
        rung: L0
        note: >
          Already ON by default in both chains (`opts: [Co2L-3h]`, `sopts: ['144h']`).
          Changing it is one list literal. The default being coarse-and-compounded is the
          risk, not the availability.
      - variant: tsam-segmentation
        rung: L1
        note: >
          `opts: [Co2L-4380seg]` for the electricity chain — one non-default token plus a
          tsam-drivable solver.
      - variant: tsam-segmentation
        rung: L2
        note: >
          For the SECTOR chain: a `^\d+seg$` branch must be added to
          prepare_sector_network's sopts loop. Small, localised, and the function it
          calls already exists in prepare_network.py — a genuine L2, and the clearest
          concrete eur/earth capability gap in this card.
      - variant: full-hourly-baseline
        rung: L1
        note: >
          NOT the default here, unlike eur: `opts` must be set to a value with no
          resolution token (e.g. `['Co2L']`) and `sopts` to something that resolves to
          hourly. Because the sopts loop only breaks on a `^\d+h$` match, a sopts string
          with no `h` token leaves the network at the electricity chain's resolution.
      - variant: every-nth-snapshot
        rung: L5
        note: >
          No surface in either chain: no `sn` regex, no thinning branch, and no config
          key. It would be ~5 lines mirroring eur's set_temporal_aggregation, but the
          variant is not recommended (see pitfalls), so the honest answer is that it does
          not exist here and should not be added.
      - variant: representative-periods
        rung: L5
        note: >
          As eur: tsam supports it, both earth call sites hardcode
          `noTypicalPeriods=1, segmentation=True`, and nothing handles inter-period
          storage. Slightly worse than eur because earth has no dedicated aggregation
          rule to hang a non-chronological index off — the whole thing happens inside
          prepare_network / prepare_sector_network.
      - variant: resolution-sensitivity-sweep
        rung: L1
        note: >
          `opts: [Co2L-1h, Co2L-3h, Co2L-6h, Co2L-4380seg]` and the scenario matrix
          expands it, with memory scaled per token. Earth's smaller default cases (10
          clusters, electricity-only) make this the cheapest place in the whole book to
          actually measure an aggregation error.
    where:
      - change: "segmentation in the sector chain (the sopts `seg` branch)"
        anchor: "scripts/prepare_sector_network.py -> the `for o in sopts` loop that currently matches only ^\\d+h$; call scripts/prepare_network.py:apply_time_segmentation"
        provenance: "scripts/prepare_sector_network.py:sopts; scripts/prepare_network.py:apply_time_segmentation"
      - change: "typical-period aggregation (fork the tsam call)"
        anchor: "scripts/prepare_network.py::apply_time_segmentation -> the tsam.TimeSeriesAggregation(...) call (noTypicalPeriods / hoursPerPeriod / segmentation)"
        provenance: "scripts/prepare_network.py:noTypicalPeriods"
      - change: "leap-day handling so a leap-year window still normalises per 8760 h"
        anchor: "scripts/prepare_network.py::average_every_nhours (eur's equivalent takes a drop_leap_day argument; earth's does not) and the commented-out drop_leap_day line in the Snakefile"
        provenance: "scripts/prepare_network.py:average_every_nhours; Snakefile:drop_leap_day"
      - change: "guard against compounded opts+sopts aggregation"
        anchor: "scripts/prepare_sector_network.py -> the sopts loop; eur's analogue is the ValueError in scripts/time_aggregation.py, which earth has no equivalent of"
        provenance: "scripts/prepare_sector_network.py:average_every_nhours"
    data_dependencies: []
    cost_profile:
      solves: >
        1 per resolution, as eur. The Snakefile's `memory(w)` divides the memory factor by
        the `NNh` value and multiplies it by segments/8760, so the scheduler's own cost
        model agrees with the linear-in-snapshots rule.
      relative: >
        Linear in snapshot count for LP size, super-linear in solve time. Earth's shipped
        sector default (3h then 144h -> 61 snapshots/year) is roughly 140x smaller than
        hourly, which is why it solves at all on a laptop and why it must not be trusted.
      note: >
        Earth is the cheaper model to run resolution experiments on: 10 clusters and an
        electricity-only default mean a full 1h/3h/6h/seg comparison is affordable, and
        the electricity chain is where segmentation actually works. Use earth to measure
        the aggregation error for a region, then apply the finding to whichever chain the
        study needs.
    verifies:
      - variant: n-hourly-averaging
        check: "abs(n.snapshot_weightings.objective.sum() - len(pd.date_range(snapshots['start'], snapshots['end'], freq='h', inclusive='left'))) < 1e-6"
        over: run
        note: >
          Written against the WINDOW rather than 8760 because earth has no
          drop_leap_day: a leap-year window legitimately has 8784 hours here, and a hard
          8760 check would fail correct runs while passing the leap-year normalisation bug.
      - variant: n-hourly-averaging
        check: "len(n.snapshots) == round(n.snapshot_weightings.objective.sum() / float(sopts_hours))"
        over: run
        note: >
          Catches the compounding default: with `opts: Co2L-3h` and `sopts: 144h` this
          holds at 61 snapshots, which is the number to put in front of the user. If the
          count is far below what the sopts token implies alone, both chains aggregated.
      - variant: tsam-segmentation
        check: "n.snapshot_weightings.objective.nunique() > 1"
        over: run
        note: >
          Unequal weights are the signature of real segmentation. All-equal weights on an
          earth SECTOR run are the expected symptom of the missing `seg` branch — the
          token was accepted by the wildcard regex and silently ignored.
      - variant: resolution-sensitivity-sweep
        check: "abs(ns[0].objective - ns[-1].objective) / abs(ns[-1].objective) < 0.05"
        over: ensemble
        note: >
          Same 5% outer bound as eur. Run this on earth before trusting any coarse earth
          result; it is cheap here and it is the only evidence that the shipped default
          is or is not adequate for the region in question.
