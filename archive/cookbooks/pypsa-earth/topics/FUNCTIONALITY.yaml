# Functionality registry for the topics cookbook.
# Model CAPABILITIES (analysis machinery, not technologies/demands/data) that
# topic cards reference by id. Consumer symbols are grep-verified against the
# repo at version anchor 8435f4c8 (2026-07-08).
# status: working   — wired and exercised by the standard workflow
#         partial   — exists but limited/off-by-default/needs assembly
#         dead-key  — config surface exists but no code consumes it
#         absent    — not in the model at all (note names the nearest workaround)

# ---------- temporal machinery ----------
- id: temporal-resolution-nh
  title: "Temporal averaging (nH in opts)"
  status: working
  surface: "scenario.opts token like 3h/24h (power); scenario.sopts (sector chain)"
  consumer: "scripts/prepare_network.py:average_every_nhours"
  note: "resamples all time series to n-hour means; the workhorse for tractability"

- id: time-segmentation-tsam
  title: "Time-series segmentation (nSEG in opts, TSAM)"
  status: working
  surface: "scenario.opts token like 4380seg"
  consumer: "scripts/prepare_network.py:apply_time_segmentation"
  note: "adaptive segments preserve extremes better than uniform averaging; needs tsam package"

- id: weather-year-selection
  title: "Weather year / snapshot window selection"
  status: working
  surface: "snapshots.start/end; atlite.cutouts; load_options.weather_year"
  consumer: "scripts/build_demand_profiles.py:weather_year"
  note: "one weather year per run; cutout year and demand weather year must be chosen consistently"

- id: multi-weather-year
  title: "Multi-year weather / inter-annual variability in ONE optimization"
  status: absent
  surface: "—"
  note: "single weather year per network; inter-annual variability only via separate runs per year (scenario sweep) and comparing results — no probabilistic multi-year adequacy in one solve"

# ---------- emissions & policy constraints ----------
- id: co2-cap
  title: "CO2 emission cap (Co2L in opts)"
  status: working
  surface: "opts Co2L<f>; electricity.co2limit; electricity.automatic_emission + base year"
  consumer: "scripts/prepare_network.py:add_co2limit"
  note: "annual budget as global constraint; factor scales co2base; default scenario runs with Co2L"

- id: emission-pricing
  title: "CO2 price (Ep in opts)"
  status: working
  surface: "opts Ep<f>; costs.emission_prices.co2"
  consumer: "scripts/prepare_network.py:add_emission_prices"
  note: "adds price to marginal costs by carrier emission factor — carbon-price sensitivity is one token"

- id: gas-usage-limit
  title: "Gas consumption budget (CH4L in opts)"
  status: working
  surface: "opts CH4L<f>; electricity.gaslimit fallback absent from config.default.yaml"
  consumer: "scripts/prepare_network.py:add_gaslimit"
  note: "caps total natural-gas generator dispatch; numberless CH4L needs the (absent) config key"

- id: country-carrier-capacity-limits
  title: "Per-country per-carrier capacity min/max (CCL in opts)"
  status: working
  surface: "opts CCL; electricity.agg_p_nom_limits; data/agg_p_nom_minmax.csv"
  consumer: "scripts/solve_network.py:add_CCL_constraints"
  note: "the hook for national build caps/floors (policy targets, phase-out floors)"

- id: equity-self-sufficiency
  title: "National self-sufficiency share (EQ in opts)"
  status: working
  surface: "opts EQ<f>[c], e.g. EQ0.7c"
  consumer: "scripts/solve_network.py:add_EQ_constraints"
  note: "each country must produce >= f of its consumption; c = carbon-free sources only"

- id: bau-minimum-capacities
  title: "Business-as-usual minimum carrier capacities (BAU in opts)"
  status: working
  surface: "opts BAU; electricity.BAU_mincapacities"
  consumer: "scripts/solve_network.py:add_BAU_constraints"
  note: "system-wide per-carrier capacity floors"

- id: autarky
  title: "Autarky enforcement (ATK/ATKc in opts)"
  status: working
  surface: "opts ATK (islanded countries) / ATKc (no cross-border flows)"
  consumer: "scripts/prepare_network.py:enforce_autarky"
  note: "removes or caps cross-border links — the counterfactual for interconnection value studies"

- id: carrier-attribute-scaling
  title: "Per-carrier cost/potential scaling (carrier+p/c/m in opts)"
  status: working
  surface: "opts like solar+c0.5, onwind+p2, AC+m1.1"
  consumer: "scripts/prepare_network.py:attr_lookup"
  note: "wildcard-level sensitivity sweeps on p_nom_max, capital_cost, marginal_cost"

# ---------- adequacy, reserves, reliability ----------
- id: safe-reserve-margin
  title: "Planning reserve margin (SAFE in opts)"
  status: working
  surface: "opts SAFE; electricity.SAFE_reservemargin"
  consumer: "scripts/solve_network.py:add_SAFE_constraints"
  note: "firm capacity >= (1+margin) x peak demand — deterministic adequacy, not probabilistic LOLE"

- id: operational-reserves
  title: "Operational reserve requirement (GenX-style)"
  status: working
  surface: "electricity.operational_reserve.{activate,epsilon_load,epsilon_vres,contingency}"
  consumer: "scripts/solve_network.py:add_operational_reserve_margin"
  note: "hourly reserve = %load + %VRE + fixed MW; a proxy for balancing needs, not market products"

- id: load-shedding-voll
  title: "Load shedding at value of lost load"
  status: working
  surface: "solving.options.load_shedding (EUR/kWh or false)"
  consumer: "scripts/solve_network.py:get_load_shedding_capacity"
  note: "slack generators per bus; unserved-energy cost and infeasibility diagnosis"

- id: probabilistic-adequacy
  title: "Probabilistic resource adequacy (LOLE/EUE, outage draws)"
  status: absent
  surface: "—"
  note: "no forced-outage sampling or LOLE metrics; nearest: SAFE margin + load-shedding VOLL runs across weather-year sweeps"

- id: unit-commitment
  title: "Unit commitment / start-up, min-load, ramping"
  status: partial
  surface: "cluster_options.aggregation_strategies.generators.committable: any (attribute preserved)"
  consumer: "scripts/cluster_network.py:busmap_for_n_clusters"
  note: "PyPSA supports committable generators but no pypsa-earth code sets committable=True or ramp data — LP relaxation everywhere; enabling UC = data + config work on top"

- id: inertia-stability
  title: "System inertia / dynamic stability"
  status: absent
  surface: "—"
  note: "no frequency dynamics, inertia constraints, or short-circuit analysis; nearest proxy: operational-reserves contingency MW and per-carrier capacity floors (CCL/BAU)"

