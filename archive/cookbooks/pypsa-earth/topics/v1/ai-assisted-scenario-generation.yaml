id: ai-assisted-scenario-generation
title: AI-assisted scenario generation
rank: 91
question: >
  Can an AI layer generate, launch, and interpret model scenarios — natural
  language in, runs and narrated results out? Part of the very-high-demand
  methodological cluster: the community openly wants better tooling and UX
  around powerful but expert-only models.
when_to_use:
  - "drive the model with an LLM / agent"
  - "auto-generate scenario ensembles from a question"
  - "natural-language interface to the model"
  - "automated sensitivity discovery"
  - "batch scenario pipelines an agent can operate"
recipes:
  generation_conversion: []
  demand: []
functionality:
  - id: scenario-matrix
    role: "the substrate — declarative config lists expand into runs; an agent writes yaml, not code"
  - id: carrier-attribute-scaling
    role: "one-token sensitivity grammar (solar+c0.5, Co2L0.1) — a machine-writable scenario language"
  - id: monte-carlo-sampling
    role: "the only built-in automated scenario fan-out beyond cartesian lists"
  - id: summary-outputs
    role: "flat csv summaries are the machine-readable result surface an agent reads back"
  - id: solve-statistics
    role: "per-run diagnostics for an agent's success/failure loop"
gap_assessment: >
  There is no AI anywhere in the model: no natural-language interface, no
  automated scenario suggestion, no result narration, no learning across
  runs. What exists is an unusually automation-friendly substrate — the
  entire study is declared in one config file, scenario lists expand
  combinatorially through snakemake, sensitivities are a compact token
  grammar in the opts wildcard, and results land as flat csvs. An external
  agent that writes configs, launches the workflow, and reads summaries gets
  the full model surface without touching Python; this cookbook (topics ->
  recipes -> functionality -> verified config keys) is itself the
  machine-readable interface such an agent needs. The blockers an agent
  inherits are the model's, not the interface's: multi-hour solves make
  tight interaction loops impossible, config validation is weak (bad
  combinations fail deep in the DAG), and there is no run database — result
  provenance across large ensembles is directory naming.
coverage: gap
