id: biomass-bioenergy-allocation
title: Biomass / bioenergy allocation
rank: 66
question: >
  Where should scarce sustainable biomass go — power, heat, industry,
  biofuels, or BECCS for negative emissions — and what does each competing
  claim displace? The allocation question sharpens as carbon targets
  tighten and biomass becomes the binding renewable resource.
when_to_use:
  - "best use of limited biomass potential"
  - "biomass for power vs heat vs fuels vs BECCS"
  - "how much bioenergy does the least-cost system burn"
  - "negative emissions from biomass under a CO2 cap"
  - "sustainable biomass supply as a system constraint"
recipes:
  generation_conversion: [biomass-bioenergy, biogas-anaerobic-digestion,
                          waste-to-energy, beccs, advanced-biofuels]
  demand: [cooking-energy-demand, residential-space-heating-demand,
           industrial-process-heat-temperature-bands]
functionality:
  - id: sector-coupled-workflow
    role: "core — one network holds all competing biomass uses, allocation is endogenous"
  - id: co2-cap
    role: "the tightening budget that makes biomass and BECCS scarce and valuable"
  - id: co2-network-sequestration
    role: "captured-carbon accounting and sequestration budget behind BECCS"
  - id: carrier-attribute-scaling
    role: "sweep biomass potential/cost (p/c multipliers) — the key sensitivity"
  - id: scenario-matrix
    role: "allocation shifts across CO2 levels and demand scenarios in parallel runs"
  - id: summary-outputs
    role: "supply/withdrawal by carrier shows where each PJ of biomass went"
gap_assessment: >
  The core allocation logic is native: in a sector-coupled run, solid
  biomass and biogas are potentials-limited stores drawn on simultaneously
  by power, CHP, heat, industry, upgrading-to-gas, and BECCS, so the model
  decides the split endogenously and the biomass shadow price (dual on the
  potential) is a direct scarcity signal — exactly the study this topic
  asks for. Caveats worth flagging: biomass potentials are one aggregate
  sustainable estimate per region, not a supply curve by feedstock class or
  cost step, so "allocation" is of a single homogeneous resource (the
  biomass-bioenergy recipe details the data lineage and its quality by
  country); there is no biomass transport network, so the resource is
  effectively regional; traditional-use cooking biomass sits in the demand
  projections rather than competing in the optimization; and dedicated
  liquid-biofuel routes are thinner than the power/heat/BECCS paths. For
  national-scale "where should biomass go under a carbon budget" the answer
  is ready; for feedstock-level or logistics questions it is not.
coverage: ready
