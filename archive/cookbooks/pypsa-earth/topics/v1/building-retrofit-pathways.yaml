id: building-retrofit-pathways
title: Building retrofit pathways
rank: 48
question: >
  How much insulation/renovation should happen, on what trajectory, and what is
  its system value against supply-side spending — does saving a unit of heat
  demand beat building the heat pump and the grid behind it?
when_to_use:
  - "building renovation / insulation scenario"
  - "retrofit rate trajectory to 2050"
  - "system value of heat-demand efficiency"
  - "retrofit vs heat pump vs district heating"
  - "building codes in an energy-system model"
recipes:
  generation_conversion: [building-retrofit, air-source-heat-pumps, district-heating]
  demand: [residential-space-heating-demand, services-heat-demand, building-heat-dsm]
functionality:
  - id: sector-coupled-workflow
    role: "carries the heat demand the retrofit factor scales and the supply side it trades against"
  - id: myopic-foresight
    role: "per-horizon factor dict = an exogenous renovation trajectory across planning years"
  - id: scenario-matrix
    role: "compare retrofit-depth scenarios as parallel runs to price the system value"
  - id: weather-year-selection
    role: "degree-day-driven space-heat shape the reduction applies to"
gap_assessment: >
  Exogenous scaling only. sector.reduce_space_heat_exogenously (default FALSE)
  applies a single factor (default 0.29) uniformly to residential and services
  space-heat demand; water heating is untouched. A dict keyed by planning
  horizon gives a renovation trajectory over myopic runs, and comparing runs
  with/without the reduction prices the system value of efficiency — that
  two-run pattern is the workable study design today. Everything endogenous is
  missing: no retrofit investment option or cost-vs-savings supply curve (no
  pypsa-eur-style retrofitting "generators" on heat buses), no building-stock
  data, and no spatial differentiation — one scalar for all nodes, both
  sectors. The default factor is explicitly Europe-derived (EU calculator LTS
  scenario); region-appropriate depths must be user-supplied (L3, no dataset
  shipped). Country-differentiated factors need a small add_heat edit (L2).
  Endogenous cost-optimal retrofit vs supply is L5 new-component work. Verdict:
  good for "what is deep renovation worth", silent on "how much retrofit is
  optimal".
coverage: partial
models:
  - model: pypsa-earth
