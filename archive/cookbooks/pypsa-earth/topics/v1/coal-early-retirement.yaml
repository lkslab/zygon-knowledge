id: coal-early-retirement
title: Coal early retirement
rank: 21
question: >
  Can plant X (or the fleet) retire early while the system stays adequate,
  what replaces it, and what does the accelerated schedule cost? The defining
  financed-transition question in ASEAN (ADB ETM, JETPs in Indonesia /
  Philippines / Vietnam), and central to India's and China's coal pivot from
  baseload to backup.
when_to_use:
  - "retire coal plants early / phase-out schedule"
  - "ETM / JETP coal-retirement study"
  - "does the system stay adequate without plant X"
  - "clean replacement portfolio for retiring coal"
  - "cost of accelerating vs delaying coal exit"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants, grid-scale-batteries, utility-scale-solar-pv]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: fleet-retirement-filter
    role: "core — powerplants_filter query on DateIn/DateOut retires units by date"
  - id: country-carrier-capacity-limits
    role: "CCL caps coal per country to a shrinking trajectory (or floors it for delay counterfactuals)"
  - id: co2-cap
    role: "budget-driven retirement — let the CO2 constraint force coal out instead of dating it"
  - id: safe-reserve-margin
    role: "the adequacy check every retirement deal must pass — firm capacity vs peak"
  - id: load-shedding-voll
    role: "unserved-energy diagnosis when a schedule is too aggressive"
  - id: myopic-foresight
    role: "staged retirement pathway across planning_horizons with capacity carry-forward"
  - id: scenario-matrix
    role: "retirement-date sweeps as parallel runs (early vs late vs reference)"
  - id: financial-viability-actors
    role: "the deal side — plant owner compensation, PPA buyouts, financing — is absent"
gap_assessment: >
  Strong core: the powerplantmatching fleet carries commissioning/retirement
  dates, so powerplants_filter turns any retirement schedule into a one-line
  query; CCL/Co2L constraints implement policy-driven phase-out; and the same
  solve co-optimizes the replacement portfolio (solar + storage + gas + grid)
  with SAFE adequacy and VOLL diagnostics — the system half of an ETM/JETP
  case runs out of the box. Two real gaps: (1) adequacy is a deterministic
  reserve margin, not probabilistic LOLE with forced outages, which retirement
  finance reviewers increasingly ask for; (2) the transaction layer — stranded
  value, owner compensation, refinancing terms — is out of scope (single social
  planner), so the model prices the system, not the deal. Check the
  data_quality scorecard for the country's powerplant coverage first: missing
  or undated coal units silently escape the retirement filter.
coverage: ready
models:
  - model: pypsa-earth
