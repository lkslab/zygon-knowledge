id: demand-response
title: "Demand response"
rank: 13
question: >
  How much flexibility can the demand side deliver — smart EV charging,
  industrial load-shifting, heat-pump flexibility — and what is it worth
  against batteries and peakers? The hottest cross-cutting theme of
  2025-2026 (IEA Electricity 2026 flexibility chapter, Agora, Ember's
  "clean flexibility"), with aggregators and TSOs as buyers.
when_to_use:
  - "value of demand-side response vs storage or peakers"
  - "how much load can shift and at what timescale"
  - "EV / heat-pump / industrial flexibility potential"
  - "clean flexibility instead of fossil peakers"
  - "price-responsive demand scenarios"
recipes:
  generation_conversion: [smart-ev-chargers, vehicle-to-grid, smart-meters,
                          virtual-power-plants, desalination-flexible-load]
  demand: [building-heat-dsm, land-transport-demand, electricity-load,
           demand-temporal-profiles]
functionality:
  - id: bev-dsm-v2g
    role: "core — EV battery demand-shifting (and V2G) is the one endogenous demand flexibility"
  - id: sector-coupled-workflow
    role: "DR only exists in the sector chain; the power-only chain has fixed loads"
  - id: demand-elasticity
    role: "price-elastic or tariff-responsive demand is absent — loads are fixed profiles"
  - id: market-design-mechanisms
    role: "no DR products, aggregator bids, or capacity remuneration to value against"
  - id: nodal-marginal-prices
    role: "shadow prices give the competitive-benchmark value of shifted load"
  - id: operational-reserves
    role: "reserve requirement DR could serve is a system constraint, not a procured product"
  - id: summary-outputs
    role: "shifted-charge patterns readable from solved network time series"
gap_assessment: >
  Thin but real: the only endogenous demand response is EV battery
  demand-shifting and V2G in the sector chain — that one channel is genuinely
  co-optimized and answers "what is smart charging worth". Everything else
  is exogenous: heat DSM is a fixed profile reshape (see building-heat-dsm),
  industrial load-shifting has no mechanism, and price-elastic demand is
  absent, so tariff-response and DR-program studies cannot be represented
  without code additions (an elastic band or shiftable-load Links). There is
  also no market layer, so DR value must be read from shadow prices rather
  than simulated revenues. Verdict: EV-centric DR studies run today; the
  broader DR question — total demand-side flexibility across sectors — needs
  model extension, hence partial rather than gap.
coverage: partial
