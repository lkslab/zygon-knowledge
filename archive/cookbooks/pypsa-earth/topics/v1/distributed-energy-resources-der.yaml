id: distributed-energy-resources-der
title: "Distributed energy resources (DER)"
rank: 74
question: >
  How much rooftop PV, home storage, and other customer-sited resources will
  the system take up, what do they displace at transmission level, and what
  does the distribution grid cost? The system-side DER question behind
  hosting-capacity, VPP, and rooftop-saturation debates.
when_to_use:
  - "distributed energy resources in the system mix"
  - "rooftop PV + home battery uptake"
  - "DER vs utility-scale build trade-off"
  - "distribution grid reinforcement cost of DER"
  - "off-grid solar home systems"
recipes:
  generation_conversion: [behind-the-meter-der, rooftop-distributed-solar,
                          solar-home-systems, smart-meters,
                          virtual-power-plants]
  demand: [residential-electricity-demand, demand-spatial-disaggregation,
           electricity-load]
functionality:
  - id: distribution-grid-lv
    role: "core — LV bus per node hosting rooftop PV, home batteries, EVs, heat; cost proxy only"
  - id: sector-coupled-workflow
    role: "the LV layer and all BTM assets exist only in the sector chain"
  - id: bev-dsm-v2g
    role: "EV batteries on the LV bus are the flexible DER in the set"
  - id: distribution-power-flow
    role: "no feeders, voltage, or hosting-capacity limits — one LV bus per region"
  - id: demand-elasticity
    role: "no adoption behaviour or tariff response — uptake is planner-optimal"
  - id: geospatial-access-electrification
    role: "off-grid DER (SHS, mini-grids) as an access solution is out of scope"
gap_assessment: >
  Partial, and clearly bounded: the sector chain's stylized distribution grid
  adds one low-voltage bus per cluster region with a costed reinforcement
  link (with losses), rooftop PV potentials from population or building
  footprints, home batteries, and EV/heat loads moved onto it — so
  "DER vs utility-scale, including the distribution-grid cost wedge" is
  answerable as a cost trade-off, and it competes properly with transmission
  assets in one LP. What is missing is everything sub-regional and
  behavioural: no feeder topology, voltage, or hosting-capacity constraints
  (distribution-power-flow absent), no tariffs or net metering, so DER
  deployment is cost-optimal social-planner uptake, not adoption; and no DER
  at all in the electricity-only workflow. Off-grid DER for energy access
  belongs to the geospatial-electrification topic and is equally out of
  scope. Good for system-level DER shares; wrong tool for hosting capacity.
coverage: partial
