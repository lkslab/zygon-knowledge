id: distribution-hosting-capacity
title: "Distribution hosting capacity"
rank: 19
question: >
  How much rooftop solar, EV charging, and heat-pump load can distribution
  feeders host before voltage or thermal limits bind, and where must DSOs
  reinforce first? The distribution-level face of grid bottlenecks — a core
  DSO/regulator question as electrification lands on LV networks.
when_to_use:
  - "feeder / LV hosting capacity for PV, EVs, heat pumps"
  - "where do distribution networks bind under electrification"
  - "DSO reinforcement need and cost"
  - "voltage or thermal limits on DER uptake"
  - "distribution grid impact of mass EV adoption"
recipes:
  generation_conversion: [rooftop-distributed-solar, behind-the-meter-der,
                          smart-ev-chargers, air-source-heat-pumps]
  demand: [residential-electricity-demand, electricity-load,
           electricity-distribution-losses]
functionality:
  - id: distribution-power-flow
    role: "core capability for this topic — absent: no feeder-level network, no voltage/thermal limits"
  - id: distribution-grid-lv
    role: "nearest surface — one LV bus per node with a linear reinforcement-cost link (sector runs)"
  - id: sector-coupled-workflow
    role: "the LV layer and its loads (rooftop PV, EVs, heat) exist only in the sector chain"
  - id: bev-dsm-v2g
    role: "smart charging shifts LV load in time, changing the reinforcement bill"
  - id: spatial-clustering
    role: "even the finest clustering stops at transmission substations — feeders are below the model floor"
  - id: summary-outputs
    role: "distribution reinforcement spend appears as a cost line, not a network result"
gap_assessment: >
  Out of scope at the physics level: pypsa-earth has no feeder topology, no
  distribution power flow, and no voltage or thermal constraints, so hosting
  capacity — an inherently feeder-specific, power-flow question — cannot be
  computed. What exists is a stylized proxy: sector runs attach one LV bus
  per cluster with a linear reinforcement-cost link (grid_cost_factor), and
  rooftop PV, home batteries, EV charging, and electrified heat sit behind
  it, so the model prices aggregate distribution reinforcement and shows how
  smart charging or home batteries reduce that bill — useful for national
  reinforcement-cost envelopes, useless for "which feeder saturates first".
  Pair pypsa-earth's system-level electrification scenarios (the demand
  driver) with a dedicated distribution tool (pandapower, OpenDSS) for the
  hosting-capacity computation itself.
coverage: gap
