id: district-heating-optimization
title: District heating optimization
rank: 46
question: >
  Where does district heating beat individual heating, what supply mix (large
  heat pumps, CHP, boilers, storage) should feed the networks, and how fast
  should DH expand? Cities and DH operators ask this; TYNDP-class studies now
  model heat explicitly.
when_to_use:
  - "district heating expansion scenario"
  - "central heat pumps vs CHP vs boilers in heat networks"
  - "DH share rollout by 2030/2050"
  - "centralised vs decentralised heating for a city"
  - "heat network supply optimization"
recipes:
  generation_conversion: [district-heating, combined-heat-and-power, air-source-heat-pumps, thermal-storage, solar-thermal]
  demand: [district-heating-demand-share, residential-space-heating-demand, services-heat-demand]
functionality:
  - id: sector-coupled-workflow
    role: "core — urban central heat bus per node with endogenous supply competition"
  - id: chp-operation-constraints
    role: "dead-key: CHP runs on a fixed heat-power ratio; the operating-envelope constraint matches nothing"
  - id: myopic-foresight
    role: "district_heating.progress as a per-horizon dict gives a rollout path"
  - id: weather-year-selection
    role: "heat demand shape is degree-day-driven from the chosen cutout year"
  - id: spatial-clustering
    role: "a 'network' is one node's urban central bus — resolution sets what a DH system means"
gap_assessment: >
  The supply-side optimization is real; the demand-side data is empty and the
  network is a loss factor. Each node gets an urban central heat bus carrying
  a config-driven fraction of urban space+water heat (marked up by a flat 15%
  loss), supplied by extendable central air-sourced heat pumps, resistive
  heaters, gas boilers, gas/biomass CHP (+CC) and 180-day water-tank storage —
  so "what should feed the network" is genuinely co-optimized. But the shipped
  data/demand/district_heating.csv contains only DEFAULT, MA and TN rows, ALL
  ZERO: today's DH share is zero everywhere out of the box (data_quality
  district-heating-share), and any penetration comes purely from
  sector.district_heating.potential (0.3) x progress interpolation — a single
  global scalar, not per-country data. Populate the csv for any real study.
  No pipe network exists: no inter-node heat transport, no network investment
  cost, no temperature levels, no waste-heat or geothermal DH sources; and CHP
  has no back-pressure envelope (chp-operation-constraints is dead).
coverage: partial
models:
