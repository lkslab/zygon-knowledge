gap_assessment: >
  The mechanism exists and closes: aviation is a default fixed kerosene load
  allocated to airport regions from national energy totals, and the
  Fischer-Tropsch link (H2 + stored CO2 + electricity -> oil) supplies it
  whenever cost-optimal or CO2-forced — so "what does system-integrated
  e-kerosene cost and when does it deploy" is answerable today. The honest
  caveats are structural: there is NO distinct kerosene/SAF carrier — FT
  output lands on the shared oil bus serving aviation, shipping, trucks,
  naphtha, and boilers alike, so e-kerosene is indistinguishable from
  e-diesel and a SAF-specific blending mandate ("X% synthetic in aviation
  fuel") cannot be expressed without splitting the bus or adding a custom
  constraint. Aviation emissions are booked from demand volume, not the
  fossil/synthetic supply split (the accounting nets out via the FT link's
  stored-CO2 draw, system-wide rather than per-flight); demand is a fixed
  profile with no efficiency or elasticity; hydrogen and electric aircraft
  are absent. For mandate studies, budget code work; for system-cost and
  deployment-threshold studies, it runs.
