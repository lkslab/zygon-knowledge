gap_assessment: >
  A natural fit for the core machinery: industrial demand is built bottom-up
  by subsector from production drivers, georeferenced via industrial
  distribution keys, and scaled through demand scenarios, and the model then
  co-optimizes generation, storage, and transmission to serve it — exactly
  the "what must be built for this industrial future" question development
  banks and planning ministries ask. Caveats are mostly data, not machinery:
  industrial production projections for many African countries rest on thin
  statistics and SSP-style scaling (check the data_quality scorecard for the
  relevant demand recipes before trusting subnational siting), future plant
  locations are exogenous assumptions rather than endogenously sited, and
  there is no linkage from electricity cost back to industrial
  competitiveness or demand (loads are fixed per scenario, demand-elasticity
  absent). Reliability of supply — often the binding constraint for
  industrial investors — is only a planning margin, not outage statistics.
  Scenario discipline covers most of this: run industrialization as a
  demand sweep and report cost, build-out, and carbon intensity per future.
