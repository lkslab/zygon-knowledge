id: energy-desalination-nexus
title: Energy-desalination nexus
rank: 60
question: >
  How should power, water, and industry be co-optimized where desalination is
  a major load — the Gulf archetype: can flexible reverse-osmosis plants with
  water storage soak up cheap midday solar, and what does water security cost
  the power system?
when_to_use:
  - "desalination as a flexible grid load"
  - "co-optimize power and water production"
  - "Gulf-style solar + desalination + industry planning"
  - "water storage as demand flexibility"
  - "energy cost of water security"
recipes:
  generation_conversion: [desalination-flexible-load, utility-scale-solar-pv,
                          grid-scale-batteries]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: h2-export-chain
    role: "the structural template: add_export's Bus + buffer Store + Load offtake is exactly the flexible-desalination shape"
  - id: sector-coupled-workflow
    role: "where a water block would live (prepare_sector_network component assembly)"
  - id: demand-elasticity
    role: "absent — loads are fixed profiles, so ad-hoc 'flexible desalination' cannot be configured in"
  - id: spatial-clustering
    role: "coastal shapes exist for siting plants at coastal buses"
  - id: scenario-matrix
    role: "once built, water-demand scenarios sweep like any other dimension"
gap_assessment: >
  Grounded absence: "desalination" appears nowhere in scripts, config, or the
  Snakefile — no water carrier, no water demand, no desalination technology
  or cost row, no brine/intake modelling (see the desalination-flexible-load
  recipe). Two workarounds exist at very different depths. Inflexible: fold
  the desalination electricity demand into the load profiles (data route, or
  crudely via load_options.scale — which scales ALL load) and the power
  system sees it as ordinary demand; this answers "energy cost of water"
  but none of the flexibility questions. Flexible: bespoke Python in
  prepare_sector_network — a water Bus per coastal node, an extendable
  electricity-to-water Link (specific energy as efficiency), a water Store,
  and a fixed water Load — for which the model contains the exact pattern to
  copy (the H2 export offtake in add_export.py) but zero data: water demand,
  plant specific energy, and cost rows must all be user-supplied. Given the
  headline nexus question is precisely the flexibility one, and that requires
  custom components plus user data end to end, this is a gap, not a partial.
coverage: gap
