id: extreme-weather-resilience
title: Extreme-weather resilience
rank: 64
question: >
  Does the system survive heat waves, cold snaps, droughts, and storms —
  what breaks first, how much unserved energy results, and what buys
  resilience cheapest? Post-Uri / post-2022 framing, rising everywhere as
  climate extremes intensify.
when_to_use:
  - "system performance in a heat wave / cold snap"
  - "unserved energy under an extreme weather year"
  - "resilience investment: what to harden first"
  - "compound stress: drought plus heat plus low wind"
  - "climate stress-testing a capacity plan"
recipes:
  generation_conversion: [gas-power-plants, grid-scale-batteries,
                          long-duration-storage, conventional-hydropower]
  demand: [electricity-load, space-cooling-demand,
           residential-space-heating-demand]
functionality:
  - id: weather-year-selection
    role: "core lever — re-run the plan against a chosen stress year's cutout"
  - id: load-shedding-voll
    role: "VOLL slack generators turn infeasibility into unserved-energy metrics"
  - id: multi-weather-year
    role: "no multi-year solve — stress years are separate runs, not a distribution"
  - id: probabilistic-adequacy
    role: "no forced outages or LOLE — weather stress only, no equipment failure"
  - id: time-segmentation-tsam
    role: "segmentation preserves extreme hours that uniform averaging smooths away"
  - id: hydro-inflow-normalization
    role: "drought scenarios via inflow year/multiplier rescaling"
  - id: monte-carlo-sampling
    role: "fan-out over uncertain loads/capacity factors around the stress case"
  - id: safe-reserve-margin
    role: "deterministic peak margin — the blunt resilience backstop constraint"
gap_assessment: >
  A workable stress-testing loop exists but no extreme-event machinery.
  What works: pick a bad weather year (cutout + demand year consistently),
  turn on load shedding at VOLL, and read unserved energy, shadow prices,
  and which assets saturate — with hydro drought layered in via inflow
  normalization and demand extremes via the heating/cooling profiles.
  Comparing capacity plans across a set of historical stress years via the
  scenario matrix is the practical resilience workflow. What is missing is
  everything event-shaped: no forced-outage sampling, no correlated
  generator/line failures, no interdependency (gas-system freeze-offs,
  cooling-water curtailment), no storm damage to the grid, and only one
  weather year per solve, so tail risk is a hand-picked scenario set rather
  than a probability distribution. Beware temporal averaging: at 3h+ the
  extremes that define this topic start disappearing — use tsam segmentation
  or full hourly for stress runs.
coverage: partial
