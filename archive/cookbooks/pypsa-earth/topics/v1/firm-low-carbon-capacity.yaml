id: firm-low-carbon-capacity
title: Firm low-carbon capacity
rank: 27
question: >
  How much firm (dispatchable, weather-independent) low-carbon capacity does a
  high-VRE system need, and which technology supplies it — nuclear/SMR, hydro,
  geothermal, gas+CCS, long-duration storage? The question behind coal-exit
  firming (Australia), nuclear resurgence, and clean-firm procurement.
when_to_use:
  - "how much firm capacity does the system need"
  - "nuclear vs storage vs gas-CCS as firm supply"
  - "clean firm power / 24-7 style portfolio"
  - "firming a wind-solar system as coal exits"
  - "value of dispatchable low-carbon generation"
recipes:
  generation_conversion: [conventional-nuclear, small-modular-reactors, geothermal-conventional, conventional-hydropower, long-duration-storage, gas-power-plants]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
