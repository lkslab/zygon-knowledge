    role: "core — tightening Co2L is what makes firm LOW-CARBON capacity bind"
  - id: safe-reserve-margin
    role: "SAFE defines 'firm' mechanically: conventional capacity vs peak"
  - id: bau-minimum-capacities
    role: "force minimum nuclear/hydro fleets to test policy portfolios"
  - id: country-carrier-capacity-limits
    role: "CCL caps/floors firm carriers per country (nuclear bans, hydro limits)"
  - id: carrier-attribute-scaling
    role: "one-token cost sweeps: at what nuclear/SMR capex does it enter?"
  - id: operational-reserves
    role: "reserve requirement adds a second, hourly firmness demand"
  - id: probabilistic-adequacy
    role: "no forced outages — a 1 GW reactor is perfectly reliable in the LP; absent"
  - id: unit-commitment
    role: "LP relaxation: no min-load/ramp on nuclear, so its inflexibility cost is unpriced"
gap_assessment: >
  Strong core: this is the canonical capacity-expansion question and the model
  answers it directly — sweep Co2L toward zero and watch which firm carriers
  the optimizer buys against storage and transmission, with SAFE/reserve
  constraints defining firmness and CCL/BAU encoding policy fleets. Nuclear,
  geothermal, hydro (inflow-calibrated), gas (cappable via CH4L), and
  multi-day storage are all first-class citizens; the "storage + overbuild vs
  firm generation" frontier falls out of cost sweeps. Two systematic biases to
  flag in results: (1) no forced-outage sampling or LOLE means firm capacity
  is overvalued (never breaks) exactly where adequacy studies scrutinize it;
  (2) everything is an LP — no unit commitment, so nuclear's minimum-load and
  cycling costs are invisible, flattering baseload. CCS-based firm power
  exists in the sector chain (cc/co2 machinery), not the power-only chain.
  Results hinge on one weather year — pair with multi-year-weather-variability
  sweeps for Dunkelflaute robustness.
coverage: ready
