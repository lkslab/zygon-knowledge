id: fleet-ev-charging-siting
title: Fleet EV charging siting
rank: 70
question: >
  Where should depot and public charging hubs for electrified fleets —
  buses, trucks, taxis, delivery vans — be sited, sized, and grid-connected?
  A siting question sitting below the transmission model, at the junction of
  routes, land, and distribution capacity.
when_to_use:
  - "where to site depot / hub charging for a fleet"
  - "charger network layout for electric buses or trucks"
  - "grid connection capacity for a charging depot"
  - "charging infrastructure rollout plan"
  - "distribution impact of fleet electrification at a site"
recipes:
  generation_conversion: [battery-electric-cars, smart-ev-chargers,
                          electric-buses, electric-heavy-trucks,
                          vehicle-to-grid]
  demand: [land-transport-demand, demand-spatial-disaggregation]
functionality:
  - id: bev-dsm-v2g
    role: "EV charging exists only as one aggregate fleet per node — no sites"
  - id: distribution-power-flow
    role: "absent — no feeder model, so depot grid-connection analysis is impossible"
  - id: distribution-grid-lv
    role: "one stylized LV bus per node with linear cost — a reinforcement proxy, not siting"
  - id: spatial-clustering
    role: "nodes are zones far above depot scale; siting detail cannot survive clustering"
  - id: sector-coupled-workflow
    role: "land-transport electrification totals and timing come from the sector chain"
  - id: nodal-marginal-prices
    role: "zonal duals rank regions where charging load is cheap or costly to serve"
gap_assessment: >
  Wrong altitude for this model. In pypsa-earth, land transport is a single
  aggregated EV fleet per clustered node — one availability profile, one
  DSM window, one V2G link — so there are no depots, no routes, no charger
  counts, and no candidate sites; and with distribution-power-flow absent,
  the feeder headroom that actually decides depot siting cannot be
  evaluated (the LV bus is a linear cost proxy, not a network). Siting
  needs route/traffic data and feeder models the workflow does not touch.
  What the model legitimately contributes is the boundary conditions for a
  siting study: how much fleet charging load a region carries and when
  (sector chain + spatial disaggregation), zonal price and congestion
  signals that rank regions for cheap charging, and the system value of
  smart charging vs dumb (bev-dsm-v2g on/off). Use it to hand a siting tool
  its demand and price inputs — not to pick sites.
coverage: gap
models:
  - model: pypsa-earth
