id: geothermal-niche-baseload
title: Geothermal / niche baseload
rank: 99
question: >
  What role does geothermal play as firm low-carbon baseload — expanding
  the fleet where the resource exists (Kenya, Indonesia, East Africa Rift,
  US West) and whether EGS opens it up elsewhere? Niche globally, central
  in a handful of countries.
when_to_use:
  - "geothermal in the capacity mix"
  - "expand geothermal at existing fields"
  - "geothermal as firm/baseload alternative to gas"
  - "EGS / next-generation geothermal role"
  - "country geothermal build targets"
recipes:
  generation_conversion: [geothermal-conventional, enhanced-geothermal]
  demand: []
functionality:
  - id: fleet-retirement-filter
    role: "controls which geothermal fleet vintages enter via DateIn/DateOut queries"
  - id: country-carrier-capacity-limits
    role: "CCL caps/floors per country — the crude stand-in for resource limits (config names geothermal explicitly)"
  - id: safe-reserve-margin
    role: "geothermal counts as firm capacity toward the SAFE adequacy margin"
  - id: carrier-attribute-scaling
    role: "geothermal+c / +p tokens for cost and potential sensitivity sweeps"
gap_assessment: >
  The existing hydrothermal fleet is in by default: "geothermal" is a
  conventional carrier, plants come from powerplantmatching, and they enter
  as fully dispatchable generators with technology-data costs — so
  geothermal-as-baseload in today's mix works immediately (fleet coverage
  is region-dependent; verify powerplants.csv for your countries).
  Expansion works but only at buses that already host geothermal plants;
  candidate sites elsewhere must be hand-authored via custom_powerplants,
  and country totals capped via CCL. The gaps, per the two recipes: no
  resource assessment at all (no potential maps, temperature-at-depth, or
  time-varying availability), greenfield siting at arbitrary buses needs a
  small code edit, EGS does not exist as a distinct technology (no carrier
  or cost row — the enhanced-geothermal recipe documents the proxy route
  via overridden geothermal costs), and geothermal heat in sector runs is
  unwired despite a costs row existing. Fine for fleet-anchored scenarios;
  resource-constrained geothermal strategy needs external potential data.
