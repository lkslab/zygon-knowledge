id: green-hydrogen-siting
title: Green hydrogen siting
rank: 24
question: >
  Where should electrolysers sit — at the renewables, at demand, or at the
  export port — and does the project pencil at delivered cost? The post-hype
  question ("where does H2 actually make sense") for Gulf/Chile/Africa
  exporters, national H2 strategies, and industrial off-takers.
