gap_assessment: >
  Strong core — this is one of pypsa-earth's signature use cases. Electrolysis
  capacity is optimized per node against nodal renewable quality, H2 pipelines
  (GGIT-repurposed or greenfield), salt-cavern vs tank storage, and export
  demand at real ports, so "coast vs inland, pipe vs wire, export vs domestic"
  is answered endogenously in one LP; ammonia adds the shipping-fuel leg.
  Gaps are second-order: temporal-matching rules (hourly vs monthly
  additionality, EU RFNBO-style) are only proxied by h2-color-accounting's
  annual shares; water scarcity is not a constraint on siting (desalination
  exists as a load, not a siting screen); and shipping of liquid H2/derivatives
  uses simple cost assumptions rather than a fleet model. For dedicated
  off-grid export projects, note the model always allows grid interaction
  unless you constrain it. Renewable resource data is global (ERA5/atlite), so
  siting signal quality is good even where grid data is weak — but check the
  data_quality scorecard before trusting the grid-connection side.
