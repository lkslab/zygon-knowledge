id: grid-forming-inverters
title: "Grid-forming inverters"
rank: 72
question: >
  Do we need grid-forming (rather than grid-following) inverters as
  renewables displace synchronous machines — how much, where, and what is the
  cost premium worth? Live in AEMO/NREL system-strength work and every
  100%-renewables debate.
when_to_use:
  - "grid-forming vs grid-following inverters"
  - "synthetic / virtual inertia from batteries"
  - "system strength at high inverter shares"
  - "minimum grid-forming capacity requirement"
  - "cost premium of grid-forming capability"
recipes:
  generation_conversion: [grid-forming-inverters, synchronous-condensers,
                          grid-scale-batteries, utility-scale-solar-pv]
  demand: [electricity-load]
functionality:
  - id: inertia-stability
    role: "absent — no frequency dynamics, RoCoF, or system-strength metric anywhere"
  - id: operational-reserves
    role: "nearest proxy: static headroom constraint, no converter behaviour"
  - id: country-carrier-capacity-limits
    role: "CCL could force a floor of a grid-forming-labelled carrier per country"
  - id: bau-minimum-capacities
    role: "system-wide per-carrier floors — the other blunt stand-in for a GFM mandate"
  - id: carrier-attribute-scaling
    role: "cost premium sensitivity (e.g. battery+c1.1) — a price, not a behaviour"
gap_assessment: >
  Not representable. The model is a linear capacity-expansion / LOPF LP with
  no dynamics below the snapshot: inverters exist only implicitly inside
  generator and storage cost rows, with no distinction between grid-forming
  and grid-following control, no inertia accounting, and no system-strength
  constraint (the grid-forming-inverters recipe documents the same hole
  tech-side, as does synchronous-condensers). What can be done today is a
  cost-side gesture: add a capital-cost premium for GFM-capable assets and
  impose capacity floors via CCL/BAU as an exogenous mandate — the LP will
  price the mandate but cannot value the stability service that justifies
  it. A minimum grid-forming-share constraint per snapshot is an L5 custom
  constraint in solve_network's extra_functionality; actual inverter
  dynamics (EMT/RMS) need an external stability tool fed by the LP dispatch.
  Verdict: gap — the topic's core question cannot be answered here.
coverage: gap
