id: high-resolution-spatial-modelling
title: High-resolution spatial modelling
rank: 89
question: >
  How finely can the model resolve space — real substations and lines instead
  of copper-plate zones, siting-relevant renewable profiles, admin-unit
  results — and where does resolution stop paying? The counterpoint to the
  tractability topic: what detail is actually available.
when_to_use:
  - "model [country] at substation / full-grid resolution"
  - "nodal results instead of zonal averages"
  - "siting-relevant renewable profiles per node"
  - "results per province / admin unit"
  - "how many clusters do I need for this question"
recipes:
  generation_conversion: [hv-transmission-lines, utility-scale-solar-pv,
                          onshore-wind]
  demand: [demand-spatial-disaggregation, electricity-load]
functionality:
  - id: spatial-clustering
    role: "core — the full OSM-derived HV topology is the ceiling; cluster down from it, profiles re-aggregated consistently"
  - id: gadm-admin-clustering
    role: "resolve to admin units when the audience thinks in provinces, not clusters"
  - id: custom-busmap
    role: "arbitrary user-defined zonal maps for bespoke study geometries"
  - id: weather-year-selection
    role: "profile resolution is set upstream by cutout dx/dy (~0.25 deg ERA5), not by bus count"
  - id: distribution-grid-lv
    role: "below-HV is one stylized LV bus per node with linear cost — not a feeder model"
  - id: distribution-power-flow
    role: "true distribution-level resolution is out of scope entirely"
gap_assessment: >
  Ready, with a clear ceiling and floor. Ceiling: the base network is the real
  OSM-derived HV grid — thousands of substations and lines for a large
  country — and simpl/clusters lets you run anywhere between that and a
  one-node country, with renewable profiles, demand disaggregation
  (WorldPop/GDP weighting), and the plant fleet re-aggregated consistently at
  every level; admin-unit (GADM) and custom zonings cover the
  policy-reporting geometries. Two honest caveats: resolution of the
  *profiles* is bounded by the cutout grid (~0.25 degree ERA5 cells and
  land-availability rasters), so adding buses beyond weather-cell density
  refines the network, not the resource signal; and RAM/solve cost grows fast
  with bus count (see solver-speed-scalability) — full-topology
  capacity-expansion runs for large countries are expensive, so the standard
  move is full resolution for network truth, clustered for optimization.
  Floor: nothing below the HV grid — distribution is a cost proxy, and OSM
  grid completeness varies by country (check the data_quality osm-grid
  scorecard before trusting substation-level detail).
coverage: ready
models:
  - model: pypsa-earth
