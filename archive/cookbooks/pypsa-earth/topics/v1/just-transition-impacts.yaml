id: just-transition-impacts
title: Just transition impacts
rank: 94
question: >
  What happens to fossil-dependent regions and workers as plants close —
  which regions are exposed, on what timeline, and what replacement
  investment arrives? Central to JETP-style deals, EU Just Transition Fund
  territories, and coal-region politics everywhere.
when_to_use:
  - "regional impact of coal phase-out"
  - "jobs and communities in the transition"
  - "which regions lose plants, which gain build"
  - "timing of closures vs replacement investment"
  - "just transition plan evidence base"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants]
  demand: [demand-scenarios-and-growth]
functionality:
  - id: fleet-retirement-filter
    role: "retirement timing scenarios via DateIn/DateOut queries on the plant fleet"
  - id: country-carrier-capacity-limits
    role: "phase-out caps/floors per country (CCL) to encode policy commitments"
  - id: myopic-foresight
    role: "sequential horizons show WHEN closures and replacement build happen"
  - id: gadm-admin-clustering
    role: "results on admin regions — which provinces lose plants / gain investment"
  - id: nodal-marginal-prices
    role: "regional price effects of closures"
  - id: financial-viability-actors
    role: "the missing layer — no employment, revenue, or actor-level accounting"
gap_assessment: >
  The model computes the asset-side shadow of a just-transition question:
  which plants retire when (powerplants_filter dates, CCL phase-out caps,
  myopic pathway runs with brownfield ageing), where replacement capacity
  and grid investment land, and how regional prices shift — all reportable
  per GADM admin unit. The social content is absent: no employment or
  labour-market layer, no wage/skill data, no local fiscal impacts, no
  socioeconomic satellite accounts of any kind, and no actor-level finance
  (financial-viability-actors is absent). Job impacts therefore mean
  post-processing: apply external employment factors (jobs per MW or per
  TWh, by technology and phase) to the model's capacity and generation
  deltas per region and scenario. The model's real contribution is a
  spatially explicit, internally consistent closure-and-buildout timeline to
  hang that analysis on — not the impact assessment itself.
coverage: gap
models:
  - model: pypsa-earth
