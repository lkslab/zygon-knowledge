gap_assessment: >
  Industrial DSM does not exist in pypsa-earth: every industrial load is a
  fixed exogenous profile, demand-elasticity is absent, and the only
  endogenous demand flexibility anywhere in the model is the EV fleet
  (bev-dsm-v2g). There is no store-plus-link "shiftable industrial load"
  construct wired in. Two honest workarounds: (1) new flexible CONVERSION
  loads are endogenous — electrolysers and (per its recipe) desalination
  dispatch freely against the system, so hydrogen/water flexibility is
  modellable even though existing-process flexibility is not; (2) shifting
  can be hand-built by replacing a load with a bus + store + link with
  energy-conservation over a window, but that is PyPSA surgery, not config.
  The model does tell you the value on offer: nodal price spreads and
  peak-hour duals bound what a shiftable MWh would earn. For "how much DSM
  does industry offer this system," the potential itself must come from
  outside the model.
coverage: gap
