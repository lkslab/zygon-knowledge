id: multi-year-weather-variability
title: Multi-year weather variability
rank: 25
question: >
  Is the plan robust across weather years, not just the one it was optimized
  for? Inter-annual wind/solar/hydro/demand variability drives adequacy risk
  (Dunkelflaute years, drought years) — the field's standard critique of
  single-weather-year capacity expansion.
when_to_use:
  - "results across multiple weather years"
  - "is 2013 a representative weather year"
  - "inter-annual variability of wind / solar / hydro"
  - "stress-test the plan against a bad weather year"
  - "drought year / low-wind year sensitivity"
recipes:
  generation_conversion: [onshore-wind, utility-scale-solar-pv, conventional-hydropower, offshore-wind]
  demand: [demand-temporal-profiles, electricity-load]
functionality:
  - id: multi-weather-year
    role: "the core ask — several weather years inside ONE optimization — is absent"
  - id: weather-year-selection
    role: "the lever that exists: pick cutout year + demand weather year per run"
  - id: scenario-matrix
    role: "the workaround: one run per weather year via scenario lists, compare ex post"
  - id: hydro-inflow-normalization
    role: "hydro-year scenarios via IRENA/EIA normalization year and multiplier"
  - id: probabilistic-adequacy
    role: "no LOLE/EUE across year distributions — absent"
  - id: load-shedding-voll
    role: "per-year unserved energy is the stress-test metric in re-dispatch runs"
  - id: monte-carlo-sampling
    role: "perturbs profiles statistically — a sampler, not true historical years"
gap_assessment: >
  Half there. Each run is locked to one weather year (cutout, renewable
  profiles, hydro inflow, temperature-driven demand all follow it), and
  nothing in the workflow co-optimizes over several years or weights year
  probabilities — so "capacity mix robust across 40 years" cannot be asked in
  one solve. The workable pattern is a two-step: (1) sweep weather years as
  scenarios (separate cutouts per year, weather_year in load_options,
  hydro normalization year) and compare optimal designs; (2) fix the design
  from a reference year and re-dispatch it against other years with VOLL load
  shedding to expose adequacy gaps — but step 2 itself needs assembly, since
  there is no dispatch-only rule (operations-only-solve is absent: set
  extendable false by hand). Mind the mechanics: multi-year ERA5 cutouts must
  be built per year, and demand weather year and cutout year must be chosen
  consistently or profiles silently mismatch. TSAM segmentation preserves
  extremes within a year, not across years.
coverage: partial
