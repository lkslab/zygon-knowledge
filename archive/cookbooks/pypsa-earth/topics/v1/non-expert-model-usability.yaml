id: non-expert-model-usability
title: Non-expert model usability
rank: 92
question: >
  Can an analyst, policymaker, or corporate user who is not an energy-system
  modeller actually run a study? The loudest cross-cutting methodological
  pain: powerful open models (PyPSA, TIMES, oemof) are expert-only, and the
  latent demand for making them accessible is huge.
when_to_use:
  - "can a non-modeller run this"
  - "how steep is the learning curve"
  - "GUI / no-code interface to the model"
  - "what can go wrong for a first-time user"
  - "hand the model to a policy analyst"
