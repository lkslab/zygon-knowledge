gap_assessment: >
  The workflow is expert-only: it assumes a working conda/snakemake
  environment, a config.default.yaml with hundreds of keys and no schema
  validation, a wildcard grammar (simpl/clusters/ll/opts) that must be
  internalised, and data-retrieval steps that fail in ways only a modeller
  can debug. There is no GUI, no guided setup, no config linting — an
  invalid key combination surfaces as a stack trace deep in the DAG. The
  honest mitigations: everything for a standard study is config-driven (a
  supported non-expert edits yaml, never code), the tutorial config gives a
  small known-good starting point, and these cookbooks exist precisely to
  pin which keys answer which question. Realistic bar today: a technical
  analyst with occasional expert support can run and adapt studies; a
  policymaker cannot operate the model unassisted. Closing that gap is an
  interface-layer product on top of the model, not a config change.
coverage: gap
