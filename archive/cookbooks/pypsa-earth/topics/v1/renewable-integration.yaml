id: renewable-integration
title: Renewable integration
rank: 8
question: >
  How do we integrate variable wind and solar without breaking reliability
  or the budget — what mix, storage, and grid absorbs a given VRE share,
  how much curtailment is optimal, and where do the integration costs
  actually bite? The foundational topic of the whole field.
when_to_use:
  - "can the system handle X% wind and solar"
  - "integration cost of renewables"
  - "optimal curtailment vs storage vs overbuild"
  - "what does a high-VRE system look like hourly"
  - "renewables target feasibility study"
recipes:
  generation_conversion: [utility-scale-solar-pv, onshore-wind, offshore-wind,
                          run-of-river-hydro, grid-scale-batteries, gas-power-plants]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: weather-year-selection
    role: "atlite cutout year drives all VRE profiles and hydro inflow"
  - id: temporal-resolution-nh
    role: "hourly chronology is the point — average with care"
  - id: spatial-clustering
    role: "resource diversity and grid bottlenecks vs solve time"
  - id: hydro-inflow-normalization
    role: "calibrated hydro is the swing integrator in many countries"
  - id: carrier-attribute-scaling
    role: "sweep VRE cost/potential (solar+c0.5, onwind+p2) in opts"
  - id: summary-outputs
    role: "curtailment by carrier is a standard summary output"
  - id: multi-weather-year
    role: "inter-annual VRE variability in one solve — absent"
  - id: inertia-stability
    role: "frequency/stability limits of VRE shares — absent"
gap_assessment: >
  The home turf: weather-consistent wind/solar/hydro profiles from atlite
  on any cutout, hourly co-optimization of VRE, storage, dispatchables, and
  grid, with curtailment, shadow prices, and cost breakdowns reported per
  run — the standard "what does X% VRE cost and require" study is the
  default workflow. The gaps are the classic energy-model blind spots, and
  worth stating to any reliability-minded audience: one weather year per
  solve (inter-annual variability and 1-in-10 stress years only via
  sweeps); adequacy is deterministic (see the resource-adequacy card); and
  nothing below the hourly energy balance exists — no inertia, frequency
  response, or grid-forming constraints, so very high instantaneous VRE
  shares are unchallenged by the physics that actually limits them.
  Resource data is globally consistent (ERA5/SARAH), but validate profiles
  against measured capacity factors where the data_quality climate grade is
  weak, and treat hydro-heavy systems with extra care via the inflow
  normalization year.
coverage: ready
