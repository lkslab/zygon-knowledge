id: robust-decision-making
title: Robust decision-making
rank: 85
question: >
  Which investments hold up across many plausible futures — low-regret builds,
  stress-tested plans, decisions that do not hinge on one demand forecast or
  fuel-price path? The planner's version of the uncertainty question: not
  "what is optimal" but "what won't we regret".
when_to_use:
  - "low-regret / no-regret investment identification"
  - "stress-test the plan across demand and price futures"
  - "which builds are robust across scenarios"
  - "min-max regret or RDM-style analysis"
  - "adaptive pathway / decision under deep uncertainty"
recipes:
  generation_conversion: []
  demand: [demand-scenarios-and-growth]
functionality:
  - id: scenario-matrix
    role: "core workhorse — cartesian scenario lists give the ensemble of futures"
  - id: monte-carlo-sampling
    role: "sampled futures (LHS over loads/costs/CFs) when the axes are continuous"
  - id: carrier-attribute-scaling
    role: "fuel-price / cost / potential axes of the ensemble as opts tokens"
  - id: summary-outputs
    role: "per-run cost and capacity tables — the raw material for regret metrics"
  - id: mga-near-optimal
    role: "robustness inside one future (near-optimal overlap) is absent"
  - id: multi-weather-year
    role: "weather stress only as separate runs; no stochastic program over years"
gap_assessment: >
  pypsa-earth generates the ensemble but does not analyse it: scenario lists
  and monte-carlo sampling will happily produce hundreds of solved futures
  across demand growth, fuel prices, cost trajectories, and weather years,
  each with full summaries — everything a regret analysis consumes. There is
  no formal RDM layer on top: no regret computation, no scenario-discovery /
  PRIM-style vulnerability search, no decision trees or adaptive pathways, no
  two-stage stochastic optimization (every run commits to its future with
  perfect foresight), and no near-optimal-space intersection across futures
  since MGA is absent. The honest workflow today is deterministic-ensemble +
  pandas: compute min-max regret or capacity-overlap ("built in every future")
  from the per-run summary csvs yourself. That identifies robust builds
  credibly for report purposes, but the decision-theoretic machinery the RDM
  literature means by the term is post-processing you write, not model
  functionality.
coverage: partial
models:
  - model: pypsa-earth
