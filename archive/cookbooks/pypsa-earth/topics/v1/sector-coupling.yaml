id: sector-coupling
title: "Sector coupling"
rank: 18
question: >
  Where should scarce green electrons go — direct electrification vs
  hydrogen vs synthetic fuels — and how do heat, transport, and industry
  demands reshape the optimal power system? Not a topic so much as the lens:
  PyPSA-Eur, TIMES, and TYNDP scenarios are all sector-coupled by design.
when_to_use:
  - "whole-energy-system / multi-sector optimization"
  - "electrification vs hydrogen vs e-fuels competition"
  - "how heat and transport demand reshape the power system"
  - "value of coupling: shared flexibility, avoided infrastructure"
  - "national energy (not just electricity) planning"
recipes:
  generation_conversion: [air-source-heat-pumps, electrolysers,
                          battery-electric-cars, district-heating,
                          green-hydrogen, e-diesel-fischer-tropsch]
  demand: [residential-space-heating-demand, land-transport-demand,
           industrial-crosscutting-electricity, services-heat-demand,
           shipping-demand, aviation-demand]
functionality:
  - id: sector-coupled-workflow
    role: "core — electricity + heat + land transport + industry + shipping/aviation + H2/fuels in one network"
  - id: bev-dsm-v2g
    role: "transport coupling contributes flexibility back, not just load"
  - id: h2-pipeline-routing
    role: "hydrogen as the inter-sector and spatial carrier, greenfield or repurposed gas routes"
  - id: co2-network-sequestration
    role: "captured-carbon accounting, DAC, and sequestration close the e-fuel loop"
  - id: h2-export-chain
    role: "export demand couples the domestic system to fuel markets"
  - id: distribution-grid-lv
    role: "LV cost proxy where rooftop PV, EVs, and heat pumps land"
  - id: myopic-foresight
    role: "sector pathways over planning horizons with brownfield carry-forward"
  - id: temporal-resolution-nh
    role: "sopts resolution — sector runs usually need coarsening to stay tractable"
gap_assessment: >
  This is the model's headline: the sector chain builds one optimization
  spanning electricity, heating (urban/rural, district heat, CHP), land
  transport, industry, shipping, aviation, and the H2/e-fuel layer, with
  demands from the demand book and cross-sector competition for electrons
  resolved endogenously — the canonical "where do green electrons go" study
  is the default sector run. Caveats within a ready verdict: global-south
  demand data (GEGIS-based, SSP-scaled) is coarser than European inputs and
  worth checking against the relevant demand recipes; several couplings are
  simplified (fixed-ratio CHP, no methane network Links, heat DSM exogenous
  — see chp-operation-constraints and gas-network-links); and sector runs
  are computationally heavy, so temporal coarsening via sopts is usually
  needed. The myopic pathway mode is less battle-tested than overnight.
coverage: ready
