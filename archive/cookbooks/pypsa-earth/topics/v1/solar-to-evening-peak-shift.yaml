gap_assessment: >
  Bread-and-butter coverage: hourly dispatch plus investment co-optimization is
  exactly this problem. Batteries are modelled with independent power (MW) and
  energy (MWh) decisions, so optimal duration — the 4-hour question — is an
  output, not an assumption, and pumped hydro plus demand shifting compete in
  the same solve; curtailment, storage cycling, and evening price spikes all
  fall out of standard outputs. Practical watch-items rather than gaps:
  (1) keep temporal resolution fine enough (hourly or TSAM), since nH
  averaging flattens the exact ramp being studied; (2) the power-only chain's
  scaled historical load shape understates future AC-driven evening peaks —
  use sector-chain cooling demand for India-style studies; (3) no sub-hourly
  dynamics or ancillary products, so fast-ramp value beyond hourly energy
  arbitrage is unpriced (market-design-mechanisms absent). Storage cost
  trajectories come from the technology-data tables — pin the cost year
  deliberately, as it dominates the answer.
