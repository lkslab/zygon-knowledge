id: stranded-asset-risk
title: Stranded-asset risk
rank: 68
question: >
  Which fossil assets — plants, pipelines, new gas builds — end up
  underutilized or retired before recovering their capital as targets
  tighten, and what does building them anyway cost? The finance-side lens
  on transition pathways: investors, JETP negotiators, and regulators ask.
when_to_use:
  - "stranding risk of a new gas plant"
  - "which coal assets retire before end of life"
  - "utilization decline of fossil fleet along a pathway"
  - "cost of overbuilding fossil capacity now"
  - "lock-in from investments made this decade"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants,
                          oil-power-plants, natural-gas-pipelines]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: myopic-foresight
    role: "core — sequential horizons show assets built early going idle later"
  - id: existing-baseyear-brownfield
    role: "seeds today's fleet with build years so ageing and stranding are visible"
  - id: fleet-retirement-filter
    role: "DateIn/DateOut queries force early-retirement counterfactuals"
  - id: co2-cap
    role: "the tightening budget that does the stranding"
  - id: discount-rate-dimension
    role: "stranding is a discounting question; one system rate, kept consistent by hand"
  - id: financial-viability-actors
    role: "absent — no owner balance sheets, so 'stranded value' needs post-processing"
  - id: scenario-matrix
    role: "stranding is scenario-contingent — sweep targets and demand paths"
gap_assessment: >
  The physical half works, the financial half is post-processing. With the
  sector chain in myopic foresight, existing fleets carry build years,
  capacities carry forward and age between planning horizons, and a
  tightening CO2 budget visibly strands assets: capacity factors collapse,
  plants retire at or before lifetime, and comparing pathways with/without
  a new asset (forced in via p_nom_min or custom_powerplants) prices the
  lock-in. Caveats: the myopic chain is the model's less battle-tested
  path — brownfield carry-forward is partial machinery and the heating
  brownfield call is disabled — so validate the base-year fleet before
  trusting retirement dates. And there is no financial layer: the model
  reports utilization and system cost, not book value, remaining debt, or
  who eats the write-down — stranded-VALUE numbers mean combining model
  capacity factors with off-model asset financials, and the single
  social-planner discount rate stands in for every owner's WACC. Overnight
  runs at several target years are a cruder but sturdier alternative.
coverage: partial
