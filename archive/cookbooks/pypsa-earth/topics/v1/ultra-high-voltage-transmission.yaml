id: ultra-high-voltage-transmission
title: Ultra-high-voltage transmission
rank: 51
question: >
  What is the system value of UHV DC corridors (±800 kV and above) moving bulk
  power over thousands of km — China's west-to-east transfers being the
  archetype — and where do such corridors beat local generation plus storage?
when_to_use:
  - "model an 800 kV / 1100 kV UHVDC corridor"
  - "China-style west-to-east bulk power transfer"
  - "value of a long-distance DC backbone"
  - "UHV vs local renewables + storage"
  - "existing UHV lines from OSM in the base grid"
recipes:
  generation_conversion: [uhv-dc, hvdc-interconnectors, hv-transmission-lines]
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: hvdc-as-lines
    role: "DC assets enter as controllable Links (default) or as Lines — Links are the right frame for point-to-point UHV corridors"
  - id: transmission-expansion-limits
    role: "corridor capacity co-optimized against generation/storage under lv/lc bounds — the value-of-UHV study"
  - id: iterative-impedance-expansion
    role: "keeps AC-side impedances consistent as the surrounding grid grows with the corridor"
  - id: spatial-clustering
    role: "continental-scale runs need aggressive clustering; keep corridor endpoints in separate zones or the corridor vanishes"
  - id: augmented-line-connection
    role: "the only built-in path to candidate DC corridors beyond existing OSM topology (k-edge, off by default)"
  - id: autarky
    role: "ATK/ATKc counterfactual isolates what the corridor is worth"
  - id: carrier-attribute-scaling
    role: "DC+c sweeps for corridor cost sensitivity"
gap_assessment: >
  The bulk-transfer study works: existing DC lines come in from OSM, become
  extendable Links, and are co-optimized against generation and storage — so
  "corridor vs local build" answers come out of the standard workflow. What is
  missing is UHV fidelity: the voltage ladder tops out at 750 kV and
  lines.dc_types has a single 500 kV entry, so a real ±800 kV line is snapped
  to the 500 kV type and derives its rating from that type's ampacity
  (see the uhv-dc recipe). Config-level fixes exist — add the voltage class
  and map it to a higher pypsa type — but a true UHV line type and
  UHV-specific cost rows must be added by hand (only generic HVDC
  overhead/submarine/inverter rows ship), and a greenfield UHV corridor as a
  named investment candidate needs code (the augmented-line-connection k-edge
  machinery proposes candidates by topology, not by project list). OSM
  voltage tagging quality on UHV corridors (mainly CN/IN/BR) varies — check
  the data_quality scorecard (osm-grid) for the study region.
coverage: ready
models:
  - model: pypsa-earth
