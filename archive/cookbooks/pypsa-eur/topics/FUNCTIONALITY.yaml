# Functionality registry for the topics cookbook (pypsa-eur).
# Model CAPABILITIES (analysis machinery, not technologies/demands/data) that
# topic cards reference by id. Consumer symbols are grep-verified against the
# repo at version anchor 849c8858 (2026-07-22).
# status: working   — wired and exercised by the standard workflow
#         partial   — exists but limited/off-by-default/needs assembly
#         dead-key  — config surface exists but no code consumes it (or wiring is broken)
#         absent    — not in the model at all (note names the nearest workaround)

# ---------- temporal machinery ----------
- id: temporal-resolution-nh
  title: "Temporal averaging (nH resolution)"
  status: working
  surface: "clustering.temporal.resolution_elec/_sector; opts token like 3h/24h; sector also nsn (every n-th snapshot)"
  consumer: "scripts/prepare_network.py:average_every_nhours; scripts/prepare_sector_network.py:set_temporal_aggregation"
  note: "resamples all time series to n-hour means; sector chain additionally supports representative-snapshot thinning via the 'sn' suffix"

- id: time-segmentation-tsam
  title: "Time-series segmentation (nSEG, TSAM)"
  status: working
  surface: "opts token like 4380seg -> clustering.temporal.resolution_elec"
  consumer: "scripts/prepare_network.py:apply_time_segmentation"
  note: "adaptive segments preserve extremes better than uniform averaging; needs tsam package; sector chain re-applies elec snapshot weightings"

- id: weather-year-selection
  title: "Weather year / snapshot window selection"
  status: working
  surface: "snapshots.start/end; atlite.default_cutout; atlite.cutouts (europe-1940-2024-era5 spans 85 years)"
  consumer: "rules/common.smk:input_cutout; scripts/_helpers.py:get_snapshots"
  note: "any ERA5 weather year 1940-2024 selectable by moving the snapshot window; SARAH-based solar only for cutout years that include influx"

- id: multi-weather-year
  title: "Multi-year weather in ONE optimization"
  status: partial
  surface: "snapshots spanning >1 year; list of cutouts concatenated along time"
  consumer: "scripts/_helpers.py:load_cutout"
  note: "load_cutout concatenates multiple cutout files on the time axis and Nyears scaling exists in prepare_network, but the standard workflow runs one year; no probabilistic multi-year adequacy metrics"

- id: sub-hourly-resolution
  title: "Sub-hourly temporal resolution"
  status: absent
  surface: "—"
  note: "hourly floor from ERA5/demand profiles (get_snapshots freq='h'); temporal-resolution-nh only coarsens — nearest: post-hoc balancing proxies via operational-reserves"

- id: rolling-horizon-dispatch
  title: "Rolling-horizon optimization"
  status: working
  surface: "solving.options.rolling_horizon (default false); solving.options.horizon/overlap"
  consumer: "scripts/solve_network.py:optimize_with_rolling_horizon"
  note: "splits the solve into sequential windows (cyclic storage disabled); pairs with operations-only-solve for production-cost-style runs"

# ---------- foresight & pathways ----------
- id: overnight-foresight
