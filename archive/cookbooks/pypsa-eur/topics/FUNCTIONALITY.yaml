# ---------- wildcard & scenario grammar ----------
- id: wildcard-opts-grammar
  title: "opts / sector_opts token grammar"
  status: working
  surface: "opts: nH/nseg, Co2L, CH4L, Ep/Ept, ATK[c], carrier+p/e/c/m, lv/lc; sector_opts: T/H/B/I/A, CCL, EQ, BAU, SAFE, nH/nsn/nseg, decentral, noH2network, nowasteheat, nodistrict, dist, biomasstransport, linemaxext, Co2L, cb (carbon budget), sdr, seq, carrier+attr, CF+"
  consumer: "scripts/_helpers.py:update_config_from_wildcards"
  note: "every token is sugar that rewrites config keys before rules read them; the simpl and ll wildcards of older releases are GONE (scenario has only clusters/opts/sector_opts/planning_horizons)"

- id: cf-config-injection
  title: "Arbitrary config override from wildcard (CF+)"
  status: working
  surface: "sector_opts token CF+<section>+<key>+<value>"
  consumer: "scripts/_helpers.py:update_config"
  note: "'any config option can be represented in wildcard' — the escape hatch when no dedicated token exists"

- id: scenario-matrix
  title: "Scenario management & cartesian run matrix"
  status: working
  surface: "run.{prefix,name}; run.scenarios.{enable,file}; config/create_scenarios.py; scenario.{clusters,opts,sector_opts,planning_horizons}"
  consumer: "Snakefile:get_scenarios; rules/common.smk:scenario_config"
  note: "scenario yaml files are per-run config overrides expanded via the run wildcard; scenario lists expand combinatorially — the workhorse for sweeps"

- id: shared-resources-caching
  title: "Shared-resources caching across runs"
  status: working
  surface: "run.shared_resources.{policy: false|true|base|<dirname>, exclude}"
  consumer: "scripts/_helpers.py:get_run_path"
  note: "wildcard-independent inputs (shapes, cutout-derived data) can be shared between scenario runs to avoid recomputation"

- id: config-schema-validation
  title: "Config schema validation (pydantic)"
  status: working
  surface: "config/schema.default.json; scripts/lib/validation"
  consumer: "Snakefile:validate_config"
  note: "the full config (and every scenario override) is validated against a typed schema at workflow start — typos fail fast; a capability pypsa-earth lacks"

