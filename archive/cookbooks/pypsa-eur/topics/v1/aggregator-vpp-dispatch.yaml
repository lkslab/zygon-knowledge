id: aggregator-vpp-dispatch
title: "Aggregator / VPP dispatch"
rank: 61
question: >
  How should an aggregator dispatch a portfolio of distributed assets —
  batteries, EVs, rooftop PV, flexible loads — against prices, and what is
  that portfolio worth? The commercial core of the flexibility wedge:
  aggregators and VPP startups are among the strongest buyers of modelling.
when_to_use:
  - "dispatch strategy for a VPP portfolio"
  - "what is our aggregated DER fleet worth"
  - "aggregator bidding / portfolio optimization"
  - "VPP participation in energy or balancing markets"
  - "value of aggregating small assets vs standalone"
recipes:
  generation_conversion: [virtual-power-plants, behind-the-meter-der,
                          grid-scale-batteries, vehicle-to-grid, smart-meters]
  demand: [electricity-load, demand-temporal-profiles, building-heat-dsm]
functionality:
  - id: market-design-mechanisms
    role: "the missing core — no bids, no products, no actor who dispatches a portfolio"
  - id: nodal-marginal-prices
    role: "system duals (plus the market_values summary table) give the price series a price-taking VPP would face"
  - id: distribution-grid-lv
    role: "DERs sit on stylized LV buses with linear reinforcement cost — no feeder constraints on aggregation"
  - id: bev-dsm-v2g
    role: "EV fleets are an endogenously flexible distributed asset the planner dispatches"
  - id: residential-heat-dsm
    role: "building thermal inertia as shiftable load — a second flexible DER class earth lacks"
  - id: demand-elasticity
    role: "no tariff-responsive loads to aggregate — remaining profiles are fixed"
  - id: operational-reserves
    role: "reserves are a system constraint, not a product a VPP can sell into"
  - id: operations-only-solve
    role: "dispatch-only re-solves give price series from a fixed system to feed a downstream portfolio model"
gap_assessment: >
  Not a VPP tool. pypsa-eur has exactly one decision-maker — the social
  planner — so there is no aggregator entity, no portfolio, no bidding, no
  capacity or ancillary products, and no revenue capture. What it does
  provide is a richer system envelope than pypsa-earth: hourly nodal (or
  zonal, via administrative clustering) prices from duals, and
  system-optimal dispatch of MORE of the asset classes a VPP aggregates —
  batteries, EV fleets via bev-dsm-v2g, rooftop PV and home batteries on
  the LV bus, and residential heat DSM within comfort bands. That answers
  "how much distributed flexibility does the system want and when is it
  dispatched" — an upper bound on aggregate VPP value — not "what does my
  portfolio earn under this tariff." Actor-level dispatch against extracted
  prices (operations-only runs are a clean price source) is a downstream
  model the user must build; sub-hourly and balancing revenues remain
  invisible on top of that, since the hourly floor and absent market layer
  hide the products VPPs actually trade.
coverage: gap
