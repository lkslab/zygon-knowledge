id: ai-assisted-scenario-generation
title: AI-assisted scenario generation
rank: 91
question: >
  Can an AI layer generate, launch, and interpret model scenarios — natural
  language in, runs and narrated results out? Part of the very-high-demand
  methodological cluster: the community openly wants better tooling and UX
  around powerful but expert-only models.
when_to_use:
  - "drive the model with an LLM / agent"
  - "auto-generate scenario ensembles from a question"
  - "natural-language interface to the model"
  - "automated sensitivity discovery"
  - "batch scenario pipelines an agent can operate"
recipes:
  generation_conversion: []
  demand: []
functionality:
  - id: scenario-matrix
    role: "the substrate — run.scenarios yaml files are per-run config overrides an agent writes, plus config/create_scenarios.py for programmatic enumeration"
  - id: config-schema-validation
    role: "the pydantic schema validates every config and scenario override at workflow start — an agent's outputs are machine-checked before any compute is spent"
  - id: wildcard-opts-grammar
    role: "compact machine-writable token grammar (Co2L, Ep/Ept, nH, carrier+c...) for one-token sensitivities"
  - id: cf-config-injection
    role: "CF+<section>+<key>+<value> exposes ANY config key through the wildcard — the agent's escape hatch when no token exists"
  - id: carrier-attribute-scaling
    role: "cost/potential sweeps as tokens or adjustments blocks, no code"
  - id: summary-outputs
    role: "flat csv summaries (metrics, prices, balances) are the machine-readable result surface an agent reads back"
  - id: global-summary
    role: "cross-scenario concatenated csvs — ensemble results in one table"
  - id: workflow-reproducibility
    role: "full config stored in n.meta + pinned data versions — run provenance an agent can audit"
  - id: monte-carlo-sampling
    role: "absent — no built-in sampling fan-out (pypsa-earth has one); automated draws mean generating scenario files externally"
gap_assessment: >
  There is no AI anywhere in the model: no natural-language interface, no
  automated scenario suggestion, no result narration, no learning across
  runs. What exists is an unusually automation-friendly substrate — better
  than pypsa-earth's: the whole study is declared in config plus per-run
  scenario yaml files, every config is validated against a typed pydantic
  schema at workflow start (typos fail fast instead of deep in the DAG),
  create_scenarios.py is a shipped hook for programmatic ensemble
  generation, and results land as flat csvs with the full config embedded
  in each solved network for provenance. An external agent that writes
  configs, launches snakemake, and reads summaries gets the full model
  surface without touching Python; this cookbook (topics -> recipes ->
  functionality -> verified config keys) is itself the machine-readable
  interface such an agent needs. What eur gives up vs earth is the built-in
  monte-carlo fan-out — automated parameter draws must be enumerated as
  scenario files. The remaining blockers an agent inherits are the model's:
  multi-hour solves preclude tight interaction loops, and there is no run
  database — provenance across large ensembles is directory naming plus
  n.meta.
coverage: gap
