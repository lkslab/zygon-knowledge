id: blue-hydrogen-economics
title: Blue hydrogen economics
rank: 58
question: >
  When does gas-with-capture hydrogen beat green electrolysis — at what gas
  price, capture cost, and CO2 constraint — and what does enforcing a blue
  share of hydrogen supply cost? Central to "molecules vs electrons" import
  and industrial-hydrogen strategies.
when_to_use:
  - "blue vs green hydrogen breakeven"
  - "SMR with CCS economics (steam methane reforming)"
  - "grey/blue/green hydrogen supply mix"
  - "gas price sensitivity of hydrogen cost"
  - "blue hydrogen vs imported hydrogen"
recipes:
  generation_conversion: [blue-hydrogen, green-hydrogen, electrolysers,
                          fossil-fuel-supply, natural-gas-pipelines,
                          green-energy-imports]
  demand: [hydrogen-export-demand]
functionality:
  - id: gas-network-links
    role: "core differentiator — SMR draws on the REAL entry-point-limited gas system (SciGRID pipelines, LNG/production entries), so gas-delivery constraints can bind on blue H2 siting"
  - id: co2-network-sequestration
    role: "SMR CC's captured CO2 flows into the full chain: CO2 pipelines, regional sequestration potentials, injection cost"
  - id: co2-sequestration-limit
    role: "the annual injection cap is the ultimate sink limiting how much SMR CC capture is worth"
  - id: gas-usage-limit
    role: "CH4L caps the gas budget blue hydrogen draws on"
  - id: emission-pricing
    role: "CO2-price sweeps move the blue/green breakeven"
  - id: green-energy-imports
    role: "priced H2/NH3 import routes — the third competitor next to domestic blue and green"
  - id: scenario-matrix
    role: "gas-price / CO2-price / capex sweeps across the run matrix"
  - id: custom-constraint-hook
    role: "no colour accounting exists — enforcing a blue (or clean) share of H2 supply needs a bespoke constraint here"
  - id: h2-export-chain
    role: "absent — export-strategy framings (earth's h2export wildcard) have no eur counterpart; exports = custom loads"
  - id: carrier-attribute-scaling
    role: "capture-capex and electrolyser-capex sensitivity as adjustments"
gap_assessment: >
  Ready for the breakeven economics, with a different caveat profile than
  pypsa-earth. Grey "SMR" and blue "SMR CC" are default-on extendable links
  at every node, competing head-on with electrolysis on the same H2 buses —
  and two things earth cannot do are structural here: the gas input is the
  REAL gas network (entry-point-limited supply, pipeline capacities, biogas
  blending), so gas-delivery bottlenecks genuinely bind; and captured CO2
  enters a regionalized sequestration chain whose annual injection cap
  disciplines how much blue capacity is worth building. Priced H2/NH3 imports
  add the third competitor. What earth has and eur lacks: hydrogen colour
  accounting — there are no colour buses and no enforceable blue/pink share
  constraint, so "mandate X% blue" is custom-constraint work, and the
  grey/blue/green split is read from link dispatch instead; likewise no
  export demand chain (export strategies need hand-added loads). Shared
  caveats: no upstream methane (fugitive) supply-chain emissions — the crux
  of the blue-hydrogen climate debate — only combustion/process CO2; one
  shared capture rate (sector.cc_fraction, effectively SMR-specific at
  defaults); no ATR or pyrolysis routes; no brownfield existing SMR fleet.
coverage: ready
