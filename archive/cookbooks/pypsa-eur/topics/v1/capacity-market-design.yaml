id: capacity-market-design
title: "Capacity market design"
rank: 17
question: >
  How should firm capacity be remunerated — capacity markets, strategic
  reserves, reliability options — and what would each design procure at what
  cost? Regulators and utilities across the EU, GB, and emerging markets ask
  this as energy-only revenues thin out at high VRE shares.
when_to_use:
  - "capacity market vs energy-only vs strategic reserve"
  - "what would a capacity auction procure / clear at"
  - "missing-money problem for firm capacity"
  - "derating factors for storage and VRE in capacity markets"
  - "capacity remuneration mechanism design"
recipes:
  generation_conversion: [gas-power-plants, grid-scale-batteries,
                          stationary-fuel-cells]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: market-design-mechanisms
    role: "core capability for this topic — absent: no capacity remuneration, bids, or auction clearing"
  - id: safe-reserve-margin
    role: "nearest proxy — SAFE forces firm capacity >= (1+margin) x peak, but electricity.SAFE_reservemargin must be added to config by hand at this ref"
  - id: operational-reserves
    role: "second proxy — hourly reserve requirement stands in for reserve products"
  - id: bau-minimum-capacities
    role: "BAU floors can impose a stylized procurement outcome per carrier (config key also user-added)"
  - id: load-shedding-voll
    role: "VOLL runs give scarcity-hour economics of the energy-only counterfactual"
  - id: nodal-marginal-prices
    role: "energy-only revenue proxies per plant from shadow prices — missing-money diagnosis"
  - id: operations-only-solve
    role: "dispatch a fixed fleet to compute operational revenues under an imposed capacity mix"
  - id: probabilistic-adequacy
    role: "derating and procurement targets need LOLE/EUE — absent"
  - id: country-carrier-capacity-limits
    role: "CCL can impose an exogenous procurement outcome per country/carrier"
gap_assessment: >
  This is a market-design topic and pypsa-eur, like pypsa-earth, has no
  market layer: it is a single cost-minimizing planner with no bids, no
  auctions, no capacity remuneration, and no actor-level revenues — so no
  capacity-market design can actually be simulated or compared against
  energy-only outcomes. What the model contributes is the physical
  benchmark around the debate: SAFE reserve margins and
  operational-reserve constraints act as stylized procurement targets
  (note both SAFE and BAU constraints require config keys absent from
  config.default.yaml — add them yourself), VOLL runs expose scarcity-hour
  economics, shadow prices give per-technology energy-only revenue proxies
  for missing-money estimates, and the wired operations-only rule makes
  revenue accounting under an imposed mix cleaner than in earth. Derating
  factors and procurement volumes additionally want probabilistic adequacy
  (LOLE-based), which is absent. Use pypsa-eur to establish how much firm
  capacity the system needs; take the design question to a market tool.
coverage: gap
models:
  - model: pypsa-eur
