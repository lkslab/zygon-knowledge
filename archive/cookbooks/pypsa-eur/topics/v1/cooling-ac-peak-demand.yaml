id: cooling-ac-peak-demand
title: Cooling / AC peak demand
rank: 49
question: >
  How fast does air-conditioning growth reshape peak demand, and can the system
  ride heat waves? AC stock growth plus cooling degree days is becoming a peak
  driver even in Europe — southern-Europe heat waves already stress summer
  systems — and defines it in hot emerging economies.
