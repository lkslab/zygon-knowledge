gap_assessment: >
  Grounded absence as a building end-use — same verdict as earth, from a
  different starting point. The heating pipeline is HDD-only
  (build_daily_heat_demand computes heating degree days; no cooling analogue),
  and there is no residential/services space-cooling carrier, load or config
  key. Cooling appears only as: JRC-IDEES industrial process cooling embedded
  in the industry electricity ratios (annual, not weather-driven), vehicle
  cabin conditioning corrections in build_transport_demand, and a DH
  heat-source parameter name. Residential/services AC sits unidentified
  inside the historical base electricity load — present but not separately
  scalable and not weather-responsive for future scenarios. AC-growth studies
  can therefore only scale total load, smearing growth across all hours
  instead of concentrating it in hot afternoons — precisely wrong for peak
  questions; heat-wave realism is limited to choosing a hot historical
  weather year whose (that year's) AC response is baked into the load data.
  Building the real thing is a code job: mirror build_daily_heat_demand with
  CDDs (atlite exposes cooling demand upstream), scale to JRC-IDEES/Eurostat
  cooling totals, add AC-stock growth scenarios, and optionally a reversible
  heat-pump link; residential-heat-dsm shows the flexibility pattern. No
  district cooling anywhere.
