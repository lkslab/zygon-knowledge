id: critical-minerals-supply-chains
title: Critical-minerals supply chains
rank: 95
question: >
  How much lithium, copper, cobalt, rare earths does a buildout scenario
  imply, and what happens if mineral supply or price binds? Rising topic
  adjacent to system modelling — moderate demand, tied to security-of-supply
  and industrial policy (EU Critical Raw Materials Act).
when_to_use:
  - "mineral demand implied by a scenario"
  - "lithium / copper / cobalt requirements of the buildout"
  - "mineral price shock sensitivity"
  - "supply-chain constraints on technology deployment"
  - "material substitution (sodium-ion, iron-air)"
recipes:
  generation_conversion: [grid-scale-batteries, sodium-ion-batteries,
                          iron-air-batteries]
  demand: []
functionality:
  - id: summary-outputs
    role: "capacity buildout by technology and region — the input to any intensity calculation"
  - id: global-summary
    role: "mineral demand across the whole scenario matrix from the concatenated summaries"
  - id: scenario-matrix
    role: "price-shock and substitution cases as parallel runs"
  - id: carrier-attribute-scaling
    role: "mineral price shocks as capex factors (battery+c1.5 tokens or adjustments blocks) without code"
  - id: country-carrier-capacity-limits
    role: "crude supply-chain ceilings: CCL caps mineral-constrained technologies per country and horizon"
  - id: max-growth-limits
    role: "the nearest built-in supply-chain constraint — absolute/relative per-carrier deployment growth caps between investment periods (perfect foresight only at this ref, off by default)"
  - id: custom-constraint-hook
    role: "an endogenous cumulative material budget coupling technologies would land in custom_extra_functionality plus user data"
gap_assessment: >
  Nothing in the model: no material flows, no mineral-intensity data, no
  supply-chain or trade representation, and no constraint links deployment
  to any resource other than land and cost. The workable pattern is
  post-processing plus sensitivity: (1) take capacity-expansion results (GW
  added by technology, region, and horizon from the summaries) and multiply
  by external intensity factors (kg/MW from IEA or academic datasets) to
  get implied mineral demand per scenario; (2) represent supply tightness
  in reverse, as capex shocks via carrier+c tokens/adjustments or as CCL
  deployment caps; (3) explore substitution by switching storage chemistry
  — the sodium-ion and iron-air recipes document low-criticality
  alternatives as distinct carriers in eur's storage suite. One lever earth
  lacks: per-carrier max-growth limits between investment periods give a
  native (if perfect-foresight-only) way to encode manufacturing or
  supply-chain ramp constraints on deployment speed. A genuine endogenous
  mineral budget remains a bespoke custom_extra_functionality constraint
  with user-supplied intensity data.
coverage: gap
models:
  - model: pypsa-eur
