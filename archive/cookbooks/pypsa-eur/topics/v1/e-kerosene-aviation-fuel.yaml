id: e-kerosene-aviation-fuel
title: E-kerosene / aviation fuel
rank: 57
question: >
  What does synthetic jet fuel cost from a real power system — electrolysis +
  captured CO2 + Fischer-Tropsch or methanol-to-jet — and when does
  e-kerosene (or a SAF mandate) displace fossil kerosene in aviation demand?
when_to_use:
  - "e-kerosene / power-to-liquid for aviation"
  - "sustainable aviation fuel (SAF) scenarios"
  - "delivered cost of synthetic jet fuel"
  - "SAF blending mandate impact"
  - "methanol-to-jet route"
  - "aviation under a carbon budget"
recipes:
  generation_conversion: [e-kerosene-saf, e-diesel-fischer-tropsch, e-methanol,
                          electrolysers, direct-air-capture]
  demand: [aviation-demand]
functionality:
  - id: sector-master-switches
    role: "aviation demand (default on) attaches nodal 'kerosene for aviation' loads; scalable via aviation_demand_factor"
  - id: co2-budget-pathway
    role: "a tight budget is what pushes synthetic supply into the kerosene share of the oil pool"
  - id: co2-network-sequestration
    role: "stored-CO2 supply (point-source CC or DAC) is the FT/methanol carbon feedstock"
  - id: methanol-suite
    role: "methanol_to_kerosene is the ONE dedicated synthetic-jet route, delivering straight onto the kerosene buses (default off)"
  - id: emission-pricing
    role: "CO2-price sweeps trace the fossil-vs-synthetic switchover"
  - id: green-energy-imports
    role: "priced import of H2/methanol/oil competes with domestic e-fuel synthesis"
  - id: custom-constraint-hook
    role: "a SAF blending mandate needs a bespoke constraint on the supply links — the shipped custom_extra_functionality hook is the landing point"
  - id: summary-outputs
    role: "oil/kerosene supply split (fossil vs FT vs methanol-to-kerosene) is the e-kerosene share"
gap_assessment: >
  The mechanism exists and closes, a notch more structured than pypsa-earth:
  aviation demand is a default-on fixed kerosene load on DEDICATED nodal
  "kerosene for aviation" buses (not the bare oil bus), fed from the single
  EU oil pool where fossil oil (with refining emissions), Fischer-Tropsch,
  biomass-to-liquid and electrobiofuels compete — and one genuinely dedicated
  synthetic-jet technology exists: methanol-to-kerosene (methanol + H2
  delivered directly onto the kerosene buses, bypassing the pool; default
  off). Under a CO2 budget the optimiser shifts supply to synthetic routes,
  and that emergent share is "SAF". Structural caveats persist: FT output is
  a fungible oil commodity, so pool-supplied e-kerosene is indistinguishable
  from e-diesel and a SAF quota ("X% synthetic in aviation fuel") cannot be
  expressed in config — origin is not tracked through the pool, so a mandate
  needs a custom constraint via the shipped custom_extra_functionality hook
  (or re-pointing an FT kerosene fraction at the kerosene buses, a small code
  edit). Climate benefit of e-fuels is booked at synthesis, not per flight;
  demand is a fixed profile (one scaling factor, no elasticity); hydrogen
  and electric aircraft are absent; no non-CO2 aviation effects. For
  system-cost and deployment-threshold studies it runs out of the box.
coverage: ready
