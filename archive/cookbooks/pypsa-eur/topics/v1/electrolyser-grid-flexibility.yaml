id: electrolyser-grid-flexibility
title: Electrolyser grid flexibility
rank: 34
question: >
  Can electrolysers act as flexible grid assets — soaking up cheap/curtailed
  VRE, backing off in scarcity — while still delivering H2 at acceptable
  cost and meeting green-certification (temporal-matching) rules? The
  IRENA "electrolysers as grid services" question.
when_to_use:
  - "electrolyser as a flexible / interruptible load"
  - "optimal electrolyser utilisation vs H2 cost trade-off"
  - "do electrolysers absorb curtailment"
  - "temporal matching / green H2 certification impact on operation"
  - "electrolyser + storage sizing against a variable grid"
recipes:
  generation_conversion: [electrolysers, green-hydrogen,
                          hydrogen-storage-salt-caverns, hydrogen-pipelines,
                          hydrogen-pipeline-retrofitting, grid-scale-batteries]
  demand: [hydrogen-export-demand, electricity-load]
functionality:
  - id: sector-master-switches
    role: "core — H2 Electrolysis links are unconditional in sector runs, dispatched against system prices by construction"
  - id: h2-network-retrofit
    role: "H2 pipelines (greenfield + gas-pipe retrofit) and salt-cavern storage widen siting-for-flexibility choices and buffer flexible production"
  - id: nodal-marginal-prices
    role: "value of flexible operation = electricity price captured vs baseload operation"
  - id: temporal-resolution-nh
    role: "keep resolution fine — coarse averaging flattens exactly the price spreads at stake"
  - id: green-energy-imports
    role: "priced H2/NH3/MeOH imports are the competitive benchmark domestic flexible electrolysis must beat"
  - id: custom-constraint-hook
    role: "RFNBO-style hourly-matching / additionality rules are not built in — implement them here"
  - id: market-design-mechanisms
    role: "absent — no ancillary-service revenue stacking on top of energy value"
  - id: h2-export-chain
    role: "absent — export-driven utilisation duty needs custom loads (earth's h2export wildcard has no eur equivalent)"
gap_assessment: >
  Close to ready out of the box: electrolysers are extendable links present
  in every sector run, co-optimized with the whole system, so they are
  price-responsive by construction — they run into cheap/curtailed hours,
  back off in scarcity, and the capacity-vs-utilisation trade-off is
  endogenous. Salt-cavern storage (real European potentials), H2 pipelines
  with gas-pipe retrofitting, and electrolyser waste heat feeding district
  heating (use_electrolysis_waste_heat) all deepen the system-value
  picture beyond what pypsa-earth offers. Two gaps flank the core. First,
  certification: eur has no hydrogen colour/origin accounting at all — earth
  at least ships a colour-share proxy — so EU RFNBO temporal-matching and
  additionality rules must be hand-built via the custom constraint hook.
  Second, the services layer: no balancing or reserve products means grid
  services revenue beyond energy arbitrage cannot be earned, and hourly
  resolution understates sub-hourly flexibility value. Export-driven
  operation (a common framing of this question) also needs manual loads,
  since the h2export chain is an earth-only feature. For system-value and
  H2-cost questions this runs today.
coverage: ready
models:
  - model: pypsa-eur
