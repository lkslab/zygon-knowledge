id: firm-low-carbon-capacity
title: Firm low-carbon capacity
rank: 27
question: >
  How much firm (dispatchable, weather-independent) low-carbon capacity does a
  high-VRE system need, and which technology supplies it — nuclear/SMR, hydro,
  geothermal, gas+CCS, long-duration storage? The question behind coal-exit
  firming, the European nuclear resurgence debate, and clean-firm procurement.
when_to_use:
  - "how much firm capacity does the system need"
  - "nuclear vs storage vs gas-CCS as firm supply"
  - "clean firm power / 24-7 style portfolio"
  - "firming a wind-solar system as coal and nuclear exit"
  - "value of dispatchable low-carbon generation"
recipes:
  generation_conversion: [conventional-nuclear, small-modular-reactors, geothermal-conventional, conventional-hydropower, long-duration-storage, gas-power-plants, allam-cycle]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: co2-cap
    role: "core — tightening Co2L (or the sector co2_budget) is what makes firm LOW-CARBON capacity bind"
  - id: safe-reserve-margin
    role: "SAFE defines 'firm' mechanically: conventional capacity vs peak — config key must be user-added"
  - id: bau-minimum-capacities
    role: "force minimum nuclear/hydro fleets for policy portfolios — BAU_mincapacities also ships with no default key"
  - id: country-carrier-capacity-limits
    role: "CCL caps/floors firm carriers per country per horizon (nuclear bans, hydro limits)"
  - id: carrier-attribute-scaling
    role: "one-token cost sweeps: at what nuclear/SMR capex does it enter?"
  - id: operational-reserves
    role: "GenX-style hourly reserve requirement adds a second, hourly firmness demand"
  - id: linearized-unit-commitment
    role: "LP-relaxed start-up/min-load/ramping data per conventional carrier — prices nuclear inflexibility approximately (earth has nothing here); off by default"
  - id: probabilistic-adequacy
    role: "no forced outages — a 1 GW reactor is perfectly reliable in the LP; absent"
gap_assessment: >
  Ready — the canonical capacity-expansion question, answered directly: sweep
  Co2L (or a carbon-budget pathway) toward zero and watch which firm carriers
  the optimizer buys against storage and transmission, with CCL/BAU encoding
  national policy fleets and cost sweeps mapping the storage-overbuild-vs-firm
  frontier. The eur toolbox is richer than earth's on three fronts: (1)
  gas+CCS firm power is first-class in the sector chain (Allam cycle, CCS
  retrofits, a real CO2 transport/sequestration network to dispose of the
  carbon); (2) linearized unit commitment exists (start-up, min-load, min
  up/down per conventional carrier), so nuclear's cycling penalty CAN be
  approximated rather than ignored — enable it, it is off by default; (3)
  perfect/myopic pathways vintage the existing nuclear fleet and hardcode
  announced phase-outs. Persistent biases: no forced-outage sampling or LOLE
  means firm capacity never breaks exactly where adequacy studies scrutinize
  it, and SAFE/BAU require user-added config keys before they run at all.
  Results hinge on one weather year by default — pair with the
  multi-year-weather-variability sweep (85 ERA5 years) for Dunkelflaute
  robustness.
coverage: ready
models:
