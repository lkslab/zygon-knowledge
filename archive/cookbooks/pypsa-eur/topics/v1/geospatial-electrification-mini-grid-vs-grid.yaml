id: geospatial-electrification-mini-grid-vs-grid
title: Geospatial electrification (mini-grid vs grid)
rank: 23
question: >
  For each unelectrified settlement, is grid extension, a solar mini-grid, or
  standalone solar (SHS) cheapest? The OnSSET/GEP per-settlement least-cost
  question — empirically mini-grid PV then standalone PV win for most unserved
  settlements (Nigeria, Zambia, Kenya studies).
when_to_use:
  - "grid extension vs mini-grid vs solar home system"
  - "per-settlement least-cost electrification"
  - "OnSSET / GEP style geospatial analysis"
  - "where do mini-grids beat the grid"
  - "connection cost by settlement distance and density"
recipes:
  generation_conversion: [solar-mini-grids, solar-home-systems, behind-the-meter-der]
  demand: [demand-spatial-disaggregation, residential-electricity-demand, electricity-load]
functionality:
  - id: geospatial-access-electrification
    role: "the question itself — absent; no settlement layer, tiers, or technology-choice logic"
  - id: distribution-power-flow
    role: "absent — grid-extension cost needs MV/LV feeder build-out the model never sees"
  - id: distribution-grid-lv
    role: "nearest surface: aggregate LV bus + linear reinforcement cost per cluster node, hosting rooftop PV and home batteries"
  - id: spatial-clustering
    role: "even at maximum resolution, buses are transmission substations, not settlements"
  - id: administrative-clustering
    role: "NUTS3/bidding-zone zoning is the finest admin surface — still orders of magnitude above settlements"
gap_assessment: >
  Doubly out of scope for pypsa-eur: the machinery is absent (as in
  pypsa-earth — no settlement raster, no population clusters, no per-tier
  demand, no grid-extension-vs-islanded-system choice; the smallest spatial
  object is a clustered transmission bus and distribution exists only as a
  linear LV cost proxy), AND the question itself has no European instance —
  the model's geography is a fully electrified continent, so there are no
  unserved settlements for a mini-grid-vs-grid choice to apply to. Unlike
  earth, there is not even a WorldPop/GADM population layer to share with an
  OnSSET/GEP run: European demand is disaggregated from GDP/population at
  NUTS level for an already-connected system. The honest answer for anyone
  landing here is redirection — use OnSSET/GEP (or national GIS electrification
  plans) for the settlement layer and pypsa-earth for the upstream bulk
  system in access geographies; pypsa-eur contributes nothing to either half.
  The solar-mini-grids and solar-home-systems recipes in the eur book
  document the technology-side version of the same absence: decentralised
  solar exists only as grid-connected rooftop PV and home batteries behind
  the aggregate LV bus, never islanded, never sited.
