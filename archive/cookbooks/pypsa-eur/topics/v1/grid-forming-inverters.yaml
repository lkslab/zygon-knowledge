id: grid-forming-inverters
title: "Grid-forming inverters"
rank: 72
question: >
  Do we need grid-forming (rather than grid-following) inverters as
  renewables displace synchronous machines — how much, where, and what is the
  cost premium worth? Live in AEMO/NREL system-strength work, ENTSO-E
  connection codes, and every 100%-renewables debate.
when_to_use:
  - "grid-forming vs grid-following inverters"
  - "synthetic / virtual inertia from batteries"
  - "system strength at high inverter shares"
  - "minimum grid-forming capacity requirement"
  - "cost premium of grid-forming capability"
recipes:
  generation_conversion: [grid-forming-inverters, synchronous-condensers,
                          grid-scale-batteries, utility-scale-solar-pv]
  demand: [electricity-load]
functionality:
  - id: inertia-stability
    role: "absent — no frequency dynamics, RoCoF, or system-strength metric anywhere"
  - id: operational-reserves
    role: "nearest proxy: GenX-style headroom constraint, no converter behaviour"
  - id: safe-reserve-margin
    role: "conventional-capacity margin as a blunt keep-synchronous-plant mandate; needs a user-added SAFE_reservemargin key"
  - id: country-carrier-capacity-limits
    role: "CCL could floor a grid-forming-labelled carrier per country"
  - id: carrier-attribute-scaling
    role: "cost premium sensitivity on inverter-bearing assets — a price, not a behaviour"
  - id: custom-constraint-hook
    role: "config-wired user module — the sanctioned landing point for a minimum-GFM-share constraint"
gap_assessment: >
  Not representable. pypsa-eur is a linear capacity-expansion / LOPF LP with
  nothing below the snapshot: inverters exist only as cost rows on storage
  converters ("battery inverter", "home battery inverter"), with no
  grid-forming/grid-following distinction, no inertia accounting and no
  system-strength constraint (the grid-forming-inverters and
  synchronous-condensers recipes document the same hole tech-side). What can
  be done today is a cost-side gesture: a capital-cost premium on
  GFM-capable assets (custom_costs.csv) plus capacity floors via CCL or SAFE
  as an exogenous mandate — the LP prices the mandate but cannot value the
  stability service that justifies it. One ergonomic advantage over
  pypsa-earth: solving.options.custom_extra_functionality ships wired in the
  default config, so a snapshot-wise minimum grid-forming-share constraint
  is a user Python file, not a fork. Actual inverter dynamics (EMT/RMS)
  belong in an external stability tool fed by the LP dispatch. Verdict:
  gap — the topic's core question cannot be answered here.
coverage: gap
models:
  - model: pypsa-eur
