gap_assessment: >
  This is home turf — arguably the sector chain's strongest suit, and clearly
  ahead of earth. Degree-day/temperature-driven hourly heat demand per node
  is served by air/ground-source heat pumps whose COP tracks ambient (and,
  for district heating, source/sink temperature approximations), so the
  cold-snap demand spike and efficiency collapse coincide — the physics that
  makes this topic hard. Around that core sit levers earth lacks entirely:
  residential heat DSM (thermal inertia as shiftable load), endogenous
  building retrofit competing against supply, vintaged existing heating
  stocks in myopic/perfect pathways, and a genuinely modelled district
  heating alternative with GIS-derived areas and pit storage. "What does a
  60% heat-pump share do to the winter peak and capacity mix, and what do
  retrofit + DSM + thermal storage shave off" is a scenario run. Remaining
  gaps: (1) the distribution network, where much of the real pain lands, is
  a single linear LV-reinforcement cost — no feeders, no transformer limits,
  no hosting-capacity answer; (2) one weather year per run by default, so
  1-in-20 cold-year peaks need weather-year sweeps (multi-year single solves
  are only half-wired); (3) hybrid heat pumps / emergency resistance backup
  behaviour is coarse. Heat-pump shares per horizon are exogenous choices,
  not adoption forecasts.
