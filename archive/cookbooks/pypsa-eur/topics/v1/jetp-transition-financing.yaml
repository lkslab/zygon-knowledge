id: jetp-transition-financing
title: JETP transition financing
rank: 82
question: >
  What does a Just Energy Transition Partnership package actually buy — which
  coal units retire when, what replaces them, what the accelerated pathway
  costs versus BAU, and whether the grid clears financing thresholds? The
  Indonesia / Vietnam / South Africa / Senegal deals, and the dev-bank layer
  behind them.
when_to_use:
  - "JETP investment plan / coal retirement schedule"
  - "cost of accelerated coal phase-out for [country]"
  - "what does concessional finance change in the least-cost plan"
  - "carbon-intensity trajectory for climate-finance eligibility"
  - "replacement mix for retired coal units"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants,
                          utility-scale-solar-pv, grid-scale-batteries]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: fleet-retirement-filter
    role: "the mechanical phase-out lever — retire coal by DateIn/DateOut query; battle-tested for European coal exits"
  - id: country-carrier-capacity-limits
    role: "CCL caps/floors would encode negotiated coal ceilings and RE floors per country"
  - id: co2-cap
    role: "emissions trajectory of a deal as a Co2L budget"
  - id: co2-budget-pathway
    role: "multi-horizon budget distribution (cb token) for phase-out pathways"
  - id: carbon-intensity-metrics
    role: "gCO2/kWh vs the ~100 g finance threshold — derivable from summaries, no direct column"
  - id: discount-rate-dimension
    role: "concessional finance = lower WACC; only a costs-table discount rate, no actor-level financing layer"
  - id: nodal-marginal-prices
    role: "revenue proxy for what retiring units forgo (stranded-value side)"
gap_assessment: >
  A geography gap, not a mechanics gap. Every technical lever a JETP study
  needs exists in pypsa-eur and is battle-tested — date-query coal retirement
  on the powerplantmatching fleet, per-country coal ceilings and RE floors
  (CCL), carbon budgets per horizon, myopic pathways, accelerated-vs-BAU
  system-cost deltas with the grid co-optimized. But the model's spatial
  domain is Europe: the entire data pipeline (OSM/TYNDP European grid,
  ENTSO-E load, European cutouts, JRC/Eurostat statistics) covers ENTSO-E
  countries only, and no JETP geography — Indonesia, Vietnam, South Africa,
  Senegal, or any dev-bank pipeline country — can be pointed at. The topic
  as posed is therefore out of scope: use pypsa-earth for actual JETP
  countries; use pypsa-eur only for European analogues (Polish/German coal
  phase-out economics transfer methodologically). The financing half is
  missing here exactly as everywhere in the family: a single social planner
  with one discount rate cannot represent PPA buyouts, early-closure
  compensation, or the concessional/commercial capital split — that layer is
  spreadsheet work on top of any run.
coverage: gap
models:
  - model: pypsa-eur
