functionality:
  - id: demand-elasticity
    role: "the missing core — existing industrial loads are fixed profiles, nothing shifts in time"
  - id: industry-t-endogenous
    role: "closest machinery: endogenous per-band process-heat supply with a must_run knob — flexible sourcing/curtailment, not load shifting"
  - id: bev-dsm-v2g
    role: "endogenous demand-shifting exists for EVs (and residential heat), not for industry"
  - id: sector-master-switches
    role: "industrial demands enter as exogenous nodal loads via the sector chain"
  - id: nodal-marginal-prices
    role: "price spreads from duals quantify what shifting WOULD be worth"
  - id: temporal-resolution-nh
    role: "hourly resolution suits daily/weekly shifting windows if they existed"
  - id: custom-constraint-hook
    role: "sanctioned landing point for a hand-built store+link shiftable-load construct"
  - id: market-design-mechanisms
    role: "no DSM products or industrial tariffs to respond to"
gap_assessment: >
  Industrial load-SHIFTING does not exist in pypsa-eur: annual industrial
  demands become fixed (mostly flat) profiles, demand-elasticity is absent,
  and the endogenous demand flexibility that does exist (EV DSM/V2G,
  residential heat DSM) stops short of industry. pypsa-eur narrows the gap
  relative to earth in one real way: with sector.industry_t.endogen the
  model chooses industrial process-heat supply per temperature band
  endogenously, and relaxing must_run lets that heat production flex
  against the system — flexible sourcing and implicit curtailment, but
  still no energy-conserving shift of a process schedule. New flexible
  CONVERSION loads are fully endogenous (electrolysers, DAC,
  methanolisation dispatch freely), so hydrogen/PtX flexibility is
  modellable even though existing-process flexibility is not. Shifting can
  be hand-built as bus + store + link with window energy conservation via
  the custom_extra_functionality hook — PyPSA surgery, not config. The
  model does bound the prize: nodal price spreads and peak duals price
  what a shiftable MWh would earn; the DSM potential itself must come from
  outside.
coverage: gap
