id: load-shifting-industrial
title: "Load-shifting (industrial)"
rank: 62
question: >
  How much can industrial demand-side response — shiftable furnaces, cold
  stores, aluminium potlines, flexible process schedules — contribute to
  system flexibility, and what is that shifting worth to the plant and the
  grid? A headline demand-response question for TSOs and large consumers.
when_to_use:
  - "value of industrial demand response"
  - "can industry shift load to absorb solar / avoid peaks"
  - "flexible operation of energy-intensive processes"
  - "industrial DSM potential in a national study"
  - "load-shifting vs storage as flexibility sources"
