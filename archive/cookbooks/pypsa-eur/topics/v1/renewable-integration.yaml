id: renewable-integration
title: Renewable integration
rank: 8
question: >
  How do we integrate variable wind and solar without breaking reliability
  or the budget — what mix, storage, and grid absorbs a given VRE share,
  how much curtailment is optimal, and where do the integration costs
  actually bite? The foundational topic of the whole field.
when_to_use:
  - "can the system handle X% wind and solar"
  - "integration cost of renewables"
  - "optimal curtailment vs storage vs overbuild"
  - "what does a high-VRE system look like hourly"
  - "renewables target feasibility study"
recipes:
  generation_conversion: [utility-scale-solar-pv, onshore-wind, offshore-wind,
                          run-of-river-hydro, grid-scale-batteries, gas-power-plants]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: renewable-potentials-land-eligibility
    role: "atlite profiles with CORINE/LUISA/Natura exclusions and per-node resource classes"
  - id: weather-year-selection
    role: "any ERA5 year 1940-2024 drives all VRE profiles and hydro inflow"
  - id: temporal-resolution-nh
    role: "hourly chronology is the point — average with care"
  - id: spatial-clustering
    role: "resource diversity and grid bottlenecks vs solve time"
  - id: hydro-inflow-normalization
    role: "EIA-calibrated hydro is the swing integrator in hydro-heavy countries"
  - id: curtailment-mode
    role: "explicit curtailment accounting as a dispatched carrier"
  - id: carrier-attribute-scaling
    role: "sweep VRE cost/potential (solar+c0.5, onwind+p2) in opts"
  - id: summary-outputs
    role: "curtailment, market values, and cost breakdowns per run"
  - id: multi-weather-year
    role: "multi-year snapshots concatenable, but standard workflow is one year"
  - id: inertia-stability
    role: "frequency/stability limits of VRE shares — absent"
gap_assessment: >
  The home turf, with the field's best-validated input chain for Europe:
  weather-consistent wind/solar/hydro from atlite on ERA5/SARAH cutouts
  spanning 1940-2024, land-eligibility exclusions (CORINE/LUISA, Natura,
  bathymetry) with binned resource classes per node, and hourly
  co-optimization of VRE, storage, dispatchables, and grid — the standard
  "what does X% VRE cost and require" study is the default workflow, with
  curtailment reported per carrier (or made an explicit dispatched carrier
  via curtailment_mode) and market-value tables straight from the
  summaries. The blind spots to state to a reliability-minded audience:
  the standard solve is one weather year (inter-annual variability via
  sweeps, or concatenated multi-year snapshots without probabilistic
  metrics on top); adequacy is deterministic (see the resource-adequacy
  card); and nothing below the hourly energy balance exists — no inertia,
  frequency response, or grid-forming constraints, so very high
  instantaneous VRE shares are unchallenged by the physics that actually
  limits them. Transmission losses default-on and optional dynamic line
  rating make the grid side of integration costs more honest than earth's.
coverage: ready
models:
  - model: pypsa-eur
