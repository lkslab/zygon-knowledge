id: resource-adequacy
title: Resource adequacy
rank: 5
question: >
  Will there be enough firm capacity to keep the lights on at every hour —
  what is the loss-of-load risk during low-wind, low-sun, high-demand
  stress periods, and how much reserve margin does a high-VRE system need?
when_to_use:
  - "do we have enough capacity to meet peak"
  - "loss of load / unserved energy risk"
  - "reserve margin for a high-renewables system"
  - "dunkelflaute stress test"
  - "capacity contribution of wind/solar/storage"
recipes:
  generation_conversion: [gas-power-plants, grid-scale-batteries, pumped-hydro-storage,
                          conventional-hydropower]
  demand: [electricity-load, demand-temporal-profiles, space-cooling-demand]
functionality:
  - id: safe-reserve-margin
    role: "core — firm capacity >= (1+margin) x peak, deterministic; SAFE_reservemargin key must be user-added"
  - id: load-shedding-voll
    role: "unserved energy priced at VOLL per carrier; where and when shedding bites"
  - id: probabilistic-adequacy
    role: "LOLE/EUE with forced-outage draws — the industry metric — absent"
  - id: weather-year-selection
    role: "85 years of ERA5 (1940-2024) selectable — deep stress-year library"
  - id: multi-weather-year
    role: "multi-year snapshots technically concatenable, but no probabilistic metrics on top"
  - id: operational-reserves
    role: "hourly reserve requirement layered on top of energy adequacy"
  - id: linearized-unit-commitment
    role: "min-load/start-up realism as LP relaxation — but still no forced outages"
  - id: operations-only-solve
    role: "dedicated dispatch-only rule stress-tests a FIXED fleet across weather years"
  - id: scenario-matrix
    role: "weather-year and demand sweeps as parallel runs"
gap_assessment: >
  Deterministic adequacy only, but with better tooling than earth. The
  engineering triangle is available — SAFE reserve margin on peak (note:
  the electricity.SAFE_reservemargin config key ships unset and must be
  added or the constraint KeyErrors), per-carrier load shedding at VOLL,
  and operational reserves — and the dedicated solve_operations_network
  rule makes the right adequacy experiment mechanical: fix capacities from
  an expansion run, then re-dispatch across weather years drawn from an
  85-year ERA5 cutout (1940-2024), a stress-year library earth cannot
  match. Multi-year snapshots can even be concatenated into one solve.
  What a TSO or regulator means by adequacy is still missing: probabilistic
  LOLE/EUE against forced-outage distributions — there is no outage
  sampling anywhere, unit commitment is an LP relaxation without
  reliability draws, and capacity credits must be inferred by hand from
  marginal experiments. Keep runs near-hourly or segmented: temporal
  averaging smooths exactly the peaks adequacy cares about. European
  demand peaks are measured ENTSO-E data, removing earth's synthetic-peak
  caveat.
coverage: partial
models:
  - model: pypsa-eur
