id: sector-coupling
title: "Sector coupling"
rank: 18
question: >
  Where should scarce green electrons go — direct electrification vs
  hydrogen vs synthetic fuels — and how do heat, transport, and industry
  demands reshape the optimal power system? Not a topic so much as the lens:
  PyPSA-Eur, TIMES, and TYNDP scenarios are all sector-coupled by design.
when_to_use:
  - "whole-energy-system / multi-sector optimization"
  - "electrification vs hydrogen vs e-fuels competition"
  - "how heat and transport demand reshape the power system"
  - "value of coupling: shared flexibility, avoided infrastructure"
  - "national energy (not just electricity) planning"
recipes:
  generation_conversion: [air-source-heat-pumps, electrolysers,
                          battery-electric-cars, district-heating,
                          green-hydrogen, e-diesel-fischer-tropsch,
                          e-methanol, hydrogen-pipeline-retrofitting,
                          industry-process-heat-endogenous,
                          co2-transport-and-sequestration]
  demand: [residential-space-heating-demand, land-transport-demand,
           industrial-crosscutting-electricity, services-heat-demand,
           shipping-demand, aviation-demand]
functionality:
  - id: sector-master-switches
    role: "core — electricity + heat + transport + industry + shipping/aviation + agriculture in one network"
  - id: bev-dsm-v2g
    role: "transport coupling contributes flexibility back, not just load"
  - id: residential-heat-dsm
    role: "building thermal inertia as endogenous heat-side flexibility"
  - id: industry-t-endogenous
    role: "industrial process-heat bands choose biomass/methane/H2/heat-pump/electric endogenously (off by default)"
  - id: h2-network-retrofit
    role: "hydrogen as the inter-sector and spatial carrier, greenfield pipes or retrofitted gas routes"
  - id: gas-network-links
    role: "a REAL methane transmission network — gas is spatially resolved, not a copperplate"
  - id: co2-network-sequestration
    role: "CO2 pipelines, regional sequestration potentials, and DAC close the e-fuel loop"
  - id: methanol-suite
    role: "methanol economy (shipping fuel, methanol-to-power/kerosene) as a full carrier chain"
  - id: district-heating-suite
    role: "GIS-derived DH areas, dynamic temperatures, PTES — district heat as real infrastructure"
  - id: building-retrofit-endogenous
    role: "retrofit cost curves can compete against heat supply (default is exogenous reduction factors)"
  - id: perfect-foresight
    role: "sector pathways with all horizons co-optimized, beyond myopic carry-forward"
  - id: myopic-foresight
    role: "the battle-tested multi-horizon pathway mode with brownfield carry-forward"
  - id: chp-operation-constraints
    role: "caveat — the CHP operating-envelope constraint is dead code at this ref; CHPs run on fixed link efficiencies"
  - id: temporal-resolution-nh
    role: "sector runs usually need temporal coarsening to stay tractable"
gap_assessment: >
  This is the reference implementation of the topic: pypsa-eur's sector
  chain is the model family's flagship, spanning electricity, heating
  (urban/rural, GIS-based district heating with dynamic temperatures and
  pit storage), land transport with EV flexibility, industry (optionally
  with endogenous process-heat technology choice), shipping, aviation,
  agriculture, and the H2/methanol/ammonia/e-fuel layer — on real gas, H2,
  and CO2 networks with regional sequestration, and with overnight, myopic,
  AND perfect-foresight planning modes. Cross-sector competition for
  electrons is resolved endogenously with European-quality input data
  throughout. Residual caveats inside a clearly ready verdict: the CHP
  operating-envelope constraint is dead code (fixed efficiencies only),
  endogenous industry process-heat and building retrofit are off by
  default and newer machinery, hydrogen/fuel export demand to
  outside-Europe markets is absent (earth has that chain), and full-blown
  sector runs are computationally heavy, demanding temporal coarsening.
coverage: ready
