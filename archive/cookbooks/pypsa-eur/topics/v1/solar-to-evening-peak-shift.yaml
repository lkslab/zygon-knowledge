id: solar-to-evening-peak-shift
title: Solar-to-evening-peak shift
rank: 28
question: >
  How much storage of what duration moves midday solar into the evening peak?
  India's central storage question (the daily solar-evening shift makes ~4-hour
  batteries the marginal asset), and the standard duck-curve problem wherever
  solar penetration is high — increasingly Iberia, Italy, Greece.
when_to_use:
  - "4-hour battery sizing for the evening peak"
  - "duck curve / midday surplus to evening ramp"
  - "solar + storage vs peakers for the evening"
  - "storage duration mix for a solar-heavy grid"
  - "curtail midday solar or store it"
recipes:
  generation_conversion: [utility-scale-solar-pv, grid-scale-batteries, pumped-hydro-storage, sodium-ion-batteries]
  demand: [electricity-load, demand-temporal-profiles, space-cooling-demand]
functionality:
