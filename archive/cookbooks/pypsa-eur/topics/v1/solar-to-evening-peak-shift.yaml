gap_assessment: >
  Bread-and-butter coverage: hourly dispatch plus investment co-optimization
  is exactly this problem, and pumped hydro, EV demand shifting, and the
  extended storage suite (sodium-ion, flow, iron-air, compressed/liquid air)
  compete in the same solve. Mind the two battery representations: the
  electricity-chain StorageUnit battery has a FIXED max_hours (duration is an
  assumption there), while the Store+charger/discharger representation
  (extendable_carriers Store, and all sector-chain batteries) sizes energy
  and power independently — use the latter when the 4-hour question is the
  output, and note the charger=discharger coupling constraint only catches
  links literally named 'battery charger/discharger', so the newer storage
  carriers get independently sized (bicharger techs with zero discharger
  cost are effectively unconstrained). Practical watch-items rather than
  gaps: keep temporal resolution fine (nH averaging flattens the exact ramp
  being studied); no sub-hourly dynamics or ancillary products, so fast-ramp
  value beyond hourly arbitrage is unpriced (market mechanisms absent). For
  India-style AC-driven evening peaks this is the wrong regional model — the
  machinery ports, the demand data does not.
