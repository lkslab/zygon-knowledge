gap_assessment: >
  A full production-tonnage chain with explicit routes — far beyond earth's
  fuel-carrier aggregate. JRC-IDEES gives today's kton/a of integrated vs
  electric-arc steel per country; industry.St_primary_fraction and
  industry.DRI_fraction move primary steel into "DRI + Electric arc" per
  planning horizon (default ramp: 0 today, 0.05 in 2030, 1.0 in 2050), with
  per-route intensities including industry.H2_DRI (1.7 MWh H2/t) and elec_DRI
  shaft electricity; loads are sited at GEM Global Steel Plant Tracker plants
  with process-specific capacities (EAF / DRI+EAF / Integrated). The system
  response — electrolyser and renewables build, H2 network, storage — is
  exactly what the model optimizes, and the standard DRI-ramp study is pure
  config. Honest limits: the route split is EXOGENOUS (config shares, not an
  investment decision — no BF-BOF vs DRI capital choice, no endogenous
  switching year); production stays at today's GEM sites, so "where should
  DRI locate" cannot relocate steel toward cheap H2 (relocation/green-steel
  trade is bespoke work); and there is no iron-ore/scrap resource layer
  (scrap availability does not bound the EAF share). For system-impact and
  pathway questions under a given steel strategy: ready out of the box.
coverage: ready
