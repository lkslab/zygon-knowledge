id: steel-decarbonization-h2-dri
title: Steel decarbonization (H2-DRI)
rank: 43
question: >
  What does switching steel from blast furnaces to H2-DRI + EAF do to the power
  and hydrogen system — how much electrolysis, grid and storage does green steel
  pull in, and where should it locate? The flagship hard-to-abate question for
  industrial strategy teams and heavy-industry buyers.
