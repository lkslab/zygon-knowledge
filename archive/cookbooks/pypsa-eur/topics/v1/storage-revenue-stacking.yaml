id: storage-revenue-stacking
title: "Storage revenue stacking"
rank: 69
question: >
  What does a storage asset earn across stacked revenue streams — energy
  arbitrage, capacity payments, ancillary services, congestion — and does
  the business case close? The storage-investor question; arbitrage alone
  rarely carries a project.
when_to_use:
  - "business case / revenue stack for a battery"
  - "storage earnings beyond energy arbitrage"
  - "capacity market plus ancillary revenue for storage"
  - "merchant storage investment case"
  - "how storage revenue shifts as VRE share rises"
recipes:
  generation_conversion: [grid-scale-batteries, pumped-hydro-storage,
                          long-duration-storage, iron-air-batteries,
                          flow-batteries]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: nodal-marginal-prices
    role: "arbitrage revenue: storage dispatch valued at nodal duals — the market_values summary table already computes it per carrier"
  - id: market-design-mechanisms
    role: "absent — no capacity remuneration, ancillary products, or settlement to stack"
  - id: operations-only-solve
    role: "re-dispatch a fixed system for production-cost-style price series — the cleaner revenue-extraction run"
  - id: operational-reserves
    role: "reserve-constraint duals give a shadow price for the reserve stream, unremunerated to assets"
  - id: safe-reserve-margin
    role: "adequacy contribution is a constraint (user-added config key), not a capacity payment"
  - id: sub-hourly-resolution
    role: "hourly floor — FFR/FCR/aFRR-type fast markets are structurally invisible"
  - id: linearized-unit-commitment
    role: "optional LP-relaxed start/min-load costs sharpen price spikes a little; off by default"
  - id: battery-charger-ratio
    role: "caveat — newer storage-suite carriers have uncoupled zero-cost dischargers, distorting their apparent economics"
gap_assessment: >
  One stream out of the stack — same verdict as pypsa-earth, with better
  tooling for that one stream. Energy arbitrage is well captured: solve
  the system (or re-dispatch a fixed one with the dedicated
  operations-only rule), value each unit's charge/discharge at its bus
  duals — the market_values summary table does this per carrier — and
  you get location-specific arbitrage revenue that correctly reflects
  VRE shares, congestion (real zonal geography via bidding-zone
  clustering), and storage saturation; revenue cannibalization across
  scenarios is a genuinely strong use. Everything else in a real stack
  is missing because there are no markets: capacity payments, aFRR/FCR
  and other ancillary products, and imbalance revenues do not exist.
  Partial proxies only: the operational-reserve dual is a shadow reserve
  price and SAFE implies an adequacy value, but neither is paid to
  assets without hand post-processing. Structural floors compound this —
  hourly resolution hides sub-hourly products, and the (by default)
  frictionless LP smooths the scarcity spikes that fatten merchant
  returns; linearized UC helps only marginally. Read model results as
  the long-run energy-value component — a lower bound on stack value —
  and audit the newer storage carriers whose dischargers escape the
  battery coupling constraint. A dispatch-against-markets model
  downstream is needed for a bankable case.
coverage: partial
models:
