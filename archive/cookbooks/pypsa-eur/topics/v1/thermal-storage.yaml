gap_assessment: >
  Strong and default-on. Every heat system (residential/services, rural/urban
  decentral, urban central) gets a water-tank bus + extendable Store +
  charger/discharger, with capital cost, lifetime and standing loss taken from
  the cost data (not an earth-style tes_tau constant); urban central nodes
  additionally get pit storage (PTES) whose capacity follows the dynamic
  DH temperature spread — genuinely seasonal. Solve-time constraints couple
  store energy to charger power via the technology-data energy-to-power
  ratio, so duration is physical rather than free. Aquifer storage (ATES) has
  a full potential pipeline (BGR aquifer shapes x DH areas) but is dead-key
  at this ref: enabling it crashes on two config keys that live under ptes
  instead of ates — add them to use it. Remaining gaps: no power-to-heat-
  to-power path (Carnot battery / pumped thermal — molten-salt/CSP storage is
  out too, CSP itself being only a proxy in eur), and no storage inside the
  industrial temperature bands (industry_t menus have no TES option). For
  the headline questions — tank value behind heat pumps, seasonal pit stores
  in DH, TES vs batteries — the standard workflow answers out of the box.
