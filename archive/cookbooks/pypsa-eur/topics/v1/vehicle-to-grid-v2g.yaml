id: vehicle-to-grid-v2g
title: Vehicle-to-grid (V2G)
rank: 29
question: >
  What is EV batteries' value as distributed system flexibility — smart
  charging that follows solar, and discharge back to the grid at the peak?
  A top applied theme (DSOs, aggregators, TYNDP treats transport
  electrification as a core driver); the system-value half of rank-20's
  smart-charging question.
when_to_use:
  - "value of V2G to the system"
  - "EV fleets as storage / balancing resource"
  - "smart charging vs V2G vs dumb charging scenarios"
  - "how much peak capacity do EV batteries displace"
  - "system cost saving from managed EV flexibility"
recipes:
  generation_conversion: [vehicle-to-grid, battery-electric-cars, smart-ev-chargers, grid-scale-batteries]
  demand: [land-transport-demand, demand-temporal-profiles]
functionality:
  - id: bev-dsm-v2g
    role: "core — BEV charge-shifting within availability/state-of-charge bounds and V2G discharge at capped power"
  - id: exogenous-transport-shares
    role: "EV fleet size comes from per-horizon electric shares — adoption is imposed, not optimized"
  - id: distribution-grid-lv
    role: "EVs sit behind the aggregate LV link (on by default in eur) — reinforcement is a linear cost, not a network"
  - id: distribution-power-flow
    role: "absent — feeder-level V2G limits (the DSO half of the question) are invisible"
  - id: market-design-mechanisms
    role: "absent — no balancing/ancillary products for EVs to sell; value = energy arbitrage + avoided capacity"
  - id: scenario-matrix
    role: "dumb vs DSM vs V2G variants and EV-share sweeps as parallel runs"
  - id: summary-outputs
    role: "system-cost delta between charging regimes = the headline V2G value number"
gap_assessment: >
  The system-value question works out of the box, on better mobility data
  than earth: the sector chain builds national EV fleets from transport
  demand and per-horizon electric shares, with an availability-profiled
  aggregate battery per node (German mobility-survey profiles) that shifts
  charging within state-of-charge restrictions (bev_dsm) and, with v2g
  enabled, discharges to the grid at a capped charge rate and efficiency —
  so "what does V2G save vs smart vs unmanaged charging" is a clean
  three-scenario comparison, and the default-on distribution-grid LV layer
  means EV flows at least pay a reinforcement cost. Caveats unchanged in
  kind from earth: one fleet battery per cluster node, exogenous availability
  and adoption shares, no individual-driver behaviour, no battery-degradation
  cost, no charger-siting decision. The real gaps are the distribution half —
  V2G revenue depends on feeder/transformer constraints the model replaces
  with a linear LV cost — and the absence of balancing/ancillary products,
  so modelled value is the energy-arbitrage-plus-avoided-capacity lower
  bound most system studies quote. Residential heat DSM (eur-only) competes
  in the same solve, so EV flexibility is valued against a realistic
  flexibility stack rather than alone.
