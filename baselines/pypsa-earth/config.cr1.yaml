# SINGLE-NODE FULL-YEAR variant — costarica (prepared 2026-07-31): 1
# cluster, the whole 2013 weather year at native hourly resolution for the
# solved power network. Purpose: temporal questions (storage, droughts,
# seasonal hydro, evening peaks) the one-week window cannot see. No spatial
# structure: siting/transmission questions stay on the 4-cluster baseline.
# Derived from config.cr.yaml; same EDGAR co2 pin, same cutout.
# SPDX-FileCopyrightText:  PyPSA-Earth and PyPSA-Eur Authors
# SPDX-License-Identifier: CC0-1.0
#
# Baseline config — Costarica (CR), prepared 2026-07-30 the same way as
# the Mexico reference (see config.yaml + README.md here): 4 clusters, one
# week of 2013, power solve + sector prenetwork, HiGHS. Targets:
#   a) results/costarica1-power/networks/elec_s_4_ec_lcopt_Co2L.nc
#   b) results/costarica1-sector/prenetworks/elec_s_4_ec_lcopt_Co2L_144h_2030_0.071_AB.nc
# Uses the SAME northamerica cutout the template already carries.
run:
  name: costarica1-power
  sector_name: costarica1-sector
  shared_cutouts: true
  base_config: config.default.yaml

countries: [CR]
tutorial: false
custom_rules: []

enable:
  retrieve_databundle: true
  retrieve_databundle_sector: true
  retrieve_cost_data: true
  download_osm_data: true
  retrieve_cutout: false      # cutouts/cutout-2013-era5-northamerica.nc already on disk
  build_cutout: false
  build_natura_raster: false
  progress_bar: false

scenario:
  simpl: [""]
  clusters: [1]
  ll: ["copt"]
  opts: [Co2L]
  planning_horizons: [2030]
  sopts: ["144h"]
  demand: [AB]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"

electricity:
  # EDGAR-pinned, not runtime-derived: automatic_emission:true re-downloads
  # the EDGAR inventory inside prepare_network (crashes offline, violates
  # no-downloads; issue #1 runs/issues/interview-evals-20260728.md). Values
  # below = emission_extractor(v60 xls, 1990, [CR]) — identical numbers,
  # zero downloads. Pinned 2026-07-30 from the on-disk EDGAR file.
  automatic_emission: false
  co2limit: 70.09494   # plain Co2L cap: CR 1990 power+heat CO2 (EDGAR v6.0, kt)
  co2base: 70.09494    # base for fractional Co2Lx.xx wildcards
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro, csp]
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, csp]
    StorageUnit: [battery]
    Store: [battery, H2]
    Link: []

atlite:
  default: cutout-2013-era5-northamerica
  cutouts:
    cutout-2013-era5-northamerica:
      module: era5
      dx: 0.3
      dy: 0.3

renewable:
  onwind: {cutout: cutout-2013-era5-northamerica}
  offwind-ac: {cutout: cutout-2013-era5-northamerica}
  offwind-dc: {cutout: cutout-2013-era5-northamerica}
  solar: {cutout: cutout-2013-era5-northamerica}
  hydro: {cutout: cutout-2013-era5-northamerica}
  csp: {cutout: cutout-2013-era5-northamerica}

sector:
  hydrogen:
    underground_storage: true

solving:
  solver:
    name: highs
