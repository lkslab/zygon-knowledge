# Execution profile for the pypsa-earth baseline — consumed by
# referee/workspace.py and bin/harness. Machine-local paths are HINTS only;
# the env knob wins. Binary resolution order: $ZYGON_SNAKEMAKE_EARTH >
# binary_hint > $ZYGON_SNAKEMAKE > snakemake on PATH.
#
# Earth needs its OWN env (snakemake 7.x) — never the eur env.
model: pypsa-earth

snakemake:
  env_knob: ZYGON_SNAKEMAKE_EARTH
  binary_hint: /home/lukas/Desktop/earth/pypsa-earth/.pixi/envs/default/bin/snakemake
  prepend_path: /home/lukas/Desktop/earth/pypsa-earth/.pixi/envs/default/bin
  env_clean: [SNAKEMAKE_PROFILE]

python_hint: /home/lukas/Desktop/earth/pypsa-earth/.pixi/envs/default/bin/python

invocation:
  # earth does NOT install a root config: the baseline is applied per
  # invocation via --configfile (see the README here). apply merges this file
  # with the bundle's folded config keys into <runspace>/zygon.config.yaml.
  # GOTCHA (enforced in workspace.snakemake_cmd, nowhere else): --configfile
  # and --rerun-triggers are nargs='+' — targets listed after them get
  # swallowed. Targets always come FIRST.
  style: configfile
  configfile: baselines/pypsa-earth/config.yaml
  # rendered from the MERGED effective config (default <- baseline <- bundle),
  # so a bundle that changes a wildcard-bearing key (sopts, clusters, ...)
  # retargets correctly
  targets:
  - "results/{run.name}/networks/elec_s{scenario.simpl}_{scenario.clusters}_ec_l{scenario.ll}_{scenario.opts}.nc"
  - "results/{run.sector_name}/prenetworks/elec_s{scenario.simpl}_{scenario.clusters}_ec_l{scenario.ll}_{scenario.opts}_{scenario.sopts}_{scenario.planning_horizons}_{costs.discountrate}_{scenario.demand}.nc"
  flags: ["--workflow-profile", "none"]

cores: 4

# run-scoped output subtrees, REAL-copied (mtime-preserving) into every clone
# instead of hardlinked: template file inodes are a-w and snakemake refuses to
# plan over write-protected existing outputs. These hold every file a rerun
# may overwrite; everything else stays hardlinked and frozen.
writable_subtrees:
- "resources/{run.name}"
- "resources/{run.sector_name}"
- "results/{run.name}"
- "results/{run.sector_name}"

budget:
  # earth passes the WHOLE electricity dict as params to many upstream rules,
  # so even an L1 config change re-triggers ~29 jobs (base_network -> solve;
  # verified with the co2limit smoke) — the cap must clear that
  max_jobs: 40
  # the 29-job smoke measured 1737s wall — mostly atlite availability on the
  # NA cutout — but a binding Ep/Co2L constraint makes the solve slower: a
  # carbon-price eval run blew through 2700s (2026-07-28). 5400 covers the
  # honest chain plus a hard solve plus concurrent-run contention
  timeout_s: 5400
  deny_rules: "^(retrieve_|download_|build_cutout)"
  # laptop-class envelope: the baseline week at native resolution is the
  # deal — nothing finer than hourly, and neither the snapshot window nor
  # the cluster count moves (either means a rebuild the job cap can't see)
  envelope:
    temporal_floor_h: 1
    pinned_keys: ["snapshots", "scenario.clusters", "scenario.simpl"]

verify:
  networks:
  - stage: solved
    path: "results/{run.name}/networks/elec_s{scenario.simpl}_{scenario.clusters}_ec_l{scenario.ll}_{scenario.opts}.nc"
  - stage: prepared
    path: "results/{run.sector_name}/prenetworks/elec_s{scenario.simpl}_{scenario.clusters}_ec_l{scenario.ll}_{scenario.opts}_{scenario.sopts}_{scenario.planning_horizons}_{costs.discountrate}_{scenario.demand}.nc"
