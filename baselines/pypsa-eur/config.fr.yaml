# France baseline — overlay on the template's installed config/config.yaml
# (snakemake deep-merges; everything not listed here is inherited from the GB
# baseline: 5 clusters, 168h averaging, overnight 2050, europe-2013 cutout,
# highs). FR is in JRC-IDEES (EU-27) so no companion country is needed, and
# hotmaps carries FR 'Non-ferrous metals' sites (19), so the Portugal-class
# crash in build_industrial_energy_demand_per_node_today cannot fire
# (checked 2026-07-30 against the template's Industrial_Database.csv).
# Prepared 2026-07-30 at the previous anchor; re-expressed for a6c45e5 on
# 2026-09-10 (co2_budget moved under `upper`). Not re-run on a6c45e5.
run:
  name: france

countries:
- FR

# France CANNOT reach net-zero in this dataset at 5 clusters: a
# minimize-emissions probe on the prepared network floors at +13.3 Mt/yr
# net CO2 (Germany reaches -51.8), with every capture route present and
# unlimited — the binding limit is France's finite clustered renewable
# potential, past which marginal DAC power comes from gas and self-defeats.
# The default co2_budget.upper.2050: 0.0 is therefore structurally
# INFEASIBLE (hit 2026-07-31: 'Infeasible model' + 10 h of IIS grinding).
# 5% of 1990 (~19-20 Mt for FR scope) clears the 13.3 Mt floor with honest
# headroom. NOTE for interviews: the FR baseline is near-zero-2050, not
# net-zero. At a6c45e5 the cap is co2_budget.upper (relative: true, fraction
# of 1990), applied by prepare_network.py:apply_co2_budget_constraints
# inside compose_network.
co2_budget:
  upper:
    2050: 0.05

sector:
  # France's salt caverns are onshore-only (Lorraine/Bresse basins); the
  # default [onshore, nearshore] crashed prepare_sector_network's
  # add_h2_gas_infrastructure with KeyError 'nearshore' at the previous
  # anchor — the script checks intersection but then indexes the full list
  # (upstream partial-scope bug, same class as the PT hotmaps crash; hit
  # 2026-07-30). Config-level scope fix, no code change; kept until re-run.
  hydrogen_underground_storage_locations:
  - onshore

solving:
  solver:
    name: highs
    options: highs-default
