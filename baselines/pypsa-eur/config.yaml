# Zygon baseline reference config — pypsa-eur (see archive/fixtures/BASELINE.md).
# The ONE configuration the template is prebuilt for: GB-only, 5 clusters,
# 2013 weather year, sector-coupled overnight 2050, weekly (168H) resolution
# set the canonical way via scenario.sector_opts so it lands in filenames.
# Installed as models/pypsa-eur/config/config.yaml; this copy is the tracked
# source of truth. Every key validated against config.default.yaml @ 3e32e3c6.

run:
  name: baseline

# GB + IE, not GB alone: JRC-IDEES is EU-27 scoped, and build_energy_totals
# crashes on an empty IDEES country list (verified 2026-07-23). Ireland is
# the smallest natural companion and keeps the model tiny.
countries:
- GB
- IE

atlite:
  default_cutout: europe-2013-sarah3-era5

scenario:
  clusters:
  - 5
  sector_opts:
  - 168H
  planning_horizons:
  - 2050

# the default hook is a no-op stub, and the rule resolves it to an ABSOLUTE
# path inside solve params — which differs in every runspace clone and marks
# the solve "params changed" forever, breaking the settledness oracle. The
# baseline must carry no path-dependent params.
solving:
  solver:
    name: highs
    options: highs-default
  options:
    custom_extra_functionality: ""
