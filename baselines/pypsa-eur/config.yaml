# Zygon baseline reference config — pypsa-eur (see archive/fixtures/BASELINE.md).
# The ONE configuration the template is prebuilt for: GB+IE, 5 clusters,
# 2013 weather year, sector-coupled overnight 2050, weekly (168h) resolution.
# Installed as models/pypsa-eur/config/config.yaml; this copy is the tracked
# source of truth. Every key validated against config.default.yaml @ a6c45e5
# (upstream master, "Streamline workflow" #1838, 2026-09-09) through the
# model's own pydantic schema (scripts/lib/validation/config).
#
# a6c45e5 has no `scenario` block and no wildcards: cluster count lives in
# clustering.cluster_network.n_clusters, temporal resolution in
# clustering.temporal.averaging (a pandas offset; the old 168H sector_opts
# token), horizons in the top-level planning_horizons list. Networks are
# resources/<run>/networks/composed_<horizon>.nc and
# results/<run>/networks/solved_<horizon>.nc.

run:
  name: baseline

# GB + IE, not GB alone: JRC-IDEES is EU-27 scoped, and build_energy_totals
# crashes on an empty IDEES country list (verified 2026-07-23). Ireland is
# the smallest natural companion and keeps the model tiny.
countries:
- GB
- IE

atlite:
  default_cutout: europe-2013-sarah3-era5

foresight: overnight

planning_horizons:
- 2050

clustering:
  cluster_network:
    n_clusters: 5
  temporal:
    averaging: 168h

# the default hook resolves to an ABSOLUTE path inside solve params — which
# differs in every runspace clone and marks the solve "params changed"
# forever, breaking the settledness oracle. The baseline must carry no
# path-dependent params.
solving:
  solver:
    name: highs
    options: highs-default
  options:
    custom_extra_functionality: ""
