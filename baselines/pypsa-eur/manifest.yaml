# Execution profile for the pypsa-eur baseline — consumed by referee/workspace.py
# and bin/harness. The app reads `invocation.targets` and `verify`; the
# `budget` block is a zygon-era hint. Machine-local binary/interpreter hints
# were dropped on 2026-09-10 with the re-anchor to upstream a6c45e5: the
# binary is resolved from $ZYGON_SNAKEMAKE_EUR > $ZYGON_SNAKEMAKE > snakemake
# on PATH, the interpreter from $ZYGON_PYTHON.
model: pypsa-eur

invocation:
  # eur installs the baseline as config/config.yaml in the template; bundles
  # overlay into that file in the runspace. No --configfile needed.
  style: installed-config
  configfile: null
  # the network targets ONLY, not rule all: the default target drags the
  # summary/plot tail into invalidation AND execution, and a cosmetic plot
  # rule crashing (a new carrier without a tech_colors entry) fails an
  # otherwise-good solve (issue #4, runs/issues/interview-evals-20260728.md).
  # Networks are everything extraction/figures consume; the baseline settles
  # against these trivially (subset of all).
  #
  # a6c45e5 (streamlined workflow, #1838): no wildcards. The composed network
  # is one file per horizon under resources/, the solved network under
  # results/; {planning_horizons} renders from the effective config's list
  # (single-element lists collapse, multi-element lists fan out one target
  # per horizon).
  targets:
  - "resources/{run.name}/networks/composed_{planning_horizons}.nc"
  - "results/{run.name}/networks/solved_{planning_horizons}.nc"
  flags: ["--workflow-profile", "none"]

cores: 4

# run-scoped output subtrees, REAL-copied (mtime-preserving) into every clone
# instead of hardlinked: template file inodes are a-w and snakemake refuses to
# plan over write-protected existing outputs. These hold every file a rerun
# may overwrite; everything else stays hardlinked and frozen.
writable_subtrees:
- "resources/{run.name}"
- "results/{run.name}"

budget:
  # with network-only targets an L0/L1 delta at compose level is 2 jobs
  # (compose_network + solve_network — a6c45e5 folded add_electricity,
  # prepare_sector_network, prepare_network, brownfield and the CO2 budget
  # into the single compose_network rule); a delta in the build_* chain is
  # ~5-15 jobs; a full rebuild of the resources chain is ~80 (49 build_sector
  # + 28 build_electricity rules, not all active). 40 still separates the
  # classes. Job counts not re-measured on a6c45e5.
  max_jobs: 40
  timeout_s: 3600
  # the no-download hard rule, made mechanical: any proposed job matching this
  # regex refuses execution, --force cannot override. Names checked against
  # rules/retrieve.smk and rules/build_electricity.smk at a6c45e5
  # (retrieve_*, download_copernicus_land_cover, build_cutout).
  deny_rules: "^(retrieve_|download_|build_cutout)"
  # laptop-class envelope: job count can't see job COST — a 168h->3h bundle
  # passed a 27-job gate and ran 5x the smoke (2026-07-28). On the 5-node
  # baseline nothing finer than daily; cluster count never moves (a change
  # rebuilds the whole resources chain). Temporal resolution is
  # clustering.temporal.averaging (pandas offset) at a6c45e5.
  envelope:
    temporal_floor_h: 24
    pinned_keys: ["clustering.cluster_network.n_clusters", "snapshots"]

# documented prerequisite, never checked — an absent license makes the solve
# fail loudly, which is the honest failure mode. The tracked overlays select
# highs; gurobi only if a bundle switches solving.solver.name.
requires: [gurobi-license]

# path templates rendered from the EFFECTIVE config (default <- installed
# overlay), so a bundle that changes a wildcard-bearing key retargets
# correctly. {dotted.key} resolves via deep_get; single-element lists collapse.
verify:
  networks:
  - stage: prepared
    path: "resources/{run.name}/networks/composed_{planning_horizons}.nc"
  - stage: solved
    path: "results/{run.name}/networks/solved_{planning_horizons}.nc"
