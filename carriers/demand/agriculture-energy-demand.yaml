id: agriculture-energy-demand
title: Agriculture energy demand (farming, forestry, fishing)
summary: >
  Final energy demand of the agriculture/forestry/fishing sector — electricity,
  heat and fuel use — as network loads.

when_to_use:
  - "add or change agriculture / farming energy demand"
  - "irrigation pumping electricity"
  - "agricultural diesel / fuel use"
  - "forestry and fishing energy"
  - "rural energy demand from agriculture"
  - "greenhouse heating"
  - "scale agriculture demand"
  - "known in pypsa-eur as: agriculture electricity, agriculture heat"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Two annual-constant nodal loads: 'agriculture electricity' on the AC buses and
        'agriculture oil' on the oil buses (p_set = TWh * 1e6 / 8760), plus a negative
        'oil emissions' load ('agriculture oil emissions') on the co2 atmosphere bus for
        the oil burn.
      mechanism: >
        add_agriculture in scripts/prepare_sector_network.py reads the nodal energy totals
        csv (population-weighted country totals from rule prepare_heat_data,
        pop_layout.fraction) and adds loads from the 'agriculture electricity' and
        'agriculture oil' columns; runs when sector.enable.agriculture. Country totals
        come from UNSD balances (build_base_energy_totals.py calc_sector 'agriculture'
        also fills 'agriculture biomass' and 'agriculture coal') and are scaled by
        prepare_energy_totals.py CAGRs per demand scenario and horizon.
      not_covered: >
        No agriculture heat load (the 'agriculture biomass'/'agriculture coal' columns are
        built but not consumed by add_agriculture); machinery is not distinct from other
        oil use (see agriculture-machinery-demand); no electrification-of-machinery lever;
        flat profile with no seasonality (e.g. irrigation or harvest peaks); allocation by
        population, not by cropland or farm activity.
      provenance: "scripts/prepare_sector_network.py:add_agriculture;scripts/build_base_energy_totals.py:agriculture electricity;scripts/prepare_heat_data.py:nodal_energy_totals"
    levers:
      - key: sector.enable.agriculture
        effect: "Toggles add_agriculture on/off."
        default: "true"
        provenance: "config.default.yaml:agriculture;scripts/prepare_sector_network.py:add_agriculture"
      - key: scenario.demand
        effect: "Demand-scenario wildcard selecting the CAGR pathway scaling agriculture totals."
        default: "[AB]"
        provenance: "config.default.yaml:demand:;scripts/prepare_energy_totals.py:growth_factors_cagr"
      - key: demand_data.base_year
        effect: "Base year from which agriculture CAGRs are compounded."
        default: "2019"
        provenance: "config.default.yaml:base_year;scripts/prepare_energy_totals.py:calculate_end_values"
    boundary:
      - variant: "switch agriculture demand on/off"
        rung: L0
        note: "sector.enable.agriculture."
      - variant: "scale agriculture electricity/oil or electrify over time"
        rung: L3
        note: "Edit the 'agriculture electricity' and 'agriculture oil' columns of data/demand/growth_factors_cagr.csv / efficiency_gains_cagr.csv per country."
      - variant: "seasonal profile (irrigation/harvest)"
        rung: L2
        note: "p_set is flat; replace with a time series in add_agriculture (external profile data would add L3)."
      - variant: "allocate by cropland/farmland instead of population"
        rung: L4
        note: "Needs a new spatial dataset and a change to how nodal_energy_totals are formed (prepare_heat_data currently applies pop_layout.fraction to all columns)."
      - variant: "add an agriculture heat load (biomass/coal columns)"
        rung: L2
        note: "Columns exist in the energy totals; add a load in add_agriculture (pypsa-eur's 'agriculture heat' on services rural heat is the template)."
    where:
      - change: "agriculture load creation"
        anchor: "scripts/prepare_sector_network.py:add_agriculture"
        provenance: "scripts/prepare_sector_network.py:add_agriculture"
      - change: "nodal allocation"
        anchor: "rule prepare_heat_data -> scripts/prepare_heat_data.py (nodal_energy_totals)"
        provenance: "Snakefile:rule prepare_heat_data;scripts/prepare_heat_data.py:nodal_energy_totals"
      - change: "country totals and scenario scaling"
        anchor: "scripts/build_base_energy_totals.py:calc_sector + data/demand/growth_factors_cagr.csv"
        provenance: "scripts/build_base_energy_totals.py:calc_sector;data/demand/growth_factors_cagr.csv:agriculture electricity"
    data_dependencies:
      - input: "UNSD energy balances agriculture columns"
        required_for: "demand level and elec/oil split"
        availability: "must be built (build_base_energy_totals; global, sparse for some countries)"
      - input: "clustered population layout"
        required_for: "nodal allocation"
        availability: "must be built"
      - input: "data/demand CAGR csvs agriculture columns"
        required_for: "scenario scaling"
        availability: "exists by default (DEFAULT row fallback)"
    demand_dimensions:
      driver: "Country agriculture/forestry/fishing final energy from UNSD balances (electricity and oil columns)"
      spatial: "Population fraction of the clustered population layout"
      temporal: "Annual-constant (p_set = annual TWh * 1e6 / 8760)"
      scenario: "Per-country CAGR csvs per {demand} wildcard compounded from demand_data.base_year"

  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        Three demand strands for agriculture/forestry/fishing: 'agriculture electricity'
        on AC buses, 'agriculture heat' on the services rural heat buses, and machinery
        energy split into 'agriculture machinery electric' and 'agriculture machinery oil'
        via per-year shares and efficiencies.
      mechanism: >
        add_agriculture in scripts/prepare_sector_network.py reads the population-weighted
        energy totals columns 'total agriculture electricity', 'total agriculture heat'
        and 'total agriculture machinery' (built from JRC-IDEES rows in
        build_energy_totals.py, gaps filled with average IDEES sub-shares of eurostat
        'total agriculture') and adds static loads p_set = TWh * 1e6 / nhours; machinery
        is split by agriculture_machinery_electric_share / oil_share (get() per
        investment year) with the electric part divided by the efficiency gain
        fuel_efficiency/electric_efficiency, and the oil part on 'agriculture machinery
        oil' buses (regional per regional_oil_demand) with CO2 on the supply link.
      not_covered: >
        Flat profiles for all three strands (no seasonality); allocation by population,
        not farm activity; no hydrogen/biofuel machinery option; heat goes to services
        rural heat (shares that heating system's supply mix rather than having own
        technologies).
      provenance: "scripts/prepare_sector_network.py:add_agriculture;scripts/build_energy_totals.py:total agriculture machinery;rules/build_sector.smk:rule build_population_weighted_energy_totals"
    levers:
      - key: sector.agriculture
        effect: "Toggles add_agriculture on/off (requires heating and industry per the code comment)."
        default: "true"
        provenance: "config/config.default.yaml:agriculture;scripts/prepare_sector_network.py:add_agriculture"
      - key: sector.agriculture_machinery_electric_share
        effect: "Electric share of machinery energy (scalar or per-year dict via get())."
        default: "0.5"
        provenance: "config/config.default.yaml:agriculture_machinery_electric_share;scripts/prepare_sector_network.py:agriculture_machinery_electric_share"
      - key: sector.agriculture_machinery_oil_share
        effect: "Oil share of machinery energy; sum != 1 scales machinery demand (warning logged)."
        default: "0.5"
        provenance: "config/config.default.yaml:agriculture_machinery_oil_share;scripts/prepare_sector_network.py:agriculture_machinery_oil_share"
      - key: sector.agriculture_machinery_fuel_efficiency
        effect: "Fuel machinery efficiency (numerator of the electric efficiency gain)."
        default: "0.7"
        provenance: "config/config.default.yaml:agriculture_machinery_fuel_efficiency;scripts/prepare_sector_network.py:agriculture_machinery_fuel_efficiency"
      - key: sector.agriculture_machinery_electric_efficiency
        effect: "Electric machinery efficiency (denominator; electric demand = share/efficiency_gain * energy)."
        default: "0.3"
        provenance: "config/config.default.yaml:agriculture_machinery_electric_efficiency;scripts/prepare_sector_network.py:agriculture_machinery_electric_efficiency"
      - key: sector.regional_oil_demand
        effect: "Regional vs single EU bus for machinery-oil demand."
        default: "true"
        provenance: "config/config.default.yaml:regional_oil_demand;scripts/prepare_sector_network.py:regional_oil_demand"
      - key: energy.energy_totals_year
        effect: "Statistics year of the agriculture totals baseline."
        default: "2023"
        provenance: "config/config.default.yaml:energy_totals_year;rules/build_sector.smk:energy_totals_year"
      - key: adjustments.sector
        effect: "Generic per-carrier factor/absolute overrides on static attributes; can scale the static p_set of the agriculture loads per investment year."
        default: "factor: Link: electricity distribution grid: capital_cost: 1.0 (example stub)"
        provenance: "config/config.default.yaml:adjustments;scripts/prepare_network.py:modify_attribute"
    boundary:
      - variant: "electrify agricultural machinery over time"
        rung: L0
        note: "Per-year dicts on agriculture_machinery_{electric,oil}_share."
      - variant: "scale agriculture electricity/heat demand"
        rung: L1
        note: "adjustments.sector factor on Load p_set for carriers 'agriculture electricity' / 'agriculture heat' (static p_set, so modify_attribute applies)."
      - variant: "seasonal agriculture profile"
        rung: L2
        note: "Static p_set in add_agriculture; replace with time series."
      - variant: "allocate by agricultural land instead of population"
        rung: L4
        note: "Needs a new weighting input and changes to build_population_weighted_energy_totals or a bespoke allocation rule."
      - variant: "hydrogen or biofuel machinery"
        rung: L5
        note: "Only electric/oil split exists; new carrier logic needed."
    where:
      - change: "agriculture loads and machinery split"
        anchor: "scripts/prepare_sector_network.py:add_agriculture"
        provenance: "scripts/prepare_sector_network.py:add_agriculture"
      - change: "agriculture columns of energy totals"
        anchor: "scripts/build_energy_totals.py (rule build_energy_totals)"
        provenance: "scripts/build_energy_totals.py:total agriculture electricity;rules/build_sector.smk:rule build_energy_totals"
      - change: "nodal allocation weighting"
        anchor: "rule build_population_weighted_energy_totals -> scripts/build_population_weighted_energy_totals.py"
        provenance: "rules/build_sector.smk:rule build_population_weighted_energy_totals;scripts/build_population_weighted_energy_totals.py:build_population_weighted_energy_totals"
    data_dependencies:
      - input: "JRC-IDEES tertiary/agriculture rows + eurostat 'total agriculture'"
        required_for: "demand level and elec/heat/machinery split"
        availability: "must be built (retrieved; Europe only, IDEES gaps filled by averages)"
      - input: "pop_weighted_energy_totals.csv"
        required_for: "nodal allocation"
        availability: "must be built"
      - input: "services rural heat buses (heating enabled)"
        required_for: "'agriculture heat' load"
        availability: "exists by default when sector.heating is on"
    demand_dimensions:
      driver: "Country agriculture/forestry/fishing final energy by use (electricity/heat/machinery) from JRC-IDEES/eurostat"
      spatial: "Population-weighted energy totals per clustered region"
      temporal: "Annual-constant static p_set for all three strands"
      scenario: "Machinery share/efficiency keys (scalar or per-year dicts via get()); baseline via energy.energy_totals_year"
