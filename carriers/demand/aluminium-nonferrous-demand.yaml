# Carrier card: aluminium & non-ferrous metals demand — pypsa-earth + pypsa-eur
id: aluminium-nonferrous-demand
title: Aluminium & non-ferrous metals demand
summary: >
  Energy demand of non-ferrous metallurgy — alumina refining, primary
  aluminium smelting (electrolysis), secondary (recycled) aluminium, and other
  non-ferrous metals (copper, zinc, lead) — an electricity-dominated industry
  with smelter process emissions.

when_to_use:
  - "add aluminium industry / smelter demand"
  - "primary vs secondary (recycled) aluminium share"
  - "alumina refinery energy"
  - "non-ferrous metals sector, copper, zinc, lead"
  - "aluminium electrolysis electricity demand"
  - "smelters as flexible/interruptible load"
  - "aluminium production tonnage scenarios"
  - "PFC / smelting process emissions"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Annual final-energy demand of the "non-ferrous metals" UNSD subsector
        per country and carrier, CAGR-grown, plus process emissions estimated
        from national aluminium production tonnage (data/AL_production.csv, BGS
        statistics, 2015-2022) x 1.5 tCO2/t (primary-aluminium factor). The
        subsector is distributed to nodes by GDP share, because the default
        industrial database contains no aluminium plants.
      mechanism: >
        rule build_base_industry_totals pivots UNSD "consumption by non-ferrous
        metals" transactions into country x carrier MWh; rule
        build_industry_demand reads data/AL_production.csv for the year set by
        demand_data.aluminium_year, fills missing countries with 0.0 (warning
        logged), computes AL_emissions = production x emission_factors
        non-ferrous metals (1.5, comment: taken from Aluminum primary) and
        writes them into the process emissions row; nodal distribution via rule
        build_industrial_distribution_key — its match_technology maps an
        "Aluminium" technology to "non-ferrous metals", but
        build_industrial_database only creates steel/cement/refinery/paper/
        ammonia entries, so the sector falls to the GDP key unless a custom
        database provides Aluminium plants. prepare_sector_network:add_industry
        turns the carrier columns into constant loads (industry electricity
        etc.) and routes the process emissions to the process-emissions bus.
      not_covered: >
        No alumina / primary / secondary route split, no Al_primary_fraction
        lever, no per-tonne electricity intensity (energy comes only from the
        UNSD aggregate), no smelter siting data out of the box (GDP spread),
        no other-non-ferrous detail. AL_production.csv is used ONLY for
        process emissions, not for energy demand.
      provenance: "data/unsd_transactions.csv:non-ferrous metals;scripts/build_industry_demand.py:AL_production.csv;scripts/build_industry_demand.py:aluminium_year;scripts/build_industry_demand.py:AL_emissions;scripts/build_industrial_distribution_key.py:Aluminium;scripts/build_industrial_database.py:create_steel_db;scripts/prepare_sector_network.py:def add_industry"
    levers:
      - key: demand_data.aluminium_year
        effect: "Selects the AL_production.csv year (2015-2022 present) for the aluminium process-emission estimate."
        default: "2019"
        provenance: "config.default.yaml:aluminium_year;scripts/build_industry_demand.py:aluminium_year"
      - key: sector.industry_util_factor
        effect: "Utilisation factor applied to steel/cement/refinery capacity emissions in the same table; note the aluminium emission term itself is NOT multiplied by it in build_industry_demand.py."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor;scripts/build_industry_demand.py:industry_util_factor"
      - key: custom_data.industry_demand
        effect: "Full override incl. the non-ferrous metals column via data/custom/industry_demand_{demand}_{planning_horizons}.csv."
        default: "false"
        provenance: "config.default.yaml:industry_demand;scripts/build_industry_demand.py:industry_demand"
      - key: custom_data.industry_database
        effect: "Custom plant list — the only way to site non-ferrous demand at smelters (technology 'Aluminium' maps to non-ferrous metals)."
        default: "false"
        provenance: "config.default.yaml:industry_database;scripts/build_industrial_distribution_key.py:industry_database"
    boundary:
      - variant: "pick aluminium statistics year"
        rung: L0
        note: "demand_data.aluminium_year (2015-2022 in data/AL_production.csv)."
      - variant: "non-ferrous demand growth per country"
        rung: L3
        note: "edit the non-ferrous metals column of data/demand/industry_growth_cagr.csv."
      - variant: "site demand at actual smelters"
        rung: L3
        note: "custom_data.industry_database: true with Aluminium-technology rows in data/custom/industrial_database.csv — mapping hook already exists in match_technology."
      - variant: "change the aluminium emission factor"
        rung: L2
        note: "emission_factors dict (non-ferrous metals: 1.5) hardcoded in build_industry_demand.py."
      - variant: "primary vs secondary aluminium split / per-tonne intensities"
        rung: L5
        note: "no route or tonnage-driven energy model; porting the pypsa-eur NFM sector-ratio chain is new code + data."
      - variant: "smelter as interruptible/flexible load"
        rung: L5
        note: "loads are constant p_set; demand-side flexibility needs bespoke components."
    where:
      - change: "aluminium process-emission computation"
        anchor: "scripts/build_industry_demand.py (AL_prod_tom, AL_emissions)"
        provenance: "scripts/build_industry_demand.py:AL_prod_tom"
      - change: "national aluminium production data"
        anchor: "data/AL_production.csv (BGS World Mineral Statistics)"
        provenance: "data/AL_production.csv:production[ktons/a]"
      - change: "technology-to-industry mapping for smelter siting"
        anchor: "scripts/build_industrial_distribution_key.py:match_technology"
        provenance: "scripts/build_industrial_distribution_key.py:match_technology"
      - change: "UNSD subsector parsing"
        anchor: "rule build_base_industry_totals"
        provenance: "Snakefile:rule build_base_industry_totals;scripts/build_base_industry_totals.py:create_industry_base_totals"
    data_dependencies:
      - input: "data/AL_production.csv"
        required_for: "aluminium process emissions"
        availability: "exists by default (checked in, BGS 2015-2022, 41 producing countries); non-listed countries filled with 0.0"
      - input: "UNSD energy balances (data/demand/unsd/data)"
        required_for: "non-ferrous energy totals"
        availability: "must be built (downloaded); region-dependent"
      - input: "custom industrial database with Aluminium rows"
        required_for: "smelter-level siting"
        availability: "absent by default — GDP spread is the default behaviour"
    demand_dimensions:
      driver: "UNSD final energy TWh of non-ferrous metals x CAGR; process emissions from ktons/a aluminium production x 1.5 tCO2/t"
      spatial: "GDP share by default (no aluminium plants in the built database); plant capacities if a custom database is supplied"
      temporal: "annual-constant loads (annual MWh / 8760)"
      scenario: "{demand} + {planning_horizons} via CAGR; demand_data.aluminium_year for the emissions base"

  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        Four separate non-ferrous products with kt/a tonnage per country from
        the JRC-IDEES NFM sheet — Alumina production, Aluminium primary
        production, Aluminium secondary production, Other non-ferrous metals —
        a future primary/secondary aluminium reallocation via
        Al_primary_fraction per horizon, per-tonne intensities (alumina
        high-enthalpy heat on methane, smelting electrolysis electricity,
        secondary route fully electrified, primary-route process emissions).
      mechanism: >
        build_industrial_production_per_country reads NFM fields "Alumina
        production (kt)", "Aluminium - primary production", "Aluminium -
        secondary production", "Other non-ferrous metals (kt lead eq.)";
        build_industrial_production_per_country_tomorrow scales the primary
        column by Al_primary_fraction (fraction_persistent_primary) and moves
        the rest to secondary; build_industry_sector_ratios:non_ferrous_metals
        derives MWh/t (Aluminium electrolysis (smelting) electricity, alumina
        high-enthalpy heat to methane, electrified processing/finishing) and
        tCO2/t process emissions for the primary route; today's energy from
        JRC energy-balance sheets FC_IND_NFM_AM_E / FC_IND_NFM_PA_E /
        FC_IND_NFM_SA_E / FC_IND_NFM_OM_E; siting via the hotmaps
        "Non-ferrous metals" subsector (sector_mapping in
        build_industrial_production_per_node); prepare_sector_network:add_industry
        places the electricity/gas/heat loads and process emissions as
        annual-constant exogenous carrier demands.
      not_covered: >
        Alumina and other-NFM production volumes are frozen at the reference
        year (only the aluminium primary/secondary split has a tomorrow
        transformation); no scrap availability constraint; no inert-anode or
        smelter-flexibility representation (loads are constant); no dedicated
        aluminium plant tracker — hotmaps emissions decide siting.
      provenance: "scripts/build_industrial_production_per_country.py:Alumina production (kt);scripts/build_industrial_production_per_country_tomorrow.py:al_primary_fraction;scripts/build_industry_sector_ratios.py:def non_ferrous_metals;scripts/build_industry_sector_ratios.py:Aluminium electrolysis (smelting);scripts/build_industrial_energy_demand_per_country_today.py:FC_IND_NFM_PA_E;scripts/build_industrial_production_per_node.py:sector_mapping;scripts/prepare_sector_network.py:def add_industry"
    levers:
      - key: industry.Al_primary_fraction
        effect: "Fraction of aluminium from primary smelting per planning horizon; remainder becomes secondary (recycled) production."
        default: "{2020: 0.4, ..., 2050: 0.2}"
        provenance: "config/config.default.yaml:Al_primary_fraction;scripts/build_industrial_production_per_country_tomorrow.py:al_primary_fraction"
      - key: industry.sector_ratios_fraction_future
        effect: "Interpolation from today's country-specific MWh/t toward best-in-class ratios for all NFM products."
        default: "{2020: 0.0, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future;scripts/build_industry_sector_ratios_intermediate.py:fraction_future"
      - key: industry.reference_year
        effect: "JRC year for NFM tonnage and today's intensities."
        default: "2023"
        provenance: "config/config.default.yaml:reference_year;scripts/build_industrial_production_per_country.py:reference_year"
      - key: industry.hotmaps_locate_missing
        effect: "Geocode hotmaps sites lacking coordinates — improves non-ferrous siting completeness."
        default: "false"
        provenance: "config/config.default.yaml:hotmaps_locate_missing;scripts/build_industrial_distribution_key.py:hotmaps_locate_missing"
    boundary:
      - variant: "more recycled aluminium"
        rung: L0
        note: "industry.Al_primary_fraction per-year dict."
      - variant: "faster efficiency improvement"
        rung: L0
        note: "industry.sector_ratios_fraction_future."
      - variant: "endogenous fuel choice for NFM process heat"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork: alumina (100% heat500+ from the backup shares), primary and secondary aluminium and other non-ferrous heat split into bands with competing supply links; smelting electricity is untouched — industry-process-heat-endogenous."
      - variant: "scale total aluminium production volume"
        rung: L3
        note: "no config factor — override resources/industrial_production_per_country.csv aluminium columns."
      - variant: "change smelting electricity intensity assumptions"
        rung: L2
        note: "non_ferrous_metals() JRC slicing in build_industry_sector_ratios.py."
      - variant: "smelter siting from a plant tracker instead of hotmaps"
        rung: L4
        note: "needs a new retrieve rule + a prepare_* database function in build_industrial_distribution_key.py analogous to prepare_gem_steel_database."
      - variant: "interruptible smelter demand response"
        rung: L5
        note: "loads are constant p_set; flexibility requires bespoke components/constraints."
    where:
      - change: "primary/secondary aluminium reallocation"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py (Al block)"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:al_primary_fraction"
      - change: "per-tonne NFM intensities and smelter process emissions"
        anchor: "scripts/build_industry_sector_ratios.py:non_ferrous_metals"
        provenance: "scripts/build_industry_sector_ratios.py:def non_ferrous_metals"
      - change: "NFM tonnage extraction"
        anchor: "scripts/build_industrial_production_per_country.py (NFM fields)"
        provenance: "scripts/build_industrial_production_per_country.py:Other non-ferrous metals (kt lead eq.)"
      - change: "siting (hotmaps Non-ferrous metals)"
        anchor: "scripts/build_industrial_production_per_node.py:sector_mapping + build_industrial_distribution_key"
        provenance: "scripts/build_industrial_production_per_node.py:sector_mapping;rules/build_sector.smk:rule build_industrial_distribution_key"
    data_dependencies:
      - input: "JRC-IDEES NFM Industry + EnergyBalance sheets"
        required_for: "tonnage and intensities per product"
        availability: "must be built (retrieved); EU27 native, non-EU27 Eurostat-scaled"
      - input: "hotmaps industrial sites (Non-ferrous metals subsector)"
        required_for: "nodal distribution"
        availability: "must be built (retrieved); population fallback"
    demand_dimensions:
      driver: "kt/a per product (alumina, Al primary, Al secondary, other NFM in lead eq.) times MWh/t ratios"
      spatial: "hotmaps Non-ferrous metals emission keys; population fallback"
      temporal: "annual-constant loads"
      scenario: "Al_primary_fraction and sector_ratios_fraction_future per-horizon dicts via {planning_horizons}"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "primary vs secondary aluminium as separate processes with tonnage drivers — mirrored by pypsa-eur's Al_primary_fraction and JRC primary/secondary sheets"
    - "alumina refining as an upstream process with its own (thermal) energy demand distinct from electrolysis"
    - "copper/zinc primary and secondary treated as own processes (folded into one Other non-ferrous metals product in pypsa-eur)"
  sources:
    - "https://www.forecast-model.eu/forecast-en/content/methodology.php"
    - "https://www.sciencedirect.com/science/article/pii/S2211467X18300890"
    - "https://github.com/fraunhofer-isi/forecast-sites"
