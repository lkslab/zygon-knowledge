id: electricity-distribution-losses
title: Electricity distribution losses as demand
summary: >
  Energy lost in the low-voltage distribution grid between transmission nodes and
  final consumers — how the model represents (or deducts) these losses relative to
  measured electricity demand, which already includes them.
when_to_use:
  - "model distribution grid losses"
  - "grid losses as extra demand"
  - "technical and non-technical losses"
  - "low voltage network losses"
  - "T&D losses in demand data"
  - "why is electricity demand scaled by 0.97"
  - "add a distribution grid / low voltage level"
  - "change distribution grid efficiency"
  - "losses between transmission and consumers"
  - "distribution grid cost of electrification"
  - "known in pypsa-eur as: electricity distribution grid, low voltage"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Sector-coupled networks only (rule prepare_sector_network). When
        sector.electricity_distribution_grid is true, add_electricity_distribution_grid
        adds a "low voltage" bus per node and an extendable bidirectional Link
        (p_min_pu=-1) with carrier "electricity distribution grid" — built with
        efficiency=1, i.e. the link itself is LOSSLESS. Losses are handled on the
        DEMAND side instead: because measured load totals already include distribution
        losses, AC loads' p_set is multiplied by
        sector.transmission_efficiency."electricity distribution grid".efficiency_static
        (0.97, i.e. 3% deducted). AC loads and all loads whose carrier contains
        "electricity" (industry, rail, agriculture, services), plus BEV chargers, V2G,
        heat pumps, resistive heaters and micro-CHP, are then moved to the low voltage
        buses; rooftop PV and home batteries attach there too.
      mechanism: >
        scripts/prepare_sector_network.py:add_electricity_distribution_grid, gated by
        options["electricity_distribution_grid"]; demand deduction via the
        transmission_efficiency option; distribution grid CAPEX from the cost data row
        "electricity distribution grid".
      not_covered: >
        Losses are NOT modelled as flow-dependent link losses or an explicit loss Load —
        the LV link stays efficiency=1 and demand is simply scaled down (unlike
        pypsa-eur, which additionally splits the LV link into lossy unidirectional
        links). earth's _helpers.lossy_bidirectional_links is applied only to
        "H2 pipeline" in add_extra_components, not to the distribution grid. No
        per-country or per-node loss rates; no non-technical-loss representation;
        electricity-only workflow (no sector coupling) has no distribution grid at all.
      provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid; scripts/prepare_sector_network.py:Deducting distribution losses from electricity demand; config.default.yaml:efficiency_static; scripts/add_extra_components.py:lossy_bidirectional_links; scripts/_helpers.py:lossy_bidirectional_links"
    levers:
      - key: sector.electricity_distribution_grid
        effect: >
          Adds the low-voltage layer (buses + extendable HV-LV link), moves AC and
          electricity loads plus distributed technologies onto it, and triggers the
          loss deduction from demand.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.transmission_efficiency.electricity distribution grid.efficiency_static
        effect: >
          Static distribution efficiency: AC load p_set is multiplied by this value
          (0.97 = deduct 3% embedded losses). Setting 1.0 keeps measured demand
          (losses then implicitly counted as consumption).
        default: "0.97"
        provenance: "config.default.yaml:efficiency_static; scripts/prepare_sector_network.py:Deducting distribution losses from electricity demand"
    boundary:
      - variant: "turn the distribution grid layer off"
        rung: L0
        note: "sector.electricity_distribution_grid: false — loads stay on HV buses, no deduction"
      - variant: "change the assumed loss rate"
        rung: L0
        note: "sector.transmission_efficiency.'electricity distribution grid'.efficiency_static"
      - variant: "represent losses as actual link losses (extra generation burden) instead of a demand deduction"
        rung: L2
        note: "in add_electricity_distribution_grid set the LV Link efficiency below 1 (or apply the _helpers.lossy_bidirectional_links split as done for 'H2 pipeline'), and skip the p_set deduction to avoid double counting"
      - variant: "per-country / per-node loss rates (typical pypsa-earth ask — losses differ strongly by country)"
        rung: L2
        note: "the deduction is one scalar; make the multiplier a per-bus series in add_electricity_distribution_grid keyed by bus country"
      - variant: "explicit loss Load (losses visible as a separate demand carrier)"
        rung: L5
        note: "no such construct exists; needs a new Load whose p_set tracks flows — a flow-dependent quantity, so effectively custom constraint/component logic"
      - variant: "distribution losses in the electricity-only workflow"
        rung: L2
        note: "no LV layer exists there; simplest is scaling the demand profiles (scripts/build_demand_profiles.py) or line/link efficiency edits — small localised change"
      - variant: "non-technical losses (theft/metering) as separate scenario dimension"
        rung: L3
        note: "needs country loss-split data plus the L2 per-country multiplier edit; no dataset ships with the repo"
    where:
      - change: "LV layer creation, load relocation, and the 3% demand deduction"
        anchor: "scripts/prepare_sector_network.py:add_electricity_distribution_grid (gated by options electricity_distribution_grid)"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "lossy bidirectional link pattern to copy for the LV link"
        anchor: "scripts/_helpers.py:lossy_bidirectional_links (used for H2 pipeline in add_extra_components.py)"
        provenance: "scripts/_helpers.py:lossy_bidirectional_links; scripts/add_extra_components.py:lossy_bidirectional_links"
      - change: "electricity-only demand profiles (if scaling losses there)"
        anchor: "scripts/build_demand_profiles.py"
        provenance: "scripts/build_demand_profiles.py:build_demand_profiles"
    data_dependencies:
      - input: "cost data rows 'electricity distribution grid' (fixed, lifetime)"
        required_for: "CAPEX of the extendable HV-LV link"
        availability: "exists by default (retrieved cost data, costs_{planning_horizons}_sec.csv)"
      - input: "country-resolved distribution loss rates (e.g. utility statistics)"
        required_for: "per-country loss variant"
        availability: "absent — must be user-supplied"
    demand_dimensions:
      driver: "the AC electricity demand itself — losses enter as a fixed 3% share embedded in measured totals and are deducted, not added"
      spatial: "uniform scalar across all nodes; one LV bus per clustered AC bus"
      temporal: "purely multiplicative on the load profile (efficiency_static); no flow- or peak-dependence"
      scenario: "static across years and scenarios — no per-year dict for the efficiency"
  - model: pypsa-eur
    version_anchor: {ref: "d31ad9fa60c8fd9fe79e4647cde0a4a70eeb797c", date: "2026-10-09"}
    out_of_box:
      covers: >
        Two-part explicit mechanism in prepare_sector_network.
        (1) insert_electricity_distribution_grid (gated by
        sector.electricity_distribution_grid) adds "low voltage" buses, an extendable
        bidirectional HV-LV Link (initially efficiency=1), deducts embedded losses from
        measured demand — loads with carrier "electricity" multiplied by
        efficiency_static (0.97) when "electricity distribution grid" is in
        transmission_efficiency.enable — and moves electricity loads, BEV/V2G, heat
        pumps, resistive heaters, micro-CHP to LV; rooftop PV and home batteries
        attach at LV. (2) Afterwards lossy_bidirectional_links is applied to every
        enabled carrier including "electricity distribution grid": the LV link is
        split into two unidirectional links (p_min_pu=0 plus a "-reversed" twin) each
        with efficiency 0.97, so distribution losses ARE flow-dependent — every MWh
        delivered to LV consumes ~1.031 MWh at HV, and the deduction avoids double
        counting against measured totals.
      mechanism: >
        scripts/prepare_sector_network.py:insert_electricity_distribution_grid plus
        scripts/prepare_sector_network.py:lossy_bidirectional_links, driven by
        sector.transmission_efficiency (enable list + per-carrier efficiency_static);
        distribution grid CAPEX from cost row "electricity distribution grid".
      not_covered: >
        Single uniform loss rate — no per-country or per-voltage-level differentiation;
        no explicit loss Load component (losses appear as link conversion losses); no
        non-technical losses; electricity-only workflow (prepare_network) has no LV
        layer.
      provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/prepare_sector_network.py:lossy_bidirectional_links; scripts/prepare_sector_network.py:Deducting distribution losses from electricity demand; config/config.default.yaml:efficiency_static"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Adds the LV layer, relocates loads/DERs, rooftop PV and home batteries; prerequisite for distribution losses."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: sector.transmission_efficiency.electricity distribution grid.efficiency_static
        effect: >
          Sets both the demand deduction factor and the efficiency of each
          unidirectional LV link after the lossy split.
        default: "0.97"
        provenance: "config/config.default.yaml:efficiency_static; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: sector.transmission_efficiency.enable
        effect: >
          List of carriers that get lossy treatment; removing 'electricity distribution
          grid' keeps the LV link lossless AND skips the demand deduction.
        default: "[DC, H2 pipeline, H2 pipeline retrofitted, gas pipeline, electricity distribution grid]"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: sector.electricity_distribution_grid_cost_factor
        effect: >
          Documented as multiplying distribution grid investment cost (validation
          schema) — NOTE: no code
          applying this factor to the link capital cost was found at this ref in
          prepare_sector_network.py; treat as potentially vestigial and verify before
          relying on it.
        default: "1.0"
        provenance: "config/config.default.yaml:electricity_distribution_grid_cost_factor; scripts/lib/validation/config/sector.py:electricity_distribution_grid_cost_factor"
    boundary:
      - variant: "turn the distribution grid layer off"
        rung: L0
        note: "sector.electricity_distribution_grid: false"
      - variant: "change the loss rate"
        rung: L0
        note: "sector.transmission_efficiency.'electricity distribution grid'.efficiency_static"
      - variant: "keep the LV layer but make it lossless"
        rung: L1
        note: "remove 'electricity distribution grid' from sector.transmission_efficiency.enable (also disables the demand deduction)"
      - variant: "losses as pure demand deduction without flow-dependent link losses (earth-style)"
        rung: L2
        note: "decouple the two uses of efficiency_static — needs a small edit in insert_electricity_distribution_grid / the lossy loop, since one key drives both"
      - variant: "per-country loss rates"
        rung: L2
        note: "efficiency_static is one scalar per carrier; make it bus-dependent in lossy_bidirectional_links or scale loads per country in insert_electricity_distribution_grid"
      - variant: "explicit loss Load as separate demand carrier"
        rung: L5
        note: "losses are link conversion losses; a tracking Load is flow-dependent — custom component/constraint logic"
      - variant: "distribution grid cost sensitivity"
        rung: L1
        note: "adjustments.sector factor on the 'electricity distribution grid' Link capital_cost (the shipped config example); sector.electricity_distribution_grid_cost_factor is read by no script at this ref"
    where:
      - change: "LV layer, demand deduction, load/DER relocation, rooftop PV, home battery"
        anchor: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "lossy split of the LV link (and other enabled carriers)"
        anchor: "scripts/prepare_sector_network.py:lossy_bidirectional_links (loop over options transmission_efficiency)"
        provenance: "scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - change: "cost-factor key validation (no consumer in scripts)"
        anchor: "scripts/lib/validation/config/sector.py::electricity_distribution_grid_cost_factor"
        provenance: "config/config.default.yaml:electricity_distribution_grid_cost_factor; scripts/lib/validation/config/sector.py:electricity_distribution_grid_cost_factor"
    data_dependencies:
      - input: "cost data rows 'electricity distribution grid' (capital_cost, lifetime)"
        required_for: "CAPEX of the extendable HV-LV link"
        availability: "exists by default (technology-data derived costs resource)"
      - input: "solar rooftop potentials resource"
        required_for: "rooftop PV attached at LV (bundled into the same function)"
        availability: "must be built (snakemake input solar_rooftop_potentials)"
      - input: "country-resolved distribution loss rates"
        required_for: "per-country loss variant"
        availability: "absent — must be user-supplied"
    demand_dimensions:
      driver: "electricity demand time series (measured totals include losses); losses re-enter endogenously as 1/0.97 uplift on flows through the LV link"
      spatial: "one LV bus per AC node; uniform loss rate across countries"
      temporal: "flow-dependent — losses scale with instantaneous LV delivery, including electrified heat/transport at LV"
      scenario: "static efficiency across years; cost sensitivity via adjustments.sector (see cost-factor caveat)"
