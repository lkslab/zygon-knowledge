id: hydrogen-export-demand
title: Hydrogen export demand
summary: >
  Hydrogen produced inside the modelled region and shipped/piped out as an export —
  represented as an extra demand (exogenous load or price-driven endogenous sink)
  at export ports.
when_to_use:
  - "add hydrogen exports"
  - "green hydrogen export scenario"
  - "export H2 to Europe / world market"
  - "hydrogen shipping from ports"
  - "sell hydrogen abroad at a market price"
  - "power-to-X export hub"
  - "how much H2 can my country export"
  - "ammonia or fuel export demand"
  - "RE matching rules for exported hydrogen (additionality)"
  - "export volume sweep / sensitivity"
  - "known in pypsa-eur as: H2 liquefaction"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Fully covered as a first-class mechanism. Rule add_export
        (scripts/add_export.py) adds an "H2 export bus" placed offshore of the country
        shape, extendable Links from every port H2 bus to it (ports located via
        select_ports from resources export_ports.csv; if none found, ALL H2 buses
        become export nodes), an optional cyclic "H2 export store" on the export bus,
        and the demand itself: either an exogenous Load with carrier "H2 export"
        whose p_set profile is built by create_export_profile from the {h2export}
        wildcard (annual TWh), or — if export.endogenous — a negative-sign Generator
        priced at export.endogenous_price so the model chooses the export volume.
        The exogenous profile is "constant" (flat) or "ship" (batch profile from rule
        build_ship_profile: fill/travel/unload/pause cycles from ship capacity).
        solve_network.py additionally supports temporal-matching / additionality
        constraints on exported H2 via policy_config.hydrogen
        (hydrogen_temporal_constraint).
      mechanism: >
        Rule add_export inserts Bus "H2 export bus", port Links, optional Store, and
        Load or negative Generator "H2 export load"; the {h2export} wildcard is fed
        from the export.h2export config list through the solve_sector_networks expand,
        so one run per export volume.
      not_covered: >
        Only hydrogen — no ammonia/methanol/steel export demand; a single aggregate
        export bus (no per-destination markets or transport cost differentiation);
        ship profile is deterministic, not weather- or market-coupled; pipeline
        exports are not distinguished from shipping.
      provenance: "scripts/add_export.py:add_export; scripts/add_export.py:select_ports; scripts/add_export.py:create_export_profile; scripts/build_ship_profile.py:build_ship_profile; Snakefile:rule add_export; scripts/solve_network.py:hydrogen_temporal_constraint"
    levers:
      - key: export.h2export
        effect: "List of yearly export demands in TWh; each value becomes an {h2export} wildcard run (exogenous mode only)."
        default: "[10]"
        provenance: "config.default.yaml:h2export; Snakefile:solve_sector_networks"
      - key: export.endogenous
        effect: "true: export volume chosen by the model against endogenous_price (negative Generator); false: fixed Load from the wildcard."
        default: "false"
        provenance: "config.default.yaml:endogenous; scripts/add_export.py:export_endogenous"
      - key: export.endogenous_price
        effect: "EUR/MWh sale price for endogenous exports (negative marginal cost on the export Generator)."
        default: "400"
        provenance: "config.default.yaml:endogenous_price; scripts/add_export.py:endogenous_price"
      - key: export.export_profile
        effect: "'constant' (flat 8760 profile) or 'ship' (batch loading profile from build_ship_profile)."
        default: "ship"
        provenance: "config.default.yaml:export_profile; scripts/add_export.py:create_export_profile"
      - key: export.store
        effect: "Adds an extendable cyclic H2 Store on the export bus to buffer between production and ship departures."
        default: "true"
        provenance: "config.default.yaml:store; scripts/add_export.py:add_export"
      - key: export.store_capital_costs
        effect: "'no_costs' (free buffer) or 'standard_costs' (CAPEX of 'hydrogen storage tank type 1 including compressor')."
        default: "no_costs"
        provenance: "config.default.yaml:store_capital_costs; scripts/add_export.py:store_capital_costs"
      - key: export.ship.ship_capacity
        effect: "TWh per ship; with travel_time, fill_time, unload_time defines the batch export profile shape."
        default: "0.4"
        provenance: "config.default.yaml:ship_capacity; scripts/build_ship_profile.py:ship_capacity"
      - key: custom_data.export_ports
        effect: "true: use user-supplied data/custom/export_ports.csv as export ports instead of the World Port Index derived selection."
        default: "false"
        provenance: "config.default.yaml:export_ports; scripts/prepare_ports.py:custom_export"
      - key: policy_config.hydrogen.temporal_matching
        effect: "'hour'/'month'/'year' RE temporal matching constraint on export hydrogen production, or 'no_temporal_matching'."
        default: "no_temporal_matching"
        provenance: "config.default.yaml:temporal_matching; scripts/solve_network.py:temporal_matching"
      - key: policy_config.hydrogen.additionality
        effect: "Constrains matched RE to be additional relative to a zero-export reference network (path_to_ref / is_reference)."
        default: "false"
        provenance: "config.default.yaml:additionality; scripts/solve_network.py:additionality"
    boundary:
      - variant: "set an export volume (or sweep several)"
        rung: L0
        note: "export.h2export list — each entry is a separate {h2export} run"
      - variant: "let the model decide export volume at a price"
        rung: L0
        note: "export.endogenous: true + export.endogenous_price"
      - variant: "flat vs shipping-batch delivery profile"
        rung: L0
        note: "export.export_profile 'constant' | 'ship'; ship shape tuned by export.ship.*"
      - variant: "choose which ports export"
        rung: L3
        note: "custom_data.export_ports: true + provide data/custom/export_ports.csv (config flip plus a data file); default port set is filtered World Port Index"
      - variant: "custom export profile shape (e.g. monthly contract deliveries)"
        rung: L2
        note: "edit create_export_profile in scripts/add_export.py or build_ship_profile.py — both are small, self-contained"
      - variant: "export price time series instead of constant price"
        rung: L2
        note: "endogenous branch sets a scalar marginal_cost on the export Generator in add_export; pass a series instead"
      - variant: "ammonia / methanol / other-carrier export demand"
        rung: L4
        note: "no mechanism exists; mirror the add_export rule for the other carrier's buses (new rule + wildcard plumbing, cf. spatial ammonia buses in prepare_sector_network)"
      - variant: "multiple destination markets with distinct prices/transport costs"
        rung: L5
        note: "single aggregate export bus today; needs new component topology (several export buses, links, price series)"
      - variant: "RE matching / additionality rules on exports"
        rung: L1
        note: "policy_config.hydrogen.* combination (temporal_matching, spatial_matching, additionality, path_to_ref)"
    where:
      - change: "export bus/links/store/load creation and endogenous vs exogenous switch"
        anchor: "scripts/add_export.py:add_export (rule add_export)"
        provenance: "scripts/add_export.py:add_export; Snakefile:rule add_export"
      - change: "export profile construction and volume-wildcard handling"
        anchor: "scripts/add_export.py:create_export_profile"
        provenance: "scripts/add_export.py:create_export_profile"
      - change: "ship batch profile"
        anchor: "scripts/build_ship_profile.py:build_ship_profile (rule build_ship_profile)"
        provenance: "scripts/build_ship_profile.py:build_ship_profile; Snakefile:rule build_ship_profile"
      - change: "export port selection"
        anchor: "scripts/add_export.py:select_ports + scripts/prepare_ports.py (rule prepare_ports)"
        provenance: "scripts/add_export.py:select_ports; scripts/prepare_ports.py:filter_ports"
      - change: "export H2 RE-matching constraints"
        anchor: "scripts/solve_network.py:hydrogen_temporal_constraint"
        provenance: "scripts/solve_network.py:hydrogen_temporal_constraint"
    data_dependencies:
      - input: "resources export_ports.csv (from World Port Index download in prepare_ports.py, or data/custom/export_ports.csv)"
        required_for: "locating export port H2 buses (falls back to all H2 buses if empty)"
        availability: "built by rule prepare_ports; custom file must be user-supplied"
      - input: "ship_profile_{h2export}TWh.csv"
        required_for: "export_profile: 'ship'"
        availability: "built by rule build_ship_profile"
      - input: "costs_{planning_horizons}_sec.csv row 'hydrogen storage tank type 1 including compressor'"
        required_for: "export.store_capital_costs: standard_costs"
        availability: "exists by default (retrieved cost data)"
      - input: "reference (zero-export) solved network"
        required_for: "policy_config.hydrogen.additionality"
        availability: "must be built (is_reference run, then path_to_ref)"
    demand_dimensions:
      driver: "policy assumption: annual export volume in TWh ({h2export} wildcard from export.h2export), or price-elastic via endogenous_price"
      spatial: "H2 buses at port nodes (World Port Index or custom csv) linked to one offshore 'H2 export bus'"
      temporal: "flat profile or ship batch cycles (fill/travel/unload/pause from export.ship.*); optional export-bus store decouples production timing"
      scenario: "h2export list sweeps volumes as separate runs; policy_config.hydrogen adds matching/additionality scenario variants"
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        Nothing — pypsa-eur has no hydrogen (or other fuel) export demand mechanism.
        Grepping rules/ and scripts/prepare_sector_network.py for export/h2export finds
        no export bus, export load, or export wildcard. Hydrogen demand arises only
        endogenously (industry, shipping, synfuels): e.g. add_shipping creates Loads
        with carrier "H2 for shipping". The mirror concept exists instead: Europe as an
        IMPORTER of green fuels via add_import_options (sector.imports.enable, fixed
        import prices per carrier including H2).
      mechanism: >
        Absent. Nearest in-repo patterns: (a) add_shipping's "H2 for shipping" Load on
        nodal H2 buses — the template for attaching an exogenous H2 demand at chosen
        nodes; (b) add_import_options — the reverse (import) mechanism with per-carrier
        prices.
      not_covered: >
        Any representation of hydrogen leaving the modelled system as a demand:
        no export ports, no export volume wildcard, no export price sink.
      provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:H2 for shipping; scripts/prepare_sector_network.py:add_import_options; config/config.default.yaml:imports"
    levers: []
    boundary:
      - variant: "fixed H2 export demand at selected (e.g. port) nodes"
        rung: L3
        note: "add a Load on the chosen '<node> H2' buses with an annual-volume-derived p_set, following the add_shipping 'H2 for shipping' pattern; needs a small data input for volumes/locations plus a script edit — no native config"
      - variant: "price-driven endogenous export sink"
        rung: L3
        note: "add a negative-sign Generator (or Load with negative marginal utility via a Store/Link construction) on an export bus, priced at an assumed world-market price — mirror of add_import_options' fixed prices"
      - variant: "export volume as a sweep dimension (like earth's {h2export})"
        rung: L4
        note: "needs new rule + wildcard plumbing in rules/build_sector.smk and prepare_sector_network inputs — no existing wildcard carries export volume"
      - variant: "intra-European H2 trade"
        rung: L0
        note: "already endogenous via the H2 pipeline network between countries — not an 'export demand', just transmission"
      - variant: "Europe importing (not exporting) green H2/fuels"
        rung: L0
        note: "sector.imports.enable with per-carrier prices (add_import_options) — the built-in mirror of this card"
    where:
      - change: "template for an exogenous H2 Load at chosen buses"
        anchor: "scripts/prepare_sector_network.py:add_shipping"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
      - change: "template for a price-based cross-border fuel interface"
        anchor: "scripts/prepare_sector_network.py:add_import_options"
        provenance: "scripts/prepare_sector_network.py:add_import_options; config/config.default.yaml:imports"
      - change: "rule plumbing for a new export step"
        anchor: "rules/compose.smk (compose_network rule inputs/params, which feed prepare_sector_network.py)"
        provenance: "rules/compose.smk:compose_network"
    data_dependencies:
      - input: "export volumes and port locations (user assumption)"
        required_for: "any export-demand variant"
        availability: "absent — must be user-supplied"
      - input: "world-market H2 price assumption"
        required_for: "price-driven export sink"
        availability: "absent for exports (sector.imports.price documents the import-side analogue)"
    demand_dimensions:
      driver: "not modelled; would be an exogenous policy volume or world-market price assumption"
      spatial: "not modelled; natural attachment points are nodal H2 buses at ports (cf. add_shipping's port-based shipping demand)"
      temporal: "not modelled; simplest is a flat profile — no ship-batch profile machinery exists"
      scenario: "not modelled; would need new wildcard/config plumbing (L4) to sweep volumes"
