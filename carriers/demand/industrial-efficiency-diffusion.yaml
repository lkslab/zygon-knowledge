id: industrial-efficiency-diffusion
title: Industrial efficiency measures, technology diffusion and stock turnover
summary: >
  How industrial energy intensity improves over time — discrete
  energy-efficiency measures adopted at realistic diffusion speeds as the
  capital stock turns over — versus the smooth exogenous intensity paths energy
  system models typically assume.

when_to_use:
  - "industrial energy efficiency improvements"
  - "efficiency measures in industry"
  - "technology diffusion / adoption rates"
  - "stock turnover of industrial equipment"
  - "how fast can industry electrify"
  - "energy intensity trajectory for industry"
  - "best available technology BAT uptake"
  - "slow down or speed up industrial transition"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "FORECAST represents energy-efficiency measures (EEMs) explicitly, with technology diffusion curves and stock turnover — intensity falls only as vintages retire and measures are adopted, not by assumption."
    - "EEMs attach both to process-specific technologies and to cross-cutting ones (electric motors, steam & hot water systems, space heating, lighting), with technology data from IPPC BREF studies."
    - "Because demand is driven by physical production tonnages (PRODCOM/UN) across 60+ products, efficiency and activity effects are separable — the two things the CAGR-style shortcuts below conflate."
  sources:
    - "https://www.forecast-model.eu/forecast-en/content/methodology.php"
    - "https://www.sciencedirect.com/science/article/pii/S2211467X18300890"
    - "https://irees.de/wp-content/uploads/2020/06/1-031-16_Rehfeldt.pdf"
    - "https://github.com/fraunhofer-isi/forecast-sites"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Not covered for industry — and note a trap: the repo's
        data/demand/efficiency_gains_cagr.csv (applied in
        prepare_energy_totals) contains columns only for residential,
        services, transport, agriculture and "other" — NO industry columns,
        and prepare_energy_totals does not touch industry at all. Industry
        future demand is shaped solely by industry_growth_cagr.csv in
        build_industry_demand, a pure activity-growth compound rate with no
        separate efficiency term.
      mechanism: >
        growth_factors = (1 + cagr)^no_years applied uniformly to the UNSD
        baseline per industry. Any efficiency assumption must be baked into a
        lower CAGR (conflating activity and intensity) or into a custom demand
        csv per horizon.
      not_covered: >
        No EEMs, no diffusion curves, no stock turnover, no vintage tracking,
        no BAT benchmarks, no separation of activity from intensity for
        industry.
      provenance: "scripts/build_industry_demand.py:calculate_end_values; scripts/prepare_energy_totals.py:efficiency_gains_cagr; data/demand/efficiency_gains_cagr.csv:DEFAULT"

    levers:
      - key: custom_data.industry_demand
        effect: "Per-horizon custom csv — the honest way to encode an externally computed efficiency trajectory (e.g. FORECAST output) year by year."
        default: "false"
        provenance: "config.default.yaml:industry_demand; scripts/build_industry_demand.py:country_to_nodal"
      - key: demand_data.base_year
        effect: "Baseline the (efficiency-conflating) CAGRs compound from."
        default: "2019"
        provenance: "config.default.yaml:base_year; Snakefile:rule build_base_industry_totals"

    boundary:
      - variant: "net efficiency assumption (demand grows slower than activity)"
        rung: L3
        note: "lower the per-industry rates in data/demand/industry_growth_cagr.csv — implicit and undocumented, but zero code."
      - variant: "explicit intensity path separate from activity"
        rung: L3
        note: "precompute activity x intensity externally per horizon and feed custom_data.industry_demand csvs."
      - variant: "carrier-specific efficiency (e.g. only electric uses improve)"
        rung: L2
        note: "industry_growth_cagr.csv is per industry, not per carrier; a per-carrier factor means a small edit where industry_base_totals is multiplied in build_industry_demand."
      - variant: "genuine EEM diffusion with stock turnover"
        rung: L5
        note: "nothing to hook into — this is FORECAST-shaped soft-linking territory: run the intensity model outside and inject results via custom csvs (which drops it back to L3)."

    where:
      - change: "growth/efficiency application point"
        anchor: "calculate_end_values + production_tom in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:calculate_end_values; scripts/build_industry_demand.py:production_tom"
      - change: "activity-rate data"
        anchor: "data/demand/industry_growth_cagr.csv"
        provenance: "data/demand/industry_growth_cagr.csv:DEFAULT"
      - change: "custom trajectory injection"
        anchor: "custom_data.industry_demand branch (data/custom/industry_demand_{demand}_{planning_horizons}.csv)"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"

    data_dependencies:
      - input: "data/demand/industry_growth_cagr.csv"
        required_for: "any CAGR-embedded efficiency assumption"
        availability: "exists by default"
      - input: "external intensity trajectories (FORECAST-style model output)"
        required_for: "explicit efficiency paths"
        availability: "absent — external"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv per horizon"
        required_for: "injecting them"
        availability: "absent — user-supplied"

    demand_dimensions:
      driver: "single compound growth rate per industry — activity and efficiency inseparable"
      spatial: "unchanged by efficiency assumptions (same distribution keys)"
      temporal: "flat loads; efficiency has no time-of-day expression"
      scenario: "{demand} wildcard naming different CAGR/custom-csv worlds per planning horizon"

  - model: pypsa-eur
    version_anchor: {ref: "6128bf7effbe7243bcc46b2770d04cebe45613a5", date: "2026-10-26"}

    out_of_box:
      covers: >
        Not covered as diffusion/stock turnover. The crude proxy is exogenous
        ratio interpolation: build_industry_sector_ratios_intermediate blends
        today's per-country sector ratios (energy demand / production) with
        future best-in-class ratios via fraction_future =
        get(sector_ratios_fraction_future, year) — intensity =
        today x (1 - f) + future x f. The route-share dicts
        (St_primary_fraction, DRI_fraction, Al_primary_fraction, HVC
        recycling fractions) act as hand-set technology-diffusion proxies;
        with sector.endogenous_sectors.enable (off by default) primary steel
        and cement leave them: BOF, gas-DRI and H2-DRI routes and kiln fuels
        compete on cost, DRI_fraction is dormant for primary steel, and under
        myopic foresight existing blast furnaces retire by vintage or pledged
        year (steel-routes-endogenous, cement-routes-endogenous).
        Heat-supply technology inside industry is not an optimiser choice either by default: the carrier split follows the same exogenous blend; with sector.industry_t.endogen (fork) the endogenised sectors leave that blend and their heat supply becomes a model choice per temperature band.
      mechanism: >
        build_industrial_energy_demand_per_country_today derives today's
        country ratios; build_industry_sector_ratios the future best-in-class
        (largely electrified) ratios; _intermediate interpolates per
        planning_horizons; production tomorrow applies route shares; product =
        the per-node demand file.
      not_covered: >
        No vintage/stock model, no adoption-cost curves, no diffusion-speed
        constraints (a 2035 fraction_future of 1.0 would instantly retool all
        industry), no EEM catalogue. Efficiency is a scenario input, not a
        model outcome.
      provenance: "scripts/build_industry_sector_ratios_intermediate.py:fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future; scripts/build_industrial_energy_demand_per_country_today.py:industrial_energy_demand_per_country"

    levers:
      - key: industry.sector_ratios_fraction_future
        effect: "Per-year weight on best-in-class ratios — the model's entire industrial-efficiency trajectory in one dict."
        default: "0.0 (2020), 0.2 (2030), 0.7 (2040), 1.0 (2050)"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: industry.St_primary_fraction
        effect: "Steel route diffusion proxy (with DRI_fraction) — per-year hand-set adoption path."
        default: "0.6 (2020) falling to 0.3 (2050)"
        provenance: "config/config.default.yaml:St_primary_fraction; scripts/build_industrial_production_per_country_tomorrow.py:st_primary_fraction"
      - key: industry.DRI_fraction
        effect: "H2-DRI adoption path within primary steel."
        default: "0 (2020) rising to 1 (2050)"
        provenance: "config/config.default.yaml:DRI_fraction; scripts/build_industrial_production_per_country_tomorrow.py:dri_fraction"
      - key: industry.HVC_mechanical_recycling_fraction
        effect: "Recycling-technology adoption path for plastics (with HVC_chemical_recycling_fraction)."
        default: "0.12 (2020) rising to 0.3 (2050)"
        provenance: "config/config.default.yaml:HVC_mechanical_recycling_fraction; scripts/build_industrial_production_per_country_tomorrow.py:HVC_mechanical_recycling_fraction"

    boundary:
      - variant: "faster/slower efficiency improvement"
        rung: L1
        note: "reshape the sector_ratios_fraction_future dict per year."
      - variant: "sector-specific efficiency speeds"
        rung: L2
        note: "fraction_future is a single scalar per year across all sectors; per-sector weights need an edit in build_industry_sector_ratios_intermediate."
      - variant: "different best-in-class endpoint (e.g. less electrified future ratios)"
        rung: L2
        note: "edit the electrification assumptions in the sector functions of build_industry_sector_ratios."
      - variant: "endogenous heat-tech uptake in industry with a diffusion-speed brake"
        rung: L1
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork gives the endogenised sectors competing heat links (industry-process-heat-endogenous); sector.limit_max_growth is then the blunt per-carrier growth brake and sector.industry_t.must_run the duty floor. Note those sectors drop the fraction_future blend (today's intensities)."
      - variant: "explicit EEM catalogue with stock turnover and vintage retirement"
        rung: L5
        note: "honest answer: not implementable by config or data — needs a vintage-tracked demand-side model (FORECAST soft-link) or bespoke myopic-foresight components per industry."

    where:
      - change: "the interpolation itself"
        anchor: "rule build_industry_sector_ratios_intermediate"
        provenance: "scripts/build_industry_sector_ratios_intermediate.py:build_industry_sector_ratios_intermediate; rules/build_sector.smk:rule build_industry_sector_ratios"
      - change: "today's ratios (starting point)"
        anchor: "rule build_industrial_energy_demand_per_country_today"
        provenance: "rules/build_sector.smk:rule build_industrial_energy_demand_per_country_today; scripts/build_industrial_energy_demand_per_country_today.py:industrial_energy_demand_per_country"
      - change: "best-in-class endpoint ratios"
        anchor: "sector functions in build_industry_sector_ratios"
        provenance: "scripts/build_industry_sector_ratios.py:chemicals_industry"
      - change: "route-share diffusion proxies"
        anchor: "rule build_industrial_production_per_country_tomorrow"
        provenance: "rules/build_sector.smk:rule build_industrial_production_per_country_tomorrow"
      - change: "per-carrier growth brake"
        anchor: "sector.limit_max_growth config"
        provenance: "config/config.default.yaml:limit_max_growth"

    data_dependencies:
      - input: "JRC-IDEES (today's demand and physical output for ratios)"
        required_for: "today endpoint of the interpolation"
        availability: "must be built (retrieved); EU-focused"
      - input: "best-in-class intensity assumptions"
        required_for: "future endpoint"
        availability: "exists by default — encoded in build_industry_sector_ratios code, not data"
      - input: "EEM/diffusion datasets (measure costs, adoption curves)"
        required_for: "L5 explicit diffusion modelling"
        availability: "absent"

    demand_dimensions:
      driver: "intensity (MWh/t) interpolated between today and best-in-class; activity from production tonnages"
      spatial: "efficiency applies uniformly across nodes (country-level ratios)"
      temporal: "flat loads; no efficiency effect on profiles"
      scenario: "sector_ratios_fraction_future and route dicts keyed by planning_horizons — the scenario IS the diffusion path"
