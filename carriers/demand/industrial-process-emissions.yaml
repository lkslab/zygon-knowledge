id: industrial-process-emissions
title: Industrial process emissions
summary: >
  CO2 released by chemistry rather than combustion — cement calcination, steel
  reduction, ammonia synthesis, steam cracking — represented as a fixed
  emission stream that can be vented or captured, independent of fuel choice.

when_to_use:
  - "process emissions from cement or steel"
  - "calcination CO2"
  - "capture industrial process CO2"
  - "cement CCS"
  - "non-combustion industrial emissions"
  - "feedstock emissions from petrochemicals"
  - "industry CO2 that cannot be electrified away"
  - "process emissions carbon capture"
  - "known in pypsa-eur as: process emissions, process emissions CC, process emissions to stored, process emissions to atmosphere"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "FORECAST's 60+ product/process resolution (clinker, oxygen & electric steel, primary & secondary aluminium, ammonia, adipic acid, chlorine, glass, ceramics, coke, sinter) ties process emissions to physical production tonnages (PRODCOM/UN), so route shifts change them mechanically."
    - "Process-specific technologies are distinguished from cross-cutting ones, with abatement options (EEMs) diffusing through explicit stock turnover — process emissions fall only as capital turns over."
    - "The end-use balance separates energy-related from process-related CO2, matching the process/energy split both PyPSA models implement."
  sources:
    - "https://www.forecast-model.eu/forecast-en/content/methodology.php"
    - "https://www.sciencedirect.com/science/article/pii/S2211467X18300890"
    - "https://irees.de/wp-content/uploads/2020/06/1-031-16_Rehfeldt.pdf"
    - "https://github.com/fraunhofer-isi/forecast-sites"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Covered, coarsely. build_industry_demand estimates process emissions
        per country from plant capacities in the industrial database — steel
        (GEM tracker, 0.025 tCO2/t), cement/non-metallic minerals (0.542),
        refineries/chemicals (0.51), aluminium (1.5, from AL_production.csv
        tonnages) — scaled by sector.industry_util_factor.
        prepare_sector_network.add_industry attaches them as a negative Load on
        a single Earth-wide "process emissions" bus, with a free venting Link
        to co2 atmosphere and, if sector.cc, a "process emissions CC" Link
        (cement-capture cost and capture rate) into the CO2 storage network.
      mechanism: >
        emission_factors dict + Steel_emissions / NMM_emissions /
        refinery_emissons / AL_emissions aggregations write a
        "process emissions" carrier row into industry_base_totals, which is
        nodally distributed like any carrier and summed onto the single
        process-emissions bus in add_industry.
      not_covered: >
        One global process-emissions bus (no nodal capture siting economics);
        factors are per-industry constants, not per-route (an EAF-heavy fleet
        still gets 0.025 t/t on all steel capacity); "process emission from
        feedstock" is commented out — feedstock CO2 is booked via the industry
        oil emissions load instead; no route-shift lever reduces process
        emissions endogenously.
      provenance: "scripts/build_industry_demand.py:emission_factors; scripts/prepare_sector_network.py:process emissions CC; scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.industry_util_factor
        effect: "Utilisation factor applied to plant capacities when deriving steel/cement/refinery process emissions."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor; scripts/build_industry_demand.py:industry_util_factor"
      - key: sector.cc
        effect: "Adds the process emissions CC capture link (and other industry CC links)."
        default: "true"
        provenance: "config.default.yaml:cc; scripts/prepare_sector_network.py:process emissions CC"
      - key: demand_data.aluminium_year
        effect: "Year of AL_production.csv used for aluminium process emissions."
        default: "2019"
        provenance: "config.default.yaml:aluminium_year; scripts/build_industry_demand.py:aluminium_year"
      - key: custom_data.industry_demand
        effect: "Custom industry csv can carry its own process emissions row, bypassing the capacity-based estimate."
        default: "false"
        provenance: "config.default.yaml:industry_demand; scripts/build_industry_demand.py:country_to_nodal"
      - key: custom_data.industry_database
        effect: "Custom plant database changes the capacities process emissions are derived from (and where they land)."
        default: "false"
        provenance: "config.default.yaml:industry_database; scripts/build_industry_demand.py:industrial_database"

    boundary:
      - variant: "enable/disable capture of process emissions"
        rung: L0
        note: "sector.cc."
      - variant: "scale process emissions with plant utilisation"
        rung: L0
        note: "sector.industry_util_factor."
      - variant: "change per-industry emission factors (e.g. scrap-EAF steel)"
        rung: L2
        note: "edit the emission_factors dict in build_industry_demand."
      - variant: "impose externally computed process emissions"
        rung: L3
        note: "custom_data.industry_demand csv with a process emissions carrier row."
      - variant: "nodal/regional process-emission buses with local capture"
        rung: L2
        note: "add_industry hardcodes n.add(Bus, 'process emissions', location='Earth') — parameterise to spatial nodes like the CC link already is (spatial.co2.locations)."
      - variant: "route-dependent process emissions (BF-BOF vs EAF, clinker substitution)"
        rung: L5
        note: "needs production routes as model objects; factors are industry-level constants today."

    where:
      - change: "emission estimation from plant capacities"
        anchor: "emission_factors dict + Steel_emissions/NMM_emissions/refinery_emissons/AL_emissions in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:emission_factors; scripts/build_industry_demand.py:Steel_emissions"
      - change: "process-emissions bus, venting link, CC link"
        anchor: "add_industry in prepare_sector_network"
        provenance: "scripts/prepare_sector_network.py:process emissions CC"
      - change: "plant database the capacities come from"
        anchor: "rule build_industrial_database (create_steel_db, create_cement_db, create_refineries_df)"
        provenance: "scripts/build_industrial_database.py:create_steel_db; scripts/build_industrial_database.py:create_cement_db"

    data_dependencies:
      - input: "industrial database (GEM steel/cement trackers, refineries, built by build_industrial_database)"
        required_for: "capacity-based process emissions and their nodal placement"
        availability: "must be built (remote downloads); region-dependent plant coverage"
      - input: "data/AL_production.csv"
        required_for: "aluminium process emissions"
        availability: "exists by default; per-country coverage varies"
      - input: "CO2 storage network (spatial.co2 nodes from sector co2 options)"
        required_for: "process emissions CC"
        availability: "exists by default when sector co2 network/spatial options are on"

    demand_dimensions:
      driver: "plant capacity x utilisation x tCO2/t emission factors (steel/cement/refineries); aluminium production tonnes"
      spatial: "estimated per country, distributed by plant keys, but consumed on one Earth-wide process-emissions bus (CC links are per co2 location)"
      temporal: "flat annual/8760 negative load"
      scenario: "grows with per-industry CAGRs like energy columns; custom csv per {demand}/{planning_horizons}"

  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}

    out_of_box:
      covers: >
        Covered per production route. build_industry_sector_ratios derives
        "process emission" and "process emission from feedstock" rows (tCO2/t)
        per sector from JRC-IDEES "Process emissions" data, with ammonia
        (NH3_process_emissions) and steam-cracker (petrochemical_process_
        emissions) parameters; route shares (Integrated steelworks vs Electric
        arc vs DRI, HVC primary vs recycling, cement) automatically change the
        totals. prepare_sector_network.add_industry attaches nodal (co2_spatial)
        process-emission buses with negative loads, a venting link and a
        "process emissions CC" link at cement-capture cost; feedstock
        emissions ride on the naphtha supply link (efficiency2) into the same
        buses; oil refining adds oil_refining_emissions per unit of primary
        oil. build_industrial_energy_demand_per_node clips a node's negative
        process emission to zero with a warning (JRC-IDEES gives HVC a
        negative process emission in later horizons). With
        sector.endogenous_sectors.enable (off by default; see
        steel-routes-endogenous, cement-routes-endogenous) the steel and cement
        process emissions leave this load and become link outputs: the BOF and
        gas-DRI CO2 lands on per-node "steel emission" buses, the kiln's
        calcination (sector.cement.calcination_emissions) plus fuel CO2 on a
        "cement emission" bus, each with a vent link to the atmosphere and a
        capture retrofit link (steel emission CC, cement emission CC), so they
        scale with the route the model picks rather than with the route
        shares.
      mechanism: >
        JRC-IDEES s_emi rows -> tCO2/t ratios -> x nodal production ->
        "process emission" columns in industrial_energy_demand_per_node ->
        loads on spatial.co2.process_emissions; capture competes with venting
        endogenously wherever CO2 transport/storage is available.
      not_covered: >
        Process emissions are fixed per tonne and route — no endogenous
        abatement other than capture and exogenous route-share dicts (and,
        with the routes switch, the steel and cement route choice); no
        clinker-substitution or novel-cement chemistry options.
      provenance: "scripts/build_industry_sector_ratios.py:Process emissions; scripts/build_industry_sector_ratios.py:NH3_process_emissions; scripts/prepare_sector_network.py:process emissions CC; scripts/prepare_sector_network.py:process emission from feedstock; scripts/build_industrial_energy_demand_per_node.py:Negative process emissions clipped; scripts/prepare_sector_network.py:add_steel; scripts/prepare_sector_network.py:add_cement"

    levers:
      - key: industry.NH3_process_emissions
        effect: "MtCO2/a ammonia process emissions parameter in the chemicals ratios."
        default: "24.5"
        provenance: "config/config.default.yaml:NH3_process_emissions; scripts/build_industry_sector_ratios.py:NH3_process_emissions"
      - key: industry.petrochemical_process_emissions
        effect: "MtCO2/a steam-cracker process emissions split out of chemicals combustion CO2."
        default: "25.5"
        provenance: "config/config.default.yaml:petrochemical_process_emissions; scripts/build_industry_sector_ratios.py:petrochemical_process_emissions"
      - key: industry.oil_refining_emissions
        effect: "tCO2 per MWh of primary oil booked as refining process emissions on the oil supply chain."
        default: "0.013"
        provenance: "config/config.default.yaml:oil_refining_emissions; scripts/prepare_sector_network.py:oil_refining_emissions"
      - key: sector.co2_spatial
        effect: "Nodal process-emission buses (regional capture economics) instead of one EU bus."
        default: "true"
        provenance: "config/config.default.yaml:co2_spatial; scripts/prepare_sector_network.py:co2_spatial"
      - key: industry.St_primary_fraction
        effect: "Steel route shares change steel process emissions (with DRI_fraction; recycling routes carry less process CO2)."
        default: "0.6 (2020) falling to 0.3 (2050)"
        provenance: "config/config.default.yaml:St_primary_fraction; scripts/build_industrial_production_per_country_tomorrow.py:St_primary_fraction"
      - key: industry.process_emissions_cc
        effect: "true adds the 'process emissions CC' link on the process-emission buses; false leaves venting as the only outlet (the 'no process-emission capture' scenario)."
        default: "true"
        provenance: "config/config.default.yaml:process_emissions_cc; scripts/prepare_sector_network.py:process_emissions_cc"
      - key: sector.endogenous_sectors
        effect: "enable true: steel and cement process emissions leave the exogenous load and become outputs of the route links, vented or captured per node."
        default: "{enable: false, subsectors: [steel, cement]}"
        provenance: "config/config.default.yaml:endogenous_sectors; scripts/build_industrial_energy_demand_per_node.py:route_endogenised_sectors"

    boundary:
      - variant: "let the optimiser capture process emissions"
        rung: L0
        note: "built-in (industry.process_emissions_cc: true): process emissions CC link competes with venting given CO2 storage; tune via sector.co2_sequestration_potential."
      - variant: "no capture of industrial process emissions"
        rung: L0
        note: "industry.process_emissions_cc: false (the vent link stays); with the routes switch on the steel and cement CC retrofits are separate links that this flag does not remove"
      - variant: "steel and cement process CO2 as route outputs with vent-or-capture per node"
        rung: L0
        note: "sector.endogenous_sectors.enable (see [[steel-routes-endogenous]], [[cement-routes-endogenous]] and the method [[industry-routes-endogenous]])"
      - variant: "cut process emissions via route shift (more EAF/recycling)"
        rung: L1
        note: "St_primary_fraction / DRI_fraction / HVC_*_fraction per-year dicts."
      - variant: "change a sector's process-emission intensity"
        rung: L2
        note: "edit the s_emi handling in the sector function of build_industry_sector_ratios."
      - variant: "add a process-emission-free route (e.g. novel cement)"
        rung: L5
        note: "needs a new production route with its own ratios column and share logic — no slot exists."
      - variant: "region-specific emission factors from national inventories"
        rung: L3
        note: "ratios are EU-average from JRC-IDEES; per-country factors mean editing/adding the country dimension in the ratios inputs."

    where:
      - change: "per-sector process-emission ratios"
        anchor: "sector functions in build_industry_sector_ratios (iron_and_steel, chemicals_industry, nonmetalic_mineral_products)"
        provenance: "scripts/build_industry_sector_ratios.py:iron_and_steel; scripts/build_industry_sector_ratios.py:nonmetalic_mineral_products"
      - change: "process-emission buses, venting, CC"
        anchor: "add_industry in prepare_sector_network (spatial.co2.process_emissions)"
        provenance: "scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:process_emissions"
      - change: "feedstock-emission booking on naphtha"
        anchor: "process_co2_per_naphtha in add_industry"
        provenance: "scripts/prepare_sector_network.py:process_co2_per_naphtha"
      - change: "route shares driving the totals"
        anchor: "rule build_industrial_production_per_country_tomorrow"
        provenance: "rules/build_sector.smk:rule build_industrial_production_per_country_tomorrow"

    data_dependencies:
      - input: "JRC-IDEES emission sheets (s_emi Process emissions rows)"
        required_for: "per-sector tCO2/t ratios"
        availability: "must be built (retrieved); EU-focused"
      - input: "CO2 transport/storage representation (co2_spatial, co2_network, sequestration potentials)"
        required_for: "capture vs venting competition"
        availability: "exists by default"
      - input: "cement capture cost rows in technology-data"
        required_for: "process emissions CC link"
        availability: "exists by default"

    demand_dimensions:
      driver: "kt/a production per route x tCO2/t process-emission ratios (JRC-IDEES + NH3/petrochemical parameters)"
      spatial: "nodal process-emission buses at industrial sites (co2_spatial) — capture siting is economically meaningful"
      temporal: "flat annual/nhours negative loads; capture dispatch optimised hourly"
      scenario: "route-share dicts and sector_ratios_fraction_future per planning horizon"
