id: light-manufacturing-demand
title: "Light manufacturing demand (machinery, transport equipment, textiles, wood)"
summary: >
  Industrial energy demand of the light-manufacturing family — machinery equipment,
  transport equipment (vehicles), textiles & leather, and wood & wood products —
  dominated by electricity for machine drives plus low/mid-temperature process heat,
  and how it is quantified, located, projected and served in the model.

when_to_use:
  - "add or change machinery industry demand"
  - "car / vehicle / automotive factory energy"
  - "transport equipment manufacturing load"
  - "textile and leather industry energy"
  - "wood products / sawmill energy demand"
  - "electrify light industry heat"
  - "manufacturing electricity demand"
  - "factory steam demand"
  - "grow manufacturing in a scenario"
  - "decarbonise light industry"

models:

  - model: pypsa-earth
    version_anchor: { ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08" }

    out_of_box:
      covers: >
        Country-level final energy of four separate UNSD subsectors — 'machinery',
        'transport equipment', 'textile and leather', 'wood and wood products' —
        (electricity, gas, oil, coal, biomass, heat), each grown by its own
        per-country CAGR, distributed to nodes and served as annual-constant loads.
      mechanism: >
        Rule build_base_industry_totals parses the UNSD txt exports in
        data/demand/unsd/data, maps 'consumption by machinery', 'consumption by
        transport equipment', 'consumption by textile and leather' and 'consumption
        by wood and wood products' transactions via data/unsd_transactions.csv and
        pivots to country x carrier totals (MWh). Rule build_industry_demand scales a
        unit production index by (1+CAGR)^(planning_horizon-base_year) using the
        matching columns of data/demand/industry_growth_cagr.csv, distributes to
        nodes via the industrial distribution key — the plant database has no
        light-manufacturing technologies, so the GDP-share key applies — multiplies
        with the country carrier totals and sums over all subsectors into
        industrial_energy_demand_per_node (nodes x carriers). In
        prepare_sector_network, add_industry turns each carrier column into constant
        loads: 'industry electricity', 'gas for industry', 'solid biomass for
        industry', 'naphtha for industry', 'H2 for industry', 'low-temperature heat
        for industry' (p_set = annual energy / 8760).
      not_covered: >
        No physical production/output variable (energy only); no process detail
        (foundries, heat treatment, drying, steam are not distinguished) and no
        temperature bands; subsector identity is lost after build_industry_demand
        (energy pooled per carrier with all other industry); no process emissions for
        these subsectors (emission factors 0); loads are annual-constant; no config
        lever to switch these sectors' fuel mix (e.g. electrify their heat).
      provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals; data/unsd_transactions.csv:machinery; data/unsd_transactions.csv:transport equipment; scripts/build_industry_demand.py:clean_industry_list; scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.enable.industry
        effect: "Gates the whole industry demand block (add_industry) in prepare_sector_network; false removes all industrial loads including these four subsectors."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:enable[\"industry\"]"
      - key: demand_data.base_year
        effect: "UNSD energy-balance year used as base and as start year of the CAGR growth exponent."
        default: "2019"
        provenance: "config.default.yaml:base_year; scripts/build_base_industry_totals.py:base_year; Snakefile:build_base_industry_totals"
      - key: demand_data.update_data
        effect: "Re-downloads the UNSD energy balances into data/demand/unsd/data (needed on first run)."
        default: "true"
        provenance: "config.default.yaml:update_data; Snakefile:unsd_paths"
      - key: demand_data.other_industries
        effect: "Intended toggle for the unspecified 'other' industry aggregate alongside the named subsectors (note: in create_industry_base_totals the drop call's result is not assigned, so the 'other' column persists regardless)."
        default: "false"
        provenance: "config.default.yaml:other_industries; scripts/build_base_industry_totals.py:include_other"
      - key: custom_data.industry_demand
        effect: "Replaces the whole UNSD+CAGR chain with a user file data/custom/industry_demand_{demand}_{planning_horizons}.csv (country x carrier x subsector), letting you set each subsector's energy and carrier split directly."
        default: "false"
        provenance: "config.default.yaml:industry_demand; scripts/build_industry_demand.py:snakemake.params.industry_demand"
      - key: custom_data.industry_database
        effect: "Uses data/custom/industrial_database.csv instead of the built default plant database for the spatial distribution keys — the only way to get factory-based spatial allocation for these subsectors."
        default: "false"
        provenance: "config.default.yaml:industry_database; scripts/build_industrial_distribution_key.py:snakemake.params.industry_database"

    boundary:
      - variant: "Turn industrial (incl. light manufacturing) demand on/off"
        rung: L0
        note: "sector.enable.industry."
      - variant: "Change base year of the demand data"
        rung: L1
        note: "demand_data.base_year (must exist in the UNSD data)."
      - variant: "Change growth of machinery / transport equipment / textiles / wood separately"
        rung: L3
        note: "No config key — edit the 'machinery', 'transport equipment', 'textile and leather', 'wood and wood products' columns (per country or DEFAULT row) in data/demand/industry_growth_cagr.csv."
      - variant: "Electrify light-industry heat / set demand level or carrier split directly"
        rung: L3
        note: >
          There is no route-switching or electrification lever for these subsectors
          and no temperature-band machinery in pypsa-earth; the carrier split is
          fixed by the UNSD base data. The functional path is
          custom_data.industry_demand: true plus an authored
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with the
          shifted carrier mix per subsector column.
      - variant: "Locate demand at factories instead of GDP-weighting"
        rung: L3
        note: "custom_data.industry_database: true + data/custom/industrial_database.csv with facility rows; the default database maps no light-manufacturing technology."
      - variant: "Add a time profile (e.g. shift-pattern weekly profile)"
        rung: L5
        note: "Loads are scalar p_set = annual/8760 in add_industry; a profile needs new code and the subsectors are not separable in the nodal file anyway."
      - variant: "Model a light-manufacturing subsector as its own load with endogenous heat supply"
        rung: L4
        note: "Requires keeping the subsector separate through build_industry_demand (it is summed away), new columns in industrial_energy_demand_per_node and new buses/loads/links in add_industry."

    where:
      - change: "Override demand level / carrier split"
        anchor: "custom_data.industry_demand + data/custom/industry_demand_{demand}_{planning_horizons}.csv, read in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:snakemake.params.industry_demand"
      - change: "Growth trajectory"
        anchor: "data/demand/industry_growth_cagr.csv columns 'machinery', 'transport equipment', 'textile and leather', 'wood and wood products'"
        provenance: "Snakefile:industry_growth_cagr; data/demand/industry_growth_cagr.csv:machinery; data/demand/industry_growth_cagr.csv:textile and leather"
      - change: "Spatial allocation keys"
        anchor: "build_nodal_distribution_key in build_industrial_distribution_key.py (GDP fallback — no light-manufacturing facilities in default database)"
        provenance: "scripts/build_industrial_distribution_key.py:build_nodal_distribution_key"
      - change: "Subsector aggregation / carrier totals"
        anchor: "create_industry_base_totals in build_base_industry_totals.py and the nodal dot-product in build_industry_demand.py"
        provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals; scripts/build_industry_demand.py:country_to_nodal"
      - change: "Load construction"
        anchor: "add_industry in prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_industry"

    data_dependencies:
      - input: "UNSD energy balances (data/demand/unsd/data, downloaded when demand_data.update_data)"
        required_for: "default base totals"
        availability: "must be built; subsector coverage region-dependent, missing subsector columns filled 0"
      - input: "data/unsd_transactions.csv transaction-to-subsector mapping"
        required_for: "default base totals"
        availability: "exists by default"
      - input: "data/demand/industry_growth_cagr.csv"
        required_for: "growth to planning horizon"
        availability: "exists by default; DEFAULT row fallback for missing countries"
      - input: "Clustered population and GDP layouts"
        required_for: "GDP-share spatial keys"
        availability: "built by the workflow"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "custom demand override / electrification scenarios"
        availability: "absent; user-authored"

    demand_dimensions:
      driver: "National subsector final energy from UNSD balances (no output index), scaled per subsector by (1+CAGR)^years from industry_growth_cagr.csv"
      spatial: "GDP-share key per country (no light-manufacturing plants in the default industrial database)"
      temporal: "Annual-constant: p_set = annual energy / 8760, no profile"
      scenario: "{demand} wildcard tags the scenario files; per-country per-subsector CAGR columns and demand_data.base_year set the growth path"

  - model: pypsa-eur
    version_anchor: { ref: "d2e0d48666f09a580c744846cef37e5059761d7a", date: "2026-10-09" }

    out_of_box:
      covers: >
        Four separate subsectors — 'Machinery equipment', 'Transport equipment',
        'Textiles and leather', 'Wood and wood products' — each with a physical
        output index, country-specific energy intensities per carrier,
        population-based spatial allocation.
      mechanism: >
        build_industrial_energy_demand_per_country_today reads JRC-IDEES
        energy-balance sheets FC_IND_MAC_E, FC_IND_TE_E, FC_IND_TL_E and FC_IND_WP_E
        per country; build_industrial_production_per_country reads 'Physical output
        (index)' from the MAE/TRE/TEL/WWP Industry sheets (non-EU27 scaled by
        Eurostat energy ratios). build_industry_sector_ratios derives future
        best-in-class intensities per subsector (machinery_equipment,
        transport_equipment: foundries, connection techniques and heat treatment
        electrified with measured efficiencies, steam to biomass;
        textiles_and_leather: drying electrified, steam pretreatment/wet processing
        to biomass; wood_and_wood_products: drying electrified, specific steam
        processes to biomass); build_industry_sector_ratios_intermediate blends
        today's ratios toward these via industry.sector_ratios_fraction_future.
        Production is unchanged into
        the future (build_industrial_production_per_country_tomorrow only modifies
        steel/aluminium/HVC). None of the four is in the hotmaps sector_mapping, so
        they are population-distributed, multiplied with ratios in
        build_industrial_energy_demand_per_node, and turned into loads in
        add_industry as constant exogenous loads.
      not_covered: >
        No production growth/decline lever (production tomorrow = today); no site
        database (population proxy only); no process emissions carried for these
        subsectors' ratios; no route-switching key like steel's primary fractions and
        no temperature-resolved process heat — fuel switching is only reachable
        through the exogenous future ratios; loads are annual-constant.
      provenance: "scripts/build_industrial_energy_demand_per_country_today.py:FC_IND_MAC_E; scripts/build_industry_sector_ratios.py:machinery_equipment; scripts/build_industry_sector_ratios.py:textiles_and_leather; scripts/build_industrial_production_per_node.py:sector_mapping; scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.industry
        effect: "Master switch for industrial demand incl. the four light-manufacturing subsectors."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:options[\"industry\"]"
      - key: industry.sector_ratios_fraction_future
        effect: "Per-year blend between today's country energy intensities and the electrified/biomass best-in-class ratios."
        default: "{2020: 0.0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: industry.reference_year
        effect: "JRC-IDEES year for today's energy demand and production index."
        default: "2023"
        provenance: "config/config.default.yaml:reference_year; scripts/build_industrial_production_per_country.py:reference_year"

    boundary:
      - variant: "Let the model choose how light-industry process heat is supplied (heat pumps, e-boilers, biomass, gas, H2)"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork: machinery, transport equipment, textiles and wood heat split by backup shares (mostly below 200 °C) into bands with competing supply links — industry-process-heat-endogenous."
      - variant: "Faster/slower efficiency transformation"
        rung: L1
        note: "industry.sector_ratios_fraction_future per-year values."
      - variant: "Change production trajectory (e.g. automotive expansion, textile decline)"
        rung: L2
        note: "No config key — build_industrial_production_per_country_tomorrow leaves these sectors untouched; add scalings for their columns there (small localised edit)."
      - variant: "Change the exogenous future carrier assumption (e.g. steam to hydrogen instead of biomass)"
        rung: L2
        note: "Edit machinery_equipment / transport_equipment / textiles_and_leather / wood_and_wood_products in build_industry_sector_ratios.py."
      - variant: "Site-based spatial allocation (e.g. car plants)"
        rung: L3
        note: "Needs a facility dataset plus a sector_mapping entry in build_industrial_production_per_node.py / build_industrial_energy_demand_per_node_today.py and a matching key column in build_industrial_distribution_key.py."

    where:
      - change: "Production trajectory"
        anchor: "rule build_industrial_production_per_country_tomorrow / its script"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:industrial_production_per_country_tomorrow"
      - change: "Exogenous future intensities"
        anchor: "machinery_equipment() / transport_equipment() / textiles_and_leather() / wood_and_wood_products() in build_industry_sector_ratios.py"
        provenance: "scripts/build_industry_sector_ratios.py:machinery_equipment; scripts/build_industry_sector_ratios.py:transport_equipment; scripts/build_industry_sector_ratios.py:wood_and_wood_products"
      - change: "Spatial allocation"
        anchor: "sector_mapping fallback to 'population' in build_industrial_production_per_node.py and build_industrial_energy_demand_per_node_today.py"
        provenance: "scripts/build_industrial_production_per_node.py:sector_mapping; scripts/build_industrial_energy_demand_per_node_today.py:population"
      - change: "Load placement per carrier"
        anchor: "add_industry in prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_industry"

    data_dependencies:
      - input: "JRC-IDEES 2021/2023 EnergyBalance + Industry workbooks (rule retrieve_jrc_idees)"
        required_for: "today's demand, production index, sector ratios"
        availability: "exists by default via retrieval; EU27 detail, non-EU27 scaled by Eurostat ratios"
      - input: "Eurostat energy balances"
        required_for: "non-EU27 country scaling"
        availability: "exists by default via retrieval"
      - input: "Clustered population layout"
        required_for: "population-based spatial key"
        availability: "built by the workflow"

    demand_dimensions:
      driver: "JRC-IDEES physical output index per subsector x MWh/t sector ratios per country"
      spatial: "Population key (all four absent from hotmaps sector_mapping)"
      temporal: "Annual-constant loads (p_set = annual/nhours)"
      scenario: "planning_horizons drives sector_ratios_fraction_future interpolation; production constant across horizons for these sectors"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "Process-level activity (foundries, heat treatment, drying, surface treatment) rather than whole-subsector aggregates"
    - "Temperature-banded process heat demand per process"
    - "Cross-cutting technologies (electric motors, compressed air, steam systems) shared across subsectors"
    - "Efficiency-measure diffusion over time instead of a single best-in-class blend factor"
  sources:
    - "https://www.forecast-model.eu/"
