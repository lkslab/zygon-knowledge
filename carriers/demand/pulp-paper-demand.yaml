id: pulp-paper-demand
title: "Pulp, paper & printing demand"
summary: >
  Industrial energy demand of the pulp, paper and printing sector — electricity,
  process steam/heat and fuel use of pulping, paper machines and printing — and how
  it is quantified, located, projected and served in the model.

when_to_use:
  - "add or change pulp and paper industry demand"
  - "paper mill energy consumption"
  - "pulp production electricity and steam demand"
  - "printing industry load"
  - "electrify paper industry process heat"
  - "decarbonise pulp and paper"
  - "biomass / black liquor use in paper mills"
  - "where are the paper mills in the model"
  - "grow or shrink the paper sector in a scenario"
  - "paper industry heat pumps or electric boilers"

models:

  - model: pypsa-earth
    version_anchor: { ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08" }

    out_of_box:
      covers: >
        Country-level final energy of the subsector 'paper pulp and print' (electricity,
        gas, oil, coal, biomass, heat) from UN Statistics Division energy balances,
        grown to the planning horizon by a per-country CAGR, distributed to nodes and
        served as annual-constant loads.
      mechanism: >
        Rule build_base_industry_totals parses the UNSD txt exports in
        data/demand/unsd/data, maps 'consumption by paper, pulp and print' transactions
        via data/unsd_transactions.csv to the clean subsector 'paper pulp and print'
        and pivots to country x carrier totals (MWh). Rule build_industry_demand
        scales a unit production index by (1+CAGR)^(planning_horizon-base_year) using
        the 'paper pulp and print' column of data/demand/industry_growth_cagr.csv,
        distributes it to nodes via the industrial distribution key (paper-plant
        capacity shares where the industrial database has 'Paper' sites, GDP share
        otherwise), multiplies with the country carrier totals and sums over all
        subsectors into industrial_energy_demand_per_node (nodes x carriers). In
        prepare_sector_network, add_industry turns each carrier column into constant
        loads: 'industry electricity', 'gas for industry', 'solid biomass for
        industry', 'naphtha for industry', 'H2 for industry', 'low-temperature heat
        for industry' (p_set = annual energy / 8760). Paper plant locations come from
        build_industrial_database (create_paper_df, SFI/ALD Latin-America sample).
      not_covered: >
        No physical production variable (energy only, no tonnes of pulp/paper); no
        process/temperature detail and no black-liquor or recovery-boiler
        representation; subsector identity is lost after build_industry_demand (energy
        is pooled per carrier with all other industry), so the network has no
        pulp-specific load or supply choice; no process emissions for this subsector
        (emission factor 0); loads are annual-constant with no intra-year profile;
        no config lever to switch the sector's fuel mix (e.g. electrify its heat).
      provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals; data/unsd_transactions.csv:paper pulp and print; scripts/build_industry_demand.py:clean_industry_list; scripts/build_industrial_database.py:create_paper_df; scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.enable.industry
        effect: "Gates the whole industry demand block (add_industry) in prepare_sector_network; false removes all industrial loads including pulp & paper."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:enable[\"industry\"]"
      - key: demand_data.base_year
        effect: "UNSD energy-balance year used as base and as start year of the CAGR growth exponent."
        default: "2019"
        provenance: "config.default.yaml:base_year; scripts/build_base_industry_totals.py:base_year; Snakefile:build_base_industry_totals"
      - key: demand_data.update_data
        effect: "Re-downloads the UNSD energy balances into data/demand/unsd/data (needed on first run)."
        default: "true"
        provenance: "config.default.yaml:update_data; Snakefile:unsd_paths"
      - key: demand_data.other_industries
        effect: "Intended toggle for the unspecified 'other' industry aggregate alongside the named subsectors (note: in create_industry_base_totals the drop call's result is not assigned, so the 'other' column persists regardless)."
        default: "false"
        provenance: "config.default.yaml:other_industries; scripts/build_base_industry_totals.py:include_other"
      - key: custom_data.industry_demand
        effect: "Replaces the whole UNSD+CAGR chain with a user file data/custom/industry_demand_{demand}_{planning_horizons}.csv (country x carrier x subsector), letting you set the pulp & paper energy and carrier split directly."
        default: "false"
        provenance: "config.default.yaml:industry_demand; scripts/build_industry_demand.py:snakemake.params.industry_demand"
      - key: custom_data.industry_database
        effect: "Uses data/custom/industrial_database.csv instead of the built default plant database for the spatial distribution keys — the way to supply own paper-mill locations."
        default: "false"
        provenance: "config.default.yaml:industry_database; scripts/build_industrial_distribution_key.py:snakemake.params.industry_database"

    boundary:
      - variant: "Turn industrial (incl. pulp & paper) demand on/off"
        rung: L0
        note: "sector.enable.industry."
      - variant: "Change base year of the demand data"
        rung: L1
        note: "demand_data.base_year (must exist in the UNSD data)."
      - variant: "Change pulp & paper growth trajectory"
        rung: L3
        note: "No config key — edit the 'paper pulp and print' column (per country or DEFAULT row) in data/demand/industry_growth_cagr.csv."
      - variant: "Set pulp & paper demand level or carrier split directly (e.g. electrify its process heat)"
        rung: L3
        note: >
          There is no route-switching or electrification lever for this subsector; the
          carrier split is fixed by the UNSD base data. The functional path is
          custom_data.industry_demand: true plus an authored
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with the shifted
          carrier mix (e.g. move gas/oil rows to electricity for the paper column).
      - variant: "Use own paper-mill locations for the spatial distribution"
        rung: L3
        note: "custom_data.industry_database: true + data/custom/industrial_database.csv; default 'Paper' sites exist only for the Latin-America SFI sample, elsewhere GDP-share fallback."
      - variant: "Add a time profile to the pulp & paper load"
        rung: L5
        note: "Loads are scalar p_set = annual/8760 in add_industry; a profile needs new code and the subsector is not separable in the nodal file anyway."
      - variant: "Model pulp & paper as its own load with endogenous heat supply (black liquor, biomass boilers, electrode boilers)"
        rung: L4
        note: "Requires keeping the subsector separate through build_industry_demand (it is summed away), new columns in industrial_energy_demand_per_node and new buses/loads/links in add_industry."

    where:
      - change: "Override demand level / carrier split"
        anchor: "custom_data.industry_demand + data/custom/industry_demand_{demand}_{planning_horizons}.csv, read in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:snakemake.params.industry_demand"
      - change: "Growth trajectory"
        anchor: "data/demand/industry_growth_cagr.csv column 'paper pulp and print' (rule build_industry_demand input industry_growth_cagr)"
        provenance: "Snakefile:industry_growth_cagr; data/demand/industry_growth_cagr.csv:paper pulp and print"
      - change: "Spatial allocation keys"
        anchor: "build_nodal_distribution_key in build_industrial_distribution_key.py ('Paper' technology maps to 'paper pulp and print'; GDP fallback)"
        provenance: "scripts/build_industrial_distribution_key.py:build_nodal_distribution_key; scripts/build_industrial_distribution_key.py:match_technology"
      - change: "Subsector aggregation / carrier totals"
        anchor: "create_industry_base_totals in build_base_industry_totals.py and the nodal dot-product in build_industry_demand.py"
        provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals; scripts/build_industry_demand.py:country_to_nodal"
      - change: "Load construction"
        anchor: "add_industry in prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_industry"

    data_dependencies:
      - input: "UNSD energy balances (data/demand/unsd/data, downloaded when demand_data.update_data)"
        required_for: "default base totals"
        availability: "must be built; subsector coverage region-dependent, missing subsector columns filled 0"
      - input: "data/unsd_transactions.csv transaction-to-subsector mapping"
        required_for: "default base totals"
        availability: "exists by default"
      - input: "data/demand/industry_growth_cagr.csv"
        required_for: "growth to planning horizon"
        availability: "exists by default; DEFAULT row fallback for missing countries"
      - input: "data/industry/SFI_ALD_Pulp_Paper_Sample_LatAm_Jan_2023.xlsx (paper plants via build_industrial_database)"
        required_for: "plant-based spatial keys"
        availability: "region-dependent (Latin-America sample only); GDP fallback elsewhere"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "custom demand override"
        availability: "absent; user-authored"
      - input: "data/custom/industrial_database.csv"
        required_for: "custom plant locations"
        availability: "absent; user-authored"

    demand_dimensions:
      driver: "National subsector final energy from UNSD balances (no tonnage), scaled by (1+CAGR)^years from industry_growth_cagr.csv"
      spatial: "Paper-plant capacity shares where the industrial database has sites (LatAm sample); GDP-share key per country otherwise"
      temporal: "Annual-constant: p_set = annual energy / 8760, no profile"
      scenario: "{demand} wildcard tags the scenario files; per-country CAGR columns and demand_data.base_year set the growth path"

  - model: pypsa-eur
    version_anchor: { ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26" }

    out_of_box:
      covers: >
        Pulp production, Paper production and Printing and media reproduction as three
        separate subsectors with physical production (kt), country-specific energy
        intensities per carrier and plant-site spatial allocation.
      mechanism: >
        build_industrial_energy_demand_per_country_today reads JRC-IDEES energy-balance
        sheets FC_IND_PPP_PU_E (Pulp production), FC_IND_PPP_PA_E (Paper production)
        and FC_IND_PPP_PR_E (Printing and media reproduction) per country;
        build_industrial_production_per_country reads production 'Pulp production
        (kt)', 'Paper production  (kt)', 'Printing and media reproduction (kt paper
        eq.)' from the PPA Industry sheet (non-EU27 scaled by Eurostat energy ratios).
        build_industry_sector_ratios derives future best-in-class MWh/t (pulp_paper_printing:
        pulping thermal and paper-machine/product-finishing steam assigned to biomass,
        the rest electrified; no process emissions); build_industry_sector_ratios_intermediate
        blends today's ratios toward these with industry.sector_ratios_fraction_future.
        Production is unchanged into the future
        (build_industrial_production_per_country_tomorrow only modifies steel/aluminium/HVC),
        nodally distributed by hotmaps 'Paper and printing' sites
        (sector_mapping in build_industrial_production_per_node), multiplied with
        ratios in build_industrial_energy_demand_per_node, and turned into loads in
        add_industry as constant exogenous loads.
      not_covered: >
        No explicit black-liquor byproduct credit or recovery-boiler representation —
        pulping thermal demand is simply carried as solid biomass (the string 'black
        liquor' does not occur in the code); no production growth/decline lever for
        this sector (production tomorrow = today); no route-switching key like steel's
        primary fractions and no temperature-resolved process heat — fuel switching
        is only reachable through the exogenous future ratios; loads are
        annual-constant (no intra-year profile).
      provenance: "scripts/build_industrial_energy_demand_per_country_today.py:FC_IND_PPP_PU_E; scripts/build_industry_sector_ratios.py:pulp_paper_printing; scripts/build_industrial_production_per_node.py:sector_mapping; scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.industry
        effect: "Master switch for industrial demand incl. pulp, paper & printing."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:options[\"industry\"]"
      - key: industry.sector_ratios_fraction_future
        effect: "Per-year blend between today's country energy intensities and the future best-in-class ratios (1.0 = fully transformed sector ratios)."
        default: "{2020: 0.0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: industry.reference_year
        effect: "JRC-IDEES year for today's energy demand and production."
        default: "2023"
        provenance: "config/config.default.yaml:reference_year; scripts/build_industrial_production_per_country.py:reference_year"
      - key: industry.hotmaps_locate_missing
        effect: "Geocodes hotmaps industrial sites without coordinates (affects 'Paper and printing' site coverage for the spatial key)."
        default: "false"
        provenance: "config/config.default.yaml:hotmaps_locate_missing; scripts/build_industrial_distribution_key.py:hotmaps_locate_missing"

    boundary:
      - variant: "Let the model choose how paper process heat is supplied (electrify vs biomass vs gas vs H2)"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork: chemical and mechanical pulp (the latter overridden to 100% heat100-200), paper and printing heat split into bands where biomass steam boilers compete with the industrial heat pump, the electric boiler and gas — industry-process-heat-endogenous."
      - variant: "Faster/slower efficiency transformation of the sector"
        rung: L1
        note: "industry.sector_ratios_fraction_future per-year values."
      - variant: "Change pulp/paper production trajectory (growth, decline, relocation)"
        rung: L2
        note: "No config key — build_industrial_production_per_country_tomorrow leaves these sectors untouched; add a scaling for the pulp/paper columns there (small localised edit)."
      - variant: "Change the exogenous future carrier assumption (e.g. steam to hydrogen instead of biomass)"
        rung: L2
        note: "Edit pulp_paper_printing() in build_industry_sector_ratios.py."
      - variant: "Add explicit black-liquor recovery-boiler / CHP at mills"
        rung: L5
        note: "Absent; needs new component logic (mill-level byproduct fuel supply) beyond the demand chain."

    where:
      - change: "Production trajectory"
        anchor: "rule build_industrial_production_per_country_tomorrow / its script"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:industrial_production_per_country_tomorrow"
      - change: "Exogenous future intensities"
        anchor: "pulp_paper_printing() in build_industry_sector_ratios.py"
        provenance: "scripts/build_industry_sector_ratios.py:pulp_paper_printing"
      - change: "Spatial allocation"
        anchor: "hotmaps 'Paper and printing' Subsector keys in build_industrial_distribution_key.py; sector_mapping in build_industrial_production_per_node.py"
        provenance: "scripts/build_industrial_distribution_key.py:prepare_hotmaps_database; scripts/build_industrial_production_per_node.py:sector_mapping"
      - change: "Load placement per carrier"
        anchor: "add_industry in prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_industry"

    data_dependencies:
      - input: "JRC-IDEES 2021/2023 EnergyBalance + Industry workbooks (rule retrieve_jrc_idees)"
        required_for: "today's demand, production, sector ratios"
        availability: "exists by default via retrieval; EU27 detail, non-EU27 scaled by Eurostat ratios"
      - input: "Eurostat energy balances"
        required_for: "non-EU27 country scaling"
        availability: "exists by default via retrieval"
      - input: "Hotmaps Industrial_Database.csv (rule retrieve_hotmaps_industrial_sites)"
        required_for: "'Paper and printing' site-based distribution keys"
        availability: "exists by default via retrieval; population fallback where no sites"

    demand_dimensions:
      driver: "Physical production (kt pulp/paper, kt paper eq. printing) x MWh/t sector ratios per country"
      spatial: "Hotmaps 'Paper and printing' sites weighted by ETS/EPRTR emissions; population fallback"
      temporal: "Annual-constant loads (p_set = annual/nhours)"
      scenario: "planning_horizons drives sector_ratios_fraction_future interpolation; production constant across horizons for this sector"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "Process-level products (chemical vs mechanical pulp, paper grades) rather than one aggregate subsector"
    - "Temperature-banded process heat and cooling demand per process"
    - "Cross-cutting technologies (steam systems, motors) shared across subsectors"
    - "Efficiency-measure diffusion over time instead of a single best-in-class blend factor"
  sources:
    - "https://www.forecast-model.eu/"
