id: rail-transport-demand
title: Rail transport demand
summary: >
  Energy demand of railways (electric traction plus diesel/oil rail), its split
  from road transport, and how/where it appears as network loads.

when_to_use:
  - "add or change rail / railway / train energy demand"
  - "electrify railways / rail electrification scenario"
  - "diesel trains / rail oil demand"
  - "metro / tram / urban rail electricity"
  - "hydrogen trains"
  - "where does rail demand go in the model"
  - "scale rail freight or passenger demand"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Two annual-constant nodal loads: 'rail transport electricity' on the AC buses
        (energy totals column 'electricity rail') and 'rail transport oil' on the oil
        buses ('total rail' minus 'electricity rail'), each p_set = TWh * 1e6 / 8760.
      mechanism: >
        add_rail_transport in scripts/prepare_sector_network.py reads the nodal energy
        totals csv (produced by rule prepare_heat_data, which population-weights the
        country energy totals with pop_layout.fraction) and adds the two loads; it runs
        when sector.enable.rail_transport is true. Country rail totals originate from UNSD
        energy balances in build_base_energy_totals.py (calc_sector 'rail' fills 'total
        rail' and 'electricity rail') and are scaled to the scenario/horizon by
        prepare_energy_totals.py using per-country CAGRs. Note that
        prepare_transport_data.py also folds 'total rail' - 'electricity rail' into the
        land-transport demand pool ('total road' + 'total rail' - 'electricity rail')
        when custom_data.transport_demand is false.
      not_covered: >
        No hourly rail profile (flat load); no rail-specific config lever beyond the
        enable flag (no electrification-share key — the elec/oil split is whatever the
        energy-balance data says); no CO2 emissions load is added for rail oil in
        add_rail_transport; no hydrogen or battery trains.
      provenance: "scripts/prepare_sector_network.py:add_rail_transport;scripts/build_base_energy_totals.py:calc_sector;scripts/prepare_heat_data.py:nodal_energy_totals"
    levers:
      - key: sector.enable.rail_transport
        effect: "Toggles add_rail_transport on/off."
        default: "true"
        provenance: "config.default.yaml:rail_transport;scripts/prepare_sector_network.py:add_rail_transport"
      - key: scenario.demand
        effect: "Demand-scenario wildcard selecting which CAGR pathway scales the rail totals (via prepare_energy_totals)."
        default: "[AB]"
        provenance: "config.default.yaml:demand:;scripts/prepare_energy_totals.py:growth_factors_cagr"
      - key: demand_data.base_year
        effect: "Base year from which rail-demand CAGRs are compounded to the planning horizon."
        default: "2019"
        provenance: "config.default.yaml:base_year;scripts/prepare_energy_totals.py:calculate_end_values"
    boundary:
      - variant: "switch rail demand on/off"
        rung: L0
        note: "sector.enable.rail_transport."
      - variant: "scale rail demand or shift the electric/diesel split over time"
        rung: L3
        note: "Edit the 'total rail' and 'electricity rail' columns of data/demand/growth_factors_cagr.csv / efficiency_gains_cagr.csv (per-country CAGRs); raising 'electricity rail' relative to 'total rail' is the de-facto electrification lever."
      - variant: "give rail an hourly profile"
        rung: L2
        note: "p_set is a flat scalar in add_rail_transport; replace with a time series there (a profile input would additionally need plumbing = L4)."
      - variant: "add hydrogen trains"
        rung: L5
        note: "No rail-H2 carrier or share exists; needs new load logic in prepare_sector_network.py analogous to shipping's H2 share."
      - variant: "correct double counting with land transport (non-electric rail also enters the road pool)"
        rung: L2
        note: "Localised edit in prepare_transport_data.py (energy_totals_transport formula) or in add_rail_transport."
    where:
      - change: "rail load creation and elec/oil split"
        anchor: "scripts/prepare_sector_network.py:add_rail_transport"
        provenance: "scripts/prepare_sector_network.py:add_rail_transport"
      - change: "nodal allocation of rail totals"
        anchor: "rule prepare_heat_data -> scripts/prepare_heat_data.py (nodal_energy_totals output)"
        provenance: "Snakefile:rule prepare_heat_data;scripts/prepare_heat_data.py:nodal_energy_totals"
      - change: "country rail totals and scenario scaling"
        anchor: "scripts/build_base_energy_totals.py:calc_sector + data/demand/growth_factors_cagr.csv"
        provenance: "scripts/build_base_energy_totals.py:total rail;data/demand/growth_factors_cagr.csv:total rail"
      - change: "rail share folded into land-transport pool"
        anchor: "scripts/prepare_transport_data.py:prepare_transport_data (energy_totals_transport)"
        provenance: "scripts/prepare_transport_data.py:energy_totals_transport"
    data_dependencies:
      - input: "UNSD energy balances -> 'total rail' and 'electricity rail' columns of energy_totals_base.csv"
        required_for: "rail demand level and elec/oil split"
        availability: "must be built (build_base_energy_totals download; sparse for some countries — NaN-filled)"
      - input: "clustered population layout (pop_layout)"
        required_for: "nodal allocation"
        availability: "must be built"
      - input: "data/demand/growth_factors_cagr.csv and efficiency_gains_cagr.csv rail columns"
        required_for: "scenario scaling"
        availability: "exists by default (DEFAULT row fallback)"
    demand_dimensions:
      driver: "Country rail final energy from UNSD balances ('total rail', 'electricity rail')"
      spatial: "Population fraction of the clustered population layout"
      temporal: "Annual-constant (p_set = annual TWh * 1e6 / 8760)"
      scenario: "Per-country CAGR csvs compounded from demand_data.base_year, selected by the {demand} wildcard"

  - model: pypsa-eur
    version_anchor: {ref: "29489d3b97bc7e5023aa02b96d3112e58258df7a", date: "2026-10-11"}
    out_of_box:
      covers: >
        Rail energy is carried in the energy totals ('total rail', 'electricity rail',
        with passenger/freight sub-columns from JRC-IDEES) but no dedicated rail load is
        added to the network. Non-electric rail is folded into the land-transport
        km-driven demand pool; electric rail is left inside the measured base electricity
        load.
      mechanism: >
        build_energy_totals.py constructs 'total rail' and 'electricity rail' (and 'total
        rail passenger'/'total rail freight' splits, filled for non-IDEES countries by
        fuel-wise rail fractions). scripts/build_transport_demand.py forms the transport
        pool as 'total road' + 'total rail' - 'electricity rail', so diesel rail is served
        through the land-transport drivetrain split. The 'electricity rail' subtraction is
        the only place the column is consumed; no rail component or carrier exists in
        prepare_sector_network.py, i.e. electric rail consumption remains implicitly part
        of the historical electricity demand time series and is never modelled separately.
        Rail emissions enter CO2 accounting via the 'rail non-elec' sector in
        determine_emission_sectors.
      not_covered: >
        No explicit rail load, profile or carrier; no rail electrification lever (the
        elec share is fixed by the statistics year); no hydrogen/battery trains; rail
        demand cannot be scaled independently of road via config.
      provenance: "scripts/build_energy_totals.py:total rail;scripts/build_transport_demand.py:electricity rail;scripts/prepare_sector_network.py:determine_emission_sectors"
    levers:
      - key: sector.transport
        effect: "Toggling transport off also removes the non-electric-rail share folded into land transport (and the 'rail non-elec' emission sector)."
        default: "true"
        provenance: "config/config.default.yaml:transport;scripts/prepare_sector_network.py:rail non-elec"
      - key: energy.energy_totals_year
        effect: "Statistics year fixing rail totals and the electric share."
        default: "2023"
        provenance: "config/config.default.yaml:energy_totals_year;scripts/build_transport_demand.py:energy_totals_year"
    boundary:
      - variant: "scale rail demand independently of road"
        rung: L3
        note: "No config key; edit the rail columns of the energy_totals.csv resource (or the JRC-IDEES-derived pipeline in build_energy_totals.py)."
      - variant: "model rail electrification over time (shift diesel rail to electricity)"
        rung: L2
        note: "Small edit in build_transport_demand.py (reduce the 'total rail' - 'electricity rail' term) plus a matching addition to the electricity load; no key exists."
      - variant: "add an explicit rail load with its own profile"
        rung: L4
        note: "Pop-weighted rail columns already reach prepare_sector_network via pop_weighted_energy_totals; a new load needs code there plus (for a profile) a new rule/input."
      - variant: "hydrogen trains"
        rung: L5
        note: "No carrier/option; bespoke component logic."
    where:
      - change: "fold of non-electric rail into land transport"
        anchor: "scripts/build_transport_demand.py:build_transport_demand (energy_totals_transport)"
        provenance: "scripts/build_transport_demand.py:energy_totals_transport"
      - change: "rail columns of the energy totals"
        anchor: "scripts/build_energy_totals.py (rule build_energy_totals)"
        provenance: "scripts/build_energy_totals.py:electricity rail;rules/build_sector.smk:rule build_energy_totals"
      - change: "adding an explicit rail load"
        anchor: "scripts/prepare_sector_network.py (pop_weighted_energy_totals is in scope of the main block)"
        provenance: "scripts/prepare_sector_network.py:pop_weighted_energy_totals"
    data_dependencies:
      - input: "JRC-IDEES transport sheets + eurostat balances (rail rows)"
        required_for: "rail totals and passenger/freight/electric splits"
        availability: "must be built (retrieved; Europe only)"
      - input: "pop_weighted_energy_totals.csv"
        required_for: "any nodal rail treatment"
        availability: "must be built (rule build_population_weighted_energy_totals)"
    demand_dimensions:
      driver: "Country rail final energy from JRC-IDEES/eurostat ('total rail', 'electricity rail')"
      spatial: "Population weighting (pop_weighted_energy_totals); electric rail implicitly follows the measured load's spatial distribution"
      temporal: "No own profile — diesel rail inherits the land-transport traffic profile; electric rail inherits the historical load shape"
      scenario: "Fixed by energy.energy_totals_year; no per-year rail dict exists"
