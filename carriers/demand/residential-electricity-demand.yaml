id: residential-electricity-demand
title: Residential electricity demand (appliances and lighting)
summary: Household electricity consumption excluding (or including, model-dependent) electric heating — level, profile and nodal allocation.

when_to_use:
  - "residential electricity"
  - "household electricity demand"
  - "appliance and lighting load"
  - "domestic power consumption"
  - "grow household demand"
  - "electrification of households"
  - "residential load profile"
  - "scale electricity demand by country"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Two layers. (1) The power-model base load: rule build_demand_profiles reads
        country-level hourly profiles from GEGIS SSP scenarios (load_options.source: gegis;
        ssp/weather_year/prediction_year select the file) or DemandCast, scales them
        (load_options.scale, scalar or per-country dict) and distributes to buses by
        0.6*GDP + 0.4*population of GADM sub-shapes. (2) In the sector workflow,
        add_residential rescales the AC-bus electricity loads so their per-country annual sum
        equals the UNSD-derived 'electricity residential' total (which includes electrified
        shares of oil/gas/biomass from data/demand/fuel_shares.csv and optionally coal via
        sector.coal.shift_to_elec), keeping the base profile's shape via normalize_by_country
        + p_set_from_scaling. Non-electric household fuel use becomes separate
        'residential oil/gas/biomass' loads on the fuel buses with CO2 counter-loads.
      mechanism: >
        rule build_demand_profiles -> base Load components; rule prepare_sector_network ->
        add_residential (gated by sector.enable.residential) overwrites AC-bus p_set with
        the scaled residential total and adds the fuel-carrier loads.
      not_covered: >
        After add_residential the AC base loads represent ONLY residential electricity
        (services and agriculture electricity are added as separate loads); no appliance-level
        end uses, no residential cooling, no explicit cooking end-use (folded into the fuel
        and electricity totals); the profile shape is the whole-system GEGIS/DemandCast shape,
        not a residential-specific one.
      provenance: "scripts/build_demand_profiles.py:build_demand_profiles; scripts/prepare_sector_network.py:add_residential; scripts/prepare_sector_network.py:p_set_from_scaling; scripts/build_base_energy_totals.py:electricity residential"

    levers:
      - key: load_options.source
        effect: "Base electricity profile source: 'gegis' or 'demcast'."
        default: "gegis"
        provenance: "config.default.yaml:load_options; scripts/build_demand_profiles.py:get_load_paths_gegis"
      - key: load_options.scale
        effect: "Scales base load time series; scalar or per-country dict with DEFAULT key."
        default: "1"
        provenance: "config.default.yaml:load_options; scripts/build_demand_profiles.py:scale"
      - key: load_options.prediction_year
        effect: "GEGIS demand projection year of the base load."
        default: "2030"
        provenance: "config.default.yaml:load_options; scripts/build_demand_profiles.py:get_load_paths_gegis"
      - key: load_options.weather_year
        effect: "Weather year of the base load profile."
        default: "2013"
        provenance: "config.default.yaml:load_options; scripts/build_demand_profiles.py:build_demand_profiles"
      - key: sector.enable.residential
        effect: "Turns the residential rescaling and fuel loads on/off in the sector network."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_residential"
      - key: sector.coal.shift_to_elec
        effect: "Folds household/services coal consumption into the electricity totals instead of dropping it."
        default: "true"
        provenance: "config.default.yaml:shift_to_elec; scripts/build_base_energy_totals.py:shift_coal_to_elec"
      - key: demand_data.base_year
        effect: "UNSD balance year of the residential totals."
        default: "2019"
        provenance: "config.default.yaml:base_year; Snakefile:build_base_energy_totals"
      - key: scenario.demand
        effect: "Demand scenario wildcard driving growth/electrification in prepare_energy_totals."
        default: "[\"AB\"]"
        provenance: "config.default.yaml:demand:; scripts/prepare_energy_totals.py:demand_sc"

    boundary:
      - variant: "Scale residential electricity per country"
        rung: L1
        note: "load_options.scale per-country dict affects the power-model base load; in the sector workflow the level is pinned to UNSD totals, so use the growth CAGR files instead."
      - variant: "Growth trajectory / electrification scenario"
        rung: L3
        note: "Edit data/demand/growth_factors_cagr.csv, efficiency_gains_cagr.csv and fuel_shares.csv ('oil to elec share', 'biomass to elec share', 'gas to elec share') per country — these are the levers prepare_energy_totals actually reads."
      - variant: "Residential-specific load profile (not the whole-system shape)"
        rung: L2
        note: "add_residential reuses the base profile via normalize_by_country; substituting a residential shape means changing that block (plus the profile data, L3)."
      - variant: "Different base-load dataset"
        rung: L1
        note: "load_options.source: demcast (requires the DemandCast bundle to be available, else the rule raises)."
      - variant: "Appliance-level end uses (lighting, refrigeration, ...)"
        rung: L5
        note: "No end-use decomposition anywhere in the chain; would need new data and new load construction."

    where:
      - change: "Base profile construction and GDP/pop allocation"
        anchor: "rule build_demand_profiles -> scripts/build_demand_profiles.py:upsample (0.6 gdp / 0.4 pop weights)"
        provenance: "scripts/build_demand_profiles.py:0.6 * normed(gdp_n) + 0.4 * normed(pop_n); Snakefile:build_demand_profiles"
      - change: "Rescaling to residential totals"
        anchor: "scripts/prepare_sector_network.py:add_residential ('electricity residential' block at the end)"
        provenance: "scripts/prepare_sector_network.py:electricity residential"
      - change: "Residential totals and electrified shares"
        anchor: "scripts/build_base_energy_totals.py:calc_sector ('consumption by households') + scripts/prepare_energy_totals.py"
        provenance: "scripts/build_base_energy_totals.py:consumption by households; scripts/prepare_energy_totals.py:oil to elec share"

    data_dependencies:
      - input: "GEGIS SSP load files (or DemandCast dataset)"
        required_for: "Base hourly profile per country"
        availability: "retrieved by default for GEGIS; DemandCast must be downloaded separately"
      - input: "GADM shapes with gdp/pop attributes"
        required_for: "Nodal allocation"
        availability: "must be built (build_shapes)"
      - input: "UNSD household consumption"
        required_for: "Sector-workflow residential level"
        availability: "must be built; region-dependent"
      - input: "data/demand/fuel_shares.csv + CAGR files"
        required_for: "Electrification and growth scenarios"
        availability: "exists by default (DEFAULT-row fallback)"

    demand_dimensions:
      driver: "UNSD 'electricity residential' (base year) + electrified fuel shares, grown by per-country CAGRs; base load level from GEGIS SSP prediction year"
      spatial: "0.6*GDP + 0.4*population weights over GADM sub-shapes within each country"
      temporal: "GEGIS/DemandCast hourly country profile reused as the shape for the rescaled residential load"
      scenario: "scenario.demand wildcard x planning_horizons via CAGR and fuel-share data files; load_options.scale for the power model"

  - model: pypsa-eur
    version_anchor: {ref: "492f05d32e91ff76b26a7ee67604811a54cb315a", date: "2026-10-10"}

    out_of_box:
      covers: >
        NOT a distinct load. Residential electricity sits inside the whole-system historical
        national load: build_electricity_demand merges ENTSO-E, OPSD and NESO time series
        (entsoe.combine_first(opsd).combine_first(neso)), optionally supplemented with
        synthetic data, and build_electricity_demand_base distributes it to nodes by
        distribution keys (energy-atlas raster where available, GB DESNZ sub-national
        consumption, else NUTS3 GDP/population weights); attach_load applies
        load.scaling_factor. In the sector workflow all base loads get carrier 'electricity'
        (patch_electricity_network); electric heating is then subtracted in build_heat_demand
        (using JRC 'electricity residential space/water' totals) and today's industrial
        electricity is scaled out in add_industry — what remains implicitly contains
        residential appliance/lighting electricity but is never labelled residential.
      mechanism: >
        rules build_electricity_demand -> build_electricity_demand_base -> add_electricity:
        attach_load; prepare_sector_network: patch_electricity_network (carrier
        'electricity'), build_heat_demand (electric-heat subtraction), add_industry
        (industry-electricity subtraction).
      not_covered: >
        No residential/services split of the electric load, no appliance end uses, no
        residential-specific profile; JRC-IDEES columns 'electricity residential' exist in the
        energy totals but are not used to build a separate network load.
      provenance: "scripts/build_electricity_demand.py:load_timeseries; scripts/build_electricity_demand_base.py:upsample_load; scripts/add_electricity.py:attach_load; scripts/prepare_sector_network.py:patch_electricity_network; scripts/prepare_sector_network.py:electric_heat_supply; scripts/prepare_sector_network.py:current electricity"

    levers:
      - key: load.scaling_factor
        effect: "Uniform scaling of the whole base electricity load."
        default: "1.0"
        provenance: "config/config.default.yaml:scaling_factor; scripts/add_electricity.py:attach_load"
      - key: load.distribution_key
        effect: "GDP vs population weights for NUTS3-based nodal allocation."
        default: "{gdp: 0.6, population: 0.4}"
        provenance: "config/config.default.yaml:distribution_key; scripts/build_electricity_demand_base.py:nuts3_distribution_keys"
      - key: load.supplement_synthetic
        effect: "Fills countries/periods missing from historical data with synthetic load."
        default: "true"
        provenance: "config/config.default.yaml:supplement_synthetic; scripts/build_electricity_demand.py:supplement_synthetic"
      - key: load.fixed_year
        effect: "Pins the demand year instead of following weather-year snapshots."
        default: "false"
        provenance: "config/config.default.yaml:fixed_year; scripts/build_electricity_demand.py:fixed_year"

    boundary:
      - variant: "Scale total electricity demand"
        rung: L0
        note: "load.scaling_factor (whole system — cannot target residential only)."
      - variant: "Change nodal allocation weights"
        rung: L0
        note: "load.distribution_key gdp/population."
      - variant: "Carve out an explicit residential electricity load"
        rung: L3
        note: "The JRC-IDEES 'electricity residential' totals already flow through build_energy_totals / pop_weighted_energy_totals; a new load plus a subtraction from the base load must be coded in prepare_sector_network (pattern: the electric-heating subtraction in build_heat_demand), with a residential profile as new data."
      - variant: "Residential demand growth per scenario year"
        rung: L2
        note: "No per-sector growth mechanism; the base load is historical. A scaling hook would go into attach_load or prepare_sector_network."
      - variant: "Appliance end-use detail"
        rung: L5
        note: "Nothing in the repo; needs end-use data and new component logic."

    where:
      - change: "National load time series"
        anchor: "rule build_electricity_demand -> scripts/build_electricity_demand.py"
        provenance: "rules/build_electricity.smk:build_electricity_demand"
      - change: "Nodal distribution"
        anchor: "rule build_electricity_demand_base -> scripts/build_electricity_demand_base.py:upsample_load"
        provenance: "rules/build_electricity.smk:build_electricity_demand_base"
      - change: "Subtractions that reveal the implicit residential remainder"
        anchor: "scripts/prepare_sector_network.py:build_heat_demand (electric heating) and add_industry ('current electricity')"
        provenance: "scripts/prepare_sector_network.py:build_heat_demand; scripts/prepare_sector_network.py:current electricity"
      - change: "Residential electricity totals (unused for loads, available for carving)"
        anchor: "scripts/build_energy_totals.py:idees_per_country ('electricity residential')"
        provenance: "scripts/build_energy_totals.py:electricity residential"

    data_dependencies:
      - input: "ENTSO-E / OPSD / NESO historical load + synthetic supplement"
        required_for: "Base national time series"
        availability: "retrieved by default"
      - input: "NUTS3 shapes with GDP/population, energy-atlas raster, GB DESNZ data"
        required_for: "Nodal distribution keys"
        availability: "retrieved by default, Europe only"
      - input: "JRC-IDEES residential electricity totals"
        required_for: "Any residential carve-out"
        availability: "exists by default (in energy_totals), Europe only"

    demand_dimensions:
      driver: "Historical national electricity consumption (ENTSO-E/OPSD/NESO); residential share implicit"
      spatial: "Energy-atlas raster / GB DESNZ / NUTS3 0.6*GDP + 0.4*pop distribution keys to clustered nodes"
      temporal: "Measured hourly national profiles for the snapshot years"
      scenario: "load.scaling_factor only; no per-sector residential trajectory out of the box"
