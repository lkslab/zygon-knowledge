id: residential-space-heating-demand
title: Residential space heating demand
summary: The heat demand of households for keeping buildings warm — annual level, weather-driven profile and allocation to heat systems.

when_to_use:
  - "residential space heating"
  - "household heating demand"
  - "home heating"
  - "building heat demand"
  - "heating degree day demand"
  - "how much heat do homes need"
  - "space heat load profile"
  - "increase/decrease residential heating demand"
  - "heating in a warm/cold country"
  - "known in pypsa-eur as: Heat load, heat, heat demand, rural heat, residential rural heat, decentral heat, residential urban decentral heat"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Hourly residential space heat loads on five heat-system buses. The shape comes from
        rule build_heat_demand, which calls atlite's cutout.heat_demand (heating degree-day
        conversion of ERA5 temperature) weighted by gridded population layouts and aggregated
        to clustered regions. prepare_heat_data multiplies this daily shape by a BDEW intraday
        weekday/weekend profile ('residential space' columns of data/heat_load_profile_BDEW.csv),
        normalises it, and scales to the annual total 'total residential space' from the
        UNSD-derived energy totals. The annual space total is the UNSD household heat-commodity
        consumption times sector.space_heat_share (build_base_energy_totals), grown/electrified
        per demand scenario and horizon in prepare_energy_totals. add_heat splits the load
        across 'residential rural', 'residential urban decentral' and (mixed with services)
        'urban central' buses using the urban population fraction and the district-heat share.
        add_residential then re-scales the residential heat loads so their annual sum matches
        total residential space+water minus the parts served directly by oil/gas/biomass
        (which become separate 'residential oil/gas/biomass' fuel loads).
      mechanism: >
        rule build_heat_demand (atlite degree-days) -> rule prepare_heat_data (BDEW intraday x
        annual totals) -> rule prepare_sector_network: add_heat (loads per heat system, gated by
        sector.enable.heat) and add_residential (rescale to UNSD totals net of fossil heat).
      not_covered: >
        No building-stock model, no endogenous retrofit (only the exogenous
        reduce_space_heat_exogenously factor), no heat DSM / thermal-mass flexibility, no
        cooling. The BDEW intraday profile and the degree-day parameters are Europe-derived;
        the space/water split is a single global scalar (sector.space_heat_share), not
        country-resolved.
      provenance: "scripts/build_heat_demand.py:cutout.heat_demand; scripts/prepare_heat_data.py:prepare_heat_data; scripts/prepare_sector_network.py:add_heat; scripts/build_base_energy_totals.py:space_heat_share; scripts/prepare_sector_network.py:add_residential"

    levers:
      - key: sector.space_heat_share
        effect: "Share of UNSD household/services heat-commodity consumption assigned to space heating (remainder goes to water heating)."
        default: "0.6"
        provenance: "config.default.yaml:space_heat_share; scripts/build_base_energy_totals.py:space_heat_share"
      - key: sector.reduce_space_heat_exogenously
        effect: "Enables uniform exogenous scaling of space heat demand (renovation/efficiency proxy)."
        default: "false"
        provenance: "config.default.yaml:reduce_space_heat_exogenously; scripts/prepare_sector_network.py:reduce_space_heat_exogenously"
      - key: sector.reduce_space_heat_exogenously_factor
        effect: "Per-unit space-heat reduction; scalar or dict keyed by planning horizon; negative values grow demand."
        default: "0.29"
        provenance: "config.default.yaml:reduce_space_heat_exogenously_factor; scripts/prepare_sector_network.py:reduce_space_heat_exogenously_factor"
      - key: sector.district_heating.potential
        effect: "Maximum fraction of urban heat demand servable by district heating (moves demand between 'urban decentral' and 'urban central' buses)."
        default: "0.3"
        provenance: "config.default.yaml:district_heating; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: sector.district_heating.progress
        effect: "Interpolation (0..1, per-horizon dict allowed) between today's district-heat share and the potential."
        default: "1"
        provenance: "config.default.yaml:district_heating; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: demand_data.base_year
        effect: "UNSD energy-balance year the annual totals are taken from."
        default: "2019"
        provenance: "config.default.yaml:base_year; Snakefile:build_base_energy_totals"
      - key: scenario.demand
        effect: "Demand-scenario wildcard (e.g. AB/BU/AP/NZ/DF) that selects {demand}_{year} entries of scenario-dependent shares in prepare_energy_totals."
        default: "[\"AB\"]"
        provenance: "config.default.yaml:demand:; scripts/prepare_energy_totals.py:demand_sc"
      - key: sector.enable.heat
        effect: "Master switch for the heat sector (add_heat is skipped if false)."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_heat"

    boundary:
      - variant: "Scale space heat demand up/down uniformly or per horizon"
        rung: L0
        note: "Flip sector.reduce_space_heat_exogenously and set the factor (dict per planning horizon supported via get(..., investment_year))."
      - variant: "Change the space vs water heating split"
        rung: L0
        note: "sector.space_heat_share (single scalar applied to every country)."
      - variant: "Country-specific space/water split or growth trajectory"
        rung: L3
        note: "Growth/efficiency come from data/demand/growth_factors_cagr.csv and efficiency_gains_cagr.csv (per-country rows, DEFAULT fallback); the space/water split itself is only the global config scalar plus 'space to water heat share' in data/demand/fuel_shares.csv — edit those data files."
      - variant: "Replace the intraday profile (non-European usage patterns)"
        rung: L3
        note: "Swap data/heat_load_profile_BDEW.csv (columns 'residential space weekday/weekend'); no code change needed, same column names required."
      - variant: "Different weather basis (threshold temperature, other cutout)"
        rung: L2
        note: "build_heat_demand passes no custom parameters to cutout.heat_demand; a small edit there exposes atlite's threshold/hour-shift arguments. The cutout itself is the first entry under config renewable (data side is L3 if a new cutout must be built)."
      - variant: "Endogenous building retrofit competing with supply"
        rung: L5
        note: "Nothing in this repo; pypsa-eur's retro_endogen generator block plus build_retro_cost data would have to be ported (new rule L4 + Europe-only building-stock data L3)."
      - variant: "Heat demand for a region without UNSD household data"
        rung: L3
        note: "build_base_energy_totals warns 'No data for <country>' and writes NaN; user must supply totals (e.g. via the energy_totals csv) for the region."

    where:
      - change: "Weather-driven daily shape"
        anchor: "rule build_heat_demand -> scripts/build_heat_demand.py (atlite cutout.heat_demand, population-layout weighting)"
        provenance: "scripts/build_heat_demand.py:cutout.heat_demand; Snakefile:build_heat_demand"
      - change: "Intraday profile and annual scaling"
        anchor: "scripts/prepare_heat_data.py:prepare_heat_data (heat_demand csv, columns '<sector> <use>')"
        provenance: "scripts/prepare_heat_data.py:prepare_heat_data"
      - change: "Annual totals and space/water split"
        anchor: "scripts/build_base_energy_totals.py:calc_sector ('consumption by households' block) and scripts/prepare_energy_totals.py (scenario scaling)"
        provenance: "scripts/build_base_energy_totals.py:consumption by households; scripts/prepare_energy_totals.py:total residential space"
      - change: "Load placement on heat-system buses, urban/rural split"
        anchor: "scripts/prepare_sector_network.py:add_heat + create_nodes_for_heat_sector"
        provenance: "scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - change: "Urban/rural population layouts"
        anchor: "rule build_population_layouts (GADM population + UN urban percentage)"
        provenance: "Snakefile:build_population_layouts; scripts/build_population_layouts.py:Urban population as percentage of total population"

    data_dependencies:
      - input: "UNSD energy statistics ('consumption by households' heat commodities)"
        required_for: "Annual space heat totals"
        availability: "must be built (build_base_energy_totals downloads; region-dependent gaps filled with NaN)"
      - input: "ERA5 cutout (first entry under config renewable)"
        required_for: "Degree-day heat demand shape"
        availability: "must be built (or retrieved for precomputed regions)"
      - input: "Population layouts urban/rural/total + urban percentage"
        required_for: "Spatial allocation and heat-system split"
        availability: "must be built (build_population_layouts, prepare_urban_percent)"
      - input: "data/heat_load_profile_BDEW.csv"
        required_for: "Intraday shape"
        availability: "exists by default (Europe-derived; region-appropriate replacement is on the user)"
      - input: "data/demand/fuel_shares.csv, growth_factors_cagr.csv, efficiency_gains_cagr.csv, district_heating.csv"
        required_for: "Scenario scaling and heat electrification shares"
        availability: "exists by default with DEFAULT-row fallback per country"

    demand_dimensions:
      driver: "UNSD household heat-commodity consumption in demand_data.base_year x sector.space_heat_share, grown by per-country CAGR data files"
      spatial: "Population layouts (GADM population, UN urban share) to clustered regions; split rural / urban decentral / urban central via urban fraction and district-heat share"
      temporal: "atlite heating degree-days (daily) x BDEW intraday weekday/weekend profile"
      scenario: "scenario.demand wildcard + planning_horizons: CAGR growth/efficiency files, fuel_shares electrification, optional reduce_space_heat_exogenously_factor dict"

  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}

    out_of_box:
      covers: >
        Hourly residential space heat loads on the HeatSystem buses (residential rural,
        residential urban decentral, urban central). Rule build_daily_heat_demand converts
        cutout temperature to daily heating-degree-day demand weighted by population; rule
        build_hourly_heat_demand multiplies by BDEW intraday profiles
        (data/heat_load_profile_BDEW.csv). In prepare_sector_network, build_heat_demand
        normalises the shape and scales to population-weighted annual totals
        'total residential space' (JRC-IDEES / Eurostat via build_energy_totals, extended to
        all weather years by an HDD regression in build_heat_totals) multiplied by
        country heating efficiencies (final energy -> useful heat,
        build_heating_efficiencies). Electric space heating is subtracted from the base
        electricity load. add_heat places the loads per HeatSystem using
        heat_demand_weighting (urban fraction, district-heat fraction). Endogenous retrofit
        (retro_endogen) and residential heat DSM are available as options.
      mechanism: >
        rule build_daily_heat_demand -> rule build_hourly_heat_demand -> rule
        prepare_sector_network: build_heat_demand + add_heat (HeatSystem enum in
        scripts/definitions/heat_system.py); annual totals from rules build_energy_totals /
        build_heat_totals / build_population_weighted_energy_totals.
      not_covered: >
        No space cooling; no explicit building-stock vintages beyond the retrofit cost
        curves; intraday profiles are German BDEW applied to all countries; demand level is
        tied to JRC-IDEES/Eurostat coverage (Europe only).
      provenance: "scripts/build_daily_heat_demand.py:cutout.heat_demand; scripts/build_hourly_heat_demand.py:intraday_profiles; scripts/prepare_sector_network.py:build_heat_demand; scripts/build_heat_totals.py:approximate_heat_demand; scripts/definitions/heat_system.py:class HeatSystem"

    levers:
      - key: sector.reduce_space_heat_exogenously
        effect: "Enables exogenous space-heat reduction (on by default)."
        default: "true"
        provenance: "config/config.default.yaml:reduce_space_heat_exogenously; scripts/prepare_sector_network.py:reduce_space_heat_exogenously"
      - key: sector.reduce_space_heat_exogenously_factor
        effect: "Per-year dict of per-unit space-heat reduction (EU calculator LTS trajectory), resolved via get(..., investment_year)."
        default: "{2020: 0.1, ..., 2050: 0.29}"
        provenance: "config/config.default.yaml:reduce_space_heat_exogenously_factor; scripts/prepare_sector_network.py:reduce_space_heat_exogenously_factor"
      - key: sector.retrofitting.retro_endogen
        effect: "Adds endogenous retrofit generators on heat buses (cost-optimal insulation vs supply, per country x sector x strength)."
        default: "false"
        provenance: "config/config.default.yaml:retro_endogen; scripts/prepare_sector_network.py:retro_endogen"
      - key: sector.retrofitting.cost_factor
        effect: "Scales retrofit capital costs."
        default: "1.0"
        provenance: "config/config.default.yaml:cost_factor; scripts/prepare_sector_network.py:cost_factor"
      - key: sector.district_heating.potential
        effect: "Maximum urban fraction servable by district heating (moves residential demand into urban central)."
        default: "0.6"
        provenance: "config/config.default.yaml:district_heating; scripts/prepare_sector_network.py:heat_demand_weighting"
      - key: energy.energy_totals_year
        effect: "JRC-IDEES/Eurostat year the annual energy totals are taken from."
        default: "2023"
        provenance: "config/config.default.yaml:energy_totals_year; rules/build_sector.smk:energy_totals_year"
      - key: sector.residential_heat.dsm.enable
        effect: "Adds thermal-mass DSM Stores on residential heat buses (see building-heat-dsm carrier card)."
        default: "false"
        provenance: "config/config.default.yaml:residential_heat; scripts/prepare_sector_network.py:residential_heat"

    boundary:
      - variant: "Scale space heat demand per planning horizon"
        rung: L0
        note: "reduce_space_heat_exogenously_factor per-year dict is already active by default."
      - variant: "Endogenous retrofit"
        rung: L0
        note: "Flip sector.retrofitting.retro_endogen; rule build_retro_cost supplies the cost/saving curves from shipped TABULA/hotmaps data."
      - variant: "Different retrofit strength steps"
        rung: L2
        note: "The insulation-thickness list l_strength is hardcoded in scripts/build_retro_cost.py, not a config key."
      - variant: "Replace intraday profile"
        rung: L3
        note: "Swap data/heat_load_profile_BDEW.csv keeping column names ('residential space weekday' etc.)."
      - variant: "Different demand-level source than JRC-IDEES/Eurostat"
        rung: L3
        note: "Provide alternative energy_totals/heat_totals csv rows; build_heat_totals regresses space heat on HDD per country for non-IDEES weather years."
      - variant: "Country outside Europe"
        rung: L4
        note: "Energy-totals chain (JRC-IDEES, Eurostat, Swiss balances) and NUTS3 spatial data are Europe-specific; new data plumbing and rule inputs required."

    where:
      - change: "Daily degree-day shape"
        anchor: "rule build_daily_heat_demand -> scripts/build_daily_heat_demand.py"
        provenance: "rules/build_sector.smk:build_daily_heat_demand; scripts/build_daily_heat_demand.py:heat_demand"
      - change: "Hourly profile (BDEW intraday)"
        anchor: "rule build_hourly_heat_demand -> scripts/build_hourly_heat_demand.py"
        provenance: "rules/build_sector.smk:build_hourly_heat_demand; scripts/build_hourly_heat_demand.py:intraday_profiles"
      - change: "Annual totals (JRC-IDEES residential 'Space heating')"
        anchor: "scripts/build_energy_totals.py:idees_per_country + build_heat_totals HDD regression"
        provenance: "scripts/build_energy_totals.py:idees_per_country; scripts/build_heat_totals.py:approximate_heat_demand"
      - change: "Scaling, efficiency multiplication and electric-heat subtraction"
        anchor: "scripts/prepare_sector_network.py:build_heat_demand"
        provenance: "scripts/prepare_sector_network.py:electric_heat_supply"
      - change: "Load placement per heat system"
        anchor: "scripts/prepare_sector_network.py:add_heat + HeatSystem.heat_demand_weighting"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/definitions/heat_system.py:heat_demand_weighting"
      - change: "Retrofit supply curve"
        anchor: "rule build_retro_cost + retro_endogen block in add_heat"
        provenance: "rules/build_sector.smk:build_retro_cost; scripts/build_retro_cost.py:l_strength"

    data_dependencies:
      - input: "JRC-IDEES residential sheets (RES_hh_fec 'Space heating') + Eurostat balances"
        required_for: "Annual space heat totals and heating efficiencies"
        availability: "exists by default (retrieved), Europe only"
      - input: "Weather cutout + population layout"
        required_for: "Degree-day shape and nodal allocation"
        availability: "must be built (or retrieved)"
      - input: "data/heat_load_profile_BDEW.csv"
        required_for: "Intraday shape"
        availability: "exists by default"
      - input: "data/retro/* (TABULA, hotmaps building stock, cost data)"
        required_for: "Endogenous retrofit"
        availability: "exists by default, Europe only"

    demand_dimensions:
      driver: "JRC-IDEES/Eurostat 'total residential space' per country (energy.energy_totals_year), extended over weather years by HDD regression; times country heating efficiency"
      spatial: "Population-weighted to clustered regions (build_population_weighted_energy_totals); split across HeatSystem buses by urban/district-heat fractions"
      temporal: "Daily heating degree-days (atlite) x BDEW intraday weekday/weekend profiles"
      scenario: "reduce_space_heat_exogenously_factor per-year dict; optional endogenous retrofit; district_heating.progress per-year dict"
