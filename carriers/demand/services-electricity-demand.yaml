id: services-electricity-demand
title: Services / commercial electricity demand
summary: Electricity consumption of the tertiary sector (offices, retail, public services) — level, profile and how it is separated from other loads.

when_to_use:
  - "services electricity"
  - "commercial electricity demand"
  - "tertiary sector power"
  - "office/shop electricity load"
  - "public services power demand"
  - "grow commercial demand"
  - "commercial load profile"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        An explicit Load per node with carrier 'services electricity' on the AC buses, added by
        add_services in prepare_sector_network. The annual level is the UNSD 'services
        electricity' total per country (build_base_energy_totals 'services' block, optionally
        including coal via sector.coal.shift_to_elec), scenario-scaled in
        prepare_energy_totals. The hourly shape is a PROXY: add_services normalises the
        existing base electricity load per country (profile_residential =
        normalize_by_country(n.loads_t.p_set[buses])) and applies that shape via
        p_set_from_scaling — there is no services-specific profile. add_services also adds
        'services oil/gas/biomass' fuel loads with CO2 counter-loads for non-electric,
        non-heat services fuel use.
      mechanism: >
        rule build_base_energy_totals ('services' sector) -> prepare_energy_totals ->
        rule prepare_sector_network: add_services (gated by sector.enable.services), reusing
        the base electricity profile shape.
      not_covered: >
        No services-specific load shape (weekday/business-hour patterns) — the base-load
        proxy is explicitly a simplification; no sub-sector detail; no services cooling; the
        services electrification shares in prepare_energy_totals are zeroed
        ('electricity services space' and 'electricity services water' are set to 0).
      provenance: "scripts/prepare_sector_network.py:add_services; scripts/prepare_sector_network.py:profile_residential; scripts/build_base_energy_totals.py:services electricity; scripts/prepare_energy_totals.py:electricity services space"

    levers:
      - key: sector.enable.services
        effect: "Turns the services loads (electricity + fuels) on/off."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_services"
      - key: demand_data.base_year
        effect: "UNSD balance year for services totals."
        default: "2019"
        provenance: "config.default.yaml:base_year; Snakefile:build_base_energy_totals"
      - key: sector.coal.shift_to_elec
        effect: "Folds services coal consumption into the services electricity total."
        default: "true"
        provenance: "config.default.yaml:shift_to_elec; scripts/build_base_energy_totals.py:shift_coal_to_elec"
      - key: scenario.demand
        effect: "Demand scenario wildcard for growth/efficiency in prepare_energy_totals."
        default: "[\"AB\"]"
        provenance: "config.default.yaml:demand:; scripts/prepare_energy_totals.py:demand_sc"

    boundary:
      - variant: "Scale services electricity per country / per year"
        rung: L3
        note: "Level is pinned to UNSD totals x growth CAGRs — edit data/demand/growth_factors_cagr.csv / efficiency_gains_cagr.csv rows ('services electricity' column)."
      - variant: "Services-specific (business-hours) profile"
        rung: L2
        note: "add_services builds the shape from the base load; substituting a weekly services profile is a localised edit there (profile data itself is L3)."
      - variant: "Sub-sector services detail"
        rung: L5
        note: "No data or component structure exists."
      - variant: "Countries without UNSD services data"
        rung: L3
        note: "calc_sector writes NaN for the services columns when the UNSD slice is empty; totals must be supplied."

    where:
      - change: "Load construction and profile proxy"
        anchor: "scripts/prepare_sector_network.py:add_services (p_set_from_scaling with profile_residential)"
        provenance: "scripts/prepare_sector_network.py:p_set_from_scaling"
      - change: "Annual services totals"
        anchor: "scripts/build_base_energy_totals.py:calc_sector ('services' branch)"
        provenance: "scripts/build_base_energy_totals.py:services electricity"
      - change: "Scenario scaling"
        anchor: "scripts/prepare_energy_totals.py (growth_factors x efficiency_gains)"
        provenance: "scripts/prepare_energy_totals.py:growth_factors_cagr"

    data_dependencies:
      - input: "UNSD 'services' consumption"
        required_for: "Annual level"
        availability: "must be built; region-dependent (NaN where missing)"
      - input: "Base electricity demand profiles (GEGIS/DemandCast)"
        required_for: "The proxy shape"
        availability: "must be built (build_demand_profiles)"
      - input: "data/demand CAGR files"
        required_for: "Scenario growth"
        availability: "exists by default (DEFAULT-row fallback)"

    demand_dimensions:
      driver: "UNSD 'services electricity' per country in demand_data.base_year, grown by per-country CAGRs"
      spatial: "Follows the base electricity load's nodal distribution (GDP/pop within country)"
      temporal: "Base electricity profile shape reused as proxy — no services-specific pattern"
      scenario: "scenario.demand wildcard x planning_horizons via CAGR files"

  - model: pypsa-eur
    version_anchor: {ref: "a6c45e5a2d926ba9a5566cba24d905cff9f89939", date: "2026-09-09"}

    out_of_box:
      covers: >
        NOT a distinct load. Services electricity is contained in the whole-system historical
        national load (ENTSO-E/OPSD/NESO merged in build_electricity_demand, distributed to
        nodes in build_electricity_demand_base, attached with load.scaling_factor). In the
        sector workflow the base loads get carrier 'electricity'; electric services heating is
        subtracted via the 'electricity services space/water' totals in build_heat_demand, and
        industry electricity is scaled out in add_industry — the remainder implicitly contains
        services electricity. JRC-IDEES provides 'electricity services' totals in
        build_energy_totals but no separate network load is built from them.
      mechanism: >
        rules build_electricity_demand / build_electricity_demand_base -> add_electricity:
        attach_load; prepare_sector_network: patch_electricity_network + build_heat_demand
        (electric services heating subtraction).
      not_covered: >
        No residential/services split, no commercial load profile, no sub-sector detail; the
        energy-atlas / NUTS3 GDP-pop distribution keys do not distinguish sectors.
      provenance: "scripts/build_electricity_demand.py:load_timeseries; scripts/build_electricity_demand_base.py:upsample_load; scripts/prepare_sector_network.py:electric_heat_supply; scripts/build_energy_totals.py:electricity services space"

    levers:
      - key: load.scaling_factor
        effect: "Scales the whole base load (services cannot be targeted separately)."
        default: "1.0"
        provenance: "config/config.default.yaml:scaling_factor; scripts/add_electricity.py:attach_load"
      - key: load.distribution_key
        effect: "GDP vs population weights in nodal allocation — GDP weight is the closest proxy to services activity."
        default: "{gdp: 0.6, population: 0.4}"
        provenance: "config/config.default.yaml:distribution_key; scripts/build_electricity_demand_base.py:nuts3_distribution_keys"

    boundary:
      - variant: "Scale total load"
        rung: L0
        note: "load.scaling_factor."
      - variant: "Carve out an explicit services electricity load"
        rung: L3
        note: "JRC 'electricity services' totals are already in energy_totals/pop-weighted totals; code a load + base-load subtraction in prepare_sector_network following the electric-heating subtraction pattern, plus a services profile as new data."
      - variant: "Services growth trajectory"
        rung: L2
        note: "No per-sector scaling hook exists; add one in attach_load or prepare_sector_network."
      - variant: "Sub-sector commercial detail"
        rung: L5
        note: "Requires new end-use data and load structure."

    where:
      - change: "Base load pipeline"
        anchor: "rules build_electricity_demand / build_electricity_demand_base + add_electricity.attach_load"
        provenance: "rules/build_electricity.smk:build_electricity_demand_base; scripts/add_electricity.py:attach_load"
      - change: "Services electricity totals (for carving)"
        anchor: "scripts/build_energy_totals.py:idees_per_country ('electricity services')"
        provenance: "scripts/build_energy_totals.py:electricity services space"
      - change: "Existing subtraction pattern to imitate"
        anchor: "scripts/prepare_sector_network.py:build_heat_demand (electric_heat_supply subtraction)"
        provenance: "scripts/prepare_sector_network.py:build_heat_demand"

    data_dependencies:
      - input: "Historical national load (ENTSO-E/OPSD/NESO + synthetic)"
        required_for: "Base time series containing services demand"
        availability: "retrieved by default"
      - input: "JRC-IDEES Tertiary electricity totals"
        required_for: "Any services carve-out"
        availability: "exists by default (energy_totals), Europe only"

    demand_dimensions:
      driver: "Implicit within historical national load; JRC 'electricity services' totals available but unused for loads"
      spatial: "Energy-atlas / NUTS3 GDP-pop distribution keys (sector-agnostic)"
      temporal: "Measured hourly national profiles"
      scenario: "load.scaling_factor only"
