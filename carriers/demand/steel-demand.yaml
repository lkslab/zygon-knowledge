# Carrier card: iron & steel energy/material demand — pypsa-earth + pypsa-eur
id: steel-demand
title: Iron & steel industry demand
summary: >
  Energy (and, where modelled, material/process-emission) demand of iron and
  steel making — blast-furnace/basic-oxygen (integrated) routes, electric arc
  furnaces (EAF), and direct-reduced-iron (DRI) routes — placed at steel plant
  locations and fed by electricity, coal/coke, gas, hydrogen and heat.

when_to_use:
  - "add steel demand / steel industry to the model"
  - "green steel, hydrogen DRI, H2 steelmaking"
  - "switch blast furnace to electric arc furnace / scrap recycling share"
  - "primary vs secondary steel production"
  - "steel plant locations / where is steel made"
  - "decarbonise heavy industry - steel"
  - "coking coal / coke demand of industry"
  - "steel production tonnage scenarios"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Annual final-energy demand of the "iron and steel" subsector per country
        and carrier (electricity, gas, coal, oil, biomass, heat, hydrogen), taken
        from UNSD energy-balance statistics for a base year, grown to the planning
        horizon with a per-country CAGR, distributed to nodes by steel plant
        capacities from the Global Steel Plant Tracker (GEM), plus steel process
        emissions estimated from plant capacity times a fixed emission factor
        (0.025 tCO2/t, scaled by a utilisation factor).
      mechanism: >
        rule build_base_industry_totals parses UNSD .txt energy balances
        (data/demand/unsd/data) and pivots "consumption by iron and steel"
        transactions into country x carrier totals (MWh); rule
        build_industry_demand compounds data/demand/industry_growth_cagr.csv
        CAGRs over (planning_horizons - base_year) years, adds a
        "process emissions" row from GEM plant capacities (emission_factors
        dict, industry_util_factor), and multiplies by nodal keys from rule
        build_industrial_distribution_key (GEM steel plant capacities mapped to
        GADM regions; GDP share where a country has no plants). rule
        build_industrial_database maps GEM GSPT plants to technologies
        "Integrated steelworks" / "Electric arc" / "DRI + Electric arc".
        prepare_sector_network:add_industry converts the nodal carrier columns
        into constant Loads (industry electricity, gas for industry, coal
        emissions, H2 for industry, naphtha for industry, solid biomass for
        industry, low-temperature heat for industry, process emissions).
      not_covered: >
        No production-tonnage accounting and no route resolution: the GSPT
        technology split (BF/EAF/DRI) is used ONLY for siting, not for energy
        intensity — all steel energy is one aggregate carrier mix frozen at the
        base-year UNSD split. No St_primary_fraction / DRI_fraction style route
        switching, no H2-DRI, no scrap-recycling lever, no per-route MWh/t
        intensities, no coke/coal distinction beyond the UNSD coal carrier.
      provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals;data/unsd_transactions.csv:iron and steel;scripts/build_industry_demand.py:emission_factors;scripts/build_industrial_database.py:create_steel_db;scripts/build_industrial_distribution_key.py:build_nodal_distribution_key;scripts/prepare_sector_network.py:def add_industry;Snakefile:rule build_industry_demand"
    levers:
      - key: sector.enable.industry
        effect: "Master switch — if false, add_industry is skipped and no industry loads are added."
        default: "true"
        provenance: "config.default.yaml:industry;scripts/prepare_sector_network.py:def add_industry"
      - key: demand_data.base_year
        effect: "UNSD statistics year used as the base for the iron-and-steel energy totals."
        default: "2019"
        provenance: "config.default.yaml:base_year;scripts/build_base_industry_totals.py:base_year"
      - key: sector.industry_util_factor
        effect: "Utilisation factor applied to GEM plant capacities when estimating steel process emissions."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor;scripts/build_industry_demand.py:industry_util_factor"
      - key: custom_data.industry_demand
        effect: >
          If true, bypasses the UNSD+CAGR pipeline entirely and reads
          data/custom/industry_demand_{demand}_{planning_horizons}.csv
          (country x carrier rows, subsector columns incl. iron and steel).
        default: "false"
        provenance: "config.default.yaml:industry_demand;scripts/build_industry_demand.py:industry_demand"
      - key: custom_data.industry_database
        effect: "If true, reads plant locations from data/custom/industrial_database.csv instead of the built GEM/SFI database — changes where steel demand lands."
        default: "false"
        provenance: "config.default.yaml:industry_database;scripts/build_industrial_distribution_key.py:industry_database"
    boundary:
      - variant: "turn industrial (steel) demand on/off"
        rung: L0
        note: "sector.enable.industry flag."
      - variant: "change steel demand growth for a country"
        rung: L3
        note: "edit the iron and steel column of data/demand/industry_growth_cagr.csv (checked-in data file; DEFAULT row is the fallback, 0.017/yr for steel). No config key."
      - variant: "replace steel energy demand with own numbers"
        rung: L3
        note: "set custom_data.industry_demand: true and provide data/custom/industry_demand_{demand}_{planning_horizons}.csv — the flag is L0 but the file must be authored."
      - variant: "move/add steel plants (siting)"
        rung: L3
        note: "custom_data.industry_database: true + data/custom/industrial_database.csv with technology/capacity/x/y columns; default GSPT is fetched inside build_industrial_database.py."
      - variant: "change steel process-emission factor"
        rung: L2
        note: "emission_factors dict is hardcoded in build_industry_demand.py (iron and steel: 0.025) — small localised edit."
      - variant: "route switching (BF->EAF, H2-DRI, primary/secondary share)"
        rung: L5
        note: >
          No tonnage or per-route intensity exists; requires porting the
          pypsa-eur production/sector-ratio chain (production per country
          tomorrow + MWh/t ratios) into the earth pipeline — new code and new
          data. The GSPT technology labels in the industrial database are the
          only existing hook.
      - variant: "endogenous steel process (model chooses route)"
        rung: L5
        note: "bespoke component logic; nothing in the earth pipeline represents steel as a convertible process."
    where:
      - change: "process-emission factors and CAGR growth application"
        anchor: "scripts/build_industry_demand.py (emission_factors, calculate_end_values)"
        provenance: "scripts/build_industry_demand.py:emission_factors;scripts/build_industry_demand.py:calculate_end_values"
      - change: "UNSD subsector parsing / base totals"
        anchor: "rule build_base_industry_totals -> scripts/build_base_industry_totals.py"
        provenance: "Snakefile:rule build_base_industry_totals;scripts/build_base_industry_totals.py:create_industry_base_totals"
      - change: "steel plant database (GSPT mapping, technology dict)"
        anchor: "scripts/build_industrial_database.py:create_steel_db (iron_techs mapping)"
        provenance: "scripts/build_industrial_database.py:create_steel_db;scripts/build_industrial_database.py:iron_techs"
      - change: "nodal distribution of steel demand"
        anchor: "rule build_industrial_distribution_key -> build_nodal_distribution_key"
        provenance: "Snakefile:rule build_industrial_distribution_key;scripts/build_industrial_distribution_key.py:build_nodal_distribution_key"
      - change: "loads placed on the network"
        anchor: "scripts/prepare_sector_network.py:add_industry"
        provenance: "scripts/prepare_sector_network.py:def add_industry"
    data_dependencies:
      - input: "UNSD energy balances (data/demand/unsd/data/*.txt, downloaded when demand_data.update_data)"
        required_for: "base-year steel energy totals"
        availability: "must be built (downloaded); reporting quality region-dependent"
      - input: "data/demand/industry_growth_cagr.csv"
        required_for: "growth to planning horizon"
        availability: "exists by default but only a handful of countries have own rows (MA, TN, NA...); DEFAULT row used otherwise"
      - input: "GEM Global Steel Plant Tracker xlsx (fetched from data.pypsa.org inside build_industrial_database.py)"
        required_for: "steel plant siting + process emissions"
        availability: "must be built (network fetch at rule runtime); global coverage"
    demand_dimensions:
      driver: "base-year UNSD final energy (TWh->MWh) of the iron and steel subsector, compounded by per-country CAGR — no tonnage driver"
      spatial: "GEM GSPT steel plant capacities per GADM region; GDP-share fallback for countries without plants"
      temporal: "annual-constant: p_set = annual MWh / 8760 for every carrier load"
      scenario: "{demand} wildcard scenario + {planning_horizons} CAGR compounding; full override via custom_data.industry_demand file per scenario/horizon"

  - model: pypsa-eur
    version_anchor: {ref: "f55cdf34f0e67a797fd4327bed26c56dedcb5cb8", date: "2026-10-09"}
    out_of_box:
      covers: >
        Full production-tonnage chain with explicit routes: today's kton/a of
        "Integrated steelworks" and "Electric arc" per country from JRC-IDEES
        (Eurostat-scaled for non-EU27), a future route split into Integrated /
        DRI + Electric arc / Electric arc driven by St_primary_fraction and
        DRI_fraction per planning horizon, per-route energy intensities (MWh/t)
        incl. coke, coal, methane, electricity, low-T heat, H2 for DRI and
        process emissions, sited at GEM GSPT plants with process-specific
        capacity keys (EAF / DRI + EAF / Integrated).
      mechanism: >
        build_industrial_production_per_country reads JRC-IDEES sheet ISI
        physical output rows (Electric arc, Integrated steelworks);
        build_industrial_production_per_country_tomorrow reallocates total steel
        with St_primary_fraction and splits primary into DRI via DRI_fraction;
        build_industry_sector_ratios:iron_and_steel derives best-case MWh/t per
        route (DRI route = EAF ratios + H2_DRI hydrogen + elec_DRI electricity);
        build_industry_sector_ratios_intermediate interpolates today's
        country-specific ratios toward best-case via
        sector_ratios_fraction_future; build_industrial_energy_demand_per_country_today
        uses JRC energy-balance sheets FC_IND_IS_BF_E / FC_IND_IS_EA_E and adds
        75% of coke-oven consumption (add_coke_ovens, fed at a6c45e5 by the new rule
        build_transformation_output_coke: transformation output of coke ovens
        extracted from the Eurostat energy balances);
        build_industrial_distribution_key:prepare_gem_steel_database builds
        EAF/DRI+EAF/Integrated keys from GSPT nominal capacities;
        build_industrial_energy_demand_per_node multiplies nodal tonnage by
        ratios; prepare_sector_network:add_industry places the loads (coal+coke
        folded into "coal for industry" with mwh_coal_per_mwh_coke, H2 for
        industry, gas for industry, industry electricity, low-temperature heat,
        process emissions).
      not_covered: >
        By default steel routes are exogenous fractions, not an optimisation
        choice; process heat is part of the fixed per-route carrier ratios.
        With sector.endogenous_sectors.enable (subsectors listing steel; off by
        default, see steel-routes-endogenous and the method
        industry-routes-endogenous) build_industrial_energy_demand_per_node
        drops "Integrated steelworks" and "DRI + Electric arc" from the demand
        blocks and add_steel puts primary steel on the network as a per-node
        steel load in tonnes, met by competing BOF, H2-DRI and gas-DRI + EAF
        links; industry.DRI_fraction is then dormant for primary steel
        (St_primary_fraction still sizes the load) and secondary "Electric arc"
        steel stays an exogenous electricity demand. No total-steel-demand
        scaling factor exists (unlike aviation/HVC demand factors). No scrap
        availability constraint in either mode.
      provenance: "scripts/build_industrial_production_per_country.py:Integrated steelworks;scripts/build_industrial_production_per_country_tomorrow.py:dri_fraction;scripts/build_industry_sector_ratios.py:def iron_and_steel;scripts/build_industrial_energy_demand_per_country_today.py:FC_IND_IS_BF_E;scripts/build_industrial_energy_demand_per_country_today.py:add_coke_ovens;scripts/build_industrial_distribution_key.py:prepare_gem_steel_database;scripts/build_industrial_energy_demand_per_node.py;scripts/prepare_sector_network.py:mwh_coal_per_mwh_coke;scripts/build_industrial_energy_demand_per_node.py:route_endogenised_sectors;scripts/prepare_sector_network.py:add_steel"
    levers:
      - key: industry.St_primary_fraction
        effect: "Fraction of steel from primary (ore-based) production per planning horizon; remainder becomes secondary EAF (scrap)."
        default: "{2020: 0.6, ..., 2050: 0.3}"
        provenance: "config/config.default.yaml:St_primary_fraction;scripts/build_industrial_production_per_country_tomorrow.py:st_primary_fraction"
      - key: industry.DRI_fraction
        effect: "Fraction of the remaining primary steel produced via DRI + EAF instead of integrated steelworks, per horizon. Dormant for primary steel once sector.endogenous_sectors routes steel endogenously (the model picks the route; the split only feeds the summed primary load)."
        default: "{2020: 0, 2025: 0, 2030: 0.05, ..., 2050: 1}"
        provenance: "config/config.default.yaml:DRI_fraction;scripts/build_industrial_production_per_country_tomorrow.py:dri_fraction"
      - key: industry.H2_DRI
        effect: "Hydrogen demand of the DRI route in MWh_H2/t steel."
        default: "1.7"
        provenance: "config/config.default.yaml:H2_DRI;scripts/build_industry_sector_ratios.py:H2_DRI"
      - key: industry.elec_DRI
        effect: "Extra electricity demand of the DRI shaft in MWh/t steel."
        default: "0.322"
        provenance: "config/config.default.yaml:elec_DRI;scripts/build_industry_sector_ratios.py:elec_DRI"
      - key: industry.sector_ratios_fraction_future
        effect: "Interpolation weight between today's country-specific MWh/t and best-in-class future ratios, per horizon."
        default: "{2020: 0.0, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future;scripts/build_industry_sector_ratios_intermediate.py:fraction_future"
      - key: industry.reference_year
        effect: "Base year for production tonnage and today's energy intensities."
        default: "2023"
        provenance: "config/config.default.yaml:reference_year;scripts/build_industrial_production_per_country.py:reference_year"
      - key: sector.endogenous_sectors
        effect: "{enable, subsectors}: with enable true and steel listed, primary steel (Integrated + DRI) becomes a per-node steel load met by BOF / H2-DRI / gas-DRI + EAF links the model sizes; under myopic/perfect foresight the existing blast furnaces and gas DRI from build_industry_plants enter as dated brownfield links."
        default: "{enable: false, subsectors: [steel, cement]}"
        provenance: "config/config.default.yaml:endogenous_sectors;scripts/prepare_sector_network.py:add_steel;scripts/add_existing_baseyear.py:add_existing_industry"
      - key: sector.steel_bof
        effect: "With the routes on under myopic/perfect: pledge true retires each existing blast furnace at its pledged phase-out year (GEM 'Out') plus pledge_delay years; false keeps the 40-year catalogue lifetime."
        default: "{pledge: true, pledge_delay: 0}"
        provenance: "config/config.default.yaml:steel_bof;scripts/add_existing_baseyear.py:pledge_delay"
      - key: sector.hbi_relocation
        effect: "With the routes on: one EU-wide hbi bus instead of one per node, so iron can be reduced where hydrogen is cheap and moved free of cost to the EAFs at the steel sites."
        default: "false"
        provenance: "config/config.default.yaml:hbi_relocation;scripts/prepare_sector_network.py:hbi_relocation"
    boundary:
      - variant: "change primary vs recycled steel share"
        rung: L0
        note: "industry.St_primary_fraction per-year dict."
      - variant: "hydrogen-DRI rollout speed"
        rung: L1
        note: "reshape the industry.DRI_fraction per-year ramp (exogenous route mode only; dormant for primary steel with sector.endogenous_sectors on); H2_DRI / elec_DRI tune the intensity."
      - variant: "faster efficiency progress toward best-in-class intensities"
        rung: L0
        note: "industry.sector_ratios_fraction_future."
      - variant: "scale total steel production volume"
        rung: L3
        note: "no steel demand factor in config — override resources/industrial_production_per_country.csv (or edit build_industrial_production_per_country_tomorrow.py)."
      - variant: "change per-route energy intensity assumptions beyond H2_DRI/elec_DRI"
        rung: L2
        note: "iron_and_steel() in build_industry_sector_ratios.py encodes the JRC-sheet slicing and electrification assumptions."
      - variant: "different steel plant siting (e.g. announced plants only)"
        rung: L2
        note: "status/retirement filters per process hardcoded in prepare_gem_steel_database / build_nodal_distribution_key."
      - variant: "endogenous route choice (model optimises BF vs DRI)"
        rung: L0
        note: "with sector.endogenous_sectors.enable (see [[steel-routes-endogenous]] and the method [[industry-routes-endogenous]]): add_steel builds BOF, H2 DRI, gas DRI, DRI and EAF links on a per-node steel bus, at technology-data intensities that do not match JRC-IDEES."
      - variant: "existing steel plants sited from the Fraunhofer ISI site database (brownfield blast furnaces and gas DRI, pledged phase-out)"
        rung: L0
        note: "with sector.endogenous_sectors.enable under foresight myopic or perfect: build_industry_plants locates the units, add_existing_industry adds them as dated non-extendable links in the first horizon; sector.steel_bof sets the retirement."
    where:
      - change: "route split (primary/DRI/EAF fractions)"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:fraction_persistent_primary"
      - change: "per-route MWh/t intensities"
        anchor: "scripts/build_industry_sector_ratios.py:iron_and_steel"
        provenance: "scripts/build_industry_sector_ratios.py:def iron_and_steel"
      - change: "today's energy demand incl. coke ovens"
        anchor: "scripts/build_industrial_energy_demand_per_country_today.py:add_coke_ovens"
        provenance: "scripts/build_industrial_energy_demand_per_country_today.py:add_coke_ovens"
      - change: "GSPT-based nodal keys per steel process"
        anchor: "rule build_industrial_distribution_key -> prepare_gem_steel_database"
        provenance: "rules/build_sector.smk:gem_gspt;scripts/build_industrial_distribution_key.py:prepare_gem_steel_database"
      - change: "network loads (coal for industry, H2 for industry, ...)"
        anchor: "scripts/prepare_sector_network.py:add_industry"
        provenance: "scripts/prepare_sector_network.py:def add_industry"
      - change: "endogenous primary steel routes (steel/hbi/DRI reduction buses, route links, vent and capture)"
        anchor: "scripts/prepare_sector_network.py:add_steel (called from add_industry); existing plants in scripts/add_existing_baseyear.py:add_existing_industry"
        provenance: "scripts/prepare_sector_network.py:add_steel;scripts/add_existing_baseyear.py:add_existing_industry;rules/build_sector.smk:build_industry_plants"
    data_dependencies:
      - input: "JRC-IDEES-2023 Industry + EnergyBalance workbooks (per country)"
        required_for: "production tonnage and energy intensities"
        availability: "must be built (retrieved); EU27 native, non-EU27 scaled from Eurostat balances"
      - input: "GEM Global Steel Plant Tracker xlsx (rules.retrieve_gem_steel_plant_tracker)"
        required_for: "process-specific nodal distribution keys"
        availability: "must be built (retrieved); Europe filter applied"
      - input: "Fraunhofer ISI industry site database (data/1-s2.0-S0196890424010586-mmc2.xlsx, Neuwirth et al. 2024, CC-BY-4.0: blast furnaces and gas DRI with production, last relining year and pledged phase-out year)"
        required_for: "brownfield steel plants under myopic/perfect foresight with the routes switch"
        availability: "exists by default (checked into the repo); EU27 + GB + NO only"
      - input: "Eurostat energy balances + coke transformation output"
        required_for: "non-EU27 scaling and coke-oven energy in integrated route"
        availability: "must be built (retrieved)"
    demand_dimensions:
      driver: "kton/a crude steel per route (Integrated / DRI + Electric arc / Electric arc) times MWh/t sector ratios"
      spatial: "GEM GSPT nominal capacities per process (EAF / DRI + EAF / Integrated); population fallback where absent"
      temporal: "annual-constant loads (p_set = annual / nhours)"
      scenario: "per-planning-horizon dicts (St_primary_fraction, DRI_fraction (exogenous route mode), sector_ratios_fraction_future) resolved against the planning_horizons list (one compose_network run per horizon)"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "steel modelled per process with production tonnage as driver: oxygen (BF/BOF) steel vs electric (EAF) steel as separate processes"
    - "upstream processes coke ovens and sinter plants carried explicitly with own energy carriers and emissions"
    - "technology diffusion of saving options (e.g. scrap preheating, top-gas recovery) per process rather than a single interpolation fraction"
  sources:
    - "https://www.forecast-model.eu/forecast-en/content/methodology.php"
    - "https://www.sciencedirect.com/science/article/pii/S2211467X18300890"
    - "https://github.com/fraunhofer-isi/forecast-sites"
