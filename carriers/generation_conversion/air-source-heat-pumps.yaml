id: air-source-heat-pumps
title: Air-source heat pumps
summary: >
  Electric heat pumps that extract heat from ambient air to supply building and
  district heat, with temperature-dependent efficiency (COP).
when_to_use:
  - "add air-source heat pumps"
  - "ASHP"
  - "electrify heating with heat pumps"
  - "heat pump rollout / adoption scenario"
  - "temperature-dependent heat pump COP"
  - "replace gas boilers with heat pumps"
  - "air-to-water heat pump"
  - "heat pump sink / flow temperature"
  - "large heat pumps for district heating"
  - "power-to-heat"
  - "pypsa-eur carrier names: urban central air heat pump, urban decentral air heat pump, rural air heat pump (unclustered: residential rural air heat pump, services urban decentral air heat pump, ...)"
  - "how efficient are heat pumps in this climate"
  - "heat pump sink temperature / flow temperature"
  - "known in pypsa-eur as: heat pumps, heat pump, air heat pump, residential rural air heat pump, residential urban decentral air heat pump, services rural air heat pump, services urban decentral air heat pump, urban central air heat pump, Ambient, power-to-heat"
models:
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        Fully covered and on by default in sector runs. sector.heat_pump_sources
        lists "air" for ALL three heat system types (urban central, urban
        decentral, rural), so add_heat adds an extendable air heat pump Link at
        every node of all five heat systems (residential/services x
        rural/urban-decentral, plus urban central where the district heating
        fraction is nonzero). The link is written REVERSED: bus0 = the heat bus,
        bus1 = the electricity node, efficiency = 1/COP, p_max_pu = 0 and
        p_min_pu = -1, i.e. power flows heat<-elec through negative dispatch and
        p_nom is denominated in MW_thermal (capital cost from the technology-data
        rows "decentral air-sourced heat pump" / "central air-sourced heat pump"
        via HeatSystem.heat_pump_costs_name, scaled by
        sector.overdimension_heat_generators — 1.1 decentral, 1.0 central).
        COP chain: rule build_temperature_profiles makes population-weighted
        ERA5 air temperature per cluster region (atlite cutout.temperature);
        rule build_cop_profiles turns it into hourly COPs — decentral systems
        use the Staffell et al. (2012) quadratic
        (COP = 6.81 - 0.121*dT + 0.000630*dT^2) against the fixed sink
        temperature sector.heat_pump_sink_T_individual_heating (55 C); urban
        central uses the thermodynamic CentralHeatingCopApproximator (Jensen et
        al. 2018: ammonia refrigerant, 5 K pinch, isentropic efficiency 0.8,
        min_delta_t_lift 10 K, source cooled by
        sector.district_heating.heat_source_cooling = 6 K) against the
        time-varying forward/return temperature profiles from rule
        build_central_heating_temperature_profiles. With
        sector.electricity_distribution_grid true (default),
        insert_electricity_distribution_grid re-points bus1 of EVERY
        non-industrial heat pump — including the urban central ones — to the
        "low voltage" bus, so all heat pumps pay distribution grid charges.
        With sector.cluster_heat_buses true (default, skipped in the first
        myopic year) residential and services duplicates are merged, leaving
        carriers "rural air heat pump", "urban decentral air heat pump",
        "urban central air heat pump". Myopic/perfect foresight: the existing
        ASHP fleet (EC heating-market study, 2012 data; all air heat pumps
        assumed urban in build_existing_heating_distribution) enters as
        vintaged links via add_heating_capacities_installed_before_baseyear
        (existing_capacities.grouping_years_heat, default_heating_lifetime 20).
      mechanism: >
        rule build_temperature_profiles -> temp_air_total nc; rule
        build_central_heating_temperature_profiles -> forward/return profiles;
        rule build_cop_profiles (scripts/build_cop_profiles/run.py::get_cop,
        DecentralHeatingCopApproximator / CentralHeatingCopApproximator) ->
        cop_profiles nc; rule compose_network runs add_heat, which loops
        heat systems x params.heat_pump_sources and adds the heat pump links
        (hourly COP if sector.time_dep_hp_cop, else the static costs-table
        efficiency); insert_electricity_distribution_grid re-points the
        electricity side. Myopic/perfect: add_existing_baseyear (called from compose_network)
        (add_heating_capacities_installed_before_baseyear) reuses the same COP
        file for the existing stock.
      not_covered: >
        No space cooling service from the same units. No hybrid heat-pump/gas
        boiler package, no minimum-outdoor-temperature cut-off, defrost cycles
        or part-load behaviour beyond the COP curve. No air-to-air vs
        air-to-water distinction (one sink temperature, 55 C, for all decentral
        demand including hot water — see heat-pump-water-heaters carrier card). No
        adoption/rollout constraint: heat pumps compete purely on cost and can
        take the whole heat market in one investment period (no per-country
        capacity floor/cap mechanism for heat links — solving.constraints.CCL
        only touches Generators in the electricity workflow). No potential cap:
        p_nom_max is unset (air is not in
        sector.district_heating.limited_heat_sources). Existing-stock data is
        the 2012 European mapping study — dated, buildings-only.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/build_cop_profiles/run.py:get_cop; scripts/build_cop_profiles/decentral_heating_cop_approximator.py:_approximate_cop_air_source; scripts/definitions/heat_system.py:heat_pump_costs_name; scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
    levers:
      - key: sector.heat_pump_sources
        effect: "Per system type (urban central / urban decentral / rural), the list of heat pump sources added; remove 'air' from a list to drop ASHP there, or add sources (ground, geothermal, river_water, sea_water, ptes)."
        default: "{urban central: [air], urban decentral: [air], rural: [air, ground]}"
        provenance: "config/config.default.yaml:heat_pump_sources; scripts/prepare_sector_network.py:add_heat"
      - key: sector.heat_pump_sink_T_individual_heating
        effect: "Sink (flow) temperature in Celsius for the decentral Staffell COP regression; lower values raise COP everywhere (urban central uses the district heating temperature profiles instead)."
        default: "55.0"
        provenance: "config/config.default.yaml:heat_pump_sink_T_individual_heating; rules/build_sector.smk:build_cop_profiles"
      - key: sector.time_dep_hp_cop
        effect: "true gives hourly COP series as link efficiency; false uses the static 'efficiency' from the costs table."
        default: "true"
        provenance: "config/config.default.yaml:time_dep_hp_cop; scripts/prepare_sector_network.py:add_heat"
      - key: sector.district_heating.heat_pump_cop_approximation
        effect: "Parameters of the central (large) heat pump COP model: refrigerant, heat_exchanger_pinch_point_temperature_difference, isentropic_compressor_efficiency, heat_loss, min_delta_t_lift."
        default: "{refrigerant: ammonia, heat_exchanger_pinch_point_temperature_difference: 5, isentropic_compressor_efficiency: 0.8, heat_loss: 0.0, min_delta_t_lift: 10}"
        provenance: "config/config.default.yaml:heat_pump_cop_approximation; scripts/build_cop_profiles/run.py:heat_pump_cop_approximation_central_heating"
      - key: sector.district_heating.heat_source_cooling
        effect: "Kelvin by which the central heat pump cools its source stream; enters the Jensen COP calculation."
        default: "6"
        provenance: "config/config.default.yaml:heat_source_cooling; scripts/build_cop_profiles/run.py:heat_source_cooling_central_heating"
      - key: sector.overdimension_heat_generators
        effect: "Multiplier on heat generator capital costs to cover peak-load oversizing (applied to heat pump capital_cost)."
        default: "{decentral: 1.1, central: 1.0}"
        provenance: "config/config.default.yaml:overdimension_heat_generators; scripts/prepare_sector_network.py:add_heat"
      - key: sector.electricity_distribution_grid
        effect: "true re-points the electricity side of all non-industrial heat pumps (urban central included) to the low voltage bus, adding distribution grid cost to their power draw."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: sector.heating
        effect: "Master switch — false removes the heat buses and with them all heat pumps."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.heat_demand_cutout
        effect: "Which atlite cutout supplies the air temperature for COP and demand profiles."
        default: "default"
        provenance: "config/config.default.yaml:heat_demand_cutout; rules/build_sector.smk:build_temperature_profiles"
      - key: existing_capacities.grouping_years_heat
        effect: "Myopic: vintage intervals for the existing heat pump stock (with existing_capacities.default_heating_lifetime for phase-out)."
        default: "[1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019]"
        provenance: "config/config.default.yaml:grouping_years_heat; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
      - key: costs.overwrites
        effect: "Override heat pump investment/lifetime/efficiency (static) per cost row, e.g. 'decentral air-sourced heat pump'."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "heat pumps compete for all building and district heat"
        rung: L0
        note: "default — 'air' in every heat_pump_sources list, extendable at all heat nodes"
      - variant: "no air-source heat pumps (or none in one system type)"
        rung: L1
        note: "remove 'air' from the relevant sector.heat_pump_sources list(s)"
      - variant: "lower/higher flow temperature (radiators vs underfloor)"
        rung: L1
        note: "sector.heat_pump_sink_T_individual_heating (decentral); urban central via sector.district_heating.supply_temperature_approximation (district-heating carrier card)"
      - variant: "static instead of weather-dependent COP"
        rung: L0
        note: "sector.time_dep_hp_cop: false"
      - variant: "different empirical COP curve for household heat pumps"
        rung: L2
        note: "Staffell coefficients are hardcoded in _approximate_cop_air_source (scripts/build_cop_profiles/decentral_heating_cop_approximator.py)"
      - variant: "cap or force heat pump adoption per country/horizon"
        rung: L5
        note: "no config hook for heat-link capacity limits; either set p_nom_max/p_nom_min on the n.add call in add_heat (L2, static) or write a custom constraint in solve_network.py extra_functionality"
      - variant: "existing heat pump stock with vintages"
        rung: L0
        note: "automatic in myopic/perfect foresight (add_existing_baseyear inside compose_network); overnight runs are greenfield"
      - variant: "hybrid heat pump + boiler unit"
        rung: L5
        note: "not modelled; heat pumps and gas boilers exist as independent links on the same heat bus — a coupled unit needs a new component plus a linking constraint"
      - variant: "reversible heat pump providing space cooling"
        rung: L5
        note: "no cooling demand carrier exists in the heat systems (see demand book space-cooling-demand)"
    where:
      - change: "heat pump link creation (all systems, all sources)"
        anchor: "scripts/prepare_sector_network.py::add_heat (loop 'Add heat pumps' over params.heat_pump_sources)"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:heat_pump_sources"
      - change: "COP computation (decentral regression / central thermodynamic model)"
        anchor: "scripts/build_cop_profiles/run.py::get_cop; decentral_heating_cop_approximator.py; central_heating_cop_approximator.py (rule build_cop_profiles)"
        provenance: "scripts/build_cop_profiles/run.py:get_cop; scripts/build_cop_profiles/central_heating_cop_approximator.py:CentralHeatingCopApproximator"
      - change: "air temperature input"
        anchor: "scripts/build_temperature_profiles.py (rule build_temperature_profiles, cutout.temperature)"
        provenance: "scripts/build_temperature_profiles.py:temperature; rules/build_sector.smk:build_temperature_profiles"
      - change: "low-voltage re-pointing of heat pump electricity draw"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (hps filter)"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "existing ASHP stock distribution and vintaging (myopic)"
        anchor: "scripts/build_existing_heating_distribution.py::build_existing_heating; scripts/add_existing_baseyear.py::add_heating_capacities_installed_before_baseyear"
        provenance: "scripts/build_existing_heating_distribution.py:build_existing_heating; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
    data_dependencies:
      - input: "atlite cutout (ERA5) named by sector.heat_demand_cutout + population layouts"
        required_for: "air temperature -> COP profiles and heat demand shape"
        availability: "exists by default (retrieved/built cutout chain)"
      - input: "cost rows 'decentral air-sourced heat pump', 'central air-sourced heat pump'"
        required_for: "capital cost, lifetime, static efficiency"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "central heating forward/return temperature profiles"
        required_for: "urban central heat pump COP"
        availability: "must be built (rule build_central_heating_temperature_profiles); automatic in sector workflow"
      - input: "data/existing_infrastructure/existing_heating_raw.csv (column 'air heat pump')"
        required_for: "existing stock in myopic runs"
        availability: "exists by default in the repo (EU mapping study, 2012 data)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Air-sourced heat pumps are added by default (when sector.enable.heat is true) as
        extendable Link components from the electricity bus to the heat bus of every URBAN
        heat system node ("residential urban decentral", "services urban decentral",
        "urban central"): in add_heat, heat_pump_type = "air" if "urban" in name.
        Efficiency is an hourly COP time series when sector.time_dep_hp_cop is true,
        computed in build_cop_profiles from the Staffell et al. (2012) quadratic
        coefficient_of_performance(delta_T, source="air") with
        delta_T = heat_pump_sink_T - population-weighted ERA5 air temperature
        (build_temperature_profiles, atlite cutout.temperature). Costs come from the
        technology-data cost rows "decentral air-sourced heat pump" /
        "central air-sourced heat pump". If sector.electricity_distribution_grid is true,
        heat pump Links are re-wired to draw from the "low voltage" bus.
      mechanism: >
        Pipeline: rule build_temperature_profiles (ERA5 cutout + population layout ->
        temp_air_*.nc) -> rule build_cop_profiles (params heat_pump_sink_T -> cop_air_*.nc)
        -> rule prepare_heat_data (reindexes COP to snapshots -> ashp_cop csv) -> rule
        prepare_sector_network / add_heat (n.madd Link, carrier
        "{name} {heat_pump_type} heat pump", p_nom_extendable=True, capital_cost scaled by
        efficiency). Snakefile HEAT input dict gates these inputs on sector.enable.heat.
      not_covered: >
        No air-source heat pumps at RURAL nodes (rural systems get ground-source only —
        hard-coded split in add_heat). No space cooling service. No hybrid heat-pump/boiler
        units, no part-load or defrost-cycle behaviour beyond the COP curve, no minimum
        outdoor-temperature cut-off. Existing heat pump stock is only brought in via the
        myopic/existing-capacities pathway (build_existing_heating_distribution) whose raw
        data is a European study.
      provenance: "scripts/prepare_sector_network.py:add_heat"

    levers:
      - key: sector.heat_pump_sink_T
        effect: Sink (flow) temperature in Celsius used for delta_T in the COP calculation; lower values raise COP everywhere.
        default: "55"
        provenance: "config.default.yaml:heat_pump_sink_T; scripts/build_cop_profiles.py:heat_pump_sink_T"
      - key: sector.time_dep_hp_cop
        effect: If true, Link efficiency is the hourly COP series; if false, the static efficiency from the costs table is used.
        default: "true"
        provenance: "config.default.yaml:time_dep_hp_cop; scripts/prepare_sector_network.py:time_dep_hp_cop"
      - key: sector.enable.heat
        effect: Master switch for the heat sector; disables add_heat (and thus all heat pumps) and the HEAT input branch.
        default: "true"
        provenance: "config.default.yaml:enable; Snakefile:HEAT"
      - key: sector.electricity_distribution_grid
        effect: If true, heat pump Links have bus0 moved to the "low voltage" bus so distribution-grid capacity/cost applies to their electricity draw.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"

    boundary:
      - variant: "Have air-source heat pumps compete for heat supply"
        rung: L0
        note: "Default behaviour when the heat sector is enabled; Links are p_nom_extendable."
      - variant: "Change flow/sink temperature (e.g. low-temperature radiators at 35C)"
        rung: L1
        note: "Set sector.heat_pump_sink_T; consumed by rule build_cop_profiles."
      - variant: "Use a constant (non-weather) COP"
        rung: L1
        note: "Set sector.time_dep_hp_cop: false; falls back to costs-table efficiency."
      - variant: "Offer air-source heat pumps at rural nodes too"
        rung: L2
        note: "The air/ground split is the hard-coded line heat_pump_type = 'air' if 'urban' in name in add_heat; edit it or add a second Link set."
      - variant: "Different COP regression (e.g. manufacturer curve)"
        rung: L2
        note: "Replace the quadratic in coefficient_of_performance (build_cop_profiles.py)."
      - variant: "Represent today's installed heat pump stock (brownfield)"
        rung: L3
        note: "Needs country rows in data/existing_infrastructure/existing_heating_raw.csv consumed by build_existing_heating_distribution; shipped data is from a European mapping study, so non-European regions need new data."
      - variant: "Hybrid heat pump + backup boiler as one unit, cold-climate cut-off, or cooling service"
        rung: L5
        note: "No component logic exists; requires bespoke Python in prepare_sector_network."

    where:
      - change: "Allow ASHP at rural nodes / change air-vs-ground assignment"
        anchor: "scripts/prepare_sector_network.py:add_heat (heat_pump_type assignment)"
        provenance: "scripts/prepare_sector_network.py:heat_pump_type"
      - change: "COP functional form"
        anchor: "scripts/build_cop_profiles.py:coefficient_of_performance"
        provenance: "scripts/build_cop_profiles.py:coefficient_of_performance"
      - change: "Air temperature inputs feeding the COP"
        anchor: "rule build_temperature_profiles (atlite cutout.temperature, population-weighted)"
        provenance: "scripts/build_temperature_profiles.py:temperature"
      - change: "Existing heat pump capacities"
        anchor: "rule build_existing_heating_distribution + data/existing_infrastructure/existing_heating_raw.csv"
        provenance: "Snakefile:build_existing_heating_distribution"

    data_dependencies:
      - input: "ERA5 cutout (temperature field) covering the model region"
        required_for: "COP time series and heat demand profiles"
        availability: "must be built or retrieved (enable.retrieve_cutout / build_cutout)"
      - input: "Population layouts (WorldPop population in gadm_shapes + UNCTAD urban percent)"
        required_for: "Population-weighting of temperatures and urban/rural node split"
        availability: "must be built (build_population_layouts; build_shapes worldpop_method)"
      - input: "UNSD energy balances (heat demand totals per country)"
        required_for: "Sizing the heat load the pumps serve"
        availability: "must be built (build_base_energy_totals, demand_data.update_data)"
      - input: "data/existing_infrastructure/existing_heating_raw.csv"
        required_for: "Brownfield/existing heat pump stock"
        availability: "region-dependent (European source study)"
