id: ammonia-ships
title: Ammonia-fuelled ships
summary: >
  Ammonia as a zero-carbon marine fuel — NH3-burning vessels, bunkering
  demand at ports, and the green-ammonia supply chain behind them.
when_to_use:
  - "ammonia ships / NH3 shipping fuel"
  - "ammonia bunkering"
  - "green ammonia for maritime transport"
  - "zero-carbon shipping fuel alternatives"
  - "pypsa-eur carrier names: NH3, Haber-Bosch, ammonia cracker, ammonia store (no ammonia shipping carrier exists)"
  - "decarbonise shipping with ammonia"
  - "alternative marine fuels"
models:
  - model: pypsa-eur
    version_anchor: {ref: "09e8910ae03ace9af8ff821514cda7822fdd473f", date: "2026-10-12"}
    out_of_box:
      covers: >
        Demand side NOT covered: at this ref the shipping fuel split in
        add_shipping knows four shares — shipping_hydrogen_share,
        shipping_methanol_share, shipping_oil_share, shipping_lng_share; there
        is no shipping_ammonia_share key and no ammonia shipping Load/carrier,
        and the endogenous fuel menu of sector.shipping_endogenous (oil,
        methanol, LNG, hydrogen) has no ammonia link either. The
        SUPPLY side, however, exists in full: with sector.ammonia (default
        true) add_ammonia builds an "NH3" carrier with Haber-Bosch synthesis
        Links (electricity + H2 in, per-node), ammonia crackers (NH3 back to
        H2) and an extendable cyclic "ammonia store" priced from the "NH3 (l)
        storage tank incl. liquefaction" cost row. By default all NH3 sits on
        a single "EU NH3" bus; sector.ammonia: "regional" resolves it to nodal
        NH3 buses (define_spatial). Out of the box the only NH3 consumer is
        industrial ammonia demand in add_industry — a full green-ammonia chain
        with storage, waiting for a shipping (or export) off-taker.
      mechanism: >
        n/a for the shipping demand. Supply: rule compose_network ->
        add_ammonia (gated by sector.ammonia); industrial offtake in
        add_industry; nodal-vs-EU spatial choice in define_spatial
        (options["ammonia"] == "regional").
      not_covered: >
        Ammonia shipping demand share, NH3-engine efficiency/cost data, port
        bunkering infrastructure, NH3 import terminals for fuel use, and any
        endogenous fuel competition involving ammonia (the endogenous shipping
        menu covers oil, methanol, LNG and hydrogen only). Also no NH3 pipeline/transport between
        nodes even in regional mode (only the EU-vs-nodal bus choice).
      provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:add_ammonia; scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:NH3 (l) storage tank incl. liquefaction; config/config.default.yaml:shipping_oil_share"
    levers:
      - key: sector.ammonia
        effect: "Enables the NH3 supply chain (Haber-Bosch, cracker, store); 'regional' instead of true gives nodal NH3 buses — the right basis for port-resolved bunkering."
        default: "true"
        provenance: "config/config.default.yaml:ammonia; scripts/prepare_sector_network.py:add_ammonia"
      - key: sector.shipping_oil_share
        effect: "Room-making: an added ammonia share must be deducted here (or from the methanol share); shares summing != 1 only warn and scale demand."
        default: "{2020: 1, 2025: 1, 2030: 0.85, 2035: 0.65, 2040: 0.45, 2045: 0.2, 2050: 0}"
        provenance: "config/config.default.yaml:shipping_oil_share; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping
        effect: "Gate for all shipping demand."
        default: "true"
        provenance: "config/config.default.yaml:shipping; scripts/prepare_sector_network.py:add_shipping"
    boundary:
      - variant: "crude proxy: count ammonia ships under the hydrogen share"
        rung: L1
        note: "sector.shipping_hydrogen_share routes the energy through nodal H2 buses (fuel-cell efficiency conversion) — same upstream electrolysis burden as NH3, but skips Haber-Bosch energy/cost and the NH3 store"
      - variant: "ammonia as an exogenous shipping fuel share"
        rung: L2
        note: "localised edit in add_shipping: add a shipping_ammonia_share read via get(), convert p_set with an NH3-engine efficiency assumption (mirror the methanol block's oil-efficiency ratio), and n.add a Load on spatial.ammonia.nodes — supply, storage and industrial competition then work automatically; new config key threaded through options"
      - variant: "port-resolved NH3 bunkering"
        rung: L1
        note: "on top of the L2 edit: sector.ammonia: 'regional' gives nodal NH3 buses; weight the load with the shipping_demand port fractions like the H2 share does"
      - variant: "grounded NH3 marine engine efficiency/cost"
        rung: L3
        note: "no NH3-propulsion row exists in the referenced cost data (only 'fuel cell' efficiency is used for the H2 share today); needs a technology-data row or explicit assumption"
      - variant: "NH3 bunkering terminals / loading infrastructure as investable assets"
        rung: L4
        note: "beyond the nodal ammonia store: new components + port data + rule/config plumbing"
      - variant: "endogenous fuel competition (NH3 vs H2 vs methanol vs oil)"
        rung: L2
        note: "sector.shipping_endogenous (method [[shipping-fuel-endogenous]]) already makes oil, methanol, LNG and H2 compete on one oil-equivalent '<node> shipping' bus; ammonia joins with one more link in _add_shipping_endogenous from spatial.ammonia.nodes onto that bus (mirror the methanol link), plus an NH3-engine efficiency assumption (L3)"
    where:
      - change: "where the ammonia shipping share/load would be added"
        anchor: "scripts/prepare_sector_network.py::add_shipping (mirror the shipping_methanol_share block, bus0 -> spatial.ammonia.nodes); for the endogenous menu ::_add_shipping_endogenous"
        provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:shipping_methanol_share; scripts/prepare_sector_network.py:_add_shipping_endogenous"
      - change: "NH3 supply chain (synthesis, cracking, storage)"
        anchor: "scripts/prepare_sector_network.py::add_ammonia (sector.ammonia)"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "EU-vs-nodal NH3 resolution"
        anchor: "scripts/prepare_sector_network.py::define_spatial (options['ammonia'] == 'regional' branch)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "port weighting for the demand placement"
        anchor: "rule build_shipping_demand -> shipping_demand.csv"
        provenance: "rules/build_sector.smk:build_shipping_demand; scripts/build_shipping_demand.py:european_ports"
    data_dependencies:
      - input: "cost rows 'Haber-Bosch', 'Ammonia cracker', 'NH3 (l) storage tank incl. liquefaction'"
        required_for: "the existing NH3 supply chain"
        availability: "exists by default via retrieve_cost_data (referenced in add_ammonia)"
      - input: "NH3 marine engine efficiency/cost row"
        required_for: "a grounded ammonia shipping demand conversion"
        availability: "absent — assumption or new costs row needed"
      - input: "attributed ports outflow data"
        required_for: "port-resolved bunkering placement"
        availability: "retrieved by the workflow (rule retrieve_attributed_ports)"
      - input: "nodal H2 buses + electrolysis (upstream of Haber-Bosch)"
        required_for: "green ammonia production"
        availability: "exists by default in sector runs"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT a shipping fuel option. Shipping (add_shipping) offers only
        sector.shipping_hydrogen_share (H2 load at port nodes) with the remainder as
        oil. HOWEVER, a full ammonia value chain DOES exist when
        sector.ammonia.enable is true: add_ammonia creates per-node "NH3" carrier
        buses, Haber-Bosch Links (H2 + electricity -> NH3), ammonia crackers (NH3 ->
        H2), liquid ammonia Stores, and an industrial NH3 Load — it is just not wired
        to shipping demand.
      mechanism: >
        add_shipping maps country navigation demand (UNSD totals) to nodes by port
        fraction and splits it H2/oil only. add_ammonia (guarded by
        options["ammonia"]["enable"]) builds the NH3 supply side for industry. The
        missing piece is purely a demand hookup: an NH3-for-shipping share and a Load
        on spatial.ammonia.nodes at port-weighted nodes.
      not_covered: >
        Any shipping->NH3 link: no shipping_ammonia_share key, no NH3 bunkering
        load, no ammonia-engine efficiency assumption, no NH3 bunker-fuel emissions
        accounting (NH3 carrier is defined with co2_emissions=0, so combustion N2O/NOx
        effects are out of scope anyway).
      provenance: "scripts/prepare_sector_network.py:add_shipping"

    levers:
      - key: sector.ammonia.enable
        effect: "Turns on the NH3 value chain (Haber-Bosch, cracker, NH3 store, industrial demand) that a shipping load would draw from."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - key: sector.shipping_hydrogen_share
        effect: "Existing low-carbon shipping lever (H2 only); the pattern to copy for an ammonia share. Cannot deliver NH3 itself."
        default: "AB_2030: 0.05 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:shipping_hydrogen_share"
      - key: sector.enable.shipping
        effect: "Master switch for shipping demand."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"

    boundary:
      - variant: "Ammonia as an exogenous shipping fuel share"
        rung: L2
        note: >
          Localised edit in add_shipping: add a shipping_ammonia_share (read via
          options, keyed {demand}_{planning_horizon} like the H2 share via get()),
          convert demand with an NH3-propulsion efficiency assumption, and madd a
          Load on spatial.ammonia.nodes with the port weighting. Supply side already
          exists via add_ammonia. The new key must also be added to your config.
      - variant: "Ammonia-engine efficiency / cost grounded in data"
        rung: L3
        note: "Needs a costs.csv row or explicit assumption for NH3 marine propulsion (only 'fuel cell' efficiency is used for the H2 share today); technology-data may not carry it."
      - variant: "Port-level NH3 bunkering infrastructure (storage/loading as investable assets)"
        rung: L4
        note: "New components + data at ports beyond the nodal NH3 store; rule/config plumbing."
      - variant: "Endogenous fuel competition (NH3 vs H2 vs oil shipping)"
        rung: L5
        note: "Shares are exogenous; competition needs bespoke decision logic."

    where:
      - change: "Add the shipping-ammonia share and NH3 bunkering load"
        anchor: "scripts/prepare_sector_network.py function add_shipping (copy the shipping_hydrogen_share + 'H2 for shipping' Load pattern)"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
      - change: "NH3 buses/production/storage the load would draw from"
        anchor: "scripts/prepare_sector_network.py function add_ammonia"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "Port weighting used to localise the load"
        anchor: "rule prepare_ports -> scripts/prepare_ports.py"
        provenance: "scripts/prepare_ports.py:download_ports"

    data_dependencies:
      - input: "UNSD navigation energy totals (domestic + international)"
        required_for: "the demand an NH3 share would be carved from"
        availability: "must be built (build_base_energy_totals)"
      - input: "World Port Index ports.csv"
        required_for: "locating NH3 bunkering demand at nodes"
        availability: "must be built (prepare_ports runtime download)"
      - input: "costs rows: 'Haber-Bosch', 'Ammonia cracker', 'NH3 (l) storage tank incl. liquefaction'"
        required_for: "NH3 supply chain economics (already consumed by add_ammonia)"
        availability: "exists by default (retrieve_cost_data)"
      - input: "NH3 marine engine efficiency/cost assumption"
        required_for: "converting shipping energy demand into NH3 demand"
        availability: "absent (must be supplied)"
