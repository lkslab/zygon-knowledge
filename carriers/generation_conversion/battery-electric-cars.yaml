id: battery-electric-cars
title: Battery electric cars (passenger EVs)
summary: >
  Battery electric passenger vehicles as a share of land transport demand —
  their electricity demand, aggregate fleet battery, and grid connection via
  chargers.
when_to_use:
  - "add electric cars / EVs"
  - "electrify road transport / passenger cars"
  - "EV uptake scenario / fleet electrification pathway"
  - "battery electric vehicle share by year"
  - "EV charging demand on the grid"
  - "temperature-dependent EV consumption"
  - "100% EV fleet by 2050"
  - "pypsa-eur carrier names: land transport EV, EV battery, BEV charger"
  - "add electric cars"
  - "battery electric vehicles / BEVs / EVs"
  - "electrify road transport"
  - "increase EV share / EV uptake scenario"
  - "how much electricity do electric cars need"
  - "model EV charging demand"
  - "transport electrification"
  - "known in pypsa-eur as: land transport EV, EV battery"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d31ad9fa60c8fd9fe79e4647cde0a4a70eeb797c", date: "2026-10-09"}
    out_of_box:
      covers: >
        Fully covered as an exogenous-share demand technology, and ON by
        default with a ramp: sector.land_transport_electric_share is a
        per-planning-horizon dict rising from 0 (2020) via 0.05 (2025) and 0.2
        (2030) to 1.0 (2050); intermediate investment years are linearly
        interpolated by the get() helper. rule build_transport_demand converts
        national energy totals (total road + total rail - electricity rail,
        from JRC-IDEES/Eurostat via rule build_energy_totals) into a per-node
        driven-km series [100 km]: shaped by a weekly traffic profile measured
        by the German Federal Highway Research Institute (BASt, kfz.csv = all
        motor vehicles, rule build_mobility_profiles), applied Europe-wide in
        each node's local time, with the ICE heating/cooling correction divided
        out. In rule compose_network, add_land_transport calls add_EVs
        whenever the electric share > 0, which adds per node: an "EV battery"
        bus, a "land transport EV" Load whose p_set divides the km demand by a
        temperature-corrected efficiency (transport_electric_efficiency 53.19
        [100 km/MWh] degraded at cold/hot ambient temperature via
        EV_lower/upper_degree_factor and the deadband, get_temp_efficency, plus
        a 3-hour rolling smoothing), and a "BEV charger" Link from the
        electricity bus with fixed p_nom = number of cars x bev_charge_rate
        (0.011 MW = 11 kW per car) x electric share and p_max_pu from a
        plugged-in availability profile (passenger-car-only BASt counts,
        pkw.csv). The car count comes from JRC-IDEES "passenger cars" (Swiss
        BFS vehicle stock for CH), scaled to nodes by population. With
        sector.electricity_distribution_grid (default true),
        insert_electricity_distribution_grid re-points BEV chargers to the low
        voltage bus, so charging pays for distribution grid capacity. Smart
        charging (bev_dsm) and V2G ride on top — see the smart-ev-chargers and
        vehicle-to-grid carrier cards.
      mechanism: >
        rule build_energy_totals (scripts/build_energy_totals.py:
        build_transport_data) -> transport_data.csv (number cars, average fuel
        efficiency); rule build_mobility_profiles -> kfz.csv/pkw.csv weekly
        profiles; rule build_transport_demand (scripts/build_transport_demand.py)
        -> transport_demand/transport_data/avail_profile/dsm_profile CSVs; rule
        prepare_sector_network runs add_land_transport -> add_EVs (gated by
        sector.transport and electric share > 0). Shares are read per
        investment year with get() (linear interpolation between dict keys);
        check_land_transport_shares only WARNS if the three engine shares do
        not sum to 1 — deliberately over/under-shooting scales demand.
      not_covered: >
        EV uptake is exogenous — the optimiser never chooses between EV, fuel
        cell and ICE (no vehicle capital costs enter the objective; the EV
        Load, charger and battery are all free). One homogeneous passenger-car
        fleet: trucks, buses, two-wheelers AND non-electric rail energy are all
        folded into the same km demand (build_transport_demand sums total road
        + total rail - electricity rail) and electrify with the same share and
        car-like parameters. Charger capacity is fixed, not extendable, and
        carries no cost. The weekly demand/availability shapes are German
        measurements applied to every country. No distinction between home,
        work or public charging. Number of cars is frozen at
        energy.energy_totals_year statistics — no fleet growth.
      provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/prepare_sector_network.py:add_land_transport; scripts/prepare_sector_network.py:get_temp_efficency; scripts/build_transport_demand.py:build_transport_demand; scripts/build_energy_totals.py:build_transport_data; scripts/build_mobility_profiles.py:BASt; scripts/_helpers.py:Interpolate linearly"
    levers:
      - key: sector.transport
        effect: "Master gate for land transport — false removes EV, fuel cell and ICE demand entirely (and 'rail non-elec'/'road non-elec' from CO2 accounting)."
        default: "true"
        provenance: "config/config.default.yaml:transport; scripts/prepare_sector_network.py:add_land_transport"
      - key: sector.land_transport_electric_share
        effect: "Per-horizon dict of the EV share of land transport km; drives the EV load and all charger/battery sizing. Values between dict keys are linearly interpolated."
        default: "{2020: 0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1}"
        provenance: "config/config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:add_land_transport"
      - key: sector.land_transport_ice_share
        effect: "Complementary ICE share (oil demand); shares that do not sum to 1 with electric+fuel_cell only trigger a warning and act as a demand scaling."
        default: "{2020: 1, 2025: 0.95, 2030: 0.8, 2035: 0.55, 2040: 0.3, 2045: 0.15, 2050: 0}"
        provenance: "config/config.default.yaml:land_transport_ice_share; scripts/prepare_sector_network.py:check_land_transport_shares"
      - key: sector.transport_electric_efficiency
        effect: "EV drivetrain efficiency in [100 km/MWh] — the km demand is divided by it (after temperature correction) to get the electric load; raising it lowers EV electricity demand."
        default: "53.19"
        provenance: "config/config.default.yaml:transport_electric_efficiency; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_charge_rate
        effect: "Charger power per car in MW (0.011 = 11 kW); scales the fixed BEV charger p_nom (and via it the V2G p_nom)."
        default: "0.011"
        provenance: "config/config.default.yaml:bev_charge_rate; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_charge_efficiency
        effect: "Charging (and V2G discharging) efficiency of the BEV charger Link."
        default: "0.9"
        provenance: "config/config.default.yaml:bev_charge_efficiency; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.EV_lower_degree_factor
        effect: "% extra EV consumption per degree C below the heating deadband (with EV_upper_degree_factor above it; deadband 15-20 C via transport_heating_deadband_lower/upper) — the temperature dependence of EV demand."
        default: "0.98 (upper: 0.63)"
        provenance: "config/config.default.yaml:EV_lower_degree_factor; scripts/prepare_sector_network.py:get_temp_efficency"
      - key: sector.electricity_distribution_grid
        effect: "true re-points BEV chargers (and V2G) to the low voltage bus so EV charging competes for distribution grid capacity."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: energy.energy_totals_year
        effect: "Statistical year for energy totals and the car stock (number cars, fuel efficiency) — the base year the km demand and fleet size are frozen at."
        default: "2023"
        provenance: "config/config.default.yaml:energy_totals_year; scripts/build_transport_demand.py:build_nodal_transport_data"
    boundary:
      - variant: "EV ramp-up to 100% by 2050 (default pathway)"
        rung: L0
        note: "default land_transport_electric_share/ice_share schedule; nothing to change"
      - variant: "custom EV share for a given planning horizon"
        rung: L1
        note: "set sector.land_transport_electric_share (and adjust ice/fuel_cell shares) for the horizon keys of the run; missing years are linearly interpolated, out-of-range years clamp to the nearest key"
      - variant: "scale total land transport demand up/down"
        rung: L1
        note: "let the three shares sum to !=1 — check_land_transport_shares explicitly logs this as 'increased or decreased demand assumptions' (no error)"
      - variant: "different EV consumption or charger power assumptions"
        rung: L1
        note: "sector.transport_electric_efficiency, bev_charge_rate, bev_charge_efficiency, EV_lower/upper_degree_factor are all config"
      - variant: "price EV charging infrastructure / make charger capacity extendable"
        rung: L2
        note: "the BEV charger n.add in add_EVs sets a fixed free p_nom with lifetime=1; add p_nom_extendable=True and a capital_cost there (no cost row is wired — sourcing one is L3)"
      - variant: "vehicle capital costs in the objective (fleet cost comparison)"
        rung: L2
        note: "no vehicle costs anywhere; attach a per-car annuity as capital_cost on the charger/load blocks in add_EVs/add_ice_cars, scaled by number_cars — cost data is on you (L3)"
      - variant: "country-specific traffic/charging weekly profiles (non-German)"
        rung: L3
        note: "replace the kfz.csv/pkw.csv inputs of rule build_transport_demand (built from BASt zip files by rule build_mobility_profiles) with local weekly count data in the same day-hour format"
      - variant: "own transport demand series or car stock"
        rung: L3
        note: "override transport_data.csv ('number cars', 'average fuel efficiency' from rule build_energy_totals) or the transport_demand.csv resource"
      - variant: "separate car segments (trucks, buses) with own electrification"
        rung: L3
        note: "see electric-heavy-trucks / electric-buses carrier cards — the JRC-IDEES sub-segment energy columns exist in energy_totals.csv but are unused"
      - variant: "endogenous EV uptake (optimiser chooses the drivetrain mix)"
        rung: L5
        note: "shares are exogenous scalars multiplied into fixed Loads; making uptake a decision variable needs new component logic and constraints coupling the three engine types"
    where:
      - change: "EV bus/load/charger/store/V2G creation and all bev_* parameter consumption"
        anchor: "scripts/prepare_sector_network.py::add_EVs (called from ::add_land_transport, rule compose_network)"
        provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/prepare_sector_network.py:add_land_transport"
      - change: "km demand construction (energy totals -> driven km, weekly shape, temperature correction)"
        anchor: "scripts/build_transport_demand.py::build_transport_demand (rule build_transport_demand)"
        provenance: "scripts/build_transport_demand.py:build_transport_demand; rules/build_sector.smk:build_transport_demand"
      - change: "car stock and average fuel efficiency per country"
        anchor: "scripts/build_energy_totals.py::build_transport_data (rule build_energy_totals, output transport_name)"
        provenance: "scripts/build_energy_totals.py:build_transport_data; rules/build_sector.smk:transport_name"
      - change: "weekly traffic profiles (kfz/pkw)"
        anchor: "rule build_mobility_profiles -> scripts/build_mobility_profiles.py (BASt count data)"
        provenance: "rules/build_sector.smk:build_mobility_profiles; scripts/build_mobility_profiles.py:BASt"
      - change: "re-pointing chargers to the low voltage bus"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
    data_dependencies:
      - input: "JRC-IDEES transport sheets (passenger cars, passenger car efficiency, TrRoad_ene) + Swiss BFS vehicle_stock.csv"
        required_for: "number of cars, average fuel efficiency, road/rail energy totals"
        availability: "retrieved by the workflow (rules retrieve_jrc_idees / build_energy_totals inputs); non-IDEES countries filled with averaged data"
      - input: "BASt mobility profiles kfz.csv (demand shape) and pkw.csv (plug-in availability)"
        required_for: "weekly transport demand and charger availability profiles"
        availability: "retrieved or built by the workflow (rules retrieve_mobility_profiles / build_mobility_profiles); German data applied Europe-wide"
      - input: "temp_air_total.nc (ambient temperature per node)"
        required_for: "temperature-dependent EV efficiency"
        availability: "must be built (heat workflow temperature chain); exists by default in sector runs"
      - input: "pop_weighted_energy_totals (total road, total rail, electricity rail columns)"
        required_for: "the km demand magnitude"
        availability: "must be built (rule build_energy_totals + population weighting); exists by default"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Land transport is ONE aggregate demand (all road vehicles together), split
        exogenously into an electric share, a fuel-cell share, and a remainder ICE-oil
        share. The electric share becomes, per cluster node: a "Li ion" carrier bus
        ("EV battery"), a "BEV charger" Link from the AC bus (efficiency =
        sector.bev_charge_efficiency, p_nom = number of cars x charge rate x electric
        share), and a "land transport EV" Load on the EV battery bus following a
        weekly traffic profile.
      mechanism: >
        Rule prepare_sector_network calls add_land_transport, which reads the share
        via get(options["land_transport_electric_share"], demand_sc + "_" +
        investment_year) — i.e. keys like "AB_2030" combining the {demand} and
        {planning_horizons} wildcards. If sector.dynamic_transport.enable is true the
        shares are instead keyed by the Co2L opts wildcard. The demand time series is
        built upstream by rule prepare_transport_data from country energy totals
        ("total road" + non-electric rail), shaped by a weekly German traffic count
        (data/emobility/KFZ__count), corrected for EV vs ICE efficiency
        (bev_plug_to_wheel_efficiency x bev_charge_efficiency) and for
        temperature-dependent vehicle heating (EV_/ICE_ degree factors). Per-node car
        counts come from resources transport_data.csv (rule
        prepare_transport_data_input: WHO GHO registered-vehicle statistics completed
        with Wikipedia), distributed by population fraction. Charger p_nom uses
        options.get("bev_charge_rate", 0.011) — a hardcoded default, not a
        config.default.yaml key.
      not_covered: >
        No vehicle segmentation — cars, trucks, buses, two-wheelers are one aggregate;
        the shares apply to all road transport uniformly. EV uptake is exogenous (a
        share), never optimised. BEV charger p_nom is fixed, not extendable, and no
        charging-infrastructure cost is charged. bev_charge_rate has no config key.
        Smart charging and V2G are separate toggles (see smart-ev-chargers,
        vehicle-to-grid carrier cards).
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers:
      - key: sector.enable.land_transport
        effect: "Master switch — if false, add_land_transport is skipped and no transport demand enters the network."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"
      - key: sector.land_transport_electric_share
        effect: >
          Fraction of aggregate land transport demand served by EVs, keyed
          {demand}_{planning_horizon} (e.g. AB_2030). Also used upstream in
          prepare_energy_totals to scale total road demand by EV efficiency gains.
        default: "AB_2030: 0.01 (dict per scenario/year; e.g. NZ_2050: 0.68)"
        provenance: "scripts/prepare_sector_network.py:land_transport_electric_share"
      - key: sector.land_transport_fuel_cell_share
        effect: "Fraction served by FCEVs; remainder 1 - electric - fuel_cell becomes ICE oil demand. Sum must be <= 1 (asserted)."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_fuel_cell_share"
      - key: sector.dynamic_transport.enable
        effect: "If true, EV/FCEV shares are read from sector.dynamic_transport.* keyed by the Co2L opts wildcard instead of {demand}_{planning_horizon}."
        default: "false"
        provenance: "scripts/prepare_sector_network.py:dynamic_transport"
      - key: sector.bev_charge_efficiency
        effect: "BEV (dis-)charging efficiency applied to the BEV charger Link (and V2G Link)."
        default: "0.9"
        provenance: "scripts/prepare_sector_network.py:bev_charge_efficiency"
      - key: sector.bev_plug_to_wheel_efficiency
        effect: "kWh/km plug-to-wheel assumption; with bev_charge_efficiency defines the EV efficiency gain that deflates road demand when electrified."
        default: "0.2"
        provenance: "scripts/prepare_transport_data.py:bev_plug_to_wheel_efficiency"
      - key: sector.transport_internal_combustion_efficiency
        effect: "ICE efficiency dividing the remaining oil share of transport demand (bigger oil demand for lower efficiency)."
        default: "0.3"
        provenance: "scripts/prepare_sector_network.py:transport_internal_combustion_efficiency"
      - key: sector.EV_lower_degree_factor
        effect: "Per-degree increase of EV consumption below the heating deadband; shapes the temperature correction of the EV demand series."
        default: "0.98"
        provenance: "scripts/prepare_transport_data.py:EV_lower_degree_factor"
      - key: sector.EV_upper_degree_factor
        effect: "Per-degree increase of EV consumption above the deadband (cooling)."
        default: "0.63"
        provenance: "scripts/prepare_transport_data.py:EV_upper_degree_factor"

    boundary:
      - variant: "Turn land transport (incl. EVs) on/off"
        rung: L0
        note: "sector.enable.land_transport, default already true."
      - variant: "Set a specific EV uptake for a scenario/year"
        rung: L1
        note: >
          Set sector.land_transport_electric_share for the exact key
          {demand}_{planning_horizons} of your run (e.g. AB_2030: 0.5). Missing keys
          raise KeyError in get().
      - variant: "EV share driven by CO2 target instead of scenario"
        rung: L1
        note: "sector.dynamic_transport.enable: true and fill the Co2L-keyed share dicts."
      - variant: "Change EV efficiency / charger power assumptions"
        rung: L1
        note: "bev_charge_efficiency, bev_plug_to_wheel_efficiency are config; but the per-car charger rating bev_charge_rate (0.011 MW) is only an options.get default — changing it is L2."
      - variant: "Change per-car charger power rating (bev_charge_rate)"
        rung: L2
        note: "Hardcoded default in add_land_transport (options.get('bev_charge_rate', 0.011)); either edit the default or add the key to your config (it is read via options.get so a custom config entry works, but it is absent from config.default.yaml)."
      - variant: "Make charger capacity extendable / cost charging infrastructure"
        rung: L2
        note: "Edit the BEV charger n.madd in add_land_transport: p_nom_extendable=True plus a capital_cost (commented-out hints exist in the function)."
      - variant: "Use your own transport demand time series"
        rung: L3
        note: "custom_data.transport_demand: true switches prepare_transport_data to use 'total road' energy totals directly; supplying a bespoke series means replacing the resources transport_*.csv input the rule produces."
      - variant: "Country-specific traffic/charging weekly profiles (non-German)"
        rung: L3
        note: "The weekly shape is data/emobility/KFZ__count (German BASt counts) wired in rule prepare_transport_data; substitute the data file or repoint the rule input."
      - variant: "Endogenous (optimised) EV uptake"
        rung: L5
        note: "Shares are exogenous scalars multiplied into fixed Loads; making uptake a decision variable needs new component logic and constraints."

    where:
      - change: "EV/FCEV/ICE split, EV battery buses, BEV charger links, EV loads"
        anchor: "scripts/prepare_sector_network.py function add_land_transport (rule prepare_sector_network)"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "Transport demand time series, availability/DSM profiles, nodal car counts"
        anchor: "rule prepare_transport_data -> scripts/prepare_transport_data.py function prepare_transport_data"
        provenance: "scripts/prepare_transport_data.py:prepare_transport_data"
      - change: "Country vehicle stock and fuel-efficiency table"
        anchor: "rule prepare_transport_data_input -> scripts/prepare_transport_data_input.py"
        provenance: "scripts/prepare_transport_data_input.py:download_number_of_vehicles"
      - change: "Base road energy demand per country"
        anchor: "rule build_base_energy_totals (UNSD balances) then rule prepare_energy_totals (projection with EV/FCEV shares)"
        provenance: "Snakefile:build_base_energy_totals"

    data_dependencies:
      - input: "UNSD energy balances (data/demand/unsd) -> energy_totals 'total road' per country"
        required_for: "any land transport demand"
        availability: "must be built (downloaded by build_base_energy_totals when demand_data.update_data is true); country coverage varies"
      - input: "WHO GHO registered-vehicle counts + Wikipedia vehicles-per-capita (downloaded at runtime)"
        required_for: "nodal charger p_nom and EV battery sizes ('number cars')"
        availability: "region-dependent (live download; falls back to data/temp_hard_coded/transport_data.csv if URLs fail)"
      - input: "data/emobility/KFZ__count and Pkw__count weekly traffic counts"
        required_for: "hourly shape of transport demand and plug-in availability"
        availability: "exists by default (shipped in repo; German data applied globally)"
      - input: "temp_air_total (cutout-derived air temperature)"
        required_for: "temperature correction of EV/ICE demand"
        availability: "must be built (needs cutout for the region)"
