id: beccs
title: Bioenergy with CCS (BECCS)
summary: >
  Burning or converting biomass while capturing the biogenic CO2 and storing it
  — delivering heat, power, fuels or hydrogen plus net-negative emissions.
when_to_use:
  - "BECCS"
  - "biomass with carbon capture"
  - "bioenergy CCS / negative-emission power"
  - "biomass CHP with capture"
  - "carbon-negative hydrogen or fuels from biomass"
  - "negative emissions from bioenergy"
  - "biofuel plant with CO2 capture"
  - "biogas upgrading with capture"
  - "waste-to-energy with capture"
  - "co2 sequestered from biogenic sources"
  - "pypsa-eur carrier names: urban central solid biomass CHP CC, solid biomass for industry CC, biomass to liquid CC, biomass-to-methanol CC, BioSNG CC, biogas to gas CC, solid biomass to hydrogen, waste CHP CC"
  - "carbon-negative electricity or hydrogen from biomass"
  - "net negative emissions from bioenergy"
models:
  - model: pypsa-eur
    version_anchor: {ref: "29489d3b97bc7e5023aa02b96d3112e58258df7a", date: "2026-10-11"}
    out_of_box:
      covers: >
        There is no standalone "BECCS" carrier; BECCS is a family of CC
        variants of biomass conversions, some default-on, most behind L0
        flags. DEFAULT-ON: (1) "urban central solid biomass CHP CC"
        (add_biomass; added unconditionally next to the plain CHP wherever
        urban central heat buses exist and "solid biomass" is in
        sector.chp.fuel), and (2) "solid biomass for industry CC"
        (add_industry, behind industry.solid_biomass_for_industry_cc, default
        true — capture energetics from the "cement capture" row). DEFAULT-OFF, single config flip each: "biomass to
        liquid CC" (sector.biomass_to_liquid_cc), "biomass-to-methanol CC"
        (sector.methanol.biomass_to_methanol_cc), "BioSNG CC"
        (sector.biosng_cc, independent of sector.biosng), carbon-negative
        hydrogen "solid biomass to hydrogen" (sector.bioH2 — CC by
        construction, capturing CO2-intensity x sector.cc_fraction), and "biogas
        to gas CC" (sector.biogas_upgrading_cc). By default industrial process heat has no temperature-resolved biomass CC route: "solid biomass for industry CC" is the only industrial biomass capture link; with sector.industry_t.endogen (fork) the band CC twins "heat100-200 industry solid biomass CC" and "heat200-500 industry solid biomass CC" add two more per node. "waste CHP CC"
        (waste.waste_to_energy_cc) is
        carbon-negative only for the municipal-solid-waste share, which joins
        the waste bus only once a waste CHP is switched on
        (waste.waste_to_energy or waste.waste_to_energy_cc) and which the
        model books as carbon-neutral (its "municipal solid waste to waste"
        link takes the CO2 the CHP later emits out of the atmosphere). With
        sector.endogenous_sectors.enable (cement listed; off by default) the
        cement kiln burns solid biomass through "<node> cement heat biomass"
        (from the solid biomass buses, so under the biomass limit; its CO2
        lands on the cement emission bus and is balanced against the
        atmosphere), so the kiln's capture retrofit "cement emission CC" is a
        BECCS route on the biogenic share. All captured CO2 goes to the per-node "co2 stored" buses;
        it only becomes REMOVAL by flowing through the "co2 sequestered"
        links/stores, bounded by sector.co2_sequestration_potential
        (solve_network.py::add_co2_sequestration_limit) and by the biomass
        potentials from rule build_biomass_potentials (ENSPRESO classes,
        phased in via biomass.share_sustainable_potential_available).
      mechanism: >
        Two accounting conventions, both anchored on the "co2 atmosphere"
        store from add_co2_tracking (e_min_pu = -1, so net removal is
        representable). Combustion-type routes (CHP CC, solid biomass for
        industry CC): plain biomass burning books NOTHING
        on the atmosphere (implicit carbon neutrality); the CC variant adds
        efficiency terms of -CO2_intensity x capture_rate onto "co2
        atmosphere" and +CO2_intensity x capture_rate onto "co2 stored"
        (solid biomass CO2 intensity 0.3667 tCO2/MWh_th; "biomass CHP
        capture" capture_rate 0.95, its electricity-input debited from
        electric efficiency). Fuel-synthesis routes (BtL / BioSNG /
        biomass-to-methanol / biogas upgrading): the conversion link books
        the FULL biogenic credit (-CO2 intensity) on the atmosphere, adds
        back the vented process share ("CO2 stored" attribute x (1 - "capture
        rate")), and sends "CO2 stored" x "capture rate" to the co2 stored
        buses; the carbon embodied in the product fuel is re-emitted
        downstream when the fuel is burned — so the net chain removal equals
        exactly the captured share. Capture rates and energy penalties are
        cost-data attributes ("biomass CHP capture", "cement capture", per-
        technology "capture rate"), not config keys.
      not_covered: >
        No dedicated BECCS power plant: in sector runs the only solid-biomass
        electricity assets are the CHP links (remove_elec_base_techs strips
        the electricity-workflow "biomass" conventional Generators, which
        have no capture option anyway) — a power-only biomass CC plant is a
        code edit. The CHP CC add has NO off-switch (no sector.cc master flag
        as in pypsa-earth); the industry CC has one since #2357
        (industry.solid_biomass_for_industry_cc) — disabling the CHP CC while
        keeping plain biomass means editing code. "electrobiofuels" (default ON) is capture-and-USE, not
        BECCS: the FT-capture-rate carbon is recycled with H2 into more fuel,
        no co2 stored output; the same holds for the hydrogen-boosted
        routes of the fork commit d2e0d486 — e-biomethanol, e-bioSNG and
        e-biogas-methanol (off by default, [[advanced-biofuels]],
        [[biogas-anaerobic-digestion]]) bind the capturable biogenic carbon in
        the product, which is re-emitted where the fuel burns, so they compete
        with the CC variants for the same carbon (use vs storage) rather than
        adding removals. "blue methanol" (sector.methanol.blue_methanol)
        sends captured CO2 to co2 stored, but its carbon is fossil gas
        carbon: fossil CCS that reduces emissions, not a removal. "solid biomass for industry CC" hardcodes
        conversion efficiency 0.9 ("TODO: make config option"). Captured
        biogenic CO2 on "co2 stored" competes with utilisation (Sabatier /
        Fischer-Tropsch / methanolisation) — negativity is only realised via
        the "co2 sequestered" flow. Imported biomass carries upstream
        emissions (sector.solid_biomass_import.upstream_emissions_factor), so
        import-fed BECCS is less than fully negative; domestic potentials are
        sustainability-classed (ENSPRESO) but per-class supply curves beyond
        the phase-in shares do not exist.
      provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:add_biomass_to_methanol_cc; scripts/prepare_sector_network.py:add_co2_tracking; scripts/prepare_sector_network.py:urban central solid biomass CHP CC; scripts/prepare_sector_network.py:solid biomass for industry CC; scripts/solve_network.py:add_co2_sequestration_limit; scripts/prepare_sector_network.py:add_waste; scripts/prepare_sector_network.py:add_cement"
    levers:
      - key: sector.biomass
        effect: "Gates add_biomass — false removes the entire biomass chain (and raises an error if industry is on, since industry demand includes solid biomass)."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.chp.enable
        effect: "Together with 'solid biomass' in sector.chp.fuel and existing urban central heat buses, gates the biomass CHP + CHP CC pair."
        default: "true"
        provenance: "config/config.default.yaml:chp; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_to_liquid_cc
        effect: "true adds 'biomass to liquid CC' links (BtL with capture, 'capture rate' 0.9 from the BtL cost row) at every biomass node."
        default: "false"
        provenance: "config/config.default.yaml:biomass_to_liquid_cc; scripts/prepare_sector_network.py:biomass to liquid CC"
      - key: sector.methanol.biomass_to_methanol_cc
        effect: "true adds 'biomass-to-methanol CC' links (add_biomass_to_methanol_cc; requires sector.biomass and the methanol chain)."
        default: "false"
        provenance: "config/config.default.yaml:biomass_to_methanol_cc; scripts/prepare_sector_network.py:add_biomass_to_methanol_cc"
      - key: sector.biosng_cc
        effect: "true adds 'BioSNG CC' (solid biomass to gas with capture); independent of the plain sector.biosng switch."
        default: "false"
        provenance: "config/config.default.yaml:biosng_cc; scripts/prepare_sector_network.py:BioSNG CC"
      - key: sector.bioH2
        effect: "true adds 'solid biomass to hydrogen' links — inherently CC (captures solid-biomass CO2 intensity x sector.cc_fraction into co2 stored), i.e. carbon-negative hydrogen."
        default: "false"
        provenance: "config/config.default.yaml:bioH2; scripts/prepare_sector_network.py:solid biomass to hydrogen CC"
      - key: sector.cc_fraction
        effect: "Capture fraction used by the bioH2 route (and waste CHP CC); the other biomass CC routes take capture rates from cost data instead."
        default: "0.9"
        provenance: "config/config.default.yaml:cc_fraction; scripts/prepare_sector_network.py:cc_fraction"
      - key: sector.biogas_upgrading_cc
        effect: "true adds 'biogas to gas CC' — upgrading CO2 is captured to co2 stored and additionally credited off the atmosphere, making upgraded biomethane carbon-negative at the point of production."
        default: "false"
        provenance: "config/config.default.yaml:biogas_upgrading_cc; scripts/prepare_sector_network.py:biogas to gas CC"
      - key: industry.solid_biomass_for_industry_cc
        effect: "true adds 'solid biomass for industry CC' (industrial BECCS on the exogenous biomass-for-industry load); false leaves only the unabated link."
        default: "true"
        provenance: "config/config.default.yaml:solid_biomass_for_industry_cc; scripts/prepare_sector_network.py:solid_biomass_for_industry_cc"
      - key: waste.waste_to_energy_cc
        effect: "true adds 'waste CHP CC' links on the waste bus and folds the municipal solid waste potential into it (a 'municipal solid waste to waste' link that credits the CO2 off the atmosphere), so the MSW-fed share of the captured CO2 is net-negative."
        default: "false"
        provenance: "config/config.default.yaml:waste_to_energy_cc; scripts/prepare_sector_network.py:waste CHP CC; scripts/prepare_sector_network.py:municipal solid waste to waste"
      - key: sector.endogenous_sectors
        effect: "enable true with cement listed: the endogenous kiln can burn solid biomass (under the biomass limit) and capture its CO2 with the 'cement emission CC' retrofit."
        default: "{enable: false, subsectors: [steel, cement]}"
        provenance: "config/config.default.yaml:endogenous_sectors; scripts/prepare_sector_network.py:cement heat biomass"
      - key: sector.co2_sequestration_potential
        effect: "Per-horizon cap (Mt/a) on flow into 'co2 sequestered' — the shared hard bound on all BECCS (and DAC) removals; 0 before 2030 by default."
        default: "{2020: 0, ..., 2050: 250}"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: biomass.share_sustainable_potential_available
        effect: "Per-horizon phase-in of the sustainable ENSPRESO biomass potential (0 in 2020 to 1 from 2040) — the feedstock-side bound on BECCS throughput; biomass.scenario / biomass.year select the ENSPRESO variant."
        default: "{2020: 0, 2025: 0, 2030: 0.33, 2035: 0.66, 2040: 1, 2045: 1, 2050: 1}"
        provenance: "config/config.default.yaml:share_sustainable_potential_available; rules/build_sector.smk:build_biomass_potentials"
      - key: sector.solid_biomass_import.enable
        effect: "true adds an import supply (price, max_amount) feeding the solid biomass buses; its upstream_emissions_factor books positive atmosphere emissions, discounting import-fed BECCS."
        default: "false"
        provenance: "config/config.default.yaml:solid_biomass_import; scripts/prepare_sector_network.py:solid_biomass_import"
    boundary:
      - variant: "biomass CHP with capture + industry biomass with capture"
        rung: L0
        note: "default-on (needs urban central heat buses for the CHP; the CHP CC added unconditionally, the industry CC while industry.solid_biomass_for_industry_cc is true)"
      - variant: "carbon-capture biofuel plants (BtL CC / methanol CC / BioSNG CC)"
        rung: L0
        note: "flip sector.biomass_to_liquid_cc / sector.methanol.biomass_to_methanol_cc / sector.biosng_cc"
      - variant: "use the biogenic carbon in fuel instead of storing it (hydrogen-boosted routes) as the competing option"
        rung: L0
        note: "sector.methanol.e_biomethanol / sector.e_biosng / sector.methanol.e_biogas_methanol (method [[biogenic-carbon-routes]]); electrobiofuels is already on. Use-vs-store is then decided by the CO2 cap, hydrogen cost and sector.co2_sequestration_potential"
      - variant: "carbon-negative hydrogen from biomass"
        rung: L0
        note: "sector.bioH2: true (capture share sector.cc_fraction)"
      - variant: "biogas upgrading with capture"
        rung: L0
        note: "sector.biogas_upgrading_cc: true"
      - variant: "negative-emission waste CHP"
        rung: L1
        note: "waste.waste_to_energy_cc: true (the MSW potential joins the waste bus with it; sector.waste stays on by default); only the MSW share is credited, the non-sequestered HVC share is fossil"
      - variant: "BECCS on cement kilns (biomass-fired kiln with capture)"
        rung: L0
        note: "sector.endogenous_sectors.enable with cement (see [[cement-routes-endogenous]] and the method [[industry-routes-endogenous]]): 'cement heat biomass' feeds the kiln from the solid biomass buses under the biomass limit, 'cement emission CC' captures the kiln CO2 including the biogenic share"
      - variant: "temperature-resolved industrial process-steam biomass CC"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork: 'heat100-200 industry solid biomass CC' (steam boiler) and 'heat200-500 industry solid biomass CC' (direct firing) per node, capture via the 'biomass CHP capture' row, biomass drawn from the spatial biomass buses under the biomass limit; no biomass option above 500 °C — industry-process-heat-endogenous"
      - variant: "remove the default-on BECCS routes but keep plain biomass"
        rung: L2
        note: "the industry CC is a flag (industry.solid_biomass_for_industry_cc: false, L0), but the CHP CC add in add_biomass is unconditional; comment it out (contrast: every other CC route has a flag)"
      - variant: "power-only BECCS plant"
        rung: L2
        note: "no such carrier; clone the 'urban central solid biomass CHP CC' block in add_biomass without the heat output (bus0 biomass, bus1 AC, atmosphere/stored efficiencies as-is)"
      - variant: "different capture rate or capture energy penalty"
        rung: L3
        note: "rows in data/custom_costs.csv for 'biomass CHP capture' (capture_rate, electricity-input), 'cement capture', or the per-technology 'capture rate' attributes — data, not config; EXCEPT solid biomass for industry CC whose 0.9 conversion efficiency is hardcoded (L2)"
      - variant: "cap BECCS separately from DAC within the sequestration budget"
        rung: L5
        note: "the co2_sequestration_limit GlobalConstraint keys on the 'co2 sequestered' carrier only — attributing stored CO2 to its capturing technology needs a bespoke constraint on the capturing links' p"
      - variant: "biomass supply curves per sustainability class"
        rung: L3
        note: "potentials are per-class in rule build_biomass_potentials (biomass.classes) but collapse to solid biomass / biogas / MSW totals per node; differentiated pricing needs edited potential outputs plus generator cost terms (L2 in add_biomass)"
    where:
      - change: "biomass CHP CC pair, BtL/BioSNG/bioH2/electrobiofuels/biogas CC links, biomass supply + import"
        anchor: "scripts/prepare_sector_network.py::add_biomass"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "solid biomass for industry CC (industry.solid_biomass_for_industry_cc)"
        anchor: "scripts/prepare_sector_network.py::add_industry"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "waste CHP CC and the municipal solid waste supply on the waste bus"
        anchor: "scripts/prepare_sector_network.py::add_waste"
        provenance: "scripts/prepare_sector_network.py:add_waste"
      - change: "biomass-to-methanol CC"
        anchor: "scripts/prepare_sector_network.py::add_biomass_to_methanol_cc (via ::add_methanol, options sector.methanol)"
        provenance: "scripts/prepare_sector_network.py:add_biomass_to_methanol_cc; scripts/prepare_sector_network.py:add_methanol"
      - change: "CO2 atmosphere/stored/sequestered accounting the CC links book against"
        anchor: "scripts/prepare_sector_network.py::add_co2_tracking"
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking"
      - change: "sequestration cap shared by all removal routes"
        anchor: "scripts/solve_network.py::add_co2_sequestration_limit (::prepare_network)"
        provenance: "scripts/solve_network.py:add_co2_sequestration_limit"
      - change: "capture-rate / capture-cost data"
        anchor: "data/custom_costs.csv via scripts/process_cost_data.py::overwrite_costs (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
      - change: "biomass feedstock potentials"
        anchor: "rule build_biomass_potentials (biomass: chapter — scenario/classes/phase-in shares)"
        provenance: "rules/build_sector.smk:build_biomass_potentials; config/config.default.yaml:share_sustainable_potential_available"
    data_dependencies:
      - input: "cost rows 'central solid biomass CHP CC', 'biomass CHP capture', 'cement capture', 'BtL', 'BioSNG', 'biomass-to-methanol', 'biogas CC', 'solid biomass' (CO2 intensity 0.3667 tCO2/MWh_th)"
        required_for: "all BECCS link parameters and the CO2 arithmetic"
        availability: "exists by default (technology-data v0.14.0 via rule retrieve_cost_data)"
      - input: "clustered biomass potentials (ENSPRESO via rule build_biomass_potentials)"
        required_for: "feedstock bound on every route"
        availability: "must be built; exists by default in the sector workflow (European coverage)"
      - input: "urban central heat buses (district heating share per node)"
        required_for: "the CHP CC route's placement"
        availability: "exists by default when sector.heating is true"
      - input: "co2 stored buses + co2 sequestered stores + sequestration potential data"
        required_for: "turning captured CO2 into counted removals"
        availability: "exists by default (add_co2_tracking; CO2Stop via rule retrieve_co2stop)"
      - input: "MSW potentials (biomass.classes municipal solid waste)"
        required_for: "the negative-emission waste CHP variant"
        availability: "must be built (same biomass potentials rule); folded into the waste bus only with waste.waste_to_energy or waste.waste_to_energy_cc (both off by default)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        No standalone "BECCS" carrier; BECCS is realised as CC variants of existing
        biomass conversions: (1) "urban central solid biomass CHP CC" Links in
        add_biomass (present when sector.chp, sector.cc and district-heating buses
        exist) and (2) "solid biomass for industry CC" Links in add_industry (when
        sector.cc). Optionally (3) hydrogen from "Biomass gasification CC" if that
        technology is added to sector.hydrogen.production_technologies (not in the
        default list).
      mechanism: >-
        Net-negativity works through the CO2 buses from add_co2: biomass combustion
        is counted as carbon-neutral (the plain biomass links book no positive
        emission on "co2 atmosphere"), and the CC variants additionally have a
        NEGATIVE efficiency onto "co2 atmosphere" and a matching positive efficiency
        onto the "co2 stored" buses, both equal to capture_rate x biomass
        CO2-intensity (cost rows "biomass CHP capture" for the CHP, "cement capture"
        for industry). So every MWh of biomass run through a CC link withdraws CO2
        from the atmosphere store and books it into geological storage — under a CO2
        cap/budget this is genuine negative emissions, bounded by
        sector.solid_biomass_potential and the sector.co2_sequestration_potential
        constraint (solve_network.py:add_co2_sequestration_limit). Capture consumes
        extra electricity/heat via modified link efficiencies.
      not_covered: >-
        No power-only BECCS plant (the "biomass EOP" biomass-to-electricity link has
        no CC variant); no biogas-with-CC route; capture rate and energy penalty are
        cost-data attributes, not config keys; biomass supply is a single national
        scalar with no sustainability classes, so BECCS scale is only limited by that
        scalar and the sequestration cap.
      provenance: "scripts/prepare_sector_network.py:add_biomass"
    levers:
      - key: sector.cc
        effect: "Master switch for all carbon-capture link variants, including both BECCS links."
        default: "true"
        provenance: "config.default.yaml:cc ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.chp
        effect: "Needed for the biomass CHP (and hence its CC variant) at district-heating buses."
        default: "true"
        provenance: "config.default.yaml:chp ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.solid_biomass_potential
        effect: "Total biomass feedstock (TWh/a) — the hard resource bound on BECCS throughput."
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.co2_sequestration_potential
        effect: "Cap (MtCO2/a) on total stored CO2 — the other hard bound on BECCS removals (shared with DAC and fossil CC)."
        default: "200"
        provenance: "config.default.yaml:co2_sequestration_potential ; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: sector.co2_sequestration_cost
        effect: "EUR/tCO2 charged on the 'co2 stored' Stores that BECCS fills."
        default: "10"
        provenance: "config.default.yaml:co2_sequestration_cost ; scripts/prepare_sector_network.py:add_co2"
      - key: sector.hydrogen.production_technologies
        effect: "Adding 'Biomass gasification CC' to this list enables carbon-negative hydrogen from biomass (cost keys 'H2 production biomass gasification CC' are already wired in add_hydrogen)."
        default: "[H2 Electrolysis, SMR, SMR CC]"
        provenance: "config.default.yaml:production_technologies ; scripts/prepare_sector_network.py:add_hydrogen"
    boundary:
      - variant: "Enable BECCS CHP and industry-biomass CC"
        rung: L0
        note: "Default-on (sector.cc + sector.chp); CHP CC additionally requires district-heating buses to exist."
      - variant: "Carbon-negative hydrogen (biomass gasification CC)"
        rung: L1
        note: "Add 'Biomass gasification CC' to sector.hydrogen.production_technologies."
      - variant: "Power-only BECCS plant"
        rung: L2
        note: "Add a CC variant of the 'biomass EOP' link in add_biomass, mirroring the CHP CC efficiency terms (bus3 'co2 atmosphere' negative, bus4 co2 stored positive)."
      - variant: "Different capture rate / capture energy penalty"
        rung: L3
        note: "Edit the 'biomass CHP capture' (capture_rate, electricity-input, heat terms) or 'cement capture' rows in the costs CSV — these are data attributes, not config keys."
      - variant: "Sustainability-classed biomass supply for BECCS"
        rung: L5
        note: "Needs feedstock classes/supply curves that do not exist (single scalar potential today)."
    where:
      - change: "BECCS CHP link (and template for a power-only variant)"
        anchor: "scripts/prepare_sector_network.py function add_biomass ('urban central solid biomass CHP CC' madd)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "Industry biomass CC link"
        anchor: "scripts/prepare_sector_network.py function add_industry ('solid biomass for industry CC' madd)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "Biomass-gasification-CC hydrogen route"
        anchor: "scripts/prepare_sector_network.py function add_hydrogen (cost key 'H2 production biomass gasification CC')"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "Capture-rate / capture-cost data"
        anchor: "costs CSV rows 'biomass CHP capture' and 'cement capture' (Snakefile rule retrieve_cost_data)"
        provenance: "Snakefile:retrieve_cost_data"
    data_dependencies:
      - input: "Cost rows 'biomass CHP capture', 'cement capture', 'solid biomass' (CO2 intensity), 'central solid biomass CHP' (technology-data)"
        required_for: "All BECCS link parameters"
        availability: "exists by default"
      - input: "District heating demand share (heat sector inputs)"
        required_for: "The CHP CC variant (needs 'urban central heat' buses)"
        availability: "exists by default when heat is enabled; magnitude region-dependent"
      - input: "Regional biomass potential and CO2 storage assessments"
        required_for: "Defensible BECCS bounds outside the placeholder defaults"
        availability: "absent — user-supplied (defaults are whole-area scalars)"
