id: biochar
title: Biochar
summary: >
  Pyrolysing biomass into a stable carbon-rich solid applied to soils — a
  carbon removal pathway that also yields heat/bio-oil co-products.
when_to_use:
  - "biochar"
  - "pyrolysis of biomass for carbon removal"
  - "char to soil / soil carbon sequestration via char"
  - "carbon removal from agricultural residues"
  - "negative emissions from pyrolysis"
  - "non-geological CDR / removal outside DAC and BECCS"
models:
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        No biochar component: "biochar" appears nowhere in scripts/, rules/ or
        config/ — a grounded absence in the WORKFLOW. But unlike pypsa-earth,
        the shipped COST DATA already contains it: technology-data v0.14.0
        (data/versions.csv row costs,v0.14.0, retrieved by rule
        retrieve_cost_data) carries a "biochar pyrolysis" technology
        (investment, VOM, FOM, lifetime, efficiency-biochar 0.404,
        efficiency-heat 0.4848, yield-biochar 0.0582 t/MWh_feedstock), and the
        processed cost table keeps dedicated efficiency-biochar /
        yield-biochar columns — no script consumes any of them. The machinery
        biochar is absent FROM exists: the biomass resource chain
        (add_biomass: per-node "solid biomass" buses with ENSPRESO potentials)
        and the carbon accounting chain (add_co2_tracking: "co2 atmosphere"
        store with e_min_pu = -1, per-node "co2 stored" and "co2 sequestered"
        buses/stores; add_dac as the template for an atmosphere-withdrawal
        link, the biomass CHP CC link as the template for a multi-output
        biomass link with carbon side-flows).
      mechanism: >
        None today. A faithful implementation is a pyrolysis Link in
        prepare_sector_network: bus0 a solid biomass bus, a heat co-product
        output (efficiency-heat, cf. the bus2 heat output of "urban central
        solid biomass CHP CC"), a negative efficiency onto "co2 atmosphere"
        for the carbon stabilised in the char, and that same carbon into a
        sink. Convention decision: routing it into the local "co2 stored" bus
        makes it transit the geological chain (cyclic tank stores, then "co2
        sequestered" under the sector.co2_sequestration_potential cap and
        co2_sequestration_cost) — wrong semantics for soil-applied char. A
        dedicated new store carrier (e.g. "biochar") automatically ESCAPES
        the solver cap, because add_co2_sequestration_limit keys its
        GlobalConstraint on carrier_attribute "co2 sequestered" only; a
        separate bound then needs its own e_nom_max or constraint.
      not_covered: >
        Everything functional: no pyrolysis link, no biochar carrier or
        store, no soil-application or permanence treatment, no bio-oil
        co-product, no land/application-rate limits. Only the cost row
        exists.
      provenance: "scripts/prepare_sector_network.py:add_co2_tracking; scripts/prepare_sector_network.py:add_biomass; data/costs/archive/v0.14.0/costs_2050.csv:biochar pyrolysis; data/versions.csv:costs,v0.14.0"
    levers:
      - key: sector.biomass
        effect: "Gates the biomass chain any biochar pathway would draw feedstock from; today it only feeds the existing biomass links."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.co2_sequestration_potential
        effect: "Would bound biochar carbon only if (crudely) routed into the co2 stored -> co2 sequestered chain; a dedicated biochar store sits outside this cap."
        default: "{2020: 0, ..., 2050: 250}"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: biomass.share_sustainable_potential_available
        effect: "Phase-in of the sustainable biomass potential — the feedstock bound a biochar route would share with all other biomass uses."
        default: "{2020: 0, 2025: 0, 2030: 0.33, 2035: 0.66, 2040: 1, 2045: 1, 2050: 1}"
        provenance: "config/config.default.yaml:share_sustainable_potential_available; rules/build_sector.smk:build_biomass_potentials"
      - key: costs.custom_cost_fn
        effect: "The shipped 'biochar pyrolysis' cost row can be tuned (or replaced) via data/custom_costs.csv rows without touching technology-data."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "any biochar representation at all"
        rung: L2
        note: >-
          Localised edit, NOT L5 as in pypsa-earth, because the cost row
          already ships: add a pyrolysis Link block in add_biomass (solid
          biomass bus0, heat co-product, negative atmosphere efficiency) using
          the "biochar pyrolysis" row's efficiency-biochar / yield-biochar /
          efficiency-heat attributes, sinking into the existing co2 stored
          chain if lumping char into the geological budget is tolerable.
      - variant: "faithful biochar with own permanence/budget outside geological storage"
        rung: L5
        note: >-
          New "biochar" store carrier (escapes the co2 sequestered
          GlobalConstraint automatically) plus its own removal-rate/total cap —
          a new e_nom_max and/or a constraint alongside
          add_co2_sequestration_limit in solve_network.py::prepare_network;
          plus a defensible regional application potential (data absent).
      - variant: "different biochar techno-economics"
        rung: L3
        note: "rows for technology 'biochar pyrolysis' in data/custom_costs.csv (overwrite_costs also concatenates brand-new technologies)"
    where:
      - change: "new pyrolysis link (feedstock + multi-output templates)"
        anchor: "scripts/prepare_sector_network.py::add_biomass (biomass-input multi-output links) and ::add_dac (atmosphere-withdrawal pattern)"
        provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:add_dac"
      - change: "carbon sink buses / a dedicated biochar store"
        anchor: "scripts/prepare_sector_network.py::add_co2_tracking (co2 atmosphere / co2 stored / co2 sequestered patterns)"
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking"
      - change: "removal cap for a dedicated store"
        anchor: "scripts/solve_network.py::prepare_network (alongside ::add_co2_sequestration_limit)"
        provenance: "scripts/solve_network.py:prepare_network; scripts/solve_network.py:add_co2_sequestration_limit"
      - change: "biochar cost row"
        anchor: "'biochar pyrolysis' in the retrieved technology-data costs (rule retrieve_cost_data); overrides via data/custom_costs.csv"
        provenance: "rules/retrieve.smk:retrieve_cost_data; scripts/process_cost_data.py:overwrite_costs"
    data_dependencies:
      - input: "cost row 'biochar pyrolysis' (technology-data v0.14.0: investment, efficiency-biochar, yield-biochar, efficiency-heat)"
        required_for: "the L2 pathway's techno-economics"
        availability: "exists by default — shipped but unconsumed by any script"
      - input: "carbon-stability / permanence fraction of the char"
        required_for: "an honest removal accounting (the cost row has no such attribute)"
        availability: "absent — must be supplied"
      - input: "regional soil-application / residue potential"
        required_for: "a defensible cap on the faithful (L5) variant"
        availability: "absent — must be supplied"
      - input: "clustered biomass potentials (rule build_biomass_potentials)"
        required_for: "feedstock bound (shared with all biomass uses)"
        availability: "exists by default in the sector workflow"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing — "biochar" appears nowhere in the workflow, config, or the shipped
        cost data (data/costs.csv). This is a grounded absence. The machinery it is
        absent FROM does exist: the biomass resource chain (add_biomass: "solid
        biomass" Stores bounded by sector.solid_biomass_potential) and the carbon
        accounting chain (add_co2: "co2 atmosphere" and "co2 stored" buses/stores;
        add_dac as the template for a link that moves CO2 out of the atmosphere).
      mechanism: >-
        None. The nearest structural pattern is an exogenous-removal Link in the style
        of add_dac — biochar would be a Link with bus0 on the solid biomass buses,
        a negative-emission term on "co2 atmosphere", and its carbon output either
        into the existing "co2 stored" bus or into a new dedicated store, plus
        optional heat co-product output (cf. the multi-output CHP CC links in
        add_biomass).
      not_covered: >-
        Everything: no pyrolysis technology, no biochar carrier or store, no soil
        application, no permanence discount, no cost row.
      provenance: "scripts/prepare_sector_network.py:add_co2"
    levers:
      - key: sector.solid_biomass_potential
        effect: "Would bound any biochar pathway's feedstock (shared with all other biomass uses); today it only feeds the existing biomass links."
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.co2_sequestration_potential
        effect: "If biochar carbon is routed into the existing 'co2 stored' Stores, this cap (shared with DAC/CC) would bound it."
        default: "200"
        provenance: "config.default.yaml:co2_sequestration_potential ; scripts/solve_network.py:add_co2_sequestration_limit"
    boundary:
      - variant: "Any biochar representation at all"
        rung: L5
        note: >-
          Bespoke Python: a new pyrolysis Link (solid biomass -> co2 removal + heat
          co-product) in prepare_sector_network, modelled on the add_dac link (for the
          atmosphere->stored carbon flow) and the biomass CHP CC link (for
          multi-output efficiencies). Also needs an L3 cost row (none exists in
          technology-data as shipped) and, if permanence should differ from geological
          storage, a separate 'biochar' store/carrier outside the co2 stored budget.
    where:
      - change: "New pyrolysis/removal link"
        anchor: "scripts/prepare_sector_network.py functions add_dac (removal-link template) and add_biomass (biomass-input multi-output link template)"
        provenance: "scripts/prepare_sector_network.py:add_dac"
      - change: "Carbon accounting target buses"
        anchor: "scripts/prepare_sector_network.py function add_co2 ('co2 atmosphere' / 'co2 stored')"
        provenance: "scripts/prepare_sector_network.py:add_co2"
      - change: "Cost row for pyrolysis/biochar"
        anchor: "costs CSV consumed via Snakefile rule retrieve_cost_data (or data/costs.csv override)"
        provenance: "Snakefile:retrieve_cost_data"
    data_dependencies:
      - input: "Biochar techno-economics (pyrolysis CAPEX, carbon yield, stability fraction)"
        required_for: "The L5 pathway"
        availability: "absent — no row in the shipped cost data; must be supplied"
      - input: "Regional biomass residue potential"
        required_for: "Feedstock bound (shared with the biomass carrier card)"
        availability: "region-dependent — default is a whole-area placeholder scalar"
