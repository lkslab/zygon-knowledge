id: biomass-bioenergy
title: Biomass / bioenergy (umbrella)
summary: >
  Solid biomass and other biogenic energy resources — the regional resource
  potential, its sustainable/unsustainable split, transport between regions,
  and the map of conversion routes (CHP, boilers, industry, fuels) that
  consume it.
when_to_use:
  - "add biomass / bioenergy"
  - "solid biomass potential for my region"
  - "wood or agricultural residues as fuel"
  - "energy crops (Miscanthus, willow, poplar)"
  - "limit or expand how much biomass the model can use"
  - "biomass transport between regions"
  - "sustainable vs unsustainable biomass"
  - "biomass imports from outside Europe"
  - "existing wood-fired power plants"
  - "ENSPRESO biomass scenarios"
  - "biomass boilers for building heat"
  - "pypsa-eur carrier names: solid biomass, unsustainable solid biomass, unsustainable bioliquids, solid biomass transport, solid biomass import, biomass boiler, urban central solid biomass CHP, solid biomass for industry"
  - "add biomass power plants"
  - "model bioenergy"
  - "solid biomass potential for my country"
  - "wood / agricultural residues as fuel"
  - "biomass CHP / district heating from biomass"
  - "burn crop waste for electricity"
  - "existing bagasse / wood-fired plants"
  - "known in pypsa-eur as: biomass, solid biomass, solid biomass import, solid biomass transport, unsustainable solid biomass, solid biomass to hydrogen, biomass boiler, residential rural biomass boiler, residential urban decentral biomass boiler, services rural biomass boiler, services urban decentral biomass boiler"
models:
  - model: pypsa-eur
    version_anchor: {ref: "f55cdf34f0e67a797fd4327bed26c56dedcb5cb8", date: "2026-10-09"}
    out_of_box:
      covers: >
        Sector runs carry a fully spatial, data-driven biomass resource.
        rule build_biomass_potentials loads the JRC ENSPRESO NUTS2 biomass
        potentials (scenario biomass.scenario, default ENS_Med; year
        biomass.year=2030 in overnight runs, else the planning horizon with
        linear interpolation between the available decades 2010-2050),
        disaggregates NUTS0-only commodities to NUTS2 by population,
        area-overlays NUTS2 onto the clustered regions
        (convert_nuts2_to_regions), and groups the 17 ENSPRESO commodities
        into carriers via the biomass.classes mapping: "solid biomass" =
        agricultural waste + forestry residues + sawdust + landscape-care
        residues; energy crops and roundwood are "not included"; manure and
        sludge form "biogas"; "Municipal waste" forms "municipal solid
        waste". add_unsustainable_potentials then adds per-region
        "unsustainable" solid biomass / biogas / bioliquids columns from
        Eurostat primary-production balances, scaled by the
        biomass.share_unsustainable_use_retained ramp (1 today -> 0 by 2040)
        while sustainable potentials phase in via
        share_sustainable_potential_available (0 -> 1 by 2040).
        prepare_sector_network's add_biomass turns this into per-node "solid
        biomass" buses + Generators (e_sum_max = potential, fuel price from
        the "solid biomass" cost row; nodal because sector.biomass_spatial
        defaults true). Default transport representation (biomass_transport
        false + biomass_spatial true): faux "transported" generators at each
        node priced with per-country transport cost x 200 km average
        distance, capped Europe-wide by a "biomass limit" GlobalConstraint;
        setting sector.biomass_transport true instead builds explicit "solid
        biomass transport" Links along the network topology. Unsustainable
        solid biomass (priced with the "fuelwood" row) is FORCED into the
        system — an "==" operational_limit GlobalConstraint (or e_sum_min =
        e_sum_max on the generators) makes the model consume exactly the
        retained amount; unsustainable bioliquids likewise and are converted
        1:1 into the oil buses with a negative atmospheric CO2 term so later
        combustion nets to zero. Overseas imports exist behind
        sector.solid_biomass_import (default false: 54 EUR/MWh, 1390 TWh cap,
        10% upstream emissions). Consumers wired by default: solid biomass
        for industry (add_industry), urban central solid biomass CHP + CC
        (see combined-heat-and-power carrier card), decentral biomass boilers on
        the four rural/urban-decentral heat systems (sector.biomass_boiler),
        biomass-to-liquid and electrobiofuels (default on), biomass-to-
        methanol (default on), BioSNG and solid biomass to hydrogen (default
        off) — the BtX routes belong to the hydrogen-fuels family of
        carrier cards; biogas upgrading has its own carrier card
        (biogas-anaerobic-digestion); municipal solid waste has its own
        chain (waste-to-energy carrier card: the potential joins the waste bus
        only with waste.waste_to_energy or waste.waste_to_energy_cc, both
        default false). With sector.endogenous_sectors.enable (cement listed,
        off by default) the endogenous cement kiln is a further solid biomass
        consumer, "<node> cement heat biomass" drawing from the solid biomass
        buses under the biomass limit. Electricity-only workflow: the existing bioenergy fleet
        enters as "biomass" conventional Generators ("Solid Biomass" and
        "Biogas" powerplantmatching fueltypes are folded into "Bioenergy",
        then carrier "biomass"); in myopic sector runs the same fleet
        re-enters as brownfield "urban central solid biomass CHP" Links via
        add_existing_baseyear, and existing decentral biomass boilers are
        vintaged in from the existing-heating data.
      mechanism: >
        rule build_biomass_potentials (scripts/build_biomass_potentials.py:
        enspreso_biomass_potentials -> disaggregate_nuts0 ->
        convert_nuts2_to_regions -> classes groupby ->
        add_unsustainable_potentials) writes
        biomass_potentials_{horizon}.csv in MWh/a;
        rule build_biomass_transport_costs derives per-country EUR/MWh/km
        from two JRC supply-chain CSVs; rule compose_network
        (prepare_sector_network.py) calls add_biomass (gated by sector.biomass) which reads both and creates
        buses, generators, transport, CHP/boiler/BtX links; define_spatial
        decides nodal vs EU-pooled namespaces from sector.biomass_spatial /
        biomass_transport (and gas_network for biogas). Electricity
        workflow: rule build_powerplants + add_electricity's
        attach_conventional_generators ("biomass" in
        electricity.conventional_carriers). Sector runs strip those
        generators again in remove_elec_base_techs (biomass is not in the
        pypsa_eur keep-list).
      not_covered: >
        No power-only (condensing) biomass electricity plant exists in
        sector networks — solid biomass reaches electricity only through
        CHP or upstream fuel conversions, and sector.conventional_generation
        cannot be pointed at solid biomass because add_generation resolves
        the fuel via vars(spatial)[carrier], which has no "solid biomass"
        attribute. One fuel price covers all sustainable solid biomass
        classes (the "solid biomass" cost row) — no feedstock-resolved
        cost-supply curves; a class added to biomass.classes produces a new
        column in the potentials CSV but add_biomass only reads the four
        hard-coded column names, and ENSPRESO commodities left out of the
        mapping are silently dropped by the groupby. Turning
        sector.biomass off while sector.industry is on raises a ValueError
        ("Industry demand includes solid biomass"). ENSPRESO covers the
        NUTS 2013 space; AL/BA/RS/ME/XK are patched in by hand-coded
        population numbers and there is no path to non-European potentials
        other than the generic import store. No energy-crop cultivation or
        land-use competition modelling. Biomass transport links have a fixed
        arbitrary 5e4 MW capacity and cost but no capacity expansion or
        distance-dependent losses. TRAP — the "biomass limit" constant is the sum of the SELECTED countries'
        potentials, while the "solid biomass for industry" load is the selection's own
        exogenous industrial biomass use (JRC-IDEES through the sector ratios,
        industrial_energy_demand_<year>.csv), with no other source unless
        sector.solid_biomass_import.enable is true. A small country with heavy industrial
        biomass use therefore demands more than it may supply and the run is infeasible by
        construction, before any CO2 or balancing question — hit 2026-10-09: NL-only 2040
        at 10 clusters, 16.0 TWh/a solid biomass for industry against a 3.54 TWh/a limit
        (ENS_Med sustainable potential, the unsustainable share already 0 in 2040), both
        scenarios infeasible with hydrogen imports on or off, and the solver's IIS ran
        until the job's time limit. A Europe-wide run meets the same demand from the pooled continental limit, which is why the default never shows it. The structural way out on this fork is sector.industry_t.endogen (method industry-heat-endogenous): the endogenised sectors' heat leaves the flat biomass load and becomes band demand that biomass, gas, electricity and hydrogen compete for under the limit — for NL 2040 the exogenous 16.0 TWh/a solid biomass for industry falls to 0.04 TWh/a (the non-endogenised rest) and 42 TWh/a of band heat appears (21.3 / 5.5 / 15.5 TWh/a in 100-200 / 200-500 / 500+ °C), so the limit binds the biomass boilers instead of breaking the run. The second way
        out is the routes switch, sector.endogenous_sectors.enable (method
        industry-routes-endogenous): build_industrial_energy_demand_per_node drops steel
        (Integrated, DRI) and cement from both demand blocks, so their biomass leaves the
        flat load and the kiln's biomass competes under the limit with gas and waste —
        partial on its own (for NL 2040 the exogenous block loses 0.35 TWh/a of biomass
        against a 12.5 TWh/a gap), and on top of industry_t it shrinks the remaining flat
        load further. Before a one-
        country sector study compare the solid biomass column sum of
        resources/<run>/biomass_potentials_<year>.csv with the solid biomass column of
        industrial_energy_demand_<year>.csv, and pair the selection with
        sector.solid_biomass_import.enable: true (54 EUR/MWh, 1390 TWh cap, 10% upstream
        emissions) or with industry fuel-switching assumptions that cut the biomass
        demand, and say which.
      provenance: "scripts/build_biomass_potentials.py:enspreso_biomass_potentials; scripts/build_biomass_potentials.py:add_unsustainable_potentials; scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:biomass limit; scripts/prepare_sector_network.py:remove_elec_base_techs; scripts/build_powerplants.py:\"Biogas\": \"Bioenergy\"; scripts/add_existing_baseyear.py:\"Bioenergy\": \"urban central solid biomass CHP\"; scripts/prepare_sector_network.py:cement heat biomass; scripts/build_industrial_energy_demand_per_node.py:route_endogenised_sectors"
    levers:
      - key: sector.biomass
        effect: "Master switch for the whole sector biomass chain (add_biomass and the biomass-to-methanol calls are gated on it). NOTE: false + sector.industry true raises a ValueError in add_industry."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:Industry demand includes solid biomass"
      - key: biomass.scenario
        effect: "ENSPRESO scenario for all potentials: ENS_Low / ENS_Med / ENS_High — the one-key handle on how much biomass Europe has."
        default: "ENS_Med"
        provenance: "config/config.default.yaml:biomass.scenario; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
      - key: biomass.year
        effect: "ENSPRESO potential year used in overnight runs (myopic/perfect use the planning horizon instead, interpolating between the decades 2010-2050)."
        default: "2030"
        provenance: "config/config.default.yaml:biomass; scripts/build_biomass_potentials.py:AVAILABLE_BIOMASS_YEARS"
      - key: biomass.classes
        effect: "Maps the 17 ENSPRESO commodities onto 'solid biomass', 'not included', 'biogas', 'municipal solid waste' — moving e.g. 'Miscanthus, switchgrass, RCG' or 'FuelwoodRW' from 'not included' into 'solid biomass' mobilises energy crops / roundwood at the generic solid biomass price."
        default: "solid biomass: [Agricultural waste, Fuelwood residues, Secondary Forestry residues - woodchips, Sawdust, Residues from landscape care]; not included: energy crops + roundwood; biogas: [Manure solid, liquid; Sludge]; municipal solid waste: [Municipal waste]"
        provenance: "config/config.default.yaml:classes; scripts/build_biomass_potentials.py:grouper"
      - key: biomass.share_unsustainable_use_retained
        effect: "Per-horizon-year fraction of today's Eurostat-derived unsustainable solid biomass / biogas / bioliquids kept in the system; whatever is retained is FORCED to be consumed (operational_limit '==')."
        default: "{2020: 1, 2025: 1, 2030: 0.66, 2035: 0.33, 2040: 0, 2045: 0, 2050: 0}"
        provenance: "config/config.default.yaml:share_unsustainable_use_retained; scripts/build_biomass_potentials.py:_calc_unsustainable_potential"
      - key: biomass.share_sustainable_potential_available
        effect: "Per-horizon-year phase-in of the ENSPRESO sustainable potentials (0 in 2020/2025 — early horizons run on unsustainable biomass only)."
        default: "{2020: 0, 2025: 0, 2030: 0.33, 2035: 0.66, 2040: 1, 2045: 1, 2050: 1}"
        provenance: "config/config.default.yaml:share_sustainable_potential_available; scripts/build_biomass_potentials.py:add_unsustainable_potentials"
      - key: sector.biomass_spatial
        effect: "true resolves solid biomass (and the unsustainable carriers; MSW now follows sector.waste_spatial on the waste bus) per node with the faux-transport generators + 'biomass limit' GlobalConstraint; false pools everything on single EU buses."
        default: "true"
        provenance: "config/config.default.yaml:biomass_spatial; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.biomass_transport
        effect: "true replaces the faux-transport representation with explicit capacity-limited 'solid biomass transport' Links along the network topology at per-country EUR/MWh/km costs (implies spatial resolution)."
        default: "false"
        provenance: "config/config.default.yaml:biomass_transport; scripts/prepare_sector_network.py:solid biomass transport"
      - key: sector.solid_biomass_import
        effect: "enable: true adds an 'EU solid biomass import' Store (max_amount TWh at price EUR/MWh) feeding every solid biomass node with an upstream_emissions_factor share of the biomass CO2 intensity booked to the atmosphere."
        default: "{enable: false, price: 54, max_amount: 1390, upstream_emissions_factor: 0.1}"
        provenance: "config/config.default.yaml:solid_biomass_import; scripts/prepare_sector_network.py:solid biomass import"
      - key: sector.biomass_boiler
        effect: "true (default) adds extendable decentral biomass boilers on the residential/services rural and urban-decentral heat systems, with a pelletizing marginal cost."
        default: "true"
        provenance: "config/config.default.yaml:biomass_boiler; scripts/prepare_sector_network.py:biomass boiler"
      - key: sector.biomass_to_liquid
        effect: "Solid biomass -> oil Fischer-Tropsch route (BtL cost row); electrobiofuels (BtL + H2, default true) and biosng / bioH2 (default false) sit beside it — details in the hydrogen-fuels family carrier cards."
        default: "true"
        provenance: "config/config.default.yaml:biomass_to_liquid; scripts/prepare_sector_network.py:biomass to liquid"
      - key: electricity.conventional_carriers
        effect: "'biomass' in this list attaches the existing bioenergy fleet as dispatchable Generators in the electricity-only workflow (not extendable by default; add 'biomass' to electricity.extendable_carriers.Generator for expansion at existing sites)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
    boundary:
      - variant: "run with the default spatial biomass resource and all conversion routes"
        rung: L0
        note: "default — sector.biomass, biomass_spatial, biomass_boiler, chp, biomass_to_liquid, electrobiofuels, biogas_upgrading all on"
      - variant: "more/less biomass Europe-wide"
        rung: L0
        note: "biomass.scenario: ENS_High / ENS_Low (and biomass.year); this rebuilds the potentials CSV per region — no scalar override exists"
      - variant: "mobilise energy crops or roundwood as fuel"
        rung: L1
        note: "move the commodities from 'not included' into 'solid biomass' in biomass.classes — they then carry the generic 'solid biomass' fuel price"
      - variant: "explicit inter-regional biomass transport"
        rung: L0
        note: "sector.biomass_transport: true (default is the faux-transport generators with a 200 km average-distance surcharge)"
      - variant: "single EU biomass pool (no spatial resolution)"
        rung: L1
        note: "sector.biomass_spatial: false with biomass_transport false — everything lands on 'EU solid biomass'"
      - variant: "keep unsustainable biomass longer / phase it out faster"
        rung: L1
        note: "edit the biomass.share_unsustainable_use_retained and share_sustainable_potential_available year dicts; note retained unsustainable amounts are forced consumption, not an option"
      - variant: "import biomass from outside Europe"
        rung: L1
        note: "sector.solid_biomass_import.enable: true, tune price / max_amount / upstream_emissions_factor"
      - variant: "run without biomass"
        rung: L1
        note: "sector.biomass: false — but requires sector.industry: false too (add_industry raises ValueError otherwise); also remove 'solid biomass' from sector.chp.fuel"
      - variant: "extendable biomass power in the electricity-only workflow"
        rung: L1
        note: "add 'biomass' to electricity.extendable_carriers.Generator (candidates only at buses with existing Bioenergy plants; electricity.everywhere_powerplants: ['Bioenergy'] for greenfield)"
      - variant: "power-only biomass plant in sector networks"
        rung: L2
        note: "no such link and no config path (add_generation's vars(spatial)[carrier] lookup cannot resolve 'solid biomass') — add a solid biomass -> AC Link in add_biomass, e.g. cloning the urban central solid biomass CHP block without the heat bus"
      - variant: "feedstock-resolved biomass carriers with own prices (e.g. separate energy-crop supply)"
        rung: L2
        note: "a new class in biomass.classes flows into the potentials CSV automatically, but add_biomass reads only the hard-coded columns — add a parallel bus/generator block for the new column (plus a cost row for its fuel price, L3)"
      - variant: "own potentials dataset replacing ENSPRESO"
        rung: L3
        note: "supply per-region MWh/a values in the biomass_potentials CSV schema (columns solid biomass / biogas / municipal solid waste / unsustainable ...) or rewire the build_biomass_potentials inputs; the ENSPRESO xlsx path comes from rule retrieve_enspreso_biomass"
      - variant: "country-specific biomass transport costs"
        rung: L3
        note: "edit data/biomass_transport_costs_supplychain1.csv / _supplychain2.csv consumed by rule build_biomass_transport_costs"
      - variant: "energy-crop land-use competition / cultivation decisions"
        rung: L5
        note: "nothing exists — potentials are exogenous per region; endogenous land allocation needs new components and constraints"
    where:
      - change: "potential scenario/year, class mapping, unsustainable split"
        anchor: "scripts/build_biomass_potentials.py (rule build_biomass_potentials; functions enspreso_biomass_potentials, add_unsustainable_potentials; grouper from biomass.classes)"
        provenance: "scripts/build_biomass_potentials.py:add_unsustainable_potentials; rules/build_sector.smk:build_biomass_potentials"
      - change: "biomass supply buses/generators, transport, boilers, CHP, BtX links"
        anchor: "scripts/prepare_sector_network.py::add_biomass (called from rule compose_network, gated by sector.biomass)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "nodal vs EU-pooled namespaces for biomass/biogas (MSW: spatial.waste, sector.waste_spatial)"
        anchor: "scripts/prepare_sector_network.py::define_spatial (sector.biomass_spatial / biomass_transport / gas_network)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "per-country transport cost derivation"
        anchor: "rule build_biomass_transport_costs (scripts/build_biomass_transport_costs.py, inputs data/biomass_transport_costs_supplychain{1,2}.csv)"
        provenance: "rules/build_sector.smk:build_biomass_transport_costs"
      - change: "existing bioenergy fleet in the electricity workflow"
        anchor: "scripts/build_powerplants.py (fueltype fold to Bioenergy) + scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/build_powerplants.py:\"Biogas\": \"Bioenergy\"; scripts/add_electricity.py:attach_conventional_generators"
      - change: "brownfield biomass CHP and vintaged biomass boilers in myopic runs"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear (Bioenergy mapping) and the existing-heating biomass boiler block"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear; scripts/add_existing_baseyear.py:biomass boiler"
    data_dependencies:
      - input: "JRC ENSPRESO_BIOMASS.xlsx (NUTS2 potentials, sheets Glossary + 'ENER - NUTS2 BioCom E')"
        required_for: "all sustainable potentials"
        availability: "retrieved by the workflow (rule retrieve_enspreso_biomass); Europe/NUTS-2013 only"
      - input: "Eurostat energy balances (resources eurostat_energy_balances.csv, nrg_bal PPRD rows)"
        required_for: "the unsustainable solid biomass / biogas / bioliquids columns"
        availability: "must be built (built by the workflow from retrieved Eurostat data)"
      - input: "data/biomass_transport_costs_supplychain1.csv + _supplychain2.csv"
        required_for: "biomass_transport / biomass_spatial cost terms"
        availability: "exists by default in the repo"
      - input: "cost rows 'solid biomass', 'fuelwood', 'biodiesel crops', 'biomass boiler', 'BtL', 'BioSNG', 'biomass-to-methanol', 'solid biomass to hydrogen', 'central solid biomass CHP'"
        required_for: "fuel prices and conversion economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "NUTS2 shapes (2013), NUTS3 population, Swiss cantons/population"
        required_for: "regionalising and population-disaggregating potentials"
        availability: "retrieved by the workflow (rule build_biomass_potentials inputs)"
      - input: "powerplantmatching database (Bioenergy / Solid Biomass / Biogas fueltypes)"
        required_for: "existing biomass fleet (electricity workflow) and brownfield CHP (myopic)"
        availability: "retrieved by the workflow; good European coverage"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Two chains. (1) Power-only chain: existing biomass power plants enter the
        electricity network as dispatchable Generators because "biomass" is in
        electricity.conventional_carriers; the powerplant table maps OSM fuel tags
        biomass/biofuel/biogas to powerplantmatching Fueltype "Bioenergy". (2) Sector
        chain (sector.enable.biomass): add_biomass creates per-node "solid biomass" and
        "biogas" buses with Stores whose energy content is the config potential split
        EQUALLY across nodes; a "biomass EOP" Link converts solid biomass to
        electricity; optional "solid biomass transport" Links between nodes; an
        "urban central solid biomass CHP" Link (plus a CC variant when sector.cc) at
        district-heating buses; add_industry adds a "solid biomass for industry"
        demand fed from the same stores; add_services adds a "services biomass" load.
        In the sector network the elec-network biomass Generators are converted to
        Links drawing from the solid biomass buses via sector.conventional_generation.
      mechanism: >-
        build_powerplants.py:convert_osm_to_pm maps OSM biomass tags to "Bioenergy";
        add_electricity.py:attach_conventional_generators adds them as Generators.
        prepare_sector_network.py:add_biomass reads
        sector.solid_biomass_potential / sector.biogas_potential (TWh/a for the WHOLE
        modelled area), divides by the node count, and builds Stores + conversion
        Links; costs come from the technology-data rows "solid biomass", "biomass EOP",
        "central solid biomass CHP", "biomass CHP capture".
        convert_conventional_generators_to_links re-wires biomass Generators as Links
        with bus0 on the solid biomass buses.
      not_covered: >-
        No spatially resolved biomass potentials (single scalar split equally across
        nodes — flagged as a TODO in add_biomass); no biomass feedstock classes or
        cost-supply curves; no biomass-to-liquids / biokerosene; no agriculture
        biomass demand in the network (the "agriculture biomass" column exists in the
        energy-totals data but add_agriculture only creates electricity and oil loads);
        the plain "biomass EOP" link books no atmospheric CO2 (combustion is treated
        as carbon-neutral).
      provenance: "scripts/prepare_sector_network.py:add_biomass"
    levers:
      - key: sector.enable.biomass
        effect: "Master switch for the sector biomass chain (add_biomass is only called when true)."
        default: "true"
        provenance: "config.default.yaml:biomass ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.solid_biomass_potential
        effect: "Total solid biomass energy available per year for the whole modelled area (TWh/a); becomes Store e_nom split equally across nodes."
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biogas_potential
        effect: "Total biogas potential (TWh/a) for the whole modelled area; see the biogas carrier card."
        default: "0.5"
        provenance: "config.default.yaml:biogas_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_transport
        effect: "If true, adds 'solid biomass transport' Links along the network topology so nodes can trade biomass at a per-km cost."
        default: "true"
        provenance: "config.default.yaml:biomass_transport ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_transport_default_cost
        effect: "Fallback transport cost (EUR/km/MWh) for countries missing from the transport-cost CSV."
        default: "0.1"
        provenance: "config.default.yaml:biomass_transport_default_cost ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.chp
        effect: "Enables the 'urban central solid biomass CHP' Link at district-heating buses."
        default: "true"
        provenance: "config.default.yaml:chp ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.cc
        effect: "Adds the CC variants: 'urban central solid biomass CHP CC' and 'solid biomass for industry CC' (see BECCS carrier card)."
        default: "true"
        provenance: "config.default.yaml:cc ; scripts/prepare_sector_network.py:add_biomass"
      - key: electricity.conventional_carriers
        effect: "Keeping 'biomass' in this list attaches existing biomass power plants as Generators in the electricity network."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers ; scripts/add_electricity.py:attach_conventional_generators"
      - key: sector.conventional_generation
        effect: "Maps generator technology to fuel carrier ('biomass: biomass'); controls the Generator-to-Link conversion in the sector network."
        default: "{OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass}"
        provenance: "config.default.yaml:conventional_generation ; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
    boundary:
      - variant: "Turn the biomass sector chain on/off"
        rung: L0
        note: "sector.enable.biomass."
      - variant: "Change the total biomass / biogas resource"
        rung: L0
        note: "Single scalars sector.solid_biomass_potential / sector.biogas_potential (whole modelled area)."
      - variant: "Include/exclude existing biomass power plants"
        rung: L1
        note: "Edit the electricity.conventional_carriers list."
      - variant: "Country- or node-specific biomass potentials"
        rung: L2
        note: "add_biomass splits one scalar equally across nodes; replace the equal split with a per-node series (small localised edit — the code carries a TODO for exactly this)."
      - variant: "Spatially resolved potentials from a dataset (e.g. residues map)"
        rung: L3
        note: "Needs a new data input (per-region potential table) plus the L2 edit in add_biomass to consume it."
      - variant: "Country-specific biomass transport costs"
        rung: L3
        note: "Edit data/temp_hard_coded/biomass_transport_costs.csv (indexed by 2-letter country code)."
      - variant: "New biomass conversion route (biomass-to-liquids, biokerosene, pellets)"
        rung: L5
        note: "New Link logic in prepare_sector_network; no such carrier exists."
    where:
      - change: "Per-node biomass potential split / new potential data input"
        anchor: "scripts/prepare_sector_network.py function add_biomass (biomass_pot_spatial / biogas_pot_spatial)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "Biomass transport cost data"
        anchor: "Snakefile rule prepare_sector_network input biomass_transport_costs -> data/temp_hard_coded/biomass_transport_costs.csv"
        provenance: "Snakefile:biomass_transport_costs"
      - change: "Existing biomass plant mapping from OSM/powerplantmatching"
        anchor: "scripts/build_powerplants.py function convert_osm_to_pm ('biomass'/'biofuel'/'biogas' -> 'Bioenergy')"
        provenance: "scripts/build_powerplants.py:convert_osm_to_pm"
      - change: "New biomass conversion Link"
        anchor: "scripts/prepare_sector_network.py function add_biomass (pattern: 'biomass EOP' / 'urban central solid biomass CHP' Links)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
    data_dependencies:
      - input: "Technology cost rows 'solid biomass', 'biomass EOP', 'central solid biomass CHP', 'biogas' (retrieved from PyPSA/technology-data, version costs.technology_data_version)"
        required_for: "All biomass conversion links and store marginal costs"
        availability: "exists by default (Snakefile rule retrieve_cost_data)"
      - input: "data/temp_hard_coded/biomass_transport_costs.csv"
        required_for: "sector.biomass_transport per-country costs"
        availability: "exists by default; region-dependent coverage (missing countries fall back to sector.biomass_transport_default_cost)"
      - input: "Powerplantmatching / OSM powerplant data (Fueltype 'Bioenergy')"
        required_for: "Existing biomass generators in the power chain"
        availability: "region-dependent (OSM completeness varies)"
      - input: "UNSD energy balances (data/demand/unsd/data) via energy totals"
        required_for: "'services biomass' and residential biomass demand levels"
        availability: "must be built (downloaded when demand_data.update_data)"
