id: blue-hydrogen
title: Blue hydrogen (steam methane reforming with CCS)
summary: >
  Hydrogen from natural gas via steam methane reforming (SMR), with and
  without carbon capture — the fossil competitor to electrolytic hydrogen
  on the H2 bus.
when_to_use:
  - "blue hydrogen"
  - "grey hydrogen / fossil hydrogen"
  - "steam methane reforming / SMR"
  - "SMR with carbon capture / SMR CCS"
  - "gas-to-hydrogen"
  - "hydrogen from natural gas"
  - "capture rate of hydrogen production"
  - "ban fossil hydrogen"
  - "pypsa-eur carrier names: SMR, SMR CC"
  - "blue hydrogen / SMR with CCS"
  - "steam methane reforming (SMR) — NOTE naming: in this model SMR means steam methane reforming, NOT small modular reactor"
  - "grey vs blue hydrogen mix"
  - "gas-to-hydrogen with carbon capture"
  - "coal gasification hydrogen with CC"
  - "enforce a blue hydrogen share"
  - "known in pypsa-eur as: SMR, SMR CC"
models:
  - model: pypsa-eur
    version_anchor: {ref: "09e8910ae03ace9af8ff821514cda7822fdd473f", date: "2026-10-12"}
    out_of_box:
      covers: >
        Both routes are ON by default. add_h2_gas_infrastructure adds at
        every node two extendable Links from the gas bus (nodal, since
        sector.gas_network is true) to the nodal H2 bus: "SMR"
        (sector.SMR: true) with efficiency from the "SMR" cost row and ALL
        gas CO2 emitted to "co2 atmosphere" (efficiency2 = gas CO2
        intensity) — the grey route; and "SMR CC" (sector.SMR_cc: true)
        with efficiency from the "SMR CC" cost row, a fraction
        sector.cc_fraction (0.9) of the gas CO2 captured to the co2 stored
        buses (bus3 = spatial.co2.nodes) and the remaining 10% to
        atmosphere. Captured CO2 then competes for sequestration or
        utilisation through the CO2 network/storage chain (carbon-management
        family). Because the gas input is the real gas system
        (entry-point-limited supply, pipelines, biogas blending), blue H2
        siting interacts with gas grid geography; the H2 output competes
        head-on with the unconditional "H2 Electrolysis" Links on the same
        buses. In myopic runs, built SMR/SMR CC capacity is carried across
        horizons as vintaged fixed assets by add_brownfield.
      mechanism: >
        rule compose_network -> add_h2_gas_infrastructure (SMR and
        SMR CC blocks, after methanation/coal_cc). Cost rows "SMR" and
        "SMR CC" from rule process_cost_data. CO2 flows are plain multilink
        outputs — no dedicated capture asset; the capture premium is
        entirely in the "SMR CC" cost row plus cc_fraction energetics.
      not_covered: >
        No autothermal reforming (ATR) or gas-splitting/pyrolysis
        (turquoise) route — SMR is the only gas-to-H2 technology. No
        existing SMR fleet: both links are greenfield extendable with no
        brownfield data source (add_existing_baseyear has no H2 branch).
        No upstream methane leakage accounting on the gas supply. The
        capture rate is the shared sector.cc_fraction (also used by the
        bioH2 route, default off — with defaults it is effectively
        SMR-specific), not a per-technology attribute. No retrofit coupling
        between SMR and SMR CC (independent candidates; the model can build
        either freely). No coal-gasification hydrogen ("coal CC" is a
        power-plant link, not an H2 route).
      provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:SMR CC; scripts/prepare_sector_network.py:cc_fraction; scripts/add_brownfield.py:add_brownfield"
    levers:
      - key: sector.SMR
        effect: "Adds/removes the uncaptured (grey) SMR route."
        default: "true"
        provenance: "config/config.default.yaml:SMR; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.SMR_cc
        effect: "Adds/removes the capture-equipped (blue) SMR route."
        default: "true"
        provenance: "config/config.default.yaml:SMR_cc; scripts/prepare_sector_network.py:SMR CC"
      - key: sector.cc_fraction
        effect: "Captured share of the gas CO2 in SMR CC (rest vents to atmosphere); shared with the bioH2 route (default off)."
        default: "0.9"
        provenance: "config/config.default.yaml:cc_fraction; scripts/prepare_sector_network.py:cc_fraction"
      - key: sector.gas_network
        effect: "true feeds SMR from nodal, entry-point-limited gas buses; false collapses to a single EU gas bus with unlimited supply at the fuel price."
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.co2_sequestration_potential
        effect: "Per-horizon cap (MtCO2/a) on total sequestration — the ultimate sink limiting how much SMR CC capture is worth (carbon-management family owns details)."
        default: "0 in 2020 ramping to 250 by 2045/2050"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: costs.overwrites
        effect: "Override 'SMR' / 'SMR CC' investment, efficiency or lifetime (or use data/custom_costs.csv rows via costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "blue + grey hydrogen as investment options"
        rung: L0
        note: "default — SMR and SMR CC both true at every node"
      - variant: "blue-only (no unabated grey H2)"
        rung: L1
        note: "sector.SMR: false, keep SMR_cc true"
      - variant: "no fossil hydrogen at all"
        rung: L1
        note: "sector.SMR: false and sector.SMR_cc: false"
      - variant: "different capture rate"
        rung: L1
        note: "sector.cc_fraction (0-1); with default configs it only affects SMR CC since bioH2 is off"
      - variant: "existing SMR fleet as brownfield capacity"
        rung: L2
        note: "no data hook — add non-extendable SMR links with p_nom/build_year in add_h2_gas_infrastructure"
      - variant: "cap the blue share of hydrogen supply"
        rung: L5
        note: "no share machinery; custom constraint over SMR-link vs electrolysis-link dispatch via the custom_extra_functionality hook"
      - variant: "upstream methane leakage / well-to-gate emissions"
        rung: L2
        note: "no representation; simplest faithful edit is an extra co2 atmosphere output coefficient on the SMR links (or on the gas supply generators) in add_h2_gas_infrastructure"
      - variant: "ATR or methane pyrolysis as alternative routes"
        rung: L3
        note: "clone the SMR CC block with new cost rows (technology-data has none wired; rows must be added via data/custom_costs.csv)"
    where:
      - change: "SMR / SMR CC link creation (efficiencies, CO2 split, siting)"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (SMR and SMR CC blocks)"
        provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - change: "capture-rate energetics"
        anchor: "sector.cc_fraction consumed in the SMR CC efficiency2/efficiency3 terms"
        provenance: "scripts/prepare_sector_network.py:cc_fraction; config/config.default.yaml:cc_fraction"
      - change: "cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs (rows 'SMR', 'SMR CC')"
        provenance: "scripts/process_cost_data.py:prepare_costs"
      - change: "custom blue-share or leakage constraints"
        anchor: "solve_network.py::extra_functionality custom_extra_functionality hook"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
    data_dependencies:
      - input: "cost rows 'SMR', 'SMR CC', 'gas' (fuel price + CO2 intensity)"
        required_for: "both routes' economics and emissions"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "nodal gas buses with entry-point-limited supply (gas network chain)"
        required_for: "gas feedstock (see fossil-fuel-supply / natural-gas-pipelines carrier cards)"
        availability: "must be built (build_gas_network / build_gas_input_locations); default in sector workflow"
      - input: "co2 stored buses + sequestration potentials"
        required_for: "SMR CC captured CO2 disposal"
        availability: "exists by default (add_co2_tracking; rule build_co2_sequestration_potentials)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        "SMR" (grey, gas -> H2 + CO2 to atmosphere) and "SMR CC" (blue, gas -> H2 with
        sector.cc_fraction of CO2 to the co2 stored bus, remainder to atmosphere) are in the
        DEFAULT sector.hydrogen.production_technologies list, so blue hydrogen is an investable
        option out of the box. Additional non-default list options: "Natural gas steam reforming
        (CC)", "Coal gasification (CC)", "Heavy oil partial oxidation" (grey only), and biomass
        routes. With sector.hydrogen.hydrogen_colors, CC routes feed per-node "blue H2" buses and
        unabated routes "grey H2" buses; sector.hydrogen.set_color_shares then lets the solver
        enforce blue_share / pink_share of total H2 load as equality constraints. Captured CO2
        enters the model's co2 stored buses (add_co2, co2_network / sequestration options).
        CAUTION: the carrier name "SMR" here is steam methane reforming — do not confuse with
        small modular (nuclear) reactors; nuclear-derived H2 is the separate "pink H2"
        high-temp electrolysis chain.
      mechanism: >
        scripts/prepare_sector_network.py:add_hydrogen tech_params entries "SMR" and "SMR CC":
        bus0 = spatial.gas.nodes, bus1 = node H2 (or grey/blue colour bus), bus2 = "co2
        atmosphere", and for CC bus3 = spatial.co2.nodes with efficiency split by
        options["cc_fraction"]. Share enforcement in scripts/solve_network.py:set_h2_colors
        (constraints total_blue == load_h2 * blue_share, total_pink == load_h2 * pink_share).
      not_covered: >
        No upstream methane supply-chain (fugitive) emissions; capture rate is the single global
        sector.cc_fraction shared by ALL CC technologies (also biomass CC, industry CC) — no
        per-technology capture rate key; no retrofit of existing SMR plants (greenfield extendable
        links only); no green_share/grey_share keys (only blue and pink shares are enforceable).
      provenance: "scripts/prepare_sector_network.py:add_hydrogen"
    levers:
      - key: sector.hydrogen.production_technologies
        effect: Include/exclude "SMR", "SMR CC", "Natural gas steam reforming CC", "Coal gasification CC", etc.
        default: '["H2 Electrolysis", "SMR", "SMR CC"]'
        provenance: "config.default.yaml:production_technologies; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.cc_fraction
        effect: Captured share of CO2 for every CC technology (rest vented to co2 atmosphere).
        default: "0.9"
        provenance: "config.default.yaml:cc_fraction; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.hydrogen_colors
        effect: Adds grey/blue (and green/pink) intermediate buses so blue output is distinguishable and constrainable.
        default: "false"
        provenance: "config.default.yaml:hydrogen_colors; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.set_color_shares
        effect: Activates equality constraints on blue and pink shares of total H2 load at solve time (requires hydrogen_colors).
        default: "false"
        provenance: "config.default.yaml:set_color_shares; scripts/solve_network.py:set_h2_colors"
      - key: sector.hydrogen.blue_share
        effect: Enforced blue-H2 fraction of hydrogen load when set_color_shares is true.
        default: "0.40"
        provenance: "config.default.yaml:blue_share; scripts/solve_network.py:set_h2_colors"
      - key: sector.hydrogen.pink_share
        effect: Enforced pink (nuclear) H2 fraction under the same constraint set.
        default: "0.05"
        provenance: "config.default.yaml:pink_share; scripts/solve_network.py:set_h2_colors"
      - key: sector.co2_network
        effect: Spatially resolved co2 stored buses (per node) vs a single global store — determines where captured CO2 from SMR CC lands.
        default: "true"
        provenance: "config.default.yaml:co2_network; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.co2_sequestration_cost
        effect: EUR/tCO2 cost applied to sequestration of the captured CO2 stream.
        default: "10"
        provenance: "config.default.yaml:co2_sequestration_cost; scripts/prepare_sector_network.py:add_co2"
    boundary:
      - variant: "Blue hydrogen as an investment option"
        rung: L0
        note: Default — "SMR CC" is already in production_technologies.
      - variant: "Grey-only or blue-only supply mix"
        rung: L1
        note: Edit the production_technologies list (e.g. drop "SMR" to remove grey).
      - variant: "Enforce a fixed blue share of hydrogen"
        rung: L1
        note: hydrogen_colors + set_color_shares + blue_share.
      - variant: "Different capture rate for SMR CC only"
        rung: L2
        note: cc_fraction is global; override efficiency2/efficiency3 of the "SMR CC" entry in the tech_params dict in add_hydrogen.
      - variant: "Coal- or oil-based blue/grey routes"
        rung: L1
        note: Add "Coal gasification CC" / "Heavy oil partial oxidation" to the list.
      - variant: "Upstream methane leakage accounting"
        rung: L5
        note: No representation; needs new emission flows on the gas supply chain.
      - variant: "Existing SMR fleet as brownfield capacity"
        rung: L5
        note: No existing-capacity path for H2 production links.
    where:
      - change: "SMR / SMR CC link parameters, capture split, colour routing"
        anchor: "scripts/prepare_sector_network.py:add_hydrogen (tech_params 'SMR'/'SMR CC' entries)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "Blue/pink share constraints"
        anchor: "scripts/solve_network.py:set_h2_colors (activated in extra_functionality)"
        provenance: "scripts/solve_network.py:set_h2_colors"
      - change: "Captured-CO2 sink (network, sequestration limit)"
        anchor: "scripts/prepare_sector_network.py:add_co2; scripts/solve_network.py:add_co2_sequestration_limit"
        provenance: "scripts/prepare_sector_network.py:add_co2"
    data_dependencies:
      - input: "technology-data costs csv rows: SMR, SMR CC, H2 production natural gas steam reforming (CC), H2 production coal gasification (CC), gas/coal/oil CO2 intensity"
        required_for: "all grey/blue routes"
        availability: "must be built (rule retrieve_cost_data); SMR and SMR CC rows confirmed in built costs file"
      - input: "gas supply on spatial.gas.nodes (fossil gas generation/carrier buses in the sector network)"
        required_for: "feedstock for SMR / SMR CC"
        availability: "exists by default in the sector workflow (spatial gas buses, sector.gas.spatial_gas)"
