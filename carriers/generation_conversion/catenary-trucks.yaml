id: catenary-trucks
title: Catenary trucks (electric road systems / eHighways)
summary: >
  Trucks drawing power directly from overhead lines on electrified highway
  corridors — direct-electricity road freight without (or with reduced)
  onboard batteries, plus the catenary infrastructure itself.
when_to_use:
  - "catenary trucks / trolley trucks"
  - "electric road systems / ERS"
  - "eHighway / overhead lines for trucks"
  - "dynamic charging on motorways"
  - "highway electrification for freight"
  - "pypsa-eur: no catenary carrier exists — nearest handles are land transport EV / BEV charger"
  - "catenary trucks / overhead line trucks"
  - "eHighway / electric road system / ERS"
  - "electrified highway corridors for freight"
  - "pantograph trucks"
  - "dynamic charging of trucks while driving"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d2e0d48666f09a580c744846cef37e5059761d7a", date: "2026-10-09"}
    out_of_box:
      covers: >
        Not covered at all. No catenary/ERS carrier, cost row, config key or
        infrastructure representation exists anywhere in the workflow. Road
        freight energy is inside the single land transport aggregate
        (build_transport_demand: total road + non-electric rail at
        passenger-car efficiency), and the only way electricity reaches road
        vehicles is through the EV chain — "BEV charger" Links into an "EV
        battery" Store/Load in add_EVs, i.e. battery-mediated with plug-in
        availability limits. There is no direct-from-grid traction load and no
        corridor/route spatial dimension (demand is population-weighted per
        node).
      mechanism: >
        n/a — the topic has no mechanism at this ref. The adjacent machinery
        is rule build_transport_demand (aggregate km demand) and
        add_land_transport/add_EVs in rule compose_network (the only
        road-electricity pathway).
      not_covered: >
        Everything catenary-specific: overhead-line infrastructure investment,
        corridor topology, truck fleet distinction (see electric-heavy-trucks
        — trucks are not a separate segment either), hybrid battery+catenary
        operation, time-of-driving coincident traction load.
      provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/prepare_sector_network.py:add_land_transport; scripts/build_transport_demand.py:build_transport_demand"
    levers:
      - key: sector.land_transport_electric_share
        effect: "Crude proxy only: routes more road (incl. truck) energy through the battery-EV chain — wrong physics for catenary (adds storage flexibility that overhead lines do not have)."
        default: "{2020: 0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1}"
        provenance: "config/config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:add_land_transport"
    boundary:
      - variant: "crude proxy: treat catenary trucks as extra EV share"
        rung: L1
        note: "raise sector.land_transport_electric_share — the only config-level knob touching road electricity, but it grants battery/DSM flexibility catenary traction does not have"
      - variant: "direct-electricity road load (catenary energy as an AC load, no infrastructure)"
        rung: L2
        note: "add a catenary share in add_land_transport and a plain Load on the AC (or low voltage) buses following the driving-time profile — pattern: the transport_shape-following EV load in add_EVs WITHOUT store/charger; carve the share from the aggregate; a config key must be threaded through options"
      - variant: "truck-fraction demand for the catenary load"
        rung: L2
        note: "carve the unused 'total heavy duty road freight' column of energy_totals.csv out of the aggregate in build_transport_demand (see electric-heavy-trucks carrier card) — data exists, plumbing does not"
      - variant: "corridor-resolved catenary demand (which highways, how much traffic)"
        rung: L3
        note: "needs freight-corridor traffic data mapped to network buses — no such dataset in the repo (BASt raw counts are point measurements used only for weekly shapes)"
      - variant: "catenary infrastructure as an investable component with rule plumbing"
        rung: L4
        note: "new rule building corridor topology/costs, new Link components per corridor, config keys and cost rows — no scaffold exists"
      - variant: "full ERS model (infrastructure optimisation, truck routing, hybrid battery-catenary)"
        rung: L5
        note: "bespoke component logic and constraints; nothing to build on"
    where:
      - change: "where a catenary share/load would be added"
        anchor: "scripts/prepare_sector_network.py::add_land_transport (beside the add_EVs/add_fuel_cell_cars/add_ice_cars calls)"
        provenance: "scripts/prepare_sector_network.py:add_land_transport; scripts/prepare_sector_network.py:add_fuel_cell_cars"
      - change: "where truck demand would be separated for the load"
        anchor: "scripts/build_transport_demand.py::build_transport_demand + energy_totals 'total heavy duty road freight'"
        provenance: "scripts/build_transport_demand.py:build_transport_demand; scripts/build_energy_totals.py:total heavy duty road freight"
    data_dependencies:
      - input: "freight corridor traffic volumes mapped to buses"
        required_for: "corridor-resolved catenary demand or infrastructure"
        availability: "absent from the repo"
      - input: "catenary infrastructure cost data (per-km overhead line, substations)"
        required_for: "investable ERS representation"
        availability: "absent — no such rows in the technology-data costs file are referenced"
      - input: "energy_totals.csv 'total heavy duty road freight' column"
        required_for: "truck-fraction demand carve-out"
        availability: "exists by default (rule build_energy_totals) but unused"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered at all. No catenary/eHighway concept exists anywhere in the
        repository (no config key, carrier, script, or data input mentions it —
        verified by repo-wide search). Road transport is one aggregate demand split
        only into EV-battery, H2 fuel-cell, and ICE-oil shares in
        add_land_transport; there is no direct-electricity road transport pathway
        without a battery, no corridor/route representation, and no highway
        infrastructure component.
      mechanism: >
        Nothing to describe — the nearest neighbouring mechanism is the EV pathway in
        add_land_transport (battery bus + charger link), which is structurally
        different: catenary supply is a direct AC load plus corridor infrastructure
        investment, neither of which exists.
      not_covered: >
        Everything: catenary demand share, corridor geometry, infrastructure capex,
        truck segment itself (see electric-heavy-trucks — trucks are not even a
        distinct demand).
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers: []

    boundary:
      - variant: "Crude proxy: treat catenary trucks as more EV share"
        rung: L1
        note: "Raise sector.land_transport_electric_share — wrong physics (routes demand through EV battery Store/charger) but the only config-level knob touching road electricity."
      - variant: "Direct-electricity road load (catenary energy as AC load, no infrastructure)"
        rung: L2
        note: "Add a share and a plain Load on the AC buses inside add_land_transport, carved from the aggregate — small code edit, but demand data for the catenary-truck fraction is on you."
      - variant: "Corridor-resolved catenary demand"
        rung: L3
        note: "Needs freight-corridor traffic data mapped to network buses (no such dataset in the repo) feeding the L2 load."
      - variant: "Catenary infrastructure as investable component with rule plumbing"
        rung: L4
        note: "New rule to build corridor topology/costs plus new Links/Loads and config keys."
      - variant: "Full eHighway model (infrastructure optimisation, truck routing, hybrid battery-catenary operation)"
        rung: L5
        note: "Bespoke Python — new component logic and constraints; nothing to build on."

    where:
      - change: "Where any catenary demand share would be carved out"
        anchor: "scripts/prepare_sector_network.py function add_land_transport"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "Where corridor demand data would enter the workflow"
        anchor: "rule prepare_transport_data -> scripts/prepare_transport_data.py"
        provenance: "Snakefile:prepare_transport_data"

    data_dependencies:
      - input: "Freight corridor traffic volumes / highway geometry for the target region"
        required_for: "any corridor-resolved catenary variant"
        availability: "absent"
      - input: "Catenary infrastructure cost assumptions (costs.csv row)"
        required_for: "investable-infrastructure variants"
        availability: "absent (no such technology row is referenced anywhere)"
      - input: "UNSD 'total road' aggregate (to carve a catenary share from)"
        required_for: "the L2 proxy load"
        availability: "must be built (standard demand chain)"
