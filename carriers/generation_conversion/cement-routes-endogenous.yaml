id: cement-routes-endogenous
title: Endogenous cement production (kiln fuel, cement kiln, capture)
summary: >
  Model-endogenous cement: a per-node cement demand in tonnes met by cement
  kilns, with the kiln heat chosen among biomass, waste and gas, the
  calcination and fuel CO2 vented or captured, and today's cement plants as
  dated brownfield capacity.
when_to_use:
  - "endogenous cement"
  - "cement kiln fuel choice (biomass, waste, gas)"
  - "cement carbon capture / CCS on clinker kilns"
  - "calcination emissions as a modelled process"
  - "cement as a material bus in tonnes"
  - "existing cement plants as brownfield capacity"
  - "endogenous_sectors cement"
  - "where should cement CCS go"
models:
  - model: pypsa-eur
    version_anchor: {ref: "ee7c6d86e475ee17a6af6d49ebf5ba8118b16723", date: "2026-11-24"}
    out_of_box:
      covers: >
        Upstream PyPSA/pypsa-eur#1719 and OFF by default
        (sector.endogenous_sectors: [], a list; the method
        industry-routes-endogenous turns it on). Demand side: with "cement" in
        sector.endogenous_sectors, build_industrial_energy_demand_per_node
        zeroes the sector ratios of the JRC-IDEES "Cement" sector
        (ENDOGENOUS_SUBSECTORS, applied after any sector.industry_heat
        replacement, so cement is not part of the industry heat bands), and
        its electricity, methane, biomass and process emission leave the flat
        industry loads of industrial_energy_demand_<horizon>.csv. Network side
        (the cement block of add_industry): the horizon's cement production
        (industrial_production_<horizon>.csv, Mt/a) becomes a flat Load
        "<node> cement" (carrier cement, t/h) on a "<node> cement" bus. Kiln
        heat: a "<node> cement heat" bus (MWh_th) fed by extendable,
        cost-free pass-through links "<node> cement heat biomass" (from the
        solid biomass bus, so under the biomass limit, efficiency 1, its CO2
        onto the emission bus and balanced against the atmosphere), "<node>
        cement heat waste" (from the non-sequestered HVC waste bus, which
        add_waste builds whenever cement is endogenous, efficiency 1, fossil
        CO2 of oil) and "<node> cement heat gas" (efficiency 1, CO2 of gas).
        One "<node> cement kiln" link (carrier cement kiln) turns heat into
        cement with the intensities of the exogenous case
        (cement_kiln_parameters): per tonne of cement it takes the country's
        summed fuel ratio of the Cement sector in
        industry_sector_ratios_<horizon>.csv as heat, its electricity ratio
        from the node, and writes its process emission ratio onto "<node>
        cement emission"; its capex is technology-data cement dry clinker
        times the cement finishing clinker-input plus cement finishing,
        per t cement. The emission bus empties through the vent link "<node>
        cement emission" to co2 atmosphere or, with
        industry.process_emissions_cc (default true), "<node> cement CC"
        (carrier cement emission CC, cement carbon capture retrofit: 90 % to
        the CO2 stored bus, 0.16 MWh electricity per t CO2, the rest vented).
        Because the biomass CO2 is credited back to the atmosphere, capturing
        a biomass-fired kiln's emission bus is negative emissions. Brownfield
        (add_existing_industry, first horizon of myopic or perfect foresight
        only, with existing_capacities.industry_plants: true, default false):
        operating integrated plants of the GEM Global Cement and Concrete
        Tracker (rule build_industry_plants, prepare_gem_database;
        grinding-only sites have no kiln and are left out) at nodes with a
        cement load become non-extendable dated links "<node> cement
        kiln-<year>", sized from the plant's cement capacity, grouped by
        existing_capacities.grouping_years_industry.
      mechanism: >
        rule build_industrial_production_per_country_tomorrow -> rule
        build_industrial_production_per_node -> rule
        build_industrial_energy_demand_per_node (params endogenous_sectors;
        ENDOGENOUS_SUBSECTORS zeroes the Cement ratios) -> rule
        compose_network (input industry_sector_ratios_<horizon>.csv when
        cement is listed): add_industry, cement block (waste bus from
        add_waste); with existing_capacities.industry_plants under
        myopic/perfect the horizon-free rule build_industry_plants
        (prepare_gem_database over the GEM cement tracker from
        retrieve_gem_gcct) feeds add_existing_industry on the first horizon,
        and add_brownfield carries the built links forward.
      not_covered: >
        There is no clinker bus: kiln and grinding are one link, so clinker
        cannot be traded or substituted. No cement trade either: every node
        with cement production must have its own kiln, so a country without
        one builds it (the Netherlands has had no clinker kiln since ENCI
        Maastricht closed in 2019; the three Dutch GEM sites are
        grinding-only, so a myopic NL run inherits no kiln either). Existing
        kilns carry their nominal cement capacity, which exceeds production
        (Spain's integrated plants against roughly 15-20 Mt/a of cement
        production). The clinker ratio only enters the kiln capex; the energy
        and process emission per tonne of cement are the country's JRC-IDEES
        Cement ratios, so a lower clinker share (blended cements, calcined
        clay, LC3) has no lever. No electric, plasma or hydrogen kiln: kiln
        heat comes from biomass, waste or gas only, and the three fuel links
        cannot be switched off by config. No cement store, so the kiln
        follows the flat load every hour. The capture retrofit charges electricity only (the catalogue's
        0.76 MWh gas per t CO2 for solvent regeneration is unused). The
        Europe-wide validation in the upstream PR found the kiln heat (106
        TWh) almost entirely waste-fired at 365-hour resolution, since the
        non-sequestered plastic waste must be burnt within the year anyway.
      provenance: "scripts/prepare_sector_network.py:cement_kiln_parameters; scripts/prepare_sector_network.py:add_industry; scripts/build_industrial_energy_demand_per_node.py:ENDOGENOUS_SUBSECTORS; scripts/add_existing_baseyear.py:add_existing_industry; scripts/build_industry_plants.py:prepare_gem_database; rules/build_sector.smk:build_industry_plants; rules/compose.smk:industry_sector_ratios; doc/release_notes.md:endogenous_sectors"
    levers:
      - key: sector.endogenous_sectors
        effect: "List of endogenised subsectors (steel, cement or both). Listing cement drops the Cement sector ratios from the industry demand file (and from the industry heat bands) and builds the cement buses, load and links."
        default: "[]"
        provenance: "config/config.default.yaml:endogenous_sectors; scripts/prepare_sector_network.py:add_industry; scripts/build_industrial_energy_demand_per_node.py:ENDOGENOUS_SUBSECTORS"
      - key: existing_capacities.industry_plants
        effect: "Brownfield only (myopic/perfect, first horizon): true adds today's integrated cement plants as dated kilns (with cement listed), next to the steel, ammonia and grey methanol plants."
        default: "false"
        provenance: "config/config.default.yaml:industry_plants; scripts/add_existing_baseyear.py:add_existing_industry"
      - key: industry.process_emissions_cc
        effect: "Builds the cement CC link on every cement emission bus (and the steel capture links); false leaves venting as the only outlet."
        default: "true"
        provenance: "config/config.default.yaml:process_emissions_cc; scripts/prepare_sector_network.py:add_industry"
      - key: sector.waste_spatial
        effect: "false (default) feeds every cement heat waste link from one EU non-sequestered HVC bus; true uses nodal waste buses."
        default: "false"
        provenance: "config/config.default.yaml:waste_spatial; scripts/prepare_sector_network.py:define_spatial"
      - key: existing_capacities.grouping_years_industry
        effect: "Build-year bins the existing plants are grouped into (one dated kiln link per region and bin)."
        default: "[1995, 2000, 2005, 2010, 2015, 2020, 2025]"
        provenance: "config/config.default.yaml:grouping_years_industry; scripts/add_existing_baseyear.py:add_existing_industry"
      - key: costs.overwrites
        effect: "Overrides investment, lifetime, FOM or VOM of cement dry clinker, cement finishing and cement carbon capture retrofit. It cannot reach the clinker-input (which only scales the kiln capex) or the capture rate, which only a data/custom_costs.csv row changes."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:prepare_costs"
    boundary:
      - variant: "kiln fuel choice (biomass, waste, gas)"
        rung: L0
        note: "cement in sector.endogenous_sectors, the method industry-routes-endogenous; the fuels compete on price, the CO2 constraint and the biomass limit"
      - variant: "carbon capture on cement kilns"
        rung: L0
        note: "the cement CC link is built with the switch while industry.process_emissions_cc is true (the default)"
      - variant: "endogenise cement only (keep steel exogenous)"
        rung: L1
        note: "sector.endogenous_sectors: [cement]"
      - variant: "different calcination factor"
        rung: L2
        note: "no knob: the kiln takes the process emission ratio of the Cement sector per country; scale it in cement_kiln_parameters (scripts/prepare_sector_network.py)"
      - variant: "kiln, finishing or capture capex, lifetime or fixed O&M"
        rung: L1
        note: "costs.overwrites {investment|lifetime|FOM|VOM: {cement dry clinker|cement finishing|cement carbon capture retrofit: value}}; the kiln capex combines dry clinker and finishing per t cement"
      - variant: "lower clinker ratio (blended cements)"
        rung: L2
        note: "a 'cement finishing,clinker-input' row in data/custom_costs.csv only lowers the kiln capex; lowering energy and process CO2 per t cement needs a scaling in cement_kiln_parameters (scripts/prepare_sector_network.py)"
      - variant: "different capture rate"
        rung: L3
        note: "row 'cement carbon capture retrofit,capture_rate' in data/custom_costs.csv"
      - variant: "different kiln heat intensity"
        rung: L2
        note: "the heat per t cement is the country's Cement fuel ratio of the exogenous case; change it in cement_kiln_parameters"
      - variant: "forbid a kiln fuel (e.g. no gas)"
        rung: L2
        note: "the three cement heat links are pass-throughs with no flag; drop the n.add call in the cement block of add_industry"
      - variant: "hydrogen or electricity firing the existing kiln heat bus"
        rung: L2
        note: "a further pass-through link onto '<node> cement heat' in the cement block of add_industry, like cement heat gas; the kiln capex stays the dry-clinker row"
      - variant: "clinker or cement transport between regions, or clinker imports"
        rung: L2
        note: "links between the cement buses in the cement block of add_industry; a clinker bus needs the kiln split into kiln and grinding links first; transport cost rows via data/custom_costs.csv (L3)"
      - variant: "existing grinding-only sites as separate grinding capacity"
        rung: L2
        note: "prepare_gem_database in build_industry_plants keeps integrated plants only (Plant type); grinding sites would need a separate grinding link in add_industry and add_existing_industry"
      - variant: "electric or hydrogen kiln as its own technology (electric calciner, plasma kiln)"
        rung: L5
        note: "a distinct process with its own capex, heat profile and calcination CO2 stream; no cost data or structure exists"
      - variant: "clinker substitution technologies (calcined clay, LC3, slag)"
        rung: L5
        note: "needs a clinker bus, supplementary-material buses, potentials and process chains"
    where:
      - change: "cement buses, load, kiln fuel links, kiln, vent and capture"
        anchor: "scripts/prepare_sector_network.py::add_industry (block under 'cement' in endogenous_sectors); kiln intensities in cement_kiln_parameters"
        provenance: "scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:cement_kiln_parameters"
      - change: "dropping the Cement sector from the demand file"
        anchor: "scripts/build_industrial_energy_demand_per_node.py (ENDOGENOUS_SUBSECTORS loop)"
        provenance: "scripts/build_industrial_energy_demand_per_node.py:ENDOGENOUS_SUBSECTORS"
      - change: "existing plants and their sizing"
        anchor: "scripts/build_industry_plants.py::prepare_gem_database; scripts/add_existing_baseyear.py::add_existing_industry"
        provenance: "scripts/build_industry_plants.py:prepare_gem_database; scripts/add_existing_baseyear.py:add_existing_industry"
      - change: "kiln, finishing and capture cost and intensity rows"
        anchor: "scripts/process_cost_data.py::prepare_costs; data/custom_costs.csv (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "GEM Global Cement and Concrete Tracker (retrieved, data/gem_gcct/)"
        required_for: "existing cement plants under myopic/perfect foresight (operating integrated plants, cement capacity, start year)"
        availability: "retrieved from the archive only (rule retrieve_gem_gcct, release july-2026-v1); read by build_industry_plants only with existing_capacities.industry_plants and foresight not overnight"
      - input: "industrial_production_<horizon>.csv (Cement, JRC-IDEES chain)"
        required_for: "the cement load"
        availability: "must be built (build_industrial_production_per_country_tomorrow, build_industrial_production_per_node)"
      - input: "cost rows: cement dry clinker, cement finishing, cement carbon capture retrofit"
        required_for: "kiln capex and lifetime, the capture retrofit"
        availability: "exists by default via retrieve_costs + rule process_cost_data (technology-data v0.16.0)"
      - input: "industry_sector_ratios_<horizon>.csv (Cement column per country)"
        required_for: "kiln heat, electricity and process emission per t cement"
        availability: "must be built (build_industry_sector_ratios_intermediate); passed to compose_network only when cement is listed"
      - input: "spatial solid biomass and gas buses, the non-sequestered HVC waste bus (add_waste), CO2 stored buses"
        required_for: "kiln fuels and the capture output"
        availability: "exists by default in sector runs"
