id: coal-power-plants
title: Coal and lignite power plants
summary: >
  Hard-coal- and lignite-fired power stations as dispatchable thermal
  generators — the existing fleet, optional expansion, coal with carbon
  capture, and phase-out mechanics.
when_to_use:
  - "add coal power plants"
  - "lignite / hard coal generation"
  - "coal phase-out / retire coal by year"
  - "coal in the power mix"
  - "existing coal fleet"
  - "coal with carbon capture / coal CC"
  - "ramping or unit commitment for coal plants"
  - "coal fuel price or efficiency"
  - "pypsa-eur carrier names: coal, lignite, coal CC"
  - "coal phase-out"
  - "retire coal plants / coal retirement year"
  - "lignite / brown coal / hard coal"
  - "model existing coal fleet"
  - "add a coal power station"
  - "coal capacity expansion / new coal build"
  - "carbon price on coal generation"
  - "emissions cap forcing coal offline"
  - "coal plant emissions / CO2 from coal"
  - "known in pypsa-eur as: Coal, coal, Coal marginal, Lignite, lignite, Lignite marginal"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d31ad9fa60c8fd9fe79e4647cde0a4a70eeb797c", date: "2026-10-09"}
    out_of_box:
      covers: >
        Electricity workflow: "coal" and "lignite" are in
        electricity.conventional_carriers, so the existing fleet from
        powerplantmatching (rule build_powerplants; "hard coal" is mapped to
        the "coal" carrier by carrier_dict in load_and_aggregate_powerplants)
        is attached by attach_conventional_generators as Generators with
        p_nom_min = p_nom, marginal cost = VOM + fuel/efficiency and CO2
        emissions from the coal/lignite cost rows (add_co2_emissions). Neither
        carrier is in electricity.extendable_carriers.Generator by default, so
        there is no coal expansion out of the box. Optional per-carrier unit
        commitment (data/unit_commitment.csv has coal and lignite columns:
        ramp limits 0.9/0.6, min up/down 8 h, start-up costs) via
        conventional.unit_commitment, and monthly dynamic coal fuel prices via
        conventional.dynamic_fuel_price. Myopic/perfect foresight sector runs:
        add_existing_baseyear rebuilds the existing coal and lignite fleet as
        fuel->AC Links with build_year and lifetime per grouping year
        (existing_capacities.conventional_carriers includes lignite, coal), so
        plants retire endogenously by age; under perfect foresight,
        compose_network additionally applies the national coal/lignite
        phase-out years configured in existing_capacities.phase_outs
        (apply_phase_outs in prepare_perfect_foresight.py; default list has
        DE, DK, FI, HU, SK, GR, IE, NL, RS at 2030 and further rows) — for
        overnight/myopic runs the list is ignored with a warning and
        retirement follows powerplant lifetimes. Sector option
        sector.coal_cc (default false) adds an extendable "coal CC" Link at
        every node — coal to electricity with capture (capture energetics from
        the "biomass CHP capture" cost row applied at coal CO2 intensity,
        captured CO2 to the co2 stored buses).
      mechanism: >
        rule build_powerplants -> rule compose_network, which calls
        add_electricity.py (attach_conventional_generators, costs from rule
        process_cost_data).
        Sector overnight: remove_elec_base_techs removes coal/lignite
        generators when building the sector network (the pypsa_eur keep-list
        holds only nuclear among conventional carriers) and
        sector.conventional_generation does NOT contain coal by default, so an
        overnight sector run has no coal power at all; adding "coal: coal" /
        "lignite: lignite" there makes add_generation create extendable Links
        from the EU-level coal/lignite buses (define_spatial keeps coal and
        lignite as single "EU coal"/"EU lignite" buses; only industrial coal
        demand can be regionalised via sector.regional_coal_demand). Fuel
        supply buses/stores/generators come from add_carrier_buses.
      not_covered: >
        No greenfield coal expansion in the default electricity workflow (add
        'coal'/'lignite' to extendable_carriers.Generator, candidates then only
        at buses with existing plants unless electricity.everywhere_powerplants
        is used). Overnight sector runs drop coal entirely by default — this is
        deliberate (decarbonisation focus) but often surprises users comparing
        against the electricity workflow. The "coal CC" link is greenfield
        new-build only; there is no retrofit of existing coal units to capture,
        no biomass co-firing, no coal-to-liquids/gasification, and no coal CHP
        (options["chp"]["fuel"] could take "coal" — see the
        combined-heat-and-power carrier card for that L1 route and its cost caveat).
        Coal and lignite fuel supply is a single European bus each — no mines,
        no domestic-vs-import split, no transport costs (see fossil-fuel-supply
        carrier card). The perfect-foresight phase-out table is hardcoded in Python,
        not config.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/add_electricity.py:load_and_aggregate_powerplants; scripts/prepare_sector_network.py:add_generation; scripts/prepare_sector_network.py:remove_elec_base_techs; scripts/prepare_perfect_foresight.py:apply_phase_outs; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing coal and lignite fleet (remove 'coal'/'lignite' to drop it)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: "Add 'coal'/'lignite' to allow expansion (default has neither); candidates only at buses with existing plants unless everywhere_powerplants is set."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "Pandas query on DateIn/DateOut — the config-level coal phase-out knob for the static fleet (e.g. exclude units with DateOut before the modelled year)."
        default: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"
        provenance: "config/config.default.yaml:powerplants_filter; scripts/build_powerplants.py:add_custom_powerplants"
      - key: conventional.unit_commitment
        effect: "true attaches committable attributes to coal/lignite (and OCGT/CCGT/nuclear) from data/unit_commitment.csv; linearized UC in the solver."
        default: "false"
        provenance: "config/config.default.yaml:unit_commitment; scripts/add_electricity.py:attach_conventional_generators"
      - key: conventional.dynamic_fuel_price
        effect: "true uses monthly World Bank coal price series for marginal cost instead of the static costs-row fuel price."
        default: "false"
        provenance: "config/config.default.yaml:dynamic_fuel_price; scripts/add_electricity.py:attach_conventional_generators"
      - key: sector.conventional_generation
        effect: "Add 'coal: coal' and/or 'lignite: lignite' to restore coal power in (overnight) sector runs as extendable Links at every node."
        default: "{OCGT: gas, CCGT: gas} — no coal entry"
        provenance: "config/config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:add_generation"
      - key: sector.coal_cc
        effect: "true adds extendable 'coal CC' Links (coal to power with capture; capture cost/energetics from the 'biomass CHP capture' row, sector.cc_fraction analogue is the capture_rate cost attribute) at every node in sector runs."
        default: "false"
        provenance: "config/config.default.yaml:coal_cc; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: existing_capacities.conventional_carriers
        effect: "Which fuels the myopic brownfield step carries over as aged Links — lignite and coal are included, so existing coal appears in myopic sector runs with age-based retirement."
        default: "[lignite, coal, oil, uranium]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - key: sector.regional_coal_demand
        effect: "true disaggregates industrial coal demand to nodes ('coal for industry' per node) instead of one EU bus; the coal fuel bus itself stays EU-level."
        default: "false"
        provenance: "config/config.default.yaml:regional_coal_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: solving.constraints.CCL
        effect: "true enforces per-country min/max capacity per carrier from data/agg_p_nom_minmax.csv — usable as a national coal cap or floor."
        default: "false"
        provenance: "config/config.default.yaml:CCL; scripts/solve_network.py:add_CCL_constraints"
      - key: costs.overwrites
        effect: "Override coal/lignite fuel price, efficiency, VOM etc. in prepare_costs (deprecated config route; prefer data/custom_costs.csv via costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "run with the existing coal/lignite fleet (electricity workflow)"
        rung: L0
        note: "default — coal and lignite in electricity.conventional_carriers"
      - variant: "full coal phase-out"
        rung: L1
        note: "remove 'coal'/'lignite' from electricity.conventional_carriers (elec) and from existing_capacities.conventional_carriers (myopic); overnight sector runs already exclude coal"
      - variant: "retire coal by a target year"
        rung: L1
        note: "electricity.powerplants_filter query on DateOut; in myopic foresight retirement is automatic from build_year+lifetime; perfect foresight applies existing_capacities.phase_outs (config list of carriers/countries/year — edit or extend it, L1)"
      - variant: "allow new coal build (electricity workflow)"
        rung: L1
        note: "add 'coal'/'lignite' to electricity.extendable_carriers.Generator; add fueltype 'Coal' to electricity.everywhere_powerplants for greenfield siting at all buses"
      - variant: "coal power in an overnight sector run"
        rung: L1
        note: "add 'coal: coal' (and 'lignite: lignite') to sector.conventional_generation"
      - variant: "coal with carbon capture (new build, sector run)"
        rung: L0
        note: "sector.coal_cc: true — extendable 'coal CC' links at every node"
      - variant: "unit commitment / ramping for coal"
        rung: L0
        note: "conventional.unit_commitment: true (values per carrier in data/unit_commitment.csv; changing them is L3)"
      - variant: "cap/floor national coal capacity"
        rung: L1
        note: "solving.constraints.CCL: true + coal/lignite rows in data/agg_p_nom_minmax.csv"
      - variant: "change coal fuel price / efficiency / CO2 intensity"
        rung: L1
        note: "costs.overwrites in config (fuel/efficiency/VOM...; CO2 intensity is not in the overwrite list — that needs data/custom_costs.csv, L3)"
      - variant: "retrofit existing coal units with capture or biomass co-firing"
        rung: L5
        note: "no retrofit machinery; 'coal CC' is greenfield-only — coupling it to existing plant capacity or adding co-firing shares needs new component logic and constraints"
      - variant: "regional coal supply (mines, import terminals, transport)"
        rung: L5
        note: "define_spatial pins coal/lignite to single EU buses; regionalising supply means reworking spatial.coal plus data for locations/capacities"
    where:
      - change: "fleet attachment, extendable candidates, UC, fuel prices"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (called from rule compose_network)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; rules/compose.smk:compose_network"
      - change: "'hard coal' -> coal carrier mapping and fleet construction"
        anchor: "scripts/add_electricity.py::load_and_aggregate_powerplants (carrier_dict); rule build_powerplants"
        provenance: "scripts/add_electricity.py:carrier_dict; rules/build_electricity.smk:build_powerplants"
      - change: "sector coal generation links (opt-in) and coal CC block"
        anchor: "scripts/prepare_sector_network.py::add_generation; ::add_h2_gas_infrastructure (coal CC suffix)"
        provenance: "scripts/prepare_sector_network.py:add_generation; scripts/prepare_sector_network.py:coal CC"
      - change: "myopic brownfield coal fleet with vintages"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - change: "national phase-out years from config (perfect foresight only)"
        anchor: "scripts/prepare_perfect_foresight.py::apply_phase_outs (config existing_capacities.phase_outs)"
        provenance: "scripts/prepare_perfect_foresight.py:apply_phase_outs; config/config.default.yaml:phase_outs"
      - change: "EU-level coal/lignite fuel buses"
        anchor: "scripts/prepare_sector_network.py::define_spatial (spatial.coal / spatial.lignite) and ::add_carrier_buses"
        provenance: "scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:add_carrier_buses"
    data_dependencies:
      - input: "powerplantmatching database (fueltypes Hard Coal, Lignite)"
        required_for: "existing fleet in electricity workflow and myopic brownfield"
        availability: "retrieved by the workflow; good European coverage"
      - input: "cost rows 'coal', 'lignite' (fuel, efficiency, CO2 intensity, VOM) and 'biomass CHP capture' (for coal CC)"
        required_for: "all coal economics and the CC variant"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "data/unit_commitment.csv (coal, lignite columns)"
        required_for: "conventional.unit_commitment"
        availability: "exists by default"
      - input: "co2 stored buses / CO2 sequestration chain"
        required_for: "sector.coal_cc captured CO2 output"
        availability: "exists by default in sector runs (add_co2_tracking)"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "CCL national capacity limits"
        availability: "template exists by default; coal rows user-authored"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        The existing hard-coal and lignite fleet is modelled by default: both
        "coal" and "lignite" are in electricity.conventional_carriers. Plants
        come from the powerplantmatching database (rule build_powerplants;
        Fueltypes "Hard Coal" and "Lignite" — "brown coal" strings are mapped to
        Lignite — with fuel_to_lifetime of 45 years each in
        configs/powerplantmatching_config.yaml). load_powerplants renames the
        "hard coal" carrier to "coal", and attach_conventional_generators adds
        the plants as non-extendable Generators aggregated by (bus, carrier,
        grouping_year), taking marginal/capital cost, efficiency and lifetime
        from the separate "coal" and "lignite" rows of the technology-data costs
        file. CO2 emission factors are attached to the coal and lignite carriers
        via _add_missing_carriers_from_costs (technology-data CO2 intensity:
        coal 0.3361, lignite 0.4069 tCO2/MWh_th), so any Co2L cap or Ep price in
        the opts wildcard prices/limits coal generation. Note the default
        scenario.opts is [Co2L-3h], i.e. an absolute CO2 cap
        (electricity.co2limit, a European default value) is already active out
        of the box. In sector-coupled runs,
        convert_conventional_generators_to_links turns coal/lignite generators
        into Links drawing from dedicated coal/lignite fuel buses with explicit
        CO2 flows to the atmosphere (mapping in sector.conventional_generation).
      mechanism: >
        Snakefile rule build_powerplants -> resources/<run>/powerplants.csv
        (electricity.powerplants_filter applied there); rule add_electricity
        runs scripts/add_electricity.py: load_powerplants fills missing
        retirement dates from technology lifetimes (fill_datein_dateout), then
        attach_conventional_generators attaches the fleet and any extendable
        conventional carriers. Costs and emission factors come from rule
        retrieve_cost_data / process_cost_data.py::load_costs. The CO2 cap is
        enforced in prepare_network.py::add_co2limit (Co2L in opts), a CO2
        price in add_emission_prices (Ep in opts).
      not_covered: >
        Coal and lignite are not extendable by default (not in
        electricity.extendable_carriers.Generator); when made extendable,
        candidate generators are only placed at buses that already host plants
        of that carrier (carrier_buses in attach_conventional_generators) — no
        greenfield siting. No unit-commitment/ramping detail, no minimum-load or
        start-up costs. No CCS retrofit of coal plants and no coal-to-biomass
        conversion pathway. No coal supply/mining or fuel-transport modelling —
        coal fuel is an unlimited commodity at a fixed price. The emission
        factor (CO2 intensity) has no config overwrite hook (unlike
        investment/fuel/VOM). Non-power coal use (e.g. "coal for industry"
        demand in sector runs, added in prepare_sector_network.py::add_industry)
        is not covered here — this carrier card is about power generation only.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; configs/powerplantmatching_config.yaml:fuel_to_lifetime"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing fleet per carrier — remove 'coal' and/or 'lignite' for an immediate full phase-out."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: >
          Pandas query applied to the powerplantmatching fleet (DateIn/DateOut
          columns) — the retirement lever: e.g. requiring DateOut >= 2035 drops
          all units retiring earlier; missing DateOut values are filled from
          build year + 45-year lifetime downstream.
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter; scripts/build_powerplants.py:powerplants_filter"
      - key: scenario.opts
        effect: >
          "Co2L" applies the absolute CO2 cap from electricity.co2limit;
          "Co2L0.1" scales electricity.co2base by the factor; "Ep" applies the
          CO2 price from costs.emission_prices — the main economic levers that
          push coal/lignite out of the dispatch and the capacity mix.
        default: "[Co2L-3h]"
        provenance: "config.default.yaml:opts; scripts/prepare_network.py:add_co2limit"
      - key: electricity.co2limit
        effect: "Absolute annual CO2 cap (t) used by a plain 'Co2L' opt — the comment marks it as a European default that needs regional adjustment."
        default: "7.75e+7"
        provenance: "config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: electricity.automatic_emission
        effect: >
          If true, the Co2L cap is instead derived from historical national
          emissions of the modelled countries in
          electricity.automatic_emission_base_year (emission_extractor), scaled
          by the numeric Co2L suffix — e.g. Co2L0.30 = 30% of base-year
          emissions.
        default: "false"
        provenance: "config.default.yaml:automatic_emission; scripts/prepare_network.py:emission_extractor"
      - key: costs.emission_prices
        effect: "CO2 price (currency/t) added to marginal costs of emitting generators when 'Ep' is in opts — a carbon-tax view of coal economics."
        default: "{co2: 0.}"
        provenance: "config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Add "coal" or "lignite" to allow capacity expansion — extendable
          generators are created only at buses with existing plants of that
          carrier.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' injects user rows from data/custom_powerplants.csv (Fueltype Hard Coal or Lignite) — e.g. plants missing from powerplantmatching."
        default: "false"
        provenance: "config.default.yaml:custom_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: >
          Country-wise min/max capacity limits per carrier (CSV at
          data/agg_p_nom_minmax.csv), enforced by add_CCL_constraints when "CCL"
          is in the opts wildcard — the hook for national coal build caps.
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "config.default.yaml:agg_p_nom_limits; scripts/solve_network.py:add_CCL_constraints"
      - key: costs.year
        effect: "Selects the technology-data cost year (costs_<year>.csv) from which the 'coal' and 'lignite' rows are taken."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; scripts/process_cost_data.py:load_costs"
      - key: costs.marginal_cost
        effect: >
          Per-technology marginal-cost overwrite applied at the end of
          load_costs (fuel/VOM/investment/FOM/efficiency/lifetime blocks are
          also read as overwrites) — e.g. set a domestic coal fuel price.
        default: "{} (commented examples in config.default.yaml)"
        provenance: "config.default.yaml:marginal_cost; scripts/process_cost_data.py:load_costs"
      - key: sector.conventional_generation
        effect: >
          Sector runs only: generator->fuel-carrier mapping used by
          convert_conventional_generators_to_links; removing the coal/lignite
          entries keeps them out of the conversion (default converts both into
          Links with explicit CO2 flows).
        default: "{OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass}"
        provenance: "config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - key: sector.coal.spatial_coal
        effect: "Sector runs: per-node coal fuel buses (true) vs a single 'Earth coal' bus (false); sector.lignite.spatial_lignite is the lignite analogue (default false -> one global lignite bus)."
        default: "true"
        provenance: "config.default.yaml:spatial_coal; scripts/prepare_sector_network.py:spatial_lignite"
    boundary:
      - variant: "run without coal and/or lignite (full phase-out of existing fleet)"
        rung: L0
        note: "remove 'coal' and/or 'lignite' from electricity.conventional_carriers"
      - variant: "retire coal plants by a target year (e.g. all offline by 2030)"
        rung: L1
        note: >
          tighten electricity.powerplants_filter (DateOut query); missing DateOut
          is filled as build year + 45 a (fuel_to_lifetime) via
          fill_datein_dateout, so the filter acts on every unit
      - variant: "emissions-cap or carbon-price driven coal reduction"
        rung: L1
        note: >
          Co2L / Co2L<factor> / Ep in scenario.opts with electricity.co2limit,
          electricity.co2base or costs.emission_prices.co2; set
          electricity.automatic_emission: true to anchor the cap to national
          base-year emissions instead of the European default number
      - variant: "allow new coal/lignite build at existing sites"
        rung: L1
        note: >
          add the carrier to electricity.extendable_carriers.Generator;
          expansion is restricted to buses already hosting plants of that
          carrier
      - variant: "cap coal capacity per country"
        rung: L1
        note: >
          electricity.agg_p_nom_limits + 'CCL' in scenario.opts; author rows in
          data/agg_p_nom_minmax.csv for carrier coal/lignite (include_existing:
          true to count the fleet against the cap)
      - variant: "change coal fuel price / investment / efficiency assumptions"
        rung: L1
        note: >
          load_costs reads per-attribute overwrite blocks from the costs config
          (fuel, VOM, investment, FOM, efficiency, lifetime, marginal_cost,
          capital_cost — commented templates sit in config.default.yaml); add
          e.g. costs.fuel: {coal: ...}
      - variant: "per-country coal availability derating (static p_max_pu)"
        rung: L1
        note: >
          a top-level `conventional:` config block (read via config.get in the
          Snakefile, absent from config.default.yaml) lets
          attach_conventional_generators set any generator attribute per
          carrier, scalar or from a per-country CSV under data/ — mirror of the
          pypsa-eur conventional block
      - variant: "add a missing or planned coal plant"
        rung: L3
        note: "row in data/custom_powerplants.csv with Fueltype Hard Coal or Lignite + electricity.custom_powerplants: merge"
      - variant: "change the coal/lignite CO2 emission factor"
        rung: L3
        note: >
          no config overwrite exists for CO2 intensity (the load_costs overwrite
          loops cover cost attributes only); edit the CO2 intensity rows of the
          costs CSV input (resources/<run>/costs_<year>_elec.csv source data)
      - variant: "greenfield coal at arbitrary buses"
        rung: L2
        note: >
          the extendable block in attach_conventional_generators derives
          carrier_buses from the existing fleet; small localised edit to place
          candidates at all buses (or seed sites via custom_powerplants, L3)
      - variant: "CCS retrofit of coal plants (proxy)"
        rung: L5
        note: >
          no retrofit machinery exists in the power workflow (sector runs only
          have coal gasification CC for hydrogen production); honest proxy: a
          new carrier with CCS-adjusted cost/emission rows plus bespoke
          component logic — bespoke Python either way
      - variant: "unit commitment / ramping / minimum load for coal"
        rung: L5
        note: >
          nothing sets committable or ramp limits on the fleet (the clustering
          aggregation strategies merely carry the attributes); bespoke settings
          in attach_conventional_generators plus a UC-capable solver setup
    where:
      - change: "fleet attachment + extendable conventional generators + carrier emission factors"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (emissions via _add_missing_carriers_from_costs)"
        provenance: "scripts/add_electricity.py:_add_missing_carriers_from_costs"
      - change: "fleet construction, fueltype matching, lifetimes, retirement filter"
        anchor: "Snakefile rule build_powerplants; configs/powerplantmatching_config.yaml (Hard Coal / Lignite in fuel_to_lifetime); scripts/add_electricity.py::fill_datein_dateout"
        provenance: "Snakefile:build_powerplants; configs/powerplantmatching_config.yaml:Lignite; scripts/add_electricity.py:fill_datein_dateout"
      - change: "CO2 cap and CO2 price from the opts wildcard"
        anchor: "scripts/prepare_network.py::add_co2limit / add_emission_prices / emission_extractor (rule prepare_network)"
        provenance: "scripts/prepare_network.py:add_emission_prices"
      - change: "cost assumptions / overwrites / CO2 intensity column"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data"
        provenance: "scripts/process_cost_data.py:load_costs"
      - change: "per-carrier attribute overrides (p_max_pu etc.) via top-level conventional config"
        anchor: "Snakefile rule add_electricity params (conventional=config.get); scripts/add_electricity.py::attach_conventional_generators conventional_config loop"
        provenance: "Snakefile:conventional=config.get; scripts/add_electricity.py:conventional_config"
      - change: "country-wise capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints (activated by 'CCL' in opts)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "sector runs: coal/lignite generators become fuel-bus Links with CO2 flows"
        anchor: "scripts/prepare_sector_network.py::convert_conventional_generators_to_links; spatial resolution via sector.coal.spatial_coal / sector.lignite.spatial_lignite"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - change: "non-power coal (pointer only, no card)"
        anchor: "scripts/prepare_sector_network.py::add_industry ('coal for industry' buses); residential/services coal shifted to electricity via sector.coal.shift_to_elec in build_base_energy_totals"
        provenance: "scripts/prepare_sector_network.py:coal for industry; scripts/build_base_energy_totals.py:shift_coal_to_elec"
    data_dependencies:
      - input: "powerplantmatching database (Hard Coal / Lignite fueltypes)"
        required_for: "existing fleet and the buses where extendable coal/lignite can be placed"
        availability: "region-dependent — global coverage varies; verify the fleet appears in resources/<run>/powerplants.csv for the target countries"
      - input: "costs rows 'coal' and 'lignite' in retrieved technology-data (costs.technology_data_version)"
        required_for: "capital/marginal cost, efficiency, lifetime and CO2 intensity (lignite has a full separate row, though its investment cost equals hard coal's in technology-data)"
        availability: "exists by default via rule retrieve_cost_data"
      - input: "data/custom_powerplants.csv"
        required_for: "adding plants missing from powerplantmatching"
        availability: "template exists by default; rows user-authored"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps (CCL)"
        availability: "template exists by default; rows must be authored for coal/lignite"
      - input: "per-country attribute CSV under data/ (only for the conventional-block derating variant)"
        required_for: "country-specific p_max_pu or similar attribute overrides"
        availability: "absent — user-authored; the mechanism maps country -> value onto generator buses"
      - input: "historical national emissions (automatically downloaded when electricity.automatic_emission is true)"
        required_for: "base-year-anchored Co2L caps"
        availability: "must be built — fetched at runtime by download_emission_data in prepare_network.py"
