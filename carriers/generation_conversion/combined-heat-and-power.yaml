id: combined-heat-and-power
title: Combined heat and power (CHP) plants
summary: >
  Cogeneration plants that burn a fuel (gas, solid biomass, or other
  configured fuels) to produce electricity and useful heat simultaneously,
  feeding district heating networks or building-level heat, optionally with
  carbon capture.
when_to_use:
  - "combined heat and power"
  - "CHP"
  - "cogeneration"
  - "gas CHP for district heating"
  - "biomass CHP"
  - "CHP with carbon capture / CHP CC"
  - "micro CHP in buildings"
  - "heat and power from the same plant"
  - "back-pressure / extraction steam plant"
  - "existing CHP fleet"
  - "pypsa-eur carrier names: urban central gas CHP, urban central gas CHP CC, urban central solid biomass CHP, urban central solid biomass CHP CC, micro gas CHP, waste CHP"
  - "waste heat from power stations for heating"
  - "known in pypsa-eur as: CHP, CHP CC, CHP heat, CHP electric, urban central gas CHP, urban central gas CHP CC, urban central solid biomass CHP, urban central solid biomass CHP CC"
models:
  - model: pypsa-eur
    version_anchor: {ref: "a6c45e5a2d926ba9a5566cba24d905cff9f89939", date: "2026-09-09"}
    out_of_box:
      covers: >
        Sector runs build extendable greenfield CHP by default. With
        sector.heating and sector.chp.enable true, add_heat adds — at every
        node holding an "urban central heat" bus — one "urban central {fuel}
        CHP" Link per non-biomass fuel in sector.chp.fuel (default fuels:
        solid biomass, gas): bus0 = the fuel's spatial node, bus1 =
        electricity, bus2 = urban central heat, bus3 = co2 atmosphere.
        Electric efficiency, VOM, fixed cost, lifetime and the back-pressure
        coefficient c_b come from the "central gas CHP" cost row, with heat
        output efficiency2 = efficiency / c_b. A parallel "urban central
        {fuel} CHP CC" Link is ALWAYS added alongside (no separate global cc
        switch in this model — capture energetics from the "biomass CHP
        capture" row applied at the fuel's CO2 intensity, captured CO2 to the
        co2 stored buses). Solid biomass CHP is added in add_biomass ("urban
        central solid biomass CHP" + CC variant, cost rows "central solid
        biomass CHP" and "central solid biomass CHP CC" with efficiency-heat),
        gated by sector.biomass, sector.chp.enable and "solid biomass" in
        sector.chp.fuel. Building-level "micro gas CHP" Links (cost row
        "micro CHP", sector.chp.micro_chp default false) land on the four
        decentral heat systems, and insert_electricity_distribution_grid /
        insert_gas_distribution_costs re-point them to the low-voltage bus and
        add gas distribution costs. Waste-burning CHP ("waste CHP") exists as
        a separate chain — see the waste-to-energy carrier card. Existing fleet:
        with myopic/perfect foresight, add_existing_baseyear maps the
        powerplantmatching "Bioenergy" fleet to brownfield "urban central
        solid biomass CHP" Links WITH a heat output at district-heating nodes
        — a genuine existing-CHP representation for biomass (gas/coal CHP
        plants are rebuilt power-only as OCGT/CCGT/coal links).
      mechanism: >
        rule compose_network runs scripts/prepare_sector_network.py:
        add_heat creates heat buses per node (urban central buses exist where
        the district heating share from build_district_heat_share is nonzero)
        and adds the gas/other-fuel CHP and micro CHP; add_biomass adds the
        solid biomass CHP pair at nodes whose "urban central heat" bus exists.
        Costs come from the processed technology-data file (rule
        process_cost_data). Myopic brownfield CHP enters via rule
        add_existing_baseyear (add_power_capacities_installed_before_baseyear,
        Fueltype mapping "Bioenergy": "urban central solid biomass CHP").
      not_covered: >
        Operation is fixed on the back-pressure line: each CHP is one
        multilink whose electricity and heat outputs are rigid multiples of
        fuel input — no condensing/extraction flexibility.
        solve_network.py::add_chp_constraints (back-pressure + iso-fuel-line
        machinery expecting paired links named with "electric"/"heat" and a
        p_nom_ratio attribute) is DEAD CODE at this ref: it is defined but
        never called from extra_functionality or anywhere else, and no links
        matching its name filters are ever created. The generic fuel loop
        prices EVERY non-biomass fuel with the "central gas CHP" cost row —
        adding "coal" or "oil" to sector.chp.fuel works mechanically (fuel bus
        + that fuel's CO2 intensity) but with gas-CHP economics; there are no
        dedicated coal/oil/H2-fuel-cell CHP cost rows wired. No CC on micro
        CHP. Existing gas/coal CHP plants lose their heat side (rebuilt as
        power-only links in add_existing_baseyear); only Bioenergy keeps heat.
        In the electricity-only workflow there is no heat demand, so
        powerplantmatching's CHP flag has no effect there.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:add_biomass; scripts/solve_network.py:add_chp_constraints; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear; scripts/prepare_sector_network.py:urban central {fuel} CHP"
    levers:
      - key: sector.chp.enable
        effect: "Master switch for central CHP (and gate for micro CHP); false removes gas/other-fuel CHP in add_heat and the solid biomass CHP block in add_biomass."
        default: "true"
        provenance: "config/config.default.yaml:chp; scripts/prepare_sector_network.py:add_heat"
      - key: sector.chp.fuel
        effect: "List of CHP fuels. 'solid biomass' routes to add_biomass with its own cost rows; every other entry (default 'gas'; 'coal'/'oil'/'lignite' also possible since each has a spatial namespace) gets a CHP + CHP CC pair priced with the 'central gas CHP' row but the fuel's own bus and CO2 intensity."
        default: "[solid biomass, gas]"
        provenance: "config/config.default.yaml:chp; scripts/prepare_sector_network.py:urban central {fuel} CHP"
      - key: sector.chp.micro_chp
        effect: "true adds building-level 'micro gas CHP' Links on the residential/services rural and urban decentral heat buses (cost row 'micro CHP')."
        default: "false"
        provenance: "config/config.default.yaml:micro_chp; scripts/prepare_sector_network.py:micro gas CHP"
      - key: sector.heating
        effect: "Gates add_heat entirely — false removes all heat buses and with them every CHP."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.biomass
        effect: "Gates add_biomass — false removes solid biomass CHP (and its CC variant)."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.district_heating.potential
        effect: "Maximum district heating share of urban heat; with .progress per horizon it determines which nodes get an 'urban central heat' bus — central CHP is only built at those nodes."
        default: "0.6 (progress ramps 0.0 in 2020 to 1.0 in 2050)"
        provenance: "config/config.default.yaml:district_heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.electricity_distribution_grid
        effect: "true relocates micro CHP electricity output to the low voltage bus (insert_electricity_distribution_grid)."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: sector.gas_distribution_grid
        effect: "true adds gas distribution grid capital cost to micro gas CHP (and decentral gas boilers)."
        default: "true"
        provenance: "config/config.default.yaml:gas_distribution_grid; scripts/prepare_sector_network.py:insert_gas_distribution_costs"
      - key: existing_capacities.conventional_carriers
        effect: "Myopic: which fuels enter the brownfield step — Bioenergy-fleet CHP arrives regardless via the powerplant mapping; this key controls the power-only fossil vintages built beside it."
        default: "[lignite, coal, oil, uranium]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - key: costs.overwrites
        effect: "Override CHP investment/VOM/efficiency/lifetime per technology in prepare_costs; note c_b and efficiency-heat are NOT in the overwrite attribute list — those need data/custom_costs.csv (costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "run without any CHP"
        rung: L0
        note: "sector.chp.enable: false removes central and micro CHP in one flip"
      - variant: "building-level micro gas CHP"
        rung: L0
        note: "sector.chp.micro_chp: true (with chp.enable true)"
      - variant: "gas-only CHP (drop biomass CHP)"
        rung: L1
        note: "sector.chp.fuel: [gas]"
      - variant: "coal or oil CHP"
        rung: L1
        note: "append 'coal'/'oil' to sector.chp.fuel — mechanically works (own fuel bus + CO2 intensity + CC variant) but is priced with the 'central gas CHP' cost row; correct economics need a code edit to key the costs.at lookups per fuel (L2) plus cost rows (L3)"
      - variant: "CHP without the carbon-capture variants"
        rung: L2
        note: "no config switch — the CC add calls in add_heat and add_biomass are unconditional; comment them out or filter afterwards (contrast: waste CHP CC and coal CC DO have flags)"
      - variant: "control where central CHP can be built"
        rung: L1
        note: "CHP follows the district heating footprint — tune sector.district_heating.potential/progress (see district-heating carrier card); no direct per-node CHP siting key"
      - variant: "override CHP costs/efficiencies"
        rung: L1
        note: "costs.overwrites for investment/VOM/efficiency/lifetime; c_b, efficiency-heat and capture attributes only via data/custom_costs.csv rows (L3)"
      - variant: "cap or force CHP capacity at a node"
        rung: L2
        note: "no per-carrier link capacity key; set p_nom_max/p_nom_min in the n.add calls in add_heat / add_biomass"
      - variant: "represent the existing fossil CHP fleet with real heat output"
        rung: L5
        note: "only Bioenergy maps to a heat-producing brownfield CHP in add_existing_baseyear; gas/coal CHPs become power-only links — wiring them to heat buses with vintages is bespoke (the biomass branch there is the template)"
      - variant: "flexible extraction/condensing operation (variable heat-to-power ratio)"
        rung: L5
        note: "requires splitting each CHP into paired electric/heat links carrying p_nom_ratio and c_b AND re-wiring the orphaned add_chp_constraints into extra_functionality in solve_network.py — the constraint code exists but is never called and nothing it matches is ever built"
      - variant: "hydrogen / fuel-cell CHP"
        rung: L5
        note: "no such link; new multilink in add_heat (H2 bus0, elec + urban central heat out) plus cost rows; the existing 'H2 Fuel Cell' link is electricity-only (its waste heat only feeds district heating via sector.use_fuel_cell_waste_heat, see add_waste_heat)"
    where:
      - change: "central CHP + CC creation for gas and other configured fuels"
        anchor: "scripts/prepare_sector_network.py::add_heat (options['chp'] loop over chp fuels, urban central heat systems)"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:urban central {fuel} CHP CC"
      - change: "solid biomass CHP + CC creation"
        anchor: "scripts/prepare_sector_network.py::add_biomass (urban central heat bus block, key 'central solid biomass CHP')"
        provenance: "scripts/prepare_sector_network.py:central solid biomass CHP"
      - change: "micro gas CHP creation and its grid re-pointing / gas distribution cost"
        anchor: "scripts/prepare_sector_network.py micro gas CHP block; ::insert_electricity_distribution_grid; ::insert_gas_distribution_costs"
        provenance: "scripts/prepare_sector_network.py:micro gas CHP; scripts/prepare_sector_network.py:insert_gas_distribution_costs"
      - change: "dormant CHP operational constraint machinery (never called)"
        anchor: "scripts/solve_network.py::add_chp_constraints (would need wiring into ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_chp_constraints; scripts/solve_network.py:extra_functionality"
      - change: "brownfield biomass CHP with heat output (myopic)"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear (Bioenergy branch)"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - change: "CHP cost rows and overwrite hooks"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs; data/custom_costs.csv (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:prepare_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "cost rows 'central gas CHP' (incl. c_b), 'central solid biomass CHP' (+' CC', incl. efficiency-heat), 'biomass CHP capture', 'micro CHP'"
        required_for: "all CHP variants (costs, efficiencies, capture energetics)"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "urban central heat buses (district heat share per node from build_district_heat_share)"
        required_for: "central CHP placement"
        availability: "must be built (heat workflow); nonzero wherever district heating share > 0 given potential 0.6 and the progress schedule"
      - input: "per-node gas buses with supply (gas network chain) / spatial solid biomass nodes with potentials"
        required_for: "CHP fuel inputs"
        availability: "exists by default in sector runs (build_gas_network chain; build_biomass_potentials)"
      - input: "co2 stored buses / sequestration chain"
        required_for: "the CC variants' captured CO2"
        availability: "exists by default (add_co2_tracking)"
      - input: "powerplantmatching Bioenergy fleet + existing_heating distribution"
        required_for: "brownfield biomass CHP in myopic runs"
        availability: "retrieved/built by the workflow (add_existing_baseyear inputs of rule compose_network)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Sector-coupled runs (rule prepare_sector_network) build extendable
        greenfield CHP by default. With sector.enable.heat and sector.chp true,
        add_heat adds an "urban central gas CHP" Link at every node that has an
        "urban central heat" bus: bus0 = spatial gas node, bus1 = electricity,
        bus2 = urban central heat, bus3 = co2 atmosphere; electric efficiency,
        VOM, fixed cost, lifetime and the back-pressure coefficient c_b come
        from the "central gas CHP" row of the sector costs file, with heat
        output efficiency2 = efficiency / c_b. If sector.cc is true a parallel
        "urban central gas CHP CC" Link is added with bus4 = co2 stored node;
        capture rate and the electricity/heat penalties of capture are taken
        from the "biomass CHP capture" cost row applied at the gas CO2
        intensity. With sector.enable.biomass, add_biomass adds an extendable
        "urban central solid biomass CHP" Link (bus0 = spatial solid biomass
        node, outputs to electricity and urban central heat, cost row "central
        solid biomass CHP" with efficiency-heat) at the same district-heating
        nodes, plus an "urban central solid biomass CHP CC" variant when
        sector.cc is true. With sector.micro_chp (default false), building-level
        "micro gas CHP" Links (cost row "micro CHP") are added on the urban
        decentral and rural heat buses, and add_electricity_distribution_grid
        re-points their electricity output to the low voltage bus when
        sector.electricity_distribution_grid is true.
      mechanism: >
        Snakefile rule prepare_sector_network (params sector_options =
        config["sector"]) runs scripts/prepare_sector_network.py: add_heat
        creates the heat buses per node from create_nodes_for_heat_sector
        (urban central buses exist where the district heating fraction is
        nonzero) and adds gas CHP / gas CHP CC / micro gas CHP; add_biomass
        adds the solid biomass CHP variants. Cost rows come from
        resources/<run>/costs_<planning_horizons>_sec.csv produced by rule
        process_cost_data (scope "sec") from the retrieved technology-data.
      not_covered: >
        No existing CHP fleet: powerplantmatching classifies plants with
        Set=CHP (target_sets in configs/powerplantmatching_config.yaml), but
        downstream they are treated as ordinary power-only generators — in
        electricity-only runs no heat output exists at all, and in sector runs
        convert_conventional_generators_to_links turns them into fuel-to-
        electricity Links with no heat bus. All CHP capacity is therefore
        greenfield and extendable (p_nom_extendable=True), with no brownfield
        p_nom. Only gas and solid biomass fuels — no coal, oil, waste-to-energy
        or hydrogen/fuel-cell CHP. Operation is fixed on the back-pressure
        line: each CHP is a single multilink whose electricity and heat outputs
        are rigid multiples (efficiency and efficiency2) of the fuel input, so
        there is no condensing/extraction flexibility. solve_network.py does
        call add_chp_constraints when sector.chp is true, but its filters
        require link names containing "urban central" plus "CHP" plus
        "electric" or "heat" — none of the links actually created match
        (they are named e.g. "urban central gas CHP"), and the referenced
        n.links.p_nom_ratio attribute is never set, so the back-pressure /
        iso-fuel-line constraint machinery is dormant dead code at this ref.
        The sector paper's "CHP (CC)" technologies do exist in code (gas and
        biomass CC variants), but any implied flexible heat-power operation
        does not.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:add_biomass; scripts/solve_network.py:add_chp_constraints"

    levers:
      - key: sector.chp
        effect: >
          Master switch: adds "urban central gas CHP" (+ CC) in add_heat and
          gates the solid biomass CHP block in add_biomass; also gates the
          (dormant) add_chp_constraints call in solve_network.py.
        default: "true"
        provenance: "config.default.yaml:chp; scripts/prepare_sector_network.py:urban central gas CHP"
      - key: sector.cc
        effect: >
          Adds the carbon-capture variants "urban central gas CHP CC" and
          "urban central solid biomass CHP CC" (capture energetics from the
          "biomass CHP capture" cost row, captured CO2 to the co2 stored bus).
        default: "true"
        provenance: "config.default.yaml:cc; scripts/prepare_sector_network.py:biomass CHP capture"
      - key: sector.micro_chp
        effect: >
          Adds building-level "micro gas CHP" Links on urban decentral and
          rural heat buses (requires sector.chp true; cost row "micro CHP").
        default: "false"
        provenance: "config.default.yaml:micro_chp; scripts/prepare_sector_network.py:micro gas CHP"
      - key: sector.enable.heat
        effect: "Gates add_heat entirely — false removes all heat buses and with them gas/micro CHP."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_heat"
      - key: sector.enable.biomass
        effect: "Gates add_biomass — false removes solid biomass CHP (and its CC variant)."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.district_heating.potential
        effect: >
          Maximum urban heat share served by district heating; together with
          .progress it determines which nodes get an "urban central heat" bus —
          and central CHP is only built at those nodes (see the
          district-heating carrier card for the full mechanism).
        default: "0.3"
        provenance: "config.default.yaml:district_heating; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: sector.solid_biomass_potential
        effect: "TWh/a solid biomass available for the whole modelled area — the fuel cap that limits biomass CHP output."
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.electricity_distribution_grid
        effect: "If true, micro gas CHP electricity output is moved to the low voltage bus."
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: costs.year
        effect: "Selects the technology-data cost year from which the CHP cost rows (central gas CHP, central solid biomass CHP, biomass CHP capture, micro CHP) are taken."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; scripts/process_cost_data.py:load_costs"

    boundary:
      - variant: "run without any CHP"
        rung: L0
        note: "sector.chp: false removes gas, biomass and micro CHP in one flip"
      - variant: "CHP without carbon capture variants"
        rung: L0
        note: "sector.cc: false (also disables CC on other conversion technologies — it is a global switch)"
      - variant: "building-level micro gas CHP"
        rung: L0
        note: "sector.micro_chp: true (with sector.chp true); lands on urban decentral and rural heat buses"
      - variant: "control where central CHP can be built"
        rung: L1
        note: >
          CHP follows the district heating footprint: tune
          sector.district_heating.potential / progress (cross-reference the
          district-heating carrier card; CHP is only placed at urban central heat
          buses created by create_nodes_for_heat_sector)
      - variant: "override CHP investment / VOM / efficiency / lifetime"
        rung: L1
        note: >
          load_costs in process_cost_data.py applies per-technology overwrites
          from the costs config for investment, lifetime, FOM, VOM, efficiency
          and fuel (the overwrite blocks are present but commented out in
          config.default.yaml) — e.g. costs.VOM: {central gas CHP: ...}
      - variant: "change the heat-to-power ratio (c_b), efficiency-heat or capture parameters"
        rung: L3
        note: >
          c_b, efficiency-heat and the biomass CHP capture attributes are NOT
          in the load_costs overwrite list; supply an edited cost file (set
          enable.retrieve_cost_data: false and edit data/costs.csv, or patch
          the retrieved costs CSV) with changed rows
      - variant: "cap or force CHP capacity at a node"
        rung: L2
        note: >
          no config key exists for link capacity limits per carrier; set
          p_nom_max / p_nom_min in the n.madd calls for the CHP links in
          add_heat / add_biomass (small localised edit)
      - variant: "represent the existing CHP fleet with actual heat output"
        rung: L5
        note: >
          powerplantmatching Set=CHP information is discarded downstream
          (plants become power-only generators, then fuel-to-electricity links
          via convert_conventional_generators_to_links); wiring existing plants
          to heat buses with brownfield p_nom is bespoke component logic plus
          a siting/matching exercise against district heating nodes
      - variant: "CHP on other fuels (coal, oil, waste, H2 fuel cell CHP)"
        rung: L5
        note: >
          no such links exist; new multilink logic in prepare_sector_network
          plus technology-data cost rows (L3) would be needed
      - variant: "flexible extraction/condensing operation (variable heat-to-power ratio)"
        rung: L5
        note: >
          requires restructuring each CHP from one multilink into paired
          electric/heat links carrying p_nom_ratio and c_b attributes so the
          dormant add_chp_constraints (back-pressure and iso-fuel-line) in
          solve_network.py actually binds — its name filters expect that
          pypsa-eur-style split which prepare_sector_network never creates
    where:
      - change: "gas CHP, gas CHP CC and micro gas CHP creation"
        anchor: "scripts/prepare_sector_network.py::add_heat (options['chp'] branch, name == 'urban central')"
        provenance: "scripts/prepare_sector_network.py:urban central gas CHP"
      - change: "solid biomass CHP and biomass CHP CC creation"
        anchor: "scripts/prepare_sector_network.py::add_biomass (AC buses with district heating block)"
        provenance: "scripts/prepare_sector_network.py:central solid biomass CHP"
      - change: "which nodes get an urban central heat bus (CHP siting)"
        anchor: "scripts/prepare_sector_network.py::create_nodes_for_heat_sector"
        provenance: "scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - change: "dormant CHP operational constraints (back-pressure, iso-fuel line)"
        anchor: "scripts/solve_network.py::add_chp_constraints (called when sector.chp is true)"
        provenance: "scripts/solve_network.py:add_chp_constraints"
      - change: "CHP cost rows and overwrite hooks"
        anchor: "scripts/process_cost_data.py::load_costs; Snakefile rule process_cost_data (scope 'sec' output consumed by prepare_sector_network)"
        provenance: "scripts/process_cost_data.py:load_costs; Snakefile:process_cost_data"
      - change: "micro CHP relocation to the low voltage bus"
        anchor: "scripts/prepare_sector_network.py::add_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "existing fleet CHP tagging (currently unused downstream)"
        anchor: "configs/powerplantmatching_config.yaml target_sets; scripts/prepare_sector_network.py::convert_conventional_generators_to_links"
        provenance: "configs/powerplantmatching_config.yaml:target_sets; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"

    data_dependencies:
      - input: "cost rows 'central gas CHP' (incl. c_b), 'central solid biomass CHP' (incl. efficiency-heat), 'biomass CHP capture', 'micro CHP' in costs_<planning_horizons>_sec.csv"
        required_for: "all CHP variants (costs, efficiencies, capture energetics)"
        availability: "exists by default via rule retrieve_cost_data + process_cost_data"
      - input: "urban central heat buses (district heating fraction > 0, from heat demand + urban population layouts)"
        required_for: "central gas and biomass CHP placement"
        availability: "must be built (heat workflow); nonzero by default since sector.district_heating.potential=0.3 with progress=1 — see the district-heating carrier card for the underlying data chain"
      - input: "spatial gas buses (sector.gas.spatial_gas) with gas supply"
        required_for: "gas CHP and micro CHP fuel input"
        availability: "exists by default in the sector workflow"
      - input: "solid biomass supply (sector.solid_biomass_potential, spatial biomass nodes)"
        required_for: "biomass CHP fuel"
        availability: "config-set scalar potential for the whole region by default"
      - input: "co2 stored buses / CO2 network (add_co2)"
        required_for: "CC variants' captured-CO2 output"
        availability: "exists by default (add_co2 always runs in prepare_sector_network)"
