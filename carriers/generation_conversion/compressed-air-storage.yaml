id: compressed-air-storage
title: Compressed-air storage (CAES)
summary: Compressed-air energy storage — electricity stored as pressurised air (typically in caverns), here as adiabatic CAES.
when_to_use:
  - "compressed air storage / CAES"
  - "adiabatic CAES / A-CAES"
  - "cavern-based electricity storage (non-hydrogen)"
  - "air storage in salt caverns"
  - "pypsa-eur config token: pair"
  - "known in pypsa-eur as: pair, pair charger, pair discharger"
models:
  - model: pypsa-eur
    version_anchor: {ref: "6128bf7effbe7243bcc46b2770d04cebe45613a5", date: "2026-10-26"}
    out_of_box:
      covers: >
        Wired but dormant — unlike pypsa-earth, pypsa-eur ships a first-class
        adiabatic-CAES token spelled "pair" (pressurised air): STORE_LOOKUP in
        scripts/add_electricity.py maps "pair" to the
        "Compressed-Air-Adiabatic-store" and "Compressed-Air-Adiabatic-bicharger"
        cost rows, and electricity.max_hours ships pair: 24. It is NOT in
        either default extendable-carriers list, so no CAES appears in a
        default run: adding "pair" to
        electricity.extendable_carriers.StorageUnit yields a fixed-24h
        StorageUnit at every bus (combined capital cost synthesised in
        prepare_costs as 24 * store + bicharger; the bicharger efficiency is
        applied on both store and dispatch); adding it to .Store yields Bus +
        Store + "pair charger"/"pair discharger" Links.
      mechanism: >
        rule compose_network runs scripts/add_electricity.py:
        attach_storageunits / attach_stores loop over the configured carrier
        lists filtered through get_available_storage_carriers (intersection
        with STORE_LOOKUP); rule process_cost_data
        (scripts/process_cost_data.py::prepare_costs, helper costs_for_storage)
        builds the combined "pair" cost row from the electricity.max_hours
        loop.
      not_covered: >
        Caveat on the Store representation: as a bicharger technology the full
        bicharger cost lands on the charger link (discharge_capital_cost =
        0.0), and add_battery_constraints in solve_network.py only couples
        links named "battery charger"/"battery discharger" — a "pair
        discharger" link is therefore free and unconstrained; prefer the
        StorageUnit representation or add a coupling constraint (L2). CAES is
        siting-free in the model: candidates appear at EVERY bus with no
        geological (cavern) potential cap — no CAES-cavern dataset exists in
        the repo (the H2 salt-cavern chain, rule build_salt_cavern_potentials,
        is the in-repo template for adding one). No diabatic (gas co-fired)
        CAES, no heat-store coupling of the adiabatic cycle. No presence in
        sector-coupled runs (elec-network chemistry stores are stripped by
        patch_electricity_network and not re-added).
      provenance: "scripts/add_electricity.py:STORE_LOOKUP; scripts/add_electricity.py:Compressed-Air-Adiabatic-store; scripts/add_electricity.py:attach_storageunits; scripts/process_cost_data.py:costs_for_storage; scripts/solve_network.py:add_battery_constraints; scripts/prepare_sector_network.py:remove_elec_base_techs"
    levers:
      - key: electricity.extendable_carriers.StorageUnit
        effect: "Add 'pair' for a fixed-duration (max_hours.pair = 24 h) adiabatic-CAES StorageUnit at every bus — the recommended activation."
        default: "[] (empty)"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_storageunits"
      - key: electricity.extendable_carriers.Store
        effect: "Add 'pair' for the Store+Links representation with endogenous duration (see the free-discharger caveat in not_covered)."
        default: "[battery, H2]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_stores"
      - key: electricity.max_hours.pair
        effect: "Duration (h) of the CAES StorageUnit and of its synthesised combined cost row."
        default: "24"
        provenance: "config/config.default.yaml:max_hours; scripts/process_cost_data.py:costs_for_storage"
      - key: costs.overwrites
        effect: "Override the Compressed-Air-Adiabatic rows' investment/efficiency/lifetime (or rows in data/custom_costs.csv via costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "adiabatic CAES as a 24h StorageUnit at every bus"
        rung: L1
        note: "add 'pair' to electricity.extendable_carriers.StorageUnit — max_hours and cost rows already wired"
      - variant: "CAES with endogenous duration (Store+Links)"
        rung: L1
        note: "add 'pair' to extendable_carriers.Store; fix the uncoupled free discharger first (next variant)"
      - variant: "couple pair charger and discharger sizing"
        rung: L2
        note: "generalise the name filter in add_battery_constraints to match non-battery bicharger chemistries"
      - variant: "change duration or costs"
        rung: L1
        note: "electricity.max_hours.pair + costs.overwrites / data/custom_costs.csv"
      - variant: "cavern-constrained CAES (regional e_nom_max potentials)"
        rung: L3
        note: "no CAES-cavern dataset exists; supply one and cap the Store/StorageUnit per region — the salt-cavern chain (scripts/build_salt_cavern_potentials.py + the e_nom_max use in add_h2_gas_infrastructure) is the in-repo pattern, and requires the Store representation (StorageUnits have no e_nom_max)"
      - variant: "CAES in sector-coupled runs"
        rung: L2
        note: "add a Bus/Store/charger/discharger block in prepare_sector_network (home battery block is the template)"
      - variant: "diabatic CAES with gas co-firing or explicit heat-store coupling"
        rung: L5
        note: "multi-input link topology for storage has no template; bespoke component logic"
    where:
      - change: "carrier activation and component creation"
        anchor: "scripts/add_electricity.py::attach_storageunits / ::attach_stores + STORE_LOOKUP 'pair' entry (rule compose_network)"
        provenance: "scripts/add_electricity.py:attach_stores; scripts/add_electricity.py:STORE_LOOKUP"
      - change: "combined cost row synthesis"
        anchor: "scripts/process_cost_data.py::prepare_costs (costs_for_storage loop over electricity.max_hours)"
        provenance: "scripts/process_cost_data.py:costs_for_storage"
      - change: "charger/discharger coupling constraint"
        anchor: "scripts/solve_network.py::add_battery_constraints (name filter to generalise)"
        provenance: "scripts/solve_network.py:add_battery_constraints"
      - change: "template for geologically capped storage potentials"
        anchor: "scripts/build_salt_cavern_potentials.py + e_nom_max use in scripts/prepare_sector_network.py::add_h2_gas_infrastructure"
        provenance: "scripts/build_salt_cavern_potentials.py:salt_cavern_potential_by_region; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
    data_dependencies:
      - input: "cost rows 'Compressed-Air-Adiabatic-store' and 'Compressed-Air-Adiabatic-bicharger' in the technology-data costs file"
        required_for: "both CAES representations"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data (verified in a locally built processed costs file)"
      - input: "CAES cavern/geology potential data per region"
        required_for: "cavern-constrained CAES"
        availability: "absent — must be provided by the user (H2 salt-cavern dataset covers hydrogen only)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Nothing CAES-specific — grounded absence: no CAES/compressed-air carrier,
        config key, or code branch exists in scripts/ or config.default.yaml. The
        generic Store + charger/discharger Links machinery in attach_stores could
        represent it, but only "H2" and "battery" branches exist.
      mechanism: >
        Not built by any rule. Entry points are attach_stores / attach_storageunits
        in scripts/add_extra_components.py (rule add_extra_components), with
        hardcoded carrier branches and lookup_store / lookup_dispatch dicts limited
        to H2 and battery. The retrieved technology-data v0.13.2 costs file ships
        "Compressed-Air-Adiabatic-store" and "Compressed-Air-Adiabatic-bicharger"
        rows (verified in a locally built costs_2030_elec.csv) — cost data exists
        upstream, unconsumed. For geologically constrained siting, the H2 salt-cavern
        block in add_hydrogen (scripts/prepare_sector_network.py) is the in-repo
        template: country potentials from a CSV mapped to per-node e_nom_max.
      not_covered: >
        Everything technology-specific: carrier, cost mapping, cavern siting
        constraints, heat integration of adiabatic CAES.
      provenance: scripts/add_extra_components.py:attach_stores
    levers:
      - key: electricity.extendable_carriers.Store
        effect: Carrier list read by attach_stores — config-side half of a distinct CAES carrier (needs code branch).
        default: "[battery, H2]"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: electricity.extendable_carriers.StorageUnit
        effect: Carrier list read by attach_storageunits — config-side half of a fixed-duration CAES StorageUnit.
        default: "[]"
        provenance: scripts/add_extra_components.py:attach_storageunits
      - key: electricity.max_hours.battery
        effect: Proxy route — generic battery StorageUnit with CAES-like duration and overridden costs.
        default: "6"
        provenance: scripts/process_cost_data.py:costs_for_storage
    boundary:
      - variant: CAES as a re-costed generic storage (proxy)
        rung: L1
        note: Battery carrier with CAES duration (electricity.max_hours.battery) and cost/efficiency overrides via the costs section (load_costs override maps; investment map present only as comment in config.default.yaml). Replaces Li-ion in the run.
      - variant: Distinct siting-free CAES Store+Link carrier
        rung: L2
        note: >
          New branch in attach_stores (Store cost from "Compressed-Air-Adiabatic-store",
          charger and discharger Links from "Compressed-Air-Adiabatic-bicharger") plus
          the carrier in electricity.extendable_carriers.Store. Costs rows exist in
          retrieved technology-data v0.13.2 — no data work.
      - variant: Distinct fixed-duration CAES StorageUnit
        rung: L2
        note: Extend lookup_store/lookup_dispatch in attach_storageunits, add carrier to extendable_carriers.StorageUnit + electricity.max_hours, and synthesise its combined capital-cost row in load_costs.
      - variant: Cavern-constrained CAES (regional e_nom_max potentials)
        rung: L3
        note: Needs a cavern-potential dataset (none exists for CAES in the repo) plus the L2 branch; mirror the pattern in add_hydrogen where data/hydrogen_salt_cavern_potentials.csv country totals become per-node e_nom_max.
      - variant: Diabatic CAES with gas co-firing / TES-coupled heat recovery
        rung: L5
        note: Multi-input link topology and heat coupling have no template for storage; bespoke component logic.
    where:
      - change: New Store+Link storage carrier
        anchor: scripts/add_extra_components.py, function attach_stores (rule add_extra_components)
        provenance: scripts/add_extra_components.py:attach_stores
      - change: New StorageUnit carrier (cost lookup dicts)
        anchor: scripts/add_extra_components.py, function attach_storageunits (lookup_store / lookup_dispatch)
        provenance: scripts/add_extra_components.py:lookup_store
      - change: Combined capital-cost row for a new StorageUnit carrier
        anchor: scripts/process_cost_data.py, function load_costs (helper costs_for_storage)
        provenance: scripts/process_cost_data.py:costs_for_storage
      - change: Template for potential-limited cavern stores
        anchor: scripts/prepare_sector_network.py, function add_hydrogen, underground_storage block (rule prepare_sector_network)
        provenance: scripts/prepare_sector_network.py:underground_storage
    data_dependencies:
      - input: technology-data costs rows "Compressed-Air-Adiabatic-store" / "Compressed-Air-Adiabatic-bicharger" (rule retrieve_cost_data, costs.technology_data_version v0.13.2)
        required_for: Distinct CAES carrier
        availability: exists by default in the retrieved costs file; absent from the offline fallback data/costs.csv
      - input: CAES cavern/geology potential data per region
        required_for: Cavern-constrained CAES
        availability: absent — must be provided by the user
