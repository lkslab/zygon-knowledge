id: concentrated-solar-power
title: Concentrated solar power (CSP)
summary: >
  Solar-thermal power plants concentrating direct irradiation (tower or
  trough), optionally with thermal energy storage (TES) that decouples solar
  collection from electric dispatch.
when_to_use:
  - "add CSP / concentrated solar"
  - "solar tower / solar thermal power plant"
  - "parabolic trough"
  - "solar with built-in thermal storage"
  - "dispatchable solar"
  - "CSP with molten salt storage"
  - "pypsa-eur: no csp carrier exists; nearest terms: solar, solar-hsat, solar thermal (heat only), csp-tower cost rows"
  - "csp_model simple vs advanced"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Not covered. There is no 'csp' carrier, no renewable.csp config
        block, and no CSP-related code anywhere in config.default.yaml,
        scripts/ or rules/ at this ref (the string 'csp' does not occur in
        any of them). Two adjacent things DO exist and must not be confused
        with CSP power: (1) the retrieved technology-data costs file
        contains ready 'csp-tower', 'csp-tower TES' and 'csp-tower power
        block' rows (visible in the processed costs output of rule
        process_cost_data) — cost data with no consumer; (2) solar THERMAL
        collectors for heat exist in sector runs (sector.solar_thermal +
        the solar_thermal config block add '<heat system> solar thermal'
        collector generators onto heat buses in prepare_sector_network.py)
        — heat supply, not electricity generation, and without
        concentration optics. Unlike pypsa-earth, which ships a fully wired
        renewable.csp block, pypsa-eur offers no config path to CSP.
      mechanism: >
        Absence mechanism, and why partial plumbing exists: profile
        generation is generic — build_renewable_profiles.py dispatches on
        the configured resource method via 'func = getattr(cutout,
        resource.pop("method"))', so an atlite conversion method other than
        pv/wind can in principle be configured per technology block. But
        the rule wiring is NOT generic for new technology names: in
        rules/build_electricity.smk both determine_availability_matrix and
        build_renewable_profiles route a technology to ONSHORE regions only
        if its name is in the hardcoded tuple ("onwind", "solar",
        "solar-hsat") — any other name (e.g. 'csp') would be treated as
        offshore. On the attachment side, attach_wind_and_solar prices a
        non-offwind carrier from costs.at[<carrier>, 'capital_cost'] and
        takes marginal cost/efficiency/lifetime from the carrier's prefix
        before the first '-' (supcar), so a 'csp' carrier needs a 'csp'
        costs row — data/custom_costs.csv CAN inject brand-new technology
        rows (overwrite_costs concatenates technologies missing from the
        index).
      not_covered: >
        Everything CSP-specific: no direct-normal-irradiation resource
        assessment, no collector-field/TES/power-block component structure
        (the earth model's attach_stores csp machinery has no eur
        counterpart), no dispatchable-solar representation of any kind. The
        csp-tower cost rows are dormant data. Solar thermal collectors
        cannot produce electricity (they feed heat buses only).
      provenance: "scripts/build_renewable_profiles.py:getattr(cutout, resource.pop(\"method\")); rules/build_electricity.smk:determine_availability_matrix; scripts/add_electricity.py:attach_wind_and_solar; scripts/process_cost_data.py:overwrite_costs; scripts/prepare_sector_network.py:solar thermal"
    levers:
      - key: electricity.renewable_carriers
        effect: "Where a new 'csp' carrier would have to be registered for its profile to be built and attached (no csp entry exists or is valid today without the accompanying renewable block and rule edits)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; rules/build_electricity.smk:input_profile_tech"
      - key: electricity.extendable_carriers.Generator
        effect: "Where the new carrier would be made optimisable."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_wind_and_solar"
      - key: costs.custom_cost_fn
        effect: "The data hook for supplying a 'csp' costs row (aliasing the dormant csp-tower values) — overwrite_costs adds technologies that do not yet exist in the costs index."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: sector.solar_thermal
        effect: "NOT CSP: enables flat-plate solar thermal collectors for HEAT buses in sector runs (nearest existing solar-thermal representation)."
        default: "true"
        provenance: "config/config.default.yaml:solar_thermal; scripts/prepare_sector_network.py:solar thermal"
    boundary:
      - variant: "cheapest screening proxy: treat CSP as PV-like firm-ish solar"
        rung: L1
        note: "no honest config proxy exists; the closest is the existing 'solar'/'solar-hsat' carriers (no storage coupling, wrong resource physics — CSP uses direct irradiation only). Use only to bound total solar buildout, not to study dispatchability"
      - variant: "CSP as a plain (storage-less) generator carrier"
        rung: L4
        note: "new renewable.csp block (atlite conversion method + eligibility params) + carrier registration is NOT enough: the onshore-region routing tuples in rules/build_electricity.smk determine_availability_matrix and build_renewable_profiles rules must be extended with the new name, and a 'csp' costs row supplied via data/custom_costs.csv (csp-tower values are already in the retrieved costs data); attach_wind_and_solar then handles it like any onshore carrier"
      - variant: "CSP with optimisable TES (collector field -> heat store -> power block)"
        rung: L5
        note: "no component machinery exists; needs bespoke construction (dedicated csp heat bus per node, Store from 'csp-tower TES', Link from 'csp-tower power block') — the earth model's add_extra_components attach_stores csp branch is a design template, but none of that code exists in pypsa-eur"
      - variant: "parabolic trough vs tower"
        rung: L5
        note: "same as above plus trough cost rows (only csp-tower rows ship in technology-data); collector-geometry-specific resource conversion is an atlite-side question"
      - variant: "solar heat for district heating (often confused with CSP)"
        rung: L0
        note: "already covered by sector.solar_thermal collectors on heat buses — heat only, no power block; see the solar-thermal carrier card"
    where:
      - change: "onshore-region routing for any new technology name"
        anchor: "rules/build_electricity.smk (regions lambdas in rules determine_availability_matrix and build_renewable_profiles, tuple (\"onwind\", \"solar\", \"solar-hsat\"))"
        provenance: "rules/build_electricity.smk:determine_availability_matrix; rules/build_electricity.smk:build_renewable_profiles"
      - change: "resource-method dispatch for a csp profile"
        anchor: "scripts/build_renewable_profiles.py (func = getattr on the cutout with resource.method)"
        provenance: "scripts/build_renewable_profiles.py:getattr(cutout, resource.pop(\"method\"))"
      - change: "carrier attachment + per-carrier cost lookup"
        anchor: "scripts/add_electricity.py::attach_wind_and_solar (non-offwind branch, costs.at[car, ...])"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar"
      - change: "supplying csp cost rows"
        anchor: "data/custom_costs.csv via scripts/process_cost_data.py::overwrite_costs (rows can add new technologies)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
      - change: "bespoke TES/power-block components"
        anchor: "no anchor exists — new code, most naturally alongside attach_stores in scripts/add_electricity.py or in prepare_sector_network.py"
        provenance: "scripts/add_electricity.py:attach_stores"
    data_dependencies:
      - input: "technology-data cost rows 'csp-tower', 'csp-tower TES', 'csp-tower power block'"
        required_for: "costing a csp implementation"
        availability: "exists by default in the retrieved/processed costs file — currently read by nothing"
      - input: "weather cutout with irradiation fields (default europe-2013-sarah3-era5 includes SARAH-3 irradiation)"
        required_for: "any csp resource profile"
        availability: "retrieved by default; whether the atlite version in the environment provides a csp conversion method must be verified against atlite, not this repo"
      - input: "CORINE/natura rasters"
        required_for: "siting eligibility of a new csp block"
        availability: "retrieved by the workflow"
      - input: "existing CSP fleet data"
        required_for: "brownfield CSP (Spain etc.)"
        availability: "absent from the default chain for csp (powerplantmatching CSP would need custom mapping)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        A full renewable.csp config block exists (atlite resource method 'csp', installation
        SAM_solar_tower, land eligibility, csp_model simple|advanced with default 'advanced'),
        and the workflow is fully wired: the build_renewable_profiles rule accepts technology
        'csp' (onshore regions), load_costs creates a 'csp' costs row aliased from 'csp-tower',
        and attach_stores in add_extra_components adds the advanced TES representation. BUT 'csp'
        is NOT in the default electricity.renewable_carriers list, so out of the box no CSP
        appears in the network — activating it is pure config.
      mechanism: >
        With 'csp' added to electricity.renewable_carriers (and extendable_carriers.Generator to
        make it optimisable): rule build_renewable_profiles builds profile_csp.nc (atlite csp
        method, copernicus grid_codes [20,30,40,60,90], natura, capacity_per_sqkm 2.392); the
        add_electricity rule auto-adds profile_csp.nc as input (inputs are generated for every
        tech in config['renewable'] that is in renewable_carriers) and attach_wind_and_solar adds
        csp Generators per bus. If renewable.csp.csp_model == 'advanced', attach_stores in
        scripts/add_extra_components.py rewires each csp generator onto a dedicated '<bus> csp'
        Bus and adds a TES Store (costs 'csp-tower TES') plus a power-block Link to the main bus
        (efficiency/capex from 'csp-tower'), so solar heat can be stored before conversion. With
        'simple', csp stays a plain generator.
      not_covered: >
        No parabolic-trough or other collector geometries (installation is SAM_solar_tower; other
        atlite installations would need config + matching costs rows); TES sizing is optimised but
        there is no solar-multiple coupling constraint between collector field, store, and power
        block beyond their separate capex terms; renewable.csp.copernicus.distancing_codes /
        distance_to_codes keys in config.default.yaml are not read by build_renewable_profiles
        (it reads 'distance' and 'distance_grid_codes').
      provenance: "scripts/add_extra_components.py:attach_stores"

    levers:
      - key: electricity.renewable_carriers
        effect: "Add 'csp' here to activate CSP (not included by default)."
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro] (no csp)"
        provenance: "config.default.yaml:renewable_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: "Add 'csp' to allow capacity expansion of the collector/generator."
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT] (no csp)"
        provenance: "config.default.yaml:extendable_carriers"
      - key: renewable.csp.csp_model
        effect: "'simple' = plain generator; 'advanced' = generator + csp bus + TES Store + power-block Link."
        default: "advanced"
        provenance: "scripts/add_extra_components.py:csp_model"
      - key: renewable.csp.resource.installation
        effect: "atlite CSP installation model used for the heat profile."
        default: "SAM_solar_tower"
        provenance: "config.default.yaml:SAM_solar_tower"
      - key: renewable.csp.capacity_per_sqkm
        effect: "MW installable per km2 of eligible land."
        default: "2.392"
        provenance: "scripts/build_renewable_profiles.py:capacity_per_sqkm"
      - key: renewable.csp.copernicus.grid_codes
        effect: "Eligible land-cover classes for CSP siting."
        default: "[20, 30, 40, 60, 90]"
        provenance: "scripts/build_renewable_profiles.py:grid_codes"
      - key: renewable.csp.natura
        effect: "Exclude protected areas."
        default: "true"
        provenance: "scripts/build_renewable_profiles.py:natura"
      - key: renewable.csp.potential
        effect: "'simple' or 'conservative' p_nom_max method."
        default: "simple"
        provenance: "scripts/build_renewable_profiles.py:potential"
      - key: renewable.csp.clip_p_max_pu
        effect: "Zero out tiny capacity factors."
        default: "1.e-2"
        provenance: "scripts/build_renewable_profiles.py:clip_p_max_pu"
      - key: renewable.csp.cutout
        effect: "Weather cutout; 'auto' resolves to atlite.default."
        default: "auto"
        provenance: "scripts/_helpers.py:update_cutout_config"

    boundary:
      - variant: "turn CSP on (with TES)"
        rung: L1
        note: "add 'csp' to electricity.renewable_carriers (+ extendable_carriers.Generator); csp_model 'advanced' is already default. Profile input wiring to add_electricity is automatic."
      - variant: "CSP without storage"
        rung: L0
        note: "renewable.csp.csp_model: simple (given csp is activated as above)."
      - variant: "change TES cost/efficiency assumptions"
        rung: L3
        note: "TES Store/Link read 'csp-tower TES' and 'csp-tower' rows from the retrieved technology-data csv; override via the costs overwrite mechanism in load_costs (config costs.investment/... mappings) or a custom costs file."
      - variant: "parabolic trough instead of tower"
        rung: L3
        note: "renewable.csp.resource.installation to another atlite installation + point the hardcoded 'csp-tower' cost lookups (load_costs alias and attach_stores) at trough rows — small code edit plus costs data."
      - variant: "fixed solar-multiple / coupled field-store-block sizing constraint"
        rung: L5
        note: "no mechanism; needs a custom constraint in solve_network."

    where:
      - change: "CSP heat profile and potential"
        anchor: "rule build_renewable_profiles -> scripts/build_renewable_profiles.py (technology 'csp', onshore regions)"
        provenance: "Snakefile:rule build_renewable_profiles"
      - change: "generator attachment (both csp_model variants)"
        anchor: "attach_wind_and_solar in scripts/add_electricity.py"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar"
      - change: "advanced model: csp bus + TES Store + power-block Link"
        anchor: "attach_stores in scripts/add_extra_components.py (rule add_extra_components)"
        provenance: "scripts/add_extra_components.py:attach_stores"
      - change: "csp cost row aliasing from csp-tower"
        anchor: "load_costs in scripts/process_cost_data.py"
        provenance: "scripts/process_cost_data.py:csp-tower"

    data_dependencies:
      - input: "ERA5 cutout with direct-irradiation fields"
        required_for: "atlite csp method"
        availability: "same cutout as solar/wind; retrieved or built via build_cutout"
      - input: "technology-data costs file (csp-tower, csp-tower TES rows)"
        required_for: "generator, TES store, and power-block costs"
        availability: "retrieved by rule retrieve_cost_data; rows present in technology-data v0.13.2"
      - input: "Copernicus land cover raster + natura.tiff"
        required_for: "siting eligibility"
        availability: "retrieved by databundle / pregenerated"
      - input: "powerplants.csv"
        required_for: "existing CSP capacity (only if present in powerplantmatching for the region)"
        availability: "built by rule build_powerplants; CSP fleet data sparse"
