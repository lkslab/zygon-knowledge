id: conventional-hydropower
title: Conventional hydropower
summary: >
  Existing run-of-river, reservoir, and pumped-storage hydro plants with
  weather-driven river inflows.
when_to_use:
  - "add hydropower / hydro dams"
  - "run-of-river plants"
  - "reservoir hydro storage"
  - "pumped hydro storage (existing plants)"
  - "hydro inflow / drought year sensitivity"
  - "hydro generation looks too high or too low"
  - "calibrate hydro to national statistics"
  - "reservoir energy capacity / max_hours"
  - "pypsa-eur carrier names: hydro, ror, PHS, hydroelectricity"
  - "known in pypsa-eur as: hydro, hydro reservoir, hydroelectricity"
models:
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        Existing fleet fully covered, expansion not. 'hydro' is in
        electricity.renewable_carriers; renewable.hydro.carriers (default
        [ror, PHS, hydro]) selects which component groups are built. The
        fleet comes from powerplantmatching via rule build_powerplants;
        load_and_aggregate_powerplants maps Technology Run-Of-River -> 'ror',
        Reservoir -> 'hydro', Pumped Storage -> 'PHS' (tech_dict) and
        replaces the generic 'hydro' fueltype with the technology. Inflows
        are COUNTRY-level (contrast pypsa-earth's per-plant catchments):
        rule build_hydro_profile runs the atlite cutout runoff over country
        shapes with normalize_using_yearly = EIA annual national hydro
        generation (get_eia_annual_hydro_generation from
        data/eia_hydro_annual_generation.csv, with former-country splits and
        Baltic fixes), writing profile_hydro.nc per country; attach_hydro in
        scripts/add_electricity.py then distributes each country's inflow
        over its ror+reservoir plants proportional to p_nom. Optional EIA
        treatments: eia_norm_year (force one statistics year for all
        weather years), eia_correct_by_capacity (divide out fleet growth),
        eia_approximate_missing (regress missing years on annual country
        runoff from rule build_country_runoff). Components: 'ror' as
        Generators with p_max_pu = inflow/p_nom clipped at 1; 'hydro'
        (reservoir) as StorageUnits with inflow, efficiency_store 0,
        cyclic state of charge, and max_hours filled per country from
        data/hydro_capacities.csv E_store[TWh] via
        renewable.hydro.hydro_max_hours ('energy_capacity_totals_by_country'
        default, distributing the missing country energy over plants with
        unknown max_hours, or 'estimate_by_large_installations' =
        E_store/p_nom_discharge; final fallback 6 h); optional
        flatten_dispatch caps reservoir p_max_pu at mean CF +
        flatten_dispatch_buffer; 'PHS' as StorageUnits with max_hours
        filled to PHS_max_hours (6), efficiency split sqrt(round-trip), NO
        natural inflow. Note attach_hydro applies costs.at['hydro',
        'capital_cost'] (nonzero row) to the fixed reservoir fleet
        unconditionally — a constant objective term for non-extendable
        assets. All three groups are added with fixed p_nom (no
        p_nom_extendable); sector runs keep them via the pypsa_eur
        keep-lists (Generator: ror; StorageUnit: PHS, hydro).
      mechanism: >
        rule build_hydro_profile (EIA-normalised country runoff;
        wildcard-independent single output profile_hydro.nc — the
        build_renewable_profiles rule explicitly excludes hydro via
        wildcard_constraints technology "(?!hydro).*") -> rule
        add_electricity: attach_hydro branches per carrier group,
        clip_min_inflow zeroing tiny inflows happens in
        build_hydro_profile. Fleet corrections via
        electricity.powerplants_filter / custom_powerplants (rule
        build_powerplants). No hydro entry exists in attach_wind_and_solar
        (carrier 'hydro' is skipped there).
      not_covered: >
        No greenfield hydro of any kind: attach_hydro reads p_nom from the
        plant list with no extendable flag, and 'hydro'/'ror'/'PHS' are not
        valid entries elsewhere (new-build PHS via
        electricity.extendable_carriers.StorageUnit is NOT supported either
        — attach_storageunits only accepts carriers in STORE_LOOKUP, which
        has no PHS entry; PHS rows exist in the costs file unread for that
        purpose). No per-plant inflow (country series split by capacity —
        wet/dry regional gradients within a country are lost). No cascade /
        river-chain coupling. No reservoir operating rules beyond cyclic
        SoC (flatten_dispatch is the only dispatch-shaping hook). PHS gets
        no natural inflow. No hydro vintages in myopic runs
        (add_existing_renewables covers solar/onwind/offwind-ac only) —
        the fleet passes through unchanged. renewable.hydro has no
        correction multiplier key like earth's 'multiplier'; calibration
        runs through the EIA statistics options instead.
      provenance: "scripts/add_electricity.py:attach_hydro; scripts/build_hydro_profile.py:get_eia_annual_hydro_generation; scripts/build_hydro_profile.py:normalize_using_yearly; scripts/add_electricity.py:load_and_aggregate_powerplants; rules/build_electricity.smk:build_hydro_profile; scripts/add_electricity.py:STORE_LOOKUP; data/hydro_capacities.csv:E_store[TWh]"
    levers:
      - key: electricity.renewable_carriers
        effect: "Include/exclude 'hydro' (gates profile_hydro build and the whole attach_hydro branch)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.carriers
        effect: "Which of ror / PHS / hydro component groups are added."
        default: "[ror, PHS, hydro]"
        provenance: "config/config.default.yaml:carriers; scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.hydro_max_hours
        effect: "Reservoir energy estimation: 'energy_capacity_totals_by_country' (fill country E_store gap over unknown plants) or 'estimate_by_large_installations' (country E_store/p_nom ratio)."
        default: "energy_capacity_totals_by_country"
        provenance: "config/config.default.yaml:hydro_max_hours; scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.PHS_max_hours
        effect: "max_hours filled in for pumped-storage plants with missing/zero data."
        default: "6"
        provenance: "config/config.default.yaml:PHS_max_hours; scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.flatten_dispatch
        effect: "true caps reservoir dispatch at (average inflow CF + flatten_dispatch_buffer) — crude baseload-like operating rule."
        default: "false (buffer 0.2)"
        provenance: "config/config.default.yaml:flatten_dispatch; scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.clip_min_inflow
        effect: "Inflows below this [MW] are zeroed in the country profile."
        default: "1.0"
        provenance: "config/config.default.yaml:clip_min_inflow; scripts/build_hydro_profile.py:clip_min_inflow"
      - key: renewable.hydro.eia_norm_year
        effect: "Force one EIA statistics year for the inflow normalisation regardless of weather year (decouples hydrology calibration from the cutout year)."
        default: "false"
        provenance: "config/config.default.yaml:eia_norm_year; scripts/build_hydro_profile.py:eia_norm_year"
      - key: renewable.hydro.eia_correct_by_capacity
        effect: "Divide EIA generation by fleet-capacity growth (data/eia_hydro_annual_capacity.csv) so old statistics match today's fleet."
        default: "false"
        provenance: "config/config.default.yaml:eia_correct_by_capacity; scripts/build_hydro_profile.py:correct_eia_stats_by_capacity"
      - key: renewable.hydro.eia_approximate_missing
        effect: "Linear-regress missing EIA years on annual country runoff (era5-runoff-per-country from rule build_country_runoff) — needed for weather years outside the EIA record."
        default: "false"
        provenance: "config/config.default.yaml:eia_approximate_missing; scripts/build_hydro_profile.py:approximate_missing_eia_stats"
      - key: renewable.hydro.cutout
        effect: "Cutout supplying runoff; 'default' resolves to atlite.default_cutout. build_hydro_profile loads FULL years of the cutout when available (inflow normalisation is annual)."
        default: "default"
        provenance: "config/config.default.yaml:default_cutout; scripts/build_hydro_profile.py:full_years_available"
      - key: electricity.powerplants_filter
        effect: "Pandas query on the fleet (DateIn/DateOut) — retire or exclude hydro units by commissioning/retirement year."
        default: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"
        provenance: "config/config.default.yaml:powerplants_filter; rules/build_electricity.smk:build_powerplants"
      - key: electricity.custom_powerplants
        effect: "Pandas query (or true) to merge user rows from data/custom_powerplants.csv — the main way to fix missing/wrong hydro plants."
        default: "false"
        provenance: "config/config.default.yaml:custom_powerplants; rules/build_electricity.smk:build_powerplants"
      - key: adjustments.electricity
        effect: "Generic per-carrier factor/absolute overrides in prepare_network — e.g. scale ror/hydro marginal or capital cost."
        default: "false"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
      - key: costs.overwrites
        effect: "Override hydro/PHS/ror efficiency or costs in prepare_costs (deprecated; prefer data/custom_costs.csv rows)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "drop PHS or ror (or reservoirs) from the model"
        rung: L0
        note: "renewable.hydro.carriers"
      - variant: "smooth / flatten reservoir dispatch"
        rung: L0
        note: "renewable.hydro.flatten_dispatch (+ flatten_dispatch_buffer)"
      - variant: "calibrate annual hydro energy to a chosen statistics year"
        rung: L1
        note: "renewable.hydro.eia_norm_year (+ eia_correct_by_capacity to fix fleet-growth bias); there is NO plain scaling multiplier key — for an arbitrary scale factor edit the EIA csv (L3) or scale inflow in attach_hydro (L2)"
      - variant: "drought / wet year sensitivity"
        rung: L1
        note: "move snapshots + atlite.default_cutout to 'europe-1940-2024-era5' (has runoff back to 1940); enable eia_approximate_missing for years outside the EIA record"
      - variant: "change reservoir energy capacities (max_hours)"
        rung: L1
        note: "hydro_max_hours method switch; country values live in data/hydro_capacities.csv E_store[TWh] — edit that file for country-specific corrections (L3)"
      - variant: "add missing / correct existing hydro plants"
        rung: L3
        note: "data/custom_powerplants.csv + electricity.custom_powerplants (rule build_powerplants); technology column must be one of Run-Of-River / Reservoir / Pumped Storage to hit the tech_dict mapping"
      - variant: "regional (sub-country) inflow differentiation"
        rung: L5
        note: "inflow is one series per country distributed by p_nom (dist_key in attach_hydro); per-plant/per-basin inflows need a different profile build (earth's hydrobasins approach) and attach_hydro rework"
      - variant: "greenfield reservoir/ror expansion or new-build PHS"
        rung: L5
        note: "attach_hydro is existing-fleet-only with fixed p_nom, and attach_storageunits cannot build PHS (no STORE_LOOKUP entry) — candidate-site data plus new attachment logic required; see the pumped-hydro-storage carrier card for the storage-side angle"
      - variant: "cascade coupling between plants on one river"
        rung: L5
        note: "no representation"
    where:
      - change: "country inflow computation and EIA normalisation options"
        anchor: "scripts/build_hydro_profile.py (rule build_hydro_profile; params renewable.hydro)"
        provenance: "scripts/build_hydro_profile.py:get_eia_annual_hydro_generation; rules/build_electricity.smk:build_hydro_profile"
      - change: "component creation (ror/PHS/hydro), max_hours logic, inflow distribution to plants"
        anchor: "scripts/add_electricity.py::attach_hydro (rule compose_network)"
        provenance: "scripts/add_electricity.py:attach_hydro; scripts/add_electricity.py:dist_key"
      - change: "fleet data (plants, technologies, capacities) incl. tech_dict carrier mapping"
        anchor: "rule build_powerplants + scripts/add_electricity.py::load_and_aggregate_powerplants (tech_dict)"
        provenance: "scripts/add_electricity.py:tech_dict; rules/build_electricity.smk:build_powerplants"
      - change: "annual runoff regressor for missing EIA years"
        anchor: "rule build_country_runoff -> scripts/build_country_runoff.py (era5-runoff-per-country.csv)"
        provenance: "rules/build_electricity.smk:build_country_runoff"
      - change: "reservoir energy statistics"
        anchor: "data/hydro_capacities.csv (E_store[TWh] per country; read directly in attach_hydro)"
        provenance: "scripts/add_electricity.py:hydro_capacities; data/hydro_capacities.csv:E_store[TWh]"
    data_dependencies:
      - input: "weather cutout with runoff feature (default europe-2013-sarah3-era5; europe-1940-2024-era5 for other years)"
        required_for: "inflow time series"
        availability: "retrieved from archive by default"
      - input: "data/eia_hydro_annual_generation.csv (+ eia_hydro_annual_capacity.csv for the capacity correction)"
        required_for: "annual inflow normalisation"
        availability: "exists by default in the repo"
      - input: "era5-runoff-per-country.csv (rule build_country_runoff, needs the 1940-2024 cutout)"
        required_for: "eia_approximate_missing regression"
        availability: "must be built (or retrieved via the dataset registry) when that option is enabled"
      - input: "powerplantmatching database (Technologies Run-Of-River / Reservoir / Pumped Storage) + data/custom_powerplants.csv"
        required_for: "the whole hydro fleet: locations, p_nom, max_hours where known"
        availability: "retrieved by the workflow; plant max_hours often missing (hence the country-statistics fallback)"
      - input: "data/hydro_capacities.csv (p_nom_discharge[GW], E_store[TWh] per country)"
        required_for: "reservoir max_hours estimation"
        availability: "exists by default; some countries have no E_store entry (fallback 6 h with a logged warning)"
      - input: "technology-data cost rows 'hydro', 'PHS', 'ror'"
        required_for: "efficiencies and capital/marginal cost attributes"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        'hydro' is a default renewable carrier. The EXISTING fleet from powerplants.csv
        (powerplantmatching + OSM) is split by technology into three carriers
        (renewable.hydro.carriers [ror, PHS, hydro]): Run-Of-River -> 'ror' Generators with
        inflow-capped p_max_pu; Reservoir -> 'hydro' StorageUnits with inflow time series,
        max_hours from plant data / country statistics, zero efficiency_store (natural inflow
        only); Pumped Storage -> 'PHS' StorageUnits (PHS_max_hours default, no natural inflow).
        Plant-level inflow time series come from ERA5 runoff aggregated over HydroBASINS
        catchments upstream of each plant (atlite hydro method), normalised to national yearly
        generation statistics (IRENA by default, or EIA / hydro_capacities) and scaled by a
        multiplier. Plants with unknown technology are classified reservoir vs ror by an
        energy-to-power threshold (hydro_min_inflow_pu).
      mechanism: >
        rule build_renewable_profiles with technology 'hydro' (extra inputs from HYDRO_PROFILES:
        hydrobasins hybas_world.shp, powerplants.csv, hydro_capacities.csv, EIA and IRENA
        statistics) computes per-plant inflow: atlite hydro method over the cutout runoff with
        the plant list, then rescale_hydro against get_irena_annual_hydro_generation /
        get_eia_annual_hydro_generation per renewable.hydro.normalization, then
        config.get('multiplier', 1.0). attach_hydro in scripts/add_electricity.py opens
        profile_hydro.nc, aggregates plants by bus/carrier/build-year, and adds the three
        component groups; reservoir max_hours falls back per renewable.hydro.hydro_max_hours
        ('energy_capacity_totals_by_country' or 'estimate_by_large_installations' using
        data/hydro_capacities.csv, default hydro_max_hours_default 6.0 h). All three groups are
        added with p_nom_extendable=False.
      not_covered: >
        No greenfield/candidate hydro expansion (existing plants only, non-extendable; 'hydro'
        in extendable_carriers would not help — attach_hydro hardcodes p_nom_extendable=False and
        attach_wind_and_solar skips 'hydro'); no cascade/river-chain coupling between plants; no
        reservoir operating rules (only cyclic state of charge); PHS gets no natural inflow; new
        PHS as an expandable option is separate (electricity.extendable_carriers StorageUnit
        candidates, not this chain).
      provenance: "scripts/add_electricity.py:attach_hydro"

    levers:
      - key: electricity.renewable_carriers
        effect: "Include/exclude 'hydro' (gates profile_hydro build and attach_hydro)."
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro]"
        provenance: "config.default.yaml:renewable_carriers"
      - key: renewable.hydro.carriers
        effect: "Which of ror / PHS / hydro component groups are added to the network."
        default: "[ror, PHS, hydro]"
        provenance: "scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.hydro_max_hours
        effect: "Reservoir energy capacity estimation method: 'energy_capacity_totals_by_country' or 'estimate_by_large_installations' (fills missing plant max_hours)."
        default: "energy_capacity_totals_by_country"
        provenance: "scripts/add_electricity.py:hydro_max_hours"
      - key: renewable.hydro.hydro_max_hours_default
        effect: "Fallback max_hours where country statistics are missing."
        default: "6.0"
        provenance: "scripts/add_electricity.py:hydro_max_hours_default"
      - key: renewable.hydro.PHS_max_hours
        effect: "max_hours for pumped-storage units with missing data."
        default: "6"
        provenance: "scripts/add_electricity.py:PHS_max_hours"
      - key: renewable.hydro.normalization.method
        effect: "Rescale inflows to yearly statistics: 'irena', 'eia', 'hydro_capacities', or false."
        default: "irena"
        provenance: "scripts/build_renewable_profiles.py:rescale_hydro"
      - key: renewable.hydro.normalization.year
        effect: "Statistics year used for the rescaling (defaults to cutout weather year if unset)."
        default: "2023"
        provenance: "scripts/build_renewable_profiles.py:rescale_hydro"
      - key: renewable.hydro.multiplier
        effect: "Scalar applied to inflow after normalisation."
        default: "1.1"
        provenance: "scripts/build_renewable_profiles.py:multiplier"
      - key: renewable.hydro.clip_min_inflow
        effect: "Inflows below this are set to 0."
        default: "1.0"
        provenance: "scripts/build_renewable_profiles.py:clip_min_inflow"
      - key: renewable.hydro.hydro_min_inflow_pu
        effect: "Energy-to-power threshold classifying unknown-technology plants as Reservoir vs Run-Of-River."
        default: "1.0"
        provenance: "scripts/add_electricity.py:attach_hydro"
      - key: renewable.hydro.resource.hydrobasins
        effect: "Path to the HydroBASINS shapefile used for catchment aggregation."
        default: "data/hydrobasins/hybas_world.shp"
        provenance: "scripts/build_renewable_profiles.py:hydrobasins"
      - key: renewable.hydro.hydrobasins_level
        effect: "HydroBASINS level retrieved/merged by the databundle (catchment granularity)."
        default: "6"
        provenance: "scripts/retrieve_databundle_light.py:merge_hydrobasins_shape"
      - key: renewable.hydro.resource.flowspeed
        effect: "Assumed river flow speed [m/s] for runoff routing in the atlite hydro method."
        default: "1.0"
        provenance: "config.default.yaml:flowspeed"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' data/custom_powerplants.csv into the fleet — the main way to fix missing/wrong hydro plants."
        default: "false"
        provenance: "config.default.yaml:custom_powerplants"
      - key: costs.marginal_cost.hydro
        effect: "Overwrites hydro marginal cost."
        default: "0."
        provenance: "scripts/process_cost_data.py:load_costs"

    boundary:
      - variant: "scale hydro up/down or match a statistics year"
        rung: L0
        note: "renewable.hydro.multiplier and normalization.method/year."
      - variant: "drop PHS or ror from the model"
        rung: L0
        note: "renewable.hydro.carriers."
      - variant: "change reservoir energy capacities"
        rung: L1
        note: "hydro_max_hours method / hydro_max_hours_default; underlying data is data/hydro_capacities.csv (edit for country-specific values — L3 if new data needed)."
      - variant: "apply reservoir capital cost"
        rung: L2
        note: "attach_hydro reads c.get('hydro_capital_cost') to decide between costs 'hydro' capital_cost and 0.0, but the key is NOT present in config.default.yaml — setting renewable.hydro.hydro_capital_cost: true in a user config works, yet it is undocumented in the default schema; verify before relying on it."
      - variant: "add missing / correct existing hydro plants"
        rung: L3
        note: "electricity.custom_powerplants with data/custom_powerplants.csv (rule build_powerplants merges it)."
      - variant: "different weather year for inflows"
        rung: L3
        note: "new ERA5 cutout (snapshots + build_cutout); normalization.year should follow."
      - variant: "expandable greenfield hydro / new candidate dams"
        rung: L5
        note: "attach_hydro is existing-fleet only and hardcodes p_nom_extendable=False; needs bespoke candidate-site data and attachment logic."
      - variant: "cascade coupling between plants on the same river"
        rung: L5
        note: "no representation."

    where:
      - change: "inflow computation, normalisation, multiplier"
        anchor: "rule build_renewable_profiles (technology 'hydro', HYDRO_PROFILES inputs) -> scripts/build_renewable_profiles.py (rescale_hydro)"
        provenance: "scripts/build_renewable_profiles.py:rescale_hydro"
      - change: "component creation (ror/PHS/hydro), max_hours logic, tech classification"
        anchor: "attach_hydro in scripts/add_electricity.py (rule add_electricity)"
        provenance: "scripts/add_electricity.py:attach_hydro"
      - change: "fleet data (plants, technologies, capacities)"
        anchor: "rule build_powerplants (powerplantmatching config configs/powerplantmatching_config.yaml + data/custom_powerplants.csv)"
        provenance: "Snakefile:rule build_powerplants"
      - change: "hydro-specific inputs wiring"
        anchor: "HYDRO_PROFILES dict in Snakefile (hydro_capacities, eia_hydro_generation, irena_stats, powerplants, hydrobasins)"
        provenance: "Snakefile:HYDRO_PROFILES"

    data_dependencies:
      - input: "HydroBASINS shapefile data/hydrobasins/hybas_world.shp"
        required_for: "catchment aggregation of runoff to plants"
        availability: "retrieved by databundle (level per renewable.hydro.hydrobasins_level); global"
      - input: "ERA5 cutout (runoff fields)"
        required_for: "inflow time series"
        availability: "retrieved via enable.retrieve_cutout or built via build_cutout"
      - input: "powerplants.csv (powerplantmatching + OSM + optional custom_powerplants.csv)"
        required_for: "plant locations, capacities, technologies — the whole hydro fleet"
        availability: "built by rule build_powerplants; quality strongly region-dependent (missing plants drop capacity with a logged warning in attach_hydro)"
      - input: "data/hydro_capacities.csv"
        required_for: "reservoir max_hours estimation and 'hydro_capacities' normalisation"
        availability: "exists by default; country coverage incomplete (fallback to hydro_max_hours_default)"
      - input: "IRENA statistics data/IRENA_Statistics_Extract_2025H2.xlsx and EIA data/eia_hydro_annual_generation.csv"
        required_for: "inflow normalisation methods 'irena' / 'eia'"
        availability: "exists by default (shipped/retrieved)"
      - input: "technology-data costs file (hydro, ror, PHS rows)"
        required_for: "efficiencies and (optional) capital costs"
        availability: "retrieved by rule retrieve_cost_data (exists by default)"
