id: conventional-nuclear
title: Conventional nuclear
summary: >
  Large-scale nuclear power stations as dispatchable low-carbon thermal
  generators, with an existing fleet, optional expansion, availability
  derating and phase-out handling.
when_to_use:
  - "add nuclear power"
  - "model existing nuclear plants"
  - "nuclear capacity expansion / new nuclear build"
  - "remove nuclear / nuclear phase-out"
  - "nuclear availability factors / outages"
  - "limit or force nuclear capacity per country"
  - "atomic energy in the power mix"
  - "nuclear ramping / minimum load / unit commitment"
  - "uranium fuel for nuclear"
  - "pypsa-eur carrier names: nuclear, uranium"
  - "limit nuclear availability or capacity per country"
  - "nuclear load factors / availability"
  - "pink hydrogen from nuclear"
  - "known in pypsa-eur as: Nuclear, Nuclear marginal, nuclear, uranium"
models:
  - model: pypsa-eur
    version_anchor: {ref: "492f05d32e91ff76b26a7ee67604811a54cb315a", date: "2026-10-10"}
    out_of_box:
      covers: >
        Existing fleet fully covered. "nuclear" is in
        electricity.conventional_carriers; plants come from powerplantmatching
        (rule build_powerplants) and attach_conventional_generators adds them
        as non-extendable Generators aggregated by (bus, carrier), with
        efficiency, lifetime, capital and marginal cost from the "nuclear"
        cost row (fuel price copied from the uranium commodity; e.g. in the
        2050 processed costs efficiency 0.326 and fuel 3.41 EUR/MWh_th give a
        marginal cost near 14 EUR/MWh). A country-specific availability
        derating is applied by default: conventional.nuclear.p_max_pu points
        at data/nuclear_p_max_pu.csv (per-country annual factors 2009-2024);
        attach_conventional_generators maps buses to countries and picks the
        column matching the first snapshot year, falling back to the last
        column. Optional per-carrier unit commitment via
        conventional.unit_commitment (data/unit_commitment.csv nuclear column:
        ramp limits 0.3, p_min_pu 0.5, min up/down 10 h, start-up cost 250).
        Sector runs: nuclear is the ONLY conventional carrier in the pypsa_eur
        keep-list, so the existing nuclear Generators survive
        remove_elec_base_techs and keep operating in sector networks (with
        implicit unlimited uranium priced into their marginal cost). Myopic /
        perfect foresight: add_existing_baseyear rebuilds the fleet as
        "nuclear-<grouping year>" Links drawing from the single "EU uranium"
        bus (rename_fuel Nuclear -> nuclear, carrier map nuclear -> uranium;
        existing_capacities.conventional_carriers includes uranium so
        add_carrier_buses creates the EU uranium bus and Store), retiring by
        DateOut/lifetime; under perfect foresight compose_network additionally
        applies the national nuclear phase-out years configured in
        existing_capacities.phase_outs (default rows DE 2022, BE 2025,
        ES 2027) via apply_phase_outs in prepare_perfect_foresight.py, which
        caps lifetimes of both Generators and Links of the listed carriers;
        for overnight/myopic runs the list is ignored with a warning.
      mechanism: >
        rule build_powerplants -> resources/<run>/powerplants.csv; rule
        compose_network calls add_electricity.py:attach_conventional_generators (fleet + any
        extendable conventional carriers; the conventional_nuclear_p_max_pu
        input generated from the conventional config block applies the
        per-country derating); costs from rule process_cost_data. Sector:
        remove_elec_base_techs keeps carriers listed under pypsa_eur; myopic
        brownfield nuclear enters via add_existing_baseyear.py, called from
        rule compose_network (add_power_capacities_installed_before_baseyear).
      not_covered: >
        No expansion by default ("nuclear" not in
        electricity.extendable_carriers.Generator); when added there,
        candidates appear only at buses already hosting nuclear plants unless
        electricity.everywhere_powerplants seeds zero-capacity 'Nuclear'
        plants at all substations. No time-varying outage profiles — the
        derating is one static factor per country-year. No fuel-cycle detail
        in the electricity workflow (uranium is just a fuel price on the
        cost row). In myopic/perfect sector runs the uranium supply side is
        incomplete at this ref: add_carrier_buses only adds a fuel-supply
        Generator for carriers in its fossils list [coal, gas, oil, lignite],
        so the "EU uranium" bus gets a bus + extendable cyclic Store but NO
        priced uranium source feeding the brownfield nuclear Links; and
        because the keep-list nuclear Generators also survive there, the
        existing fleet is represented twice (Generators with implicit fuel +
        fuel-starved uranium Links) — inspect and reconcile before trusting
        myopic nuclear results. sector.conventional_generation has no nuclear
        entry by default, so there is no greenfield nuclear Link in sector
        runs (and adding "nuclear: uranium" there hits the same missing
        uranium supply). No SMR or fusion technology exists (see the
        small-modular-reactors and nuclear-fusion carrier cards).
      provenance: "scripts/add_electricity.py:attach_conventional_generators; config/config.default.yaml:nuclear; scripts/prepare_sector_network.py:remove_elec_base_techs; scripts/prepare_sector_network.py:add_carrier_buses; scripts/add_existing_baseyear.py:rename_fuel; scripts/prepare_perfect_foresight.py:apply_phase_outs"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing nuclear fleet (remove 'nuclear' to phase out existing plants in the electricity workflow)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: "Add 'nuclear' to allow capacity expansion; candidates only at buses with existing nuclear plants unless everywhere_powerplants is used."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.everywhere_powerplants
        effect: "['Nuclear'] places zero-capacity nuclear plants at ALL substations (add_everywhere_powerplants) — greenfield expansion candidates at every bus when combined with extendable_carriers."
        default: "[] (empty)"
        provenance: "config/config.default.yaml:everywhere_powerplants; scripts/build_powerplants.py:add_everywhere_powerplants"
      - key: conventional.nuclear.p_max_pu
        effect: "Availability derating: a path starting 'data/' becomes a per-country per-year CSV input (default IAEA-style factors); a plain number instead applies one static p_max_pu to all nuclear generators."
        default: "data/nuclear_p_max_pu.csv"
        provenance: "config/config.default.yaml:nuclear; scripts/add_electricity.py:attach_conventional_generators"
      - key: conventional.unit_commitment
        effect: "true attaches committable attributes (ramp limits, min up/down time, start-up cost, p_min_pu) to nuclear (and OCGT/CCGT/coal/lignite) from data/unit_commitment.csv; solved as linearized UC."
        default: "false"
        provenance: "config/config.default.yaml:unit_commitment; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "Pandas query on DateIn/DateOut — retire or exclude nuclear units by commissioning/retirement year (the config-level phase-out knob for the static fleet)."
        default: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"
        provenance: "config/config.default.yaml:powerplants_filter; scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.custom_powerplants
        effect: "Pandas query (or true) to inject rows from data/custom_powerplants.csv (Fueltype Nuclear) — e.g. planned or under-construction reactors."
        default: "false"
        provenance: "config/config.default.yaml:custom_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - key: solving.constraints.CCL
        effect: "true activates per-country per-carrier capacity min/max from data/agg_p_nom_minmax.csv (solving.agg_p_nom_limits.file) — the hook for national nuclear build caps/floors on extendable nuclear."
        default: "false"
        provenance: "config/config.default.yaml:CCL; scripts/solve_network.py:add_CCL_constraints"
      - key: costs.overwrites
        effect: "Per-technology overwrites of investment/lifetime/FOM/VOM/efficiency/fuel applied in prepare_costs (e.g. {investment: {nuclear: 6000}}); deprecated in favour of data/custom_costs.csv (costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: pypsa_eur.Generator
        effect: "Sector-run keep-list — 'nuclear' is in it by default, which is why existing nuclear (alone among conventionals) survives into sector networks; remove it for a nuclear-free sector run."
        default: "[onwind, offwind-ac, offwind-dc, offwind-float, solar-hsat, solar, ror, nuclear]"
        provenance: "config/config.default.yaml:pypsa_eur; scripts/prepare_sector_network.py:remove_elec_base_techs"
      - key: existing_capacities.conventional_carriers
        effect: "Myopic/perfect: 'uranium' in this list makes prepare_sector_network create the EU uranium bus/store that the brownfield nuclear Links of add_existing_baseyear draw from."
        default: "[lignite, coal, oil, uranium]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.conventional_generation
        effect: "Sector runs: adding 'nuclear: uranium' makes add_generation create extendable nuclear Links at every node from the EU uranium bus — but see the missing uranium supply caveat (boundary)."
        default: "{OCGT: gas, CCGT: gas} — no nuclear entry"
        provenance: "config/config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:add_generation"
    boundary:
      - variant: "run with the existing nuclear fleet incl. country availability derating"
        rung: L0
        note: "default — nuclear in conventional_carriers, derating CSV wired via conventional.nuclear.p_max_pu"
      - variant: "nuclear phase-out"
        rung: L1
        note: "remove 'nuclear' from electricity.conventional_carriers; for sector runs also remove it from pypsa_eur.Generator (otherwise nothing changes there — the fleet survives via the keep-list)"
      - variant: "new nuclear build at existing sites"
        rung: L1
        note: "add 'nuclear' to electricity.extendable_carriers.Generator"
      - variant: "greenfield nuclear candidates at every bus"
        rung: L1
        note: "electricity.everywhere_powerplants: ['Nuclear'] + 'nuclear' in extendable_carriers.Generator (zero-capacity plants seeded at all substations by add_everywhere_powerplants)"
      - variant: "single availability factor instead of the per-country CSV"
        rung: L1
        note: "set conventional.nuclear.p_max_pu to a number; any generator attribute can be set the same way (the conventional_params block applies attributes per carrier)"
      - variant: "change per-country availability factors"
        rung: L3
        note: "edit data/nuclear_p_max_pu.csv (country rows, year columns; the column matching the first snapshot year is used, else the last)"
      - variant: "cap or force nuclear capacity per country"
        rung: L1
        note: "solving.constraints.CCL: true + rows for carrier nuclear in data/agg_p_nom_minmax.csv"
      - variant: "unit commitment (min load, ramping, start-up cost)"
        rung: L0
        note: "conventional.unit_commitment: true — nuclear column in data/unit_commitment.csv; edit that CSV for different values (L3)"
      - variant: "add a planned/under-construction reactor"
        rung: L3
        note: "row in data/custom_powerplants.csv (Fueltype Nuclear) + electricity.custom_powerplants: true"
      - variant: "greenfield nuclear in sector runs (extendable Link from uranium)"
        rung: L2
        note: "sector.conventional_generation: add 'nuclear: uranium' (spatial.uranium exists, cost rows nuclear/uranium exist) — but add_carrier_buses gives uranium no fuel-supply Generator (its fossils list is [coal, gas, oil, lignite]), so also add a marginal-cost generator on the EU uranium bus (one-line extension of add_carrier_buses or the fossils list)"
      - variant: "fix/trust nuclear in myopic-foresight sector runs"
        rung: L2
        note: "two reconciliations needed at this ref: the fuel-starved EU uranium bus (as above) and the double representation of the existing fleet (keep-list Generators + brownfield Links) — drop 'nuclear' from pypsa_eur.Generator or the Nuclear row from rename_fuel in add_existing_baseyear"
      - variant: "change the national phase-out years (perfect foresight)"
        rung: L1
        note: "edit the existing_capacities.phase_outs list ({carriers, countries, year} rows); applied by apply_phase_outs only when foresight is perfect — overnight and myopic runs ignore it"
      - variant: "time-varying outage schedules per plant"
        rung: L5
        note: "no outage-profile machinery; the derating hook is static per country — a p_max_pu time series would need bespoke code in attach_conventional_generators plus data"
      - variant: "override nuclear cost/efficiency assumptions"
        rung: L1
        note: "costs.overwrites (config, deprecated) or a row in data/custom_costs.csv (costs.custom_cost_fn)"
    where:
      - change: "fleet attachment + extendable candidates + per-country p_max_pu derating + UC attributes"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (called from rule compose_network; conventional_params/conventional_inputs from the conventional config block and input_conventional in rules/build_electricity.smk)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; rules/build_electricity.smk:input_conventional"
      - change: "greenfield seeding at all substations / custom reactors"
        anchor: "scripts/build_powerplants.py::add_everywhere_powerplants / ::add_custom_powerplants (rule build_powerplants)"
        provenance: "scripts/build_powerplants.py:add_everywhere_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - change: "nuclear survival into sector networks"
        anchor: "scripts/prepare_sector_network.py::remove_elec_base_techs (pypsa_eur keep-list)"
        provenance: "scripts/prepare_sector_network.py:remove_elec_base_techs"
      - change: "uranium bus/store creation and the missing uranium fuel generator"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses (fossils list); spatial.uranium in define_spatial"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:spatial.uranium"
      - change: "brownfield nuclear Links in myopic/perfect foresight"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear (rename_fuel, carrier map nuclear->uranium)"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - change: "national nuclear phase-out years from config (perfect foresight only)"
        anchor: "scripts/prepare_perfect_foresight.py::apply_phase_outs (config existing_capacities.phase_outs)"
        provenance: "scripts/prepare_perfect_foresight.py:apply_phase_outs; config/config.default.yaml:phase_outs"
      - change: "country-wise capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints (solving.constraints.CCL)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "nuclear cost row / overwrites"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs; data/custom_costs.csv (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:prepare_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "powerplantmatching database (Fueltype Nuclear)"
        required_for: "existing fleet and (without everywhere_powerplants) siting of extendable candidates"
        availability: "retrieved by the workflow; archive shipped under data/powerplants/"
      - input: "data/nuclear_p_max_pu.csv (per-country annual availability factors)"
        required_for: "default availability derating; countries missing from the CSV keep p_max_pu = 1"
        availability: "exists by default in the repo"
      - input: "cost rows 'nuclear' and 'uranium' in the processed technology-data costs file"
        required_for: "capital/marginal cost, efficiency, lifetime, fuel price"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "data/unit_commitment.csv (nuclear column)"
        required_for: "unit commitment attributes when conventional.unit_commitment is true"
        availability: "exists by default in the repo"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps/floors (CCL)"
        availability: "template exists by default; nuclear rows user-authored"
      - input: "uranium fuel supply on the EU uranium bus"
        required_for: "brownfield/greenfield nuclear Links in sector runs"
        availability: "absent at this ref — add_carrier_buses adds bus + store but no supply generator for uranium (code edit needed)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        The existing nuclear fleet is modelled by default: "nuclear" is in
        electricity.conventional_carriers, plants come from the powerplantmatching
        database (rule build_powerplants, Nuclear fueltype, fuel_to_lifetime 50 years
        in configs/powerplantmatching_config.yaml), and
        attach_conventional_generators adds them as non-extendable Generators
        aggregated by (bus, carrier, grouping_year) with marginal/capital cost,
        efficiency and lifetime from the "nuclear" row of the technology-data costs
        file. A static country-level p_max_pu derating from historical IAEA
        2022-2024 Energy Availability Factors is applied from
        data/nuclear_p_max_pu.csv via apply_nuclear_p_max_pu (countries missing from
        the CSV keep p_max_pu = 1.0 with a warning).
      mechanism: >
        Snakefile rule build_powerplants -> resources/<run>/powerplants.csv; rule
        add_electricity runs scripts/add_electricity.py which calls
        attach_conventional_generators (fleet + any extendable conventional
        carriers) and then apply_nuclear_p_max_pu using the nuclear_p_max_pu input.
        Costs come from rule retrieve_cost_data / process_cost_data.py::load_costs.
      not_covered: >
        Nuclear is not extendable by default (not in
        electricity.extendable_carriers.Generator); when made extendable, candidate
        generators are only placed at buses that already host nuclear plants
        (carrier_buses in attach_conventional_generators) — no greenfield siting at
        arbitrary buses; no unit-commitment/ramping detail; no time-varying outage
        profiles (the IAEA derating is a static per-country factor); no fuel-cycle
        or uranium supply modelling in the electricity-only workflow.
      provenance: "scripts/add_electricity.py:attach_conventional_generators"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing nuclear fleet (remove 'nuclear' for a phase-out of existing plants)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Add "nuclear" to allow capacity expansion — extendable nuclear generators
          are created only at buses with existing nuclear plants.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "Pandas query on the fleet (DateIn/DateOut) — tightening it retires or excludes nuclear units by commissioning/retirement year."
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' injects user rows from data/custom_powerplants.csv (Fueltype Nuclear) — e.g. planned reactors missing from powerplantmatching."
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: >
          Country-wise min/max capacity limits per carrier (CSV at
          data/agg_p_nom_minmax.csv), enforced by add_CCL_constraints when "CCL" is
          in the opts wildcard — the hook for national nuclear build caps/floors.
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - key: costs.year
        effect: "Selects the technology-data cost year (costs_<year>.csv) from which the 'nuclear' row is taken."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version"
      - key: sector.hydrogen.pink_share
        effect: "In sector runs with sector.hydrogen.hydrogen_colors true, forces this share of H2 to be produced from nuclear electricity (pink H2)."
        default: "0.05"
        provenance: "scripts/solve_network.py:pink_share"
    boundary:
      - variant: "run without nuclear (phase-out of existing fleet)"
        rung: L0
        note: "remove 'nuclear' from electricity.conventional_carriers"
      - variant: "allow new nuclear build at existing sites"
        rung: L1
        note: >
          add 'nuclear' to electricity.extendable_carriers.Generator; expansion is
          restricted to buses already hosting nuclear plants
      - variant: "cap or force nuclear capacity per country"
        rung: L1
        note: >
          electricity.agg_p_nom_limits + 'CCL' in scenario.opts; edit
          data/agg_p_nom_minmax.csv rows for carrier nuclear
      - variant: "change nuclear availability factors"
        rung: L3
        note: "edit data/nuclear_p_max_pu.csv (country, factor in %) read by apply_nuclear_p_max_pu"
      - variant: "add a planned/under-construction reactor"
        rung: L3
        note: "row in data/custom_powerplants.csv with Fueltype Nuclear + electricity.custom_powerplants: merge"
      - variant: "greenfield nuclear at any bus (not just existing sites)"
        rung: L2
        note: >
          the extendable block in attach_conventional_generators derives
          carrier_buses from the existing fleet; small localised edit to place
          candidates at all buses (or seed sites via custom_powerplants, L3)
      - variant: "override nuclear investment/fuel cost assumptions"
        rung: L1
        note: >
          load_costs in process_cost_data.py reads per-attribute overwrites from the
          costs config (investment/FOM/VOM/fuel/efficiency/lifetime and
          marginal_cost/capital_cost blocks — the investment block is present but
          commented out in config.default.yaml); add e.g. costs.investment: {nuclear: ...}
      - variant: "time-varying outages / unit commitment for nuclear"
        rung: L5
        note: "no outage-profile or UC machinery exists; bespoke component logic or committable settings plus data would be needed"
      - variant: "pink hydrogen from nuclear in sector runs"
        rung: L1
        note: >
          sector.hydrogen.hydrogen_colors: true with set_color_shares/pink_share;
          dedicated nuclear-to-electrolysis buses are built in add_hydrogen and the
          share constraint applied in set_h2_colors
    where:
      - change: "fleet attachment + extendable conventional generators"
        anchor: "scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "static availability derating from IAEA factors"
        anchor: "scripts/add_electricity.py::apply_nuclear_p_max_pu (input data/nuclear_p_max_pu.csv in rule add_electricity)"
        provenance: "Snakefile:nuclear_p_max_pu"
      - change: "country-wise capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints (activated by 'CCL' in opts)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "cost assumptions / overwrites"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data"
        provenance: "scripts/process_cost_data.py:load_costs"
      - change: "fleet construction and matching config"
        anchor: "Snakefile rule build_powerplants; configs/powerplantmatching_config.yaml (fuel_to_lifetime Nuclear)"
        provenance: "configs/powerplantmatching_config.yaml:fuel_to_lifetime"
      - change: "pink hydrogen wiring (sector)"
        anchor: "scripts/prepare_sector_network.py::add_hydrogen; scripts/solve_network.py::set_h2_colors"
        provenance: "scripts/solve_network.py:set_h2_colors"
    data_dependencies:
      - input: "powerplantmatching database (Nuclear fueltype)"
        required_for: "existing fleet and the buses where extendable nuclear can be placed"
        availability: "region-dependent — global coverage varies; verify the fleet appears in resources/<run>/powerplants.csv for the target countries"
      - input: "data/nuclear_p_max_pu.csv (IAEA EAF per country)"
        required_for: "availability derating"
        availability: "exists by default; countries not listed default to p_max_pu = 1.0"
      - input: "costs row 'nuclear' in retrieved technology-data (costs.technology_data_version)"
        required_for: "capital/marginal cost, efficiency, lifetime"
        availability: "exists by default via rule retrieve_cost_data"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps/floors (CCL)"
        availability: "template exists by default; rows must be authored for nuclear"
      - input: "data/custom_powerplants.csv"
        required_for: "adding reactors missing from powerplantmatching"
        availability: "template exists by default; rows user-authored"
