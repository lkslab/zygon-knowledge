id: desalination-flexible-load
title: Desalination (flexible load)
summary: >
  Seawater desalination as an electricity demand that can be scheduled
  flexibly (with water storage buffering), soaking up cheap renewable power.
when_to_use:
  - "add desalination"
  - "desalination as flexible demand"
  - "water production from excess solar/wind"
  - "reverse osmosis load"
  - "water-energy nexus / flexible industrial load"
  - "schedulable load with product storage"
models:
  - model: pypsa-eur
    version_anchor: {ref: "492f05d32e91ff76b26a7ee67604811a54cb315a", date: "2026-10-10"}
    out_of_box:
      covers: >
        Nothing — grounded absence: "desalination" appears nowhere in scripts,
        rules or config, and there is no water carrier or water demand layer
        anywhere in the model. The only "water" concepts are thermal ("water
        tanks" heat storage) and the seawater TEMPERATURE chain
        (retrieve_seawater_temperature feeding rule build_sea_heat_potential),
        which serves district-heating heat pumps, not water supply. What the
        model does contain is every structural pattern a flexible desalination
        load needs, all in prepare_sector_network.py: add_EVs builds exactly
        the "device bus + conversion Link + product Store + fixed product
        Load" shape (AC -> BEV charger Link -> EV battery Bus/Store -> fixed
        land transport EV Load); the synthetic-fuel links (Fischer-Tropsch,
        methanolisation, Sabatier, electrolysis) carry a minimum duty cycle
        p_min_pu = sector.min_part_load_* — i.e. "flexible industrial process
        with limited turndown"; and data/custom_costs.csv
        (costs.custom_cost_fn) can introduce a brand-new technology cost row
        without code, because overwrite_costs CONCATENATES rows whose
        technology is not yet in the cost index.
      mechanism: >
        None for desalination itself. A desalination block is: per (coastal)
        node a 'water' Bus, an extendable electricity->water Link (specific
        energy consumption kWh/m3 as efficiency, CAPEX from a user cost row),
        a water Store (tank/reservoir buffer) and a fixed water-demand Load —
        authored in prepare_sector_network.py on the add_EVs /
        min_part_load template. The crudest proxy needs no water
        accounting at all: solving.options.load_sinks
        (add_load_balance_components with sign=-1) attaches infinite-capacity
        price-taking sinks at chosen bus carriers, absorbing energy whenever
        its value falls below the configured price — an interruptible
        "cheap-power soak" without any production target.
      not_covered: >
        Everything domain-specific: no water demand data, no desalination
        technology or cost row, no brine/intake modelling, no municipal water
        system, no water transport between nodes.
      provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/prepare_sector_network.py:min_part_load_methanation; scripts/solve_network.py:add_load_balance_components; scripts/process_cost_data.py:overwrite_costs"
    levers:
      - key: load.scaling_factor
        effect: "Not desalination-specific — scales the WHOLE electricity demand time series; the only existing config way to fold a known desalination consumption into demand as a flat uplift."
        default: "1.0"
        provenance: "config/config.default.yaml:scaling_factor; scripts/add_electricity.py:attach_load"
      - key: solving.options.load_sinks
        effect: "enable: true plus carriers: {AC: <price>} adds infinite generators with sign=-1 (carrier 'load') at all buses of that carrier — a price-elastic energy sink, the zero-effort stand-in for 'flexible load that absorbs cheap power'."
        default: "{enable: false, default_cost: 100000, all_carriers: false, carriers: {}}"
        provenance: "config/config.default.yaml:load_sinks; scripts/solve_network.py:add_load_balance_components"
      - key: costs.custom_cost_fn
        effect: "Points at data/custom_costs.csv, whose rows can ADD new technologies to the cost table (overwrite_costs concatenates missing technology indices) — the no-code route to a 'seawater desalination' cost row for the bespoke block."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: sector.min_part_load_fischer_tropsch
        effect: "Not desalination — but the precedent knob for 'minimum duty cycle of a flexible industrial process' (p_min_pu of the Fischer-Tropsch links; siblings min_part_load_methanolisation / _methanation / _electrolysis); a desalination Link would copy this pattern."
        default: "0.5"
        provenance: "config/config.default.yaml:min_part_load_fischer_tropsch; scripts/prepare_sector_network.py:min_part_load_methanation"
    boundary:
      - variant: "price-elastic sink absorbing cheap power (no water accounting)"
        rung: L1
        note: "solving.options.load_sinks with a carriers entry for AC (or low voltage) at the willingness-to-pay price — dispatch-side only, adds no capacity cost and no production target"
      - variant: "inflexible desalination electricity demand"
        rung: L3
        note: "data route: add the desalination consumption into the electricity demand data consumed by rule build_electricity_demand_base (or crudely via load.scaling_factor at L1); no new components, no flexibility"
      - variant: "flexible desalination load with water storage"
        rung: L5
        note: "bespoke block in prepare_sector_network.py: 'water' Bus per coastal node, extendable electricity->water Link, water Store, fixed water Load; component template = add_EVs (device bus + Store + fixed Load), duty-cycle template = the synthetic-fuel links (p_min_pu = sector.min_part_load_*); cost row via data/custom_costs.csv (L3 part)"
      - variant: "feed desalination from a national water dataset via the workflow"
        rung: L4
        note: "needs a new snakemake rule producing nodal water-demand series (siting via the onshore region shapes) plus the L5 component block consuming it"
    where:
      - change: "flexible-offtake component pattern to copy (device bus + Store + fixed Load)"
        anchor: "scripts/prepare_sector_network.py::add_EVs"
        provenance: "scripts/prepare_sector_network.py:add_EVs"
      - change: "minimum-duty-cycle flexible process pattern"
        anchor: "scripts/prepare_sector_network.py (Fischer-Tropsch / methanolisation / Sabatier links; p_min_pu = sector.min_part_load_*)"
        provenance: "scripts/prepare_sector_network.py:min_part_load_methanation; config/config.default.yaml:min_part_load_fischer_tropsch"
      - change: "where the new component block belongs"
        anchor: "scripts/prepare_sector_network.py (sector component assembly, alongside add_industry)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "price-elastic sink proxy"
        anchor: "scripts/solve_network.py::add_load_balance_components (solving.options.load_sinks)"
        provenance: "scripts/solve_network.py:add_load_balance_components"
      - change: "new desalination cost row"
        anchor: "data/custom_costs.csv (costs.custom_cost_fn), applied in scripts/process_cost_data.py::overwrite_costs"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
      - change: "inflexible-load data route"
        anchor: "rule build_electricity_demand_base (electricity demand time series) / load config chapter"
        provenance: "rules/build_electricity.smk:build_electricity_demand_base; scripts/add_electricity.py:attach_load"
    data_dependencies:
      - input: "national/nodal water demand to be met by desalination (m3/a) and plant specific energy (kWh/m3)"
        required_for: "any desalination variant"
        availability: "absent — must be supplied by the user"
      - input: "desalination cost row (CAPEX/FOM per capacity, water storage cost)"
        required_for: "the extendable flexible variant"
        availability: "absent from technology-data — addable via data/custom_costs.csv without code"
      - input: "coastal node identification (onshore/offshore region shapes)"
        required_for: "siting plants at coastal buses"
        availability: "exists by default (shapes built by the workflow)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing — "desalination"/"desal" appears nowhere in scripts, config, or the
        Snakefile; there is no water carrier or water demand anywhere (the H2 export
        chain does not model feed-water either). Grounded absence.
      mechanism: >-
        None. The model does contain the exact structural pattern a flexible
        desalination load needs: add_export.py:add_export builds an offtake with a
        Bus + optional buffer Store + Load (H2 export with a ship-profile demand),
        which is precisely "product storage decouples production timing from
        delivery". A desalination block is the same shape: AC bus -> desalination
        Link (electricity -> water bus) -> water Store -> fixed water-demand Load.
      not_covered: >-
        Everything: no water demand data, no desalination technology/cost row, no
        brine or intake modelling, no coupling to the (also absent) municipal water
        system.
      provenance: "scripts/add_export.py:add_export"
    levers:
      - key: load_options.scale
        effect: "Not desalination-specific — the only existing way to inflate electricity demand if desalination is folded in as a flat inflexible load (scales ALL load time series)."
        default: "1"
        provenance: "config.default.yaml:scale ; scripts/build_demand_profiles.py:load_options"
    boundary:
      - variant: "Inflexible desalination electricity demand"
        rung: L3
        note: >-
          Data route: add the desalination electricity demand into the demand
          profiles consumed by build_demand_profiles (or crudely via
          load_options.scale) — no new components, no flexibility.
      - variant: "Flexible desalination load with water storage"
        rung: L5
        note: >-
          Bespoke Python in prepare_sector_network: new 'water' Bus per (coastal)
          node, an extendable electricity->water Link (specific energy consumption
          as efficiency), a water Store (tank/reservoir buffer), and a fixed water
          Load. Direct template: the Store+Load offtake pattern in
          add_export.py:add_export; cost row must be added (none exists).
      - variant: "Feed desalination demand from a proper national water dataset via the workflow"
        rung: L4
        note: "Needs a new snakemake rule producing nodal water-demand series plus the L5 component block consuming it."
    where:
      - change: "Flexible-offtake component pattern to copy"
        anchor: "scripts/add_export.py function add_export (export Bus + Store + Load)"
        provenance: "scripts/add_export.py:add_export"
      - change: "Where the new component block belongs"
        anchor: "scripts/prepare_sector_network.py (sector component assembly; cf. add_industry / add_agriculture load patterns)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "Inflexible-load data route"
        anchor: "scripts/build_demand_profiles.py (electricity demand profiles)"
        provenance: "scripts/build_demand_profiles.py:build_demand_profiles"
    data_dependencies:
      - input: "National/nodal water demand to be met by desalination (m3/a) and plant specific energy (kWh/m3)"
        required_for: "Any desalination variant"
        availability: "absent — must be supplied by the user"
      - input: "Desalination cost row (CAPEX/FOM per capacity, storage costs)"
        required_for: "Extendable flexible variant"
        availability: "absent — no row in the shipped cost data"
      - input: "Coastal node identification (offshore/country shapes)"
        required_for: "Siting plants at coastal buses"
        availability: "exists by default (shapes built by the workflow)"
