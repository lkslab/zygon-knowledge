id: direct-air-capture
title: Direct air capture (DACCS)
summary: >
  Machines that pull CO2 directly out of the atmosphere using electricity and
  heat, with the captured CO2 routed to geological sequestration (DACCS) or to
  utilisation as a feedstock for synthetic fuels.
when_to_use:
  - "add direct air capture"
  - "DAC / DACCS"
  - "carbon removal machines"
  - "suck CO2 out of the air"
  - "negative emissions technology"
  - "carbon dioxide removal (CDR)"
  - "CO2 sequestration budget / storage potential"
  - "regional CO2 storage siting"
  - "carbon price driving removals"
  - "pypsa-eur carrier names: DAC, co2 stored, co2 sequestered, CO2 pipeline"
  - "CO2 storage / sequestration budget"
  - "CO2 pipeline network"
  - "known in pypsa-eur as: DAC"
models:
  - model: pypsa-eur
    version_anchor: {ref: "a6c45e5a2d926ba9a5566cba24d905cff9f89939", date: "2026-09-09"}
    out_of_box:
      covers: >
        Fully covered in sector runs, on by default. add_dac (sector.dac: true)
        places one extendable "DAC" Link at every bus carrying "urban central
        heat" or "services urban decentral heat". Unlike pypsa-earth, the link
        is dimensioned in ELECTRICITY: bus0 is the local AC node, bus1 the heat
        bus (heat is CONSUMED via a negative efficiency), bus2 "co2 atmosphere"
        (withdrawn, efficiency2 = -1/electricity_input), bus3 the local "co2
        stored" bus (efficiency3 = +1/electricity_input). Energy terms come
        from the "direct air capture" cost row: electricity_input =
        electricity-input + compression-electricity-input (0.4 + 0.15 = 0.55
        MWh_el/tCO2 in the shipped 2050 data), net heat_input = heat-input -
        compression-heat-output (1.6 - 0.2 = 1.4 MWh_th/tCO2); capital_cost is
        the DAC investment divided by electricity_input (EUR per MW_el). The
        surrounding chain from add_co2_tracking: a "co2 atmosphere" Store with
        e_min_pu = -1 (net removal representable) and marginal_cost = -co2_price
        (a configured CO2 price is EARNED by withdrawal), per-node "co2 stored"
        buses with CYCLIC tank Stores (cost row "CO2 storage tank" — captured
        CO2 cannot accumulate over the year, it must be sequestered, utilised
        or vented within the horizon), and per-node one-way "co2 sequestered"
        Links + Stores whose e_nom_max comes from regionalised CO2Stop geology
        (sector.regional_co2_sequestration_potential.enable: true by default,
        OFFSHORE regions only, clipped at max_size*1e3 Mt and annualised by
        years_of_storage) priced at sector.co2_sequestration_cost (30
        EUR/tCO2). On top, prepare_network in solve_network.py adds a
        GlobalConstraint on carrier "co2 sequestered" capping yearly
        sequestration at the per-horizon dict sector.co2_sequestration_potential
        (0 Mt in 2020/2025 ramping to 250 Mt in 2050 — DAC-to-storage is
        structurally impossible before 2030 with defaults). CO2 pipelines
        between stored buses via add_co2_network (sector.co2_network: true,
        onshore/submarine costs by underwater fraction). Deployment is driven
        by the co2_budget chapter (apply_co2_budget_constraints -> add_co2limit
        in compose_network) and/or costs.emission_prices.
      mechanism: >
        rule compose_network runs scripts/prepare_sector_network.py:
        add_co2_tracking builds atmosphere/stored/sequestered buses and stores
        (reading resources/<run>/co2_sequestration_potential.csv
        from rule build_clustered_co2_sequestration_potentials, which allocates
        the CO2Stop database of rule retrieve_co2stop onto offshore regions);
        add_dac adds the DAC links; add_co2_network the pipelines. rule
        solve_network applies the sequestration cap in solve_network.py::
        prepare_network (add_co2_sequestration_limit, only when "co2
        sequestered" stores exist).
      not_covered: >
        DAC exists only where the two heat carriers exist — sector.heating:
        false leaves add_dac attaching zero links (silently, no warning). One
        generic technology from one cost row: no solid-sorbent vs
        liquid-solvent distinction and no electricity-only variant (the heat
        input is hard-wired into the link efficiencies). Captured CO2 lands on
        "co2 stored", where it COMPETES with utilisation — Sabatier,
        Fischer-Tropsch and methanolisation draw from the same buses — and
        only the flow into "co2 sequestered" counts as removal against the
        budget. Venting from storage is off by default (sector.co2_vent:
        false). No CO2 shipping, no DAC brownfield capacity or vintages in
        add_existing_baseyear. The CO2 pipeline / geological storage chain has
        its own carrier card (co2-transport-and-sequestration) — not duplicated
        here.
      provenance: "scripts/prepare_sector_network.py:add_dac; scripts/prepare_sector_network.py:add_co2_tracking; scripts/prepare_sector_network.py:add_co2_network; scripts/solve_network.py:add_co2_sequestration_limit; scripts/solve_network.py:prepare_network; scripts/build_clustered_co2_sequestration_potentials.py:allocate_sequestration_potential"
    levers:
      - key: sector.dac
        effect: "Master switch for the DAC links."
        default: "true"
        provenance: "config/config.default.yaml:dac; scripts/prepare_sector_network.py:add_dac"
      - key: sector.co2_sequestration_potential
        effect: "Per-horizon dict (Mt/a) capping total flow into 'co2 sequestered' stores — the DACCS removal ceiling (shared with all CC routes)."
        default: "{2020: 0, 2025: 0, 2030: 40, 2035: 100, 2040: 180, 2045: 250, 2050: 250}"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: sector.co2_sequestration_cost
        effect: "Capital cost (EUR/tCO2) on the 'co2 sequestered' Stores."
        default: "30"
        provenance: "config/config.default.yaml:co2_sequestration_cost; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: sector.co2_sequestration_lifetime
        effect: "Lifetime (years) of the sequestration stores."
        default: "50"
        provenance: "config/config.default.yaml:co2_sequestration_lifetime; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: sector.regional_co2_sequestration_potential.enable
        effect: "true regionalises storage e_nom_max per node from the CO2Stop geology database; false gives every node unlimited stores (only the solver cap binds)."
        default: "true"
        provenance: "config/config.default.yaml:regional_co2_sequestration_potential; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: sector.regional_co2_sequestration_potential.include_onshore
        effect: "true adds onshore formations to the (default offshore-only) regional storage potentials."
        default: "false"
        provenance: "config/config.default.yaml:include_onshore; scripts/build_clustered_co2_sequestration_potentials.py:include_onshore"
      - key: sector.co2_spatial
        effect: "false collapses the per-node 'co2 stored' buses to one EU bus (no regional storage siting, no meaningful CO2 network)."
        default: "true"
        provenance: "config/config.default.yaml:co2_spatial; scripts/prepare_sector_network.py:co2_spatial"
      - key: sector.co2_network
        effect: "true adds extendable bidirectional 'CO2 pipeline' Links between the stored buses (onshore + submarine costs by underwater fraction)."
        default: "true"
        provenance: "config/config.default.yaml:co2_network; scripts/prepare_sector_network.py:add_co2_network"
      - key: sector.co2_network_cost_factor
        effect: "Scales the CO2 pipeline capital costs."
        default: "1"
        provenance: "config/config.default.yaml:co2_network_cost_factor; scripts/prepare_sector_network.py:add_co2_network"
      - key: sector.co2_vent
        effect: "true adds 'co2 vent' links from storage back to atmosphere (escape valve for over-captured CO2)."
        default: "false"
        provenance: "config/config.default.yaml:co2_vent; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: costs.emission_prices
        effect: "enable: true sets the 'co2 atmosphere' Store marginal_cost to -co2 (per horizon), so DAC directly EARNS the CO2 price — drives removals without a cap."
        default: "{enable: false, co2: 0.0, ...}"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: co2_budget
        effect: "Per-horizon CO2 cap vs 1990 (co2_budget.upper/lower, GlobalConstraint co2_atmosphere via apply_co2_budget_constraints -> add_co2limit); tight/negative budgets are the main pull for DAC deployment."
        default: "{2020: 0.72, ..., 2050: 0.0}"
        provenance: "config/config.default.yaml:co2_budget; scripts/prepare_network.py:apply_co2_budget_constraints"
      - key: sector.heating
        effect: "Gates add_heat — false removes all heat buses and with them every DAC placement site (add_dac then attaches nothing)."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_dac"
      - key: costs.custom_cost_fn
        effect: "CSV of cost overrides applied in prepare_costs — the route to change the 'direct air capture' row's investment or its energy-input attributes (electricity-input etc. are NOT reachable via costs.overwrites)."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "run with DAC available everywhere with heat buses"
        rung: L0
        note: "default — sector.dac: true; deployment happens only once the co2_budget / carbon price makes removal worthwhile and the sequestration budget is nonzero (2030 onwards with defaults)"
      - variant: "disable DAC"
        rung: L0
        note: "sector.dac: false"
      - variant: "change the removal ceiling per horizon"
        rung: L0
        note: "edit the sector.co2_sequestration_potential dict (Mt/a per planning year)"
      - variant: "drive DAC with a CO2 price instead of a cap"
        rung: L1
        note: "costs.emission_prices: {enable: true, co2: <price>} — the atmosphere store pays that price per tonne withdrawn"
      - variant: "allow onshore geological storage"
        rung: L1
        note: "sector.regional_co2_sequestration_potential.include_onshore: true (rule build_clustered_co2_sequestration_potentials re-allocates over onshore + offshore regions)"
      - variant: "non-regional (unlimited per-node) storage"
        rung: L1
        note: "sector.regional_co2_sequestration_potential.enable: false — only the global yearly cap binds"
      - variant: "different DAC CAPEX / energy demand assumptions"
        rung: L3
        note: "rows for technology 'direct air capture' in data/custom_costs.csv (costs.custom_cost_fn) — raw attributes incl. electricity-input / heat-input are overridable there; costs.overwrites (config) cannot reach them"
      - variant: "electricity-only DAC or DAC at every AC bus regardless of heat"
        rung: L2
        note: "edit add_dac — drop the heat term from the efficiencies and widen the bus selection beyond the two heat carriers"
      - variant: "second DAC technology (e.g. solid sorbent vs liquid solvent)"
        rung: L2
        note: "clone the add_dac block under a new carrier + author its cost rows in data/custom_costs.csv (overwrite_costs concatenates technologies that do not yet exist) (L3 for the rows)"
      - variant: "CO2 shipping / non-pipeline CO2 transport"
        rung: L5
        note: "no such mode; new link/route logic beyond the pipeline topology of add_co2_network"
      - variant: "DAC fleet with build years / existing plants"
        rung: L5
        note: "add_existing_baseyear has no DAC branch; bespoke brownfield logic needed"
    where:
      - change: "DAC placement, energy inputs, cost"
        anchor: "scripts/prepare_sector_network.py::add_dac (called under options['dac'])"
        provenance: "scripts/prepare_sector_network.py:add_dac"
      - change: "CO2 atmosphere/stored/sequestered buses, stores, vents; regional e_nom_max; CO2 price on the atmosphere store"
        anchor: "scripts/prepare_sector_network.py::add_co2_tracking"
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking"
      - change: "CO2 pipeline network"
        anchor: "scripts/prepare_sector_network.py::add_co2_network (sector.co2_network)"
        provenance: "scripts/prepare_sector_network.py:add_co2_network"
      - change: "yearly sequestration cap"
        anchor: "scripts/solve_network.py::add_co2_sequestration_limit (called from ::prepare_network when co2 sequestered stores exist)"
        provenance: "scripts/solve_network.py:add_co2_sequestration_limit; scripts/solve_network.py:prepare_network"
      - change: "regional storage potential data"
        anchor: "rules build_co2_sequestration_potentials + build_clustered_co2_sequestration_potentials (CO2Stop via rule retrieve_co2stop)"
        provenance: "rules/build_sector.smk:build_clustered_co2_sequestration_potentials; rules/retrieve.smk:retrieve_co2stop"
      - change: "DAC cost row overrides / new removal technologies' rows"
        anchor: "data/custom_costs.csv via scripts/process_cost_data.py::overwrite_costs (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "cost row 'direct air capture' (investment, electricity-input, heat-input, compression terms) from technology-data v0.14.0"
        required_for: "DAC link costs and energy inputs"
        availability: "exists by default (rule retrieve_cost_data + rule process_cost_data)"
      - input: "CO2Stop storage/traps tables + maps"
        required_for: "regional sequestration e_nom_max (regional_co2_sequestration_potential.enable)"
        availability: "retrieved by the workflow (rule retrieve_co2stop); European coverage only"
      - input: "urban central heat / services urban decentral heat buses"
        required_for: "any DAC placement at all"
        availability: "exists by default when sector.heating is true (heat workflow)"
      - input: "cost rows 'CO2 storage tank', 'CO2 pipeline', 'CO2 submarine pipeline'"
        required_for: "the stored-CO2 buffering and transport chain"
        availability: "exists by default via retrieve_cost_data"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Extendable DAC Links plus a full CO2 accounting chain. add_dac (gated by
        sector.dac) places "DAC" Links at buses carrying "urban central heat" or
        "services urban decentral heat": bus0 "co2 atmosphere" -> bus1 the local
        "co2 stored" bus, consuming electricity (bus2) and heat (bus3) per the
        "direct air capture" cost row (electricity-input, heat-input, compression
        terms). add_co2 provides the chain: a global "co2 atmosphere" Bus+Store
        (e_min_pu=-1, so it can go negative = net removal), per-node "co2 stored"
        Buses+Stores priced at sector.co2_sequestration_cost, "co2 vent" Links back to
        atmosphere, and an optional "CO2 pipeline" network between stored buses
        (sector.co2_network). Total end-of-horizon stored CO2 is capped by the solver
        constraint add_co2_sequestration_limit at sector.co2_sequestration_potential
        (MtCO2/a). DAC only deploys when a CO2 price/budget makes it worthwhile.
      mechanism: >-
        prepare_sector_network.py:add_dac builds the Links (p_nom_extendable);
        prepare_sector_network.py:add_co2 builds the buses/stores/vents/pipelines;
        solve_network.py:add_co2_sequestration_limit (called from extra_functionality)
        enforces the sequestration cap on Store-e of "co2 stored" at the last
        snapshot.
      not_covered: >-
        DAC exists only where district-heating / services-decentral heat buses exist
        (no heat sector or no such buses => no DAC anywhere); sequestration potential
        is ONE global scalar — no regional storage siting or geology data (each
        co2 stored Store has e_nom_max inf, only the aggregate constraint binds); no
        solid-sorbent vs liquid-solvent distinction; no CO2 shipping; no utilisation
        accounting beyond the existing Fischer-Tropsch/methanation consumers of
        co2 stored.
      provenance: "scripts/prepare_sector_network.py:add_dac"
    levers:
      - key: sector.dac
        effect: "Switch DAC Links on/off."
        default: "true"
        provenance: "config.default.yaml:dac ; scripts/prepare_sector_network.py:add_dac"
      - key: sector.co2_sequestration_potential
        effect: "Cap (MtCO2/a) on total CO2 in 'co2 stored' Stores at the end of the horizon — the DACCS ceiling."
        default: "200"
        provenance: "config.default.yaml:co2_sequestration_potential ; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: sector.co2_sequestration_cost
        effect: "Capital cost (EUR/tCO2) on the 'co2 stored' Stores."
        default: "10"
        provenance: "config.default.yaml:co2_sequestration_cost ; scripts/prepare_sector_network.py:add_co2"
      - key: sector.co2_network
        effect: "If true, adds 'CO2 pipeline' Links between nodes so captured CO2 can move to other storage nodes (onshore/submarine pipeline costs by underwater fraction)."
        default: "true"
        provenance: "config.default.yaml:co2_network ; scripts/prepare_sector_network.py:add_co2"
      - key: sector.enable.heat
        effect: "DAC needs heat buses to attach to; disabling heat removes DAC placement sites."
        default: "true"
        provenance: "config.default.yaml:heat ; scripts/prepare_sector_network.py:add_dac"
      - key: costs.technology_data_version
        effect: "Version of PyPSA/technology-data pulled for the 'direct air capture' cost row (CAPEX, energy inputs)."
        default: "v0.13.2"
        provenance: "config.default.yaml:technology_data_version ; Snakefile:retrieve_cost_data"
    boundary:
      - variant: "Enable/disable DAC; change storage budget or cost"
        rung: L0
        note: "sector.dac / sector.co2_sequestration_potential / sector.co2_sequestration_cost."
      - variant: "Different DAC cost/energy assumptions"
        rung: L3
        note: "Override the 'direct air capture' row in the costs CSV (or pin a different technology_data_version)."
      - variant: "DAC without heat coupling / at every electricity bus"
        rung: L2
        note: "Edit the bus selection and efficiency terms in add_dac (currently filtered to the two heat carriers)."
      - variant: "Regional sequestration potentials (geology-based)"
        rung: L3
        note: "Needs a per-region storage dataset plus a localised edit: set e_nom_max per 'co2 stored' Store in add_co2 (and/or regionalise the solver constraint) instead of the single global cap."
      - variant: "CO2 shipping / non-pipeline transport"
        rung: L5
        note: "No such transport mode; new Link/route logic beyond the pipeline topology in add_co2."
    where:
      - change: "DAC placement / energy inputs"
        anchor: "scripts/prepare_sector_network.py function add_dac"
        provenance: "scripts/prepare_sector_network.py:add_dac"
      - change: "CO2 buses, stores, vents, pipelines / regional storage caps"
        anchor: "scripts/prepare_sector_network.py function add_co2"
        provenance: "scripts/prepare_sector_network.py:add_co2"
      - change: "Sequestration cap constraint"
        anchor: "scripts/solve_network.py function add_co2_sequestration_limit (called in extra_functionality)"
        provenance: "scripts/solve_network.py:add_co2_sequestration_limit"
      - change: "DAC cost row"
        anchor: "Snakefile rule retrieve_cost_data (technology-data outputs) or data/costs.csv when retrieval is disabled"
        provenance: "Snakefile:retrieve_cost_data"
    data_dependencies:
      - input: "Cost row 'direct air capture' (technology-data)"
        required_for: "DAC Link costs and energy inputs"
        availability: "exists by default"
      - input: "Regional CO2 storage capacity assessment (saline aquifers, depleted fields)"
        required_for: "Regionalised sequestration variant; a defensible value for sector.co2_sequestration_potential outside Europe (the default 200 MtCO2/a is a Europe number)"
        availability: "absent — must be supplied by the user for the target region"
      - input: "District heating buses (heat demand + sector.district_heating config)"
        required_for: "Any DAC deployment at all (placement sites)"
        availability: "exists by default when the heat sector is enabled"
