id: e-diesel-fischer-tropsch
title: E-diesel / Fischer-Tropsch synthetic fuels
summary: >
  Fischer-Tropsch synthesis of liquid hydrocarbons from hydrogen and
  captured CO2 — the generic power-to-liquids route supplying the oil pool
  that serves diesel-like, naphtha and kerosene demands.
when_to_use:
  - "e-diesel / synthetic diesel"
  - "Fischer-Tropsch / FT synthesis"
  - "power-to-liquids / PtL"
  - "e-fuels for transport, shipping, industry feedstock"
  - "synthetic oil / synthetic hydrocarbons"
  - "FT part load / flexibility"
  - "CO2 utilisation to liquid fuels"
  - "pypsa-eur carrier names: Fischer-Tropsch, oil, shipping oil, land transport oil, naphtha for industry"
  - "Fischer-Tropsch plant"
  - "power-to-liquid (PtL)"
  - "synthetic fuels for trucks, shipping, machinery"
  - "e-naphtha for chemicals"
  - "replace fossil oil with synthetic fuel"
  - "known in pypsa-eur as: Fischer-Tropsch, liquid, power-to-liquid"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        ON by default and unconditional within add_industry: an extendable
        "Fischer-Tropsch" Link at every node with bus0 = nodal H2, bus1 =
        the single "EU oil" bus and bus2 = co2 stored as an INPUT
        (efficiency2 = -oil CO2 intensity x efficiency — the synthesised
        fuel's carbon is withdrawn from captured CO2, so later combustion
        against "co2 atmosphere" nets to ~zero). Costs/efficiency from the
        "Fischer-Tropsch" cost row (capital per MW H2). Operationally the
        plant is a MUST-RUN by default: p_min_pu =
        sector.min_part_load_fischer_tropsch = 0.5, i.e. any built FT
        capacity runs at >= 50% in every snapshot — a strong design choice
        that penalises FT as a flexible H2 sink. 25% of waste heat can
        serve district heating (sector.use_fischer_tropsch_waste_heat,
        bus3 in add_waste_heat, efficiency3 = 0.95 - efficiency scaled).
        The product is a single generic oil commodity on the copperplate
        EU oil bus, from where fixed demand links serve land transport ICE,
        shipping oil, agriculture machinery, naphtha for industry, kerosene
        for aviation, oil boilers and oil power — FT output is fungible
        with fossil oil, unsustainable bioliquids, biomass-to-liquid and
        electrobiofuels. Myopic runs carry built FT capacity forward via
        add_brownfield.
      mechanism: >
        rule prepare_sector_network -> add_industry (Fischer-Tropsch block
        right after the oil boiler block); oil bus + fossil supply from
        add_carrier_buses; CO2 feedstock from the co2 stored buses
        (add_co2_tracking + capture technologies); waste heat in
        add_waste_heat. Since spatial.oil.nodes is hardcoded to ["EU oil"]
        in define_spatial, FT siting only matters via its hydrogen,
        electricity-indirect and heat interfaces.
      not_covered: >
        No product split — no separate diesel/kerosene/naphtha outputs or
        yield fractions (one oil commodity; the demand-side buses like
        "kerosene for aviation" are fed from the pool, see e-kerosene-saf).
        No CO2-source discrimination (co2 stored pools DAC, biogenic and
        fossil capture). No regional oil balancing or transport (single EU
        bus; sector.regional_oil_demand only regionalises demand
        accounting). No existing FT plants. Electrobiofuels — an FT-based
        biomass+H2 hybrid — is a separate default-on technology covered in
        advanced-biofuels. Gated by sector.industry: with the industry
        sector off, the FT link is never created.
      provenance: "scripts/prepare_sector_network.py:Fischer-Tropsch; scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:min_part_load_fischer_tropsch; scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:add_waste_heat; scripts/add_brownfield.py:add_brownfield"
    levers:
      - key: sector.min_part_load_fischer_tropsch
        effect: "p_min_pu of all FT links — the default 0.5 makes FT a baseload plant; set 0 for fully flexible load-following operation."
        default: "0.5"
        provenance: "config/config.default.yaml:min_part_load_fischer_tropsch; scripts/prepare_sector_network.py:min_part_load_fischer_tropsch"
      - key: sector.use_fischer_tropsch_waste_heat
        effect: "Fraction of FT waste heat (0.95 minus fuel efficiency) delivered to urban central heat buses."
        default: "0.25"
        provenance: "config/config.default.yaml:use_fischer_tropsch_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.fossil_fuels
        effect: "false removes fossil oil (and coal/gas/lignite) supply generators — oil demand must then be met by FT, BtL, electrobiofuels, bioliquids or imports."
        default: "true"
        provenance: "config/config.default.yaml:fossil_fuels; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.imports.enable
        effect: "true adds fixed-price 'import oil' (125 EUR/MWh default, carbon-accounted against the atmosphere bus) — a competing green-liquids source."
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:import oil"
      - key: sector.regional_oil_demand
        effect: "Regionalises the oil DEMAND buses (land transport, shipping, naphtha, kerosene, agriculture) — pure accounting; the supply pool stays a single EU bus."
        default: "true"
        provenance: "config/config.default.yaml:regional_oil_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: costs.overwrites
        effect: "Override 'Fischer-Tropsch' investment/efficiency/VOM/lifetime (or via data/custom_costs.csv rows, costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "FT e-fuels as an investment option"
        rung: L0
        note: "default and unconditional in add_industry (requires sector.industry true)"
      - variant: "flexible (load-following) FT operation"
        rung: L1
        note: "sector.min_part_load_fischer_tropsch: 0 — the 0.5 default otherwise forces baseload operation"
      - variant: "force 100% synthetic oil (no fossil crude)"
        rung: L1
        note: "sector.fossil_fuels: false (system-wide, removes all fossil supply carriers) — an oil-only phase-out needs an L2 edit in add_carrier_buses"
      - variant: "FT restricted to biogenic/DAC CO2"
        rung: L5
        note: "CO2 sources are pooled on co2 stored buses; needs source-resolved CO2 buses or a custom constraint"
      - variant: "product-split FT (diesel/kerosene/naphtha fractions)"
        rung: L2
        note: "convert the FT link into a multilink with fixed output fractions to spatial.oil.kerosene / spatial.oil.naphtha (buses exist); consistent cost/yield data is on the user (L3)"
      - variant: "site-specific FT capacity limits"
        rung: L2
        note: "no config key — set p_nom_max on the n.add call in add_industry"
      - variant: "regional oil pools with transport"
        rung: L2
        note: "define_spatial hardcodes spatial.oil.nodes = ['EU oil']; nodalising needs edits there plus transport links and re-pointing of every oil consumer"
      - variant: "existing FT / e-fuel plants"
        rung: L2
        note: "no data hook; add non-extendable links with p_nom and build_year"
    where:
      - change: "FT link creation (siting, part load, CO2 coefficient)"
        anchor: "scripts/prepare_sector_network.py::add_industry (Fischer-Tropsch n.add)"
        provenance: "scripts/prepare_sector_network.py:Fischer-Tropsch"
      - change: "oil pool, fossil competitor and refining emissions"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses (oil branch) and ::define_spatial (spatial.oil)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:define_spatial"
      - change: "waste heat delivery"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat (use_fischer_tropsch_waste_heat branch)"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "cost row values"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs (row 'Fischer-Tropsch')"
        provenance: "scripts/process_cost_data.py:prepare_costs"
      - change: "custom constraints (CO2 sourcing, synthetic shares)"
        anchor: "solve_network.py::extra_functionality custom_extra_functionality hook"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
    data_dependencies:
      - input: "cost rows 'Fischer-Tropsch' and 'oil' (CO2 intensity sets the carbon withdrawal coefficient)"
        required_for: "FT economics and carbon accounting"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "co2 stored buses with captured CO2 supply"
        required_for: "the CO2 feedstock input (bus2)"
        availability: "exists by default (add_co2_tracking; DAC/point-source capture per their carrier cards)"
      - input: "nodal H2 buses with supply"
        required_for: "the hydrogen feedstock"
        availability: "exists by default (add_h2_gas_infrastructure)"
      - input: "oil demand loads (land transport, shipping, naphtha, kerosene, agriculture chains)"
        required_for: "anything to sell the product to"
        availability: "exists by default in sector runs with transport/shipping/industry/aviation enabled"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        With sector.fischer_tropsch true (default), one extendable "Fischer-Tropsch" Link per node:
        bus0 = node H2 bus, bus1 = spatial.oil.nodes (oil product), bus2 = spatial.co2.nodes with
        negative efficiency (consumes stored CO2 proportional to oil CO2 intensity x FT
        efficiency), bus3 = AC bus with negative efficiency (electricity input), p_min_pu from
        sector.min_part_load_fischer_tropsch (0.9). All FT economics from the technology-data
        "Fischer-Tropsch" row (converted from per-MW-FT to per-MW-H2). The oil bus it feeds is
        UNDIFFERENTIATED liquid hydrocarbon serving every oil demand: land transport oil, shipping
        oil, kerosene for aviation, naphtha for industry, agriculture machinery, oil boilers — so
        "e-diesel" is realised as FT output displacing the extendable fossil oil Generator
        (marginal cost = oil fuel price; initial store energy from fossil_reserves.oil) on the
        same bus, typically driven by a CO2 constraint.
      mechanism: >
        scripts/prepare_sector_network.py:H2_liquid_fossil_conversions, called from the main block
        under 'if options["fischer_tropsch"]'. Oil bus / store / fossil generator fallback created
        in add_shipping's oil block and via add_carrier_buses (e_initial from fossil_reserves).
        There is no product split — diesel/kerosene/naphtha are one carrier "oil".
      not_covered: >
        No product slate (no separate diesel vs kerosene vs naphtha outputs); no direct-air-capture
        coupling requirement (CO2 comes from whatever fills co2 stored — point-source CC or DAC if
        sector.dac); no minimum synthetic quota on any oil demand; no FT waste-heat recovery; no
        brownfield FT plants.
      provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
    levers:
      - key: sector.fischer_tropsch
        effect: Enables/disables the FT links entirely.
        default: "true"
        provenance: "config.default.yaml:fischer_tropsch; scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - key: sector.min_part_load_fischer_tropsch
        effect: Minimum part load (p_min_pu) of built FT capacity — high default makes FT effectively baseload once invested.
        default: "0.9"
        provenance: "config.default.yaml:min_part_load_fischer_tropsch; scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - key: sector.oil.spatial_oil
        effect: Nodal oil buses (FT output usable locally) vs single "Earth oil" copperplate.
        default: "true"
        provenance: "config.default.yaml:spatial_oil; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.dac
        effect: Adds direct air capture as an additional source of stored CO2 for FT feedstock.
        default: "true"
        provenance: "config.default.yaml:dac; scripts/prepare_sector_network.py:add_dac"
      - key: sector.co2_network
        effect: Nodal co2 stored buses with CO2 pipelines vs single store — where FT can source its CO2.
        default: "true"
        provenance: "config.default.yaml:co2_network; scripts/prepare_sector_network.py:add_co2"
      - key: fossil_reserves.oil
        effect: Initial energy (TWh) in the fossil oil Store that FT competes against.
        default: "100"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses"
    boundary:
      - variant: "FT as an investment option"
        rung: L0
        note: Default on.
      - variant: "Flexible (load-following) FT operation"
        rung: L1
        note: Lower sector.min_part_load_fischer_tropsch toward 0.
      - variant: "Force 100% synthetic oil (no fossil crude)"
        rung: L2
        note: No config switch for the fossil oil Generator; remove/zero it where it is added (oil block in add_shipping / add_carrier_buses), or bound it via a custom constraint (L5). A tight Co2L cap approximates this at L1.
      - variant: "FT with only biogenic/DAC CO2"
        rung: L5
        note: co2 stored is a pooled carrier; provenance-restricted CO2 needs separate CO2 carriers/buses and rewiring of CC/DAC/FT links.
      - variant: "Product-split FT (diesel/kerosene/naphtha fractions)"
        rung: L4
        note: New product buses + multi-output link replacing the single oil output; downstream loads (add_aviation, add_industry, add_land_transport, add_shipping) must be re-pointed.
      - variant: "Site-specific FT capacity limits"
        rung: L2
        note: Add p_nom_max in the madd call in H2_liquid_fossil_conversions.
    where:
      - change: "FT link definition (efficiencies, part load, bounds)"
        anchor: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - change: "Enable/disable hook"
        anchor: "scripts/prepare_sector_network.py main block ('if options[\"fischer_tropsch\"]')"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - change: "Fossil oil competition (generator/store)"
        anchor: "scripts/prepare_sector_network.py:add_shipping (oil bus block) and add_carrier_buses"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "Custom synthetic-share constraints"
        anchor: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "technology-data costs csv row: Fischer-Tropsch (efficiency, electricity-input, hydrogen-input, fixed, lifetime); oil row (CO2 intensity, fuel)"
        required_for: "FT link and fossil competitor"
        availability: "must be built (rule retrieve_cost_data); row confirmed in built costs file"
      - input: "stored CO2 supply (CC on industry/CHP via sector.cc, or DAC via sector.dac)"
        required_for: "FT carbon feedstock"
        availability: "exists by default in the sector workflow"
      - input: "H2 supply chain (see electrolysers / blue-hydrogen carrier cards)"
        required_for: "FT hydrogen feedstock"
        availability: "exists by default"
