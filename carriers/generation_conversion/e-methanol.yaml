id: e-methanol
title: E-methanol (power/H2 + CO2 methanol synthesis)
summary: >
  Synthetic methanol produced from hydrogen, electricity and captured CO2
  (methanolisation) — the power-to-methanol route feeding shipping and
  industrial methanol demand.
when_to_use:
  - "e-methanol / green methanol"
  - "methanol synthesis from hydrogen and CO2"
  - "power-to-methanol / methanolisation"
  - "methanol for shipping"
  - "industrial methanol demand"
  - "methanol imports"
  - "CO2 utilisation to methanol"
  - "pypsa-eur carrier names: methanolisation, methanol, shipping methanol, industry methanol, import methanol"
  - "add e-methanol / green methanol production"
  - "methanol as shipping fuel"
  - "methanolisation of CO2"
  - "methanol-to-X (kerosene, olefins) chains"
  - "power-to-methanol"
  - "grey methanol / blue methanol from natural gas"
  - "which methanol route: e-, bio-, biogas or fossil methanol"
  - "known in pypsa-eur as: methanol, methanol transport, methanolisation, biomass-to-methanol, biomass-to-methanol CC, e-biomethanol, biogas to methanol, e-biogas-methanol, grey methanol, blue methanol, Methanol steam reforming, Methanol steam reforming CC, methanol-to-olefins/aromatics, allam methanol, CCGT methanol, CCGT methanol CC, OCGT methanol"
models:
  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        The synthesis route is ON by default, but it lives inside
        add_industry: an extendable "methanolisation" Link is added at every
        H2 location with bus0 = nodal H2, bus1 = the methanol bus, bus2 =
        electricity (consumed, negative efficiency2) and bus3 = co2 stored
        (consumed, negative efficiency3), with energetics from the
        "methanolisation" cost row (hydrogen-input, electricity-input,
        carbondioxide-input) and a must-run floor p_min_pu =
        sector.min_part_load_methanolisation (0.3). Methanol itself is
        ALWAYS a single "EU methanol" bus — define_spatial hardcodes
        spatial.methanol.nodes to ["EU methanol"] regardless of other
        spatial switches (copperplate methanol; only the DEMAND buses
        regionalise via sector.methanol.regional_methanol_demand, default
        false). add_methanol (gated by sector.methanol) creates the
        methanol carrier/bus/Store via add_carrier_buses (storage priced
        from "General liquid hydrocarbon storage (product)"). Demands:
        "shipping methanol" loads with a share ramping 0 (2020) to 1.0
        (2050) of shipping energy (add_shipping,
        sector.shipping_methanol_share — combustion CO2 charged to
        atmosphere at the methanolisation carbondioxide-input), and
        "industry methanol" loads from the industrial demand chain
        (add_industry); with sector.shipping_endogenous the shipping share is
        no longer set but chosen: a "<node> shipping methanol" link competes
        with oil, LNG and hydrogen for the oil-equivalent shipping load. With
        sector.methanol.meoh_to_oa (off by default) add_meoh_to_oa adds a third
        demand channel: an extendable "<node> methanol-to-olefins/aromatics"
        link from the methanol bus onto the naphtha-for-industry bus
        (technology-data "methanol-to-olefins/aromatics", 12.622 MWh naphtha per
        tonne of HVC, its process CO2 onto the process-emission buses), so
        methanol can replace naphtha as HVC feedstock. Methanolisation waste heat can serve district
        heating (sector.use_methanolisation_waste_heat 0.25, bus4 in
        add_waste_heat, heat-output/hydrogen-input from the cost row).
        Optional fixed-price imports: "import methanol" links (sector.imports)
        that draw the combustion CO2 from "co2 atmosphere" so imported
        e-methanol is carbon-accounted as climate-neutral.
      mechanism: >
        rule compose_network: add_methanol builds the EU methanol
        bus/store (plus the OTHER methanol-chain technologies — see
        not_covered); the methanolisation synthesis link and the industry
        methanol demand are built inside add_industry (so sector.industry
        must be true for the e-methanol route to exist); shipping demand in
        add_shipping; waste heat in add_waste_heat.
      not_covered: >
        This carrier card covers the power/H2+CO2 synthesis route. The other
        supply routes onto the same EU methanol bus, all built in add_methanol:
        biomass-to-methanol (sector.methanol.biomass_to_methanol, default
        true, + CC variant) and its hydrogen-boosted e-biomethanol
        (sector.methanol.e_biomethanol) on [[biomass-to-methanol]] and
        [[advanced-biofuels]]; biogas to methanol and e-biogas-methanol
        (sector.methanol.biogas_to_methanol / e_biogas_methanol) on
        [[biogas-anaerobic-digestion]]; and, since the fork commit d2e0d486,
        extendable fossil methanol from the gas bus — "<gas location> grey
        methanol" (sector.methanol.grey_methanol: 0.569 MWh methanol per MWh
        gas, the gas carbon not bound in the methanol, 0.0568 t/MWh gas,
        vented) and "<gas location> blue methanol"
        (sector.methanol.blue_methanol: 0.9 of that process CO2 captured to
        co2 stored, 0.0511 t, 0.0057 t vented, capital cost grey + (SMR CC -
        SMR)), both off by default and sharing grey_methanol_attrs (grey
        methanol synthesis efficiency, SMR + methanolisation capital cost,
        SMR lifetime) with the existing grey methanol plants that
        sector.endogenous_sectors brings in under myopic or perfect foresight
        (add_existing_industry). Every route lands on one pool, so a
        "methanol" demand never says which route served it. The chain's
        consumers have their own cards: methanol-to-power (OCGT on methanol
        enabled by default), methanol reforming (to H2), and
        methanol-to-kerosene (see e-kerosene-saf).
        No regional methanol production/transport — the single EU bus makes
        methanol freely tradable and synthesis siting only matters through
        the H2/electricity/CO2/heat side. No CO2-source discrimination:
        methanolisation draws from the pooled co2 stored buses (DAC,
        biogenic and fossil capture are fungible). No methanol export
        machinery (imports only). If sector.industry is false there is no
        methanolisation link at all — the synthesis route silently
        disappears while shipping methanol demand (if shipping is on) would
        still need supply from the bio, biogas or fossil routes or imports.
        No fuel-origin quota: hydrogen is any H2 (no RFNBO tracking, no
        ReFuelEU or FuelEU sub-quota); blue methanol captures the
        concentrated synthesis stream with no efficiency penalty.
      provenance: "scripts/prepare_sector_network.py:methanolisation; scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:add_waste_heat; scripts/prepare_sector_network.py:import methanol; scripts/prepare_sector_network.py:add_meoh_to_oa; scripts/prepare_sector_network.py:_add_shipping_endogenous; scripts/prepare_sector_network.py:add_grey_methanol; scripts/prepare_sector_network.py:grey_methanol_attrs; scripts/add_existing_baseyear.py:add_existing_industry"
    levers:
      - key: sector.min_part_load_methanolisation
        effect: "p_min_pu of the methanolisation links — must-run floor as a fraction of built capacity in every snapshot."
        default: "0.3"
        provenance: "config/config.default.yaml:min_part_load_methanolisation; scripts/prepare_sector_network.py:methanolisation"
      - key: sector.shipping_methanol_share
        effect: "Per-horizon share of shipping energy served by methanol (efficiency ratio sector.shipping_oil_efficiency / sector.shipping_methanol_efficiency applied) — the dominant methanol demand by 2050."
        default: "0 (2020) ramping to 1.0 (2050)"
        provenance: "config/config.default.yaml:shipping_methanol_share; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.methanol.regional_methanol_demand
        effect: "true regionalises the shipping/industry methanol DEMAND buses (supply stays on the single EU methanol bus)."
        default: "false"
        provenance: "config/config.default.yaml:regional_methanol_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.use_methanolisation_waste_heat
        effect: "Fraction of methanolisation waste heat (heat-output per hydrogen-input) delivered to urban central heat buses."
        default: "0.25"
        provenance: "config/config.default.yaml:use_methanolisation_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.methanol.biomass_to_methanol
        effect: "The competing biogenic methanol supply route (own carrier card family) — set false to make methanolisation and imports the only supply."
        default: "true"
        provenance: "config/config.default.yaml:biomass_to_methanol; scripts/prepare_sector_network.py:add_biomass_to_methanol"
      - key: sector.methanol.grey_methanol
        effect: "true adds extendable 'grey methanol' Links (gas -> EU methanol, process CO2 vented) per gas location, at the parameters of the existing grey plants."
        default: "false"
        provenance: "config/config.default.yaml:grey_methanol; scripts/prepare_sector_network.py:add_grey_methanol"
      - key: sector.methanol.blue_methanol
        effect: "true adds extendable 'blue methanol' Links: grey methanol whose process CO2 is captured at the SMR CC capture rate (0.9) into co2 stored, at the grey capital cost plus SMR CC minus SMR."
        default: "false"
        provenance: "config/config.default.yaml:blue_methanol; scripts/prepare_sector_network.py:add_grey_methanol"
      - key: sector.methanol.e_biomethanol
        effect: "Hydrogen-boosted biomass-to-methanol, a second H2-consuming methanol route next to methanolisation, its carbon from biomass instead of co2 stored."
        default: "false"
        provenance: "config/config.default.yaml:e_biomethanol; scripts/prepare_sector_network.py:add_e_biomethanol"
      - key: sector.methanol.biogas_to_methanol
        effect: "Biogas to methanol (and sector.methanol.e_biogas_methanol, its hydrogen-boosted variant) on the biogas bus, parametrised by sector.biogas_methanol."
        default: "false (both)"
        provenance: "config/config.default.yaml:biogas_to_methanol; config/config.default.yaml:e_biogas_methanol; scripts/prepare_sector_network.py:add_biogas_to_methanol"
      - key: sector.imports.enable
        effect: "true adds 'import methanol' at sector.imports.price.methanol (121 EUR/MWh default), carbon-accounted against the atmosphere bus."
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:import methanol"
      - key: sector.methanol.meoh_to_oa
        effect: "true adds methanol-to-olefins/aromatics links (methanol to naphtha for industry, with process emissions) — methanol as an endogenous HVC feedstock."
        default: "false"
        provenance: "config/config.default.yaml:meoh_to_oa; scripts/prepare_sector_network.py:add_meoh_to_oa"
      - key: sector.shipping_endogenous
        effect: "true lets shipping methanol compete endogenously with oil, LNG and hydrogen instead of following shipping_methanol_share."
        default: "false"
        provenance: "config/config.default.yaml:shipping_endogenous; scripts/prepare_sector_network.py:_add_shipping_endogenous"
      - key: costs.overwrites
        effect: "Override the 'methanolisation' investment/VOM/lifetime (the hydrogen-input/electricity-input/carbondioxide-input attributes need data/custom_costs.csv rows)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "e-methanol synthesis as an investment option"
        rung: L0
        note: "default — requires sector.industry true (the link is created in add_industry)"
      - variant: "methanol as shipping fuel with a configurable share"
        rung: L0
        note: "default ramp reaches 100% by 2050; adjust sector.shipping_methanol_share"
      - variant: "shipping methanol chosen endogenously against oil, LNG and hydrogen"
        rung: L0
        note: "sector.shipping_endogenous: true (method [[shipping-fuel-endogenous]])"
      - variant: "methanol-to-olefins/aromatics (methanol as HVC feedstock)"
        rung: L0
        note: "sector.methanol.meoh_to_oa: true; the link draws from the methanol bus, so e-methanol, biomass-to-methanol and imports all serve it"
      - variant: "flexible (load-following) synthesis"
        rung: L1
        note: "sector.min_part_load_methanolisation: 0"
      - variant: "e-methanol-only supply (no biogenic or fossil methanol)"
        rung: L1
        note: "sector.methanol.biomass_to_methanol: false and keep off (the shipped default) biomass_to_methanol_cc, e_biomethanol, biogas_to_methanol, e_biogas_methanol, grey_methanol and blue_methanol; with sector.endogenous_sectors under myopic/perfect foresight the existing grey plants still run until they retire, and sector.imports keeps import methanol if enabled"
      - variant: "methanol from biogenic carbon with added hydrogen (e-biomethanol, e-biogas-methanol) or from biogas"
        rung: L0
        note: "sector.methanol.e_biomethanol / biogas_to_methanol / e_biogas_methanol: true (method [[biogenic-carbon-routes]])"
      - variant: "fossil methanol baseline (grey) or with capture (blue)"
        rung: L0
        note: "sector.methanol.grey_methanol / blue_methanol: true; both extendable at every gas location (nodal with sector.gas_network)"
      - variant: "restrict synthesis CO2 to DAC or biogenic sources"
        rung: L5
        note: "CO2 is pooled on the co2 stored buses — needs bespoke source-tracked buses or a custom constraint"
      - variant: "regional methanol balancing with transport"
        rung: L2
        note: "define_spatial hardcodes the single EU methanol bus; nodalising needs edits there plus new transport links (no config key)"
      - variant: "e-methanol export"
        rung: L2
        note: "no export machinery; add a Load/negative-price Generator on the EU methanol bus (the import methanol block is the accounting template)"
      - variant: "methanol synthesis without the industry sector"
        rung: L2
        note: "move/duplicate the methanolisation block out of add_industry (it is not reachable with sector.industry false)"
      - variant: "change synthesis costs or energetics"
        rung: L1
        note: "costs.overwrites for cost columns; input-coefficient attributes via data/custom_costs.csv rows (L3)"
    where:
      - change: "synthesis link creation (siting, part load, input coefficients)"
        anchor: "scripts/prepare_sector_network.py::add_industry (methanolisation n.add on spatial.h2.locations)"
        provenance: "scripts/prepare_sector_network.py:methanolisation; scripts/prepare_sector_network.py:add_industry"
      - change: "methanol bus/store and the rest of the methanol chain"
        anchor: "scripts/prepare_sector_network.py::add_methanol / ::add_carrier_buses; spatial resolution in ::define_spatial"
        provenance: "scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "the other supply routes (bio, biogas, grey/blue)"
        anchor: "scripts/prepare_sector_network.py::add_methanol (add_biomass_to_methanol, add_e_biomethanol, add_biogas_to_methanol, add_grey_methanol); the brownfield grey plants in scripts/add_existing_baseyear.py::add_existing_industry, both over ::grey_methanol_attrs"
        provenance: "scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:add_grey_methanol; scripts/prepare_sector_network.py:grey_methanol_attrs; scripts/add_existing_baseyear.py:add_existing_industry"
      - change: "shipping methanol demand"
        anchor: "scripts/prepare_sector_network.py::add_shipping (shipping_methanol_share block); endogenous mode in ::_add_shipping_endogenous"
        provenance: "scripts/prepare_sector_network.py:shipping methanol; scripts/prepare_sector_network.py:_add_shipping_endogenous"
      - change: "methanol-to-olefins/aromatics"
        anchor: "scripts/prepare_sector_network.py::add_meoh_to_oa (called from add_methanol)"
        provenance: "scripts/prepare_sector_network.py:add_meoh_to_oa"
      - change: "waste heat delivery"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat (use_methanolisation_waste_heat branch)"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "import option"
        anchor: "scripts/prepare_sector_network.py::add_import_options (import methanol block)"
        provenance: "scripts/prepare_sector_network.py:import methanol"
    data_dependencies:
      - input: "cost row 'methanolisation' (hydrogen-input, electricity-input, carbondioxide-input, heat-output)"
        required_for: "all synthesis energetics and costs"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "co2 stored buses with captured CO2 supply (capture chain / DAC)"
        required_for: "the CO2 feedstock (bus3)"
        availability: "exists by default (add_co2_tracking; capture technologies per their carrier cards)"
      - input: "shipping demand (rule build_shipping_demand + energy totals) and industrial methanol demand"
        required_for: "the methanol loads"
        availability: "must be built; default in sector workflow"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        NOTHING — grounded absence. A case-insensitive search for "methanol" across scripts/, the
        Snakefile and config.default.yaml at this commit returns no matches: there is no methanol
        carrier, bus, link, demand or config key anywhere in the workflow. Methanol-adjacent COST
        rows do already exist in the retrieved technology-data costs file (methanolisation,
        methanol, biomass-to-methanol, Methanol steam reforming, methanol-to-kerosene,
        methanol-to-olefins/aromatics, shipping fuel methanol), so the economic data is available
        even though no component consumes it.
      mechanism: >
        n/a — not represented. The nearest implemented patterns to copy are the H2+CO2 synthesis
        links: scripts/prepare_sector_network.py:h2_hc_conversions (Sabatier: bus0 H2 bus, bus1
        gas bus, bus2 co2 stored with negative efficiency2 = CO2 consumption) and
        scripts/prepare_sector_network.py:H2_liquid_fossil_conversions (Fischer-Tropsch: multi-bus
        link with electricity input on bus3). An e-methanol link is structurally identical with
        bus1 = a new methanol bus and efficiencies from the "methanolisation" cost row.
      not_covered: >
        Everything: methanol carrier/bus, methanolisation link, methanol demand (shipping,
        chemicals), methanol-to-kerosene, biomass-to-methanol.
      provenance: "scripts/prepare_sector_network.py:h2_hc_conversions"
    levers: []
    boundary:
      - variant: "Any methanol representation at all"
        rung: L4
        note: >
          New carrier + per-node buses + methanolisation Link (H2 + co2 stored + AC -> methanol)
          added in prepare_sector_network, plus at least one methanol Load (e.g. carve a share out
          of shipping oil demand in add_shipping) — a new function called from the
          prepare_sector_network main block; no new external data needed because the
          "methanolisation" cost row is already retrieved.
      - variant: "Methanol as shipping fuel with a configurable share"
        rung: L4
        note: Mirror the sector.shipping_hydrogen_share mechanism in add_shipping (a new config key + demand split), on top of the L4 supply chain above.
      - variant: "Methanol-to-kerosene for aviation"
        rung: L5
        note: Requires the methanol chain plus a new conversion link into the oil/kerosene demand structure (see e-kerosene carrier card for how aviation draws on the oil bus).
      - variant: "Endogenous methanol export"
        rung: L5
        note: Export machinery is H2-only (add_export); a methanol export bus needs new rule plumbing.
    where:
      - change: "Add methanolisation supply link (template)"
        anchor: "scripts/prepare_sector_network.py:h2_hc_conversions (Sabatier link pattern) and H2_liquid_fossil_conversions (multi-input FT pattern)"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - change: "Hook a new add_methanol function into the workflow"
        anchor: "scripts/prepare_sector_network.py main block (sequence of add_* calls guarded by options flags); Snakefile rule prepare_sector_network"
        provenance: "Snakefile:prepare_sector_network"
      - change: "Methanol demand carve-out from shipping"
        anchor: "scripts/prepare_sector_network.py:add_shipping (shipping_hydrogen_share split pattern)"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
    data_dependencies:
      - input: "technology-data costs csv rows: methanolisation, methanol, shipping fuel methanol, methanol-to-kerosene"
        required_for: "any methanol variant"
        availability: "exists once retrieve_cost_data has run (rows confirmed present in a built costs file at technology_data_version v0.13.2)"
      - input: "CO2 source (co2 stored buses via sector.cc / sector.dac / co2_network)"
        required_for: "methanolisation feedstock"
        availability: "exists by default in the sector workflow"
