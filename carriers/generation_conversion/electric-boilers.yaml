id: electric-boilers
title: Electric boilers
summary: >
  Electric (resistive/electrode) boilers producing steam or hot water from
  electricity, replacing fuel-fired boilers in industry and in district/
  building heating.
when_to_use:
  - "electric boiler"
  - "e-boiler / electrode boiler"
  - "electric steam generation"
  - "replace gas boilers with electric"
  - "resistive heating"
  - "power-to-heat"
  - "pypsa-eur carrier names: urban central resistive heater, rural resistive heater"
  - "e-boiler"
  - "resistive heating for industry"
  - "power-to-heat in industry"
  - "electrode boiler"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d2e0d48666f09a580c744846cef37e5059761d7a", date: "2026-10-09"}
    out_of_box:
      covers: >
        Heating side (on by default): with sector.resistive_heaters true,
        add_heat adds an extendable "{heat_system} resistive heater" Link on
        every heat bus of every heat system (urban central plus the four
        decentral systems), costed from the "central resistive heater" /
        "decentral resistive heater" cost rows, competing against gas boilers,
        heat pumps, CHP and solar thermal. Because add_industry places the
        "low-temperature heat for industry" Load on the urban central (or
        services urban decentral) heat bus, resistive heaters CAN already
        serve industrial low-temperature heat endogenously. That is the only
        electric boiler in the model.
      mechanism: >
        Heating: rule compose_network runs add_heat, resistive heater block
        gated by options["resistive_heaters"]. Industry: add_industry attaches
        the per-node industrial energy demand from
        build_industrial_energy_demand_per_node as flat per-carrier loads
        ("gas for industry", "solid biomass for industry", "coal for
        industry", "industry electricity", "H2 for industry",
        "low-temperature heat for industry"); there is no process-steam bus
        and no supply-technology choice inside industry.
      not_covered: >
        No industrial process-steam electric boiler: steam raised from
        gas/biomass inside industry is a fixed fuel load ("gas for industry",
        "solid biomass for industry") with no electric substitute, and
        electrification only enters via the exogenous future sector ratios
        (see the electric-process-heat carrier card). No temperature bands,
        so no electric option at any process temperature above the
        district-heating level. On this fork the industry_t temperature bands exist (heat100-200 / heat200-500 / heat500+ industry buses with competing supply links) behind sector.industry_t.endogen, off by default — see the industry-process-heat-endogenous carrier card and the industry-heat-endogenous method. Its electric steam boiler sits in the 100-200 °C band only, on the AC node.
      provenance: "scripts/prepare_sector_network.py:resistive heater; scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:low-temperature heat for industry; config/config.default.yaml:resistive_heaters"
    levers:
      - key: sector.resistive_heaters
        effect: "Enable/disable resistive heaters on all heating-system heat buses (serves buildings, district heat, and the industrial low-T heat load)."
        default: "true"
        provenance: "config/config.default.yaml:resistive_heaters; scripts/prepare_sector_network.py:resistive_heaters"
      - key: sector.heating
        effect: "Gates add_heat — false removes all heat buses and with them the resistive heaters and the industrial low-T heat channel."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_heat"
      - key: industry.sector_ratios_fraction_future
        effect: "The only route to 'electrify industrial steam': blends today's fuel-based sector intensities towards the future best-available ratios, which move steam raising to electricity where JRC-IDEES foresees it; exogenous, no boiler component."
        default: "{2020: 0.0, 2025: 0.05, 2030: 0.2, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: costs.overwrites
        effect: "Override 'central resistive heater' / 'decentral resistive heater' rows (investment, efficiency, lifetime)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "electric boilers in district/building heating"
        rung: L0
        note: "default (sector.resistive_heaters: true)"
      - variant: "change electric boiler cost/efficiency"
        rung: L1
        note: "costs.overwrites, or data/custom_costs.csv rows (L3)"
      - variant: "exogenously electrified industrial steam"
        rung: L1
        note: "raise industry.sector_ratios_fraction_future — shifts the fixed industry loads from gas/biomass towards 'industry electricity' following the JRC-IDEES future ratios; no boiler asset, no dispatch"
      - variant: "industrial electric steam boiler competing for process steam"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork: '<node> heat100-200 industry electric boiler steam' (cost row 'electric boiler steam', AC node) competes with the industrial heat pump, gas and biomass steam boilers for the 100-200 °C band — industry-process-heat-endogenous"
      - variant: "hybrid gas-electric boiler switching on price"
        rung: L0
        note: "with sector.industry_t.endogen the gas and electric boilers share the band bus and dispatch splits by marginal cost, within the must-run floor each built plant carries (sector.industry_t.must_run)"
    where:
      - change: "heating-system resistive heaters"
        anchor: "scripts/prepare_sector_network.py::add_heat (resistive heater block per heat system)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "industrial loads a steam boiler would have to compete for"
        anchor: "scripts/prepare_sector_network.py::add_industry (flat 'gas for industry' / 'solid biomass for industry' loads)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs"
        provenance: "scripts/process_cost_data.py:prepare_costs"
    data_dependencies:
      - input: "cost rows 'central resistive heater', 'decentral resistive heater'"
        required_for: "boiler costs and efficiencies"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "heat buses per node (add_heat, district heat share)"
        required_for: "resistive heater placement and the industrial low-T heat load"
        availability: "exists by default in sector runs with heating enabled"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Resistive heaters exist as extendable Links on every heat bus
        ("{name} resistive heater", added in add_heat when sector.boilers is
        true, costed from the "central/decentral resistive heater" rows of the
        costs table), competing against gas boilers, heat pumps, CHP and solar
        thermal. Because add_industry places the "low-temperature heat for
        industry" load on the urban central (or services urban decentral) heat
        bus, electric boilers CAN endogenously serve industrial low-temperature
        heat.
      mechanism: >
        add_heat: n.madd Link '{name} resistive heater' (bus0 = electricity
        node, bus1 = heat bus) gated by options["boilers"]; add_industry: flat
        industrial low-T heat load on the same heat buses, sized from the UNSD
        "heat" carrier rows built in build_base_industry_totals /
        build_industry_demand.
      not_covered: >
        No electric boiler at industrial PROCESS heat: steam raised from
        gas/coal/oil inside industry is a fixed fuel load per carrier
        (gas for industry, coal emissions load, naphtha for industry) with no
        electric substitute component. Note sector.coal.shift_to_elec and the
        sector.efficiency_heat_*_to_elec keys act on RESIDENTIAL/SERVICES demand
        in prepare_energy_totals, not on industry.
      provenance: "scripts/prepare_sector_network.py:add_heat"

    levers:
      - key: sector.boilers
        effect: "Adds/removes resistive heaters AND gas boilers on all heat buses."
        default: "true"
        provenance: "config.default.yaml:boilers"
      - key: sector.tes
        effect: "Thermal storage on heat buses — lets electric boilers load-shift against the flat industrial heat load."
        default: "true"
        provenance: "config.default.yaml:tes"
      - key: sector.electricity_distribution_grid
        effect: "Shifts heat-bus power-to-heat technologies onto low-voltage buses (connection cost realism for e-boilers)."
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid"
      - key: sector.enable.industry
        effect: "Gates the industrial low-temperature heat load e-boilers can serve."
        default: "true"
        provenance: "config.default.yaml:industry"
      - key: custom_data.industry_demand
        effect: "Route to exogenously move industrial fuel demand into the electricity or heat carrier (see boundary)."
        default: "false"
        provenance: "config.default.yaml:industry_demand"

    boundary:
      - variant: "allow electric boilers to serve (industrial) low-temperature heat"
        rung: L0
        note: "already endogenous via sector.boilers resistive heaters on heat buses."
      - variant: "force electric-only heat supply (remove gas boiler competitor)"
        rung: L2
        note: >
          sector.boilers gates resistive heater AND gas boiler together; keeping
          the resistive heater while dropping the gas boiler needs a small edit
          in add_heat (the two madd blocks under options['boilers']).
      - variant: "electric steam boiler replacing industrial gas/coal/oil process fuel, exogenous"
        rung: L3
        note: >
          Move the fuel MWh into the electricity rows of the industry totals
          (x boiler efficiency) via
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with
          custom_data.industry_demand: true, or edit industry_base_totals in
          build_industry_demand.
      - variant: "endogenous e-boiler vs gas boiler choice at industrial process heat"
        rung: L5
        note: "needs an explicit industrial process-heat bus and boiler links — process heat currently has no bus; bespoke Python in prepare_sector_network."

    where:
      - change: "resistive heater / gas boiler definitions"
        anchor: "add_heat in prepare_sector_network — blocks under options['boilers'] ('{name_type} resistive heater', '{name_type} gas boiler')"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "industrial heat load attachment"
        anchor: "add_industry — Load 'low-temperature heat for industry'"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "industry fuel-to-electricity reassignment (exogenous)"
        anchor: "rule build_industry_demand — industry_base_totals; custom path data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "residential/services (NOT industry) fuel-to-electric heat shift, for disambiguation"
        anchor: "prepare_energy_totals — efficiency_heat_oil_to_elec / fuel_shares based shifts"
        provenance: "scripts/prepare_energy_totals.py:efficiency_heat_oil_to_elec"

    data_dependencies:
      - input: "technology-data costs csv (resistive heater rows)"
        required_for: "electric boiler capex/efficiency"
        availability: "must be built (enable.retrieve_cost_data, costs.technology_data_version)"
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "industrial heat and fuel baselines"
        availability: "must be built; region-dependent"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "exogenous electrification of process steam"
        availability: "absent — user-supplied"
