id: electric-buses
title: Electric buses
summary: >
  Battery-electric buses and coaches — urban transit and long-distance bus
  electrification with depot or opportunity charging.
when_to_use:
  - "electric buses / e-buses"
  - "electrify public transport / transit fleets"
  - "bus depot charging"
  - "trolleybuses / battery buses"
  - "coach electrification"
  - "pypsa-eur carrier names: land transport EV (aggregate only — no bus carrier exists)"
  - "bus fleet electrification"
  - "depot charging for buses"
  - "urban transport decarbonisation"
models:
  - model: pypsa-eur
    version_anchor: {ref: "f55cdf34f0e67a797fd4327bed26c56dedcb5cb8", date: "2026-10-09"}
    out_of_box:
      covers: >
        Not covered as a distinct segment. Bus and coach fuel is inside "total
        road" (Eurostat road balance), which build_transport_demand folds —
        together with all other road modes and non-electric rail — into ONE
        driven-km aggregate converted at JRC-IDEES passenger-car efficiency
        and electrified by the single land_transport_electric_share triplet in
        add_land_transport. So buses electrify with the fleet, but as
        car-equivalents (11 kW chargers, 50 kWh batteries, passenger-car
        plug-in profiles) — no depot charging, route structure or transit
        scheduling. As with trucks, the segment energy data exists unused:
        rule build_energy_totals writes a "total other road passenger" column
        to energy_totals.csv from the JRC-IDEES row "Motor coaches, buses and
        trolley buses" (with an "electricity other road passenger" counterpart
        from its "Battery electric vehicles" sub-row), but
        build_transport_demand never reads it.
      mechanism: >
        rule build_energy_totals (TrRoad_ene sheet: 'Motor coaches, buses and
        trolley buses' -> 'total other road passenger') -> energy_totals.csv;
        rule build_transport_demand collapses total road + total rail -
        electricity rail; rule compose_network -> add_land_transport ->
        add_EVs applies the aggregate electric share.
      not_covered: >
        No bus carrier, share key, efficiency, charger rating or availability
        profile; no distinction urban transit vs coach; no depot/opportunity
        charging or timetable-driven demand shape; no per-city resolution
        beyond population-weighted nodes.
      provenance: "scripts/build_energy_totals.py:total other road passenger; scripts/build_energy_totals.py:Motor coaches, buses and trolley buses; scripts/build_transport_demand.py:build_transport_demand; scripts/prepare_sector_network.py:add_land_transport"
    levers:
      - key: sector.land_transport_electric_share
        effect: "The only knob touching bus energy — uniform across the whole land transport aggregate."
        default: "{2020: 0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1}"
        provenance: "config/config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:add_land_transport"
      - key: sector.transport_electric_efficiency
        effect: "Single fleet-wide EV efficiency; blend offline to reflect bus consumption."
        default: "53.19"
        provenance: "config/config.default.yaml:transport_electric_efficiency; scripts/prepare_sector_network.py:add_EVs"
    boundary:
      - variant: "electrify buses together with all road transport"
        rung: L1
        note: "raise sector.land_transport_electric_share; buses cannot be targeted alone"
      - variant: "approximate bus electrification by share arithmetic"
        rung: L1
        note: "fold the bus fraction of road energy (readable from the unused 'total other road passenger' column of energy_totals.csv) into the share value offline; parameters stay car-like"
      - variant: "separate bus demand from the road aggregate"
        rung: L2
        note: "the energy column already exists — carve 'total other road passenger' out in build_transport_demand and add a second load block with its own share in add_land_transport; localised code edit, no new external data"
      - variant: "bus-specific charging shape (depot at night, opportunity at stops)"
        rung: L3
        note: "no bus traffic profile is emitted (rule build_mobility_profiles only outputs kfz/pkw); needs a synthetic or measured depot-charging weekly profile"
      - variant: "bus segment with own config keys and rule outputs"
        rung: L4
        note: "new outputs through rules build_energy_totals/build_transport_demand plus new sector.* keys consumed in add_land_transport"
      - variant: "transit-network-level modelling (routes, timetables, charger siting)"
        rung: L5
        note: "far below the model's spatial/behavioural resolution; bespoke components"
    where:
      - change: "where a bus split of the demand aggregate would be made"
        anchor: "scripts/build_transport_demand.py::build_transport_demand (rule build_transport_demand)"
        provenance: "scripts/build_transport_demand.py:build_transport_demand"
      - change: "unused bus/coach energy column"
        anchor: "scripts/build_energy_totals.py TrRoad_ene parsing ('total other road passenger')"
        provenance: "scripts/build_energy_totals.py:total other road passenger"
      - change: "where bus-specific loads/shares would be added"
        anchor: "scripts/prepare_sector_network.py::add_land_transport / ::add_EVs"
        provenance: "scripts/prepare_sector_network.py:add_land_transport; scripts/prepare_sector_network.py:add_EVs"
    data_dependencies:
      - input: "energy_totals.csv column 'total other road passenger' (+ 'electricity other road passenger')"
        required_for: "any bus demand separation"
        availability: "exists by default (rule build_energy_totals, JRC-IDEES) but UNUSED by the transport chain"
      - input: "bus depot/opportunity charging profile"
        required_for: "bus-specific charging representation"
        availability: "absent — must be sourced or synthesised"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered as a distinct segment. Buses are inside the single aggregate land
        transport demand ("total road" from UNSD balances) that
        sector.land_transport_electric_share / land_transport_fuel_cell_share split
        by fuel only. Raising the electric share electrifies buses together with cars
        and trucks, using passenger-car EV parameters (bev_energy battery size, car
        counts from WHO statistics, car traffic profiles).
      mechanism: >
        add_land_transport in rule prepare_sector_network applies the exogenous
        shares (keyed {demand}_{planning_horizon}) to the aggregate series built by
        rule prepare_transport_data. No bus share key, bus profile, or bus parameter
        exists in the sector config or scripts.
      not_covered: >
        Bus-vs-car disaggregation, scheduled depot/overnight charging patterns,
        bus-specific battery and charger sizing, transit activity data. Note the repo
        ships an unused weekly bus traffic profile data/emobility/Bus__count that
        could seed a bus-specific demand shape.
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers:
      - key: sector.land_transport_electric_share
        effect: "Electrifies the WHOLE road aggregate (buses included, not separable), keyed {demand}_{planning_horizon}."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_electric_share"
      - key: sector.land_transport_fuel_cell_share
        effect: "H2 share of the same aggregate; remainder ICE oil."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_fuel_cell_share"
      - key: sector.enable.land_transport
        effect: "Master switch for the whole land transport block."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"

    boundary:
      - variant: "Electrify buses together with all road transport"
        rung: L1
        note: "Only via the aggregate: raise sector.land_transport_electric_share; cannot target buses alone."
      - variant: "Approximate bus electrification by share arithmetic"
        rung: L1
        note: "Fold the bus energy fraction of total road into the electric share value offline; EV parameters remain car-like."
      - variant: "Separate bus demand from the road aggregate"
        rung: L3
        note: >
          Needs data splitting 'total road' into bus vs other energy (not in UNSD
          output columns) plus a bus demand shape — the unused
          data/emobility/Bus__count weekly counts can supply the shape — then a
          second load block in add_land_transport; the data split is the blocker.
      - variant: "Bus segment with own share keys, depot-charging profile, wildcards"
        rung: L4
        note: "New outputs through rule prepare_transport_data plus new config keys consumed in add_land_transport."
      - variant: "Scheduled transit charging optimisation (route/timetable level)"
        rung: L5
        note: "Bespoke component logic; nothing in the model represents timetables."

    where:
      - change: "Where a bus-specific split/loads would be added"
        anchor: "scripts/prepare_sector_network.py function add_land_transport"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "Where bus demand series/profiles would be produced"
        anchor: "rule prepare_transport_data -> scripts/prepare_transport_data.py"
        provenance: "Snakefile:prepare_transport_data"
      - change: "Unused bus traffic profile that can seed a bus demand shape"
        anchor: "data/emobility/Bus__count (sibling of the wired-in KFZ__count input)"
        provenance: "Snakefile:traffic_data_KFZ"

    data_dependencies:
      - input: "UNSD energy balances 'total road' (no bus split)"
        required_for: "aggregate demand a bus share would be carved from"
        availability: "must be built; bus disaggregation absent"
      - input: "data/emobility/Bus__count (German weekly bus traffic counts)"
        required_for: "bus-specific demand shape (variant L3+)"
        availability: "exists by default but NOT wired into any rule"
      - input: "Bus fleet stock / transit activity data for the target region"
        required_for: "bus-specific battery and charger sizing"
        availability: "absent"
