id: electric-cooking
title: Induction / electric cooking
summary: >
  Switching household and commercial cooking from fuels (gas, oil) to
  electricity (induction/resistive stoves).
when_to_use:
  - "electric cooking"
  - "induction stoves"
  - "e-cooking transition"
  - "switch cooking from gas to electricity"
  - "cooking electrification scenario"
  - "household cooking demand"
  - "catering energy"
  - "pypsa-eur: no cooking carrier or technology exists — cooking is folded into the base electricity load and the energy-totals columns 'total residential cooking' / 'electricity residential cooking'"
  - "switch cooking from LPG/gas to electricity"
  - "kerosene to electric stove"
models:
  - model: pypsa-eur
    version_anchor: {ref: "6128bf7effbe7243bcc46b2770d04cebe45613a5", date: "2026-10-26"}
    out_of_box:
      covers: >
        NO cooking TECHNOLOGY exists — there is nothing to build, retire or
        switch. What the model does have is cooking DATA: build_energy_totals
        extracts per-country columns "total residential cooking" /
        "electricity residential cooking" (JRC-IDEES row "Cooking", Eurostat
        code FC_OTH_HH_E_CK for non-IDEES countries) and "total services
        cooking" / "electricity services cooking" (IDEES row "Catering"), plus
        Swiss values from build_swiss_energy_balances. These columns are
        carried through pop_weighted_energy_totals but are consumed by NO
        downstream network-building code: prepare_sector_network's
        build_heat_demand subtracts only electric SPACE and WATER heating from
        the electricity load — cooking electricity simply remains inside the
        historical base electricity load (ENTSO-E based) with that load's
        profile, and today's electric-cooking level is therefore implicitly
        included. Fuel-based cooking (gas/LPG) never becomes a network demand
        at all; it survives only in the historical CO2 accounting
        (build_co2_totals maps "residential non-elec" to the eurostat balance
        FC_OTH_HH_E), which anchors the carbon budget baseline.
      mechanism: >
        rule build_energy_totals (cooking columns) -> rule
        build_population_weighted_energy_totals -> prepare_sector_network,
        where grep shows no consumer of the cooking columns; the electricity
        load enters from the electricity workflow network and only electric
        heating is subtracted in build_heat_demand. See the demand book's
        cooking-energy-demand carrier card for the full demand-side account.
      not_covered: >
        Everything technological: no stove asset, no cooking carrier or load,
        no gas-vs-electric cooking competition, no appliance-efficiency gain
        when electrifying, no cooking load profile (an electrification
        scenario cannot credit induction efficiency or shift gas demand to
        electricity via any switch). Non-electric cooking energy is absent
        from the energy demand entirely — a gas-cooking phase-out changes
        nothing in the network because the gas was never demanded. There is no
        equivalent of pypsa-earth's fuel_shares 'to elec' reallocation
        machinery in this model.
      provenance: "scripts/build_energy_totals.py:total residential cooking; scripts/build_energy_totals.py:Catering; scripts/prepare_sector_network.py:build_heat_demand; scripts/build_co2_totals.py:build_co2_totals; scripts/build_swiss_energy_balances.py:electricity residential cooking"
    levers:
      - key: energy.energy_totals_year
        effect: "Base year of the energy totals holding the (unused) cooking columns and of the CO2 baseline that implicitly contains cooking fuel emissions."
        default: "2023"
        provenance: "config/config.default.yaml:energy_totals_year; rules/build_sector.smk:energy_totals_year"
    boundary:
      - variant: "today's electric cooking in the load"
        rung: L0
        note: "implicit — inside the base electricity demand; nothing to configure and no way to isolate it in results"
      - variant: "scale future cooking electricity (growth or electrification proxy)"
        rung: L1
        note: "only as an undifferentiated electricity-load scaling (load.scaling_factor or adjustments) — cannot target cooking specifically"
      - variant: "explicit cooking load with fuel/electric split and switching"
        rung: L2
        note: "the per-country totals already exist ('total residential cooking', 'electricity residential cooking'); the work is coding a load + base-load subtraction in prepare_sector_network on top of that data (a cooking intraday profile would be new data, L3)"
      - variant: "induction-stove efficiency credit on electrification"
        rung: L5
        note: "requires the explicit cooking carve-out above plus appliance-efficiency assumptions that exist nowhere in the repo"
      - variant: "cooking as a flexible/shiftable load"
        rung: L5
        note: "no cooking load exists to shift; nearest analogues are the BEV DSM and residential heat DSM stores"
    where:
      - change: "where the cooking columns are built (the data an explicit load would use)"
        anchor: "scripts/build_energy_totals.py (IDEES rows 'Cooking'/'Catering'; Eurostat FC_OTH_HH_E_CK)"
        provenance: "scripts/build_energy_totals.py:Cooking; scripts/build_energy_totals.py:FC_OTH_HH_E_CK"
      - change: "where an explicit cooking load + electricity subtraction would be coded"
        anchor: "scripts/prepare_sector_network.py::build_heat_demand (template: the electric-heating subtraction from the electricity load)"
        provenance: "scripts/prepare_sector_network.py:build_heat_demand"
    data_dependencies:
      - input: "JRC-IDEES residential/tertiary sheets + Eurostat balances (cooking rows)"
        required_for: "any explicit cooking carve-out"
        availability: "retrieved by the workflow (rule build_energy_totals inputs); columns built but unused"
      - input: "cooking intraday/seasonal profile"
        required_for: "hourly cooking load shape"
        availability: "absent — no cooking profile exists in the repo"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT a distinct demand category — the string "cook" appears nowhere in the
        scripts, Snakefile or config at this commit. Cooking energy is folded into the
        residential fuel totals that build_base_energy_totals extracts from the UNSD
        energy balance sector "consumption by households": "electricity residential",
        "residential oil", "residential gas", "residential biomass" (heat commodities go
        to space/water heat instead). These become nodal loads on the oil/gas/biomass
        carrier buses and the electricity bus in add_residential. Fuel-to-electricity
        switching of the NON-heat residential fuel demand (which implicitly contains
        cooking) is a data lever: prepare_energy_totals applies fuel_shares.csv columns
        "oil to elec share", "gas to elec share", "biomass to elec share" to move
        (1 - residential heat share) fuel demand into "electricity residential" — note
        this shift is applied 1:1, with no appliance-efficiency credit (the
        efficiency_heat_*_to_elec factors apply only to the heat shift). Residential
        coal is shifted to electricity out of the box when sector.coal.shift_to_elec is
        true (default).
      mechanism: >
        rule build_base_energy_totals (UNSD "consumption by households" -> residential
        fuel columns; coal folded into electricity if shift_to_elec) -> rule
        prepare_energy_totals (fuel_shares.csv "* to elec share" reallocation, DEFAULT
        row fallback via fill_country_data) -> prepare_sector_network add_residential
        (loads "residential oil/gas/biomass" on carrier buses; residential electricity
        load rescaled to energy_totals["electricity residential"]).
      not_covered: >
        No cooking-specific demand series, load profile, appliance stock or efficiency
        representation; no LPG-vs-electric stove cost competition (the switch is purely
        exogenous data); no distinction between cooking and other residential fuel uses,
        so a "share of cooking electrified" must be translated by the user into a share
        of total non-heat residential fuel use.
      provenance: "scripts/build_base_energy_totals.py:consumption by households"

    levers:
      - key: sector.coal.shift_to_elec
        effect: Counts residential/services coal consumption as electricity demand instead of dropping it (closest built-in fuel-to-electric cooking-adjacent switch).
        default: "true"
        provenance: "config.default.yaml:shift_to_elec; scripts/build_base_energy_totals.py:shift_coal_to_elec"
      - key: sector.enable.residential
        effect: Gates add_residential, i.e. whether residential fuel/electricity loads are added at all.
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_residential"
      - key: demand_data.base_year
        effect: UNSD energy balance year from which residential fuel (incl. cooking) totals are taken.
        default: "2019"
        provenance: "config.default.yaml:base_year; Snakefile:build_base_energy_totals"

    boundary:
      - variant: "Shift residential coal (incl. coal cooking) to electricity"
        rung: L0
        note: "sector.coal.shift_to_elec, already true by default."
      - variant: "Electrify a share of residential oil/gas/biomass use (cooking proxy) for a country"
        rung: L3
        note: "Edit the country row of data/demand/fuel_shares.csv columns 'oil to elec share', 'gas to elec share', 'biomass to elec share' (non-heat fuel demand; DEFAULT row is the fallback). Consumed by prepare_energy_totals with no efficiency factor — apply your own stove-efficiency adjustment to the share if needed."
      - variant: "Apply an appliance-efficiency credit to the fuel->electricity shift"
        rung: L2
        note: "prepare_energy_totals multiplies heat shifts by efficiency_heat_*_to_elec but the non-heat shift by nothing; add a factor in the 'electricity residential' expression."
      - variant: "Explicit cooking demand category with its own hourly profile and stove technologies competing on cost"
        rung: L5
        note: "Requires new demand extraction (cooking is not separable in the UNSD-based columns), new loads/components, and likely a new rule (L4) — nothing exists."

    where:
      - change: "Fuel-to-electricity reallocation of residential demand"
        anchor: "scripts/prepare_energy_totals.py (electricity residential block, 'oil to elec share' etc.)"
        provenance: "scripts/prepare_energy_totals.py:oil to elec share"
      - change: "Per-country switching shares"
        anchor: "data/demand/fuel_shares.csv (country rows + DEFAULT)"
        provenance: "data/demand/fuel_shares.csv:oil to elec share"
      - change: "Residential fuel loads on carrier buses and electricity load rescaling"
        anchor: "scripts/prepare_sector_network.py:add_residential"
        provenance: "scripts/prepare_sector_network.py:add_residential"
      - change: "Base-year extraction of residential fuel totals"
        anchor: "scripts/build_base_energy_totals.py:calc_sector ('consumption by households' branch)"
        provenance: "scripts/build_base_energy_totals.py:calc_sector"

    data_dependencies:
      - input: "UNSD energy statistics database (household consumption by commodity)"
        required_for: "Baseline residential fuel demand containing cooking"
        availability: "must be built (build_base_energy_totals downloads it; demand_data.update_data)"
      - input: "data/demand/fuel_shares.csv"
        required_for: "Country-specific fuel-to-electricity switching shares"
        availability: "region-dependent (few country rows — MA, TN, NA, US and others; DEFAULT fallback)"
      - input: "GEGIS/DemandCast electricity load profiles (load_options)"
        required_for: "Hourly shape onto which extra cooking electricity is scaled in add_residential"
        availability: "exists by default (retrieved)"
