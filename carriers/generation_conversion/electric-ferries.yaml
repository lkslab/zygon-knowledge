id: electric-ferries
title: Electric ferries (battery shipping)
summary: >
  Battery-electric vessels — ferries and short-sea shipping charging from the
  grid at ports, electrifying part of navigation demand.
when_to_use:
  - "electric ferries / battery ships"
  - "electrify shipping / short-sea shipping"
  - "shore power for vessels / port charging"
  - "domestic navigation electrification"
  - "pypsa-eur: no electric shipping carrier exists — shipping carriers are H2 for shipping, shipping methanol, shipping oil"
  - "electric ferries / e-ferries"
  - "battery ships / electric vessels"
  - "short-sea shipping electrification"
  - "shore power / cold ironing demand"
  - "electrify domestic navigation"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Not covered. Shipping demand is split exogenously between exactly three
        fuels — shipping_hydrogen_share, shipping_methanol_share,
        shipping_oil_share (add_shipping) — with no electricity option and no
        battery-vessel representation. The demand side is well developed
        though: domestic navigation comes population-weighted from energy
        totals ("total domestic navigation"), while international navigation
        is regionalised by PORT activity — rule build_shipping_demand assigns
        each country's "total international navigation" energy to nodes by the
        outflow volumes of ports (attributed_ports.json via rule
        retrieve_attributed_ports, nearest-region join). Both are summed into
        one all_navigation series BEFORE the fuel shares apply, so ferries
        (mostly domestic) cannot even be targeted by tweaking the existing
        shares. Grid electricity reaches ports only implicitly through the
        regular AC buses.
      mechanism: >
        n/a for electric vessels. Adjacent machinery: rule
        build_shipping_demand -> shipping_demand_s_{clusters}.csv (port
        weighting); rule prepare_sector_network -> add_shipping builds
        per-fuel Loads (flat annual-average p_set, no seasonal profile) from
        all_navigation = domestic + international.
      not_covered: >
        Any electric-shipping share, vessel batteries, charging power limits
        at ports, shore power, route/crossing resolution, or
        domestic-vs-international fuel differentiation (one fuel mix for
        both).
      provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/build_shipping_demand.py:total international navigation; scripts/build_shipping_demand.py:european_ports; rules/build_sector.smk:build_shipping_demand"
    levers:
      - key: sector.shipping
        effect: "Gate for all shipping demand (any fuel)."
        default: "true"
        provenance: "config/config.default.yaml:shipping; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping_oil_share
        effect: "Would need reducing to make room for an (added) electric share; shares not summing to 1 only warn — an electric carve-out can also just deduct demand here as a crude energy-removal proxy."
        default: "{2020: 1, 2025: 1, 2030: 0.85, 2035: 0.65, 2040: 0.45, 2045: 0.2, 2050: 0}"
        provenance: "config/config.default.yaml:shipping_oil_share; scripts/prepare_sector_network.py:add_shipping"
    boundary:
      - variant: "crude proxy: remove the ferry fraction from shipping demand (treat it as part of base electric load growth)"
        rung: L1
        note: "let the three shipping shares sum to < 1 by the electric fraction — add_shipping only warns; the electricity side is then unaccounted (add it via a load scaling elsewhere)"
      - variant: "any electric shipping share at all"
        rung: L2
        note: "no key exists; smallest edit in add_shipping: add a shipping_electric_share read via get(), and n.add a Load on the AC nodes for that fraction of p_set converted with an electric-propulsion efficiency (pattern-copy the H2 share block, dropping the fuel-cell conversion); new config key threaded through options"
      - variant: "domestic-only (ferry/short-sea) electrification"
        rung: L2
        note: "domestic_navigation and international_navigation are separate series inside add_shipping before being summed — apply the electric share to the domestic term only; the data split exists out of the box"
      - variant: "route-resolved ferry demand (which crossings, what schedule)"
        rung: L3
        note: "needs ferry route/traffic data mapped to ports — the attributed-ports outflow data regionalises international freight, not ferry crossings"
      - variant: "vessel batteries and port charging power as investable components"
        rung: L4
        note: "new Store/Link components at port nodes plus cost rows and config keys — no scaffold exists"
      - variant: "endogenous electric-vs-fuel vessel competition"
        rung: L5
        note: "shipping shares are exogenous; competition needs new decision variables/constraints"
    where:
      - change: "where an electric shipping share/load would be added"
        anchor: "scripts/prepare_sector_network.py::add_shipping (beside the shipping_hydrogen_share block)"
        provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:shipping_hydrogen_share"
      - change: "port-weighted regionalisation of navigation demand"
        anchor: "scripts/build_shipping_demand.py (rule build_shipping_demand, attributed ports sjoin)"
        provenance: "scripts/build_shipping_demand.py:european_ports; rules/build_sector.smk:build_shipping_demand"
    data_dependencies:
      - input: "attributed_ports.json (port locations + outflow volumes)"
        required_for: "nodal placement of (international) shipping demand incl. any electric carve-out"
        availability: "retrieved by the workflow (rule retrieve_attributed_ports)"
      - input: "energy_totals 'total domestic navigation' column"
        required_for: "the domestic (ferry-heavy) demand term"
        availability: "exists by default (rule build_energy_totals)"
      - input: "electric-vessel efficiency/cost assumptions and ferry route data"
        required_for: "grounded electric-ferry modelling beyond a share"
        availability: "absent from the repo"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered. Shipping (add_shipping) knows exactly two fuels: a hydrogen
        share (sector.shipping_hydrogen_share -> "H2 for shipping" Load at
        port-weighted nodes) and the oil remainder ("shipping oil" Load). There is no
        electricity share, no battery-vessel component, no shore-power load, and no
        distinction between ferry/short-sea and deep-sea navigation — demand is the
        UNSD 'total domestic navigation' + 'total international navigation' total per
        country, distributed to nodes by port size (rule prepare_ports, World Port
        Index).
      mechanism: >
        Nothing electric to describe; the port-location machinery (locate_bus on the
        ports CSV, country demand mapped by port fraction) is the reusable part an
        electric-shipping load would piggyback on.
      not_covered: >
        Everything electric: shore charging, vessel batteries, route-length
        suitability (which trips can be electrified), ferry vs cargo split within
        navigation demand.
      provenance: "scripts/prepare_sector_network.py:add_shipping"

    levers:
      - key: sector.enable.shipping
        effect: "Master switch for shipping demand (H2 + oil only)."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"
      - key: sector.shipping_hydrogen_share
        effect: "Only existing low-carbon shipping lever; shifts demand to H2, not electricity."
        default: "AB_2030: 0.05 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:shipping_hydrogen_share"

    boundary:
      - variant: "Any electric shipping at all"
        rung: L2
        note: >
          No config key exists. Smallest edit: in add_shipping, add a
          shipping_electric_share (read via options), and madd an AC-bus Load at the
          port nodes for that fraction (pattern-copy the H2 share/load logic,
          dropping the fuel-cell efficiency conversion in favour of an
          electric-propulsion efficiency). New key also needs adding to your config.
      - variant: "Domestic-only (ferry/short-sea) electrification"
        rung: L2
        note: "energy_totals carries 'total domestic navigation' separately from international — apply the electric share to the domestic column only inside add_shipping."
      - variant: "Route-resolved ferry demand (which crossings, what schedule)"
        rung: L3
        note: "Needs ferry route/traffic data for the target region mapped to ports — no such dataset exists in the repo."
      - variant: "Vessel batteries + charging power limits at ports as components"
        rung: L4
        note: "New Store/Link components sized from new data plus config/rule plumbing (analogous to the EV battery pattern in add_land_transport)."
      - variant: "Endogenous fuel choice for shipping (electric vs H2 vs oil)"
        rung: L5
        note: "Shares are exogenous; competition needs bespoke logic."

    where:
      - change: "Where an electric-shipping share and shore-power load would be added"
        anchor: "scripts/prepare_sector_network.py function add_shipping (pattern: shipping_hydrogen_share handling)"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
      - change: "Port locations and per-country port weighting"
        anchor: "rule prepare_ports -> scripts/prepare_ports.py"
        provenance: "scripts/prepare_ports.py:download_ports"
      - change: "Domestic vs international navigation split in demand data"
        anchor: "rule build_base_energy_totals -> scripts/build_base_energy_totals.py function calc_sector"
        provenance: "scripts/build_base_energy_totals.py:calc_sector"
      - change: "Reusable EV-style battery/charger component pattern"
        anchor: "scripts/prepare_sector_network.py function add_land_transport"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"

    data_dependencies:
      - input: "UNSD energy balances ('total domestic navigation', 'total international navigation')"
        required_for: "any shipping demand, incl. an electric share carved from it"
        availability: "must be built (build_base_energy_totals)"
      - input: "World Port Index ports (resources ports.csv via prepare_ports)"
        required_for: "locating shore-power loads at nodes"
        availability: "must be built (runtime download; monthly-updated source)"
      - input: "Ferry route / vessel traffic data for the target region"
        required_for: "route-resolved or battery-sizing variants"
        availability: "absent"
