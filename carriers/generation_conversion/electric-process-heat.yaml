id: electric-process-heat
title: Electric industrial process heat
summary: >
  Direct electrification of industrial process heat — furnaces, kilns, dryers
  and steam — replacing gas, coal, oil or biomass firing with electricity.
when_to_use:
  - "electrify industry"
  - "electric process heat"
  - "industrial electrification"
  - "switch industry from gas to electricity"
  - "electric furnaces and kilns"
  - "fuel switching in industry"
  - "industry electricity demand growth"
  - "pypsa-eur terms: industry electricity, sector_ratios_fraction_future"
models:
  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        One mechanism, exogenous and on by default: deep electrification is
        BAKED INTO the future sector ratios of build_industry_sector_ratios —
        steel furnaces/refining/rolling and product finishing "assume fully
        electrified", chemicals furnaces and process cooling fully
        electrified, ceramics "Everything is electrified" (microwave
        drying/sintering, electric kilns), glass electric melting tanks,
        aluminium fully electric secondary route, etc. Each country's
        intensity is blended from today's JRC-IDEES values towards these
        electrified ratios by industry.sector_ratios_fraction_future (default
        0 in 2020 -> 1.0 in 2050), so industry electricity demand grows along
        the pathway and lands as the flat "industry electricity" Load per node
        in add_industry (today's industrial electricity is first subtracted
        from the base load via the "current electricity" column).
      mechanism: >
        rule build_industry_sector_ratios ->
        build_industry_sector_ratios_intermediate (fraction_future blend) ->
        build_industrial_energy_demand_per_node -> add_industry loads
        ("industry electricity", "gas for industry", "solid biomass for
        industry", "coal for industry", "H2 for industry", "low-temperature
        heat for industry"), all attached in rule compose_network.
      not_covered: >
        No endogenous fuel switching by default: the model cannot trade a
        gas-for-industry MWh against an industry-electricity MWh, and there is
        no electric furnace, kiln, boiler or heat-pump component inside
        industry at any process temperature (the only electric heat supply
        that reaches industry is via the "low-temperature heat for industry"
        load on district-heating buses, where resistive heaters and heat
        pumps compete). No temperature bands. All industry loads are flat
        (annual/8760). On this fork the industry_t temperature bands exist (heat100-200 / heat200-500 / heat500+ industry buses with competing supply links) behind sector.industry_t.endogen, off by default — see the industry-process-heat-endogenous carrier card and the industry-heat-endogenous method. Even then there is no electric option above 200 °C, and the endogenised sectors run on today's intensities rather than the electrified future ratios.
      provenance: "scripts/build_industry_sector_ratios.py:chemicals_industry; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future; scripts/prepare_sector_network.py:industry electricity; scripts/prepare_sector_network.py:add_industry; scripts/build_industrial_energy_demand_per_node.py"
    levers:
      - key: industry.sector_ratios_fraction_future
        effect: "Pace of the exogenous electrification pathway: 0 keeps today's country fuel mixes, 1 applies the fully electrified best-in-class ratios."
        default: "{2020: 0.0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: sector.industry
        effect: "Master switch for all industry demand."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
    boundary:
      - variant: "faster/slower exogenous industrial electrification"
        rung: L1
        note: "reshape industry.sector_ratios_fraction_future (per horizon)"
      - variant: "change a specific sector's electric intensity in the exogenous path"
        rung: L2
        note: "edit the sector function in build_industry_sector_ratios.py (e.g. chemicals_industry, nonmetalic_mineral_products) — no config hook"
      - variant: "endogenous electric vs fuel competition for process heat"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork: band loads per node with an industrial heat pump and an electric steam boiler (both on the AC node) competing with gas and biomass boilers at 100-200 °C; no electric option above 200 °C; today's intensities for the endogenised sectors — industry-process-heat-endogenous"
      - variant: "direct electric furnace/kiln above 200 °C as a network component"
        rung: L4
        note: "same prerequisite; no cost row exists for high-T electric heat either (L3 data part)"
      - variant: "time-flexible electrified process heat (load shifting)"
        rung: L5
        note: "industry loads are flat Loads; demand-side shifting needs a Link+Store structure per node (bespoke)"
    where:
      - change: "future electrified intensities per sector"
        anchor: "scripts/build_industry_sector_ratios.py sector functions (iron_and_steel, chemicals_industry, nonmetalic_mineral_products, non_ferrous_metals, pulp_paper_printing)"
        provenance: "scripts/build_industry_sector_ratios.py:nonmetalic_mineral_products; scripts/build_industry_sector_ratios.py:non_ferrous_metals"
      - change: "today-to-future blending"
        anchor: "scripts/build_industry_sector_ratios_intermediate.py::build_industry_sector_ratios_intermediate"
        provenance: "scripts/build_industry_sector_ratios_intermediate.py:build_industry_sector_ratios_intermediate"
      - change: "industry electricity load attachment and base-load rescaling"
        anchor: "scripts/prepare_sector_network.py::add_industry ('industry electricity', 'current electricity')"
        provenance: "scripts/prepare_sector_network.py:current electricity"
    data_dependencies:
      - input: "JRC-IDEES industry sheets (fec/ued/emi per sector)"
        required_for: "both today's mixes and the electrified future ratios"
        availability: "retrieved by the workflow (rule retrieve_jrc_idees)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        The industry model is a demand-side aggregate: annual final energy per
        (country, carrier, industry) from UNSD energy balances (carriers:
        electricity, gas, coal, oil, biomass, heat — via aggregate_fuels), grown
        by per-industry CAGRs, distributed to nodes by plant/pop/GDP keys, and
        attached as flat loads per carrier in add_industry ("industry
        electricity" on the AC node, "gas for industry", "solid biomass for
        industry", "naphtha for industry", coal as a pure CO2 load,
        "low-temperature heat for industry" on heat buses). The electricity
        share of industry is whatever the data says.
      mechanism: >
        rules build_base_industry_totals -> build_industry_demand ->
        build_industrial_distribution_key feed
        industrial_energy_demand_per_node_elec_*.csv, consumed by
        prepare_sector_network.add_industry.
      not_covered: >
        No endogenous fuel switching inside industry: the model cannot trade a
        gas-for-industry MWh for an industry-electricity MWh. There is no
        electric furnace/kiln technology. The residential/services shifts
        (sector.coal.shift_to_elec, sector.efficiency_heat_oil_to_elec /
        _biomass_ / _gas_ with data/demand/fuel_shares.csv in
        prepare_energy_totals) explicitly do NOT touch industry. Electrification
        of process heat is achieved by editing the industry demand data
        (exogenous), after which the power system responds endogenously.
      provenance: "scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: custom_data.industry_demand
        effect: >
          THE electrification lever: build_industry_demand reads
          data/custom/industry_demand_{demand}_{planning_horizons}.csv (index
          country x carrier, columns industries) instead of UNSD+CAGR — put the
          fuel MWh into the electricity rows there.
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: sector.enable.industry
        effect: "Gates all industry loads."
        default: "true"
        provenance: "config.default.yaml:industry"
      - key: demand_data.base_year
        effect: "UNSD balance year for the baseline carrier mix."
        default: "2019"
        provenance: "config.default.yaml:base_year"
      - key: demand_data.other_industries
        effect: "Include UNSD 'consumption not elsewhere specified (industry)' rows in the totals."
        default: "false"
        provenance: "config.default.yaml:other_industries"
      - key: sector.industry_util_factor
        effect: "Scales plant-capacity-derived process emissions (unchanged by electrifying fuel use)."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor"

    boundary:
      - variant: "scale industry activity up/down over time"
        rung: L3
        note: "edit data/demand/industry_growth_cagr.csv (per country x industry CAGR; DEFAULT row fallback) — scales all carriers proportionally, mix unchanged."
      - variant: "electrify specific industries / carriers (the core request)"
        rung: L3
        note: >
          Rewrite the per-industry carrier split: custom_data.industry_demand:
          true + data/custom/industry_demand_{demand}_{planning_horizons}.csv,
          moving gas/coal/oil rows into electricity (apply an efficiency gain
          when converting fuel to electric heat). Alternatively L2: transform
          industry_base_totals inside build_industry_demand before the nodal
          dot product.
      - variant: "change which UNSD commodities count as electricity vs fuel"
        rung: L2
        note: "edit the fuel category lists returned by aggregate_fuels('industry') in _helpers."
      - variant: "electrification with hourly industrial load profiles (not flat /8760)"
        rung: L2
        note: "add_industry divides annual totals by 8760 into static p_set; supplying a time series means editing the Load construction in add_industry."
      - variant: "endogenous electrification (model chooses electric vs fuel process heat by cost)"
        rung: L5
        note: "requires per-industry useful-energy buses and competing conversion links — none exist; bespoke Python in prepare_sector_network."

    where:
      - change: "per-industry carrier split (the edit point for electrification)"
        anchor: "rule build_industry_demand — industry_base_totals / custom data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "UNSD commodity -> carrier mapping"
        anchor: "aggregate_fuels('industry') + get_conv_factors('industry') in _helpers; per-industry Transactions in data/unsd_transactions.csv"
        provenance: "scripts/_helpers.py:aggregate_fuels"
      - change: "industry loads in the network (per-carrier)"
        anchor: "add_industry in prepare_sector_network"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "nodal distribution of the electrified demand"
        anchor: "rule build_industrial_distribution_key — build_nodal_distribution_key (plant capacity keys, GDP fallback)"
        provenance: "scripts/build_industrial_distribution_key.py:build_nodal_distribution_key"
      - change: "residential/services electrification (for disambiguation — not industry)"
        anchor: "prepare_energy_totals — fuel_shares + efficiency_heat_*_to_elec"
        provenance: "scripts/prepare_energy_totals.py:efficiency_heat_oil_to_elec"

    data_dependencies:
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "baseline per-industry carrier mix"
        availability: "must be built (demand_data.update_data); coverage/quality region-dependent"
      - input: "data/unsd_transactions.csv"
        required_for: "industry categories (iron and steel, non-metallic minerals, ...)"
        availability: "exists by default"
      - input: "data/demand/industry_growth_cagr.csv"
        required_for: "activity scaling"
        availability: "exists by default (DEFAULT fallback)"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "imposed electrified carrier mix"
        availability: "absent — user-supplied"
      - input: "resources/industrial_database.csv + pop/GDP layouts"
        required_for: "nodal distribution keys"
        availability: "must be built (rule build_industrial_database + upstream)"
