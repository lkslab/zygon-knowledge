id: electrolytic-chemicals
title: Electrolytic and electricity-based chemicals
summary: >
  Producing basic chemicals with electricity and electrolytic hydrogen instead
  of fossil feedstocks — chlor-alkali electrolysis, electrolytic ammonia
  (H2 + Haber-Bosch), e-methanol, and electricity-driven recycling of
  plastics.
when_to_use:
  - "electrolytic chemicals / power-to-chemicals"
  - "chlor-alkali electrolysis"
  - "chlorine production"
  - "green ammonia for industry"
  - "e-methanol for industry"
  - "electrify the chemical industry"
  - "HVC chemical / mechanical recycling electricity"
  - "chemicals hydrogen demand"
  - "pypsa-eur terms: MWh_elec_per_tCl, Haber-Bosch, methanolisation, industry methanol"
  - "green ammonia"
  - "electrolytic chemicals"
  - "e-methanol"
  - "green hydrogen for chemicals"
  - "power-to-X chemicals"
  - "fossil-free fertiliser"
  - "chemical industry decarbonisation"
  - "naphtha / HVC feedstock switch"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d2e0d48666f09a580c744846cef37e5059761d7a", date: "2026-10-09"}
    out_of_box:
      covers: >
        The chemicals block of build_industry_sector_ratios carves dedicated
        electro-chemical sectors out of "Basic chemicals": (1) Chlorine —
        chlor-alkali intensities industry.MWh_elec_per_tCl (3.6) and
        industry.MWh_H2_per_tCl (-0.9372): the NEGATIVE hydrogen value is the
        electrolysis H2 byproduct, so chlorine production REDUCES the net
        "H2 for industry" load. (2) Methanol — demand of
        industry.MWh_MeOH_per_tMeOH (5.528) per tonne lands as the "industry
        methanol" load, supplied by extendable "methanolisation" Links
        (H2 + electricity + captured CO2 in), so industrial methanol is
        e-methanol whenever the optimum says so — it shares the EU methanol
        pool with biomass-to-methanol (default on) and the off-by-default
        e-biomethanol, biogas, grey and blue methanol routes (see e-methanol). (3) Ammonia — with
        sector.ammonia true (default) an "NH3" Load is served by extendable
        "Haber-Bosch" Links (electricity bus0, H2 bus2) plus ammonia cracker
        and storage (add_ammonia); with sector.ammonia false the ammonia
        demand is folded directly into hydrogen and electricity at the
        electrolysis-route intensities (MWh_H2_per_tNH3_electrolysis 5.93,
        MWh_elec_per_tNH3_electrolysis 0.2473). (4) HVC recycling — "HVC
        (mechanical recycling)" and "HVC (chemical recycling)" are pure
        electricity sectors (0.547 / 6.9 MWh/t), phased in by the
        HVC_*_recycling_fraction ramps. In all cases the ORIGIN of the
        hydrogen/electricity is endogenous (electrolysis vs SMR vs SMR CC on
        the shared H2 buses) — so "electrolytic vs blue" chemicals is decided
        by the optimiser at the hydrogen level, while production volumes and
        routes are exogenous.
      mechanism: >
        rule build_industry_sector_ratios (chemicals_industry: subtracts
        today's ammonia/chlorine/methanol energy from Basic chemicals, then
        defines Ammonia, Chlorine, Methanol, HVC recycling sectors) -> demand
        chain to build_industrial_energy_demand_per_node -> add_industry
        attaches "H2 for industry" (net of the chlorine byproduct), "industry
        electricity", "industry methanol" (+ methanolisation links) and NH3
        loads; add_ammonia (gated by sector.ammonia) builds Haber-Bosch,
        "ammonia cracker" and "ammonia store" components.
      not_covered: >
        Production volumes are static EU-wide config scalars
        (industry.chlorine_production_today 9.58 Mt,
        methanol_production_today 1.5 Mt) held constant across horizons — no
        growth lever, no per-country data. No chlor-alkali plant component
        (chlorine electricity is inside the flat "industry electricity" load —
        no capacity, no flexibility, no membrane vs diaphragm detail). No
        endogenous route choice for HVC feedstock electrification (no
        electric steam cracker exists; primary HVC runs on naphtha), and the
        recycling fractions are exogenous ramps. Chemicals process heat is a
        flat fuel load like every other sector — no temperature resolution
        and no endogenous supply choice.
      provenance: "scripts/build_industry_sector_ratios.py:chemicals_industry; scripts/build_industry_sector_ratios.py:MWh_H2_per_tCl; scripts/prepare_sector_network.py:add_ammonia; scripts/prepare_sector_network.py:methanolisation; scripts/prepare_sector_network.py:industry methanol; scripts/build_industrial_energy_demand_per_node.py"
    levers:
      - key: sector.ammonia
        effect: "true models NH3 explicitly (Haber-Bosch links + cracker + storage, industrial NH3 load); false folds ammonia into H2 + electricity demand at electrolysis intensities. 'regional' resolves NH3 per node."
        default: "true"
        provenance: "config/config.default.yaml:ammonia; scripts/prepare_sector_network.py:add_ammonia"
      - key: industry.MWh_elec_per_tCl
        effect: "Chlor-alkali electricity intensity."
        default: "3.6"
        provenance: "config/config.default.yaml:MWh_elec_per_tCl; scripts/build_industry_sector_ratios.py:MWh_elec_per_tCl"
      - key: industry.MWh_H2_per_tCl
        effect: "Chlorine hydrogen coefficient — negative means H2 byproduct credited against industrial hydrogen demand."
        default: "-0.9372"
        provenance: "config/config.default.yaml:MWh_H2_per_tCl; scripts/build_industry_sector_ratios.py:MWh_H2_per_tCl"
      - key: industry.chlorine_production_today
        effect: "EU chlorine production (Mt/a) carved out of Basic chemicals and held constant."
        default: "9.58"
        provenance: "config/config.default.yaml:chlorine_production_today; scripts/build_industry_sector_ratios.py:chlorine_production_today"
      - key: industry.methanol_production_today
        effect: "EU methanol production (Mt/a) becoming the 'industry methanol' load."
        default: "1.5"
        provenance: "config/config.default.yaml:methanol_production_today; scripts/build_industry_sector_ratios.py:methanol_production_today"
      - key: industry.MWh_MeOH_per_tMeOH
        effect: "Methanol energy content used to size the industry methanol load."
        default: "5.528"
        provenance: "config/config.default.yaml:MWh_MeOH_per_tMeOH; scripts/build_industry_sector_ratios.py:MWh_MeOH_per_tMeOH"
      - key: industry.MWh_H2_per_tNH3_electrolysis
        effect: "Hydrogen intensity of electrolytic ammonia (used for the folded route and Haber-Bosch waste-heat accounting)."
        default: "5.93"
        provenance: "config/config.default.yaml:MWh_H2_per_tNH3_electrolysis; scripts/build_industry_sector_ratios.py:MWh_H2_per_tNH3_electrolysis"
      - key: industry.HVC_mechanical_recycling_fraction
        effect: "Per-horizon share of HVC from all-electric mechanical recycling."
        default: "{2020: 0.12, ..., 2050: 0.3}"
        provenance: "config/config.default.yaml:HVC_mechanical_recycling_fraction; scripts/build_industrial_production_per_country_tomorrow.py:HVC_mechanical_recycling_fraction"
      - key: industry.HVC_chemical_recycling_fraction
        effect: "Per-horizon share of HVC from electricity-intensive chemical recycling (6.9 MWh/t)."
        default: "{2020: 0.0, ..., 2050: 0.2}"
        provenance: "config/config.default.yaml:HVC_chemical_recycling_fraction; scripts/build_industrial_production_per_country_tomorrow.py:HVC_chemical_recycling_fraction"
      - key: sector.methanol.regional_methanol_demand
        effect: "Resolve the industry methanol load per node instead of one EU bus."
        default: "false"
        provenance: "config/config.default.yaml:regional_methanol_demand; scripts/prepare_sector_network.py:regional_methanol_demand"
      - key: sector.HVC_demand_factor
        effect: "Scale total HVC (and thus naphtha/recycling electricity) demand."
        default: "1.0"
        provenance: "config/config.default.yaml:HVC_demand_factor; scripts/prepare_sector_network.py:HVC_demand_factor"
    boundary:
      - variant: "green vs blue chemical hydrogen (electrolysis vs SMR)"
        rung: L0
        note: "endogenous on the shared H2 buses; force green by disabling sector.SMR / sector.SMR_cc (L1)"
      - variant: "explicit ammonia economy with Haber-Bosch capacity"
        rung: L0
        note: "sector.ammonia: true is the default; 'regional' for nodal NH3"
      - variant: "more plastics recycling instead of naphtha crackers"
        rung: L1
        note: "raise HVC_mechanical/chemical_recycling_fraction and lower HVC_primary_fraction"
      - variant: "growing chlorine or methanol production"
        rung: L1
        note: "raise chlorine_production_today / methanol_production_today — but they are single constants for all horizons and countries; per-horizon values need a code edit (L2)"
      - variant: "electric steam cracker for primary HVC"
        rung: L2
        note: "no electric cracker exists; shift the naphtha/methane rows towards elec in the Basic chemicals block of chemicals_industry (build_industry_sector_ratios.py) — or add a dedicated route column plus production split (L2+L3 for costs)"
      - variant: "chlor-alkali demand response / flexible operation"
        rung: L5
        note: "chlorine electricity is part of a flat Load; flexibility needs a bespoke Link+Store demand model"
      - variant: "site chlorine/methanol at real plant locations"
        rung: L2
        note: "distributed via hotmaps 'Chemical industry' keys; a dedicated plant list needs a new branch in build_industrial_distribution_key (ammonia already has one: prepare_ammonia_database + data/ammonia_plants.csv)"
    where:
      - change: "chemical sector definitions and intensities (Chlorine, Methanol, Ammonia, HVC recycling)"
        anchor: "scripts/build_industry_sector_ratios.py::chemicals_industry"
        provenance: "scripts/build_industry_sector_ratios.py:chemicals_industry"
      - change: "Haber-Bosch / ammonia cracker / ammonia storage components"
        anchor: "scripts/prepare_sector_network.py::add_ammonia (sector.ammonia)"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "industry methanol load + methanolisation supply links"
        anchor: "scripts/prepare_sector_network.py::add_industry (industry methanol block)"
        provenance: "scripts/prepare_sector_network.py:industry methanol"
      - change: "recycling-route phase-in"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py (HVC fractions)"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:HVC_mechanical_recycling_fraction"
      - change: "ammonia plant siting"
        anchor: "scripts/build_industrial_distribution_key.py::prepare_ammonia_database (data/ammonia_plants.csv)"
        provenance: "scripts/build_industrial_distribution_key.py:prepare_ammonia_database"
    data_dependencies:
      - input: "cost rows 'Haber-Bosch', 'Ammonia cracker', 'methanolisation', 'NH3 (l) storage tank incl. liquefaction'"
        required_for: "explicit ammonia and e-methanol supply"
        availability: "exists by default via retrieve_cost_data"
      - input: "ammonia production statistics (rule build_ammonia_production) + data/ammonia_plants.csv"
        required_for: "carving ammonia out of Basic chemicals; nodal NH3 distribution"
        availability: "exists by default (USGS data retrieved; plant list in repo)"
      - input: "JRC-IDEES Chemicals Industry sheets"
        required_for: "Basic chemicals baseline the carve-outs subtract from"
        availability: "retrieved by the workflow (rule retrieve_jrc_idees)"
      - input: "co2 stored buses (capture chain)"
        required_for: "methanolisation CO2 input"
        availability: "exists by default (add_co2_tracking)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Ammonia is the genuinely endogenous piece. When sector.ammonia.enable is
        true, build_industry_demand carves ammonia out of "chemical and
        petrochemical" using production data (resources/ammonia_production.csv,
        year sector.ammonia.production_year) and the gas_MWh_per_tNH3 /
        elec_MWh_per_tNH3 intensities, and add_ammonia builds an NH3 bus per
        node with an NH3 demand Load, an extendable Haber-Bosch Link consuming
        H2 + electricity, an ammonia cracker, and NH3 storage. Since H2 supply
        (electrolysis vs SMR/SMR CC) is optimised, GREEN ammonia emerges
        endogenously. The rest of the chemical sector is a demand-side
        aggregate: "chemical and petrochemical" fuel/electricity rows from UNSD
        become flat loads, naphtha feedstock is a fixed "naphtha for industry"
        load on the oil buses with an accompanying atmosphere CO2 load, and
        refinery process emissions are derived from refinery capacities x 0.51
        x 0.136 x 365 x industry_util_factor.
      mechanism: >
        add_ammonia in prepare_sector_network (Haber-Bosch / ammonia cracker /
        ammonia store Links against the endogenous H2 system); add_industry for
        the residual chemical loads; build_industry_demand for the
        ammonia carve-out and refinery process emissions.
      not_covered: >
        No methanol carrier, no HVC/steam-cracker process, no
        methanol-to-olefins, no endogenous switch of naphtha feedstock to
        e-fuels for chemicals (Fischer-Tropsch exists as a fuel technology but
        the naphtha industry load simply draws from the oil bus — decarbonised
        only insofar as the oil bus is). No electrolytic routes for chlorine or
        other chemicals.
      provenance: "scripts/prepare_sector_network.py:add_ammonia"

    levers:
      - key: sector.ammonia.enable
        effect: "Splits ammonia out of chemicals and adds the endogenous Haber-Bosch/NH3 system."
        default: "true"
        provenance: "config.default.yaml:ammonia"
      - key: sector.ammonia.production_year
        effect: "Year of ammonia production data used for the NH3 demand (2019-2023 available)."
        default: "2019"
        provenance: "config.default.yaml:production_year"
      - key: sector.ammonia.gas_MWh_per_tNH3
        effect: "Gas intensity subtracted from chemical and petrochemical when carving out ammonia."
        default: "7.81"
        provenance: "config.default.yaml:gas_MWh_per_tNH3"
      - key: sector.ammonia.elec_MWh_per_tNH3
        effect: "Electricity intensity subtracted from chemical and petrochemical when carving out ammonia."
        default: "1.278"
        provenance: "config.default.yaml:elec_MWh_per_tNH3"
      - key: sector.hydrogen.production_technologies
        effect: "Determines whether the Haber-Bosch H2 input can/must be electrolytic (drop SMR/SMR CC to force green)."
        default: '["H2 Electrolysis", "SMR", "SMR CC"]'
        provenance: "config.default.yaml:production_technologies"
      - key: sector.fischer_tropsch
        effect: "Adds Fischer-Tropsch synthesis into the oil buses that feed 'naphtha for industry' — indirect e-feedstock route."
        default: "true"
        provenance: "config.default.yaml:fischer_tropsch"
      - key: sector.industry_util_factor
        effect: "Scales refinery process emissions from plant capacities."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor"

    boundary:
      - variant: "green (electrolytic) ammonia"
        rung: L0
        note: "endogenous once sector.ammonia.enable is true; force it by restricting sector.hydrogen.production_technologies to H2 Electrolysis or via CO2 limits."
      - variant: "adjust ammonia energy intensities or production year"
        rung: L1
        note: "sector.ammonia.gas_MWh_per_tNH3 / elec_MWh_per_tNH3 / production_year."
      - variant: "shift remaining chemical fuel demand (gas/oil) to electricity or hydrogen"
        rung: L3
        note: >
          Edit the 'chemical and petrochemical' column of the industry totals
          via data/custom/industry_demand_{demand}_{planning_horizons}.csv
          (custom_data.industry_demand: true) or industry_base_totals in
          build_industry_demand — the hydrogen carrier is already plumbed
          through to 'H2 for industry' loads.
      - variant: "custom ammonia plant locations"
        rung: L3
        note: "data/industry/ammonia_plants.csv feeds create_ammonia_db (technology 'Haber-Bosch') via rule build_industrial_database."
      - variant: "e-methanol / electrolytic HVC as explicit processes"
        rung: L5
        note: "no methanol/HVC carriers or process links exist — new buses, links and cost rows in prepare_sector_network."

    where:
      - change: "endogenous ammonia system"
        anchor: "add_ammonia in prepare_sector_network (Haber-Bosch, ammonia cracker, ammonia store)"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "ammonia carve-out from chemicals"
        anchor: "build_industry_demand — ammonia block gated by snakemake.params.ammonia_enable"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "naphtha feedstock load and its CO2 accounting"
        anchor: "add_industry — 'naphtha for industry' Load + 'industry oil emissions' Load"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "refinery process emissions"
        anchor: "build_industry_demand — refinery_emissons from create_refineries_df capacities"
        provenance: "scripts/build_industrial_database.py:create_refineries_df"
      - change: "chemical fuel rows (exogenous switch point)"
        anchor: "rule build_industry_demand — industry_base_totals; custom data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:all_carriers"

    data_dependencies:
      - input: "resources/ammonia_production.csv (rule build_ammonia_production from USGS dataset)"
        required_for: "NH3 demand magnitude"
        availability: "must be built; countries without production are skipped"
      - input: "data/industry/ammonia_plants.csv"
        required_for: "ammonia plant locations for distribution keys"
        availability: "exists by default; region-dependent coverage"
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "chemical and petrochemical baseline"
        availability: "must be built; region-dependent"
      - input: "technology-data costs csv (Haber-Bosch, Ammonia cracker, NH3 storage, electrolysis rows)"
        required_for: "endogenous green-ammonia costs"
        availability: "must be built (enable.retrieve_cost_data)"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "exogenous switching of residual chemical fuels"
        availability: "absent — user-supplied"
