id: enhanced-geothermal
title: Enhanced / deep geothermal (EGS)
summary: >
  Enhanced geothermal systems — engineered deep reservoirs that unlock
  geothermal power (and district heat) outside natural hydrothermal sites,
  with drilling-dominated costs and optional reservoir flexibility.
when_to_use:
  - "add enhanced geothermal"
  - "model EGS"
  - "deep geothermal / hot dry rock"
  - "engineered geothermal reservoirs"
  - "flexible geothermal / geothermal storage flexibility"
  - "next-generation geothermal"
  - "geothermal anywhere, not just volcanic sites"
  - "pypsa-eur carrier names: geothermal heat, geothermal organic rankine cycle, geothermal district heat"
models:
  - model: pypsa-eur
    version_anchor: {ref: "f55cdf34f0e67a797fd4327bed26c56dedcb5cb8", date: "2026-10-09"}
    out_of_box:
      covers: >
        A full EGS chain exists for SECTOR runs, disabled by default
        (sector.enhanced_geothermal.enable: false). rule build_egs_potentials
        converts the repo-shipped data/egs_costs.json (1x1 degree gridded
        CAPEX and sustainable-power potentials for Europe from Aghahosseini &
        Breyer 2020, "From hot rock to useful energy") into per-cluster
        egs_potentials (CAPEX + p_nom_max, with p_nom_max = PowerSust /
        sustainability_factor, default 0.0025), an egs_overlap region matrix,
        and temperature-dependent egs_capacity_factors (ambient-temperature
        response curve from Ricks et al., built from the clustered air
        temperature). add_enhanced_geothermal then builds a supply curve per
        bus: a single "EU enhanced geothermal systems" bus with a free
        extendable "geothermal heat" Generator, per-region well Links (one per
        cost step, annuitised from the gridded CAPEX minus the ORC share,
        lifetime/FOM from the "geothermal" cost row) into a per-bus
        "geothermal heat surface" bus, one "geothermal organic rankine cycle"
        Link to electricity (efficiency and capital cost from the "organic
        rankine cycle" cost row), and — automatically wherever an "urban central heat" load
        exists (CHP mode) — a "geothermal district heat" Link priced with the
        geothermal row's "district heat surcharge" and efficiency "district
        heat-input". With flexible: true (default) each surface bus also gets
        an extendable "geothermal heat" reservoir StorageUnit (max_hours 240,
        p_min_pu = -max_boost 0.25, cyclic) and solve_network adds
        add_flexible_egs_constraint bounding reservoir charging capacity by
        well capacity.
      mechanism: >
        rule build_egs_potentials (scripts/build_egs_potentials.py:
        prepare_egs_data -> prepare_capex -> get_capacity_factors) ->
        resources/egs_potentials.csv etc.; rule
        prepare_sector_network conditionally takes them as inputs and its main
        block calls add_enhanced_geothermal when
        options["enhanced_geothermal"].get("enable"); solve_network.py wires
        add_flexible_egs_constraint into extra_functionality when the same
        flag is set.
      not_covered: >
        BROKEN L0 AT THIS REF for the default settings: the
        add_enhanced_geothermal call in prepare_sector_network's main block
        passes egs_capacity_factors="path/to/capacity_factors.csv" — a
        hardcoded placeholder instead of snakemake.input["egs_capacity_factors"]
        (which the rule does provide) — so with the default var_cf: true,
        enabling EGS fails on the missing file; set var_cf: false or fix the
        call (see boundary). No EGS in the electricity-only workflow (the
        chain lives entirely in prepare_sector_network). The potential data is
        Europe-only and fixed at the 2020 CAPEX vintage — the code itself
        logs that future cost expectations should be applied via the config
        "adjustments" mechanism. Wells are not geographically distinguishable
        below cluster resolution, and multiple geothermal nodes are
        unsupported (warning in add_enhanced_geothermal). Heat-only direct-use
        EGS (without ORC/district-heat surcharge structure) and any coupling
        to the shallow "geothermal" district-heating heat source (see
        geothermal-conventional carrier card) do not exist.
      provenance: "scripts/prepare_sector_network.py:add_enhanced_geothermal; scripts/prepare_sector_network.py:path/to/capacity_factors.csv; scripts/build_egs_potentials.py:prepare_egs_data; scripts/build_egs_potentials.py:get_capacity_factors; scripts/solve_network.py:add_flexible_egs_constraint; rules/build_sector.smk:build_egs_potentials"
    levers:
      - key: sector.enhanced_geothermal.enable
        effect: "Master switch: builds the EGS potential inputs and adds the whole EGS chain in sector runs (and the reservoir solver constraint)."
        default: "false"
        provenance: "config/config.default.yaml:enhanced_geothermal; scripts/solve_network.py:add_flexible_egs_constraint"
      - key: sector.enhanced_geothermal.var_cf
        effect: "true uses temperature-dependent capacity factors as well-Link efficiency (higher output in cold hours); false uses a constant 1.0 — currently the only working setting without the L2 call-site fix."
        default: "true"
        provenance: "config/config.default.yaml:enhanced_geothermal; scripts/build_egs_potentials.py:get_capacity_factors"
      - key: sector.enhanced_geothermal.flexible
        effect: "true adds the per-bus geothermal reservoir StorageUnit enabling shifted/boosted dispatch, plus the charging<=well-capacity solver constraint."
        default: "true"
        provenance: "config/config.default.yaml:enhanced_geothermal; scripts/prepare_sector_network.py:add_enhanced_geothermal"
      - key: sector.enhanced_geothermal.max_hours
        effect: "Energy capacity of the flexibility reservoir in hours of well output."
        default: "240"
        provenance: "config/config.default.yaml:enhanced_geothermal; scripts/prepare_sector_network.py:add_enhanced_geothermal"
      - key: sector.enhanced_geothermal.max_boost
        effect: "Reservoir discharge sets p_min_pu = -max_boost on the StorageUnit, i.e. output can exceed steady well output by this fraction."
        default: "0.25"
        provenance: "config/config.default.yaml:enhanced_geothermal; scripts/prepare_sector_network.py:add_enhanced_geothermal"
      - key: sector.enhanced_geothermal.sustainability_factor
        effect: "Divides the sustainable-heat potential to get usable p_nom_max (the data refers to the sustainably replenished share); lower it toward the sustainable share to shrink potentials."
        default: "0.0025"
        provenance: "config/config.default.yaml:sustainability_factor; scripts/build_egs_potentials.py:sustainability_factor"
      - key: adjustments.sector
        effect: "The recommended hook (logged by add_enhanced_geothermal itself) to scale the 2020-vintage EGS CAPEX to future cost expectations, e.g. a factor on Link capital_cost for the geothermal carriers."
        default: "{factor: {Link: {electricity distribution grid: {capital_cost: 1.0}}}, absolute: false}"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_sector_network.py:add_enhanced_geothermal"
    boundary:
      - variant: "enable EGS in a sector run (constant capacity factor)"
        rung: L1
        note: "sector.enhanced_geothermal.enable: true AND var_cf: false — the default var_cf: true hits the hardcoded placeholder path at this ref"
      - variant: "enable EGS with temperature-varying capacity factors"
        rung: L2
        note: "one-line fix in the prepare_sector_network main block: replace egs_capacity_factors=\"path/to/capacity_factors.csv\" with snakemake.input[\"egs_capacity_factors\"] (the rule input already exists); then enable + var_cf: true"
      - variant: "EGS without reservoir flexibility (must-run wells)"
        rung: L1
        note: "sector.enhanced_geothermal.flexible: false — no reservoir StorageUnits are built (add_flexible_egs_constraint is still called under enable but then matches no storage units)"
      - variant: "size the flexibility (hours / boost)"
        rung: L0
        note: "sector.enhanced_geothermal.max_hours / max_boost"
      - variant: "scale EGS costs to a future year / optimism scenario"
        rung: L1
        note: "adjustments.sector factor on capital_cost of the geothermal carriers — the mechanism the code itself recommends; per-attribute cost rows 'geothermal' and 'organic rankine cycle' can also be overwritten via costs.overwrites / data/custom_costs.csv"
      - variant: "EGS as combined heat and power vs electricity-only"
        rung: L0
        note: "automatic — CHP mode engages wherever an 'urban central heat' load exists at the bus (district heating footprint); electricity-only otherwise; no separate switch"
      - variant: "different subsurface potential/cost data"
        rung: L3
        note: "replace data/egs_costs.json (LCOE-classed, per-year gridded Lon/Lat/CAPEX/PowerSust structure parsed by prepare_egs_data) — format must match, or adapt the parser (L2 on top)"
      - variant: "EGS in the electricity-only workflow"
        rung: L4
        note: "the chain is sector-only; would need the egs rules wired into build_electricity plumbing plus an attach step in add_electricity"
      - variant: "regionally differentiated geothermal nodes (not one EU drilling bus)"
        rung: L2
        note: "spatial.geothermal_heat is hardcoded to one 'EU enhanced geothermal systems' node in define_spatial and add_enhanced_geothermal warns it is not implemented for multiple nodes — localise the namespace and the well bus0 there"
    where:
      - change: "the whole EGS component chain (wells supply curve, ORC, district heat, reservoir)"
        anchor: "scripts/prepare_sector_network.py::add_enhanced_geothermal (called from the main block gated by sector.enhanced_geothermal.enable)"
        provenance: "scripts/prepare_sector_network.py:add_enhanced_geothermal"
      - change: "the broken capacity-factor path (L2 fix)"
        anchor: "prepare_sector_network main block, add_enhanced_geothermal call — egs_capacity_factors argument"
        provenance: "scripts/prepare_sector_network.py:path/to/capacity_factors.csv"
      - change: "potential, overlap and capacity-factor inputs"
        anchor: "rule build_egs_potentials; scripts/build_egs_potentials.py (prepare_egs_data, prepare_capex, get_capacity_factors, sustainability_factor)"
        provenance: "rules/build_sector.smk:build_egs_potentials; scripts/build_egs_potentials.py:prepare_capex"
      - change: "reservoir charging-capacity solver constraint"
        anchor: "scripts/solve_network.py::add_flexible_egs_constraint (wired in extra_functionality by the enable flag)"
        provenance: "scripts/solve_network.py:add_flexible_egs_constraint; scripts/solve_network.py:extra_functionality"
      - change: "single-EU-node spatial namespace for the drilling part"
        anchor: "scripts/prepare_sector_network.py define_spatial (spatial.geothermal_heat)"
        provenance: "scripts/prepare_sector_network.py:spatial.geothermal_heat"
      - change: "cost scaling hook"
        anchor: "config adjustments.sector (applied to the sector network); cost rows via scripts/process_cost_data.py::overwrite_costs"
        provenance: "config/config.default.yaml:adjustments; scripts/process_cost_data.py:overwrite_costs"
    data_dependencies:
      - input: "data/egs_costs.json (Aghahosseini & Breyer gridded CAPEX + sustainable potentials)"
        required_for: "any EGS run"
        availability: "exists by default in the repo (Europe only, 2020 CAPEX vintage)"
      - input: "cost rows 'geothermal' (lifetime, FOM, district heat surcharge, district heat-input) and 'organic rankine cycle'"
        required_for: "annuitisation, ORC link, district heat link"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "temp_air_total.nc (clustered air temperature)"
        required_for: "var_cf capacity factors (rule input only requested when var_cf is true)"
        availability: "must be built (heat workflow builds it by default in sector runs)"
      - input: "urban central heat buses (district heating footprint)"
        required_for: "the geothermal district heat (CHP) links"
        availability: "exists by default in sector runs wherever the district heat share is nonzero"
      - input: "egs_potentials / egs_overlap / egs_capacity_factors CSVs"
        required_for: "add_enhanced_geothermal inputs"
        availability: "must be built (rule build_egs_potentials; only requested as prepare_sector_network inputs when enable is true)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        NOT covered as a distinct technology. There is no EGS carrier, no
        EGS-specific costs handling, and no subsurface resource data anywhere in
        the workflow (no hits for EGS or enhanced geothermal in scripts/ or
        config.default.yaml). The only geothermal representation is the
        conventional fleet carrier "geothermal" in
        electricity.conventional_carriers, attached as dispatchable Generators from
        the powerplantmatching database (see the sibling geothermal-conventional
        carrier card).
      mechanism: >
        Nearest existing machinery: attach_conventional_generators in
        scripts/add_electricity.py — EGS can be approximated as extendable
        "geothermal" with overridden costs, or introduced as a new conventional
        carrier with its own costs row and candidate sites.
      not_covered: >
        No EGS carrier or costs row, no drilling-depth/temperature potential maps,
        no site-specific capacity limits, no distinction between hydrothermal and
        engineered reservoirs.
      provenance: "config.default.yaml:conventional_carriers"
    levers:
      - key: electricity.extendable_carriers.Generator
        effect: >
          Adding "geothermal" (proxy route) makes it expandable — but only at buses
          that already host geothermal plants in the fleet.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.conventional_carriers
        effect: "List a new EGS carrier here (with a fleet/candidate sites) for it to be attached."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers"
      - key: electricity.custom_powerplants
        effect: "'merge' injects user-authored EGS candidate units from data/custom_powerplants.csv."
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: "Country-wise capacity caps for the (proxy or new) carrier via add_CCL_constraints with 'CCL' in opts — a crude stand-in for resource limits."
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
    boundary:
      - variant: "approximate EGS as extendable conventional geothermal with EGS costs"
        rung: L1
        note: >
          add 'geothermal' to electricity.extendable_carriers.Generator and
          overwrite cost attributes via the costs config overwrites read by
          load_costs (process_cost_data.py); expansion restricted to buses with
          existing geothermal plants, and the technology loses its separate identity
      - variant: "distinct EGS carrier with own costs and candidate sites"
        rung: L3
        note: >
          new costs row (e.g. 'geothermal-EGS') in the retrieved technology-data
          costs file or a custom costs.technology_data_version; add the carrier to
          electricity.conventional_carriers / extendable_carriers.Generator; author
          candidate units in data/custom_powerplants.csv so
          attach_conventional_generators has buses to place them at
      - variant: "EGS buildable at every bus (no existing-site restriction)"
        rung: L2
        note: >
          small localised edit in attach_conventional_generators, where
          carrier_buses is derived from the existing fleet of the carrier
      - variant: "subsurface potential maps constraining EGS p_nom_max per region"
        rung: L5
        note: >
          no geological/temperature-at-depth data or rule exists; needs a bespoke
          dataset, a new snakemake rule to regionalise it (L4 plumbing), and code to
          translate potentials into p_nom_max — the full L5 path
      - variant: "country-level EGS build caps as a stopgap"
        rung: L1
        note: "electricity.agg_p_nom_limits rows + 'CCL' in scenario.opts"
    where:
      - change: "carrier attachment / extendable placement (the EGS entry point)"
        anchor: "scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "costs row / cost overrides"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data; costs.technology_data_version"
        provenance: "scripts/process_cost_data.py:load_costs"
      - change: "candidate EGS units"
        anchor: "scripts/build_powerplants.py::add_custom_powerplants with electricity.custom_powerplants"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - change: "capacity limit constraints"
        anchor: "scripts/solve_network.py::add_CCL_constraints; scripts/solve_network.py::extra_functionality for bespoke potential constraints"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "EGS costs row (drilling-dominated CAPEX)"
        required_for: "distinct EGS carrier"
        availability: "absent from the retrieved technology-data costs file — must be added by the user"
      - input: "subsurface potential data (temperature at depth, heat flow)"
        required_for: "resource-constrained EGS potentials"
        availability: "absent — no such dataset or retrieval rule exists in the workflow"
      - input: "data/custom_powerplants.csv candidate units"
        required_for: "placing EGS capacity at buses"
        availability: "template exists by default; rows user-authored"
      - input: "powerplantmatching database (Geothermal fueltype)"
        required_for: "the conventional-geothermal proxy route (defines expansion buses)"
        availability: "region-dependent"
