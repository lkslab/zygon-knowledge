id: geothermal-conventional
title: Geothermal (conventional)
summary: >
  Conventional (hydrothermal) geothermal energy: existing geothermal power
  stations as dispatchable generators, and shallow/hydrothermal geothermal as
  a district-heating heat source.
when_to_use:
  - "add geothermal power"
  - "model existing geothermal plants"
  - "geothermal electricity in the mix"
  - "expand geothermal capacity"
  - "remove geothermal"
  - "volcanic / hydrothermal power stations"
  - "geothermal baseload"
  - "geothermal district heating / geothermal heat pumps"
  - "pypsa-eur carrier names: geothermal, urban central geothermal heat, urban central geothermal heat pump, urban central geothermal heat direct utilisation"
  - "known in pypsa-eur as: geothermal, geothermal heat, geothermal district heat, geothermal heat direct utilisation, geothermal organic rankine cycle"
models:
  - model: pypsa-eur
    version_anchor: {ref: "a6c45e5a2d926ba9a5566cba24d905cff9f89939", date: "2026-09-09"}
    out_of_box:
      covers: >
        Two distinct sides. POWER (electricity workflow, on by default):
        "geothermal" is in electricity.conventional_carriers, so the existing
        fleet from powerplantmatching (the shipped archive holds 36 European
        geothermal units, 23 of them in Italy) is attached by
        attach_conventional_generators as non-extendable, fully dispatchable
        Generators. Note the cost row's content: in the processed costs the
        "geothermal" row has investment/capital_cost 0, efficiency 1.0, fuel 0
        — and CO2 intensity 0.12 tCO2/MWh, which add_co2_emissions attaches to
        the carrier, so geothermal dispatch DOES count against
        electricity-workflow CO2 caps and emission prices. HEAT (sector runs,
        machinery present but not active by default): geothermal is a
        configured limited district-heating heat source
        (sector.district_heating.limited_heat_sources.geothermal, constant
        source temperature 65 C) and is in
        sector.district_heating.direct_utilisation_heat_sources — but the heat
        source loop in add_heat iterates sector.heat_pump_sources per heat
        system, whose "urban central" list is only [air]; adding "geothermal"
        there activates, per district-heating node: an "urban central
        geothermal heat" bus + extendable source Generator capped by the
        regional potential (rule build_geothermal_heat_potential aggregates
        Fraunhofer-ISI LAU-level potentials to the clustered regions; costs
        from the "central geothermal heat source" row), an "urban central
        geothermal heat pump" Link (cost row "central excess-heat-sourced heat
        pump" via heat_pump_costs_name), and a direct-utilisation Link that
        bypasses the heat pump in hours where the source temperature exceeds
        the network forward temperature.
      mechanism: >
        Power: rule build_powerplants -> rule compose_network
        (attach_conventional_generators; carriers restricted to those present
        in the powerplant data). Heat: rule
        retrieve_geothermal_heat_utilisation_potentials -> rule
        build_geothermal_heat_potential ->
        heat_source_power_geothermal.csv, requested as a
        prepare_sector_network input by input_heat_source_power only when
        "geothermal" is in sector.heat_pump_sources."urban central"; consumed
        in add_heat's heat-source loop (limited_heat_sources branch +
        direct_utilisation_heat_sources branch).
      not_covered: >
        No resource assessment for new POWER sites: no geothermal potential
        map, no time-varying availability, no greenfield siting — power
        coverage is strictly the powerplantmatching fleet (or
        custom_powerplants rows). Geothermal power is NOT extendable by
        default, and simply adding it to extendable_carriers.Generator is a
        trap: the cost row carries zero investment, so candidates would be
        free — pair expansion with a cost override. In sector runs the power
        fleet disappears entirely: remove_elec_base_techs keeps only nuclear
        among conventionals (pypsa_eur keep-list) and
        sector.conventional_generation has no geothermal entry; the myopic
        brownfield step also drops Fueltype "Geothermal" (fueltype_to_drop in
        add_existing_baseyear). Deep/engineered EGS (wells, ORC, reservoir
        flexibility) is a separate chain — see the enhanced-geothermal
        carrier card. Decentral (building-level) geothermal heat pumps are the
        "ground" source in sector.heat_pump_sources rural, a different,
        unlimited heat source.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/add_electricity.py:add_co2_emissions; scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:remove_elec_base_techs; rules/build_sector.smk:build_geothermal_heat_potential; rules/build_sector.smk:input_heat_source_power; scripts/add_existing_baseyear.py:fueltype_to_drop"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing geothermal power fleet."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: "Add 'geothermal' to allow power expansion (candidates only at buses with existing plants unless everywhere_powerplants) — MUST be combined with an investment-cost override, the default cost row has capital_cost 0."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.everywhere_powerplants
        effect: "['Geothermal'] seeds zero-capacity geothermal plants at all substations for greenfield candidates (add_everywhere_powerplants) — physically dubious for a site-bound resource, use with CCL caps."
        default: "[] (empty)"
        provenance: "config/config.default.yaml:everywhere_powerplants; scripts/build_powerplants.py:add_everywhere_powerplants"
      - key: electricity.custom_powerplants
        effect: "Pandas query (or true) to inject plants/candidate sites from data/custom_powerplants.csv (Fueltype Geothermal)."
        default: "false"
        provenance: "config/config.default.yaml:custom_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - key: solving.constraints.CCL
        effect: "true enforces per-country per-carrier capacity min/max from data/agg_p_nom_minmax.csv — the stand-in for national geothermal resource limits on extendable geothermal."
        default: "false"
        provenance: "config/config.default.yaml:CCL; scripts/solve_network.py:add_CCL_constraints"
      - key: costs.overwrites
        effect: "Override the geothermal row's investment/VOM/efficiency/lifetime (essential before making the carrier extendable); data/custom_costs.csv (costs.custom_cost_fn) is the non-deprecated route."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: sector.heat_pump_sources.urban central
        effect: "Append 'geothermal' to activate the geothermal district-heat chain (source generator with regional potential + heat pump + direct utilisation) at district-heating nodes."
        default: "[air]"
        provenance: "config/config.default.yaml:heat_pump_sources; scripts/prepare_sector_network.py:add_heat"
      - key: sector.district_heating.limited_heat_sources.geothermal.constant_temperature_celsius
        effect: "Assumed constant geothermal source temperature — drives the heat pump COP and the hours in which direct utilisation (source temp >= forward temp) is possible."
        default: "65"
        provenance: "config/config.default.yaml:constant_temperature_celsius; rules/build_sector.smk:build_geothermal_heat_potential"
      - key: sector.district_heating.limited_heat_sources.geothermal.ignore_missing_regions
        effect: "true tolerates clustered regions absent from the ISI potential data instead of raising."
        default: "false"
        provenance: "config/config.default.yaml:ignore_missing_regions; rules/build_sector.smk:build_geothermal_heat_potential"
      - key: sector.district_heating.direct_utilisation_heat_sources
        effect: "Heat sources allowed to feed district heating directly (without heat pump) when hot enough; geothermal is listed by default."
        default: "[geothermal]"
        provenance: "config/config.default.yaml:direct_utilisation_heat_sources; scripts/prepare_sector_network.py:add_heat"
      - key: pypsa_eur.Generator
        effect: "Sector-run keep-list: append 'geothermal' to carry the existing geothermal POWER fleet into sector networks (dropped by default by remove_elec_base_techs)."
        default: "[onwind, offwind-ac, offwind-dc, offwind-float, solar-hsat, solar, ror, nuclear]"
        provenance: "config/config.default.yaml:pypsa_eur; scripts/prepare_sector_network.py:remove_elec_base_techs"
    boundary:
      - variant: "run with the existing geothermal power fleet (electricity workflow)"
        rung: L0
        note: "default — 'geothermal' in electricity.conventional_carriers"
      - variant: "run without geothermal power"
        rung: L1
        note: "remove 'geothermal' from electricity.conventional_carriers"
      - variant: "expand geothermal power at existing sites"
        rung: L1
        note: "add 'geothermal' to extendable_carriers.Generator AND override investment via costs.overwrites / data/custom_costs.csv (default row is zero-cost); cap nationally with CCL"
      - variant: "geothermal district heat in sector runs"
        rung: L1
        note: "append 'geothermal' to sector.heat_pump_sources.'urban central' — potentials, heat pump and direct utilisation all wire up automatically from the retrieved ISI dataset"
      - variant: "keep geothermal power in sector runs"
        rung: L1
        note: "append 'geothermal' to pypsa_eur.Generator (keep-list of remove_elec_base_techs); sector.conventional_generation is not usable here (it keys Link costs by generator name and would need a fuel bus)"
      - variant: "add known plants or candidate sites missing from the database"
        rung: L3
        note: "rows in data/custom_powerplants.csv (Fueltype Geothermal) + electricity.custom_powerplants: true"
      - variant: "tune the geothermal heat source temperature / potential handling"
        rung: L1
        note: "sector.district_heating.limited_heat_sources.geothermal.constant_temperature_celsius / ignore_missing_regions"
      - variant: "different geothermal heat potential data"
        rung: L3
        note: "replace the retrieved isi_heat_potentials input of rule build_geothermal_heat_potential (LAU-level xlsx parsed by get_heat_source_power) or pin datasets.geothermal_heat_utilisation_potentials to another version"
      - variant: "resource-constrained POWER potentials (site/temperature maps)"
        rung: L5
        note: "no potential-map machinery exists for geothermal electricity; needs bespoke data + rule + p_nom_max logic (the EGS chain in the enhanced-geothermal carrier card is the closest template)"
      - variant: "time-varying availability / seasonal derating of geothermal power"
        rung: L1
        note: "add a conventional config block (conventional: {geothermal: {p_max_pu: 0.9}}) — the conventional_params machinery applies any generator attribute per carrier, a 'data/' CSV path gives per-country values (the nuclear block is the template)"
    where:
      - change: "power fleet attachment + extendable candidates + per-carrier attribute overrides"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (rule compose_network; conventional_params)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "carrier CO2 intensity attachment (geothermal emits 0.12 tCO2/MWh here)"
        anchor: "scripts/add_electricity.py::add_co2_emissions"
        provenance: "scripts/add_electricity.py:add_co2_emissions"
      - change: "geothermal district-heat source, heat pump and direct utilisation creation"
        anchor: "scripts/prepare_sector_network.py::add_heat (heat-source loop over heat_pump_sources; limited_heat_sources / direct_utilisation_heat_sources branches)"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:direct_utilisation_heat_sources"
      - change: "regional heat potential construction from ISI LAU data"
        anchor: "rule build_geothermal_heat_potential; scripts/build_geothermal_heat_potential.py::get_heat_source_power"
        provenance: "rules/build_sector.smk:build_geothermal_heat_potential; scripts/build_geothermal_heat_potential.py:get_heat_source_power"
      - change: "cost-row names for the heat side"
        anchor: "scripts/definitions/heat_system.py::heat_pump_costs_name / ::heat_source_costs_name ('central excess-heat-sourced heat pump', 'central geothermal heat source')"
        provenance: "scripts/definitions/heat_system.py:heat_pump_costs_name; scripts/definitions/heat_system.py:heat_source_costs_name"
      - change: "fleet construction / custom sites / everywhere seeding"
        anchor: "rule build_powerplants; scripts/build_powerplants.py::add_custom_powerplants / ::add_everywhere_powerplants"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants; scripts/build_powerplants.py:add_everywhere_powerplants"
      - change: "country capacity limits for extendable geothermal"
        anchor: "scripts/solve_network.py::add_CCL_constraints (solving.constraints.CCL)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
    data_dependencies:
      - input: "powerplantmatching database (Fueltype Geothermal)"
        required_for: "existing power fleet and default expansion buses"
        availability: "retrieved by the workflow; shipped archive has 36 units, concentrated in Italy"
      - input: "cost row 'geothermal' in the processed technology-data file"
        required_for: "power-side costs — NOTE zero investment, efficiency 1.0, CO2 intensity 0.12 at this ref"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "isi_heat_potentials (Fraunhofer ISI geothermal heat utilisation potentials, LAU-level) + LAU regions"
        required_for: "district-heat source potentials"
        availability: "retrieved by default (rule retrieve_geothermal_heat_utilisation_potentials; datasets.geothermal_heat_utilisation_potentials)"
      - input: "cost rows 'central geothermal heat source' and 'central excess-heat-sourced heat pump'"
        required_for: "heat-side capital costs and COP"
        availability: "exists by default in processed technology-data"
      - input: "urban central heat buses (district heating footprint)"
        required_for: "heat-side placement (only district-heating nodes get the source chain)"
        availability: "exists by default in sector runs wherever district heat share > 0"
      - input: "data/agg_p_nom_minmax.csv / data/custom_powerplants.csv"
        required_for: "capacity caps (CCL) / user sites"
        availability: "templates exist by default; rows user-authored"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        The existing geothermal fleet is modelled by default: "geothermal" is in
        electricity.conventional_carriers, plants come from the powerplantmatching
        database (rule build_powerplants; Geothermal fueltype, fuel_to_lifetime 15
        years in configs/powerplantmatching_config.yaml), and
        attach_conventional_generators adds them as non-extendable, fully
        dispatchable Generators (p_max_pu defaults to 1) aggregated by
        (bus, carrier, grouping_year), with costs/efficiency/lifetime from the
        "geothermal" row of the retrieved technology-data costs file.
      mechanism: >
        Snakefile rule build_powerplants -> resources/<run>/powerplants.csv (carrier
        names mapped to lower case pypsa names in
        scripts/add_electricity.py::load_powerplants); rule add_electricity calls
        attach_conventional_generators, which also creates extendable geothermal
        generators if the carrier is listed in
        electricity.extendable_carriers.Generator — but only at buses that already
        host geothermal plants.
      not_covered: >
        No resource assessment: there is no geothermal potential map, no
        time-varying availability, and no new-site (greenfield) siting logic —
        coverage is strictly the plants known to powerplantmatching (or supplied via
        custom_powerplants). Geothermal heat supply in the sector-coupled workflow
        is not modelled either (the "central geothermal heat source" costs row is
        not consumed by prepare_sector_network.py).
      provenance: "scripts/add_electricity.py:attach_conventional_generators"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing geothermal fleet."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Add "geothermal" to allow expansion — candidates only at buses with
          existing geothermal plants.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "Pandas query on DateIn/DateOut columns; controls which fleet vintages enter the model."
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' injects rows from data/custom_powerplants.csv (Fueltype Geothermal) for plants or candidate sites missing from powerplantmatching."
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: >
          Country-wise min/max capacity limits per carrier via
          data/agg_p_nom_minmax.csv, enforced by add_CCL_constraints when "CCL" is
          in the opts wildcard (the config comment names geothermal explicitly).
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "config.default.yaml:agg_p_nom_limits"
      - key: costs.year
        effect: "Cost year for the technology-data file supplying the 'geothermal' row."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version"
    boundary:
      - variant: "run without geothermal"
        rung: L0
        note: "remove 'geothermal' from electricity.conventional_carriers"
      - variant: "expand geothermal at existing sites"
        rung: L1
        note: "add 'geothermal' to electricity.extendable_carriers.Generator"
      - variant: "cap/force geothermal capacity per country"
        rung: L1
        note: "electricity.agg_p_nom_limits + 'CCL' in scenario.opts; author rows in data/agg_p_nom_minmax.csv"
      - variant: "add known plants or candidate sites missing from the database"
        rung: L3
        note: "rows in data/custom_powerplants.csv (Fueltype Geothermal) with electricity.custom_powerplants: merge"
      - variant: "override geothermal cost assumptions"
        rung: L1
        note: >
          per-attribute overwrites read by load_costs in process_cost_data.py
          (investment/FOM/VOM/fuel/efficiency/lifetime, marginal_cost/capital_cost);
          the investment block is present but commented out in config.default.yaml
      - variant: "greenfield geothermal at any bus"
        rung: L2
        note: >
          the extendable block of attach_conventional_generators derives
          carrier_buses from the existing fleet; small localised edit to offer the
          carrier at all buses (or seed sites via custom_powerplants, L3)
      - variant: "resource-constrained geothermal potentials (site/temperature maps)"
        rung: L5
        note: "no potential-map machinery exists for geothermal; needs bespoke data + rule + p_nom_max logic"
      - variant: "geothermal district heat in sector runs"
        rung: L5
        note: "not wired into prepare_sector_network.py; would need new component logic despite the costs row existing"
    where:
      - change: "fleet attachment + extendable geothermal"
        anchor: "scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "fleet construction / custom sites"
        anchor: "Snakefile rule build_powerplants; scripts/build_powerplants.py::add_custom_powerplants; configs/powerplantmatching_config.yaml (fuel_to_lifetime Geothermal)"
        provenance: "configs/powerplantmatching_config.yaml:fuel_to_lifetime"
      - change: "country capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "cost assumptions"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data"
        provenance: "scripts/process_cost_data.py:load_costs"
    data_dependencies:
      - input: "powerplantmatching database (Geothermal fueltype)"
        required_for: "existing fleet and expansion buses"
        availability: "region-dependent — strong for e.g. Kenya/Indonesia-type geothermal countries only insofar as the ppm sources cover them; verify resources/<run>/powerplants.csv"
      - input: "costs row 'geothermal' in retrieved technology-data"
        required_for: "capital/marginal cost, efficiency, lifetime"
        availability: "exists by default via rule retrieve_cost_data (costs.technology_data_version)"
      - input: "data/custom_powerplants.csv"
        required_for: "plants/candidate sites missing from powerplantmatching"
        availability: "template exists by default; rows user-authored"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps/floors (CCL)"
        availability: "template exists by default; rows must be authored"
