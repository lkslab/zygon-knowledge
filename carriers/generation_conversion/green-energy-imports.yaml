id: green-energy-imports
title: Green energy imports (H2, ammonia, methanol, e-fuels, biomass)
summary: >
  Importing carbon-neutral energy carriers from outside the modelled region —
  price-based hydrogen, ammonia, methanol, synthetic gas and oil imports at
  real entry infrastructure, plus solid biomass imports, with an overall
  import volume limit.
when_to_use:
  - "green energy imports"
  - "hydrogen imports"
  - "ammonia imports / NH3 shipping"
  - "e-fuel / synthetic fuel imports"
  - "green methanol or e-methane imports"
  - "import limit / import dependency"
  - "biomass imports"
  - "energy imports from outside Europe (MENA, global)"
  - "pypsa-eur carrier names: import H2, import NH3, import methanol, import gas, import oil, solid biomass import"
  - "import hydrogen"
  - "buy green fuels from abroad"
  - "import ammonia"
  - "import methanol / e-fuels"
  - "green fuel imports at world market price"
  - "energy import dependency scenario"
  - "imports vs domestic electrolysis"
  - "LNG-style delivery of green fuels"
  - "cheap H2 from a neighbouring country"
  - "known in pypsa-eur as: import H2, import gas, import NH3, import oil, import methanol"
models:
  - model: pypsa-eur
    version_anchor: {ref: "09e8910ae03ace9af8ff821514cda7822fdd473f", date: "2026-10-12"}
    out_of_box:
      covers: >
        First-class but OFF by default. With sector.imports.enable: true,
        add_import_options adds, per carrier priced in sector.imports.price
        (defaults: H2 74, NH3 97, methanol 121, gas 122, oil 125 EUR/MWh):
        "import H2" Generators at gas pipeline entry-point nodes, capacity
        capped by the real pipeline entry capacity (gas_input_nodes
        "pipeline" column — imported H2 arrives through repurposed border
        pipelines); "import NH3" Generators on the ammonia buses (requires
        sector.ammonia, else skipped with a warning); and — the clever
        carbon-accounting part — "import methanol" / "import oil" /
        "import gas" as LINKS whose bus0 is "co2 atmosphere": importing one
        MWh of carbon-containing green fuel WITHDRAWS its combustion CO2 from
        the atmosphere balance first (efficiency = 1/CO2-intensity), so
        burning it later nets to zero — these are green synthetic fuels by
        construction, not fossil. Green gas import capacity is capped at
        LNG terminal regasification capacity per node (gas_input_nodes "lng"
        column; e-methane/bio-LNG arrives by ship). A total import volume
        limit exists: sector.imports.limit (TWh/a, sense
        sector.imports.limit_sense) is enforced in the solver by
        add_import_limit_constraint over everything whose carrier contains
        "import" — links counted at fuel-side efficiency. Separately,
        sector.solid_biomass_import (default false) adds a priced,
        volume-capped "solid biomass import" Store+Link chain onto the solid
        biomass nodes with an upstream_emissions_factor share of biomass CO2
        intensity emitted to the atmosphere.
      mechanism: >
        rule compose_network calls add_import_options when
        sector.imports.enable is true (gas_input_nodes from rule
        build_gas_input_locations supply the entry geography);
        add_biomass handles solid biomass import. solve_network.py::
        extra_functionality calls add_import_limit_constraint whenever
        sector.imports.enable is true. Fossil LNG/pipeline imports are a
        DIFFERENT mechanism (capacity-limited fossil gas supply generators —
        see fossil-fuel-supply carrier card); the two share the same entry-point
        data but different carriers and CO2 treatment.
      not_covered: >
        Prices are flat scalars per carrier — no supply-cost curves, no
        exporter-region differentiation (no MENA vs Chile), no time-varying
        or seasonal import prices, no shipping/transport modelling, no
        dedicated import terminals to build (H2/gas import capacity is fixed
        to today's entry infrastructure; NH3/methanol/oil import capacity is
        effectively unlimited p_nom = 1e7). The import limit is one global
        constraint over all green import carriers together — no per-carrier
        or per-country limits without editing add_import_limit_constraint.
        No green electricity imports (e.g. HVDC from North Africa) and no
        steel/HBI or other material imports. NH3 import needs the ammonia
        carrier enabled; with sector.ammonia false it is silently skipped.
        Upstream emissions of synthetic imports are assumed zero (only the
        biomass import has an upstream emissions factor).
      provenance: "scripts/prepare_sector_network.py:add_import_options; scripts/solve_network.py:add_import_limit_constraint; scripts/prepare_sector_network.py:solid biomass import; scripts/build_gas_input_locations.py:build_gas_input_locations"
    levers:
      - key: sector.imports.enable
        effect: "Master switch for green import options AND the import limit constraint in the solver."
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:add_import_options; scripts/solve_network.py:add_import_limit_constraint"
      - key: sector.imports.price
        effect: "EUR/MWh price per import carrier; REMOVING a key removes that import option entirely (add_import_options only builds carriers present in the dict)."
        default: "{H2: 74, NH3: 97, methanol: 121, gas: 122, oil: 125}"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:add_import_options"
      - key: sector.imports.limit
        effect: "Total green import volume bound in TWh/a across all import carriers (fuel-side energy)."
        default: ".inf (unlimited)"
        provenance: "config/config.default.yaml:imports; scripts/solve_network.py:add_import_limit_constraint"
      - key: sector.imports.limit_sense
        effect: "Direction of the volume constraint — '<=' caps imports, '>=' forces a minimum import share."
        default: "<="
        provenance: "config/config.default.yaml:imports; scripts/solve_network.py:add_import_limit_constraint"
      - key: sector.solid_biomass_import
        effect: "enable/price/max_amount (TWh/a)/upstream_emissions_factor for overseas solid biomass imports onto the biomass nodes."
        default: "{enable: false, price: 54, max_amount: 1390, upstream_emissions_factor: 0.1}"
        provenance: "config/config.default.yaml:solid_biomass_import; scripts/prepare_sector_network.py:solid biomass import"
      - key: sector.ammonia
        effect: "Must be truthy for NH3 imports to be added (creates the ammonia buses; 'regional' resolves them per node so imports land regionally)."
        default: "true"
        provenance: "config/config.default.yaml:ammonia; scripts/prepare_sector_network.py:add_import_options"
      - key: sector.gas_network
        effect: "Determines whether green gas imports land at individual LNG-terminal nodes (true) or one EU gas bus with summed capacity (false)."
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/prepare_sector_network.py:add_import_options"
      - key: sector.H2_network
        effect: "With the H2 pipeline network enabled, entry-point H2 imports can flow onward; without it imports are stranded at their entry nodes."
        default: "true"
        provenance: "config/config.default.yaml:H2_network; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
    boundary:
      - variant: "allow green imports of all five carriers"
        rung: L0
        note: "sector.imports.enable: true"
      - variant: "hydrogen-only (or any subset of) import options"
        rung: L1
        note: "prune sector.imports.price to the desired keys"
      - variant: "cap or force total import volume"
        rung: L1
        note: "sector.imports.limit + limit_sense ('>=' models import-dependency scenarios)"
      - variant: "different import price scenario"
        rung: L1
        note: "sector.imports.price values; for horizon-varying prices in myopic runs use per-horizon scenario configs (run.scenarios), since the values are scalars"
      - variant: "solid biomass imports"
        rung: L1
        note: "sector.solid_biomass_import.enable: true (own price/volume/upstream-emissions knobs; NOT counted by the green import limit constraint, which matches carriers containing 'import' — 'solid biomass import' DOES match, so it is included; check limit accounting when combining)"
      - variant: "expand H2/gas import capacity beyond today's entry infrastructure"
        rung: L2
        note: "capacities are fixed p_nom from gas_input_nodes in add_import_options; make the import generators/links extendable with a terminal capital cost there — or patch the entry data (L3)"
      - variant: "per-carrier or per-country import limits"
        rung: L2
        note: "split the single lhs in add_import_limit_constraint by carrier/bus — localised solver-constraint edit"
      - variant: "exporter supply curves / regional price differentiation"
        rung: L5
        note: "needs new data and generator structure (stepwise supply curves per origin); nothing in the codebase — the upstream pypsa-eur import branch (Hampp et al.) is not merged at this ref"
      - variant: "green electricity imports (HVDC from outside scope)"
        rung: L5
        note: "no external electricity nodes exist; would need new buses, links and boundary data"
      - variant: "seasonal / time-varying import prices"
        rung: L2
        note: "marginal_cost of the import components is static; assign a marginal_cost time series to them in add_import_options"
    where:
      - change: "import generators/links, prices, entry-capacity caps, CO2-atmosphere accounting"
        anchor: "scripts/prepare_sector_network.py::add_import_options (called in __main__ when sector.imports.enable)"
        provenance: "scripts/prepare_sector_network.py:add_import_options"
      - change: "total import volume constraint"
        anchor: "scripts/solve_network.py::add_import_limit_constraint (called from ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_import_limit_constraint; scripts/solve_network.py:extra_functionality"
      - change: "solid biomass import chain"
        anchor: "scripts/prepare_sector_network.py::add_biomass (solid_biomass_import block)"
        provenance: "scripts/prepare_sector_network.py:solid biomass import"
      - change: "entry-point geography (which nodes can import H2/gas and how much)"
        anchor: "scripts/build_gas_input_locations.py::build_gas_input_locations (rule build_gas_input_locations; GEM + SciGRID data)"
        provenance: "scripts/build_gas_input_locations.py:build_gas_input_locations; rules/build_sector.smk:build_gas_input_locations"
    data_dependencies:
      - input: "gas_input_nodes_simplified.csv (lng and pipeline columns per region)"
        required_for: "green gas import capacity (LNG) and H2 import capacity (pipeline entries)"
        availability: "must be built (rule build_gas_input_locations); default in sector workflow"
      - input: "cost rows 'methanolisation' (carbondioxide-input), 'gas'/'oil' (CO2 intensity), 'solid biomass' (CO2 intensity)"
        required_for: "the CO2-atmosphere withdrawal accounting of carbonaceous imports; biomass upstream emissions"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "ammonia buses (sector.ammonia)"
        required_for: "NH3 imports"
        availability: "exists by default (sector.ammonia: true)"
      - input: "H2 pipeline network (H2_network / H2_retrofit)"
        required_for: "distributing entry-point H2 imports to demand"
        availability: "exists by default (sector.H2_network: true)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        GREEN fuel imports are NOT covered — pypsa-earth is built around the
        opposite flow (hydrogen EXPORT via rule add_export and the {h2export}
        wildcard; see ../demand/hydrogen-export-demand.yaml). What DOES exist is
        implicit FOSSIL fuel imports: add_carrier_buses (invoked per fuel of
        sector.conventional_generation by convert_conventional_generators_to_links)
        puts an extendable, volume-unbounded Generator on each fuel bus (gas, oil,
        coal, lignite, biomass) with marginal_cost = the costs-file 'fuel' price,
        plus a Store seeded from fossil_reserves — economically a world-market
        fossil purchase. add_shipping adds the same fallback oil-bus Generator if
        none exists. Domestic green-fuel PRODUCTION is covered (electrolytic H2 in
        add_hydrogen, Fischer-Tropsch in H2_liquid_fossil_conversions, Haber-Bosch
        ammonia in add_ammonia), but nothing supplies those carriers from abroad.
      mechanism: >
        Nearest machinery for introducing imports: (a) the fuel-bus Generator
        pattern in add_carrier_buses — a Generator priced at a fuel cost on a
        carrier bus IS an import proxy, just only wired for fossil carriers;
        (b) the endogenous-export Generator in scripts/add_export.py
        (export_endogenous branch adds a sign=-1 Generator "H2 export load" priced
        at export.endogenous_price on the H2 export bus) — an import is the
        sign-flipped mirror of this; (c) add_ammonia's NH3 buses + ammonia cracker
        (NH3 to H2) give a ready attach point and conversion route for an ammonia
        import; (d) select_ports locates port H2 buses, reusable for siting
        import terminals.
      not_covered: >
        Any import of H2, NH3, methanol or synthetic fuels: no import bus, no
        import Generator/Store on green-carrier buses, no import price or volume
        config key, no import wildcard. A methanol carrier does not exist at all
        (no occurrence in scripts/prepare_sector_network.py or
        config.default.yaml). No per-origin markets, shipping transport costs, or
        import supply curves.
      provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:convert_conventional_generators_to_links; scripts/prepare_sector_network.py:add_ammonia; scripts/add_export.py:export_endogenous; Snakefile:rule add_export"
    levers:
      - key: sector.conventional_generation
        effect: >
          Generator-to-fuel mapping that decides which fossil fuel buses (and thus
          which unbounded, fuel-priced supply Generators — the de-facto fossil
          imports) are created by convert_conventional_generators_to_links /
          add_carrier_buses.
        default: "{OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass}"
        provenance: "config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - key: fossil_reserves.oil
        effect: >
          TWh of free initial energy in the fuel-bus Store added by
          add_carrier_buses (e_initial); represents domestic reserves rather than
          purchased imports.
        default: "100"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.oil.spatial_oil
        effect: "Nodal oil buses vs one aggregate bus — where an oil-carrier import/supply Generator sits."
        default: "true"
        provenance: "config.default.yaml:spatial_oil; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.gas.spatial_gas
        effect: "Nodal gas buses vs one 'Earth gas' bus — where the gas supply Generator sits."
        default: "true"
        provenance: "config.default.yaml:spatial_gas; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.ammonia.enable
        effect: >
          Creates the NH3 buses, Haber-Bosch, ammonia store and ammonia cracker —
          the attach point (and NH3-to-H2 conversion route) any ammonia-import
          addition needs.
        default: "true"
        provenance: "config.default.yaml:spatial_ammonia; scripts/prepare_sector_network.py:add_ammonia"
      - key: custom_rules
        effect: >
          List of user .smk files included into the Snakefile — the sanctioned
          hook for adding an import-injection rule without forking the core
          workflow.
        default: "[]"
        provenance: "config.default.yaml:custom_rules; Snakefile:custom_rules"
    boundary:
      - variant: "fossil fuel purchase at world market price (gas/oil/coal)"
        rung: L0
        note: >
          already implicit by default — unbounded extendable Generators at the
          costs-file 'fuel' price on every fuel bus from add_carrier_buses (and
          the add_shipping oil fallback); no volume cap exists
      - variant: "change the assumed fossil fuel import price"
        rung: L1
        note: >
          costs overwrite dict in user config (costs: fuel: {gas: <EUR/MWh>} —
          shipped commented-out in config.default.yaml) is read by load_costs in
          scripts/process_cost_data.py and overrides the 'fuel' column feeding
          those Generators' marginal_cost
      - variant: "green H2 import at a fixed price (unlimited or p_nom-capped)"
        rung: L2
        note: >
          no key exists; a few-lines edit in prepare_sector_network.py (e.g. in
          add_hydrogen) adding n.madd('Generator', ...) on the '<node> H2' buses
          with marginal_cost = assumed import price — the sign-flipped mirror of
          the export_endogenous Generator in add_export.py; restrict to port
          nodes by reusing the select_ports logic
      - variant: "green ammonia import at a fixed price"
        rung: L2
        note: >
          same pattern on spatial.ammonia.nodes (requires sector.ammonia.enable);
          the existing ammonia cracker then arbitrates imported-NH3-to-H2 against
          domestic Haber-Bosch
      - variant: "import price/availability time series or a supply curve (price tiers)"
        rung: L3
        note: >
          needs a user-supplied price/availability series (no such input exists),
          then a small edit passing it as time-varying marginal_cost (or several
          price-tiered Generators) on the import Generator
      - variant: "import volume/price as a sweepable scenario dimension (mirror of {h2export})"
        rung: L4
        note: >
          new rule + wildcard plumbing; cleanest via the custom_rules hook with a
          post-prepare rule that loads the prenetwork and injects the import
          components — structurally a sign-flipped copy of rule add_export
      - variant: "methanol (or other absent e-fuel carrier) import"
        rung: L5
        note: >
          the carrier does not exist at all — bespoke work to create the bus,
          carrier, costs rows and, critically, something that CONSUMES methanol,
          before an import source is meaningful
      - variant: "per-origin markets, shipping legs, transport costs, embargo scenarios"
        rung: L5
        note: "no topology for external regions; bespoke buses/links/price series per origin"
    where:
      - change: "adding an H2 import Generator (fixed price / capped volume)"
        anchor: "scripts/prepare_sector_network.py::add_hydrogen (H2 buses exist here)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "the priced boundary-Generator pattern to mirror (sign-flipped)"
        anchor: "scripts/add_export.py::add_export, export_endogenous branch"
        provenance: "scripts/add_export.py:export_endogenous"
      - change: "ammonia import attach point and NH3-to-H2 conversion"
        anchor: "scripts/prepare_sector_network.py::add_ammonia (spatial.ammonia.nodes, ammonia cracker)"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "fossil fuel-bus supply Generators and their price"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses; price via scripts/process_cost_data.py::load_costs cost overwrites"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/process_cost_data.py:load_costs"
      - change: "siting imports at port buses"
        anchor: "scripts/add_export.py::select_ports (port-to-bus location logic)"
        provenance: "scripts/add_export.py:select_ports"
      - change: "clean rule plumbing for an import step / sweep"
        anchor: "custom_rules config hook (included into Snakefile) + rule add_export as the structural template"
        provenance: "Snakefile:custom_rules; Snakefile:rule add_export"
    data_dependencies:
      - input: "world-market import price assumption for H2/NH3 (scalar or series, EUR/MWh)"
        required_for: "any green import variant"
        availability: "absent — user assumption; no import-side analogue of export.endogenous_price exists"
      - input: "costs_{planning_horizons}_sec.csv 'fuel' rows (gas, oil, coal)"
        required_for: "fossil purchase price (the covered L0 part) and its L1 overwrite"
        availability: "exists by default (retrieved technology-data)"
      - input: "resources export_ports.csv (World Port Index via prepare_ports, or data/custom/export_ports.csv)"
        required_for: "restricting import terminals to port nodes"
        availability: "built by rule prepare_ports; reusable for the import side"
      - input: "costs rows 'Ammonia cracker' / 'Haber-Bosch'"
        required_for: "ammonia import arbitrage against domestic production"
        availability: "exists by default when sector.ammonia.enable is true (used by add_ammonia)"
      - input: "methanol carrier representation (costs, demand coupling)"
        required_for: "methanol import"
        availability: "absent — carrier not modelled anywhere in pypsa-earth"
