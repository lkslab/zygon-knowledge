id: grid-forming-inverters
title: Grid-forming inverters
summary: Inverter-based resources that form (rather than follow) grid voltage/frequency — system strength, synthetic inertia, and stability services from converters.
when_to_use:
  - "grid-forming vs grid-following inverters"
  - "synthetic / virtual inertia from batteries or PV"
  - "system strength with high renewable shares"
  - "frequency stability in a 100% renewables grid"
  - "can the model do inverter dynamics"
  - "minimum synchronous generation constraint"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d2e0d48666f09a580c744846cef37e5059761d7a", date: "2026-10-09"}
    out_of_box:
      covers: >
        Not covered. PyPSA-Eur solves a linearised optimal power flow /
        capacity-expansion problem (solve_network.py builds and solves via
        n.optimize / optimize_transmission_expansion_iteratively); there is no
        frequency or voltage dynamics, no inertia accounting, and no
        grid-forming/grid-following distinction anywhere in scripts/ (no
        occurrence of inertia or grid-forming concepts). Inverters exist only
        as cost rows on storage converters — e.g. "battery inverter" and
        "home battery inverter" efficiencies/costs applied to
        charger/discharger links (attach_stores in add_electricity;
        insert_electricity_distribution_grid for home batteries) — with no
        behavioural difference between control modes.
      mechanism: >
        Nearest stability-adjacent machinery: (a) the GenX-style operational
        reserve constraint, electricity.operational_reserve
        (add_operational_reserve_margin adds per-snapshot reserve variables
        Generator-r with load- and VRES-proportional requirements plus a fixed
        contingency); (b) the SAFE capacity reserve margin
        (solving.constraints.SAFE + an electricity.SAFE_reservemargin value
        the user must add to config — it has no default entry) requiring
        conventional capacity above peak demand
        (add_SAFE_constraints); (c) the config-exposed custom-constraint hook
        solving.options.custom_extra_functionality (a user Python file whose
        functions are executed inside extra_functionality) — the sanctioned
        place for a bespoke system-strength constraint without forking
        solve_network.py.
      not_covered: >
        Any dynamic phenomenon (RoCoF, frequency nadir, voltage control,
        fault ride-through), converter control modes, retrofit costs for
        grid-forming capability, EMT/RMS studies. Out of scope of a
        linearised LP.
      provenance: "scripts/solve_network.py:add_operational_reserve_margin; scripts/solve_network.py:add_SAFE_constraints; scripts/solve_network.py:extra_functionality; scripts/add_electricity.py:attach_stores"
    levers:
      - key: electricity.operational_reserve.activate
        effect: "Adds the reserve-margin constraint (epsilon_load share of demand + epsilon_vres share of VRES feed-in + contingency MW) — the closest existing 'keep flexible headroom online' proxy."
        default: "false (epsilon_load 0.02, epsilon_vres 0.02, contingency 4000)"
        provenance: "config/config.default.yaml:operational_reserve; scripts/solve_network.py:add_operational_reserve_margin"
      - key: solving.constraints.SAFE
        effect: "true adds a conventional-capacity reserve margin above peak demand; requires adding electricity.SAFE_reservemargin (no default ships) — renewables and storage do not count."
        default: "false"
        provenance: "config/config.default.yaml:SAFE; scripts/solve_network.py:add_SAFE_constraints"
      - key: solving.options.custom_extra_functionality
        effect: "Path to a user Python module executed at solve time — the config-level hook for bespoke stability-proxy constraints (e.g. minimum share of a labelled grid-forming carrier set)."
        default: "../data/custom_extra_functionality.py"
        provenance: "config/config.default.yaml:custom_extra_functionality; scripts/solve_network.py:custom_extra_functionality"
      - key: electricity.extendable_carriers
        effect: "Which storage/generator carriers can be built — the assets that would physically host grid-forming converters (battery via Store/StorageUnit, H2, VRES)."
        default: "Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_stores"
    boundary:
      - variant: "keep reserves/headroom online as renewables grow"
        rung: L0
        note: "electricity.operational_reserve.activate: true — a static headroom proxy, no dynamics"
      - variant: "capacity reserve margin from synchronous plant"
        rung: L1
        note: "solving.constraints.SAFE: true plus adding electricity.SAFE_reservemargin (e.g. 0.1) to the config — conventional-only by construction"
      - variant: "cost premium for grid-forming-capable inverters"
        rung: L3
        note: "adjust the 'battery inverter' (or related) cost row via costs.overwrites or data/custom_costs.csv; changes economics only, no behavioural difference"
      - variant: "minimum grid-forming/synchronous capacity share per snapshot"
        rung: L5
        note: "bespoke constraint via solving.options.custom_extra_functionality (preferred, config-wired) or directly in extra_functionality in solve_network.py; needs a user-defined carrier labelling and requirement level"
      - variant: "actual inverter dynamics / EMT or RMS stability studies"
        rung: L5
        note: "outside the model family — requires an external stability tool fed by the LP dispatch"
    where:
      - change: "custom stability-proxy constraints"
        anchor: "solving.options.custom_extra_functionality user module, executed inside scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:custom_extra_functionality; scripts/solve_network.py:extra_functionality"
      - change: "reserve-margin proxies"
        anchor: "scripts/solve_network.py::add_operational_reserve_margin / ::add_SAFE_constraints"
        provenance: "scripts/solve_network.py:add_operational_reserve_margin; scripts/solve_network.py:add_SAFE_constraints"
      - change: "inverter cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs (rows 'battery inverter', 'home battery inverter') + costs.overwrites"
        provenance: "scripts/process_cost_data.py:prepare_costs; config/config.default.yaml:overwrites"
    data_dependencies:
      - input: "cost rows for inverter technologies ('battery inverter', 'home battery inverter')"
        required_for: "cost-premium variant"
        availability: "exists by default (technology-data); grid-forming-specific rows absent — must be added"
      - input: "system-strength requirement parameters (minimum share per region/snapshot)"
        required_for: "custom L5 constraint"
        availability: "absent — user-provided assumption"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Not covered. PyPSA-Earth solves a linear optimal power flow / capacity
        expansion LP (solve_network.py: "Total annual system costs are minimised
        with PyPSA", based on network.optimize). Inverters are implicit in
        generator and storage components (e.g. the 'battery inverter' marginal-cost
        entry under costs.marginal_cost); there is no distinction between
        grid-forming and grid-following behaviour, no frequency/voltage dynamics,
        no inertia accounting, and no system-strength metric anywhere in the
        scripts (no occurrence of inertia or grid-forming concepts in scripts/).
      mechanism: >
        The nearest stability-adjacent mechanism is the optional operational
        reserve margin: electricity.operational_reserve adds a GenX-style reserve
        constraint in solve_network (add_operational_reserve_margin) — a capacity
        headroom proxy, not a dynamic-stability model.
      not_covered: >
        Any dynamic phenomenon (RoCoF, frequency nadir, voltage control, fault
        ride-through), converter control modes, and costs of grid-forming
        capability retrofits. This is out of scope of a linearised LP.
      provenance: "scripts/solve_network.py:add_operational_reserve_margin"
    levers:
      - key: electricity.operational_reserve.activate
        effect: "Adds an operational reserve margin constraint (share of load + share of VRES feed-in + fixed contingency) — the closest existing proxy for 'keep flexible headroom online'."
        default: "false"
        provenance: "scripts/solve_network.py:add_operational_reserve_margin_constraint"
      - key: electricity.extendable_carriers
        effect: "Controls which storage/generator carriers (e.g. battery Store) can be built — the assets that would physically host grid-forming converters."
        default: "Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT]; Store: [battery, H2]"
        provenance: "config.default.yaml:extendable_carriers"
    boundary:
      - variant: "Approximate 'keep reserves/headroom online' as renewables grow"
        rung: L0
        note: "electricity.operational_reserve.activate with epsilon_load/epsilon_vres/contingency — a static proxy only."
      - variant: "Cost premium for grid-forming-capable batteries/PV"
        rung: L3
        note: "Add/adjust a costs-file row (e.g. battery inverter) so the LP sees the retrofit cost; no behavioural difference results."
      - variant: "Minimum synchronous/grid-forming capacity share constraint (system-strength floor)"
        rung: L5
        note: "Custom constraint in solve_network's extra_functionality hook, e.g. requiring dispatched capacity of a labelled carrier set >= share of demand per snapshot; requires bespoke Python and a defensible parameterisation."
      - variant: "Actual inverter dynamics / EMT or RMS stability studies"
        rung: L5
        note: "Out of scope of the model family — the LP has no time constants below the snapshot resolution; requires an external stability tool fed by the LP dispatch."
    where:
      - change: "Any custom stability-proxy constraint"
        anchor: "scripts/solve_network.py:extra_functionality (hook collecting custom constraints before n.optimize)"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "Reserve-margin proxy"
        anchor: "scripts/solve_network.py:add_operational_reserve_margin + config electricity.operational_reserve"
        provenance: "scripts/solve_network.py:add_operational_reserve_margin"
      - change: "Inverter-related costs"
        anchor: "costs file (battery inverter row) via rule retrieve_cost_data; costs.marginal_cost['battery inverter'] in config"
        provenance: "config.default.yaml:battery inverter"
    data_dependencies:
      - input: "costs file rows for inverter/retrofit technologies"
        required_for: "cost premium variant"
        availability: "exists by default for 'battery inverter'; grid-forming-specific rows absent — must be added"
      - input: "system-strength requirement parameters (e.g. minimum share per region)"
        required_for: "custom L5 constraint"
        availability: "absent — user-provided assumption"
