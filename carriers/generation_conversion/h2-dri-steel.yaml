id: h2-dri-steel
title: Hydrogen direct reduced iron (H2-DRI) steel
summary: >
  Primary steelmaking via hydrogen direct reduction of iron ore followed by an
  electric arc furnace (DRI+EAF) — replacing the coke-based blast furnace route
  with hydrogen and electricity.
when_to_use:
  - "hydrogen steel / green steel"
  - "H2-DRI"
  - "direct reduced iron"
  - "DRI + EAF route"
  - "decarbonise primary steel"
  - "steel hydrogen demand"
  - "replace blast furnaces with DRI"
  - "DRI_fraction / H2_DRI parameters"
  - "pypsa-eur sector name: DRI + Electric arc"
  - "hydrogen steel"
  - "direct reduced iron with hydrogen"
  - "green steel"
  - "steel from hydrogen"
  - "hydrogen demand from industry"
  - "decarbonise steel with H2"
  - "sponge iron"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Covered as an exogenously phased-in demand route. In
        build_industry_sector_ratios::iron_and_steel the "DRI + Electric arc"
        sector copies the "Electric arc" intensity and adds industry.H2_DRI
        (default 1.7 MWh H2 per tonne steel) as hydrogen demand plus
        industry.elec_DRI (0.322 MWh/t) as extra electricity for the DRI shaft.
        build_industrial_production_per_country_tomorrow moves
        industry.DRI_fraction of the persistent primary steel (itself set by
        industry.St_primary_fraction) from "Integrated steelworks" into
        "DRI + Electric arc" — the default ramp is 0 today, 0.05 in 2030, 1.0
        in 2050, i.e. all remaining primary steel is H2-DRI by mid-century.
        The hydrogen lands in prepare_sector_network::add_industry as an
        "H2 for industry" Load directly on the nodal H2 buses, so HOW that
        hydrogen is made (electrolysis, SMR, SMR CC, imports) and moved
        (H2 pipelines) IS endogenous — the model co-optimises the upstream
        supply of DRI hydrogen even though the steel route itself is fixed.
        Spatially, DRI+EAF production is distributed by the GEM Global Steel
        Plant Tracker: build_nodal_distribution_key uses nominal BOF/OHF steel
        and iron capacities (today's primary sites as proxy for conversion)
        including "announced" plants starting by 2030, retirement filter after
        2030.
      mechanism: >
        rule build_industry_sector_ratios -> rule
        build_industrial_production_per_country_tomorrow (dri =
        dri_fraction * fraction_persistent_primary * Integrated steelworks) ->
        rule build_industrial_distribution_key ("DRI + EAF" branch of the
        steel_processes loop) -> rule build_industrial_energy_demand_per_node
        -> add_industry attaches "H2 for industry" (H2 bus), "industry
        electricity" (AC bus), "gas for industry" and "low-temperature heat for
        industry" loads. Even with sector.industry_t.endogen the route keeps
        its exogenous ratios: "DRI + Electric arc" is listed in
        sectors_copied_from_exogenous in build_industrial_energy_demand_per_node.
      not_covered: >
        No DRI plant exists in the network — no capacity, capital cost, or
        dispatch; the route is a fixed flat energy demand. No natural-gas DRI
        variant (DRI is hydrogen-only; there is no NG-DRI intensity column).
        No endogenous route choice: the model cannot decide between blast
        furnace, NG-DRI and H2-DRI on cost — the DRI share is a config ramp.
        No hot briquetted iron trade or iron-ore/steel material flows. The DRI
        hydrogen demand is spread flat over all snapshots (annual/8760) with no
        flexibility, although upstream H2 storage effectively buffers it. No
        CCS option on the remaining integrated route's coal/coke ("coal for
        industry" vents its CO2 to the atmosphere with no CC variant).
      provenance: "scripts/build_industry_sector_ratios.py:H2_DRI; scripts/build_industrial_production_per_country_tomorrow.py:dri_fraction; scripts/prepare_sector_network.py:H2 for industry; scripts/build_industrial_energy_demand_per_node.py:sectors_copied_from_exogenous; scripts/build_industrial_distribution_key.py:steel_processes"
    levers:
      - key: industry.DRI_fraction
        effect: "Per-horizon fraction of persistent primary steel produced via H2-DRI+EAF; the rest stays as integrated steelworks."
        default: "{2020: 0, 2025: 0, 2030: 0.05, 2035: 0.2, 2040: 0.4, 2045: 0.7, 2050: 1}"
        provenance: "config/config.default.yaml:DRI_fraction; scripts/build_industrial_production_per_country_tomorrow.py:dri_fraction"
      - key: industry.H2_DRI
        effect: "Hydrogen intensity of the DRI shaft in MWh H2 per tonne steel."
        default: "1.7"
        provenance: "config/config.default.yaml:H2_DRI; scripts/build_industry_sector_ratios.py:H2_DRI"
      - key: industry.elec_DRI
        effect: "Additional electricity of the DRI shaft in MWh per tonne steel, added on top of the EAF electricity."
        default: "0.322"
        provenance: "config/config.default.yaml:elec_DRI; scripts/build_industry_sector_ratios.py:elec_DRI"
      - key: industry.St_primary_fraction
        effect: "Sets how much primary steel persists at all — the pool the DRI_fraction acts on; the remainder becomes scrap-EAF."
        default: "{2020: 0.6, ..., 2050: 0.3}"
        provenance: "config/config.default.yaml:St_primary_fraction; scripts/build_industrial_production_per_country_tomorrow.py:St_primary_fraction"
      - key: industry.sector_ratios_fraction_future
        effect: "Blend between today's and future best-in-class intensities for the non-DRI part of the route's energy demand."
        default: "{2020: 0.0, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
    boundary:
      - variant: "faster/slower H2-DRI rollout"
        rung: L1
        note: "reshape the industry.DRI_fraction ramp (with St_primary_fraction controlling how much primary steel survives)"
      - variant: "different DRI hydrogen or electricity intensity"
        rung: L1
        note: "industry.H2_DRI / industry.elec_DRI"
      - variant: "green-only DRI hydrogen (exclude SMR)"
        rung: L1
        note: "acts on the H2 supply side, not on steel: sector.SMR / sector.SMR_cc false removes fossil hydrogen options network-wide"
      - variant: "natural-gas DRI as bridge technology"
        rung: L2
        note: "no NG-DRI column exists; add a sector in iron_and_steel (methane intensity instead of H2_DRI) plus a production split in build_industrial_production_per_country_tomorrow"
      - variant: "country-specific DRI shares"
        rung: L2
        note: "DRI_fraction is one EU-wide scalar per horizon, applied via EU-total scaling in build_industrial_production_per_country_tomorrow"
      - variant: "site DRI at green-field hydrogen hubs instead of legacy steel sites"
        rung: L2
        note: "edit the 'DRI + EAF' branch of build_nodal_distribution_key (currently keys on GEM BOF/OHF/iron capacities incl. announced plants), or supply an edited GEM xlsx (L3)"
      - variant: "endogenous blast-furnace vs H2-DRI choice"
        rung: L5
        note: "needs steel as a material bus with competing route Links and plant capacities — no such structure exists"
      - variant: "DRI plant with H2 storage flexibility on-site"
        rung: L5
        note: "demand is a flat Load; nodal H2 stores already buffer supply, but explicit DRI flexibility needs a bespoke Link+Store demand model"
    where:
      - change: "DRI+EAF intensity definition (H2_DRI, elec_DRI on top of EAF)"
        anchor: "scripts/build_industry_sector_ratios.py::iron_and_steel (sector 'DRI + Electric arc')"
        provenance: "scripts/build_industry_sector_ratios.py:iron_and_steel"
      - change: "DRI production phase-in"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py (dri = dri_fraction * fraction_persistent_primary * ...)"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:fraction_persistent_primary"
      - change: "DRI siting from GEM tracker"
        anchor: "scripts/build_industrial_distribution_key.py::build_nodal_distribution_key ('DRI + EAF' branch)"
        provenance: "scripts/build_industrial_distribution_key.py:build_nodal_distribution_key"
      - change: "hydrogen demand attachment to H2 buses"
        anchor: "scripts/prepare_sector_network.py::add_industry ('H2 for industry' Load)"
        provenance: "scripts/prepare_sector_network.py:H2 for industry"
    data_dependencies:
      - input: "GEM Global Steel Plant Tracker xlsx (BOF/OHF/iron capacities, announced plants, start/retired dates)"
        required_for: "nodal placement of DRI+EAF production"
        availability: "retrieved by the workflow (rule retrieve_gem_steel_plant_tracker)"
      - input: "JRC-IDEES Iron and steel data"
        required_for: "the EAF base intensity the DRI adders sit on"
        availability: "retrieved by the workflow (rule retrieve_jrc_idees)"
      - input: "nodal H2 buses with supply chain (electrolysis, SMR, H2 network, stores)"
        required_for: "serving the 'H2 for industry' load"
        availability: "exists by default in sector runs (add_h2 infrastructure chain)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Hydrogen IS a first-class industry demand carrier: add_industry creates
        per-node "H2 for industry" loads on the H2 buses from the "hydrogen"
        column of the industrial demand file, and the supply side (electrolysis,
        SMR, SMR CC per sector.hydrogen.production_technologies, H2 network,
        storage) is fully endogenous. However, the UNSD-derived industry totals
        contain no hydrogen commodity — the carrier mapping in aggregate_fuels
        covers gas/oil/biomass/heat/coal/electricity only — so build_industry_demand
        fills the "hydrogen" row with 0 (all_carriers fill). Default industrial
        H2 demand is therefore zero. "DRI + Electric arc" exists only as a GEM
        plant-technology label used to locate "iron and steel" demand.
      mechanism: >
        build_base_industry_totals (UNSD -> country x carrier x industry) ->
        build_industry_demand (growth, process emissions, zero-filled hydrogen
        row, nodal distribution) -> prepare_sector_network.add_industry
        (Load "H2 for industry" with p_set = industrial_demand["hydrogen"]/8760,
        suppressed only under policy_config.hydrogen is_reference+remove_h2_load).
      not_covered: >
        No DRI process component, no endogenous switch of steel from coal/gas to
        hydrogen, no iron-ore/scrap layer, no H2-DRI cost row in use. Moving
        steel onto hydrogen is an exogenous edit of the demand data; once made,
        H2 supply is optimised endogenously.
      provenance: "scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: custom_data.industry_demand
        effect: >
          Supported route to impose H2-DRI: provide
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with the
          "iron and steel" energy moved into the hydrogen (and electricity) rows;
          build_industry_demand uses it verbatim.
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: sector.hydrogen.production_technologies
        effect: "Which H2 supply technologies compete to serve the imposed 'H2 for industry' load."
        default: '["H2 Electrolysis", "SMR", "SMR CC"]'
        provenance: "config.default.yaml:production_technologies"
      - key: sector.hydrogen.network
        effect: "Enables H2 pipeline network linking H2 buses that carry the industrial H2 loads."
        default: "true"
        provenance: "config.default.yaml:hydrogen"
      - key: sector.industry_util_factor
        effect: "Scales steel process emissions derived from plant capacities (reduce/zero for a DRI fleet)."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor"
      - key: sector.enable.industry
        effect: "Gates all industry loads including H2 for industry."
        default: "true"
        provenance: "config.default.yaml:industry"

    boundary:
      - variant: "serve an existing industrial H2 demand with green H2"
        rung: L0
        note: "endogenous already — electrolysis vs SMR competition via sector.hydrogen.production_technologies."
      - variant: "impose H2-DRI steel (shift steel coal/gas demand into the hydrogen carrier)"
        rung: L3
        note: >
          The per-industry carrier split lives in the industry totals table
          (country x carrier index, 'iron and steel' column). Either supply
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with
          custom_data.industry_demand: true, or edit industry_base_totals in
          build_industry_demand (move coal/gas MWh to the 'hydrogen' row, add
          EAF electricity). Also cut the steel process-emission factor (L2,
          emission_factors dict) since H2-DRI removes most process CO2.
      - variant: "scenario-dependent DRI share (e.g. 30% by 2030, 100% by 2050)"
        rung: L3
        note: "one custom industry_demand csv per {demand}_{planning_horizons} combination — the filename template carries both wildcards."
      - variant: "endogenous H2-DRI investment decision (model chooses BF-BOF vs H2-DRI)"
        rung: L5
        note: "requires a steel-output bus, DRI/EAF links with costs, and re-expressing steel demand in tonnes — bespoke Python in prepare_sector_network."

    where:
      - change: "per-industry carrier assignment (where 'hydrogen' becomes a steel input)"
        anchor: "rule build_industry_demand — all_carriers fill + industry_base_totals; custom path data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:all_carriers"
      - change: "UNSD carrier mapping (why hydrogen defaults to zero)"
        anchor: "aggregate_fuels('industry') in _helpers — no hydrogen fuel category"
        provenance: "scripts/_helpers.py:aggregate_fuels"
      - change: "H2 for industry load creation"
        anchor: "add_industry in prepare_sector_network (Load suffix ' H2 for industry' on nodes + ' H2')"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "steel process-emission factor"
        anchor: "emission_factors dict ('iron and steel': 0.025) in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:emission_factors"
      - change: "DRI plant locations used for spatial placement"
        anchor: "create_steel_db in build_industrial_database (labels 'integrated (DRI)'/'ironmaking (DRI)' -> 'DRI + Electric arc')"
        provenance: "scripts/build_industrial_database.py:create_steel_db"

    data_dependencies:
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "imposing the H2/electricity steel carrier mix"
        availability: "absent — user-supplied"
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "default steel baseline being re-shuffled"
        availability: "must be built (downloaded when demand_data.update_data: true)"
      - input: "GEM Global Steel Plant Tracker xlsx (create_steel_db download)"
        required_for: "placing steel/DRI demand at plant nodes"
        availability: "must be built; region-dependent plant coverage"
      - input: "technology-data costs csv (resources/costs_{planning_horizons}_sec.csv)"
        required_for: "H2 supply chain costs (electrolysis, SMR) serving the load"
        availability: "must be built (enable.retrieve_cost_data, costs.technology_data_version)"
