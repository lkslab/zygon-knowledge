id: hv-transmission-lines
title: High-voltage transmission lines
summary: The HV AC transmission grid — existing lines, their ratings and voltage classes, and capacity expansion of the grid.
when_to_use:
  - "add or reinforce transmission lines"
  - "grid expansion / transmission expansion planning"
  - "the grid data looks wrong / missing power lines"
  - "change line capacity or thermal rating"
  - "N-1 security margin on lines"
  - "model a specific voltage level (110/220/380/500/750 kV)"
  - "use a different grid dataset (OSM / TYNDP / GridKit)"
  - "how strong is the grid between region A and B"
  - "limit or forbid grid expansion"
  - "transmission losses on AC lines"
  - "pypsa-eur carrier names: AC, lines"
  - "model a specific voltage level (132/220/380/500/750 kV)"
  - "use my own grid dataset instead of OpenStreetMap"
  - "known in pypsa-eur as: lines, transmission lines, AC, AC-AC, AC line"
models:
  - model: pypsa-eur
    version_anchor: {ref: "29489d3b97bc7e5023aa02b96d3112e58258df7a", date: "2026-10-11"}
    out_of_box:
      covers: >
        Fully covered, with THREE selectable base topologies via
        electricity.base_network: "osm" (default — prebuilt OpenStreetMap grid
        data, retrieved as an archive or rebuilt from raw OSM via
        data.osm.source: archive|build), "tyndp" (the ENTSO-E TYNDP reference
        grid built by rule build_tyndp_network), and "entsoegridkit"
        (deprecated, warns via DeprecationWarning). rule base_network turns the
        chosen dataset into PyPSA Lines with carrier "AC": each line gets a
        standard line type from the lines.types voltage->type map (entries from
        63 kV to 750 kV ship in the default config) chosen by nearest nominal
        voltage (_get_linetype_by_voltage), from which s_nom is derived as
        sqrt(3)*i_nom*v_nom*num_parallel (_set_lines_s_nom_from_linetypes).
        Buses outside the [min, max] of electricity.voltages (default window
        220-750 kV) are dropped in _load_buses, so the sub-220 kV grid is
        excluded by default even though line types for 63-150 kV are shipped.
        Candidate transmission projects and dynamic line rating are overlaid on
        base.nc by rule add_transmission_projects_and_dlr (own carrier cards).
        simplify_network then maps ALL lines onto a single 380 kV layer
        preserving capacity (simplify_network_to_380: num_parallel rescaled,
        transformers removed), removes stubs, and cluster_network aggregates to
        clustering.cluster_network.n_clusters buses (line vintages kept apart via
        custom_line_groupers=["build_year"]). Expansion is a config key, not a
        wildcard: electricity.transmission_limit (default "vopt" = cost-optimal
        with a volume accounting basis) makes all lines extendable with
        s_nom_min = s_nom in set_transmission_limit; non-"opt" factors add a
        transmission_volume_expansion_limit / expansion_cost GlobalConstraint
        over carrier_attribute "AC, DC". Per-line growth is capped at
        lines.s_nom_max_extension (default 20000 MW, cap_transmission_capacity).
        Solving
        applies piecewise-linearised AC losses by default
        (solving.options.transmission_losses: 2 segments) and — when
        solving.options.skip_iterations is false — sequential impedance updates
        via n.optimize.optimize_transmission_expansion_iteratively, optionally
        followed by discretisation of expansion into
        solving.options.post_discretization units (line_unit_size 1700 MW).
      mechanism: >
        retrieve prebuilt OSM data (or rule build_tyndp_network / rules
        clean_osm_data+build_osm_network for source "build") -> rule
        base_network (networks/base.nc) -> rule add_transmission_projects_and_dlr
        (base_extended.nc) -> rule simplify_network (simplified.nc, 380 kV
        layer) -> rule cluster_network (clustered.nc) -> rule compose_network,
        which calls add_electricity.py (set_transmission_costs with
        lines.length_factor) and then prepare_network.py
        (set_transmission_limit, cap_transmission_capacity for s_max_pu and
        the extension caps, optional enforce_autarky) -> rule solve_network. Note set_transmission_limit calls
        set_transmission_costs(n, costs) again WITHOUT length factors, so the
        final line capital cost is HVAC-overhead-cost * length with factor 1.0
        — lines.length_factor only sticks for renewable connection costing.
      not_covered: >
        No sub-transmission below the electricity.voltages window (default
        220 kV floor; widening it requires the base dataset to actually contain
        those voltages). Expansion is continuous along existing corridors and
        configured projects only — there is NO greenfield candidate-corridor
        generator (no equivalent of pypsa-earth's augmented_line_connections
        rule), so a brand-new user-defined route must come in as a transmission
        project (L3, see transmission-expansion-projects carrier card). Discrete
        line investments only via the post-discretization heuristic in
        iterative mode, not in the default single-pass solve. N-1 is a static
        s_max_pu scalar, not contingency analysis. Ratings are static unless
        lines.dynamic_line_rating is activated (see dynamic-line-rating-facts
        carrier card).
      provenance: "scripts/base_network.py:_set_electrical_parameters_lines_raw; scripts/base_network.py:_set_lines_s_nom_from_linetypes; scripts/base_network.py:_load_buses; scripts/simplify_network.py:simplify_network_to_380; scripts/prepare_network.py:set_transmission_limit; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
    levers:
      - key: electricity.base_network
        effect: "Selects the base grid topology: 'osm' (default), 'tyndp' (TYNDP reference grid), or 'entsoegridkit' (deprecated); asserted in base_network."
        default: "osm"
        provenance: "config/config.default.yaml:base_network; scripts/base_network.py:base_network"
      - key: electricity.transmission_limit
        effect: "Expansion control: 'vopt'/'copt' cost-optimal, 'v1.25' caps volume growth at 25%, 'v1.0' freezes today's capacity, 'c...' caps expansion cost (a string like 'c1.25' or a [kind, factor] pair); config only, there is no wildcard."
        default: "vopt"
        provenance: "config/config.default.yaml:transmission_limit; scripts/prepare_network.py:set_transmission_limit"
      - key: lines.s_max_pu
        effect: "N-1 proxy: fraction of s_nom usable in the OPF, applied to all lines (cap_transmission_capacity line_max_pu, logged as the N-1 security margin); also multiplied into the DLR time series."
        default: "0.7"
        provenance: "config/config.default.yaml:s_max_pu; scripts/prepare_network.py:cap_transmission_capacity"
      - key: electricity.voltages
        effect: "Voltage window kept in the base network — buses with v_nom outside [min, max] are dropped (_load_buses); also selects which lines.types entries are used."
        default: "[220., 300., 330., 380., 400., 500., 750.]"
        provenance: "config/config.default.yaml:voltages; scripts/base_network.py:_load_buses"
      - key: lines.types
        effect: "Map nominal voltage -> pypsa standard line type (63-750 kV entries shipped); sets impedance and thermal rating per voltage class, and the 380 kV entry is the type every line is remapped to in simplify_network."
        default: "63..750 kV mapped to Al/St conductor types (380.0: 'Al/St 240/40 4-bundle 380.0', 750.0: 'Al/St 560/50 4-bundle 750.0')"
        provenance: "config/config.default.yaml:types; scripts/base_network.py:_get_linetype_by_voltage; scripts/simplify_network.py:simplify_network_to_380"
      - key: lines.s_nom_max_extension
        effect: "Per-line cap on capacity growth: s_nom_max = s_nom + s_nom_max_extension (cap_transmission_capacity in prepare_network, run inside compose_network for both workflows)."
        default: "20000 (MW)"
        provenance: "config/config.default.yaml:s_nom_max_extension; scripts/prepare_network.py:cap_transmission_capacity"
      - key: lines.s_nom_max
        effect: "Absolute upper clip on any line's s_nom_max, applied after the extension cap."
        default: ".inf"
        provenance: "config/config.default.yaml:s_nom_max; scripts/prepare_network.py:cap_transmission_capacity"
      - key: lines.under_construction
        effect: "Handling of lines flagged under construction in the base data: 'keep' (default — counted at full capacity), 'zero' (capacity 0), 'remove'."
        default: "keep"
        provenance: "config/config.default.yaml:under_construction; scripts/base_network.py:_adjust_capacities_of_under_construction_branches"
      - key: lines.reconnect_crimea
        effect: "entsoegridkit base network only: reattach Crimea to the Ukrainian grid when UA is modelled (_reconnect_crimea)."
        default: "true"
        provenance: "config/config.default.yaml:reconnect_crimea; scripts/base_network.py:_reconnect_crimea"
      - key: lines.length_factor
        effect: "Detour multiplier on line lengths for costing — but note the final transmission capital cost is overwritten in set_transmission_limit without it; it sticks for renewable-connection costing (attach_wind_and_solar) and the transmission-projects length fill."
        default: "1.25"
        provenance: "config/config.default.yaml:length_factor; scripts/add_electricity.py:set_transmission_costs"
      - key: electricity.autarky
        effect: "enable: true removes cross-border lines and DC links (by_country: true) or ALL lines and DC links (by_country: false) in enforce_autarky."
        default: "{enable: false, by_country: false}"
        provenance: "config/config.default.yaml:autarky; scripts/prepare_network.py:enforce_autarky"
      - key: solving.options.skip_iterations
        effect: "false enables iterative transmission expansion (impedances updated between LPs via optimize_transmission_expansion_iteratively, min/max_iterations); true (default) solves a single LP with fixed impedances. Auto-forced true if no line is extendable."
        default: "true"
        provenance: "config/config.default.yaml:skip_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: solving.options.transmission_losses
        effect: "Number of piecewise segments for linearised quadratic transmission losses on lines in the solve (0/false = lossless transport)."
        default: "2"
        provenance: "config/config.default.yaml:transmission_losses; scripts/solve_network.py:collect_kwargs"
      - key: solving.options.post_discretization
        effect: "In iterative mode only: rounds optimised line/link expansion to discrete unit sizes (line_unit_size 1700 MW, line_threshold 0.3)."
        default: "{enable: false, line_unit_size: 1700, line_threshold: 0.3, ...}"
        provenance: "config/config.default.yaml:post_discretization; scripts/solve_network.py:collect_kwargs"
    boundary:
      - variant: "cost-optimal grid expansion alongside generation"
        rung: L0
        note: "default — electricity.transmission_limit: vopt makes all lines extendable with s_nom_min = s_nom"
      - variant: "freeze the grid at today's capacity / allow limited growth"
        rung: L1
        note: "electricity.transmission_limit: v1.0 (freeze) or v1.25 / c1.25 (25% volume / cost headroom)"
      - variant: "tighten/relax the N-1 margin"
        rung: L0
        note: "lines.s_max_pu — one scalar network-wide"
      - variant: "switch to the TYNDP reference grid topology"
        rung: L0
        note: "electricity.base_network: tyndp (rule build_tyndp_network builds buses/lines/links from the retrieved TYNDP reference grid)"
      - variant: "include the 110-150 kV sub-transmission level"
        rung: L1
        note: "extend electricity.voltages downwards (types for 63-150 kV already ship in lines.types); only works where the chosen base dataset carries those voltages — everything is still collapsed to the 380 kV layer in simplify_network"
      - variant: "line losses in dispatch"
        rung: L0
        note: "already on: solving.options.transmission_losses: 2 (set 0 for lossless transport)"
      - variant: "iterative impedance-consistent expansion with discrete line units"
        rung: L1
        note: "solving.options.skip_iterations: false plus post_discretization.enable: true"
      - variant: "country self-sufficiency / no cross-border exchange"
        rung: L0
        note: "electricity.autarky.enable: true (+ by_country: true to keep the domestic grid)"
      - variant: "add a missing/planned line on a user-chosen route"
        rung: L3
        note: "author a row in data/transmission_projects/manual (template in data/transmission_projects/template/new_lines.csv: endpoint coordinates, v_nom, num_parallel, build_year, project_status) — see transmission-expansion-projects carrier card; there is no augmented/greenfield candidate rule"
      - variant: "fix wrong grid data at source"
        rung: L3
        note: "data.osm.source: 'build' rebuilds the grid from raw OSM (rules clean_osm_data / build_osm_network) so upstream OSM edits flow in; for entsoegridkit, data/parameter_corrections.yaml patches attributes (_apply_parameter_corrections)"
      - variant: "per-line (not global) expansion caps or costs"
        rung: L2
        note: "lines.s_nom_max_extension / s_nom_max are uniform; individual values need a localised edit after cap_transmission_capacity in prepare_network.py, or an adjust_lines transmission-project CSV"
      - variant: "true N-1 security-constrained OPF"
        rung: L5
        note: "no contingency machinery; bespoke constraints via solving.options.custom_extra_functionality or extra_functionality in solve_network.py"
    where:
      - change: "base topology import, line typing, s_nom derivation, voltage window"
        anchor: "scripts/base_network.py::base_network / _set_electrical_parameters_lines_raw / _set_lines_s_nom_from_linetypes / _load_buses (rule base_network)"
        provenance: "scripts/base_network.py:base_network; rules/build_electricity.smk:input_base_network"
      - change: "380 kV collapse and stub removal"
        anchor: "scripts/simplify_network.py::simplify_network_to_380 / remove_stubs (rule simplify_network, input base_extended.nc)"
        provenance: "scripts/simplify_network.py:simplify_network_to_380; scripts/simplify_network.py:remove_stubs"
      - change: "extendability + expansion limit constraint"
        anchor: "scripts/prepare_network.py::set_transmission_limit (consumes electricity.transmission_limit)"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - change: "line capital costs (HVAC overhead row)"
        anchor: "scripts/add_electricity.py::set_transmission_costs (called from add_electricity inside compose_network AND re-called factor-less inside set_transmission_limit)"
        provenance: "scripts/add_electricity.py:set_transmission_costs; scripts/prepare_network.py:set_transmission_costs"
      - change: "iterative expansion / losses / discretisation in the solve"
        anchor: "scripts/solve_network.py::collect_kwargs + n.optimize.optimize_transmission_expansion_iteratively (solving.options)"
        provenance: "scripts/solve_network.py:collect_kwargs; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - change: "clustered line aggregation keeping build_year vintages apart"
        anchor: "scripts/cluster_network.py::clustering_for_n_clusters (custom_line_groupers)"
        provenance: "scripts/cluster_network.py:custom_line_groupers"
    data_dependencies:
      - input: "prebuilt OSM grid CSVs (buses/lines/links/converters/transformers) per data.osm.version"
        required_for: "default 'osm' base network"
        availability: "retrieved by the workflow (data.osm.source: archive)"
      - input: "TYNDP reference grid + nodes (rule retrieve_tyndp -> rule build_tyndp_network)"
        required_for: "electricity.base_network: tyndp"
        availability: "retrieved/built by the workflow"
      - input: "data/entsoegridkit/*.csv + data/parameter_corrections.yaml + data/links_p_nom.csv"
        required_for: "deprecated entsoegridkit base network"
        availability: "exists by default in the repo"
      - input: "cost row 'HVAC overhead' in the processed technology-data costs file"
        required_for: "expansion costing"
        availability: "exists by default (rule process_cost_data)"
      - input: "europe_shape / country_shapes / offshore_shapes geojsons (rule build_shapes)"
        required_for: "bus filtering and country assignment in base_network"
        availability: "must be built (standard workflow)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        The existing HV grid is extracted from OpenStreetMap per country (rule
        download_osm_data via the earth_osm package), filtered and cleaned (rule
        clean_osm_data, minimum voltage clean_osm_data_options.threshold_voltage,
        default 51 kV), topologically fixed (rule build_osm_network: bus merging,
        splitting of overpassing lines), and turned into PyPSA Line components with
        carrier "AC" in rule base_network. Each line gets a standard line type from
        lines.ac_types chosen by nearest nominal voltage (_get_linetype_by_voltage),
        from which s_nom is derived (_set_lines_s_nom_from_linetypes). Expansion is
        optimised in the LP: the {ll} wildcard (e.g. "copt", "v1.25", "l1.5") makes
        lines extendable and bounds total expansion by cost or volume
        (set_transmission_limit in scripts/prepare_network.py).
      mechanism: >
        download_osm_data -> clean_osm_data -> build_osm_network -> base_network
        (networks/base.nc) -> simplify_network/cluster_network -> add_electricity ->
        prepare_network (s_max_pu, transmission limit) -> solve_network (linear
        optimal power flow, sequential impedance updates via
        optimize_transmission_expansion_iteratively for "opt" limits).
      not_covered: >
        No sub-transmission/distribution lines (below threshold_voltage); no discrete
        line investments (expansion is continuous); no per-line candidate catalogue
        beyond existing corridors (except the optional augmented_line_connections
        rule); no AC power-flow effects beyond the linearised approximation; line
        ratings are static (see dynamic-line-rating-facts carrier card).
      provenance: "scripts/base_network.py:_set_electrical_parameters_lines"
    levers:
      - key: lines.s_max_pu
        effect: "N-1 proxy: fraction of s_nom usable in the OPF, applied to all lines in prepare_network (set_line_s_max_pu)."
        default: "0.7"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - key: scenario.ll
        effect: "Transmission expansion limit wildcard: 'v'olume/'c'ost/'l'ine multiple + factor or 'opt' (e.g. copt, v1.25, l1.0 freezes today's capacity)."
        default: "[\"copt\"]"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - key: electricity.voltages
        effect: "Voltage classes kept in the base network; selects which lines.ac_types entries are used."
        default: "[132., 220., 300., 380., 500., 750.]"
        provenance: "scripts/base_network.py:_get_linetypes_config"
      - key: lines.ac_types
        effect: "Map nominal voltage -> pypsa standard line type; sets impedance and thermal rating (s_nom) per voltage class."
        default: "132..750 kV mapped to Al/St conductor types (e.g. 380.: 'Al/St 240/40 4-bundle 380.0')"
        provenance: "scripts/base_network.py:_get_linetype_by_voltage"
      - key: lines.s_nom_max
        effect: "Global cap on any single line's extendable capacity (set_line_nom_max called from set_transmission_limit)."
        default: ".inf"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - key: lines.length_factor
        effect: "Multiplier on geodesic line length used when costing transmission expansion (update_transmission_costs)."
        default: "1.25"
        provenance: "scripts/add_electricity.py:update_transmission_costs"
      - key: lines.under_construction
        effect: "Handling of OSM lines tagged under construction: 'zero' (capacity 0, expandable), 'remove', or 'keep'."
        default: "zero"
        provenance: "config.default.yaml:under_construction"
      - key: clean_osm_data_options.threshold_voltage
        effect: "Minimum voltage [V] for OSM assets to enter the model (filter_voltage in clean_osm_data)."
        default: "51000"
        provenance: "scripts/clean_osm_data.py:filter_voltage"
      - key: clean_osm_data_options.use_custom_lines
        effect: "Replace or merge OSM lines with a user geojson: 'OSM_only', 'custom_only', 'add_custom', 'none' (with clean_osm_data_options.path_custom_lines)."
        default: "OSM_only"
        provenance: "scripts/clean_osm_data.py:load_network_data"
      - key: build_osm_network.force_ac
        effect: "Force all extracted lines/substations to AC (drops DC handling) during network building."
        default: "false"
        provenance: "config.default.yaml:force_ac"
      - key: augmented_line_connection.add_to_snakefile
        effect: "Enable the optional augmented_line_connections rule, which adds extendable greenfield HVAC (and/or HVDC) candidate lines to raise nodal connectivity to connectivity_upgrade."
        default: "false"
        provenance: "scripts/augmented_line_connections.py:k_edge_augmentation"
    boundary:
      - variant: "Tighten/relax the N-1 margin on all lines"
        rung: L0
        note: "lines.s_max_pu — single scalar applied network-wide."
      - variant: "Freeze the grid at today's capacity / allow limited expansion"
        rung: L1
        note: "scenario.ll value: l1.0 freezes, v1.25 allows 25% volume growth, copt unconstrained cost-optimal."
      - variant: "Restrict the model to certain voltage classes"
        rung: L1
        note: "Edit electricity.voltages (and matching lines.ac_types keys); clean_osm_data_options.threshold_voltage sets the floor."
      - variant: "Add missing lines / fix wrong OSM grid data"
        rung: L3
        note: "Provide a custom lines geojson and set clean_osm_data_options.use_custom_lines to 'add_custom' or 'custom_only' with path_custom_lines (same pattern for substations and cables)."
      - variant: "Add greenfield candidate corridors beyond existing routes"
        rung: L1
        note: "augmented_line_connection.add_to_snakefile: true with new_line_type ['HVAC']; candidates are auto-generated by k-edge augmentation, not user-specified routes."
      - variant: "User-specified candidate line between two chosen buses"
        rung: L5
        note: "No config/data path; add an extendable Line row programmatically (pattern to copy: n.madd('Line', ...) in scripts/augmented_line_connections.py)."
      - variant: "Per-line expansion caps or costs"
        rung: L2
        note: "Only global caps exist (lines.s_nom_max); per-line values need a localised edit after set_transmission_limit in prepare_network."
      - variant: "New conductor/line type not in pypsa standard types"
        rung: L2
        note: "lines.ac_types entries must name a pypsa standard line type; a custom type must be registered on the network in base_network before _set_lines_s_nom_from_linetypes."
    where:
      - change: "Custom grid data injection (lines/cables/substations)"
        anchor: "scripts/clean_osm_data.py:load_network_data + config clean_osm_data_options.path_custom_lines"
        provenance: "scripts/clean_osm_data.py:load_network_data"
      - change: "Expansion limit / extendability of lines"
        anchor: "scripts/prepare_network.py:set_transmission_limit (consumes the {ll} wildcard)"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - change: "Line type / rating assignment per voltage"
        anchor: "scripts/base_network.py:_get_linetype_by_voltage + config lines.ac_types"
        provenance: "scripts/base_network.py:_get_linetype_by_voltage"
      - change: "Greenfield candidate line generation"
        anchor: "rule augmented_line_connections -> scripts/augmented_line_connections.py"
        provenance: "Snakefile:augmented_line_connections"
      - change: "Transmission capital costs"
        anchor: "scripts/add_electricity.py:update_transmission_costs (HVAC overhead cost row) and lines.length_factor"
        provenance: "scripts/add_electricity.py:update_transmission_costs"
    data_dependencies:
      - input: "OSM power extracts per country (earth_osm save_osm_data: substation/line/cable/generator into resources/osm/raw)"
        required_for: "any grid representation"
        availability: "must be built (rule download_osm_data, enable.download_osm_data: true); quality is region-dependent"
      - input: "custom lines/substations/cables geojson"
        required_for: "manual grid corrections (use_custom_lines)"
        availability: "absent — user-provided"
      - input: "technology cost file (resources/costs.csv from rule retrieve_cost_data, or data/costs.csv; rows HVAC overhead etc.)"
        required_for: "expansion costing"
        availability: "exists by default (enable.retrieve_cost_data: true)"
      - input: "offshore_shapes.geojson (rule build_shapes)"
        required_for: "underwater fraction of DC assets in base_network"
        availability: "must be built (standard workflow)"
