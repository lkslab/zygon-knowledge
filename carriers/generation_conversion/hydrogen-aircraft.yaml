id: hydrogen-aircraft
title: Hydrogen aircraft
summary: >
  Hydrogen-powered aviation — H2 combustion or fuel-cell aircraft, liquid
  hydrogen at airports, and hydrogen's share of aviation energy demand.
when_to_use:
  - "hydrogen planes / H2 aircraft"
  - "hydrogen aviation share"
  - "liquid hydrogen at airports"
  - "aviation decarbonisation beyond SAF"
  - "zero-emission flight"
  - "pypsa-eur carrier names: kerosene for aviation, methanol-to-kerosene, H2 liquefaction (no hydrogen aviation carrier exists)"
  - "hydrogen aviation"
  - "decarbonise air travel with hydrogen"
  - "zero-emission aircraft"
models:
  - model: pypsa-eur
    version_anchor: {ref: "d2e0d48666f09a580c744846cef37e5059761d7a", date: "2026-10-09"}
    out_of_box:
      covers: >
        Not covered — aviation is 100% kerosene by construction. add_aviation
        turns total domestic + international aviation energy (population-
        weighted per node, scaled by aviation_demand_factor) into a "kerosene
        for aviation" Load fed by a free Link from the EU oil bus that emits
        fossil-kerosene CO2 to the atmosphere. There is no hydrogen (or
        electric) aviation share key anywhere in the config. Decarbonisation
        happens only via drop-in fuels upstream on the SAME oil bus:
        Fischer-Tropsch e-kerosene (add_industry, always available) blends in
        indistinguishably, and sector.methanol.methanol_to_kerosene (default
        false) adds an explicit methanol+H2-to-kerosene route feeding the
        kerosene buses. The building blocks for an H2-aviation edit do exist
        elsewhere: nodal H2 buses, and the "H2 liquid"/"H2 liquefaction"
        bus/Link pattern in add_shipping (sector.shipping_hydrogen_liquefaction)
        that an airport LH2 chain can copy. A notable accounting quirk: the
        historical aviation emissions entering the CO2 budget baseline
        ("domestic aviation", "international aviation" in
        determine_emission_sectors) are gated by sector.industry, not
        sector.aviation.
      mechanism: >
        rule compose_network -> add_aviation (gated by
        sector.aviation): kerosene bus/Load/Link per spatial.oil.kerosene
        (nodal with regional_oil_demand true, default; else one EU bus);
        optional methanol-to-kerosene Link. E-kerosene supply-side: the
        Fischer-Tropsch Link in add_industry outputs onto spatial.oil.nodes,
        from which the kerosene Link draws.
      not_covered: >
        Any hydrogen aircraft: no share key, no LH2-at-airport
        infrastructure, no H2-aircraft efficiency or cost data, no airport
        spatial layer (aviation demand is spread by population — there is no
        airports dataset in the workflow, unlike ports for shipping). No
        aircraft fleet or non-CO2 climate effects either. Aviation demand is
        price-inelastic and flat (annual average p_set).
      provenance: "scripts/prepare_sector_network.py:add_aviation; scripts/prepare_sector_network.py:kerosene for aviation; scripts/prepare_sector_network.py:methanol-to-kerosene; scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:determine_emission_sectors; config/config.default.yaml:aviation_demand_factor"
    levers:
      - key: sector.aviation
        effect: "Gate for aviation demand — false removes the kerosene load entirely (a crude 'aviation solved elsewhere' switch)."
        default: "true"
        provenance: "config/config.default.yaml:aviation; scripts/prepare_sector_network.py:add_aviation"
      - key: sector.aviation_demand_factor
        effect: "Scales total aviation energy — the hook for demand-reduction or growth scenarios (and a crude proxy for efficiency gains of new aircraft)."
        default: "1.0"
        provenance: "config/config.default.yaml:aviation_demand_factor; scripts/prepare_sector_network.py:add_aviation"
      - key: sector.methanol.methanol_to_kerosene
        effect: "true adds the methanol+H2 -> kerosene conversion Link — an indirect hydrogen-to-aviation pathway (via e-methanol), the closest existing thing to H2 flight."
        default: "false"
        provenance: "config/config.default.yaml:methanol_to_kerosene; scripts/prepare_sector_network.py:add_aviation"
      - key: sector.regional_oil_demand
        effect: "true (default) resolves 'kerosene for aviation' demand buses per node; false pools them at one EU bus."
        default: "true"
        provenance: "config/config.default.yaml:regional_oil_demand; scripts/prepare_sector_network.py:define_spatial"
    boundary:
      - variant: "decarbonise aviation with drop-in e-kerosene (no aircraft change)"
        rung: L0
        note: "automatic under a tight CO2 budget — Fischer-Tropsch fuel enters the same oil bus the kerosene Link draws from; see the e-kerosene-saf carrier card"
      - variant: "reduced/grown aviation demand"
        rung: L1
        note: "sector.aviation_demand_factor"
      - variant: "hydrogen share of aviation demand"
        rung: L2
        note: "no key exists; localised edit in add_aviation mirroring add_shipping's H2 block: an aviation_hydrogen_share read via get(), an H2 Load on spatial.h2.nodes (or an LH2 bus) with an H2-aircraft efficiency assumption, and the kerosene p_set scaled to the remainder; new config key threaded through options"
      - variant: "liquid hydrogen supply at airports"
        rung: L2
        note: "pattern-copy the shipping_hydrogen_liquefaction block from add_shipping ('H2 liquid' buses + 'H2 liquefaction' Links, cost row exists) into the aviation load's bus choice"
      - variant: "grounded H2-aircraft efficiency/cost and airport-resolved demand"
        rung: L3
        note: "needs an H2-aircraft assumption row (nothing in the referenced cost data) and an airports dataset for spatial placement (none in the repo — aviation is population-weighted)"
      - variant: "endogenous kerosene-vs-H2 aircraft competition, fleet turnover"
        rung: L5
        note: "demand shares would be exogenous even after the L2 edit; real competition needs new decision variables/constraints and fleet dynamics"
    where:
      - change: "aviation demand construction and where an H2 share would be carved out"
        anchor: "scripts/prepare_sector_network.py::add_aviation (rule compose_network)"
        provenance: "scripts/prepare_sector_network.py:add_aviation"
      - change: "the liquefaction pattern to copy for airport LH2"
        anchor: "scripts/prepare_sector_network.py::add_shipping (shipping_hydrogen_liquefaction block, 'H2 liquefaction' cost row)"
        provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:H2 liquefaction"
      - change: "methanol-to-kerosene route"
        anchor: "scripts/prepare_sector_network.py::add_aviation (methanol_to_kerosene branch)"
        provenance: "scripts/prepare_sector_network.py:methanol-to-kerosene"
      - change: "aviation emissions in the CO2 baseline (gated by sector.industry)"
        anchor: "scripts/prepare_sector_network.py::determine_emission_sectors"
        provenance: "scripts/prepare_sector_network.py:determine_emission_sectors"
    data_dependencies:
      - input: "energy_totals columns 'total domestic aviation' / 'total international aviation'"
        required_for: "aviation demand magnitude"
        availability: "exists by default (rule build_energy_totals)"
      - input: "nodal H2 buses + 'H2 liquefaction' cost row"
        required_for: "any H2-aviation edit"
        availability: "exists by default in sector runs"
      - input: "H2-aircraft efficiency/cost assumptions"
        required_for: "grounded conversion of aviation energy to H2 demand"
        availability: "absent — assumption or new costs row needed"
      - input: "airport locations/traffic dataset"
        required_for: "airport-resolved demand placement"
        availability: "absent (aviation is population-weighted; only ports exist for shipping)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered. Aviation (add_aviation) is kerosene-on-the-oil-bus only: UNSD
        'total international aviation' + 'total domestic aviation' per country is
        distributed to nodes by airport size (rule prepare_airports, ourairports
        dataset, weighting large airports by sector.airport_sizing_factor) and added
        as a flat "kerosene for aviation" Load on the oil buses, plus a CO2
        atmosphere emissions load (international portion excluded unless
        sector.international_bunkers). There is no aviation fuel-share key of any
        kind — unlike shipping, aviation has NO analogue of shipping_hydrogen_share.
      mechanism: >
        add_aviation in rule prepare_sector_network, guarded by
        sector.enable.aviation. Note the model DOES ship the building blocks a
        hydrogen-aviation variant would reuse: nodal H2 buses (add_hydrogen), an H2
        liquefaction Link pattern (the shipping_hydrogen_liquefaction block in
        add_shipping creates "H2 liquid" buses + liquefaction Links), and the
        {demand}_{planning_horizon}-keyed share pattern (get() on
        shipping_hydrogen_share).
      not_covered: >
        Any hydrogen (or electric) aviation share, airport H2/liquefaction demand,
        aircraft efficiency assumptions, fleet turnover. E-fuels for aviation are a
        SIBLING carrier card: with sector.fischer_tropsch (default true) synthetic kerosene
        can already supply the existing oil-bus load — that belongs to an e-kerosene
        carrier card, not this one.
      provenance: "scripts/prepare_sector_network.py:add_aviation"

    levers:
      - key: sector.enable.aviation
        effect: "Master switch for the kerosene aviation load."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"
      - key: sector.airport_sizing_factor
        effect: "Weight of large vs medium airports when distributing national aviation demand to nodes."
        default: "3"
        provenance: "scripts/prepare_airports.py:airport_sizing_factor"
      - key: sector.international_bunkers
        effect: "Whether international aviation emissions count toward the CO2 atmosphere balance."
        default: "false"
        provenance: "scripts/prepare_sector_network.py:international_bunkers"
      - key: custom_data.airports
        effect: "Use a custom data/custom/airports.csv instead of the ourairports download."
        default: "false"
        provenance: "config.default.yaml:airports"

    boundary:
      - variant: "Kerosene aviation demand (status quo)"
        rung: L0
        note: "sector.enable.aviation, on by default."
      - variant: "Hydrogen share of aviation demand"
        rung: L2
        note: >
          No key exists. Localised edit in add_aviation mirroring the shipping H2
          pattern: an aviation_hydrogen_share read via get() with
          {demand}_{planning_horizon} keys, an H2 (or H2 liquid) Load at the
          airport-weighted nodes with an H2-aircraft efficiency assumption, and the
          kerosene load scaled to the remainder. New key must be added to your
          config.
      - variant: "Liquid H2 at airports (liquefaction step)"
        rung: L2
        note: "Pattern-copy the shipping_hydrogen_liquefaction block of add_shipping ('H2 liquid' buses + 'H2 liquefaction' Links using the 'H2 liquefaction' costs row) into the aviation load's bus choice."
      - variant: "Grounded H2-aircraft efficiency/cost assumptions"
        rung: L3
        note: "No aircraft technology data exists in the costs inputs; the kerosene->H2 energy conversion factor must be sourced externally."
      - variant: "Aviation demand scenarios with own wildcards / separate domestic vs international electrolysis of demand"
        rung: L4
        note: "add_aviation lumps domestic+international into one load; splitting with scenario plumbing needs rule/wildcard work in the demand chain."
      - variant: "Endogenous fuel switch kerosene vs H2 vs e-kerosene"
        rung: L5
        note: "Shares would be exogenous even after the L2 edit; competition needs bespoke logic."

    where:
      - change: "Aviation load creation (where an H2 share would be carved out)"
        anchor: "scripts/prepare_sector_network.py function add_aviation"
        provenance: "scripts/prepare_sector_network.py:add_aviation"
      - change: "Share-key + liquefaction pattern to copy"
        anchor: "scripts/prepare_sector_network.py function add_shipping (shipping_hydrogen_share, shipping_hydrogen_liquefaction blocks)"
        provenance: "scripts/prepare_sector_network.py:shipping_hydrogen_liquefaction"
      - change: "Airport locations and sizing weights"
        anchor: "rule prepare_airports -> scripts/prepare_airports.py"
        provenance: "scripts/prepare_airports.py:download_airports"
      - change: "Base aviation energy demand per country"
        anchor: "rule build_base_energy_totals -> scripts/build_base_energy_totals.py function calc_sector"
        provenance: "scripts/build_base_energy_totals.py:calc_sector"

    data_dependencies:
      - input: "UNSD energy balances ('total domestic aviation', 'total international aviation')"
        required_for: "aviation demand baseline"
        availability: "must be built (build_base_energy_totals)"
      - input: "ourairports airports.csv + runways.csv (runtime download; or data/custom/airports.csv)"
        required_for: "locating aviation (and any future H2) demand at nodes"
        availability: "must be built (prepare_airports; custom override available)"
      - input: "costs row 'H2 liquefaction'"
        required_for: "the liquid-H2-at-airports variant (already used by shipping)"
        availability: "exists by default (retrieve_cost_data)"
      - input: "H2-aircraft propulsion efficiency / cost assumptions"
        required_for: "converting kerosene demand into H2 demand"
        availability: "absent (must be supplied)"
