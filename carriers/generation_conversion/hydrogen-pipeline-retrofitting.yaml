id: hydrogen-pipeline-retrofitting
title: Retrofitting gas pipelines to hydrogen
summary: >
  Repurposing existing methane transmission pipes to carry hydrogen — the
  capacity-coupled trade-off between keeping a corridor on gas,
  decommissioning it, or converting it to a cheaper-than-new H2 pipeline.
when_to_use:
  - "repurpose gas pipelines for hydrogen"
  - "H2 retrofit of the gas grid"
  - "convert CH4 pipes to H2"
  - "hydrogen backbone from existing pipelines"
  - "retrofit vs new-build H2 pipeline cost"
  - "gas grid decommissioning"
  - "pypsa-eur carrier names: H2 pipeline retrofitted, gas pipeline"
models:
  - model: pypsa-eur
    version_anchor: {ref: "09e8910ae03ace9af8ff821514cda7822fdd473f", date: "2026-10-12"}
    out_of_box:
      covers: >
        Fully wired but OPT-IN (sector.H2_retrofit: false by default; the
        pilot natural-gas-pipelines carrier card documents the CH4 side of the
        same machinery). With H2_retrofit true, add_h2_gas_infrastructure
        changes both sides of every clustered SciGRID gas pipe: the
        "gas pipeline" Link becomes extendable DOWNWARD (p_nom_max = today's
        capacity, p_nom_min = 0, a token capital cost of 0.1 EUR/MWkm/a so
        the solver prefers explicit decommissioning over degeneracy), and a
        parallel extendable "H2 pipeline retrofitted" candidate is created
        on the same corridor between the H2 buses — bidirectional
        (p_min_pu = -1), with p_nom_max = gas p_nom x
        sector.H2_retrofit_capacity_per_CH4 (0.6 MW H2 per MW CH4,
        energy-basis derating) and capital cost from the
        "H2 (g) pipeline repurposed" row — substantially cheaper than the
        greenfield "H2 (g) pipeline" row used by sector.H2_network
        candidates, which is the whole economic case for retrofitting. The
        coupling is enforced by add_pipe_retrofit_constraint, which is
        ALWAYS called from extra_functionality in solve_network (no flag):
        per corridor, gas p_nom + (1/0.6) x H2-retrofit p_nom == today's
        gas capacity (it filters extendable, non-reversed, active links and
        returns harmlessly when either side is absent — which is why it can
        be unconditionally wired). Compression electricity applies to
        retrofitted pipes exactly like new ones ("H2 pipeline retrofitted"
        is in sector.transmission_efficiency.enable, 0.018 per 1000 km,
        drawn at the origin bus by lossy_bidirectional_links). Myopic
        foresight: add_brownfield subtracts the already-retrofitted
        capacity of previous horizons from BOTH the current horizon's
        remaining retrofit potential (p_nom_max of the new candidates) and
        the residual gas grid p_nom/p_nom_max — retrofit decisions are
        one-way and persistent across horizons.
      mechanism: >
        Data path: rules build_gas_network -> cluster_gas_network produce
        the clustered gas pipe table; add_h2_gas_infrastructure reads it
        (clustered_gas_network input) for both the gas-pipe branch and the
        H2_retrofit branch. Solver: scripts/solve_network.py::
        add_pipe_retrofit_constraint using
        n.config sector H2_retrofit_capacity_per_CH4. Myopic:
        scripts/add_brownfield.py::add_brownfield (h2_retrofit branch, fed
        the h2_retrofit / h2_retrofit_capacity_per_ch4 parameters from
        sector.H2_retrofit / sector.H2_retrofit_capacity_per_CH4 by rule
        compose_network).
      not_covered: >
        Retrofitting exists ONLY where a clustered SciGRID gas pipe exists —
        no retrofit of distribution grids or of corridors absent from the
        data. No partial blending (a pipe is either CH4 or H2 capacity in
        the constraint; no hydrogen admixture into gas pipes). Uniform
        conversion factor and cost: 0.6 and the repurposed cost row apply
        to every pipe regardless of diameter, age or build_year (build_year
        survives in the data but is unused here). A retrofit-ONLY H2
        network is NOT reachable by config: sector.H2_network false calls
        remove_h2_network, whose carrier match 'H2 pipeline' also deletes
        "H2 pipeline retrofitted" links — retrofitting in practice requires
        H2_network true, i.e. greenfield candidates always coexist.
        Conversely, H2_retrofit true with gas_network false creates
        retrofit candidates from the pipe file WITHOUT any gas pipeline
        links, so the coupling constraint finds no gas side and the
        "retrofitted" pipes degenerate into unconstrained cheap H2 pipes —
        only run the retrofit market with gas_network true.
        post_discretization has link_unit_size entries for "H2 pipeline"
        and "gas pipeline" but none for the retrofitted carrier out of the
        box (the dict accepts an added key, L1).
      provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:H2 pipeline retrofitted; scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/solve_network.py:extra_functionality; scripts/add_brownfield.py:add_brownfield; scripts/prepare_sector_network.py:remove_h2_network"
    levers:
      - key: sector.H2_retrofit
        effect: "Master switch: true makes gas pipes decommissionable and creates the coupled 'H2 pipeline retrofitted' candidates."
        default: "false"
        provenance: "config/config.default.yaml:H2_retrofit; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.H2_retrofit_capacity_per_CH4
        effect: "MW H2 obtainable per MW CH4 relinquished — sets both the candidates' p_nom_max and the coupling coefficient in the solver constraint (and its inverse in the myopic carry-over)."
        default: "0.6"
        provenance: "config/config.default.yaml:H2_retrofit_capacity_per_CH4; scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/add_brownfield.py:h2_retrofit_capacity_per_ch4"
      - key: sector.H2_network
        effect: "Must stay true for retrofitting to survive — false triggers remove_h2_network, which strips retrofitted pipes along with greenfield ones."
        default: "true"
        provenance: "config/config.default.yaml:H2_network; scripts/prepare_sector_network.py:remove_h2_network"
      - key: sector.gas_network
        effect: "Must stay true for the retrofit coupling to bind — without gas pipeline links the constraint returns early and retrofit candidates become unconstrained cheap H2 pipes."
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/solve_network.py:add_pipe_retrofit_constraint"
      - key: sector.transmission_efficiency
        effect: "The 'H2 pipeline retrofitted' entry sets compression electricity (0.018 per 1000 km); remove it from enable to skip loss-splitting for retrofitted pipes."
        default: "enable includes H2 pipeline retrofitted; compression_per_1000km: 0.018"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: costs.overwrites
        effect: "Override the 'H2 (g) pipeline repurposed' row to change the retrofit-vs-new cost asymmetry (the greenfield row is 'H2 (g) pipeline')."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "let the model repurpose gas pipes to hydrogen"
        rung: L0
        note: "sector.H2_retrofit: true (with gas_network and H2_network at their true defaults) — the solver constraint is already wired unconditionally"
      - variant: "change the H2 yield per CH4 capacity"
        rung: L1
        note: "sector.H2_retrofit_capacity_per_CH4"
      - variant: "change the retrofit cost premium/discount"
        rung: L1
        note: "overwrite 'H2 (g) pipeline repurposed' (costs.overwrites or data/custom_costs.csv)"
      - variant: "discretise retrofitted-pipe capacities post-solve"
        rung: L1
        note: "add an 'H2 pipeline retrofitted' entry to solving.options.post_discretization link_unit_size/link_threshold (only DC / H2 pipeline / gas pipeline entries exist by default)"
      - variant: "retrofit-only H2 network (no greenfield candidates)"
        rung: L2
        note: "not reachable by config (H2_network false deletes retrofitted pipes too) — either drop the greenfield block in add_h2_gas_infrastructure or narrow the carrier match in remove_h2_network"
      - variant: "restrict which corridors may be retrofitted (e.g. by age or country)"
        rung: L2
        note: "filter the gas_pipes frame in the H2_retrofit block of add_h2_gas_infrastructure (build_year survives from the SciGRID data and can be used)"
      - variant: "carry retrofit decisions across planning horizons"
        rung: L0
        note: "automatic in myopic foresight — add_brownfield deducts retrofitted capacity from both the gas grid and the residual retrofit potential"
      - variant: "hydrogen blending into gas pipelines (partial conversion)"
        rung: L5
        note: "the constraint is an either/or capacity split; fractional H2 admixture with gas-quality tracking is bespoke"
      - variant: "retrofit of gas DISTRIBUTION grids"
        rung: L5
        note: "no distribution topology exists at all (only a capex adder on decentral gas consumers — see natural-gas-pipelines)"
    where:
      - change: "retrofit candidate creation + gas-pipe decommissioning setup"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (H2_retrofit branches: gas_pipes p_nom_max/p_nom_min override, then the 'H2 pipeline retrofitted' n.add)"
        provenance: "scripts/prepare_sector_network.py:H2 pipeline retrofitted; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - change: "capacity-coupling constraint (gas + H2/0.6 == original capacity)"
        anchor: "scripts/solve_network.py::add_pipe_retrofit_constraint (always called in ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/solve_network.py:extra_functionality"
      - change: "myopic carry-over of retrofitted capacity"
        anchor: "scripts/add_brownfield.py::add_brownfield (h2_retrofit branch: remaining_capacity for both retrofit potential and gas grid)"
        provenance: "scripts/add_brownfield.py:add_brownfield"
      - change: "removal behaviour when the H2 network is disabled"
        anchor: "scripts/prepare_sector_network.py::remove_h2_network (carrier string match 'H2 pipeline')"
        provenance: "scripts/prepare_sector_network.py:remove_h2_network"
      - change: "compression losses on retrofitted pipes"
        anchor: "scripts/prepare_sector_network.py::lossy_bidirectional_links (transmission_efficiency loop)"
        provenance: "scripts/prepare_sector_network.py:lossy_bidirectional_links"
    data_dependencies:
      - input: "clustered gas network table (rules build_gas_network -> cluster_gas_network from SciGRID IGGIELGN)"
        required_for: "the retrofit candidate set — corridors, lengths and today's CH4 capacities"
        availability: "must be built; retrieved + built by default in the sector workflow (European coverage only)"
      - input: "cost rows 'H2 (g) pipeline repurposed' (retrofit) and 'H2 (g) pipeline' (greenfield reference)"
        required_for: "the retrofit-vs-new cost asymmetry"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "nodal H2 buses at both pipe endpoints"
        required_for: "retrofitted links' bus0/bus1"
        availability: "exists by default (add_h2_gas_infrastructure creates H2 buses at every node)"
