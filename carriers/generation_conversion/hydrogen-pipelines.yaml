id: hydrogen-pipelines
title: Hydrogen pipeline network
summary: >
  Inter-regional hydrogen transport by pipeline — greenfield candidate
  corridors, compression losses, unit-size discretisation, and how the
  network can also arise from repurposed gas pipes.
when_to_use:
  - "hydrogen network / H2 grid"
  - "hydrogen pipelines"
  - "H2 transmission between regions"
  - "hydrogen backbone"
  - "new hydrogen corridors"
  - "H2 pipeline compression energy"
  - "no hydrogen network / islanded hydrogen"
  - "pypsa-eur carrier names: H2 pipeline, H2 pipeline retrofitted"
  - "hydrogen pipeline network"
  - "repurpose gas pipelines for hydrogen"
  - "H2 backbone / hydrogen transmission"
  - "greenfield hydrogen network along power lines"
  - "limit hydrogen network build-out (GWkm)"
  - "hydrogen transport between regions"
  - "known in pypsa-eur as: H2 pipeline, H2 pipeline retrofitted"
models:
  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        ON by default (sector.H2_network: true). In
        add_h2_gas_infrastructure, create_network_topology derives candidate
        corridors from the EXISTING electricity lines plus links of carrier
        "DC" and "gas pipeline" (i.e. the H2 network can only follow where
        an electricity or gas connection already runs), keeps pairs whose
        endpoints both host H2 buses, and adds one extendable bidirectional
        "H2 pipeline" Link per corridor (p_min_pu = -1, p_nom starts at 0 —
        the H2 grid is entirely greenfield), with capital cost = length x
        the "H2 (g) pipeline" cost row. After all sectors are built,
        lossy_bidirectional_links splits each pipe into a forward/reversed
        pair (sector.transmission_efficiency enable includes "H2 pipeline");
        compression_per_1000km 0.018 is applied as an ELECTRICITY demand at
        the origin bus (bus2 with negative efficiency2), and the solver
        couples the pair's capacities via
        add_lossy_bidirectional_link_constraints (always wired in
        extra_functionality). If sector.H2_retrofit is true a second,
        cheaper corridor class "H2 pipeline retrofitted" appears on gas
        routes (own carrier card: hydrogen-pipeline-retrofitting). Optimised pipe
        capacities can be snapped to 1200 MW units post-solve
        (solving.options.post_discretization, link_unit_size "H2 pipeline",
        default disabled). With sector.H2_network false, remove_h2_network
        drops every link whose carrier contains "H2 pipeline" (note: that
        string-match also removes retrofitted pipes). Myopic runs carry
        built pipeline capacity forward as fixed vintaged links via
        add_brownfield.
      mechanism: >
        rule compose_network -> add_h2_gas_infrastructure (H2_network
        block, after the retrofit block); loss/compression splitting happens
        in the __main__ transmission_efficiency loop calling
        lossy_bidirectional_links; the reversed-pair capacity coupling and
        (if enabled) post-discretisation live in scripts/solve_network.py.
      not_covered: >
        No existing hydrogen pipelines — there is no H2 infrastructure
        dataset; every "H2 pipeline" starts at zero capacity. No candidate
        corridors beyond the union of electricity and gas topologies:
        an arbitrary new route (e.g. subsea H2 backbone between regions
        without a DC link or gas pipe) needs a code edit. No cap on total
        H2 network build (no equivalent of the line volume limit). No
        linepack, pressure or flow physics — pipes are transport links with
        static efficiency 1 plus compression electricity. H2 imports by
        pipeline from outside the system are a separate fixed-price option
        (sector.imports, "import H2" generators at former gas entry points
        — green-energy-imports carrier card). Intra-regional H2 distribution does
        not exist (one H2 bus per region).
      provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:create_network_topology; scripts/prepare_sector_network.py:lossy_bidirectional_links; scripts/prepare_sector_network.py:remove_h2_network; scripts/solve_network.py:add_lossy_bidirectional_link_constraints"
    levers:
      - key: sector.H2_network
        effect: "Master switch: true = extendable H2 pipeline candidates on all elec/gas corridors; false = remove_h2_network strips ALL 'H2 pipeline' carriers (including retrofitted ones)."
        default: "true"
        provenance: "config/config.default.yaml:H2_network; scripts/prepare_sector_network.py:remove_h2_network"
      - key: sector.transmission_efficiency
        effect: "The 'H2 pipeline' entry sets compression electricity (compression_per_1000km 0.018, drawn at the origin bus) and per-km efficiency (1.0 = lossless); remove 'H2 pipeline' from the enable list to keep pipes simple bidirectional links."
        default: "enable includes H2 pipeline; compression_per_1000km: 0.018; efficiency_per_1000km: 1"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: solving.options.post_discretization
        effect: "enable: true snaps optimised H2 pipeline capacities to integer multiples of link_unit_size 'H2 pipeline' (1200 MW, threshold 0.3) after solving."
        default: "enable: false"
        provenance: "config/config.default.yaml:post_discretization; scripts/solve_network.py:post_discretization"
      - key: sector.H2_retrofit
        effect: "true adds the cheaper 'H2 pipeline retrofitted' corridor class on existing gas routes, capacity-coupled to gas decommissioning (see hydrogen-pipeline-retrofitting carrier card)."
        default: "false"
        provenance: "config/config.default.yaml:H2_retrofit; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.imports.enable
        effect: "true adds fixed-price 'import H2' Generators sized by former gas pipeline entry capacities — an exogenous substitute for modelling external H2 pipelines."
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:import H2"
    boundary:
      - variant: "co-optimise a greenfield H2 network"
        rung: L0
        note: "default (sector.H2_network: true)"
      - variant: "no H2 network (each region self-supplies)"
        rung: L0
        note: "sector.H2_network: false — but this also kills retrofitted pipes (remove_h2_network matches any 'H2 pipeline' carrier)"
      - variant: "H2 network from repurposed gas pipes"
        rung: L0
        note: "sector.H2_retrofit: true (own carrier card); greenfield candidates remain available alongside"
      - variant: "change or disable compression losses"
        rung: L1
        note: "edit the sector.transmission_efficiency 'H2 pipeline' entry"
      - variant: "discretise pipeline capacities to unit sizes"
        rung: L1
        note: "solving.options.post_discretization enable + link_unit_size"
      - variant: "add a specific corridor outside the elec/gas topology"
        rung: L2
        note: "append rows to the h2_pipes frame in the H2_network block of add_h2_gas_infrastructure (bus0/bus1/length) — candidates are generated in code, not read from a data file"
      - variant: "restrict which corridors are allowed"
        rung: L2
        note: "filter the create_network_topology output in the same block (e.g. drop cross-border pairs)"
      - variant: "cap total H2 network expansion (volume or cost)"
        rung: L5
        note: "no global-constraint hook for H2 pipes; custom constraint over Link-p_nom of carrier 'H2 pipeline' via custom_extra_functionality"
      - variant: "existing H2 pipelines with today's capacities"
        rung: L3
        note: "no dataset wired; set p_nom/p_nom_min on chosen corridors from user data (edit in the H2_network block)"
      - variant: "linepack / pressure modelling"
        rung: L5
        note: "transport links only — no gas-flow physics anywhere in the workflow"
    where:
      - change: "candidate generation, costs, corridor filtering"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (H2_network block using ::create_network_topology)"
        provenance: "scripts/prepare_sector_network.py:create_network_topology; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - change: "compression losses / bidirectional splitting"
        anchor: "scripts/prepare_sector_network.py::lossy_bidirectional_links (transmission_efficiency loop in __main__)"
        provenance: "scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - change: "reversed-pair capacity coupling at solve time"
        anchor: "scripts/solve_network.py::add_lossy_bidirectional_link_constraints (always called in ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_lossy_bidirectional_link_constraints; scripts/solve_network.py:extra_functionality"
      - change: "unit-size snapping after solving"
        anchor: "solving.options.post_discretization kwargs passed through in scripts/solve_network.py"
        provenance: "scripts/solve_network.py:post_discretization"
      - change: "network removal when disabled"
        anchor: "scripts/prepare_sector_network.py::remove_h2_network"
        provenance: "scripts/prepare_sector_network.py:remove_h2_network"
      - change: "carrying built pipes across myopic horizons"
        anchor: "scripts/add_brownfield.py::add_brownfield (generic Link handling)"
        provenance: "scripts/add_brownfield.py:add_brownfield"
    data_dependencies:
      - input: "cost rows 'H2 (g) pipeline' and 'H2 (g) pipeline repurposed'"
        required_for: "greenfield and retrofit pipeline economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "electricity network topology (lines + DC links) and the clustered gas network"
        required_for: "the candidate corridor set"
        availability: "exists by default (base network + rules build_gas_network / cluster_gas_network)"
      - input: "nodal H2 buses"
        required_for: "pipeline endpoints"
        availability: "exists by default (add_h2_gas_infrastructure)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Sector chain (default on): with sector.hydrogen.network true, add_hydrogen reads a
        clustered gas-pipeline table and adds bidirectional (p_min_pu=-1) extendable H2 pipeline
        Links between node H2 buses. Route source: sector.hydrogen.network_routes = "gas" uses the
        clustered gas network from rule prepare_gas_network (GGIT global gas infrastructure xlsx,
        filtered by sector.gas.network_data_GGIT_status, clustered to bus regions); "greenfield"
        instead follows the electricity topology (lines + DC links). If gas_network_repurposing is
        true, repurposed links ("H2 pipeline repurposed" carrier) are capped at 80% of the gas
        pipeline capacity with "H2 (g) pipeline repurposed" costs; new-build links use "H2 (g)
        pipeline" costs. If the pipeline table is empty the code falls back to greenfield routing.
        A total network-size cap (sector.hydrogen.network_limit, GWkm) is enforced at solve time.
        Electricity-only chain: adding "H2 pipeline" to electricity.extendable_carriers.Link makes
        attach_hydrogen_pipelines build pipelines along the power topology (requires "H2" Store),
        split into lossy unidirectional links with compression electricity demand from
        sector.transmission_efficiency ("H2 pipeline" entry). Myopic runs convert gas pipelines to
        H2 using sector.hydrogen.H2_retrofit_capacity_per_CH4 in add_brownfield.
      mechanism: >
        scripts/prepare_sector_network.py:add_hydrogen — inner helpers
        add_links_repurposed_H2_pipelines, add_links_new_H2_pipelines,
        add_links_elec_routing_new_H2_pipelines, selected by
        snakemake.params.sector_options["hydrogen"] flags; pipeline input built by
        scripts/prepare_gas_network.py:download_GGIT_gas_network + prepare_GGIT_data; GWkm cap in
        scripts/solve_network.py:add_h2_network_cap.
      not_covered: >
        No pipeline routing optimisation beyond the two given topologies (gas routes or power-line
        routes); no compression losses in the sector chain (repurposed/new links there have no
        efficiency penalty — length-based efficiency only exists in the electricity-only
        attach_hydrogen_pipelines chain); no cross-border import/export pipelines to countries
        outside the modelled region; no linepack storage.
      provenance: "scripts/prepare_sector_network.py:add_hydrogen"
    levers:
      - key: sector.hydrogen.network
        effect: Master switch for the sector H2 pipeline network.
        default: "true"
        provenance: "config.default.yaml:network_routes; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.network_routes
        effect: '"gas" = follow (clustered) gas network routes; "greenfield" = follow electricity lines/DC links.'
        default: '"gas"'
        provenance: "config.default.yaml:network_routes; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.gas_network_repurposing
        effect: Adds capacity-capped repurposed pipeline links (cheaper cost row) on gas routes.
        default: "true"
        provenance: "config.default.yaml:gas_network_repurposing; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.network_limit
        effect: Total H2 network cap in GWkm enforced as sum(p_nom * length) <= limit * 1000.
        default: "2000"
        provenance: "config.default.yaml:network_limit; scripts/solve_network.py:add_h2_network_cap"
      - key: sector.hydrogen.H2_retrofit_capacity_per_CH4
        effect: H2-per-CH4 capacity ratio used when converting gas pipelines to H2 in myopic brownfield runs.
        default: "0.6"
        provenance: "config.default.yaml:H2_retrofit_capacity_per_CH4; scripts/add_brownfield.py:H2_retrofit_capacity_per_CH4"
      - key: sector.gas.network_data
        effect: 'Gas dataset feeding the routes: "GGIT" (global) or "IGGIELGN" (Europe).'
        default: '"GGIT"'
        provenance: "config.default.yaml:network_data; scripts/prepare_gas_network.py:prepare_GGIT_data"
      - key: sector.gas.network_data_GGIT_status
        effect: Which GGIT pipeline statuses (Operating, Construction, Proposed, ...) are kept as candidate routes.
        default: '["Construction", "Operating", "Idle", "Shelved", "Mothballed", "Proposed"]'
        provenance: "config.default.yaml:network_data_GGIT_status; scripts/prepare_gas_network.py:prepare_GGIT_data"
      - key: custom_data.gas_network
        effect: If true, bypasses prepare_gas_network and reads routes from data/custom/pipelines.csv.
        default: "false"
        provenance: "config.default.yaml:gas_network; Snakefile:prepare_sector_network"
      - key: electricity.extendable_carriers.Link
        effect: Adding "H2 pipeline" enables pipelines in the electricity-only workflow (needs "H2" in extendable_carriers.Store).
        default: "[]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_hydrogen_pipelines"
      - key: sector.transmission_efficiency
        effect: '"H2 pipeline" sub-entry sets efficiency_per_1000km and compression_per_1000km for the electricity-only pipeline chain.'
        default: "{H2 pipeline: {efficiency_per_1000km: 1, compression_per_1000km: 0.017}}"
        provenance: "config.default.yaml:transmission_efficiency; scripts/add_extra_components.py:attach_hydrogen_pipelines"
      - key: sector.hydrogen.underground_storage
        effect: Adds salt-cavern H2 stores (country potentials csv, or custom regional csv via custom_data.h2_underground) alongside the always-present overground tank stores.
        default: "false"
        provenance: "config.default.yaml:underground_storage; scripts/prepare_sector_network.py:add_hydrogen"
    boundary:
      - variant: "H2 network on repurposed gas routes"
        rung: L0
        note: Default configuration.
      - variant: "Greenfield-only H2 network"
        rung: L1
        note: network_routes greenfield (and/or gas_network_repurposing false).
      - variant: "No H2 network (islanded nodes)"
        rung: L0
        note: sector.hydrogen.network false.
      - variant: "Tighter/looser total network build"
        rung: L1
        note: sector.hydrogen.network_limit GWkm.
      - variant: "User-defined pipeline corridors"
        rung: L3
        note: custom_data.gas_network true + data/custom/pipelines.csv (bus0,bus1,length,capacity in the clustered-bus naming).
      - variant: "Pipeline losses/compression in the sector chain"
        rung: L2
        note: Add efficiency/electricity bus to the madd calls in add_links_*_H2_pipelines (pattern exists in add_extra_components set_length_based_efficiency).
      - variant: "H2 import pipeline from outside the modelled countries"
        rung: L5
        note: Needs a boundary bus + import generator/link concept not present anywhere.
    where:
      - change: "Pipeline link construction and route selection"
        anchor: "scripts/prepare_sector_network.py:add_hydrogen (add_links_repurposed_H2_pipelines / add_links_new_H2_pipelines / add_links_elec_routing_new_H2_pipelines)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "Gas route data preparation / clustering"
        anchor: "Snakefile rule prepare_gas_network; scripts/prepare_gas_network.py:prepare_GGIT_data"
        provenance: "scripts/prepare_gas_network.py:prepare_GGIT_data"
      - change: "Network GWkm cap"
        anchor: "scripts/solve_network.py:add_h2_network_cap"
        provenance: "scripts/solve_network.py:add_h2_network_cap"
      - change: "Electricity-only pipeline chain"
        anchor: "scripts/add_extra_components.py:attach_hydrogen_pipelines"
        provenance: "scripts/add_extra_components.py:attach_hydrogen_pipelines"
    data_dependencies:
      - input: "GEM GGIT gas pipelines xlsx (GEM-GGIT-Gas-Pipelines-December-2022.xlsx, auto-downloaded in prepare_gas_network) -> resources/<run>/gas_networks/gas_network_elec_s{simpl}_{clusters}.csv"
        required_for: "network_routes: gas and repurposing"
        availability: "must be built (auto-download); region-dependent — regions without mapped gas pipelines fall back to greenfield electricity routing"
      - input: "data/custom/pipelines.csv"
        required_for: "custom_data.gas_network: true"
        availability: "absent — user must supply"
      - input: "data/hydrogen_salt_cavern_potentials.csv (country-level TWh) or data/custom/h2_underground_{demand}_{year}.csv"
        required_for: "underground_storage: true"
        availability: "exists in repo (country coverage limited to listed countries); custom regional file must be supplied"
      - input: "technology-data costs csv rows: H2 (g) pipeline, H2 (g) pipeline repurposed, H2 pipeline, hydrogen storage underground, hydrogen storage tank type 1 including compressor"
        required_for: "pipeline and storage costs"
        availability: "must be built (rule retrieve_cost_data); rows confirmed in built costs file"
