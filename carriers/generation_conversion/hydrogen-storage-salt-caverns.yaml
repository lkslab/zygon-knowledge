id: hydrogen-storage-salt-caverns
title: Hydrogen storage (salt caverns)
summary: Large-scale underground hydrogen storage in salt caverns — cheap, geologically constrained energy capacity for seasonal H2 balancing.
when_to_use:
  - "hydrogen salt caverns / underground hydrogen storage"
  - "UHS / geological H2 storage"
  - "cheap seasonal hydrogen storage"
  - "where can hydrogen be stored underground"
  - "hydrogen tank vs cavern storage costs"
  - "pypsa-eur carrier names: H2 Store, H2, H2 tank"
  - "known in pypsa-eur as: hydrogen storage, H2 Store, H2 storage"
models:
  - model: pypsa-eur
    version_anchor: {ref: "f55cdf34f0e67a797fd4327bed26c56dedcb5cb8", date: "2026-10-09"}
    out_of_box:
      covers: >
        Sector chain: fully covered and ON by default
        (sector.hydrogen_underground_storage: true). rule
        retrieve_h2_salt_caverns fetches the Caglayan et al. potential map
        (h2_salt_caverns_GWh_per_sqkm.geojson) and rule
        build_salt_cavern_potentials overlays it with on- and offshore bus
        regions into salt_cavern_potentials.csv with one TWh
        column per storage_type (onshore / nearshore / offshore). In
        add_h2_gas_infrastructure the columns selected by
        sector.hydrogen_underground_storage_locations (default [onshore,
        nearshore]) are summed per region, regions below 2 TWh are dropped,
        potentials are clipped at 1000 TWh per location, and qualifying nodes
        get an extendable "H2 Store" with e_nom_max = potential and capital
        cost from the "hydrogen storage underground" row; all OTHER nodes get
        an uncapped overground "H2 Store" priced at "hydrogen storage tank
        type 1 including compressor" (~25x the cavern cost in the current
        data). Charging/discharging runs over the nodal H2 buses'
        Electrolysis / Fuel Cell / H2 turbine links and the H2 pipeline
        network. Electricity workflow: "H2" is in
        electricity.extendable_carriers.Store by default, and STORE_LOOKUP
        prices that Store with the "hydrogen storage underground" row — i.e.
        the power-only chain gives CAVERN-cost H2 storage at EVERY bus with no
        geological cap; a tank-priced alternative token "H2 tank" ("hydrogen
        storage tank type 1 including compressor" + electrolysis/fuel cell)
        is wired in STORE_LOOKUP but not in any default list.
      mechanism: >
        rule build_salt_cavern_potentials runs
        scripts/build_salt_cavern_potentials.py
        (salt_cavern_potential_by_region: overlay area share * energy density
        -> TWh per region and storage_type). rule compose_network runs
        scripts/prepare_sector_network.py::add_h2_gas_infrastructure with
        h2_cavern_file = the potentials CSV and cavern_types =
        sector.hydrogen_underground_storage_locations; the gate is
        options["hydrogen_underground_storage"] AND a nonempty intersection of
        cavern_types with the CSV columns. Elec workflow: attach_stores in
        scripts/add_electricity.py (rule compose_network).
      not_covered: >
        In the electricity workflow the underground cost is applied everywhere
        without geological limits — there is no cavern-potential cap outside
        the sector chain. In the sector chain, cavern nodes get ONLY the
        cavern store (nodes_overground is the symmetric difference, so no
        tank fallback is co-located with a cavern) and the 2 TWh cutoff and
        1000 TWh clip are hardcoded. No cushion gas, injection/withdrawal rate
        limits (charge/discharge power is whatever the H2 conversion links
        provide), cavern-construction lead times, or aquifer/depleted-field H2
        storage. Liquid H2 and LOHC storage are not modelled as stores (cost
        rows like "H2 (l) storage tank" exist unconsumed for storage
        purposes).
      provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/build_salt_cavern_potentials.py:salt_cavern_potential_by_region; rules/build_sector.smk:build_salt_cavern_potentials; rules/retrieve.smk:retrieve_h2_salt_caverns; scripts/add_electricity.py:hydrogen storage underground; scripts/prepare_sector_network.py:hydrogen_underground_storage"
    levers:
      - key: sector.hydrogen_underground_storage
        effect: "Master switch for cavern-priced, potential-capped H2 Stores in the sector chain; false leaves tank-priced stores everywhere."
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_underground_storage; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.hydrogen_underground_storage_locations
        effect: "Which potential classes count: subset of [onshore, nearshore, offshore] (columns of the potentials CSV; nearshore = within 50 km of shore)."
        default: "[onshore, nearshore]"
        provenance: "config/config.default.yaml:hydrogen_underground_storage_locations; scripts/prepare_sector_network.py:cavern_types"
      - key: electricity.extendable_carriers.Store
        effect: "'H2' here (default) gives every elec-workflow bus an H2 Bus + Store (underground cost) + Electrolysis/Fuel Cell links; add 'H2 tank' for the tank-priced variant instead/alongside."
        default: "[battery, H2]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_stores"
      - key: electricity.max_hours.H2
        effect: "Duration (h) of the fixed-ratio H2 StorageUnit representation (needs 'H2' in extendable_carriers.StorageUnit; also sets the synthesised combined 'H2' cost row)."
        default: "168"
        provenance: "config/config.default.yaml:max_hours; scripts/process_cost_data.py:costs_for_storage"
      - key: sector.hydrogen_fuel_cell
        effect: "Adds the H2 Fuel Cell discharge path in sector runs (the cavern store is only useful with a discharge route: fuel cell and/or H2 turbine, plus H2 demand)."
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_fuel_cell; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.hydrogen_turbine
        effect: "Adds the H2 turbine (OCGT-cost) discharge path in sector runs."
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_turbine; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: data.h2_salt_caverns
        effect: "Dataset source/version pin for the retrieved cavern geodata (source: archive, version: latest by default)."
        default: "{source: archive, version: latest}"
        provenance: "config/config.default.yaml:h2_salt_caverns; rules/retrieve.smk:retrieve_h2_salt_caverns"
      - key: costs.overwrites
        effect: "Override 'hydrogen storage underground' / 'hydrogen storage tank type 1 including compressor' investment or lifetime (or rows in data/custom_costs.csv)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "salt-cavern H2 storage where geology allows (sector run)"
        rung: L0
        note: "default — hydrogen_underground_storage true with [onshore, nearshore]"
      - variant: "include offshore cavern potential / restrict to onshore"
        rung: L1
        note: "edit sector.hydrogen_underground_storage_locations (offshore column exists in the potentials CSV)"
      - variant: "tank-only hydrogen storage (no caverns)"
        rung: L1
        note: "sector.hydrogen_underground_storage: false; in the elec workflow swap 'H2' for 'H2 tank' in extendable_carriers.Store"
      - variant: "H2 storage in the electricity-only workflow"
        rung: L0
        note: "default ('H2' in extendable_carriers.Store) — but note it is cavern-priced everywhere with no geological cap; a weekly fixed-duration StorageUnit needs 'H2' in extendable_carriers.StorageUnit (L1, max_hours.H2 = 168)"
      - variant: "geologically capped H2 storage in the electricity workflow"
        rung: L2
        note: "attach_stores has no e_nom_max hook; feed the salt_cavern_potentials CSV into it and cap the H2 Store per bus (the add_h2_gas_infrastructure block is the pattern)"
      - variant: "change the 2 TWh minimum-site or 1000 TWh clip thresholds"
        rung: L2
        note: "hardcoded in the h2_caverns block of add_h2_gas_infrastructure"
      - variant: "bespoke/nodal cavern potentials (own geodata)"
        rung: L3
        note: "replace the retrieved geojson (data.h2_salt_caverns source/folder) or the built salt_cavern_potentials.csv — columns must match the storage_type names the config selects"
      - variant: "injection/withdrawal rate limits, cushion gas"
        rung: L5
        note: "no hook; bespoke constraints tying Store e_nom to the H2 conversion link p_nom"
    where:
      - change: "cavern store creation, thresholds, tank fallback"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (h2_caverns block, rule compose_network)"
        provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - change: "regional potential computation from geodata"
        anchor: "scripts/build_salt_cavern_potentials.py::salt_cavern_potential_by_region (rule build_salt_cavern_potentials)"
        provenance: "scripts/build_salt_cavern_potentials.py:salt_cavern_potential_by_region"
      - change: "geodata retrieval / dataset pin"
        anchor: "rule retrieve_h2_salt_caverns (data.h2_salt_caverns)"
        provenance: "rules/retrieve.smk:retrieve_h2_salt_caverns"
      - change: "elec-workflow H2 store pricing and the 'H2 tank' variant"
        anchor: "scripts/add_electricity.py::attach_stores + STORE_LOOKUP 'H2' / 'H2 tank' entries"
        provenance: "scripts/add_electricity.py:attach_stores; scripts/add_electricity.py:STORE_LOOKUP"
    data_dependencies:
      - input: "h2_salt_caverns_GWh_per_sqkm.geojson (Caglayan et al. salt cavern potential map)"
        required_for: "sector-chain cavern potentials"
        availability: "retrieved by the workflow (rule retrieve_h2_salt_caverns, data.h2_salt_caverns archive); Europe-wide coverage"
      - input: "salt_cavern_potentials.csv (TWh per region x storage_type)"
        required_for: "the cavern store e_nom_max caps"
        availability: "must be built (rule build_salt_cavern_potentials; runs automatically in the sector workflow)"
      - input: "cost rows 'hydrogen storage underground' and 'hydrogen storage tank type 1 including compressor'"
        required_for: "cavern and tank capital costs (both workflows)"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "nodal H2 buses with Electrolysis / Fuel Cell / H2 turbine links and the H2 pipeline network"
        required_for: "charging/discharging the stores in sector runs"
        availability: "exists by default in the sector workflow (add_h2_gas_infrastructure)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Sector chain only, and OFF by default (sector.hydrogen.underground_storage:
        false). When enabled, add_hydrogen adds "H2 UHS" Buses/Stores with
        potential-limited e_nom_max from data/hydrogen_salt_cavern_potentials.csv —
        country totals in TWh (only DZ: 1000, MA: 300, TN: 100, NG: 100, BJ: 20)
        split equally across each country's nodes and converted to MWh — at capital
        cost from costs row "hydrogen storage underground", plus free extendable
        UHS charger/discharger Links. The default (and everywhere-else fallback) is
        overground tank storage: an "H2 Store Tank" Store at every node priced at
        costs row "hydrogen storage tank type 1 including compressor". A second,
        custom-data branch (custom_data.h2_underground: true) reads per-region
        potentials from data/custom/h2_underground_{demand}_{planning_horizons}.csv
        (columns id_region, storage_cap_MWh, country) instead.
      mechanism: >
        rule prepare_sector_network runs scripts/prepare_sector_network.py; inside
        add_hydrogen the block gated on
        snakemake.params.sector_options["hydrogen"]["underground_storage"] chooses
        between the custom branch (snakemake.params.h2_underground, wired from
        config custom_data.h2_underground in the Snakefile) and the default CSV
        branch (snakemake.input.h2_cavern = data/hydrogen_salt_cavern_potentials.csv).
        Caution on the default CSV branch as written: both the "H2 UHS charger" and
        "H2 UHS discharger" Links are created with bus0=spatial.nodes (the
        electricity bus) and bus1 at the UHS bus — i.e. the same orientation, and
        connected to the electricity rather than the H2 bus (the custom branch uses
        bus0=spatial.nodes + " H2"); review orientation before relying on results.
        Overground tanks are added unconditionally at all nodes after the block.
      not_covered: >
        The power-only chain has no cavern option at all — attach_stores
        (scripts/add_extra_components.py) prices the H2 Store with the "hydrogen
        storage tank" row only. Cavern data covers just five countries at country
        (not geological/nodal) resolution, split equally across nodes (marked TODO
        in code). No cushion gas, injection/withdrawal rate limits, or
        cavern-construction lead times.
      provenance: scripts/prepare_sector_network.py:underground_storage
    levers:
      - key: sector.hydrogen.underground_storage
        effect: Master switch for salt-cavern H2 stores ("H2 UHS") in the sector chain.
        default: "false"
        provenance: scripts/prepare_sector_network.py:underground_storage
      - key: custom_data.h2_underground
        effect: Switches the cavern potential source from the shipped country CSV to user files data/custom/h2_underground_{demand}_{planning_horizons}.csv with per-region storage_cap_MWh.
        default: "false"
        provenance: scripts/prepare_sector_network.py:add_hydrogen
      - key: electricity.extendable_carriers.Store
        effect: Keeps "H2" tank storage in the power-only chain (Store + electrolysis/fuel-cell Links) — the non-cavern baseline.
        default: "[battery, H2]"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: electricity.max_hours.H2
        effect: Duration of the H2 StorageUnit representation (tank-cost based) if "H2" is added to extendable_carriers.StorageUnit.
        default: "168"
        provenance: scripts/process_cost_data.py:costs_for_storage
    boundary:
      - variant: Enable salt-cavern H2 storage (region within DZ/MA/TN/NG/BJ)
        rung: L0
        note: Flip sector.hydrogen.underground_storage to true — but review the charger/discharger bus wiring noted in mechanism.
      - variant: Cavern storage for a country not in the shipped CSV
        rung: L3
        note: Add a "ct,TWh" row to data/hydrogen_salt_cavern_potentials.csv (country ISO2 + TWh potential); no code change.
      - variant: Node-resolved / bespoke cavern potentials
        rung: L3
        note: Set custom_data.h2_underground true and provide data/custom/h2_underground_{demand}_{planning_horizons}.csv (id_region, storage_cap_MWh, country).
      - variant: Change tank-vs-cavern cost assumptions
        rung: L1
        note: Costs rows "hydrogen storage underground" and "hydrogen storage tank type 1 including compressor" come from technology-data; override via the costs-section maps read by prepare_costs (investment/FOM/... via config.get — keys present only as comments in config.default.yaml).
      - variant: Salt caverns in the power-only workflow
        rung: L2
        note: attach_stores hardcodes the tank cost for the H2 Store; add a cavern-cost variant with regional e_nom_max there (reuse the CSV), since no underground option exists in that chain.
      - variant: Fix/parameterise UHS charger-discharger wiring or add charging efficiency/cost
        rung: L2
        note: Edit the two n.madd("Link", ... "H2 UHS charger"/"H2 UHS discharger") calls in the underground_storage block (efficiency/capital_cost lines are currently commented out or zero).
      - variant: Injection/withdrawal rate limits, cushion gas
        rung: L5
        note: No hook; bespoke constraints on the UHS Store/Links.
    where:
      - change: Cavern storage block (both CSV and custom branches, link wiring, potentials-to-nodes logic)
        anchor: scripts/prepare_sector_network.py, function add_hydrogen, underground_storage block (rule prepare_sector_network)
        provenance: scripts/prepare_sector_network.py:add_hydrogen
      - change: Country cavern potentials
        anchor: data/hydrogen_salt_cavern_potentials.csv (Snakefile input h2_cavern of rule prepare_sector_network)
        provenance: data/hydrogen_salt_cavern_potentials.csv:DZ
      - change: Overground tank fallback cost
        anchor: scripts/prepare_sector_network.py, "H2 Store Tank" madd after the underground block
        provenance: scripts/prepare_sector_network.py:hydrogen storage tank type 1 including compressor
      - change: Power-only chain H2 storage cost
        anchor: scripts/add_extra_components.py, function attach_stores, H2 branch (rule add_extra_components)
        provenance: scripts/add_extra_components.py:attach_stores
    data_dependencies:
      - input: data/hydrogen_salt_cavern_potentials.csv (country, TWh)
        required_for: Default cavern branch
        availability: region-dependent — shipped in the repo, rows only for DZ, MA, TN, NG, BJ; other countries silently get no caverns
      - input: data/custom/h2_underground_{demand}_{planning_horizons}.csv
        required_for: Custom per-region cavern potentials (custom_data.h2_underground)
        availability: absent — must be provided by the user
      - input: costs rows "hydrogen storage underground" and "hydrogen storage tank type 1 including compressor" (technology-data via rule retrieve_cost_data; "hydrogen storage underground" also in offline fallback data/costs.csv)
        required_for: Cavern and tank capital costs
        availability: exists by default
