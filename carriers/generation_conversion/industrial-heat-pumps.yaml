id: industrial-heat-pumps
title: Industrial heat pumps
summary: >
  High-temperature heat pumps supplying industrial process heat and steam,
  displacing fuel-fired boilers with efficient electricity use at low and
  medium temperatures.
when_to_use:
  - "industrial heat pump"
  - "high temperature heat pump"
  - "heat pumps for process heat / steam"
  - "electrify industrial steam"
  - "power-to-heat in industry"
  - "COP for industrial heat"
  - "industrial heat pumps"
  - "heat pump for process heat"
  - "electrify industrial heat with heat pumps"
  - "replace industrial gas boilers with heat pumps"
  - "industry low temperature heat"
  - "COP for industry heat"
models:
  - model: pypsa-eur
    version_anchor: {ref: "6128bf7effbe7243bcc46b2770d04cebe45613a5", date: "2026-10-26"}
    out_of_box:
      covers: >
        Indirect only. Industrial low-temperature heat demand is attached in
        add_industry as a "low-temperature heat for industry" Load on the
        urban central (or services urban decentral) heat bus, where the
        district-heating / decentral heat pumps added in add_heat (one
        "{heat_system} {source} heat pump" Link per configured
        sector.heat_pump_sources entry, COP time series from rule
        build_cop_profiles) compete with gas boilers, resistive heaters, CHP
        and solar thermal to serve it — so heat-pump-served industrial low-T
        heat exists out of the box, just not as a dedicated industrial
        technology. There is no industrial heat pump component: industrial
        process heat and steam above the district-heating level are flat
        fuel loads ("gas for industry", "solid biomass for industry", "coal
        for industry", "H2 for industry") with no electric substitute.
      mechanism: >
        rule build_industry_sector_ratios -> build_industrial_energy_demand_per_node
        (per-carrier industrial demand, its "low-temperature heat" column
        routed to heat buses) -> prepare_sector_network::add_industry (in
        rule compose_network) attaches the loads; add_heat builds the
        heat-bus heat pumps whose dispatch may cover the industrial low-T
        share.
      not_covered: >
        By default no industrial (high-temperature) heat pump at any process temperature — no "industrial heat pump high temperature" link, no temperature bands, no supply competition inside industry. On this fork the industry_t temperature bands exist (heat100-200 / heat200-500 / heat500+ industry buses with competing supply links) behind sector.industry_t.endogen, off by default — see the industry-process-heat-endogenous carrier card and the industry-heat-endogenous method. Its heat pump (100-200 °C band only) runs at the catalogue COP with free, unlimited source heat from the environment, draws from the AC node and has no waste-heat source or temperature lift.
      provenance: "scripts/prepare_sector_network.py:low-temperature heat for industry; scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:heat_pump_sources; rules/build_sector.smk:build_cop_profiles; scripts/build_industrial_energy_demand_per_node.py"
    levers:
      - key: sector.heat_pump_sources
        effect: "Which heat-pump sources exist per heat system (air, ground, and for urban central also river/sea/geothermal etc.) — these are the only heat pumps that can serve the industrial low-T heat load."
        default: "{urban central: [air], urban decentral: [air], rural: [air, ground]}"
        provenance: "config/config.default.yaml:heat_pump_sources; scripts/prepare_sector_network.py:heat_pump_sources"
      - key: sector.industry
        effect: "Master switch for all industry demand, including the low-temperature heat load."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
      - key: industry.sector_ratios_fraction_future
        effect: "Exogenous pathway that shifts sector intensities towards electrified best-available ratios — the only lever moving industrial heat away from fuels."
        default: "{2020: 0.0, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
    boundary:
      - variant: "heat pumps serving industrial low-temperature heat via district heating"
        rung: L0
        note: "default — emergent dispatch of the heat-bus heat pumps against the 'low-temperature heat for industry' load"
      - variant: "exogenously electrified industrial heat"
        rung: L1
        note: "raise industry.sector_ratios_fraction_future; no heat pump asset, demand simply moves to 'industry electricity'"
      - variant: "dedicated industrial heat pump for 100-200 °C process heat/steam"
        rung: L0
        note: "sector.industry_t.endogen: true (method industry-heat-endogenous) on this fork adds '<node> heat100-200 industry industrial heat pump high temperature' per node (cost row 'industrial heat pump high temperature', fixed COP, AC node, free source heat) competing with the electric steam boiler, gas and biomass boilers in the 100-200 °C band — industry-process-heat-endogenous"
      - variant: "temperature-dependent industrial COP time series"
        rung: L5
        note: "the build_cop_profiles chain is keyed to heat systems and sources, not industrial processes; a dynamic industrial COP is bespoke on top of the L4 variant"
      - variant: "waste-heat-source industrial heat pumps"
        rung: L5
        note: "no industrial waste-heat source exists to draw from (see waste-heat-recovery carrier card)"
    where:
      - change: "industrial low-temperature heat load placement"
        anchor: "scripts/prepare_sector_network.py::add_industry ('low-temperature heat for industry' Load)"
        provenance: "scripts/prepare_sector_network.py:low-temperature heat for industry"
      - change: "heat-bus heat pumps that can serve it"
        anchor: "scripts/prepare_sector_network.py::add_heat (heat_pump_sources loop)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "heat pump COP profiles"
        anchor: "rule build_cop_profiles (scripts/build_cop_profiles/)"
        provenance: "rules/build_sector.smk:build_cop_profiles"
      - change: "heat pump cost row processing"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs"
        provenance: "scripts/process_cost_data.py:prepare_costs"
    data_dependencies:
      - input: "cost rows for the heat-system heat pumps (looked up per system and source via heat_system.heat_pump_costs_name)"
        required_for: "the heat pumps that serve the industrial low-T heat load"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "JRC-IDEES industrial energy demand + production today"
        required_for: "today's sector intensities, including the low-temperature heat share"
        availability: "must be built (rules build_industrial_energy_demand_per_country_today, build_industrial_production_per_country)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Only the LOW-temperature slice, and only indirectly. add_industry places
        a flat "low-temperature heat for industry" load on each node's
        "urban central heat" bus (fallback "services urban decentral heat").
        Those heat buses are supplied endogenously in add_heat by extendable
        air/ground-sourced heat pumps (time-dependent COP from
        build_cop_profiles, sink temperature sector.heat_pump_sink_T), alongside
        resistive heaters, gas boilers, CHP, solar thermal and water-tank
        storage — so heat pumps CAN win the low-T industrial heat supply by
        optimisation. The size of that load comes from the UNSD "heat" carrier
        rows in the industry totals.
      mechanism: >
        build_base_industry_totals maps UNSD heat commodities to the "heat"
        carrier per industry; build_industry_demand renames it
        "low-temperature heat" and distributes it nodally;
        add_industry attaches the load to heat buses; add_heat adds the
        competing heat-pump/boiler supply on those buses.
      not_covered: >
        No industrial high-temperature heat pump technology exists. All
        medium/high-temperature process heat is embedded in the industry
        gas/coal/oil/biomass fuel loads (fixed exogenous carrier mix) and is not
        servable by any heat pump. COPs are built for sink T = 55C
        (heat_pump_sink_T) — not process-heat temperatures.
      provenance: "scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.heat_pump_sink_T
        effect: "Sink temperature used in build_cop_profiles for the heat-pump COP time series on heat buses."
        default: "55"
        provenance: "config.default.yaml:heat_pump_sink_T"
      - key: sector.time_dep_hp_cop
        effect: "Time-dependent COP (true) vs static costs-table efficiency for the heat pumps serving heat buses."
        default: "true"
        provenance: "config.default.yaml:time_dep_hp_cop"
      - key: sector.boilers
        effect: "Adds the competing resistive heaters and gas boilers on the same heat buses."
        default: "true"
        provenance: "config.default.yaml:boilers"
      - key: sector.tes
        effect: "Water-tank thermal storage on heat buses — lets heat pumps run flexibly against the flat industrial heat load."
        default: "true"
        provenance: "config.default.yaml:tes"
      - key: sector.district_heating.potential
        effect: "Max urban-demand fraction on the central heat bus, which carries the industrial low-T heat load."
        default: "0.3"
        provenance: "config.default.yaml:district_heating"
      - key: sector.enable.industry
        effect: "Gates the low-temperature heat for industry load."
        default: "true"
        provenance: "config.default.yaml:industry"

    boundary:
      - variant: "let heat pumps serve industrial low-temperature heat"
        rung: L0
        note: "already endogenous — heat pumps compete on the heat buses carrying the load."
      - variant: "bias towards heat pumps (COP assumptions, sink temperature)"
        rung: L1
        note: "sector.heat_pump_sink_T + sector.time_dep_hp_cop; disable competitors via sector.boilers/sector.chp/sector.solar_thermal."
      - variant: "grow the low-T industrial heat share (move fuel demand into the heat carrier)"
        rung: L3
        note: >
          Edit the industry totals: shift gas/oil MWh into the 'heat' carrier
          rows via data/custom/industry_demand_{demand}_{planning_horizons}.csv
          (custom_data.industry_demand: true) or by editing
          industry_base_totals in build_industry_demand.
      - variant: "high-temperature industrial heat pump replacing process fuel, exogenous"
        rung: L3
        note: >
          Represent as electrification with an assumed COP: move process-fuel
          MWh into the electricity carrier divided by the COP, in the same
          custom industry demand file. No component needed.
      - variant: "explicit high-T industrial heat pump technology (own link, own COP, competing endogenously)"
        rung: L5
        note: "needs an industrial process-heat bus (does not exist — process heat is inside fuel loads) plus a new heat-pump link; bespoke Python in prepare_sector_network."

    where:
      - change: "industrial low-T heat load placement on heat buses"
        anchor: "add_industry — Load 'low-temperature heat for industry' on urban central heat / services urban decentral heat"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "heat-pump supply on those buses"
        anchor: "add_heat — Links '{name} {heat_pump_type} heat pump' with COP efficiency"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "COP time series"
        anchor: "rule/script build_cop_profiles (reads heat_pump_sink_T)"
        provenance: "scripts/build_cop_profiles.py:heat_pump_sink_T"
      - change: "size of the industrial heat carrier (per-industry heat rows)"
        anchor: "build_industry_demand rename 'heat' -> 'low-temperature heat' (rename_sectors) and industry_base_totals"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "UNSD heat-commodity mapping"
        anchor: "aggregate_fuels('industry') heat category in _helpers"
        provenance: "scripts/_helpers.py:aggregate_fuels"

    data_dependencies:
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "baseline industrial heat carrier rows (often zero for many countries)"
        availability: "must be built; region-dependent — many UNSD balances report no industrial heat"
      - input: "temperature/cutout data for build_cop_profiles"
        required_for: "time-dependent heat-pump COP"
        availability: "must be built (cutout workflow)"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "moving process fuel into heat/electricity carriers"
        availability: "absent — user-supplied"
      - input: "technology-data costs csv (heat pump cost/efficiency rows)"
        required_for: "heat-pump investment costs"
        availability: "must be built (enable.retrieve_cost_data)"
