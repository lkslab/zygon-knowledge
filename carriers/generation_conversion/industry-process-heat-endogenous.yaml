id: industry-process-heat-endogenous
title: Endogenous industrial process heat (temperature bands)
summary: >
  Model-endogenous choice of how industrial process heat is supplied:
  industry heat demand split into temperature bands per node, with competing
  extendable supply technologies (heat pumps, electric boilers, biomass, gas,
  hydrogen — with carbon-capture variants) replacing exogenous fuel shares.
when_to_use:
  - "endogenous industry heat"
  - "let the model choose industrial heat supply"
  - "industrial fuel switching optimisation"
  - "industrial steam and furnace technology competition"
  - "which industries can pick their heat source"
models:
  - model: pypsa-eur
    version_anchor: {ref: "a6c45e5a2d926ba9a5566cba24d905cff9f89939", date: "2026-09-09"}
    out_of_box:
      covers: >
        Nothing — grounded absence at this anchor. Upstream a6c45e5 has no
        endogenous industrial process-heat machinery: no temperature bands,
        no "heatX industry" buses, no competing supply links, no
        sector.industry_t config chapter. Industrial process heat is an
        exogenous per-carrier demand: build_industry_sector_ratios (+ the
        today/future blend in build_industry_sector_ratios_intermediate via
        industry.sector_ratios_fraction_future) yields MWh/t per sector and
        carrier, build_industrial_energy_demand_per_node distributes it, and
        prepare_sector_network::add_industry attaches flat Loads ("gas for
        industry", "solid biomass for industry", "coal for industry", "H2 for
        industry", "industry electricity", "low-temperature heat for
        industry"). Only the low-temperature share is served by network
        components (heat pumps, resistive heaters, boilers, CHP on the
        district-heating / decentral heat bus it lands on). The machinery
        this card is about lived on the fork branch endogenous-industry-heat
        (LukasFrankenQ/resilient-pypsa-eur, commit 849c8858) and is the
        reference implementation for re-adding it; it is not part of this
        anchor.
      mechanism: >
        rule build_industry_sector_ratios -> build_industry_sector_ratios_intermediate
        -> build_industrial_production_per_country(_tomorrow) ->
        build_industrial_energy_demand_per_node -> rule compose_network:
        add_industry attaches the flat loads. Fuel switching only happens
        exogenously through the future sector ratios; the optimiser never
        chooses an industrial heat supply technology.
      not_covered: >
        Everything endogenous: temperature-band demand splitting (Fleiter et
        al. shares), band buses and loads, per-band technology menus (heat
        pumps, electric boilers, biomass/gas steam boilers and direct firing
        with CC twins, hydrogen), must-run duty floors, per-sector opt-in.
        Steel process heat likewise has no supply choice.
      provenance: "scripts/prepare_sector_network.py:add_industry; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future; scripts/build_industrial_energy_demand_per_node.py; scripts/prepare_sector_network.py:low-temperature heat for industry"
    levers: []
    boundary:
      - variant: "endogenous temperature-banded industrial process heat"
        rung: L4
        note: "new rule plumbing: a demand rule splitting each sector's fuel use into temperature bands (Fleiter et al. 2025 supplementary data, not in the upstream data bundle), an endogenous demand block in build_industrial_energy_demand_per_node, band buses/loads/supply links in add_industry, a sector.industry_t config chapter and cost rows for the band technologies; port from the fork branch endogenous-industry-heat (commit 849c8858)"
    where:
      - change: "where band buses, loads and supply links would be added"
        anchor: "scripts/prepare_sector_network.py::add_industry (flat industry loads)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "where per-node demand blocks are assembled"
        anchor: "scripts/build_industrial_energy_demand_per_node.py (rule build_industrial_energy_demand_per_node)"
        provenance: "scripts/build_industrial_energy_demand_per_node.py; rules/build_sector.smk:build_industrial_energy_demand_per_node"
      - change: "band technology cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs; data/custom_costs.csv (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:prepare_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "industrial energy demand per country today + industrial production per country (JRC-IDEES chain)"
        required_for: "today's intensities any band split would start from"
        availability: "must be built (rules build_industrial_energy_demand_per_country_today, build_industrial_production_per_country; JRC-IDEES retrieved)"
      - input: "process temperature-band shares per sector (e.g. Fleiter et al. 2025 supplementary xlsx)"
        required_for: "temperature-band split"
        availability: "absent from upstream — ships only on the fork branch"
      - input: "cost rows for band supply technologies (steam boilers, direct firing, electric boiler steam, industrial heat pump high temperature)"
        required_for: "band supply links"
        availability: "exists in technology-data via retrieve_cost_data + rule process_cost_data; unused upstream"
