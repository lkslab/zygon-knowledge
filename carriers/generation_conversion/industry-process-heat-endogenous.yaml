id: industry-process-heat-endogenous
title: Endogenous industrial process heat (industry_heat temperature bands)
summary: >
  Model-endogenous choice of how industrial process heat is supplied:
  industry heat demand split into temperature bands per node, with competing
  extendable supply technologies (heat pumps, electric boilers, biomass, gas,
  hydrogen, with carbon-capture variants) replacing exogenous fuel shares.
when_to_use:
  - "endogenous industry heat"
  - "industry_heat / industry temperature bands"
  - "let the model choose industrial heat supply"
  - "industrial fuel switching optimisation"
  - "heat100-200 / heat200-500 / heat500+ industry"
  - "industry_heat exclude_sectors / min_part_load"
  - "industrial steam and furnace technology competition"
  - "which industries can pick their heat source"
models:
  - model: pypsa-eur
    version_anchor: {ref: "ee7c6d86e475ee17a6af6d49ebf5ba8118b16723", date: "2026-11-24"}
    out_of_box:
      covers: >
        Upstream feature (PyPSA/pypsa-eur#1943), OFF by default
        (sector.industry_heat.enable: false; the method
        industry-heat-endogenous turns it on). Demand side: the horizon-free
        rule build_industry_sector_ratios_endogenous takes TODAY'S country
        intensities (industrial energy demand today / production today,
        JRC-IDEES chain) and, for every subsector in
        data/industry_heat_temperature_shares.csv not listed in
        sector.industry_heat.exclude_sectors (the 18 rows are aluminium
        primary/secondary, alumina, other non-ferrous, HVC, cement, ceramics,
        glass, pulp, paper, printing, food, pharma, transport equipment,
        machinery, wood, textiles, other industrial sectors; pulp is excluded
        by default because it burns its own by-products), sums all fuel and
        purchased-heat inputs (solid, liquid, gas, heat, biomass, waste,
        other) and splits them into four temperature bands with the CSV's
        EU-wide shares. Electricity keeps today's ratio, coal, coke, biomass,
        methane, hydrogen and naphtha become zero. HVC liquids are feedstock,
        not heat, and keep their exogenous naphtha; the natural gas of ammonia
        SMR (industry.MWh_CH4_per_tNH3_SMR) is taken out of the HVC gas first.
        The band demand is fuel input, so it overstates useful heat by today's
        boiler and furnace losses. heat<100 folds into the existing
        "low-temperature heat for industry" load on the heat bus.
        build_industrial_energy_demand_per_node reads these ratios only when
        enable is true and overwrites the horizon's exogenous ratios of the
        covered subsectors with them; rows the endogenous table does not
        carry (process emission, process emission from feedstock, methanol,
        ammonia) keep their exogenous values. Supply side: add_industry calls
        add_industry_heat, which per band in sector.industry_heat.technologies
        creates a "heatX industry" Bus, a flat Load ("<node> heatX industry
        demand") and extendable supply Links named "<node> heatX industry
        <technology>": 100-200 °C solid biomass steam boiler, gas steam
        boiler, industrial high-temperature heat pump (fixed COP from the cost
        row, excess heat assumed as source), electric steam boiler; 200-500 °C
        solid biomass direct firing (with pelletizing cost), gas direct
        firing, hydrogen firing; 500+ °C gas direct firing, hydrogen firing.
        Solid biomass and gas links also get a "... CC" twin when
        industry.solid_biomass_for_industry_cc / industry.gas_for_industry_cc
        are on (both default true), priced from the "biomass CHP capture"
        rows, taking capture heat from the plant and electricity from the
        node. Biomass links draw from the spatial solid-biomass buses and so
        sit under the "biomass limit" (sector.biomass must be on, or
        add_industry raises); gas links from the spatial gas buses and emit
        to co2 atmosphere; hydrogen links from the nodal H2 bus. Every link
        carries p_min_pu = sector.industry_heat.min_part_load (0.8). The heat
        pump and electric boiler take electricity from the node's low-voltage
        bus when the distribution grid is modelled. Non-covered subsectors and
        steel keep the flat fuel loads. Under foresight myopic, add_brownfield
        fixes inherited band links at their built capacity and sets their
        p_min_pu to 0, so they may idle when demand falls or an emission limit
        binds.
      mechanism: >
        rules build_industrial_energy_demand_per_country_today +
        build_industrial_production_per_country -> rule
        build_industry_sector_ratios_endogenous (params exclude_sectors,
        gas_per_ammonia; input data/industry_heat_temperature_shares.csv) ->
        rule build_industrial_energy_demand_per_node (input
        industry_sector_ratios_endogenous only with industry_heat.enable) ->
        rule compose_network: add_industry calls add_industry_heat, then
        attaches the remaining flat loads as usual; add_brownfield releases
        the minimum part load of inherited band links.
      not_covered: >
        Steel is entirely outside the machinery (the shares file has no steel
        row): integrated, EAF and DRI routes stay exogenous here, and "DRI +
        Electric arc", "HVC (mechanical recycling)" and "HVC (chemical
        recycling)" keep their exogenous ratios. With
        sector.endogenous_sectors set (steel-routes-endogenous,
        cement-routes-endogenous) build_industrial_energy_demand_per_node
        zeroes "Integrated steelworks", "DRI + Electric arc" and "Cement"
        after the band overwrite, so steel and cement leave the heat bands
        (no double count): the cement kiln heat is then served on its own
        "cement heat" bus (solid biomass, gas, waste) and the primary steel
        heat sits inside the route links' intensities. IMPORTANT interaction:
        covered subsectors are rebuilt from today's intensities for every
        carrier (electricity, the heat bands), so the
        industry.sector_ratios_fraction_future efficiency/electrification
        blend NO LONGER applies to them; progress must come from the band
        supply links, and their electricity demand is today's, not the
        transformed one. No electric option above 200 °C (no electric
        furnace or kiln). The hydrogen links in both upper bands are priced
        with a placeholder (code TODO: 10x the gas steam boiler or gas direct
        firing cost). min_part_load is one global scalar across all bands and
        technologies. The industrial heat pump takes its source heat for free
        and without limit, at the catalogue COP (no temperature lift, no
        waste-heat bus). Band loads are flat (annual total / 8760, which
        equals the snapshot-weighting sum on full-year runs); there is no
        industrial heat store on the band buses. No existing heat supply is
        added, so the first myopic horizon builds all of today's industrial
        heat supply from scratch. Varying any sector.industry_heat key per
        scenario is valid but makes the app rebuild the resources per
        scenario (sector.* is a base-shared chapter), since exclude_sectors
        is read by a horizon-free rule.
      provenance: "scripts/build_industry_sector_ratios_endogenous.py:build_industry_sector_ratios_endogenous; scripts/prepare_sector_network.py:add_industry_heat; scripts/build_industrial_energy_demand_per_node.py:industry_sector_ratios_endogenous; scripts/add_brownfield.py:industry_heat; rules/build_sector.smk:build_industry_sector_ratios_endogenous; scripts/lib/validation/config/sector.py:_IndustryHeatConfig; doc/release_notes.md:industry_heat"
    levers:
      - key: sector.industry_heat.enable
        effect: "Master switch: true builds the endogenous ratios, overwrites the covered subsectors' demand and adds the band buses/loads/technologies; false keeps the classic exogenous fuel-share treatment."
        default: "false"
        provenance: "config/config.default.yaml:industry_heat; scripts/prepare_sector_network.py:add_industry_heat"
      - key: sector.industry_heat.min_part_load
        effect: "p_min_pu on every newly built band supply link. 0.8 forces near-baseload operation of built capacity (limits seasonal fuel switching and overbuilding); applies globally. Inherited links in myopic runs get 0."
        default: "0.8"
        provenance: "config/config.default.yaml:min_part_load; scripts/prepare_sector_network.py:min_part_load"
      - key: sector.industry_heat.exclude_sectors
        effect: "Subsectors of data/industry_heat_temperature_shares.csv that keep their exogenous fuel shares. Steel, HVC recycling and DRI are not in the file and can NOT be covered. Read by a horizon-free rule: a per-scenario change rebuilds the resources."
        default: "[Pulp production]"
        provenance: "config/config.default.yaml:exclude_sectors; rules/build_sector.smk:exclude_sectors"
      - key: sector.industry_heat.technologies
        effect: "Tech menu per band as lists: heat100-200 allows solid biomass, gas, heat pump, electric boiler; heat200-500 solid biomass, gas, hydrogen; heat500+ gas, hydrogen. Heat pumps and electric boilers only work in heat100-200. A band left out of the dict gets no bus or load, so its demand is silently dropped."
        default: "{heat100-200: [solid biomass, gas, heat pump, electric boiler], heat200-500: [solid biomass, gas, hydrogen], heat500+: [gas, hydrogen]}"
        provenance: "config/config.default.yaml:technologies; scripts/prepare_sector_network.py:add_industry_heat"
      - key: industry.solid_biomass_for_industry_cc / industry.gas_for_industry_cc
        effect: "Also gate the CC twins of the solid biomass and gas band links (as they do for the flat industry fuels)."
        default: "true / true"
        provenance: "config/config.default.yaml:solid_biomass_for_industry_cc; config/config.default.yaml:gas_for_industry_cc"
      - key: sector.industry
        effect: "Industry master switch, gates add_industry and thus the whole machinery."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
      - key: costs.overwrites
        effect: "Override the band technology cost rows (solid biomass boiler steam, gas boiler steam, direct firing gas, direct firing solid fuels, electric boiler steam, industrial heat pump high temperature) in prepare_costs."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "turn on endogenous industrial heat supply"
        rung: L0
        note: "sector.industry_heat.enable: true, the method industry-heat-endogenous; everything else defaults sensibly"
      - variant: "endogenise only selected industries"
        rung: L1
        note: "list the subsectors to leave exogenous in sector.industry_heat.exclude_sectors (base config, not per scenario, unless the resources may be rebuilt per scenario); [] also covers pulp"
      - variant: "restrict or extend a band's technology menu"
        rung: L1
        note: "edit the band's list in sector.industry_heat.technologies (e.g. forbid gas in heat100-200 by dropping gas, which also removes its CC twin)"
      - variant: "band CC twins off"
        rung: L1
        note: "industry.solid_biomass_for_industry_cc / gas_for_industry_cc: false, which also removes the CC options of the flat industry fuels"
      - variant: "flexible operation (lower minimum part load)"
        rung: L1
        note: "sector.industry_heat.min_part_load, one global value; per-band or per-tech values need an edit in add_industry_heat (L2)"
      - variant: "new technology in a band (MVR, electric furnace, biomass 500+ °C)"
        rung: L2
        note: "add an entry to the supply dict in add_industry_heat and to the allowed literals of sector.industry_heat.technologies in the config validation; cost row via data/custom_costs.csv if missing (L3). solid biomass in heat500+ is already allowed by config and uses direct firing solid fuels (L1)"
      - variant: "geothermal heat in the 100-200 °C band"
        rung: L0
        note: "not a band technology: sector.enhanced_geothermal.industry_heat.enable (with sector.enhanced_geothermal.enable) adds a 'geothermal industry heat' Link per region from the EGS surface heat into '<bus> heat100-200 industry'. The industry_heat levers, boundary row and asserts live on the enhanced-geothermal card; nothing above 200 °C (150 °C wellhead floor)"
      - variant: "proper hydrogen combustion costs (replace the 10x-gas placeholder)"
        rung: L3
        note: "provide a dedicated cost row and swap the cost_factor = 10 lookup in add_industry_heat (L2 for the code part)"
      - variant: "different temperature-band shares for a sector"
        rung: L3
        note: "edit the row in data/industry_heat_temperature_shares.csv (rows are normalised to sum 1); a country-specific split needs code in build_industry_sector_ratios_endogenous (L2)"
      - variant: "endogenise steel heat"
        rung: L5
        note: "not a band question any more: with sector.endogenous_sectors containing steel the primary steel heat is inside the route links (BOF coal, DRI reduction agent, EAF electricity at technology-data intensities), and the steel route is chosen there ([[steel-routes-endogenous]]); splitting it into bands as well would double count. Band-resolved heat for secondary EAF steel would need a steel row in the shares file and code for the electric arc demand. Bespoke"
      - variant: "keep cement in the bands while steel and cement routes are endogenous"
        rung: L1
        note: "build_industrial_energy_demand_per_node zeroes Cement whenever cement is in sector.endogenous_sectors; list only steel there to keep cement in the bands with the exogenous kiln"
      - variant: "future efficiency progress for covered sectors' band demand"
        rung: L2
        note: "endogenous ratios are today-based; blending towards future intensities (as the intermediate rule does for exogenous) needs an edit in build_industry_sector_ratios_endogenous"
      - variant: "industrial heat pump lifting heat from a lower band or a waste-heat bus"
        rung: L2
        note: "the heat pump's bus0 is the electricity node and its source heat is free; a second input bus (urban central heat, an electrolysis waste-heat bus) with a lift-dependent COP is an edit in add_industry_heat"
      - variant: "existing industrial heat supply in the first myopic horizon"
        rung: L2
        note: "add_industry_heat adds extendable links only; existing boilers and furnaces would need brownfield capacities from a new input"
      - variant: "hourly-resolved (non-flat) band demand profiles"
        rung: L5
        note: "band Loads are annual/8760 constants; only industry electricity has an hourly profile (industry.temporal_electricity_industry_load), nothing exists for heat"
    where:
      - change: "band demand construction, temperature shares, feedstock handling"
        anchor: "scripts/build_industry_sector_ratios_endogenous.py (rule build_industry_sector_ratios_endogenous); data/industry_heat_temperature_shares.csv"
        provenance: "scripts/build_industry_sector_ratios_endogenous.py:build_industry_sector_ratios_endogenous; rules/build_sector.smk:build_industry_sector_ratios_endogenous"
      - change: "overwriting the covered subsectors' horizon ratios with the endogenous ones"
        anchor: "scripts/build_industrial_energy_demand_per_node.py (rule build_industrial_energy_demand_per_node)"
        provenance: "scripts/build_industrial_energy_demand_per_node.py:industry_sector_ratios_endogenous"
      - change: "band buses, loads and supply technology links"
        anchor: "scripts/prepare_sector_network.py::add_industry_heat (called from add_industry)"
        provenance: "scripts/prepare_sector_network.py:add_industry_heat; scripts/prepare_sector_network.py:add_industry"
      - change: "electricity wiring of the band's electric options (moved to the low-voltage bus)"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "myopic carry-over of inherited band links (fixed capacity, p_min_pu 0)"
        anchor: "scripts/add_brownfield.py::add_brownfield"
        provenance: "scripts/add_brownfield.py:add_brownfield"
      - change: "band technology cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs; data/custom_costs.csv (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:prepare_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "data/industry_heat_temperature_shares.csv (share of heat<100, 100-200, 200-500, 500+ per subsector, mostly Fleiter et al. 2025, source column per row)"
        required_for: "temperature-band split of the covered subsectors (EU-wide shares, no country dimension)"
        availability: "exists by default (checked into the repo)"
      - input: "industrial energy demand per country today + industrial production per country (JRC-IDEES chain)"
        required_for: "today's intensities the bands are derived from"
        availability: "must be built (rules build_industrial_energy_demand_per_country_today, build_industrial_production_per_country; JRC-IDEES retrieved; non-EU27 selections take the EU27-aggregate basis)"
      - input: "cost rows: solid biomass boiler steam, gas boiler steam, direct firing gas, direct firing solid fuels, electric boiler steam, industrial heat pump high temperature, biomass CHP capture, biomass boiler (pelletizing cost)"
        required_for: "band supply technologies and their CC twins"
        availability: "exists by default via retrieve_costs + rule process_cost_data"
      - input: "spatial gas and biomass nodes, nodal H2 buses, co2 stored buses"
        required_for: "band link fuel inputs and CC outputs"
        availability: "exists by default in sector runs"
