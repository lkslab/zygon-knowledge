id: inert-anode-aluminium
title: Inert-anode aluminium
summary: >
  Aluminium smelting with inert (non-carbon) anodes, eliminating the process
  CO2 from consumable carbon anodes in Hall-Heroult electrolysis.
when_to_use:
  - "inert anode aluminium"
  - "carbon-free aluminium smelting"
  - "green aluminium"
  - "aluminium process emissions"
  - "decarbonise aluminium"
  - "primary vs secondary aluminium"
  - "aluminium smelter electricity"
  - "Al_primary_fraction"
  - "non-ferrous metals demand"
models:
  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        Aluminium is a well-resolved exogenous demand sector, but no
        inert-anode option exists. build_industry_sector_ratios::
        non_ferrous_metals builds three sectors from JRC-IDEES: "Alumina
        production" (high-enthalpy heat to methane, refining electrified),
        "Aluminium - primary production" (explicit "Aluminium electrolysis
        (smelting)" electricity plus electrified processing/finishing, and a
        process-emission intensity in tCO2/t from the IDEES emissions sheet —
        this row is where carbon-anode CO2 lives) and the fully electric
        "Aluminium - secondary production". The route lever is
        industry.Al_primary_fraction (default 0.4 in 2020 -> 0.2 in 2050):
        build_industrial_production_per_country_tomorrow shifts production
        from primary to secondary, which zeroes anode emissions per shifted
        tonne as a side effect. Primary-route process emissions join the
        nodal "process emissions" Load in add_industry, where they are
        vented or captured by the unconditional "process emissions CC" link.
        Aluminium and alumina heat are flat exogenous fuel loads like every
        other sector's (no temperature bands, no fuel choice).
      mechanism: >
        rule build_industry_sector_ratios (non_ferrous_metals) -> rule
        build_industrial_production_per_country_tomorrow (Al_primary_fraction
        split) -> rule build_industrial_distribution_key (hotmaps
        "Non-ferrous metals" emission-weighted keys; no dedicated aluminium
        plant database) -> rule build_industrial_energy_demand_per_node ->
        add_industry ("industry electricity" load, "process emissions" load).
      not_covered: >
        No anode representation of any kind: no inert-anode technology, cost
        row, or config key; no endogenous choice between carbon and inert
        anodes; no PFC emissions (only CO2). Inert anodes can only be
        represented by editing the primary-aluminium process-emission
        intensity in code (or post-processing the sector-ratios resource) —
        note the future ratio blends with today's country values via
        industry.sector_ratios_fraction_future, so both ends may need
        touching. Smelters have no capacity, flexibility or modulation
        (aluminium electricity is part of the flat "industry electricity"
        load — no smelter demand response). Aluminium production tonnage has
        no growth/decline lever beyond the primary/secondary split.
      provenance: "scripts/build_industry_sector_ratios.py:non_ferrous_metals; scripts/build_industry_sector_ratios.py:Aluminium electrolysis (smelting); scripts/build_industrial_production_per_country_tomorrow.py:Al_primary_fraction; scripts/prepare_sector_network.py:process emissions CC"
    levers:
      - key: industry.Al_primary_fraction
        effect: "Per-horizon fraction of aluminium from the primary (smelting) route — the only lever acting on anode-related process emissions (by shrinking the primary route)."
        default: "{2020: 0.4, 2025: 0.375, 2030: 0.35, 2035: 0.325, 2040: 0.3, 2045: 0.25, 2050: 0.2}"
        provenance: "config/config.default.yaml:Al_primary_fraction; scripts/build_industrial_production_per_country_tomorrow.py:Al_primary_fraction"
      - key: industry.sector_ratios_fraction_future
        effect: "Blend of today's vs future aluminium intensities (energy and process emissions alike)."
        default: "{2020: 0.0, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: sector.co2_sequestration_potential
        effect: "Cap on stored CO2 — bounds how much captured aluminium process CO2 the 'process emissions CC' route can absorb."
        default: "{2030: 40, ..., 2050: 250} (MtCO2/a; 0 before 2030)"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
    boundary:
      - variant: "shrink anode emissions by shifting to secondary aluminium"
        rung: L1
        note: "lower industry.Al_primary_fraction — the only config-level handle"
      - variant: "capture aluminium process emissions"
        rung: L0
        note: "endogenous by default via the 'process emissions CC' link (note: process emissions are pooled across industries per node — no aluminium-specific capture decision)"
      - variant: "inert anodes: zero the process-emission intensity of primary aluminium"
        rung: L2
        note: "no config key — edit the 'process emission' assignment in the 'Aluminium - primary production' block of non_ferrous_metals (build_industry_sector_ratios.py); today's country values entering via the intermediate blend need handling too (set sector_ratios_fraction_future to 1 for a clean cut, or post-process the ratios CSV, L3)"
      - variant: "inert anodes with changed electricity intensity and phase-in year"
        rung: L2
        note: "same anchor: adjust elec rows alongside the emission row, keyed on the planning horizon via the params already passed to the script"
      - variant: "endogenous carbon-anode vs inert-anode competition"
        rung: L5
        note: "needs aluminium as a material bus with competing smelter Links and an inert-anode cost row — no material-flow structure exists"
      - variant: "smelter demand response / modulation"
        rung: L5
        note: "aluminium electricity is inside the flat 'industry electricity' Load; flexibility needs a bespoke demand model"
      - variant: "site aluminium at real smelter locations"
        rung: L2
        note: "distribution uses hotmaps 'Non-ferrous metals' emission weights, not an aluminium plant list; adding one means a new database branch in build_industrial_distribution_key (plus the data, L3)"
    where:
      - change: "primary/secondary/alumina intensities and the anode process-emission row"
        anchor: "scripts/build_industry_sector_ratios.py::non_ferrous_metals"
        provenance: "scripts/build_industry_sector_ratios.py:non_ferrous_metals"
      - change: "primary/secondary route split"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py (Al_primary_fraction block)"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:Al_primary_fraction"
      - change: "process emission venting/capture"
        anchor: "scripts/prepare_sector_network.py::add_industry ('process emissions' links)"
        provenance: "scripts/prepare_sector_network.py:process emissions CC"
      - change: "aluminium spatial distribution"
        anchor: "scripts/build_industrial_distribution_key.py::build_nodal_distribution_key (hotmaps sectors incl. Non-ferrous metals)"
        provenance: "scripts/build_industrial_distribution_key.py:build_nodal_distribution_key"
    data_dependencies:
      - input: "JRC-IDEES Non Ferrous Metals sheets (fec/ued/emi, incl. Aluminium electrolysis rows)"
        required_for: "aluminium intensities and process emissions"
        availability: "retrieved by the workflow (rule retrieve_jrc_idees)"
      - input: "hotmaps industrial sites database (Non-ferrous metals subsector)"
        required_for: "nodal distribution of aluminium demand"
        availability: "retrieved by the workflow (rule retrieve_hotmaps_industrial_sites)"
      - input: "inert-anode technology cost/intensity data"
        required_for: "any explicit inert-anode representation"
        availability: "absent — would have to be sourced"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Aluminium only inside the aggregate UNSD industry "non-ferrous metals":
        fuel/electricity demand per carrier from UNSD balances, plus aluminium
        process emissions computed in build_industry_demand as country
        production from data/AL_production.csv (year selected by
        demand_data.aluminium_year) x 1.5 tCO2/t (emission_factors
        "non-ferrous metals", noted 'taken from Aluminum primary') x 1000.
        Unlike steel/cement, aluminium emissions are production-based and NOT
        scaled by sector.industry_util_factor. Countries missing from
        AL_production.csv are warned about and filled with 0. Process emissions
        join the per-node "process emissions" load in add_industry (vent or CC).
      mechanism: >
        build_industry_demand: AL_prod_tom = AL_production.csv filtered by
        aluminium_year, AL_emissions = production x emission factor, written into
        industry_base_totals (country, 'process emissions') for
        'non-ferrous metals'; nodal distribution via the industrial distribution
        key (GDP fallback — no aluminium plant database exists, though
        'Aluminium' is an accepted technology label in the distribution-key
        mapping).
      not_covered: >
        No smelter technology, no anode representation, no endogenous
        conventional-vs-inert-anode choice, no aluminium-specific electricity
        intensity (electricity sits in the aggregate non-ferrous metals rows).
        Inert anodes can only be represented by zeroing/reducing the process
        emission factor or the production data exogenously.
      provenance: "scripts/build_industry_demand.py:emission_factors"

    levers:
      - key: demand_data.aluminium_year
        effect: "Selects the production year read from data/AL_production.csv."
        default: "2019"
        provenance: "config.default.yaml:aluminium_year"
      - key: sector.cc
        effect: "Enables 'process emissions CC' capture of aluminium process CO2 (endogenous alternative)."
        default: "true"
        provenance: "config.default.yaml:cc"
      - key: custom_data.industry_demand
        effect: "Custom industry demand csv — impose non-ferrous metals carrier mix and process-emission rows directly."
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: sector.enable.industry
        effect: "Gates industry loads including aluminium process emissions."
        default: "true"
        provenance: "config.default.yaml:industry"

    boundary:
      - variant: "zero aluminium process emissions (full inert-anode fleet)"
        rung: L2
        note: "set emission_factors['non-ferrous metals'] to ~0 in build_industry_demand (or drop the AL_emissions assignment); cleanest single edit."
      - variant: "partial inert-anode penetration by year/scenario"
        rung: L3
        note: >
          Edit data/AL_production.csv (scale the conventional production rows)
          or supply custom process-emission rows via
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with
          custom_data.industry_demand: true.
      - variant: "add the extra electricity demand of inert-anode cells"
        rung: L3
        note: "increase the electricity row of the 'non-ferrous metals' column in the custom industry demand csv."
      - variant: "country not in AL_production.csv (production silently 0)"
        rung: L3
        note: "append the country row to data/AL_production.csv — 41 countries covered (e.g. AE AR AU AZ BA BH BR CA CM CN DE EG ES FR GB GH GR ID IN IR IS KZ ME MY MZ NL NO NZ OM QA RO RU SA SE SI SK TJ TR US VE ZA)."
      - variant: "endogenous smelter technology choice (Hall-Heroult vs inert anode)"
        rung: L5
        note: "requires an aluminium-output bus with competing smelter links — nothing exists; bespoke Python in prepare_sector_network."

    where:
      - change: "aluminium process-emission calculation"
        anchor: "build_industry_demand — AL_prod_tom / AL_emissions using emission_factors['non-ferrous metals']"
        provenance: "scripts/build_industry_demand.py:emission_factors"
      - change: "production data"
        anchor: "data/AL_production.csv (columns country, production[ktons/a], Year, source)"
        provenance: "scripts/build_industry_demand.py:aluminium_year"
      - change: "process-emission vent/capture in the network"
        anchor: "add_industry — 'process emissions' bus/Load and 'process emissions CC' link"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "spatial placement of non-ferrous demand"
        anchor: "build_nodal_distribution_key ('Aluminium' -> 'non-ferrous metals' mapping; GDP fallback since no aluminium plants in the default database)"
        provenance: "scripts/build_industrial_distribution_key.py:match_technology"

    data_dependencies:
      - input: "data/AL_production.csv"
        required_for: "aluminium production and hence process emissions"
        availability: "exists by default but region-dependent — only ~41 countries; missing countries filled with 0"
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "non-ferrous metals fuel/electricity baseline"
        availability: "must be built; region-dependent"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "imposed inert-anode scenario rows"
        availability: "absent — user-supplied"
