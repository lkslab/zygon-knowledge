id: landfill-gas
title: Landfill-gas capture
summary: >
  Capturing methane emitted by landfills and using it for energy (or flaring
  it), turning a waste-methane stream into a usable gas resource.
when_to_use:
  - "landfill gas"
  - "LFG capture / landfill methane"
  - "waste dump gas to power"
  - "municipal solid waste methane recovery"
  - "flare or use landfill emissions"
  - "biogenic methane from waste sites"
  - "ENSPRESO biogas as a proxy for landfill gas"
models:
  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        Nothing as a distinct source. "landfill" does not appear anywhere in
        the sector workflow, the biomass potentials script, or the config as
        an energy carrier (the only occurrences are unrelated: HVC-to-landfill
        sequestration in the industry config, and landfill place-names in the
        powerplantmatching / hotmaps data). The nearest existing machinery is
        the biogas chain: add_biomass builds "biogas" buses whose potential
        comes from the ENSPRESO commodities "Manure solid, liquid" and
        "Sludge" (biomass.classes.biogas) and a "biogas to gas" upgrading Link
        into the gas buses (see the biogas-anaerobic-digestion carrier card).
        Landfill gas is biogenic methane and can be folded into that biogas
        carrier since both are treated as a generic biogenic-gas resource
        upgraded to grid methane. CRUCIALLY, unlike a model that exposes a
        single biogas-potential scalar, pypsa-eur derives the biogas potential
        per region from the ENSPRESO spreadsheet and landfill gas is NOT one
        of the ENSPRESO commodities — so folding LFG in is a DATA edit to the
        computed potentials, not a config flip. Municipal solid waste (the
        material landfill gas comes from) is its own separate carrier handled
        by the waste sector (its potential joins the waste bus only with
        waste.waste_to_energy or waste.waste_to_energy_cc, both default false;
        see waste-to-energy) — cross-note only, it does not model landfill
        methane generation.
      mechanism: >
        No landfill-specific mechanism exists. rule build_biomass_potentials
        computes the "biogas" column from ENSPRESO (manure + sludge); rule
        prepare_sector_network's add_biomass turns that column into the biogas
        Store/Generator + "biogas to gas" upgrading Link. Any LFG
        representation attaches to that biogas Store/Link pair, or to the "co2
        atmosphere" bus created in add_co2_tracking for emission accounting.
      not_covered: >
        No landfill sites, no methane-generation (first-order-decay) curves,
        no capture-efficiency or flaring representation, and no avoided-
        methane-emission credit — the model's CO2 accounting has no CH4/GWP
        concept (see the methane-abatement carrier card). Folding LFG into biogas
        gives it the biogas fuel cost and the upgrading-to-gas route and
        nothing landfill-specific; because ENSPRESO has no landfill commodity,
        there is no scenario key that scales an LFG resource, and adding a
        commodity name to biomass.classes cannot conjure LFG data that is not
        in the ENSPRESO spreadsheet.
      provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:biogas to gas; scripts/build_biomass_potentials.py:enspreso_biomass_potentials; scripts/prepare_sector_network.py:add_co2_tracking"
    levers:
      - key: sector.biomass
        effect: "Master gate for the biogas machinery that would host any folded-in landfill gas (add_biomass only runs when true)."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biogas_upgrading
        effect: "The sink: the 'biogas to gas' Link that upgrades biogas (including any LFG folded into it) into the gas network as biomethane."
        default: "true"
        provenance: "config/config.default.yaml:biogas_upgrading; scripts/prepare_sector_network.py:biogas to gas"
      - key: biomass.classes
        effect: "Maps ENSPRESO commodities into the biogas carrier; note it CANNOT introduce landfill gas because LFG is not an ENSPRESO commodity — this is the boundary that forces LFG to be a data edit rather than a config change."
        default: "biogas: [Manure solid, liquid; Sludge]"
        provenance: "config/config.default.yaml:classes; scripts/build_biomass_potentials.py:grouper"
    boundary:
      - variant: "fold estimated LFG energy into the modelled biogas supply"
        rung: L3
        note: "add the recoverable LFG energy (MWh/a per region) to the 'biogas' column of the biomass_potentials CSV (or its unsustainable-biogas column) — a DATA edit, because pypsa-eur has no biogas-potential scalar and LFG is absent from ENSPRESO (contrast a scalar-potential model where this is L1)"
      - variant: "distinct 'landfill gas' carrier with its own cost/potential"
        rung: L2
        note: "duplicate the biogas Store/Generator + 'biogas to gas' Link pattern in add_biomass under a new carrier reading an LFG potential column; needs a cost row"
      - variant: "site-level LFG with per-node capture capacities"
        rung: L3
        note: "needs a landfill-inventory dataset mapped to the clustered regions, plus the L2 edit to consume it in place of the equal ENSPRESO-derived distribution"
      - variant: "direct LFG-to-power engine (not via the gas grid)"
        rung: L2
        note: "no biogas/LFG engine link exists; add an LFG -> AC Link in add_biomass beside the upgrading Link; needs a cost row"
      - variant: "avoided-methane credit for captured LFG (CO2e accounting)"
        rung: L5
        note: "the co2 atmosphere accounting has no CH4/GWP term; crediting capture requires bespoke emission terms on the new links (cf. methane-abatement carrier card)"
    where:
      - change: "fold LFG into the biogas potential (data route)"
        anchor: "biomass_potentials_{horizon}.csv 'biogas' column, produced by rule build_biomass_potentials (scripts/build_biomass_potentials.py)"
        provenance: "rules/build_sector.smk:build_biomass_potentials; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
      - change: "new LFG carrier / per-site capacities / direct-use engine"
        anchor: "scripts/prepare_sector_network.py::add_biomass (biogas Store and 'biogas to gas' Link as the template)"
        provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:biogas to gas"
      - change: "atmospheric accounting for any avoided-emission credit"
        anchor: "scripts/prepare_sector_network.py::add_co2_tracking ('co2 atmosphere' bus/store)"
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking"
    data_dependencies:
      - input: "landfill inventory / LFG generation estimates for the target region"
        required_for: "any LFG variant (there is no ENSPRESO or default source for it)"
        availability: "absent — must be supplied by the user"
      - input: "cost rows 'biogas' / 'biogas upgrading'"
        required_for: "reusing the biogas route for LFG"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "biomass_potentials CSV + per-node gas buses"
        required_for: "hosting the folded-in resource and its upgraded output"
        availability: "exists by default in sector runs (rule build_biomass_potentials + gas network chain)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing as a distinct source — "landfill" does not appear anywhere in the
        workflow. The nearest existing machinery is the biogas chain: add_biomass
        builds per-node "biogas" Stores sized by the exogenous scalar
        sector.biogas_potential and a "biogas to gas" upgrading Link into the gas
        buses (see the biogas-anaerobic-digestion carrier card). Landfill gas can be folded
        into that potential since both are treated as a generic finite biogenic-gas
        resource.
      mechanism: >-
        No landfill-specific mechanism exists. The biogas Store/Link pair in
        prepare_sector_network.py:add_biomass is the anchor any LFG representation
        attaches to.
      not_covered: >-
        No landfill sites, no methane-generation curves, no capture-efficiency or
        flaring representation, and no avoided-methane-emission credit (the model
        accounts CO2 only — see the methane-abatement carrier card). Folding LFG into
        biogas gives it the biogas fuel cost and upgrading route, nothing
        landfill-specific.
      provenance: "scripts/prepare_sector_network.py:add_biomass"
    levers:
      - key: sector.biogas_potential
        effect: "The only handle: add the recoverable landfill-gas energy (TWh/a) to this scalar to make LFG usable by the model."
        default: "0.5"
        provenance: "config.default.yaml:biogas_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.enable.biomass
        effect: "Gates the biogas machinery that would host the LFG resource."
        default: "true"
        provenance: "config.default.yaml:biomass ; scripts/prepare_sector_network.py:add_biomass"
    boundary:
      - variant: "Fold estimated LFG energy into the modelled gas supply"
        rung: L1
        note: "Set sector.biogas_potential to (existing biogas + LFG) TWh/a — a specific non-default value; no code."
      - variant: "Distinct 'landfill gas' carrier with its own cost/potential"
        rung: L2
        note: "Duplicate the biogas Store + upgrading Link pattern in add_biomass under a new carrier; needs a cost row."
      - variant: "Site-level LFG with per-node capture capacities"
        rung: L3
        note: "Needs a landfill inventory dataset mapped to nodes, plus the L2 edit to consume it (replacing the equal split)."
      - variant: "Avoided-methane credit for captured LFG (CO2e accounting)"
        rung: L5
        note: "The CO2 accounting has no CH4/GWP concept; crediting capture requires bespoke emission terms on the new links (cf. methane-abatement carrier card)."
    where:
      - change: "New LFG carrier / per-site capacities / credit terms"
        anchor: "scripts/prepare_sector_network.py function add_biomass (biogas Store and 'biogas to gas' Link as the template)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "Atmospheric accounting for any avoided-emission credit"
        anchor: "scripts/prepare_sector_network.py function add_co2 ('co2 atmosphere' bus/store)"
        provenance: "scripts/prepare_sector_network.py:add_co2"
    data_dependencies:
      - input: "Landfill inventory / LFG generation estimates for the target region"
        required_for: "Any LFG variant above L1"
        availability: "absent — must be supplied by the user"
      - input: "Cost rows 'biogas' / 'biogas upgrading' (technology-data)"
        required_for: "Reusing the biogas route for LFG"
        availability: "exists by default"
