id: mechanical-vapour-recompression
title: Mechanical vapour recompression
summary: >
  Mechanical vapour recompression (MVR) — electrically recompressing waste
  vapour to reuse it as process steam, drastically cutting boiler fuel in
  evaporation, distillation and drying (food, paper, chemicals).
when_to_use:
  - "mechanical vapour recompression"
  - "MVR"
  - "vapor recompression"
  - "steam recompression"
  - "reuse process vapour"
  - "efficient evaporation / drying"
  - "cut steam demand in food or paper industry"
  - "industry_t steam technologies"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Nothing MVR-specific — no MVR component, cost row or config key exists
        anywhere in the workflow. The functional neighbourhood is however much
        closer than a pure demand model: the MVR-relevant industries (food,
        beverages and tobacco; pulp/paper; chemicals; textiles) are in the
        default sector.industry_t.endogenise_sectors list, so with
        sector.industry_t.endogen: true their steam demand becomes explicit
        "heat100-200 industry" (and heat200-500) band loads per node, served
        by competing extendable Links — including the "industrial heat pump
        high temperature" and "electric boiler steam" options in
        add_t_industry100_200. An industrial heat pump upgrading low-grade
        heat with electricity is the closest in-model proxy for MVR economics
        (electricity in, several units of steam out), though it draws ambient
        heat rather than recompressing process vapour.
      mechanism: >
        With endogen false (default): steam is indistinguishable inside the
        flat "gas for industry" / "solid biomass for industry" /
        "low-temperature heat for industry" loads built by the demand chain
        and attached in add_industry. With endogen true: rule
        build_industry_sector_ratios_endogenous splits each endogenised
        sector's fuel use into temperature bands (Fleiter et al. 2025 shares;
        food is mapped via "Food, drink and tobacco" rows), and the band
        supply menus provide the electrification hook.
      not_covered: >
        No vapour stream or recompression technology; no representation of
        avoided-steam efficiency investments; no process-level heat
        integration or cascading. The band heat pump is thermodynamically MVR
        adjacent but its COP is a static cost-file scalar; a true MVR (COP
        5-10 on the recompression duty, limited to evaporation loads) would
        overstate or understate depending on the sector unless given its own
        link and cost row. In exogenous mode MVR can only be represented by
        shrinking fuel rows and adding electricity in the sector-ratio
        machinery (code/data edit, no config hook).
      provenance: "scripts/prepare_sector_network.py:add_t_industry100_200; scripts/prepare_sector_network.py:industrial heat pump high temperature; scripts/build_industry_sector_ratios_endogenous.py:process_temperature_band_mapper; scripts/prepare_sector_network.py:add_industry"
    levers:
      - key: sector.industry_t.endogen
        effect: "true makes process-steam demand explicit per temperature band — the precondition for representing MVR as a supply technology."
        default: "false"
        provenance: "config/config.default.yaml:industry_t; scripts/prepare_sector_network.py:add_t_industry100_200"
      - key: sector.industry_t.heat100-200.heat_pumps
        effect: "Enables the industrial high-temperature heat pump — the nearest existing proxy for MVR-style electric steam upgrading."
        default: "true"
        provenance: "config/config.default.yaml:heat_pumps; scripts/prepare_sector_network.py:heat_pumps"
      - key: sector.industry_t.endogenise_sectors
        effect: "Selects which industries' steam enters the bands (food, paper, textiles etc. are the MVR candidates)."
        default: "all listed sectors true"
        provenance: "config/config.default.yaml:endogenise_sectors; scripts/build_industry_sector_ratios_endogenous.py:endogenise_sectors"
      - key: sector.industry_t.must_run
        effect: "Baseload floor (p_min_pu 0.8) any MVR-like band technology would inherit."
        default: "0.8"
        provenance: "config/config.default.yaml:must_run; scripts/prepare_sector_network.py:must_run"
    boundary:
      - variant: "electric steam upgrading competing against fuel boilers (MVR-adjacent)"
        rung: L0
        note: "sector.industry_t.endogen: true — the industrial heat pump and electric boiler already compete for the 100-200 °C band"
      - variant: "approximate MVR with a more optimistic heat-pump COP"
        rung: L1
        note: "costs.overwrites efficiency on 'industrial heat pump high temperature' (crude: applies to the whole band, not just evaporation duties)"
      - variant: "MVR as a distinct technology in the steam band"
        rung: L2
        note: "clone the heat-pump block in add_t_industry100_200 with an MVR carrier and config flag; needs an MVR cost row (L3 — none exists in technology-data, supply via data/custom_costs.csv)"
      - variant: "cap MVR to the evaporation/drying share of a sector's steam"
        rung: L3
        note: "requires an applicability split of band demand per sector — extend build_industry_sector_ratios_endogenous with an MVR-eligible sub-band (data + small code)"
      - variant: "exogenous MVR savings (reduced fuel, added electricity) without the band machinery"
        rung: L2
        note: "no config hook — adjust the affected sector functions in build_industry_sector_ratios.py or post-process industry_sector_ratios_{year}.csv (L3)"
      - variant: "true vapour-stream model (recompression of a process's own output vapour)"
        rung: L5
        note: "needs process-level mass/heat flows that do not exist in any PyPSA-Eur structure"
    where:
      - change: "add an MVR link to the steam band menu"
        anchor: "scripts/prepare_sector_network.py::add_t_industry100_200 (heat_pumps / electric_boiler blocks as templates)"
        provenance: "scripts/prepare_sector_network.py:add_t_industry100_200"
      - change: "band demand definition for MVR-candidate sectors"
        anchor: "scripts/build_industry_sector_ratios_endogenous.py::build_industry_sector_ratios_endogenous"
        provenance: "scripts/build_industry_sector_ratios_endogenous.py:build_industry_sector_ratios_endogenous"
      - change: "exogenous fuel/electricity rebalancing per sector"
        anchor: "scripts/build_industry_sector_ratios.py sector functions (food_beverages_tobacco, pulp_paper_printing)"
        provenance: "scripts/build_industry_sector_ratios.py:food_beverages_tobacco; scripts/build_industry_sector_ratios.py:pulp_paper_printing"
      - change: "custom MVR cost row"
        anchor: "data/custom_costs.csv (costs.custom_cost_fn) consumed by process_cost_data"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:prepare_costs"
    data_dependencies:
      - input: "temperature-band demand split (Fleiter et al. 2025 xlsx + backup shares)"
        required_for: "explicit steam bands MVR would serve"
        availability: "exists by default (data/ente202300981-sup-0001-suppdata-s1.xlsx in repo)"
      - input: "MVR cost and COP data (investment, recompression COP, applicability shares)"
        required_for: "a dedicated MVR technology"
        availability: "absent — must be sourced (e.g. DEA industrial process heat catalogue)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Nothing MVR-specific. The industries where MVR applies (food and
        tobacco, paper pulp and print, chemical and petrochemical) exist only as
        demand-side aggregates: annual final energy per carrier from UNSD
        balances, distributed to nodes (paper via SFI plant locations from
        create_paper_df, others largely via GDP keys) and attached as flat
        per-carrier loads in add_industry. Process steam is indistinguishable
        inside the gas/oil/biomass fuel rows.
      mechanism: >
        rules build_base_industry_totals -> build_industry_demand ->
        build_industrial_distribution_key -> prepare_sector_network.add_industry.
        No steam bus, no vapour stream, no recompression technology anywhere in
        the workflow (grep for MVR/recompression yields nothing).
      not_covered: >
        No MVR component, no endogenous steam-efficiency investment, no
        electricity-for-fuel substitution at process level. MVR can only be
        represented exogenously: reduce fuel rows and add a smaller electricity
        row (MVR consumes ~1 unit electricity per several units of avoided
        steam fuel) in the industry demand data.
      provenance: "scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: custom_data.industry_demand
        effect: >
          The MVR representation lever: supply
          data/custom/industry_demand_{demand}_{planning_horizons}.csv with
          reduced gas/oil rows and increased electricity rows for the affected
          industries.
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: sector.enable.industry
        effect: "Gates the industry loads being modified."
        default: "true"
        provenance: "config.default.yaml:industry"
      - key: demand_data.base_year
        effect: "UNSD baseline year the MVR savings are applied against."
        default: "2019"
        provenance: "config.default.yaml:base_year"

    boundary:
      - variant: "MVR uptake in food/paper/chemicals (fuel savings + small electricity increase)"
        rung: L3
        note: >
          Exogenous edit of the per-industry carrier split: custom
          industry_demand csv (index country x carrier, columns industries) via
          custom_data.industry_demand: true, or edit industry_base_totals in
          build_industry_demand. Encode the MVR COP by the ratio of removed fuel
          MWh to added electricity MWh.
      - variant: "gradual MVR rollout across planning horizons"
        rung: L3
        note: "one custom csv per {demand}_{planning_horizons}; alternatively (mis)use negative growth in data/demand/industry_growth_cagr.csv, which however scales all carriers of an industry uniformly."
      - variant: "generic industrial efficiency improvement (all carriers down)"
        rung: L3
        note: "edit data/demand/industry_growth_cagr.csv per industry/country — uniform scaling only."
      - variant: "endogenous MVR investment (electricity-for-steam substitution chosen by cost)"
        rung: L5
        note: "requires an explicit process-steam bus and an MVR link with COP — no steam bus exists; bespoke Python in prepare_sector_network."

    where:
      - change: "per-industry carrier rows (the edit point)"
        anchor: "rule build_industry_demand — industry_base_totals; custom data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "industry loads in the network"
        anchor: "add_industry in prepare_sector_network (gas for industry, industry electricity, ...)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "paper industry plant placement (main MVR-relevant located industry)"
        anchor: "create_paper_df in build_industrial_database (technology 'Paper')"
        provenance: "scripts/build_industrial_database.py:create_paper_df"
      - change: "activity/efficiency scaling per industry"
        anchor: "data/demand/industry_growth_cagr.csv consumed by rule build_industry_demand"
        provenance: "Snakefile:build_industry_demand"

    data_dependencies:
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "baseline fuel use of food/paper/chemical industries"
        availability: "must be built; region-dependent"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "the MVR fuel-to-electricity shift"
        availability: "absent — user-supplied"
      - input: "data/industry/SFI_ALD_Pulp_Paper_Sample_LatAm_Jan_2023.xlsx"
        required_for: "paper plant locations (Latin America sample only)"
        availability: "exists by default but region-dependent — LatAm sample; elsewhere GDP fallback"
