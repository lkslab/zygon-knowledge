id: methane-abatement
title: Methane leak detection / abatement
summary: >
  Cutting methane emissions from fossil supply chains (leaks, venting,
  flaring) and accounting for methane's climate impact alongside CO2.
when_to_use:
  - "methane leaks / fugitive emissions"
  - "methane abatement in oil and gas"
  - "CH4 accounting / CO2-equivalent emissions"
  - "upstream emissions of natural gas"
  - "flaring and venting"
  - "GWP of methane in the model"
  - "limit gas burn (CH4L wildcard)"
models:
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        Nothing methane-as-a-species — emissions accounting is CO2-only and
        combustion-only (grounded absence: no CH4-species, leakage, fugitive,
        venting, flaring or GWP concept in scripts or config; every "methane"
        hit is an industry energy carrier or pipeline capacity). What exists:
        (1) a gas FUEL budget in the electricity workflow —
        electricity.gaslimit_enable makes
        add_gaslimit tag carriers with a gas_usage attribute and add a
        GlobalConstraint of electricity.gaslimit MWh_th/a; NOTE its carrier
        set is n.carriers.index.intersection(["OCGT", "CCGT", "CHP"]) and no
        "CHP" carrier is ever created in the electricity workflow, so the
        intersection silently reduces to OCGT/CCGT. (2) CO2 accounting that
        gas rides on: add_co2_emissions writes each carrier's "CO2 intensity"
        cost column onto n.carriers.co2_emissions (electricity workflow), and
        prepare_costs copies the "gas" row's CO2 intensity onto OCGT and CCGT;
        in sector runs every gas-burning Link books
        costs.at["gas", "CO2 intensity"] to the "co2 atmosphere" bus
        (add_co2_tracking), capped by the co2_budget chapter via
        apply_co2_budget_constraints -> add_co2limit in compose_network. (3) A live UPSTREAM-chain emissions template — for oil,
        not gas: with industry.oil_refining_emissions (default 0.013
        tCO2/MWh), add_carrier_buses splits supply into an "oil primary" bus
        plus a refining Link whose efficiency2 emits to the atmosphere. Gas
        has no equivalent: its fossil supply Generators (p_nom set from the
        summed lng/pipeline/production entry capacities in
        add_h2_gas_infrastructure, input_types = ["lng", "pipeline",
        "production"]) carry no upstream emission term.
      mechanism: >
        The only lever surface is the CO2 machinery. Because upstream leakage
        is roughly proportional to gas consumed, the standard workaround is to
        raise the "gas" row's "CO2 intensity" to a CO2-EQUIVALENT value
        (combustion + GWP-weighted leakage). In eur this is a clean shipped
        data path: a row (technology "gas", parameter "CO2 intensity") in
        data/custom_costs.csv (costs.custom_cost_fn) is applied by
        overwrite_costs BEFORE cost preparation, so the uplift propagates to
        the OCGT/CCGT copies in prepare_costs and to every sector link reading
        the gas intensity. Supply-route-specific leakage instead clones the
        oil refining pattern: a "gas primary" bus per entry type with a Link
        to the gas bus carrying an atmosphere output.
      not_covered: >
        Explicit CH4 as a greenhouse species, leak rates differentiated by
        route (the lng/pipeline/production split exists in the DATA but is
        summed into one generator), abatement technologies or cost curves
        (LDAR, flare-gas recovery), venting/flaring, non-energy methane
        (agriculture and waste appear only as CO2 sectors in
        determine_emission_sectors), and any warming metric other than lumping
        into CO2. Caveats of the CO2e-uplift route: the same
        costs.at["gas", "CO2 intensity"] also scales the capture splits of SMR
        CC / Allam / gas CHP CC AND the biogas-upgrading atmosphere credit
        (efficiency2 = -costs.at["gas", "CO2 intensity"] in "biogas to gas"),
        so an uplift overstates the credit for biomethane and mis-sizes
        capture streams — acceptable for small uplifts, check those links if
        precision matters. The electricity-workflow gaslimit acts on
        Generators only; in sector runs (where gas plants are Links) it has no
        bite and the brake is the gas supply side / CO2 budget instead.
      provenance: "scripts/prepare_network.py:add_gaslimit; scripts/add_electricity.py:add_co2_emissions; scripts/process_cost_data.py:prepare_costs; scripts/prepare_sector_network.py:add_co2_tracking; scripts/prepare_sector_network.py:oil_refining_emissions; scripts/prepare_sector_network.py:biogas to gas"
    levers:
      - key: electricity.gaslimit_enable
        effect: "true adds the GasLimit GlobalConstraint (gas_usage attribute on OCGT/CCGT; the 'CHP' member of its carrier list never exists in this workflow)."
        default: "false"
        provenance: "config/config.default.yaml:gaslimit_enable; scripts/prepare_network.py:add_gaslimit"
      - key: electricity.gaslimit
        effect: "The gas budget in MWh_th/a."
        default: "false"
        provenance: "config/config.default.yaml:gaslimit"
      - key: costs.emission_prices
        effect: "Static or dynamic CO2 price added to generator marginal costs via the carriers' *_emissions attributes — an uplifted gas CO2e intensity turns this into a combined carbon+methane price on gas power."
        default: "{enable: false, co2: 0.0, dynamic: false, rolling_window: 90}"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: co2_budget
        effect: "Emissions cap for both workflows: co2_budget.upper per horizon year (fraction of 1990 while relative: true, else tCO2/a; lower adds a floor), turned into a GlobalConstraint by apply_co2_budget_constraints — in the electricity workflow it prices whatever sits in the carriers' co2_emissions (including any CO2e uplift on the gas intensity), in sector runs it binds the co2 atmosphere accounting."
        default: "upper: {2020: 0.72, ..., 2050: 0.0}, relative: true, emissions_scope: CO2"
        provenance: "config/config.default.yaml:co2_budget; scripts/prepare_network.py:apply_co2_budget_constraints"
      - key: costs.custom_cost_fn
        effect: "The CO2e-uplift carrier: a data/custom_costs.csv row (technology gas, parameter CO2 intensity) is applied before cost preparation and propagates to OCGT/CCGT and all sector gas links."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: industry.oil_refining_emissions
        effect: "Not gas — but the live upstream-supply-chain emissions mechanism (oil primary bus + refining Link emitting efficiency2 to atmosphere) that a gas-leakage implementation clones."
        default: "0.013"
        provenance: "config/config.default.yaml:oil_refining_emissions; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.fossil_fuels
        effect: "false removes the fossil supply Generators for coal/gas/oil/lignite entirely — the blunt zero-fossil-methane scenario."
        default: "true"
        provenance: "config/config.default.yaml:fossil_fuels; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.biogas_upgrading
        effect: "Gates the 'biogas to gas' link whose negative atmosphere term reads the gas CO2 intensity — the main interaction to re-check after a CO2e uplift."
        default: "true"
        provenance: "config/config.default.yaml:biogas_upgrading; scripts/prepare_sector_network.py:biogas to gas"
    boundary:
      - variant: "cap gas burned in power plants (electricity workflow)"
        rung: L0
        note: "electricity.gaslimit_enable + gaslimit — a fuel budget, not an emissions species; Generators only"
      - variant: "tighten CO2 cap / price (indirectly penalising gas, hence leaks)"
        rung: L1
        note: "co2_budget.upper (both workflows) or costs.emission_prices (price instead of cap)"
      - variant: "count methane leakage as CO2e on all gas use"
        rung: L3
        note: "data/custom_costs.csv row: technology 'gas', parameter 'CO2 intensity', value = combustion + leak_rate x GWP x CH4-per-MWh; propagates everywhere automatically — but also scales the biogas-upgrading credit and the CC capture splits that read the same number"
      - variant: "leakage differentiated by supply route (domestic vs pipeline import vs LNG)"
        rung: L2
        note: "the entry-type data exists (gas_input_nodes lng/pipeline/production columns) but is summed into one fossil gas generator per entry node in add_h2_gas_infrastructure — split it per type and clone the oil 'primary bus + emitting Link' pattern from add_carrier_buses"
      - variant: "explicit CH4 tracking with a GWP-weighted warming constraint"
        rung: L5
        note: "new 'ch4 atmosphere' carrier/Store plus emission terms on every methane-touching link and a combined constraint — mirror add_co2_tracking and the co2_atmosphere GlobalConstraint machinery"
      - variant: "abatement supply curve (LDAR, flare-gas recovery)"
        rung: L5
        note: "new abatement Links/variables against a leak stream that itself must first be modelled; nothing to parameterise exists"
      - variant: "non-energy methane (agriculture, waste)"
        rung: L5
        note: "absent; the co2_totals sector accounting (determine_emission_sectors) covers agriculture only as CO2"
    where:
      - change: "gas fuel budget in the electricity workflow"
        anchor: "scripts/prepare_network.py::add_gaslimit (electricity.gaslimit_enable; carrier set intersection includes the never-existing 'CHP')"
        provenance: "scripts/prepare_network.py:add_gaslimit"
      - change: "CO2e uplift of the gas intensity (data route)"
        anchor: "data/custom_costs.csv (costs.custom_cost_fn) -> scripts/process_cost_data.py::overwrite_costs / ::prepare_costs (OCGT/CCGT copies)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; scripts/process_cost_data.py:prepare_costs"
      - change: "supply-side leakage terms per route"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (entry-capacity assignment) and ::add_carrier_buses (oil primary/refining template)"
        provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "combustion accounting that reads the gas CO2 intensity"
        anchor: "scripts/prepare_sector_network.py gas Links (add_generation, SMR/SMR CC, allam, CHP blocks) — all keyed on costs.at gas CO2 intensity"
        provenance: "scripts/prepare_sector_network.py:add_generation; scripts/prepare_sector_network.py:add_allam_gas"
      - change: "explicit CH4 species / warming constraint"
        anchor: "scripts/prepare_sector_network.py::add_co2_tracking (pattern for an atmosphere species); scripts/solve_network.py::add_co2_atmosphere_constraint"
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking; scripts/solve_network.py:add_co2_atmosphere_constraint"
    data_dependencies:
      - input: "cost row 'gas' with 'CO2 intensity' (technology-data, processed by rule process_cost_data)"
        required_for: "the CO2e-uplift route"
        availability: "exists by default"
      - input: "gas_input_nodes (lng/pipeline/production entry capacities from rule build_gas_input_locations)"
        required_for: "route-differentiated leakage"
        availability: "exists by default in sector runs"
      - input: "country/route-specific methane leak rates (e.g. IEA Methane Tracker)"
        required_for: "any defensible leakage number"
        availability: "absent — must be supplied by the user"
      - input: "abatement cost curves"
        required_for: "the L5 abatement variant"
        availability: "absent"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing methane-specific — emissions accounting is CO2-only and
        combustion-only. Grounded absence: no CH4/leakage/fugitive/GWP/CO2e concept
        exists in scripts or config. What exists: fuel carriers get a co2_emissions
        attribute from the cost data (add_carrier_buses sets it from the carrier's
        'CO2 intensity'; in the electricity workflow _add_missing_carriers_from_costs
        imports the *_emissions cost columns onto Carriers); in the sector network
        combustion Links book CO2 onto the "co2 atmosphere" bus (e.g.
        convert_conventional_generators_to_links efficiency2, 'gas for industry'
        links in add_industry). CO2 is then constrained/priced via add_co2limit
        (prepare_network, electricity.co2limit / automatic_emission) or
        add_co2_budget (co2_budget config) in the sector workflow.
      mechanism: >-
        The only lever surface is the CO2 machinery. Because gas upstream leakage is
        proportional to gas burned, the standard workaround is to inflate the gas
        'CO2 intensity' in the cost data to a CO2-EQUIVALENT intensity (combustion +
        GWP-weighted upstream leakage) — every gas-consuming link then carries the
        leakage penalty automatically, since all of them read
        costs.at["gas", "CO2 intensity"].
      not_covered: >-
        Explicit CH4 as a gas/greenhouse species, leak-rate differentiation by supply
        source (domestic vs imported, pipeline vs LNG), abatement technologies or
        cost curves (LDAR, flare replacement), venting/flaring, non-energy methane
        (agriculture, waste), and any warming metric other than lumping into CO2.
      provenance: "scripts/prepare_sector_network.py:add_co2"
    levers:
      - key: electricity.co2limit
        effect: "Absolute CO2 cap (tCO2/a) applied via add_co2limit when a Co2L wildcard is active — prices whatever is inside 'CO2 intensity', including any CO2e uplift you add."
        default: "7.75e+7 (European default)"
        provenance: "config.default.yaml:co2limit ; scripts/prepare_network.py:add_co2limit"
      - key: electricity.automatic_emission
        effect: "Derive the CO2 base from historical country emissions of a base year instead of the manual co2base."
        default: "false"
        provenance: "config.default.yaml:automatic_emission ; scripts/prepare_network.py:add_co2limit"
      - key: electricity.automatic_emission_base_year
        effect: "Base year for the automatic emission baseline."
        default: "1990"
        provenance: "config.default.yaml:automatic_emission_base_year ; scripts/prepare_network.py:add_co2limit"
      - key: co2_budget.enable
        effect: "Sector-workflow CO2 budget by planning-horizon year (add_co2_budget)."
        default: "false"
        provenance: "config.default.yaml:co2_budget ; scripts/prepare_sector_network.py:add_co2_budget"
    boundary:
      - variant: "Tighten the CO2 cap (indirectly penalising gas use, hence leaks)"
        rung: L0
        note: "electricity.co2limit / Co2L wildcard / co2_budget."
      - variant: "Count methane leakage as CO2e on all gas use"
        rung: L3
        note: >-
          Data edit: raise the 'gas' row 'CO2 intensity' in the costs CSV to a CO2e
          value (e.g. combustion 0.198 + leak_rate x GWP100 x CH4-per-MWh). Every
          gas link (power, industry, heat, SMR) picks it up. Caveat: it also scales
          the CC capture terms and the biogas-upgrading credit, which read the same
          number — check those links if precision matters.
      - variant: "Leakage on domestic production only / differentiated by supply route"
        rung: L2
        note: "Add an emission efficiency term to the gas supply Generators/Stores created in add_carrier_buses (or a dedicated atmosphere output on import/extraction links) instead of the fuel intensity."
      - variant: "Explicit CH4 tracking bus with GWP conversion"
        rung: L5
        note: "New 'ch4 atmosphere' carrier/store and emission terms on every methane-touching link, plus a combined warming constraint — bespoke, mirrors the add_co2 pattern."
      - variant: "Abatement supply curve (LDAR, flare gas recovery)"
        rung: L5
        note: "New abatement Links/variables against the leak stream; nothing to parameterise exists."
    where:
      - change: "CO2e uplift of gas intensity (data route)"
        anchor: "costs CSV row 'gas', column 'CO2 intensity' (Snakefile rule retrieve_cost_data or data/costs.csv)"
        provenance: "Snakefile:retrieve_cost_data"
      - change: "Supply-side leakage terms"
        anchor: "scripts/prepare_sector_network.py function add_carrier_buses (fuel Store+Generator per carrier)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "Combustion accounting links that read gas CO2 intensity"
        anchor: "scripts/prepare_sector_network.py functions convert_conventional_generators_to_links and add_industry ('gas for industry')"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - change: "Explicit CH4 species / warming constraint"
        anchor: "scripts/prepare_sector_network.py function add_co2 (pattern for an atmosphere species) and scripts/solve_network.py function extra_functionality"
        provenance: "scripts/prepare_sector_network.py:add_co2"
    data_dependencies:
      - input: "Cost row 'gas' with 'CO2 intensity' (technology-data)"
        required_for: "The CO2e-uplift route"
        availability: "exists by default"
      - input: "Country/route-specific methane leak rates (e.g. IEA Methane Tracker)"
        required_for: "Any defensible leakage number"
        availability: "absent — must be supplied by the user"
      - input: "Abatement cost curves"
        required_for: "The L5 abatement variant"
        availability: "absent"
