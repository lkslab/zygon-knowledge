id: methanol-reforming
title: Methanol steam reforming to hydrogen (with and without carbon capture)
summary: >
  Cracking methanol back into hydrogen by steam reforming — the return leg that
  makes methanol usable as a hydrogen carrier — optionally with carbon capture
  on the released process CO2.
when_to_use:
  - "methanol to hydrogen"
  - "methanol steam reforming / methanol cracking"
  - "methanol as a hydrogen carrier"
  - "import methanol and convert to H2"
  - "hydrogen from imported e-fuels"
  - "reforming with carbon capture"
  - "pypsa-eur carrier names: Methanol steam reforming, Methanol steam reforming CC, methanol, H2"
models:
  - model: pypsa-eur
    version_anchor: {ref: "492f05d32e91ff76b26a7ee67604811a54cb315a", date: "2026-10-10"}
    out_of_box:
      covers: >
        OFF by default — both sector.methanol.methanol_reforming and
        sector.methanol.methanol_reforming_cc are false; flipping them is all it
        takes. When enabled, add_methanol_reforming adds one extendable Link
        "{node} Methanol steam reforming" at EVERY node (spatial.h2.locations):
        bus0 = the single "EU methanol" bus, bus1 = the node's H2 bus, bus2 =
        "co2 atmosphere". Energetics from the "Methanol steam reforming" cost
        row (Niermann et al. 2021): methanol-input 1.201 MWh_MeOH/MWh_H2, so
        efficiency = 1/1.201 = 0.83 MWh_H2 per MWh_MeOH; investment 18017
        EUR/MW_H2 divided by methanol-input to express capital cost per MW of
        methanol input (the link's p_nom unit); FOM 4%/a, lifetime 20 a. The
        full carbon content of the methanol — efficiency2 = "methanolisation"
        row carbondioxide-input, 0.248 tCO2/MWh_MeOH — is released to the
        atmosphere. The CC variant (add_methanol_reforming_cc) adds bus3 = the
        co2 stored buses and splits that stream with the "cement capture" row's
        capture_rate 0.95: 0.236 t/MWh_MeOH captured, 0.012 t/MWh_MeOH still to
        atmosphere, with the capture capex ('cement capture' capital_cost *
        carbondioxide-input) added on top. Because the carbon accounting books
        emissions at the point of release, reforming green methanol (whose
        production credited the atmosphere) is carbon-neutral overall, and
        reforming WITH capture of biogenic/DAC-derived methanol is carbon-negative.
      mechanism: >
        rule compose_network runs scripts/prepare_sector_network.py:
        add_methanol, which calls add_methanol_reforming and/or
        add_methanol_reforming_cc when the respective flags under
        sector.methanol are true (add_carrier_buses has created the EU methanol
        bus first). Cost rows via rule process_cost_data.
      not_covered: >
        No heat or electricity input of the reforming process or of the capture
        plant is modelled — an in-code TODO cites 0.129 kWh_e/kWh_H2 and -0.09
        kWh_heat/kWh_H2 from 10.1016/j.rser.2020.110171 as the known gap, and
        notes CC energy demands are missing for other CC processes too. The
        methanol feed comes from the EU-wide pool (no transport constraint on
        getting methanol to the reformer; the H2 output IS nodal and feeds the
        H2 network). No existing reformer fleet, no minimum part load, no
        unit-commitment attributes. Capture rate is borrowed from the cement
        capture row — there is no reforming-specific capture dataset. Other
        methanol-consuming H2-adjacent routes are separate: methanol-to-kerosene
        (sector.methanol.methanol_to_kerosene, consumes H2) and methanol power
        (see methanol-to-power carrier card).
      provenance: "scripts/prepare_sector_network.py:add_methanol_reforming; scripts/prepare_sector_network.py:add_methanol_reforming_cc; scripts/prepare_sector_network.py:add_methanol"
    levers:
      - key: sector.methanol.methanol_reforming
        effect: "true adds the uncaptured 'Methanol steam reforming' Links at every node."
        default: "false"
        provenance: "config/config.default.yaml:methanol_reforming; scripts/prepare_sector_network.py:add_methanol"
      - key: sector.methanol.methanol_reforming_cc
        effect: "true adds the 'Methanol steam reforming CC' Links (95% of released CO2 to the co2 stored buses via the cement capture row)."
        default: "false"
        provenance: "config/config.default.yaml:methanol_reforming_cc; scripts/prepare_sector_network.py:add_methanol_reforming_cc"
      - key: sector.methanol.regional_methanol_demand
        effect: "Regionalises methanol demand buses only; the reformer always draws from the EU methanol pool either way."
        default: "false"
        provenance: "config/config.default.yaml:regional_methanol_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: costs.overwrites
        effect: "Override the 'Methanol steam reforming' row (investment, methanol-input, lifetime) or 'cement capture' capture_rate/capital_cost; deprecated in favour of data/custom_costs.csv (costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "enable methanol-to-hydrogen (with or without CC)"
        rung: L0
        note: "flip sector.methanol.methanol_reforming and/or methanol_reforming_cc — both variants can coexist and the optimizer picks"
      - variant: "methanol as an import vector for hydrogen"
        rung: L1
        note: "combine with green energy imports of methanol (sector.imports, see green-energy-imports carrier card) or with any domestic methanol supply (methanolisation, biomass-to-methanol, e-biomethanol, the biogas routes, grey/blue methanol) — no extra code"
      - variant: "change reformer cost, conversion ratio or capture rate"
        rung: L1
        note: "costs.overwrites or data/custom_costs.csv row; capture rate is the shared 'cement capture' capture_rate (changing it also affects CCGT methanol CC, SMR CC and industry capture)"
      - variant: "reforming-specific capture rate (decoupled from cement capture)"
        rung: L2
        note: "swap the cost row referenced in add_methanol_reforming_cc, or add a custom row and point the function at it"
      - variant: "add electricity/heat demand of the process"
        rung: L2
        note: "extend the Link with additional buses/efficiencies in add_methanol_reforming / add_methanol_reforming_cc — the in-code TODO gives literature values"
      - variant: "restrict reformers to port/import nodes"
        rung: L2
        note: "the functions build at all spatial.h2.locations; subset the index there"
    where:
      - change: "the reforming links (both variants), their efficiency and CO2 split"
        anchor: "scripts/prepare_sector_network.py::add_methanol_reforming / add_methanol_reforming_cc (called from add_methanol on the sector.methanol flags)"
        provenance: "scripts/prepare_sector_network.py:add_methanol_reforming; scripts/prepare_sector_network.py:add_methanol_reforming_cc"
      - change: "cost row values ('Methanol steam reforming', 'cement capture', methanolisation carbondioxide-input)"
        anchor: "scripts/process_cost_data.py::prepare_costs / overwrite_costs (rule process_cost_data)"
        provenance: "scripts/process_cost_data.py:prepare_costs; scripts/process_cost_data.py:overwrite_costs"
      - change: "methanol pool / H2 node structure the links attach to"
        anchor: "scripts/prepare_sector_network.py::define_spatial (spatial.methanol.nodes, spatial.h2.locations)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
    data_dependencies:
      - input: "cost rows 'Methanol steam reforming' (methanol-input, investment) and 'cement capture' (capture_rate) plus 'methanolisation' (carbondioxide-input for the CO2 content)"
        required_for: "conversion ratio, costs and CO2 split"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "a methanol supply on the EU methanol bus (methanolisation, biomass-to-methanol, or imports; off by default: e-biomethanol, biogas to methanol, e-biogas-methanol, grey and blue methanol)"
        required_for: "any reformer dispatch — the methanol bus has no fuel generator"
        availability: "exists by default (biomass-to-methanol and methanolisation are active in sector runs); reforming grey methanol back to H2 is a fossil H2 route with two conversion losses"
      - input: "co2 stored buses + downstream sequestration/utilisation"
        required_for: "the CC variant's captured stream"
        availability: "exists by default (add_co2_tracking always runs; see co2-transport-and-sequestration carrier card)"
