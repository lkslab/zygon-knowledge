id: methanol-ships
title: Methanol-fuelled ships
summary: >
  Methanol as a marine fuel — methanol-burning vessels, their bunkering
  demand, and the e-methanol / biomethanol supply chain feeding them.
when_to_use:
  - "methanol ships / methanol shipping fuel"
  - "e-methanol for maritime transport"
  - "green shipping fuel share"
  - "shipping decarbonisation pathway"
  - "methanol bunkering demand"
  - "pypsa-eur carrier names: shipping methanol, methanol, methanolisation"
  - "methanol ships / e-methanol shipping"
  - "green methanol marine fuel"
  - "methanol bunkering"
  - "MeOH-powered vessels"
  - "alternative marine fuels"
  - "known in pypsa-eur as: shipping methanol"
models:
  - model: pypsa-eur
    version_anchor: {ref: "6128bf7effbe7243bcc46b2770d04cebe45613a5", date: "2026-10-26"}
    out_of_box:
      covers: >
        Fully covered and the DEFAULT deep-decarbonisation shipping fuel:
        sector.shipping_methanol_share ramps from 0 (2025) via 0.15 (2030) to
        1.0 (2050) — mirrored by shipping_oil_share falling to 0, while
        shipping_hydrogen_share stays 0 in every year. In add_shipping the
        methanol fraction of total navigation (domestic population-weighted +
        international port-weighted, see build_shipping_demand) becomes a
        "shipping methanol" Load, converted with the efficiency ratio
        shipping_oil_efficiency/shipping_methanol_efficiency (0.4/0.46 —
        methanol engines assumed MORE efficient than oil, so final energy
        shrinks ~13%). A free extendable Link feeds it from the methanol bus
        ("EU methanol" by default) and releases combustion CO2 to "co2
        atmosphere" at the methanol carbon content (efficiency2 =
        "methanolisation" carbondioxide-input) — carbon-neutral overall when
        the methanol was made from captured CO2, since methanolisation books
        the same amount as negative. Supply: the methanol carrier bus + store
        come from add_methanol/add_carrier_buses; production is
        "methanolisation" (H2 + electricity + CO2 from co2 stored, built in
        add_industry with p_min_pu = min_part_load_methanolisation 0.3) and
        "biomass-to-methanol" (add_biomass_to_methanol,
        sector.methanol.biomass_to_methanol default true); off by default and
        added in add_methanol: e-biomethanol, biogas to methanol,
        e-biogas-methanol, and fossil grey and blue methanol from the gas bus
        (sector.methanol.e_biomethanol / biogas_to_methanol /
        e_biogas_methanol / grey_methanol / blue_methanol, see [[e-methanol]]).
        All of them feed the same pool, so the ship burns whatever mix the
        pool holds. Demand placement
        can be regionalised with sector.methanol.regional_methanol_demand
        (nodal "shipping methanol" buses instead of one EU bus). With
        sector.shipping_endogenous (off by default; method
        shipping-fuel-endogenous) the shares are replaced by an endogenous
        choice: an extendable "<node> shipping methanol" link from the methanol
        bus onto the node's oil-equivalent "shipping" bus (efficiency
        0.46/0.40, same CO2 booking) competes with shipping oil, shipping LNG
        and, if sector.shipping_hydrogen is on, H2 for shipping.
      mechanism: >
        rule build_shipping_demand -> port-weighted international navigation;
        rule compose_network: add_methanol creates the methanol
        carrier/bus/store (add_carrier_buses), add_industry adds the
        methanolisation Link, add_shipping (gated by sector.shipping) reads
        shipping_methanol_share via get() (linear interpolation between
        horizon keys) and builds bus/Load/Link. Shares not summing to 1 with
        oil+hydrogen only warn and scale demand.
      not_covered: >
        By default fuel choice is exogenous — shares are hand-set per horizon;
        with sector.shipping_endogenous methanol competes with oil, LNG and H2
        on fuel cost and CO2, but never with ammonia (not on the menu). The load is
        a flat annual average (no seasonality, no voyage structure). No
        bunkering infrastructure, port storage or methanol transport between
        nodes (single EU methanol bus by default; even with
        regional_methanol_demand only the DEMAND buses are nodal — production
        still feeds one EU pool). No dedicated methanol-vessel cost row (the
        efficiency ratio is the whole vessel representation); no ammonia
        alternative exists at all (see ammonia-ships). Domestic and
        international navigation get the same fuel mix.
      provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:methanolisation; scripts/prepare_sector_network.py:add_biomass_to_methanol; scripts/build_shipping_demand.py:total international navigation; config/config.default.yaml:shipping_methanol_share; scripts/prepare_sector_network.py:_add_shipping_endogenous"
    levers:
      - key: sector.shipping_methanol_share
        effect: "Per-horizon methanol fraction of navigation energy — THE lever; interpolated linearly between dict keys."
        default: "{2020: 0, 2025: 0, 2030: 0.15, 2035: 0.35, 2040: 0.55, 2045: 0.8, 2050: 1}"
        provenance: "config/config.default.yaml:shipping_methanol_share; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping_oil_share
        effect: "Complementary fossil share (falls to 0 by 2050); rebalance when changing the methanol share."
        default: "{2020: 1, 2025: 1, 2030: 0.85, 2035: 0.65, 2040: 0.45, 2045: 0.2, 2050: 0}"
        provenance: "config/config.default.yaml:shipping_oil_share; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping_methanol_efficiency
        effect: "Methanol engine efficiency; the demand conversion uses shipping_oil_efficiency / shipping_methanol_efficiency, so raising it cuts methanol demand."
        default: "0.46"
        provenance: "config/config.default.yaml:shipping_methanol_efficiency; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping_oil_efficiency
        effect: "Reference oil-engine efficiency the navigation energy statistics are assumed to embody; enters the methanol (and H2) conversion ratio."
        default: "0.4"
        provenance: "config/config.default.yaml:shipping_oil_efficiency; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.methanol.regional_methanol_demand
        effect: "true resolves the shipping methanol demand buses per node (port-weighted placement matters); default pools demand at one EU bus."
        default: "false"
        provenance: "config/config.default.yaml:regional_methanol_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.methanol.biomass_to_methanol
        effect: "Enables the biomass-to-methanol supply route competing with methanolisation."
        default: "true"
        provenance: "config/config.default.yaml:biomass_to_methanol; scripts/prepare_sector_network.py:add_methanol"
      - key: sector.min_part_load_methanolisation
        effect: "p_min_pu of the methanolisation Link — restricts how flexibly e-methanol production can follow cheap electricity."
        default: "0.3"
        provenance: "config/config.default.yaml:min_part_load_methanolisation; scripts/prepare_sector_network.py:add_industry"
      - key: sector.shipping
        effect: "Gate for all shipping demand."
        default: "true"
        provenance: "config/config.default.yaml:shipping; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping_endogenous
        effect: "true makes methanol an endogenous choice against oil, LNG and (with sector.shipping_hydrogen) H2 on one oil-equivalent shipping bus per node; the share dicts are then ignored and sector.shipping_methanol (bool or year dict) keeps methanol on the menu."
        default: "false"
        provenance: "config/config.default.yaml:shipping_endogenous; config/config.default.yaml:shipping_methanol; scripts/prepare_sector_network.py:_add_shipping_endogenous"
    boundary:
      - variant: "methanol shipping ramp to 100% by 2050"
        rung: L0
        note: "the default share schedule — nothing to change"
      - variant: "faster/slower methanol uptake, or partial (methanol+oil) end state"
        rung: L1
        note: "edit shipping_methanol_share / shipping_oil_share per horizon; sums != 1 warn and scale demand"
      - variant: "port-resolved methanol bunkering demand"
        rung: L1
        note: "sector.methanol.regional_methanol_demand: true (production remains an EU pool — nodal production/transport is L4)"
      - variant: "different engine efficiency assumptions"
        rung: L1
        note: "shipping_methanol_efficiency / shipping_oil_efficiency"
      - variant: "force GREEN methanol only (exclude biomass route)"
        rung: L1
        note: "sector.methanol.biomass_to_methanol: false and every other route switch off — biomass_to_methanol_cc, e_biomethanol, biogas_to_methanol, e_biogas_methanol, grey_methanol, blue_methanol (all false by default) — leaves methanolisation (H2+CO2) as the supply route; existing grey plants under sector.endogenous_sectors (myopic/perfect) and import methanol (sector.imports) still feed the pool when present"
      - variant: "methanol-vessel capital cost in the objective"
        rung: L2
        note: "no vessel cost anywhere; attach capital/marginal cost to the shipping methanol Link in add_shipping (cost data on you, L3)"
      - variant: "seasonal/voyage-resolved shipping profile"
        rung: L3
        note: "p_set is a flat annual average; a time series needs external shipping-activity data replacing the constant in add_shipping"
      - variant: "endogenous fuel competition across shipping fuels"
        rung: L0
        note: "sector.shipping_endogenous: true (method [[shipping-fuel-endogenous]]): methanol, oil, LNG and optionally H2 compete; no vessel costs, ammonia not on the menu (see ammonia-ships)"
    where:
      - change: "shipping methanol bus/Load/Link creation and the efficiency conversion"
        anchor: "scripts/prepare_sector_network.py::add_shipping (shipping_methanol_share block); endogenous mode in ::_add_shipping_endogenous"
        provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:_add_shipping_endogenous"
      - change: "methanol carrier, store and supply technologies"
        anchor: "scripts/prepare_sector_network.py::add_methanol / ::add_carrier_buses; methanolisation in ::add_industry"
        provenance: "scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:add_industry"
      - change: "demand regionalisation (EU vs nodal shipping methanol buses)"
        anchor: "scripts/prepare_sector_network.py::define_spatial (regional_methanol_demand branch)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "port weighting of international navigation"
        anchor: "rule build_shipping_demand -> scripts/build_shipping_demand.py"
        provenance: "rules/build_sector.smk:build_shipping_demand; scripts/build_shipping_demand.py:european_ports"
    data_dependencies:
      - input: "cost row 'methanolisation' (hydrogen/electricity/carbondioxide-input) + 'General liquid hydrocarbon storage (product)' for the methanol store"
        required_for: "e-methanol production and storage costs; the shipping link's CO2 release factor"
        availability: "exists by default via retrieve_cost_data (referenced in add_industry/add_carrier_buses)"
      - input: "co2 stored buses (captured CO2 supply for methanolisation)"
        required_for: "e-methanol carbon input"
        availability: "exists by default (add_co2_tracking chain)"
      - input: "attributed ports outflow data + energy_totals navigation columns"
        required_for: "demand magnitude and placement"
        availability: "retrieved/built by the workflow (rules retrieve_attributed_ports / build_shipping_demand / build_energy_totals)"
      - input: "biomass potentials (solid biomass supply)"
        required_for: "the biomass-to-methanol and e-biomethanol routes"
        availability: "must be built (rule build_biomass_potentials); exists by default in sector runs"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered — the methanol carrier is absent from the ENTIRE model. A
        repo-wide search finds no methanol bus, carrier, technology, config key, or
        script; there is no methanolisation link and no methanol demand anywhere
        (unlike ammonia, which has a full value chain via add_ammonia but no
        shipping hookup). Shipping (add_shipping) splits demand only into an H2
        share (sector.shipping_hydrogen_share) and an oil remainder.
      mechanism: >
        Nothing to describe. The nearest structural analogues: the H2-share pattern
        in add_shipping (exogenous fuel share -> Load at port-weighted nodes), and
        the CO2 + H2 synthesis pattern of H2_liquid_fossil_conversions
        (Fischer-Tropsch Link: H2 bus + co2 bus -> oil bus), which is the template a
        methanolisation Link would follow.
      not_covered: >
        Everything: methanol carrier/buses, methanol synthesis (methanolisation),
        methanol storage, shipping-methanol share, methanol engine assumptions,
        emissions accounting for methanol combustion.
      provenance: "scripts/prepare_sector_network.py:add_shipping"

    levers:
      - key: sector.enable.shipping
        effect: "Master switch for shipping demand (H2 + oil only today)."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"
      - key: sector.shipping_hydrogen_share
        effect: "Only existing shipping-fuel lever; the pattern a methanol share would copy."
        default: "AB_2030: 0.05 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:shipping_hydrogen_share"
      - key: sector.fischer_tropsch
        effect: "Enables the existing H2+CO2->liquid-fuel synthesis (to the generic oil bus) — the closest thing to e-fuel supply; a crude proxy for e-methanol economics feeding oil-fuelled ships."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"

    boundary:
      - variant: "Crude proxy: e-fuel-supplied conventional shipping"
        rung: L0
        note: "sector.fischer_tropsch (default true) lets the optimiser make synthetic liquid fuel on the oil bus that shipping oil loads consume — not methanol-specific, no dedicated tracking."
      - variant: "Methanol carrier + methanolisation + storage"
        rung: L5
        note: >
          New carrier and component logic from scratch: NH3-style spatial buses, a
          methanolisation Link (H2 + CO2 -> methanol, pattern
          H2_liquid_fossil_conversions), stores, and cost rows. This is new
          component logic, not a parameter edit; pypsa-earth has no scaffold for it.
      - variant: "Shipping-methanol demand share"
        rung: L2
        note: "ONCE the carrier exists: same localised add_shipping edit as ammonia-ships (share key via get() + Load on methanol buses at port nodes)."
      - variant: "Methanol technology cost data"
        rung: L3
        note: "Needs methanolisation/storage/engine rows added to the costs input (retrieve_cost_data output); not referenced anywhere today."
      - variant: "Wildcard/rule integration for methanol scenarios"
        rung: L4
        note: "If methanol supply needs its own resources (CO2 sourcing accounting, dedicated outputs), new rule plumbing on top of the L5 component work."

    where:
      - change: "Template for the fuel-share + port-load demand side"
        anchor: "scripts/prepare_sector_network.py function add_shipping"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
      - change: "Template for H2+CO2 synthesis Links"
        anchor: "scripts/prepare_sector_network.py function H2_liquid_fossil_conversions (Fischer-Tropsch)"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - change: "Template for a new spatial carrier with stores and demand"
        anchor: "scripts/prepare_sector_network.py function add_ammonia"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "Port weighting for bunkering loads"
        anchor: "rule prepare_ports -> scripts/prepare_ports.py"
        provenance: "scripts/prepare_ports.py:download_ports"

    data_dependencies:
      - input: "UNSD navigation energy totals"
        required_for: "demand a methanol share would be carved from"
        availability: "must be built (build_base_energy_totals)"
      - input: "World Port Index ports.csv"
        required_for: "locating bunkering demand"
        availability: "must be built (prepare_ports runtime download)"
      - input: "Methanolisation / methanol storage / methanol engine cost and efficiency data"
        required_for: "the whole methanol value chain"
        availability: "absent (no methanol rows referenced in the workflow)"
      - input: "CO2 source accounting (co2 buses/DAC exist via sector.co2_network and dac options)"
        required_for: "e-methanol synthesis carbon input"
        availability: "exists by default (co2 network and DAC are modelled)"
