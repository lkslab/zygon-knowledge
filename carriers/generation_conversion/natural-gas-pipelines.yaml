id: natural-gas-pipelines
title: Natural gas pipeline network
summary: >
  The methane transmission grid — real pipeline topology and capacities,
  clustering to model regions, expansion candidates, compression losses,
  and retrofitting pipelines to hydrogen.
when_to_use:
  - "gas network / gas grid"
  - "gas pipelines"
  - "gas transmission capacity"
  - "repurpose gas pipelines for hydrogen / H2 retrofit"
  - "SciGRID gas data"
  - "gas transport between regions"
  - "new gas pipeline / interconnector"
  - "gas distribution grid"
  - "pypsa-eur carrier names: gas pipeline, gas pipeline new, H2 pipeline retrofitted"
  - "gas grid / natural gas network"
  - "natural gas pipelines / methane pipelines"
  - "gas transmission between regions"
  - "existing pipeline network / gas infrastructure"
  - "repurpose gas pipelines for hydrogen"
  - "GGIT / Global Gas Infrastructure Tracker"
  - "IGGIELGN / SciGRID gas"
  - "pipeline capacity from diameter"
  - "cluster gas network to model regions"
  - "custom pipeline dataset"
  - "known in pypsa-eur as: gas pipeline, gas pipeline new"
models:
  - model: pypsa-eur
    version_anchor: {ref: "a6c45e5a2d926ba9a5566cba24d905cff9f89939", date: "2026-09-09"}
    out_of_box:
      covers: >
        A REAL, data-derived gas grid, on by default (sector.gas_network:
        true). rule build_gas_network parses the SciGRID_gas IGGIELGN pipe
        segments: capacities from reported max flow (437.5 MW per MCM/day)
        cross-checked against a diameter-based estimate (diameter_to_capacity,
        European Hydrogen Backbone interpolation), implausible capacities and
        lengths corrected, pipes under 10 km treated as bidirectional
        (prepare_dataset). rule cluster_gas_network maps endpoints to the
        clustered onshore/offshore regions, drops intra-region pipes,
        aggregates parallel pipes (capacity summed, p_min_pu = -1 kept only if
        all parallels are bidirectional) and names them "gas pipeline <r0> <->
        <r1>" (reindex_pipes). In prepare_sector_network,
        add_h2_gas_infrastructure turns them into "gas pipeline" Links between
        per-node gas buses — by default NON-extendable with p_nom fixed at
        today's capacity and zero investment relevance (lifetime inf). It then
        guarantees minimum topology: a graph of pipes > 1500 MW is checked for
        connectivity and k_edge_augmentation (k =
        sector.gas_network_connectivity_upgrade) proposes extendable
        "gas pipeline new" candidate Links (bidirectional, CH4 pipeline
        capital cost) where regions would otherwise be disconnected.
        Compression is a real ELECTRICITY demand: lossy_bidirectional_links
        ("gas pipeline" is in sector.transmission_efficiency.enable) wires
        bus2 to the electricity bus at each pipe's origin with efficiency2 =
        -compression_per_1000km (0.01) x length/1000 — gas flow consumes
        power at the sending node in either direction.
        H2 retrofit: with sector.H2_retrofit: true, gas pipes become
        extendable-DOWN (p_nom_max = today's capacity, p_nom_min = 0, tiny
        0.1 EUR/MWkm/a cost to prefer decommissioning) and a parallel
        "H2 pipeline retrofitted" candidate is added per pipe with p_nom_max
        = p_nom * sector.H2_retrofit_capacity_per_CH4; the WIRED solver
        constraint add_pipe_retrofit_constraint (always called from
        extra_functionality) enforces gas + H2/0.6 = original capacity per
        corridor. In myopic foresight, add_brownfield carries retrofit
        decisions across horizons by subtracting already-retrofitted capacity
        from both the remaining gas grid and the remaining retrofit potential.
      mechanism: >
        rules build_gas_network -> cluster_gas_network ->
        prepare_sector_network (inputs clustered_gas_network +
        gas_input_nodes); entry-point/LNG/production/storage siting comes from
        rule build_gas_input_locations (see fossil-fuel-supply carrier card).
        Post-solve discretisation of pipe capacities to 1500 MW units is
        available via solving.options.post_discretization. The gas
        DISTRIBUTION grid is not a network at all — sector.gas_distribution_
        grid just adds distribution capex to decentral gas boilers and micro
        CHP (insert_gas_distribution_costs).
      not_covered: >
        No endogenous NEW gas corridors beyond the connectivity augmentation —
        "gas pipeline new" candidates only appear where the >1500 MW graph is
        disconnected (with the default full SciGRID network usually few or
        none); arbitrary new interconnectors need an edit. Existing pipes are
        never expandable (p_nom_max = p_nom even under H2_retrofit — capacity
        can only move to hydrogen or be decommissioned). No intra-nodal gas
        constraints (each region is a single gas bus), no pressure/linepack
        modelling, no gas storage injection/withdrawal rate limits (storage is
        an energy Store — see fossil-fuel-supply). Pipe build_year from
        SciGRID is parsed but no age-based retirement is applied (lifetime
        inf). H2_retrofit defaults to FALSE — the retrofit market is opt-in.
      provenance: "scripts/build_gas_network.py:prepare_dataset; scripts/build_gas_network.py:diameter_to_capacity; scripts/cluster_gas_network.py:build_clustered_gas_network; scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/add_brownfield.py:add_brownfield"
    levers:
      - key: sector.gas_network
        effect: "Master switch: true = real per-node gas grid with fixed pipeline Links; false = single EU gas bus (no pipes, unlimited supply)."
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.H2_retrofit
        effect: "true enables pipeline repurposing: gas pipes become decommissionable and 'H2 pipeline retrofitted' candidates appear, coupled by add_pipe_retrofit_constraint."
        default: "false"
        provenance: "config/config.default.yaml:H2_retrofit; scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/solve_network.py:add_pipe_retrofit_constraint"
      - key: sector.H2_retrofit_capacity_per_CH4
        effect: "MW H2 obtainable per MW CH4 capacity when retrofitting (energy-basis conversion factor)."
        default: "0.6"
        provenance: "config/config.default.yaml:H2_retrofit_capacity_per_CH4; scripts/solve_network.py:add_pipe_retrofit_constraint"
      - key: sector.gas_network_connectivity_upgrade
        effect: "k for k_edge_augmentation — how many independent paths every gas region must have; raises the number of 'gas pipeline new' candidates."
        default: "1"
        provenance: "config/config.default.yaml:gas_network_connectivity_upgrade; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.transmission_efficiency
        effect: "The 'gas pipeline' entry (compression_per_1000km: 0.01) sets length-dependent compression electricity demand at the sending bus (bus2/efficiency2 wired by lossy_bidirectional_links); remove 'gas pipeline' from the enable list to disable."
        default: "enable includes gas pipeline; compression_per_1000km: 0.01"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: sector.gas_distribution_grid
        effect: "true adds distribution-grid capital cost (times sector.gas_distribution_grid_cost_factor) to decentral gas consumers — a cost adder, not a network."
        default: "true"
        provenance: "config/config.default.yaml:gas_distribution_grid; scripts/prepare_sector_network.py:insert_gas_distribution_costs"
      - key: solving.options.post_discretization
        effect: "enable: true snaps optimised pipeline capacities to integer units (link_unit_size gas pipeline: 1500 MW, threshold 0.3) after solving."
        default: "enable: false"
        provenance: "config/config.default.yaml:post_discretization; scripts/solve_network.py:post_discretization"
      - key: clustering.mode
        effect: "Region definition (busmap/administrative) determines gas bus granularity — pipes cluster to whatever regions_onshore the electricity clustering produced."
        default: "busmap"
        provenance: "config/config.default.yaml:mode; scripts/cluster_gas_network.py:load_bus_regions"
    boundary:
      - variant: "run with today's gas grid, fixed capacities"
        rung: L0
        note: "default (sector.gas_network true, H2_retrofit false)"
      - variant: "ignore gas transport (copperplate gas)"
        rung: L0
        note: "sector.gas_network: false"
      - variant: "let the model repurpose gas pipes to hydrogen"
        rung: L0
        note: "sector.H2_retrofit: true — the retrofit constraint is already wired into extra_functionality; tune the yield with H2_retrofit_capacity_per_CH4 (L1)"
      - variant: "stronger guaranteed connectivity / more new-pipe candidates"
        rung: L1
        note: "raise sector.gas_network_connectivity_upgrade (k-edge augmentation)"
      - variant: "remove or change compression losses"
        rung: L1
        note: "edit sector.transmission_efficiency (drop 'gas pipeline' from enable or change compression_per_1000km)"
      - variant: "allow expansion of existing gas pipeline capacity"
        rung: L2
        note: "in add_h2_gas_infrastructure the non-retrofit branch sets p_nom_extendable False with p_nom_max inf unused — flip extendable True and give a CH4 pipeline capital cost (the cost row 'CH4 (g) pipeline' is already used for new pipes)"
      - variant: "add a specific planned pipeline / interconnector"
        rung: L3
        note: "append a row to the clustered gas network CSV (resources gas_network_clustered.csv) or the upstream gas_network.csv — columns bus0, bus1, p_nom, p_min_pu, length, name"
      - variant: "change capacity estimates for poorly-reported pipes"
        rung: L2
        note: "tune the correction thresholds / diameter mapping in build_gas_network.py::prepare_dataset (correction_threshold_p_nom, diameter_to_capacity)"
      - variant: "pipe-level decommissioning by age"
        rung: L2
        note: "build_year survives into the cleaned data; apply lifetimes in add_h2_gas_infrastructure instead of lifetime=inf"
      - variant: "explicit gas distribution network below the region level"
        rung: L5
        note: "only a capex adder exists (insert_gas_distribution_costs); a real distribution topology is out of scope of the data and code"
      - variant: "linepack / pressure / flow physics"
        rung: L5
        note: "pipes are transport Links with static efficiency — no gas flow physics anywhere"
    where:
      - change: "raw pipe parsing, capacity/length corrections, bidirectionality"
        anchor: "scripts/build_gas_network.py::prepare_dataset / ::diameter_to_capacity (rule build_gas_network)"
        provenance: "scripts/build_gas_network.py:prepare_dataset; rules/build_sector.smk:build_gas_network"
      - change: "clustering pipes to regions, parallel-pipe aggregation, naming"
        anchor: "scripts/cluster_gas_network.py::build_clustered_gas_network / ::aggregate_parallel_pipes / ::reindex_pipes (rule cluster_gas_network)"
        provenance: "scripts/cluster_gas_network.py:aggregate_parallel_pipes; scripts/cluster_gas_network.py:reindex_pipes"
      - change: "gas pipeline Links, retrofit candidates, connectivity augmentation"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (gas_network / H2_retrofit blocks)"
        provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:gas pipeline new"
      - change: "retrofit coupling constraint (gas + H2 = original capacity)"
        anchor: "scripts/solve_network.py::add_pipe_retrofit_constraint (always called in ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/solve_network.py:extra_functionality"
      - change: "carrying retrofit state across myopic horizons"
        anchor: "scripts/add_brownfield.py::add_brownfield (h2_retrofit branch)"
        provenance: "scripts/add_brownfield.py:add_brownfield"
      - change: "compression losses"
        anchor: "scripts/prepare_sector_network.py::lossy_bidirectional_links (sector.transmission_efficiency loop in __main__)"
        provenance: "scripts/prepare_sector_network.py:lossy_bidirectional_links"
    data_dependencies:
      - input: "SciGRID_gas IGGIELGN_PipeSegments.geojson"
        required_for: "the entire pipeline topology and capacities"
        availability: "retrieved by rule retrieve_gas_infrastructure_data (European coverage only)"
      - input: "clustered onshore/offshore region geometries (onshore_regions.geojson)"
        required_for: "mapping pipe endpoints to gas buses"
        availability: "must be built (clustering chain), default in workflow"
      - input: "cost rows 'CH4 (g) pipeline', 'H2 (g) pipeline repurposed'"
        required_for: "new pipeline candidates and retrofit economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "gas_input_nodes_simplified.csv (entry/LNG/production/storage per region)"
        required_for: "which gas buses keep supply generators (see fossil-fuel-supply)"
        availability: "must be built (rule build_gas_input_locations)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Rule prepare_gas_network (active whenever custom_data.gas_network is
        false) ingests a real-world gas pipeline dataset chosen by
        sector.gas.network_data: "GGIT" (default, global — the GEM Global Gas
        Infrastructure Tracker xlsx GEM-GGIT-Gas-Pipelines-December-2022.xlsx,
        fetched at runtime from the pypsa-meets-earth temporary_storage GitHub
        repo and read in-memory) or "IGGIELGN" (Europe — SciGRID_gas zip from
        zenodo, extracted to data/gas_network/scigrid-gas). GGIT rows are
        filtered by sector.gas.network_data_GGIT_status, WKT geometries parsed,
        and capacity taken from CapacityBcm/y (bcm_to_MW) or, where missing,
        estimated from pipe diameter via the piecewise-linear
        diameter_to_capacity relation (European Hydrogen Backbone report).
        Each pipeline is then attributed to bus regions by interpolating points
        every 10 km along its geometry and containment-testing them against the
        clustered onshore regions (parse_states/get_states_in_order);
        cluster_gas_network drops within-region pipelines (amount_states_passed
        < 2), splits the rest into region-pair segments, sums capacity per
        (bus0, bus1) and sets length = 1.25 x haversine distance between region
        centroids. Output: resources/<sec>/gas_networks/
        gas_network_elec_s{simpl}_{clusters}.csv (bus0, bus1, capacity, length,
        GWKm). Gas COMMODITY supply is nodal: add_carrier_buses gives every
        node a " gas" bus (spatial.gas.nodes, sector.gas.spatial_gas true) with
        an extendable Generator at the "gas" fuel cost plus an extendable
        Store, feeding OCGT/CCGT links (sector.conventional_generation), SMR,
        industry, boilers etc.
      mechanism: >
        Snakefile rule prepare_gas_network -> scripts/prepare_gas_network.py
        (download_GGIT_gas_network or download_IGGIELGN_gas_network ->
        prepare_GGIT_data or prepare_IGGIELGN_data -> parse_states ->
        cluster_gas_network) -> clustered_gas_network csv. Snakefile rule
        prepare_sector_network wires that csv (or data/custom/pipelines.csv if
        custom_data.gas_network) in as input "pipelines", consumed ONLY by
        add_hydrogen in scripts/prepare_sector_network.py, which turns the
        routes into H2 pipeline Links: repurposed links capped at 80% of gas
        capacity when sector.hydrogen.gas_network_repurposing is true, plus
        new-build H2 links along the same routes (see the hydrogen-pipelines
        carrier card for the H2 side). Nodal gas buses/generators come from
        add_carrier_buses called in convert_conventional_generators_to_links.
      not_covered: >
        No methane transmission Links are built from the clustered pipeline
        table — sector.gas.network is false ("ALWAYS FALSE for now (NOT
        USED)") and no script consumes it, so inter-regional gas flows are not
        modelled or constrained: every node's gas bus has its own unlimited
        extendable supply generator. The "gas pipeline" / "H2 pipeline
        retrofitted" carriers handled in add_brownfield are never created by
        the pypsa-earth workflow, so that myopic retrofit-accounting block is
        inert. Within-region pipelines are discarded in clustering; pipeline
        geometry lengths are replaced by centroid haversine distances; no
        LNG terminals, entry points or gas storage sites from the datasets; no
        gas import/export to countries outside the modelled region.
      provenance: "scripts/prepare_gas_network.py:cluster_gas_network; scripts/prepare_sector_network.py:add_hydrogen"
    levers:
      - key: sector.gas.network_data
        effect: >
          Selects the pipeline dataset: "GGIT" (global GEM tracker xlsx) or
          "IGGIELGN" (SciGRID_gas geojson, Europe only).
        default: '"GGIT"'
        provenance: "config.default.yaml:network_data; scripts/prepare_gas_network.py:download_GGIT_gas_network"
      - key: sector.gas.network_data_GGIT_status
        effect: >
          Which GGIT project statuses are kept as pipelines (filter on the
          Status column) — restrict to ["Operating"] to model only the existing
          grid, or include Proposed/Construction for candidate corridors.
        default: '["Construction", "Operating", "Idle", "Shelved", "Mothballed", "Proposed"]'
        provenance: "config.default.yaml:network_data_GGIT_status; scripts/prepare_gas_network.py:prepare_GGIT_data"
      - key: custom_data.gas_network
        effect: >
          If true, the prepare_gas_network rule is skipped entirely and the
          pipeline table is read from data/custom/pipelines.csv instead.
        default: "false"
        provenance: "config.default.yaml:gas_network; Snakefile:clustered_gas_network"
      - key: sector.hydrogen.network_routes
        effect: >
          "gas" routes the H2 network along the clustered gas pipelines
          (making the gas network data relevant); "greenfield" follows the
          electricity topology and ignores the gas dataset.
        default: '"gas"'
        provenance: "config.default.yaml:network_routes; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.gas_network_repurposing
        effect: >
          Adds "H2 pipeline repurposed" Links whose p_nom_max is 80% of the
          clustered gas pipeline capacity — the mechanism by which existing gas
          pipeline capacity enters the optimisation.
        default: "true"
        provenance: "config.default.yaml:gas_network_repurposing; scripts/prepare_sector_network.py:add_links_repurposed_H2_pipelines"
      - key: sector.hydrogen.H2_retrofit_capacity_per_CH4
        effect: >
          H2-per-CH4 capacity ratio used by add_brownfield when subtracting
          retrofitted capacity from a "gas pipeline" carrier in myopic runs
          (inert out of the box since no such Links are created).
        default: "0.6"
        provenance: "config.default.yaml:H2_retrofit_capacity_per_CH4; scripts/add_brownfield.py:H2_retrofit_capacity_per_CH4"
      - key: sector.gas.spatial_gas
        effect: >
          true = one gas bus per node (spatial.gas.nodes = nodes + " gas");
          false = a single "Earth gas" bus. Config comments it "ALWAYS TRUE".
        default: "true"
        provenance: "config.default.yaml:spatial_gas; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.conventional_generation
        effect: >
          Maps generator technologies to fuel carriers (OCGT/CCGT -> gas);
          determines which power plants are converted to Links drawing from the
          nodal gas buses.
        default: "{OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass}"
        provenance: "config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - key: fossil_reserves
        effect: >
          Per-carrier initial reserve (TWh) for the fuel Store at the carrier
          buses (e_initial); note the extendable fuel Generator remains
          unlimited regardless, so this does not cap gas supply by itself.
        default: "{oil: 100}"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses"
    boundary:
      - variant: "use the existing gas grid as H2 pipeline routes with repurposing"
        rung: L0
        note: >
          default: sector.hydrogen.network_routes "gas" +
          gas_network_repurposing true; see the hydrogen-pipelines carrier card for
          the H2-side levers (network_limit, costs)
      - variant: "switch to the European IGGIELGN (SciGRID_gas) dataset"
        rung: L1
        note: >
          sector.gas.network_data: IGGIELGN — Europe-only coverage; zip is
          auto-downloaded from zenodo on rule execution
      - variant: "only operating pipelines (exclude proposed/shelved)"
        rung: L1
        note: 'sector.gas.network_data_GGIT_status: ["Operating"]'
      - variant: "supply a bespoke pipeline network"
        rung: L3
        note: >
          custom_data.gas_network: true + author data/custom/pipelines.csv with
          bus0, bus1, capacity, length in the clustered-bus naming — bypasses
          prepare_gas_network entirely
      - variant: "model methane flows as actual gas pipeline Links between gas buses"
        rung: L2
        note: >
          no code consumes sector.gas.network; add a madd("Link", ...,
          carrier="gas pipeline") block reading the clustered csv (pattern:
          add_links_new_H2_pipelines) connecting spatial.gas.nodes — this would
          also activate the dormant gas-pipeline block in add_brownfield
      - variant: "finite/priced national gas supply instead of unlimited nodal import"
        rung: L2
        note: >
          add_carrier_buses attaches an extendable Generator at fuel cost to
          every gas bus; localised edit there (cap p_nom, or rely on the Store
          with a fossil_reserves gas entry after removing the generator)
      - variant: "keep within-region pipelines / change clustering length factor"
        rung: L2
        note: >
          cluster_gas_network drops pipelines with amount_states_passed < 2 and
          hardcodes length_factor = 1.25 (haversine centroid distances); edit
          in scripts/prepare_gas_network.py
      - variant: "update to a newer GGIT release"
        rung: L3
        note: >
          the xlsx URL and sheet name ("Gas Pipelines 2022-12-16") are
          hardcoded in download_GGIT_gas_network; point them at the new file
          (small code touch, but the deliverable is the new data file)
      - variant: "LNG terminals / gas storage sites / gas entry points from the trackers"
        rung: L5
        note: >
          only pipeline geometries are parsed; terminals and storage would need
          new ingestion plus new component logic on the gas buses
    where:
      - change: "dataset download and selection"
        anchor: "Snakefile rule prepare_gas_network; scripts/prepare_gas_network.py:download_GGIT_gas_network / download_IGGIELGN_gas_network"
        provenance: "Snakefile:prepare_gas_network; scripts/prepare_gas_network.py:download_GGIT_gas_network"
      - change: "cleaning, status filter, capacity from Bcm/y or diameter"
        anchor: "scripts/prepare_gas_network.py:prepare_GGIT_data (GGIT) / prepare_IGGIELGN_data (IGGIELGN); helpers bcm_to_MW, diameter_to_capacity"
        provenance: "scripts/prepare_gas_network.py:prepare_GGIT_data; scripts/prepare_gas_network.py:diameter_to_capacity"
      - change: "region attribution and clustering to (bus0, bus1) segments"
        anchor: "scripts/prepare_gas_network.py:parse_states / get_states_in_order / cluster_gas_network"
        provenance: "scripts/prepare_gas_network.py:parse_states; scripts/prepare_gas_network.py:get_states_in_order"
      - change: "consumption of the clustered table (H2 routes + repurposing cap)"
        anchor: "scripts/prepare_sector_network.py:add_hydrogen (add_links_repurposed_H2_pipelines / add_links_new_H2_pipelines); Snakefile rule prepare_sector_network input pipelines"
        provenance: "scripts/prepare_sector_network.py:add_links_repurposed_H2_pipelines; Snakefile:pipelines"
      - change: "nodal gas commodity supply (buses, generator, store)"
        anchor: "scripts/prepare_sector_network.py:add_carrier_buses (called from convert_conventional_generators_to_links); spatial gas namespace in define_spatial"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:define_spatial"
      - change: "myopic gas-pipeline / H2 retrofit accounting (dormant)"
        anchor: "scripts/add_brownfield.py (carriers 'gas pipeline', 'H2 pipeline retrofitted'; ratio H2_retrofit_capacity_per_CH4)"
        provenance: "scripts/add_brownfield.py:H2_retrofit_capacity_per_CH4"
    data_dependencies:
      - input: "GEM-GGIT-Gas-Pipelines-December-2022.xlsx (fetched at runtime from github.com/pypsa-meets-earth/temporary_storage, read in-memory — not shipped in data/)"
        required_for: "network_data: GGIT (default)"
        availability: "must be built (auto-download inside rule prepare_gas_network); global coverage, but many pipelines lack capacity and fall back to diameter estimates"
      - input: "IGGIELGN.zip from zenodo -> data/gas_network/scigrid-gas/data/IGGIELGN_PipeSegments.geojson"
        required_for: "network_data: IGGIELGN"
        availability: "must be built (auto-download); Europe only"
      - input: "resources/<run>/bus_regions/regions_onshore_elec_s{simpl}_{clusters}.geojson"
        required_for: "attributing pipelines to bus regions in parse_states/cluster_gas_network"
        availability: "must be built (standard electricity workflow output)"
      - input: "resources/<sec>/gas_networks/gas_network_elec_s{simpl}_{clusters}.csv"
        required_for: "H2 routing/repurposing in add_hydrogen"
        availability: "must be built (rule prepare_gas_network); empty csv is written for regions where no pipeline crosses two bus regions — add_hydrogen then falls back to greenfield electricity routing"
      - input: "data/custom/pipelines.csv"
        required_for: "custom_data.gas_network: true"
        availability: "absent — user must supply"
      - input: "costs rows: gas (fuel, CO2 intensity), H2 (g) pipeline repurposed"
        required_for: "nodal gas supply cost and the repurposed-link cost"
        availability: "must be built (rule retrieve_cost_data); see hydrogen-pipelines carrier card for the H2 cost rows"
