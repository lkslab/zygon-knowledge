id: oil-power-plants
title: Oil power plants
summary: >
  Oil-fired power stations (diesel/HFO steam and engine plants) as
  dispatchable thermal generators — the existing fleet, optional expansion,
  and their fate in sector-coupled runs.
when_to_use:
  - "add oil power plants"
  - "diesel generators / HFO plants"
  - "oil-fired generation"
  - "remove oil plants / oil phase-out"
  - "oil fuel price for power"
  - "existing oil fleet"
  - "backup diesel capacity"
  - "pypsa-eur carrier name: oil"
  - "diesel generators / diesel power plants"
  - "HFO plants / heavy fuel oil power stations"
  - "oil-fired power plants"
  - "phase out oil generation / retire diesel plants"
  - "island grid running on diesel"
  - "backup gensets / emergency generators"
  - "fuel oil electricity generation"
  - "replace diesel with solar and storage"
  - "petroleum products in the power mix"
  - "expensive thermal generation in small grids"
  - "known in pypsa-eur as: oil"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Electricity workflow: "oil" is in electricity.conventional_carriers, so
        the existing oil fleet from powerplantmatching (rule build_powerplants)
        is attached by attach_conventional_generators as non-extendable
        Generators (p_nom_min = p_nom), with marginal cost = VOM +
        fuel/efficiency and CO2 emissions from the "oil" cost row
        (add_co2_emissions). Myopic/perfect-foresight sector runs: the existing
        oil fleet is rebuilt by add_existing_baseyear as oil->AC Links with
        build_year and lifetime ("Oil" fueltype maps to the "oil" carrier,
        drawing from the EU oil bus; existing_capacities.conventional_carriers
        includes oil), so it retires by age. The oil fuel itself is a
        first-class carrier in sector runs: a single "EU oil" bus with
        extendable supply generator, store, and optionally a refining step with
        process emissions (industry.oil_refining_emissions) — see the
        fossil-fuel-supply carrier card.
      mechanism: >
        rule build_powerplants -> rule add_electricity
        (attach_conventional_generators; costs from rule process_cost_data).
        Sector overnight: remove_elec_base_techs strips oil generators when the
        sector network is built (the pypsa_eur keep-list retains only nuclear
        among conventionals) and sector.conventional_generation has no oil
        entry by default — so overnight sector runs contain NO oil power.
        Adding "oil: oil" to sector.conventional_generation makes
        add_generation create extendable oil->AC Links at every node, bus0 =
        "EU oil" (define_spatial keeps spatial.oil.nodes EU-level regardless of
        sector.regional_oil_demand, which only regionalises demand carriers
        like naphtha/kerosene/shipping oil).
      not_covered: >
        No oil expansion in the default electricity workflow ('oil' is not in
        electricity.extendable_carriers.Generator; adding it places candidates
        only at buses with existing oil plants — electricity.
        everywhere_powerplants has no obvious oil fueltype convention in the
        default data, so check the powerplantmatching fueltype string when
        using it). No unit commitment data for oil (data/unit_commitment.csv
        has no oil column — adding one is a data edit). No dynamic monthly oil
        price in the electricity workflow fallback beyond what
        build_fossil_fuel_prices provides for mapped carriers; verify the oil
        column exists in monthly_fuel_price.csv before relying on
        conventional.dynamic_fuel_price for oil. No oil CC, no oil CHP by
        default (an "oil" entry in sector.chp.fuel would create an
        "urban central oil CHP" Link but priced with gas CHP cost rows — see
        combined-heat-and-power carrier card). In sector runs the oil consumed by
        re-added oil plants competes with Fischer-Tropsch synfuel and green
        oil imports on the same EU oil bus — there is no dedicated
        fossil-only power fuel.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/prepare_sector_network.py:add_generation; scripts/prepare_sector_network.py:define_spatial; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear; scripts/prepare_sector_network.py:remove_elec_base_techs"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing oil fleet (remove 'oil' to drop it)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: "Add 'oil' to allow oil-fired expansion (default: not extendable)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "DateIn/DateOut query — retire or exclude oil units by year."
        default: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"
        provenance: "config/config.default.yaml:powerplants_filter; scripts/build_powerplants.py:add_custom_powerplants"
      - key: sector.conventional_generation
        effect: "Add 'oil: oil' to restore oil power in overnight sector runs (extendable Links at every node from the EU oil bus)."
        default: "{OCGT: gas, CCGT: gas} — no oil entry"
        provenance: "config/config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:add_generation"
      - key: existing_capacities.conventional_carriers
        effect: "Keeps 'oil' in the myopic brownfield carry-over — existing oil plants appear in myopic sector runs with age-based retirement."
        default: "[lignite, coal, oil, uranium]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - key: sector.fossil_fuels
        effect: "false removes the fossil oil supply generator on the EU oil bus — any oil plants then run on Fischer-Tropsch synfuel, bioliquids or imports only."
        default: "true"
        provenance: "config/config.default.yaml:fossil_fuels; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: costs.overwrites
        effect: "Override the oil fuel price / plant efficiency / VOM in prepare_costs (deprecated config route; prefer data/custom_costs.csv via costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: electricity.custom_powerplants
        effect: "Inject user oil plant rows from data/custom_powerplants.csv (e.g. island diesel plants missing from powerplantmatching)."
        default: "false"
        provenance: "config/config.default.yaml:custom_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
    boundary:
      - variant: "run with the existing oil fleet (electricity workflow)"
        rung: L0
        note: "default — 'oil' in electricity.conventional_carriers"
      - variant: "oil phase-out"
        rung: L1
        note: "remove 'oil' from electricity.conventional_carriers and existing_capacities.conventional_carriers; overnight sector runs have no oil power anyway"
      - variant: "allow new oil-fired build"
        rung: L1
        note: "add 'oil' to electricity.extendable_carriers.Generator (candidates only at existing oil buses) — greenfield everywhere needs everywhere_powerplants or the sector route"
      - variant: "oil power in an overnight sector run"
        rung: L1
        note: "add 'oil: oil' to sector.conventional_generation — note fuel then shares the EU oil bus with synfuels and demand sectors"
      - variant: "cap national oil capacity"
        rung: L1
        note: "solving.constraints.CCL: true + oil rows in data/agg_p_nom_minmax.csv (add_CCL_constraints)"
      - variant: "change oil fuel price or plant efficiency"
        rung: L1
        note: "costs.overwrites {fuel: {oil: ...}} or data/custom_costs.csv (L3); in sector runs the supply generator price is costs.at oil fuel via add_carrier_buses"
      - variant: "add a specific (island/backup) diesel plant"
        rung: L3
        note: "row in data/custom_powerplants.csv (Fueltype Oil) + electricity.custom_powerplants: true"
      - variant: "unit commitment for oil plants"
        rung: L3
        note: "conventional.unit_commitment: true only covers carriers with a column in data/unit_commitment.csv — add an 'oil' column there"
      - variant: "regionalised oil fuel supply for power plants"
        rung: L5
        note: "spatial.oil.nodes is hardwired to a single EU bus in define_spatial; per-node oil supply means reworking that namespace and every oil consumer"
      - variant: "oil plant with carbon capture"
        rung: L5
        note: "no oil CC link anywhere; new link logic (pattern: the coal CC block in add_h2_gas_infrastructure) plus cost data needed"
    where:
      - change: "fleet attachment and (optional) extendable oil candidates"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (rule add_electricity)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; rules/build_electricity.smk:add_electricity"
      - change: "sector oil generation links (opt-in via conventional_generation)"
        anchor: "scripts/prepare_sector_network.py::add_generation"
        provenance: "scripts/prepare_sector_network.py:add_generation"
      - change: "EU oil bus, supply generator, store, refining emissions"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses and ::define_spatial (spatial.oil)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:define_spatial"
      - change: "myopic brownfield oil fleet"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - change: "custom oil plants / fleet filtering"
        anchor: "scripts/build_powerplants.py::add_custom_powerplants (rule build_powerplants)"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants; rules/build_electricity.smk:build_powerplants"
    data_dependencies:
      - input: "powerplantmatching database (fueltype Oil)"
        required_for: "existing fleet; myopic brownfield"
        availability: "retrieved by the workflow; European coverage decent but small peakers/backup units often missing — use custom_powerplants.csv"
      - input: "cost row 'oil' (fuel price, CO2 intensity) and an oil plant technology row for efficiency/VOM"
        required_for: "oil plant economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "data/custom_powerplants.csv"
        required_for: "user-added oil/diesel plants"
        availability: "template exists by default; rows user-authored"
      - input: "EU oil bus with fossil supply (add_carrier_buses)"
        required_for: "sector-run oil plant fuel"
        availability: "exists by default in sector runs while sector.fossil_fuels is true"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        The existing utility-scale oil fleet is modelled by default: "oil" is in
        electricity.conventional_carriers, plants come from the
        powerplantmatching database (rule build_powerplants; sources GEO, GPD,
        GEM; Fueltype "Oil" collects oil/diesel/gasoline/petrol synonyms,
        fuel_to_lifetime Oil 40 years in configs/powerplantmatching_config.yaml),
        the Fueltype is lowercased to carrier "oil" in load_powerplants, and
        attach_conventional_generators adds the plants as non-extendable
        Generators aggregated by (bus, carrier, grouping_year) with
        marginal/capital cost, efficiency and lifetime from the "oil" row of the
        technology-data costs file (marginal_cost = VOM + fuel/efficiency in
        load_costs, so oil sits at the expensive end of the merit order and is
        dispatched as peaker/last resort). CO2 emissions of the oil carrier come
        from the costs "CO2 intensity" and bind under Co2L/Ep opts. In sector
        runs, convert_conventional_generators_to_links turns every oil generator
        into a Link drawing from an explicit oil fuel bus (nodal by default via
        sector.oil.spatial_oil) with emissions accounted on the link
        (sector.conventional_generation maps oil -> oil by default).
      mechanism: >
        Snakefile rule build_powerplants -> resources/<run>/powerplants.csv;
        rule add_electricity runs scripts/add_electricity.py which calls
        load_powerplants (Fueltype -> carrier, vintage grouping via
        existing_capacities.grouping_years_power) and
        attach_conventional_generators. Costs come from rule retrieve_cost_data
        / process_cost_data.py::load_costs. Sector workflow:
        prepare_sector_network.py::convert_conventional_generators_to_links
        removes the oil generators and re-adds them as Links (bus0 = oil fuel
        bus from add_carrier_buses, bus2 = co2 atmosphere); the oil bus gets an
        extendable fuel Generator at marginal_cost = costs.at["oil","fuel"] and
        a Store seeded with fossil_reserves.oil.
      not_covered: >
        Small distributed and behind-the-meter backup gensets are essentially
        invisible: GEO/GPD/GEM catalogue utility-scale stations, and the
        OSM-generator route into powerplantmatching (EXTERNAL_DATABASE via
        convert_osm_to_pm, which maps diesel/gasoline tags to Oil) is commented
        out of matching_sources by default — so self-generation during outages
        and captive gensets are not represented. A single "oil" carrier lumps
        HFO steam, diesel engines and gasoline gensets together with one cost/
        efficiency row — no HFO-vs-diesel distinction. Oil is not extendable by
        default (not in electricity.extendable_carriers.Generator), and when
        made extendable candidates are only placed at buses already hosting oil
        plants (carrier_buses in attach_conventional_generators). No
        unit-commitment, min-load, start-up or ramping detail for gensets. No
        fuel supply chain (import logistics, country-specific fuel prices,
        subsidies) in the electricity-only workflow — fuel enters as one flat
        EUR/MWhth price in the costs file; sector runs add only a single fuel
        price at the oil bus plus an optional finite reserve.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; configs/powerplantmatching_config.yaml:fuel_to_lifetime"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing oil fleet (remove 'oil' for an immediate phase-out of existing HFO/diesel plants)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Add "oil" to allow capacity expansion — extendable oil generators are
          created only at buses that already host oil plants.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:carrier_buses"
      - key: electricity.powerplants_filter
        effect: "Pandas query on the fleet (DateIn/DateOut) — tightening it retires or excludes oil units by commissioning/retirement year (a dated phase-out of old diesel plants)."
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter; scripts/build_powerplants.py:main_query"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' injects user rows from data/custom_powerplants.csv (Fueltype Oil) — the route for HFO/diesel stations missing from the global databases, common in small Global-South grids."
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: >
          Country-wise min/max capacity limits per carrier (CSV at
          data/agg_p_nom_minmax.csv), enforced by add_CCL_constraints when "CCL"
          is in the opts wildcard — the hook for national oil build caps or
          keeping a mandated diesel reserve margin.
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - key: costs.year
        effect: "Selects the technology-data cost year (costs_<year>.csv) from which the 'oil' row (investment, VOM, fuel, efficiency, lifetime, CO2 intensity) is taken."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; scripts/process_cost_data.py:load_costs"
      - key: electricity.co2limit
        effect: "Annual CO2 cap applied when 'Co2L' (without a numeric suffix) is in opts — the main pressure squeezing oil out of the dispatch."
        default: "7.75e+7 (European default; adjust for the target region)"
        provenance: "config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: electricity.automatic_emission
        effect: "true: derive the Co2L base from historical national emissions of the modelled countries (automatic_emission_base_year) instead of co2base/co2limit — useful where no bespoke cap exists for a Global-South region."
        default: "false"
        provenance: "config.default.yaml:automatic_emission; scripts/prepare_network.py:emission_extractor"
      - key: sector.conventional_generation
        effect: "Generator->fuel-carrier map for sector runs; the 'oil: oil' entry makes convert_conventional_generators_to_links rebuild oil power plants as Links from the oil fuel bus (remove the entry to leave them as plain generators)."
        default: "OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass"
        provenance: "config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - key: sector.oil.spatial_oil
        effect: "true: one oil fuel bus per node ('<node> oil'); false: a single global 'Earth oil' bus — controls whether oil-fired links draw from nodal or pooled fuel supply in sector runs."
        default: "true"
        provenance: "config.default.yaml:spatial_oil; scripts/prepare_sector_network.py:spatial.oil.nodes"
      - key: fossil_reserves.oil
        effect: "Initial energy (TWh) in the oil-bus Store created by add_carrier_buses in sector runs — a finite (non-cyclic) national oil reserve instead of unlimited fuel."
        default: "100"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses"
    boundary:
      - variant: "run without oil / phase out the existing HFO-diesel fleet"
        rung: L0
        note: "remove 'oil' from electricity.conventional_carriers (or tighten electricity.powerplants_filter for a dated retirement)"
      - variant: "allow new oil/diesel build at existing sites (island expansion)"
        rung: L1
        note: >
          add 'oil' to electricity.extendable_carriers.Generator; candidates
          appear only at buses already hosting oil plants
      - variant: "cap or force national oil capacity (e.g. mandated diesel reserve)"
        rung: L1
        note: >
          electricity.agg_p_nom_limits + 'CCL' in scenario.opts; author rows for
          carrier oil in data/agg_p_nom_minmax.csv
      - variant: "squeeze oil out via emissions cap or carbon price"
        rung: L1
        note: >
          'Co2L' in opts (electricity.co2limit / co2base scaling /
          electricity.automatic_emission) or 'Ep' with costs.emission_prices;
          oil carrier emissions come from the costs CO2 intensity
      - variant: "local fuel price for HFO/diesel (imported fuel premium)"
        rung: L1
        note: >
          load_costs in process_cost_data.py reads per-attribute overwrites from
          the costs config (the fuel/investment/VOM/efficiency blocks are present
          but commented out in config.default.yaml); add costs.fuel: {oil: <EUR/MWhth>}
          — marginal_cost is recomputed as VOM + fuel/efficiency
      - variant: "add a specific HFO/diesel plant missing from the global databases"
        rung: L3
        note: "row in data/custom_powerplants.csv with Fueltype Oil + electricity.custom_powerplants: merge — frequently needed in Global-South grids where GEO/GPD/GEM coverage is thin"
      - variant: "pick up OSM-mapped diesel/oil plants"
        rung: L2
        note: >
          uncomment EXTERNAL_DATABASE under matching_sources and
          fully_included_sources in configs/powerplantmatching_config.yaml; the
          workflow already builds resources/<run>/powerplants_osm2pm.csv via
          convert_osm_to_pm (diesel/gasoline tags -> Fueltype Oil)
      - variant: "country-specific static derating / p_max_pu for oil plants"
        rung: L1
        note: >
          no entry in config.default.yaml, but rule add_electricity reads a
          top-level conventional: block (config.get) and
          attach_conventional_generators applies per-carrier attributes, either
          a scalar or a per-country CSV via conventional_inputs — add
          conventional: {oil: {p_max_pu: ...}}; config-only, no code edit
      - variant: "behind-the-meter backup gensets during outages (proxy)"
        rung: L3
        note: >
          honest gap — not modelled and invisible to powerplantmatching; a cheap
          proxy is aggregated per-region rows in data/custom_powerplants.csv
          (Fueltype Oil, Set PP) sized to the estimated genset stock, optionally
          derated via the conventional: block; there is no outage/reliability
          machinery to trigger them endogenously
      - variant: "split HFO steam vs diesel genset into separate carriers"
        rung: L3
        note: >
          powerplantmatching lumps everything into Fueltype Oil; needs new
          costs rows (technology-data has one 'oil' row) plus localised edits to
          the Fueltype/carrier mapping (convert_osm_to_pm in
          build_powerplants.py, carrier_dict in load_powerplants) and to
          electricity.conventional_carriers
      - variant: "greenfield oil at arbitrary buses (not just existing sites)"
        rung: L2
        note: >
          the extendable block in attach_conventional_generators derives
          carrier_buses from the existing fleet; small localised edit to offer
          candidates at all buses (or seed sites via custom_powerplants, L3)
      - variant: "oil plants drawing from an explicit fuel bus in sector runs"
        rung: L0
        note: >
          default: sector.conventional_generation maps oil -> oil and
          convert_conventional_generators_to_links rebuilds them as Links;
          sector.oil.spatial_oil toggles nodal vs single global oil bus,
          fossil_reserves.oil seeds a finite reserve
      - variant: "genset unit commitment / min-load / start-up costs"
        rung: L5
        note: "no committable/ramping machinery is applied to conventional generators in add_electricity; bespoke component settings and solve-time logic would be needed"
    where:
      - change: "fleet attachment + extendable conventional generators + per-carrier attribute overrides"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (conventional_config/conventional_inputs args; extendable candidates from carrier_buses)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/add_electricity.py:conventional_inputs"
      - change: "Fueltype -> carrier mapping and vintage grouping"
        anchor: "scripts/add_electricity.py::load_powerplants (carrier_dict, grouping via existing_capacities.grouping_years_power)"
        provenance: "scripts/add_electricity.py:load_powerplants; scripts/add_electricity.py:carrier_dict"
      - change: "fleet construction and matching config (Oil synonyms, lifetime, OSM external database)"
        anchor: "Snakefile rule build_powerplants; configs/powerplantmatching_config.yaml (matching_sources, fuel_to_lifetime Oil); scripts/build_powerplants.py::convert_osm_to_pm"
        provenance: "configs/powerplantmatching_config.yaml:matching_sources; scripts/build_powerplants.py:convert_osm_to_pm"
      - change: "top-level conventional: block plumbing (scalar or per-country CSV attributes)"
        anchor: "Snakefile rule add_electricity (params conventional + conventional_* inputs)"
        provenance: "Snakefile:conventional=config.get"
      - change: "cost assumptions / fuel-price overwrites"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data (fallback data/costs.csv row 'oil')"
        provenance: "scripts/process_cost_data.py:load_costs; data/costs.csv:oil,2030,fuel"
      - change: "country-wise capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints (activated by 'CCL' in opts)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "emissions cap / carbon price on oil dispatch"
        anchor: "scripts/prepare_network.py::add_co2limit / add_emission_prices ('Co2L' / 'Ep' in opts)"
        provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:add_emission_prices"
      - change: "sector-run conversion to fuel-bus links"
        anchor: "scripts/prepare_sector_network.py::convert_conventional_generators_to_links; ::add_carrier_buses (oil bus, fuel generator, reserve store)"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links; scripts/prepare_sector_network.py:add_carrier_buses"
    data_dependencies:
      - input: "powerplantmatching database (GEO, GPD, GEM; Fueltype Oil)"
        required_for: "existing fleet and the buses where extendable oil can be placed"
        availability: "region-dependent — utility-scale HFO/diesel stations only; small-grid and island plants are often missing, verify resources/<run>/powerplants.csv for the target countries"
      - input: "resources/<run>/osm/clean/all_clean_generators.csv -> powerplants_osm2pm.csv"
        required_for: "OSM-tagged diesel/oil plants via EXTERNAL_DATABASE"
        availability: "built by the workflow from OSM, but excluded from matching by default (EXTERNAL_DATABASE commented out); quality depends on local OSM tagging"
      - input: "data/custom_powerplants.csv"
        required_for: "plants missing from the databases; genset-stock proxies"
        availability: "template exists by default; rows user-authored"
      - input: "costs row 'oil' in retrieved technology-data (costs.technology_data_version)"
        required_for: "capital/marginal cost, fuel price, efficiency, lifetime, CO2 intensity"
        availability: "exists by default via rule retrieve_cost_data (fallback row in data/costs.csv)"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps/floors (CCL)"
        availability: "template exists by default; rows must be authored for oil"
      - input: "per-country attribute CSV for the conventional: block (e.g. oil p_max_pu)"
        required_for: "country-specific availability derating"
        availability: "absent — user-authored, wired in via conventional: {oil: {p_max_pu: <csv path>}}"
