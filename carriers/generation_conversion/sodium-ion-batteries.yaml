id: sodium-ion-batteries
title: Sodium-ion batteries
summary: Sodium-ion electrochemical storage — a Li-ion alternative with different cost structure, no distinct representation in the model.
when_to_use:
  - "sodium-ion battery / Na-ion"
  - "salt battery"
  - "cheaper battery chemistry than lithium"
  - "battery chemistry alternatives / lithium-free storage"
models:
  - model: pypsa-eur
    version_anchor: {ref: "f55cdf34f0e67a797fd4327bed26c56dedcb5cb8", date: "2026-10-09"}
    out_of_box:
      covers: >
        Nothing sodium-ion-specific — grounded absence. Unlike the other
        chemistry tokens (li-ion, lfp, vanadium, lair, pair, iron-air), no
        sodium/Na-ion key exists in STORE_LOOKUP or electricity.max_hours, and
        no sodium-ion cost rows exist in the technology-data costs file
        (verified in a locally built processed costs file: no row matches
        sodium; the closest unconsumed alternative chemistry is nickel-zinc,
        rows "Ni-Zn-store"/"Ni-Zn-bicharger"). The generic storage machinery
        is the only vehicle: the nearest proxies are the wired "battery" /
        "li-ion" tokens (both mapped to "battery storage"/"battery inverter")
        and "lfp" ("Lithium-Ion-LFP-store"/"-bicharger") with cost overrides.
      mechanism: >
        Not built by any rule. The entry points are attach_stores /
        attach_storageunits in scripts/add_electricity.py (rule
        add_electricity), which filter the configured carrier lists through
        get_available_storage_carriers — an unknown token like "sodium-ion" is
        silently skipped with a warning ("not implemented as storage
        technologies in PyPSA-Eur"), not an error. Beware the reverse
        direction: adding a key to electricity.max_hours that is not in
        STORE_LOOKUP crashes rule process_cost_data (prepare_costs does
        tech = STORE_LOOKUP[k] over all max_hours items), so config and code
        must be extended together.
      not_covered: >
        Everything: carrier, cost data, chemistry-specific behaviour.
        Functionally a sodium-ion battery is representable by the existing
        generic battery components with different cost/efficiency numbers.
      provenance: "scripts/add_electricity.py:STORE_LOOKUP; scripts/add_electricity.py:get_available_storage_carriers; scripts/process_cost_data.py:prepare_costs; scripts/add_electricity.py:attach_stores"
    levers:
      - key: electricity.max_hours.lfp
        effect: "Proxy route — re-cost the wired 'lfp' carrier (a distinct chemistry slot separate from 'battery') with sodium-ion numbers and set its duration here."
        default: "6"
        provenance: "config/config.default.yaml:max_hours; scripts/add_electricity.py:Lithium-Ion-LFP-store"
      - key: electricity.extendable_carriers.StorageUnit
        effect: "Where the proxy (or a new sodium-ion) carrier must be listed for the fixed-duration StorageUnit representation."
        default: "[] (empty)"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_storageunits"
      - key: electricity.extendable_carriers.Store
        effect: "Where the proxy (or a new sodium-ion) carrier must be listed for the Store+Links representation."
        default: "[battery, H2]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_stores"
      - key: costs.custom_cost_fn
        effect: "Path to the custom-costs CSV (planning_horizon, technology, parameter, value) merged over the technology-data rows in overwrite_costs — the ingestion path for sodium-ion numbers onto proxy rows."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "sodium-ion as a re-costed chemistry slot (proxy)"
        rung: L1
        note: "activate 'lfp' (keeps 'battery' free for Li-ion in the same run) and override the Lithium-Ion-LFP-store/-bicharger rows with sodium-ion numbers via data/custom_costs.csv or costs.overwrites"
      - variant: "distinct 'sodium-ion' carrier alongside the existing chemistries"
        rung: L3
        note: "both code and data: add a STORE_LOOKUP entry + electricity.max_hours key (L2 edit — note prepare_costs KeyErrors if max_hours gains a key without the lookup entry), AND author brand-new store/bicharger rows (investment, FOM, lifetime, efficiency) in data/custom_costs.csv — overwrite_costs explicitly concatenates technologies that don't already exist, and the raw attributes are applied BEFORE the annuity and max_hours synthesis, so new rows are fully functional"
      - variant: "sodium-ion in sector-coupled runs"
        rung: L3
        note: "same data gap; additionally no chemistry storage exists in prepare_sector_network — add a block there (home battery block is the template)"
      - variant: "chemistry-specific behaviour (temperature, degradation)"
        rung: L5
        note: "no hook; bespoke component logic/constraints"
    where:
      - change: "new storage carrier wiring (code half)"
        anchor: "scripts/add_electricity.py STORE_LOOKUP + ::attach_stores / ::attach_storageunits (rule compose_network)"
        provenance: "scripts/add_electricity.py:STORE_LOOKUP; scripts/add_electricity.py:attach_storageunits"
      - change: "cost row synthesis and custom-cost ingestion"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs (rule process_cost_data; costs.custom_cost_fn input)"
        provenance: "scripts/process_cost_data.py:prepare_costs; scripts/process_cost_data.py:overwrite_costs"
      - change: "sector-run storage additions"
        anchor: "scripts/prepare_sector_network.py (insert_electricity_distribution_grid home battery block as template)"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
    data_dependencies:
      - input: "sodium-ion cost rows (investment, FOM, lifetime, efficiency for store and inverter/bicharger)"
        required_for: "distinct sodium-ion carrier"
        availability: "absent — not in the technology-data costs file; must be user-authored as new rows in data/custom_costs.csv (overwrite_costs adds technologies that don't already exist)"
      - input: "cost rows 'Lithium-Ion-LFP-store' / 'Lithium-Ion-LFP-bicharger' (or 'battery storage'/'battery inverter') to be overridden"
        required_for: "proxy route"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Nothing sodium-ion-specific — grounded absence: no sodium/Na-ion carrier,
        config key, or code branch exists in scripts/ or config.default.yaml, and
        (unlike CAES, LAES, flow, gravity, iron-air) NO sodium-ion cost rows exist
        in the retrieved technology-data v0.13.2 costs file either (verified in a
        locally built costs_2030_elec.csv: no row matches sodium). The generic
        battery machinery (Store+Links or StorageUnit) is the only vehicle.
      mechanism: >
        Not built by any rule. Entry points are attach_stores / attach_storageunits
        in scripts/add_extra_components.py (rule add_extra_components); attach_stores
        hardcodes only "H2" and "battery" branches and attach_storageunits hardcodes
        lookup_store / lookup_dispatch dicts with only H2 and battery, so a new
        carrier name needs a code edit as well as costs data.
      not_covered: >
        Everything: carrier, costs data, and any chemistry-specific behaviour.
        Functionally a sodium-ion battery is representable by the existing generic
        battery components with different cost/efficiency numbers.
      provenance: scripts/add_extra_components.py:attach_stores
    levers:
      - key: electricity.max_hours.battery
        effect: Proxy route — set the duration of the generic battery StorageUnit representation to sodium-ion-typical values.
        default: "6"
        provenance: scripts/process_cost_data.py:costs_for_storage
      - key: electricity.extendable_carriers.Store
        effect: Carrier list read by attach_stores — config-side half of a distinct sodium-ion carrier (needs code branch + costs rows).
        default: "[battery, H2]"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: electricity.extendable_carriers.StorageUnit
        effect: Carrier list read by attach_storageunits — config-side half of a fixed-duration sodium-ion StorageUnit.
        default: "[]"
        provenance: scripts/add_extra_components.py:attach_storageunits
    boundary:
      - variant: Sodium-ion as a re-costed generic battery (proxy)
        rung: L1
        note: >
          Override the battery cost inputs from config: load_costs applies
          costs.marginal_cost (present by default) and investment/FOM/VOM/lifetime/
          efficiency override maps read via config.get("investment") etc. (present
          only as comments in config.default.yaml) — e.g. costs.investment:
          {battery storage: <Na-ion EUR/MWh-eq>, battery inverter: <EUR/MW>}.
          Replaces, not complements, Li-ion in the run.
      - variant: Distinct sodium-ion carrier alongside Li-ion
        rung: L3
        note: >
          Both data and code: no sodium-ion rows exist in technology-data v0.13.2,
          so supply costs rows (custom costs file via the data/costs.csv fallback
          path of rule process_cost_data, or a newer technology-data version via
          costs.technology_data_version), then make the L2 code edits — new branch
          in attach_stores (Store+Links) or lookup-dict entries in
          attach_storageunits plus a combined capital-cost row in load_costs.
      - variant: Sodium-ion in the sector chain
        rung: L3
        note: Same data gap; code entry point is add_storage in scripts/prepare_sector_network.py (battery block is hardcoded).
      - variant: Chemistry-specific behaviour (temperature, degradation)
        rung: L5
        note: No hook; bespoke component logic/constraints.
    where:
      - change: New Store+Link storage carrier
        anchor: scripts/add_extra_components.py, function attach_stores (rule add_extra_components)
        provenance: scripts/add_extra_components.py:attach_stores
      - change: New StorageUnit carrier (cost lookup dicts)
        anchor: scripts/add_extra_components.py, function attach_storageunits (lookup_store / lookup_dispatch)
        provenance: scripts/add_extra_components.py:lookup_store
      - change: Cost synthesis / custom costs ingestion
        anchor: scripts/process_cost_data.py, function load_costs (rule process_cost_data; offline fallback input data/costs.csv)
        provenance: scripts/process_cost_data.py:load_costs
      - change: Sector-chain storage block
        anchor: scripts/prepare_sector_network.py, function add_storage (rule prepare_sector_network)
        provenance: scripts/prepare_sector_network.py:add_storage
    data_dependencies:
      - input: Sodium-ion costs rows (investment, FOM, lifetime, efficiency for store and inverter)
        required_for: Distinct sodium-ion carrier
        availability: absent — not in technology-data v0.13.2 nor data/costs.csv; must be provided by the user
      - input: costs rows "battery storage" / "battery inverter" (to be overridden)
        required_for: Proxy route
        availability: exists by default
