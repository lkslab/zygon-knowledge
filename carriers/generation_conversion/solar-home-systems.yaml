id: solar-home-systems
title: Standalone solar home systems
summary: Household-scale off-grid PV kits (panel + battery + a few appliances) — autonomous home solar, below mini-grids; nearest model construct is grid-connected rooftop PV plus home batteries.
when_to_use:
  - "solar home systems / SHS"
  - "household off-grid solar kits"
  - "rooftop PV and home batteries"
  - "behind-the-meter solar at household scale"
  - "prosumers / self-consumption"
  - "electrify homes without grid connection"
  - "pay-as-you-go solar"
models:
  - model: pypsa-eur
    version_anchor: {ref: "09e8910ae03ace9af8ff821514cda7822fdd473f", date: "2026-10-12"}
    out_of_box:
      covers: >
        Not covered as standalone off-grid systems (a European model has no
        unelectrified households to serve — demand is metered national load).
        The grid-connected behind-the-meter analogue IS covered by default in
        sector runs, inside insert_electricity_distribution_grid: (a)
        "solar rooftop" generators on each node's "low voltage" bus,
        extendable up to a potential from rule
        build_solar_rooftop_potentials — which HARDCODES
        0.1 kW/m2 x 20 m2/person (i.e. 2 kW/person, population from the
        clustered pop layout, binned by solar resource class); rooftop
        shares the utility solar p_max_pu profile and gets the
        "solar-rooftop" cost row, while pre-existing "solar" generators are
        re-priced to "solar-utility"; (b) a "home battery" bus + Store per
        node with separate charger/discharger Links (cost rows
        "home battery storage" / "home battery inverter") — added
        UNCONDITIONALLY whenever the distribution grid option is on: unlike
        pypsa-earth there is no separate home-battery switch. In
        myopic/perfect foresight, the EXISTING PV fleet is split between
        rooftop and utility by existing_capacities.solar_rooftop_ratio
        (default 0.5): add_existing_baseyear relabels that share of
        historical solar capacity per vintage as "solar rooftop" on the LV
        side.
      mechanism: >
        Sector workflow: rule compose_network (prepare_sector_network.py) ->
        insert_electricity_distribution_grid (gated by
        sector.electricity_distribution_grid), consuming
        solar_rooftop_potentials.csv (only produced when
        "solar" is in electricity.renewable_carriers). Brownfield rooftop:
        scripts/add_existing_baseyear.py
        add_power_capacities_installed_before_baseyear
        (solar_rooftop_ratio parameter).
      not_covered: >
        Off-grid/autonomous operation (rooftop and home battery hang behind
        the extendable distribution link — they can always trade with the
        grid), household-level resolution (one aggregate LV bus per cluster
        region), SHS adoption/access economics, DC appliance loads. The
        rooftop potential assumptions (kW/m2, m2/person) are HARDCODED in
        build_solar_rooftop_potentials.py — pypsa-earth exposes
        them as config, eur does not. No rooftop in the electricity-only
        workflow (no LV layer there; all solar is utility-scale from
        build_renewable_profiles).
      provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/build_solar_rooftop_potentials.py:indicatormatrix; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Master switch for the LV layer — prerequisite and sole gate for rooftop PV and home batteries (both added inside insert_electricity_distribution_grid)."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: existing_capacities.solar_rooftop_ratio
        effect: "Myopic/perfect foresight: share of the existing PV fleet booked as 'solar rooftop' (LV side) vs utility solar; 0 disables the split."
        default: "0.5"
        provenance: "config/config.default.yaml:solar_rooftop_ratio; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - key: sector.transmission_efficiency
        effect: "The 'electricity distribution grid' efficiency_static (0.97) prices the grid alternative to self-consumption — losses rooftop+battery avoid by sitting on the LV bus."
        default: "electricity distribution grid: {efficiency_static: 0.97}"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: costs.overwrites
        effect: "Override 'solar-rooftop', 'home battery storage' or 'home battery inverter' cost assumptions in prepare_costs."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: electricity.renewable_carriers
        effect: "'solar' must be included for the rooftop potentials input to be built at all (conditional input in rule compose_network)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; rules/compose.smk:solar_rooftop_potentials"
    boundary:
      - variant: "rooftop PV + home batteries at every node (grid-connected)"
        rung: L0
        note: "default in sector runs — no switch to flip; disabling requires turning off the whole LV layer (sector.electricity_distribution_grid: false)"
      - variant: "existing rooftop fleet with vintages"
        rung: L0
        note: "myopic foresight — existing_capacities.solar_rooftop_ratio splits historical PV 50/50 by default"
      - variant: "change rooftop cost vs utility cost split"
        rung: L1
        note: "costs.overwrites on 'solar-rooftop' / 'solar-utility' rows"
      - variant: "different rooftop potential assumptions (kW/m2, roof area per person)"
        rung: L2
        note: "hardcoded 0.1 * 20 in scripts/build_solar_rooftop_potentials.py — edit there (no config keys, unlike pypsa-earth)"
      - variant: "home batteries without rooftop PV (or vice versa)"
        rung: L2
        note: "both live unconditionally inside insert_electricity_distribution_grid; comment out the respective n.add block (rooftop is skipped automatically only if the potentials input is empty)"
      - variant: "true standalone SHS serving demand with no grid link"
        rung: L5
        note: "requires household/off-grid demand separated from the national load (absent) plus isolated bus+PV+battery constructions — bespoke components and data"
      - variant: "self-consumption tariffs / net metering incentives"
        rung: L5
        note: "the LP has no tariff layer; only cost-based incentives via the rows above are expressible"
    where:
      - change: "rooftop PV + home battery creation and LV attachment"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (solar rooftop block, home battery block)"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/prepare_sector_network.py:home battery discharger"
      - change: "rooftop potential computation (hardcoded density assumptions)"
        anchor: "scripts/build_solar_rooftop_potentials.py (rule build_solar_rooftop_potentials)"
        provenance: "rules/build_sector.smk:build_solar_rooftop_potentials"
      - change: "brownfield rooftop split"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear (solar_rooftop_ratio branch)"
        provenance: "scripts/add_existing_baseyear.py:solar_rooftop_ratio"
      - change: "cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs (rows 'solar-rooftop', 'solar-utility', 'home battery storage', 'home battery inverter')"
        provenance: "scripts/process_cost_data.py:prepare_costs"
    data_dependencies:
      - input: "solar_rooftop_potentials.csv (population x 2 kW/person by resource class)"
        required_for: "rooftop p_nom_max"
        availability: "must be built (rule build_solar_rooftop_potentials; needs pop_layout_total.nc + regions_by_class solar + cutout)"
      - input: "cost rows solar-rooftop / solar-utility / home battery storage / home battery inverter"
        required_for: "rooftop-vs-utility economics and battery costs"
        availability: "exists by default (technology-data via rule retrieve_cost_data)"
      - input: "IRENA capacity statistics feeding existing renewable capacities"
        required_for: "brownfield rooftop split in myopic runs"
        availability: "retrieved by the workflow (existing-capacity inputs of rule compose_network)"
      - input: "household off-grid demand data"
        required_for: "true standalone SHS variant"
        availability: "absent — user-provided"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Not covered as standalone (off-grid) systems. The electricity-only chain
        has no distribution level at all — demand sits directly on HV buses
        (rule build_demand_profiles disaggregates national load by population/GDP)
        and all PV is utility-scale ('solar' generators from
        build_renewable_profiles/add_electricity). The sector chain provides the
        closest thing: prepare_sector_network's add_electricity_distribution_grid
        creates one aggregate "low voltage" bus per model node behind an
        extendable distribution Link, attaches AC loads there, and adds (a)
        'solar rooftop' generators with potential from population
        (kW_per_m2 x m2_per_person) or building footprints (use_building_size),
        and (b) 'home battery' stores. These are grid-connected behind-the-meter
        assets, not autonomous SHS.
      mechanism: >
        Sector workflow: prepare_sector_network.py, function
        add_electricity_distribution_grid, gated by
        sector.electricity_distribution_grid; rooftop PV potential optionally from
        Microsoft building footprints (enable.download_global_buildings and rule
        download_global_buildings).
      not_covered: >
        Off-grid households (unelectrified demand is not represented — national
        load is spread over grid buses), SHS adoption/costing as an access
        technology, DC appliance loads, and any household-level resolution.
      provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Master switch for the low-voltage layer (prerequisite for rooftop PV and home batteries)."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.enable
        effect: "Adds 'solar rooftop' generators on LV buses; p_nom_max from population or building area."
        default: "true"
        provenance: "config.default.yaml:solar_rooftop"
      - key: sector.solar_rooftop.kW_per_m2
        effect: "Rooftop PV areal power density used in the potential estimate."
        default: "0.1"
        provenance: "scripts/prepare_sector_network.py:kW_per_m2"
      - key: sector.solar_rooftop.m2_per_person
        effect: "Roof area per person for the population-based potential (with kW_per_m2 gives 2 kW/person by default)."
        default: "20"
        provenance: "scripts/prepare_sector_network.py:m2_per_person"
      - key: sector.solar_rooftop.use_building_size
        effect: "Use building-footprint layouts (solar_rooftop_layout inputs) instead of population for the rooftop potential."
        default: "false"
        provenance: "scripts/prepare_sector_network.py:use_building_size"
      - key: sector.home_battery
        effect: "Adds 'home battery' bus + store per node on the LV side."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:home_battery"
      - key: sector.transmission_efficiency
        effect: "Contains the 'electricity distribution grid' efficiency_static (default 0.97) — distribution losses deducted from AC demand."
        default: "electricity distribution grid: efficiency_static 0.97"
        provenance: "scripts/prepare_sector_network.py:transmission_efficiency"
      - key: enable.download_global_buildings
        effect: "Downloads GlobalMLBuildingFootprints — data source for building-size-based rooftop potential."
        default: "false"
        provenance: "config.default.yaml:download_global_buildings"
    boundary:
      - variant: "Aggregate rooftop PV + home batteries at every node"
        rung: L0
        note: "Default-on in the sector chain (sector.electricity_distribution_grid / solar_rooftop / home_battery)."
      - variant: "Tune SHS-like potential (kW per person, building-based)"
        rung: L1
        note: "sector.solar_rooftop kW_per_m2 / m2_per_person / use_building_size (the latter needs the buildings download enabled)."
      - variant: "Rooftop/home-battery in the electricity-only chain"
        rung: L2
        note: "No LV layer exists there; either run the sector chain or port a reduced add_electricity_distribution_grid into the elec pipeline — localised but real code."
      - variant: "True standalone SHS serving otherwise-unserved demand"
        rung: L5
        note: "Requires representing unelectrified demand separately (absent from build_demand_profiles' national-load disaggregation) plus isolated per-node PV+battery supply with no grid link — bespoke components and demand data."
      - variant: "SHS as an access/electrification policy scenario"
        rung: L5
        note: "Adoption dynamics and connection-cost trade-offs are outside the LP; only the capacity/cost consequences can be imposed exogenously."
    where:
      - change: "LV layer, rooftop PV, home battery"
        anchor: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "Building-footprint potential inputs"
        anchor: "rule download_global_buildings (enable.download_global_buildings) feeding solar_rooftop_layout inputs"
        provenance: "Snakefile:download_global_buildings"
      - change: "Demand that SHS would serve"
        anchor: "rule build_demand_profiles -> scripts/build_demand_profiles.py"
        provenance: "Snakefile:build_demand_profiles"
      - change: "SHS costs"
        anchor: "costs file rows 'solar-rooftop' / home battery technologies (rule retrieve_cost_data)"
        provenance: "scripts/prepare_sector_network.py:solar-rooftop"
    data_dependencies:
      - input: "population layouts (rule build_population_layouts, WorldPop)"
        required_for: "population-based rooftop potential"
        availability: "must be built (standard sector workflow)"
      - input: "GlobalMLBuildingFootprints extracts"
        required_for: "use_building_size potential"
        availability: "must be built (enable.download_global_buildings: true); region-dependent coverage"
      - input: "costs rows solar-rooftop / solar-utility / home battery"
        required_for: "cost split between rooftop and utility PV"
        availability: "exists by default (technology-data via rule retrieve_cost_data)"
      - input: "household electrification / unserved-demand data"
        required_for: "true standalone SHS variant"
        availability: "absent — user-provided"
