id: solar-mini-grids
title: Solar mini-grids
summary: Community-scale islanded or weakly-connected solar+storage systems serving settlements off or at the edge of the main grid.
when_to_use:
  - "mini-grids / micro-grids for rural electrification"
  - "off-grid solar for villages or communities"
  - "islanded community power systems"
  - "grid extension vs decentralised supply"
  - "isolated networks / islands in the model"
  - "community energy with solar and batteries"
  - "off-grid solar for villages"
  - "electrification of settlements far from the grid"
  - "isolated networks in the model"
models:
  - model: pypsa-eur
    version_anchor: {ref: "2924c5089860dd058ea2a395b9a9f946de3f9536", date: "2026-10-26"}
    out_of_box:
      covers: >
        Not covered — and, unlike pypsa-earth, there is no electrification-gap
        motivation for them in a European model: demand data comes from
        metered national statistics, so no unelectrified settlements exist to
        serve. Structurally the workflow actively removes anything mini-grid
        shaped: rule base_network keeps only the largest connected component
        and deletes disconnected fragments below a hardcoded threshold of 6
        buses (_remove_unconnected_components, threshold=6 — a function
        default, not config), and simplify_network's remove_stubs merges
        dead-end buses into their neighbours. Small real island grids
        therefore appear only insofar as they are physically interconnected
        in the base data (Corsica is even special-cased: a supernode is
        preserved via find_closest_bus / node_corsica in simplify_links so
        the island is not folded into a mainland DC corridor). The nearest
        existing construct is the sector chain's aggregate LV layer —
        insert_electricity_distribution_grid adds a "low voltage" bus per
        node with "solar rooftop" generators and "home battery" storage
        behind an extendable distribution link — which is decentralised
        solar+storage economics, but grid-connected and aggregated to
        cluster-region scale, never islanded.
      mechanism: >
        Isolation handling: scripts/base_network.py
        _remove_unconnected_components (connected-component analysis on the
        adjacency matrix, keeps component_sizes.index[0]); stub removal via
        clustering.simplify_network.remove_stubs
        (scripts/simplify_network.py remove_stubs, optionally
        remove_stubs_across_borders). Decentralised solar+storage stand-in:
        scripts/prepare_sector_network.py
        insert_electricity_distribution_grid (see
        electricity-distribution-grid and solar-home-systems carrier cards).
      not_covered: >
        Settlement-level siting, mini-grid vs grid-extension competition,
        islanded operation and autonomy constraints, diesel-hybrid
        mini-grids, electrification-access accounting, and any keeping-alive
        of small disconnected components (the 6-bus threshold is not a
        config key).
      provenance: "scripts/base_network.py:_remove_unconnected_components; scripts/simplify_network.py:remove_stubs; scripts/simplify_network.py:node_corsica; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
    levers:
      - key: clustering.simplify_network.remove_stubs
        effect: "false keeps dead-end (stub) buses as separate nodes instead of merging them — the closest knob to preserving grid-edge structure."
        default: "true"
        provenance: "config/config.default.yaml:remove_stubs; scripts/simplify_network.py:remove_stubs"
      - key: clustering.simplify_network.remove_stubs_across_borders
        effect: "Whether stub removal may merge across country borders."
        default: "false"
        provenance: "config/config.default.yaml:remove_stubs_across_borders; scripts/simplify_network.py:remove_stubs"
      - key: sector.electricity_distribution_grid
        effect: "Sector chain: enables the aggregate LV bus + distribution link per node — prerequisite for the decentralised solar rooftop / home battery stand-ins."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: electricity.autarky
        effect: "enable + by_country: true severs cross-border exchange — a country-scale (not settlement-scale) self-sufficiency experiment, the only islanding lever that exists."
        default: "{enable: false, by_country: false}"
        provenance: "config/config.default.yaml:autarky; scripts/prepare_network.py:enforce_autarky"
    boundary:
      - variant: "aggregate decentralised solar+storage at every node (grid-connected)"
        rung: L0
        note: "default in sector runs — solar rooftop + home battery on the LV buses of insert_electricity_distribution_grid"
      - variant: "self-sufficient country (macro islanding)"
        rung: L0
        note: "electricity.autarky.enable: true, by_country: true"
      - variant: "keep small disconnected grid fragments instead of deleting them"
        rung: L2
        note: "the 6-bus cut-off is a default argument of _remove_unconnected_components in base_network.py — not exposed in config; lower it (or skip the call) locally"
      - variant: "model one specific island/community as its own node"
        rung: L2
        note: "depends on the base data containing it; then prevent merging via clustering (focus_weights / administrative mode in the clustering config) or edits in simplify_network — no per-place keep-list exists"
      - variant: "mini-grid vs grid-extension competition per settlement"
        rung: L4
        note: "needs settlement demand points and candidate connection links — new rules and wildcard plumbing; no population-to-settlement demand machinery exists (demand enters per NUTS3/cluster region via build_electricity_demand_base)"
      - variant: "islanded operational detail (autonomy, reliability targets)"
        rung: L5
        note: "bespoke components/constraints; outside what the continental-scale LP resolves"
    where:
      - change: "disconnected-component removal threshold"
        anchor: "scripts/base_network.py::_remove_unconnected_components (called in ::base_network)"
        provenance: "scripts/base_network.py:_remove_unconnected_components"
      - change: "stub merging"
        anchor: "scripts/simplify_network.py::remove_stubs / remove_stubs_within_admin (clustering.simplify_network config)"
        provenance: "scripts/simplify_network.py:remove_stubs_within_admin"
      - change: "aggregate LV solar/battery stand-in"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "regional demand placement (what a mini-grid would serve)"
        anchor: "rule build_electricity_demand_base -> scripts/build_electricity_demand_base.py"
        provenance: "rules/build_electricity.smk:build_electricity_demand_base"
    data_dependencies:
      - input: "base grid dataset containing the island/edge assets in question"
        required_for: "any representation of a specific small grid"
        availability: "region-dependent (OSM prebuilt coverage)"
      - input: "settlement-level demand and electrification data"
        required_for: "mini-grid vs grid-extension variant (L4)"
        availability: "absent — not part of a European workflow; user-provided"
      - input: "solar rooftop potentials + population layouts"
        required_for: "the LV solar/battery stand-in"
        availability: "must be built (rules build_solar_rooftop_potentials, build_clustered_population_layouts)"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Not covered as mini-grids. The model has no distribution level in the
        power chain: only OSM assets above clean_osm_data_options.threshold_voltage
        (51 kV) enter the network, so mini-grids are invisible in the data. What
        the workflow DOES have is explicit handling of isolated (sub)networks that
        emerge from patchy OSM coverage: simplify_network drops isolated networks
        below a power threshold (drop_isolated_networks, config
        cluster_options.simplify_network.p_threshold_drop_isolated) or merges them
        into a single isolated bus (p_threshold_merge_isolated) — i.e. small
        detached grids are cleaned away or lumped, not modelled as candidate
        mini-grids. Demand is allocated to grid buses from population/GDP
        (build_demand_profiles), including people who in reality are unelectrified.
      mechanism: >
        Nearest mechanisms: (a) isolated-network handling in
        scripts/simplify_network.py (drop_isolated_networks); (b) in the sector
        chain, prepare_sector_network's add_electricity_distribution_grid adds one
        aggregate "low voltage" bus per node with rooftop PV (solar_rooftop) and
        home batteries (home_battery) behind a distribution Link — an aggregate
        stand-in for decentralised solar+storage, though grid-connected, not
        islanded.
      not_covered: >
        Settlement-level siting, mini-grid vs grid-extension competition, islanded
        operation, diesel-hybrid mini-grids, and any electrification-access
        accounting.
      provenance: "scripts/simplify_network.py:drop_isolated_networks"
    levers:
      - key: cluster_options.simplify_network.p_threshold_drop_isolated
        effect: "Isolated (sub)networks/nodes with mean power below this [MW] are discarded — raise/lower to keep or drop small detached grids."
        default: "20"
        provenance: "scripts/simplify_network.py:p_threshold_drop_isolated"
      - key: cluster_options.simplify_network.p_threshold_merge_isolated
        effect: "Isolated networks below this [MW] are merged into a single isolated bus instead of being kept separate."
        default: "300"
        provenance: "scripts/simplify_network.py:p_threshold_merge_isolated"
      - key: cluster_options.simplify_network.s_threshold_fetch_isolated
        effect: "Share of national load above which an isolated network is merged into the backbone network."
        default: "false"
        provenance: "config.default.yaml:s_threshold_fetch_isolated"
      - key: sector.electricity_distribution_grid
        effect: "Sector chain only: adds aggregate low-voltage buses + distribution Links per node — prerequisite for the decentralised solar/battery stand-ins."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.enable
        effect: "Sector chain: adds 'solar rooftop' generators on low-voltage buses with population- or building-derived potential."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.home_battery
        effect: "Sector chain: adds home battery stores on low-voltage buses."
        default: "true"
        provenance: "config.default.yaml:home_battery"
    boundary:
      - variant: "Keep small isolated grids in the model instead of dropping them"
        rung: L0
        note: "Lower p_threshold_drop_isolated / p_threshold_merge_isolated; each isolated network is then optimised as its own island within the LP."
      - variant: "Aggregate decentralised solar+storage at every node (sector chain)"
        rung: L0
        note: "sector.electricity_distribution_grid + solar_rooftop + home_battery are on by default in the sector workflow."
      - variant: "Represent a known mini-grid fleet as capacity"
        rung: L3
        note: "Feed it in as custom powerplants data (electricity.custom_powerplants: 'merge' with a custom powerplants file) — it lands on the nearest HV bus, losing the islanded character."
      - variant: "Mini-grid vs grid-extension competition per settlement"
        rung: L4
        note: "Needs a new rule building settlement/off-grid demand points (population rasters exist via build_population_layouts; electrification status does not) plus candidate mini-grid buses and connection Links — new wildcard-level plumbing."
      - variant: "Islanded operational detail (autonomy, reliability targets)"
        rung: L5
        note: "Bespoke components and constraints; outside what the national-scale LP resolves."
    where:
      - change: "Isolated-network thresholds"
        anchor: "scripts/simplify_network.py:drop_isolated_networks + cluster_options.simplify_network config"
        provenance: "scripts/simplify_network.py:drop_isolated_networks"
      - change: "Aggregate LV solar/battery stand-in"
        anchor: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "Demand placement (who a mini-grid would serve)"
        anchor: "rule build_demand_profiles -> scripts/build_demand_profiles.py (population/GDP disaggregation, load_options)"
        provenance: "Snakefile:build_demand_profiles"
      - change: "Known mini-grid capacity as data"
        anchor: "config electricity.custom_powerplants + rule build_powerplants"
        provenance: "config.default.yaml:custom_powerplants"
    data_dependencies:
      - input: "population layouts / WorldPop rasters (build_shape_options.worldpop_method)"
        required_for: "locating decentralised demand and rooftop potential"
        availability: "exists by default in the workflow (region-dependent quality)"
      - input: "settlement-level electrification-status data"
        required_for: "mini-grid vs grid-extension variant (L4)"
        availability: "absent — user-provided"
      - input: "custom powerplants file"
        required_for: "representing an existing mini-grid fleet"
        availability: "absent — user-provided"
