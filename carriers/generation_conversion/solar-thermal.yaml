id: solar-thermal
title: Solar thermal collectors
summary: >
  Solar collectors converting solar irradiation directly to low-temperature
  heat for buildings and district heating networks.
when_to_use:
  - "solar thermal"
  - "solar water heater"
  - "solar collectors for heating"
  - "solar hot water"
  - "rooftop solar thermal panels"
  - "solar-assisted district heating"
  - "solar district heating plant"
  - "collector tilt / orientation"
  - "pypsa-eur carrier names: urban central solar thermal, urban decentral solar thermal, rural solar thermal (generators '... solar thermal collector')"
  - "SWH deployment"
  - "known in pypsa-eur as: solar thermal, residential rural solar thermal, services rural solar thermal, residential urban decentral solar thermal, services urban decentral solar thermal, urban central solar thermal"
models:
  - model: pypsa-eur
    version_anchor: {ref: "492f05d32e91ff76b26a7ee67604811a54cb315a", date: "2026-10-10"}
    out_of_box:
      covers: >
        On by default (sector.solar_thermal: true). Rule
        build_solar_thermal_profiles computes a population-weighted collector
        yield time series per cluster region with atlite's
        cutout.solar_thermal, parameterised by the TOP-LEVEL solar_thermal
        config chapter (clearsky_model: simple, orientation slope 45 /
        azimuth 180, own cutout key). In add_heat every heat bus of ALL FIVE
        heat systems receives an extendable Generator
        "{heat_system} solar thermal collector" (carrier
        "{heat_system} solar thermal"): p_max_pu is the profile scaled by
        sector.solar_cf_correction (0.788457) and divided by 1e3, converting
        W/m2 into MW per 1000 m2 of collector — capacity is denominated in
        collector area blocks. Costs come from the technology-data rows
        "decentral solar thermal" / "central solar thermal" (via
        heat_system.central_or_decentral) times
        sector.overdimension_heat_generators. Because it sits on the combined
        heat bus, it supplies space AND hot water demand, competing against
        heat pumps, resistive heaters, boilers and CHP, and it pairs naturally
        with the water tank / water pit stores on the same buses
        (thermal-storage family) — including seasonal solar-district-heat via
        urban central water pits.
      mechanism: >
        rule build_solar_thermal_profiles (input gated on
        config sector.solar_thermal in rule compose_network) ->
        solar_thermal_total nc -> prepare_sector_network add_heat
        (options["solar_thermal"] block reads the profile, applies
        solar_cf_correction, then adds one collector generator per heat
        system).
      not_covered: >
        No potential/area cap of any kind: p_nom is unbounded (no p_nom_max, no
        rooftop-area link — contrast rooftop PV, which gets potentials from
        rule build_solar_rooftop_potentials; nothing analogous is
        wired for solar thermal, and solar thermal does not compete with
        rooftop PV for roof space). No temperature adequacy check against the
        district heating forward temperature (the same profile feeds 55 C
        decentral and up-to-130 C urban central buses). No existing solar
        thermal stock in myopic runs
        (add_heating_capacities_installed_before_baseyear covers heat pumps,
        resistive heaters, gas/oil/biomass boilers only; existing_heating_raw.csv
        has no solar thermal column). No concentrating/evacuated-tube vs
        flat-plate distinction and no solar process heat for industry.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:solar thermal collector; scripts/build_solar_thermal_profiles.py:solar_thermal; rules/build_sector.smk:build_solar_thermal_profiles; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
    levers:
      - key: sector.solar_thermal
        effect: "Master switch; false removes all collector generators (and the profile input)."
        default: "true"
        provenance: "config/config.default.yaml:solar_thermal; scripts/prepare_sector_network.py:solar_thermal"
      - key: sector.solar_cf_correction
        effect: "Calibration multiplier on the atlite collector yield."
        default: "0.788457"
        provenance: "config/config.default.yaml:solar_cf_correction; scripts/prepare_sector_network.py:solar_cf_correction"
      - key: solar_thermal.orientation
        effect: "Collector slope/azimuth passed to atlite cutout.solar_thermal."
        default: "{slope: 45.0, azimuth: 180.0}"
        provenance: "config/config.default.yaml:orientation; scripts/build_solar_thermal_profiles.py:solar_thermal"
      - key: solar_thermal.clearsky_model
        effect: "Atlite clearsky model used in the conversion ('simple' or 'enhanced')."
        default: "simple"
        provenance: "config/config.default.yaml:clearsky_model; rules/build_sector.smk:build_solar_thermal_profiles"
      - key: solar_thermal.cutout
        effect: "Which weather cutout drives the collector profile."
        default: "default"
        provenance: "config/config.default.yaml:cutout; rules/build_sector.smk:build_solar_thermal_profiles"
      - key: sector.overdimension_heat_generators
        effect: "Capital-cost multiplier for peak oversizing (1.1 decentral / 1.0 central applies to collectors)."
        default: "{decentral: 1.1, central: 1.0}"
        provenance: "config/config.default.yaml:overdimension_heat_generators; scripts/prepare_sector_network.py:overdim_factor"
      - key: costs.overwrites
        effect: "Override 'central solar thermal' / 'decentral solar thermal' investment or lifetime."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "solar thermal competes for building and district heat"
        rung: L0
        note: "default — extendable collectors on every heat bus"
      - variant: "disable solar thermal"
        rung: L0
        note: "sector.solar_thermal: false"
      - variant: "change collector tilt/azimuth or clearsky model"
        rung: L1
        note: "solar_thermal.orientation / solar_thermal.clearsky_model (top-level chapter, not under sector:)"
      - variant: "calibrate collector yield to observed output"
        rung: L1
        note: "sector.solar_cf_correction"
      - variant: "rooftop-area or per-capita potential cap"
        rung: L2
        note: "no key and no potential input; set p_nom_max on the collector n.add in add_heat (a data-driven cap would mirror build_solar_rooftop_potentials, L3+L4)"
      - variant: "only district-scale (or only building-scale) solar thermal"
        rung: L2
        note: "single global switch covers all five systems; guard the add_heat solar block by heat_system to restrict"
      - variant: "temperature-class collector model (flat-plate vs evacuated tube vs concentrating)"
        rung: L5
        note: "one atlite parameterisation and one cost row per central/decentral; multiple collector classes need parallel profiles + generators"
      - variant: "solar process heat for industry"
        rung: L2
        note: "industry heat has no solar route; with sector.industry_t.endogen (fork) the band buses exist (served by gas/H2/biomass firing, electric boilers and heat pumps in add_t_industry*), so a solar-thermal link onto heat100-200 industry is a code branch there plus the profile input"
      - variant: "existing solar thermal stock (brownfield)"
        rung: L2
        note: "not in the myopic heating vintages; extend add_heating_capacities_installed_before_baseyear and the existing_heating_raw.csv data (L3) to include it"
    where:
      - change: "collector generator creation (profile scaling, costs)"
        anchor: "scripts/prepare_sector_network.py::add_heat (options['solar_thermal'] blocks, suffix 'solar thermal collector')"
        provenance: "scripts/prepare_sector_network.py:solar thermal collector; scripts/prepare_sector_network.py:solar_cf_correction"
      - change: "yield profile computation"
        anchor: "scripts/build_solar_thermal_profiles.py (rule build_solar_thermal_profiles; atlite cutout.solar_thermal)"
        provenance: "scripts/build_solar_thermal_profiles.py:cutout.solar_thermal"
      - change: "collector parameters"
        anchor: "config solar_thermal chapter (top level), passed as params.solar_thermal"
        provenance: "config/config.default.yaml:clearsky_model; rules/build_sector.smk:build_solar_thermal_profiles"
    data_dependencies:
      - input: "atlite cutout named by solar_thermal.cutout + population layout"
        required_for: "collector yield profile"
        availability: "exists by default (cutout chain)"
      - input: "cost rows 'central solar thermal', 'decentral solar thermal'"
        required_for: "capital cost and lifetime"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        When sector.solar_thermal is true (default), add_heat adds an extendable
        GENERATOR "{name} solar thermal collector" directly on the heat bus of EVERY
        heat system ("residential rural", "services rural", "residential urban
        decentral", "services urban decentral", "urban central"), with p_max_pu set to
        a population-weighted collector availability time series and capital
        cost/lifetime from the "decentral solar thermal" / "central solar thermal"
        cost rows. Profiles are built by rule build_solar_thermal_profiles using
        atlite cutout.solar_thermal with the top-level solar_thermal config
        (clearsky_model: simple; orientation slope 45, azimuth 180), then scaled by
        sector.solar_cf_correction and converted W/m2 -> MW per 1000 m2 in
        prepare_heat_data.
      mechanism: >
        rule build_solar_thermal_profiles (ERA5 cutout + pop layouts ->
        solar_thermal_{total,urban,rural}.nc) -> rule prepare_heat_data
        (solar_cf_correction * profile / 1e3 -> solar_thermal csv) -> rule
        prepare_sector_network / add_heat (n.madd Generator on heat buses, gated by
        options["solar_thermal"]).
      not_covered: >
        No dedicated hot-water-only collector (serves the combined space+water heat
        bus); no rooftop-area potential limit on collector capacity (p_nom is
        unconstrained); no seasonal pit storage tied to solar DH (only generic water
        tanks); concentrating solar (renewable.csp) exists but as an electricity
        generator, not process/building heat.
      provenance: "scripts/prepare_sector_network.py:solar thermal collector"

    levers:
      - key: sector.solar_thermal
        effect: Enables/disables solar thermal collectors on all heat buses.
        default: "true"
        provenance: "config.default.yaml:solar_thermal; scripts/prepare_sector_network.py:solar_thermal"
      - key: sector.solar_cf_correction
        effect: Multiplier on the raw atlite collector profile (calibration factor).
        default: "0.788457"
        provenance: "config.default.yaml:solar_cf_correction; scripts/prepare_heat_data.py:solar_cf_correction"
      - key: solar_thermal.clearsky_model
        effect: Atlite clearsky model used for the collector simulation.
        default: "simple"
        provenance: "config.default.yaml:clearsky_model; scripts/build_solar_thermal_profiles.py:solar_thermal_config"
      - key: solar_thermal.orientation.slope
        effect: Collector tilt angle in degrees passed to atlite cutout.solar_thermal.
        default: "45."
        provenance: "config.default.yaml:orientation; scripts/build_solar_thermal_profiles.py:solar_thermal_config"
      - key: solar_thermal.orientation.azimuth
        effect: Collector azimuth in degrees (180 = equator-facing in the northern hemisphere convention used by atlite).
        default: "180."
        provenance: "config.default.yaml:orientation; scripts/build_solar_thermal_profiles.py:solar_thermal_config"

    boundary:
      - variant: "Enable/disable solar thermal competition for heat"
        rung: L0
        note: "sector.solar_thermal (on by default)."
      - variant: "Change collector tilt/azimuth or clearsky model"
        rung: L1
        note: "Top-level solar_thermal config block, consumed by rule build_solar_thermal_profiles."
      - variant: "Calibrate collector yield"
        rung: L1
        note: "sector.solar_cf_correction."
      - variant: "Different collector performance model (beyond atlite's parameterisation)"
        rung: L2
        note: "Edit build_solar_thermal_profiles.py (the cutout.solar_thermal call and post-processing)."
      - variant: "Rooftop-area or per-capita potential limit on collector capacity"
        rung: L5
        note: "No p_nom_max is set on the collector Generators; needs new potential data (L3) plus logic in add_heat."
      - variant: "Solar process heat for industry"
        rung: L5
        note: "Industry demand is not connected to solar collectors; new component logic required."

    where:
      - change: "Collector profile generation"
        anchor: "rule build_solar_thermal_profiles (atlite cutout.solar_thermal, population-weighted)"
        provenance: "scripts/build_solar_thermal_profiles.py:solar_thermal"
      - change: "Profile scaling and unit conversion"
        anchor: "scripts/prepare_heat_data.py:prepare_heat_data (solar_cf_correction block)"
        provenance: "scripts/prepare_heat_data.py:solar_cf_correction"
      - change: "Collector Generator addition on heat buses"
        anchor: "scripts/prepare_sector_network.py:add_heat (options['solar_thermal'] block)"
        provenance: "scripts/prepare_sector_network.py:solar thermal collector"

    data_dependencies:
      - input: "ERA5 cutout (solar influx) covering the model region"
        required_for: "Collector availability profiles"
        availability: "must be built or retrieved (enable.retrieve_cutout / build_cutout)"
      - input: "Population layouts (total/urban/rural)"
        required_for: "Weighting collector profiles to where heat demand sits"
        availability: "must be built (build_population_layouts)"
      - input: "Cost rows 'decentral solar thermal' / 'central solar thermal'"
        required_for: "Collector investment costs and lifetime"
        availability: "exists by default (retrieve_cost_data from technology-data)"
