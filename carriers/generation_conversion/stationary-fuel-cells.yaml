id: stationary-fuel-cells
title: Stationary hydrogen fuel cells
summary: >
  Grid-scale fuel cells reconverting hydrogen to electricity, with
  optional waste-heat delivery to district heating — one of the two H2
  re-electrification routes.
when_to_use:
  - "stationary fuel cells"
  - "hydrogen to power / H2 re-electrification"
  - "fuel cell power plant"
  - "fuel cell waste heat / fuel cell CHP"
  - "SOFC / PEMFC"
  - "hydrogen backup generation"
  - "pypsa-eur carrier names: H2 Fuel Cell, H2 turbine"
  - "fuel cells for power generation"
  - "hydrogen reconversion to electricity"
  - "H2 as long-duration storage discharge"
  - "fuel cell CHP (combined heat and power)"
  - "backup power from hydrogen"
  - "known in pypsa-eur as: H2 Fuel Cell, H2 fuel cell, H2 turbine"
models:
  - model: pypsa-eur
    version_anchor: {ref: "29489d3b97bc7e5023aa02b96d3112e58258df7a", date: "2026-10-11"}
    out_of_box:
      covers: >
        ON by default in both workflows. Sector runs: with
        sector.hydrogen_fuel_cell true, add_h2_gas_infrastructure adds an
        extendable "H2 Fuel Cell" Link at every node (nodal H2 bus ->
        electricity), efficiency and capital cost from the "fuel cell" cost
        row (fixed cost given per MWel, so capital_cost is multiplied by
        efficiency). Where district heating exists, add_waste_heat turns it
        into a de-facto cogeneration unit: sector.use_fuel_cell_waste_heat
        defaults to 1 (100%), adding bus2 = urban central heat with
        efficiency2 = (0.95 - efficiency) — i.e. out of the box the fuel
        cell delivers ALL its recoverable waste heat to district heating at
        urban central nodes, which materially improves its economics
        against the competing "H2 turbine" (sector.hydrogen_turbine, also
        default true, an independent Link priced with OCGT cost and
        efficiency assumptions and no heat credit; both routes coexist and
        the optimiser picks). Electricity-only workflow: "H2" in
        electricity.extendable_carriers.Store makes attach_stores add a
        per-bus "Fuel Cell" discharger Link (STORE_LOOKUP, discharger
        "fuel cell") as part of the H2 storage cycle. Myopic runs carry
        built fuel-cell capacity forward via add_brownfield.
      mechanism: >
        rule compose_network -> add_h2_gas_infrastructure
        (hydrogen_fuel_cell block, directly after electrolysis); waste-heat
        rewiring in add_waste_heat (only nodes with an "urban central heat"
        bus); electricity workflow via scripts/add_electricity.py::
        attach_stores. The fuel-cell efficiency also parametrises H2
        shipping propulsion in add_shipping (demand conversion), unrelated
        to the stationary asset.
      not_covered: >
        A single generic "fuel cell" technology — no SOFC/PEMFC classes,
        no degradation, no size classes. Electricity is the ONLY modelled
        product outside district-heating areas; there is no building-level
        fuel-cell micro-CHP (micro CHP is gas-fired only — see
        combined-heat-and-power, which also documents that no H2-fuelled
        CHP multilink exists). The waste-heat coupling exists ONLY at urban
        central (district heating) nodes; rural/decentral fuel cells are
        power-only. No capacity caps/floors via config (Link, so the CCL
        Generator machinery does not apply). Mobile fuel cells (cars,
        trucks, shipping) are separate demand-side machinery.
      provenance: "scripts/prepare_sector_network.py:H2 Fuel Cell; scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:add_waste_heat; scripts/add_electricity.py:attach_stores; scripts/add_electricity.py:STORE_LOOKUP"
    levers:
      - key: sector.hydrogen_fuel_cell
        effect: "Adds/removes the nodal H2 Fuel Cell links in sector runs."
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_fuel_cell; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.use_fuel_cell_waste_heat
        effect: "Fraction (0-1) of recoverable fuel-cell waste heat (0.95 minus electric efficiency) delivered to urban central heat buses; 0/false makes fuel cells electricity-only."
        default: "1"
        provenance: "config/config.default.yaml:use_fuel_cell_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.hydrogen_turbine
        effect: "The competing H2-to-power route ('H2 turbine' with OCGT cost assumptions); false leaves fuel cells as the only reconversion asset."
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_turbine; scripts/prepare_sector_network.py:H2 turbine"
      - key: electricity.extendable_carriers.Store
        effect: "Electricity-only workflow: 'H2' in the list adds the H2 store cycle incl. the per-bus Fuel Cell discharger; remove to drop it."
        default: "[battery, H2]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_stores"
      - key: costs.overwrites
        effect: "Override the 'fuel cell' cost row (investment per MWel, efficiency, lifetime) from config or data/custom_costs.csv."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "fuel cells as reconversion option (sector run)"
        rung: L0
        note: "default (sector.hydrogen_fuel_cell: true), incl. full waste-heat credit at district-heating nodes"
      - variant: "fuel cells in an electricity-only run"
        rung: L0
        note: "default via 'H2' in electricity.extendable_carriers.Store (attach_stores discharger)"
      - variant: "remove fuel cells / forbid reconversion"
        rung: L1
        note: "sector.hydrogen_fuel_cell: false (and sector.hydrogen_turbine: false to forbid ALL H2-to-power)"
      - variant: "electricity-only fuel cells (no heat credit)"
        rung: L1
        note: "sector.use_fuel_cell_waste_heat: 0"
      - variant: "technology-specific classes (SOFC vs PEMFC)"
        rung: L2
        note: "overwrite the single 'fuel cell' row for one class (L1); parallel classes need cloned n.add blocks in add_h2_gas_infrastructure plus cost rows (L3)"
      - variant: "capacity bounds per node or country"
        rung: L2
        note: "no config key and CCL only reaches Generators — set p_nom_max on the n.add call or write a custom constraint"
      - variant: "building-level fuel-cell micro-CHP"
        rung: L5
        note: "no such asset; the gas 'micro gas CHP' block in add_heat is the structural template but an H2 variant needs new links, decentral H2 delivery assumptions and cost rows"
      - variant: "heat-led operation / heat-to-power ratio control"
        rung: L5
        note: "outputs are rigid multilink coefficients; flexible ratios need paired links plus custom constraints (cf. the dormant add_chp_constraints machinery)"
    where:
      - change: "fuel cell link creation"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (hydrogen_fuel_cell block)"
        provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - change: "waste-heat rewiring (bus2 / efficiency2)"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat (use_fuel_cell_waste_heat branch)"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "electricity-only H2 cycle discharger"
        anchor: "scripts/add_electricity.py::attach_stores + STORE_LOOKUP"
        provenance: "scripts/add_electricity.py:attach_stores"
      - change: "cost row values"
        anchor: "scripts/process_cost_data.py::prepare_costs / ::overwrite_costs (row 'fuel cell')"
        provenance: "scripts/process_cost_data.py:prepare_costs"
    data_dependencies:
      - input: "cost row 'fuel cell' (investment per MWel, efficiency, lifetime); 'OCGT' row for the competing H2 turbine"
        required_for: "reconversion economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "nodal H2 buses with supply and storage"
        required_for: "fuel input"
        availability: "exists by default (add_h2_gas_infrastructure)"
      - input: "urban central heat buses (district heating footprint)"
        required_for: "the waste-heat credit"
        availability: "exists by default where district heat share > 0"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Sector chain: add_hydrogen ALWAYS adds one extendable "H2 Fuel Cell" Link per node
        (bus0 = node H2 bus, bus1 = AC bus, efficiency and per-MWel costs from the technology-data
        "fuel cell" row) — no config switch, present in every sector run. Electricity-only chain:
        with "H2" in electricity.extendable_carriers.Store (default), attach_stores adds an
        "H2 fuel cell" discharge Link per bus alongside the electrolysis charge link and H2 Store;
        with "H2" in extendable_carriers.StorageUnit, attach_storageunits instead embeds the fuel
        cell as the StorageUnit's dispatch efficiency. (Transport fuel cells — "land transport
        fuel cell" demand links and shipping's fuel-cell efficiency assumption — are separate
        demand-side constructs, not stationary generation.)
      mechanism: >
        scripts/prepare_sector_network.py:add_hydrogen (n.madd Link "... H2 Fuel Cell",
        capital_cost = fuel cell fixed x efficiency, i.e. costed per MW electric);
        scripts/add_extra_components.py:attach_stores / attach_storageunits for the
        electricity-only workflow.
      not_covered: >
        No fuel-cell CHP: a search for "fuel cell" in prepare_sector_network.py shows no heat
        output (no bus2 to heat buses) — stationary fuel cells deliver electricity only; CHP in
        the heat sector is gas/biomass-based (sector.chp / sector.micro_chp), not hydrogen. No
        distinction of fuel-cell technologies (PEMFC/SOFC — single "fuel cell" cost row); no
        existing fleet.
      provenance: "scripts/prepare_sector_network.py:add_hydrogen"
    levers:
      - key: electricity.extendable_carriers.Store
        effect: '"H2" enables the Bus-Store-Link chain incl. the "H2 fuel cell" discharge link in electricity-only runs.'
        default: "[battery, H2]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_stores"
      - key: electricity.extendable_carriers.StorageUnit
        effect: '"H2" gives the single-StorageUnit alternative with fuel-cell dispatch efficiency.'
        default: "[]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_storageunits"
      - key: electricity.max_hours.H2
        effect: Energy/power ratio of the H2 StorageUnit variant.
        default: "168"
        provenance: "config.default.yaml:max_hours; scripts/add_extra_components.py:attach_storageunits"
      - key: costs.year
        effect: Cost vintage for the "fuel cell" technology-data row.
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; Snakefile:retrieve_cost_data"
    boundary:
      - variant: "Fuel cells as reconversion option (sector run)"
        rung: L0
        note: Always present — no switch needed (and none exists to turn it off).
      - variant: "Fuel cells in electricity-only run"
        rung: L0
        note: Default via extendable_carriers.Store H2.
      - variant: "Remove fuel cells / forbid reconversion"
        rung: L2
        note: 'No config key in the sector chain; delete/guard the "H2 Fuel Cell" madd in add_hydrogen (electricity-only chain: drop "H2" from extendable_carriers).'
      - variant: "Fuel-cell CHP with useful heat output"
        rung: L2
        note: Add bus2 = heat bus + efficiency2 to the "H2 Fuel Cell" link in add_hydrogen (heat buses exist from add_heat); needs heat-output data on the cost row (L3 if absent).
      - variant: "Technology-specific fuel cells (SOFC vs PEMFC)"
        rung: L3
        note: 'Additional cost rows + duplicated link entries (pattern: tech_params dict for production side).'
      - variant: "Capacity bounds on fuel cells"
        rung: L2
        note: Add p_nom_max in the madd call.
    where:
      - change: "Sector-run fuel cell link (efficiency, CHP extension, bounds, removal)"
        anchor: "scripts/prepare_sector_network.py:add_hydrogen ('H2 Fuel Cell' madd)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "Electricity-only discharge link"
        anchor: "scripts/add_extra_components.py:attach_stores"
        provenance: "scripts/add_extra_components.py:attach_stores"
      - change: "Heat-bus targets for a CHP variant"
        anchor: "scripts/prepare_sector_network.py:add_heat (heat bus naming/structure)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
    data_dependencies:
      - input: "technology-data costs csv row: fuel cell (efficiency, fixed, lifetime; capital_cost/marginal_cost columns in the elec-workflow costs file)"
        required_for: "all variants"
        availability: "must be built (rule retrieve_cost_data); row confirmed in built costs file"
      - input: "H2 supply and storage (electrolysers, H2 Store Tank / UHS)"
        required_for: "anything for the fuel cell to discharge"
        availability: "exists by default"
