id: steel-routes-endogenous
title: Endogenous primary steel routes (blast furnace, gas DRI, H2 DRI, EAF)
summary: >
  Model-endogenous choice of how primary steel is made: a per-node steel
  demand in tonnes met by competing production routes (coal blast furnace,
  natural-gas or hydrogen direct reduction followed by an electric arc
  furnace), with the furnace CO2 vented or captured, and today's blast
  furnaces and gas DRI plants as dated brownfield capacity.
when_to_use:
  - "endogenous steel routes"
  - "let the model choose blast furnace vs DRI"
  - "green steel cost-optimal route"
  - "natural gas DRI as a bridge to hydrogen DRI"
  - "steel CCS / blast furnace carbon capture"
  - "blast furnace announced retirement"
  - "HBI / hot briquetted iron relocation to cheap hydrogen regions"
  - "endogenous_sectors / industry_plants / hbi_relocation"
  - "steel as a material bus in tonnes"
  - "existing steel plants as brownfield capacity"
models:
  - model: pypsa-eur
    version_anchor: {ref: "ee7c6d86e475ee17a6af6d49ebf5ba8118b16723", date: "2026-11-24"}
    out_of_box:
      covers: >
        Upstream PyPSA/pypsa-eur#1719 and OFF by default
        (sector.endogenous_sectors: [], a list; the method
        industry-routes-endogenous turns it on). Demand side: with "steel" in
        sector.endogenous_sectors, build_industrial_energy_demand_per_node
        zeroes the sector ratios of the JRC-IDEES sectors "Integrated
        steelworks" and "DRI + Electric arc" (ENDOGENOUS_SUBSECTORS, applied
        after any sector.industry_heat replacement), so their electricity,
        coal, coke, methane, hydrogen and process emission leave the flat
        industry loads of industrial_energy_demand_<horizon>.csv; secondary
        "Electric arc" (scrap) steel stays an exogenous electricity demand.
        Network side (the steel block of add_industry): the primary steel production of the horizon
        (Integrated + DRI, industrial_production_<horizon>.csv, Mt/a) becomes
        a flat Load "<node> steel demand" (carrier steel, t/h) on a
        "<node> steel" bus. Routes, all extendable Links with technology-data
        rows: "<node> BOF" (blast furnace-basic oxygen furnace, 5.34 MWh coal
        per t steel from the EU coal bus, CO2 onto "<node> BOF emission");
        "<node> H2 DRI reduction" (carrier H2 DRI, 2.1 MWh H2 per t HBI) and
        "<node> gas DRI reduction" (carrier gas DRI, 2.78 MWh gas per t HBI,
        CO2 onto "<node> gas DRI emission") feeding a "<node> DRI reduction"
        bus (carrier DRI reduction agent); "<node> DRI" (hydrogen direct iron
        reduction furnace: 1.03 MWh electricity plus one unit of reduction
        agent per t of HBI onto "<node> hbi"); "<node> EAF" (electric arc
        furnace, 0.6395 MWh electricity and 1 t HBI per t steel). Iron ore is
        priced as marginal cost (iron ore DRI-ready, 97.73 EUR/t, times 1.59 t
        ore per t HBI on DRI and 1.539 t per t steel on BOF). Both emission
        buses (carrier steel emission) empty through a vent link to co2
        atmosphere or, with industry.process_emissions_cc (default true), a
        "<node> ... emission CC" link (carrier steel emission
        CC, steel carbon capture retrofit: 90 % to the CO2 stored bus, 0.16
        MWh electricity per t CO2, the rest vented). The reduction agent can
        switch hour by hour between hydrogen and gas; the furnaces carry no
        must-run. With sector.hbi_relocation one "EU hbi" bus replaces the
        nodal ones, so HBI made anywhere feeds any EAF at no transport cost.
        Brownfield (add_existing_industry, first horizon of myopic or perfect
        foresight only, with existing_capacities.industry_plants: true, default
        false): today's operating blast furnaces and direct reduction furnaces
        of the GEM Global Iron and Steel Tracker (rule build_industry_plants,
        prepare_gem_iron_units; build year is the most recent relining) become
        non-extendable dated links "<node> BOF-<year>-<out>" and
        "<node> gas DRI-<year>" (carrier DRI), grouped by region, route and
        existing_capacities.grouping_years_industry; units older than their
        catalogue lifetime count as reinvested, units of unknown age sit at
        half the lifetime. Blast furnaces retire at their announced retirement
        year when existing_capacities.blast_furnace_announced_retirement is
        true (default), else at the 40-year catalogue lifetime. The same call
        also adds today's Haber-Bosch (with sector.ammonia) and fossil grey
        methanol plants of the GEM Global Chemicals Tracker as dated links;
        new grey methanol is extendable on its own switch,
        sector.methanol.grey_methanol (default false), at the same parameters
        (grey_methanol_attrs).
      mechanism: >
        rule build_industrial_production_per_country_tomorrow (St_primary_fraction,
        DRI_fraction) -> rule build_industrial_production_per_node -> rule
        build_industrial_energy_demand_per_node (params endogenous_sectors;
        ENDOGENOUS_SUBSECTORS zeroes the steel sector ratios) -> rule
        compose_network: define_spatial (hbi buses), add_industry (steel
        block); with existing_capacities.industry_plants under myopic/perfect
        the horizon-free rule build_industry_plants (the GEM iron and steel,
        cement and chemicals trackers from retrieve_gem_gspt, retrieve_gem_gcct
        and retrieve_gem_gct) feeds add_existing_baseyear's
        add_existing_industry on the first horizon, and add_brownfield carries
        the built route links forward.
      not_covered: >
        Scrap steel is outside the route choice: secondary EAF stays a fixed
        exogenous electricity load, with no scrap availability limit and no
        scrap input to the blast furnace (the catalogue's scrap-input row is
        unused). industry.DRI_fraction no longer decides the route: the load
        is Integrated plus DRI production, so the key only weights the two
        GEM siting keys that place that production across a country's nodes
        (industry.St_primary_fraction still sizes the primary pool, and
        industry.H2_DRI / elec_DRI are dormant). The technology-data
        intensities do not match JRC-IDEES: pricing BF-BOF at 5.34 MWh coal
        per t lifts coal for steel from about 7.5 TWh/a (the exogenous
        JRC-IDEES coal and coke) to about 123 TWh/a Europe-wide in the upstream
        PR's validation, so an all-BOF solution is not comparable with the
        exogenous run's coal line. Steel and HBI have no store, so the routes
        follow the flat load every hour (no flexible EAF, no hydrogen
        buffering inside the plant beyond the nodal H2 stores). No steel or HBI
        transport between nodes except the one-bus hbi_relocation, no iron ore
        or steel trade with the rest of the world, and one EU-wide ore price.
        The capture retrofit charges electricity only: its catalogue gas-input
        (0.76 MWh per t CO2) for solvent regeneration is unused. No route can
        be switched off by config (the five route links are always built
        together, only the capture links hang on
        industry.process_emissions_cc): forbidding or capping one is a
        solving.options.custom_extra_functionality hook constraining the
        route links' capacity on n.model, and under a binding CO2 cap gas DRI
        without capture limits itself. The "<node> hbi" bus marginal price of
        the solved case is the landed-HBI break-even (imports are not
        modelled), read after the run. The exogenous "H2 for industry" load keeps the chlorine
        by-product credit (industry.MWh_H2_per_tCl is negative) and loses the
        DRI hydrogen, so it turns negative at nodes with chlorine production
        (NL 2040: about -1.04 TWh), a free hydrogen injection the upstream
        code has too. Brownfield units more than 100 km from every region are
        dropped, and units with unknown capacity get the 20 % quantile of
        their route. There is no delay or bring-forward knob for the announced
        blast-furnace retirements, only on or off.
      provenance: "scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:define_spatial; scripts/build_industrial_energy_demand_per_node.py:ENDOGENOUS_SUBSECTORS; scripts/add_existing_baseyear.py:add_existing_industry; scripts/add_existing_baseyear.py:assign_industry_grouping_years; scripts/build_industry_plants.py:prepare_gem_iron_units; rules/build_sector.smk:build_industry_plants; rules/build_sector.smk:build_industrial_energy_demand_per_node; doc/release_notes.md:endogenous_sectors"
    levers:
      - key: sector.endogenous_sectors
        effect: "List of endogenised subsectors (steel, cement or both). Listing steel drops the Integrated and DRI + Electric arc sector ratios from the industry demand file and builds the steel material buses, load and route links."
        default: "[]"
        provenance: "config/config.default.yaml:endogenous_sectors; scripts/prepare_sector_network.py:add_industry; scripts/build_industrial_energy_demand_per_node.py:ENDOGENOUS_SUBSECTORS"
      - key: sector.hbi_relocation
        effect: "true replaces the nodal hbi buses with one EU hbi bus: hot briquetted iron is reduced wherever hydrogen or gas is cheapest and melted at any EAF, with no transport cost."
        default: "false"
        provenance: "config/config.default.yaml:hbi_relocation; scripts/prepare_sector_network.py:define_spatial"
      - key: existing_capacities.industry_plants
        effect: "Brownfield only (myopic/perfect, first horizon): true adds today's blast furnaces and gas DRI (with steel listed), cement kilns (with cement listed), Haber-Bosch (with sector.ammonia) and grey methanol plants as dated links."
        default: "false"
        provenance: "config/config.default.yaml:industry_plants; rules/compose.smk:industry_plants; scripts/add_existing_baseyear.py:add_existing_industry"
      - key: existing_capacities.blast_furnace_announced_retirement
        effect: "Brownfield only: true retires each existing blast furnace at its GEM announced retirement year; false gives every one the 40-year catalogue lifetime."
        default: "true"
        provenance: "config/config.default.yaml:blast_furnace_announced_retirement; scripts/add_existing_baseyear.py:add_existing_industry"
      - key: industry.process_emissions_cc
        effect: "Builds the steel emission CC links on the BOF and gas DRI emission buses (and the cement capture links); false leaves venting as the only outlet."
        default: "true"
        provenance: "config/config.default.yaml:process_emissions_cc; scripts/prepare_sector_network.py:add_industry"
      - key: existing_capacities.grouping_years_industry
        effect: "Build-year bins the existing plants are grouped into (one dated link per region, route and bin)."
        default: "[1995, 2000, 2005, 2010, 2015, 2020, 2025]"
        provenance: "config/config.default.yaml:grouping_years_industry; scripts/add_existing_baseyear.py:add_existing_industry"
      - key: industry.St_primary_fraction
        effect: "Still sizes the primary steel load the routes serve (the rest is the exogenous scrap EAF electricity)."
        default: "{2020: 0.6, ..., 2050: 0.3}"
        provenance: "config/config.default.yaml:St_primary_fraction; scripts/build_industrial_production_per_country_tomorrow.py:St_primary_fraction"
      - key: costs.overwrites
        effect: "Overrides investment, lifetime, FOM or VOM of the route rows (blast furnace-basic oxygen furnace, hydrogen direct iron reduction furnace, electric arc furnace, steel carbon capture retrofit). It cannot reach the ore price (commodity) or the input intensities, which only a data/custom_costs.csv row changes."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:prepare_costs"
    boundary:
      - variant: "endogenous route choice (blast furnace vs DRI + EAF)"
        rung: L0
        note: "steel in sector.endogenous_sectors, the method industry-routes-endogenous; the routes compete on capex, fuel and the CO2 constraint"
      - variant: "natural-gas DRI as a bridge to hydrogen DRI"
        rung: L0
        note: "part of the menu once the switch is on: the DRI furnace takes its reduction agent from gas or hydrogen, hour by hour"
      - variant: "carbon capture on blast furnaces and gas DRI"
        rung: L0
        note: "the steel emission CC links are built with the switch while industry.process_emissions_cc is true (the default)"
      - variant: "endogenise steel only (keep cement exogenous)"
        rung: L1
        note: "sector.endogenous_sectors: [steel]"
      - variant: "blast-furnace phase-out at announced dates or at end of lifetime"
        rung: L1
        note: "existing_capacities.industry_plants: true with existing_capacities.blast_furnace_announced_retirement true or false; acts on the brownfield plants, so myopic or perfect foresight only"
      - variant: "delay or bring forward the announced blast-furnace retirements"
        rung: L2
        note: "no knob: shift the BOF Out year in add_existing_industry (scripts/add_existing_baseyear.py)"
      - variant: "relocate iron reduction to cheap-hydrogen regions"
        rung: L1
        note: "sector.hbi_relocation: true (one EU hbi bus, free HBI transport)"
      - variant: "route capex, lifetime or fixed O&M sensitivity"
        rung: L1
        note: "costs.overwrites {investment|lifetime|FOM: {<route row>: value}}"
      - variant: "different EU-wide iron ore price or DRI hydrogen intensity"
        rung: L3
        note: "rows 'iron ore DRI-ready,commodity' or 'hydrogen direct iron reduction furnace,hydrogen-input' in data/custom_costs.csv (costs.custom_cost_fn); costs.overwrites only reaches investment, lifetime, FOM, VOM, efficiency, fuel, standing losses, marginal_cost and capital_cost, and industry.H2_DRI no longer acts"
      - variant: "country-specific iron ore cost"
        rung: L2
        note: "the ore marginal cost is one EU-wide row in the steel block of add_industry (and add_existing_industry); a per-country price needs an edit there"
      - variant: "forbid a route (e.g. no new blast furnaces)"
        rung: L2
        note: "no flag: a solving.options.custom_extra_functionality hook (a staged file the bundle's data change points the key at; its function, named like the file's stem, takes n, snapshots, snakemake) adds n.model.add_constraints(n.model['Link-p_nom'].loc[<the route's links>] <= 0); never an add_industry edit, never a staged solve rule"
      - variant: "steel or HBI transport between regions"
        rung: L2
        note: "add links between the steel or hbi buses in the steel block of add_industry; hbi_relocation (L1) is the free-transport extreme"
      - variant: "capture retrofit with its regeneration heat"
        rung: L2
        note: "add the catalogue gas-input as a further input on the emission CC links in the steel block of add_industry"
      - variant: "endogenous scrap (secondary) EAF"
        rung: L5
        note: "secondary steel is an exogenous electricity load; a scrap route needs a scrap resource bus and a second EAF chain"
      - variant: "scrap availability constraint"
        rung: L5
        note: "no scrap resource exists in the model; needs scrap potentials per country plus the scrap route"
      - variant: "flexible EAF operation"
        rung: L5
        note: "the steel load is flat with no steel or HBI store; a flexible EAF needs stores plus plant-level operating constraints"
    where:
      - change: "route buses, loads, links, vent and capture"
        anchor: "scripts/prepare_sector_network.py::add_industry (block under 'steel' in endogenous_sectors)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "dropping the route sectors from the demand blocks"
        anchor: "scripts/build_industrial_energy_demand_per_node.py (ENDOGENOUS_SUBSECTORS loop)"
        provenance: "scripts/build_industrial_energy_demand_per_node.py:ENDOGENOUS_SUBSECTORS"
      - change: "one EU hbi bus"
        anchor: "scripts/prepare_sector_network.py::define_spatial (spatial.hbi)"
        provenance: "scripts/prepare_sector_network.py:hbi_relocation"
      - change: "existing plants, announced retirement, build-year grouping"
        anchor: "scripts/add_existing_baseyear.py::add_existing_industry (assign_industry_grouping_years); scripts/build_industry_plants.py::prepare_gem_iron_units"
        provenance: "scripts/add_existing_baseyear.py:assign_industry_grouping_years; scripts/build_industry_plants.py:prepare_gem_iron_units"
      - change: "route cost and intensity rows"
        anchor: "scripts/process_cost_data.py::prepare_costs; data/custom_costs.csv (costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
    data_dependencies:
      - input: "GEM Global Iron and Steel Tracker, plant-level data and iron unit data (blast furnaces and direct reduction furnaces with capacity, start, most recent relining and announced retirement)"
        required_for: "existing blast furnaces and gas DRI plants under myopic/perfect foresight"
        availability: "retrieved from the archive only (rule retrieve_gem_gspt, release september-2026-v1); read by build_industry_plants, which runs only with existing_capacities.industry_plants and foresight not overnight"
      - input: "industrial_production_<horizon>.csv (Integrated steelworks + DRI + Electric arc, JRC-IDEES chain)"
        required_for: "the primary steel load"
        availability: "must be built (build_industrial_production_per_country_tomorrow, build_industrial_production_per_node)"
      - input: "cost rows: blast furnace-basic oxygen furnace, hydrogen direct iron reduction furnace, natural gas direct iron reduction furnace, electric arc furnace, iron ore DRI-ready, steel carbon capture retrofit"
        required_for: "route intensities, capex and the ore price"
        availability: "exists by default via retrieve_costs + rule process_cost_data (technology-data v0.16.0)"
      - input: "nodal H2 buses, spatial gas buses, EU coal bus, CO2 stored buses"
        required_for: "route fuel inputs and the capture output"
        availability: "exists by default in sector runs (the coal bus is added by the steel block when missing)"
