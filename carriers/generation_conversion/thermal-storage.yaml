id: thermal-storage
title: Thermal storage (water tanks / pit storage)
summary: Storage of heat in hot-water tanks and large water pits (PTES) buffering building-level and district heat.
when_to_use:
  - "thermal energy storage / TES"
  - "hot water tanks / heat storage"
  - "district heating storage"
  - "pit thermal energy storage / PTES"
  - "seasonal heat storage"
  - "heat buffer for heat pumps"
  - "Carnot battery / pumped thermal electricity storage"
  - "molten salt storage"
  - "pypsa-eur carrier names: urban central water tanks, residential rural water tanks, services rural water tanks, residential urban decentral water tanks, services urban decentral water tanks, urban central water pits, water tanks charger, water tanks discharger, water pits charger, water pits discharger"
  - "CSP with storage / molten salt tanks"
  - "store solar thermal heat"
  - "known in pypsa-eur as: water tanks, residential rural water tanks, services rural water tanks, residential urban decentral water tanks, services urban decentral water tanks, urban central water tanks, hot water storage, hot water charging, hot water discharging, urban central water tanks charger, urban central water tanks discharger, residential rural water tanks charger, residential rural water tanks discharger, residential urban decentral water tanks charger, residential urban decentral water tanks discharger, services rural water tanks charger, services rural water tanks discharger, services urban decentral water tanks charger, services urban decentral water tanks discharger, water pits, water pits charger, water pits discharger, urban central water pits, urban central water pits charger, urban central water pits discharger, aquifer thermal energy storage, aquifer thermal energy storage charger, aquifer thermal energy storage discharger"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Sector runs, on by default (sector.tes: true). add_heat gives EVERY heat
        system (residential rural, services rural, residential urban decentral,
        services urban decentral, urban central) a "{heat system} water tanks"
        Bus + extendable Store + charger/discharger Links, with capital cost,
        lifetime and standing_loss (%/h, divided by 100) from the
        "central|decentral water tank storage" cost rows — losses come from cost
        data, NOT from a tes_tau time constant as in pypsa-earth. Urban central
        nodes additionally get "urban central water pits" (PTES) from the
        "central water pit storage/charger/discharger" rows. Duration is NOT
        free: at solve time add_TES_energy_to_power_ratio_constraints forces
        Store e_nom = "energy to power ratio" (a technology-data column stamped
        onto the charger links) * charger p_nom for water tanks AND pits, and
        add_TES_charger_ratio_constraints ties charger p_nom = discharger p_nom
        * efficiency — both gated on sector.tes. Two optional PTES refinements
        from rule build_ptes_operations (temperature-dependent operation between
        ptes.max_top_temperature 90 C and min_bottom_temperature 35 C):
        district_heating.ptes.dynamic_capacity applies a time-varying e_max_pu
        to the pit store, and ptes.supplemental_heating derates the discharger
        efficiency when the forward temperature exceeds the storage temperature,
        optionally with a booster heat pump (a water-pit-fed heat pump link
        added when "ptes" is listed as a heat_pump_source and
        supplemental_heating.booster_heat_pump is true). In myopic runs,
        add_brownfield::update_dynamic_ptes_capacity re-scales previous-horizon
        pit capacities as district-heating temperatures change. Residential
        demand-side "heat dsm" Stores (sector.residential_heat.dsm) reuse the
        decentral water-tank standing losses.
      mechanism: >
        rule prepare_sector_network runs scripts/prepare_sector_network.py:
        add_heat loops over the five HeatSystem values wherever heat buses exist
        (urban central buses only where the district heating share is nonzero)
        and creates the tank blocks under options["tes"] plus the water-pit
        block for HeatSystem.URBAN_CENTRAL. rule build_ptes_operations
        (scripts/build_ptes_operations/run.py) precomputes
        ptes_e_max_pu_profiles, ptes_top_temperature_profiles and
        ptes_direct_utilisation_profiles per planning horizon from the
        district-heating temperature approximation. rule solve_network wires the
        two TES constraints in extra_functionality when config sector.tes is
        true and heat buses exist.
      not_covered: >
        No power-to-heat-to-power storage (Carnot battery): technology-data
        ships "Pumped-Heat-store/charger/discharger", "LowT-Molten-Salt" and
        "HighT-Molten-Salt", "Sand" and "Concrete" store/charger/discharger
        rows (verified in a locally built processed costs file), but no code
        consumes any of them — the tank/pit cost keys are hardcoded in add_heat.
        No borehole (BTES) storage; aquifer storage exists but as its own chain
        (see aquifer-thermal-storage carrier card). No industrial process-heat
        storage: the endogenous industry-heat blocks (add_t_industry100_200 and
        siblings) contain no Store. No TES in the electricity-only workflow
        (there is no heat demand there, and no CSP technology exists in
        pypsa-eur). Water tanks/pits cannot have free duration — the
        energy-to-power constraints bind whenever stores and chargers are
        extendable.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/solve_network.py:add_TES_energy_to_power_ratio_constraints; scripts/solve_network.py:add_TES_charger_ratio_constraints; rules/build_sector.smk:build_ptes_operations; scripts/add_brownfield.py:update_dynamic_ptes_capacity; scripts/prepare_sector_network.py:water pits charger"
    levers:
      - key: sector.tes
        effect: "Master switch: adds water tanks at all heat systems and water pits at urban central nodes; also gates the two TES constraints in solve_network."
        default: "true"
        provenance: "config/config.default.yaml:tes; scripts/prepare_sector_network.py:add_heat"
      - key: sector.heating
        effect: "Gates add_heat entirely — false removes all heat buses and with them every TES."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.district_heating.ptes.dynamic_capacity
        effect: "true applies temperature-dependent e_max_pu profiles (rule build_ptes_operations) to the urban central water pits store."
        default: "false"
        provenance: "config/config.default.yaml:dynamic_capacity; scripts/prepare_sector_network.py:ptes_e_max_pu_file"
      - key: sector.district_heating.ptes.supplemental_heating.enable
        effect: "true derates the water-pit discharger efficiency with the direct-utilisation profile (storage temperature vs forward temperature)."
        default: "false"
        provenance: "config/config.default.yaml:supplemental_heating; scripts/prepare_sector_network.py:ptes_direct_utilisation_profile"
      - key: sector.district_heating.ptes.supplemental_heating.booster_heat_pump
        effect: "With supplemental_heating.enable and 'ptes' listed under sector.heat_pump_sources.'urban central': adds a booster heat pump drawing from the water pits (bus2) to lift discharge to forward temperature; raises a ValueError if set without enable."
        default: "false"
        provenance: "config/config.default.yaml:booster_heat_pump; scripts/prepare_sector_network.py:add_heat"
      - key: sector.district_heating.ptes.max_top_temperature
        effect: "Maximum PTES top temperature used by build_ptes_operations for the e_max_pu / direct-utilisation profiles."
        default: "90"
        provenance: "config/config.default.yaml:max_top_temperature; scripts/build_ptes_operations/run.py:max_ptes_top_temperature"
      - key: sector.district_heating.ptes.min_bottom_temperature
        effect: "Minimum PTES bottom temperature for the same profiles."
        default: "35"
        provenance: "config/config.default.yaml:min_bottom_temperature; scripts/build_ptes_operations/run.py:min_ptes_bottom_temperature"
      - key: sector.district_heating.temperature_limited_stores
        effect: "Which stores count as temperature-limited heat sources for the booster-heat-pump machinery (default ['ptes'])."
        default: "[ptes]"
        provenance: "config/config.default.yaml:temperature_limited_stores; scripts/prepare_sector_network.py:temperature_limited_stores"
      - key: sector.district_heating.potential
        effect: "District-heating footprint (with .progress per horizon) — urban central heat buses, and thus water pits, exist only where the share is nonzero."
        default: "0.6"
        provenance: "config/config.default.yaml:district_heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.residential_heat.dsm.enable
        effect: "Adds building-thermal-inertia 'heat dsm' Stores (overheat/undercool bands) using decentral water-tank standing losses — a TES-like flexibility, not an asset."
        default: "false"
        provenance: "config/config.default.yaml:residential_heat; scripts/prepare_sector_network.py:heat dsm"
      - key: costs.overwrites
        effect: "Override tank/pit cost rows; note 'energy to power ratio' and 'standing_losses' are technology-data columns — changing those needs rows in data/custom_costs.csv (costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "water-tank heat storage at all heat nodes"
        rung: L0
        note: "default via sector.tes"
      - variant: "pit storage (PTES) for district heating"
        rung: L0
        note: "default at urban central nodes (needs a nonzero district heating share, see district-heating carrier card)"
      - variant: "temperature-dependent PTES capacity and discharge"
        rung: L1
        note: "ptes.dynamic_capacity: true and/or ptes.supplemental_heating.enable: true (+ booster_heat_pump with 'ptes' added to sector.heat_pump_sources.'urban central')"
      - variant: "run without thermal storage"
        rung: L0
        note: "sector.tes: false (also disables the TES constraints)"
      - variant: "change storage losses or the fixed energy-to-power ratio"
        rung: L3
        note: "standing_losses and 'energy to power ratio' live in the costs file — author rows in data/custom_costs.csv; there is no config time-constant (no tes_tau in pypsa-eur)"
      - variant: "free (endogenous) TES duration"
        rung: L2
        note: "comment out / gate add_TES_energy_to_power_ratio_constraints in solve_network.py extra_functionality — store and charger investments are already independent variables"
      - variant: "Carnot battery / pumped-thermal electricity storage"
        rung: L2
        note: "cost rows Pumped-Heat-store/charger/discharger exist unconsumed; add an elec->heat-store->elec chain (the STORE_LOOKUP pattern in add_electricity.py or a new block in prepare_sector_network) — no data gap"
      - variant: "molten salt / sand / concrete high-temperature storage"
        rung: L2
        note: "LowT/HighT-Molten-Salt, Sand and Concrete store/charger/discharger rows exist unconsumed; needs a code branch and a bus to serve (industry heat buses exist only with sector.industry_t.endogen)"
      - variant: "industrial process-heat storage"
        rung: L5
        note: "endogenous industry heat blocks have no Store and no storable-heat bus design; bespoke components"
      - variant: "borehole thermal storage (BTES)"
        rung: L5
        note: "no code, no cost rows, no geodata; nearest template is the ATES chain (aquifer-thermal-storage carrier card)"
    where:
      - change: "tank and pit component creation (cost keys, standing losses, etpr stamping)"
        anchor: "scripts/prepare_sector_network.py::add_heat (options['tes'] block + URBAN_CENTRAL water pits block)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "fixed-duration and charger-ratio constraints"
        anchor: "scripts/solve_network.py::add_TES_energy_to_power_ratio_constraints / ::add_TES_charger_ratio_constraints (gated on sector.tes in ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_TES_energy_to_power_ratio_constraints; scripts/solve_network.py:extra_functionality"
      - change: "PTES temperature profiles (e_max_pu, direct utilisation, top temperature)"
        anchor: "rule build_ptes_operations -> scripts/build_ptes_operations/run.py (params from sector.district_heating.ptes)"
        provenance: "rules/build_sector.smk:build_ptes_operations; scripts/build_ptes_operations/run.py:max_ptes_top_temperature"
      - change: "booster heat pump wiring"
        anchor: "scripts/prepare_sector_network.py::add_heat (temperature_limited_stores branch, bus2 = water pits)"
        provenance: "scripts/prepare_sector_network.py:temperature_limited_stores"
      - change: "myopic PTES capacity update"
        anchor: "scripts/add_brownfield.py::update_dynamic_ptes_capacity"
        provenance: "scripts/add_brownfield.py:update_dynamic_ptes_capacity"
    data_dependencies:
      - input: "cost rows 'central water tank storage', 'decentral water tank storage', 'central water pit storage' (+ matching charger/discharger rows) incl. the 'energy to power ratio' and 'standing_losses' columns"
        required_for: "all tank/pit TES"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "heat buses per node (rule prepare_sector_network heat workflow; urban central where district heat share > 0)"
        required_for: "placement of tanks and pits"
        availability: "must be built (default sector workflow)"
      - input: "ptes_e_max_pu_profiles / ptes_direct_utilisation_profiles NetCDFs per planning horizon"
        required_for: "ptes.dynamic_capacity and ptes.supplemental_heating"
        availability: "must be built (rule build_ptes_operations; inputs from the district-heating temperature approximation chain)"
      - input: "cost rows 'Pumped-Heat-*', 'LowT-Molten-Salt-*', 'HighT-Molten-Salt-*', 'Sand-*', 'Concrete-*'"
        required_for: "the L2 Carnot-battery / high-temperature variants"
        availability: "exists by default in the technology-data costs file (verified in a locally built processed costs file); unconsumed by code at this ref"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Two separate thermal-storage mechanisms. Power-only chain: CSP thermal
        energy storage — when "csp" is a renewable carrier and
        renewable.csp.csp_model is "advanced" (the default model setting, but csp is
        NOT in the default carrier list), CSP generators are moved onto dedicated
        csp buses with an extendable Store (costs row "csp-tower TES") and a
        power-block Link to the grid (costs row "csp-tower") — solar heat can be
        stored before conversion. Sector chain: water-tank heat storage at every
        heat node — when sector.tes is true (default), each residential/services
        urban/rural heat bus gets a water-tank Bus, charger/discharger Links (costs
        rows "water tank charger"/"water tank discharger") and an extendable Store
        with standing_loss derived from the sector.tes_tau time constant (3 days
        decentral, 180 days central — i.e. seasonal for district heat) and
        capital cost from "{central|decentral} water tank storage" (converted from
        EUR/m3 assuming 40 K spread, 1.17 kWh/m3K).
      mechanism: >
        Power chain: attach_stores in scripts/add_extra_components.py (rule
        add_extra_components), csp branch gated on "csp" in
        electricity.renewable_carriers and config["renewable"]["csp"]["csp_model"]
        == "advanced". Sector chain: add_heat in scripts/prepare_sector_network.py
        (rule prepare_sector_network), gated on sector.enable.heat and
        options["tes"]; loss factor standing_loss = 1 - exp(-1/24/tes_time_constant_days).
      not_covered: >
        No power-to-heat-to-power (Carnot battery / pumped thermal) pathway. No
        industrial high-temperature heat storage. No pit/aquifer/borehole storage —
        technology-data v0.13.2 ships "central water pit storage" (+charger/
        discharger) rows but no code consumes them; the water-tank cost keys are
        hardcoded. CSP TES in the "simple" csp model collapses to a plain generator
        (no Store).
      provenance: scripts/prepare_sector_network.py:add_heat
    levers:
      - key: sector.tes
        effect: Master switch for water-tank thermal storage at all heat nodes in the sector chain.
        default: "true"
        provenance: scripts/prepare_sector_network.py:add_heat
      - key: sector.tes_tau.central
        effect: Loss time constant (days) for central (district-heating) water tanks — sets standing_loss; 180 d ~ seasonal storage.
        default: "180"
        provenance: scripts/prepare_sector_network.py:tes_tau
      - key: sector.tes_tau.decentral
        effect: Loss time constant (days) for decentral (building-level) water tanks.
        default: "3"
        provenance: scripts/prepare_sector_network.py:tes_tau
      - key: renewable.csp.csp_model
        effect: '"advanced" gives CSP a separate heat bus + TES Store + power-block Link; "simple" models CSP as a plain generator with no storage.'
        default: "advanced"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: electricity.renewable_carriers
        effect: Add "csp" here (it is absent by default) to activate CSP at all — prerequisite for CSP TES.
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro]"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: sector.solar_thermal
        effect: Adds solar-thermal collectors feeding the same heat buses the water tanks buffer (the main charging source besides heat pumps/boilers).
        default: "true"
        provenance: scripts/prepare_sector_network.py:add_heat
      - key: sector.enable.heat
        effect: Master switch for the whole heat block (and thus water-tank TES) in the sector chain.
        default: "true"
        provenance: scripts/prepare_sector_network.py:add_heat
    boundary:
      - variant: Water-tank heat storage at heat nodes
        rung: L0
        note: Default on via sector.tes.
      - variant: Change storage losses / effective duration of heat storage
        rung: L0
        note: sector.tes_tau.central / .decentral.
      - variant: CSP with thermal storage
        rung: L1
        note: Add "csp" to electricity.renewable_carriers (csp_model already defaults to "advanced"); requires the csp renewable profile inputs to be built.
      - variant: Pit / large seasonal heat storage as a distinct technology
        rung: L2
        note: Costs rows ("central water pit storage" etc.) exist in retrieved technology-data v0.13.2, but the cost keys in add_heat are hardcoded to water tanks — add a parallel branch or parameterise the tech name.
      - variant: Carnot battery / pumped-thermal electricity storage
        rung: L5
        note: No heat-to-power path from storage exists; needs a new component chain (electric charger Link, heat Store, heat-engine discharger Link).
      - variant: Industrial process-heat storage
        rung: L5
        note: Industry demand is not modelled with storable heat buses; bespoke components required.
    where:
      - change: CSP TES store/link (costs keys "csp-tower TES", "csp-tower")
        anchor: scripts/add_extra_components.py, function attach_stores, csp branch (rule add_extra_components)
        provenance: scripts/add_extra_components.py:attach_stores
      - change: Water-tank TES components, cost keys, loss formula
        anchor: scripts/prepare_sector_network.py, function add_heat, options["tes"] block (rule prepare_sector_network)
        provenance: scripts/prepare_sector_network.py:add_heat
      - change: TES time constants
        anchor: config path sector.tes_tau (dict with central/decentral)
        provenance: config.default.yaml:tes_tau
    data_dependencies:
      - input: costs rows "csp-tower TES", "csp-tower" (technology-data via rule retrieve_cost_data; also in offline fallback data/costs.csv)
        required_for: CSP thermal storage
        availability: exists by default
      - input: costs rows "central water tank storage", "decentral water tank storage", "water tank charger", "water tank discharger"
        required_for: Sector water-tank TES
        availability: exists by default (also in offline fallback data/costs.csv)
      - input: CSP renewable profile (rule build_renewable_profiles) and cutout for the region
        required_for: CSP with TES
        availability: must be built (only when csp is enabled)
      - input: heat demand and COP profiles (heat block inputs of rule prepare_sector_network)
        required_for: Sector water-tank TES (heat buses must exist)
        availability: must be built (default sector workflow)
