id: vehicle-to-grid
title: Vehicle-to-grid (V2G)
summary: >
  Electric vehicles discharging their batteries back into the grid — the EV
  fleet as a distributed storage and balancing resource, beyond mere charging
  flexibility.
when_to_use:
  - "vehicle-to-grid / V2G"
  - "EVs discharging to the grid"
  - "bidirectional charging"
  - "EV fleet as storage / virtual power plant from cars"
  - "V2G participation share or compensation"
  - "pypsa-eur carrier names: V2G, EV battery, BEV charger"
  - "vehicle to grid / V2G"
  - "EVs feeding power back to the grid"
  - "use EV batteries as grid storage"
  - "car batteries as flexibility / virtual power plant of EVs"
  - "known in pypsa-eur as: V2G"
models:
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        Covered and ON by default (sector.v2g: true), sized by the EV share. In
        add_EVs, nested INSIDE the bev_dsm block, a "V2G" Link is added per
        node from the "EV battery" bus back to the electricity bus: p_nom =
        number of cars x bev_charge_rate (11 kW) x electric share x
        bev_dsm_availability (0.5) — i.e. discharge power is the charger power
        derated by the DSM participation share, while the BEV charger itself is
        NOT derated. Discharge is limited by the same plugged-in availability
        profile (p_max_pu from German BASt pkw counts) and uses
        bev_charge_efficiency (0.9) — there is no separate discharge
        efficiency. Energy comes from the cyclic aggregate EV battery Store
        (cars x 50 kWh x 0.5 x share) whose e_min_pu departure guarantee (80%
        SOC at 7h) also bounds how deep V2G can cycle. With
        sector.electricity_distribution_grid (default true),
        insert_electricity_distribution_grid re-points the V2G Link's bus1 to
        the low voltage bus, so V2G injects behind the distribution grid link
        and its usefulness for the transmission level is limited by
        distribution capacity.
      mechanism: >
        rule compose_network -> add_land_transport -> add_EVs: the V2G
        n.add runs only if options["bev_dsm"] AND options["v2g"] are both true
        and the electric share > 0. Availability/DSM profiles come from rule
        build_transport_demand (bev_availability_profile, bev_dsm_profile).
        The V2G Link has lifetime=1 and no capital or marginal cost — the
        resource is free.
      not_covered: >
        No battery degradation cost, cycling limit or owner compensation —
        V2G dispatches whenever prices favour it, at zero cost. No V2G-specific
        participation share (it reuses bev_dsm_availability) and no separate
        discharge efficiency or power rating. Silently disabled when bev_dsm is
        false, because the v2g branch is nested inside the DSM block — v2g:
        true alone does nothing. No per-vehicle granularity, no bidirectional-
        charger investment cost, no distinction between V2G and V2H/V2B. Round
        trips lose 19% (0.9 charge x 0.9 discharge) with no further losses.
      provenance: "scripts/prepare_sector_network.py:add_EVs; scripts/build_transport_demand.py:bev_availability_profile; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
    levers:
      - key: sector.v2g
        effect: "Enable/disable the V2G Link (requires bev_dsm: true and electric share > 0 to take effect)."
        default: "true"
        provenance: "config/config.default.yaml:v2g; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_dsm
        effect: "Prerequisite gate — false removes the Store AND (silently) V2G."
        default: "true"
        provenance: "config/config.default.yaml:bev_dsm; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_dsm_availability
        effect: "Participation share: scales both the Store energy and the V2G p_nom derating."
        default: "0.5"
        provenance: "config/config.default.yaml:bev_dsm_availability; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_charge_rate
        effect: "Per-car power (11 kW) — upper bound of both charging and V2G discharge."
        default: "0.011"
        provenance: "config/config.default.yaml:bev_charge_rate; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_energy
        effect: "Per-car battery energy (50 kWh) — the energy reservoir V2G draws on."
        default: "0.05"
        provenance: "config/config.default.yaml:bev_energy; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_charge_efficiency
        effect: "Used for BOTH charge and discharge Link efficiency — sets the V2G round-trip efficiency (default 0.81)."
        default: "0.9"
        provenance: "config/config.default.yaml:bev_charge_efficiency; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.land_transport_electric_share
        effect: "Fleet electrification per horizon — the first-order driver of V2G resource size."
        default: "{2020: 0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1}"
        provenance: "config/config.default.yaml:land_transport_electric_share; scripts/prepare_sector_network.py:add_land_transport"
      - key: sector.bev_dsm_restriction_value
        effect: "Daily minimum-SOC floor — higher values shrink the energy band available for V2G cycling."
        default: "0.8"
        provenance: "config/config.default.yaml:bev_dsm_restriction_value; scripts/build_transport_demand.py:bev_dsm_profile"
    boundary:
      - variant: "V2G on/off"
        rung: L0
        note: "sector.v2g (default true); to disable ONLY V2G while keeping smart charging, set v2g: false and leave bev_dsm: true"
      - variant: "size the V2G resource (participation, battery, power, electrification)"
        rung: L1
        note: "bev_dsm_availability, bev_energy, bev_charge_rate, land_transport_electric_share"
      - variant: "V2G-specific participation share, discharge efficiency, or owner compensation cost"
        rung: L2
        note: "small edit in the V2G n.add inside add_EVs: introduce a separate share/efficiency/marginal_cost (a new config key must also be threaded through options)"
      - variant: "bidirectional-charger investment cost"
        rung: L2
        note: "add capital_cost / p_nom_extendable on the V2G Link in add_EVs; no cost row exists in technology-data (sourcing one is L3)"
      - variant: "country-specific plug-in profiles for discharge"
        rung: L3
        note: "replace the traffic_data_Pkw input of rule build_transport_demand (profile shared with charging)"
      - variant: "battery degradation constraints or annual V2G energy caps"
        rung: L5
        note: "needs custom constraints (extra_functionality in solve_network.py) on the V2G Link / EV battery Store beyond existing component attributes"
    where:
      - change: "V2G Link creation (p_nom, p_max_pu, efficiency)"
        anchor: "scripts/prepare_sector_network.py::add_EVs (v2g branch inside the bev_dsm block)"
        provenance: "scripts/prepare_sector_network.py:add_EVs"
      - change: "availability profile limiting V2G dispatch"
        anchor: "scripts/build_transport_demand.py::bev_availability_profile (rule build_transport_demand)"
        provenance: "scripts/build_transport_demand.py:bev_availability_profile"
      - change: "V2G injection point (low voltage bus)"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (v2gs re-pointing)"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "custom dispatch constraints on V2G"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "transport_data.csv 'number cars' (JRC-IDEES / Swiss BFS)"
        required_for: "V2G p_nom sizing"
        availability: "must be built (rules build_energy_totals -> build_transport_demand)"
      - input: "avail_profile.csv (from BASt pkw.csv)"
        required_for: "V2G p_max_pu"
        availability: "must be built (rule build_transport_demand); German weekly pattern Europe-wide"
      - input: "EV battery Store (bev_dsm chain)"
        required_for: "the energy V2G discharges"
        availability: "exists by default whenever bev_dsm true and electric share > 0"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        V2G is ON by default (sector.v2g: true). When the electric share of land
        transport is > 0, each node gets a "V2G" Link from the EV battery bus back to
        the AC bus, with the same p_nom as the BEV charger (number of cars x
        options.get('bev_charge_rate', 0.011) x electric_share), the same plugged-in
        availability profile as p_max_pu, and efficiency sector.bev_charge_efficiency.
        Combined with the bev_dsm Store this lets the optimiser discharge EV
        batteries to the grid.
      mechanism: >
        add_land_transport in rule prepare_sector_network: the block guarded by
        'electric_share > 0 and options["v2g"]' adds the V2G Link mirroring the BEV
        charger. The avail_profile limiting discharge comes from rule
        prepare_transport_data (bev_avail_max/bev_avail_mean on German Pkw traffic
        counts).
      not_covered: >
        No V2G-specific participation share (it reuses the full charger p_nom, not
        scaled by bev_availability), no battery-degradation cost or compensation
        payment for V2G energy, no distinct inverter/discharge efficiency (reuses
        bev_charge_efficiency), no contract/behavioural modelling. Without bev_dsm
        the Store is absent, so there is no stored energy to feed back.
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers:
      - key: sector.v2g
        effect: "Toggle: adds/removes the V2G discharge Link at every node."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:v2g"
      - key: sector.bev_dsm
        effect: "Companion toggle: adds the EV battery Store; without it V2G has no energy buffer to draw on."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:bev_dsm"
      - key: sector.bev_charge_efficiency
        effect: "Efficiency of the V2G Link (shared with the charger)."
        default: "0.9"
        provenance: "scripts/prepare_sector_network.py:bev_charge_efficiency"
      - key: sector.bev_availability
        effect: "Scales the Store energy available for shifting/discharge (share of cars doing smart charging)."
        default: "0.5"
        provenance: "scripts/prepare_sector_network.py:bev_availability"
      - key: sector.land_transport_electric_share
        effect: "Prerequisite: V2G capacity scales linearly with the electric share; zero share = no V2G."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_electric_share"

    boundary:
      - variant: "Turn V2G on/off"
        rung: L0
        note: "sector.v2g (default true)."
      - variant: "Size the V2G resource via fleet electrification and battery assumptions"
        rung: L1
        note: "Via land_transport_electric_share, bev_energy, bev_availability, bev_avail_max/mean."
      - variant: "V2G-specific participation share, discharge efficiency, or compensation cost"
        rung: L2
        note: "Small edit in the V2G n.madd inside add_land_transport (e.g. scale p_nom by a v2g share, set marginal_cost, distinct efficiency); a new config key also means adding it to your config."
      - variant: "Region-specific plug-in availability for discharge"
        rung: L3
        note: "Replace/repoint the traffic_data_Pkw input of rule prepare_transport_data (profile shared with charging)."
      - variant: "Battery degradation constraints or annual V2G energy caps"
        rung: L5
        note: "Needs custom constraints on the V2G Link/Store beyond existing component attributes."

    where:
      - change: "V2G Link definition (p_nom, efficiency, availability)"
        anchor: "scripts/prepare_sector_network.py function add_land_transport (v2g block)"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "Availability profile limiting V2G dispatch"
        anchor: "scripts/prepare_transport_data.py function prepare_transport_data (rule prepare_transport_data)"
        provenance: "scripts/prepare_transport_data.py:prepare_transport_data"

    data_dependencies:
      - input: "transport_data.csv 'number cars' (WHO GHO + Wikipedia, rule prepare_transport_data_input)"
        required_for: "V2G Link p_nom sizing"
        availability: "must be built (runtime download with hard-coded fallback data/temp_hard_coded/transport_data.csv)"
      - input: "data/emobility/Pkw__count weekly traffic counts"
        required_for: "avail_profile (p_max_pu of the V2G Link)"
        availability: "exists by default (German data applied globally)"
      - input: "non-zero land_transport_electric_share for the run's scenario key"
        required_for: "any V2G capacity to exist"
        availability: "exists by default (non-zero for most scenario keys)"
