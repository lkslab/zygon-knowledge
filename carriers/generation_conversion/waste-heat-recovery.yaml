id: waste-heat-recovery
title: Waste-heat recovery
summary: >
  Capturing excess/waste heat from industrial and power-to-X processes and
  reusing it, chiefly by feeding district heating networks.
when_to_use:
  - "waste heat recovery"
  - "industrial excess heat"
  - "use factory waste heat for district heating"
  - "electrolyser waste heat"
  - "Fischer-Tropsch or methanolisation heat to heat network"
  - "fuel cell heat recovery"
  - "excess heat to heat network"
  - "biofuel / BtL / BioSNG / biomethanol plant waste heat to district heating"
  - "pypsa-eur keys: use_electrolysis_waste_heat, use_fischer_tropsch_waste_heat, use_biofuel_waste_heat, use_biosng_waste_heat, use_biomethanol_waste_heat"
  - "heat recovery from kilns / furnaces"
  - "industrial heat integration"
models:
  - model: pypsa-eur
    version_anchor: {ref: "09e8910ae03ace9af8ff821514cda7822fdd473f", date: "2026-10-12"}
    out_of_box:
      covers: >
        Power-to-X and biofuel waste heat is covered, on by default.
        add_waste_heat (gated by sector.heating) retrofits an extra output bus
        onto the existing process Links at nodes that have an "urban central
        heat" bus: the six power-to-X donors Fischer-Tropsch, Sabatier
        (methanation), Haber-Bosch, methanolisation, H2 Electrolysis and H2
        Fuel Cell, each with its own key, plus (since the fork commit
        d2e0d486) three biofuel group keys, each 0.25 by default:
        sector.use_biofuel_waste_heat (biomass to liquid, biomass to liquid
        CC, electrobiofuels), sector.use_biosng_waste_heat (BioSNG, BioSNG CC,
        e-bioSNG) and sector.use_biomethanol_waste_heat (biomass-to-methanol
        and its CC variant from the row's efficiency-heat 0.22, e-biomethanol,
        biogas to methanol, e-biogas-methanol). The biofuel groups take 0.95 x
        (1 + H2 input) - product per MWh feed (H2 only on the boosted routes)
        times the share and land at the location of the link's feed bus
        (attach_waste_heat_at_feed: these links are named after their biomass
        or biogas bus, not their node), on the link's first free output bus.
        Since BtL and electrobiofuels are on by default, a default run with
        heating now carries their heat. The
        config values are FRACTIONS, not booleans — they scale the
        recoverable share of the theoretical waste heat: e.g. Fischer-Tropsch
        efficiency3 = (0.95 - electric efficiency) *
        sector.use_fischer_tropsch_waste_heat (default 0.25); electrolysis
        uses (0.84 - efficiency) * 0.25; fuel cell (0.95 - efficiency) * 1;
        Haber-Bosch uses 0.15 of total energy input scaled via the
        cf_industry NH3 conversion factors; methanolisation reads the
        "heat-output" attribute of its cost row. The recovered heat competes
        freely in the district-heating merit order and effectively raises the
        donor's economics wherever DH demand exists.
      mechanism: >
        rule compose_network calls add_waste_heat AFTER the supply
        blocks have created the donor links; it edits n.links in place
        (bus2/bus3/bus4 = "urban central heat", efficiencyN as above) only
        for links whose node hosts an urban central heat bus — nodes without
        district heating recover nothing. The waste-heat fractions multiply
        directly into the link efficiencies. The biofuel groups are attached
        through attach_waste_heat_at_feed with boosted_waste_heat's energy
        balance, after the power-to-X blocks.
      not_covered: >
        No INDUSTRIAL process waste heat: cement kilns, steel, glass and the
        "gas for industry" / "solid biomass for industry" links have no heat
        byproduct output — industry only consumes heat, as flat loads with
        no temperature resolution.
        DAC is a heat CONSUMER (add_dac draws from urban central /
        services urban decentral heat), not a donor. SMR, biogas upgrading
        and nuclear have no waste-heat hook. Process-emission capture heat is
        waved through ("assume enough local waste heat for CC" comment above
        the process emissions CC link — capture heat demand is not modelled
        at all). No on-site reuse, heat cascading between industries, ORC
        power recovery, or temperature-level accounting of the recovered
        heat; recovery is only into urban central district heating, so the
        district-heating footprint (sector.district_heating.potential and
        progress) caps total recovery. The feed-bus location lookup skips
        non-spatial feeds: biofuel links on an "EU solid biomass" bus
        (sector.biomass_spatial false) or an "EU biogas" bus
        (sector.gas_network false) keep their heat unused, logged but not
        refused.
      provenance: "scripts/prepare_sector_network.py:add_waste_heat; scripts/prepare_sector_network.py:use_fischer_tropsch_waste_heat; scripts/prepare_sector_network.py:add_dac; scripts/prepare_sector_network.py:assume enough local waste heat for CC; config/config.default.yaml:use_electrolysis_waste_heat; scripts/prepare_sector_network.py:attach_waste_heat_at_feed; scripts/prepare_sector_network.py:boosted_waste_heat"
    levers:
      - key: sector.use_fischer_tropsch_waste_heat
        effect: "Fraction of Fischer-Tropsch waste heat (0.95 minus fuel efficiency) recoverable to district heating; 0/false disables."
        default: "0.25"
        provenance: "config/config.default.yaml:use_fischer_tropsch_waste_heat; scripts/prepare_sector_network.py:use_fischer_tropsch_waste_heat"
      - key: sector.use_electrolysis_waste_heat
        effect: "Fraction of electrolyser waste heat (0.84 minus H2 efficiency) to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_electrolysis_waste_heat; scripts/prepare_sector_network.py:use_electrolysis_waste_heat"
      - key: sector.use_fuel_cell_waste_heat
        effect: "Fraction of H2 fuel cell waste heat to district heating — the only donor defaulting to full recovery."
        default: "1"
        provenance: "config/config.default.yaml:use_fuel_cell_waste_heat; scripts/prepare_sector_network.py:use_fuel_cell_waste_heat"
      - key: sector.use_methanolisation_waste_heat
        effect: "Fraction of methanolisation heat-output (from the cost row) to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_methanolisation_waste_heat; scripts/prepare_sector_network.py:use_methanolisation_waste_heat"
      - key: sector.use_methanation_waste_heat
        effect: "Fraction of Sabatier waste heat to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_methanation_waste_heat; scripts/prepare_sector_network.py:use_methanation_waste_heat"
      - key: sector.use_haber_bosch_waste_heat
        effect: "Fraction of Haber-Bosch waste heat (0.15 of total energy input, converted via the NH3 factors) to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_haber_bosch_waste_heat; scripts/prepare_sector_network.py:use_haber_bosch_waste_heat"
      - key: sector.use_biofuel_waste_heat
        effect: "Fraction of the waste heat of biomass to liquid (± CC) and electrobiofuels to district heating at the biomass node."
        default: "0.25"
        provenance: "config/config.default.yaml:use_biofuel_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.use_biosng_waste_heat
        effect: "Fraction of the waste heat of BioSNG (± CC) and e-bioSNG to district heating at the biomass node."
        default: "0.25"
        provenance: "config/config.default.yaml:use_biosng_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.use_biomethanol_waste_heat
        effect: "Fraction of the waste heat of biomass-to-methanol (± CC), e-biomethanol, biogas to methanol and e-biogas-methanol to district heating at the feedstock node."
        default: "0.25"
        provenance: "config/config.default.yaml:use_biomethanol_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.district_heating.potential be recovered at those nodes, and DH demand caps useful recovery."
        default: "0.6 (with per-horizon progress ramp)"
        provenance: "config/config.default.yaml:district_heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.heating
        effect: "Gates add_waste_heat entirely."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_waste_heat"
    boundary:
      - variant: "P2X waste heat into district heating"
        rung: L0
        note: "default for the six power-to-X donors (at 25% recovery except fuel cell at 100%) and the three biofuel groups (25%, for whichever of their routes are on)"
      - variant: "full recovery / disable recovery per donor"
        rung: L1
        note: "set the respective sector.use_*_waste_heat to 1 or 0 — values are multiplicative fractions"
      - variant: "add a donor process (e.g. SMR, biogas upgrading CC)"
        rung: L2
        note: "add a block in add_waste_heat assigning a spare busN + efficiencyN on that carrier's links, mirroring the Sabatier block, or for a link named after its feed bus extend the carrier groups of use_biofuel_waste_heat / use_biosng_waste_heat / use_biomethanol_waste_heat (attach_waste_heat_at_feed finds the free bus and the node) — the three biofuel keys are the precedent for a new group key"
      - variant: "industrial excess heat (cement/steel/glass) into district heating"
        rung: L2
        note: "mechanically: give the 'gas for industry' / 'solid biomass for industry' links in add_industry an extra urban-central-heat output (bus/efficiency pair, mirroring add_waste_heat); a defensible potential-based version needs excess-heat data per site and temperature (L3), and a proper representation with recovery investment cost is L5"
      - variant: "waste heat as heat-pump SOURCE instead of direct use"
        rung: L5
        note: "district heating heat-pump sources are configured heat sources (heat_pump_sources) with dedicated potential rules — no industrial-excess-heat source chain exists (limited_heat_sources knows geothermal and river_water only)"
      - variant: "on-site reuse within industry (cascading between temperature levels)"
        rung: L2
        note: "with sector.industry_t.endogen (fork) the band buses exist per node, but their supply links have no heat byproduct output and no link connects the bands; a cascade (e.g. heat500+ exhaust feeding heat100-200) is an extra output bus on the firing links or a band-to-band link in add_t_industry* — see industry-process-heat-endogenous"
      - variant: "ORC electricity from waste heat"
        rung: L5
        note: "no ORC technology; needs new links + cost rows and a heat source to draw on"
    where:
      - change: "donor list, recovery fractions and bus wiring"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "feed-bus-located donors (biofuel groups) and their energy balance"
        anchor: "scripts/prepare_sector_network.py::attach_waste_heat_at_feed / ::boosted_waste_heat"
        provenance: "scripts/prepare_sector_network.py:attach_waste_heat_at_feed; scripts/prepare_sector_network.py:boosted_waste_heat"
      - change: "which nodes can receive waste heat"
        anchor: "scripts/prepare_sector_network.py::add_heat (urban central heat bus creation, district heat share)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "industrial fuel links that could donate heat"
        anchor: "scripts/prepare_sector_network.py::add_industry ('gas for industry', 'solid biomass for industry' links)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "Haber-Bosch waste-heat conversion factors"
        anchor: "config industry.MWh_H2_per_tNH3_electrolysis / MWh_elec_per_tNH3_electrolysis / MWh_NH3_per_tNH3 (cf_industry in add_waste_heat)"
        provenance: "config/config.default.yaml:MWh_NH3_per_tNH3; scripts/prepare_sector_network.py:MWh_NH3_per_tNH3"
    data_dependencies:
      - input: "urban central heat buses with district heating demand (build_district_heat_share chain)"
        required_for: "any waste-heat recovery — donors at nodes without DH recover nothing"
        availability: "exists by default in sector runs; footprint set by district_heating potential/progress"
      - input: "donor links (Fischer-Tropsch, Sabatier, Haber-Bosch, methanolisation, H2 Electrolysis, H2 Fuel Cell; BtL, electrobiofuels, BioSNG, biomass-to-methanol and the e-/biogas routes when on)"
        required_for: "the six power-to-X recovery channels and the three biofuel groups"
        availability: "exists by default in sector runs (respective supply blocks)"
      - input: "methanolisation cost row with heat-output attribute; biomass-to-methanol row with efficiency-heat"
        required_for: "methanolisation and biomass-to-methanol recovery efficiency"
        availability: "exists by default via retrieve_cost_data"
      - input: "industrial excess-heat potentials by site and temperature"
        required_for: "genuine industrial waste-heat recovery"
        availability: "absent — no such dataset in the workflow"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Nothing. Industry appears only as flat per-carrier demand loads
        (add_industry); no heat output from industrial processes exists that
        could be recovered. The only textual trace is the comment "assume
        enough local waste heat for CC" above the "process emissions CC" link —
        i.e. capture heat requirements are assumed free, not modelled. There is
        no Fischer-Tropsch/electrolysis waste-heat-to-district-heat option
        either (no such link in prepare_sector_network).
      mechanism: >
        add_industry attaches one-directional loads (gas/biomass/oil/coal/
        electricity/low-temperature heat); district heat buses ("urban central
        heat") are supplied only by heat pumps, resistive heaters, gas boilers,
        CHP and solar thermal in add_heat.
      not_covered: >
        No industrial excess-heat source, no waste-heat-to-DH link, no on-site
        heat cascading, no ORC power recovery. Waste-heat recovery can only be
        approximated exogenously by shrinking industry fuel rows and/or the
        "low-temperature heat" rows in the demand data, or endogenously only
        after writing a new component.
      provenance: "scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: custom_data.industry_demand
        effect: "Route to encode on-site waste-heat reuse as reduced fuel/heat rows in the custom industry demand csv."
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: sector.enable.industry
        effect: "Gates the industry loads whose implied waste heat is at stake."
        default: "true"
        provenance: "config.default.yaml:industry"
      - key: sector.district_heating.potential
        effect: "Max district-heating share of urban demand — bounds how much recovered heat a DH feed-in could ever displace."
        default: "0.3"
        provenance: "config.default.yaml:district_heating"

    boundary:
      - variant: "on-site waste-heat reuse (lower net fuel/steam demand)"
        rung: L3
        note: >
          Exogenous: scale down the relevant industry columns'
          fuel and 'heat' rows via
          data/custom/industry_demand_{demand}_{planning_horizons}.csv
          (custom_data.industry_demand: true) or edit industry_base_totals in
          build_industry_demand.
      - variant: "fixed industrial excess-heat feed-in to district heating"
        rung: L2
        note: >
          Small localised addition in prepare_sector_network: a Generator or
          negative Load on the 'urban central heat' buses next to the existing
          supply in add_heat, sized from plant capacities in
          resources/industrial_database.csv.
      - variant: "endogenous waste-heat recovery (heat output coupled to industrial activity, competing with other DH supply)"
        rung: L5
        note: "industrial loads have no activity variable or heat output port; requires re-modelling industry demand as links with a heat by-product — bespoke Python."

    where:
      - change: "district-heat supply stack where recovered heat would feed in"
        anchor: "add_heat in prepare_sector_network ('urban central heat' bus technologies)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "the assumption that CC waste heat is free"
        anchor: "add_industry — comment above the 'process emissions CC' link"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "industry demand rows to shrink (exogenous route)"
        anchor: "rule build_industry_demand — industry_base_totals; custom data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "plant locations to size a feed-in"
        anchor: "rule build_industrial_database output resources/industrial_database.csv"
        provenance: "Snakefile:build_industrial_database"

    data_dependencies:
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "baseline industry fuel/heat rows being reduced"
        availability: "must be built; region-dependent"
      - input: "resources/industrial_database.csv (GEM/SFI plants)"
        required_for: "locating and sizing potential excess-heat sources"
        availability: "must be built (rule build_industrial_database); region-dependent coverage"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "exogenous waste-heat savings"
        availability: "absent — user-supplied"
