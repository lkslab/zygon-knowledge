id: waste-to-energy
title: Waste-to-energy (waste incineration, waste CHP, municipal solid waste)
summary: >
  Energy recovery from waste streams — municipal solid waste and
  non-recycled plastics (HVC) — in incineration/CHP plants producing
  electricity and district heat, optionally with carbon capture.
when_to_use:
  - "waste to energy"
  - "waste incineration"
  - "municipal solid waste / MSW"
  - "burn plastics / HVC waste"
  - "waste CHP"
  - "energy from garbage / refuse"
  - "waste incineration with carbon capture"
  - "existing waste-fired power plants"
  - "pypsa-eur carrier names: waste, waste CHP, waste CHP CC, municipal solid waste, non-sequestered HVC, waste to air (formerly HVC to air), waste transport"
  - "MSW power / municipal solid waste to electricity"
  - "energy from waste / EfW plant"
  - "waste-to-energy plant"
  - "incinerator with energy recovery"
  - "known in pypsa-eur as: municipal solid waste, waste, waste CHP, waste CHP CC"
models:
  - model: pypsa-eur
    version_anchor: {ref: "b3606ff14c838bf1bda9cbf5289ea2ff68756fbb", date: "2026-10-26"}
    out_of_box:
      covers: >
        Waste-to-energy is first-class in BOTH workflows. Electricity
        workflow: "waste" is in electricity.conventional_carriers by default,
        so existing waste incineration plants from powerplantmatching are
        attached as conventional Generators; rule process_cost_data
        synthesises the "waste" cost row by copying the "waste CHP" row and
        setting its CO2 intensity to the oil value (prepare_costs), so waste
        dispatch carries costs and emissions. Sector workflow: a waste sector
        of its own (the port of PyPSA/pypsa-eur#1654, completed on the fork),
        ON by default (sector.waste: true). add_waste builds a "waste" bus
        (MWh_LHV) per node (sector.waste_spatial: true, the default) or one
        "EU waste" bus, fed by a "non-sequestered HVC" Generator: the share of
        the naphtha-derived plastics that is neither process-emitted nor
        sequestered (industry.HVC_environment_sequestration_fraction, scaled
        by sector.HVC_demand_factor), distributed by population, with
        e_sum_min = e_sum_max = that energy so it MUST be used within the year
        — either burnt without energetic use through a "<node> waste to air"
        link (CO2 at the oil intensity; it replaces the former "HVC to air"
        store-and-vent) or, with waste.waste_to_energy: true, in extendable
        "<node> waste CHP" Links (bus0 = waste bus, bus1 = electricity, bus2
        = urban central heat where a district heating bus exists, bus3 = co2
        atmosphere; cost row "waste CHP" with efficiency-heat).
        waste.waste_to_energy_cc adds a "waste CHP CC" variant capturing
        sector.cc_fraction of the oil CO2 intensity into the co2 stored
        buses. The municipal solid waste potential is folded in only with
        waste.waste_to_energy or waste.waste_to_energy_cc: a "municipal solid
        waste" bus and Generator per node (potentials from
        build_biomass_potentials: ENSPRESO class "Municipal waste" under
        biomass.classes, plus the eurostat "Renewable municipal waste"
        unsustainable share; e_sum_min = e_sum_max forcing full use) and a
        "<node> municipal solid waste to waste" link onto the waste bus that
        takes the oil CO2 intensity out of the atmosphere, since MSW is
        counted carbon-neutral. waste.transport adds non-extendable "waste
        transport" links along the network topology at the biomass transport
        costs (needs waste_spatial). With sector.waste false the naphtha link
        releases the non-sequestered HVC carbon directly. With
        sector.endogenous_sectors (cement listed) the endogenous cement kiln
        burns waste from the same bus ("<node> cement heat waste"). In the
        default case the outcome equals the former HVC store, whose content
        was forced to zero at the last snapshot.
      mechanism: >
        Electricity: rule build_powerplants + rule compose_network calling
        add_electricity.py (attach_conventional_generators). Sector: the
        prepare_sector_network.py part of compose_network — add_industry
        builds the naphtha link (its non-sequestered carbon left to the waste
        sector when sector.waste is on), add_waste (called when sector.waste
        is true, with the waste: config chapter as params) builds the waste
        bus, the HVC and MSW generators, waste to air, the waste CHP / CC
        links and waste transport; define_spatial resolves spatial.waste per
        node or EU-wide by sector.waste_spatial.
      not_covered: >
        Both waste-to-energy flags default to FALSE — the default sector run
        burns all non-sequestered plastic waste through "waste to air" (its
        carbon vented) and has no MSW. The existing
        waste fleet (electricity workflow "waste" generators) is power-only
        and is dropped in sector runs (remove_elec_base_techs keep-list) —
        there is no brownfield waste CHP; add_existing_baseyear has no waste
        mapping. Waste CHP heat only reaches nodes that have an "urban central
        heat" bus (empty bus2 elsewhere — plants there are effectively
        electricity-only). No landfill gas, no anaerobic-digestion pathway
        distinct from biogas, no refuse-derived-fuel export, no gate-fee
        (negative fuel price) representation: the MSW and HVC generators carry
        marginal cost 0 in add_waste. The waste
        CHP has no back-pressure constraint (same dormancy as all CHP — see
        combined-heat-and-power carrier card).
      provenance: "scripts/prepare_sector_network.py:waste CHP; scripts/prepare_sector_network.py:add_waste; scripts/prepare_sector_network.py:non-sequestered HVC; scripts/prepare_sector_network.py:waste to air; scripts/prepare_sector_network.py:municipal solid waste to waste; scripts/process_cost_data.py:prepare_costs; scripts/add_electricity.py:attach_conventional_generators; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
    levers:
      - key: sector.waste
        effect: "Builds the waste sector (add_waste): the waste bus, the must-use non-sequestered HVC generator and waste to air; false releases the non-sequestered HVC carbon at the naphtha link instead."
        default: "true"
        provenance: "config/config.default.yaml:waste; scripts/prepare_sector_network.py:add_waste"
      - key: sector.waste_spatial
        effect: "true resolves the waste bus (and HVC and MSW generators) per node, population-distributed; false pools everything on one EU waste bus."
        default: "true"
        provenance: "config/config.default.yaml:waste_spatial; scripts/prepare_sector_network.py:define_spatial"
      - key: waste.waste_to_energy
        effect: "true adds extendable 'waste CHP' Links burning the waste bus into electricity + district heat at every node, and folds the MSW potential into the waste bus."
        default: "false"
        provenance: "config/config.default.yaml:waste_to_energy; scripts/prepare_sector_network.py:waste CHP"
      - key: waste.waste_to_energy_cc
        effect: "true adds the 'waste CHP CC' variant (capture share sector.cc_fraction of the oil CO2 intensity to co2 stored), and folds the MSW potential in as well."
        default: "false"
        provenance: "config/config.default.yaml:waste_to_energy_cc; scripts/prepare_sector_network.py:waste CHP CC"
      - key: waste.transport
        effect: "true adds fixed-capacity 'waste transport' links between neighbouring nodes at the biomass transport costs (only with sector.waste_spatial)."
        default: "false"
        provenance: "config/config.default.yaml:transport; scripts/prepare_sector_network.py:waste transport"
      - key: electricity.conventional_carriers
        effect: "'waste' entry attaches the existing waste incineration fleet in the electricity workflow; remove it to drop them."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: industry.HVC_environment_sequestration_fraction
        effect: "Share of plastics waste permanently sequestered (never burnable) — scales the fuel available to waste CHP down."
        default: "0.0"
        provenance: "config/config.default.yaml:HVC_environment_sequestration_fraction; scripts/prepare_sector_network.py:add_industry"
      - key: sector.cc_fraction
        effect: "Capture rate of the waste CHP CC (and SMR CC) links."
        default: "0.9"
        provenance: "config/config.default.yaml:cc_fraction; scripts/prepare_sector_network.py:waste CHP CC"
      - key: sector.HVC_demand_factor
        effect: "Scales the HVC (naphtha) demand and with it the non-sequestered HVC energy the waste bus must take."
        default: "1.0"
        provenance: "config/config.default.yaml:HVC_demand_factor; scripts/prepare_sector_network.py:add_waste"
      - key: biomass.classes
        effect: "The 'municipal solid waste' class maps ENSPRESO feedstock 'Municipal waste' into the MSW potential; edit to re-scope what counts as MSW."
        default: "municipal solid waste: [Municipal waste]"
        provenance: "config/config.default.yaml:biomass.classes; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
      - key: industry.HVC_primary_fraction
        effect: "Upstream: plastics production route shares (with mechanical/chemical recycling fractions) set how much naphtha — and therefore burnable HVC waste — exists per horizon."
        default: "ramps 0.88 (2020) to 0.4 (2050)"
        provenance: "config/config.default.yaml:HVC_primary_fraction; scripts/prepare_sector_network.py:add_industry"
    boundary:
      - variant: "existing waste incineration plants dispatching in the electricity workflow"
        rung: L0
        note: "default — 'waste' in electricity.conventional_carriers, costs synthesised from the waste CHP row"
      - variant: "burn plastic waste in CHPs (sector run)"
        rung: L0
        note: "waste.waste_to_energy: true (sector.waste on, the default); heat side needs district heating nodes"
      - variant: "waste CHP with carbon capture"
        rung: L1
        note: "waste.waste_to_energy_cc: true (+ waste.waste_to_energy for the unabated variant alongside); capture rate via sector.cc_fraction"
      - variant: "municipal solid waste as a fuel"
        rung: L0
        note: "comes with waste.waste_to_energy or waste.waste_to_energy_cc: the MSW potential joins the waste bus, carbon-neutral, and must be used in full"
      - variant: "move waste between regions to the CHP sites"
        rung: L1
        note: "waste.transport: true (with sector.waste_spatial true); links are fixed at 5e4 MW, not extendable"
      - variant: "waste as a cement kiln fuel"
        rung: L0
        note: "sector.endogenous_sectors.enable with cement ([[cement-routes-endogenous]]): '<node> cement heat waste' draws from the waste bus"
      - variant: "change MSW potential or scope"
        rung: L3
        note: "edit biomass.classes 'municipal solid waste' membership (config, L1) only re-maps existing ENSPRESO categories; different totals need edited biomass_potentials data or another biomass.scenario"
      - variant: "gate fees (negative waste fuel price)"
        rung: L2
        note: "the MSW generator marginal_cost is 0 in add_waste; set a negative marginal_cost there"
      - variant: "force or cap waste incineration capacity"
        rung: L2
        note: "no config key; set p_nom_min/p_nom_max on the waste CHP n.add calls in add_waste — the must-use waste must still have an outlet (waste to air remains the relief valve)"
      - variant: "brownfield waste CHP fleet in sector runs"
        rung: L5
        note: "no waste mapping in add_existing_baseyear and the elec-workflow waste generators are dropped by remove_elec_base_techs; carrying them into sector networks with heat output is bespoke"
      - variant: "electricity-only waste plant expansion"
        rung: L1
        note: "add 'waste' to electricity.extendable_carriers.Generator (candidates at existing waste plant buses)"
      - variant: "landfill gas / RDF export / separate waste heat-only boilers"
        rung: L5
        note: "no such chains exist anywhere in the workflow"
    where:
      - change: "waste bus, non-sequestered HVC generator, waste to air, waste CHP and waste CHP CC links, MSW generator and feed link, waste transport"
        anchor: "scripts/prepare_sector_network.py::add_waste (called when sector.waste is true)"
        provenance: "scripts/prepare_sector_network.py:add_waste; scripts/prepare_sector_network.py:waste to air"
      - change: "the naphtha link's carbon booking with and without the waste sector"
        anchor: "scripts/prepare_sector_network.py::add_industry (naphtha for industry conversion)"
        provenance: "scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:emitted_co2_per_naphtha"
      - change: "MSW potential from ENSPRESO + eurostat renewable municipal waste"
        anchor: "scripts/build_biomass_potentials.py::enspreso_biomass_potentials (rule build_biomass_potentials; biomass.classes config)"
        provenance: "scripts/build_biomass_potentials.py:enspreso_biomass_potentials; rules/build_sector.smk:build_biomass_potentials"
      - change: "electricity-workflow waste fleet and its synthesised cost row"
        anchor: "scripts/add_electricity.py::attach_conventional_generators; scripts/process_cost_data.py::prepare_costs (waste = waste CHP row)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/process_cost_data.py:waste CHP"
      - change: "spatial resolution of the waste stream (regional vs EU)"
        anchor: "scripts/prepare_sector_network.py::define_spatial (spatial.waste, sector.waste_spatial)"
        provenance: "scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:non_sequestered_hvc"
    data_dependencies:
      - input: "cost rows 'waste CHP', 'waste CHP CC' (efficiency, efficiency-heat, VOM) and 'biomass CHP capture'"
        required_for: "waste CHP economics and the CC variant; also the elec-workflow 'waste' carrier"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "industrial_energy_demand (naphtha column, process emission from feedstock)"
        required_for: "sizing the non-sequestered HVC waste stream"
        availability: "must be built (industry demand chain, default in sector workflow)"
      - input: "biomass_potentials CSV with 'municipal solid waste' column (ENSPRESO + eurostat)"
        required_for: "MSW potentials"
        availability: "must be built (rule build_biomass_potentials); exists by default, read by add_waste only with a waste-to-energy flag on"
      - input: "urban central heat buses"
        required_for: "the heat output of waste CHP"
        availability: "must be built (heat workflow); waste CHP at non-DH nodes degrades to power-only"
      - input: "powerplantmatching database (fueltype Waste)"
        required_for: "existing waste fleet in the electricity workflow"
        availability: "retrieved by the workflow; coverage of small incinerators varies"
      - input: "co2 stored buses / sequestration chain"
        required_for: "waste CHP CC"
        availability: "exists by default in sector runs"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        NOT COVERED as a technology — grounded absence: no "waste" carrier exists
        in electricity.conventional_carriers ([nuclear, oil, OCGT, CCGT, coal,
        lignite, geothermal, biomass]) or anywhere else in the workflow (the only
        "waste" key in config.default.yaml is a tech_colors plotting entry).
        Waste is nevertheless PRESENT in the inputs, twice, and silently
        discarded or relabelled: (1) powerplantmatching delivers real
        Fueltype "Waste" plants into resources/*/powerplants.csv (verified rows,
        e.g. bagasse and landfill units in UG/ZA); load_powerplants lowercases
        Fueltype to carrier "waste", which then fails the
        ppl.query("carrier in @carriers") filter in
        attach_conventional_generators and is dropped without warning. (2) In the
        sector pipeline the UNSD energy-balance processing folds the waste fuel
        commodities — "Municipal Wastes", "Industrial Waste", "Animal waste",
        "Vegetal waste" — into the biomass_fuels list of aggregate_fuels, so
        waste final-energy consumption lands in the biomass demand totals built
        by calc_sector.
      mechanism: >-
        No rule builds waste-to-energy. The machinery it would enter through: the
        conventional-carrier pipeline (attach_conventional_generators in
        scripts/add_electricity.py attaches any carrier listed in
        electricity.conventional_carriers with fleet rows in powerplants.csv and
        a matching costs row), and on the sector side the
        "urban central solid biomass CHP" Link block in add_biomass
        (prepare_sector_network.py) is the in-repo CHP template. The retrieved
        technology-data v0.13.2 costs file ships "waste CHP" and "waste CHP CC"
        rows (verified in a locally built costs_2030_elec.csv) — cost data exists
        upstream, unconsumed; a plain "waste" electricity-generation row does NOT
        exist.
      not_covered: >-
        Everything waste-specific: no waste carrier, no MSW resource/arisings
        data, no gate-fee economics, no disposal must-run behaviour, no
        waste-CHP link. Existing waste plants are dropped from the power fleet
        and waste demand-side energy is relabelled biomass.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/_helpers.py:aggregate_fuels"
    levers:
      - key: electricity.custom_powerplants
        effect: >-
          "merge" injects user-authored rows from data/custom_powerplants.csv —
          the proxy route: author the waste plant with Fueltype "Bioenergy",
          which load_powerplants maps to carrier "biomass" (already in
          conventional_carriers with a costs row), so it attaches without code.
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants; scripts/add_electricity.py:load_powerplants"
      - key: electricity.conventional_carriers
        effect: >-
          The list a "waste" carrier must join for the already-present ppm Waste
          fleet to survive the carrier filter — but attachment joins costs on
          carrier, and no "waste" costs row exists in the retrieved
          technology-data, so this flip alone is not sufficient (see boundary).
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: >-
          Pandas query applied to the powerplant list; can keep or exclude Waste
          fleet rows by date/attribute once the carrier is representable.
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter; scripts/build_powerplants.py:add_custom_powerplants"
      - key: sector.solid_biomass_potential
        effect: >-
          Sector-run proxy: fold the recoverable MSW energy (TWh/a) into this
          scalar so it is burnable via the solid-biomass chain, including the
          existing biomass CHP link.
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.chp
        effect: >-
          Gates the "urban central solid biomass CHP" Link that a waste-CHP
          representation would clone (and, under the proxy, already burns the
          folded-in waste energy at district-heating nodes).
        default: "true"
        provenance: "config.default.yaml:chp; scripts/prepare_sector_network.py:add_biomass"
      - key: electricity.extendable_carriers.Generator
        effect: >-
          List a new waste carrier would join to be capacity-expandable; note
          extendable conventional carriers are only placed at buses already
          hosting plants of that carrier (carrier_buses from the fleet).
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
    boundary:
      - variant: "Existing waste-to-energy plant as a biomass unit (proxy)"
        rung: L1
        note: >-
          Cheapest honest route: set electricity.custom_powerplants to "merge"
          and author the plant in data/custom_powerplants.csv (template ships)
          with Fueltype "Bioenergy" — load_powerplants' carrier_dict maps
          bioenergy to "biomass", which has costs and is in
          conventional_carriers, so it attaches with biomass economics and CO2
          accounting. Conflates waste with biomass; the ppm "Waste" fleet rows
          themselves stay dropped.
      - variant: "Fold MSW energy into the sector biomass supply (proxy)"
        rung: L1
        note: >-
          Add the recoverable waste energy to sector.solid_biomass_potential —
          it then flows through the solid-biomass Store and the existing urban
          central solid biomass CHP link (sector.chp). No waste-specific cost,
          siting or accounting.
      - variant: "Distinct 'waste' electricity carrier using the ppm Waste fleet"
        rung: L3
        note: >-
          Add "waste" to electricity.conventional_carriers (the fleet rows are
          already in resources/*/powerplants.csv) AND supply a "waste"
          generation costs row — none exists in the retrieved technology-data
          (only "waste CHP"/"waste CHP CC"), so the row must be authored via the
          costs machinery (load_costs overwrites / a custom
          costs.technology_data_version). Data authoring makes this L3, not L0.
      - variant: "Waste CHP link in sector runs (using the shipped waste CHP costs rows)"
        rung: L2
        note: >-
          Clone the "urban central solid biomass CHP" Link block in add_biomass
          under key "waste CHP" — the costs rows exist in retrieved
          technology-data v0.13.2, so no data work if it keeps burning from the
          solid-biomass bus; a dedicated municipal-waste fuel bus pushes it to
          L3.
      - variant: "Nodal MSW resource potential (waste arisings per region)"
        rung: L3
        note: >-
          No waste-arisings dataset exists in the repo; supply per-node
          potentials and replace the equal spatial split of the potential in
          add_biomass (or cap the new waste carrier's p_nom_max / store e_nom).
      - variant: "Split waste out of the UNSD biomass demand totals"
        rung: L2
        note: >-
          The relabelling is a list membership: move the waste commodities out
          of biomass_fuels in aggregate_fuels (_helpers.py) into a new list and
          carry a new column through calc_sector in build_base_energy_totals.py
          — localised, but every downstream consumer of the biomass totals sees
          the change.
      - variant: "Disposal must-run obligation / gate-fee economics"
        rung: L5
        note: >-
          Negative fuel cost (gate fee) fits marginal_cost, but a
          must-incinerate-the-waste-stream constraint has no machinery; bespoke
          constraint in solve_network.py extra_functionality.
    where:
      - change: "carrier filtering / attachment of (waste) fleet and extendable placement"
        anchor: "scripts/add_electricity.py::attach_conventional_generators; carrier naming in load_powerplants (to_pypsa_names lowercasing + carrier_dict)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/add_electricity.py:load_powerplants"
      - change: "authoring proxy / custom waste plant rows"
        anchor: "scripts/build_powerplants.py::add_custom_powerplants with electricity.custom_powerplants and data/custom_powerplants.csv"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - change: "waste costs row / cost overrides"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data; costs.technology_data_version"
        provenance: "scripts/process_cost_data.py:load_costs"
      - change: "waste CHP link (sector)"
        anchor: "scripts/prepare_sector_network.py::add_biomass, urban central solid biomass CHP Link block as template"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "waste-vs-biomass fuel classification in demand totals"
        anchor: "scripts/_helpers.py::aggregate_fuels (biomass_fuels list); scripts/build_base_energy_totals.py::calc_sector (rule build_base_energy_totals)"
        provenance: "scripts/_helpers.py:aggregate_fuels; scripts/build_base_energy_totals.py:calc_sector"
      - change: "disposal must-run / bespoke waste constraints"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "powerplantmatching Fueltype 'Waste' fleet rows in resources/<run>/powerplants.csv"
        required_for: "distinct waste electricity carrier (placement follows the fleet)"
        availability: "exists by default where such plants exist — region-dependent and sparse (built runs show single-digit rows per region)"
      - input: "technology-data costs rows 'waste CHP' / 'waste CHP CC' (rule retrieve_cost_data, costs.technology_data_version v0.13.2)"
        required_for: "waste CHP link in sector runs"
        availability: "exists by default in the retrieved costs file"
      - input: "plain 'waste' electricity-generation costs row"
        required_for: "distinct waste carrier in the power model"
        availability: "absent — must be authored by the user"
      - input: "data/custom_powerplants.csv rows"
        required_for: "proxy biomass-labelled plant / seeded waste candidate units"
        availability: "template exists by default; rows user-authored"
      - input: "MSW arisings / waste resource potential per region"
        required_for: "nodal waste supply limits"
        availability: "absent — must be provided by the user"
      - input: "UNSD energy-balance files (waste commodities), data/demand/unsd"
        required_for: "splitting waste out of the biomass demand totals"
        availability: "retrieved by default in sector runs (rule build_base_energy_totals)"
