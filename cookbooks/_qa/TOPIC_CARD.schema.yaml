# TOPIC CARD SCHEMA (v2) — normative for cookbooks/<model>/topics/*.yaml
# carrying `schema_version: 2`. Replaces the v1 wiring-card format card by
# card as topics are hand-migrated; v1 cards keep validating against their
# old rules (same checker, other branch) until converted.
#
# THE GATE: a card WITHOUT `schema_version: 2` cannot scope a study. The
# interview says so plainly and stops — the topic is real, the wiring for it
# is not written yet. That is the whole point of the marker: 100 cards that
# look wired and aren't is worse than 1 that provably is.
#
# Design rule: a v2 card ROUTES, it does not describe. Its outbound edges must
# terminate in something executable — `recipes:` into the recipe books (whose
# boundary rungs decide the bundle's shape) and `methods:` into the v2
# executable specs (the only method form a bundle may cite). The v1
# `functionality:` edge terminated in a registry of prose capability
# descriptions, so it could never make a promise the referee would keep; v2
# drops it. The test of a good card is mechanical: every id on it resolves,
# and the things it resolves to are runnable.
#
# Field reference (— required unless marked optional):

schema_version: 2          # literal 2
id: <slug>                 # = filename without .yaml, kebab-case
title: <title>             # MUST equal the canonical title for this rank
rank: <int>                # rank<->slug<->title bijection is pinned in
                           # cookbooks/_qa/topic_card_lib.py:TOPICS — the card
                           # cannot invent or rename a topic. 1..100 = the
                           # Appendix A universe; >100 = zygon-native
                           # extensions (edited in TOPICS, same commit as the
                           # cards for BOTH books)
question: >                # the planning question in the asker's terms
  ...
when_to_use:               # >= 1 phrase a user might actually say; this is
  - "..."                  # what INDEX.md is scanned against

recipes:                   # the technology/demand recipes this topic draws
  generation_conversion:   # on. Slugs validated against the on-disk books.
    - <slug>               # Open ONLY these; boundary rungs live there.
  demand:
    - <slug>

methods:                   # >= 1 — the executable edge, cheapest-first.
  - id: <method slug>      #   resolves to cookbooks/methods/<id>.yaml OR
                           #   <id>/spec.yaml (dir form ships a payload).
                           #   The spec must be v2 and must carry a section
                           #   for THIS card's model. A v1 essay is not
                           #   linkable — bundles may not cite one, so a card
                           #   may not point at one either.
    role: "..."            #   one line: why this method, for this topic

defaults:                  # optional — an axis where the SHIPPED config is
  - aspect: <slug>         #   already the answer, so there is no spec to
    is: "..."              #   cite. Data, not prose, so it is greppable and
    note: "..."            #   optional. An `aspect` may not collide with a
                           #   methods[].id: if a spec exists for the axis,
                           #   link the spec.

plots:                     # optional — the presentation edge, for topics
  - id: <plot card id>     #   whose DELIVERABLE is a figure/statistic set.
                           #   Resolves to plots/<id>.py — plot cards are
                           #   executable (schema-validated params), so the
                           #   edge terminates in something runnable, the
                           #   same rule as methods. House routing (mandatory
                           #   checkpoint figures) stays in plots/INDEX.md;
                           #   this edge only names the cards that ARE the
                           #   topic's answer.
    role: "..."            #   one line: what this figure answers here
    params: {}             #   optional suggested --params for this topic
                           #   (not validated against the card's SCHEMA —
                           #   the card itself rejects illegal params)

gap_assessment: >          # how far the standard workflow gets TODAY, in the
  ...                      # user's terms. Honesty before promises.
coverage: ready            # ready | partial | gap — the one-word verdict

models:                    # exactly ONE entry: a card file is single-model
  - model: pypsa-eur       #   by construction (the other suite has its own
    version_anchor:        #   card for the same rank; diffing the two shows
      ref: <full sha>      #   exactly where the models differ)
      date: "YYYY-MM-DD"

# STATUS IS NOT MIRRORED ONTO CARDS. A method's draft/verified state is
# per-model and is WRITTEN BY THE METHOD EVAL (evals/methods/run.py), never by
# hand. Copying it here would create a second source of truth that goes stale
# the next time an eval runs. The card links the method; the checker resolves
# the spec and WARNS (does not fail) when the section for this model is still
# draft, so the eval's flip to `verified` needs no card edit. At interview
# time the existing rule applies unchanged: a draft method does not exist as
# far as promises to the user go.
#
# Consequence worth knowing: this couples the topics books to the methods
# book. Rename a method and topic-card QA breaks — re-run both check_topics.py
# after any methods/ rename. That coupling IS the feature.
#
# Check:  python3 cookbooks/<model>/topics/_qa/check_topics.py
# Author: copy cookbooks/_qa/TOPIC_CARD.template.yaml
