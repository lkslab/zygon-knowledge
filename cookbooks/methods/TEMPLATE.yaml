# TEMPLATE for a v2 executable method spec — copy over an existing method
# file when converting it (same filename), fill, delete these comments, then:
#     python3 cookbooks/methods/_qa/check_method_exec.py --only <slug>
# Normative field reference: _qa/METHOD_EXEC.schema.yaml. Hard caps are
# enforced — if you are fighting the cap, the overflow belongs in
# _qa/paper_methods/, not here.
schema_version: 2
id: CHANGE-ME                       # = filename without .yaml
title: CHANGE ME
what: >
  One paragraph (<= 600 chars): what the method does to the model and when
  it is the right tool. Written for the consultant deciding whether to
  reach for it — not a literature review.
when_to_use:
  - "user phrase that should trigger this method"

models:
  - model: pypsa-eur
    version_anchor:
      ref: 849c8858d2536ccf8eed0c2e838d22a474a7ee5d
      date: "2026-07-31"
    status: draft                   # the eval flips this to `verified`
    baseline: null                  # or e.g. config.de1.yaml if the method
                                    # needs temporal resolution to show
    execution:
      - kind: config
        key: some.dot.path          # must exist in config.default.yaml
        value: CHANGE-ME
        note: why this key, in one line
      - kind: code
        where: "scripts/solve_network.py:extra_functionality"
        do: >
          Concrete imperative (<= 300 chars): what to add/change at this
          anchor. The agent will cite a recipe rung for the bundle change;
          this tells it WHAT to build there.
    invalidates:
      - prepare_sector_network
      - solve_sector_network
    budget:
      jobs: 4
      class: minutes
    success_metric:
      - name: constraint-binds
        needs: solved
        check: "n.global_constraints.mu.abs().max() > 0"
        expect: the added constraint exists and carries a shadow price

notes: >
  Optional (<= 800 chars): sharp caveats only — the known trap, the one
  interaction that bites. Literature and derivations: _qa/paper_methods/.
