paper: "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
tier: 1
model_used: >
  No model (theory/methods paper). Analysis is performed on standard test grids
  from MATPOWER (case300, case1354pegase, GBnetwork, case2383wp, etc.) and a
  small 5-bus illustrative example, not on PyPSA.
scope: >
  Derives a dual graph formalism — based on cycle flows rather than nodal voltage
  angles — for computing Line Outage Distribution Factors (LODFs), yielding a
  faster formula for single and multiple outages, and proving monotonic decay of
  outage effects in planar networks.
methods:
  - slug: linearised-optimal-power-flow
    role: defines
    evidence: >
      "In this paper the linear 'DC' approximation of the power flow in AC networks
      is used" (Sec. II). The paper develops the full PTDF/LODF algebra from first
      principles in matrix notation (Eqs. 1–10), deriving the nodal susceptance
      matrix B, the PTDF matrix, and the standard LODF formula as the primal
      baseline against which the dual method is compared.
    procedure_notes: >
      Uses the DC linearisation: F_l = b_l*(theta_m - theta_n); defines PTDF =
      B_d K^t B* (Eq. 8) and LODF_kl = [PTDF·K]_kl / (1 - [PTDF·K]_ll) (Eq.
      10). Benchmarks primal PTDF inversion against the dual method across ten
      standard MATPOWER/PEGASE test grids ranging from 300 to 9241 nodes (Table I).
    variant: ptdf-lodf-primal
    parameters: {test_grids: "300–9241 nodes", speedup_ratio: "1.31–4.43x"}

  - slug: n-1-security-and-contingency
    role: defines
    evidence: >
      "The grid is usually operated with 'n−1 security', which means that it should
      withstand the failure of any single component" (Sec. I). The entire paper is
      motivated by and targeted at n-1 contingency analysis; the dual LODF formula
      (Proposition 1, Eq. 29) is the core contribution for fast contingency
      screening. Extension to multiple simultaneous outages is developed in Sec.
      V-B (Eqs. 33–37).
    procedure_notes: >
      Single-outage LODFs derived via the dual Woodbury identity (Eq. 28–29):
      LODF_k,l = -(u_k^t M u_l)/(u_l^t M u_l) with M = CA^{-1}C^t. Multiple
      simultaneous outages handled by generalising the same Woodbury trick to
      matrix U (Eq. 35, 37). Also notes applicability to FACTS devices (arbitrary
      reactance changes, not just full outages). Proof of Proposition 2: LODFs
      vanish between edges connected by only one independent path.
    variant: dual-cycle-flow-lodf
    parameters: {outage_types: "single and multiple simultaneous", reactance_change: "arbitrary xi_l including xi->inf"}

  - slug: cascading-failure-analysis
    role: canonical-use
    evidence: >
      "These results help to understand the effects of a transmission line outage
      and cascading failures in power grids, in particular whether the effects are
      predominantly local or affect also remote areas of the grid" (Sec. VI intro).
      Section VI proves that outage effects decay monotonically with dual-graph
      distance in planar networks (Propositions 3 and 4) and that non-planar grids
      admit non-local, topologically-driven spreading (Corollary 1).
    procedure_notes: >
      Uses a cycle-flow Poisson equation framework (Lemma 1, Eq. 39: A*Delta_f =
      q) to characterise outage propagation. For planar graphs: proves the induced
      cycle flows split into two sign-coherent connected domains D+ and D-
      (Proposition 3) and that max/min cycle flows decrease monotonically with
      dual-graph distance (Proposition 4). For non-planar graphs: decomposes
      cycles into geometric (local, Poisson-like) and topological (non-local)
      components (Proposition 5, Corollary 1). Illustrated on MATPOWER 30-bus
      test case (Fig. 2).
    variant: cycle-flow-propagation-analysis
    parameters: {network_types: "planar and non-planar", test_case: "MATPOWER 30-bus"}

