paper: "2018_Hofmann_Principal-flow-patterns_EPL.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model (PyPSA v0.12.0), electricity-only, European system,
  up to 1024 nodes (k-means reduced from 4653), hourly resolution 2011-2014.
scope: >
  Applies PCA to nodal power injection and transmission line flow patterns in a
  highly renewable European electricity network to show that despite many injection
  components, only ~8 principal flow patterns explain 95% of total flow variance,
  and provides a theoretical explanation via the topological matrix T = H^T H.
methods:
  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "The power flow is calculated using the unconstrained linear power flow
      approximation [17], which maps the injection pattern vector p(t) linearly
      to the flow vector f(t), f(t) = H p(t). Here H = Ω K^T B+ is the power
      transmission distribution factor (PTDF) matrix." (Sec. II Modeling, Eq. 4)
    procedure_notes: >
      Unconstrained linearised DC power flow (PTDF formulation). All AC and DC
      lines converted to 380 kV AC equivalent. No transmission capacity constraints
      applied — the paper notes this as a simplification and suggests constrained
      dispatch would increase the number of relevant flow components. No
      optimisation is performed; it is a pure simulation/analysis study.
    variant: ptdf-unconstrained
    parameters: {voltage_base: "380 kV AC", lines: ">=220 kV AC + HVDC"}

  - slug: spatial-clustering-and-resolution
    role: canonical-use
    evidence: >
      "Using a k-means clustering methodology, the network with 4653 nodes is
      gradually reduced to the sizes N ∈ {1024, 724, 502, 362, 256, 181, 128, 90,
      64, 45, 37}." (Sec. II Modeling). The paper's central finding — saturation of
      injection PCs at N=512 — is directly about how spatial resolution affects PCA
      results.
    procedure_notes: >
      k-means clustering from the full 4653-node ENTSO-E GridKit network down to 11
      coarser resolutions. The study investigates how the number of relevant PCs
      (K for 95% variance) changes with N. Injection PCs scale roughly as log(N)
      up to N≈512 (inter-node distance ~138 km), then saturate. Flow PCs remain
      ~8 across all resolutions. Load distributed using NUTS3 GDP and population.
    variant: k-means-multi-resolution
    parameters: {node_counts: "37,45,64,90,128,181,256,362,502,724,1024", original_nodes: 4653}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      Weather data and electricity demand are used at hourly resolution for 2011-2014
      (Sec. II Modeling). No temporal aggregation is applied — the paper uses the
      full hourly time series as input to PCA.
    procedure_notes: >
      Full hourly time series 2011-2014 from the Aarhus Renewable Energy Atlas
      (40×40 km spatial resolution) for wind/solar and from ENTSO-E for demand.
      No temporal aggregation or typical-period selection is performed; the 8760×4
      hourly snapshots are used as-is for the covariance matrix computation.
    variant: null
    parameters: {temporal_resolution: "1h", years: "2011-2014"}

unmatched_methods:
  - name: "principal-component-analysis-of-power-flows"
    evidence: >
      The core methodological contribution of the paper is applying PCA
      (covariance-matrix eigen-decomposition) to both nodal injection patterns
      p(t) and transmission line flow patterns f(t) in a power system context,
      and deriving an analytical relationship between injection PCs and flow PCs
      via a 'topological matrix' T = H^T H and matrix M = Σ_p T (Sec. III–V,
      Eqs. 5–13). This is a power-system-specific PCA analysis method, not
      covered by any existing slug which all focus on optimisation methods.
      The paper defines the procedure (Sec. III, Eqs. 5-9), derives theoretical
      bounds using majorisation (Eqs. 10-11), and introduces the overlap matrix
      O_km (Eq. 12) to explain why flow variance concentrates on ~8 components.
