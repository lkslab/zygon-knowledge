paper: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
tier: 1
model_used: >
  PyPSA-Eur dataset with bespoke PyPSA model, 64 nodes (k-means clustered from
  4653 substations), 132 lines, 33 countries, electricity-only, 3h resolution, 2012 weather year.
scope: >
  Applies a generalised flow tracing method extended to storage charging/discharging
  to analyse which generation technologies supply each storage type, and how locally
  vs. globally storage output is consumed, in a 95% CO2-reduced European electricity scenario.
methods:
  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The 5612 transmission lines and 4653 substations within the dataset are merged
      using the k-means clustering algorithm to 64 nodes and 132 transmission lines
      covering 33 countries" (Sec. II Power System Modelling).
    procedure_notes: >
      64-node resolution chosen to work at a "coarse-grained level while still being
      able to capture patterns on regional scale within larger countries." Generation
      capacities and time series also aggregated to nodal representations. Paper cites
      [12] (Hörsch & Brown 2017) for further discussion of network aggregation methods
      and spatial scale effects.
    variant: k-means-64-nodes
    parameters: {nodes: 64, lines: 132, countries: 33}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "For the HVAC part of the network also Kirchhoff's Voltage Law is enforced by
      demanding that the voltage differences around any closed cycle must sum to zero"
      (Sec. II, Eq. 2 and surrounding text). Kirchhoff's Current Law enforced via
      incidence matrix Kn,l.
    procedure_notes: >
      Both KCL (Eq. 2) and KVL (cycle flow formulation, citing [15] Hörsch et al. 2018)
      are enforced. Line flows constrained by transmission capacities |fl(t)| ≤ Fl.
      DC/linearised formulation — no AC power flow.
    variant: cycle-flow-kvl
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "The sum of the product of transmission capacities and transmission line lengths
      are constrained by an overall maximum capacity … which is fixed to a moderate
      expansion corresponding to 150% of the current transmission capacities" (Sec. II,
      Eqs. 5–6).
    procedure_notes: >
      Transmission line capacities Fl are co-optimised with generation and storage
      capacities in the cost-minimising objective (Eq. 1). A global volume cap at 1.5x
      today's total capacity-length product is the binding constraint. No iterative
      impedance update mentioned.
    variant: volume-cap-150pct
    parameters: {transmission_cap_factor: 1.5}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "CO2 emissions are limited by a global constraint CAPCO2 … This constraint is set
      to a reduction of emissions of 95% compared to 1990 levels." (Sec. II, Eq. 7).
    procedure_notes: >
      Global annual CO2 cap applied via Eq. 7 summing specific emissions eα times
      dispatch over all generators, hours and nodes. Only fossil fuel is open-cycle
      gas turbines, so constraint directly limits gas dispatch.
    variant: global-annual-cap
    parameters: {co2_reduction_vs_1990: "95%"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "The storage energy capacity En is defined by the nominal power Gn through
      En = hmax * Gn. Here hmax is the maximum number of hours that a storage facility
      can charge or discharge at the full nominal power. We set hmax = 6h for battery
      storage and pumped hydro, and hmax = 168h for hydrogen storage." (Sec. II, Eq. 4).
    procedure_notes: >
      Energy capacity is not separately optimised — it is fixed as a multiple of power
      capacity. Battery and pumped hydro: 6 h duration; hydrogen: 168 h (one week).
      Pumped hydro capacities fixed to today's level; battery and hydrogen are
      extendable. State-of-charge modelled with charging/discharging efficiencies η1,
      η2 (Eq. 3); cyclic boundary condition implied by optimisation over a representative year.
    variant: fixed-duration-ratio
    parameters: {battery_hmax: "6h", pumped_hydro_hmax: "6h", hydrogen_hmax: "168h"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      The model minimises total annual system costs in a single optimisation (Eq. 1)
      for a 2050 target scenario, run with 2012 weather and demand data. No
      pathway or multi-period structure is described. (Sec. II).
    procedure_notes: >
      Overnight / greenfield investment for a single target year (implicitly 2050 or
      a stylised low-carbon scenario). Weather year 2012, every third hour (wt = 3).
    variant: overnight
    parameters: {weather_year: 2012, timestep_hours: 3}

unmatched_methods:
  - name: "flow-tracing for storage attribution"
    evidence: >
      The paper's central methodological contribution is extending generalised flow
      tracing (proportional sharing / perfect mixing assumption) to include storage
      charging and discharging flows, allowing attribution of storage inflow and outflow
      to originating generation technologies and consuming nodes (Sec. III, Eqs. 8–16).
      This is a post-processing analysis method applied to the solved network, distinct
      from the optimisation itself. No existing slug covers flow tracing as an analysis
      technique (the vocab covers grid formulations and market price duals, not power-flow
      attribution post-processing). The method derives nodal mixes qn,m and tracks
      internal mixes rn,α through the network to quantify local vs. non-local storage usage.
