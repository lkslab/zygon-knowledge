paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec-30 (bespoke PyPSA sector-coupled model), 30 nodes
  (one per European country), electricity + urban heat + rural heat buses,
  hourly resolution, single year (2015), greenfield investment optimisation.
scope: >
  Investigates the combined effect of VRES penetration targets and CO2 price
  levels on the cost-optimal design of a coupled electricity-and-heating system
  for Europe, asking whether renewable targets alone are sufficient for deep
  decarbonisation or whether a CO2 tax is also required.
methods:
  - slug: carbon-constraints-and-pricing
    role: canonical-use
    evidence: >
      "No CO2 constraint is imposed but the impact of variable CO2 prices,
      ranging from 0 to 500 €/tCO2 is investigated." (Sec. 2.2). The CO2
      price enters as a variable cost on_s,t in the objective function (Eq. 1,
      Sec. 2.1) applied to gas-fired generators (OCGT, CHP, gas boilers).
      Identified cost-optimal CO2 price to achieve 5% emissions target is
      380 €/tCO2 (Sec. 4.2, Fig. 6).
    procedure_notes: >
      CO2 price is swept exogenously from 0 to 500 €/tCO2; for each price
      and VRES penetration level the model is re-optimised. No annual cap
      constraint is used — instead the price instrument is varied. The dual
      of a CO2 cap from prior work (Brown et al. [2], 407 €/tCO2) motivated
      the range. Three target CO2 reduction levels (5%, 10%, 20% relative
      to 1990) are used to identify cost-optimal price-penetration pairs.
    variant: price-sweep-no-cap
    parameters: {price_range: "0–500 €/tCO2", emission_factor_gas: "0.19 tCO2/MWhth", target_levels: "5%, 10%, 20% of 1990 emissions"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: canonical-use
    evidence: >
      "The analysis of the cost-optimal system configuration obtained in [2]
      is extended here by performing extensive sweeps through parameters such
      as the renewable penetration, the wind/solar mix, and the CO2 price."
      (Sec. 1). Figure 3 shows LCOE as a 2-D heatmap over γ^gross and
      α^gross_EU for four CO2 price levels.
    procedure_notes: >
      Three-dimensional parameter sweep: gross VRES penetration γ^gross
      (0.1–1.0), gross wind/solar mix α^gross_EU (0.1–0.9), and CO2 price
      (0–500 €/tCO2). Each combination is a separate optimisation run.
      A "weakly homogeneous" VRES layout constraint (Eqs. 9–12) is applied
      so that each country's penetration share equals the system-wide γ^gross
      while the per-country wind/solar mix is optimised. Results are
      post-processed to identify iso-emission contours and cost-optimal
      CO2 price for each emission target.
    variant: structured-grid-sweep
    parameters: {vres_penetration_range: "0.1–1.0", wind_solar_mix_range: "0.1–0.9", co2_price_levels: "0, 100, 200, 240, 260, 280, 300, 320, 360, 380, 420, 480, 500 €/tCO2"}

  - slug: sector-coupled-network-assembly
    role: canonical-use
    evidence: >
      "The model covers both electricity and heating sectors, with converters
      coupling them in order to utilise the flexibility in both sectors."
      (Sec. 2). Each of 30 country nodes has one electricity bus and two
      heat buses (urban and rural); conversion links include heat pumps
      (ground- and air-sourced), resistive heaters, and CHP units (Fig. 2,
      Sec. 2).
    procedure_notes: >
      Uses PyPSA-Eur-Sec-30 model from Brown et al. [2]. Electricity bus
      carries VRES, hydro, OCGT, CHP (electric output), batteries, hydrogen
      storage. Urban heat bus carries centralised ground-source heat pumps,
      CHP heat, gas boilers, long-term hot water tanks (τ=180 days). Rural
      heat bus carries individual ground-source heat pumps, air-source heat
      pumps, gas boilers, short-term water tanks (τ=3 days). CO2 emissions
      attributed only to gas-consuming generators. Transport sector excluded.
      Hydro capacities fixed exogenously. HVDC cross-border links with
      co-optimised capacities.
    variant: electricity-heat-two-bus
    parameters: {nodes: 30, heat_buses_per_node: 2, carriers: "electricity, urban heat, rural heat", hydro_capacity: "fixed at 2011 values (170 GW, 204 GWh)"}

  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      "High Voltage Direct Current (HVDC) is assumed for the transmission
      lines, whose capacities can be expanded by the model if it is
      cost-effective." (Sec. 2). The global transmission volume cap CAPLV
      is defined in Eq. 6; its KKT multiplier μ_LV is the shadow price
      of added transmission volume.
    procedure_notes: >
      Transmission co-optimised under a global volume cap constraint
      (sum of F_l * l_l ≤ CAPLV, Eq. 6). Two scenarios: optimal volume
      (free expansion) and today's volume (NTCs, ~31.6 TWkm plus under-
      construction). Shadow price μ_LV reported. Optimal transmission volume
      for 5% target: 196 TWkm (~6× today's NTC). Fixed cost: 400 k€/MWkm
      (Table 1).
    variant: volume-cap-hvdc
    parameters: {cost_per_MWkm: "400 k€", todays_volume: "31.6 TWkm", optimal_volume_5pct_target: "196 TWkm"}

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "The Lagrange/Karush-Kuhn-Tucker (KKT) multiplier λ_n,t associated
      with the demand constraint represents the local marginal price of the
      energy carrier." (Sec. 2.2, Eq. 2). The KKT multiplier μ_LV of the
      transmission volume constraint "indicates the shadow price of an
      increase in transmission volume" (Eq. 6). Shadow price from prior
      work (407 €/tCO2) referenced to motivate the CO2 price range.
    procedure_notes: >
      Duals derived from the LP solution. λ_n,t used as nodal marginal
      price per carrier. μ_LV used as the value of transmission expansion.
      No post-processing correction for snapshot weighting (single-year
      hourly run with unit weights). Results cited qualitatively rather
      than as a primary analysis; shadow price analysis is secondary to
      the parameter-sweep results.
    variant: lp-duals
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "minimises the total system costs expressed as a linear function (Eq. 1)
      subject to technical and physical constraints, assuming perfect
      competition and foresight." (Sec. 2). Model runs a single target-year
      greenfield optimisation over 2015 weather data.
    procedure_notes: >
      Overnight/greenfield single-year optimisation: all capacities decided
      simultaneously for a single representative year (2015). No transition
      pathway or myopic sequencing. Existing hydro fixed at 2011 values but
      all other capacities optimised from zero. Future extensions to
      transition pathways noted as open (Sec. 6).
    variant: overnight-greenfield
    parameters: {weather_year: 2015, planning_horizon: "single target year"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "They are mostly based on predictions for 2030 assuming a discount
      rate of 7%." (Sec. 3.6, Table 1 footnote: "LCOE is calculated
      assuming a discount rate of 0.07").
    procedure_notes: >
      Single uniform discount rate of 7% applied to all technologies for
      annualising overnight capital costs. Technology lifetimes range from
      15 years (battery) to 40 years (HVDC, hot water tanks). No country-
      specific or technology-specific cost of capital differentiation.
    variant: uniform-discount-rate
    parameters: {discount_rate: "7%", cost_year: "2030 projections"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Protected sites listed in Natura 2000 [34], as well as areas with
      certain land use types, e.g., cities, as specified by [35], are
      excluded. For offshore wind, the maximum water depth assumed is 50 m.
      On top of these, we assumed that only 20% of the resulting available
      area can be used for wind and 1% for PV." (Sec. 3.3). Installable
      potential Ḡ_n,s bounds capacity (Eq. 4).
    procedure_notes: >
      Land eligibility derived from Natura 2000 protected areas and Corine
      land cover (excluding cities and certain land types). Offshore wind
      limited to ≤50 m water depth. Area utilisation factors: 20% for wind
      (2 MW/km²), 1% for PV (1.5 MW/km²). 50% rooftop / 50% utility-scale
      split for PV with different costs. Capacity factors from REatlas
      (CFSR reanalysis) aggregated to national level.
    variant: natura2000-corine-exclusion
    parameters: {wind_area_factor: "20%", pv_area_factor: "1%", wind_density: "2 MW/km²", pv_density: "1.5 MW/km²", offshore_depth_limit: "50 m"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "the energy and charging capacities of batteries and H2 storage are
      independently optimised. In the heat buses, thermal energy storages,
      i.e., water tanks, can be built." (Sec. 3.5). Storage energy capacity
      E_n,s and power capacity G_n,s co-optimised independently (Eqs. 7, 1).
    procedure_notes: >
      Three storage types with independently sized power and energy: battery
      (15-year lifetime, 144.6 k€/kWh), hydrogen storage (20-year, 8.4 k€/kWh),
      hot water tanks (20/40-year lifetime, 860/30 k€/m³ for decentral/
      central; time constants τ=3/180 days for individual/district systems).
      Pumped hydro fixed at 170 GW / 204 GWh. Standing loss η0, charging
      efficiency η1, discharging efficiency η2 represented in state-of-charge
      constraint (Eq. 7).
    variant: independent-power-energy-sizing
    parameters: {battery_cost: "144.6 k€/kWh", h2_cost: "8.4 k€/kWh", hot_water_tank_cost: "860/30 k€/m³", tau_individual: "3 days", tau_district: "180 days"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "Due to computational limits, each of the 30 European countries
      covered by the model is aggregated into one node." (Sec. 2). Discussed
      as a limitation: "a coarse-grained network is implemented due to
      computational limits, where every country is aggregated into a single
      node. This neglects possible problems such as national transmission
      network bottlenecks and local differences in weather conditions."
      (Sec. 5.2).
    procedure_notes: >
      Administrative aggregation to 30 country-level nodes (EU-28 minus
      Malta and Cyprus, plus Norway, Switzerland, Serbia, Bosnia-Herzegovina).
      No k-means or hierarchical spatial clustering — simple country-level
      aggregation. Weather and demand data aggregated to national level.
      Impact of spatial resolution discussed with reference to Hörsch & Brown
      [40] who found little impact on total cost but significant impact on
      wind/solar mix.
    variant: country-level-aggregation
    parameters: {nodes: 30, aggregation_method: "administrative (country-level)"}

unmatched_methods: []
