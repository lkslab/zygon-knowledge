paper: "2019_Gotzens_powerplantmatching-power-plant-databases_ESR.pdf"
tier: 2
model_used: >
  no model (tooling paper) — PPM (powerplantmatching) Python toolset applied
  to assemble and compare conventional power plant fleets for EU28 + Switzerland
  + Norway; no PyPSA simulation is run in this paper.
scope: >
  Introduces the powerplantmatching (PPM) open-source toolset for cleaning,
  standardising and combining multiple power plant databases, then benchmarks
  datasets derived from open sources alone vs. open + proprietary WEPP to assess
  data quality for European conventional power plant fleets.
methods:
  - slug: powerplant-matching-and-fleet-assembly
    role: defines
    evidence: >
      "we introduce powerplantmatching (PPM) [15], a tool for merging power plant
      databases into a final dataset" (Abstract, Sec. 1). The four-step pipeline —
      standardisation, vertical aggregation, cross-database linkage, and claim
      reduction — is described in detail in Sec. 2.2 and its Fig. 2 flow chart.
    procedure_notes: >
      Step 1: data module translates each source database to a canonical tidy-data
      schema (Name, Fueltype, Technology, Set, Country, Capacity, YearCommissioned,
      lat, lon). Step 2: units are aggregated into power plants using a naive
      Bayesian similarity score (Duke java app, 98.5% threshold) on name, fuel type
      and location. Step 3: cross-database linkage using the same Duke comparator
      with different weights; chains are formed iteratively. Step 4: conflicting
      claims resolved by a reliability-score table (OPSD=5 highest, CARMA=1
      lowest); ties broken by modal name/fuel + median capacity + mean coordinates.
      A record only enters the final dataset if confirmed by at least two databases.
      Six open databases (CARMA, ENTSOE, ESE, GEO, OPSD, WRI) plus optionally the
      proprietary WEPP were used; wind/solar excluded. Benchmarked against ENTSO-E
      SO&AF national capacity statistics for 2016. Plausibility check against
      Germany BNetzA/UBA manual links: 153/181 correct, 0 wrong (Sec. 2.5).
    variant: multi-database-bayesian-linkage
    parameters:
      similarity_threshold: "98.5% (Duke, unit aggregation step)"
      databases_open: 6
      databases_proprietary: 1
      geographic_scope: "EU28 + Switzerland + Norway - Cyprus - Malta"
      base_year: 2016
      matched_records_with_WEPP: 14348
      matched_records_without_WEPP: 6014

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      The paper analyses commissioning years (YearCommissioned) as a key fleet
      attribute and quantifies how many records lack this field in each dataset
      configuration: "for the matched w/o WEPP dataset 47.36% of the entries and
      55.82% in terms of capacity have no data for the commissioning year" (Sec.
      3.2). The paper argues that this data gap is critical for capacity expansion
      models that require installation years (Sec. 3.2 and Conclusions).
    procedure_notes: >
      The paper does not itself run a brownfield model; it assesses the input data
      quality needed for one. It shows that only ESE, OPSD and WEPP carry
      YearCommissioned, so any matched record not confirmed by one of those three
      lacks a vintage. Table 4 gives per-country ratios of records with/without
      commissioning years for both matched datasets. The conclusion is that WEPP is
      "strongly needed" if commissioning years are required.
    variant: data-quality-assessment
    parameters:
      pct_records_missing_year_without_WEPP: "47.36% of entries, 55.82% of capacity"
      pct_records_missing_year_with_WEPP: "10.68% of entries, 6.33% of capacity"

unmatched_methods:
  - name: "gross-to-net capacity rescaling"
    evidence: >
      Sec. 2.3 describes a systematic methodology for converting gross capacities
      (WEPP, CARMA) to net capacities using fuel- and technology-specific mean
      correction factors derived from the German OPSD dataset (BNetzA gross vs UBA
      net). Boxplots of net/gross ratios by fuel-type are shown in Fig. 3. This is
      a data-preprocessing method specific to fleet assembly and does not map to any
      existing slug — it is neither spatial clustering, temporal aggregation, nor
      the powerplant-matching slug (which covers the matching algorithm itself, not
      capacity unit harmonisation).
