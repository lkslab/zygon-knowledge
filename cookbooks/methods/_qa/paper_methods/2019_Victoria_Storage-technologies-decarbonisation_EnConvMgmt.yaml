paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec-30: a bespoke PyPSA sector-coupled model, 30 nodes
  (one per country), electricity-only + heating + transport variants,
  hourly resolution for a full year, 2015 weather data.
scope: >
  Investigates cost-effective storage capacities (batteries, hydrogen,
  thermal, PHS, EV batteries) as CO2 emissions caps tighten from 60% to
  5% of 1990 levels, across four sector-coupling scenarios for Europe.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "The role of storage technologies in the European energy system is
      investigated by using the PyPSA-Eur-Sec-30 model... Every country
      comprises three buses representing the electricity, heating, and
      transport sectors" (Sec. 3.1, Appendix A). The paper runs four
      scenarios progressively activating electricity, heating, and
      transport sectors with carrier buses, conversion links (heat pumps,
      electrolysers, fuel cells, resistive heaters, gas boilers, CHP),
      and a shared CO2 accounting constraint.
    procedure_notes: >
      Each country node has three buses (electricity, heating, transport).
      Converters (heat pumps, electrolysers, fuel cells) connect buses.
      Urban/rural heating split determines district-heating eligibility.
      EV batteries modelled in aggregate per country with availability
      inversely proportional to transport demand. Conversion efficiencies
      specified for each link. CO2 constraint (Eq. A.9) is applied across
      all active sectors jointly.
    variant: null
    parameters:
      nodes: 30
      resolution: "1h"
      weather_year: 2015
      sectors: "electricity | electricity+heating | electricity+transport | electricity+heating+transport"

  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      "Power and energy capacities are independently optimised" for
      batteries, hydrogen, and thermal stores (Table 1, Sec. 3.1,
      Appendix A Eq. A.6). The paper's central contribution is tracking
      optimal energy and power capacities across CO2 caps, and comparing
      short-duration (batteries, ~6 h) versus long-duration (hydrogen,
      ~2 days) storage roles.
    procedure_notes: >
      Battery energy and power capacities co-optimised; result: 5.6 h
      discharge time at 5% CO2 cap. Hydrogen electrolysis, tank, and
      fuel-cell capacities each independently optimised; result: ~2-day
      discharge time. PHS and EV batteries are exogenous (fixed capacity).
      LCOS preliminary analysis (Eq. 1) compared technologies across
      discharge times and cycle counts before full system optimisation.
      Storage state-of-charge constraint (Eq. A.6) enforces cyclic
      consistency. BEV state of charge forced >75% at 5 am daily.
    variant: independent-power-energy
    parameters:
      battery_discharge_time_result: "5.6 h"
      hydrogen_discharge_time_result: "~2 days"
      battery_energy_capacity_5pct: "1.4 av.h.l.el (455 GWh)"
      hydrogen_energy_capacity_5pct: "19.4 av.h.l.el (6.3 TWh)"
      CTES_capacity_5pct: "~23 days of average heat demand"
      PHS: "exogenous, 285 GWh / 47.5 GW fixed"

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The optimal system configuration is investigated for different CO2
      emissions caps, imposed by constraint (A.9)" (Sec. 3.1). The CO2
      shadow price µCO2 (Lagrange/KKT multiplier) is computed and
      reported as a function of the cap (Fig. 6, Sec. 4.1).
    procedure_notes: >
      Annual CO2 cap (Eq. A.9) sweeps from 60% down to 5% of 1990
      sector emissions in steps. Shadow price µCO2 reported per scenario.
      Heating sector requires much higher CO2 price than electricity
      sector to trigger fuel-switching. Cap is applied jointly across
      all active sectors.
    variant: emissions-cap
    parameters:
      cap_range: "5%–60% of 1990 sector emissions"
      baseline_emissions: "1510 MtCO2 electricity, 784 transport, 723 heating (1990)"

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "High Voltage Direct Current (HVDC) is assumed for the transmission
      lines, whose capacities can be expanded by the model if it is cost
      effective" (Sec. 3.1). A global volume cap CAPLV (Eq. A.7) bounds
      total expansion; its effect is varied in the sensitivity analysis
      (Sec. 4.4, Fig. 12b).
    procedure_notes: >
      Transmission expansion co-optimised with generation and storage.
      Base case: cap at 62 TWkm (twice today's capacity). Sensitivity
      runs vary cap from zero to unconstrained (cost-optimal = 159 TWkm,
      ~5× current). A 33% safety margin on line capacity and 25% length
      penalty for non-straight routing are applied. Shadow price µLV
      of the volume constraint is tracked.
    variant: null
    parameters:
      base_cap: "62 TWkm (2× current)"
      cost_optimal_cap: "159 TWkm (~5× current)"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "A greenfield optimisation is performed" (Sec. 4.6 Limitations).
      The model "assumes perfect competition and foresight" and "long-term
      market equilibrium" (Sec. 3.1). A single target year is optimised
      with costs annualised at 7% discount rate.
    procedure_notes: >
      Overnight / greenfield single-year optimisation for each scenario
      and CO2 cap combination. No existing capacity vintages (PHS and
      reservoir hydro are the only brownfield assets, treated as fully
      amortised). Costs annualised at 7% discount rate (Appendix B,
      Table 2).
    variant: overnight
    parameters:
      discount_rate: 0.07
      target_year: "2030 cost assumptions, 2015 weather"

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The Lagrange multiplier λn,t, also known as Karun-Kush-Tucker
      (KKT), associated with the demand constraint indicates the marginal
      price of the energy carrier in the bus n, e.g., local marginal
      electricity price" (Appendix A). Shadow prices for CO2 (µCO2) and
      transmission volume (µLV) are extracted and analysed (Sec. 4.1,
      Fig. 6; Eq. A.7, A.9). PHS annual market revenues are calculated
      from nodal prices and dispatch (Eq. 2, Sec. 4.3).
    procedure_notes: >
      Nodal electricity prices λn,t read as KKT duals of demand balance
      constraint. CO2 shadow price µCO2 plotted vs CO2 cap for all
      scenarios (Fig. 6). PHS revenues calculated as sum over countries
      and hours of dispatch × nodal price (Eq. 2). Long-term market
      equilibrium condition ensures cost recovery for optimised assets.
    variant: null
    parameters: {}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "In this section the sensitivity of the cost-effective storage
      energy capacities in the scenario Electricity+Heating is analysed
      by independently modifying some of the key assumptions of the
      model" (Sec. 4.4). Parameters swept: transmission cap, battery
      cost, hydrogen cost, solar PV cost, wind cost (Fig. 12).
    procedure_notes: >
      One-at-a-time sensitivity: each parameter is varied from ~25% to
      200% of reference value while others held fixed at 5% CO2 cap.
      Reference scenario: transmission capped at 62 TWkm, 5% CO2 limit
      for electricity+heating. Results reported as optimal storage energy
      capacities vs parameter value (Fig. 12c–f). Not a Latin hypercube
      or Monte Carlo — single-parameter sweeps only.
    variant: one-at-a-time
    parameters:
      swept_params: "transmission cap, battery cost, hydrogen cost, solar PV cost, wind cost"
      scenario: "Electricity+Heating, 5% CO2 cap"

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "To calculate the maximum capacities that can be installed in every
      raster cell the protected sites listed in Natura 2000 [57] and
      non-adequate land types, e.g. cities as specified by [58], are
      excluded. For the remaining areas, a maximum 20% and 1% coverage
      ratio is used for wind and solar PV respectively" (Appendix B).
    procedure_notes: >
      Land eligibility applied at CFSR raster-cell level. Exclusions:
      Natura 2000 protected areas, non-eligible land cover (CORINE).
      Maximum density 2 MW/km2 onshore wind (20% coverage), 1.5 MW/km2
      solar PV (1% coverage). Offshore wind limited to 50 m water depth.
      Capacity factors from CFSR reanalysis via REatlas; solar PV
      bias-corrected against satellite data.
    variant: null
    parameters:
      wind_coverage_ratio: "20%"
      pv_coverage_ratio: "1%"
      offshore_depth_limit: "50 m"

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "Linear optimal power flow is applied using Kirchhoff's formulation
      [50]" (Appendix A). Reference [50] is Hörsch et al. on cycle-flow
      LOPF.
    procedure_notes: >
      HVDC lines modelled with linearised power flow (Kirchhoff cycle
      formulation). A 33% safety margin is applied to installed capacity
      to satisfy n-1 requirements (citing Brown et al. [49]). Cross-border
      distances set by geographical mid-points plus 25% non-straight
      routing penalty.
    variant: cycle-flow
    parameters:
      safety_margin: "33% of installed capacity (for n-1)"

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The overnight costs are annualised assuming a discount rate of
      0.07" (Table 2 footnote, Appendix B Costs section). "4% and 7%
      discount rates have been assumed respectively" for rooftop vs
      utility-scale solar PV (Table 2 footnote c).
    procedure_notes: >
      Uniform 7% discount rate for all technologies except rooftop PV
      (4%). Capital recovery factor (annuity) applied to overnight
      costs with technology-specific lifetimes (Table 1, Table 2).
      EV battery costs excluded as they are assumed borne by EV owners.
    variant: null
    parameters:
      discount_rate: 0.07
      pv_rooftop_rate: 0.04

unmatched_methods: []
