paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
tier: 1
model_used: >
  A bespoke PyPSA model: a reimplementation of the EMMA market model in PyPSA
  (library only, no PyPSA-Eur). Five nodes covering Germany and four neighbours
  (Poland, France, Netherlands, Belgium), electricity-only, single weather year
  2010, greenfield investment, hourly resolution.
scope: >
  Shows theoretically and by simulation that declining market value of wind and
  solar with penetration is caused by the implicit policy assumption (VRE subsidy /
  quota), not by variability; under a rising CO2 cap or tax, wind and solar market
  values remain at cost-recovery even above 80% penetration.
methods:
  - slug: shadow-prices-and-marginal-values
    role: defines
    evidence: >
      The paper's central contribution is a rigorous KKT-based proof that in a
      long-term equilibrium the market value (MV) equals the dual variable of the
      relevant policy constraint: "MV_s = LCOE_s − µ_s" under a VRE support
      policy (Eq. 2, Sec. 4.3) and "MV_s = LCOE_s + e_s µ_CO2" under a CO2
      policy (Eq. 3, Sec. 4.4). The relative market value (RMV / value factor) is
      derived from duals via Eq. 17–18. Shadow prices are read as the Feed-in
      Premium and as the CO2 price throughout Secs. 4–6.
    procedure_notes: >
      The market value MV_s is defined as revenue averaged per unit of dispatched
      energy (Eq. 15). The FiP µ_s is the dual of the VRE minimum-share
      constraint (Eq. 19); the CO2 price µ_CO2 is the dual of the CO2-cap
      constraint (Eq. 24). Proofs extend to storage (App. B.3), multi-node
      networks (App. B.4), limited potentials (App. B.2), and non-linear cost
      functions (App. B.5). Simulations sweep VRE+solar penetration 0–117% in
      two policy branches (support policy and CO2 cap) with and without
      transmission/storage flexibility.
    variant: kkt-equilibrium-proof
    parameters: {penetration_range: "0–117% wind+solar", nodes: 5, weather_year: 2010, resolution: "8760h"}

  - slug: carbon-constraints-and-pricing
    role: canonical-use
    evidence: >
      The paper contrasts two policy instruments: a minimum VRE generation share
      (constraint Eq. 19) versus a CO2 annual cap (constraint Eq. 24). The CO2
      cap is the main policy scenario and the source of the paper's key finding:
      "If instead the driving policy is a carbon dioxide cap or tax, wind and solar
      shares can rise without cannibalising their own market revenue" (Abstract).
      CO2 prices sweep from 0 to above 220 €/tCO2 (Sec. 6.3, Fig. 4).
    procedure_notes: >
      CO2 cap implemented as a single annual constraint on total emissions
      (Eq. 24). The dual µ_CO2 equals the CO2 tax that produces the same dispatch
      (shown in App. B.6). A range of CO2 budgets is tested from unconstrained
      (~1.2 tCO2/MWhel) down to near-zero, with the CO2 price rising to
      ~220 €/tCO2 at 70% VRE penetration without flexibility and ~165 €/tCO2
      at 100% with flexibility. Sensitivity also covers nuclear-only scenarios
      (App. E.3–E.4).
    variant: annual-cap-with-dual-as-tax
    parameters: {co2_range: "0–220 €/tCO2", emissions_range: "0–1.2 tCO2/MWhel"}

  - slug: price-formation-and-scarcity-rents
    role: defines
    evidence: >
      The paper analyses in detail why prices go to zero (or negative) when VRE
      is price-setting under a support policy, versus why prices rise when fossil
      generators are price-setting under a CO2 policy: "Support policies depress
      market prices when the supported generators are running … whereas CO2
      policies raise market prices when fossil-fuelled generators are running"
      (Sec. 3.4). Price duration curves for a system approaching zero emissions
      are shown in App. E.6 (Fig. E.27), demonstrating that storage and
      transmission arbitrage replace singular price behaviour.
    procedure_notes: >
      Price formation is examined through KKT stationarity conditions (Eq. 8, 25).
      Negative prices arise because VRE bid their marginal cost minus the FiP,
      which can go negative (Sec. 4.3, 7.3). The "missing money" / cost-recovery
      condition is the zero-profit rule (Eq. 1, 12). Scarcity rents for storage
      appear via arbitrage (App. B.3). Price duration curves plotted for CO2
      intensities from 1.2 to 0.0 tCO2/MWhel with transmission and storage.
    variant: merit-order-duals
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      The model is a greenfield long-term equilibrium: "The model completely
      rebuilds the existing generation system ('greenfield investment') except
      for pumped hydro storage" (Sec. 5). All capacity is co-optimised in a
      single target-year run.
    procedure_notes: >
      Overnight / greenfield investment with a single target year (2010 weather).
      No multi-year pathway. Pumped hydro fixed at existing capacities with 8 h
      energy-to-power ratio. Discount rate 7% applied to all capital costs (Sec. 5
      and App. C).
    variant: overnight-greenfield
    parameters: {discount_rate: "7%", weather_year: 2010}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "Following [14] a discount rate of 7% is applied" (Sec. 5). Capital costs
      are expressed as annualised investment and fixed O&M costs c_s (Eq. 4),
      consistent with standard annuity treatment.
    procedure_notes: >
      Single uniform social discount rate of 7% used for all technologies.
      Technology lifetimes taken from Hirth [14]: nuclear 50 years, all others
      25 years (Sec. 5, App. C). Technology cost table given in App. C (Table C.1)
      comparing EMMA and PyPSA assumptions.
    variant: uniform-social-rate
    parameters: {discount_rate: "7%"}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      In flexibility scenarios the model allows "expansion of the transmission
      grid" as one of the flexibility options (Sec. 5, 6.5). Line costs are
      co-optimised with generation capacities in those scenarios and a no-profit
      rule for lines is derived (App. B.4, Eq. B.25–B.31).
    procedure_notes: >
      Base scenarios use fixed NTC values from summer 2010. Flexibility scenarios
      add endogenous HVAC transmission between five nodes; costs derived following
      Schlachtberger et al. [29], assuming mid-point distances + 25% extra length,
      33% capacity buffer for N−1 and reactive power, 40-year lifetime (App. C).
      Multi-node KVL proof in App. B.4 shows the no-profit rule still holds with
      a KVL distortion term.
    variant: optional-hvac-expansion
    parameters: {n_nodes: 5, transmission_lifetime: "40 years", capacity_buffer: "33%"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      Flexibility scenarios include "batteries and underground hydrogen storage
      (based on electrolysis of water and hydrogen turbines)" (Sec. 5, 6.5).
      Storage sizing for energy and power is co-optimised; the no-profit condition
      for storage (cost recovery by arbitrage) is proved in App. B.3.
    procedure_notes: >
      Two storage types: battery (inverter + storage, costs from Budischak et al.
      [25]) and hydrogen (electrolysis + underground storage + turbine; costs from
      Schmidt et al. [74] and Steward et al. [75]). Energy and power capacities
      sized independently. Cyclic state-of-charge constraint assumed (App. B.3).
      Base scenarios include only fixed pumped hydro at 8 h/nominal-power.
    variant: co-optimised-battery-and-h2
    parameters: {battery_inverter: "333 €/kW", battery_storage: "167 €/kWh",
                 h2_electrolysis: "750 €/kWel", h2_storage: "0.5 €/kWh",
                 h2_turbine: "800 €/kWel", pumped_hydro_duration: "8h"}

unmatched_methods:
  - name: "long-term equilibrium market value theory (KKT zero-profit proof)"
    evidence: >
      The paper's primary methodological contribution is a formal KKT-based proof
      that the zero-profit rule (MV = LCOE) holds in a long-term investment
      equilibrium without policy, and that departures from it are exactly
      characterised by the shadow prices of policy constraints (VRE share or CO2
      cap). This is a theoretical economics result, not a computational or
      algorithmic method, so no existing slug captures it. The closest slugs are
      shadow-prices-and-marginal-values (already logged for the dual-reading aspect)
      and price-formation-and-scarcity-rents (logged for the scarcity/cost-recovery
      aspect). The theoretical proof itself (Secs. 4.1–4.4, Appendix A–B) defines
      a methodology for interpreting market values in optimisation models that
      underlies the entire paper.
