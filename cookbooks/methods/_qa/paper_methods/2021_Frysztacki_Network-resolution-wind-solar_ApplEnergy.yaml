paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
tier: 1
model_used: >
  PyPSA-Eur, electricity-only, 37–1024 nodes, 3-hourly temporal resolution,
  single weather year (2013), greenfield overnight investment with fixed 2018
  grid topology as starting point.
scope: >
  Disentangles the competing effects of renewable resource resolution and
  network (transmission) resolution on capacity expansion results for a
  highly-renewable European power system, showing that the two effects are
  of similar magnitude but opposite sign and have very different impacts on
  technology mix.
methods:
  - slug: spatial-clustering-and-resolution
    role: extends
    evidence: >
      "We vary the number of nodes, interpolating between a 37-node model based
      on country and synchronous zone boundaries, and a 1024-node model based on
      the location of electricity substations." (Abstract). The paper introduces
      a novel three-case study design to separate resource resolution from network
      resolution (Sec. 2.2–2.3), derives k-means clustering weighted by load and
      conventional capacity (Sec. 2.5, Eq. 3–4), and quantifies the bias each
      direction introduces.
    procedure_notes: >
      Geographical k-means clustering, weighted by average load and conventional
      capacity at substations (Eq. 4). Country/synchronous-zone boundaries are
      respected: nodes are never merged across these boundaries, giving a minimum
      of 37 clusters. Cluster count n is partitioned between 37 country-zones
      proportionally to total load (Eq. 2), then k-means applied within each
      zone. 10^3 centroid seeds, maxiter=3*10^4, convergence tolerance 1e-6.
      Nine resolutions tested: {37,45,64,90,128,181,256,362,512,724,1024}.
      Three cases: (1) resource and network resolution changed in tandem;
      (2) network fixed at 37 nodes, resource resolution varied 37–1024;
      (3) resource fixed at 1024 sites, network resolution varied 37–1024.
      Capacity factor time series aggregated by weighted average (Eq. 6),
      weighted by maximal yearly yield per node per technology.
    variant: load-and-capacity-weighted-geographic
    parameters:
      node_range: "37–1024"
      n_init: 1000
      maxiter: 30000
      convergence_tolerance: 1.0e-6
      country_zones: 37

  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      "For each simulation we also vary the amount of new transmission that can
      be built... The model is allowed to optimize new transmission reinforcements
      to the grid as it was in 2018, up to a limit on the sum over new capacity
      multiplied by line length measured relative to the grid capacity in 2018."
      (Sec. 2.3). Iterative impedance update used to keep problem linear (Sec. 2.6).
    procedure_notes: >
      Line volume cap CAPtrans defined as fraction x of existing 2018 line volume
      (Eq. 17), x varied over {0, 9, 12, 18, 25, 35, 50}%. Since cap replaces
      cost in objective, line costs set to zero during optimisation and added
      post-hoc (Sec. 2.6). Impedances held fixed and updated iteratively (up to 4
      iterations) to keep the bilinear coupling between x_l and f_l,t linear,
      following Hagspiel et al. 2014 and Neumann & Brown 2019. No new grid
      topologies beyond TYNDP 2018 planned lines.
    variant: volume-capped-iterative-impedance
    parameters:
      transmission_expansion_range: "0–50% of 2018 line volume"
      line_security_buffer: "b_B = 0.7 (30% buffer for N-1 and reactive power)"
      impedance_update_iterations: "up to 4"

  - slug: linearised-optimal-power-flow
    role: canonical-use
    evidence: >
      "In the present paper the linear load flow is used, which has been shown
      to be a good approximation for a well-compensated transmission network
      [65]... To guarantee the physicality of the network flows, in addition to
      KCL, Kirchhoff's Voltage Law (KVL) must be enforced in each connected
      network." (Sec. 2.6). Cycle-flow formulation used: "It was found in [39]
      that expressing the linear load flow equations in this way with cycle
      constraints is computationally more efficient than angle- or PTDF-based
      formulations." (Sec. 2.6, Eq. 14).
    procedure_notes: >
      KCL enforced via nodal power balance (Eq. 13). KVL enforced via cycle
      constraints (Eq. 14): sum of x_l * f_l,t = 0 over each independent cycle.
      All lines mapped to 380 kV electrical equivalents (Eq. 1) before
      clustering. HVDC point-to-point links have no cycle constraints beyond KCL.
      Flow limited to 70% of thermal rating (b_B=0.7) to buffer N-1 and reactive
      power (Eq. 15).
    variant: cycle-flow-formulation
    parameters:
      voltage_base: "380 kV"
      security_buffer: "b_B = 0.7"

  - slug: land-eligibility-and-potentials
    role: canonical-use
    evidence: >
      "The installable renewable capacity G_i,s^max is constrained by land
      eligibility for placing e.g. wind turbines or solar panels in each node and
      for each renewable technology. The land restrictions are derived using the
      Geospatial Land Availability for Energy Systems (GLAES) tool [54] and are
      always finite for renewable carriers." (Sec. 2.6, Eq. 9).
    procedure_notes: >
      GLAES tool used to derive per-node installable capacity ceilings,
      excluding nature reserves, cities, streets and other restricted areas
      (Sec. 2.1). Capacity factor time series derived from ERA5 reanalysis and
      SARAH2 surface radiation datasets. Renewable potentials described in
      Appendix A.2 with maps of time-averaged capacity factors for solar, onshore
      and offshore wind at 1024-node resolution (Voronoi cells around each node).
    variant: glaes-exclusion-zones
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model is run with perfect foresight at a 3-hourly temporal resolution
      over a historical year of load and weather data from 2013, assuming a 95%
      reduction in CO2 emissions compared to 1990." (Sec. 2.3). Investment costs
      based on projections for 2030.
    procedure_notes: >
      Single target year (overnight/greenfield): co-optimisation of generation,
      storage and transmission capacity in one solve. No pathway or myopic
      rolling. 2030 cost projections used as they represent the earliest feasible
      transformation date and result in conservative cost assumptions. Existing
      2018 grid used as baseline; expansion measured relative to it.
    variant: overnight-single-year
    parameters:
      target_year_costs: "2030 projections"
      weather_year: "2013"
      temporal_resolution: "3-hourly (w_t=3)"

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "CO2 emissions are limited by a cap CAP_CO2, implemented using the specific
      emissions e_s in CO2-tonne-per-MWh of the fuel s and the efficiency eta_i,s
      of the generator... In all simulations this cap was set at a reduction of
      95% of the electricity sector emissions from 1990." (Sec. 2.6, Eq. 12).
    procedure_notes: >
      Annual CO2 cap enforced as a single inequality constraint summing weighted
      dispatch times specific emissions over all generators and time steps
      (Eq. 12). Only OCGT with natural gas emits CO2 (0.187 tCO2/MWhth, fuel
      cost 21.6 EUR/MWhth). Shadow price mu_CO2 reported. The 95% reduction
      target is consistent with European 2050 targets.
    variant: annual-sectoral-cap
    parameters:
      co2_reduction: "95% vs 1990 electricity sector emissions"
      emitting_technology: "OCGT natural gas only"

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "The shadow price mu_trans of the transmission expansion constraint in
      equation (16) corresponds to the system cost benefit of an incremental MWkm
      of line volume." (Appendix A.7). Shadow prices for CO2 constraint (mu_CO2)
      also referenced. Further results on shadow prices noted in Sec. 3.7 and
      Appendix.
    procedure_notes: >
      Shadow price of line volume constraint mu_trans compared to annuity of
      underground and overhead transmission lines to find cost-optimal grid
      expansion (Appendix A.7, Figure 14). The shadow price is interpreted as the
      line cost required to achieve the unconstrained solution via Lagrangian
      relaxation. CO2 shadow price mu_CO2 is the dual of Eq. 12.
    variant: dual-of-volume-cap
    parameters: {}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "Investment costs are annualized with a discount rate of 7%." (Sec. 2.6).
      Technology-specific investment costs with lifetimes and O&M costs given in
      Table 3 and GitHub repository.
    procedure_notes: >
      Single uniform discount rate of 7% applied to annualise capital costs.
      Costs for wind from Danish Energy Agency/Energinet.dk (2019), OCGT/PHS/
      hydro from Schröder et al. (2013), solar from Vartiainen et al. (2017),
      storage from Budischak et al. (2013). Lifetimes, efficiencies and O&M on
      GitHub. No country- or technology-specific cost of capital differentiation.
    variant: uniform-discount-rate
    parameters:
      discount_rate: "7%"

unmatched_methods:
  - name: resource-vs-network-resolution-decomposition
    evidence: >
      The paper's central methodological contribution is a three-case study design
      that decouples resource resolution (number of wind/solar sites) from network
      resolution (number of transmission nodes) by independently varying each
      while holding the other fixed (Sec. 2.2–2.3, Table 1). No existing slug
      captures this controlled decomposition experiment as a method per se — it
      is a study design meta-method, not a modelling procedure. The closest slug
      is spatial-clustering-and-resolution but that describes the clustering
      algorithm, not the comparative experiment design.
