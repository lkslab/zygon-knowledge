paper: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
tier: 2
model_used: >
  PyPSA-Eur, stylised German power sector, 16 nodes, electricity-only, hourly,
  100% GHG reduction scenario (greenfield).
scope: >
  Identifies unintended storage cycling (USC) as a model artefact in LP energy
  models without binding renewable targets, mathematically formalises its
  occurrence, and shows that deliberate variable cost additives can remove it
  while keeping the problem linear and convex.
methods:
  - slug: storage-sizing-and-duration
    role: critiques
    evidence: >
      The paper defines USC as simultaneous charging and discharging of the same
      storage capacity, causing FLH distortions of up to 23% for energy storage
      and 5% for renewables (Abstract, Sec. 1). It critiques unconstrained,
      independent energy-to-power sizing (Table 1 footnote c: "Unconstrained
      energy storage sizing and not fixed to a specific energy to power ratio")
      as a configuration that amplifies USC.
    procedure_notes: >
      H2 storage system modelled with electrolyser, tank and fuel cell as
      separate components with independent capacity variables. Cyclic state of
      charge enforced (ei,s,0 = ei,s,T). USC identification: count of
      simultaneous charging and discharging timesteps with energy volume > 1 MWh.
      120 scenarios (10 variable cost levels × 4 component types × 3 solver
      accuracy settings). FLH of H2 fuel cell used as the primary distortion
      metric.
    variant: independent-power-energy-sizing
    parameters: {nodes: 16, weather_year: 2013, storage_technologies: "H2 electrolyser + tank + fuel cell", scenarios: 120}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      Sec. 2.1 lists "linearised power flow constraints modelling the physicality
      of power transmission (Kirchhoff's Voltage and Current Law)" as one of the
      model constraints. The paper uses PyPSA-Eur's default LOPF formulation.
    procedure_notes: >
      Standard PyPSA-Eur DC power flow with Kirchhoff constraints. Transmission
      network based on current topology plus planned lines from ENTSO-E TYNDP
      2018. Transmission losses not explicitly discussed; default PyPSA-Eur
      settings assumed.
    variant: null
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      Sec. 2.4: "Grid expansion is endogenous but limited to additional 25%
      newly built lines for modelled target year to represent political hurdles
      of transmission expansion."
    procedure_notes: >
      Line volume cap of +25% on existing network; uses TYNDP 2018 planned lines
      as the baseline. Co-optimised with generation and storage investment.
      Offshore wind connected via HVAC or HVDC depending on distance.
    variant: volume-constrained
    parameters: {expansion_limit: "25% additional line volume"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      Sec. 2.4: "The model has perfect foresight and optimises with an hourly
      temporal resolution." All technologies greenfield optimised without
      existing capital stock.
    procedure_notes: >
      Single target year (2013 weather data), overnight/greenfield investment,
      perfect foresight over the full year. No existing capacity inherited.
    variant: overnight-greenfield
    parameters: {target_year: "stylised 100% GHG scenario", weather_year: 2013, temporal_resolution: "1h"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      Sec. 2.1 lists "emission constraints introducing a limit of CO2 equivalent
      greenhouse gas (GHG) emissions" as one of the model constraints. The
      scenario is parameterised as a 100% GHG emission reduction scenario
      (Sec. 2.4).
    procedure_notes: >
      Hard CO2 cap set to 100% reduction (net-zero). No explicit carbon price;
      constraint is binding. Model is explicitly stated to abstain from binding
      renewable energy targets — the decarbonisation is achieved through the
      emission cap alone.
    variant: emission-cap
    parameters: {co2_reduction: "100%"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      Table 1 footnote a: "All technologies include a discount rate of 7%."
      Capital costs are annualised in the objective function (Eq. 1).
    procedure_notes: >
      Uniform 7% discount rate applied to all technologies. Annualised capital
      cost enters the objective alongside variable operational cost. Technology
      lifetimes from DEA 2019 and other sources (Table 1).
    variant: null
    parameters: {discount_rate: "7%"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      Sec. 2.4: "We set the spatial resolution to 16 nodes within Germany."
      The model is applied to the German power sector only.
    procedure_notes: >
      16-node representation of Germany derived from PyPSA-Eur clustering.
      Load distributed across regions using NUTS3 GDP weights. No analysis of
      the effect of spatial resolution on USC — resolution is fixed as a
      modelling choice.
    variant: null
    parameters: {nodes: 16, region: "Germany"}

unmatched_methods: []
