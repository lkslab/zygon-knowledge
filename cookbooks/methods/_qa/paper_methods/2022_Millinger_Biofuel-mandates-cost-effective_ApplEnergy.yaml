paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec (extended fork with biomass/bioenergy portfolio), 37 nodes,
  sector-coupled, 1-hourly full-year resolution (8760 h) for main runs; 237
  representative time-steps for sensitivity runs.
scope: >
  Quantifies the total energy system cost increase of enforcing biofuel blending
  mandates (0–100%) on top of an economy-wide CO2 cap in the European energy
  system for overnight 2040 and 2060 scenarios, identifying cost drivers and
  comparing biofuels against electrofuels and fossil fuels with CDR.
methods:
  - slug: sector-coupled-network-assembly
    role: extends
    evidence: >
      "we expand the sector-coupled European ESOM PyPSA-Eur-Sec [52] with details on
      biomass and bioenergy options" (Sec. 1). A rich biomass resource and bioenergy
      technology portfolio — including BtL (Fischer-Tropsch), CHP with CCS, biogas
      upgrading, BioSNG, and industry heat — is added to the standard multi-carrier
      network (Sec. 2.2, Figure 1).
    procedure_notes: >
      The base PyPSA-Eur-Sec model includes power, transport, space and water heating,
      industry and industrial feedstocks (Sec. 2.1). The paper adds: solid biomass and
      digestible biomass categories with supply-cost curves (JRC ENSPRESO); conversion
      routes to BtL, CHP, BioSNG, and biogas; optional carbon capture on each process;
      and a biomass import link with a step-supply cost curve derived from IAM model
      comparison (Sec. 2.2, 2.2.1). Biofuel mandate is enforced as a minimum share
      constraint on liquid hydrocarbon production (Eq. 1). The HVDC lossy transport model
      is used for transmission. Open-source fork available at GitHub (ref [54]).
    variant: null
    parameters:
      nodes: "37"
      temporal_resolution: "8760 h (1-hourly, full year) for main runs"
      transmission_cap: "max 50% increase in total line volume vs today"
      biofuel_mandate_levels: "0%, 20%, 50%, 100% share of liquid fuel demand"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "We model overnight scenarios for 2040 and 2060 with the sector-coupled European
      energy system model PyPSA-Eur-Sec" (Abstract). The two years are not interlinked:
      "capacities built in scenarios for 2040 are not considered in scenarios for 2060"
      (Sec. 2.4).
    procedure_notes: >
      Pure overnight cost-optimisation: the model co-optimises capacity expansion and
      dispatch for a single target year without transition dynamics. Two separate
      investment years (2040 and 2060) are each solved independently, with different
      CO2 caps (-80% and -105% vs 1990) and technology costs. No pathway linking
      the two years.
    variant: overnight
    parameters:
      target_years: "2040, 2060"
      co2_target_2040: "-80% vs 1990"
      co2_target_2060: "-105% vs 1990 (net-negative)"

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "For both years, it is assumed that conventional and renewable capacities existing
      in 2020 still exist in 2040 and 2060, unless they have reached the end of their
      life time" (Sec. 2.4). The paper explicitly calls these "overnight brown-field
      scenarios" (Sec. 2.1).
    procedure_notes: >
      Existing 2020 capacities are carried into the model and can only be retired if
      their lifetime is exceeded. Expansion is additional to this fleet. No explicit
      vintage tracking beyond the binary survive/retire decision based on a single
      lifetime threshold.
    variant: null
    parameters: {}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "Two target years are analysed… connected to different CO2 emission targets,
      with an 80% reduction in 2040 compared to 1990 and a 105% reduction in 2060"
      (Sec. 2.4). The CO2 cap is the principal policy instrument; biofuel mandates are
      added on top. Carbon sequestration capacity is also varied as a scenario axis
      (Table 2).
    procedure_notes: >
      Economy-wide annual CO2 cap enforced as a hard constraint in the optimisation.
      Carbon sequestration (geological storage) capacity is swept across two levels:
      0 or 1500 MtCO2/a in 2040, 400 or 1500 MtCO2/a in 2060 (Table 2). The CO2
      shadow price is extracted and used to attribute fossil fuel emission costs in
      the fuel cost decomposition (Appendix B, Eq. B.3).
    variant: null
    parameters:
      co2_cap_2040: "-80% vs 1990"
      co2_cap_2060: "-105% vs 1990"
      cs_low_2040: "0 MtCO2/a"
      cs_high_2040: "1500 MtCO2/a"
      cs_low_2060: "400 MtCO2/a"
      cs_high_2060: "1500 MtCO2/a"

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "the model temporal resolution reduced to 237 representative time-steps per year
      (instead of 8760 with an hourly resolution) due to computational restrictions.
      A lower temporal resolution tends to slightly overestimate the biofuel share among
      liquid fuels" (Sec. 2.5).
    procedure_notes: >
      Main scenarios run at full 8760-h 1-hourly resolution. Sensitivity analysis (64
      parameter combinations × 4 base scenarios for 2060 only) is run at 237
      representative time-steps to keep computational cost manageable. The paper notes
      a directional bias from reduced resolution (slight overestimation of biofuel
      share) but does not detail the aggregation algorithm used.
    variant: null
    parameters:
      main_runs: "8760 h (1-hourly)"
      sensitivity_runs: "237 representative time-steps"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "The sensitivity analysis is performed through runs of all the combinations of
      optimistic and pessimistic parameter value combinations outlined in Table 3. All
      parameter values for a group are set to either pessimistic or optimistic… This
      results in 2^6 = 64 combinations." (Sec. 2.5).
    procedure_notes: >
      Six parameter groups swept: Fischer-Tropsch, Biomass to Liquid, electrolyser,
      carbon capture (CHP, industry, DAC), carbon sequestration cost, and fossil fuel
      prices + biomass import price. Each group toggled between optimistic and pessimistic
      values (Table 3), producing 64 full-factorial combinations. Runs performed for
      all four main 2060 base scenarios (high/low biomass × high/low CS) at 237
      representative time-steps. Results shown as violin plots of cost difference between
      pessimistic and optimistic outcomes per parameter (Figure 9).
    variant: full-factorial
    parameters:
      n_combinations: "64 (2^6)"
      parameter_groups: 6
      target_year_swept: "2060 only"
      base_scenarios_swept: 4

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The CO2 shadow price p^CO2 is used as the cost of CO2 input for electrofuels"
      and "The CO2 shadow price p^CO2 is used as the cost of CO2 emissions for fossil
      fuels" (Appendix B, Eqs. B.1–B.3). Load-weighted electricity prices are also
      extracted per node and time-step to allocate electricity costs to electrolysers.
    procedure_notes: >
      CO2 dual variable extracted from the binding annual cap constraint and used to
      price CO2 inputs (for electrofuel carbon) and CO2 emissions (fossil fuel penalty)
      in a post-processing fuel cost decomposition. Load-weighted nodal electricity
      prices (p^el_i,t) extracted and used to attribute electricity costs to electrolysers
      proportionally (Appendix B, Eq. B.1). These shadow prices are used for accounting
      only, not to close a market-clearing loop.
    variant: null
    parameters: {}

  - slug: import-and-trade-representation
    role: extends
    evidence: >
      "We use the model comparison by Bauer et al. [41]… to find that 20 EJ biomass may
      be imported to Europe at a price of 15 €/GJ. For each additional EJ to be imported
      the price is assumed to increase by 0.25 €/GJ" (Sec. 2.2.1). A biomass import
      link with a piecewise-linear cost-supply curve is added to the model.
    procedure_notes: >
      Only solid biomass can be imported; direct biofuel imports excluded. The import
      supply curve is a step function derived from IAM global biomass supply estimates
      for 2050 (Bauer et al.): base volume 20 EJ at 15 €/GJ, marginal price increase
      0.25 €/GJ per additional EJ. Import prices held constant across mandate and
      biomass scenarios; sensitivity on import base price swept ±33% in sensitivity
      analysis (Table 3). The import price sensitivity is found to be significant only
      at high biofuel mandates (Sec. 3.4).
    variant: null
    parameters:
      base_volume: "20 EJ/a at 15 €/GJ"
      marginal_price_slope: "0.25 €/GJ per EJ"
      sensitivity_range: "36–72 €/MWh (±33% around 54 €/MWh base)"

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "The transmission grid is adapted to be a HVDC lossy transport model, and
      transmission is constrained to increase by max. 50% in terms of total line volume
      compared to today" (Sec. 2.1).
    procedure_notes: >
      Transmission is co-optimised with generation and sector-coupled capacity under a
      total line volume cap (50% above today's European grid). HVDC lossy transport
      model formulation. No iterative impedance update mentioned; volume cap is the
      binding constraint rather than a cost signal.
    variant: null
    parameters:
      transmission_cap: "max 50% increase in total line volume vs today"
      formulation: "HVDC lossy transport model"

