paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec, 37 nodes (one per country/synchronous zone), 370 renewable
  resource regions, 3-hourly temporal resolution, full sector coupling
  (electricity, heating, land transport, aviation, shipping, industry), myopic
  pathway in 5-year steps 2020–2050.
scope: >
  Investigates transition paths for the sector-coupled European energy system
  under six carbon budgets corresponding to 1.5–2°C temperature increases,
  comparing the timing and cost of key technological transformations and the
  sensitivity of results to discount rates, social cost of carbon, and CO2
  sequestration assumptions.
methods:
  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "A myopic approach is used in 5-year time steps from 2020 to 2050. In
      essence, for every time step, the total system cost is minimised subject
      to a CO2 constraint determined by the exponential decay, but without any
      information regarding the future." (Sec. 2.1, main text). Contrasted
      explicitly with perfect foresight: "Contrary to assuming perfect foresight,
      the myopic approach provides a more expensive solution."
    procedure_notes: >
      Seven time steps (2020, 2025, 2030, 2035, 2040, 2045, 2050). Each step
      is a full-year LP with 3-hourly resolution. Capacities installed in
      previous steps remain until end of lifetime. CO2 cap per step set by
      exogenous exponential decay function (Eq. 2–3 in SI S1). Net-zero CO2
      emissions forced in 2050 for all paths.
    variant: myopic-5yr-steps
    parameters: {steps: "2020,2025,2030,2035,2040,2045,2050", net_zero_year: 2050}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The maximum CO2 allowed to be emitted by the system CAPCO2 can be
      imposed through the constraint [Eq. 13]… the Lagrange/KKT multiplier
      represents the shadow price of CO2, i.e., the additional price that should
      be added for every unit of CO2 to achieve the CO2 reduction target in an
      open market." (SI S15, Eq. 13). Six distinct carbon budgets are modelled
      (1.5–2°C at 67% confidence, European per-capita share).
    procedure_notes: >
      Annual CO2 cap per time step derived from an exponential decay path (Eq.
      2–3 in SI S1) calibrated to each temperature target. Cap applies to all
      sectors jointly. The resulting KKT multiplier is reported as the required
      CO2 price (Fig. 6). A CO2 price input is NOT used — only a cap.
    variant: annual-cap-per-step
    parameters: {budgets_GtCO2: "25.7 / 35.4 / 45.0 / 54.7 / 64.3 / 73.9 (67th pctile TCRE)"}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The CO2 price is not an input to the model, but an output calculated as
      the Lagrange/KKT multiplier associated with the CO2 cap constraint (Eq. 13
      in Supplemental Materials)." (Fig. 6 caption). Similarly, the KKT
      multiplier λn,t of the demand constraint "indicates the marginal price of
      the energy carrier in the bus n" (SI S15, Eq. 7).
    procedure_notes: >
      KKT duals read for two constraints: (i) per-bus per-hour energy balance
      (local marginal price) and (ii) annual CO2 cap (marginal abatement cost).
      Transmission volume shadow price µLV also derived from Eq. 12. Used to
      compare alternative budgets and to discuss policy implications.
    variant: null
    parameters: {}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "We consider two types of discount rates. First, the financial discount
      rate is used to annualise capital costs… we assume a financial discount
      rate equal to 7% for all the investments except individual assets such as
      rooftop PV or individual water tanks for which 4% is assumed. Second, a
      social discount rate is used to discount future investment when adding
      quantities throughout a transition path." (SI S13).
    procedure_notes: >
      Financial DR of 7% (4% for individual assets) converts overnight capital
      to annuity for every technology. Social DR sensitivity: 2%, 5%, 10%
      applied when summing NPV of system cost across the pathway (Fig. 7).
      Social DR does not change the optimisation within each time step; it only
      changes how cross-period sums are computed. SCC of 75, 120, 300 €/tCO2
      added to NPV in Sec. 3.4.
    variant: dual-rate-financial-plus-social
    parameters: {financial_dr_pct: 7, individual_assets_dr_pct: 4, social_dr_sensitivity: "2%, 5%, 10%"}

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "We use PyPSA-Eur-Sec, an open model of the sector-coupled European energy
      system… The model comprises the electricity, heating and land transport
      sectors… Moreover, it is extended to include the transformation of industry,
      industrial feedstocks, shipping and aviation, the use of biomass and a
      detailed accounting of carbon capture, use, and storage (CCUS)." (Abstract
      and Sec. 2.1). Full energy-carrier schematic shown in Fig. 3.
    procedure_notes: >
      Multi-carrier buses: electricity, hydrogen, methane, liquid hydrocarbons,
      heating (district/individual), CO2 atmosphere bus. Conversion links include
      electrolysers, fuel cells, heat pumps, SMR, Fischer-Tropsch, methanation,
      DAC, CHPs. All carrier balances and CO2 cycle tracked jointly per time step.
      37-node spatial resolution.
    variant: null
    parameters: {nodes: 37, sectors: "electricity, heating, land-transport, aviation, shipping, industry"}

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      "A greenfield H2 network connecting the different nodes is built if it is
      cost-effective." (SI S5.3). The impact of disallowing the H2 network is
      evaluated in a sensitivity (Sec. 3.7): removing it increases cumulative
      cost by only 0.5%.
    procedure_notes: >
      H2 pipeline network co-optimised endogenously with generation and storage.
      Network capacities are decision variables; build occurs whenever cost-
      effective. CO2 transport among countries is unconstrained (SI S8.1).
      Methane assumed freely transported via existing gas network (SI S6.3).
    variant: greenfield-h2-network
    parameters: {}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "Technologies installed in previous time steps remain in the system and
      contribute to the total system cost until they reach the end of their
      lifetime." (Sec. 2.1). Existing conventional power plant capacities and
      commissioning dates retrieved from powerplantmatching (SI S3.5). Heating
      capacities: "25% of existing capacities in 2015 are assumed to be
      decommissioned in every 5-year time step after 2020." (SI S4.3).
    procedure_notes: >
      Each myopic step inherits surviving capacities from the previous step
      (installed capacity minus any whose commissioning date + lifetime has
      elapsed). Nuclear lifetime: 60 years (to account for retrofitting). Wind
      and solar 2020 capacities from annual statistics. Heating capacities from
      Eurostat (SI S4.3).
    variant: null
    parameters: {}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "The maximum capacity for onshore wind, offshore wind, and solar PV that
      can be installed in every region is limited by the estimated potentials.
      Those are determined by summing the available land in every reanalysis grid
      cell, which in turn is calculated by considering only the suitable land for
      every technology, according to the Corine Land Cover (CLC) database and
      subtracting Natura 2000 protected areas." (SI S3.2, Eqs. 4–5).
    procedure_notes: >
      CLC categories differ per technology (table in SI S3.2). Conversion
      factors: 10 MW/km² (wind), 50 MW/km² (utility solar). Eligible fractions:
      20% of land for wind, 9% for utility solar. Rooftop PV potential from
      population density (0.1 kW/m², 10 m²/person). Offshore: GEBCO bathymetry,
      depth < 50 m. atlite used for capacity-factor time series from ERA5 / SARAH.
    variant: null
    parameters: {wind_eligible_fraction: "20%", solar_eligible_fraction: "9%", offshore_max_depth_m: 50}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The 4,973 nodes in the initial network are clustered using the k-means
      algorithm into a variable number of nodes. In this work, we use 37 nodes,
      i.e., one for every region of European countries belonging to separate
      synchronous zones." (SI S3.3). Renewable resources aggregated to 370
      clusters.
    procedure_notes: >
      k-means clustering of PyPSA-Eur base network to 37 nodes. Renewable
      resource representation kept at 370 regions, each attached to one of the
      37 country nodes. Equivalent lines computed by aggregating original lines
      with weighted cost including underwater fraction and 25% land-detour factor.
    variant: null
    parameters: {network_nodes: 37, renewable_resource_regions: 370}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "We select 3-hour time steps to enable a high spatial resolution, network
      modelling and detailed technology description while reducing computational
      requirements." (Sec. 2.1). References to prior work showing "minor
      differences are found when using 3-hour instead of 1-hour time steps"
      (Sec. 2.1, citing [38–40]).
    procedure_notes: >
      Uninterrupted 3-hourly resolution for a full year in every time step (2920
      snapshots). No typical-period compression. Runtime: ~4 hours per time step
      on 30 GB RAM.
    variant: 3-hourly-full-year
    parameters: {time_step_h: 3, snapshots_per_year: 2920}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "Linear optimal power flow is applied using Kirchhoff's formulation."
      (SI S3.3, citing [19]). Transmission safety margin: "a safety margin of
      33% of the installed capacity is used to satisfy n−1 requirement." (SI S3.3).
    procedure_notes: >
      DC (linearised) power flow on the clustered 37-node AC/HVDC network.
      Kirchhoff voltage law formulation. Transmission capacities fixed in the
      baseline; co-optimisation enabled in a sensitivity analysis (Sec. 3.7).
      N-1 margin applied as a derating of existing capacity, not as explicit
      contingency constraints.
    variant: null
    parameters: {n1_safety_margin_pct: 33}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "A sensitivity analysis enabling the co-optimisation of transmission
      capacities with the generation, storage and conversion technologies is also
      discussed in the main text." (SI S3.3, Sec. 3.7). "For the 1.7°C-budget,
      allowing the expansion of the power grid up to twice today's volume reduces
      the system cumulative cost by 2%." (Sec. 3.7).
    procedure_notes: >
      Baseline: transmission fixed. Sensitivity: co-optimisation subject to a
      volume cap of 2× today's total (Eq. 12 applied). Used only for the 1.7°C
      budget sensitivity, not the full matrix of carbon budgets.
    variant: volume-cap
    parameters: {cap_factor: "2x today's volume", budget_studied: "1.7°C only"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "To explore how the results depend on the inputs, we perform several
      sensitivity analyses: varying the most important cost assumptions, leaving
      cost and technology assumptions fixed at 2020 values throughout the pathway,
      varying the carbon sequestration costs and volumes, endogenising building
      efficiency measures, removing the hydrogen network and excluding biomass with
      CCS." (Sec. 2.2). Full sensitivity matrix in SI Table S4.
    procedure_notes: >
      One-at-a-time cost variations of ±20% for solar, onshore wind, nuclear,
      utility battery, methanation, DAC, electrolytic H2, SMR+CC H2. Additional
      scenarios: fixed 2020 costs, CO2 sequestration cost (0.1–100× reference)
      and potential (1–100× reference), no H2 network, endogenous building
      retrofitting, no biomass with CCS. Cost sensitivity run across all 6 carbon
      budgets; CO2 sequestration and structural sensitivities run for 1.7°C only.
    variant: one-at-a-time-plus-structural
    parameters: {cost_variation_pct: "±20%", sequestration_cost_range: "0.1–100×", sequestration_potential_range: "1–100×"}

  - slug: demand-side-flexibility-representation
    role: routine-use
    evidence: >
      "Half of the existing EVs in every time step are assumed to do smart
      charging and enable vehicle-to-grid operation. The BEV state of charge is
      forced to be higher than 75% at 7 a.m. every day… to ensure that the
      batteries are close to full in the morning peak usage." (SI S11.1).
    procedure_notes: >
      50% of BEV fleet participates in smart charging and V2G. Battery: 50 kWh,
      charging capacity 11 kW, 90% charging efficiency. Availability
      inversely proportional to transport demand profile (avg 80%, min 62%).
      SoC constraint forces near-full charge by 7 a.m. daily (restricts shifting
      to within a day). EV battery cost excluded (assumed mobility investment).
    variant: v2g-with-soc-constraint
    parameters: {smart_charging_fraction: "50%", battery_kWh: 50, charging_kW: 11, min_soc_at_7am_pct: 75}

  - slug: powerplant-matching-and-fleet-assembly
    role: routine-use
    evidence: >
      "For conventional technologies, i.e. OCGT, CCGT, coal, lignite, nuclear and
      gas CHP, installed capacities in every country in 2020 and commissioning
      dates are retrieved from powerplantmatching." (SI S3.5).
    procedure_notes: >
      powerplantmatching used to initialise the 2020 conventional fleet with
      per-plant commissioning dates, enabling brownfield decommissioning by
      lifetime. Wind and solar 2020 installed capacities from annual statistics
      (separate source, SI S3.5). Nuclear lifetime set to 60 years.
    variant: null
    parameters: {}

