paper: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
tier: 2
model_used: >
  PyPSA-GB-H2 — a bespoke PyPSA model of Great Britain's hydrogen system,
  industrial-cluster spatial resolution (~15 nodes), hourly temporal resolution,
  year 2050 only.
scope: >
  Builds an open-source GB hydrogen infrastructure model (PyPSA-GB-H2) across
  three National Grid FES net-zero scenarios for 2050, identifies investment
  priorities and quantifies geospatial locational flexibility of hydrogen supply
  and demand sectors.
methods:
  - slug: carrier-network-routing-h2-co2
    role: canonical-use
    evidence: >
      "Hydrogen pipelines between industrial clusters were modelled as energy
      flows, disregarding thermodynamic properties and loss of energy associated
      with frictional pressure drop." A tree network topology was adopted rather
      than a star network (Sec. 2.2.3 Network). CO2 pipeline routing is
      referenced for methane reformation with CCUS but not explicitly modelled
      in the hydrogen network.
    procedure_notes: >
      Pipeline network connects ~15 industrial clusters as a tree network;
      one-hour simulation timestep; pipeline packing and compression losses
      excluded; only salt caverns retained for hydrogen storage (offshore
      depleted fields excluded due to contamination risk). Network operating
      pressure cited as 40–80 barg.
    variant: tree-network-cluster-level
    parameters: {timestep_h: 1, spatial_resolution: "industrial cluster (~15 nodes)", target_year: 2050}

  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      "Only salt caverns storage was assumed for this study" and theoretical
      UK salt cavern capacity (~2,000 TWh) compared against FES peak requirement
      (~55 TWh by 2050). Storage state-of-charge profiles are simulated hourly
      and compared against FES-2022 estimates (Sec. 2.2.4 Storage, Sec. 3.3).
    procedure_notes: >
      Storage sized to balance hourly supply-demand mismatches at cluster level;
      energy capacity not independently optimised — capacity inferred from FES
      scenario totals; comparison of PyPSA-GB-H2 vs FES peak storage reveals
      substantial discrepancies attributed to modelling approach differences.
    variant: exogenous-capacity-scenario
    parameters: {max_storage_requirement_TWh: 55, cavern_capacity_TWh: "~2000"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      The three FES net-zero scenarios evaluated all correspond to net-zero
      emissions by 2050 (Sec. 2.2 FES Data). Carbon emissions constraints are
      implicit in the scenario framing: only low-carbon hydrogen production
      technologies (electrolysis, methane reformation with CCUS, biomass
      gasification) are included; no explicit CO2 cap or price variable appears
      in the model formulation.
    procedure_notes: >
      Decarbonisation constraint is scenario-exogenous rather than an
      optimisation variable; the model enforces low-carbon supply only by
      excluding carbon-intensive production. Three FES scenarios — Consumer
      Transformation, Leading the Way, System Transformation — span minimum to
      maximum hydrogen adaptation.
    variant: scenario-exogenous-net-zero
    parameters: {scenarios: 3, target_year: 2050}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The assumption of industrial cluster level, shown on Figure 2.1, serves
      the purpose of this study to identify the 'flexible' sectors to review
      minimum infrastructure requirement. However, higher resolution may be
      required for more detailed analysis." (Sec. 2.2.3)
    procedure_notes: >
      Geography discretised to ~15 named industrial clusters (St. Fergus,
      Grangemouth, Teesside, Humberside, Bacton, Merseyside, Theddlethorpe,
      Bacton, Grain LNG, Southampton, South Wales, etc.) based on feedstock
      proximity and existing infrastructure. Spatial data sourced from GB DNO
      licence area boundaries. No automated clustering algorithm used — clusters
      defined by industry geography.
    variant: manual-industry-cluster
    parameters: {approx_nodes: 15}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "This study covered year 2050 only." (Sec. 2.1). The model optimises
      operation for a single target year without modelling the investment
      transition pathway.
    procedure_notes: >
      Overnight/greenfield for 2050; capacities taken exogenously from FES-2022
      workbook rather than optimised. Model runs as an operational dispatch
      (supply-demand balancing) rather than a capacity expansion optimisation.
    variant: overnight-single-year
    parameters: {target_year: 2050}

  - slug: demand-side-flexibility-representation
    role: routine-use
    evidence: >
      Geospatial locational flexibility of demand sectors is analysed: "This
      study introduced geospatial division of hydrogen supply and demand and
      identified drivers for flexibility of sectors location on industrial
      clusters level." (Sec. 2.2.3). Heating demand is modelled with hourly
      temperature-driven fluctuations; other sectors assumed steady throughput.
    procedure_notes: >
      Flexibility is defined spatially (can a sector locate adjacent to
      production?) rather than temporally (can demand shift in time?). Heating
      demand uses 2010 UK temperature profile and building-stock split (80%
      single-family, 20% multi-family) via oemof demandlib. Power generation
      uses hourly PyPSA-GB dispatch output. Synthetic fuels, rail, and road
      transport assumed temporally flat.
    variant: geospatial-locational-flexibility
    parameters: {weather_year: 2010, building_split: "80% single / 20% multi-family"}

unmatched_methods: []
