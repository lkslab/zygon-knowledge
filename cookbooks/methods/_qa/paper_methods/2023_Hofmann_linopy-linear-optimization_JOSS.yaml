paper: "2023_Hofmann_linopy-linear-optimization_JOSS.pdf"
tier: 2
model_used: >
  no model (tooling paper — introduces the Linopy algebraic modelling language
  library; no energy system model is run in the paper itself)
scope: >
  Presents Linopy, an open-source Python AML for linear and mixed-integer
  optimisation using an array-based data model compatible with NumPy/Pandas/Xarray;
  benchmarks memory and speed against JuMP, Pyomo, CVXPY and PuLP.
methods:
  - slug: custom-constraints-with-linopy
    role: defines
    evidence: >
      The paper defines Linopy as an array-based AML where variables are stored
      as n-dimensional labeled arrays and constraints are assembled via high-level
      algebraic expressions, directly establishing the API that PyPSA's
      extra_functionality hook and every custom constraint in the ecosystem rely on
      (Summary and Statement of Need sections).
    procedure_notes: >
      Variables are stored as integer-label arrays of shape N1×N2×…×NK; boolean
      masks select where a variable is defined; coordinates auto-align in linear
      expressions; the model can be serialised to NetCDF and dispatched to remote
      servers via Paramiko. Benchmarked on a 1-dimensional knapsack problem using
      the Gurobi solver against JuMP, Pyomo, CVXPY, PuLP and Gurobipy — Linopy
      outperforms all Python AMLs in memory efficiency (Fig. 1). Supported solvers:
      GLPK, CBC, HiGHS, Gurobi, Xpress, CPLEX; PIPS-IPM++, SCIP, MOSEK planned.
    variant: null
