paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
tier: 1
model_used: >
  PyPSA-Eur-Sec, 181 nodes, sector-coupled (electricity, buildings, transport,
  industry, agriculture), 3-hourly resolution for a full year (weather year 2013),
  greenfield/overnight optimisation.
scope: >
  Quantifies the cost benefit of a pan-European hydrogen pipeline network
  (new and gas-pipeline-retrofitted) in net-zero CO2 scenarios, and its interaction
  with electricity grid expansion, across four main scenarios varying grid expansion
  permissions.
methods:
  - slug: carrier-network-routing-h2-co2
    role: canonical-use
    evidence: >
      "We pursue this idea by varying the allowed expansion of electricity and
      hydrogen grids in net-zero CO2 scenarios for a sector-coupled and self-sufficient
      European energy system." (Introduction). The model co-optimises new and
      retrofitted hydrogen pipeline capacities alongside the electricity grid;
      pipeline routing uses SciGRID gas network data: "for every unit of gas pipeline
      decommissioned, 60% of its capacity becomes available for hydrogen transport"
      (Experimental Procedures / Sec. S2.4). CO2 transport is assumed unlimited
      (copperplated), so not explicitly routed.
    procedure_notes: >
      Hydrogen pipeline links are endogenously sized; 60% capacity conversion ratio
      for gas-to-H2 retrofit; new pipeline cost 250 EUR/MW/km, retrofit cost
      117 EUR/MW/km. Simple transport model (no physical gaseous-flow constraints
      beyond capacity limits; nodal balance required). Four scenarios: with/without
      power grid expansion crossed with with/without H2 network expansion. Sensitivity
      with liquid H2 in shipping (Sec. S13.6), with imports (Sec. S13.5). Gas
      network data from SciGRID gas project [Ref 61 / S75]. Hydrogen flows across
      181 bidding zones.
    variant: retrofit-and-new-pipelines
    parameters: {new_pipeline_cost: "250 EUR/MW/km", retrofit_cost: "117 EUR/MW/km",
                  retrofit_capacity_ratio: "60%", network_volume_range: "204-307 TWkm",
                  retrofit_share: "63.5-69.1%"}

  - slug: sector-coupled-network-assembly
    role: canonical-use
    evidence: >
      "PyPSA-Eur-Sec uses linear optimisation to minimise total annual operational
      and investment costs subject to technical and physical constraints... covering
      181 regions and a 3-hourly time resolution for a full year." (Experimental
      Procedures). Carriers modelled: electricity, heat, methane, hydrogen, CO2,
      liquid hydrocarbons. Sectors: electricity, buildings (decentral/district heat),
      transport (land EV/FCEV, shipping methanol, aviation kerosene), agriculture,
      industry (iron/steel, chemicals, cement, non-ferrous metals, etc.).
    procedure_notes: >
      Multi-carrier buses connected by conversion links with fixed efficiencies.
      Shared CO2 accounting bus tracking capture, usage, sequestration and emissions.
      Gas, oil, biomass, CO2 carriers copperplated (no explicit transport) to reduce
      problem size; electricity, hydrogen and heat nodally resolved. Half of BEV fleet
      participates in V2G. Building retrofitting efficiency gain of 29% is exogenous.
      Technology data for 2030 from Danish Energy Agency (DEA); sensitivity with
      2050 costs in Sec. S13.4.
    variant: full-sector-coupling-181-nodes
    parameters: {nodes: 181, time_resolution: "3-hourly", weather_year: 2013,
                  sectors: "electricity, buildings, transport, industry, agriculture",
                  co2_cap: "net-zero (0 annual emissions)"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Apart from existing electricity and gas transmission infrastructure and
      hydroelectric power plants, no other existing assets are assumed (greenfield
      optimisation or overnight scenario), so that the model assumes a long-term
      equilibrium in a market with perfect competition and foresight, and disregards
      pathway dependencies." (Experimental Procedures).
    procedure_notes: >
      Single target year (overnight / greenfield); perfect foresight over one year
      of 3-hourly operation. No multi-horizon or pathway optimisation. Limitation
      explicitly noted: "Owing to the absence of pathway optimisation, our results
      cannot offer insights into the required transition steps." (Discussion).
    variant: overnight-greenfield
    parameters: {target_year: "2030 cost assumptions (sensitivity: 2050)", foresight: "perfect over one year"}

  - slug: transmission-expansion-cooptimisation
    role: canonical-use
    evidence: >
      "The model co-optimises the investment and operation of generation, storage,
      conversion and transmission infrastructures for the least-cost outcome in a
      single linear optimisation problem." (Introduction). Four scenarios vary whether
      electricity grid can be expanded beyond today's levels (cost-optimal expansion
      vs. no expansion) and whether hydrogen network can be built.
    procedure_notes: >
      Electricity grid: HVAC lines (220 kV+) and HVDC links from ENTSO-E map,
      clustered to 181 regions via k-means. Line impedances inferred from standard
      voltage-level types. Added 25% to crow-fly distance for routing. Line loading
      capped at 70% of nominal rating (N-1 derating). Offshore fraction costs
      adjusted. Main scenarios: cost-optimal grid expansion ("lvopt") vs. no grid
      expansion ("lv1.0"). Intermediate grid steps in Sec. S13.1.
      Hydrogen network expansion co-optimised in same LP (new + retrofit pipelines).
    variant: co-optimised-elec-and-h2
    parameters: {electricity_grid_scenarios: "cost-optimal vs. no expansion",
                  h2_network_scenarios: "with vs. without",
                  line_loading_limit: "70% of nominal (N-1 derating)"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The transmission network topology is further reduced to a variable number
      of nodes, in this case to 181 regions, by using a k-means clustering algorithm,
      which uses regional electricity consumption as weights." (Sec. S2.4). Impact
      of spatial resolution assessed in Sec. S13.8.
    procedure_notes: >
      Full ENTSO-E substation topology (~3000 substations) first reduced by removing
      radial paths and normalising to 380 kV, then k-means clustered to 181 regions.
      Country borders preserved. Voronoi cells used as geographic catchment areas.
      Sensitivity: 37 (one-per-country) to 181 regions, showing 4.3% cost underestimate
      at country resolution relative to 181-region model (Sec. S13.8).
    variant: k-means-consumption-weighted
    parameters: {nodes: 181, clustering_weight: "regional electricity consumption",
                  country_boundaries: "respected"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Potentials for wind and solar generation take various land eligibility
      constraints into account, e.g. suitable land types and exclusion zones
      around populated and protected areas." (Experimental Procedures). Weather
      data from ERA5 and SARAH-2 (Refs 56, 57 / S52, S66).
    procedure_notes: >
      Wind and solar capacity factors computed from ERA5 reanalysis and SARAH-2 solar
      irradiance data. Land eligibility uses CORINE land cover and Natura 2000
      protected areas (Refs S55, S56). Restricted onshore wind potential sensitivity
      in Sec. S13.2. Offshore EEZ Voronoi regions also computed. Geological hydrogen
      storage potentials (salt caverns) from literature (Ref S74 / Caglayan et al.).
    variant: era5-corine-natura2000
    parameters: {weather_data: "ERA5 + SARAH-2", reference_year: 2013}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "Power flows are modelled through lossless linearised power flow equations
      using an efficient cycle-based formulation of Kirchhoff's voltage law."
      (Experimental Procedures, citing Hörsch et al. 2018 [Ref 60]).
      "One plausible explanation for this observation is that... the power grid...
      is subject to linearised power flow physics (Kirchhoff's circuit laws)."
      (Results).
    procedure_notes: >
      Cycle-based linear power flow formulation (Hörsch et al. EPSR 2018). No
      transmission losses included. Line loading derated to 70% of nominal rating
      to approximate N-1 security. Hydrogen pipelines use a simpler transport model
      with only capacity and nodal balance constraints (no physics).
    variant: cycle-flow-lossless
    parameters: {losses: "none (lossless)", n1_derating: "70% of nominal rating"}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "All investigations are conducted with a constraint that carbon dioxide
      emissions into the atmosphere balance out to zero over the year." (Introduction /
      Experimental Procedures). "we infer that a carbon price between 385 EUR/tCO2
      with transmission infrastructure expansion and 579 EUR/tCO2 without would be
      required to achieve both climate neutrality and self-sufficiency in Europe."
      (Sec. S14).
    procedure_notes: >
      Annual CO2 balance constraint set to zero (net-zero). Sequestration limited
      to 200 MtCO2/year (restricts reliance on negative emission technologies).
      Carbon price reported as dual variable of the CO2 constraint. CO2 tracked
      through capture (industry processes, SMR, CHP, DAC), usage (electrofuels),
      and sequestration.
    variant: annual-net-zero-cap
    parameters: {co2_limit: "net-zero (0 annual)",
                  sequestration_cap: "200 MtCO2/year",
                  implied_co2_price: "385-579 EUR/tCO2"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "We find cost-optimal storage capacities between 26 to 43 TWh with a hydrogen
      network and 21 to 22 TWh without a hydrogen network." (Results). Batteries
      energy and power independently sized; "energy-to-power ratio of 6 hours" for
      batteries noted in results (p. 11). Underground salt cavern storage and steel
      tank storage both available.
    procedure_notes: >
      Multiple storage technologies co-optimised: stationary batteries (home and
      utility-scale), EV batteries (V2G), pumped hydro (fixed), pit thermal energy
      storage, hot water tanks, hydrogen in salt caverns and steel tanks. Battery
      energy and power capacities sized independently. Hydrogen storage cyclic with
      seasonal fill patterns. Steel tank cost assumed much higher than cavern (2 vs
      ~0 EUR/kWh storage cost delta from Table S3).
    variant: independent-energy-power-sizing
    parameters: {h2_storage_range: "21-43 TWh", battery_typical_duration: "~6h",
                  h2_storage_cavern_cost: "2 EUR/kWh"}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "assuming perfect competition and perfect foresight over one uninterrupted
      year of 3-hourly operation." (Experimental Procedures). "with a system cost
      difference of -0.35% the error induced by resampling the model from an hourly
      to a 3-hourly resolution is small and justifies a model size reduction by
      factor 3." (Sec. S13.7).
    procedure_notes: >
      3-hourly snapshots with uniform weights covering full year (2920 snapshots).
      Sensitivity from 6-hourly to hourly resolution evaluated at 90-region model
      (Sec. S13.7). 3h vs 1h error: -0.35% system cost; 6h error exceeds 2.5%.
      No typical-period aggregation (TSAM) used; full chronological sequence retained.
    variant: n-hourly-uniform
    parameters: {time_resolution: "3-hourly", snapshots: 2920,
                  cost_error_vs_hourly: "-0.35%"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "As supplementary sensitivity analyses, we also evaluate the impact of
      restricted onshore wind potentials (Section S13.2), more progressive technology
      assumptions (Section S13.4), the impact of importing most hydrogen derivatives
      from outside of Europe on network benefits (Section S13.5), and the use of
      alternative shipping fuels (Section S13.6)." (Introduction).
    procedure_notes: >
      Multiple one-at-a-time sensitivity scenarios: (1) restricted onshore wind
      (25-100% of potential); (2) technology cost projections for 2050 vs. 2030;
      (3) importing all liquid hydrocarbons at 115 EUR/MWh; (4) liquid H2 in
      shipping; (5) varying spatial resolution (37-181 nodes); (6) varying temporal
      resolution (1h-6h). Main four scenarios also vary grid expansion permissions.
      Intermediate power grid expansion levels in Sec. S13.1.
    variant: one-at-a-time-scenarios
    parameters: {scenarios_main: 4, sensitivity_dimensions: 6}

  - slug: demand-side-flexibility-representation
    role: routine-use
    evidence: >
      "Half of the battery electric vehicle fleet for passenger transport is assumed
      to engage in demand response schemes as well as vehicle-to-grid operation."
      (Experimental Procedures). "BEV state of charge is forced to be higher than
      75% at 7am every day to ensure that the batteries are sufficiently charged for
      the peak usage in the morning." (Sec. S3.1).
    procedure_notes: >
      50% of BEV fleet participates in smart charging and V2G. Charging capacity
      11 kW, storage 50 kWh, 90% efficiency. Average grid availability 80%, minimum
      62%. SoC constraint: ≥75% at 7am daily. Electrolysers also operated flexibly
      to absorb renewable surplus (average 35-41% utilisation).
    variant: v2g-with-soc-constraints
    parameters: {v2g_fraction: "50% of BEV fleet", soc_min_7am: "75%",
                  bev_charging_capacity: "11 kW", bev_storage: "50 kWh"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "To calculate the annuity of the overnight hydrogen network costs listed in
      the EHB reports, a lifetime of 50 years and a discount rate of 7% are assumed."
      (Footnote 1, p. 20). Technology costs from DEA include overnight investment
      and FOM; annuities computed internally.
    procedure_notes: >
      Single uniform discount rate of 7% applied to annualise overnight capital costs
      using capital recovery factor. Technology lifetimes vary by technology (e.g.,
      25 years for most power plant technologies per Table S3). No differentiation
      by country or technology type in discount rate. Cost minimisation is of annual
      total system cost (annualised CAPEX + OPEX).
    variant: uniform-discount-rate
    parameters: {discount_rate: "7%"}

  - slug: powerplant-matching-and-fleet-assembly
    role: routine-use
    evidence: >
      "For conventional electricity generators, PyPSA-Eur-Sec uses the open
      powerplantmatching tool, which merges datasets from a variety of sources."
      (Sec. S2.2). Provides plant location, technology, fuel type, age, capacity
      for coal, lignite, oil, OCGT, CCGT, nuclear generators.
    procedure_notes: >
      powerplantmatching tool used only for existing conventional plants (brownfield
      elements). These are included but held non-extendable except hydroelectricity.
      Wind and solar existing capacities not included (data too fragmented). Model
      otherwise greenfield. Existing hydro (run-of-river, reservoir, pumped hydro)
      also included at fixed capacities with inflow from ERA5 runoff data.
    variant: conventional-fleet-only
    parameters: {}

unmatched_methods: []
