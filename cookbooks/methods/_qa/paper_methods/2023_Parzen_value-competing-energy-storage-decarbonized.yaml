paper: "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
tier: 2
model_used: >
  PyPSA-Earth, electricity-only, Nigeria, 10 nodes (clustered from full
  transmission network), 8760h temporal resolution, 2050 target year.
scope: >
  System-value assessment of 20 energy storage technologies in a decarbonised
  Nigerian power system, comparing single-storage and competitive multi-storage
  scenarios to quantify synergy benefits and rank technology relevance.
methods:
  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      "energy storage with unconstrained design is modelled such that the model
      can independently optimize any functional component (charger, discharger,
      store). In contrast, design-constrained technologies such as the
      Lithium-battery are modelled so that the charger and discharger are
      constrained to be equal" (Sec. 6.2). EP ratios analysed in Sec. 4
      (4–36h for gravity/Li, 8–21h for H2, up to 36 days for pumped-heat).
    procedure_notes: >
      20 technologies modelled from PNNL data; charger, store, discharger
      components sized independently where technology allows; self-discharge
      losses excluded as negligible for technologies storing below 18 days
      (Sec. 6.2); minimal variable O&M of 0.5 EUR/MWh added to avoid
      unintended storage cycling [26] (Sec. 6.3).
    variant: unconstrained-vs-constrained-design
    parameters: {technologies: 20, ep_ratio_range: "4h–36 days", var_om: "0.5 EUR/MWh"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: canonical-use
    evidence: >
      "the 'lonely optimist scenario' tree can optimize all storage technologies
      simultaneously, assuming that always one storage technology is optimistic
      (70% of BAU capital costs) while the others are pessimistic (130% of BAU
      capital costs)" (Sec. 6.3). 40 distinct scenarios total — 20 single-storage
      and 20 lonely-optimist — spanning extreme cost parameterisations.
    procedure_notes: >
      Two scenario trees: 'single storage' (20 runs, BAU costs, one technology
      per run) and 'lonely optimist' (20 runs, all technologies available,
      one optimistic at −30% BAU capex, all others pessimistic at +130% BAU
      capex). Cost data from 2050 PNNL projections with geometric-series
      interpolation (Sec. 6.1, 6.3). Results compared by total system cost
      and deployed capacity to rank technology optimization-relevance.
    variant: extreme-bounding
    parameters: {scenarios: 40, optimistic_cost: "70% BAU", pessimistic_cost: "130% BAU"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Two scenario trees are explored for the 2050 fully decarbonized power
      system" (Sec. 6.3); Table 2 heading reads "Electricity storage overnight
      investment cost assumptions per technology for 2050." Single target-year
      greenfield optimisation with no pathway modelling.
    procedure_notes: >
      Overnight 2050 scenario; demand scaled to 2050 SSP projections from a
      2013 base weather year (Sec. 6.3); no myopic or pathway structure.
    variant: overnight
    parameters: {target_year: 2050, weather_year: 2013}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "Two scenario trees are explored for the 2050 fully decarbonized power
      system with cost-optimal grid expansion in the model region, Nigeria"
      (Sec. 6.3).
    procedure_notes: >
      Grid expansion co-optimised alongside storage in all scenarios; HVDC
      overhead investment cost 432 EUR/kW, lifetime 40 years (Table 1, Sec. SI).
      No explicit cap on transmission volume stated.
    variant: null
    parameters: {hvdc_cost: "432 EUR/kW", hvdc_lifetime: "40 years"}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "we clustered the original, open available transmission network to 10 nodes
      (see Figure 6). Each node captures an area for calculating renewable
      potential and demand" (Sec. 6.2).
    procedure_notes: >
      Nigeria's transmission network reduced from full resolution to 10 nodes.
      Clustering method not specified; used PyPSA-Earth's built-in clustering
      (open-source code contributed at pypsa-meets-earth/pypsa-earth/pull/567).
    variant: null
    parameters: {nodes: 10, country: "Nigeria"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Era5 reanalysis data is used to derive the renewable potential calculation"
      (Sec. 6.3); paper uses PyPSA-Earth [15] which derives capacity factors and
      installable potentials per node from ERA5 and land eligibility rules.
    procedure_notes: >
      Renewable potentials and capacity factor time series derived via PyPSA-Earth
      methodology (atlite cited in [28]); detail of exclusion zones not discussed
      in this paper — inherited from PyPSA-Earth's Nigeria validation (Sec. 6.2).
    variant: null
    parameters: {}

unmatched_methods:
  - name: "systematic-deployment-analysis / market-potential method"
    evidence: >
      The paper's methodological centrepiece — borrowed from [7] (Parzen et al.
      2022) — is a 'market potential method' that defines storage system-value as
      optimised deployment capacity across possible and probable least-cost
      scenarios (Sec. 6.4). It is distinct from MGA (which maps the near-optimal
      space by re-optimising against alternative objectives) and from a standard
      sensitivity sweep (it uses extreme-bounding parameterisation explicitly to
      identify optimization-relevant technologies). No existing SLUGS.yaml entry
      captures this competitive technology-screening procedure.
