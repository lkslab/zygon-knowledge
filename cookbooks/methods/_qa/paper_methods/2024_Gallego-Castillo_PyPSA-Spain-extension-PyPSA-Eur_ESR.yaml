paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
tier: 2
model_used: >
  PyPSA-Spain (a fork of PyPSA-Eur focused on Spain), electricity-only, configurable
  nodes tested from 2 to 100, hourly resolution for a full year, 2030 target year.
scope: >
  Presents PyPSA-Spain, a single-country open-source model of the Spanish power system
  extending PyPSA-Eur with improved renewable profiles, spatially-resolved demand, and
  price-based cross-border interconnections via a nested-model approach.
methods:
  - slug: spatial-clustering-and-resolution
    role: extends
    evidence: >
      "Selecting around 35-50 nodes is identified as a good compromise between spatial
      resolution and model simplicity." The paper systematically varies the number of
      k-means clusters from 2 to 100 and analyses the effect on optimal capacities, finding
      that wind capacities stabilise above 35 nodes (Sec. 2.2 "Calculations at the clustered
      network scale"; Sec. 4 "Results for the Reference case"; Conclusions).
    procedure_notes: >
      k-means clustering applied to Spain's ~700-node real (HV) network. Voronoi cells
      computed at real-network scale; capacity factors, installed capacity and demand
      aggregated to clustered nodes. The paper argues that the Voronoi cell size should not
      fall below the ERA5 0.25deg grid cell (~28 km characteristic length) to avoid
      overestimating capacity factors in coastal/mountain zones (Sec. 2.2 "Spatial scales").
      Node counts swept: 2, 8, 15, 24, 35, 50, 65, 80, 100.
    variant: single-country-resolution-sweep
    parameters: {nodes: "2 to 100", recommended: "35-50"}

  - slug: land-eligibility-and-potentials
    role: extends
    evidence: >
      "Land-use data: includes Natura 2000 and CORINE Land Cover database. The former
      defines protected areas, and the latter provides 44 land cover and use classes with
      a spatial resolution of 100 meters. Both datasets are employed to limit eligible areas
      for renewable energy deployment" (Sec. 2.1). Appendix A details the specific CORINE
      codes included/excluded for onshore wind (codes 12-32 included; 1-6 excluded with
      1 km buffer) and solar PV (codes 1-32 included), with maps of eligible terrain.
    procedure_notes: >
      Natura 2000 and CORINE combined; eligible fraction reported as 64.65% for onshore
      wind and 41.97% for solar PV in Spain (Appendix A, Figures 24-25). Maximum
      installable capacity per Voronoi cell computed from eligible area at 1 MW/km2 power
      density (conservative assumption to reflect public acceptance, Sec. 4). PyPSA-Eur's
      Atlite package used to compute hourly capacity factors at real-network scale, weighted
      by eligible area (Sec. 2.2).
    variant: corine-natura2000-combined
    parameters: {power_density: "1 MW/km2", wind_eligible_fraction: "64.65%", solar_eligible_fraction: "41.97%"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Initially conceived as a tool to perform analyses of the power system for a specific
      time horizon" and the case study obtains "the optimal electricity mix for 2030"
      (Abstract; Sec. 5). The model formulation "relies on the assumptions of long-term
      market equilibrium, perfect competition and foresight" (Sec. 2.2).
    procedure_notes: >
      Single target year (2030), overnight/greenfield optimisation for new capacities; some
      technologies fixed exogenously (hydro, nuclear, biomass — Table 3). No multi-horizon
      or pathway modelling; the paper explicitly notes multi-horizon modelling as future work
      (Conclusions).
    variant: overnight-single-year
    parameters: {target_year: 2030, demand_TWh: 344}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "The CO2 limit for the electricity sector is set at 11.986 Mt, in line with the
      emissions associated with the peninsular power system in the Spanish NECP for 2030"
      (Sec. 4). The CO2 price is read from the shadow price: "the CO2 price obtained with
      PyPSA-Spain is in the range of 71.2-77.1 EUR/tCO2 for the different spatial
      resolutions" (Sec. 5).
    procedure_notes: >
      Annual CO2 cap on the electricity sector used as the policy constraint; the shadow
      price of that constraint reported as the implied carbon price. The European PyPSA-Eur
      run used for boundary prices assumed a -70% CO2 target relative to 1990 in the
      electricity sector (Sec. 3.3). Spanish NECP assumed an exogenous carbon price of
      79 EUR/tCO2, compared against PyPSA-Spain's endogenous result.
    variant: annual-sector-cap
    parameters: {co2_limit_Mt: 11.986, implied_co2_price_range_EUR_tCO2: "71.2-77.1"}

  - slug: import-and-trade-representation
    role: extends
    evidence: >
      "Each interconnection with a neighbouring country is modelled through the addition of
      several elements ... A generator attached to the border node, with zero capital cost,
      and a variable generation cost equal to the electricity price in the neighbouring
      country (different for each hour of the year)" (Sec. 3.3). Hourly electricity prices
      pre-computed from PyPSA-Eur optimisation serve as import prices.
    procedure_notes: >
      Nested-model approach: PyPSA-Eur run at one node per country provides hourly
      electricity prices for France and Portugal under a consistent CO2 target; these price
      time series are used as the variable cost of a virtual import generator in PyPSA-Spain.
      Export is modelled via a virtual demand at the border node. Four interconnections
      included (two with France totalling 5000 MW, two with Portugal totalling 4000 MW,
      consistent with Spanish NECP 2030 assumptions, Table 2). Price arbitrage determines
      direction of flow at each hour.
    variant: hourly-price-nested-model
    parameters: {FR_capacity_MW: 5000, PT_capacity_MW: 4000}

  - slug: powerplant-matching-and-fleet-assembly
    role: routine-use
    evidence: >
      "Historical conventional and renewable generation capacity: data of power plants from
      ENTSO-E, WEPP, OPSD, etc., combined and curated by the Python package
      powerplantmatching" (Sec. 2.1). Spanish TSO data (ESIOS API) provides installed
      capacity at NUTS 2 level for wind, solar PV, CCGT and nuclear in 2022 (Sec. 3.4.1).
    procedure_notes: >
      PyPSA-Eur's standard powerplantmatching pipeline used for European fleet; augmented
      in PyPSA-Spain with Spanish TSO (REE/ESIOS) data at NUTS 2 resolution to correct
      initial heuristic spatial distribution of wind and solar PV. Two options for capacity
      adjustment implemented: proportional (scale proportionally to initial values) and
      additional (flat increment to non-zero nodes), Sec. 3.4.1.
    variant: national-tso-data-correction
    parameters: {}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "A sensitivity analysis also showed the need to consider a high spatial resolution of
      at least 35-50 nodes, especially to fully capture the onshore wind potential"
      (Conclusions). The paper runs 9 different node counts (2, 8, 15, 24, 35, 50, 65, 80,
      100) for both the functionality ablation (Sec. 4) and the 2030 NECP case (Sec. 5).
    procedure_notes: >
      One-at-a-time ablation of three new functionalities (Q2Q renewable profiles, improved
      demand, interconnections) each run at multiple node resolutions. Not a formal
      sensitivity to input cost assumptions; the sweep is over spatial resolution and model
      configuration choices.
    variant: spatial-resolution-sweep
    parameters: {node_counts_swept: [2, 8, 15, 24, 35, 50, 65, 80, 100]}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "For storage capacity, batteries and H2 storage (steel tank and underground) were
      included" as optimisable technologies (Sec. 4). Battery results reported separately for
      power (GW) and energy capacity (GWh): "about 25 GW of newly installed batteries
      (with around 150 GWh of energy capacity)" (Sec. 4 Reference case).
    procedure_notes: >
      Battery investment cost split into inverter (169.3 EUR/kWe) and storage (150.3
      EUR/kWh) components, allowing independent sizing of power and energy (Table 4).
      H2 underground storage also included but did not appear in optimal mixes under
      the 2030 CO2 target. Pumped hydro (8870 MW) fixed exogenously (Table 3).
    variant: independent-power-energy-sizing
    parameters: {battery_inverter_cost_EUR_kWe: 169.3, battery_storage_cost_EUR_kWh: 150.3}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "This analysis did not consider the possibility of grid expansion. However, potential
      bottlenecks can be identified from the optimal dispatch" (Sec. 5). The paper confirms
      co-optimisation is available in PyPSA-Eur but was not exercised in this study's main
      results; N-1 derating was applied instead.
    procedure_notes: >
      Transmission expansion was disabled for the main results. Instead a fixed s_max_pu
      derating of 0.7 was applied to account for N-1 security (Sec. 5, Figure 22 caption).
      Line loading at the 90th percentile used to identify congestion hot-spots as a
      post-hoc diagnostic rather than via active expansion co-optimisation.
    variant: fixed-grid-with-n1-derating
    parameters: {s_max_pu: 0.7}

unmatched_methods:
  - name: "quantile-to-quantile renewable profile bias correction"
    evidence: >
      Sec. 3.1 develops and applies a quantile-to-quantile (Q2Q) transformation to correct
      the statistical distribution of PyPSA-Eur's modelled wind and solar PV capacity factor
      time series to match historical generation PDFs at country level, then downscales to
      Voronoi cells. Three normalisation schemes are compared (Eq. 1-3; Figures 5-7 for
      wind, Appendix B for solar PV). This is a novel pre-processing/calibration method
      specific to this paper, not covered by any existing slug (it is not sensitivity sweeping,
      not weather-year ensemble, not temporal aggregation, and not land-eligibility).
