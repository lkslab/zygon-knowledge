paper: "2024_Riepin_Spatio-temporal-load-shifting-clean-computing_AdvApplEnergy.pdf"
tier: 1
model_used: >
  Bespoke PyPSA model: datacenter fleet embedded in a PyPSA-Eur-derived European
  background electricity system, 37 country-level bidding zones, 1-hourly
  resolution (8760 steps), brownfield investment, target year 2025.
scope: >
  Develops and analyses a spatio-temporal load-shifting optimisation model for
  geographically distributed datacenters pursuing 24/7 carbon-free energy (CFE)
  matching; identifies three signals (resource quality differences, wind
  correlation falloff, solar time-lag) and quantifies the cost reduction per
  percentage point of flexible load across 56 location combinations.
methods:
  - slug: additionality-and-24-7-matching
    role: extends
    evidence: >
      The paper extends the standard 24/7 CFE matching constraint (eq. 2) —
      requiring hourly generation from contracted CFE assets to cover load — to
      a multi-datacenter setting with spatio-temporal load flexibility (eq. 7),
      enforcing additionality (generators must be sited in the local bidding zone)
      and 100% CFE score (x=1). Sec. 2.2 "The 24/7 CFE matching constraint
      requires that sum over hourly generation from the contracted generators…
      must be higher or equal than a certain CFE score x multiplied by the total
      load."
    procedure_notes: >
      CFE score x fixed at 1 (perfect hourly matching). The CFE factor of the
      regional grid (CFE_t) accounts for the hourly electricity mix in the local
      bidding zone and emission intensity of imported electricity from neighbouring
      zones; methodology to compute it and linearise nonconvexity is from the
      authors' prior work [35]. Excess electricity beyond CFE score is subtracted
      from the matching count. Import of grid electricity is included but for
      x=1 the model shows datacenters do not rely on grid imports. The constraint
      is extended per-node over the multi-datacenter network including spatial
      and temporal load-shift variables (eq. 7).
    variant: spatio-temporal-load-shifting-extension
    parameters: {cfe_score: "1 (100%)", flexibility_sweep: "0%, 10%, 20%, 30%, 40%"}

  - slug: demand-side-flexibility-representation
    role: defines
    evidence: >
      The paper introduces a formal model of spatio-temporal demand flexibility
      for datacenters: spatial load shifts via virtual links (non-physical
      pathways δ_ϑ, eq. 4) and temporal load shifts via a daily compute-usage
      conservation constraint (eq. 6). Dispatched load d̃_{n,t} is bounded
      within [1-f]·d_{n,t} and [1+f]·d_{n,t} (eq. 5b-5c). Sec. 2.2: "The
      range of possible deviations between the dispatched and the requested loads
      is assumed to lie within a certain flexibility range f [%]."
    procedure_notes: >
      Spatial flexibility uses a complete bipartite graph of virtual links
      between all datacenter pairs; spatial shifts are unconstrained by
      transmission network — only computing capacity bounds them. Temporal
      flexibility uses a daily usage-conservation constraint (eq. 6) limiting
      temporal shifts within each calendar day. Flexibility parameter f is swept
      exogenously: 0%, 10%, 20%, 30%, 40%. Datacenters assumed to have 100 MW
      flat (baseload) consumption profiles.
    variant: virtual-links-daily-conservation
    parameters: {flexibility_range_f: "0–40%", datacenter_load: "100 MW each", demand_profile: "flat baseload"}

  - slug: custom-constraints-with-linopy
    role: routine-use
    evidence: >
      Sec. 2.1: "The simulations were carried out with the open-source software
      PyPSA for energy system modelling [36] and Linopy for optimization [37]."
      The custom 24/7 CFE matching constraint and spatial/temporal load-shift
      constraints are formulated as additional constraints in the linopy-based
      optimisation problem.
    procedure_notes: >
      The novel CFE and load-shifting constraints (eqs. 2–7) extend the standard
      PyPSA cost-minimisation LP via linopy. No further implementation detail
      is given in the paper; code is open-source at GitHub [45].
    variant: null
    parameters: {}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      Sec. 2.1: "The model formulation includes the linear optimal power flow
      approximation on the transmission network." The background European
      electricity system uses the standard linearised (DC) power-flow formulation.
    procedure_notes: >
      LOPF is applied to the 37-zone European background grid. Spatial load
      shifts for datacenters explicitly do NOT traverse the physical transmission
      network (virtual links bypass it); LOPF applies only to other electricity
      flows in the background system.
    variant: null
    parameters: {zones: 37}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      Sec. 2.1: "This work uses a brownfield investment approach, which means
      that the model includes information about the existing assets of the
      European electricity system." Model is parametrised for year 2025 including
      decommissioning of legacy power plant fleet.
    procedure_notes: >
      Existing European electricity system assets are included as background
      capacity. Input data includes national renewable policies, decommissioning
      schedules, and system-wide assumptions parametrised for 2025. Cost and
      other assumptions from the Danish Energy Agency technology catalogue [41].
    variant: null
    parameters: {target_year: 2025}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      Sec. 2.3: "Weather-dependent power potentials for renewable energy
      technologies, including those of solar PV and onshore wind generators
      available for the 24/7 CFE matching, are simulated with hourly temporal
      resolution using the ERA5 reanalysis dataset [42] using the open-source
      tool Atlite [43]. We assume 2013 to be a representative climate year."
    procedure_notes: >
      Atlite converts ERA5 weather data to hourly capacity factor time series for
      onshore wind and solar PV at 256 regions in Europe (aggregated to 37 zones
      for the model). Single weather year 2013 is used as the representative
      climate year. Pearson correlations of hourly capacity factors across
      regions are computed directly from these simulated time series to identify
      the wind correlation falloff and solar time-lag signals.
    variant: null
    parameters: {weather_year: 2013, reanalysis: "ERA5", tool: "Atlite", spatial_resolution: "256 regions → 37 zones"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      Sec. 2.3: "The model's time horizon spans one year. All model runs are
      done with 1-hourly temporal resolution, i.e., 8760 time steps." The model
      is parametrised for a single target year (2025) with overnight investment
      in CFE assets. No multi-period pathway is modelled.
    procedure_notes: >
      Single-year overnight investment optimisation for 2025. Investment
      decisions (capacity of CFE generators and battery storage per datacenter
      location) are co-optimised simultaneously with dispatch and load-shifting
      over the full 8760-hour year.
    variant: overnight
    parameters: {target_year: 2025, time_steps: 8760, resolution: "1h"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      Sec. 3.4: The generalisation analysis runs all 56 combinations of three
      datacenters chosen from eight candidate countries, each at five flexibility
      levels (0–40%), to derive the robust linear relationship between flexibility
      and 24/7 CFE cost. "The low standard error suggests that the relationship
      is robust across different combinations of datacenters."
    procedure_notes: >
      Structured sweep over two dimensions: (1) datacenter location combinations
      — C(8,3)=56 combinations from {Denmark, Ireland, Netherlands, Germany,
      Latvia, Greece, Portugal, France}; (2) flexibility levels: 0%, 10%, 20%,
      30%, 40% of flexible load. Linear regression of cost vs flexibility slope
      across all combinations yields 1.29±0.07 €/MWh per percent flexible load.
      Individual case studies in Secs. 3.1–3.3 isolate the three signals with
      specific location pairs/triples.
    variant: structured-grid
    parameters: {location_combinations: 56, flexibility_levels: "0%, 10%, 20%, 30%, 40%", marginal_value: "1.29±0.07 €/MWh per %"}

