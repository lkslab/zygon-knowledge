paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
tier: 2
model_used: >
  PyPSA-Eur-Sec-30-path (Victoria et al. 2020), 30 nodes (one per country),
  hourly resolution, electricity + heating + hydrogen + gas sectors, myopic
  pathway 2020–2050 in 5-year steps.
scope: >
  Analyses direct vs indirect hydrogen storage dynamics and their economic
  performance across the European green transition, using FFT/CWT/Cycle-Capture
  time-frequency methods to characterise storage filling-level and price
  fluctuations in Denmark, Germany, and Italy.
methods:
  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "To analyze a decarbonization pathway for the European power system, a
      myopic approach is used. This approach, characterized by limited foresight
      over the investment period." (Sec. 2.1). The model runs 5-year investment
      steps from 2020 to 2050 without knowledge of future periods.
    procedure_notes: >
      Myopic multi-period optimisation with 5-year intervals (2020, 2025, …,
      2050). Each period solves a full-year hourly dispatch and capacity
      expansion given the inherited fleet from the prior step. The paper notes
      that myopic optimisation "may incur higher overall system costs compared
      to perfect foresight optimization due to stranded investments" (Sec. 2.1).
      The specific CO2 emission path follows a beta-distribution trajectory
      (Appendix A, Eq. S2–S4) inherited from Victoria et al. 2020.
    variant: myopic-multi-period
    parameters: {steps: "5-year intervals 2020-2050", co2_target: "95% reduction by 2050 vs 1990"}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "The PyPSA-Eur-Sec-30-path model employ a brownfield optimization
      approach, which includes existing power plant capacities until the end of
      their technical lifetime." (Sec. 2.1). Conventional power plants,
      hydroelectric stations, and PHS are "exogenously fixed in the model" and
      subject to decommissioning on reaching technical lifespan (Sec. 2.1).
    procedure_notes: >
      Existing fleet (coal, lignite, oil, nuclear, hydro, PHS) enters each
      period as fixed capacity; assets are decommissioned when they reach their
      technical lifetime. New investment is greenfield on top of this base.
      Technology lifetimes for storage components are given in Table 2 (e.g.,
      battery storage 20 yr, H2 underground 100 yr, electrolysis 25 yr, fuel
      cell 10 yr).
    variant: null
    parameters: {}

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "The full network consists of 30 nodes … The scope of the model includes
      the electricity, heating, hydrogen and gas sectors." (Sec. 2.1). Figure 1
      shows four primary buses (Electricity, Heating, Hydrogen, Methane) with
      conversion links between them.
    procedure_notes: >
      Each country node carries Electricity, Heating (urban + rural sub-buses),
      Hydrogen, and Methane buses. Conversion links include electrolysers,
      Sabatier process, fuel cells, heat pumps (ground/air), CHP, OCGT, CCGT,
      gas boilers, heat resistors. Underground H2 storage and above-ground H2
      tanks handle long-duration storage. Cross-country links are HVDC lines.
      Italy is excluded from underground H2 storage due to geological
      constraints (Sec. 2.1).
    variant: null
    parameters: {nodes: 30, temporal_resolution: "1h"}

  - slug: storage-sizing-and-duration
    role: canonical-use
    evidence: >
      The paper's central contribution is decomposing hydrogen storage into
      five distinct working pathways (ESFC, ESSE, ESSH, ESE, ESH) classified
      as 'direct' (H2 stored before use) and 'indirect' (H2 converted to
      methane before storage) H2 storage. Storage capacity and economic
      performance (LCOS, unit benefit) are tracked across all periods (Sec.
      2.1, 2.3.1, 3.2).
    procedure_notes: >
      Storage power and energy capacities are co-optimised. Direct H2 storage
      capacity is measured in MWh (tank/underground volume); indirect H2
      storage capacity is measured in MW of electrolyser supplying the Sabatier
      process directly. Battery storage has separate inverter and storage
      capacities. Key parameters from Table 2: battery storage 20 yr / 0.9
      eff., H2 underground 100 yr / 1.0 eff., H2 tank 25 yr / 1.0 eff.,
      electrolysis 25 yr / 0.8 eff., fuel cell 10 yr / 0.58 eff. Cyclic state
      of charge is tracked hourly.
    variant: null
    parameters: {discount_rate: "7%", battery_lifetime: "20 yr", h2_underground_lifetime: "100 yr", electrolysis_efficiency: 0.8, fuel_cell_efficiency: 0.58}

  - slug: shadow-prices-and-marginal-values
    role: canonical-use
    evidence: >
      "The electricity prices at specific nodes … are derived from the power
      supply and demand balance constraints at those respective nodes, meaning
      the electricity price used in this study are locational marginal prices
      (LMP). The same pricing principle applies to hydrogen." (Sec. 2.3). The
      KKT multiplier λ_n,t is identified as the LMP in Appendix A (Eq. S5).
      Sections 3.2–3.3 analyse electricity and H2 marginal price distributions
      and their spread over time as the primary driver of storage profitability.
    procedure_notes: >
      Dual variables of the nodal energy-balance constraints (one per carrier
      bus per time step) are read directly as LMPs for electricity and hydrogen.
      The paper defines Unit Benefit (Eq. 2) and Overall Price Spread (Eq. 3)
      from these duals. Buying and selling prices for storage modes are
      electricity/H2 LMPs at the times of charging and discharging,
      respectively. Analysis covers 2020–2050 in 5-year snapshots across
      Denmark, Germany, and Italy.
    variant: null
    parameters: {}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "This optimization process also should subject to various constraints …
      we have a CO2 emission cap for each time step." (Appendix A, after
      Eq. S4). The model follows a beta-distribution CO2 reduction trajectory
      targeting 95% reduction by 2050 relative to 1990 (Sec. 2.1, Appendix A).
    procedure_notes: >
      An annual CO2 emission cap is applied at each 5-year step, derived from
      a carbon budget of 21 GtCO2 for electricity and heating (calibrated to
      a global budget of 800 GtCO2 for 1.75°C at 66% probability, IPCC SR1.5).
      The emission path follows a beta-distribution CDF (Eqs. S2–S4) with early
      rapid reductions inherited from Victoria et al. 2020.
    variant: emission-cap
    parameters: {co2_budget: "21 GtCO2 (electricity + heating sectors)", target_year: 2050, reduction: "95% vs 1990"}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The term Σ C_total_cost,t represents the accumulated annualized cost,
      which includes consideration of the discount rate at 7%." (Sec. 2.3.1,
      Eq. 1, LCOS formulation).
    procedure_notes: >
      A uniform 7% discount rate is used to annualise capital costs for all
      technologies. Technology investment costs are exogenous and decrease
      year-on-year (Table 1) for wind, solar, batteries, H2 storage, and
      electrolysers. No country- or technology-specific WACC differentiation
      is stated.
    variant: null
    parameters: {discount_rate: "7%"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Land use considerations involve aggregating suitable land in each
      reanalysis grid cell based on the Corine Land Cover (CLC) database, while
      excluding Natura 2000 protected areas." (Sec. 2.5.1). Capacity factors
      for wind are derived from CFSR wind velocity data; 50% of PV is assumed
      rooftop.
    procedure_notes: >
      Inherited from the PyPSA-Eur-Sec-30-path model (Victoria et al. 2020).
      Onshore/offshore wind capacity factors built from CFSR reanalysis;
      Corine Land Cover exclusion of Natura 2000 areas determines installable
      potentials. Rooftop PV assumed 50% of total PV capacity.
    variant: null
    parameters: {}

unmatched_methods:
  - name: "time-frequency volatility analysis (FFT + CWT + Cycle Capture)"
    evidence: >
      The paper's core qualitative contribution is a three-method time-frequency
      decomposition of storage filling levels, renewable generation, and
      electricity prices: Fast Fourier Transform (FFT, Eq. 4), Continuous
      Wavelet Transform with Morlet mother wavelet (CWT, Eq. 5–6), and a
      novel 'Cycle Capture' (CC) method (Sec. 2.4) that detects charge/
      discharge cycles using user-defined amplitude thresholds (10% for storage
      and generation, 5% for prices). CC tracks exact cycle start/end indices
      and is used to compute Overall Price Spread (Eq. 3). No existing slug
      covers post-hoc signal-decomposition methods applied to model output time
      series rather than temporal aggregation of model inputs.
