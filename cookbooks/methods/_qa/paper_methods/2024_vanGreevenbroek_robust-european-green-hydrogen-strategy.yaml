paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
tier: 2
model_used: >
  PyPSA-Eur v0.13 (with modifications), sector-coupled, 50 nodes (k-means),
  750 time-steps per year (segmentation), 6 planning horizons 2025–2050 in
  5-year steps, myopic foresight multi-horizon.
scope: >
  Shows that a European green hydrogen production target of ~25 Mt by 2040 is
  near-optimal (within 10% of cost-optimal) across 216 scenarios spanning CCS
  potential, biomass availability, green fuel imports, electrolyser costs,
  transportation electrification rates and weather years, by combining large-scale
  scenario analysis with a novel MGA extension to myopic multi-horizon optimisation.
methods:
  - slug: mga-near-optimal-space
    role: extends
    evidence: >
      "We develop a novel methodology to apply the near-optimal perspective to
      sequential optimisation over multiple planning horizons ('myopic foresight
      multi-horizon optimisation')." (Sec. Near-optimal modelling, Methods). The
      paper formally defines the epsilon-near-optimal space for each planning
      horizon conditioned on solutions from the previous horizon (Eq. 1), then
      projects to the scalar of total green hydrogen production and min/maximises
      it at each horizon with epsilon = 2%, 5%, 10%.
    procedure_notes: >
      At each planning horizon i, the near-optimal feasible set F_epsilon^(i) is
      defined as solutions that are (a) within (1+epsilon)*c_i* of the cost-optimal
      cost at horizon i, and (b) reachable from some solution in F_epsilon^(i-1).
      Max/min sequences x_i^max and x_i^min are then computed greedily horizon by
      horizon (not globally optimal over all horizons combined). Three slack levels
      epsilon = 2%, 5%, 10% are used. 216 scenarios × 6 horizons × (1 cost-opt +
      2×3 near-opt) = 1296 cost-optimisations and 3888 min/max runs. Authors note
      this approach yields conservative near-optimal range estimates. Robust
      corridors are computed as the intersection (or q-quantile variant) of all
      per-scenario near-optimal intervals at each horizon.
    variant: myopic-multi-horizon-min-max
    parameters:
      slack_levels: "2%, 5%, 10%"
      scenarios: 216
      planning_horizons: "2025, 2030, 2035, 2040, 2045, 2050"
      objective: "min/max annual electrolytic H2 production"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model is run with myopic planning foresight: optimisations are carried
      out at each planning horizon without foresight to future time horizons. At
      each planning horizon, those capacities from previous horizons that have not
      yet reached the end of their lifetime are carried over." (Sec. Model set-up,
      Methods). The paper explicitly acknowledges this as a limitation: "Modelling
      with myopic foresight over the planning horizons (as opposed to perfect
      foresight) can lead to sub-optimal transition pathways." (Limitations).
    procedure_notes: >
      Six 5-year planning horizons (2025, 2030, 2035, 2040, 2045, 2050). At each
      horizon, a greenfield-like optimisation is solved subject to inherited
      (carried-over) existing capacities not yet at end-of-life, which are held
      fixed. Costs annualised at 7% discount rate. Technology costs retrieved from
      the technology-data repository v0.9.2.
    variant: myopic-sequential
    parameters:
      horizons: "2025, 2030, 2035, 2040, 2045, 2050"
      discount_rate: "7%"
      step: "5 years"

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "Currently existing power plants, transmission infrastructure, gas pipelines
      and storage and heating infrastructure are added to the initial 2025 model."
      (Sec. Model set-up, Methods). Capacities from previous horizons "that have
      not yet reached the end of their lifetime are carried over" at each planning
      horizon. The paper also developed build-year aggregation to handle the
      accumulation of vintage components computationally (Sec. Build year
      aggregation).
    procedure_notes: >
      Existing capacity (brownfield) is included at the 2025 start. Between horizons,
      surviving capacity is carried over; end-of-life components are phased out.
      Build-year aggregation was added as a PyPSA-Eur modification: components with
      identical properties built at different horizons are merged before each solve
      and disaggregated after, saving >2× memory at later horizons. Electrolysers
      and process emission CCS components excluded from aggregation due to improving
      efficiencies over time. Aggregation error <0.04% on average.
    variant: myopic-carryover-with-build-year-aggregation
    parameters:
      aggregation_error: "<0.04% avg, <0.34% max"

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "The model (based on PyPSA-Eur) includes representations of the electricity,
      gas, heating, transportation and industry sectors, and is run at high spatial
      and temporal resolution." (Results, p. 4). "The model includes representations
      of the electricity, heating, transportation and industrial sectors, maintaining
      energy balances across electricity, hydrogen, gas, oil, biomass, ammonia and
      methanol as well as explicitly keeping track of CO2 balances." (Sec. Model
      set-up, Methods).
    procedure_notes: >
      Multi-carrier network with buses for electricity, heat, hydrogen, gas (spatially
      resolved), and model-wide buses for oil, biomass, ammonia, methanol and CO2.
      Conversion links include electrolysis, SMR ±CCS, Fischer-Tropsch, Sabatier,
      Haber-Bosch, methanolisation, biomass-to-methanol, DAC, CHP ±CCS, fuel cells,
      heat pumps, etc. CO2 is explicitly tracked through temporary and permanent
      storage. Process heat demand was endogenised (low/medium/high temperature
      segments) via a modification based on PyPSA-Eur PR #611.
    variant: null
    parameters:
      carriers: "electricity, heat, hydrogen, gas, oil, biomass, ammonia, methanol, CO2"
      nodes: 50

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "A model-wide cap on CO2 emissions is gradually tightened in line with EU
      targets: 55%, 90% and 100% reductions by 2030, 2040 and 2050, respectively."
      (Results, p. 4). "Emissions are limited by restricting the net amount of CO2
      released to the atmosphere." (Sec. The carbon cycle and emissions, Methods).
    procedure_notes: >
      Emissions cap applied as percentage of 1990 EU levels: 35% by 2025, 45% by
      2030, linearly interpolated at 2035 and 2045 to 10% by 2040 and 0% by 2050.
      CO2 sequestration potential is one of the six scenario dimensions (three levels:
      25/125/275, 50/250/550, 100/500/1100 Mt/a by 2030/2040/2050) and has a
      marginal cost (15–30 EUR/tCO2 depending on scenario). Agriculture and LULUCF
      emissions are included for EU countries (Table 7).
    variant: annual-cap-with-scenario-sweep
    parameters:
      cap_levels: "35% of 1990 in 2025, 45% in 2030, 10% in 2040, 0% in 2050"
      sequestration_scenarios: "25/125/275, 50/250/550, 100/500/1100 Mt/a by 2030/2040/2050"
      sequestration_cost: "15–30 EUR/tCO2"

  - slug: import-and-trade-representation
    role: routine-use
    evidence: >
      "We change PyPSA-Eur to allow for the import of gas, oil, ammonia, methanol
      and hydrogen as 'green' fuels, meaning that the fuels are carbon-neutral."
      (Sec. Energy supply, conversion and storage, Methods). Green fuel import
      potential is one of the six scenario dimensions (restricted vs unrestricted).
    procedure_notes: >
      Import costs from Hampp et al. (Table 6) for hydrogen, ammonia, methanol, oil
      and gas, declining from 2025 to 2050. In the pessimistic scenario (a), total
      imports cannot exceed domestic green hydrogen production (by energy content).
      In scenario (b), imports are unrestricted. Fuels that are spatially resolved
      (gas, hydrogen) can be imported to any node.
    variant: carbon-neutral-commodity-imports
    parameters:
      import_carriers: "H2, ammonia, methanol, synthetic oil, synthetic gas"
      import_scenarios: "(a) capped at domestic H2 production, (b) unlimited"

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The model is configured with a spatial scale of 50 nodes (see Fig. 2) to
      represent the modelling region…𝑘-means clustering is used to cluster smaller
      regions corresponding to transmission substations down to 50 regions based
      [on] renewable energy capacity factor and electricity load time series."
      (Sec. Spatial and temporal resolution, Methods).
    procedure_notes: >
      50 nodes covering EU (minus Cyprus and Malta) plus UK, Switzerland, Norway and
      most Balkan countries. k-means clustering on renewable CF and load time series.
      Electricity, heat, hydrogen and gas are spatially resolved; oil, biomass,
      ammonia, methanol and CO2 are not. Validated against a 60-node model.
    variant: kmeans-on-cf-and-load
    parameters:
      nodes: 50
      validation_nodes: 60

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "In the temporal dimension, we aggregated hourly time-steps (8760 over one
      year) down to 750 time-steps using a segmentation approach, which is known to
      be more accurate than the equivalent ~11.6-hourly uniform aggregation."
      (Sec. Spatial and temporal resolution, Methods, citing Pineda & Morales 2018
      and Kotzur et al. 2018).
    procedure_notes: >
      8760 hourly time-steps compressed to 750 using chronological time-period
      segmentation (Pineda & Morales 2018). Validated against a 2000 time-step /
      60-node model; maximum relative error 3.7% across evaluated metrics. Validation
      conducted over 2040, 2045 and 2050 horizons for two CCS scenarios with both
      cost-optimisation and H2 min/max at 5% slack.
    variant: segmentation
    parameters:
      timesteps: 750
      full_year: 8760
      validation_timesteps: 2000
      max_validation_error: "3.7%"

  - slug: weather-year-ensembles
    role: routine-use
    evidence: >
      "The selected weather years represent a relatively difficult (1987) and easy
      (2020) year from the 1980–2020 period." (Sec. Scenario assumptions, Methods,
      citing Grochowicz et al. 2024). Weather year is one of the six scenario
      dimensions.
    procedure_notes: >
      Two weather years used: 1987 (difficult) and 2020 (easy), identified using
      power-system modelling outputs (Grochowicz et al. 2024). ERA5 reanalysis data
      used. Each of the 216 scenarios is run for both years, giving 432 full-pathway
      optimisation sets. The paper does not explicitly stress-test for extreme events
      beyond the choice of 1987 as a hard weather year.
    variant: two-year-bracket
    parameters:
      weather_years: "1987, 2020"
      reanalysis: "ERA5"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "Using a global sensitivity analysis across our scenarios (Table 1), we show
      that the electrolysis, CCS potential and transportation electrification settings
      have the biggest impact on cost-optimal levels of green hydrogen production."
      (Sec. Sensitivity of green hydrogen production). Linear regression coefficients
      over 216 × 3 horizons = 648 data points computed per sense (min/opt/max).
    procedure_notes: >
      Six scenario categories each with 2–3 levels, enumerated exhaustively (216
      combinations). Sensitivity coefficients computed as linear regression
      coefficients (OLS) of total H2 production on dummy variables for each
      category. Separate 27-run analysis for the three sub-parameters of CCS
      potential (sequestration cap, sequestration cost, CC capital cost).
    variant: full-factorial-ols
    parameters:
      scenarios: 216
      regression_points: 648
      categories: "CCS, biomass, imports, electrolyser cost, transport electrification, weather year"

  - slug: demand-side-flexibility-representation
    role: routine-use
    evidence: >
      "Under the assumption that 50% of electric vehicles participate in demand-side
      management and can provide vehicle-to-grid (V2G) services, the total amount of
      storage available to the model reaches about 5.2 TWh in 2050…Electric vehicle
      battery storage is constrained to be charged to at least 75% at 7:00 every
      morning." (Sec. Energy supply, conversion and storage, Methods).
    procedure_notes: >
      EV battery storage sized exogenously following exogenous vehicle fleet
      electrification pathway. 50% of EVs participate in V2G. 80% of V2G-enabled
      vehicles on average connected to grid at any time (daily profile). Minimum
      state-of-charge constraint of 75% by 7:00 each day. Storage capacity not
      subject to optimisation — follows exogenous fleet electrification shares.
    variant: v2g-with-soc-constraint
    parameters:
      v2g_participation: "50% of EVs"
      grid_connection_avg: "80%"
      min_soc: "75% by 07:00"
      total_v2g_storage_2050: "~5.2 TWh"

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      Hydrogen can be stored underground in salt caverns where available (Caglayan
      et al. 2020), and in compressed tanks where salt caverns are not available,
      both expandable. Gas storage of ~1300 TWh existing infrastructure included.
      Expandable hot water tanks for heat storage. Grid-connected batteries
      expandable. (Sec. Energy supply, conversion and storage, Methods).
    procedure_notes: >
      Electricity: expandable grid batteries + non-expandable pumped hydro (8.7 TWh /
      56.9 GW) + reservoir hydro (152.4 TWh / 103.1 GW). Hydrogen: expandable salt
      cavern storage (technical potential ~2700 TWh, rarely binding) + compressed
      tanks. Gas: ~1300 TWh existing underground storage (further expansion possible
      but not used by model). Heat: expandable hot water tanks. Oil/methanol/ammonia:
      expandable tanks. All storage independently sized in optimisation except EV
      batteries.
    variant: null
    parameters:
      h2_storage_potential: "~2700 TWh (salt caverns)"
      pumped_hydro: "8.7 TWh / 56.9 GW"
      gas_storage: "~1300 TWh existing"

unmatched_methods: []
