paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
tier: 1
model_used: >
  A bespoke PyPSA model (PyPSA v0.27.1, linopy v0.3.8, Gurobi v11.0.2); single-node,
  electricity-only, three European countries (Germany, Spain, UK), 70-year hourly
  weather series, technologies: onshore wind, solar PV, batteries, hydrogen-based
  long-duration storage. No PyPSA-Eur or PyPSA-Earth; custom capacity expansion
  and dispatch experiments built directly on the PyPSA library.
scope: >
  Analyses price formation in energy-only electricity markets with high shares of
  zero-marginal-cost wind and solar, showing that demand elasticity (not fuel costs)
  stabilises prices, enables cost recovery, and permits myopic storage dispatch —
  countering the view that energy-only markets break down without fuel costs.
methods:
  - slug: price-formation-and-scarcity-rents
    role: defines
    evidence: >
      The paper's central contribution is a theoretical and empirical account of how
      electricity prices are set in a system with zero-marginal-cost VRE, storage and
      elastic demand. Section 2 ("Theory") derives price formation from KKT stationarity
      conditions: prices are set by demand willingness-to-pay, storage charging/
      discharging bids (at the marginal storage value, MSV), or VRE zero-cost supply.
      Section 4 demonstrates that the fraction of zero-price hours falls from ~89% to
      ~31% when demand elasticity (-5%) is added.
    procedure_notes: >
      Long-term (LT) capacity expansion model maximises social welfare; short-term (ST)
      model fixes capacities and optimises dispatch only. Electricity price = shadow
      price lambda_t of the hourly energy balance. MSV for each storage unit = shadow
      price lambda^s_t of the storage balance constraint. Four demand curve shapes
      compared (perfectly inelastic, VOLL step-function at 2000 €/MWh, linear, and
      piecewise-linear log-log). KKT stationarity equations show storage bids with
      effective cost (eta^f_s)^{-1} lambda^s_t, acting like a fuel cost. Results cover
      Germany, Spain, UK with 70 years of ERA-based hourly weather data (1951-2020).
    variant: demand-elastic-kkt-analysis
    parameters:
      elasticity: "-5% at average price (100 €/MWh), empirically measured in German market"
      voll: "2000 €/MWh"
      piecewise_segments: 3
      countries: "Germany, Spain, UK"
      weather_years: 70

  - slug: shadow-prices-and-marginal-values
    role: extends
    evidence: >
      Section 2.2 formally maps electricity prices and marginal storage values (MSV /
      water value / Bellman value) to dual variables of the LP/QP optimisation. The paper
      proves (Section 2.3) that LT and ST model prices are identical if and only if the
      inverse demand curve provides a unique, strictly monotonically decreasing mapping
      from demand to price, a new condition not previously established for storage systems.
      "The electricity price corresponds to the shadow price of the energy balance
      constraint lambda_t, while the MSV for each storage unit is given by lambda^s_t."
      (Sec. 2.2, Eq. 2)
    procedure_notes: >
      Duals extracted analytically via KKT conditions for the LT model; numerically
      from LP/QP solver for both LT and ST models. Interior-point method without
      crossover (Gurobi v11.0.2) used to avoid degenerate primal solutions that would
      cause dual non-uniqueness. Comparison between LT-model shadow prices and
      ST-model shadow prices with fixed capacities is the central test.
    variant: lt-st-price-equivalence
    parameters:
      solver: "Gurobi v11.0.2 interior-point, barrier tolerance 1e-7"

  - slug: weather-year-ensembles
    role: canonical-use
    evidence: >
      The paper runs the same model over 70 historical weather years (1951-2020) to
      characterise price stability between years. "We use 70 years of data for different
      countries to capture a wide variety of weather conditions" (Sec. 3.1). Inter-annual
      variability is central to the paper's thesis: perfectly inelastic demand causes
      large price variance across years (high prices clustering in wind-scarce 1960s),
      while elastic demand gives consistent price duration curves as years are added
      (Fig. 3a vs 3b).
    procedure_notes: >
      Hourly weather data from Bloomfield et al. (2022) ESSD dataset; ERA5-based
      reanalysis. Capacity expansion run over 1, 4, 16, 32, 48, and 70 years using a
      Fischer-Yates shuffled sequence (seed 123). For myopic dispatch analysis: 35
      randomly selected years for LT, remaining 35 for out-of-sample ST test.
    variant: 70-year-era5-ensemble
    parameters:
      weather_years: 70
      period: "1951-2020"
      data_source: "Bloomfield et al. (2022) ESSD, ERA-based"
      year_subsets: "[1, 4, 16, 32, 48, 70]"
      lt_years: 35
      st_test_years: 35

  - slug: foresight-and-planning-horizons
    role: canonical-use
    evidence: >
      The paper compares three foresight regimes explicitly: (1) LT perfect-foresight
      capacity expansion over all years, (2) ST perfect-foresight dispatch with fixed
      capacities from LT, and (3) ST myopic dispatch with 96-hour rolling horizon.
      "Assuming perfect foresight over multiple years, where future periods of scarcity
      and abundance are fully anticipated, is unrealistic." (Sec. 3.3)
    procedure_notes: >
      LT model: overnight capacity expansion (single optimisation over all weather years
      simultaneously, no multi-period investment pathway). ST perfect-foresight: dispatch
      only over same years. ST myopic: rolling-horizon with 96-hour look-ahead and
      48-hour overlap between windows. Chemical (hydrogen) storage dispatched with
      constant MSV equal to the mean lambda^s_t from the LT model as a bidding heuristic.
      Sensitivity with 48-hour foresight window also tested.
    variant: overnight-plus-myopic-rolling
    parameters:
      foresight_horizon: "96 hours (rolling), 48-hour overlap"
      sensitivity_horizon: "48 hours"
      lt_mode: "overnight capacity expansion"

  - slug: operational-dispatch-and-rolling-horizon
    role: canonical-use
    evidence: >
      Myopic dispatch is a core experiment: "For cases with myopic foresight, we apply a
      rolling-horizon dispatch optimisation with a 96-hour look-ahead horizon and a
      48-hour overlap between windows." (Sec. 3.3). Results show cost recovery and price
      duration curves under this approach versus perfect foresight (Fig. 6, Fig. 7).
    procedure_notes: >
      Capacities fixed from LT model. Rolling window: 96-hour horizon, 48-hour overlap
      (only first 48 hours of each window are kept). Chemical storage bid with a constant
      MSV equal to mean of LT model's lambda^s_t — not state-of-charge dependent.
      Battery storage dispatched within each window's perfect foresight. Peak load
      shedding increases 13.9% vs perfect foresight; average load served reduced by 0.5%.
    variant: rolling-96h-constant-msv-bid
    parameters:
      horizon: "96 hours"
      overlap: "48 hours"
      chemical_storage_bid: "constant mean MSV from LT model"

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      Battery (short-duration) and hydrogen cavern storage (long-duration) are both
      co-optimised for power and energy capacity independently in the LT model. Energy-
      to-power ratios emerge endogenously. The paper analyses how storage arbitrage and
      marginal storage values determine cost recovery and price formation. "The electricity
      price... only zero in the case that the VRE availability exceeds both the peak of
      the regular demand and the storage charging capacity." (Sec. 2.1)
    procedure_notes: >
      Three separate capacity variables for storage: discharge power F_s, charge power
      H_s, energy E_s — all optimised independently. Hydrogen cavern storage cost 0.15
      €/kWh (Appendix C, Table S1). Battery: 150.3 €/kWh storage, 169.3 €/kW inverter.
      Cyclic state-of-charge constraint implied by storage balance equation (Eq. 2).
    variant: independent-power-energy-sizing
    parameters:
      battery_inverter_cost: "169.3 €/kW"
      battery_storage_cost: "150.3 €/kWh"
      h2_cavern_cost: "0.15 €/kWh"
      h2_turbine_efficiency: "50%"
      electrolysis_efficiency: "62.2%"
      discount_rate: "7%"

  - slug: demand-side-flexibility-representation
    role: extends
    evidence: >
      The paper implements price-elastic demand as a welfare-maximising decision variable
      with four functional forms (perfectly inelastic, VOLL step, linear, piecewise-
      linear log-log), and tests cross-price elasticity between hours in Appendix B.
      "If short-term elasticity to reflect today's flexible demand (-5%) is implemented
      in the model, these problems are significantly reduced." (Abstract). The paper
      critiques virtual-storage representations of DSM: "Modelling DSM with virtual
      storage units is not sufficient to resolve pricing problems... sloped demand curves
      with smoothly varying WTP are what is needed." (Sec. 5.1)
    procedure_notes: >
      Elastic demand modelled as a utility-maximisation objective term U_c,t(d_c,t).
      Linear demand: quadratic utility (QP). PWL log-log: three-segment piecewise linear
      approximation, parameters a=(8000,400,200), b=(80,40,20), D=(95,5,10) MW,
      yielding -5% elasticity at 100 €/MWh. Numerically stabilised by substituting
      d_c -> D_c - g_c (Appendix A), converting demand variable to load-shedding generator.
      Cross-elasticity tested with gamma_c = b_c/16, T_hat=4h window (Appendix B).
      Empirical basis: Arnold (2023) EWI Working Paper on German market.
    variant: piecewise-linear-log-log
    parameters:
      elasticity: "-5% at 100 €/MWh (default), -10% and -2.5% in sensitivity"
      demand_segments: 3
      cross_elasticity_window: "4 hours"
      cross_elasticity_coeff: "b_c/16"

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      A uniform discount rate of 7% is applied to annualise investment costs for all
      technologies. "A uniform discount rate of 7% is assumed." (Appendix C, Table S1)
    procedure_notes: >
      Technology cost data mostly from Danish Energy Agency 2030 projections; currency
      year 2020. Fixed O&M as percentage of overnight investment. Discount rate used
      to compute capital recovery factors for each technology lifetime.
    variant: null
    parameters:
      discount_rate: "7%"
      cost_basis: "DEA 2030 projections, currency year 2020"

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      Capacity perturbations of ±5% around the LT equilibrium are applied to all
      generation and storage capacities to test price sensitivity. Elasticity
      sensitivity at -2.5%, -5%, -10% is also tested. "We then perturb all capacities
      of generation and storage up and down by 5% to reveal how sensitive the prices
      are to capacities away from the long-term equilibrium." (Sec. 3.1)
    procedure_notes: >
      Perturbations applied uniformly to all asset capacities in the ST model with
      fixed LT capacities. Demand curve elasticity swept across three levels. Foresight
      horizon swept (48h vs 96h). Conventional dispatchable capacity inclusion tested
      as sensitivity (Fig. S3, S4). Results reported for Germany (main body) and Spain,
      UK (Appendix F).
    variant: capacity-perturbation-plus-elasticity-sweep
    parameters:
      capacity_perturbation: "±5%"
      elasticity_levels: "[-2.5%, -5%, -10%]"
      foresight_sensitivity: "[48h, 96h]"

  - slug: custom-constraints-with-linopy
    role: routine-use
    evidence: >
      The model is implemented using PyPSA v0.27.1 and linopy v0.3.8. "The modelling
      framework used is Python for Power System Analysis (PyPSA), and the open source
      code to reproduce our experiments is available on GitHub" (Sec. 3.1). Linopy is
      cited for formulating the LP/QP problems.
    procedure_notes: >
      Standard PyPSA formulation for dispatch and capacity variables; custom utility
      function terms added to objective via linopy API. QP formulation for linear and
      PWL demand. Interior-point solver (Gurobi) used without crossover to avoid
      degenerate duals. Numerical stabilisation substitution described in Appendix A
      implemented as custom constraint/objective modification.
    variant: null
    parameters:
      pypsa_version: "0.27.1"
      linopy_version: "0.3.8"
      solver: "Gurobi 11.0.2"
      threads: 32
      memory_max: "22 GB"
      barrier_tolerance: "1e-7"

unmatched_methods: []
