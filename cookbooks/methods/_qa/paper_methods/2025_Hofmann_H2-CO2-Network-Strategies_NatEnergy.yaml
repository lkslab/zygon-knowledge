paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
tier: 1
model_used: >
  PyPSA-Eur (sector-coupled), 90 nodes, 3-hourly temporal resolution, single
  target year 2050 (overnight/greenfield), all major energy sectors included.
scope: >
  Co-optimisation of H2 and CO2 pipeline networks in a fully sector-coupled
  European energy system to assess their competition and synergy for carbon
  management (capture, utilisation, sequestration) under net-zero and net-negative
  CO2 targets.
methods:
  - slug: carrier-network-routing-h2-co2
    role: canonical-use
    evidence: >
      "The topology and capacities of the electricity transmission system are
      taken from the ENTSO-E transparency map... The topology of the H2, CO2 and
      gas network is identical to the topology of the electricity network,
      connecting all neighbouring regions." (Methods section). Four scenarios
      compare Baseline (no networks), CO2-Grid, H2-Grid, and Hybrid, with H2
      and CO2 pipeline capacities co-optimised endogenously.
    procedure_notes: >
      H2 pipelines can be expanded without limits (costs for segments and
      compressors included); CO2 pipelines likewise expandable. Net transfer
      capacities used, no flow dynamics or pressure valves. Average H2 pipeline
      loss 1.2% per 1000 km, compression energy 1.8% per 1000 km; CO2 pipeline
      loss 0.8% per 1000 km, compression 250 kWh/t per 1000 km. No gas pipeline
      retrofitting to H2 considered.
    variant: null
    parameters: {h2_loss_per_1000km: "1.2%", co2_loss_per_1000km: "0.8%", nodes: 90}

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "The model optimizes the design and operation of the European energy system,
      encompassing the power, heat, industry, agriculture, and transport sectors,
      including international aviation and shipping." (Methods). Carriers include
      electricity, heat, hydrogen, methane, methanol, liquid hydrocarbons, biomass,
      and CO2.
    procedure_notes: >
      Full PyPSA-Eur sector-coupled setup for 2050. Carbon management treated
      as distinct technologies: carbon capture (CC), carbon utilisation (CU),
      and carbon sequestration (CS) modelled separately. Three CU drop-in fuels:
      methanation, methanolization, Fischer-Tropsch synthesis. DAC included.
      Underground H2 storage in salt caverns; CO2 short-term tank storage and
      long-term offshore geological sequestration.
    variant: null
    parameters: {nodes: 90, temporal_resolution: "3h", target_year: 2050}

  - slug: carbon-constraints-and-pricing
    role: canonical-use
    evidence: >
      "We limit the total amount of sequestered CO2 to 200 Mt/a for our net-zero
      CO2 emission target and 660 Mt/a for our net-negative emission target. This
      constraint is deliberately implemented to avoid over-reliance on carbon
      capture and sequestration as a backstop technology." (Methods). Shadow
      prices of the sequestration constraint reported (225 €/t at 200 Mt/a,
      51 €/t at 800 Mt/a).
    procedure_notes: >
      Net-zero target implemented as a global annual CO2 sequestration cap of
      200 Mt/a. Net-negative target requires removal of 460 Mt CO2 (10% of 1990
      emissions) with cap of 660 Mt/a sequestration. Sensitivity runs vary
      sequestration limit from 200 to 800 Mt/a (Appendix A.3).
    variant: annual-cap
    parameters: {net_zero_seq_cap_Mt_per_a: 200, net_negative_seq_cap_Mt_per_a: 660, net_negative_removal_Mt: 460}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "At 200 Mt/a, the shadow price of the sequestration constraint shows that
      each additional tonne saves 225 €/t, but at 800 Mt/a, this saving drops to
      51 €/t." (Appendix A.3). Regional marginal carbon capture costs and hydrogen
      prices reported across scenarios (e.g. H2 60–95 €/MWh, CC 105–160 €/t).
    procedure_notes: >
      Dual variables of the sequestration cap read as shadow prices. Regional
      average marginal prices for H2 and CO2 reported on maps (Figs. 4, 5).
      Merit order of carbon capture technologies derived from marginal cost of
      captured CO2 per technology.
    variant: null
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The model's perfect foresight may lead to non-reproducible technology
      dispatch which neglects uncertainties from long-term predictions." (Appendix
      A.1). The model spans one year with all investment and dispatch decided
      simultaneously for a 2050 target year.
    procedure_notes: >
      Overnight/greenfield single-year optimisation for 2050. All technology cost
      assumptions taken for year 2040 (from open-source database). No existing
      fleet vintaging; no myopic pathway.
    variant: overnight
    parameters: {target_year: 2050, cost_year: 2040}

  - slug: discounting-and-cost-of-capital
    role: routine-use
    evidence: >
      "The database applies a discount rate of 7% for all major technologies,
      accounting for the weighted average costs of capital (WACC) of investments."
      (Methods, citing technology-data database).
    procedure_notes: >
      Uniform 7% WACC applied to all technologies via the PyPSA/technology-data
      open-source database (v0.5.0, Zenodo). Annualisation done by the database
      before import; not varied in sensitivity runs.
    variant: null
    parameters: {wacc: "7%"}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "In our configuration, the model's time horizon spans one year, with a
      3-hourly temporal resolution." (Methods).
    procedure_notes: >
      Single weather year at 3-hourly resolution (8760/3 = 2920 snapshots).
      No TSAM or typical-period reduction stated; full year at 3h used directly.
    variant: null
    parameters: {resolution_h: 3, snapshots: 2920}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "A spatial resolution of 90 regions. Each of the regions consists of a
      complex subsystem with technologies for supplying, converting, storing and
      transporting energy." (Methods).
    procedure_notes: >
      90-node spatial aggregation of Europe. Network topology follows ENTSO-E
      map plus selected TYNDP projects for electricity; H2/CO2/gas network
      topology mirrors electricity topology connecting neighbouring regions.
    variant: null
    parameters: {nodes: 90}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "Solar and wind power can be expanded in alignment with land-use restrictions
      calculated, taking into account land usage classes and natural protection
      areas." (Methods, citing CORINE CLC 2012 and Natura 2000). "Weather-dependent
      power potentials for solar, wind and hydro-electricity are calculated from
      the reanalysis and satellite data sets, ERA5 and SARAH-2, per region and
      time-stamp, using the open-source tool Atlite."
    procedure_notes: >
      Atlite used for capacity-factor time series from ERA5 and SARAH-2. Land
      eligibility from CORINE Land Cover 2012 and Natura 2000 protected areas.
      Regional biomass limited to medium-level JRC-ENSPRESO potentials (residual
      biomass only, no energy crops). H2 underground storage potentials from
      Caglayan et al. salt caverns dataset.
    variant: null
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: routine-use
    evidence: >
      "We restrict the total volume of power transmission expansion to 20% of its
      current capacity... Electricity networks are already in place, and we restrict
      further extension to 25% due to concerns about public acceptance." (Methods;
      two slightly different figures stated — 20% in methods body, 25% in the
      discussion paragraph — both cap electricity grid expansion).
    procedure_notes: >
      Electricity transmission expansion co-optimised but capped at ~20–25% of
      current capacity (volume constraint). H2 and CO2 pipeline expansion
      unconstrained. Gas network treated as unconstrained existing infrastructure.
      Linearised power flow with 95.75% efficiency per 1000 km for resistive losses.
    variant: null
    parameters: {elec_expansion_cap_pct: "~20-25%"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "The Appendix in Section A.3 provides an analysis of the model's
      sensitivities. Notably, relaxing the limit from 200 to 800 Mt/a reduces
      system costs by 9.1% in the hybrid scenario." Sensitivity runs also include
      50% CO2 pipeline cost reduction (A.3.1) and 50% higher electrolysis costs
      (A.3.2).
    procedure_notes: >
      Three sensitivity dimensions run for the Hybrid (and some other) scenario(s):
      (1) sequestration limit swept from 200 to 800 Mt/a; (2) CO2 pipeline capital
      cost halved; (3) electrolysis investment cost increased by 50%. One-at-a-time
      perturbations, not a full factorial grid.
    variant: one-at-a-time
    parameters: {seq_limit_range_Mt: "200-800", co2_pipeline_cost_reduction: "50%", electrolyser_cost_increase: "50%"}

  - slug: import-and-trade-representation
    role: routine-use
    evidence: >
      "It is assumed that Europe is self-sufficient in energy and does not import
      any fuels." (Introduction). The Limitations appendix discusses implications:
      "our energy system model assumes total autarky of the European system and
      neglects potential imports from elsewhere." (Appendix A.1).
    procedure_notes: >
      No energy imports modelled; autarky assumed. The Limitations section
      explicitly discusses what green hydrogen or synthetic fuel imports would
      change, citing [62], but does not implement import scenarios. Liquid fuels
      (methanol, FT) are spatially unresolved with no inter-regional transport cost.
    variant: null
    parameters: {}

