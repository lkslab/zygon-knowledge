paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
tier: 2
model_used: >
  PyPSA-Eur-Sec v0.9.0, 37 nodes (one per country / asynchronous AC region),
  3-hourly resolution for a full year, sector-coupled (electricity, heat,
  land transport, shipping, aviation, industry, agriculture).
scope: >
  Cost-optimal myopic transition pathways for European land transport
  (ICE / EV / FCEV mix) embedded in a sector-coupled energy system, under
  carbon budgets corresponding to 1.7 °C and 2.0 °C warming; sensitivity
  analysis on DSM, V2G availability, and vehicle capital costs.
methods:
  - slug: sector-coupled-network-assembly
    role: canonical-use
    evidence: >
      "PyPSA-Eur is an open energy system model of Europe. It optimizes the
      capacity and dispatch of generators, stores, and transmission lines, as
      well as the technologies required for providing demand in the electricity,
      heating, land transport, shipping, aviation, and industrial sectors
      (including feedstock), and energy demand in agriculture." (Sec. 2 Methods
      and Materials). The multi-carrier network includes electricity, hydrogen,
      oil, CO2, and heat buses with conversion links and a shared CO2 accounting
      bus.
    procedure_notes: >
      Standard PyPSA-Eur-Sec v0.9.0 sector-coupled assembly with three
      additional endogenous transport links (EVs, FCEVs, ICE vehicles) per
      node converting their respective energy carriers into kinetic energy
      (land transport demand bus). Hydropower and pumped hydro are fixed
      exogenously at historical capacities. Transmission network is fixed
      (no expansion allowed). Model implemented with PyPSA v0.26.2.
    variant: null
    parameters: {nodes: 37, carriers: "electricity, hydrogen, oil, CO2, heat, land transport"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "The sector-coupled system is myopically optimized from 2025 to 2050 in
      five-year intervals, with each planning horizon having a 3-hourly temporal
      resolution for a full year and corresponding to a carbon budget. Myopically
      in this context means that the system is optimized sequentially and without
      knowledge of subsequent planning horizons." (Sec. 2)
    procedure_notes: >
      Six planning horizons: 2025, 2030, 2035, 2040, 2045, 2050. Each solved
      independently with fixed inherited capacities from the prior horizon.
      The 2025 horizon has the land transport mix set exogenously (96% ICE,
      4% EV); from 2030 the model optimizes the powertrain mix endogenously.
    variant: myopic
    parameters: {horizons: "2025–2050", interval_years: 5, temporal_resolution: "3h", full_year: true}

  - slug: brownfield-and-capacity-vintaging
    role: canonical-use
    evidence: >
      "For the transition path, ICE vehicles are uniformly distributed over the
      years 2011 to 2025, ensuring that the first 1/15 reaches the end of its
      lifetime in 2026, while the last 1/15 needs to be replaced after 2035.
      The already existing EVs are distributed over the years 2021 to 2025 to
      respect their low representation in earlier years." (Sec. 2). "The model
      can decommission vehicles before they reach the end of their lifetime, but
      the capital costs of those vehicles are still included in the total cost."
    procedure_notes: >
      Vehicle lifetime fixed at 15 years for all types (Table 1). ICE fleet
      vintaged uniformly across 2011-2025 cohorts; EV fleet vintaged across
      2021-2025 cohorts. Early decommissioning is allowed but the stranded
      capital cost is charged. From 2030 onwards the model builds new capacity
      endogenously per horizon with the standard myopic carry-forward.
    variant: null
    parameters: {vehicle_lifetime_years: 15, ice_vintage_range: "2011–2025", ev_vintage_range: "2021–2025", initial_ice_share: 0.96, initial_ev_share: 0.04}

  - slug: demand-side-flexibility-representation
    role: extends
    evidence: >
      "EVs have two flexibility options: DSM (demand-side management) and V2G
      (vehicle-to-grid). In this paper, a sensitivity analysis for the
      availability of V2G and DSM is performed. First, if DSM is activated, the
      battery can charge when it is cost-optimal for the whole system. Second,
      if V2G is activated, the EV battery can be discharged back into the grid."
      (Sec. 2). Three new constraints (Eqs. 1–3 and S7–S8) are introduced in
      this paper to represent a lumped EV fleet with realistic parking
      availability.
    procedure_notes: >
      DSM decouples charging from driving via an EV battery store; SOC must be
      ≥75% at 6am (Eq. S7). V2G adds a discharge link back to the electricity
      bus. Participation rate pDSM = 50% in the base scenario (100% in a
      sensitivity run). Charging capacity scaled to 5× the cost-optimal minimum
      fleet to represent parked vehicles (Eq. 2). Lumped EV battery energy
      capacity tied to charging capacity via Eq. 3. Availability profile
      avn,t inversely proportional to transport demand (Eq. S8), with avmax=0.95
      and avmean=0.8. Charger power rcharge=11 kW per vehicle; battery capacity
      EEV=67 kWh per vehicle (Supplementary Note 3). Charging and discharging
      efficiency 90%.
    variant: lumped-fleet-with-availability-profile
    parameters: {dsm_participation_base: 0.5, dsm_participation_sensitivity: 1.0, charger_kW: 11, battery_kWh: 67, charge_discharge_efficiency: 0.9, soc_min_6am: 0.75, fleet_scale_factor: 5}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "Europe's carbon budget is derived by dividing the global budget equally
      per capita which results in a 6.43% share for Europe. This share leads to
      a budget for Europe of 57.9 Gt CO2 for 2.0 °C and 29 Gt CO2 for 1.7 °C
      which is distributed over the years following an exponential decay and
      imposing carbon neutrality in 2050. The CO2 limit in every planning
      horizon depends on the overall carbon budget." (Sec. 2)
    procedure_notes: >
      Per-horizon CO2 caps derived from two global carbon budgets (1.7 °C and
      2.0 °C). Budget allocated to Europe at 6.43% of global budget, then
      distributed across planning horizons via exponential decay. Carbon
      neutrality imposed in 2050 for both pathways. A third sensitivity run
      uses no carbon budget at all (Fig. 7a). Non-CO2 agriculture emissions
      assumed offset by LULUCF.
    variant: cumulative-budget-with-exponential-decay
    parameters: {europe_budget_2C_GtCO2: 57.9, europe_budget_1p7C_GtCO2: 29.0, europe_share: 0.0643, neutrality_year: 2050}

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "Each planning horizon having a 3-hourly temporal resolution for a full
      year." (Sec. 2). "Previous analyses have shown that 3-hours is a good
      compromise to capture the most important system dynamics [32, 33]."
      (Sec. 4 Discussion)
    procedure_notes: >
      No time-series aggregation or typical period reduction — full 8760/3 = 2920
      snapshot year at 3-hour resolution. Cited references (Schlachtberger 2018,
      Schyska 2021) support this choice.
    variant: n-hourly
    parameters: {resolution_hours: 3, snapshots: 2920}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The model clusters the existing ENTSO-E transmission grid to 37 nodes,
      one per asynchronous AC region and country." (Sec. 2). "The results are
      based on a spatial resolution with 37 nodes and 3-hourly resolution which
      can underestimate regional balancing needs." (Sec. 4 Discussion)
    procedure_notes: >
      One node per country / asynchronous zone; 33 interconnected European
      countries. Clustering method not described beyond administrative
      (country-level) assignment. Authors acknowledge this may underestimate
      regional balancing costs and fuel distribution costs.
    variant: null
    parameters: {nodes: 37, countries: 33}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "To deal with cost uncertainty, we implement a sensitivity analysis, see
      Fig. 7b." (Sec. 2). Sensitivity runs cover: ±25%/±50% FCEV capital costs,
      +25%/+50% EV capital costs, reduced FCEV consumption efficiency, no carbon
      budget, no DSM, no V2G, 100% DSM participation.
    procedure_notes: >
      One-at-a-time sensitivity sweeps. Each sensitivity run is a full myopic
      2025–2050 pathway. Key metrics reported: EV/FCEV/ICE share in 2050,
      total system cost change (%), stationary battery capacity. Results shown
      as bar charts of vehicle share transitions (Figs. 7, S2–S5).
    variant: one-at-a-time
    parameters: {fcev_capex_range: "−50% to +0%", ev_capex_range: "+0% to +50%", dsm_range: "0%, 50%, 100%"}

  - slug: storage-sizing-and-duration
    role: routine-use
    evidence: >
      "When DSM and V2G are not available, additionally flexibility must be
      provided, leading to an increase in stationary battery by 61% (reaching
      3008 GWh)... compared to the Base scenario (1871 GWh)." (Sec. 3.1).
      Stationary battery storage is co-optimised alongside EV batteries across
      all scenarios.
    procedure_notes: >
      Battery storage energy and power capacity co-optimised. EV battery
      capacity is tied to fleet size via fixed energy-per-vehicle assumption
      (67 kWh) rather than independently sized. The interaction between
      stationary batteries and EV DSM/V2G is the central result of the paper.
    variant: null
    parameters: {ev_battery_kWh_per_vehicle: 67, stationary_battery_base_GWh: 1871}

unmatched_methods:
  - name: "endogenous-transport-powertrain-selection"
    evidence: >
      The paper's central methodological contribution: implementing endogenous
      capacity optimisation over three competing powertrain technologies (ICE,
      EV, FCEV) as lumped PyPSA Link components per node, with vehicle cost
      expressed in EUR/MW via unit conversion from EUR/vehicle and per-vehicle
      energy consumption (Supplementary Notes 1 and 3, Eqs. S1–S6). Transport
      demand must be met as the sum of all three powertrain outputs (Eq. S6).
      No existing slug covers endogenous modal-share / technology-mix choice
      within a single demand sector; this is distinct from demand-side
      flexibility (which covers temporal shifting) and from brownfield
      vintaging (which covers existing-fleet carry-forward).
