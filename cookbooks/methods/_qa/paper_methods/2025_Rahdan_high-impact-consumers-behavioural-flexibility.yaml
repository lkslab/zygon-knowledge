paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
tier: 2
model_used: >
  PyPSA-Eur v0.11.0, sector-coupled (electricity, heating, land transport,
  aviation, shipping, industry, agriculture), 37 nodes (synchronous zones),
  2-hourly resolution, full year, 2030 cost assumptions.
scope: >
  Compares four stylised demand-side mechanisms (constant reduction, peak
  shaving, temporal shifting, demand curtailment) applied per sector to a
  net-zero European energy system, measuring system-cost, CO2-price, capacity
  and price impacts.
methods:
  - slug: demand-side-flexibility-representation
    role: extends
    evidence: >
      "We analyse four stylised representations of service-demand reduction or
      shifting … (i) Constant service-demand reduction … (ii) Peak shaving …
      (iii) Demand time shifting … (iv) Demand curtailment" (Methods, "Modeling
      of alterations in energy service demands"). EV smart charging and V2G are
      also explicitly modelled: "Only 50% of idle vehicles allow smart charging
      and vehicle-to-grid (V2G)" (Methods, "Sector demands").
    procedure_notes: >
      Four mechanisms implemented: (i) uniform exogenous percentage reduction
      before optimisation; (ii) exogenous peak shaving to a threshold fraction
      of peak-minus-min demand; (iii) endogenous cost-free ideal lossless
      storage added at the demand bus (energy capacity swept from 0.01%–0.1% of
      annual demand, no power limit); (iv) endogenous load-shedding generator
      with zero capex and high marginal cost (threshold swept, representing a
      one-step utility function). Mechanisms (i)–(ii) are pre-optimisation;
      (iii)–(iv) are endogenous. EV batteries: 50 kWh, 11 kW, 90% efficiency,
      75%-by-7am constraint. 124 scenarios total, applied independently per
      sector.
    variant: four-stylised-mechanisms
    parameters:
      constant_reduction_range: "5–40% of sector annual demand"
      peak_shaving_range: "threshold varied; 40–60% peak shaved"
      free_storage_size_range: "0.01%–0.1% of annual sector demand"
      load_shedding_price_range: "100–400 €/MWh"
      total_scenarios: 124

  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "We use the open sector-coupled model PyPSA-Eur to analyse how changes
      in energy service demand influence the capacity and cost structure of a
      net-zero European energy system." (Methods, "Modeling framework"). Seven
      sectors included: electricity, heating, land transport, aviation,
      shipping, industry, agriculture (Methods, "Sector demands").
    procedure_notes: >
      37-node network (synchronous zones). Full multi-carrier assembly including
      HV and LV electricity buses, heat buses (urban/rural, district heating),
      land-transport bus, hydrogen bus, gas bus, CO2 bus, methanol and oil
      buses. Distribution grid modelled as HV-to-LV link with 97% efficiency.
      60% of urban heat via district heating with seasonal water tank storage.
      Greenfield except existing AC/DC transmission and hydro (fixed at current
      capacities). Transmission expandable by 20%.
    variant: null
    parameters:
      nodes: 37
      time_resolution: "2-hourly"
      sectors: "electricity, heating, land transport, aviation, shipping, industry, agriculture"
      distribution_grid_efficiency: "97%"
      urban_district_heating_share: "60%"

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "Simulations are conducted for a full year with a 2-hourly time
      resolution, assuming perfect foresight throughout the year" (Methods,
      "Modeling framework"). "The overnight approach allows for fast
      optimization and parallel running of many alternative scenarios."
      (Methods, "Modeling framework").
    procedure_notes: >
      Single target-year overnight greenfield optimisation with perfect
      foresight. Weather year 2013. Cost assumptions from technology-data
      v0.9.0 corresponding to 2030. No transition path modelled.
    variant: overnight-perfect-foresight
    parameters:
      target_year: 2030
      weather_year: 2013
      foresight: "perfect (full year)"

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "We set a net-zero CO2 emissions target. The CO2 price is obtained as
      the shadow price or Lagrange multiplier of this constraint" (Methods,
      "Modeling framework"). "A maximum of 200 MtCO2/y is allowed to be
      sequestered underground in every scenario."
    procedure_notes: >
      Annual net-zero CO2 cap enforced as a hard constraint across all
      scenarios. Underground sequestration capped at 200 MtCO2/y (only slightly
      above exogenous industrial process emissions of 127 MtCO2/y). CO2 price
      reported as the Lagrange multiplier of the cap constraint and used as an
      indicator of policy difficulty and technology economics.
    variant: net-zero-cap-with-sequestration-limit
    parameters:
      co2_target: "net-zero"
      max_sequestration: "200 MtCO2/y"
      base_co2_price: "490 €/tCO2"

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "Demand-weighted average electricity prices, based on the Lagrange
      multiplier of the energy balance constraint, decrease in all countries
      under various scenarios" (Results, "Prices become more stable…"). CO2
      price extracted as shadow price of the net-zero constraint (Methods,
      "Modeling framework"). Heating prices similarly read from dual variables
      (Fig. 5, Supplementary Figs. S16–S18).
    procedure_notes: >
      Electricity and heating nodal marginal prices read from Lagrange
      multipliers of bus energy-balance constraints. Demand-weighted annual
      average and standard deviation computed per country. CO2 price is the
      dual of the annual net-zero cap. These are reported for each of the 124
      scenarios to characterise price-level and price-variability impacts of
      demand mechanisms.
    variant: null
    parameters: {}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "The model represents Europe using 37 nodes, which are synchronous zones."
      (Methods, "Modeling framework"). Supplementary Note 1 states: "Spatial
      aggregation is performed using k-means clustering."
    procedure_notes: >
      37 nodes corresponding to synchronous zones (not further clustered from
      country level in this study). K-means clustering documented as the
      available spatial aggregation method in PyPSA-Eur (SI Note 1) but this
      paper uses the synchronous-zone resolution directly.
    variant: synchronous-zone-37-nodes
    parameters:
      nodes: 37
      clustering_method: "k-means (PyPSA-Eur default; synchronous zones used here)"

  - slug: temporal-aggregation-and-segmentation
    role: routine-use
    evidence: >
      "Temporal resolution in PyPSA-Eur can range from a single hour to a
      year. Temporal aggregation is carried out using segmentation clustering
      via the tsam package" (Supplementary Note 1). The paper itself runs at
      full 2-hourly resolution for the whole year.
    procedure_notes: >
      Full-year 2-hourly resolution (no temporal aggregation applied in this
      study). TSAM segmentation is described as the available method in SI but
      not applied here — the study runs all 8760/2 = 4380 snapshots to preserve
      extreme events important for demand-flexibility analysis.
    variant: full-year-2h
    parameters:
      time_step: "2 hours"
      snapshots_per_year: 4380

  - slug: price-formation-and-scarcity-rents
    role: routine-use
    evidence: >
      "A constant demand reduction of 5% in either electricity or heating has
      negligible impacts on average electricity price and variation … because
      although lower capacities are installed, the difficulty of meeting demand,
      which sets the price, remains unchanged." (Results, "Prices become more
      stable…"). "Demand curtailment allows removing rarely-used backup
      capacities" and produces the largest price reductions (Results).
    procedure_notes: >
      Paper analyses how each of the four demand mechanisms changes nodal
      electricity and heating price levels and variability. Finds that peak
      shaving and curtailment reduce price volatility by removing backup
      capacity (gas turbines, resistive heaters), while constant reduction
      leaves price-setting dynamics unchanged. Mechanism (iv) explicitly models
      a one-step demand elasticity / willingness-to-pay threshold.
    variant: null
    parameters:
      load_shedding_threshold_analysed: "100–400 €/MWh"

  - slug: distribution-and-voltage-aware-aggregation
    role: routine-use
    evidence: >
      "The distribution grid is modeled in each node as a single connection
      from the high-voltage (HV) to the low-voltage (LV) electricity bus with
      a 97% efficiency" (Methods, "Modeling framework"). Free storage and load-
      shedding generator for electricity are located at the LV bus (SI Note 1).
    procedure_notes: >
      Each of the 37 nodes includes an explicit HV and LV bus connected by a
      distribution-grid link (97% efficiency). Rooftop PV attaches to LV;
      utility PV and grid-scale storage attach to HV. Demand-shifting and
      curtailment for electricity are placed at LV. This distinction is used to
      explain why rooftop PV increases more than utility PV under demand
      shifting (avoids HV→LV transport losses).
    variant: hv-lv-single-link
    parameters:
      distribution_efficiency: "97%"

  - slug: import-and-trade-representation
    role: routine-use
    evidence: >
      "Methane can be produced through the Sabatier process, biogas upgrading,
      or imported as liquefied natural gas (LNG) from outside Europe" (Methods,
      "Sector demands"). Fossil oil imports also represented for aviation and
      industry.
    procedure_notes: >
      LNG imports from outside Europe are an endogenous option in the gas bus.
      Fossil oil can have fossil origin or be synthetically produced. The model
      tracks how demand reduction in one sector shifts the system's reliance on
      fossil imports in other sectors (e.g. aviation demand reduction increases
      methane imports for heating). Import volumes change endogenously with
      demand scenarios (Supplementary Fig. S11).
    variant: null
    parameters: {}

