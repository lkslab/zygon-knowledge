paper: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
tier: 1
model_used: >
  PyPSA-Eur, electricity-only, 318 NUTS2 nodes, 8760 hourly time steps, single
  target year 2030 (overnight), used for validation runs comparing two grid
  representations.
scope: >
  Methodology and validation for constructing an open, reproducible European
  high-voltage grid dataset (>=200 kV) from OpenStreetMap data, integrated into
  PyPSA-Eur; paper compares OSM-based versus ENTSO-E map-based grid on
  statistics and model outcomes.
methods:
  - slug: distribution-and-voltage-aware-aggregation
    role: defines
    evidence: >
      The paper introduces a 4-step OSM-to-PyPSA workflow that explicitly
      preserves voltage-level information: buses at different voltage levels
      within the same substation are distinguished and linked by transformers
      ex-post; AC lines are filtered to >=200 kV; and multiple voltage levels
      in a single OSM way are split into separate entries (Methods, Steps 2-4).
      "We filter for the entries with a voltage level including and above AC 200
      kV." Line capacities are mapped to voltage-level-specific pandapower
      standard types rather than a single uniform voltage (Table 8).
    procedure_notes: >
      Step 2 cleans tag columns per voltage level (220 kV to 750 kV). Step 3
      clusters buses within 5000 m radius, then aggregates by station ID AND
      voltage/AC-DC type to maintain voltage-level separation. Transformers are
      added between AC buses of different voltage levels at the same substation.
      Converters link DC endpoints to the closest AC bus. The resulting network
      has 5848 buses, 7320 AC lines/cables, 36 DC links, and 1059 transformers.
    variant: osm-voltage-aware-topology
    parameters: {bus_merge_radius_m: 5000, voltage_threshold_kV: 200, n_buses: 5848, n_ac_lines: 7320, n_dc_links: 36, n_transformers: 1059, total_route_km: 261757}

  - slug: n-1-security-and-contingency
    role: routine-use
    evidence: >
      A 0.7 derating factor is applied to line thermal ratings to approximate
      N-1 security margins: "We apply a factor of 0.7 to approximate the N-1
      security margin (Eq. 2)." This is hard-coded into the OSM network
      construction step (Step 4, Methods). The validation runs explicitly
      disable dynamic line rating to isolate the grid topology effect.
    procedure_notes: >
      Applied as a uniform multiplicative derating: S_n-1 = 0.7 * S_nom (Eq.
      2). Not modelled as explicit contingency constraints — it is a capacity
      reduction heuristic consistent with previous PyPSA-Eur practice (cited
      as ref 12 and 36). The factor is configurable in the PyPSA-Eur config
      file.
    variant: derating-margin
    parameters: {s_max_pu_factor: 0.7}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      For the comparative model runs, both grid representations are clustered
      to 318 NUTS2 administrative regions to make them comparable: "As the
      number and exact locations of buses differ, we cluster the networks to
      make them comparable (N = 318 regions/buses)." (Technical Validation,
      'Comparison of model results'). Clustering maps buses to administrative
      boundaries (NUTS2) rather than a topology- or resource-based algorithm.
    procedure_notes: >
      Administrative-boundary clustering used instead of k-means or
      hierarchical topology clustering, in order to isolate grid-topology
      differences. Non-NUTS countries (Ukraine) use geoBoundaries level 1;
      Moldova kept at full substation resolution (8 nodes). The clustering
      process in PyPSA-Eur transforms all transmission lines to a default
      voltage of 380 kV. Result: 318 buses/regions per network.
    variant: administrative-boundary
    parameters: {n_clusters: 318, boundary_system: "NUTS2"}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      The validation runs use a single target year (2030) with overnight
      investment: "We focus on the electricity sector, taking techno-economic
      assumptions projected for the year 2030. We allow for capacity expansion
      in renewable energy as well as gas-fired generation capacities."
      (Technical Validation, 'Comparison of model results').
    procedure_notes: >
      Single-year overnight optimisation. Greenfield expansion of renewables
      and gas; no grid expansion allowed in validation runs. Carbon price set
      to 100 EUR/tonne CO2. Model runs at hourly resolution (8760 time steps).
    variant: overnight
    parameters: {target_year: 2030, temporal_resolution_h: 1, n_timesteps: 8760, co2_price_EUR_per_t: 100}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      The validation runs impose a carbon price of 100 EUR per tonne of CO2:
      "We set the carbon price to 100 e per tonne of CO2 emitted."
      (Technical Validation, 'Comparison of model results').
    procedure_notes: >
      Emissions price instrument (not a cap). Used solely to make the
      validation runs realistic rather than to study carbon pricing; the paper
      does not analyse the sensitivity of results to this price.
    variant: null
    parameters: {co2_price_EUR_per_t: 100}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      PyPSA-Eur uses linearised (DC) optimal power flow throughout. The paper
      derives AC line electrical parameters (impedance, reactance, apparent
      power) from OSM geometry and pandapower standard types (Step 4, Eq. 1)
      and validates them against the 50Hertz static grid model (Figure 15).
      The optimisation problems each required up to 274 iterations to converge,
      taking more than 18 hours on HPC (AMD EPYC 7543, up to 130 GB memory).
    procedure_notes: >
      Electrical parameters calculated from line geometry, circuit count, and
      pandapower standard library types (Table 8). Impedance and reactance
      compared per-line to 50Hertz static grid model as validation (Figure 15).
      Solver convergence: up to 274 iterations, >18 h per run.
    variant: null
    parameters: {}

  - slug: powerplant-matching-and-fleet-assembly
    role: routine-use
    evidence: >
      PyPSA-Eur's existing power plant fleet is assembled using powerplantmatching:
      "The model includes a stock of existing power plants (processed with the
      tool powerplanmatching)" (Methods, first paragraph).
    procedure_notes: >
      Referenced as an existing PyPSA-Eur input component used unchanged in
      the validation runs; no new powerplant-matching methodology is introduced
      by this paper.
    variant: null
    parameters: {}

unmatched_methods: []
