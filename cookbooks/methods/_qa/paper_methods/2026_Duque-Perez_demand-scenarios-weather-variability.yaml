paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
tier: 2
model_used: >
  PyPSA-Earth sector-coupled, 14 nodes (GADM Level 1 regions), hourly resolution,
  multi-sector (electricity, hydrogen, ammonia, methanol, green steel), Morocco only,
  target year 2035 (overnight/greenfield).
scope: >
  Capacity expansion study of Morocco's green hydrogen transition to 2035, comparing
  domestic industry-reallocation and export-oriented scenarios under interannual
  weather variability and financial (WACC) and CO2 constraint sensitivities.
methods:
  - slug: sector-coupled-network-assembly
    role: routine-use
    evidence: >
      "We employ and extend the sector-coupled version of the global PyPSA-Earth model
      [17, 18], an open-source, multi-regional, hourly-resolved, multi-energy system
      optimization model workflow that integrates multiple energy and non-energy sectors
      at high spatial resolution." Key enhancements include green ammonia (Haber-Bosch),
      green methanol synthesis, DRI/HBI for green steel, and shipping defossilisation
      (Sec. 2.1).
    procedure_notes: >
      Extended PyPSA-Earth sector-coupled with five new PtX conversion chains. Minimises
      total system costs (investment + operational) over 14 Moroccan nodes, one target
      year (2035), hourly time steps. Modular architecture used to add custom constraints
      and data channels.
    variant: null
    parameters: {nodes: 14, target_year: 2035, temporal_resolution: "1h"}

  - slug: additionality-and-24-7-matching
    role: extends
    evidence: >
      "A set of constraints to enforce hourly temporal matching of renewable electricity
      and battery discharge supply with electrolytic hydrogen and green hydrogen
      derivatives production, in line with emerging EU regulations." Mathematical
      formulation given as Eq. 1 (hourly) and Eq. 2 (annual). Combined with a green
      hydrogen allocation constraint ensuring certified sourcing (Sec. 2.1).
    procedure_notes: >
      Hourly matching constraint (Eq. 1): sum of renewable generation + hydro dispatch
      + battery discharge × efficiency >= electrolysis load at every timestep t.
      Annual renewable matching constraint (Eq. 2) added without batteries to prevent
      fossil charging. Additional green hydrogen allocation constraint ensures hydrogen
      for export or downstream use is certified green. Implemented as custom constraints
      consistent with EU RFNBO delegated act.
    variant: hourly-plus-annual-rfnbo
    parameters: {}

  - slug: import-and-trade-representation
    role: routine-use
    evidence: >
      Scenario S2 (Export opportunities) "prioritizes direct hydrogen exports to Europe
      supported by foreign investment. Infrastructure assumptions include potential
      hydrogen transport and export infrastructure expansion at existing ports." Export
      volumes for green hydrogen, ammonia, methanol, HBI and steel are exogenous annual
      production targets derived from national strategy (Table 1, Sec. 2.5).
    procedure_notes: >
      Export volumes are exogenously fixed per scenario (Table 1). S2 green hydrogen
      export: 17.10 TWh; ammonia and methanol volumes differ per scenario. Export
      volumes for S2 hydrogen derived from a quadratic fit to near-term targets. No
      endogenous price formation for exports.
    variant: exogenous-volume-targets
    parameters: {H2_export_S2: "17.10 TWh", steel_S1: "3615.51 kt/y", steel_S2: "2327.35 kt/y"}

  - slug: carrier-network-routing-h2-co2
    role: routine-use
    evidence: >
      "S1 requires an additional 2 GW of pipeline capacity to transport hydrogen for
      green ammonia production and low-carbon steelmaking." Regional distribution of
      H2 production capacity and H2 pipeline capacity shown in Appendix B figures
      (Sec. 3.2, Appendix B).
    procedure_notes: >
      H2 pipeline network is endogenously sized within the 14-node model. Pipeline
      capacity co-optimised with electrolyser and conversion plant capacity. CO2 from
      cement CCS used as feedstock for methanol synthesis (carbon stream constraint
      in S1).
    variant: null
    parameters: {pipeline_expansion_S1: "2 GW additional"}

  - slug: land-eligibility-and-potentials
    role: routine-use
    evidence: >
      "To identify locations suitable for renewable energy PtX deployment, the
      methodology developed in [20, 21] is used to construct techno-ecological
      feasibility maps for utility-scale solar PV, onshore wind, and PtX. A Boolean
      overlay of georeferenced exclusion layers integrating land-use, technological,
      and economic constraints mask unavailable sites." (Sec. 2.2)
    procedure_notes: >
      Exclusion layers: forest, urban, cropland, water bodies, permanent snow, mixed
      land cover. Additional criteria: minimum SIP/WIP score of 2; sites within 30 km
      of grid; PtX areas restricted to coastal regions or areas with <80% projected
      low water stress by 2050. Result: ~94.24 GW onshore wind and ~462.25 GW solar
      PV potential. Three resource quality classes by percentile of capacity factor
      (Class 1: top 5%, Class 2: next 10%, Class 3: remainder).
    variant: percentile-class-clustering
    parameters: {wind_potential: "94.24 GW", solar_potential: "462.25 GW", wind_cf_max: "53.7%", solar_cf_max: "17.7%", resource_classes: 3}

  - slug: weather-year-ensembles
    role: routine-use
    evidence: >
      "Climate-driven fluctuations in renewable generation profiles, represented by a
      low-wind ERA5 year (2016)" used as one sensitivity experiment. "The relatively
      minor effect of weather variability (+0.84% in average) suggests that, within the
      assumed spatial distribution of renewables, the system is sufficiently diversified
      to absorb year-to-year fluctuations in resource availability." (Sec. 2.3, 3.4)
    procedure_notes: >
      Weather year selection based on nominal wind full-load hours given higher
      variability vs solar. One low-wind ERA5 year (2016) used as sensitivity case.
      ERA5 grid cells weighted by area per node to construct representative generation
      profiles. Wind profiles require minimum 7 m/s at 150 m ASL (~2300-2400 FLH);
      IEC Class 3 turbine configuration used.
    variant: single-low-wind-year
    parameters: {sensitivity_year: 2016, reanalysis: "ERA5", min_wind_speed: "7 m/s at 150m"}

  - slug: sensitivity-and-uncertainty-sweeps
    role: routine-use
    evidence: >
      "To identify the most influential drivers, we conducted a one-at-a-time
      sensitivity analysis. Among the different sources of uncertainty, weather
      variability, the weighted average cost of capital (WACC), and the pace of
      emissions reduction emerged as the most consequential." (Sec. 2.3, 3.4)
    procedure_notes: >
      One-at-a-time (OAT) sensitivity analysis on three parameters: (1) CO2 constraint
      stringency (tightened from baseline), (2) WACC (varied from 7.8% default to 6%),
      (3) weather year (low-wind ERA5 2016). Results reported as index relative to
      baseline marginal prices for H2, HBI, methanol, NH3, and steel per scenario
      (Table 2). WACC found to dominate over CO2 constraint or weather variability.
    variant: one-at-a-time
    parameters: {WACC_default: "7.8%", WACC_low: "6%", parameters_swept: 3}

  - slug: shadow-prices-and-marginal-values
    role: routine-use
    evidence: >
      "The model provides marginal prices for hydrogen, ammonia, methanol and
      low-carbon steel and HBI, defined as the shadow value of supplying one additional
      unit of each product. These marginal prices reflect the system's opportunity cost
      structure and therefore serve as consistent welfare weights within the optimisation
      framework." Welfare proxy W = sum_i p_marg_i * Q_i (Eq. 5, Sec. 2.6).
    procedure_notes: >
      Dual variables of supply constraints read as marginal prices for five products:
      H2, NH3, MeOH, HBI, steel. Used both as sensitivity metric (Table 2, reporting
      index relative to baseline) and as welfare proxy weights (Eq. 5). Absolute
      marginal cost values reported: H2 ~111-112 EUR2024/MWh, steel ~687-689
      EUR2024/t (Table 2, Sec. 3.5).
    variant: null
    parameters: {products: ["H2", "NH3", "MeOH", "HBI", "steel"]}

  - slug: carbon-constraints-and-pricing
    role: routine-use
    evidence: >
      "Tightening the CO2 constraint exerts a more moderate influence. This suggests
      that the system can reach near-zero-carbon outcomes without additional financial
      or regulatory incentives." CO2 constraint stringency is one of the three
      sensitivity parameters (Sec. 3.4).
    procedure_notes: >
      CO2 emissions cap used as policy constraint; tightened relative to a baseline
      level in the sensitivity experiment. Exact cap values not stated in the paper text.
      Effect on marginal prices shown as index in Table 2 (tight CO2 column).
    variant: emissions-cap
    parameters: {}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "We construct two contrasting scenarios to reflect alternative strategic priorities
      and plausible market-formation pathways for Morocco through 2035, a mid-term
      horizon aligned with typical project cycles." (Sec. 2.5). Single target year
      optimisation, greenfield capacity expansion.
    procedure_notes: >
      Overnight/greenfield investment for target year 2035. No myopic pathway or
      multi-period investment. Existing fleet not explicitly modelled as brownfield
      (no vintaging mentioned). Two scenarios (S1, S2) differ by demand allocation,
      not by planning horizon.
    variant: overnight
    parameters: {target_year: 2035}

unmatched_methods:
  - name: "bottom-up demand scenario construction (LEAP/HYPAT)"
    evidence: >
      "We implement a hybrid demand-modelling approach that combines LEAP's bottom-up
      approach, which is implemented via the HYPAT Excel templates [25],[26]" (Sec. 2.4).
      Full bottom-up sectoral demand modelling across residential, transport, and
      industry sectors using activity drivers, saturation rates, energy intensities and
      carrier shares (Eq. 3-4). This is a standalone demand-projection methodology
      distinct from the energy system optimisation — no slug in SLUGS.yaml covers
      external demand scenario construction tools.
