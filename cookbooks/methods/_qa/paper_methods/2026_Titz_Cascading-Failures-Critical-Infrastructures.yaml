paper: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
tier: 1
model_used: >
  PyPSA-Eur, 600 nodes, electricity-only, 3h resolution, single weather year (2013),
  CO2 reduction scenarios from 58% to 0% of 1990 levels.
scope: >
  Quantifies how European decarbonisation pathways alter the likelihood and severity
  of cascading transmission failures and system splits, identifies critical infrastructure,
  and evaluates inertia and grid reinforcement countermeasures.
methods:
  - slug: cascading-failure-analysis
    role: defines
    evidence: >
      "For each scenario and time step, we evaluate all N−2 contingencies by removing
      pairs of transmission circuits. Power flows are recalculated and overloaded lines
      are iteratively removed until no further violations occur or the system separates
      into disconnected components." (Sec. II and Appendix C). The paper's central
      methodological contribution is a quasi-steady-state cascading failure simulation
      over ~1.1×10^9 N−2 contingencies per CO2 level applied to PyPSA-Eur scenarios.
    procedure_notes: >
      Quasi-steady-state framework: at each step DC power flows are recomputed and
      all overloaded lines removed simultaneously (including parallel circuits at the
      same aggregated corridor). Generation and HVDC injections held constant during
      cascade. Bridges excluded from trigger set. RoCoF threshold of 1 Hz/s used to
      classify component blackouts using Eq. (2): RoCoF = f0*ΔP/(2*Ekin). Around
      1.1×10^9 N−2 contingencies simulated per CO2 scenario. Unique failure
      combinations weighted for duplicate corridors. (Appendix C, Eq. C1, Fig. 8).
    variant: n-2-exhaustive-quasi-steady-state
    parameters: {rocof_threshold_hz_per_s: 1, contingency_type: "N-2 (all pairs)", scenarios: "6 CO2 levels: 58% to 0%", network_nodes: 600, time_resolution_h: 3}

  - slug: n-1-security-and-contingency
    role: canonical-use
    evidence: >
      "Dispatch is optimized under the constraint that N−1 security is satisfied in
      every time step, ensuring that no outage of a single transmission line leads to
      secondary overloads." (Sec. II). A two-stage approach enforces N−1: stage one
      approximates it via a 70% loading cap; stage two uses an explicit SCLOPF.
      (Appendix B).
    procedure_notes: >
      Two-stage: (1) investment/dispatch optimised under CO2 cap with transmission
      lines limited to 70% rated capacity as N−1 proxy; (2) generator dispatch
      re-solved with Security-Constrained Linear Optimal Power Flow (SCLOPF) enforcing
      explicit post-contingency flow constraints at each time step, with storage
      operation fixed from stage one. (Appendix B: "Security-Constrained Linear
      Optimal Power Flow (SCLOPF) that enforces explicit N−1 constraints at each
      time step.")
    variant: two-stage-sclopf
    parameters: {loading_heuristic_pct: 70, sclopf_stage: 2}

  - slug: linearised-optimal-power-flow
    role: routine-use
    evidence: >
      "All simulations employ the linearised (DC) power flow approximation and a DC
      optimal power flow framework." (Appendix A). DC power flow used both in
      scenario generation and in cascade simulations.
    procedure_notes: >
      Standard DC/linearised power flow used throughout: in PyPSA-Eur investment
      optimisation and in the cascading failure simulation at each cascade step.
      (Appendix A and Appendix C: "Power flows are evaluated using the DC
      approximation.")
    variant: null
    parameters: {}

  - slug: spatial-clustering-and-resolution
    role: routine-use
    evidence: >
      "Nodes are clustered hierarchically by merging neighbouring regions with similar
      wind and solar capacity factors, preserving renewable variability and network
      topology." (Appendix A). The full European network is reduced to 600 nodes and
      1042 connection corridors for tractability.
    procedure_notes: >
      Hierarchical clustering of the ENTSO-E network (from GridKit) to 600 nodes,
      merging neighbours with similar renewable capacity factors. Generation, storage
      and transmission assets aggregated accordingly. Multiple circuits between the
      same aggregated nodes treated as electrically identical and removed simultaneously
      during cascades. (Appendix A, citing Frysztacki et al. 2021 [37].)
    variant: hierarchical-renewable-cf-matching
    parameters: {nodes: 600, corridors: 1042}

  - slug: foresight-and-planning-horizons
    role: routine-use
    evidence: >
      "PyPSA enables joint optimisation of investments and operation over one year to
      minimise total annualised system costs." (Appendix B). Single target-year
      overnight optimisation for each CO2 scenario.
    procedure_notes: >
      Overnight/greenfield investment optimisation for each CO2 level independently
      (58%, 50%, 40%, 30%, 20%, 10%, 5%, 0% of 1990 emissions). Cost assumptions
      for 2030, weather year 2013. No myopic or perfect-foresight multi-period pathway.
      (Appendix A and B.)
    variant: overnight
    parameters: {target_year: 2030, weather_year: 2013, co2_levels: "58% to 0% of 1990"}

  - slug: brownfield-and-capacity-vintaging
    role: routine-use
    evidence: >
      "In the first stage, investments and dispatch are optimised under a CO2 emissions
      cap using a brownfield approach." (Appendix B). Transmission capacities are fixed
      (not co-optimised): "Transmission capacities are fixed, and power flows are
      represented using the linear (DC) approximation." (Sec. II).
    procedure_notes: >
      Brownfield in the sense that existing transmission topology is taken as fixed
      (from ENTSO-E map via GridKit); generation/storage capacity is optimised on
      top of existing infrastructure. The paper explicitly notes transmission is not
      expanded in the base scenarios — reinforcements are studied separately as
      countermeasures. (Sec. II, Appendix B, Appendix F.)
    variant: fixed-transmission
    parameters: {}

  - slug: transmission-expansion-cooptimisation
    role: critiques
    evidence: >
      "Transmission reinforcement, however, does not automatically improve robustness.
      If additional capacity is fully utilised for economic dispatch, it can increase
      long-distance transfers and thereby amplify structural imbalances." (Sec. VIII /
      Discussion). The paper analyses targeted grid reinforcement reserved for security
      margins rather than trading, and evaluates its cost-effectiveness as a
      countermeasure to cascading failures.
    procedure_notes: >
      A greedy algorithm selects corridors to reinforce (each adding one circuit of
      380 kV) to minimise GSS. Added capacity reserved for stability margins only —
      dispatch unchanged. Investment costs 4.5×10^6 EUR/km from Netzentwicklungsplan.
      At 20% CO2: 12 additional lines restore GSS to reference level at ~0.14 bn EUR/yr.
      At 0% CO2: costs remain below 2.5 bn EUR/yr. (Sec. VII, Appendix F, Fig. 7d–f,
      Fig. 11.)
    variant: security-reserved-greedy
    parameters: {cost_per_km_eur: 4500000, voltage_kv: 380, at_20pct_co2_lines: 12}

unmatched_methods:
  - name: "inertia-placement-optimisation"
    evidence: >
      The paper develops a greedy algorithm to optimally place additional synthetic
      inertia (from synchronous condensers or virtual inertia) across network nodes
      to minimise the expected number of Global Severe Splits (GSS). At each iteration,
      a fixed increment ΔM is placed at the node maximising reduction in aggregated
      lost load; if no improvement, ΔM is doubled. (Sec. VII, Appendix E, Fig. 10.)
      No existing slug covers inertia siting/sizing optimisation — this is distinct
      from cascading-failure-analysis (which simulates failures) and from
      n-1-security-and-contingency (which is about dispatch-level constraints).
