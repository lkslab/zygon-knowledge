id: carbon-constraints-and-pricing
title: "Carbon constraints and carbon pricing (CO2 cap, carbon budget, emissions price)"
summary: >
  Force decarbonisation with one of two interchangeable instruments — a quantity
  constraint on emissions (annual cap or cumulative budget) or a price on emissions
  added to marginal cost — where the cap's dual variable is exactly the price that
  would produce the same solution.
question: >
  How much must the system change to hit an emissions target, and what carbon price
  does that target imply — or, inversely, what does a given carbon price actually buy?
aliases:
  - "CO2 cap"
  - "CO2 limit"
  - "CAP_CO2"
  - "emissions cap"
  - "annual emission constraint"
  - "carbon budget"
  - "cumulative CO2 budget"
  - "CO2 price"
  - "carbon price"
  - "CO2 tax"
  - "emission price"
  - "emissions pricing"
  - "shadow price of CO2"
  - "mu_CO2"
  - "carbon neutrality constraint"
  - "net-zero constraint"
  - "net-negative emissions target"
  - "global constraint on primary energy"
  - "ETS allowance price"
when_to_use:
  - "what does it cost to cut emissions by 55% / 90% / to net zero"
  - "what carbon price would we need to hit our target"
  - "model our national net-zero-by-2045 target"
  - "run a cap versus a tax and tell me which is better"
  - "how does the system change if the ETS price doubles"
  - "give me a marginal abatement cost curve"
  - "we have a carbon budget of X Gt to 2050 — spread it over the pathway"
  - "how much CCS or DAC do we need if we cap sequestration"
  - "what happens with net-negative emissions"
  - "can we phase out gas without a carbon price"
  - "align the run with the EU 2040 target"
  - "our targets include non-CO2 gases and LULUCF — can the model take that"
family: markets-and-prices
prevalence:
  papers: 67
  tier1: 42
  tier2: 25
  sweep_hits: 71
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 67 papers that actually
    impose a carbon cap, budget or price — the second most prevalent method in the
    corpus after foresight-and-planning-horizons. The regex screen returned 71; the
    four extra are papers whose text discusses emissions targets only as scenario
    framing. Two entries were flagged as mention-only suspects in
    _qa/EVIDENCE_INDEX.md and BOTH are kept after review: Brown 2018 (PyPSA JORS) is
    the paper that WRITES the constraint's canonical algebraic form and demos it at a
    95% cap, and Victoria 2022 imposes a per-horizon cap from an exponential-decay
    budget — the flag caught the phrase "a CO2 price input is NOT used", which is a
    statement about the instrument choice, not about the method being absent. The
    role distribution is the tell: 1 defines, 8 canonical-use, 57 routine-use, 1
    critiques. This is infrastructure — nearly every capacity-expansion paper in the
    corpus turns it on and then studies something else. Only ~10 papers make the
    instrument itself the object of study, and those are the ones the procedure and
    pitfalls are built from.
procedure:
  - step: >
      Decide the SCOPE the target applies to: which sectors, which countries, and
      which gases. An electricity-only cap and an economy-wide cap covering transport,
      heating, industry, aviation, navigation and agriculture are different numbers
      against the same 1990 baseline, and non-CO2 GHGs and LULUCF sinks are typically
      folded in by tightening or loosening the CO2 number rather than modelled.
    handle: "determine_emission_sectors(options) — sector list follows sector.{transport,heating,industry,agriculture}"
    provenance: "scripts/prepare_sector_network.py:determine_emission_sectors"
  - step: >
      Establish the baseline emissions the target is expressed against. The corpus
      almost always states the target as a fraction of 1990 (5%, 45%, 55%, 90%, 100%,
      -110%), so the absolute cap is baseline x factor x years. Getting the baseline
      wrong scales the whole study silently.
    handle: "co2_emissions_year(...) from EEA + Eurostat inventories; electricity.co2base as the flat fallback"
    provenance: "scripts/prepare_sector_network.py:co2_emissions_year; scripts/prepare_sector_network.py:build_eea_co2"
  - step: >
      Attach emission factors to the emitting carriers, in tCO2 per MWh of THERMAL
      input, and let generator/link efficiency convert to emissions per MWh of output.
      The corpus's recurring numbers are gas 0.19-0.198, oil 0.257, coal 0.336,
      lignite 0.407 tCO2/MWh_th.
    handle: "n.carriers.co2_emissions, populated from technology-data"
    provenance: "scripts/add_electricity.py:load_costs"
  - step: >
      Choose the instrument. QUANTITY: add one global inequality
      sum_t w_t * sum_{n,r} g_{n,r,t} * e_r / eta_{n,r} <= CAP, whose dual is the
      carbon price. PRICE: add e_r / eta_{n,r} * p_CO2 to each emitter's marginal
      cost and leave emissions free. The two are duals of one another — solving the
      cap and reading mu, or solving at p_CO2 = mu, gives the same dispatch and the
      same investment.
    handle: "add_co2limit (quantity) vs add_emission_prices (price)"
    provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:add_emission_prices"
  - step: >
      For a sector-coupled model, do NOT sum generator dispatch: route every emission
      and removal through a single `co2 atmosphere` bus and constrain the FINAL state
      of the non-cyclic store on it. That one change is what makes DAC, BECCS,
      electrofuel recycling, process emissions and venting all commensurable, and what
      lets the store go negative for a net-negative target.
    handle: "add_co2_tracking (the bus/store, e_min_pu=-1) + add_co2_atmosphere_constraint (the final-state bound)"
    provenance: "scripts/prepare_sector_network.py:add_co2_tracking; scripts/solve_network.py:add_co2_atmosphere_constraint"
  - step: >
      For a pathway rather than a target year, distribute a CUMULATIVE budget over
      horizons. The corpus uses either statutory milestones read off policy (55/90/100%
      at 2030/2040/2050) or an analytic decay — exponential or beta-CDF — calibrated so
      the integral equals the budget, with carbon neutrality pinned at the end.
    handle: "build_carbon_budget(o, ...) for cb<Gt>ex<r>/cb<Gt>be<b>; the co2_budget year->fraction mapping for milestones"
    provenance: "scripts/prepare_sector_network.py:build_carbon_budget"
  - step: >
      Under perfect foresight, replace the per-horizon caps with ONE inter-period
      budget on the terminal atmosphere state, weighted by investment-period years,
      plus a separate net-zero constraint on the last period. This is the only
      formulation that lets the optimiser trade emissions between decades.
    handle: "set_carbon_constraints -> GlobalConstraint type 'Co2Budget'; add_carbon_budget_constraint at solve time"
    provenance: "scripts/prepare_perfect_foresight.py:set_carbon_constraints; scripts/solve_network.py:add_carbon_budget_constraint"
  - step: >
      Bound the backstops separately, or the cap is met by unlimited geological
      storage. The corpus standard is a hard annual sequestration limit — 200 MtCO2/a
      Europe-wide in eight papers here — plus per-node CDR potentials. Its own dual is
      a second, independently reportable price.
    handle: "add_co2_sequestration_limit from sector.co2_sequestration_potential"
    provenance: "scripts/solve_network.py:add_co2_sequestration_limit"
  - step: >
      Read the answer out of the DUAL, not out of an assumption: mu of the CO2 global
      constraint is the carbon price the target implies, in EUR/tCO2. A zero dual means
      the cap is present but slack — renewables were already cheaper — which is a
      result, not a bug.
    handle: "n.global_constraints.at['CO2Limit','mu'], surfaced as the metrics 'co2_shadow' column"
    provenance: "scripts/make_summary.py:co2_shadow"
  - step: >
      (comparison studies only) Sweep the instrument to build the response curve: cap
      levels from 0% to 95% of baseline, or prices from 0 to 500 EUR/t, one solve per
      level, and plot emissions, technology mix and mu against it. This is how a
      marginal abatement cost curve is produced, and it is where the cap-vs-price
      non-monotonicities in `pitfalls` show up.
    handle: null
    provenance: null
variants:
  - id: annual-emissions-cap
    what: >
      One global inequality on emissions over the modelled year, stated as a fraction
      of a baseline year (usually 1990). By far the dominant form: 40+ of the 67 papers.
      Cheap (one constraint, one solve), and its dual is the headline carbon price.
      Sub-forms differ only in scope — electricity-only, or economy-wide across the
      coupled sectors.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
      - "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
      - "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
      - "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
      - "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
      - "2025_Burghardt_material-needs-energy-technologies.pdf"
      - "2025_Che_space-based-solar-power-european-decarbonization.pdf"
      - "2025_Franken_Geothermal-Market-Integration.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
      - "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
  - id: cap-level-sweep
    what: >
      The same annual cap re-solved across a ladder of stringency levels (0-95% of
      baseline, or 10% steps to net zero) and the dual plotted against it. This is the
      variant that produces a marginal abatement cost curve and the only one that
      exposes the cap's non-linearity: the corpus repeatedly finds the constraint
      non-binding above ~40% of 1990 and the dual diverging as it approaches zero.
    papers:
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
  - id: cumulative-carbon-budget
    what: >
      A single budget in GtCO2 spread across planning horizons — the PATHWAY
      instrument, and distinct machinery rather than a parameter change. Two schools:
      statutory milestones read off policy, or an analytic exponential/beta decay
      calibrated so the integral equals the budget. Under perfect foresight it becomes
      one inter-period constraint on the terminal atmosphere state, which is what lets
      the model choose WHEN to abate; under myopic foresight it degrades to a
      pre-computed per-horizon cap sequence.
    papers:
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
      - "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
  - id: emissions-price
    what: >
      A marginal-cost adder rather than a constraint: emissions stay free to grow, and
      the price does the work. Chosen when the study's question is "what does a given
      ETS price buy" rather than "what does a target cost", when the price comes from
      outside the model (an IAM, an ETS spot series, a national assumption), or when a
      validation run needs realistic fossil merit order. Emissions become an output.
    papers:
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
  - id: sector-specific-or-nested-caps
    what: >
      More than one emissions constraint at once, or one narrower than the model:
      a per-country cap inside a European model, a national net-negative target nested
      in a continental net-zero one, an electricity-sector-only cap in a
      sector-coupled network, or a gas-usage budget standing in for a fuel-specific
      cap. Nesting makes the carbon price non-unique — the effective price at a
      location is the SUM of the duals that bind there.
    papers:
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
      - "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
  - id: negative-emissions-and-co2-accounting
    what: >
      Net-zero and net-negative targets where the binding object is not fossil
      combustion but the CO2 ATMOSPHERE BALANCE: capture, DAC, BECCS, electrofuel
      recycling, process emissions, venting and LULUCF all netted on one bus whose
      store may go negative. Almost always paired with a hard sequestration cap
      (200 MtCO2/a is the corpus convention) because without one the target is met by
      unbounded geological storage and the carbon price collapses.
    papers:
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
literature:
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      The paper that writes this method's canonical algebraic form for the PyPSA family
      (Eq. 11): sum_{n,r,t} w_t * g_{n,r,t} * e_r / eta_{n,r} <= CAP_CO2, one global
      linear constraint over all generators and snapshots, with specific emissions e_r
      in tCO2/MWh_th and generator efficiency eta doing the thermal-to-electric
      conversion. Classifies it as a constraint on PRIMARY energy — which is literally
      how pypsa still types it (`primary_energy` is the GlobalConstraint default) — and
      reads mu_CO2 as the carbon price dual. Demo at a 95% reduction vs 1990. Every
      other cap in this corpus is this equation.
  - paper: "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
    tier: 1
    role: critiques
    note: >
      The one critique, and it is aimed squarely at the cap-versus-price duality this
      card is built on. Shows analytically (Eqs. 9-10) and then numerically in PyPSA and
      IKARUS that BOTH instruments produce paradoxes under a binding constraint: with a
      hard cap (minimise cost s.t. E <= E_cap, set at 40% below the unconstrained
      minimum, 112 Mt/yr), improving the cleaner technology's CO2 intensity can REDUCE
      its use, because the cap frees emission headroom that cheaper dirty capacity then
      takes; with a cost-budget cap (minimise emissions s.t. C <= C_budget, anchored at
      a 50 EUR/t solve) raising the effective CO2 price over 0-50 EUR/t can INCREASE
      total emissions. Non-monotone response to a monotone policy tightening — so a
      two-point cap comparison can invert the sign of the answer.
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference application people cite for the annual electricity cap: 30-node
      one-node-per-country Europe, hourly, full year, cap fixed at 95% below 1990 in
      every scenario while the transmission volume is swept from zero to unconstrained.
      States the KKT multiplier mu_CO2 as the shadow CO2 price. Useful as a calibration
      anchor: at a 95% cap with only OCGT (0.19 tCO2/MWh_th) as backup, gas supplies
      ~5.1% of demand regardless of transmission.
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The canonical ECONOMY-WIDE cap: 151 MtCO2/a, 95% below 1990 for electricity,
      transport and heating jointly, with specific emissions applied to gas consumption
      AND non-cyclic methane store depletion counted — the first appearance in this
      corpus of the store-based accounting that the sector chain now uses. Reports
      mu_CO2 for every scenario, spanning 77 EUR/tCO2 (all-flexibility, with
      transmission) to 1184 EUR/tCO2 (heating, no transmission). That 15x spread over
      the SAME cap is the single most useful number in this card: the implied carbon
      price is a property of the system's flexibility, not of the target.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference cap-level SWEEP: CAP_CO2 from 0% to 60% of 1990 across three
      transmission scenarios, with the dual plotted against the cap (Fig. 22), plus a
      no-storage re-run to isolate storage's role in decarbonisation. Base case 5% of
      1990 European electricity emissions = 77.5 Mt/yr — which is exactly the number
      still hard-coded as `electricity.co2limit` in both models' default configs.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The clearest demonstration of the duality run in the PRICE direction: no cap at
      all, the CO2 price swept exogenously 0-500 EUR/tCO2 with the model re-optimised at
      each level, and the price that achieves a 5%-of-1990 outcome identified ex post as
      380 EUR/tCO2. Explicitly motivates its price range from a PRIOR study's cap DUAL
      (407 EUR/tCO2 in Brown et al.) — the corpus reasoning from mu to a price sweep and
      back, which is the strongest empirical support for treating the two instruments as
      interchangeable.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      Cap sweep from 0% to 100% reduction against China's ~6 GtCO2/yr power sector, with
      the dual reported as flexibility is progressively removed: mu_CO2 rises 228 -> 293
      -> 809 -> 1307 EUR/tCO2 as hydro and storage are taken away at the SAME cap. The
      non-European instance of the method in this corpus, and the demonstration that the
      cap's shadow price is a flexibility metric.
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The canonical cumulative-budget-as-pathway study: two reduction paths with the
      IDENTICAL cumulative budget (21 GtCO2 electricity+heating, 33 GtCO2 including
      transport) that differ only in timing, showing early action is cheaper for the same
      total emissions. Per-5-year-step annual caps derived from the path; the CO2 price
      is explicitly "not an input to the model, but a result obtained via the KKT
      multiplier". Also names the honest case: the cap may be non-binding, hence a zero
      carbon price, in early steps where renewables already win.
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: canonical-use
    note: >
      The paper that proves the equivalence rather than asserting it: App. B.6 shows the
      cap's dual mu_CO2 equals the CO2 tax producing the same dispatch. Its headline
      finding is an instrument-choice result the interview should relay — under a
      minimum-VRE-share policy wind and solar cannibalise their own market value, but
      under a CO2 cap or tax their shares can rise without doing so. Sweeps 0 to ~220
      EUR/tCO2 and emissions 0-1.2 tCO2/MWh_el.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference treatment of the sequestration limit as a first-class policy
      instrument rather than a technical bound, and it says why out loud: 200 Mt/a for
      net-zero and 660 Mt/a for net-negative, "deliberately implemented to avoid
      over-reliance on carbon capture and sequestration as a backstop technology". Its
      own dual is reported and is strongly convex in the limit — 225 EUR/t at 200 Mt/a
      falling to 51 EUR/t at 800 Mt/a. Net-negative target requires removing 460 MtCO2
      (10% of 1990).
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Electricity-sector-only annual cap at 95% below 1990, held fixed across every
      spatial-resolution scenario (37-362 buses) while only the transmission cap varies.
      The standard pattern for the method's routine use: the cap is a boundary condition
      that makes the study's real question well-posed.
  - paper: "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Annual cap at 77.5 Mt/a, and one of the few papers that shows the baseline
      arithmetic: 3.1 Gt/a total 1990 emissions x ~50% electricity share x 5% residual.
      Worth quoting when a user asks where the default `co2limit` comes from.
  - paper: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Global annual cap at 95% below 1990. With OCGT the only fossil technology the
      constraint reduces to a direct limit on gas dispatch — the electricity-only
      degenerate case where a CO2 cap and a gas budget (CH4L) are nearly the same
      instrument.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      Main scenario at 5% of 1990, plus a 5%-to-95% sweep with the dual read as the
      required carbon price. Contributes the binding threshold this card quotes: under
      its cost assumptions the CO2 constraint only binds BELOW ~40% of 1990, so caps
      looser than that change nothing and produce a zero carbon price.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: >
      Cap swept 60% down to 5% of sector emissions with mu_CO2 per scenario, applied
      jointly across active sectors. Contributes the cross-sector price asymmetry: the
      heating sector needs a much higher CO2 price than electricity before fuel-switching
      triggers, so a single economy-wide cap is met almost entirely in power first.
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      Annual cap as the main scenario dimension alongside MGA slack, at 80%, 95% and
      100% reduction. Gas at 0.19 tCO2/MWh_th. Relevant here as the composition case:
      tightening the cap and widening the near-optimal space are orthogonal axes.
  - paper: "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      A flat 40 MtCO2 annual cap held across all 672 benchmark problems, listed as one
      of the constraints enabling joint generation-transmission co-optimisation. No dual
      analysis — the cap is purely a boundary condition here.
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: routine-use
    note: >
      Fixed global cap at 5% of 1990, not swept, as a background constraint across all
      sensitivity scenarios. Documents its emission parameters explicitly (OCGT
      0.18 tCO2/MWh primary, eta 0.39), which is the pair a reviewer needs to reproduce
      an absolute cap number.
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Annual cap at 95% below 1990 electricity-sector emissions, with mu_CO2 reported.
      Gas at 0.187 tCO2/MWh_th and 21.6 EUR/MWh_th fuel cost — the pair that sets the
      carbon price at which gas leaves the merit order.
  - paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    tier: 1
    role: routine-use
    note: >
      Cap varied 10% to 90% relative to 1990 German electricity emissions and used
      explicitly as a PROXY for renewable penetration — the common substitution when a
      user asks for "an 80% renewable system" and the model has no share constraint.
      Shadow price not reported.
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      A 100% reduction cap held identical across all scenarios, chosen deliberately "to
      keep comparability between scenarios and a decent amount of market potential for
      energy storage". The cleanest statement of why a net-zero cap is the default
      background for storage-value studies.
  - paper: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      100% reduction cap as the sole decarbonisation instrument, with the paper stating
      explicitly that it abstains from binding renewable-share targets. The instrument
      choice is the modelling stance: one emissions constraint rather than a stack of
      technology mandates.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero CO2 imposed system-wide across all sectors as one of five constraints;
      dual not analysed. Representative of the large routine-use group where net-zero is
      simply the scenario definition.
  - paper: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    tier: 1
    role: routine-use
    note: >
      Two cap levels, 60% and 100% reduction vs 1990 electricity, run across clustering
      methods. Shows the cap being used as a second axis to test whether a spatial
      aggregation conclusion survives a change in stringency.
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: routine-use
    note: >
      95% cap in the main runs, with a 100% appendix scenario in which gas is REMOVED
      entirely and the near-optimal space is redefined over storage dimensions instead.
      A concrete instance of the structural break at exactly net zero: at 100% the
      emitting technology stops existing, so the cap's dual has nothing to price.
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Economy-wide caps at 80% reduction in 2040 and 105% (net-negative) in 2060, with
      geological sequestration capacity swept as a scenario axis (0 or 1500 MtCO2/a in
      2040; 400 or 1500 in 2060). Uses the CO2 shadow price to attribute fossil emission
      costs in a fuel-cost decomposition — the dual as an accounting tool rather than a
      headline.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: routine-use
    note: >
      The pypsa-earth instance: a net-zero cap for a Nigeria 2060 electricity scenario
      tied to Nigeria's COP26 commitment, with demand calibrated to ~250 TWh. No
      emission price and no dual reported — which matches earth's tooling, where the CO2
      shadow price is not exposed in the summary outputs.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Six carbon budgets derived from 1.5-2 degC at 67% confidence on a European
      per-capita share, each distributed over horizons by exponential decay and imposed
      as a per-step annual cap across all sectors. States the KKT multiplier as the
      shadow CO2 price and reports the resulting price trajectory; no price input is
      used. Together with Victoria 2020 this is the budget-to-per-horizon-cap recipe the
      `cb<Gt>ex<r>` token implements.
  - paper: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    tier: 2
    role: routine-use
    note: >
      The instructive negative case: three FES net-zero scenarios with NO CO2 cap or
      price variable anywhere in the formulation — decarbonisation enforced by excluding
      carbon-intensive hydrogen production technologies from the technology set. Worth
      naming in an interview: "net zero" in a paper does not imply an emissions
      constraint was modelled, and a scenario-exogenous target yields no carbon price.
  - paper: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero 2050 via PyPSA-Eur-Sec's standard CO2 cap; constraint form only, no price
      stated. Routine background for an offshore-wind siting question.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero stated in exactly the sector-chain formulation this card recommends —
      "carbon dioxide emissions into the atmosphere balance out to zero over the year" —
      with CO2 traced through capture (industry, SMR, CHP, DAC), usage (electrofuels)
      and sequestration, and sequestration limited to 200 MtCO2/year. Reports the dual
      as the carbon price: 385 EUR/tCO2 with transmission expansion, 579 EUR/tCO2
      without, for climate neutrality plus self-sufficiency.
  - paper: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Three CUMULATIVE budgets over the whole 2020-2050 horizon — 25.7, 45 and 73.9
      GtCO2 for +1.5/+1.7/+2.0 degC on an equal-per-capita global share — rather than
      annual caps, plus enforced CO2 neutrality in 2050 and a fourth no-limit scenario.
      The cleanest statement of the cumulative-budget variant as distinct machinery, and
      it is combined with endogenous learning, where the timing freedom a budget grants
      is what makes the learning result possible.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Net-zero across power, heating, transport and industry with CCS limited to
      200 Mt/a, and CO2 tracked endogenously across atmosphere, temporary storage and
      underground sequestration. Reports the consequence users ask about: fossil oil
      non-competitive in every robust solution, gas down to ~7% of 2021 levels.
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: routine-use
    note: >
      A CO2 TAX rather than a cap — 0 / 150 / 250 EUR/tCO2 — entering electricity and
      natural-gas purchase prices via an emission-intensity time series, with biochar
      negative-emission credits rewarded at the same tax value. The symmetric-credit
      design is the useful detail: pricing emissions and paying for removals at one
      price is exactly what the sector chain's negative marginal cost on the atmosphere
      store does.
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: >
      Net-zero and -110% net-negative caps as scenario parameters crossed with fossil
      inclusion and two biomass availability levels (8 scenarios, each run under
      optimistic/pessimistic solvent assumptions and with/without L-DAC). A worked
      example of a net-negative target being an ordinary config value once the
      atmosphere store is allowed to go negative.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: routine-use
    note: >
      The best validation datapoint in the corpus for the cap's dual: an
      electricity-sector cap of 11.986 Mt from the Spanish NECP 2030 yields an
      endogenous carbon price of 71.2-77.1 EUR/tCO2 across spatial resolutions, against
      the NECP's own exogenous assumption of 79 EUR/tCO2. Also a nested case — the
      surrounding PyPSA-Eur run supplying boundary prices used a -70% electricity target.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Carbon neutrality across 33 countries as a single system-level annual constraint,
      explicitly NOT per country. The distinction matters for interpretation: one
      Europe-wide cap lets abatement happen wherever it is cheapest, which is a
      different policy from 33 national caps and produces one price instead of 33.
  - paper: "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
    tier: 2
    role: routine-use
    note: >
      CO2 price as a purely exogenous input raising fossil marginal costs, with no cap
      anywhere and the emissions outcome fixed by an externally-given capacity mix (EU
      Climate Target Plan 2040 S3). The mechanism by which the price shows up in the
      results is the useful part: redispatch costs rise disproportionately 2030->2040
      because dispatchable generation is costlier under a higher CO2 price.
  - paper: "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: >
      EU ETS allowance prices as exogenous inputs (80 EUR/tCO2 for 2025, 130 for 2030)
      with no cap, while the actual decarbonisation driver is a separate additionality /
      hourly-matching constraint. A clean illustration that a carbon price and a
      procurement constraint are different instruments that can coexist, and that
      consumer-level Scope 2 emissions are then a reporting metric rather than a dual.
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      Per-5-year-step caps derived from a 21 GtCO2 electricity-and-heating budget
      (calibrated to a global 800 GtCO2 for 1.75 degC at 66% probability) following a
      beta-CDF trajectory with early rapid reductions, inherited from Victoria 2020.
      The corpus instance of the `be` (beta-decay) branch of the budget distribution.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      A model-wide cap tightened along EU targets (55/90/100% by 2030/2040/2050) with
      explicit interpolation at 2035 and 2045, expressed as "restricting the net amount
      of CO2 released to the atmosphere" — the atmosphere-balance form. Sequestration
      potential is one of six scenario dimensions across three levels with its own
      marginal cost of 15-30 EUR/tCO2, and agriculture plus LULUCF emissions are
      included for EU countries. The most complete accounting-scope statement in the
      corpus.
  - paper: "2025_Burghardt_material-needs-energy-technologies.pdf"
    tier: 2
    role: routine-use
    note: >
      Zero-emission cap applied JOINTLY to the industrial and energy systems per the
      German climate law for 2045, with biomass and CO2 storage under shared resource
      caps. No CO2 price; the cap is the binding instrument. An example of the cap's
      scope being widened past the energy system into industry.
  - paper: "2025_Che_space-based-solar-power-european-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Names the mechanism in workflow terms rather than paper terms — "we incorporated a
      GlobalConstraint into our 2020 model, setting co2 emissions at roughly 70% of 1990
      levels" — plus a zero cap for 2050. Also lists the technology-data v0.9.2 emission
      intensities the constraint uses (oil 0.2571, coal 0.3361, lignite 0.4069, gas
      0.1980, geothermal 0.1200 tCO2/MWh_th), which is the exact table
      `n.carriers.co2_emissions` is populated from.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      EU milestone caps (55% / 90% / net-zero at 2030/2040/2050) with no-policy runs for
      comparison, the carbon price endogenous as the cap's dual, and CDR bounded
      separately per EU targets (50 / 250 / 400 MtCO2/a at 2030/2040/2050). Its
      appendix states the duality plainly: the CO2 price "arises as the shadow price (or
      dual variable) associated with the constraint on total allowable CO2 emissions".
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero carbon balance as the binding instrument in every scenario, with the
      paper noting the interpretive cost of that choice: results are less relevant to
      the current, non-carbon-neutral system. A caveat to relay whenever a user's
      question is about today's market but the model is run at net zero.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Annual cap taken exogenously per National Grid ESO FES scenario (separate caps for
      Leading the Way and Falling Short) rather than derived from a 1990 fraction. The
      pattern for national studies where the target is published as an absolute
      trajectory and should be entered as one.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: routine-use
    note: >
      Net-zero default with 95% and 99% sensitivity caps, and the most decision-relevant
      cap-sensitivity finding in the corpus: at 99% rather than 100%, existing gas can
      supply ~2.5% of annual generation, which is enough to eliminate hydrogen storage
      and fuel cells from the cost-optimal solution entirely. A one-percentage-point
      change in the cap removes a technology.
  - paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      Cumulative budgets of 57.9 GtCO2 (2.0 degC) and 29 GtCO2 (1.7 degC) for Europe,
      derived as a 6.43% equal-per-capita share of the global budget and distributed
      across planning horizons by exponential decay with neutrality pinned at 2050, plus
      a no-budget sensitivity. Non-CO2 agricultural emissions assumed offset by LULUCF —
      the standard simplification for gases the model does not carry.
  - paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      PER-COUNTRY caps at 5% of each country's 1990 level (7 Mt/yr Spain, 2 Mt/yr
      Denmark) rather than one system cap, with mu_CO2 read per constraint. The
      sector-specific-or-nested variant in its simplest form, and a reminder that N caps
      give N prices and no single "the" carbon price.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero plus a 200 MtCO2/a sequestration cap, with the quantitative reason the two
      must be set together: the cap allows sequestering ~140 MtCO2/a of unabated
      industrial PROCESS emissions, so most of the sequestration budget is already
      committed before any power-sector abatement competes for it. Capture rate 90%, no
      spatially-resolved CO2 network.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      Net-zero with sequestration capped at 200 MtCO2/y against exogenous industrial
      process emissions of 127 MtCO2/y — the same near-saturation observation. Reports
      the cap's Lagrange multiplier explicitly as an indicator of policy difficulty and
      technology economics, which is the framing to use when a user asks what the carbon
      price "means".
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      The corpus's clearest NESTED-cap case and the reason the nesting pitfall exists:
      net-negative -50.5 Mt/a for Germany (to compensate non-CO2 GHGs) inside net-zero
      for Europe, with a 200 MtCO2/a European sequestration limit (400 in sensitivity).
      States that "the German carbon price is represented by the SUM of both shadow
      prices", 303.94-320.29 EUR/tCO2 across scenarios. Read only one dual and the price
      is wrong.
  - paper: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    tier: 1
    role: routine-use
    note: >
      A flat 100 EUR/tCO2 price used solely to make validation runs realistic, with no
      cap and no sensitivity analysis of the price. The minimal legitimate use of the
      price instrument: getting the fossil merit order roughly right for a backtest.
  - paper: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      EU-aligned annual caps (55% / 90% / net-zero), equivalent to ~35 GtCO2 cumulative
      2022-2050, with the dual reported per scenario and investment period and LULUCF
      offsets (up to 239 MtCO2/a from 2030) plus sequestration (up to 200 MtCO2/a by
      2050) as additional supply options. The transition-SPEED result is the one to
      quote: 2030 system-wide CO2 prices of 290 EUR/tCO2 under a slow transition versus
      137 EUR/tCO2 under a fast one — same 2050 endpoint, 2x the interim price.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      A methodologically clean sweep: an unconstrained baseline first, then 13 systems at
      fractional caps C in {10%...100%} of the baseline's own emissions, with the dual
      mu_C reported at each level as the carbon price. Defining the cap relative to the
      model's own unconstrained optimum rather than a historical year sidesteps the
      baseline-mismatch pitfall entirely — the trick to recommend outside Europe.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      No cap and no price in the optimisation: carbon is a REPORTING metric only, with
      RPS and clean-energy-standard constraints doing the policy work, and CO2e computed
      via a configurable GWP over methane leakage. Contributes the non-CO2 point this
      card otherwise cannot make — GWP and leakage rate are among the highest-impact
      uncertain parameters for total emissions, so a CO2-only cap can be the wrong
      instrument for a gas-system question.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      Cap stringency as one of three sensitivity parameters, with the finding that
      tightening it exerts "a more moderate influence" than the others and that near-zero
      outcomes are reachable without additional incentives. Cap values are not stated in
      the paper, which limits its reuse as a calibration anchor.
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: >
      Continental net-zero applied collectively over all nodes, with the dual quantifying
      what a CDR portfolio is worth: mu_CO2 falls from 723 to 649 EUR/tCO2 when the full
      CDR set is available. Also runs looser targets (30%, 20% of 1990) to establish the
      deployment ORDER of removal strategies — a cap sweep used to rank technologies
      rather than to price carbon.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      PyPSA-DE with per-investment-year CO2 budgets matched to Germany's statutory GHG
      targets, and the instrument choice stated as such: "The CO2 pricing is done
      indirectly via a budget." Non-CO2 GHGs handled by tightening the CO2 budget — the
      canonical workaround for a model that carries only CO2. Nuclear excluded and coal
      banned after 2038, i.e. the cap coexists with hard technology bans.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      The most mechanically explicit account of the budget instrument in the corpus, and
      it describes exactly what the sector chain does: "the atmosphere is represented as
      a storage unit with limited total capacity, where inflows correspond to emissions
      and the state of charge to the cumulative stock of CO2 ... the binding capacity
      constraint in the final period T implies a shadow price which corresponds to the
      CO2 price." Per-period budgets from 706 Mt in 2020 to -52 Mt (net negative) in
      2045; 30 Mt of sequestration at 300 EUR/tCO2 as an offset outside Germany. Also
      notes the price propagates uniformly across all timesteps within a period — the
      reason a single annual dual is the right object to quote.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero with a 200 MtCO2/a sequestration cap, sensitivities at 400 and unlimited
      and at 90%/95% reduction, and CO2 shadow prices reported across all scenarios
      (429 EUR/tCO2 in the default all-networks case). A good template for the joint
      cap-and-sequestration sensitivity design.
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Carbon neutrality as an EQUALITY constraint (removals == emissions) held across
      every near-optimal solution, with underground sequestration hard-capped at
      200 MtCO2/a on planetary-boundary grounds and CDR potentials capped per node by
      land use and climate. The equality form matters: it forbids overshooting into
      net-negative, so the dual is two-sided and its sign is not guaranteed.
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: routine-use
    note: >
      CO2 price as a pure input datum in a hindcast: DAILY allowance price series feeding
      each generator's marginal cost via fuel price, lower heating value, efficiency and
      the CO2 price, with a 50 EUR/tCO2 static comparison scenario. The corpus's only
      TIME-VARYING price use, and the direct analogue of pypsa-eur's dynamic emission
      pricing — a capability with no earth equivalent.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The soft-coupled case: the emissions constraint lives in REMIND (global 1000 GtCO2
      cumulative budget plus German interim and neutrality targets), carbon prices are
      iterated there until targets are met, and the resulting price is passed into
      PyPSA-Eur each iteration as a marginal-cost component with NO PyPSA-Eur cap at all.
      The clearest statement of when to use the price instrument: when the quantity
      constraint is enforced in another model.
  - paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    tier: 1
    role: routine-use
    note: >
      PyPSA-DE at carbon neutrality by 2045, with accounting spanning fossil fuel use,
      fuel synthesis, DAC, industrial carbon capture and BECCS. No explicit price; the
      budget's shadow price acts as the implicit one.
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      EU targets translated into absolute annual caps per horizon — 2072 Mt p.a. in 2030
      (-55%) and 460 Mt p.a. in 2040 (-90%), net-zero 2050 — stacked with MINIMUM
      sequestration targets (50/150/250 Mt p.a.) and green-H2 and electrolyser capacity
      floors. Its "reduced targets" scenario strips every target EXCEPT the GHG cap,
      which is the cleanest available test of whether the other mandates are redundant
      given the cap.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      Net-zero where the SEQUESTRATION cap, not the emissions cap, is the swept
      instrument: nine levels from 140 to 1000 MtCO2/a, with the CO2 shadow price
      emerging endogenously from the sequestration limit rather than being imposed.
      Demonstrates the substitution that makes the negative-emissions variant necessary
      — under net zero, the sequestration budget determines how much fossil fuel is
      permitted.
pitfalls:
  - pitfall: >
      A binding cap and a carbon price are duals, but they are NOT interchangeable under
      tightening: the response to either instrument can be non-monotone. Improving a
      clean technology under a fixed cap can reduce that technology's use, and raising
      the effective CO2 price under a cost budget can raise total emissions.
    evidence: "2018_Weber_Counter-intuitive-CO2-caps_Energy.pdf"
    note: >
      Never present a two-point comparison (base vs tightened) as a trend. Sweep at
      least 4-6 levels — cap-level-sweep exists for this reason — and if the deliverable
      is "which instrument", run BOTH directions and show where they diverge rather than
      asserting the equivalence that only holds at the fixed point.
  - pitfall: >
      The cap's dual is only meaningful when the cap BINDS. A loose cap gives mu = 0,
      which reads identically to "carbon is free" and to "the constraint was never
      added". Under this corpus's cost assumptions the electricity cap does not bind
      above roughly 40% of 1990 emissions.
    evidence: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    note: >
      Always report the realised emissions next to the cap. If emissions < cap, say "the
      target is already met by the cost optimum" — that is the answer, not a null result.
      For the dual's sign convention, weighting and degeneracy traps see
      shadow-prices-and-marginal-values; they are not repeated here.
  - pitfall: >
      The dual diverges as the cap approaches zero, and at exactly net zero the emitting
      technology often leaves the solution entirely, so there is nothing left to price.
      Quoting a net-zero run's carbon price as if it were an ETS forecast is the most
      common misuse of this method's output.
    evidence: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    note: >
      Report the price at 90-99% rather than at 100% if the user wants a policy-relevant
      number, and say which. The same paper shows how sharp the cliff is: at 99% instead
      of 100%, gas supplying just ~2.5% of generation eliminates hydrogen storage and
      fuel cells from the optimum altogether.
  - pitfall: >
      Nested or multiple caps make the carbon price non-unique. With a national cap
      inside a continental one, or per-country caps, the effective price at a location is
      the SUM of the duals binding there; reading only the outer constraint understates
      it.
    evidence: "2025_Seibold_Germany-Industry-Transformation.pdf"
    note: >
      Enumerate every row of n.global_constraints with a non-zero mu before quoting "the"
      carbon price, and state which constraints the number is the sum of. Same discipline
      applies to the sequestration limit, whose dual is a separate price on removal.
  - pitfall: >
      Under net zero the binding instrument is usually the SEQUESTRATION limit, not the
      emissions cap. Leave sequestration unbounded and the target is met by unlimited
      geological storage, fossil fuel stays in the solution and the carbon price
      collapses — the study answers a different question than the user asked.
    evidence: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    note: >
      Set sector.co2_sequestration_potential explicitly and treat it as a scenario axis,
      not a default. The corpus convention is 200 MtCO2/a Europe-wide, and the duals are
      strongly convex in it (225 EUR/t at 200 Mt/a vs 51 EUR/t at 800 Mt/a in Hofmann
      2025), so the number chosen dominates the reported price.
  - pitfall: >
      Most of the sequestration budget can already be committed to unabated industrial
      PROCESS emissions before any energy-sector abatement competes for it — ~140 of
      200 MtCO2/a in one study, 127 of 200 in another. A sequestration limit that looks
      generous can be almost fully spoken for.
    evidence: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    note: >
      Report process emissions and sequestration side by side, and check the headroom
      before promising a CCS or e-fuel result that depends on it.
  - pitfall: >
      The 1990 baseline is European and electricity-sector-shaped. Both models ship
      co2base = 1.487 GtCO2 and co2limit = 77.5 Mt/a, which are Europe's numbers; applied
      unchanged to a single country or a non-European region they produce a cap that is
      effectively unbounded, and the run succeeds with a zero carbon price.
    evidence: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    note: >
      Never accept the default baseline outside pan-European scope. Either supply an
      absolute cap from the country's own inventory (the National-Grid-FES pattern), or
      define the cap relative to the model's OWN unconstrained optimum as Aden 2026 does,
      which removes the baseline dependency entirely.
  - pitfall: >
      A stated "net zero" target in a paper or a client brief frequently means no
      emissions constraint was modelled at all — the technology set was simply restricted
      to low-carbon options. Such a study yields no carbon price and cannot answer "what
      would it cost".
    evidence: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    note: >
      Distinguish scenario-exogenous decarbonisation from an endogenous constraint at
      interview time, because they need different bundles and produce different
      deliverables. If the user wants a carbon price, the target must be a constraint.
  - pitfall: >
      A CO2-only cap is the wrong instrument for a gas-system question. Methane leakage
      converted to CO2e via GWP can dominate the total-emissions outcome, and the GWP
      horizon (20-year vs 100-year) is itself a high-impact choice the CO2 cap cannot see.
    evidence: "2026_Barnes_near-term-emission-targets.pdf"
    note: >
      Neither model carries non-CO2 gases. The corpus workaround is to TIGHTEN the CO2
      budget to absorb them (Geis 2026) or assume LULUCF offsets them (Kalweit 2025) —
      both are assumptions to state, not model outputs. Say so before promising a "GHG"
      target.
  - pitfall: >
      An economy-wide cap is met almost entirely in the power sector first, because
      heating and transport need a far higher CO2 price before fuel-switching triggers.
      One joint cap therefore understates what each sector's own target would cost.
    evidence: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    note: >
      If the user's question is sectoral, use sector-specific-or-nested-caps and report
      per-sector duals. If a single cap is kept, report the emissions split by sector so
      the concentration of abatement is visible.
  - pitfall: >
      The implied carbon price is a property of the system's FLEXIBILITY, not of the
      target. Brown 2018 reports 77 EUR/tCO2 with full flexibility and transmission and
      1184 EUR/tCO2 for heating without transmission — a 15x spread at the identical 95%
      cap.
    evidence: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    note: >
      Never quote a carbon price without the scope and flexibility assumptions attached.
      Transmission expansion limits, storage availability and sector coupling move it
      more than the cap level does.
