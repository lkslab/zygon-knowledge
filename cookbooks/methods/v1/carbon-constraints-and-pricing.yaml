pypsa_primitive:
  symbol: "pypsa/optimization/global_constraints.py:define_primary_energy_limit"
  pypsa_version: "0.30.3"
  exposed_by: "both — every CO2Limit either model adds is served by this function unless it is explicitly re-typed"
  reachable_via: >
    n.add("GlobalConstraint", name, carrier_attribute="co2_emissions", sense="<=",
    constant=<tCO2>) on any network, then optimize. The `type` attribute defaults to
    "primary_energy" (pypsa/component_attrs/global_constraints.csv), so an untyped
    constraint is picked up automatically: the function sums generator dispatch x
    carrier emission factor / efficiency x snapshot weighting, and ALSO the final state
    of non-cyclic storage units and Stores whose carrier carries the emission attribute.
    The dual lands in n.global_constraints.mu.
  note: >
    The most important fact in this card, and the reason a CO2 cap is L0/L1 on both
    models rather than L5: the constraint is library code, not workflow code. Two
    consequences. First, because it also covers non-cyclic STORES, a `co2` carrier with
    co2_emissions = -1.0 and a `co2 atmosphere` store give whole-system atmosphere
    accounting for free — which is what pypsa-earth relies on. Second, pypsa-eur
    deliberately opts OUT: its sector-chain cap is typed "co2_atmosphere", which
    define_primary_energy_limit skips, so eur must add its own
    add_co2_atmosphere_constraint / add_carbon_budget_constraint at solve time to get
    investment-period-aware and budget semantics the library primitive cannot express.
    Both use it in the electricity chain, where the cap is untyped.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: co2-cap
        role: >
          the annual cap in the electricity chain — one GlobalConstraint added in
          prepare_network, gated by electricity.co2limit_enable
      - id: co2-budget-pathway
        role: >
          the sector chain's per-horizon cap and the cumulative-budget distribution;
          registry `working`, and the only place a Gt budget can be entered
      - id: co2-atmosphere-constraint
        role: >
          the sector-coupled formulation: bounds the final state of the non-cyclic
          `co2 atmosphere` store, which is what makes DAC/BECCS/venting commensurable
      - id: co2-sequestration-limit
        role: >
          the co-instrument without which a net-zero cap is met by unlimited storage;
          its own dual is a second price
      - id: emission-pricing
        role: "the price instrument — a marginal-cost adder on emitting carriers"
      - id: dynamic-emission-pricing
        role: >
          time-varying ETS price from historical spot data; the direct analogue of
          Karkossa 2026's daily-price hindcast, and a capability earth lacks entirely
      - id: gas-usage-limit
        role: >
          the fuel-specific stand-in for a cap when the question is gas phase-down
          rather than CO2
      - id: co2-network-sequestration
        role: >
          supplies the captured-carbon buses, CO2 pipelines, regional CO2Stop storage
          potentials and DAC that the negative-emissions variant prices against
      - id: perfect-foresight
        role: >
          the prerequisite for a true inter-period cumulative budget; its registry
          consumer line already names add_carbon_budget_constraint
      - id: myopic-foresight
        role: >
          the cheaper pathway route: per-horizon caps read off co2_budget, with no
          ability to trade emissions between decades
      - id: carbon-intensity-metrics
        role: >
          registry `partial` — exposes the co2_shadow metric but no gCO2/kWh column, so
          intensity is a post-processing step
      - id: summary-outputs
        role: "where the cap's dual actually surfaces, as the metrics `co2_shadow` column"
      - id: scenario-matrix
        role: "the fan-out for cap-level-sweep — one managed run per cap or price level"
      - id: custom-constraint-hook
        role: >
          the landing point for anything the four built-in constraint types cannot
          express, e.g. a per-country cap inside a European run
    available:
      verdict: turnkey
      how: >
        Both instruments are config flips, and the sector chain's cap is on by default.
        Electricity chain: electricity.co2limit_enable: true adds one GlobalConstraint
        with the absolute tCO2 in electricity.co2limit (add_co2limit), and
        costs.emission_prices.enable: true adds the price to every emitter's marginal
        cost by carrier emission factor over efficiency (add_emission_prices), with
        costs.emission_prices.dynamic: true swapping in a smoothed historical EU-ETS
        daily series instead. Sector chain: the top-level co2_budget mapping
        (2020: 0.72 ... 2050: 0.0, i.e. the Fit-for-55 / 2040 / neutrality trajectory
        already encoded) is read per planning horizon and multiplied by an EEA+Eurostat
        1990 inventory restricted to the sectors actually enabled, giving a cap typed
        "co2_atmosphere" that solve_network enforces on the final state of the
        `co2 atmosphere` store — negative-capable, so a net-negative target is just a
        negative number. Sequestration is bounded in the same solve from
        sector.co2_sequestration_potential, and the dual arrives in the summary metrics
        as `co2_shadow`.
      missing: >
        Only procedure step 10 (the instrument sweep) has no handle, and it is a
        scenario-matrix loop rather than new formulation. Two real gaps inside the
        turnkey surface: (a) a CUMULATIVE budget in GtCO2 cannot be written in the
        config at all — the pydantic schema types co2_budget strictly as
        dict[int, float] and validate_config runs at Snakefile load, so the Gt form is
        reachable ONLY through the sector_opts wildcard tokens cb<Gt>ex<r> / cb<Gt>be<b>
        / Co2L<f>, and only meaningfully under foresight: perfect; (b) there is no
        per-country or per-sector cap — every built-in constraint is system-wide, so
        nested caps are an extra_functionality job.
      provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_sector_network.py:add_co2limit; scripts/solve_network.py:add_co2_atmosphere_constraint; scripts/make_summary.py:co2_shadow"
    levers:
      - key: "electricity.co2limit_enable"
        effect: >
          Master switch for the electricity-chain annual cap. OFF by default — an
          electricity-only run with no other change is UNCONSTRAINED, which is the
          single most common silent error with this method in eur.
        default: "false"
        provenance: "config/config.default.yaml:co2limit_enable; scripts/prepare_network.py:add_co2limit"
      - key: "electricity.co2limit"
        effect: >
          The absolute annual cap in tCO2 (not a fraction). Default 7.75e7 = 5% of
          Europe's 1990 electricity-sector emissions, the Schlachtberger 2018 number.
        default: "77500000.0"
        provenance: "config/config.default.yaml:co2limit; rules/build_electricity.smk:co2limit"
      - key: "electricity.co2base"
        effect: >
          The 1990 baseline the Co2L<f> wildcard multiplies to produce co2limit.
          1.487 GtCO2 is Europe-wide; meaningless for a single-country or non-European
          scope.
        default: "1487000000.0"
        provenance: "config/config.default.yaml:co2base; scripts/_helpers.py:update_config_from_wildcards"
      - key: "co2_budget"
        effect: >
          Top-level year -> fraction-of-1990 mapping driving the SECTOR chain's cap per
          planning horizon. The default already encodes EU policy (0.45 at 2030 = -55%,
          0.10 at 2040 = -90%, 0.0 at 2050), so a milestone pathway is a no-op and a
          custom trajectory is one edit. Typed dict[int, float] by the config schema —
          a float budget here fails validation.
        default: "{2020: 0.720, 2025: 0.648, 2030: 0.450, 2035: 0.250, 2040: 0.100, 2045: 0.050, 2050: 0.000}"
        provenance: "config/config.default.yaml:co2_budget; scripts/lib/validation/config/co2_budget.py:Co2BudgetConfig; rules/build_sector.smk:co2_budget"
      - key: "costs.emission_prices.enable"
        effect: >
          Turns on the price instrument. In the electricity chain it adds
          e_r/eta to generator and storage-unit marginal cost; in the sector chain it
          instead sets marginal_cost = -co2_price on the `co2 atmosphere` store, so
          removals are PAID the same price emissions are charged.
        default: "false"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: "costs.emission_prices.co2"
        effect: >
          The price in EUR/tCO2. May be a float OR a {year: price} dict — but the dict
          form is honoured only by the sector chain; prepare_network logs a warning and
          applies NO price at all. Same key, two behaviours.
        default: "0.0"
        provenance: "scripts/lib/validation/config/costs.py:_EmissionPricesConfig; scripts/prepare_network.py:add_emission_prices"
      - key: "costs.emission_prices.dynamic"
        effect: >
          Replaces the flat price with a historical EU-ETS daily series, smoothed by
          rolling_window days, entering generators_t.marginal_cost. Needs the
          retrieve_co2_prices rule, i.e. a (small) network fetch.
        default: "false"
        provenance: "config/config.default.yaml:dynamic; scripts/prepare_network.py:add_dynamic_emission_prices"
      - key: "costs.emission_prices.rolling_window"
        effect: "Smoothing window in days for the dynamic ETS price series."
        default: "90"
        provenance: "config/config.default.yaml:rolling_window; scripts/build_co2_prices.py:rolling_window"
      - key: "sector.co2_sequestration_potential"
        effect: >
          Annual MtCO2 that may be sequestered, per horizon. Under a net-zero cap this
          is usually the BINDING instrument and its dual is a second price. Default rises
          0 -> 250 MtCO2/a by 2045; the corpus convention is a flat 200.
        default: "{2020: 0, 2025: 0, 2030: 40, 2035: 100, 2040: 180, 2045: 250, 2050: 250}"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: "electricity.gaslimit_enable"
        effect: >
          Fuel-specific stand-in for a cap: a gas_usage GlobalConstraint over OCGT/CCGT.
          Note the carrier set includes a dead "CHP" entry that never exists in the
          electricity chain.
        default: "false"
        provenance: "config/config.default.yaml:gaslimit_enable; scripts/prepare_network.py:add_gaslimit"
      - key: "electricity.gaslimit"
        effect: "The gas budget in MWh_th; `false` means unset."
        default: "false"
        provenance: "config/config.default.yaml:gaslimit; rules/build_electricity.smk:gaslimit"
      - key: "foresight"
        effect: >
          Selects which cumulative-budget machinery exists. `perfect` builds ONE
          inter-period Co2Budget constraint on the terminal atmosphere state plus a
          net-zero constraint on the last period, letting the optimiser choose when to
          abate; `myopic` gives per-horizon caps only; `overnight` gives a single-year cap.
        default: "'overnight'"
        provenance: "config/config.default.yaml:foresight; scripts/prepare_perfect_foresight.py:set_carbon_constraints"
      - key: "energy.emissions"
        effect: >
          Which inventory scope the 1990 baseline is read at (CO2 / CO2e / All GHG),
          feeding co2_emissions_year. The only lever touching non-CO2 gases, and it moves
          the BASELINE, not the constraint.
        default: "'CO2'"
        provenance: "config/config.default.yaml:emissions; rules/build_sector.smk:emissions_scope"
      - key: "sector.co2_vent"
        effect: >
          Allows captured CO2 to be vented back to the atmosphere. Off by default;
          turning it on relaxes the carbon chain and lowers the cap's dual.
        default: "false"
        provenance: "config/config.default.yaml:co2_vent; scripts/prepare_sector_network.py:add_co2_tracking"
      - key: "solving.options.custom_extra_functionality"
        effect: >
          Where a per-country or per-sector cap goes, since every built-in CO2 constraint
          is system-wide. Key is present and points at a stub at this ref.
        default: "'../data/custom_extra_functionality.py'"
        provenance: "config/config.default.yaml:custom_extra_functionality; scripts/solve_network.py:custom_extra_functionality"
    assembly:
      - step: >
          Fix the SCOPE first, because it sets the baseline: enabling
          sector.{transport,heating,industry,agriculture} widens
          determine_emission_sectors, so the same co2_budget fraction becomes a much
          larger absolute cap. Decide this before quoting any number.
        uses: [co2-budget-pathway]
        config: "sector.transport; sector.heating; sector.industry; sector.agriculture; energy.emissions"
        code: null
        provenance: "scripts/prepare_sector_network.py:determine_emission_sectors; scripts/prepare_sector_network.py:co2_emissions_year"
      - step: >
          Pick the instrument. For a target: electricity chain set
          electricity.co2limit_enable + co2limit (absolute tCO2); sector chain set the
          co2_budget mapping (fraction of 1990 per horizon). For a price: set
          costs.emission_prices.enable + co2, or .dynamic for the historical ETS series.
          Both may be set at once, which is a cap plus a floor price, not a duplicate.
        uses: [co2-cap, emission-pricing, dynamic-emission-pricing, co2-budget-pathway]
        config: "electricity.co2limit_enable; electricity.co2limit; co2_budget; costs.emission_prices.{enable,co2,dynamic}"
        code: null
        provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:add_emission_prices; scripts/prepare_sector_network.py:add_co2limit"
      - step: >
          For a sector-coupled or net-zero/net-negative target, verify the atmosphere
          chain is intact: the `co2` carrier at co2_emissions = -1.0, the `co2 atmosphere`
          Store with e_min_pu = -1 (this is what permits net-negative), and the
          solve-time bound on its final state. Nothing to configure — but a run with
          sector coupling off has no atmosphere store and the cap silently reverts to
          generator-dispatch accounting.
        uses: [co2-atmosphere-constraint, co2-network-sequestration]
        config: "sector.co2_network; sector.co2_spatial; sector.dac; sector.co2_vent"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_co2_tracking; scripts/solve_network.py:add_co2_atmosphere_constraint"
      - step: >
          Bound the backstop in the same run: set sector.co2_sequestration_potential to
          the study's number (200 MtCO2/a is the corpus convention, not the default
          trajectory) and expect to read its dual separately.
        uses: [co2-sequestration-limit]
        config: "sector.co2_sequestration_potential"
        code: null
        provenance: "scripts/solve_network.py:add_co2_sequestration_limit; rules/solve_overnight.smk:co2_sequestration_potential"
      - step: >
          For a CUMULATIVE budget: set foresight: perfect and put the budget in the
          sector_opts wildcard as cb<Gt>ex<r> or cb<Gt>be<b> — NOT in the config, which
          the pydantic schema rejects for anything but dict[int, float].
          build_carbon_budget writes the per-horizon fractions to
          csvs/carbon_budget_distribution.csv, and set_carbon_constraints converts a float
          co2_budget into one Co2Budget GlobalConstraint plus a terminal net-zero one.
        uses: [co2-budget-pathway, perfect-foresight]
        config: "foresight: perfect; scenario.sector_opts (cb<Gt>ex<r>)"
        code: null
        provenance: "scripts/prepare_sector_network.py:build_carbon_budget; scripts/prepare_perfect_foresight.py:set_carbon_constraints; scripts/solve_network.py:add_carbon_budget_constraint"
      - step: >
          Read the dual. make_summary already writes the cap's mu as the metrics
          `co2_shadow` column and the sequestration limit's as `co2_storage_shadow`; for
          a nested design enumerate n.global_constraints and sum the binding mus.
        uses: [summary-outputs, carbon-intensity-metrics]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:co2_shadow; scripts/make_summary.py:calculate_metrics"
      - step: >
          For a sweep (cap-level-sweep, or a price curve), fan the cap or price out over
          run.scenarios so each level is a managed parallel run rather than a hand loop.
          4-6 levels minimum, per the Weber 2018 non-monotonicity pitfall.
        uses: [scenario-matrix]
        config: "run.scenarios.enable; run.scenarios.file"
        code: null
        provenance: "scripts/_helpers.py:get_scenarios; rules/common.smk:scenario_config"
      - step: >
          For a per-country or per-sector cap, write it in the custom hook: build the
          same lhs (dispatch x emission factor / efficiency x weighting, or the
          per-region atmosphere store subset) restricted to the buses of interest, and
          add one constraint per region. There is no built-in path.
        uses: [custom-constraint-hook]
        config: "solving.options.custom_extra_functionality"
        code: "the user module named by solving.options.custom_extra_functionality"
        provenance: "scripts/solve_network.py:custom_extra_functionality; scripts/solve_network.py:add_co2_atmosphere_constraint"
    boundary:
      - variant: annual-emissions-cap
        rung: L0
        note: >
          Sector chain: already on — the default co2_budget mapping runs the EU
          trajectory with zero edits. Electricity chain: L0 in the sense that
          electricity.co2limit_enable is a single boolean, but note it defaults to FALSE,
          so an electricity-only run is unconstrained unless you flip it.
      - variant: cap-level-sweep
        rung: L1
        note: >
          A list of non-default values plus run.scenarios to fan them out. No code. Cost
          is linear in the number of levels — see cost_profile.
      - variant: emissions-price
        rung: L0
        note: >
          costs.emission_prices.enable: true with a co2 value. Dynamic ETS pricing is L1
          (one more boolean) but pulls the instrat.pl ETS series via
          retrieve_co2_prices, so it is L0/L1 in code and a network fetch in practice.
      - variant: negative-emissions-and-co2-accounting
        rung: L1
        note: >
          Non-default values only: a zero or negative co2_budget entry, an explicit
          sector.co2_sequestration_potential, DAC on. The atmosphere store is already
          e_min_pu = -1, so net-negative needs no formulation work — this is the single
          biggest capability gap versus earth.
      - variant: cumulative-carbon-budget
        rung: L1
        note: >
          L1 but awkwardly so, and the awkwardness is worth stating: the Gt budget CANNOT
          be a config key, because Co2BudgetConfig is dict[int, float] and
          validate_config runs at Snakefile load. It must go in the sector_opts wildcard
          as cb<Gt>ex<r>, and needs foresight: perfect for the inter-period form. A
          milestone pathway (fractions per horizon) stays a plain config edit.
      - variant: sector-specific-or-nested-caps
        rung: L5
        note: >
          Every built-in CO2 constraint is system-wide; there is no per-country or
          per-sector cap anywhere in the workflow. Writing one is a linopy expression in
          the custom hook — genuinely bespoke, though short, since add_co2limit and
          add_co2_atmosphere_constraint are the templates to copy. A gas-only cap is the
          L0 escape hatch (electricity.gaslimit_enable) if the question is fuel-specific.
    where:
      - change: "per-country / per-sector / nested cap"
        anchor: "solving.options.custom_extra_functionality -> the user module; copy the lhs from add_co2_atmosphere_constraint"
        provenance: "scripts/solve_network.py:custom_extra_functionality; scripts/solve_network.py:add_co2_atmosphere_constraint"
      - change: "cumulative Gt budget (cannot be a config key)"
        anchor: "scenario.sector_opts cb<Gt>ex<r> token -> update_config_from_wildcards -> build_carbon_budget"
        provenance: "scripts/_helpers.py:update_config_from_wildcards; scripts/prepare_sector_network.py:build_carbon_budget"
      - change: "inter-period budget constraint under perfect foresight"
        anchor: "prepare_perfect_foresight.py::set_carbon_constraints (writes type 'Co2Budget'); solve_network.py::add_carbon_budget_constraint (enforces it)"
        provenance: "scripts/prepare_perfect_foresight.py:set_carbon_constraints; scripts/solve_network.py:add_carbon_budget_constraint"
      - change: "non-1990 or non-European baseline"
        anchor: "electricity.co2base for the electricity chain; build_eea_co2 / co2_emissions_year inputs for the sector chain"
        provenance: "scripts/prepare_sector_network.py:build_eea_co2; scripts/prepare_sector_network.py:co2_emissions_year"
      - change: "read the dual for a nested design"
        anchor: "scripts/make_summary.py (rule make_summary), metrics co2_shadow / co2_storage_shadow"
        provenance: "scripts/make_summary.py:co2_shadow"
    cost_profile:
      solves: >
        1 for any single cap, budget or price — the constraint is one row in the LP and
        costs nothing. A cap-level-sweep or price curve is one solve per level; the corpus
        uses 4-14 (Aden 2026 runs 13 plus a baseline, Zhang 2026 runs 9 sequestration
        levels, Zhu 2018 sweeps prices at multiple VRE penetrations). A cumulative budget
        under perfect foresight is ONE solve over all horizons but of roughly
        (n_horizons) x the size.
      relative: >
        Free in itself. The instrument is one added constraint; even the sector chain's
        atmosphere-store bound is a single row. The real cost is what a TIGHT cap does to
        the solution: at net zero the model must build storage, hydrogen and CDR chains,
        so LP size and solve time grow with stringency, and near-degenerate solutions at
        exactly zero emissions are slower and dual-unstable.
      note: >
        Sweeps are embarrassingly parallel — run.scenarios fans them out and each level is
        independent. The mitigation to AVOID is coarsening time resolution to afford more
        cap levels: the tight end of the sweep is exactly where storage and scarcity hours
        determine the answer, and segmentation flattens them. Prefer fewer clusters over
        coarser hours. Perfect foresight is the one genuinely expensive route: use it only
        when the deliverable needs emissions traded ACROSS horizons; per-horizon myopic
        caps answer most pathway questions at a fraction of the cost.
    verifies:
      - variant: annual-emissions-cap
        check: "'CO2Limit' in n.global_constraints.index"
        over: run
        note: >
          The constraint must actually be in the network. In eur the electricity chain
          defaults to co2limit_enable: false, so this is the check that catches the most
          common failure of this method: a run that succeeded, looks decarbonised in the
          plots because renewables are cheap anyway, and had no cap at all.
      - variant: annual-emissions-cap
        check: "n.global_constraints.at['CO2Limit', 'mu'] != 0 or emissions < n.global_constraints.at['CO2Limit', 'constant'] - 1e-6"
        over: run
        note: >
          Either the cap binds (non-zero dual) or realised emissions are strictly below
          it. Both false together means the constraint exists but was not enforced — the
          typing trap: a cap typed "co2_atmosphere" with no solve-time handler is written
          into the network, appears in every summary, and constrains nothing.
      - variant: negative-emissions-and-co2-accounting
        check: "n.stores.at['co2 atmosphere', 'e_min_pu'] == -1"
        over: run
        note: >
          Net-negative is only reachable if the atmosphere store may go below zero. If
          e_min_pu is 0 the solve still succeeds and simply reports net-zero as the best
          achievable, silently truncating the answer to a negative target.
      - variant: cumulative-carbon-budget
        check: "(n.global_constraints.type == 'Co2Budget').any()"
        over: run
        note: >
          Under perfect foresight the inter-period budget must be present as its own
          typed constraint. Absent, the run has only per-horizon caps and cannot trade
          emissions between decades — which is the entire reason the user asked for a
          budget rather than milestones.
      - variant: cap-level-sweep
        check: "len(ns) == len(cap_levels) and all('CO2Limit' in m.global_constraints.index for m in ns)"
        over: ensemble
        note: >
          A missing level silently narrows the abatement-cost curve, and given Weber
          2018's non-monotonicity a dropped point can invert the apparent trend.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: co2-cap
        role: >
          the annual cap — but reached through the `opts` WILDCARD token Co2L<f>, not a
          config boolean, and shipped ON in the default scenario
      - id: emission-pricing
        role: >
          the price instrument, likewise wildcard-gated (Ep<f>) and electricity-chain only
      - id: gas-usage-limit
        role: >
          CH4L<f> fuel budget; the numberless CH4L form is broken here because the
          fallback config key does not exist
      - id: co2-network-sequestration
        role: >
          the captured-carbon buses, optional CO2 network, DAC and the sequestration
          budget that a net-zero target must be bounded against
      - id: sector-coupled-workflow
        role: >
          where co2_budget.* applies — the per-horizon cap for a pathway lives in the
          sector chain only
      - id: myopic-foresight
        role: >
          registry `partial` — the only pathway mode earth has, so a cumulative budget
          can only be a pre-computed per-horizon cap sequence
      - id: custom-constraint-hook
        role: >
          the single extra_functionality entry point; every non-system-wide cap and the
          missing atmosphere-budget semantics land here
      - id: carbon-intensity-metrics
        role: >
          registry `partial` — and weaker than eur's: there is no co2_shadow metric at
          all, so the dual must be read off the network by hand
      - id: summary-outputs
        role: >
          the summary tables that do NOT carry the CO2 shadow price — the gap that makes
          reading the carbon price a post-processing step
      - id: scenario-matrix
        role: >
          the fan-out for a cap sweep; here it is the `opts` wildcard list, so each cap
          level is literally a different filename
    available:
      verdict: assemble
      how: >
        Both instruments exist and are one token away — but they are WILDCARD tokens, not
        config keys, which is the portability asymmetry against eur. `Co2L` in
        scenario.opts adds the CO2Limit GlobalConstraint (the default scenario ships
        `opts: ['Co2L-3h']`, so unlike eur the cap is ON out of the box); `Co2L<f>`
        multiplies electricity.co2base by f; a bare `Co2L` takes the absolute
        electricity.co2limit; and `Ep<f>` / bare `Ep` add the price to generator and
        storage-unit marginal costs. For a pathway, the config block
        co2_budget.{enable,override_co2opt,co2base_value,year} rebuilds a per-horizon cap
        in the sector chain — earth's ONE config-key advantage here, since it can express
        the baseline choice (co2limit / co2base / absolute / a float) declaratively, which
        eur cannot. electricity.automatic_emission derives a genuine per-country baseline
        from EDGAR instead of Europe's 1.487 Gt. The cap works on the sector chain too,
        but by a different route than eur: earth's CO2Limit is UNTYPED, so pypsa's
        define_primary_energy_limit serves it, and because that function also covers
        non-cyclic Stores it picks up the `co2 atmosphere` store automatically.
      missing: >
        Procedure steps 7, 8 and 9 have no handle, and step 10 is manual. Concretely:
        (a) NO cumulative budget and no inter-period constraint — there is no
        perfect-foresight mode in earth at all (the capability is absent from the
        registry), so a Gt budget must be pre-distributed into co2_budget.year fractions
        by hand and the optimiser can never choose when to abate; (b) NO dynamic /
        time-varying emission price — nothing analogous to eur's ETS spot series; (c) the
        sector chain has NO price instrument whatsoever: `emission_prices` is read only in
        prepare_network, and unlike eur there is no negative marginal cost on the
        atmosphere store, so removals are never paid; (d) the sequestration limit is a
        bare `n.config["sector"]["co2_sequestration_potential"]` scalar with a
        hard-coded default of 5 Mt and a `TODO change 200 limit (Europe)` comment — a
        single global number with no per-horizon or regional variation; (e) no co2_shadow
        in make_summary, so the carbon price is not in any output table; (f) no
        per-country or per-sector cap.
      provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:add_emission_prices; scripts/prepare_sector_network.py:add_co2_budget; scripts/solve_network.py:add_co2_sequestration_limit"
    levers:
      - key: "scenario.opts"
        effect: >
          The actual switch. `Co2L` enables the cap, `Co2L0.05` sets it to 5% of co2base,
          `Ep80` prices carbon at 80 EUR/t, `CH4L1.5` caps gas. Default is
          ['Co2L-3h'] — the cap is ON. Because it is a wildcard, every level is a separate
          output filename, which makes a sweep trivially parallel but means the cap is
          baked into paths and cannot be changed without re-running the chain.
        default: "['Co2L-3h']"
        provenance: "config.default.yaml:opts; scripts/prepare_network.py:add_co2limit"
      - key: "electricity.co2limit"
        effect: >
          Absolute annual cap in tCO2, used when the token is a bare `Co2L` with no
          number. Default 7.75e7 is Europe's 5%-of-1990 figure and is wrong for almost
          every region earth is used for.
        default: "77500000.0"
        provenance: "config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: "electricity.co2base"
        effect: >
          The baseline `Co2L<f>` multiplies. Default 1.487e9 is Europe's 1990
          electricity-sector total — for a single African or Asian country this makes any
          fractional cap effectively unbounded.
        default: "1487000000.0"
        provenance: "config.default.yaml:co2base; scripts/prepare_network.py:add_co2limit"
      - key: "electricity.automatic_emission"
        effect: >
          THE lever that makes this method honest outside Europe: derives the baseline
          from EDGAR's per-country "public electricity and heat production" series for the
          configured countries instead of co2base, then applies the Co2L factor to it.
          Off by default, and it performs a download at prepare_network time.
        default: "false"
        provenance: "config.default.yaml:automatic_emission; scripts/prepare_network.py:emission_extractor"
      - key: "electricity.automatic_emission_base_year"
        effect: >
          Which EDGAR year the automatic baseline is taken from (data covers 1970-2018).
          1990 by default, matching the corpus convention.
        default: "1990"
        provenance: "config.default.yaml:automatic_emission_base_year; scripts/prepare_network.py:emission_extractor"
      - key: "costs.emission_prices.co2"
        effect: >
          The price in EUR/tCO2 applied when a bare `Ep` token is present. Float only —
          there is no per-horizon dict form as in eur, and the sector chain never reads it.
        default: "0.0"
        provenance: "config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: "co2_budget.enable"
        effect: >
          Turns on the sector chain's per-horizon cap, rebuilt from a fraction of a chosen
          baseline for the run's investment_year. Off by default.
        default: "false"
        provenance: "config.default.yaml:co2_budget; scripts/prepare_sector_network.py:add_co2_budget"
      - key: "co2_budget.override_co2opt"
        effect: >
          Whether the per-horizon budget REPLACES a CO2Limit already added by the Co2L
          wildcard (true, with a warning) or defers to it (false). The interaction to
          check first when a pathway run's cap looks wrong: two mechanisms compete for the
          same constraint name.
        default: "true"
        provenance: "config.default.yaml:override_co2opt; scripts/prepare_sector_network.py:add_co2_budget"
      - key: "co2_budget.co2base_value"
        effect: >
          What the year fractions multiply: 'co2limit', 'co2base', 'absolute' (the
          fraction IS the tCO2), or a float. Earth's genuine advantage over eur — the
          baseline choice is declarative rather than implicit.
        default: "'co2limit'"
        provenance: "config.default.yaml:co2base_value; scripts/prepare_sector_network.py:add_co2_budget"
      - key: "co2_budget.year"
        effect: >
          The year -> factor mapping. Default is a generic linear-ish decline to 0.1 at
          2050 that reaches NO net-zero endpoint and encodes no actual policy — unlike
          eur's EU-calibrated default, this one must always be replaced.
        default: "{2020: 1.0, 2025: 0.85, 2030: 0.7, 2035: 0.55, 2040: 0.4, 2045: 0.25, 2050: 0.1}"
        provenance: "config.default.yaml:co2_budget; scripts/prepare_sector_network.py:add_co2_budget"
      - key: "sector.co2_sequestration_potential"
        effect: >
          Annual MtCO2 sequestration cap, a single scalar for the whole model with no
          per-horizon or regional variation. Read directly out of n.config at solve time
          with a hard-coded fallback of 5.
        default: "200"
        provenance: "config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: "sector.dac"
        effect: >
          Direct air capture, the removal technology a net-zero or net-negative target
          bids against. On by default.
        default: "true"
        provenance: "config.default.yaml:dac; scripts/prepare_sector_network.py:add_dac"
      - key: "sector.co2_network"
        effect: "CO2 transport pipelines between captured-carbon nodes."
        default: "true"
        provenance: "config.default.yaml:co2_network; scripts/prepare_sector_network.py:add_co2"
    assembly:
      - step: >
          Fix the baseline BEFORE anything else, because earth's defaults are European.
          Either set electricity.automatic_emission: true to derive a per-country EDGAR
          baseline (accepting the download), or supply an absolute cap in
          electricity.co2limit from the country's own inventory / NDC and use a bare
          `Co2L` token. Do not use `Co2L<f>` against the default co2base outside Europe.
        uses: [co2-cap]
        config: "electricity.automatic_emission; electricity.automatic_emission_base_year; electricity.co2limit; electricity.co2base"
        code: null
        provenance: "scripts/prepare_network.py:emission_extractor; scripts/prepare_network.py:add_co2limit"
      - step: >
          Put the instrument in the WILDCARD, not the config: add `Co2L` / `Co2L<f>` (cap)
          and/or `Ep<f>` (price) to scenario.opts. Each combination is a separate output
          path, so a sweep is a list here and snakemake fans it out for free.
        uses: [co2-cap, emission-pricing, scenario-matrix]
        config: "scenario.opts"
        code: null
        provenance: "scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:add_emission_prices"
      - step: >
          For a pathway, enable co2_budget and set co2base_value plus the year fractions
          to the study's trajectory — including a 0.0 entry if the target is net zero,
          which the default never reaches. Decide override_co2opt against whatever Co2L
          token is also in opts, or the two mechanisms will fight over the CO2Limit name.
        uses: [sector-coupled-workflow, myopic-foresight]
        config: "co2_budget.{enable,override_co2opt,co2base_value,year}; foresight: myopic; scenario.planning_horizons"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_co2_budget"
      - step: >
          For a net-zero target, check the atmosphere chain: earth's `co2` carrier is at
          co2_emissions = -1.0 and its `co2 atmosphere` Store has e_min_pu = -1, so
          negative states are permitted, and the UNTYPED CO2Limit is served by pypsa's
          define_primary_energy_limit, which covers non-cyclic Stores. That is the whole
          mechanism — there is no earth equivalent of eur's
          add_co2_atmosphere_constraint. Note the store is also e_nom_extendable, so
          nothing bounds it except the global constraint.
        uses: [co2-network-sequestration]
        config: "sector.co2_network; sector.dac; sector.cc"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_co2"
      - step: >
          Bound sequestration explicitly. It is one scalar, applied to the final state of
          the `co2 stored` Stores at solve time, with a hard-coded 5 Mt fallback and an
          in-code TODO acknowledging the 200 is Europe's number. For a regional study this
          value has to be justified from the country's storage atlas or the net-zero
          result is meaningless.
        uses: [co2-network-sequestration]
        config: "sector.co2_sequestration_potential"
        code: null
        provenance: "scripts/solve_network.py:add_co2_sequestration_limit"
      - step: >
          Extract the dual YOURSELF. make_summary has no co2_shadow column, so read
          n.global_constraints.at['CO2Limit', 'mu'] off the solved network in a
          post-processing script. This is the concrete extra step versus eur, and it is
          where the extraction contract for a carbon-price deliverable has to be written.
        uses: [summary-outputs, carbon-intensity-metrics]
        config: null
        code: "a post-processing script; make_summary does not carry the metric"
        provenance: "scripts/make_summary.py:make_summary"
      - step: >
          For anything nested, per-country, per-sector, or any inter-period budget, write
          it in extra_functionality — earth's single solve-time hook, where the existing
          H2-share and sequestration constraints already live and can be copied as
          linopy templates.
        uses: [custom-constraint-hook]
        config: null
        code: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality; scripts/solve_network.py:add_co2_sequestration_limit"
    boundary:
      - variant: annual-emissions-cap
        rung: L0
        note: >
          On by default — scenario.opts ships ['Co2L-3h']. But L0 only in mechanism: the
          NUMBER it applies is Europe's 77.5 Mt/a, so for any non-European scope the
          honest rung is L3 (see data_dependencies) because a defensible baseline is a
          data problem, not a config one.
      - variant: cap-level-sweep
        rung: L1
        note: >
          A list of Co2L<f> tokens in scenario.opts. Cheaper to orchestrate than eur's
          scenario files because the wildcard already partitions outputs by level; the
          cost is that the cap value is embedded in every filename.
      - variant: emissions-price
        rung: L1
        note: >
          `Ep<f>` in opts, or bare `Ep` plus costs.emission_prices.co2. Two caveats: the
          token test is a substring match, so any opts token containing "Ep" turns
          pricing on; and there is no time-varying price at all, so Karkossa-style
          daily-ETS hindcasting is out of reach without new code.
      - variant: cumulative-carbon-budget
        rung: L1
        note: >
          L1 for the DEGRADED form only: co2_budget.year is a per-horizon fraction
          sequence you compute yourself, so a Gt budget must be pre-distributed by hand
          (exponential or beta decay done offline). The true inter-period form is
          unreachable — perfect foresight does not exist in earth at all, so the optimiser
          can never trade emissions between horizons. This is the sharpest single gap
          versus eur, which has both the cb<Gt>ex<r> distributor and the Co2Budget
          constraint.
      - variant: negative-emissions-and-co2-accounting
        rung: L2
        note: >
          The pieces exist — negative-capable atmosphere store, DAC, CO2 network,
          sequestration cap — and the untyped CO2Limit picks the store up via pypsa's
          primary-energy path, so a zero or negative cap is mechanically expressible. L2
          rather than L1 because the sequestration limit is a bare scalar with a 5 Mt
          hard-coded fallback and a TODO in the source, and because there is no CO2 price
          on the atmosphere store, so removals are never remunerated the way eur
          remunerates them. Expect a small localised edit to make the removal economics
          match the literature's.
      - variant: sector-specific-or-nested-caps
        rung: L5
        note: >
          As eur: no built-in path, one system-wide constraint only. Marginally easier
          here in that extra_functionality already hosts several bespoke linopy
          constraints to copy; marginally harder in that there is no
          add_co2_atmosphere_constraint template and no per-country emission inventory
          plumbed in.
    where:
      - change: "negative-emissions removal economics (price on the atmosphere store)"
        anchor: "scripts/prepare_sector_network.py::add_co2 — the `co2 atmosphere` Store has no marginal_cost, unlike eur's add_co2_tracking"
        provenance: "scripts/prepare_sector_network.py:add_co2"
      - change: "sequestration limit beyond one global scalar"
        anchor: "scripts/solve_network.py::add_co2_sequestration_limit (carries a TODO about the 200 Mt Europe number)"
        provenance: "scripts/solve_network.py:add_co2_sequestration_limit"
      - change: "per-country / per-sector / nested cap, or any inter-period budget"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "read the cap's dual (no summary column exists)"
        anchor: "n.global_constraints.at['CO2Limit','mu'] in a post-processing script; make_summary carries no co2_shadow"
        provenance: "scripts/make_summary.py:make_summary"
      - change: "per-country 1990 baseline"
        anchor: "electricity.automatic_emission -> prepare_network.py::emission_extractor (EDGAR v6.0, 1970-2018)"
        provenance: "scripts/prepare_network.py:emission_extractor; scripts/prepare_network.py:download_emission_data"
    data_dependencies:
      - input: "a defensible per-country/regional 1990 (or other base year) emissions baseline"
        required_for: annual-emissions-cap
        availability: >
          must be built — the shipped electricity.co2base (1.487 GtCO2) and co2limit
          (77.5 Mt/a) are Europe's electricity-sector figures. The in-repo route is
          electricity.automatic_emission, which downloads EDGAR v6.0 and extracts the
          "public electricity and heat production" series per ISO3 country; it is off by
          default and it is a network fetch, so flag it before running. Its own failure
          mode is worth knowing: the downloader swallows exceptions and returns False, and
          emission_extractor raises a clear ValueError if the country/year lookup comes
          back empty — so a missing country fails loudly rather than producing a silent
          zero cap. Check cookbooks/pypsa-earth/data_quality for the country's grade
          before promising a target-cost number.
      - input: "regional geological CO2 storage potential"
        required_for: negative-emissions-and-co2-accounting
        availability: >
          absent — sector.co2_sequestration_potential is one global scalar defaulting to
          200 (Europe's convention) with a 5 Mt fallback in code and a TODO admitting the
          number is European. Earth has no CO2Stop-style regional potential dataset
          equivalent to eur's build_co2_sequestration_potentials, so any CCS/CDR result
          outside Europe rests on a number the user must sign off.
      - input: "sector emission inventories for a non-electricity or economy-wide cap"
        required_for: sector-specific-or-nested-caps
        availability: >
          absent — the EDGAR extraction is restricted to public electricity and heat
          production, and there is no per-sector co2_totals equivalent to eur's
          EEA+Eurostat build. An economy-wide cap outside Europe is a data-assembly job
          before it is a modelling one.
    cost_profile:
      solves: >
        1 per cap or price level, as in eur. A sweep is a list of Co2L<f> tokens and each
        level is an independent snakemake target. A pathway is one solve per planning
        horizon under myopic foresight; there is no perfect-foresight option, so the
        expensive all-horizons single solve is simply unavailable.
      relative: >
        Free in itself, and earth's base cases are typically cheaper than eur's — smaller
        country scopes, electricity-only defaults, coarser default clustering — so a
        10-14 level abatement-cost curve is more tractable here than on a sector-coupled
        European run.
      note: >
        The cost that does bite is upstream of the solve: turning on
        electricity.automatic_emission adds a download, and building a defensible regional
        baseline and storage potential is analyst time rather than compute. Budget for that
        before quoting a carbon price, because on earth the number's credibility is limited
        by the baseline, not by the LP.
    verifies:
      - variant: annual-emissions-cap
        check: "'CO2Limit' in n.global_constraints.index and n.global_constraints.at['CO2Limit', 'constant'] > 0"
        over: run
        note: >
          Catches the two earth-specific failures at once: the Co2L token silently absent
          from the opts wildcard (nothing in the config would reveal it), and a cap
          computed from the European co2base that is so large it cannot bind — the run
          succeeds and reports a fully fossil system as "meeting the target".
      - variant: negative-emissions-and-co2-accounting
        check: "n.carriers.at['co2', 'co2_emissions'] == -1.0 and not n.stores.query(\"carrier == 'co2' and not e_cyclic\").empty"
        over: run
        note: >
          Earth relies entirely on pypsa's define_primary_energy_limit picking the
          atmosphere store up by CARRIER, so both the -1.0 emission attribute and the
          store's non-cyclic status are load-bearing. Break either and the cap silently
          reverts to counting generator dispatch only, which ignores every capture,
          DAC and process-emission flow.
      - variant: cumulative-carbon-budget
        check: "abs(sum(n.global_constraints.at['CO2Limit', 'constant'] for n in ns) - budget_tco2) < 0.01 * budget_tco2"
        over: ensemble
        note: >
          Because earth cannot enforce a budget across horizons, the only guarantee is
          arithmetic: the per-horizon caps you wrote into co2_budget.year must sum (with
          horizon weightings) to the intended budget. A mismatch means the offline
          distribution was wrong and the pathway respects no budget at all.
      - variant: cap-level-sweep
        check: "len({n.global_constraints.at['CO2Limit', 'constant'] for n in ns}) == len(ns)"
        over: ensemble
        note: >
          Every run in the sweep must carry a DISTINCT cap. Identical constants mean the
          Co2L<f> factors did not parse — the token regex takes only a trailing number, so
          a malformed token falls through to the flat config value and the whole sweep
          silently collapses onto one cap level.
