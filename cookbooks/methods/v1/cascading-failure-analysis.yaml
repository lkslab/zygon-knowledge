id: cascading-failure-analysis
title: "Cascading failure analysis (overload propagation and successive tripping)"
summary: >
  Remove an element from an already-solved network, redistribute the linear flows, trip
  whatever is now overloaded, and repeat until the cascade stops — then report how far it
  spread and how much load was lost.
question: >
  If one line fails, does the failure stay local or does it cascade — and how large is the
  blackout at the end of it?
aliases:
  - "cascading failure"
  - "cascading outage"
  - "cascade simulation"
  - "quasi-steady-state cascade"
  - "overload propagation"
  - "successive tripping"
  - "line outage distribution factor"
  - "LODF"
  - "outage distribution factor"
  - "dual theory of line outages"
  - "cycle-flow outage propagation"
  - "system split"
  - "islanding"
  - "blackout size distribution"
  - "critical infrastructure failure"
  - "N-2 contingency screening"
  - "RoCoF"
when_to_use:
  - "what happens after a line trips — does it spread"
  - "how big could a blackout get in this system"
  - "which lines are critical infrastructure"
  - "does decarbonisation make cascading failures more or less likely"
  - "will the grid split into islands if this corridor fails"
  - "how much load would we lose in the worst single failure"
  - "rank the transmission corridors by how much damage losing them does"
  - "is the failure effect local or does it show up far away in the grid"
  - "does adding inertia or reinforcing the grid stop the cascade"
  - "how would a failure here propagate into gas or heat as well"
family: grid-and-security
prevalence:
  papers: 3
  tier1: 3
  tier2: 0
  sweep_hits: 9
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) matched 2 papers to this slug: Titz
    2026 (the cascade simulation itself) and Ronellenfitsch 2017 (the LODF theory the
    redistribution step needs). Gazafroudi 2021 (Network Boosters) is counted here as a
    third, by judgement rather than by pass 1's assignment: pass 1 routed it entirely to
    n-1-security-and-contingency, but it is the only corpus paper that models a
    post-contingency ACTION arresting an overload before it propagates, which is the
    corrective-action-cascade variant below and has no other home. The regex screen
    returned 9 and OVER-counts badly (7 excess): the pattern includes `blackout` and
    `critical infrastructure failure`, which Brown 2018 (Burden of Proof), Weber 2018,
    Glaum 2026 and Grochowicz 2023 use rhetorically in framing paragraphs, and
    Gazafroudi's N-1-Contingency-Topology paper matches on "line outage distribution" for
    a matrix it computes but never iterates. All are mention-only for THIS method and are
    excluded. Three papers is genuinely small, and that is the finding: cascade simulation
    is the least-practised method in this corpus despite the corpus being full of
    grid-security language, because it is not an optimisation and no PyPSA workflow runs
    it.
procedure:
  - step: >
      Start from an ALREADY-SOLVED network and freeze it. This is the step that makes the
      method structurally unlike everything else in this book: the cascade is a simulation
      over a fixed dispatch and a fixed set of capacities, not an optimisation. Titz 2026
      holds generation and HVDC injections constant for the whole cascade, so no
      redispatch, no re-optimisation and no load-following happens between tripping
      rounds.
    handle: "the solved network artefact from the standard workflow"
    provenance: "scripts/solve_network.py:solve_network"
  - step: >
      Define the trigger set: which element (or pair of elements) is removed to start the
      cascade. Titz 2026 sweeps all N-2 pairs of transmission circuits and explicitly
      EXCLUDES bridges from the trigger set — a bridge outage disconnects the graph by
      definition, so it produces a split with no propagation to study. Parallel circuits
      on the same aggregated corridor are treated as one element and the resulting
      duplicate combinations are weighted rather than double-counted.
    handle: null
    provenance: null
  - step: >
      Remove the element and recompute the linear flow redistribution on the surviving
      network. Two equivalent routes: re-run the DC power flow on the reduced network, or
      apply outage distribution factors to the pre-outage flows —
      f_k^after = f_k^before + LODF_kl * f_l^before. The factor route is what makes a
      sweep over millions of contingencies affordable, because the sensitivity matrix is
      built once per topology rather than once per contingency.
    handle: "n.lpf_contingency(snapshot, branch_outages) / sub_network.calculate_BODF()"
    provenance: "pypsa/contingency.py:network_lpf_contingency; pypsa/contingency.py:calculate_BODF"
  - step: >
      Derive the distribution factors themselves. PyPSA builds them from the nodal PTDF
      (BODF_kl = branch_PTDF * (1 - PTDF_ll)^-1, diagonal forced to -1), which is a dense
      L x L matrix. Ronellenfitsch 2017 derives the same quantity in the DUAL cycle-flow
      basis via a Woodbury identity, LODF_kl = -(u_k^t M u_l)/(u_l^t M u_l) with
      M = C A^-1 C^t, which is cheaper on sparse networks, generalises to several
      simultaneous outages in one formula, and covers arbitrary reactance changes rather
      than only full removal.
    handle: "sub_network.calculate_BODF() (PTDF route only — the dual route is unimplemented)"
    provenance: "pypsa/contingency.py:calculate_BODF; pypsa/pf.py:calculate_PTDF"
  - step: >
      Find the newly overloaded branches: |f_k^after| > limit_k. The limit is a policy
      choice, not a datum — pre-contingency rating, the derated s_max_pu * s_nom the
      solved network was optimised under, or a transiently admissible loading above
      nominal. Which one you pick changes the cascade size directly and nothing in the
      network records the choice.
    handle: null
    provenance: null
  - step: >
      Trip them and iterate. Titz 2026 removes ALL overloaded lines simultaneously at each
      round (including every parallel circuit of an aggregated corridor), recomputes the DC
      flows on the new topology, and repeats until either no violation remains or the
      network separates into disconnected components. Simultaneous rather than
      one-at-a-time tripping is the quasi-steady-state convention and it matters: sequential
      tripping gives a different, generally smaller, cascade.
    handle: null
    provenance: null
  - step: >
      Detect and resolve system splits. When the surviving graph is disconnected, each
      island is its own balancing problem: recompute connected components, and per island
      decide whether frequency can be held. Titz 2026 classifies an island as blacked out
      using a rate-of-change-of-frequency criterion, RoCoF = f0 * dP / (2 * E_kin), against
      a 1 Hz/s threshold — which is why inertia, a quantity no PyPSA workflow carries,
      enters a purely topological simulation.
    handle: "n.determine_network_topology() (component detection only — no frequency criterion)"
    provenance: "pypsa/components.py:determine_network_topology"
  - step: >
      Score the cascade: number of lines tripped, number of rounds, whether a split
      occurred, and the lost load. Lost load is the outcome users actually ask about and it
      requires the island-level accounting from the previous step, not just the line count.
    handle: null
    provenance: null
  - step: >
      Repeat over the whole trigger set to get a DISTRIBUTION rather than a case study.
      Titz 2026 runs ~1.1e9 N-2 contingencies per CO2 scenario, per time step, across six
      scenarios — the sweep, not the single cascade, is where the compute is, and it is
      what turns the method from an anecdote into a risk statement.
    handle: null
    provenance: null
  - step: >
      (countermeasure extension) Wrap the whole sweep in an outer search over an
      intervention and re-run it. Titz 2026's greedy inertia placement: add a fixed
      increment of synthetic inertia at the node that most reduces aggregated lost load,
      doubling the increment when no node improves, re-evaluating the cascade distribution
      at each iteration. This is the only way the method feeds back into a design decision.
    handle: null
    provenance: null
variants:
  - id: single-outage-flow-redistribution
    what: >
      The cheap first step and a complete method in its own right: remove one branch, apply
      the distribution factors once, and rank contingencies by post-outage loading without
      iterating at all. Answers "which single failures would overload something" and
      screens the trigger set down to the ones worth cascading. This is the ONE variant with
      a real handle end to end — pypsa's n.lpf_contingency returns exactly the
      num_branch x num_outage table of post-outage flows.
    papers:
      - "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
  - id: cycle-flow-propagation-analysis
    what: >
      Use the dual (cycle-flow) formulation not merely to compute LODFs faster but to
      reason about WHERE the effect goes. Ronellenfitsch 2017 proves that in planar
      networks the induced cycle flows split into two sign-coherent domains and decay
      monotonically with distance in the dual graph, so an outage's effect is provably
      local; and that non-planar grids decompose into a local geometric part plus a
      non-local topological part, so effects can appear at arbitrary distance. That
      distinction is the answer to "is this failure local", and it is a property of the
      topology alone — no dispatch needed.
    papers:
      - "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
  - id: iterative-overload-cascade
    what: >
      The method proper: trip, redistribute, trip again, until quiescence or separation,
      for ONE initial contingency. Adds the loop, the tripping rule (simultaneous vs
      sequential), the overload threshold and the split detection to the single-outage
      step. Note the topology changes every round, so the distribution factors must be
      rebuilt each round — the cheap-matrix argument only holds within a round.
    papers:
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
  - id: cascade-size-distribution
    what: >
      Sweep the loop over the whole trigger set (all N-1, or all N-2 pairs) and over
      snapshots, and report the distribution of cascade sizes and lost load rather than one
      cascade. This is what makes the method a risk assessment and it is where the cost
      explodes: Titz 2026 reaches ~1.1e9 N-2 contingencies per CO2 level on a 600-node
      3-hourly network. The comparison across scenarios (CO2 58% to 0%) is the actual
      deliverable.
    papers:
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
  - id: coupled-infrastructure-cascade
    what: >
      Extend the propagation beyond electricity: a failure in the power network disables
      loads that are themselves other infrastructures, and the cascade continues in the
      coupled system. Titz 2026 is framed as cascading failures in critical
      infrastructures, and the electricity cascade is the inner engine of that framing.
      Structurally this needs a dependency map from electrical buses to the dependent
      infrastructure, which is data no energy-system model holds.
    papers:
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
  - id: corrective-action-cascade
    what: >
      Let something intervene between rounds. Gazafroudi 2021's network boosters are
      fast-acting storage/DSM devices sized so that a post-contingency overload up to a
      transiently admissible loading (f_tatl 1.0-1.5, default 1.3) is relieved within
      minutes rather than tripping — i.e. the cascade is arrested at round one by design.
      Gazafroudi solves this as an OPTIMISATION (sizing the devices inside an SCOPF); read
      as a cascade variant it supplies the missing ingredient the simulation lacks, namely
      a rule for what acts before the next trip.
    papers:
      - "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
  - id: greedy-inertia-placement
    what: >
      An outer optimisation loop wrapped around the cascade sweep: place a fixed increment
      of synthetic inertia (synchronous condensers or grid-forming inverters) at the node
      that most reduces expected lost load, double the increment if no node helps, repeat.
      Recorded in EVIDENCE.yaml:unmatched_methods as `inertia-placement-optimisation`; it
      lives here rather than as its own card because every objective evaluation IS a full
      cascade-size-distribution run, which is what makes it expensive.
    papers:
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
literature:
  - paper: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    tier: 1
    role: defines
    note: >
      The one corpus paper that actually runs a cascade on a PyPSA-Eur network, and the
      source of every procedural detail on this card. "For each scenario and time step, we
      evaluate all N-2 contingencies by removing pairs of transmission circuits. Power
      flows are recalculated and overloaded lines are iteratively removed until no further
      violations occur or the system separates into disconnected components" (Sec. II,
      Appendix C). The conventions to copy: quasi-steady-state DC flows recomputed each
      round; ALL overloaded lines removed simultaneously, including every parallel circuit
      of an aggregated corridor; generation and HVDC injections held constant through the
      cascade; bridges excluded from the trigger set; duplicate corridor combinations
      weighted rather than repeated; islands classified as blacked out via RoCoF =
      f0*dP/(2*E_kin) against a 1 Hz/s threshold (Eq. 2, Eq. C1). Scale: 600 nodes,
      electricity-only, 3h, weather year 2013, six CO2 levels from 58% to 0% of 1990, and
      ~1.1e9 N-2 contingencies per CO2 level. Its N-1-secure dispatch stage is the OTHER
      card's territory (n-1-security-and-contingency); what is here is everything that
      happens after that dispatch is fixed. Also contributes the greedy inertia-placement
      countermeasure search.
  - paper: "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
    tier: 1
    role: canonical-use
    note: >
      The theory of the redistribution step, and the reason the cheap variant is cheap. A
      dual/cycle-flow formalism (Lemma 1: A * Delta_f = q, a Poisson equation on the dual
      graph) yields LODFs as LODF_kl = -(u_k^t M u_l)/(u_l^t M u_l) with M = C A^-1 C^t —
      the same cycle basis PyPSA's Kirchhoff LOPF formulation already builds, which is why
      this is a natural fit that nobody has implemented. Beyond speed it gives the
      LOCALITY result that a cascade study needs: for PLANAR networks the induced cycle
      flows split into two sign-coherent connected domains D+ and D- (Prop. 3) and the
      max/min cycle flow decays monotonically with dual-graph distance (Prop. 4), so
      outage effects are provably local; for NON-planar networks the cycle response
      decomposes into a local geometric part and a non-local topological part (Prop. 5,
      Cor. 1), so effects can surface at arbitrary distance. Stated purpose, quotable to a
      user: to understand "whether the effects are predominantly local or affect also
      remote areas of the grid" (Sec. VI). Validated on MATPOWER test grids (case300,
      case1354pegase, case2383wp, GBnetwork, a 30-bus illustration) and NOT on PyPSA — the
      gap between the theory and any PyPSA workflow is total.
  - paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    tier: 1
    role: extends
    note: >
      Counted here for one specific contribution: it is the only corpus paper that models
      an ACTION taken after an outage and before the next trip. Corrective security allows
      temporary overload up to a TATL (f_tatl 1.0-1.5, default 1.3 x PATL) until network
      boosters — fast storage/DSM at 0.5 MWh per MW, reference cost 23 EUR/kW/a annualised
      at 7% — counteract it within minutes; explicit PTDF/LODF contingency constraints over
      all 50 single line outages on a 50-bus German network built from PyPSA-Eur data.
      Read as a cascade paper it supplies the intervention rule that the pure simulation
      omits, and its TATL number is the honest answer to "what threshold do I trip at".
      Read as what it is, it is a preventive/corrective SCOPF and therefore belongs to
      n-1-security-and-contingency, where it is the `corrective-scopf-with-post-
      contingency-actions` variant; the 100 GB RAM figure it reports at FIFTY buses is the
      warning that motivates doing cascades as simulation rather than as constraints.
pitfalls:
  - pitfall: >
      The cascade is only as meaningful as the dispatch you froze. Generation and HVDC
      injections are held constant for the whole cascade, so a real system's redispatch,
      automatic generation control and load response are all absent — the simulated cascade
      is an upper bound on propagation under a no-response assumption, not a forecast.
    evidence: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    note: >
      State the frozen-dispatch assumption alongside every cascade size. If the user's
      question is whether operators could have stopped it, this method cannot answer it and
      corrective-action-cascade is the framing they need.
  - pitfall: >
      Cascade size is extremely sensitive to the overload threshold and the tripping rule,
      neither of which the network records. Tripping at nominal rating versus at the
      derated s_max_pu the solve used, and tripping all violations simultaneously versus
      one at a time, produce materially different cascades from identical inputs.
    evidence: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    note: >
      Fix the convention explicitly and report it as a parameter: Titz's is simultaneous
      removal of all overloaded lines including parallel circuits. Run at least two
      thresholds; the spread is the honest result.
  - pitfall: >
      Running a cascade on a CLUSTERED network conflates one aggregated corridor with the
      several real circuits it stands for. A 600-node PyPSA-Eur "line" is a corridor of
      parallel circuits, so removing it is not an N-1 event, and the N-2 trigger set built
      from it is not the real N-2 set.
    evidence: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    note: >
      Titz's handling is the pattern to copy: treat parallel circuits at the same corridor
      as a unit, weight duplicate failure combinations rather than double-counting, and
      exclude bridges from triggers. Never present cluster-level cascade sizes as
      circuit-level reliability numbers.
  - pitfall: >
      Whether an outage effect is local at all is a property of the topology, not of the
      dispatch — and it flips with planarity. In planar networks effects decay monotonically
      with dual-graph distance; in non-planar ones a topological component appears at
      arbitrary distance. A real transmission grid with HVDC overlays is not planar, so
      "failures stay local" is an assumption that the network structure can invalidate.
    evidence: "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
    note: >
      Do not screen the trigger set by geographic proximity. If you prune, prune by LODF
      magnitude, which captures the topological term; geographic pruning silently discards
      exactly the non-local cases that make a cascade newsworthy.
  - pitfall: >
      Islanding is where the method leaves the model's competence entirely. Deciding whether
      a disconnected island survives needs kinetic energy / inertia, which is not a PyPSA
      attribute at all — the registry rates inertia-stability `absent` on both models — so
      the RoCoF criterion has to be reconstructed from carrier assumptions the modeller
      invents.
    evidence: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    note: >
      Either stop at "the system split" and report that as the outcome, or document the
      per-carrier inertia constants as a separate, user-signed-off dataset. Do not let an
      invented inertia table become an unstated part of a lost-load number.
  - pitfall: >
      The distribution factors go stale within the cascade. LODFs/BODFs are computed for one
      topology; after the first round of tripping the topology has changed, so reusing the
      original matrix understates propagation. It is a tempting optimisation precisely
      because rebuilding the matrix each round is what makes the sweep expensive.
    evidence: "2017_Ronellenfitsch_Dual-theory-transmission-line-outages_TPWRS.pdf"
    note: >
      Rebuild per round, or use Ronellenfitsch's multiple-simultaneous-outage formula,
      which handles a set of removals in one Woodbury update and is the principled version
      of the shortcut. Never carry a single-outage matrix through a multi-round cascade.
  - pitfall: >
      Enforcing preventive N-1 in the dispatch does not mean no cascade is possible, and a
      cascade study on an N-1-secure network is not redundant. Titz's design does both: the
      dispatch is N-1 secure by construction and the N-2 sweep still finds cascades. Users
      routinely assume the first result makes the second unnecessary.
    evidence: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    note: >
      Say plainly which criterion the network satisfies (usually only the 0.7 derating
      proxy — see n-1-security-and-contingency) and that the cascade sweep starts one level
      beyond it.
requires_methods:
  - linearised-optimal-power-flow
combines_with:
  - n-1-security-and-contingency
  - transmission-expansion-cooptimisation
  - spatial-clustering-and-resolution
  - extreme-event-and-dunkelflaute-analysis
  - operational-dispatch-and-rolling-horizon
  - sensitivity-and-uncertainty-sweeps
  - zonal-nodal-and-redispatch
topics:
  - extreme-weather-resilience
  - system-inertia-stability
  - grid-congestion-redispatch
  - transmission-expansion-planning
  - resource-adequacy
  - ultra-high-voltage-transmission
pypsa_primitive:
  symbol: "pypsa/contingency.py:network_lpf_contingency"
  pypsa_version: "0.30.3"
  exposed_by: "neither — no config key, rule or script in pypsa-eur or pypsa-earth calls it, and neither repo contains the string `cascad`, `LODF`, `BODF`, `branch_outages` or `overload` anywhere in scripts/, rules/ or config"
  reachable_via: >
    A driver script that loads a solved .nc and calls n.lpf_contingency(snapshot,
    branch_outages). Bound onto Network as `lpf_contingency` in
    pypsa/components.py:network_lpf_contingency; calculate_BODF is bound onto SubNetwork
    as `calculate_BODF` in the same module. Signature at 0.30.3:
    network_lpf_contingency(n, snapshots=None, branch_outages=None) -> DataFrame of
    num_passive_branch x (1 + num_outages) post-outage flows, first column 'base'. It runs
    n.lpf(snapshot) itself, builds BODF once per sub_network, then applies
    p0_new = p0_base + BODF[:, l] * p0_base[l] per outage. Two constraints to plan around:
    it handles ONE snapshot only (it warns and takes snapshots[0] if given a sequence),
    and branch_outages entries must be (component, name) tuples or it warns and assumes
    'Line'.
  note: >
    This field is the whole verdict for this card and it is better news than expected. Step
    3 of the procedure — the linear flow redistribution, the part with the actual linear
    algebra — is fully implemented library code, as is the BODF construction in step 4.
    What is NOT there, anywhere at any layer: the iteration. lpf_contingency returns a
    single round of post-outage flows and stops; there is no overload comparison, no
    tripping, no re-computation on the reduced topology, no island handling, no lost-load
    accounting, no sweep. `cascad`, `overload` and `trip` appear nowhere in pypsa 0.30.3
    except one docstring line in optimization/abstract.py. So the honest classification is
    L5-with-a-handle for the cascade and `primitive-only` overall: you write a loop around
    a library call, not a power-flow engine. Two further handles are worth knowing:
    n.determine_network_topology() (pypsa/components.py) rebuilds sub_networks from
    connected components and is the split detector, and calculate_PTDF (pypsa/pf.py) is the
    dense factor pypsa's BODF is derived from. Ronellenfitsch's dual/cycle-flow LODF is NOT
    implemented — pypsa's route is PTDF-derived and dense, exactly as the
    n-1-security-and-contingency card verified for optimize_security_constrained. Soft
    anchor: pypsa is a conda dependency, not a submodule, so this is pinned to a version
    string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: contingency-scopf
        role: >
          the nearest registry entry and it is `absent` — note it is about the OPTIMISATION
          form of security; there is no registry id for post-hoc cascade simulation at all,
          which is itself the finding
      - id: line-security-margin
        role: >
          registry status `working`: the only security concept a default run carries, and
          the source of the threshold ambiguity — it sets n.lines.s_max_pu to 0.7, so a
          solved network's lines are already derated and "overloaded" needs defining
          against nominal or against the derated limit
      - id: inertia-stability
        role: >
          registry status `absent`, and the hard blocker for the islanding step: no
          frequency dynamics, no inertia attribute, no kinetic-energy accounting, so
          Titz's RoCoF classification has no data to stand on
      - id: operations-only-solve
        role: >
          the substrate: a cascade needs a solved network with capacities fixed, and this
          rule already produces exactly that artefact — eur has it and earth does not
      - id: custom-constraint-hook
        role: >
          mostly a red herring for this method — the cascade is post-solve, so there is no
          constraint to add; relevant only for the corrective-action-cascade variant, whose
          device sizing IS an optimisation
      - id: summary-outputs
        role: >
          the reporting surface to hang cascade size / lost-load tables on; make_summary
          already computes per-run line volume and curtailment metrics
      - id: plotting-suite
        role: >
          where a critical-infrastructure map lands: plot_power_network already draws the
          line network, so colouring by cascade contribution is a plotting edit, not new
          geometry
      - id: post-discretization
        role: >
          materially relevant here, unlike in most cards: a fractional expanded line is not
          a circuit you can trip, so any cascade over an expansion result needs integer
          capacities to be a physical topology at all
      - id: iterative-impedance-expansion
        role: >
          reactance-consistency — BODFs are a function of reactance, so a cascade run on an
          expansion result computed with skip_iterations is using stale sensitivities
    available:
      verdict: absent
      how: >
        Nothing in pypsa-eur performs, or has any surface for, cascade analysis. Verified by
        grep at this ref: `cascad`, `LODF`, `BODF`, `branch_outages` and `overload` return
        zero hits across scripts/, rules/, config/ and the Snakefile; the only `contingency`
        hits are electricity.operational_reserve.contingency, a fixed-MW GENERATOR reserve
        adder with no reference to the network, and `trip` appears only inside unrelated
        words. There is no rule that consumes a solved network and analyses topology, and no
        registry id for the capability. The verdict is `absent` rather than `primitive-only`
        because for THIS model there is genuinely nothing — the primitive that does exist
        (n.lpf_contingency) is a pypsa library call reachable from any driver script and is
        recorded in pypsa_primitive; it is not exposed, referenced or wrapped by pypsa-eur
        in any way. What the workflow DOES give you is the input: a solved .nc with fixed
        capacities and dispatch, which is precisely and only step 1 of the procedure.
      missing: >
        Procedure steps 2 and 5 through 10 have no handle in the workflow: no trigger-set
        definition, no overload test, no tripping loop, no island detection or resolution,
        no lost-load accounting, no sweep harness, no countermeasure search. Steps 3 and 4
        have a handle only in the library. Additionally, the two inputs the method needs
        beyond the network do not exist here: per-carrier inertia constants for the RoCoF
        criterion (registry: inertia-stability `absent`) and any bus-to-dependent-
        infrastructure map for coupled-infrastructure-cascade. Titz 2026 did this work
        entirely outside the workflow on PyPSA-Eur OUTPUTS, which is the correct pattern to
        reproduce. NOTE on the levers below, which the checker flags as inconsistent with
        `absent`: none of them tunes the method. Not one config key in either model touches
        a cascade. They are listed because they shape the INPUT the simulation consumes —
        the threshold it trips at, whether the topology is trippable, how many snapshots the
        sweep must cover — and getting them wrong invalidates the cascade silently. The
        verdict stays `absent` deliberately.
      provenance: "scripts/solve_network.py:solve_network; scripts/prepare_network.py:set_line_s_max_pu; scripts/solve_network.py:add_operational_reserve_margin"
    levers:
      - key: "lines.s_max_pu"
        effect: >
          Not a cascade lever, but the one config value that changes every cascade result:
          it is the limit the solved flows respect, so it defines both the headroom the
          cascade eats into and the candidate threshold to trip at. Solving at 1.0 and
          tripping at 1.0 is a different experiment from solving at 0.7 and tripping at
          1.0.
        default: "0.7"
        provenance: "config/config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          The primary affordability lever for the sweep: the cascade is evaluated per
          snapshot, so the trigger set is multiplied by the snapshot count. Titz used 3h
          (2920 steps) rather than hourly for a 600-node N-2 sweep.
        default: "false (hourly)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours"
      - key: "solving.options.post_discretization.enable"
        effect: >
          Rounds expanded line/link capacity to discrete unit sizes. Turn this on before
          cascading an expansion result — a fractional corridor is not a set of circuits
          that can be individually tripped.
        default: "false"
        provenance: "config/config.default.yaml:post_discretization; scripts/solve_network.py:post_discretization"
      - key: "solving.options.skip_iterations"
        effect: >
          When false, line reactances are updated as capacities grow. Relevant because BODFs
          are a function of reactance: cascading an expansion result solved with stale
          reactances propagates that staleness into every redistribution.
        default: "true"
        provenance: "config/config.default.yaml:skip_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: "run.scenarios.enable"
        effect: >
          Turns on scenario expansion — the harness for the cross-scenario comparison that
          is the actual deliverable (Titz's six CO2 levels), with the cascade sweep run per
          resulting solved network.
        default: "false"
        provenance: "config/config.default.yaml:scenarios; Snakefile:get_scenarios"
    assembly:
      - step: >
          Produce the input: one solved network per scenario, with capacities and dispatch
          fixed. For a pure cascade study the operations-only rule is the right producer —
          it fixes optimal capacities from a prior expansion run and re-solves dispatch, so
          the artefact is unambiguously a settled operating point rather than an investment
          result.
        uses: [operations-only-solve]
        config: "the standard solve, then rule solve_operations_network"
        code: null
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - step: >
          If the network came from an expansion run, discretise the capacities and enable
          the reactance iterations first. Both are config flips and both are preconditions
          for the topology being physically trippable and the sensitivities being
          consistent.
        uses: [post-discretization, iterative-impedance-expansion]
        config: "solving.options.post_discretization.enable: true; solving.options.skip_iterations: false"
        code: null
        provenance: "scripts/solve_network.py:post_discretization; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - step: >
          Screen with the library primitive before writing any loop: load the solved .nc in
          a new driver and call n.lpf_contingency(snapshot, branch_outages) to get the
          post-outage flow table for every candidate trigger. Compare against
          s_max_pu * s_nom to rank contingencies. This alone answers
          single-outage-flow-redistribution and cuts the trigger set for everything after.
        uses: []
        config: null
        code: "new driver script under scripts/ — no existing rule consumes a solved network for topology analysis"
        provenance: "pypsa/contingency.py:network_lpf_contingency; pypsa/contingency.py:calculate_BODF"
      - step: >
          Write the cascade loop — the irreducible new code. Per round: drop the tripped
          branches from a copy of the network, rebuild the distribution factors for the NEW
          topology (sub_network.calculate_BODF after n.determine_network_topology, since a
          trip can split a sub_network), recompute flows, test the overload rule, trip
          again. Terminate on no-new-violations or on the component count rising.
        uses: []
        config: null
        code: "the same new driver script — nothing in scripts/ or rules/ owns this"
        provenance: "pypsa/contingency.py:calculate_BODF; pypsa/components.py:determine_network_topology"
      - step: >
          Handle splits and score lost load. determine_network_topology gives you the
          islands for free; deciding which island survives does not exist at any layer and
          needs a per-carrier inertia table you supply and document. If the user will not
          sign off on that table, stop the metric at "a split occurred" and report the
          disconnected demand rather than a survival verdict.
        uses: [inertia-stability]
        config: null
        code: "the driver script; the inertia constants are a new data input you author"
        provenance: "pypsa/components.py:determine_network_topology"
      - step: >
          Fan the sweep out. The trigger set times snapshots times scenarios is the whole
          cost, and run.scenarios plus the {run} wildcard turns the scenario axis into
          snakemake's problem; the contingency axis stays inside the driver where it can be
          vectorised over the BODF columns.
        uses: [scenario-matrix]
        config: "run.scenarios.enable; run.scenarios.file"
        code: "scripts/_helpers.py (scenario plumbing) plus the driver's own inner loop"
        provenance: "Snakefile:get_scenarios; rules/common.smk:scenario_config"
      - step: >
          Report: cascade-size and lost-load distributions per scenario, and a critical-
          corridor ranking. make_summary is the cheapest place to hang the tables and
          plot_power_network already draws the line geometry a criticality map needs.
        uses: [summary-outputs, plotting-suite]
        config: null
        code: "scripts/make_summary.py; scripts/plot_power_network.py"
        provenance: "scripts/make_summary.py:calculate_metrics; scripts/plot_power_network.py:plot_map"
    boundary:
      - variant: single-outage-flow-redistribution
        rung: L5
        note: >
          The cheapest variant on the card and the entry rung. No config path exists — but
          the entire computation is one library call, n.lpf_contingency, on a solved .nc.
          The new code is a driver that loads the network, calls it, and compares the
          returned flow table against s_max_pu * s_nom. Hours to a day, and it is where
          every cascade study should start.
      - variant: cycle-flow-propagation-analysis
        rung: L5
        note: >
          Nothing to build on. pypsa's factors are PTDF-derived and dense; Ronellenfitsch's
          dual formulation means new linear algebra over the cycle basis (M = C A^-1 C^t)
          plus a dual-graph construction for the planarity/locality results. Highest
          leverage in this family — it is what makes the full N-2 sweep affordable — and by
          far the most expensive. Weeks, and it is research code, not plumbing.
      - variant: iterative-overload-cascade
        rung: L5
        note: >
          The loop itself. Bounded work because both halves it calls are library code
          (calculate_BODF for the redistribution, determine_network_topology for the split
          test); what you write is the tripping rule, the threshold, the per-round topology
          rebuild and the termination test. Days. The risk is convention, not code: see the
          simultaneous-vs-sequential pitfall.
      - variant: cascade-size-distribution
        rung: L5
        note: >
          Same code plus a sweep harness. L5 for the harness, but the axis it sweeps is
          cheap to enumerate and the scenario fan-out is L0 via run.scenarios. The binding
          constraint is compute, not the boundary — see cost_profile.
      - variant: coupled-infrastructure-cascade
        rung: L3
        note: >
          The only variant whose blocker is DATA rather than code: the cascade engine is the
          same, but propagating beyond electricity needs a map from buses to dependent
          infrastructure (water, telecoms, gas compression, rail) that pypsa-eur has no
          input for and no rule to build. L3 with an L5 engine attached; do not promise it
          without naming the dependency dataset first.
      - variant: corrective-action-cascade
        rung: L5
        note: >
          The one variant that goes back INSIDE the optimisation, and the one where the
          cascade primitive does not help at all: TATL limits, corrective device dispatch
          variables and their sizing are new formulation work in
          custom_extra_functionality. Effectively the same L5 as
          n-1-security-and-contingency's corrective variant — check that card before
          quoting an estimate, and note Gazafroudi hit 100 GB RAM at fifty buses.
      - variant: greedy-inertia-placement
        rung: L5
        note: >
          Hardest variant end to end, because each objective evaluation is a whole
          cascade-size-distribution run AND it needs the inertia data the registry rates
          `absent`. The greedy search itself is trivial; everything it calls is not. Months
          at European scale, and the sensible substitute is to rank candidate nodes by
          cascade contribution from a single sweep instead of re-running the sweep per
          placement.
    where:
      - change: "produce the frozen operating point the cascade consumes"
        anchor: "rule solve_operations_network -> scripts/solve_operations_network.py (n.optimize.fix_optimal_capacities)"
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - change: "the redistribution + cascade loop itself (a driver calling pypsa/contingency.py:network_lpf_contingency and pypsa/components.py:determine_network_topology)"
        anchor: "a NEW post-solve driver script under scripts/, plus a new rule in rules/solve_electricity.smk taking the solved network as input — the nearest existing post-solve consumer is rule solve_operations_network, and no rule consumes a solved network for topology analysis"
        provenance: "rules/solve_electricity.smk:solve_operations_network; scripts/solve_operations_network.py:fix_optimal_capacities"
      - change: "make the topology physically trippable before cascading an expansion result"
        anchor: "solving.options.post_discretization.enable -> scripts/solve_network.py::post_discretization"
        provenance: "scripts/solve_network.py:post_discretization"
      - change: "the threshold the cascade trips at, and the headroom it eats"
        anchor: "lines.s_max_pu -> scripts/prepare_network.py::set_line_s_max_pu"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - change: "cascade-size / lost-load tables"
        anchor: "scripts/make_summary.py (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_metrics"
      - change: "critical-corridor map"
        anchor: "rule plot_power_network -> scripts/plot_power_network.py::plot_map"
        provenance: "scripts/plot_power_network.py:plot_map"
    data_dependencies:
      - input: "bus-to-dependent-infrastructure dependency map (water, telecoms, rail, gas compression)"
        required_for: coupled-infrastructure-cascade
        availability: >
          absent — pypsa-eur has no such input and no rule to build one; it is external
          critical-infrastructure data the user must supply, and the electricity cascade is
          only the inner engine without it
      - input: "per-carrier inertia constants / kinetic energy for the RoCoF criterion"
        required_for: greedy-inertia-placement
        availability: >
          absent — the registry rates inertia-stability `absent`, there is no inertia
          attribute on any component, and the table must be authored and signed off as an
          assumption; also required for the island-survival test in
          iterative-overload-cascade if you go past "a split occurred"
      - input: "circuit-level topology (how many parallel circuits per clustered corridor)"
        required_for: cascade-size-distribution
        availability: >
          partially exists — base_network carries num_parallel through clustering, so
          corridor multiplicity is recoverable, but the aggregated corridor is still not
          the real circuit set and the N-2 trigger set built from it is approximate
    cost_profile:
      solves: >
        ZERO additional optimisation solves — this is the structural difference from every
        other card in this book. The cost is linear-algebra evaluations, not LPs: 1 solve
        for the input network, then per contingency per snapshot one BODF application
        (cheap) plus one BODF/PTDF rebuild per cascade ROUND (the expensive part, O(L^2) to
        O(L^3) in branches). Trigger-set size is L for N-1 and L*(L-1)/2 for N-2 — Titz
        reached ~1.1e9 N-2 contingencies per CO2 scenario over 2920 3-hourly steps at 600
        nodes.
      relative: >
        A single-outage screen (single-outage-flow-redistribution over all N-1 at one
        snapshot) is seconds to minutes — far CHEAPER than one solve, and the reason it
        should always be run first. A full N-2 cascade sweep over a year is the opposite
        extreme: it is a supercomputer job on the order of 1e9 evaluations, and the
        n-1-security-and-contingency route (constraints inside the LP) is not an
        alternative at that scale either.
      note: >
        Mitigations, in the order to try them: (1) screen with one round of lpf_contingency
        and cascade only the triggers that overload something — most do not; (2) N-1 rather
        than N-2, which turns L^2/2 into L; (3) a snapshot subset chosen by peak loading
        rather than all 8760 (the binding cases recur), and coarser resolution_elec; (4)
        exclude bridges from the trigger set, per Titz — they split by definition and teach
        nothing about propagation; (5) collapse parallel circuits per corridor and weight
        duplicate combinations instead of enumerating them; (6) fewer clusters, which shrinks
        L quadratically in the N-2 count. The cheap-matrix argument only holds WITHIN a
        round: rebuilding factors per round is what dominates, so a shallow cascade is
        drastically cheaper than a deep one and the runtime is data-dependent.
    verifies:
      - variant: single-outage-flow-redistribution
        check: "p0.shape[1] == 1 + len(branch_outages) and (p0['base'] == p0_base).all()"
        over: run
        note: >
          lpf_contingency returns a 'base' column plus one column per outage. A missing
          column means an outage name was silently mis-typed — the function WARNS and
          assumes ('Line', name) rather than raising, so a Link or Transformer name passed
          as a bare string produces a plausible-looking wrong answer.
      - variant: single-outage-flow-redistribution
        check: "all(abs(p0[b][b]) < 1e-6 for b in branch_outages)"
        over: run
        note: >
          The outaged branch must carry zero flow in its own column (BODF diagonal is forced
          to -1). Nonzero means the factors were built for a different topology than the
          one being outaged — the classic stale-matrix failure, and it is silent.
      - variant: iterative-overload-cascade
        check: "len(tripped) >= 1 and all(abs(f) <= lim + 1e-6 for f, lim in final_flows)"
        over: run
        note: >
          The loop terminated without actually clearing the violations — usually the
          termination test fired on a round counter instead of on no-new-overloads, which
          reports a truncated cascade as a completed one. Cascade sizes from such a run are
          biased low and nothing in the output reveals it.
      - variant: cascade-size-distribution
        check: "len(results) == len(trigger_set) * len(snapshots_evaluated)"
        over: ensemble
        note: >
          Contingencies were dropped rather than evaluated. Since the deliverable is a
          DISTRIBUTION, silently missing evaluations bias the tail — and the tail is the
          entire point of the study.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: contingency-scopf
        role: >
          registry status `absent`, same as eur, and earth's note names only
          line-security-margin as the substitute because there is no DLR entry to name
      - id: line-security-margin
        role: >
          registry status `working`: identical 0.7 default and identical
          set_line_s_max_pu consumer, so the same threshold ambiguity — but resting on an
          OSM-inferred rating, which is the earth-specific problem
      - id: inertia-stability
        role: >
          registry status `absent`, same as eur; the islanding step has no data on either
          model
      - id: hvdc-as-lines
        role: >
          earth-specific and decisive here: electricity.hvdc_as_lines decides whether DC
          corridors are Lines (passive branches, therefore visible to lpf_contingency and
          trippable) or Links (invisible to it entirely). eur has no such switch — this is
          the single largest cross-model asymmetry on this card
      - id: augmented-line-connection
        role: >
          earth-specific: k-edge connectivity augmentation adds candidate lines to raise
          meshedness. Directly relevant because meshedness is what determines whether a
          cascade propagates or immediately splits — a radial network cascades trivially
      - id: monte-carlo-sampling
        role: >
          earth's reusable many-run harness (LHS via chaospy/pydoe2/scipy, one solve per
          sample); its fan-out and result-collection shape is what a cascade sweep needs,
          even though it samples parameters rather than contingencies
      - id: summary-outputs
        role: "the reporting surface for cascade-size tables"
      - id: network-plots
        role: >
          static matplotlib network maps — thinner than eur's plotting suite, but enough
          for a critical-corridor map
      - id: iterative-impedance-expansion
        role: "reactance-consistency for any BODF-based work over an expansion result"
    available:
      verdict: absent
      how: >
        Identical negative result to eur, verified by grep at this ref: `cascad`, `LODF`,
        `BODF`, `branch_outages` and `overload` return zero hits across scripts/,
        config.default.yaml and the Snakefile; `contingency` hits only
        electricity.operational_reserve.contingency (the generator-side MW adder, shipped
        at 0 here against eur's 4000), and the single `trip` hit is a comment in
        build_region_configs.py about sparse regions, unrelated to tripping. The
        asymmetries are all about the INPUT to the cascade rather than the cascade itself,
        and they cut both ways. Against earth: there is no operations-only rule (registry
        `absent`), so producing the frozen operating point the method consumes is itself an
        assembly step here, not a rule you invoke. For earth: electricity.hvdc_as_lines
        can put HVDC corridors into n.lines, which makes them passive branches and
        therefore both monitorable and trippable — pypsa's lpf_contingency enumerates
        n.passive_branches(), so HVDC-as-Links is simply absent from the analysis, and eur
        has no equivalent switch. augmented_line_connection is the other earth-only lever
        that matters, because it changes meshedness and meshedness decides whether a
        failure propagates at all.
      missing: >
        Everything eur is missing (procedure steps 2, 5-10 with no handle; 3-4 only in the
        library), plus the frozen-dispatch producer: no operations-only rule means step 1
        needs its own assembly (set every extendable flag false and re-solve). The deeper
        blocker is upstream and is DATA: the cascade propagates through line RATINGS, and
        outside Europe those ratings come from an OSM-inferred topology with assumed
        conductor types and frequently missing circuits. A cascade size computed on that
        base is a statement about the inferred graph, not about the grid — an uncertainty
        of a different order from eur's, where the topology is largely known. Same note as
        eur on the levers below: none tunes the cascade, they shape its input, and the
        verdict stays `absent` deliberately — hvdc_as_lines is listed because it silently
        decides which corridors the simulation can see at all.
      provenance: "scripts/solve_network.py:solve_network; scripts/prepare_network.py:set_line_s_max_pu; scripts/base_network.py:hvdc_as_lines"
    levers:
      - key: "lines.s_max_pu"
        effect: >
          Same as eur: the limit the solved flows respect and the candidate trip threshold.
          Outside Europe 0.7 encodes European meshedness and should be renegotiated with
          the user before it silently becomes the cascade threshold too.
        default: "0.7"
        provenance: "config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "electricity.hvdc_as_lines"
        effect: >
          false (default) models HVDC as controllable Links, true as Lines. The decisive key
          for this method: lpf_contingency and calculate_BODF operate on
          n.passive_branches(), so with the default false every HVDC corridor is invisible
          to the redistribution and cannot be a trigger or a casualty — while Titz's cascade
          explicitly holds HVDC injections constant, i.e. treats them as the Links case.
          Set it deliberately and state which convention you used.
        default: "false"
        provenance: "config.default.yaml:hvdc_as_lines; scripts/base_network.py:hvdc_as_lines"
      - key: "augmented_line_connection.add_to_snakefile"
        effect: >
          Adds k-edge-augmentation candidate lines to raise minimum connectivity. Relevant
          because a poorly meshed network has nothing to cascade THROUGH: it splits on the
          first trip. Compare cascade distributions with and without augmentation to
          separate "this grid is robust" from "this grid is radial".
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/augmented_line_connections.py:k_edge_augmentation"
      - key: "augmented_line_connection.connectivity_upgrade"
        effect: >
          The k in k-edge-augmentation — literally how many independent paths the augmented
          topology guarantees, which is the structural precondition for surviving any
          single trip at all.
        default: "3"
        provenance: "config.default.yaml:connectivity_upgrade; scripts/augmented_line_connections.py:k_edge_augmentation"
      - key: "monte_carlo.options.add_to_snakefile"
        effect: >
          Wires earth's many-run sampling loop into the DAG. Not a cascade lever, but the
          nearest existing fan-out harness to adapt when the sweep axis needs to be a
          managed set of runs rather than an inner loop.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/monte_carlo.py:monte_carlo_sampling"
    assembly:
      - step: >
          Produce the frozen operating point, which unlike in eur is an assembly step:
          there is no operations-only rule, so fix capacities by making every extendable
          flag false in config and re-solving, or by post-processing p_nom_opt onto p_nom
          in a driver before the cascade.
        uses: []
        config: "electricity.extendable_carriers set empty; lines/links extendable off"
        code: "scripts/solve_network.py"
        provenance: "scripts/solve_network.py:solve_network"
      - step: >
          Decide the HVDC convention BEFORE solving, because it changes what the cascade can
          see. hvdc_as_lines: true puts DC corridors into n.lines and therefore into
          n.passive_branches(), making them triggers and casualties; false leaves them as
          Links, matching Titz's constant-HVDC-injection assumption. This choice is upstream
          of base_network and cannot be changed post-solve.
        uses: [hvdc-as-lines]
        config: "electricity.hvdc_as_lines"
        code: "scripts/base_network.py"
        provenance: "scripts/base_network.py:hvdc_as_lines"
      - step: >
          Sanity-check meshedness before promising a cascade study at all. In a sparsely
          meshed OSM-derived network most single trips disconnect the graph rather than
          redistributing, so the result is a split census, not a cascade. augmented_line_
          connection quantifies the gap: run with connectivity_upgrade set and compare.
        uses: [augmented-line-connection]
        config: "augmented_line_connection.add_to_snakefile; augmented_line_connection.connectivity_upgrade"
        code: "scripts/augmented_line_connections.py"
        provenance: "scripts/augmented_line_connections.py:k_edge_augmentation"
      - step: >
          Screen with the library primitive on the solved .nc: n.lpf_contingency(snapshot,
          branch_outages) for one round of post-outage flows, compared against
          s_max_pu * s_nom. Same driver as eur — the primitive is pypsa 0.30.3, which is
          exactly the env this repo's checkers run in.
        uses: []
        config: null
        code: "new driver script under scripts/ — no existing rule consumes a solved network for topology analysis"
        provenance: "pypsa/contingency.py:network_lpf_contingency; pypsa/contingency.py:calculate_BODF"
      - step: >
          Write the cascade loop: per round drop the tripped branches, rebuild topology and
          factors (determine_network_topology then calculate_BODF, since a trip can split a
          sub_network), recompute, re-test. Identical code to the eur route — the method is
          model-agnostic once you hold a solved network, which is the one respect in which
          this card is easier than the rest of the book.
        uses: []
        config: null
        code: "the same new driver script"
        provenance: "pypsa/contingency.py:calculate_BODF; pypsa/components.py:determine_network_topology"
      - step: >
          Fan the sweep out and report. monte_carlo.py's rule shape supplies the many-run
          plumbing if the sweep axis needs to be managed runs; make_summary and
          plot_summary are the reporting surfaces.
        uses: [monte-carlo-sampling, summary-outputs, network-plots]
        config: "monte_carlo.options.add_to_snakefile"
        code: "scripts/monte_carlo.py; scripts/make_summary.py; scripts/plot_summary.py"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling; scripts/make_summary.py:make_summary; scripts/plot_summary.py:plot_costs"
    boundary:
      - variant: single-outage-flow-redistribution
        rung: L5
        note: >
          Same as eur and the entry rung: one call to n.lpf_contingency on a solved .nc.
          Slightly more setup because the frozen operating point is not a rule here, and
          because you must decide hvdc_as_lines first — with the default false, DC
          corridors are not passive branches and are simply absent from the returned table.
      - variant: cycle-flow-propagation-analysis
        rung: L5
        note: >
          As eur: new linear algebra over the cycle basis, nothing in-repo to build on. Worth
          noting the locality theorem is weaker here in practice — Ronellenfitsch's clean
          planar result assumes a topology earth's OSM-inferred graphs do not reliably have.
      - variant: iterative-overload-cascade
        rung: L5
        note: >
          Identical loop to eur; the code is model-agnostic. Cheaper to RUN (smaller regions,
          electricity-only, fewer branches, and L^2 in the N-2 count), but the result is
          weaker because the ratings it propagates through are inferred.
      - variant: cascade-size-distribution
        rung: L3
        note: >
          The one variant where earth's rung differs from eur's, and the blocker is DATA
          not code: a distribution over the trigger set is only meaningful if the trigger
          set is the real circuit set, and earth's topology is OSM-inferred with assumed
          conductor types and missing circuits. Check cookbooks/pypsa-earth/data_quality
          for the region's grid grade before promising a distribution; in a C/D-grade region
          the honest deliverable is a sensitivity to the inferred topology, not a risk
          number.
      - variant: coupled-infrastructure-cascade
        rung: L3
        note: >
          Data blocker squared: no dependency map exists, and the electricity graph it would
          attach to is itself inferred. The one place earth may be AHEAD is motivation — in
          many earth regions the coupled infrastructure question (water pumping, telecoms)
          is the user's actual question rather than an extension.
      - variant: corrective-action-cascade
        rung: L5
        note: >
          New formulation work in extra_functionality, same as eur's route but with only one
          hook rather than a separate custom module path. See
          n-1-security-and-contingency's corrective variant; nothing here helps.
      - variant: greedy-inertia-placement
        rung: L5
        note: >
          Same absent inertia data as eur, and the outer loop still costs one full sweep per
          iteration. The mitigating factor is scale: a small earth region is where this
          search is actually affordable to try, which makes it the better place to prototype
          the method even though the answer is less trustworthy.
    where:
      - change: "freeze capacities to produce the cascade's input (no operations rule exists)"
        anchor: "config electricity.extendable_carriers emptied, then rule solve_network -> scripts/solve_network.py::solve_network"
        provenance: "scripts/solve_network.py:solve_network"
      - change: "decide whether HVDC corridors are visible to the cascade at all"
        anchor: "electricity.hvdc_as_lines -> scripts/base_network.py::hvdc_as_lines"
        provenance: "scripts/base_network.py:hvdc_as_lines"
      - change: "raise meshedness so a cascade is distinguishable from an immediate split"
        anchor: "augmented_line_connection.* -> scripts/augmented_line_connections.py::k_edge_augmentation"
        provenance: "scripts/augmented_line_connections.py:k_edge_augmentation"
      - change: "the redistribution + cascade loop itself (a driver calling pypsa/contingency.py:network_lpf_contingency and pypsa/components.py:determine_network_topology)"
        anchor: "a NEW post-solve driver script under scripts/ plus a new rule in the Snakefile taking the solved network as input — earth has no post-solve analysis rule at all, so rule solve_network is the only anchor and the new rule hangs off its output"
        provenance: "Snakefile:solve_network; scripts/solve_network.py:solve_network"
      - change: "many-run fan-out for the sweep axis"
        anchor: "scripts/monte_carlo.py + the monte_carlo rule"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling"
      - change: "cascade-size tables and critical-corridor maps"
        anchor: "scripts/make_summary.py; scripts/plot_summary.py"
        provenance: "scripts/make_summary.py:make_summary; scripts/plot_summary.py:plot_costs"
    data_dependencies:
      - input: "grid topology with real circuit multiplicity and defensible line ratings"
        required_for: cascade-size-distribution
        availability: >
          region-dependent and the binding constraint for this method on earth — the base
          network is OSM-inferred with assumed conductor types, so both the trigger set and
          the ratings the cascade propagates through are estimates; consult
          cookbooks/pypsa-earth/data_quality for the region's grade before quoting any
          cascade size
      - input: "bus-to-dependent-infrastructure dependency map"
        required_for: coupled-infrastructure-cascade
        availability: >
          absent — no input and no rule; must be supplied externally, and it must be keyed
          to an inferred bus set, which compounds the uncertainty
      - input: "per-carrier inertia constants / kinetic energy for the RoCoF criterion"
        required_for: greedy-inertia-placement
        availability: >
          absent — registry rates inertia-stability `absent`; the same authored-assumption
          problem as eur, with no regional reference values to fall back on
    cost_profile:
      solves: >
        Zero additional optimisation solves, as in eur: 1 solve for the input network, then
        one factor application per contingency per snapshot and one factor rebuild per
        cascade round. Trigger set is L (N-1) or L*(L-1)/2 (N-2), where L is much smaller
        here — typical earth regions are tens to low hundreds of branches against Titz's
        600-node European network.
      relative: >
        Materially cheaper than eur and the one method in this book where earth is the
        better place to work: the N-2 count scales as L^2, so a 100-branch regional network
        is ~36x cheaper per snapshot than a 600-branch European one, and the base solve is
        electricity-only. A full N-2 sweep that is a supercomputer job on eur is a
        workstation job here. The catch is that the cheapness comes from the same
        coarseness that makes the answer uncertain.
      note: >
        Mitigations as eur (screen first, N-1 before N-2, snapshot subset, exclude bridges,
        collapse parallel circuits). One earth-specific addition, in the opposite direction:
        if the network is too sparsely meshed, most triggers split rather than cascade and
        the sweep is fast but uninformative — spend the budget on augmented_line_connection
        comparisons and on the topology's data grade instead of on more contingencies.
    verifies:
      - variant: single-outage-flow-redistribution
        check: "set(branch_outages) <= set(n.passive_branches().index)"
        over: run
        note: >
          Requested triggers that are not passive branches. With hvdc_as_lines false, HVDC
          corridors are Links and fail this silently — lpf_contingency only warns and
          assumes ('Line', name), so the sweep quietly excludes exactly the corridors whose
          loss matters most in a weakly meshed system.
      - variant: iterative-overload-cascade
        check: "n_components_final >= n_components_initial"
        over: run
        note: >
          Component count fell, which is impossible under removal-only dynamics — the
          topology was rebuilt from the wrong network object, typically by mutating the
          original instead of a copy. Every subsequent round is then computed on a network
          that no longer matches the cascade being reported.
      - variant: cascade-size-distribution
        check: "len(results) == len(trigger_set) * len(snapshots_evaluated)"
        over: ensemble
        note: >
          Evaluations were dropped rather than run, biasing the tail of the distribution
          that the whole study exists to characterise.
