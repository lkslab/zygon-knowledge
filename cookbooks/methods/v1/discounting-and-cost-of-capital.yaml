pypsa_primitive:
  symbol: "pypsa/optimization/optimize.py:define_objective"
  pypsa_version: "0.30.3"
  exposed_by: "pypsa-eur, via foresight: perfect (costs.social_discountrate); not pypsa-earth"
  reachable_via: >
    Only the SOCIAL half of this method has a library primitive. define_objective reads
    `n.investment_period_weightings.objective` when `n._multi_invest` is set and applies
    it as a per-period multiplier on both capital and operating terms, so writing NPV
    weights into that column is all it takes to make a multi-period objective a present
    value. The PRIVATE half has no primitive at all: PyPSA 0.30.3 contains no annuity or
    capital-recovery function and no discount-rate attribute anywhere — `capital_cost`
    is an already-annuitised number the workflow hands it.
  note: >
    This asymmetry is the architectural fact behind the whole card, and the PyPSA library
    paper states it as a design choice: capital costs "must then be annuitised" and the
    rate is delegated to the user's input data. Consequence for routing: a social-rate
    change is a config lever on a supported path, whereas a WACC change is always an
    edit to the cost DATA (or to the script that reads it), never a change to the
    optimisation. Soft anchor: pypsa is a conda dependency, not a submodule, so this is
    pinned to a version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: cost-data-pipeline
        role: >
          the method's home — registry status `working`; prepare_costs is where the
          annuity is computed and where every override lands. pypsa-earth has NO
          registry entry for this id at all.
      - id: discount-rate-dimension
        role: >
          the sweep surface — registry status `partial`, and the note says why: technology
          WACC comes from the costs table, and social_discountrate/sdr only affect
          inter-period weighting under perfect foresight. There is no single-run WACC
          sweep token.
      - id: technology-cost-year
        role: >
          the other half of a cost assumption — costs.year plus the pinned technology-data
          release in data/versions.csv. Must be reported alongside any rate.
      - id: perfect-foresight
        role: >
          the ONLY foresight mode in which costs.social_discountrate does anything; the
          surface line names the key explicitly. A capability earth lacks entirely.
      - id: myopic-foresight
        role: >
          the alternative pathway mode, where the social rate is post-processing only
          (make_cumulative_costs) rather than an objective weight.
      - id: global-summary
        role: >
          carries make_cumulative_costs, which already sweeps social discount rates
          0-9% in 1% steps over a myopic pathway — a free social-rate sensitivity.
      - id: carrier-attribute-scaling
        role: >
          the L1 proxy: multiply a carrier's capital_cost by the ratio of two annuity
          factors to emulate a different WACC for that carrier, per component and per
          investment year. Per-carrier only — no country dimension.
      - id: config-schema-validation
        role: >
          why the `costs.overwrites: discount rate` pitfall is dangerous here: the
          pydantic schema types overwrites as dict[str, dict[str, float]] and validates
          the key, so fail-fast validation does NOT catch it.
      - id: wildcard-opts-grammar
        role: "carries the sdr<f> sector_opts token, the only wildcard-level rate lever"
    available:
      verdict: assemble
      how: >
        The annuitisation itself is fully implemented and always runs: prepare_costs
        calls calculate_annuity(lifetime, discount rate), adds FOM/100, multiplies by
        investment and nyears, and writes `capital_cost`. Both discount-rate inputs are
        reachable without code. A uniform rate change is `costs.fill_values['discount
        rate']` (L1) or a `technology: all` row in data/custom_costs.csv (L3, and the
        only genuinely uniform route). Per-technology rates are `discount rate` rows in
        the same CSV. The social rate is `costs.social_discountrate`, consumed by
        prepare_perfect_foresight to build investment_period_weightings, or — under
        myopic foresight — swept for free in post-processing by make_cumulative_costs.
      missing: >
        Procedure step 5 is where it stops: `capital_cost` is one scalar per carrier
        (costs.at[carrier, 'capital_cost']) for all of Europe, so a per-COUNTRY or
        per-bus cost of capital has no representation anywhere in the workflow — not in
        the CSV (indexed by technology, not country x technology), not in `adjustments`
        (indexed by component x carrier), not in the opts grammar. Steps 8 and 10
        (levelised-cost decomposition, discount-rate sensitivity reporting) have no
        handle either. No mechanism ties a WACC to a project's actual risk, and none
        applies a salvage value for retirement before the technical lifetime.
      provenance: "scripts/process_cost_data.py:prepare_costs; scripts/add_electricity.py:calculate_annuity"
    levers:
      - key: "costs.fill_values"
        effect: >
          Contains `discount rate: 0.07`, the default private WACC. Applied ONLY to
          technologies with no explicit `discount rate` row in the costs table — which
          is all but 8 of them, the 8 exceptions being the decentral technologies fixed
          at 0.04. Changing this therefore changes MOST rates, not all, so it is not a
          route to a genuinely uniform WACC.
        default: "{FOM: 0, VOM: 0, efficiency: 1, fuel: 0, investment: 0, lifetime: 25, CO2 intensity: 0, discount rate: 0.07, standing losses: 0}"
        provenance: "config/config.default.yaml:fill_values; scripts/process_cost_data.py:prepare_costs"
      - key: "costs.social_discountrate"
        effect: >
          The SOCIAL rate for weighting investment periods. Becomes
          n.investment_period_weightings['objective'] = years_p / (1+r)^t. INERT unless
          `foresight: perfect` — its only consumer is prepare_perfect_foresight.py.
        default: "0.02"
        provenance: "config/config.default.yaml:social_discountrate; scripts/prepare_perfect_foresight.py:get_investment_weighting"
      - key: "costs.custom_cost_fn"
        effect: >
          Path to a CSV of (planning_horizon, technology, parameter, value) overrides,
          applied before the annuity is computed. Accepts arbitrary parameter names
          including `discount rate` and `lifetime`, accepts `technology: all` to hit
          every technology, and can add rows for technologies absent from the source
          table. This is the sanctioned route to any WACC change.
        default: "'data/custom_costs.csv'"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: "costs.year"
        effect: >
          Cost vintage year, selecting which costs_<year>.csv is retrieved. Moves
          overnight investment and lifetimes but NOT the discount rate — the dial users
          confuse with the rate.
        default: "2050"
        provenance: "config/config.default.yaml:year; rules/retrieve.smk:retrieve_cost_data"
      - key: "costs.overwrites"
        effect: >
          Deprecated per-parameter override dict (warns on use). Applies only to
          investment, lifetime, FOM, VOM, efficiency, fuel and standing losses — a
          `discount rate` entry here validates against the schema and is then silently
          ignored. Use custom_cost_fn instead.
        default: "{}"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: "costs.capital_cost"
        effect: >
          Post-annuity absolute override of `capital_cost` per technology, applied after
          the annuity is computed. Bypasses discounting entirely — useful for pinning a
          number from an external LCOE model, and a WACC proxy if you annuitise yourself.
        default: "{}"
        provenance: "config/config.default.yaml:capital_cost; scripts/process_cost_data.py:prepare_costs"
      - key: "costs.marginal_cost"
        effect: >
          Post-processing override of `marginal_cost` per technology (VOM + fuel /
          efficiency). Named here because the capital/marginal split is the ratio the
          discount rate tilts — moving one without the other changes the comparison.
        default: "{solar: 0.01, onwind: 0.015, offwind: 0.015, hydro: 0.0, ...} via data/custom_costs.csv defaults; the config dict itself is {}"
        provenance: "config/config.default.yaml:marginal_cost; scripts/process_cost_data.py:prepare_costs"
      - key: "costs.emission_prices"
        effect: >
          Adds an exogenous CO2 price to fuel-based marginal costs. The other side of
          the capital-versus-fuel balance the annuity sets: a low WACC and a high carbon
          price push the same way, and separating their effects requires varying them
          independently.
        default: "{enable: false, co2: 0.0, dynamic: false, rolling_window: 90}"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: "adjustments.sector.factor"
        effect: >
          Per-component, per-carrier multiplier on capital_cost, optionally per
          investment year — the L1 emulation of a different WACC for one carrier
          (multiply by the ratio of the two annuity factors). No country dimension.
        default: "{Link: {electricity distribution grid: {capital_cost: 1.0}}}"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:modify_attribute"
    assembly:
      - step: >
          Establish which rate the user means. Private/technology WACC (annuitises
          capital, decides WHICH technologies) versus social rate (weights years,
          decides WHEN). If the study is a single target year, there is no social rate
          to set and costs.social_discountrate must be left alone.
        uses: [cost-data-pipeline, discount-rate-dimension]
        config: "costs.fill_values['discount rate'] vs costs.social_discountrate"
        code: null
        provenance: "scripts/process_cost_data.py:prepare_costs; scripts/prepare_perfect_foresight.py:get_social_discount"
      - step: >
          For a uniform WACC change, write one row to data/custom_costs.csv:
          (planning_horizon=all, technology=all, parameter='discount rate', value=r).
          The `all` technology row propagates to every technology, overriding the eight
          hard-coded 0.04 decentral rows that costs.fill_values cannot reach. Verify by
          diffing resources/costs_<year>_processed.csv.
        uses: [cost-data-pipeline]
        config: "costs.custom_cost_fn"
        code: "data/custom_costs.csv (data edit, not code)"
        provenance: "scripts/process_cost_data.py:overwrite_costs"
      - step: >
          For per-technology rates, write one `discount rate` row per technology to the
          same file instead of the `all` row. Add matching `lifetime` rows if the user's
          financing assumption comes with a different amortisation period — both feed
          the same annuity and a mismatch is invisible in the output.
        uses: [cost-data-pipeline]
        config: "costs.custom_cost_fn"
        code: "data/custom_costs.csv"
        provenance: "scripts/process_cost_data.py:overwrite_costs"
      - step: >
          For a social rate on a co-optimised pathway, set `foresight: perfect` AND
          costs.social_discountrate; the rate is only read on that path. Confirm the
          weights landed by checking n.investment_period_weightings['objective'] against
          years_p/(1+r)^t before trusting any NPV.
        uses: [perfect-foresight, discount-rate-dimension]
        config: "foresight: perfect; costs.social_discountrate"
        code: null
        provenance: "scripts/prepare_perfect_foresight.py:concat_networks; scripts/prepare_perfect_foresight.py:get_investment_weighting"
      - step: >
          For a social rate on a MYOPIC pathway, do NOT set costs.social_discountrate
          (inert). Read the pre-computed sweep instead: make_cumulative_costs already
          discounts and trapezoid-integrates per-horizon costs at 0-9% in 1% steps.
          Pick the column. Only a non-integer-percent rate needs a code edit.
        uses: [myopic-foresight, global-summary]
        config: "foresight: myopic; scenario.planning_horizons"
        code: "scripts/make_cumulative_costs.py:calculate_cumulative_cost (edit the arange only if a non-integer rate is required)"
        provenance: "scripts/make_cumulative_costs.py:calculate_cumulative_cost"
      - step: >
          For a WACC sweep, fan the custom_costs.csv variants (or fill_values overrides)
          out through the scenario matrix so each rate is a managed run — there is no
          discount-rate wildcard in eur, unlike earth.
        uses: [scenario-matrix]
        config: "run.scenarios.enable; run.scenarios.file"
        code: "config/create_scenarios.py"
        provenance: "Snakefile:get_scenarios; rules/common.smk:scenario_config"
      - step: >
          For a country-differentiated WACC there is no assembly — see boundary. The
          cheapest honest approximation is Seibold's: differentiate only the geographies
          the study is comparing, by giving their technologies distinct technology names
          with their own `discount rate` rows, rather than trying to index the existing
          rows by country.
        uses: [cost-data-pipeline, carrier-attribute-scaling]
        config: "costs.custom_cost_fn; adjustments.sector.factor"
        code: "scripts/add_electricity.py:attach_conventional_generators (post-hoc rescale by bus country)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/prepare_network.py:modify_attribute"
    boundary:
      - variant: uniform-social-discount-rate
        rung: L1
        note: >
          `costs.fill_values['discount rate']` for a near-uniform change (misses the 8
          decentral rows). A truly uniform rate is L3: the `technology: all` row in
          data/custom_costs.csv. Both are one edit and no code.
      - variant: technology-specific-wacc
        rung: L3
        note: >
          `discount rate` rows per technology in data/custom_costs.csv. A DATA change,
          not a config one — the most common thing a user actually asks for, and the
          most common thing they try to do through `costs.overwrites`, where it is
          silently ignored. Not L1 because no config key indexes the rate by technology.
      - variant: country-risk-adjusted-wacc
        rung: L5
        note: >
          Nothing expresses it. `capital_cost` is a single scalar per carrier from
          costs.at[carrier, 'capital_cost']; the costs CSV is indexed by
          (technology, parameter) with no country axis; `adjustments` is indexed by
          component x carrier with no country axis; no opts token carries a country.
          The implementation is a post-attach rescale of `capital_cost` by each
          component's bus country — recompute the annuity per (country, technology) and
          multiply by the ratio of annuity factors, in a new script or an
          add_electricity extension. Genuinely new code, and the highest-value L5 on
          this card for any study spanning heterogeneous financing conditions.
      - variant: dual-rate-private-and-social
        rung: L1
        note: >
          Both rates exist as keys and are independent, so this is a configuration
          discipline problem rather than a capability gap — PROVIDED foresight is
          perfect. Under overnight or myopic the social half degrades to
          post-processing and the honest rung is L0-for-the-private-half plus
          read-the-cumulative-costs-table.
      - variant: investment-period-weighting
        rung: L1
        note: >
          `foresight: perfect` plus costs.social_discountrate. Registry rates
          perfect-foresight `working` here. Two keys, no code — and the only path on
          which the social rate enters the optimisation rather than a report.
      - variant: discount-rate-as-swept-parameter
        rung: L3
        note: >
          Mechanically a scenario sweep over custom_costs.csv variants (or over
          fill_values), so L3 for the data variants plus L1 scenario plumbing. There is
          no `{discountrate}` wildcard in eur, so each rate is a separate scenario entry
          — cheap, but hand-maintained. The `sdr<f>` sector_opts token sweeps only the
          SOCIAL rate, and only under perfect foresight.
    where:
      - change: "per-technology or uniform discount rate / lifetime override"
        anchor: "data/custom_costs.csv, consumed by rule process_cost_data via costs.custom_cost_fn"
        provenance: "scripts/process_cost_data.py:overwrite_costs; rules/build_electricity.smk:process_cost_data"
      - change: "the annuity formula itself (e.g. adding a salvage value, or nominal-vs-real handling)"
        anchor: "scripts/add_electricity.py::calculate_annuity, called from prepare_costs"
        provenance: "scripts/add_electricity.py:calculate_annuity; scripts/process_cost_data.py:prepare_costs"
      - change: "country- or bus-differentiated cost of capital"
        anchor: "post-attach rescale of capital_cost keyed on bus country, in scripts/add_electricity.py (attach_* functions) or a new script downstream of process_cost_data"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "non-integer-percent social discount rate in cumulative pathway costs"
        anchor: "scripts/make_cumulative_costs.py::calculate_cumulative_cost (the hard-coded rate columns)"
        provenance: "scripts/make_cumulative_costs.py:calculate_cumulative_cost"
      - change: "social rate into the multi-period objective"
        anchor: "scripts/prepare_perfect_foresight.py::get_investment_weighting -> n.investment_period_weightings['objective']"
        provenance: "scripts/prepare_perfect_foresight.py:get_investment_weighting"
    data_dependencies:
      - input: "costs_<year>.csv from the pinned technology-data release"
        required_for: "every variant — it carries `discount rate`, `lifetime`, `investment` and `FOM`"
        availability: >
          exists by default; retrieved per planning horizon, release pinned in
          data/versions.csv (v0.14.0 at this ref). Only 8 technologies carry an explicit
          `discount rate` row (all 0.04, all decentral, sourced 'Palzer thesis, from old
          pypsa cost assumptions', vintage 2015); everything else uses the fill value.
      - input: "data/custom_costs.csv override rows"
        required_for: "technology-specific-wacc, uniform-social-discount-rate (true uniform), discount-rate-as-swept-parameter"
        availability: >
          exists by default as a small stub containing only marginal_cost anti-degeneracy
          entries; adding `discount rate` rows is an edit to a tracked data file
      - input: "per-country cost-of-capital table (e.g. Diacore/Noothout WACC by country)"
        required_for: country-risk-adjusted-wacc
        availability: >
          absent — no such input exists in the repo and no rule consumes one. Must be
          sourced and plumbed as a new resource alongside the L5 rescale.
    cost_profile:
      solves: >
        1 per rate. A WACC sensitivity is N solves for N rates; a two-point 5%/10%
        comparison is 2. The social-rate sensitivity on a myopic pathway is 0 EXTRA
        solves — make_cumulative_costs sweeps 10 rates from one solved pathway.
      relative: >
        1.0x per rate. This is the cheapest high-leverage sensitivity in the book: the
        change is upstream of the network build, so it invalidates the costs and network
        rules but nothing in the resource chain (cutouts, potentials, clustering).
      note: >
        Because the rate is read at process_cost_data, a rate sweep re-runs the cheap end
        of the DAG only. Contrast with weather-year or clustering sweeps, which rebuild
        resources. Given that Hampp found WACC to be the single largest driver of its
        results, the cost-to-information ratio here is better than for almost anything
        else — and 40 of 43 corpus papers spent it on nothing.
    verifies:
      - variant: uniform-social-discount-rate
        check: "abs(costs.loc[tech, 'capital_cost'] / (costs.loc[tech, 'investment'] * (r/(1-(1+r)**-costs.loc[tech,'lifetime']) + costs.loc[tech,'FOM']/100)) - 1) < 1e-6"
        over: run
        note: >
          Recomputes the annuity from the processed costs table. A mismatch means the
          override did not reach prepare_costs — the classic symptom of putting
          `discount rate` in costs.overwrites, where it validates and is ignored, so the
          run succeeds at the OLD rate with no warning.
      - variant: uniform-social-discount-rate
        check: "costs['discount rate'].nunique() == 1"
        over: run
        note: >
          Fails if the eight hard-coded 0.04 decentral rows survived, i.e. the change was
          made through costs.fill_values rather than a `technology: all` custom_costs
          row. The run is then not the uniform-WACC run it was asked for.
      - variant: investment-period-weighting
        check: "n.investment_period_weightings['objective'].round(6).equals((n.investment_period_weightings['years'] / (1 + r) ** ((n.investment_periods - n.investment_periods[0]).astype(float))).round(6))"
        over: run
        note: >
          Confirms the social rate actually reached the objective weights. If the weights
          equal the raw year counts, foresight was not `perfect` and
          costs.social_discountrate was inert — the run solved an undiscounted sum of
          annual costs while reporting an NPV.
      - variant: discount-rate-as-swept-parameter
        check: "len({round(float(c.loc['onwind','capital_cost']), 3) for c in cost_tables}) == len(cost_tables)"
        over: ensemble
        note: >
          Every scenario in a rate sweep must produce a DIFFERENT capital_cost. Identical
          values mean the scenario override never reached the cost pipeline and the
          "sweep" is N copies of the same run — undetectable from the solve logs.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: discount-rate-dimension
        role: >
          the method's home here — registry status `partial`. Surface is
          costs.discountrate (a LIST feeding a sector filename wildcard) plus the
          technology-data `discount rate` column; consumer is
          scripts/process_cost_data.py:annuity.
      - id: technology-cost-year
        role: >
          costs.year plus costs.technology_data_version — note the key name differs from
          eur's, and earth pins the technology-data release IN the config rather than in
          a versions table.
      - id: carrier-attribute-scaling
        role: >
          the L1 WACC proxy: `carrier+c<factor>` opts tokens multiply capital_cost per
          carrier, applied to Generator/Link/StorageUnit/Store (and n.lines for AC).
      - id: monte-carlo-sampling
        role: >
          earth's advantage for step 10: a real LHS multi-solve harness whose
          `uncertainties` keys are network-attribute expressions, so
          `generators.capital_cost` is a legal sampling target. Registry `partial` here,
          `absent` for eur.
      - id: scenario-matrix
        role: >
          combinatorial expansion over scenario.{simpl,clusters,ll,opts,sopts,
          planning_horizons,demand,h2export} — the fan-out for a rate sweep.
      - id: myopic-foresight
        role: >
          registry `partial`. The only multi-horizon mode earth has; there is no
          perfect-foresight entry, so investment-period weighting is unreachable.
      - id: summary-outputs
        role: "where an annuitised cost breakdown is read back out per run"
    available:
      verdict: assemble
      how: >
        The private half works and is well-plumbed. process_cost_data.py:annuity is the
        same r/(1-(1+r)^-n) with the same 1/n special case for r=0, and load_costs
        builds capital_cost = (annuity + FOM/100) * investment * Nyears. Two things earth
        has that eur does not. First, `{discountrate}` is a declared WILDCARD in the
        Snakefile wildcard_constraints and appears in the sector chain's file paths, so
        `costs.discountrate` is a LIST and a sweep is free scenario expansion rather than
        hand-maintained scenario files. Second, a full currency machinery
        (costs.output_currency, default_exchange_rate, future_exchange_rate_strategy,
        custom_future_exchange_rate) converts the technology-data tables into the study's
        currency before annuitisation, via apply_currency_conversion and
        get_yearly_currency_exchange_rate — eur has no equivalent and this matters for
        every non-European study. costs.rooftop_share additionally blends rooftop and
        utility PV capital_cost, which mixes two differently-discounted assets into the
        `solar` carrier.
      missing: >
        Three gaps, and the first is the important one. (1) There is no social discount
        rate ANYWHERE: no costs.social_discountrate, no perfect-foresight registry entry,
        no investment_period_weightings path, no cumulative-cost post-processing. The
        entire social half of this method — procedure steps 6, 7 and 9 — is absent, so
        NPV pathway comparisons of the Victoria kind cannot be produced. (2) The
        `{discountrate}` wildcard is a LABEL only: nothing reads wildcards.discountrate,
        so the value in the filename and the value used in the annuity are kept
        consistent only by hand. (3) Country-differentiated WACC is as absent as in eur;
        costs.country_specific_data looks like the hook but supports only "" and "US" and
        merely switches which technology-data output DIRECTORY is fetched — it is a US
        cost-dataset selector (with cost_scenario and financial_case as NREL ATB
        moderate/advanced/conservative and market/r&d qualifiers), not a per-country
        cost-of-capital mechanism. Steps 8 and 10 have no handle.
      provenance: "scripts/process_cost_data.py:annuity; scripts/process_cost_data.py:load_costs"
    levers:
      - key: "costs.discountrate"
        effect: >
          A LIST of discount rates. Feeds the `{discountrate}` filename wildcard in the
          sector chain, so multiple values expand into parallel runs. CAVEAT: the value
          is a label — no script reads wildcards.discountrate — so it must be kept
          consistent with the rate the annuity actually uses (the costs table / fill
          value) by hand. Still the closest thing either model has to a first-class
          discount-rate sweep dimension.
        default: "[0.071]"
        provenance: "config.default.yaml:discountrate; Snakefile:discountrate"
      - key: "costs.fill_values"
        effect: >
          Contains `discount rate: 0.07` — the actual rate used for any technology with
          no explicit value in the retrieved costs table. Note it does NOT match the
          0.071 in costs.discountrate, so the default config's filename label and its
          effective rate already disagree.
        default: "{FOM: 0, VOM: 0, efficiency: 1, fuel: 0, investment: 0, lifetime: 25, CO2 intensity: 0, discount rate: 0.07}"
        provenance: "config.default.yaml:fill_values; scripts/process_cost_data.py:load_costs"
      - key: "costs.year"
        effect: "Cost vintage year; selects costs_<year>.csv. Moves investment, not the rate."
        default: "2030"
        provenance: "config.default.yaml:year; Snakefile:retrieve_cost_data"
      - key: "costs.technology_data_version"
        effect: >
          Pins the technology-data GitHub release the cost table is fetched from. Different
          releases carry different `discount rate` and `lifetime` columns, so this
          silently changes the annuity — report it with any rate.
        default: "'v0.13.2'"
        provenance: "config.default.yaml:technology_data_version; Snakefile:retrieve_cost_data"
      - key: "costs.country_specific_data"
        effect: >
          Selects a country subdirectory of the technology-data outputs. Only "" and
          "US" are supported. It is a cost-DATASET selector, not a cost-of-capital
          mechanism: it does not differentiate WACC by country and warns if the value
          disagrees with `countries`.
        default: "''"
        provenance: "config.default.yaml:country_specific_data; Snakefile:country_specific_data"
      - key: "costs.output_currency"
        effect: >
          Target currency for all cost values; the tables are converted before the
          annuity is computed. No eur equivalent, and load-bearing for any non-European
          study whose capital costs are quoted locally.
        default: "'EUR'"
        provenance: "config.default.yaml:output_currency; scripts/process_cost_data.py:apply_currency_conversion"
      - key: "costs.future_exchange_rate_strategy"
        effect: >
          reference | latest | custom — how to pick an exchange rate when the cost
          vintage year is in the future relative to available FX data. Combined with
          default_exchange_rate and custom_future_exchange_rate. A silent lever on the
          absolute level of every capital cost.
        default: "'reference'"
        provenance: "config.default.yaml:future_exchange_rate_strategy; scripts/process_cost_data.py:get_yearly_currency_exchange_rate"
      - key: "costs.rooftop_share"
        effect: >
          Blends rooftop and utility PV into the single `solar` carrier's capital_cost
          (share*rooftop + (1-share)*utility). Because rooftop and utility carry
          different discount rates in the source data, this key silently changes the
          effective WACC of `solar`.
        default: "0.14"
        provenance: "config.default.yaml:rooftop_share; scripts/process_cost_data.py:load_costs"
      - key: "costs.marginal_cost"
        effect: >
          Per-technology marginal-cost overrides. The other side of the capital/fuel
          balance the annuity tilts; earth exposes these as real config values (unlike
          eur, which moved them into custom_costs.csv).
        default: "{solar: 0.01, onwind: 0.015, offwind: 0.015, hydro: 0.0, H2: 0.0, electrolysis: 0.0, fuel cell: 0.0, battery: 0.0, battery inverter: 0.0}"
        provenance: "config.default.yaml:marginal_cost; scripts/process_cost_data.py:load_costs"
    assembly:
      - step: >
          Pin the cost basis first: costs.year, costs.technology_data_version,
          costs.output_currency and costs.future_exchange_rate_strategy. In earth these
          four move capital cost as hard as the discount rate does, and three of them
          have no eur counterpart, so a rate discussion that skips them is meaningless.
        uses: [technology-cost-year]
        config: "costs.year; costs.technology_data_version; costs.output_currency; costs.future_exchange_rate_strategy"
        code: null
        provenance: "Snakefile:retrieve_cost_data; scripts/process_cost_data.py:apply_currency_conversion"
      - step: >
          Set the effective WACC via costs.fill_values['discount rate'] (covers every
          technology with no explicit row) and, if per-technology rates are needed, edit
          the retrieved resources/costs_<year>.csv `discount rate` rows — earth has no
          custom-cost-file equivalent to eur's custom_costs.csv, so this is a resource
          edit rather than a tracked override file.
        uses: [discount-rate-dimension]
        config: "costs.fill_values"
        code: "resources/<RDIR>costs_{year}.csv (retrieved resource)"
        provenance: "scripts/process_cost_data.py:load_costs; Snakefile:retrieve_cost_data"
      - step: >
          Set costs.discountrate to the SAME value(s) so the `{discountrate}` filename
          label matches reality. For a sweep, list several — the wildcard expands them
          into parallel runs for free. Because nothing reads the wildcard, each listed
          rate needs its matching costs override, so pair the sweep with a scenario/
          config override per rate rather than relying on the wildcard alone.
        uses: [discount-rate-dimension, scenario-matrix]
        config: "costs.discountrate; scenario.*"
        code: "Snakefile (the {discountrate} wildcard is already plumbed through the sector chain)"
        provenance: "Snakefile:discountrate; config.default.yaml:discountrate"
      - step: >
          Check costs.rooftop_share before interpreting anything about solar: it blends
          two differently-discounted assets into one carrier, so `solar`'s effective
          WACC is a weighted average the user did not choose.
        uses: [discount-rate-dimension]
        config: "costs.rooftop_share"
        code: null
        provenance: "scripts/process_cost_data.py:load_costs"
      - step: >
          For a WACC uncertainty analysis rather than a sweep, use the monte-carlo
          harness: `generators.capital_cost` is a legal `uncertainties` key (they are
          network-attribute expressions), giving LHS sampling and one solve per sample.
          This samples the ANNUITY, not the rate, so translate the rate range into a
          capital_cost multiplier range first — which is Neumann's annuity-as-uncertain
          -input framing, and defensible.
        uses: [monte-carlo-sampling]
        config: "monte_carlo.options.add_to_snakefile; monte_carlo.options.samples; monte_carlo.uncertainties"
        code: "scripts/monte_carlo.py"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling_chaospy; scripts/monte_carlo.py:rescale_distribution"
      - step: >
          If a social discount rate is required, it must be built. There is no key, no
          perfect-foresight path and no cumulative-cost script. The cheapest honest route
          is a post-processing script over a myopic pathway's summary CSVs, porting
          pypsa-eur's calculate_cumulative_cost; do NOT attempt investment-period
          weighting, which needs the multi-period concatenation earth lacks.
        uses: [myopic-foresight, summary-outputs]
        config: "foresight: myopic; scenario.planning_horizons"
        code: "new post-processing script; port of scripts/make_cumulative_costs.py:calculate_cumulative_cost from pypsa-eur"
        provenance: "scripts/make_summary.py:make_summary"
    boundary:
      - variant: uniform-social-discount-rate
        rung: L1
        note: >
          costs.fill_values['discount rate'] plus a matching costs.discountrate label.
          Cleaner than eur in one respect: earth's default costs table for a typical
          region carries fewer per-technology `discount rate` overrides, so the fill
          value really is close to uniform. Verify per region rather than assuming.
      - variant: technology-specific-wacc
        rung: L3
        note: >
          Edit `discount rate` rows in the retrieved resources/costs_<year>.csv. Worse
          ergonomics than eur, which has a tracked custom_costs.csv override file with
          `technology: all` support; here you are editing a downloaded resource, so the
          change must be re-applied whenever the resource is refetched. That fragility
          is the reason to prefer a bundle data change with an explicit rule dependency.
      - variant: country-risk-adjusted-wacc
        rung: L5
        note: >
          Absent, exactly as in eur, and this is the variant that matters most for
          earth's target regions — the same project finances very differently in Germany
          and in Nigeria, and treating them alike is the largest single distortion in a
          multi-country non-European study. costs.country_specific_data is NOT the hook
          (only "" and "US"; it selects a technology-data directory). Requires a
          per-(country, technology) annuity and a post-attach rescale of capital_cost by
          bus country, plus a WACC-by-country data input that does not exist here.
      - variant: dual-rate-private-and-social
        rung: L5
        note: >
          The private half is L1; the social half does not exist at any rung, so the
          variant as a whole is L5. New post-processing at minimum.
      - variant: investment-period-weighting
        rung: L5
        note: >
          No perfect-foresight capability in the registry, no multi-period network
          concatenation, no investment_period_weightings path. The pypsa primitive
          (define_objective reading investment_period_weightings.objective) exists one
          layer down, so this is L5-with-a-handle rather than new formulation — but the
          missing piece is the whole perfect-foresight chain, which is a far larger job
          than the weighting itself. Do not promise this on earth.
      - variant: discount-rate-as-swept-parameter
        rung: L1
        note: >
          Earth's genuine advantage: `{discountrate}` is a declared wildcard, so listing
          rates in costs.discountrate expands them into parallel runs with no scenario
          file to maintain. Caveat that keeps it from being L0: the wildcard is a label,
          so each rate still needs its matching costs override. Alternatively the
          monte-carlo harness samples capital_cost directly — a capability eur's registry
          marks absent.
    where:
      - change: "per-technology discount rate or lifetime"
        anchor: "resources/<RDIR>costs_{year}.csv, produced by rule retrieve_cost_data and read by load_costs"
        provenance: "Snakefile:retrieve_cost_data; scripts/process_cost_data.py:load_costs"
      - change: "the annuity formula (salvage value, nominal-vs-real, per-country r)"
        anchor: "scripts/process_cost_data.py::annuity, called from load_costs and prepare_costs"
        provenance: "scripts/process_cost_data.py:annuity; scripts/process_cost_data.py:prepare_costs"
      - change: "country- or bus-differentiated cost of capital"
        anchor: "post-attach rescale of capital_cost keyed on bus country, downstream of process_cost_data (scripts/add_electricity.py attach_* / scripts/prepare_network.py)"
        provenance: "scripts/prepare_network.py:attr_lookup"
      - change: "make the {discountrate} wildcard actually drive the rate instead of labelling it"
        anchor: "Snakefile wildcard_constraints discountrate + the process_cost_data rule's params (read wildcards.discountrate into costs.fill_values)"
        provenance: "Snakefile:discountrate; scripts/process_cost_data.py:load_costs"
      - change: "social discount rate / cumulative pathway cost"
        anchor: "new post-processing script over rule make_summary outputs; port of pypsa-eur's calculate_cumulative_cost"
        provenance: "scripts/make_summary.py:make_summary"
      - change: "WACC uncertainty sampling"
        anchor: "monte_carlo.uncertainties keyed on generators.capital_cost; scripts/monte_carlo.py"
        provenance: "scripts/monte_carlo.py:rescale_distribution"
    data_dependencies:
      - input: "costs_<year>.csv from the technology-data release pinned by costs.technology_data_version"
        required_for: "every variant"
        availability: >
          exists by default, fetched from GitHub by rule retrieve_cost_data (gated on
          enable.retrieve_cost_data). Region-independent — the SAME European-derived
          Danish Energy Agency cost and discount-rate assumptions are used for every
          country earth models unless country_specific_data is "US". This is the
          data-quality caveat to state before any non-European cost conclusion.
      - input: "technology-data US subdirectory (NREL ATB)"
        required_for: "technology-specific-wacc for a US study only"
        availability: >
          region-dependent — only "US" is supported by country_specific_data; every other
          region falls back to the European tables
      - input: "exchange-rate series for the cost currency pair"
        required_for: "uniform-social-discount-rate and technology-specific-wacc in any non-EUR currency"
        availability: >
          exists by default via the currency-converter path, but future years fall back
          per future_exchange_rate_strategy (reference / latest / custom) — a silent
          assumption to sign off with the user
      - input: "per-country cost-of-capital table"
        required_for: country-risk-adjusted-wacc
        availability: absent — no such input exists and no rule consumes one
    cost_profile:
      solves: >
        1 per rate, and the `{discountrate}` wildcard makes N rates N managed runs with
        no extra plumbing. The monte-carlo route is monte_carlo.options.samples solves
        (default 9).
      relative: >
        1.0x per rate. Earth base cases are typically smaller (fewer clusters,
        electricity-only), so a 5-10 point WACC sweep is comfortably affordable here —
        often more so than on a sector-coupled eur run.
      note: >
        The rate is read at process_cost_data, upstream of the network build, so a sweep
        re-runs from cost processing forward and does not touch cutouts, renewable
        profiles or clustering. For earth specifically the sweep is worth doing rather
        than defaulting: the whole corpus's 7% comes from European financing conditions
        and there is no evidence base for it in earth's target regions.
    verifies:
      - variant: uniform-social-discount-rate
        check: "abs(costs.loc[tech, 'capital_cost'] / (costs.loc[tech, 'investment'] * (r/(1-(1+r)**-costs.loc[tech,'lifetime']) + costs.loc[tech,'FOM']/100)) - 1) < 1e-6"
        over: run
        note: >
          Recomputes the annuity from the processed table. A mismatch after a currency
          change is the likely-to-be-missed case: apply_currency_conversion runs BEFORE
          the annuity, so investment and capital_cost must be in the same currency for
          this to hold.
      - variant: discount-rate-as-swept-parameter
        check: "float(wildcards.discountrate) == params.costs['fill_values']['discount rate']"
        over: run
        note: >
          The one check this model specifically needs. Nothing reads
          wildcards.discountrate, so the filename label and the rate the annuity used can
          silently disagree — the shipped default already does (0.071 in
          costs.discountrate versus 0.07 in costs.fill_values). Without this assertion a
          sweep can produce N differently-named files containing identical results.
      - variant: discount-rate-as-swept-parameter
        check: "len({round(float(c.loc['onwind','capital_cost']), 3) for c in cost_tables}) == len(cost_tables)"
        over: ensemble
        note: >
          Every run in the sweep must have a distinct capital_cost. Equal values mean the
          wildcard relabelled the outputs without changing the costs.
      - variant: country-risk-adjusted-wacc
        check: "n.generators.groupby(n.generators.bus.map(n.buses.country)).capital_cost.nunique().max() > 1 or n.generators.carrier.nunique() == 1"
        over: run
        note: >
          For a study that claims country-differentiated financing, capital_cost must
          actually vary across countries for the same carrier. In an unmodified workflow
          it never does — one scalar per carrier — so this check fails by construction
          and is the honest gate on the claim.
