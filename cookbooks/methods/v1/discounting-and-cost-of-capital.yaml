id: discounting-and-cost-of-capital
title: "Discounting and the cost of capital (annuitisation, WACC, social discount rate)"
summary: >
  Convert an overnight investment cost into the annual payment the objective function
  actually minimises, using a discount rate and a lifetime — and, separately, decide
  the rate at which costs in different years are traded against each other.
question: >
  What discount rate is annuitising my capital costs, does it favour capital-intensive
  or fuel-intensive technologies, and is it the right rate for the decision I am making?
aliases:
  - "discount rate"
  - "social discount rate"
  - "annuity"
  - "annuitisation"
  - "annualised capital cost"
  - "capital recovery factor"
  - "WACC"
  - "weighted average cost of capital"
  - "cost of capital"
  - "hurdle rate"
  - "rate of return on capital"
  - "financial discount rate"
  - "equivalent annual cost (EAC)"
  - "levelised cost of energy / LCOE"
  - "overnight cost"
  - "investment period weighting"
when_to_use:
  - "what discount rate does the model use"
  - "the model is building too much / too little wind — is that the discount rate"
  - "compare gas against renewables fairly"
  - "our project finances at 12%, not 7% — can the model reflect that"
  - "financing in Nigeria is far more expensive than in Germany, does the model know"
  - "how sensitive are the results to the cost of capital"
  - "is this a social planner's answer or an investor's answer"
  - "sweep the WACC"
  - "give me an LCOE per technology consistent with the model"
  - "should we discount future system costs, and at what rate"
  - "why does the model prefer OCGT over a battery"
  - "our regulator mandates a 3.5% real social discount rate"
family: foresight-and-pathways
prevalence:
  papers: 43
  tier1: 29
  tier2: 14
  sweep_hits: 51
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 43 papers whose method
    content includes a stated discounting or cost-of-capital assumption; the regex
    screen returned 51. The 8-paper gap is mention-only text — papers that use the word
    "annuity" or "discount rate" in a related-work or objective-function recap without
    stating a rate or a treatment, which are excluded here. The role split is the
    finding: 1 `defines`, 2 `canonical-use`, 40 `routine-use`, 0 `critiques`. Forty of
    forty-three papers inherited a default and did not examine it, and 26 of those 40
    state exactly 7% — the pypsa-eur `costs.fill_values['discount rate']` default. This
    is the most-used-and-least-interrogated assumption in the corpus: it is in the top
    ten by prevalence yet has no critique literature at all, unlike
    spatial-clustering-and-resolution or storage-sizing-and-duration. Treat that as a
    warning, not as evidence the assumption is safe.
procedure:
  - step: >
      Obtain overnight investment cost, fixed O&M (as % of investment per year) and
      technical lifetime per technology, for the chosen cost vintage year. In the PyPSA
      family these come from an external technology-data release, not from the config.
    handle: "costs.year + the retrieved costs_<year>.csv"
    provenance: "rules/retrieve.smk:retrieve_cost_data; scripts/process_cost_data.py:prepare_costs"
  - step: >
      Choose the PRIVATE (technology / project) discount rate r used to annuitise
      capital. This is a WACC: the return the financier requires. It may be uniform,
      per-technology, or per-country. Corpus values span 3% to 13% with 7% dominant.
    handle: "the 'discount rate' column of the costs table, defaulted by costs.fill_values"
    provenance: "config/config.default.yaml:fill_values; scripts/process_cost_data.py:prepare_costs"
  - step: >
      Compute the annuity factor a = r / (1 - (1+r)^-n) for lifetime n (the capital
      recovery factor). The r=0 case must be special-cased to 1/n or it divides by zero.
    handle: "calculate_annuity(n, r)"
    provenance: "scripts/add_electricity.py:calculate_annuity"
  - step: >
      Form the annualised capital cost that enters the objective:
      capital_cost = (a + FOM/100) * investment * nyears. FOM is added to the annuity
      factor, not discounted separately, and nyears rescales for a partial-year model.
    handle: "costs['capital_cost'] = annuity_factor_fom * costs['investment'] * nyears"
    provenance: "scripts/process_cost_data.py:prepare_costs"
  - step: >
      Assign that number to every extendable component of the carrier. In the PyPSA
      workflows this is one scalar per carrier for the whole modelled region — the point
      at which country-specific cost of capital stops being expressible.
    handle: "costs.at[carrier, 'capital_cost'] at component-attach time"
    provenance: "scripts/add_electricity.py:attach_conventional_generators"
  - step: >
      Separately, if the study spans several years, choose the SOCIAL discount rate to
      weight costs across investment periods. This is a different rate doing a different
      job: it trades welfare between generations, it does not price a project's risk.
      Conflating the two is the recurring error the corpus's canonical papers call out.
    handle: "costs.social_discountrate (perfect foresight only)"
    provenance: "config/config.default.yaml:social_discountrate; scripts/prepare_perfect_foresight.py:get_social_discount"
  - step: >
      Turn that rate into per-period objective weights, w_p = years_p / (1+r_social)^t,
      so a co-optimised multi-period objective is a net present value rather than a sum
      of annual costs.
    handle: "get_investment_weighting -> n.investment_period_weightings['objective']"
    provenance: "scripts/prepare_perfect_foresight.py:get_investment_weighting"
  - step: >
      (reporting) Decompose the solved objective into levelised costs per technology or
      per supply chain by dividing annualised component cost by annual delivered energy.
      This is post-processing on the same annuities and inherits the same rate.
    handle: null
    provenance: null
  - step: >
      (reporting, pathway studies) Discount the per-horizon system costs back to the
      first horizon at the social rate and integrate over the pathway to get a single
      cumulative cost — the metric that makes "early decarbonisation pays off" a claim.
    handle: "calculate_cumulative_cost (myopic postprocessing)"
    provenance: "scripts/make_cumulative_costs.py:calculate_cumulative_cost"
  - step: >
      (best practice, rarely done) Report the result's sensitivity to r. In the one
      corpus paper that made WACC its primary sensitivity it dominated every other
      input, including CAPEX itself.
    handle: null
    provenance: null
variants:
  - id: uniform-social-discount-rate
    what: >
      One rate for every technology, every country and every year — the field default.
      Interpreted as a social planner's rate rather than any investor's actual cost of
      capital, which is why it is usually low (3-7%). Cheapest and most comparable, and
      the reason renewables look as good as they do in this literature: a single low
      rate is systematically generous to capital-intensive technologies.
    papers:
      - "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
      - "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
      - "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
      - "2025_Che_space-based-solar-power-european-decarbonization.pdf"
  - id: technology-specific-wacc
    what: >
      Different rates per technology or per ownership class, reflecting who actually
      finances the asset. The corpus's dominant instance is the 7% utility / 4%
      decentral split (rooftop PV, individual heat pumps, building retrofits), which is
      not a config setting in pypsa-eur but is BAKED INTO THE DEFAULT COST DATA. Barnes
      goes further with a per-generation-technology rate and an explicit salvage value
      for economic retirement before the technical lifetime.
    papers:
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
  - id: country-risk-adjusted-wacc
    what: >
      One rate per country (or per bus), from observed national financing conditions.
      The corpus's evidence that this matters is Schyska's: 4% in Germany to 12% in
      south-eastern Europe, and cross-constraining the homogeneous and differentiated
      solutions gives a misallocation of 4.6 EUR/MWh — more than 3x the naive LCOE
      difference of 1.4 EUR/MWh between the same two scenarios. The distortion is not
      the cost level, it is the SITING: a uniform rate builds capacity where the
      resource is, ignoring where the money is cheap. Crucial for pypsa-earth's target
      regions and reachable in NEITHER model without new code.
    papers:
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
  - id: dual-rate-private-and-social
    what: >
      The methodologically correct pathway treatment: a financial/private rate (7%)
      annuitises each asset's capital, and a SEPARATE, much lower social rate (0-2%)
      discounts the annual system costs across horizons when summing a pathway. The two
      rates are not substitutes. Victoria 2020 is the reference application; Zeyen 2023
      is the instructive negative case, deliberately setting the social rate to 0% so
      that learning dynamics are not confounded by discounting.
    papers:
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
      - "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
  - id: investment-period-weighting
    what: >
      The social rate applied INSIDE the optimisation rather than in post-processing:
      per-period objective weights w_p = years_p / (1+r)^t on a single co-optimised
      multi-horizon model, so the solver itself trades early against late investment.
      Only meaningful under perfect foresight; under myopic or overnight foresight the
      same rate can only ever be applied afterwards.
    papers:
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
  - id: discount-rate-as-swept-parameter
    what: >
      Treat r as an uncertain input rather than a setting: sweep it, or sample it inside
      a wider uncertainty analysis, and report the range. Hampp's two-scenario 5%/10%
      sweep shifts levelised cost by ~35% and dominates a one-at-a-time sensitivity
      (-14%/+15%, versus -13%/+12% for renewable CAPEX). Barnes puts the rate among
      ~350 parameters in a Morris global sensitivity analysis. Neumann's variant is
      subtler — make the ANNUITY itself the uncertain quantity, which bundles
      investment, FOM, lifetime and discount rate into one distribution.
    papers:
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
      - "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
literature:
  - paper: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    tier: 1
    role: defines
    note: >
      The only paper in the corpus that makes cost of capital its own subject, with a
      section titled "Choice of WACC" stating that "the choice of the costs of capital
      influences all cost calculations and is therefore crucial for meaningful results".
      Runs two full scenarios at 10% (baseline) and 5% p.a. WACC, technology- and
      country-independent, annuitised via the equivalent-annual-cost method; the low-WACC
      case cuts levelised cost of hydrogen by ~35%. In its one-at-a-time sensitivity WACC
      is the single largest driver (-14%/+15%), ahead of renewable CAPEX (-13%/+12%).
      Motivates its 10% baseline from IRENA's inhomogeneous 10%/7.5% non-OECD/OECD split
      — i.e. it knows country risk matters and chooses a uniform rate anyway. Quote this
      paper to any user who thinks the discount rate is a detail.
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference for why a uniform rate is not merely imprecise but misallocating.
      Compares a homogeneous cost-of-capital scenario against a regionally differentiated
      one (12% in south-eastern Europe down to 4% in Germany, rates from the Diacore
      project) using a novel misallocation pseudometric that cross-constrains one
      scenario's solution into the other's problem. Result: 4.6 EUR/MWh, over 3x the 1.4
      EUR/MWh naive LCOE difference between the same scenarios. The gap between those two
      numbers IS the finding — the damage is in where capacity gets sited, not in the
      cost level, and a sensitivity that only reports total cost will miss it entirely.
      The single most useful citation on this card for a non-European study.
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The house pattern for keeping the two rates apart, stated explicitly: 7% financial
      discount rate to annualise capital for every technology and country, 4% for
      decentral assets (rooftop PV, small water tanks), and a SEPARATE 2% social discount
      rate used only when summing annualised costs across 5-year steps into a cumulative
      figure. The ~350 bn EUR headline advantage of the Early & Steady path is a statement
      about the social rate, not the financial one, and the paper reports that it survives
      any social rate below 15%. Cite this when a user asks "which rate do I set".
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Restates the dual-rate scheme in the most quotable form ("we consider two types of
      discount rates") and, usefully, states the invariance that follows: the social rate
      does not change the optimisation within a time step, only how cross-period sums are
      computed. Sweeps the social rate at 2/5/10% while holding the financial rate at 7%
      (4% for individual assets). Rates used: financial 7%/4%, social 2/5/10%.
  - paper: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      The instructive negative case: 7% WACC for annuitisation, and total system costs
      deliberately NOT discounted by any social rate, so that learning-by-doing dynamics
      are not confounded with discounting. Also states plainly what is not modelled —
      "we do not model country-dependence or learning in financing" — which is the
      cleanest published statement of this card's central gap.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      The most differentiated treatment in the corpus and the only one carrying a salvage
      value: a unique discount rate per power-generation technology (from the NREL Annual
      Technology Baseline) with a single sector-wide rate for service, industrial and
      transport, plus salvage value for economic retirement before the technical lifetime.
      The rate is also one of ~350 parameters in a Morris global sensitivity analysis.
      Note the model is PyPSA-USA, not pypsa-eur — this level of differentiation required
      a fork.
  - paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    tier: 2
    role: routine-use
    note: >
      Uses the discount rate as a POLICY variable rather than a parameter: 7% WACC for
      the zonal market designs, 8% for the nodal LMP case, on the argument that nodal
      merchant risk is higher (citing CONE reports for the former, PJM/ERCOT Brattle for
      the latter). Also derives CfD strike prices from the annuitised investment plus
      fixed O&M, i.e. reuses the annuity as an output. The clearest corpus example of
      market design and cost of capital being modelled as coupled.
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: routine-use
    note: >
      Does not itself annuitise anything — results are undiscounted annual £bn — but
      supplies the hurdle-rate framing users bring from consultancy work: AFRY's central
      case discounted at 3.5% real, and the arithmetic that every 0.01% rise in hurdle
      rates costs ~£100 mn NPV of zonal-market welfare. Useful for translating a modelled
      welfare gain into a tolerable increase in cost of capital, which is often the
      decision the user actually faces.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      A partial country-risk treatment worth copying: uniform 7% (technology-data v0.10.1,
      2050 vintage) with one sensitivity run applying 10% WACC to NON-EUROPEAN exporting
      countries only, which changes the optimal import-versus-domestic balance. The
      cheapest available approximation to country-risk-adjusted-wacc — differentiate the
      geographies whose comparison the study is actually about, not all of them.
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: routine-use
    note: >
      Makes the ANNUITY the uncertain parameter rather than the discount rate, arguing
      that annuities "simultaneously incorporate uncertainties about the overnight
      investments, fixed operation and maintenance costs, their lifetime, and the discount
      rate". DEA 2050 optimistic/pessimistic bounds treated as 90% confidence intervals,
      uniform distribution by maximum entropy. No separate discount rate is stated. The
      right move when the user wants cost uncertainty rather than financing structure.
  - paper: "2017_Groissbock_high-renewable-penetration-scenarios.pdf"
    tier: 2
    role: routine-use
    note: >
      One of only three papers that sweeps the rate: 6% nominal base case with 0% and 15%
      explored, 20-year project life, 2% inflation, zero salvage. Distinctively, it states
      that the discount rate coincides with the WACC and that the commercial/private
      expectation in its Saudi mini-grid context is 15-30% — an order of magnitude away
      from the European 7% and a useful counterweight when a user assumes 7% is universal.
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      The origin of the 7%/4% split that is now default data rather than a choice: "a
      discount rate of 7% is used for large, utility and central assets, while a rate of
      4% is used for decentral individual units (including rooftop solar PV and building
      retrofitting)". Rates used: 7% central, 4% decentral, 2030 cost vintage.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      Reports the annuitised numbers, which is rare and makes the mechanism legible:
      utility PV 38 EUR/kW/yr at 7%, rooftop 47 EUR/kW/yr at 4%, i.e. the higher rooftop
      annuity survives the lower rate. Rates used: 7% default, 4% rooftop PV.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: >
      Rates used: 0.07 default, 0.04 rooftop PV. Same dual-technology scheme; relevant
      because storage is the technology class most sensitive to the annuity factor
      (whole cost is capital, no fuel to trade off against).
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: "Rates used: 7% default, 4% rooftop and individual heating. Inherited unexamined."
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: routine-use
    note: >
      The library paper: states that objective capital costs "must then be annuitised
      for the total period sum_t w_t (typically a full year)" and then explicitly
      delegates the rate and the annuity formula to the user's input data. This is the
      architectural fact behind this whole card — PyPSA the library has no discount rate
      and no annuity function; annuitisation happens upstream in the workflow.
  - paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      States the annuity factor in the (1-(1+tau)^-n)/tau form but gives no rate,
      inheriting pypsa-eur defaults. Representative of the modal corpus paper: the
      formula is documented, the number is not.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform, 2030 cost projections."
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 7%, uniform, with technology lifetimes spanning 20-80 years. Notable as
      a CHINA study still using the European 7% — the clearest single instance of the
      default travelling outside the region it was calibrated for.
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 4%, uniform. States the annuity factor explicitly as
      (1-(1+tau)^-n)/tau converting overnight investment to annual payments. One of the
      few PyPSA-Eur papers not at 7%, which matters when comparing its capacity ranges
      against 7% studies.
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 7%, uniform, 2023 EUR currency year."
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 7%, uniform, DEA 2030 projections in 2020 currency. Worth flagging on
      this card specifically: in a zero-fuel-cost system the annuity IS the price signal,
      so the discount rate propagates directly into the modelled price duals.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7%, uniform."
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: "Rate used: 7% WACC, uniform."
  - paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Rate used: 7% financial, uniform. Lifetimes 10 y (Li-ion converter) to 40 y (solar
      PV) — the widest lifetime spread in the corpus, and a reminder that n moves the
      annuity factor as hard as r does at these rates.
  - paper: "2025_Schumm_Temporal-hydrogen-regulation-exporters_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 13%, uniform, technology-data v0.4.0, 2030 vintage. The corpus's highest
      single rate and the only non-European study to raise it substantially (Morocco) —
      the closest thing here to an implicit country-risk adjustment, done by moving the
      one global number rather than differentiating.
  - paper: "2025_Zeyen_Shifting-burdens-road-transport_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 2% SOCIAL, applied to convert annualised into cumulative present values
      (533 bn EUR headline). Reports no private rate; a good example of a paper whose
      headline number is entirely a function of the social rate.
  - paper: "2025_Che_space-based-solar-power-european-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Rate used: 3%, uniform, 30-year lifetime for space-based solar, technology-data
      v0.9.2 for terrestrial. Instructive as a mismatch: a 3% rate makes an extremely
      capital-intensive novel technology look far better than the 7% its terrestrial
      competitors are annuitised at in the source data.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 0.07, uniform, lifetimes 20-60 years by technology."
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: "Rate used: 7%, uniform, 2030 cost vintage."
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 7%, uniform. Notable because it evaluates transmission PROJECTS whose
      real appraisal uses a regulated cost of capital, against a model annuitising them
      at the generic 7%.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 7%, uniform, technology-data v0.12.0, 2040 vintage in 2015 EUR. Records
      the currency year explicitly, which most papers do not — see the currency pitfall.
  - paper: "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Rate used: 4%, uniform, discounting OpEx explicitly year by year (V = CapEx +
      sum OpEx_t/(1+r)^t) rather than annuitising CapEx — the mathematically equivalent
      dual of the annuity, and worth recognising because users arrive with either form.
pitfalls:
  - pitfall: >
      `costs.social_discountrate` is INERT unless `foresight: perfect`. Its only
      consumer is prepare_perfect_foresight.py, which is reached only from
      rules/solve_perfect.smk. Under the default `foresight: overnight` (and under
      `myopic`) you can set it to anything, the config schema will accept it, the run
      will succeed, and NOTHING in the result will change.
    evidence: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    note: >
      This is the worst silent failure on this card, and it is doubly confusing because
      the key sits in the `costs:` block next to keys that DO affect every run. If the
      user wants a social discount rate under overnight or myopic foresight, it is a
      POST-PROCESSING quantity, not a model input — see the cumulative-cost pitfall
      below. Victoria 2022 states the corresponding modelling fact: the social rate
      never changes the optimisation within a time step.
  - pitfall: >
      The private and the social discount rate are different rates doing different jobs
      and are routinely conflated. The private/technology WACC prices one project's risk
      and determines WHICH technologies get built; the social rate trades welfare between
      years and determines WHEN. Setting the WACC to 2% because a regulator mandates a
      2% social discount rate is a real and common error — it silently makes every
      capital-intensive technology look ~3x cheaper.
    evidence: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    note: >
      Ask the user which question they are asking before touching either. Victoria 2020
      is the pattern to copy: 7% financial for annuitisation, 2% social for cumulative
      sums, stated separately and never mixed. If the study is a single target year there
      IS no social rate to set.
  - pitfall: >
      A uniform discount rate is not a neutral simplification — it misallocates. It
      builds capacity where the resource is best while ignoring where the money is
      cheapest, and the siting error is larger than the cost error: 4.6 EUR/MWh of
      misallocation versus a 1.4 EUR/MWh naive LCOE difference for the same two
      scenarios.
    evidence: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    note: >
      Consequently a total-cost sensitivity on r will UNDERSTATE the problem, because
      total cost is the quantity the uniform assumption gets least wrong. Compare
      capacity siting between the uniform and differentiated cases, not objective values.
      For any study spanning countries with materially different financing conditions —
      every pypsa-earth study, and any eur study including south-eastern Europe — say
      out loud that the model cannot express this before promising a result.
  - pitfall: >
      In pypsa-eur, `costs.overwrites` is typed `dict[str, dict[str, float]]` in the
      config schema, so `costs: overwrites: {"discount rate": {...}}` VALIDATES — but
      the loop in process_cost_data.py that applies overwrites iterates a hard-coded
      tuple of ("investment", "lifetime", "FOM", "VOM", "efficiency", "fuel",
      "standing losses") which does not include "discount rate". The key is accepted,
      logged nowhere, and ignored.
    evidence: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    note: >
      Do not attempt a WACC change through `costs.overwrites`. Use a `discount rate`
      parameter row in `data/custom_costs.csv` (which DOES accept arbitrary parameter
      columns, and supports `technology: all` for a uniform change) — that is an L3 data
      change, and it is the correct route. `costs.overwrites` is deprecated anyway and
      warns on use.
  - pitfall: >
      The 7%/4% central-versus-decentral split that half this corpus reports is not a
      config setting anyone chose — it is eight rows of default data. Only 8 technologies
      in costs_2050.csv carry an explicit `discount rate` value (all decentral, all
      0.04, sourced to "Palzer thesis, from old pypsa cost assumptions", vintage 2015);
      every other technology silently falls back to
      `costs.fill_values['discount rate'] = 0.07`.
    evidence: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    note: >
      Two consequences. First, changing `costs.fill_values['discount rate']` moves
      every technology EXCEPT those eight, so a "uniform 10% WACC" run made that way is
      not uniform. Second, when a user asks for a technology-specific WACC, check whether
      the technology already has a data row before assuming the fill value applies. A
      genuinely uniform change needs the `all` row in custom_costs.csv, not the fill value.
  - pitfall: >
      Reported cumulative or NPV pathway costs are usually POST-PROCESSING at a rate
      unrelated to `costs.social_discountrate`. pypsa-eur's myopic-path
      make_cumulative_costs.py computes cumulative cost over a HARD-CODED sweep of
      social discount rates, np.arange(0, 0.1, 0.01) — 0% to 9% in 1% steps — and never
      reads the config key at all. The same hard-coded sweep is duplicated in
      make_summary_perfect.py.
    evidence: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    note: >
      Good news and bad news. The good news: this is exactly Victoria's method and it
      is already implemented, so a social-rate sensitivity on a myopic pathway is free —
      read the column you want out of cumulative_costs.csv. The bad news: a user who
      sets `costs.social_discountrate: 0.035` and reads this file gets a table that
      does not contain 3.5%, with no warning. Non-integer-percent rates need a code
      edit (L2) to that arange.
  - pitfall: >
      The annuity factor is jointly determined by r AND the lifetime n, and n comes from
      the same data table with the same silent fill value (`fill_values.lifetime: 25`).
      At 7%, moving a lifetime from 25 to 40 years changes the annuity factor by ~20%,
      comparable to a 2-percentage-point move in r. Corpus lifetimes span 10 to 80 years.
    evidence: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    note: >
      When diagnosing "why is this technology too expensive", check `lifetime` before
      concluding the discount rate is wrong, and never quote a discount rate without its
      lifetime. Both live in the same CSV and both fall back silently.
  - pitfall: >
      Cost of capital and cost VINTAGE are separate dials that users conflate: costs.year
      selects a projection year, which moves overnight investment but not the discount
      rate. A capital-intensive technology can be made to win either by a lower rate or
      by a later cost year, and the two are not distinguishable in the result.
    evidence: "2025_Che_space-based-solar-power-european-decarbonization.pdf"
    note: >
      Pin and report both, plus the technology-data release version — the corpus's
      versions range from v0.4.0 to v0.13.2 across papers all claiming "7%", and the
      cost tables differ substantially between them. Che's 3% rate on a novel technology
      against DEA-vintage terrestrial competitors at their source rates is the failure
      mode: an inconsistent rate across technologies inside one comparison.
  - pitfall: >
      In a system with near-zero marginal costs the annuity is not just a cost input, it
      is the price signal — scarcity rents and the modelled duals are recovering
      annuitised capital. A discount-rate change therefore moves modelled electricity
      PRICES, not only the capacity mix, so any price or revenue-adequacy conclusion
      inherits the WACC assumption directly.
    evidence: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    note: >
      If the user's question is about prices, revenues, CfD strike prices or investor
      viability, the discount rate is a first-order input and must be sensitivity-tested,
      not defaulted. Thomassen's 7%-zonal / 8%-nodal design shows the coupling running
      the other way too: market design changes the cost of capital.
requires_methods: []
combines_with:
  - foresight-and-planning-horizons
  - sensitivity-and-uncertainty-sweeps
  - endogenous-technology-learning
  - brownfield-and-capacity-vintaging
  - cost-allocation-and-equity-metrics
  - price-formation-and-scarcity-rents
  - shadow-prices-and-marginal-values
  - mga-near-optimal-space
topics:
  - capacity-expansion
  - net-zero-pathways
