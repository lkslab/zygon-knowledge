id: mga-near-optimal-space
title: "Modelling to generate alternatives / near-optimal feasible space (MGA)"
summary: >
  Instead of one least-cost solution, map the set of systems whose total cost is
  within a slack epsilon of the optimum, by re-optimising the same feasible region
  against many alternative objectives.
question: >
  What else is nearly as cheap as the optimum, and which parts of the optimal answer
  survive across the whole near-optimal space?
aliases:
  - "MGA"
  - "modelling to generate alternatives"
  - "modeling to generate alternatives"
  - "near-optimal feasible space"
  - "near-optimal solutions"
  - "broad ranges"
  - "epsilon-constraint method"
  - "cost-slack exploration"
  - "decision space / robust design space"
when_to_use:
  - "how different could the energy mix be at similar cost"
  - "is this technology choice structural or an artefact of the optimum"
  - "give me alternatives to the least-cost plan, not just the optimum"
  - "how much wind could we avoid building without paying much more"
  - "show the range of investment levels that stay near-optimal"
  - "which investments are robust no matter which near-optimal future happens"
  - "the model says build X — do I have to believe it"
family: uncertainty-and-robustness
prevalence:
  papers: 6
  tier1: 2
  tier2: 4
  sweep_hits: 12
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 6 papers that actually run
    MGA. The regex screen returned 12, and here it OVER-counts (the one method in this
    book where it does): "near-optimal" is used loosely in related-work sections by
    papers that only cite the technique. Notably 5 of the 6 carry role `extends` and
    only one `defines` — this is a young, fast-moving method where nearly every
    application generalises it, which is why `variants` below is unusually long.
procedure:
  - step: >
      Solve the model once to cost optimality and record the objective value c*. The
      near-optimal space is defined relative to it, so the anchor run must be the same
      model you intend to explore.
    handle: "the standard workflow solve"
    provenance: "scripts/solve_network.py:solve_network"
  - step: >
      Add the budget (slack) constraint total_cost <= (1 + epsilon) * c*. Reported
      epsilon spans 0.5% to 20%; 5% is both the corpus median and the pypsa default.
      This is the epsilon-constraint method from multi-objective optimisation.
    handle: null
    provenance: null
  - step: >
      Choose the decision variables to explore in — almost never the raw LP variables.
      The corpus aggregates first: per-carrier capacity sums, per-region totals,
      transmission volume, or one subsystem's technologies. Dimensionality k is 5-17
      across the corpus, because the cost of the next step scales with it.
    handle: null
    provenance: null
  - step: >
      Choose exploration directions in that reduced space. Two schools: axis-aligned
      min/max per variable (2k solves, yields per-variable RANGES), or many directions
      -- random, or normals to the largest facets found so far -- which approximate the
      POLYTOPE and expose correlations the ranges hide.
    handle: null
    provenance: null
  - step: >
      For each direction, re-solve with that direction as the objective, subject to the
      budget constraint and all original constraints. Every solve is a full expansion
      LP; this is where the compute goes.
    handle: "n.optimize.optimize_mga(weights=, sense=, slack=)"
    provenance: "pypsa/optimization/abstract.py:optimize_mga"
  - step: >
      Collect the solutions and report per-variable ranges, the convex hull / vertex
      set, or a derived geometric metric (volume, Chebyshev centre). Convergence is
      judged on the space stopping growing, not on a fixed iteration count.
    handle: null
    provenance: null
  - step: >
      (extension) Repeat per weather year, cost draw, region or planning horizon, and
      INTERSECT the resulting spaces — solutions near-optimal under all of them. This
      is what turns MGA from a sensitivity display into a robust-design method.
    handle: null
    provenance: null
variants:
  - id: carrier-aligned-min-max
    what: >
      Axis-aligned minimise/maximise of each aggregated capacity group within the
      slack: 2 solves per group, giving a hyperrectangle of per-technology ranges.
      Cheap, conservative and easy to communicate — the default entry point.
    papers:
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
  - id: polytope-approximation
    what: >
      Many directions — random vectors, or normals to the largest facets of the hull
      found so far — to build an explicit geometric description of the space rather
      than a bounding box. Exposes the trade-offs (more wind implies less solar) that
      per-variable ranges destroy. Needs a convergence criterion.
    papers:
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
  - id: intersected-spaces
    what: >
      Compute one near-optimal space per weather year, region or scenario and
      intersect them; a design in the intersection is near-optimal under all sampled
      conditions. The Chebyshev centre of the intersection is then the maximally
      robust single design.
    papers:
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
  - id: cost-uncertainty-nested-mga
    what: >
      Nest MGA inside a cost-parameter ensemble: draw cost assumptions, run the full
      min/max sweep per draw, and report probabilistic rather than single-epsilon
      ranges. Multiplies solve count by the sample size, so it is paired with a
      low-fidelity model and a small high-fidelity validation set.
    papers:
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
  - id: multi-horizon-near-optimal
    what: >
      Extend near-optimality to a sequential pathway: at each planning horizon the
      near-optimal set is conditioned on being reachable from the previous horizon's
      set, and min/max sequences are built greedily horizon by horizon. Answers "how
      early must this be built" rather than "how much of it in the target year".
    papers:
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
  - id: subsystem-scoped-mga
    what: >
      Restrict the decision variables to one subsystem (carbon management chain,
      hydrogen chain, one region's assets) in an otherwise full sector-coupled model.
      Same machinery, but the base solve is the expensive one, so cost_profile
      dominates the design.
    papers:
      - "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
literature:
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: defines
    note: >
      Brings MGA into the PyPSA family and sets the house pattern: encode the optimum
      as a constraint f <= (1+eps)f*, then minimise/maximise pre-defined groups of
      investment variables (all wind, onshore, offshore, solar, gas, H2 storage,
      battery, transmission volume) rather than using Hop-Skip-Jump random directions.
      100 nodes, 2-hourly, epsilon 0.5%-10%, 384 system-wide + 1584 country-wise
      solutions. The headline finding is the one to quote to users: even 0.5% slack
      opens a wide investment range, yet wind, some hydrogen storage and some
      reinforcement appear in every solution within 10%.
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: extends
    note: >
      The "broad ranges" framing: MGA results presented as robust decision-support
      ranges rather than as scenarios, and combined with cost-uncertainty sampling
      (500 low-fidelity draws x 101 optimisations, 15 high-fidelity draws) plus 2-D
      trade-off slices at fixed positions within a technology's range.
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: extends
    note: >
      The canonical MGA x weather-ensemble composition, and the source of the
      facet-guided algorithm: iterate cardinal directions first, then directions normal
      to the largest facets / Chebyshev-ball-tangent facets, 150 iterations per year
      over 41 weather years at k=5, then intersect the 41 spaces. Robustness becomes a
      geometric property (the Chebyshev centre) instead of a scenario average.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: extends
    note: >
      Uses near-optimal geometry as the result itself — a flexibility metric for
      regional versus system-wide decision-making. 84 spaces (7 focus regions x 12
      scenarios), 450 optimisations each, k=8 (inside/outside-region splits of solar,
      onshore, offshore, hydrogen), intersected into a robust design space. The
      clearest demonstration that the space's SHAPE is the finding.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: extends
    note: >
      Extends near-optimality to myopic multi-horizon optimisation: per-horizon
      near-optimal sets conditioned on reachability from the previous horizon, min/max
      sequences built greedily, 216 scenarios at epsilon 2/5/10% over six horizons
      2025-2050. States plainly that the greedy sequence is not globally optimal over
      all horizons — a caveat to relay.
  - paper: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    tier: 2
    role: extends
    note: >
      Subsystem-scoped MGA with a combined min/max-plus-random-vector direction set
      over 17 aggregated carbon-management capacities, epsilon 1/3/5%, on a
      sector-coupled 39-node fork. Contributes the convergence criterion this book
      recommends: stop when the summed 2-D subspace volume grows <1% over the last
      three checks, rather than at a guessed iteration count.
pitfalls:
  - pitfall: >
      Axis-aligned ranges are per-variable bounds, NOT a jointly achievable plan — the
      minimum of every technology at once is generally infeasible.
    evidence: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    note: >
      Communicate them as ranges and never as a buildable system. If joint feasibility
      matters to the user's decision, the variant is polytope-approximation, at
      materially higher cost.
  - pitfall: >
      The slack is applied to a MODEL objective, not to real-world cost. A 5% slack on
      a model whose input costs are uncertain by far more than 5% understates the true
      space, and the choice of epsilon is doing more work than it appears to.
    evidence: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    note: >
      Report the space alongside a cost-input sensitivity, or use
      cost-uncertainty-nested-mga and intersect over cost draws as well.
  - pitfall: >
      Results depend on the aggregation into decision variables, which is a modeller's
      choice made before any solving. Different groupings of the same LP give different
      "ranges" for the same system.
    evidence: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    note: >
      State the reduction (the linear map to k dimensions) as part of the result, and
      choose it from the user's decision, not from convenience.
  - pitfall: >
      Solve count multiplies the base case directly, and a fixed iteration budget can
      silently under-approximate the space — reported convergence needed 150-450
      solves per space in the corpus.
    evidence: "2026_Kalweit_near-optimal-carbon-capture-conversion-storage.pdf"
    note: >
      Use a volume-growth convergence criterion, and budget with cost_profile below
      BEFORE promising a study.
requires_methods:
  - custom-constraints-with-linopy
combines_with:
  - weather-year-ensembles
  - sensitivity-and-uncertainty-sweeps
  - temporal-aggregation-and-segmentation
  - spatial-clustering-and-resolution
  - foresight-and-planning-horizons
  - stochastic-and-robust-optimisation
topics:
  - uncertainty-near-optimal-mga
  - robust-decision-making
  - capacity-expansion
pypsa_primitive:
  symbol: "pypsa/optimization/abstract.py:optimize_mga"
  pypsa_version: "0.30.3"
  exposed_by: "neither — no config key in pypsa-eur or pypsa-earth calls it"
  reachable_via: >
    A driver script that loads an already-solved network and calls
    n.optimize.optimize_mga() once per direction. Signature at 0.30.3:
    optimize_mga(n, snapshots=None, multi_investment_periods=False, weights=None,
    sense='min', slack=0.05, model_kwargs={}, **kwargs). `weights` is a nested dict
    {component: {attribute: {name: coefficient}}}, `slack` is the epsilon, and the
    network must carry an objective from a prior solve.
  note: >
    This is why MGA is L5-with-a-handle rather than L5-from-scratch: the slack
    constraint and the objective replacement are already implemented one layer down.
    The work left is the direction set, the run harness and the ensemble
    post-processing — not the optimisation formulation. Soft anchor: pypsa is a conda
    dependency, not a submodule, so the claim is pinned to a version string rather
    than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: mga-near-optimal
        role: "the method itself — registry status `absent`, no consumer named"
      - id: custom-constraint-hook
        role: >
          the sanctioned landing point for the slack constraint if MGA is implemented
          inside the workflow rather than in an external driver
      - id: scenario-matrix
        role: >
          the run harness: each direction becomes a managed run, so the fan-out is
          snakemake's problem rather than a bespoke loop
      - id: carrier-attribute-scaling
        role: "the crude substitute users reach for — probes the space, does not map it"
      - id: multi-weather-year
        role: "needed for intersected-spaces; registry status `partial` here"
      - id: temporal-resolution-nh
        role: "the affordability lever — coarsen before multiplying solve count"
      - id: time-segmentation-tsam
        role: >
          the better affordability lever: the corpus's MGA studies segment to 750-1500
          steps rather than averaging, because extremes drive the space's edges
      - id: summary-outputs
        role: "existing cross-run capacity aggregation to hang ensemble post-processing on"
    available:
      verdict: primitive-only
      how: >
        Nothing in the workflow performs MGA. Two ingredients do exist: the
        custom_extra_functionality hook, which imports a user module and calls it after
        the built-in constraints are added, and the scenario/run machinery that fans one
        config into many managed parallel solves. The optimisation itself is available
        one layer down as pypsa 0.30.3's optimize_mga.
      missing: >
        Procedure steps 2, 3, 4, 6 and 7 have no handle here: no slack constraint, no
        variable aggregation, no direction generation, no hull/range/convergence
        post-processing, no cross-scenario intersection. Every published near-optimal
        study on PyPSA-Eur used a separate fork; none is merged at this ref.
      provenance: "scripts/solve_network.py:custom_extra_functionality; scripts/_helpers.py:get_scenarios"
    levers:
      - key: "solving.options.custom_extra_functionality"
        effect: >
          Path to a user module imported and called after the built-in constraints —
          where a hand-written slack constraint and replacement objective land if you
          keep MGA inside the workflow.
        default: "'../data/custom_extra_functionality.py' (present but a no-op stub)"
        provenance: "config/config.default.yaml:custom_extra_functionality; scripts/solve_network.py:custom_extra_functionality"
      - key: "run.scenarios.enable"
        effect: >
          Turns on scenario-file expansion, making each MGA direction a separate managed
          run instead of a hand-rolled loop.
        default: "false"
        provenance: "config/config.default.yaml:scenarios; scripts/_helpers.py:get_scenarios"
      - key: "run.scenarios.file"
        effect: "Where the generated direction/scenario matrix is read from."
        default: "'config/scenarios.yaml'"
        provenance: "config/config.default.yaml:scenarios; rules/common.smk:scenario_config"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Coarsens snapshots; with segmentation the primary way to buy back the 20-60x
          solve count MGA imposes.
        default: "false (hourly)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours"
    assembly:
      - step: >
          Solve the base case once at the resolution you intend to explore at, and keep
          the solved network — optimize_mga needs an objective value to build the slack
          constraint from.
        uses: [operations-only-solve]
        config: "the standard solve; no MGA-specific key exists"
        code: null
        provenance: "scripts/solve_network.py:solve_network"
      - step: >
          Decide the reduction: which aggregated capacities are the k decision
          variables. Nothing in the repo does this; it is a dict of weights per
          direction, and it is the modelling decision the pitfalls warn about.
        uses: []
        config: null
        code: "new driver script under scripts/ — no existing rule owns this"
        provenance: "pypsa/optimization/abstract.py:optimize_mga"
      - step: >
          EITHER call optimize_mga per direction from that driver (recommended — the
          formulation is library code), OR express the slack constraint and replacement
          objective yourself in the custom_extra_functionality hook and drive directions
          through the scenario wildcard, keeping everything inside snakemake at the cost
          of reimplementing the formulation.
        uses: [custom-constraint-hook, scenario-matrix]
        config: "solving.options.custom_extra_functionality; run.scenarios.enable"
        code: "scripts/solve_network.py:custom_extra_functionality"
        provenance: "scripts/solve_network.py:custom_extra_functionality; scripts/_helpers.py:get_scenarios"
      - step: >
          Collect solutions and compute ranges, hull or convergence. make_summary
          already aggregates capacities across runs and is the cheapest place to hang
          ensemble post-processing.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_capacities"
    boundary:
      - variant: carrier-aligned-min-max
        rung: L5
        note: >
          No config path exists. Cheapest honest route: a driver calling optimize_mga
          twice per carrier group on the solved network. The formulation is library
          code, so this is a harness, not a model reformulation — days, not months.
      - variant: polytope-approximation
        rung: L5
        note: >
          Same handle plus direction sampling, hull computation (scipy ConvexHull) and a
          convergence criterion. The post-processing is the bulk of the work.
      - variant: intersected-spaces
        rung: L5
        note: >
          L5 for the harness, but the ensemble it loops over is cheap here: weather
          years are L0/L1 (move the snapshots window; the default cutout spans
          1940-2024). The new code is the intersection geometry, not the sampling.
      - variant: cost-uncertainty-nested-mga
        rung: L5
        note: >
          The MGA harness plus a cost-draw loop. Cost overrides are L1
          (costs.capital_cost / costs.overwrites), so again the sampling is not the hard
          part; the nesting and the solve budget are.
      - variant: multi-horizon-near-optimal
        rung: L5
        note: >
          Hardest variant. foresight: myopic is L0 and working here, but per-horizon
          reachability conditioning means the slack constraint must reference the
          previous horizon's solution set — a genuinely new formulation on top of
          add_brownfield, not just a harness.
      - variant: subsystem-scoped-mga
        rung: L5
        note: >
          Restrict weights to the subsystem's components; no machinery beyond
          carrier-aligned-min-max, but the base solve is the sector-coupled network, so
          cost_profile decides feasibility.
    where:
      - change: "slack constraint + replacement objective inside the workflow"
        anchor: "solving.options.custom_extra_functionality -> the user module's entry function"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
      - change: "fan directions out as managed parallel runs"
        anchor: "run.scenarios + the {run} wildcard; config/scenarios.yaml"
        provenance: "scripts/_helpers.py:get_scenarios; rules/common.smk:scenario_config"
      - change: "ensemble aggregation of resulting capacities"
        anchor: "scripts/make_summary.py (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_capacities"
    cost_profile:
      solves: >
        1 + 2k for carrier-aligned-min-max (k = decision variables, 5-17 in the
        corpus); 150-450 per space for polytope-approximation; multiply by the ensemble
        size for intersected-spaces and cost-uncertainty-nested-mga.
      relative: >
        ~20-60x a single solve for a 10-30 direction study; the corpus's intersected
        studies reached 41 x 150 = 6150 solves.
      note: >
        Every direction is a full expansion LP over the same network, so base-case solve
        time multiplies directly. The corpus's standard mitigations are all L0/L1 here:
        TSAM segmentation to 750-1500 steps, coarser nH resolution, fewer clusters, and
        a low-fidelity model for the sweep with a high-fidelity spot check.
    verifies:
      - variant: carrier-aligned-min-max
        check: "all(m.objective <= (1 + slack) * ns[0].objective + 1e-6 for m in ns)"
        over: ensemble
        note: >
          A solution outside the budget means the slack constraint was never applied —
          the classic silent failure when the formulation is reimplemented in the hook
          instead of using optimize_mga. The run still succeeds and the ranges are
          simply wrong.
      - variant: carrier-aligned-min-max
        check: "len(ns) == 1 + 2 * len(direction_groups)"
        over: ensemble
        note: >
          Wrong ensemble size means directions were dropped by wildcard expansion rather
          than solved, which silently narrows the reported range.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: mga-near-optimal
        role: "the method itself — registry status `absent`, same as eur"
      - id: monte-carlo-sampling
        role: >
          earth's one advantage over eur: a real multi-solve harness (LHS via
          chaospy/pydoe/scipy, one solve per sample) whose sampling loop and result
          collection are structurally what an MGA driver needs. It samples PARAMETERS,
          not directions, so the objective half is what is missing.
      - id: custom-constraint-hook
        role: "the single extra_functionality entry point for the slack constraint"
      - id: scenario-matrix
        role: "combinatorial run expansion for the direction fan-out"
      - id: carrier-attribute-scaling
        role: "the crude substitute, same as eur"
      - id: temporal-resolution-nh
        role: "affordability lever"
      - id: time-segmentation-tsam
        role: "affordability lever; the corpus's MGA studies rely on segmentation"
    available:
      verdict: primitive-only
      how: >
        No MGA in the workflow. Unlike pypsa-eur, earth does ship a multi-solve
        uncertainty harness (scripts/monte_carlo.py, off by default) that already
        enumerates samples, rewrites the network per sample and collects results — the
        loop an MGA driver needs. optimize_mga is available in the same pypsa 0.30.3
        environment this repo's checkers run in.
      missing: >
        Procedure steps 2, 3, 4, 6 and 7: no slack constraint, no variable aggregation,
        no direction generation, no hull/range/convergence post-processing, no
        cross-scenario intersection. The monte-carlo harness varies inputs, which is a
        different question from bounding the near-optimal space.
      provenance: "scripts/solve_network.py:extra_functionality; scripts/monte_carlo.py:monte_carlo_sampling_chaospy"
    levers:
      - key: "monte_carlo.options.add_to_snakefile"
        effect: >
          Wires the multi-solve sampling loop into the DAG — the nearest existing
          harness for a many-solve study, to be adapted from parameter draws to
          direction sweeps.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/monte_carlo.py:monte_carlo_sampling_chaospy"
      - key: "monte_carlo.options.samples"
        effect: "Number of solves in the fan-out; becomes the number of directions."
        default: "9"
        provenance: "config.default.yaml:samples; scripts/monte_carlo.py:validate_parameters"
      - key: "monte_carlo.options.sampling_strategy"
        effect: >
          chaospy | pydoe2 | scipy. Irrelevant to MGA directions themselves, but it is
          the switch that selects which sampling function the harness calls, so an MGA
          adaptation lands next to it.
        default: "'chaospy'"
        provenance: "config.default.yaml:sampling_strategy; scripts/monte_carlo.py:monte_carlo_sampling_scipy"
    assembly:
      - step: "Solve the base case and retain the objective as the slack reference."
        uses: []
        config: null
        code: null
        provenance: "scripts/solve_network.py:solve_network"
      - step: >
          Reuse the monte-carlo rule's fan-out shape (or the scenario wildcard) to
          enumerate directions instead of parameter draws — the per-sample network
          rewrite and result collection are already there.
        uses: [monte-carlo-sampling, scenario-matrix]
        config: "monte_carlo.options.add_to_snakefile; monte_carlo.options.samples"
        code: "scripts/monte_carlo.py"
        provenance: "scripts/monte_carlo.py:rescale_distribution; scripts/monte_carlo.py:validate_parameters"
      - step: >
          Call optimize_mga per direction from a driver, or add the slack constraint in
          extra_functionality.
        uses: [custom-constraint-hook]
        config: null
        code: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    boundary:
      - variant: carrier-aligned-min-max
        rung: L5
        note: >
          As eur, marginally cheaper: monte_carlo.py already supplies a many-solve rule
          and result collection to adapt rather than write.
      - variant: polytope-approximation
        rung: L5
        note: "Harness plus hull post-processing; nothing in-repo computes hulls."
      - variant: intersected-spaces
        rung: L3
        note: >
          The MGA harness is still L5, but the binding constraint here is DATA, not
          code: a multi-year ensemble needs cutouts built per region, and the registry
          lists multi-weather-year as absent for earth. Check
          cookbooks/pypsa-earth/data_quality before promising an ensemble.
      - variant: cost-uncertainty-nested-mga
        rung: L5
        note: >
          The one variant where earth is genuinely ahead: monte_carlo.uncertainties
          already draws cost/parameter distributions, so the outer loop exists and only
          the inner MGA sweep must be written.
      - variant: multi-horizon-near-optimal
        rung: L5
        note: >
          foresight: myopic exists but the registry rates it `partial` and the
          sector chain less battle-tested than eur's. Expect to debug the base pathway
          before any near-optimal conditioning is meaningful.
      - variant: subsystem-scoped-mga
        rung: L5
        note: >
          Mechanically the cheapest variant here — smaller regions and
          electricity-only base cases make the solve budget tractable where a
          sector-coupled eur run would not be.
    where:
      - change: "slack constraint at solve time"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "many-solve fan-out to adapt from parameter draws to directions"
        anchor: "scripts/monte_carlo.py + the monte_carlo rule"
        provenance: "scripts/monte_carlo.py:rescale_distribution"
    data_dependencies:
      - input: "multi-year ERA5 cutout covering the study region"
        required_for: intersected-spaces
        availability: >
          region-dependent — cutouts are built per region in earth
          (enable.build_cutout), and a multi-year ensemble means building one per year
      - input: "regional cost assumptions for the sampled draws"
        required_for: cost-uncertainty-nested-mga
        availability: >
          exists by default via technology-data, but country_specific_data is limited;
          treat non-European cost draws as an assumption to sign off with the user
    cost_profile:
      solves: "1 + 2k, or 150-450 per space for polytope-approximation"
      relative: "~20-60x a single solve"
      note: >
        Earth base cases are often cheaper (smaller regions, electricity-only), which
        makes MGA more tractable here than on a sector-coupled eur run — the usual
        model-choice tradeoff runs the other way for this method.
