pypsa_primitive: null
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: scenario-matrix
        role: >
          THE surface for this method here — registry status `working`. A scenarios yaml
          whose top-level keys are run names and whose bodies are arbitrary config
          overrides, expanded via the {run} wildcard into fully independent managed runs.
          Any config key is sweepable, and config/create_scenarios.py is the shipped
          cartesian-product generator.
      - id: config-schema-validation
        role: >
          the quiet reason eur is the better sweep host: EVERY merged scenario config is
          validated against a typed schema before the DAG is built, so a typo in one of 216
          overrides fails at parse time instead of silently running the base value. A
          capability pypsa-earth entirely lacks.
      - id: cf-config-injection
        role: >
          the eur-only escape hatch for one-off design points: the CF+<section>+<key>+<value>
          sector_opts token rewrites any config key from the wildcard, so a sweep dimension
          needs neither a scenario file nor a dedicated token
      - id: wildcard-opts-grammar
        role: >
          eur-only sugar for the most-swept parameters — Co2L (CO2 cap), Ep/Ept (emission
          price), lv/lc (transmission limit), seq (sequestration potential), sdr (social
          discount rate), nH/nseg — each a wildcard token that becomes a design dimension
          in the scenario matrix without touching a config file
      - id: cost-data-pipeline
        role: >
          the sanctioned route for cost sweeps: costs.custom_cost_fn points at a CSV that
          overwrites any parameter per planning horizon and can add new technology rows;
          config-based costs.overwrites still works but logs a deprecation warning
      - id: carrier-attribute-scaling
        role: >
          the cheapest cost/potential perturbation — a factor or absolute override on
          capital_cost / marginal_cost / p_nom_max / e_nom_max per component+carrier,
          reachable from either the adjustments config block or a wildcard token
      - id: shared-resources-caching
        role: >
          the cost lever that makes large matrices affordable: wildcard-independent inputs
          (shapes, cutout-derived resources) are computed once and shared across every
          design point rather than rebuilt per run
      - id: global-summary
        role: >
          eur-only ensemble collection — make_global_summary concatenates per-run csvs
          across the whole scenario matrix, which is the sweep's reporting step already
          implemented
      - id: monte-carlo-sampling
        role: >
          registry status `absent`, and the sharpest asymmetry in this book: there is NO
          Monte-Carlo module in pypsa-eur. No sampler, no distribution config, no `unc`
          wildcard. The nearest thing is scenario-matrix plus a hand-written sampler that
          writes scenarios.yaml.
      - id: numeric-stability-options
        role: >
          the noise floor a sweep must clear: solving.options.noisy_costs is TRUE by
          default and perturbs marginal costs, seeded from solving.options.seed
      - id: temporal-resolution-nh
        role: "the affordability lever — coarsen before multiplying the run count"
      - id: time-segmentation-tsam
        role: >
          the better affordability lever: segmentation keeps extremes that nH averaging
          destroys, which matters when a swept parameter's effect shows up in peak hours
    available:
      verdict: turnkey
      how: >
        Set run.name and run.scenarios.enable: true, point run.scenarios.file at a yaml
        whose top-level keys are design-point names and whose bodies are arbitrary config
        overrides, and the workflow fans out one fully independent run per design point
        under the {run} wildcard. config_provider resolves every rule's parameters through
        the scenario overrides, and each merged config is schema-validated before the DAG is
        built. config/create_scenarios.py is a shipped, editable itertools.product generator
        for the matrix, and make_global_summary concatenates the per-run csvs afterwards.
        That is one-at-a-time, structured-scenario-matrix and resolution-sweep complete, at
        L0/L1, with no Python written.
      missing: >
        Procedure steps 3 (design choice), 7 (sensitivity indices) and 8 (surrogate) have no
        handle, and step 4 has no handle for a SAMPLED design: there is no distribution
        specification, no LHS/QMC sampler, no seed management across samples, and no
        variance-decomposition or Morris code anywhere in the repo. So
        monte-carlo-lhs-sampling and global-sensitivity are L5 — but only in the sampler and
        the post-processing, because the fan-out and collection they need already work. A
        driver that writes scenarios.yaml from scipy.stats.qmc and a post-processor that
        reads the global summary is the whole gap.
      provenance: "scripts/_helpers.py:get_scenarios; Snakefile:validate_config; rules/common.smk:config_provider"
    levers:
      - key: "run.scenarios.enable"
        effect: >
          Turns on scenario-file expansion. With run.name set (or 'all'), every top-level
          key in the scenario file becomes an independent run under the {run} wildcard —
          this single flip is the method for the OAT and matrix variants.
        default: "false"
        provenance: "config/config.default.yaml:scenarios; scripts/_helpers.py:get_scenarios"
      - key: "run.scenarios.file"
        effect: >
          Where the design matrix is read from. config/scenarios.template.yaml shows the
          shape (scenario name -> arbitrary config override subtree); rule create_scenarios
          regenerates this file from config/create_scenarios.py.
        default: "'config/scenarios.yaml'"
        provenance: "config/config.default.yaml:scenarios; Snakefile:create_scenarios"
      - key: "run.name"
        effect: >
          The run name, or 'all' to expand every scenario in the file. Must be non-empty for
          scenario expansion to activate at all — get_scenarios returns {} when it is blank,
          which is the classic silent no-op: enable: true alone does nothing.
        default: "''"
        provenance: "config/config.default.yaml:name; scripts/_helpers.py:get_scenarios"
      - key: "run.shared_resources.policy"
        effect: >
          Shares wildcard-independent resources across design points instead of rebuilding
          them per run. On a 200-point matrix this is the difference between one cutout
          aggregation and 200; set to 'base' or a dirname when the sweep does not perturb
          the upstream data.
        default: "false"
        provenance: "config/config.default.yaml:shared_resources; scripts/_helpers.py:get_run_path"
      - key: "costs.custom_cost_fn"
        effect: >
          CSV of cost overwrites per technology and planning horizon — the current
          sanctioned channel for cost sweeps. Can also add technology rows that are not in
          technology-data at all. Per design point this is an L3 lever (a new data file per
          scenario) unless the override is expressed in the scenario yaml instead.
        default: "'data/custom_costs.csv'"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: "costs.overwrites"
        effect: >
          Config-native cost overwrites, per attribute and technology — the cheapest way to
          put a cost perturbation directly in a scenario override, at the price of a
          deprecation warning steering you to custom_cost_fn.
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: "adjustments.sector.factor"
        effect: >
          Multiplicative factor on a component's attribute per carrier (and per investment
          year in the sector chain) — the corpus's 25-200% capex sweep expressed as one
          number in a scenario override, with an `absolute` sibling for level overrides.
        default: "{Link: {electricity distribution grid: {capital_cost: 1.0}}}"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
      - key: "scenario.sector_opts"
        effect: >
          Wildcard list expanded combinatorially with clusters and planning_horizons. Tokens
          carry the most-swept parameters directly (Co2L, Ep, seq, sdr, lv/lc, nH/nseg), and
          CF+<section>+<key>+<value> injects ANY config key — so a whole sweep dimension can
          live in this one list without a scenario file.
        default: "['']"
        provenance: "config/config.default.yaml:sector_opts; scripts/_helpers.py:update_config_from_wildcards"
      - key: "solving.options.seed"
        effect: >
          Seeds the degeneracy-breaking noise. Hold it fixed across every design point, or
          the sweep's smallest responses are solver arbitrariness rather than sensitivity.
        default: "123"
        provenance: "config/config.default.yaml:seed; scripts/solve_network.py:noisy_costs"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Coarsens snapshots (nH averaging) or segments them (nSEG via TSAM) — with cluster
          count the primary way to buy back the run multiplier a matrix imposes.
        default: "false (hourly)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:apply_time_segmentation"
    assembly:
      - step: >
          Write the design matrix. For a hand-listed OAT or small grid, edit the scenario
          file directly (config/scenarios.template.yaml shows the shape). For a factorial,
          edit config/create_scenarios.py — it is a template plus an itertools.product over
          a config_values dict, and rule create_scenarios regenerates the file from it.
        uses: [scenario-matrix]
        config: "run.scenarios.file"
        code: "config/create_scenarios.py (edit the template and config_values dict)"
        provenance: "config/create_scenarios.py:itertools; Snakefile:create_scenarios"
      - step: >
          Enable expansion: run.name (or 'all') plus run.scenarios.enable. Every merged
          config is schema-validated at DAG build, so a mistyped override in any design
          point fails loudly with the scenario name attached rather than silently reverting
          to the default — the single most valuable property of doing this in eur.
        uses: [scenario-matrix, config-schema-validation]
        config: "run.name; run.scenarios.enable"
        code: null
        provenance: "scripts/_helpers.py:get_scenarios; Snakefile:validate_config"
      - step: >
          Turn on shared resources so upstream data is built once, not once per design
          point, and exclude any resource the sweep actually perturbs.
        uses: [shared-resources-caching]
        config: "run.shared_resources.policy; run.shared_resources.exclude"
        code: null
        provenance: "scripts/_helpers.py:get_run_path"
      - step: >
          Express each perturbation at the cheapest layer: a wildcard token or CF+ injection
          for one-offs, an adjustments factor for per-carrier cost/potential scaling, a
          costs.overwrites entry or a custom_costs.csv for the cost table proper.
        uses: [wildcard-opts-grammar, cf-config-injection, carrier-attribute-scaling, cost-data-pipeline]
        config: "scenario.sector_opts; adjustments.*; costs.overwrites; costs.custom_cost_fn"
        code: null
        provenance: "scripts/_helpers.py:update_config_from_wildcards; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
      - step: >
          Collect the ensemble: make_summary writes per-run tables and make_global_summary
          concatenates them across the whole matrix, which is the sweep's reporting step
          already built. Read the response curve, heatmap or distribution off the
          concatenated csv.
        uses: [summary-outputs, global-summary]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_metrics; rules/postprocess.smk:make_global_summary"
      - step: >
          (sampled and GSA variants only, L5) Write the sampler and the analyser. The
          sampler is a script that draws from the input distributions — scipy.stats.qmc
          gives LatinHypercube directly, SALib gives Morris — and EMITS A SCENARIO FILE, so
          it plugs into the existing fan-out with no DAG changes. The analyser reads the
          global summary and computes mu*, Sobol indices or a PCE fit. Neither exists in the
          repo; both are ordinary Python against files, not model surgery.
        uses: [scenario-matrix, monte-carlo-sampling]
        config: "run.scenarios.file (written by, not read into, the sampler)"
        code: "new scripts/ driver emitting config/scenarios.yaml + a post-processor over results/*/csvs"
        provenance: "config/create_scenarios.py:itertools; scripts/_helpers.py:get_scenarios"
    boundary:
      - variant: one-at-a-time-perturbation
        rung: L1
        note: >
          Pure config. One scenario-file entry per perturbed input, or one wildcard token
          per design point; enable expansion and run. L1 rather than L0 only because
          run.name must be non-empty as well as enable: true — the two-key combination is
          the whole trick, and enable alone is a silent no-op.
      - variant: structured-scenario-matrix
        rung: L1
        note: >
          The variant the machinery was built for. Combinatorial expansion is native, in two
          independent places: scenario lists (clusters x sector_opts x planning_horizons)
          and the scenario file. config/create_scenarios.py is a shipped itertools.product
          generator — editing its template and config_values dict is authoring data, not
          code, so it stays L1.
      - variant: resolution-sweep
        rung: L1
        note: >
          scenario.clusters is already a list and resolution_elec / the nH-nseg tokens are
          config, so a nodes x hours grid is a two-line scenario file. Turn shared_resources
          OFF for the clustering resources here — this is the one sweep whose upstream
          resources legitimately differ per design point.
      - variant: monte-carlo-lhs-sampling
        rung: L5
        note: >
          Nothing samples in pypsa-eur — registry status for monte-carlo-sampling is
          `absent`, and there is no distribution config, no sampler and no `unc` wildcard.
          But the L5 is small and confined: a script that draws from scipy.stats.qmc and
          writes scenarios.yaml reuses the entire existing fan-out, validation and
          collection chain. Days of work, and it never touches a rule. Compare pypsa-earth,
          which ships exactly this sampler and lacks the scenario machinery around it.
      - variant: global-sensitivity
        rung: L5
        note: >
          Sampler as above plus an analyser: Morris/mu* screening (SALib) or Sobol indices,
          the latter cheapest via a polynomial-chaos surrogate fitted to the ensemble as
          2023_Neumann does. Both are post-processing over the global summary csv, so the
          rung is L5 for the code but the compute is whatever the sampled ensemble already
          cost. The genuinely cheap route, if the design is a balanced factorial, is
          2024_vanGreevenbroek's OLS-on-dummies — a dozen lines of statsmodels over runs you
          already have.
    where:
      - change: "the design matrix itself (factorial generation)"
        anchor: "config/create_scenarios.py -> the `template` string and the `config_values` dict; rule create_scenarios"
        provenance: "config/create_scenarios.py:config_values; Snakefile:create_scenarios"
      - change: "a sampler for LHS / Morris designs, emitting a scenario file"
        anchor: "new script under scripts/, output config/scenarios.yaml — no rule owns this; model on config/create_scenarios.py"
        provenance: "config/create_scenarios.py:itertools"
      - change: "sensitivity indices / surrogate fit over the ensemble"
        anchor: "rule make_global_summary output (results/<prefix>/csvs) -> a new post-processing script"
        provenance: "rules/postprocess.smk:make_global_summary"
      - change: "cost perturbation as a data file rather than a config override"
        anchor: "costs.custom_cost_fn -> data/custom_costs.csv, consumed by rule process_cost_data"
        provenance: "scripts/process_cost_data.py:overwrite_costs"
    cost_profile:
      solves: >
        n+1 for one-at-a-time-perturbation over n inputs (the corpus's OAT sets run 3-15
        dimensions, sometimes at 2-25 levels each, so 6-90 solves; 2026_Fernandes reached
        >30 dimensions). prod(n_i) for structured-scenario-matrix — corpus sizes 8, 10, 27,
        40, 64, 216, 264, 1800. A fixed sample budget for monte-carlo-lhs-sampling
        (2023_Neumann: 500 low-fidelity + 15 high-fidelity). For global-sensitivity, Morris
        costs r*(k+1) solves for k parameters and r trajectories, which is why
        2026_Barnes screened ~350 parameters first and only then propagated the top five.
      relative: >
        Directly multiplicative in the design size: 10-100x a single solve is the ordinary
        case, 200-2000x for a fine grid. Unlike MGA and stochastic optimisation the solves
        are fully independent, so wall-clock scales with cluster width rather than with the
        design — this is the cheapest of the three uncertainty methods per unit of insight.
      note: >
        The corpus's mitigations are all L0/L1 here and should be applied before promising a
        matrix: shared_resources so upstream data is built once rather than once per design
        point (the single biggest saving on a wide matrix); nH averaging or, better, TSAM
        segmentation — 2022_Millinger ran its 64-point factorial at 237 representative
        time-steps rather than 8760; fewer clusters; group parameters before factorialising
        (2^6 groups, not 2^30 parameters); and sweep at low fidelity with a small
        high-fidelity spot check. Cutting the sample budget by fitting a surrogate is the
        one mitigation neither model supports.
    verifies:
      - variant: structured-scenario-matrix
        check: "len(ns) == prod(len(v) for v in design.values())"
        over: ensemble
        note: >
          A short ensemble means design points were dropped by wildcard expansion rather
          than solved — the classic silent failure of a matrix, and it biases the reported
          response because the dropped points are usually the hardest (most constrained)
          ones.
      - variant: one-at-a-time-perturbation
        check: "all(abs(n.objective - base.objective) > noise_floor for n in ns)"
        over: ensemble
        note: >
          A design point whose objective is indistinguishable from the base run means the
          override never reached a consumer — either the key was mistyped in a way the
          schema accepted, or run.name was left blank so expansion silently did not happen
          and every 'design point' is the same run. Both make the sweep report zero
          sensitivity for a parameter that matters.
      - variant: one-at-a-time-perturbation
        check: "base_a.objective == base_b.objective"
        over: ensemble
        note: >
          Two runs of the identical base config must return the identical objective. If they
          do not, noisy_costs is unseeded across design points and the sweep's small
          responses are solver noise. Measure this noise floor before interpreting anything.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: monte-carlo-sampling
        role: >
          THE asymmetry: registry status `partial`, and pypsa-earth is the only one of the
          two models that SHIPS a sampler. monte_carlo.options.{add_to_snakefile,samples,
          sampling_strategy,seed} plus monte_carlo.uncertainties (a distribution per PyPSA
          object expression) drive scripts/monte_carlo.py, which builds a Latin hypercube via
          chaospy, pyDOE2 or scipy.stats.qmc, rescales each column to the requested
          distribution, and emits one perturbed network per sample under an `unc` wildcard —
          one solve per sample, DAG-managed. pypsa-eur has none of this.
      - id: scenario-matrix
        role: >
          the other fan-out, and weaker than eur's: scenario.{simpl,clusters,ll,opts,sopts,
          planning_horizons,demand,h2export} expand combinatorially, but there is no
          arbitrary-config-override scenario FILE in the main workflow — the equivalent is
          the run_scenario / run_all_scenarios rules, which shell out to a fresh snakemake
          invocation per config diff file
      - id: carrier-attribute-scaling
        role: >
          the config-level cost/potential perturbation: opts tokens like solar+c0.5,
          onwind+p2, AC+m1.1 scale capital_cost, marginal_cost or p_nom_max per carrier.
          Narrower than eur's — three attributes, no per-investment-year form, no
          adjustments config block.
      - id: technology-cost-year
        role: >
          the coarse cost lever: costs.year and costs.version select a technology-data
          vintage, sweepable through the scenario lists
      - id: custom-data-overrides
        role: >
          the sanctioned data-side perturbation channel for the sector chain (industry
          demand, gas network, heat/export) — the route for a sweep dimension that is a
          dataset rather than a number
      - id: summary-outputs
        role: >
          per-run collection, and the point at which the monte-carlo fan-out stops being
          plumbed: make_summary's input function does not carry the `unc` wildcard
      - id: numeric-stability-options
        role: >
          the noise floor. noisy_costs is true by default here too, and the seed is
          HARDCODED inside solve_network rather than exposed in config — reproducible across
          design points, but not controllable.
      - id: temporal-resolution-nh
        role: "the affordability lever; earth's default opts already carry a 3h token"
      - id: time-segmentation-tsam
        role: "the better affordability lever, as in eur"
    available:
      verdict: assemble
      how: >
        Two independent surfaces exist and neither alone is the method. (1) The scenario
        lists (scenario.{simpl,clusters,ll,opts,sopts,planning_horizons,demand,h2export})
        expand combinatorially into parallel runs, and opts tokens carry the common
        perturbations (Co2L, carrier+c/p/m, nH), which covers OAT and a matrix over those
        specific dimensions at L1. For an arbitrary config key, configs/scenarios/config.*.yaml
        diff files plus rule run_all_scenarios shell out to one full snakemake invocation per
        scenario. (2) monte_carlo.options.add_to_snakefile: true inserts a real sampling rule:
        scripts/monte_carlo.py draws a Latin hypercube (chaospy / pyDOE2 / scipy.stats.qmc),
        rescales columns to the per-quantity distributions in monte_carlo.uncertainties, and
        writes one perturbed network per sample, which solve_network then solves under the
        `unc` wildcard. So the sampled variant is nearly turnkey — the only variant either
        model ships a sampler for — and the wiring you do is joining it to reporting.
      missing: >
        The Monte-Carlo module is `partial` for three concrete reasons, all worth stating to
        a user before promising it. First, it perturbs by MULTIPLICATION on a solved-network
        attribute expression (`n.{key} = n.{key} * factor`, evaluated with exec), so it can
        scale loads and capacity factors but cannot sweep a CONFIG value — a capital-cost
        sweep must go through capital_cost on the built network, and anything that changes
        upstream data or the DAG is out of reach. Second, it attaches only to the
        ELECTRICITY chain rule (elec_s{simpl}_{clusters}_ec_l{ll}_{opts}_{unc}); the sector
        chain has no `unc` wildcard. Third, make_summary's input function does not include
        `{unc}`, so nothing collects the ensemble — the samples are recorded in n.meta and
        the aggregation is yours to write. Procedure steps 6 (for the sampled variant), 7
        (indices) and 8 (surrogate) have no handle: no Morris, no Sobol, no PCE. There is
        also no config-schema validation anywhere, so a mistyped override in a scenario diff
        runs the default silently — the opposite of eur.
      provenance: "scripts/monte_carlo.py:monte_carlo_sampling_chaospy; Snakefile:rule monte_carlo; Snakefile:input_make_summary"
    levers:
      - key: "monte_carlo.options.add_to_snakefile"
        effect: >
          Inserts rule monte_carlo into the DAG and rewrites solve_network to consume the
          per-sample network, adding the `unc` wildcard to the electricity chain. The single
          flip that turns on a sampled sweep — and the flip pypsa-eur has no equivalent of.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; Snakefile:rule monte_carlo"
      - key: "monte_carlo.options.samples"
        effect: >
          Number of samples, hence solves; also sets scenario['unc'] = [m0..m{samples-1}] at
          Snakefile parse time, so it IS the fan-out width. Must be an integer, and must be
          the square of a prime when sampling_strategy is scipy (orthogonal LHS).
        default: "9"
        provenance: "config.default.yaml:samples; scripts/monte_carlo.py:validate_parameters"
      - key: "monte_carlo.options.sampling_strategy"
        effect: >
          chaospy | pydoe2 | scipy — selects monte_carlo_sampling_chaospy (chaospy.J of
          uniforms, rule='latin_hypercube'), monte_carlo_sampling_pydoe2, or
          monte_carlo_sampling_scipy (scipy.stats.qmc.LatinHypercube, strength=2 orthogonal).
          validate_parameters rejects anything else.
        default: "'chaospy'"
        provenance: "config.default.yaml:sampling_strategy; scripts/monte_carlo.py:monte_carlo_sampling_scipy"
      - key: "monte_carlo.options.seed"
        effect: >
          Seeds the sampler so the design is reproducible across invocations. Distinct from
          the degeneracy noise seed, which is hardcoded in solve_network and cannot be set.
        default: "42"
        provenance: "config.default.yaml:seed; scripts/monte_carlo.py:monte_carlo_sampling_chaospy"
      - key: "monte_carlo.uncertainties"
        effect: >
          THE distribution specification, and the field with no counterpart in pypsa-eur:
          keys are PyPSA attribute expressions evaluated against the network (e.g.
          `loads_t.p_set`, or `generators_t.p_max_pu.loc[:, n.generators.carrier ==
          "onwind"]`), values are {type, args} over uniform | normal | lognormal | triangle |
          beta | gamma. rescale_distribution maps the unit hypercube onto each; the sampled
          factor MULTIPLIES the attribute, so ranges are relative, not absolute.
        default: >
          three entries shipped as an example — loads_t.p_set uniform[0.5,1], onwind
          p_max_pu lognormal[1.5], solar p_max_pu beta[0.5,2]
        provenance: "config.default.yaml:uncertainties; scripts/monte_carlo.py:rescale_distribution"
      - key: "scenario.opts"
        effect: >
          Wildcard list expanded combinatorially. Tokens carry the common perturbations —
          Co2L, Ep, nH, and carrier+c/p/m for per-carrier cost/potential scaling — so an OAT
          or small matrix over those dimensions is one list.
        default: "['Co2L-3h']"
        provenance: "config.default.yaml:opts; scripts/prepare_network.py:attr_lookup"
      - key: "scenario.clusters"
        effect: >
          Node counts as a list — the resolution-sweep dimension, expanded combinatorially
          with every other scenario list.
        default: "[10]"
        provenance: "config.default.yaml:clusters; Snakefile:scenario"
      - key: "costs.year"
        effect: >
          Technology-data cost vintage; the coarse-grained cost sweep dimension when
          per-technology overrides are not needed.
        default: "2030"
        provenance: "config.default.yaml:year; scripts/process_cost_data.py:load_costs"
      - key: "run.allow_scenario_failure"
        effect: >
          When rule run_all_scenarios shells out per scenario diff file, this decides whether
          one failing design point aborts the whole sweep or is skipped. Set it true for a
          wide matrix, then check which points actually produced results — a silently skipped
          point is a hole in the design.
        default: "false"
        provenance: "config.default.yaml:allow_scenario_failure; Snakefile:run_all_scenarios"
    assembly:
      - step: >
          Decide which fan-out the design needs. If every dimension is expressible as a
          scenario-list element or an opts token, use the scenario lists — combinatorial
          expansion is native and free. If a dimension is an arbitrary config key, write one
          configs/scenarios/config.<name>.yaml diff per design point; rule run_all_scenarios
          globs them and shells out a full snakemake run each, merging the diff onto
          config.default.yaml via create_test_config.
        uses: [scenario-matrix]
        config: "scenario.*; run.allow_scenario_failure"
        code: "configs/scenarios/config.<name>.yaml (data, one per design point)"
        provenance: "Snakefile:run_all_scenarios; scripts/build_test_configs.py:create_test_config"
      - step: >
          Express perturbations at the cheapest available layer. Per-carrier cost or
          potential scaling goes in an opts token (solar+c0.5); a cost vintage goes in
          costs.year; a dataset-shaped perturbation goes through the custom_data channels.
        uses: [carrier-attribute-scaling, technology-cost-year, custom-data-overrides]
        config: "scenario.opts; costs.year; custom_data.*"
        code: null
        provenance: "scripts/prepare_network.py:attr_lookup; scripts/prepare_sector_network.py:custom_data"
      - step: >
          For the sampled variant, declare the input distributions in
          monte_carlo.uncertainties as PyPSA attribute expressions, set samples and
          sampling_strategy, and flip add_to_snakefile. The `unc` wildcard appears on the
          electricity chain and solve_network consumes one perturbed network per sample. Note
          the factors are MULTIPLICATIVE on network attributes — translate the study's
          parameter ranges into relative factors on quantities that exist on the built
          network before promising a mapping.
        uses: [monte-carlo-sampling]
        config: "monte_carlo.options.{add_to_snakefile,samples,sampling_strategy,seed}; monte_carlo.uncertainties"
        code: null
        provenance: "scripts/monte_carlo.py:rescale_distribution; Snakefile:rule monte_carlo"
      - step: >
          Wire up collection, which is the actual assembly work: input_make_summary does not
          carry `{unc}`, so make_summary sees none of the samples. Either extend that input
          function and make_summary's wildcards to include `unc`, or write a standalone
          post-processor over results/<run>/networks/*_{unc}.nc. The sample factors are
          already stored in each network's n.meta by monte_carlo.py, so the ensemble is
          self-describing.
        uses: [summary-outputs, monte-carlo-sampling]
        config: null
        code: "Snakefile:input_make_summary + rule make_summary wildcards, or a new post-processor"
        provenance: "Snakefile:input_make_summary; scripts/make_summary.py:make_summaries"
      - step: >
          (GSA only) Compute indices over the collected ensemble — Morris/mu* via SALib, or
          Sobol via a PCE surrogate. Nothing in the repo does this; it is post-processing over
          netCDFs and csvs, and the design must come from the sampler, so a Morris design
          means bypassing monte_carlo.py's LHS and writing the trajectory design yourself.
        uses: [monte-carlo-sampling]
        config: null
        code: "new post-processor; and a new sampling function alongside monte_carlo_sampling_scipy for Morris designs"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling_scipy"
    boundary:
      - variant: one-at-a-time-perturbation
        rung: L1
        note: >
          Config, as long as the perturbed quantity has an opts token (carrier+c/p/m, Co2L,
          Ep, nH) or is a scenario-list key. For any other config key it is still L1 but via
          a different mechanism — one config.<name>.yaml diff file per design point under
          configs/scenarios/, driven by rule run_all_scenarios. Weaker than eur: no schema
          validation means a mistyped override runs the default silently.
      - variant: structured-scenario-matrix
        rung: L1
        note: >
          Scenario lists expand combinatorially and cover eight dimensions natively
          (simpl, clusters, ll, opts, sopts, planning_horizons, demand, h2export) — more
          named dimensions than eur exposes. Beyond those, the run_all_scenarios diff-file
          route is L1-with-more-typing and no cartesian-product generator (there is no
          create_scenarios.py here), so a 64-point factorial means writing or scripting 64
          yaml files.
      - variant: resolution-sweep
        rung: L1
        note: >
          scenario.clusters and scenario.simpl are already lists and the nH token is in opts,
          so the grid is a config edit. In practice the binding constraint for earth is data,
          not config — see data_dependencies; a node-count sweep is only meaningful where the
          underlying OSM network and cutout support the finer resolution.
      - variant: monte-carlo-lhs-sampling
        rung: L1
        note: >
          THE one place pypsa-earth is decisively ahead of pypsa-eur, and the sharpest
          asymmetry in this book: a real LHS sampler with six distribution families and three
          backends, wired into the DAG by one boolean. L1 rather than L0 because
          monte_carlo.uncertainties must be written as PyPSA attribute expressions and
          samples/sampling_strategy set to non-defaults. The caveats are real (multiplicative
          factors on network attributes only, electricity chain only, no ensemble collection)
          but the sampler itself — the piece that is L5 in eur — is a config flip here.
      - variant: global-sensitivity
        rung: L5
        note: >
          No Morris, no Sobol, no surrogate. The LHS sampler is the right starting point for
          Sobol-via-PCE (2023_Neumann's route: fit the surrogate to the LHS ensemble, read
          indices off the coefficients analytically) but a Morris screen needs a trajectory
          design, not a hypercube, so it means a new sampling function next to
          monte_carlo_sampling_scipy plus the elementary-effects analyser. Ensemble collection
          must be built first regardless, since input_make_summary drops `{unc}`.
    where:
      - change: "insert the sampling stage into the DAG"
        anchor: "config flag monte_carlo.options.add_to_snakefile -> rule monte_carlo and the {unc}-carrying rule solve_network"
        provenance: "Snakefile:rule monte_carlo"
      - change: "collect the sampled ensemble (the assembly gap)"
        anchor: "Snakefile:input_make_summary — add {unc} to the expand and to rule make_summary's wildcards"
        provenance: "Snakefile:input_make_summary; scripts/make_summary.py:make_summaries"
      - change: "a new design type (Morris trajectories, or a factorial) inside the sampler"
        anchor: "scripts/monte_carlo.py — a new sampling function alongside monte_carlo_sampling_scipy, selected by monte_carlo.options.sampling_strategy, and its entry in validate_parameters' valid_strategy list"
        provenance: "scripts/monte_carlo.py:validate_parameters"
      - change: "arbitrary-config-key design points (no scenario file in the main workflow)"
        anchor: "configs/scenarios/config.<name>.yaml diff files + rule run_all_scenarios"
        provenance: "Snakefile:run_all_scenarios; scripts/build_test_configs.py:create_test_config"
      - change: "extend the sampled sweep to the sector chain"
        anchor: "rule monte_carlo's output pattern — the sector prenetworks/postnetworks paths carry no {unc} wildcard"
        provenance: "Snakefile:prepare_sector_networks"
    data_dependencies:
      - input: "region cutout and OSM-derived base network at the finest swept resolution"
        required_for: resolution-sweep
        availability: >
          region-dependent — cutouts are built per region (enable.build_cutout) and the base
          topology comes from OSM extraction, so a node-count sweep is only meaningful up to
          the resolution the extracted network actually resolves. Check
          cookbooks/pypsa-earth/data_quality before promising the upper end of a resolution
          grid.
      - input: "regional cost assumptions for the swept parameter ranges"
        required_for: one-at-a-time-perturbation
        availability: >
          exists by default via technology-data at costs.year, but country-specific cost data
          is limited; a +-20% band around a European default is an assumption to sign off
          with the user explicitly, not a data-grounded range
      - input: "per-quantity distributions expressible as PyPSA attribute expressions"
        required_for: monte-carlo-lhs-sampling
        availability: >
          exists by default (three worked examples ship in config.default.yaml), but only for
          quantities present on the built network — a distribution over a CONFIG value or an
          upstream dataset has no expression and is absent
    cost_profile:
      solves: >
        n+1 for one-at-a-time-perturbation; prod of the scenario list lengths for
        structured-scenario-matrix; exactly monte_carlo.options.samples for
        monte-carlo-lhs-sampling (default 9, and the scipy backend requires the square of a
        prime — 9, 25, 49, 121 — which is a real constraint on the budget). Morris would cost
        r*(k+1) once written.
      relative: >
        Multiplicative in the design size, as in eur, but from a cheaper base: earth studies
        are usually one or a few countries, electricity-only, with a small cluster count, so
        a 100-point matrix is often tractable where the same matrix on a sector-coupled
        European eur run is not. The model-choice tradeoff runs in earth's favour for this
        method — the opposite of most cards in this book.
      note: >
        There is no shared-resources mechanism here (shared-resources-caching is absent from
        earth's registry; run.shared_cutouts shares only the cutout), so upstream resources
        are rebuilt per run name and a wide matrix pays for that repeatedly — the largest
        avoidable cost on this side. run_all_scenarios is worse still: it shells out a
        SEPARATE snakemake invocation per design point, so there is no cross-point DAG
        deduplication at all. Mitigations that do work: nH averaging (the default opts
        already carry 3h), TSAM segmentation, and a small cluster count. Solve failures on a
        wide matrix are common enough that run.allow_scenario_failure exists — set it, then
        verify the design is complete rather than assuming it.
    verifies:
      - variant: monte-carlo-lhs-sampling
        check: "len(ns) == config['monte_carlo']['options']['samples']"
        over: ensemble
        note: >
          Fewer solved networks than samples means design points failed or were never
          expanded. Because nothing collects the ensemble automatically, a missing sample is
          invisible unless counted — and a truncated Monte-Carlo sample reports a narrower
          output distribution, which is the wrong direction for an uncertainty claim.
      - variant: monte-carlo-lhs-sampling
        check: "all(any(k.endswith('_feature') for k in n.meta) for n in ns)"
        over: ensemble
        note: >
          monte_carlo.py writes the sampled factors into n.meta as *_feature columns. Their
          absence means the network came from the plain (non-sampled) chain, so the
          'perturbed' ensemble is a set of identical runs — the exact silent failure that
          makes a sweep report zero uncertainty.
      - variant: structured-scenario-matrix
        check: "len(ns) == prod(len(config['scenario'][k]) for k in dims)"
        over: ensemble
        note: >
          Short ensembles are routine here because run_all_scenarios can be told to continue
          past failures (run.allow_scenario_failure) and because there is no config-schema
          validation to catch a bad override. Count the design points before reading any
          response.
      - variant: one-at-a-time-perturbation
        check: "abs(n_perturbed.objective - n_base.objective) > 0"
        over: ensemble
        note: >
          An unchanged objective means the opts token or config diff never reached a
          consumer. With no schema validation on this side, a mistyped key silently runs the
          default — so this check is doing more work in earth than in eur.
