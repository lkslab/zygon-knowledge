pypsa_primitive:
  symbol: "pypsa/optimization/optimize.py:assign_duals; pypsa/statistics.py:market_value"
  pypsa_version: "0.30.3"
  exposed_by: "both — every solve in both workflows assigns duals; only pypsa-eur uses market_value"
  reachable_via: >
    Nothing to reach: assign_duals runs inside n.optimize() and writes
    n.buses_t.marginal_price plus n.global_constraints.mu with no config needed. Two
    library facts do the correctness work for you. (1) post_processing divides
    buses_t.marginal_price by n.snapshot_weightings.objective (and, under multi-period
    investment, additionally by the investment_period_weightings.objective), so the
    stored dual is already a per-MWh price — do not divide again. (2) statistics.revenue
    and statistics.market_value weight the time aggregation via get_weightings and
    aggregate_timeseries, so market_value = revenue/supply is the correctly weighted
    generation-weighted price. assign_duals only writes component mu_* series when
    called with assign_all_duals=True, or when the attribute already exists on the
    component.
  note: >
    This is the rare method where the primitive layer is not the gap — it is the
    correction. The traps this card exists for are all one layer UP, in how the
    workflow and the user aggregate a dual that the library handed over correctly.
    One weighting subtlety to know: post_processing rescales marginal_price by
    snapshot_weightings.objective, while statistics.revenue weights generator terms by
    snapshot_weightings.generators; the two columns are equal in both workflows' default
    paths but a hand-edited weighting table can make them diverge. Soft anchor: pypsa is
    a conda/pip pin, not a submodule, so this is a version claim not a SHA claim, and
    pypsa-eur at this ref pins `pypsa <1.2` while pypsa-earth pins `<=0.30.3`.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: nodal-marginal-prices
        role: >
          the method itself — registry `working`; n.buses_t.marginal_price is populated
          on every solved network with no config change
      - id: summary-outputs
        role: >
          the extraction layer: rule make_summary emits prices / weighted_prices /
          market_values / metrics csvs per run, so three of this card's variants are
          already tabulated
      - id: load-shedding-voll
        role: >
          the price CEILING. Off by default here, so scarcity prices are unbounded and
          an inadequate system is infeasible rather than expensive
      - id: co2-cap
        role: >
          the source of the CO2 shadow price; `electricity.co2limit_enable` is false by
          default, so a default electricity-only run has no CO2Limit dual to read
      - id: co2-atmosphere-constraint
        role: >
          the sector-coupled twin: the cap becomes a bound on the final co2-atmosphere
          store level, so the carbon price appears on that bus as well as in the
          constraint's mu
      - id: co2-sequestration-limit
        role: >
          a second scalar dual the corpus quotes as a price (EUR per tonne of storage
          headroom); surfaces as metrics 'co2_storage_shadow'
      - id: temporal-resolution-nh
        role: "sets the snapshot weightings — the single most common source of wrong prices"
      - id: time-segmentation-tsam
        role: >
          makes the weightings UNEQUAL per snapshot, which breaks naive averaging and
          flattens the scarcity tail the price distribution lives in
      - id: spatial-clustering
        role: >
          determines what a dual is the price OF: a cluster, not a node. Sets the visible
          price spread
      - id: administrative-clustering
        role: >
          the lever that makes the price a BIDDING-ZONE price rather than a k-means
          artefact (`clustering.mode: administrative`, `level: bz`)
      - id: carbon-intensity-metrics
        role: >
          registry `partial` — the CO2 dual is the marginal intensity, and the card's
          consumers often want it as the substitute for a missing gCO2/kWh column
      - id: solver-choice
        role: >
          dual UNIQUENESS: the shipped gurobi-default profile is barrier with crossover
          off, which is what makes prices reproducible in a degenerate zero-marginal-cost
          system
      - id: perfect-foresight
        role: >
          the one path where the price extraction is materially worse — make_summary_perfect
          carries an older unweighted implementation
      - id: market-design-mechanisms
        role: >
          registry `absent` — there are no bids and no capacity payments, so every price
          here is a competitive-benchmark shadow price, never a simulated market outcome
    available:
      verdict: turnkey
      how: >
        Solve anything and the duals are there: n.buses_t.marginal_price for every bus
        and carrier, n.global_constraints.mu for CO2Limit / lv_limit /
        co2_sequestration_limit. `rule make_summary` then writes four price tables per run
        with no config change — `prices` (time-averaged per bus carrier),
        `weighted_prices` (load-weighted per bus carrier, and correctly snapshot-weighted:
        `weights @ (load * price).sum()` over `weights @ load.sum()`), `market_values`
        (delegated to n.statistics.market_value, so revenue/supply with both terms
        snapshot-weighted) and `metrics` (co2_shadow, line_volume_shadow,
        co2_storage_shadow, electricity_price_mean/std and the near-zero-hour share).
        plot_balance_map additionally renders correctly weighted per-region prices and
        subtracts the CO2 price from the co2-stored map. The verdict is `turnkey` about
        GETTING a dual and deliberately says nothing about what it means: the registry
        rates market-design-mechanisms `absent`, so every number here is a
        competitive-benchmark shadow price from a cost-minimisation, never a simulated
        market outcome, and the correctness work below is where this card earns its keep.
      missing: >
        Not the extraction — the CORRECTNESS. Four concrete gaps. (1) The `prices` csv is
        `n.buses_t.marginal_price.mean()`, an unweighted time mean, which is simply the
        wrong number for any run with an nH or nSEG token; nothing warns you, and it sits
        beside the correct `weighted_prices` under a more inviting name. (2) The perfect-
        foresight path uses make_summary_perfect, whose calculate_weighted_prices and
        calculate_market_values compute `.sum().sum()/total` with NO snapshot weighting at
        all, so the multi-period pathway — the runs most likely to be coarsened — has the
        weakest price extraction. (3) No component duals are read anywhere: congestion
        rent, water value / marginal storage value and per-line congestion all require
        `assign_all_duals` at solve time plus your own post-processing (grep confirms no
        script in the repo touches mu_upper, mu_lower or mu_energy_balance). (4) No price
        duration curve, no percentile, no scarcity filter, no value factor, no
        accumulated-cost event detector, no zonal aggregation over a policy busmap
        independent of the clustering, and no bid-curve reconstruction.
      provenance: "scripts/make_summary.py:calculate_weighted_prices; scripts/make_summary.py:calculate_market_values; scripts/make_summary_perfect.py:calculate_market_values"
    levers:
      - key: "solving.options.load_shedding.enable"
        effect: >
          Adds an infinite slack generator at every bus, which puts a hard CEILING on
          every price in the run. Leaving it off means scarcity prices are unbounded and
          an inadequate system is infeasible instead of expensive — decide which failure
          mode the question wants before solving.
        default: "false"
        provenance: "config/config.default.yaml:load_shedding; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.load_shedding.default_cost"
        effect: >
          The value of lost load in EUR/MWh, and therefore the exact numeric price cap
          when shedding is enabled. Per-carrier overrides live under
          solving.options.load_shedding.carriers, so heat and H2 can be capped
          separately from electricity.
        default: "100000"
        provenance: "config/config.default.yaml:default_cost; scripts/solve_network.py:add_load_balance_components"
      - key: "solving.options.load_sinks.enable"
        effect: >
          The mirror image: absorbs surplus at a cost, which puts a FLOOR on negative
          prices. Off by default, so negative prices are whatever the KVL and
          must-run structure produce.
        default: "false"
        provenance: "config/config.default.yaml:load_sinks; scripts/solve_network.py:add_load_balance_components"
      - key: "electricity.co2limit_enable"
        effect: >
          Whether the CO2Limit global constraint is added at all. False by default, so a
          default electricity-only run has NO co2_shadow to read — the metrics row is
          simply absent, which is easy to misread as a zero carbon price.
        default: "false"
        provenance: "config/config.default.yaml:co2limit_enable; scripts/prepare_network.py:add_co2limit"
      - key: "electricity.co2limit"
        effect: >
          The cap level in tCO2/a, and therefore the point on the abatement curve the
          shadow price is read at. The dual diverges as this approaches zero, so a
          carbon-price answer needs a sweep of this key rather than one value.
        default: "77500000.0"
        provenance: "config/config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Sets the snapshot weightings. A `3h` value gives every snapshot weight 3; an
          `nSEG` value gives UNEQUAL weights per segment. Either way a plain mean over
          the resulting price series is wrong, and segmentation additionally destroys the
          scarcity tail.
        default: "false (hourly, all weights 1)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours; scripts/prepare_network.py:apply_time_segmentation"
      - key: "clustering.temporal.resolution_sector"
        effect: "The same lever for the sector chain, where coarsening is far more common."
        default: "false"
        provenance: "config/config.default.yaml:resolution_sector; scripts/prepare_sector_network.py:set_temporal_aggregation"
      - key: "clustering.mode"
        effect: >
          Chooses what a bus IS, and therefore what a nodal price is the price of.
          `administrative` with `clustering.administrative.level: bz` makes the duals
          bidding-zone prices; `custom_busmap` lets a bespoke zonal design be priced
          directly instead of being approximated by k-means.
        default: "'busmap'"
        provenance: "config/config.default.yaml:mode; scripts/cluster_network.py:busmap_for_admin_regions; scripts/cluster_network.py:custom_busmap"
      - key: "scenario.clusters"
        effect: >
          The number of buses, hence the price spread you can resolve. Price results are
          not comparable across values of this key, so it must be pinned by the market
          question and reported next to every number.
        default: "[50]"
        provenance: "config/config.default.yaml:clusters; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "solving.solver.options"
        effect: >
          Selects the tuning profile. `gurobi-default` is barrier (method 2) with
          crossover 0 and BarConvTol 1e-5 — interior-point without crossover, which
          returns the unique analytic-centre dual and is exactly what the price-formation
          literature prescribes for a degenerate zero-marginal-cost system. Overriding
          this to a simplex profile makes the price series solver-dependent.
        default: "'gurobi-default'"
        provenance: "config/config.default.yaml:gurobi-default; scripts/solve_network.py:solver_options"
      - key: "solving.options.noisy_costs"
        effect: >
          Adds ~1e-2 EUR/MWh of random noise to every marginal cost (and a length-scaled
          perturbation to line capital costs) to break ties. Improves dual stability but
          means a "zero price" is never exactly zero — the summary's near-zero-hour test
          uses a 0.1 threshold for this reason.
        default: "true"
        provenance: "config/config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
      - key: "solving.options.rolling_horizon"
        effect: >
          Switches to a myopic dispatch sequence. The duals then price a short window
          without foresight of the next one, which is the right price for a market
          question and the wrong one for a long-run storage-value question.
        default: "false"
        provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:solve_network"
    assembly:
      - step: >
          Fix the resolution and the price cap BEFORE solving. Duals are a property of
          the solved LP: the snapshot weightings, the cluster/zone definition, the VOLL
          and the solver's crossover setting cannot be changed afterwards, and neither
          can the component duals.
        uses: [temporal-resolution-nh, time-segmentation-tsam, spatial-clustering, administrative-clustering, load-shedding-voll, solver-choice]
        config: "clustering.temporal.resolution_elec; clustering.mode; scenario.clusters; solving.options.load_shedding.enable; solving.solver.options"
        code: null
        provenance: "scripts/prepare_network.py:average_every_nhours; scripts/cluster_network.py:busmap_for_admin_regions; scripts/solve_network.py:add_load_balance_components"
      - step: >
          If congestion rent, water value or any per-component dual is in scope, set
          solving.options.assign_all_duals before solving. The key is read via a bare
          .get() and is NOT in config.default.yaml, so it must be added by hand under
          solving.options; missing it means re-solving, not re-post-processing.
        uses: [nodal-marginal-prices]
        config: "solving.options.assign_all_duals (absent from config.default.yaml — add it)"
        code: null
        provenance: "scripts/solve_network.py:assign_all_duals"
      - step: >
          Solve, then read the duals off the network: n.buses_t.marginal_price (already
          per-MWh — post_processing divided by the objective weighting) and
          n.global_constraints.mu. Check the constraint EXISTS before reading its mu, and
          distinguish absent from slack from binding.
        uses: [co2-cap, co2-atmosphere-constraint, co2-sequestration-limit]
        config: null
        code: null
        provenance: "pypsa/optimization/optimize.py:assign_duals; pypsa/optimization/optimize.py:post_processing"
      - step: >
          Take the aggregate prices from make_summary rather than recomputing them:
          weighted_prices for the consumer-side price, market_values for the capture
          price, metrics for co2_shadow / line_volume_shadow / co2_storage_shadow and the
          price mean/std/zero-hour share. Ignore the `prices` csv unless every snapshot
          weight is 1.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:calculate_weighted_prices; scripts/make_summary.py:calculate_market_values; scripts/make_summary.py:calculate_metrics"
      - step: >
          Write the missing metrics yourself, weighting every time aggregation with
          n.snapshot_weightings.generators: value factor (market_value / weighted price),
          price duration curve, percentiles, congestion rent (price difference times
          flow), or the accumulated-cost event detector. plot_balance_map is the in-repo
          reference for the correct weighted form; make_summary_perfect is the
          counter-example not to copy.
        uses: [summary-outputs, nodal-marginal-prices]
        config: null
        code: "a new extraction script; scripts/plot_balance_map.py is the weighting pattern to copy"
        provenance: "scripts/plot_balance_map.py:snapshot_weightings; scripts/make_summary_perfect.py:calculate_market_values"
    boundary:
      - variant: nodal-lmp-timeseries
        rung: L0
        note: >
          n.buses_t.marginal_price exists on every solved network with no config change.
          The only decision above L0 is the resolution the prices are produced AT, which
          is itself L0/L1 (scenario.clusters, clustering.mode, resolution_elec).
      - variant: demand-weighted-average-price
        rung: L0
        note: >
          `rule make_summary` already emits the weighted_prices csv, and it does the
          weighting correctly (`weights @ (load * price)` over `weights @ load`) using
          n.statistics.withdrawal per bus carrier. Read that table; do not read `prices`.
      - variant: market-value-and-capture-price
        rung: L0
        note: >
          The market_values csv is emitted by default and delegates to
          n.statistics.market_value, i.e. snapshot-weighted revenue/supply. L2 only if
          the run is perfect-foresight, where make_summary_perfect's own unweighted
          implementation takes over.
      - variant: global-constraint-dual
        rung: L1
        note: >
          L1 rather than L0 because the constraint must be switched ON to have a dual:
          `electricity.co2limit_enable: true` (or a Co2L opts token, or the sector
          chain's co2_budget). Once present, metrics carries co2_shadow,
          line_volume_shadow and co2_storage_shadow with no code.
      - variant: sector-coupled-carrier-prices
        rung: L1
        note: >
          Every carrier's bus already has a dual and weighted_prices iterates over all
          bus carriers, so this is L1 — running the sector chain (`foresight`, sector
          config) is the whole cost. The work is choosing the bus, not building anything.
      - variant: component-mu-and-congestion-rent
        rung: L2
        note: >
          `solving.options.assign_all_duals` must be added to config.default.yaml's
          solving.options block (it is consumed but not shipped), and then nothing in the
          repo reads mu_upper / mu_lower / mu_energy_balance — congestion rent and water
          value are a small post-processing script. Localised, but it must be decided
          before the solve.
      - variant: accumulated-shadow-price-events
        rung: L5
        note: >
          No handle at any layer: a rolling accumulation of sum_n d_{n,t} lambda_{n,t}
          with a threshold and an event classifier, then usually an ensemble of weather
          years around it. The corpus's implementations are separate research codebases,
          not merged. The duals are free; the detector is the work.
      - variant: price-based-model-coupling
        rung: L5
        note: >
          Needs a scarcity filter, per-technology market values and per-sector demand-
          weighted prices exported on a schema another model consumes, plus the iteration
          loop. The published coupling reuses make_summary's market_values as its
          starting point, which is what makes this L5-with-a-handle rather than from
          scratch.
    where:
      - change: "read component-level duals (congestion rent, water value)"
        anchor: "solving.options.assign_all_duals -> scripts/solve_network.py::solve_network solve_kwargs"
        provenance: "scripts/solve_network.py:assign_all_duals"
      - change: "correct the unweighted time mean in the prices table"
        anchor: "scripts/make_summary.py::calculate_prices (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_prices; rules/postprocess.smk:rule make_summary"
      - change: "correct the unweighted perfect-foresight price and market-value tables"
        anchor: "scripts/make_summary_perfect.py::calculate_weighted_prices / calculate_market_values (rule make_summary_perfect)"
        provenance: "scripts/make_summary_perfect.py:calculate_weighted_prices; rules/solve_perfect.smk:rule make_summary_perfect"
      - change: "new price metrics (duration curve, value factor, percentiles, event detector)"
        anchor: "a new script beside scripts/make_summary.py; copy the weighting pattern from scripts/plot_balance_map.py"
        provenance: "scripts/plot_balance_map.py:snapshot_weightings"
      - change: "make the priced zone a policy zone rather than a k-means cluster"
        anchor: "clustering.mode: administrative | custom_busmap -> scripts/cluster_network.py"
        provenance: "scripts/cluster_network.py:busmap_for_admin_regions; scripts/cluster_network.py:custom_busmap"
    cost_profile:
      solves: >
        1 — the duals come free with the solve that was happening anyway. A carbon-price
        or transmission-value curve is one solve per cap level (the corpus sweeps 5-15).
        An event-detection or price-distribution study is one solve per weather year
        (the corpus uses 40-80).
      relative: >
        Zero marginal cost for the extraction itself. The real cost is the RESOLUTION the
        correctness demands: hourly instead of 3-hourly is ~3x the LP, and refusing
        segmentation for a price-distribution deliverable can be another 2-4x.
      note: >
        The tempting mitigations are exactly the ones this method cannot afford.
        Segmentation and coarse nH buy tractability by destroying the price tail, and
        aggressive clustering buys it by destroying the spread. If the deliverable is a
        mean price or a CO2 shadow price, coarsen freely; if it is a distribution, a
        percentile or a locational spread, spend the compute and say why. Turning on
        assign_all_duals costs memory and file size, not solve time.
    verifies:
      - variant: demand-weighted-average-price
        check: "abs((w @ p / w.sum()) - p.mean()) < 1e-6 or (w != w.iloc[0]).any()"
        over: run
        note: >
          Trips when the two aggregations disagree while the weightings are uniform,
          which would mean the weighting vector was applied to the wrong axis. The
          converse case — they disagree and the weights are non-uniform — is correct and
          is the whole point.
      - variant: nodal-lmp-timeseries
        check: "not n.buses_t.marginal_price.empty and n.buses_t.marginal_price.abs().to_numpy().max() > 0"
        over: run
        note: >
          An empty or all-zero price frame means no duals were assigned — the solve was a
          MILP, or it failed and the network was written anyway. Silent: every downstream
          price table will be zeros rather than an error.
      - variant: global-constraint-dual
        check: "('CO2Limit' not in n.global_constraints.index) or (n.global_constraints.at['CO2Limit', 'mu'] <= 0)"
        over: run
        note: >
          A '<=' cap's dual must be non-positive by sign convention; a positive value
          means the sign was flipped somewhere in post-processing. Report the absolute
          value as the carbon price, and treat exactly 0 as 'cap present but not binding',
          never as 'carbon is free'.
      - variant: market-value-and-capture-price
        check: "(mv.loc[['solar', 'onwind']] <= wp['AC'] + 1e-6).all()"
        over: run
        note: >
          Wind and solar capture prices must not exceed the demand-weighted price in a
          system where they are the marginal technology in their own production hours. A
          violation almost always means the market value was computed as a time mean over
          production hours instead of a generation-weighted mean.
      - variant: component-mu-and-congestion-rent
        check: "(n.lines_t.mu_upper >= -1e-6).all().all() and (n.lines_t.mu_lower >= -1e-6).all().all()"
        over: run
        note: >
          Both line duals are non-negative by construction. All-zero instead means
          assign_all_duals was never set and the congestion analysis is reading an
          uninitialised frame of zeros — which looks exactly like an uncongested network.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: nodal-marginal-prices
        role: >
          the method itself — registry `working`; the duals are there on every solved
          network exactly as in eur, because they come from the same library
      - id: summary-outputs
        role: >
          the extraction layer, and this is where the two models diverge: earth's
          make_summary has prices and weighted_prices but NO market_values, and its
          weighted_prices does not apply the snapshot weightings
      - id: load-shedding-voll
        role: >
          the price ceiling, and ON BY DEFAULT here at 100 EUR/kWh — every default earth
          price series is capped at 100000 EUR/MWh whether the user asked or not
      - id: co2-cap
        role: >
          the CO2 shadow price, and unlike eur the default scenario already runs with a
          Co2L token, so co2_shadow is populated out of the box
      - id: temporal-resolution-nh
        role: >
          the weighting trap, live in the default config: `opts: ['Co2L-3h']` gives every
          power-sector snapshot weight 3 and `sopts: ['144h']` gives every sector snapshot
          weight 144
      - id: time-segmentation-tsam
        role: "makes the weights unequal per segment; same hazard as eur"
      - id: spatial-clustering
        role: >
          what the dual is the price of; earth's default is 10 clusters, so a default
          price is a very coarse zonal average
      - id: gadm-admin-clustering
        role: >
          earth's administrative-zoning equivalent — the route to prices on
          policy-meaningful regions rather than k-means clusters
      - id: carbon-intensity-metrics
        role: >
          registry `partial`, same as eur: no gCO2/kWh column, and the CO2 dual is the
          marginal-intensity substitute
      - id: solver-choice
        role: >
          dual uniqueness; earth's gurobi-default is also barrier with crossover 0, and
          its HiGHS profile ships `run_crossover: on`, so an open-source earth run is the
          configuration most exposed to degenerate non-unique duals
      - id: sector-coupled-workflow
        role: >
          where multi-carrier prices (H2, ammonia, methanol, steel, heat) come from — the
          corpus's earth study reads exactly these product duals
      - id: monte-carlo-sampling
        role: >
          the existing multi-solve harness; the closest thing to a fan-out for a
          price-distribution or event-detection study, which eur has no equivalent of
      - id: market-design-mechanisms
        role: >
          registry `absent`, same as eur — every price is a competitive-benchmark shadow
          price
    available:
      verdict: assemble
      how: >
        The duals themselves are identical to eur — same library, same assign_duals, same
        post_processing rescaling — so n.buses_t.marginal_price and
        n.global_constraints.mu are populated with no config change, and `rule
        make_summary` writes prices, weighted_prices and metrics (co2_shadow,
        line_volume_shadow via the n.line_volume_limit_dual attribute stashed in
        prepare_network). The default scenario already carries a Co2L token, so unlike
        eur the CO2 shadow price is there out of the box. But the aggregation layer is
        weaker than eur's on every axis, so the extraction must be wired rather than read.
      missing: >
        Four concrete deficits relative to eur, all in the aggregation. (1) NO snapshot
        weighting anywhere in the price code: calculate_weighted_prices computes
        `(load * price).sum().sum() / load.sum().sum()`, with no `weights @`, while the
        shipped default is `opts: ['Co2L-3h']` and `sopts: ['144h']` — so the default
        earth weighted price is a straight mean over snapshots of weight 3 or 144. The
        `prices` table is worse still and says so in a logger.warning ("Prices are
        time-averaged, not load-weighted"). (2) NO market_values table and no call to
        n.statistics.market_value anywhere in the repo — the capture-price variant has no
        implementation at all, so `rule make_sector_summary` declares market_values.csv
        and price_statistics.csv as outputs that scripts/make_summary.py never writes.
        (3) The carrier grouping is string surgery on bus names (`n.buses.index.str[3:]`,
        `n.buses.index.str[2:] == suffix`) with a hardcoded link_loads dict, so it assumes
        two-letter country prefixes and a fixed carrier vocabulary — fragile for GADM
        naming and for any carrier the dict does not list. It also uses the removed pandas
        `groupby(..., axis=1)` signature. (4) Load shedding is ON by default, so the price
        ceiling is set silently, and no output reports whether it bound.
      provenance: "scripts/make_summary.py:calculate_weighted_prices; scripts/make_summary.py:Prices are time-averaged; scripts/solve_network.py:get_load_shedding_capacity"
    levers:
      - key: "solving.options.load_shedding"
        effect: >
          A number in EUR/kWh (not a mapping as in eur), multiplied by 1000 into the slack
          generator's marginal cost. The shipped 100 therefore caps EVERY price in a
          default run at 100000 EUR/MWh. Set to false for unbounded scarcity prices — and
          expect infeasibility instead when the system is inadequate.
        default: "100 (i.e. ON, capping prices at 100000 EUR/MWh)"
        provenance: "config.default.yaml:load_shedding; scripts/solve_network.py:get_load_shedding_capacity"
      - key: "scenario.opts"
        effect: >
          Carries both the CO2 cap token and the temporal-resolution token. The default
          `Co2L-3h` means the CO2 shadow price exists AND every snapshot has weight 3, so
          the weighting correction is mandatory from the very first default run.
        default: "['Co2L-3h']"
        provenance: "config.default.yaml:opts; scripts/prepare_network.py:add_co2limit; scripts/prepare_network.py:average_every_nhours"
      - key: "scenario.sopts"
        effect: >
          The sector chain's resolution token. The shipped `144h` gives each snapshot
          weight 144 — 61 snapshots for a year — which makes an unweighted price mean
          meaningless and flattens the entire price distribution.
        default: "['144h']"
        provenance: "config.default.yaml:sopts; scripts/prepare_sector_network.py:average_every_nhours"
      - key: "electricity.co2limit"
        effect: >
          The cap level in tCO2/a that the shadow price is read at. Combined with
          electricity.automatic_emission (false by default) this is the point on the
          abatement curve, and the dual diverges as it approaches zero.
        default: "77500000.0"
        provenance: "config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: "scenario.clusters"
        effect: >
          The number of buses and hence what a nodal price is a price of. The default 10
          means a default earth price is a very coarse regional average with almost no
          resolvable spread.
        default: "[10]"
        provenance: "config.default.yaml:clusters; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "solving.solver.options"
        effect: >
          Selects the tuning profile. `gurobi-default` is barrier with crossover 0
          (unique duals); the `highs-default` profile ships `run_crossover: on`, so
          switching to the open-source solver is the configuration most likely to return
          a degenerate, non-reproducible dual vector.
        default: "'gurobi-default'"
        provenance: "config.default.yaml:gurobi-default; scripts/solve_network.py:solver_options"
      - key: "solving.options.noisy_costs"
        effect: >
          Same tie-breaking noise as eur (~1e-2 EUR/MWh on every marginal cost), but with
          a fixed np.random.seed(174) inside the loop, so it is at least reproducible
          across runs. A 'zero price' is still never exactly zero.
        default: "true"
        provenance: "config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
      - key: "monte_carlo.options.add_to_snakefile"
        effect: >
          Wires the multi-solve fan-out into the DAG. The nearest existing harness for the
          many-solve price studies this card's L5 variants need (price distributions over
          weather years, event detection), and something eur has no equivalent of.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/monte_carlo.py:monte_carlo_sampling"
    assembly:
      - step: >
          Decide the price ceiling explicitly — this is the first thing to do on earth and
          it is not needed on eur. Leaving solving.options.load_shedding at its default
          100 caps every price at 100000 EUR/MWh; the user must be told, or the key set to
          false and infeasibility accepted as the failure mode instead.
        uses: [load-shedding-voll]
        config: "solving.options.load_shedding"
        code: null
        provenance: "scripts/solve_network.py:get_load_shedding_capacity"
      - step: >
          Fix the resolution and the zoning before solving, and record the weightings the
          run will carry: `opts` for the power chain, `sopts` for the sector chain,
          scenario.clusters and the GADM zoning for space. The defaults (3h / 144h / 10
          clusters) are all hostile to price results.
        uses: [temporal-resolution-nh, time-segmentation-tsam, spatial-clustering, gadm-admin-clustering, solver-choice]
        config: "scenario.opts; scenario.sopts; scenario.clusters; solving.solver.options"
        code: null
        provenance: "scripts/prepare_network.py:average_every_nhours; scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          Solve and read n.buses_t.marginal_price and n.global_constraints.mu off the
          network. Identical to eur — the duals are library-side and correctly rescaled to
          per-MWh by post_processing. line_volume_shadow is the exception: it is stashed
          onto the network as n.line_volume_limit_dual during prepare_network, before the
          solve, so read it from metrics rather than from the attribute.
        uses: [nodal-marginal-prices, co2-cap]
        config: null
        code: null
        provenance: "scripts/solve_network.py:line_volume_limit_dual; scripts/make_summary.py:line_volume_shadow"
      - step: >
          Do NOT use the shipped prices or weighted_prices tables for a coarsened run.
          Replace the aggregation with `w @ (load * price).sum(axis=1) / (w @
          load.sum(axis=1))` where w = n.snapshot_weightings.generators — i.e. port
          pypsa-eur's calculate_weighted_prices, which is the same function with the
          weighting present. This is the single highest-value edit for this method on
          earth.
        uses: [summary-outputs]
        config: null
        code: "scripts/make_summary.py::calculate_weighted_prices"
        provenance: "scripts/make_summary.py:calculate_weighted_prices"
      - step: >
          Add the market-value / capture-price table, which does not exist here at all:
          n.statistics.market_value(bus_carrier=...) is available in the pinned pypsa and
          already snapshot-weights both revenue and supply. Register it in the script's
          `outputs` list — rule make_sector_summary already declares market_values.csv and
          price_statistics.csv as outputs the script never writes, so the sector summary
          is broken until this is done.
        uses: [summary-outputs, sector-coupled-workflow]
        config: null
        code: "scripts/make_summary.py (outputs list) + Snakefile rule make_sector_summary"
        provenance: "pypsa/statistics.py:market_value; pypsa/statistics.py:revenue"
      - step: >
          Replace the bus-name string surgery if the region's naming is not two-letter
          prefixed or the carriers are outside the hardcoded link_loads dict: group on
          n.buses.carrier as pypsa-eur does, rather than on n.buses.index.str[3:].
        uses: [summary-outputs, gadm-admin-clustering]
        config: null
        code: "scripts/make_summary.py::calculate_prices / calculate_weighted_prices"
        provenance: "scripts/make_summary.py:calculate_prices"
      - step: >
          For a multi-solve price study (distribution over weather years, event
          detection), reuse the monte-carlo fan-out rather than writing a loop — it
          already enumerates samples, rewrites the network per sample and collects
          results.
        uses: [monte-carlo-sampling]
        config: "monte_carlo.options.add_to_snakefile; monte_carlo.options.samples"
        code: "scripts/monte_carlo.py"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling"
    boundary:
      - variant: nodal-lmp-timeseries
        rung: L0
        note: >
          The duals are library-side, so this is L0 here exactly as in eur — a solved
          earth network carries n.buses_t.marginal_price with no config change.
      - variant: demand-weighted-average-price
        rung: L2
        note: >
          L2 rather than eur's L0: the weighted_prices table exists but omits the snapshot
          weighting entirely, while the shipped defaults are 3h and 144h. A correct number
          requires editing calculate_weighted_prices — small, localised, and the port
          target already exists in pypsa-eur's version of the same function.
      - variant: market-value-and-capture-price
        rung: L2
        note: >
          L2, and the sharpest eur/earth asymmetry on this card: there is no
          market_values implementation anywhere in the repo, yet rule
          make_sector_summary declares market_values.csv as an output. The fix is small
          because n.statistics.market_value does the work — add the function and register
          it in the outputs list.
      - variant: global-constraint-dual
        rung: L0
        note: >
          L0 here where eur is L1, because earth's default `scenario.opts: ['Co2L-3h']`
          already adds the cap: co2_shadow is populated in metrics on a default run.
          line_volume_shadow needs an lv_limit token to exist.
      - variant: sector-coupled-carrier-prices
        rung: L2
        note: >
          The duals exist on every carrier bus, but the summary's carrier grouping is a
          hardcoded string-slice plus a fixed link_loads dict, so H2/ammonia/methanol/
          steel prices for a GADM-named non-European region generally need the grouping
          rewritten. The corpus's Morocco study reads exactly these product duals, which
          is what makes this a real requirement rather than a theoretical one.
      - variant: component-mu-and-congestion-rent
        rung: L2
        note: >
          Same as eur: nothing reads mu_upper / mu_lower / mu_energy_balance, so
          congestion rent and water value are a post-processing script. Earth's
          extra_functionality is the hook for anything that must be added at solve time.
      - variant: accumulated-shadow-price-events
        rung: L3
        note: >
          The detector code is L5-equivalent work, but on earth the BINDING constraint is
          DATA, not code: the event/distribution question needs a multi-year cutout per
          region, and cutouts are built per region here. Check
          cookbooks/pypsa-earth/data_quality for the region's grade before promising a
          weather-year price distribution.
      - variant: price-based-model-coupling
        rung: L5
        note: >
          Hardest variant here, because it needs the market values that do not exist plus
          a scarcity filter plus the iteration loop. No published earth coupling to copy;
          the eur-side implementation is the reference.
    where:
      - change: "apply snapshot weightings to the price aggregation"
        anchor: "scripts/make_summary.py::calculate_weighted_prices (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_weighted_prices; Snakefile:rule make_summary"
      - change: "add the missing market-value / capture-price table"
        anchor: "scripts/make_summary.py::outputs list + Snakefile rule make_sector_summary"
        provenance: "scripts/make_summary.py:make_summaries; Snakefile:rule make_sector_summary"
      - change: "replace bus-name string surgery with a carrier groupby"
        anchor: "scripts/make_summary.py::calculate_prices"
        provenance: "scripts/make_summary.py:calculate_prices"
      - change: "set or remove the default price ceiling"
        anchor: "solving.options.load_shedding -> scripts/solve_network.py::prepare_network"
        provenance: "scripts/solve_network.py:get_load_shedding_capacity"
      - change: "anything that must be added at solve time (custom duals, extra constraints to price)"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "many-solve fan-out for price distributions / event detection"
        anchor: "scripts/monte_carlo.py + the monte_carlo rule"
        provenance: "scripts/monte_carlo.py:monte_carlo_sampling"
    data_dependencies:
      - input: "multi-year ERA5 cutout covering the study region"
        required_for: accumulated-shadow-price-events
        availability: >
          region-dependent — cutouts are built per region in earth, so a weather-year
          ensemble of price fields means building one per year before any dual exists
      - input: "regional demand time series of adequate quality"
        required_for: accumulated-shadow-price-events
        availability: >
          region-dependent — the detector weights the dual by demand
          (sum_n d_{n,t} lambda_{n,t}), so a synthetic or scaled load profile makes the
          event set an artefact of the load model rather than of the weather; check the
          country's demand grade in cookbooks/pypsa-earth/data_quality first
      - input: "region-appropriate value of lost load"
        required_for: demand-weighted-average-price
        availability: >
          absent — the shipped 100 EUR/kWh is a European placeholder that caps every
          price, and no regional VOLL registry exists. Treat it as an assumption to sign
          off with the user, not as data
    cost_profile:
      solves: >
        1 — as on eur, the duals are a by-product. A carbon-price curve is one solve per
        cap level; a price distribution is one solve per weather year, for which
        monte_carlo.options.samples is the existing fan-out.
      relative: >
        Zero marginal cost for the extraction. The cost is again the resolution: earth's
        defaults (3h power, 144h sector, 10 clusters) are far coarser than eur's, so a
        price-quality run is a bigger relative step up here — hourly at a usable cluster
        count can be 10x the default LP.
      note: >
        The compensating advantage is that earth base cases are usually smaller (single
        region, fewer carriers), so hourly resolution is often affordable where the
        equivalent eur sector run is not — the model-choice tradeoff runs in earth's
        favour for price work, provided the aggregation code has been fixed first.
    verifies:
      - variant: demand-weighted-average-price
        check: "(n.snapshot_weightings.generators == 1).all() or price_code_applies_weights"
        over: run
        note: >
          The default earth path fails this: weights are 3 (or 144) and the shipped
          aggregation ignores them. A failure here means every price number in the
          summary is a straight mean over unequally weighted blocks — the exact error
          this card exists to prevent.
      - variant: market-value-and-capture-price
        check: "'market_values' in outputs"
        over: run
        note: >
          Fails at this ref: the script's `outputs` list has no market_values entry while
          rule make_sector_summary declares market_values.csv as an output. A sector
          summary run therefore cannot produce a capture price at all.
      - variant: nodal-lmp-timeseries
        check: "n.generators.query(\"carrier == 'load shedding'\").empty or (n.buses_t.marginal_price.to_numpy().max() < voll - 1e-6)"
        over: run
        note: >
          Detects the silent ceiling: if any price equals the VOLL exactly, the reported
          maximum is a config number and not a system property. On earth this fires by
          default, because load shedding ships enabled at 100 EUR/kWh.
      - variant: global-constraint-dual
        check: "('CO2Limit' not in n.global_constraints.index) or (n.global_constraints.at['CO2Limit', 'mu'] <= 0)"
        over: run
        note: >
          Same sign check as eur. Earth's default opts include Co2L, so unlike eur the
          absent-constraint branch should NOT be the one taken — if CO2Limit is missing
          from a default run, the opts token was dropped somewhere in wildcard expansion.
