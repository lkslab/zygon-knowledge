id: shadow-prices-and-marginal-values
title: "Shadow prices, locational marginal prices and marginal values (LP duals as prices)"
summary: >
  Read the dual variables of the solved optimisation as prices — the nodal energy
  balance dual as a locational marginal price, a policy constraint's dual as the
  policy price — and aggregate them with the weights the model was actually solved
  under.
question: >
  What does electricity (or hydrogen, or heat, or CO2) cost in this system, where,
  when, and what does each technology earn for the energy it produces?
aliases:
  - "shadow price"
  - "dual variable"
  - "KKT multiplier"
  - "Karush-Kuhn-Tucker multiplier"
  - "Lagrange multiplier"
  - "locational marginal price"
  - "LMP"
  - "nodal price"
  - "marginal price"
  - "marginal value"
  - "market value"
  - "capture price"
  - "value factor"
  - "relative market value"
  - "CO2 shadow price"
  - "carbon shadow price"
  - "marginal abatement cost"
  - "congestion rent"
  - "scarcity rent"
  - "water value"
  - "marginal storage value"
when_to_use:
  - "what is the electricity price in this scenario"
  - "what carbon price would deliver this emissions target"
  - "how much does a MWh of hydrogen cost in each region"
  - "what price does wind actually capture, not the average price"
  - "which hours are expensive and why"
  - "is this power plant going to recover its costs"
  - "what would a nodal market pay in the north versus the south"
  - "how much is another MWkm of transmission worth"
  - "what is the value of an extra tonne of CO2 storage"
  - "how much revenue would a battery earn"
  - "which periods define the system - when is it under stress"
  - "give me the price duration curve"
  - "what does district heat cost to the consumer here"
family: markets-and-prices
prevalence:
  papers: 45
  tier1: 31
  tier2: 14
  sweep_hits: 59
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 45 papers that actually
    extract and report at least one dual variable — the third most prevalent method in
    the corpus, behind only foresight and carbon constraints. The regex screen returned
    59; it OVER-counts by 14 because the pattern includes "marginal cost of", which any
    paper writing about merit order matches without reading a dual, and "market value"
    in its everyday sense. EVIDENCE_INDEX.md flags no mention-only suspects in this
    slice, so all 45 stand. The 24 `routine-use` entries are the point of this card:
    reading duals as prices is background machinery almost nobody documents, and none of
    the 24 states how it corrected for snapshot weighting, clustering or aggregation.
    Only 3 papers carry `defines` and 3 `extends`, so almost all the correctness content
    lives in the three `defines` papers plus this card's `pitfalls`.
procedure:
  - step: >
      Solve the model. Duals only exist for a continuous relaxation — any binary
      (unit commitment, discrete expansion) destroys them, and a MILP solution has
      no meaningful marginal price at all.
    handle: "the standard workflow solve"
    provenance: "scripts/solve_network.py:solve_network"
  - step: >
      Pull the dual of the nodal energy-balance constraint. This is the locational
      marginal price of that bus's carrier in that snapshot: EUR/MWh for an energy bus,
      EUR/t for a CO2 bus. PyPSA assigns it automatically after every solve; it is
      already divided by the snapshot weighting, so the stored number is a genuine
      per-MWh price and NOT a per-block cost.
    handle: "n.buses_t.marginal_price"
    provenance: "pypsa/optimization/optimize.py:assign_duals; pypsa/optimization/optimize.py:post_processing"
  - step: >
      Pull the duals of the GLOBAL constraints — the CO2 cap, the transmission line
      volume cap, the CO2 sequestration limit. These are scalars, not time series, and
      they answer a different question: the marginal cost of the last unit of the
      policy target, i.e. the carbon price that would deliver this cap in an open
      market, or the value of another MWkm of grid.
    handle: "n.global_constraints.mu"
    provenance: "pypsa/optimization/optimize.py:assign_duals; pypsa/optimization/global_constraints.py:GlobalConstraint"
  - step: >
      (optional) Pull the per-component duals — line and link mu_upper/mu_lower for
      congestion, storage mu_energy_balance for the water value / marginal storage
      value. These are NOT assigned by default; the solve must request all duals, and
      unlike marginal_price they are NOT rescaled by the snapshot weighting.
    handle: "solving.options.assign_all_duals"
    provenance: "pypsa/optimization/optimize.py:assign_all_duals; pypsa/component_attrs/lines.csv:mu_upper"
  - step: >
      Decide which bus answers the user's question. In a sector-coupled network the
      same location carries an AC bus, a low-voltage bus, urban/rural heat buses, an H2
      bus, a gas bus and a co2-stored bus, each with its own price. "The electricity
      price" is the AC bus; a residential tariff question is the distribution bus; the
      carbon price in a sector-coupled run is the co2-atmosphere bus (or the CO2Limit
      dual), not any energy bus.
    handle: "n.buses.carrier filter on n.buses_t.marginal_price"
    provenance: "scripts/prepare_sector_network.py:add_co2_network; scripts/make_summary.py:calculate_weighted_prices"
  - step: >
      Aggregate over TIME using the snapshot weightings, never a plain mean. A
      3-hourly run has weight 3 per snapshot, a segmented run has unequal weights per
      segment, and a truncated test run can have weight 365. The weighted mean price is
      `w @ p / w.sum()`; the plain mean is a different number and is wrong whenever the
      weights are not all equal.
    handle: "n.snapshot_weightings.generators"
    provenance: "scripts/plot_balance_map.py:snapshot_weightings; scripts/make_summary.py:calculate_weighted_prices"
  - step: >
      Aggregate over SPACE with the quantity the price is a price OF — demand for a
      consumer price, generation for a producer price. A demand-weighted average over
      the buses in a zone is the zonal price; an unweighted mean over buses gives an
      average of a geography, not of a market, and drifts as the cluster count changes.
    handle: "n.statistics.withdrawal(groupby='bus', aggregate_time=False)"
    provenance: "pypsa/statistics.py:withdrawal; pypsa/statistics.py:aggregate_timeseries"
  - step: >
      For a producer-side price, compute the MARKET VALUE (capture price) per
      technology: revenue divided by energy produced, both weighted. This is a
      generation-weighted price and is systematically BELOW the demand-weighted price
      for wind and solar, because they produce when prices are low. The ratio of the
      two is the value factor / relative market value.
    handle: "n.statistics.market_value(bus_carrier='AC')"
    provenance: "pypsa/statistics.py:market_value; pypsa/statistics.py:get_weightings"
  - step: >
      Sanity-check the price ceiling and floor before reporting anything. Load
      shedding puts a slack generator at every bus at its value of lost load, which
      caps the price at exactly that number; a load sink caps the negative price
      symmetrically. Report whether the cap bound, and how often.
    handle: "solving.options.load_shedding.default_cost"
    provenance: "scripts/solve_network.py:add_load_balance_components; config/config.default.yaml:load_shedding"
  - step: >
      (extension) Post-process the price series into the metric the question actually
      wants: a price duration curve, the share of near-zero hours, the standard
      deviation, a scarcity-price filter, an accumulated-cost event detector, or a
      merit-order reconstruction. Only the first three exist anywhere in either
      workflow; the rest is the L5 work.
    handle: null
    provenance: null
variants:
  - id: nodal-lmp-timeseries
    what: >
      Read lambda_{n,t} on every bus and snapshot and report it as a price series,
      map or duration curve. The base case of the method: every other variant is an
      aggregation of this one. Also the variant that is validated against reality —
      hindcast runs compare it hour-by-hour to observed day-ahead prices.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
      - "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
  - id: demand-weighted-average-price
    what: >
      Collapse the nodal price field to one number per carrier, region or scenario by
      weighting with the DEMAND at each bus and snapshot (and with the snapshot
      weightings). The consumer-side price, and the denominator of the value factor.
      What the literature means when it writes "average electricity price".
    papers:
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2025_DiBella_European-green-industrial-transformation.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
  - id: market-value-and-capture-price
    what: >
      Generation-weighted price per technology: revenue / energy produced. The
      producer-side counterpart, and the only price that answers cost recovery. Its
      ratio to the demand-weighted price is the value factor. Distinct from the
      previous variant by the weighting quantity alone, which is exactly why it is so
      often computed wrongly.
    papers:
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
  - id: global-constraint-dual
    what: >
      The dual of a scalar policy constraint read as the policy price: mu_CO2 as the
      carbon price implied by an emissions cap, mu_LV as the value of a MWkm of
      transmission, the sequestration-limit dual as the value of a tonne of CO2
      storage. One number per run, and the most quoted single output of this whole
      method. Diverges to absurd values as the cap approaches zero.
    papers:
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
  - id: component-mu-and-congestion-rent
    what: >
      The duals of INEQUALITY constraints on components rather than of balances:
      line/link mu_upper as the congestion signal, the storage energy-balance dual as
      the water value / marginal storage value, congestion rent as the price
      difference times the flow. Diagnostic rather than economic — this is how you
      answer "why is the price different here".
    papers:
      - "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
  - id: sector-coupled-carrier-prices
    what: >
      Read the balance dual on a NON-electricity bus: hydrogen, methanol, ammonia,
      district heat, steel, CO2. In a multi-carrier model each product has an
      endogenous price, and the dual at a demand bus IS the levelised cost of that
      product including its inputs. The variant that most often needs the "which bus"
      question answered before anything else.
    papers:
      - "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
      - "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
  - id: accumulated-shadow-price-events
    what: >
      Use the price field as a DETECTOR rather than as a price: accumulate
      sum_n d_{n,t} * lambda_{n,t} over a rolling window and threshold it to identify
      system-defining events. Explicitly rejects the market-price interpretation — in a
      capacity-expansion model the dual reflects investment pressure, so its magnitude
      is an adequacy signal, not a forecast.
    papers:
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
  - id: price-based-model-coupling
    what: >
      Feed the extracted prices back into another model: market values and sectoral
      prices as markups/markdowns passed to an integrated assessment model, or a
      post-hoc LP re-solve with learning capacities fixed purely to recover clean
      duals a MILP could not produce. The variant where the price is an input, so its
      correctness is load-bearing rather than presentational.
    papers:
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
literature:
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      The framework paper that establishes the whole convention this card documents:
      lambda_{n,t} is "the marginal price at the bus" (the nodal power-balance dual),
      mu_CO2 is "the shadow price of the CO2 cap constraint", and the branch KKT
      multipliers mu-bar/mu-underbar are defined for flow limits. Its Germany demo — LMPs
      under high wind and low load, showing spatial price separation from transmission
      bottlenecks — is the canonical picture of what a dual field looks like. Everything
      later in this slice is an application or a correction of these definitions.
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: defines
    note: >
      Defines market value rigorously and is the paper to cite when a user asks what wind
      or solar "actually earns". MV is revenue per unit of DISPATCHED energy — a
      generation-weighted price, not a time average. The KKT result is the payload:
      MV_s = LCOE_s - mu_s under a VRE support policy and MV_s = LCOE_s + e_s mu_CO2 under
      a CO2 policy, so the gap between capture price and LCOE is exactly the policy
      constraint's dual, and the relative market value (value factor) follows. The
      substantive finding contradicts the usual intuition: the decline of VRE market value
      with penetration is caused by the implicit policy assumption, not by variability —
      under a CO2 cap, market values stay at cost recovery above 80% penetration. Proofs
      extend to storage, multi-node networks, limited potentials and non-linear costs.
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: defines
    note: >
      Defines the shadow price as a DIAGNOSTIC rather than a price, and is the source of
      the most important caveat in this card: in a capacity-expansion setting shadow
      prices are driven by investment needs, not by marginal operating costs, so they are
      "different from market prices". Uses them to identify system-defining events over
      40 ERA5 weather years, and additionally extracts congestion rents (line-capacity
      duals) and the value of stored energy (inter-hour storage duals) to attribute the
      roles of transmission and storage during those events. 181 generation / 90 network
      nodes, hourly, PyPSA-Eur 0.6.1.
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: extends
    note: >
      The source of this card's solver guidance, and the extension of dual-reading to
      storage. Formally maps electricity prices AND marginal storage values (water value /
      Bellman value) to LP/QP duals: the price is the energy-balance dual lambda_t, the MSV
      for each storage unit is lambda^s_t. Proves that long-term and short-term model
      prices coincide iff the inverse demand curve is a unique strictly decreasing map from
      demand to price. Critically for practice, it uses an interior-point method WITHOUT
      crossover (Gurobi 11, barrier tol 1e-7) specifically to avoid degenerate primal
      solutions that make duals non-unique — which is what both models' shipped
      gurobi-default profile happens to do.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: extends
    note: >
      Turns the accumulated shadow price into a resilience metric. The SDE detector is
      system-wide electricity cost sum_n d_{n,t} lambda_{n,t} thresholded over a rolling
      window; four event types are classified from it, and short- vs long-term resilience
      metrics are built on top. 80 runs, one per weather year 1941-2021, PyPSA-Eur 0.13.0.
      Contributes the honest limitation to relay: shadow prices cannot compare severity
      ACROSS separate optimisations, so a physical metric (net load) is needed alongside.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: extends
    note: >
      Extends dual extraction into a model-coupling interface, which makes the correctness
      load-bearing rather than presentational. Market values are computed as the
      generation-weighted average of hourly nodal prices per technology and sectoral prices
      as the demand-weighted average per sector; both are passed to REMIND as
      markups/markdowns on the average electricity price. Contributes the scarcity filter
      this card recommends: prices more than 3 standard deviations above average are
      REMOVED before either metric is computed, otherwise a handful of hours dominate the
      coupling.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: canonical-use
    note: >
      The only paper in the slice that states the weighting correction explicitly:
      temporal weighting factors w_t scale the duals when snapshot weights differ from
      1 h. Also the reference for the multi-carrier case — marginal storage values are the
      balance duals of each carrier's bus, used as the "fuel cost" of storage and as
      cross-carrier opportunity costs for converters — and for the CO2 mechanism: the CO2
      atmosphere is a storage unit whose binding final-period capacity constraint
      propagates backward as a CONSTANT price across all timesteps, which is exactly how
      pypsa-eur's sector chain implements it. Its own contribution is reconstructing full
      supply/demand bid curves ex post from the duals to identify the price-setting
      technology at every timestep (PyPSA-DE, single node, 3-hourly, myopic 2020-2045).
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: canonical-use
    note: >
      The validation reference: modelled nodal marginal prices compared hour-by-hour to
      ENTSO-E observed prices across 39 nodes, 35 countries and 5 years including the 2022
      crisis, with MAE/RMSE/SMAPE at hourly, daily and weekly aggregation. Note the
      configuration — DISPATCH-ONLY at fixed capacities, hourly, PyPSA-Eur v2025.07.0 —
      which is the setup to reach for whenever a user wants market prices rather than
      marginal system values. Also demonstrates the correct European aggregate: a
      load-weighted average across countries.
  - paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference for reading duals at different market resolutions from the same
      physical system: status-quo zonal, 101-zone, and full nodal LMP over 1024 k-means
      buses, hourly, 2030 and 2040. Congestion rent appears wherever adjacent prices
      differ, so the number of zones determines how much rent exists at all. Also computes
      CfD strike prices ex post from annuitised investment cost and realised production at
      the local price, and compares renewables' market values across market designs to
      assess merchant-tail risk — the clearest demonstration that "the price" is a function
      of the zoning choice.
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: canonical-use
    note: >
      Duals as the basis of a full welfare accounting: zonal wholesale prices from the LP
      duals, then inter-zonal congestion rent, unit-level producer surplus and consumer
      savings built on top, with two independent welfare calculations (top-down from
      surpluses, bottom-up from fuel-cost savings) cross-checked against each other. Note
      the configuration that makes prices trustworthy here — operations-only, no
      investment, ~300 GSP buses, 30-minute resolution, solved day-by-day over 2022-2024 —
      and that congestion rent is a first-class reported term (~GBP 6.3/MWh to consumers).
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The house formulation for the European case: the KKT multiplier lambda_{n,t} of the
      nodal balance is the LMP, mu_CO2 the carbon shadow price, mu_LV the line-volume
      shadow price. Its lasting contribution is the interpretation of mu_LV: plotted
      against the allowed transmission volume and compared directly to the overnight
      capital cost of overhead lines (400 EUR/MWkm) and underground cables (~2000
      EUR/MWkm), which converts a dual into a build/don't-build answer. 30 nodes, hourly,
      full year 2011.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: canonical-use
    note: >
      States the volume-cap dual's interpretation most sharply: mu_trans "can also be
      interpreted as the transmission line cost per MWkm necessary for the optimal solution
      to have the transmission line volume CAP_trans" — a dual read as a break-even cost.
      Relevant to this card's clustering pitfall because the sweep runs k = 37-362 buses at
      3-hourly resolution and reads the duals straight out with no weighting correction
      discussed, which is the corpus norm rather than the exception.
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The evidence for the clustering pitfall. Sweeps 37-1024 nodes at 3-hourly resolution
      and shows resource resolution and network resolution have effects of similar
      magnitude and opposite sign — so a price computed at one cluster count is not
      comparable to one computed at another. Reads mu_trans against the annuity of
      overhead and underground lines to find the cost-optimal grid expansion, and
      interprets the shadow price via Lagrangian relaxation as the line cost that would
      make the unconstrained solution optimal.
  - paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      Shows that the price field depends on the FLOW FORMULATION, not only on the data:
      nodal price duration curves are compared across six linear flow models (transport,
      lossy transport, lossless/lossy LOPF and iterative variants) on 250 nodes. The
      transport model cannot produce negative prices at all while KVL models can, because
      "negative nodal prices are a consequence of KVL and occur when increasing demand at a
      bus relieves a transmission line". Price differences across lines also diagnose
      zero-flow degeneracy in the lossy transport model — duals as a debugging tool.
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The first multi-carrier reading in the slice: lambda_{n,t} is "the market price of
      the energy carrier at this bus in this hour", reported as LOAD-WEIGHTED averages for
      electricity and heat separately across all scenarios. Puts the duals to a decision:
      marginal heat prices are compared against building-retrofit cost curves to estimate
      the economically efficient retrofitting level, and the KKT relation links CO2 price,
      fuel cost and heat price at the margin. PyPSA-Eur-Sec-30, hourly, 2011.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      Electricity-and-heat carrier prices from the demand-constraint duals plus mu_LV as
      the value of transmission expansion, on PyPSA-Eur-Sec-30 with separate urban and
      rural heat buses. Its procedure notes are candid about the limit this card is built
      around: no post-processing correction for snapshot weighting, justified only because
      the run is single-year hourly with unit weights — which is precisely the condition
      that fails the moment an nH token appears.
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: canonical-use
    note: >
      The clearest statement of the "which bus" question in practice. In a single-node
      multi-carrier PtX hub, the KKT multipliers of the H2 and methanol DEMAND constraints
      are read as the levelised cost of producing those carriers, while the duals of
      internal electricity and CO2 buses are the equilibrium prices for behind-the-meter
      trading — same network, same method, three different economic meanings depending on
      which bus you pick. Internal shadow price distributions are compared against external
      spot prices to quantify the shielding effect of the internal market.
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: canonical-use
    note: >
      Duals of the per-carrier nodal balances read as LMPs for BOTH electricity and
      hydrogen, then used to define Unit Benefit and Overall Price Spread: storage
      profitability is driven by the spread of the dual, so buying and selling prices are
      the LMPs at the actual charge and discharge hours. The reason a price DISTRIBUTION
      (not a mean) is sometimes the deliverable — and therefore the reason segmentation is
      not an acceptable saving for this class of question. PyPSA-Eur-Sec-30-path, hourly,
      myopic 2020-2050.
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: canonical-use
    note: >
      The counter-case to the load-shedding ceiling: with no price cap, "unconstrained"
      nodal prices rise above 20000 EUR/MWh and that is what lets seasonal storage be
      optimised as a reserve. The modelled LCOS is derived from these spatially resolved
      duals together with model-derived full-load hours and E/P ratios rather than
      exogenous assumptions, and the paper shows LCOS-based ranking can contradict
      system-value ranking. PyPSA-Eur, 181 nodes, hourly.
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: canonical-use
    note: >
      The CO2 dual as the headline policy output: the required CO2 price at every 5-year
      step is "an outcome of the model, i.e. it is the Lagrange/KKT multiplier associated
      with the maximum CO2 constraint", plotted as a trajectory for both transition paths.
      Also the stranded-asset use of the price field — annualised expenditure compared with
      market revenues (dispatch times nodal price) per plant to test cost recovery, which
      is the pattern behind the stranded-asset-risk topic.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: canonical-use
    note: >
      Uses nodal marginal prices for electricity and district heat as PREDICTORS rather
      than as results: read from a counterfactual (geothermal-free) run and correlated
      against regional EGS adoption across scenarios (~0.4 for the electricity price).
      Notable for this card because the prices are explicitly not corrected for snapshot
      weightings on a 3-hourly 72-node sector-coupled run — a concrete instance of the
      most common error in a paper that otherwise uses the duals carefully.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      The source of the divergence numbers this card quotes: mu_CO2 plotted against the cap
      level, ~180 EUR/tCO2 at a 5% cap with a grid, 319 EUR/tCO2 at 5% without
      transmission, and ~20000 EUR/tCO2 at exactly zero emissions. States the standard
      interpretation — "the CO2 price that would be required for the market to achieve a
      certain emission level under the given assumptions" — and, by sweeping, shows why a
      single point value is not an answer.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      CO2 cap dual as the implied carbon price outside Europe, reported across flexibility
      configurations at 90% reduction: 228, 293, 809 and 1307 EUR/tCO2 depending on whether
      hydro and storage are available. Useful for calibration expectations — the dual is
      extremely sensitive to which flexibility the model is allowed, not just to the cap.
      31 provinces, hourly, no nodal price analysis.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      Reads mu_CO2 as the shadow price and defines market value operationally as "the
      average price of electricity produced by PV relative to the average load-weighted
      price" — i.e. the value factor, with the demand-weighted price as denominator. The
      most compact statement of the ratio this card's market-value variant computes.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: >
      Both scalar duals (mu_CO2 vs the cap, mu_LV) plus a revenue calculation: PHS annual
      market revenues as the sum over countries and hours of dispatch times nodal price,
      with the long-term equilibrium condition invoked to argue cost recovery for optimised
      assets. The template for any storage-revenue question, and the reason
      storage-revenue-stacking routes here.
  - paper: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      The component-dual use case: line-capacity duals mu_l,t are positive exactly when the
      flow reaches its (70%-derated) limit, and are read purely to flag binding
      transmission constraints and attribute congestion spatially — never post-processed
      into nodal prices. Also the clearest demonstration of the clustering pitfall's
      mechanism, sweeping 6 to 306 nodes on a dispatch-only Germany model and watching
      congestion appear as resolution rises.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Standard reading of lambda as "the market price of the energy carrier at bus n and
      hour t" in a 48-node sector-coupled net-zero run with electricity, heat and land
      transport. A representative member of the 24 routine-use entries: the definition is
      stated, the prices are reported, and no weighting or aggregation choice is documented.
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Duals used as ACCOUNTING inputs rather than as reported prices: the CO2 shadow price
      is used as the cost of CO2 feedstock for electrofuels and as the emission penalty for
      fossil fuels, and load-weighted nodal electricity prices attribute electricity cost
      to electrolysers, all inside a post-processing fuel-cost decomposition. Explicit that
      these shadow prices are for accounting only and do not close a market-clearing loop —
      a distinction worth relaying whenever a user wants a "cost breakdown".
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      "The CO2 price is not an input to the model, but an output calculated as the
      Lagrange/KKT multiplier associated with the CO2 cap constraint" — the sentence to
      reuse when a user assumes the carbon price is something they set. Reads both the
      per-bus per-hour balance dual and the annual cap dual across six carbon budgets,
      plus mu_LV. 37 nodes, 3-hourly, myopic 2020-2050 — i.e. a run where the weighting
      correction matters and is not mentioned.
  - paper: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      The MILP workaround this card recommends, stated in the source: because the
      endogenous learning formulation does not yield clean duals, the investment costs and
      capacities of the learning technologies are FIXED at their optimised values and the
      problem is re-solved as a pure LP purely to recover hydrogen prices from the duals.
      The reusable recipe for any run with integers in it.
  - paper: "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
    tier: 2
    role: routine-use
    note: >
      Duals used INTERNALLY as model inputs rather than as outputs: the dual of the hydro
      storage energy balance is interpreted as the water value and used as the hydro bid
      price in the redispatch stage. Also a useful negative: the paper discusses LMPs as a
      policy option but does not compute nodal prices, and takes the CO2 price as an
      exogenous parameter rather than as a dual — so "carbon price" in this study means the
      opposite of what it means elsewhere in the slice. 1024 nodes, hourly, exogenous
      capacities.
  - paper: "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: >
      Nodal duals used as the wholesale prices that a participating consumer faces for grid
      imports and receives for selling excess CFE electricity — the price enters a cost
      breakdown that IS the result. On 3-hourly snapshots (2920 per year) across 37 bidding
      zones, which is exactly the configuration where the weighting correction changes the
      answer.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      PRODUCTION-weighted averages of nodal-temporal duals used to derive industrial
      commodity prices, then differenced against literature import prices to size the
      required subsidy — a decision that depends directly on the aggregation weight being
      the right one. Its own notes record that no correction for snapshot weights or
      clustering bias was made, on a 3-hourly 39-node myopic run: the highest-stakes
      instance of this card's central pitfall in the slice.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The sequestration-limit dual read as a price with a concrete non-linearity worth
      quoting: at 200 Mt/a each additional tonne of sequestration saves 225 EUR/t, at
      800 Mt/a only 51 EUR/t. Also reports regional average marginal H2 and CO2 prices as
      maps and derives a carbon-capture merit order from per-technology marginal capture
      cost. 90 nodes, 3-hourly, sector-coupled.
  - paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Textbook single-node reading of both dual types — hourly lambda_t as the carrier's
      marginal price and mu_CO2 as "the price of CO2 that should be added to obtain a
      system with the required emissions" — used to interpret cost structure rather than as
      a headline result. Denmark and Spain, electricity plus heat, hourly, unit weights.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      Marginal prices of inputs (electricity, hydrogen, CO2) and outputs (heat) used to
      attribute domestic synthesis cost per region and snapshot, so that domestic
      production can be compared against import cost. Notable for what it does NOT do with
      duals: capital costs are distributed in proportion to production volume rather than
      taken from a capacity-constraint dual — the pragmatic split between what duals answer
      well (marginal input costs) and what they do not (capex allocation). 110 nodes,
      4-hourly equivalent.
  - paper: "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      DEMAND-weighted average electricity and heating prices, plus their standard
      deviation, computed per country across 124 demand-side-flexibility scenarios, with
      the CO2 price as the net-zero constraint's dual. One of the few entries reporting
      price VARIABILITY rather than only the level, which is the statistic segmentation
      would have destroyed — the run is 2-hourly full-year with no temporal aggregation
      applied, and its own notes say so.
  - paper: "2025_Seibold_Germany-Industry-Transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      The cleanest statement of the consumer-cost use: lambda_{i,t} multiplied by
      consumption d gives consumer costs c_cons, summed over all regions and time steps.
      That product is only correct if the snapshot weighting is in it — the run is 4-hourly
      with TSAM segmentation on PyPSA-DE, i.e. unequal weights, which makes this the
      sharpest illustration of why the weighting step is in this card's procedure.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Computes SCARCITY RENTS as the divergence between LCOE and the mean marginal
      demand-weighted price, and tracks how the dominant contributors shift from fossil to
      renewable and storage as decarbonisation deepens. The corpus's clearest example of a
      derived quantity (rent) built from two correctly distinguished price aggregations.
      37 nodes, hourly, 105 scenarios.
  - paper: "2026_Barnes_near-term-emission-targets.pdf"
    tier: 2
    role: routine-use
    note: >
      Uses average marginal cost of electricity and of energy as the OUTPUT METRICS of a
      global sensitivity analysis (Method of Morris plus Monte Carlo over ~350 parameters)
      rather than as reported prices — so the dual's stability under parameter perturbation
      is itself the result. PyPSA-USA, 134 load zones, 3-hourly, states solved
      independently. Grounds the choice in Schweppe's spot-pricing and Harvey & Hogan's LMP
      theory.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      The one PyPSA-EARTH entry in the slice, and the evidence that earth's multi-carrier
      duals are load-bearing in practice: marginal prices for hydrogen, ammonia, methanol,
      HBI and steel read as "the shadow value of supplying one additional unit of each
      product", used both as a sensitivity index and as welfare weights (W = sum_i p_i Q_i).
      Reported levels: H2 ~111-112 EUR2024/MWh, steel ~687-689 EUR2024/t. Morocco, 14 GADM
      nodes, hourly, 2035.
  - paper: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    tier: 2
    role: routine-use
    note: >
      Defines both duals explicitly (lambda_{n,t} the nodal electricity shadow price,
      mu_CO2 the continent-wide CO2 shadow price) and reports only the CO2 one as a key
      result — the electricity duals are formulated but never reported. The typical shape
      of the absent-versus-zero pitfall: a defined quantity that simply never reaches an
      output table. PyPSA-Eur 2025.01.0, 90 nodes, 3-hourly.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      The evidence for the segmentation pitfall: 2190 TSAM-segmented time steps on a
      100-node sector-coupled run, from which CO2 shadow prices are reported across 15
      sensitivity settings (57-650 EUR/tCO2) and model-endogenous fuel, electricity and CO2
      prices feed a levelised-cost merit order — with the regional prices explicitly
      described as DEMAND-WEIGHTED averages across the 100 regions. Scalar duals and
      weighted means survive segmentation; a price distribution would not have.
  - paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    tier: 1
    role: routine-use
    note: >
      District-heating prices as demand-weighted averages of the heat-bus duals across the
      40 largest German systems, with the price reduction under PTES as a key result. The
      canonical example of the "which bus" question having a non-electricity answer: the
      deliverable is a heat price at a sub-national heat network, on 49 regions at 3-hourly
      resolution.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      Duals of the CO2 sequestration constraint AND the biomass supply constraint read as
      scarcity rents, then combined into a merit order that ranks biofuels, e-biofuels,
      e-fuels and fossil fuels — "the system value of carbon governs the liquid fuel merit
      order". Demonstrates that the useful duals are often on resource-availability
      constraints rather than on energy balances, and that their spatial/temporal
      heterogeneity is what produces the reported cost ranges. 39 nodes, 3-hourly.
pitfalls:
  - pitfall: >
      THE most common error in this corpus: averaging prices over unequally weighted
      snapshots with a plain mean. A 3-hourly run, a TSAM-segmented run and a
      truncated test run all have snapshot weightings != 1, and a naive `.mean()` over
      them weights a 1-hour segment the same as a 300-hour one. Of the 45 papers, only
      one states that it applies the temporal weighting factors w_t to its duals.
    evidence: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    note: >
      Always aggregate as `w @ p / w.sum()` with w = n.snapshot_weightings.generators.
      In pypsa-eur, `calculate_weighted_prices` and `plot_balance_map` do this and
      `calculate_prices` does not — prefer the weighted_prices csv over the prices csv,
      and never quote the prices csv for a run with an nH or nSEG token. Note the dual
      itself needs no correction: pypsa's post_processing already divides
      buses_t.marginal_price by the objective weighting, so the stored series is
      per-MWh. The error is purely in the aggregation.
  - pitfall: >
      Load shedding silently CAPS the price at the value of lost load. Every shed bus
      gets a slack generator at that marginal cost, so any scarcity hour that would
      have priced above it prices exactly at it, and the price distribution's upper
      tail is an artefact of a config number rather than of the system.
    evidence: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    note: >
      Report the VOLL alongside every price statistic, and report how many hours hit it.
      This is not symmetric between the models: pypsa-eur ships load shedding OFF, so
      unserved energy is infeasibility; pypsa-earth ships it ON at 100 EUR/kWh
      (= 100000 EUR/MWh), so an earth price series is capped by default and the user
      will not have been told. A run without load shedding has the opposite problem:
      unbounded scarcity prices in the tens of thousands, as the corpus's storage-value
      studies exploit deliberately.
  - pitfall: >
      A dual after spatial clustering is the price of an AGGREGATE, not of a node. Ten
      real substations collapsed into one bus share one price by construction, so
      intra-cluster congestion is invisible and the price is smooth where reality is
      not. The clustering level therefore sets the price spread you are able to see,
      and price results are not comparable across cluster counts.
    evidence: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    note: >
      Fix the resolution to the market question: use `clustering.mode: administrative`
      with `level: bz` if the user means bidding-zone prices, a custom busmap for a
      bespoke zonal design, and high cluster counts only if they mean nodal. State the
      cluster count next to every price number. If price spread is the finding, run at
      two resolutions and show the sensitivity — the corpus shows curtailment and
      congestion metrics moving monotonically with cluster count.
  - pitfall: >
      A dual after temporal segmentation is the price of a SEGMENT of unequal length,
      and segmentation deliberately merges similar hours — which flattens exactly the
      short scarcity peaks that dominate price statistics and market values. The mean
      may survive; the variance, the peak and the near-zero-hour share do not.
    evidence: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    note: >
      Segmentation is fine for cost and capacity results and hostile to price
      distribution results. If the deliverable is a price duration curve, the standard
      deviation, or a scarcity metric, run hourly or at worst uniform nH, and say so.
      If segmentation is unavoidable for tractability, report only weighted means and
      refuse to report percentiles.
  - pitfall: >
      Market value is NOT the time-averaged price. It is the generation-weighted price,
      systematically below the demand-weighted price for wind and solar, and the whole
      point of the metric is that gap. Computing it as `price.mean()` restricted to
      hours of production, or as revenue/dispatch without snapshot weightings, produces
      a number that looks plausible and is wrong.
    evidence: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    note: >
      Use n.statistics.market_value (revenue/supply, both snapshot-weighted). Also
      relay the paper's substantive result, because users assume the opposite: the
      decline of VRE market value with penetration is driven by the implicit policy
      instrument, not by variability — under a CO2 cap rather than a VRE quota, market
      values stay at cost recovery above 80% penetration, and the gap from LCOE is
      exactly the policy constraint's dual.
  - pitfall: >
      In a sector-coupled model there is no such thing as "the price" — the same
      location carries AC, low-voltage, urban and rural heat, H2, gas, methanol and
      co2-stored buses, each with its own dual, and picking the wrong one silently
      answers a different question. The carbon price in particular is NOT on an energy
      bus: it is the co2-atmosphere bus dual, or the CO2Limit global-constraint dual.
    evidence: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    note: >
      Resolve the bus with the user before extracting anything, and record it in the
      bundle's extraction plan. Consumer-tariff questions are the distribution bus, not
      the transmission bus. A dual at a product DEMAND bus is that product's levelised
      cost including all inputs, which is usually what a "what will hydrogen cost"
      question means.
  - pitfall: >
      In a CAPACITY-EXPANSION model the dual is not a market price. It is driven by
      investment pressure and long-run equilibrium cost recovery, not by the merit
      order of an existing fleet, so it can be large in hours with no physical scarcity
      and its level cannot be compared across separately optimised runs.
    evidence: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    note: >
      If the user wants market prices, run dispatch-only against a fixed fleet — that
      is the configuration the corpus's hindcast study validates against observed
      day-ahead prices. If the model is an expansion model, present the duals as
      marginal system values and use a complementary physical metric (net load,
      unserved energy) whenever severity must be compared across runs.
  - pitfall: >
      Degeneracy makes duals non-unique. A network of zero-marginal-cost generators has
      many optimal bases, so simplex with crossover can return any of several valid dual
      vectors and the price series becomes solver-dependent and irreproducible.
    evidence: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    note: >
      Solve with a barrier/interior-point method and crossover OFF — the analytic
      centre is unique, which is what makes prices reproducible. Both models already
      ship this (gurobi-default sets method 2 / crossover 0), so the pitfall bites when
      a user overrides the solver profile or switches to a simplex-based open-source
      solver. Also note both models add ~1e-2 EUR/MWh of noise to every marginal cost
      by default (noisy_costs) precisely to break ties, which is why the near-zero-hour
      test in the summaries uses a 0.1 threshold and not equality with zero.
  - pitfall: >
      A binding CO2 cap's dual diverges as the cap approaches zero — the corpus reports
      ~180 EUR/t at a 5% cap and ~20000 EUR/t at exactly zero emissions. Quoting a
      net-zero run's carbon shadow price as "the required carbon price" is quoting an
      asymptote.
    evidence: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    note: >
      Report the dual as a function of the cap, not as a point value, and never quote it
      from a run whose cap is exactly zero. If the user needs a single carbon price,
      price the emissions instead of capping them and read the resulting emissions.
  - pitfall: >
      An empty or missing dual is easy to mistake for a zero price. The CO2 shadow
      price only exists if the cap constraint is present AND binding (pypsa-eur ships
      `electricity.co2limit_enable: false`, so a default electricity-only run has no
      CO2Limit row at all), and component-level mu_* series are all zeros unless the
      solve was asked for all duals.
    evidence: "2026_Fernandes_carbon-dioxide-removal-decarbonise.pdf"
    note: >
      Assert the constraint exists before reading its dual, and distinguish
      absent / present-but-slack / binding in the output rather than emitting 0. For
      component duals set `solving.options.assign_all_duals: true` at solve time — it
      cannot be recovered afterwards, so a missed flag means re-solving.
  - pitfall: >
      Duals do not exist for a mixed-integer problem. Turn on unit commitment, discrete
      transmission expansion or post-discretization and the price series is either
      absent or the dual of an LP relaxation that is not the reported solution.
    evidence: "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
    note: >
      The corpus's workaround is the one to reuse: fix the integer/learning decisions at
      their MILP values and re-solve as a pure LP purely to recover duals. Both models
      ship a linearised unit commitment by default, which keeps duals available — check
      it has not been switched to the integer form before promising prices.
