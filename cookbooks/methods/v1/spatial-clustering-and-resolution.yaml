pitfalls:
  - pitfall: >
      Total system cost is nearly resolution-invariant while the technology MIX, siting,
      curtailment and congestion are not. A study that validates its resolution choice on
      cost will conclude, wrongly, that resolution does not matter — and then report a
      mix that is an artefact of the busmap.
    evidence: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    note: >
      Never accept "cost barely moved" as evidence that the resolution is adequate.
      Ask what the user's ANSWER VARIABLE is: if it is a total cost or a CO2 price, 37-50
      nodes is usually defensible; if it is per-technology capacity, curtailment,
      congestion, siting, locational prices or infrastructure routing, sweep N and report
      the sensitivity of that variable. Fernandes 2026 is the compact demonstration:
      90 -> 39 nodes moved total cost 5% while sharply changing DAC deployment.
  - pitfall: >
      The resolution bias is NOT monotone. Coarsening does not simply "smooth congestion
      away" by a correctable amount — swept from 306 to 6 nodes, the sign of the
      curtailment bias changes across four qualitative stages, so no post-hoc correction
      factor exists and interpolating between two resolutions is unsafe.
    evidence: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    note: >
      Do not promise a user a "correction" for running coarse. If curtailment or
      congestion is the answer variable, the resolution must be validated against data at
      the resolution used, or the sweep must be dense enough to see the stage the model is
      in. The paper's a-priori excess-energy measure is the cheap pre-solve screen.
  - pitfall: >
      Resource resolution and network resolution are two different knobs with biases of
      SIMILAR MAGNITUDE AND OPPOSITE SIGN. Every default sweep moves them together, which
      partially cancels the two errors and makes the model look less resolution-sensitive
      than it is.
    evidence: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    note: >
      When resolution sensitivity matters, decouple: in pypsa-earth use the two-stage
      simpl/clusters wildcards (fix resource resolution at simpl, vary clusters); in
      pypsa-eur raise `renewable.<tech>.resource_classes` above its default of 1 so one
      bus carries several site qualities. Report which direction was varied — a sweep
      that does not say is uninterpretable.
  - pitfall: >
      Aggregating buses silently copperplates the grid INSIDE each cluster: intra-cluster
      lines are deleted, not derated, so every cluster becomes internally unconstrained.
      A "37-node model of Europe" contains 37 copperplates whose internal congestion cost
      is exactly zero.
    evidence: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    note: >
      This is the mechanism behind the whole cost/mix split, and it is why coarse models
      understate transmission and storage needs and overstate the value of remote
      resource. Frysztacki 2023's copperplate sensitivity (intra-cluster capacity set to
      infinity) isolates how much of the aggregation error is this rather than resource
      smoothing. For a congestion question, prefer more nodes over any cleverness in the
      similarity metric.
  - pitfall: >
      A cost-optimal plan built at 37-217 nodes is not guaranteed to be OPERABLE at real
      resolution. Disaggregating it back onto a 1250-node network and re-solving dispatch
      produces load shedding and curtailment that the coarse run never saw.
    evidence: "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
    note: >
      If the deliverable is a build plan rather than a comparative insight, the honest
      procedure includes an inverse step. It is L5 in both models — nothing disaggregates
      a result — but the three methods are specified in the paper, and the min-excess and
      per-cluster-reoptimisation variants are ~100 lines of post-processing on a solved
      network, not a reformulation.
  - pitfall: >
      Country-level aggregation fixes the within-country distribution of wind and solar
      by assumption, which understates the benefit of siting heterogeneity and biases
      transmission needs in a direction that depends on the case.
    evidence: "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
    note: >
      One-node-per-country is a legitimate choice for a question about international
      trade, market zones or aggregate pathways, and a wrong one for any question about
      WHERE to build. Where a coarse model is unavoidable, the corpus's workaround is to
      subdivide the resource inside the node (Seibold 2025: five renewable subregions per
      coarse country; Zeyen 2023: six representative regions on one network node), not to
      pretend the node is homogeneous.
  - pitfall: >
      Finer is not uniformly better: once the Voronoi cell shrinks below the weather
      data's own grid cell (~28 km for ERA5 at 0.25 degrees), the profile is resolving
      detail the input does not contain, and capacity factors are OVERESTIMATED in coastal
      and mountainous zones.
    evidence: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    note: >
      There is a ceiling as well as a floor, and no config key enforces it. For a single
      country the paper's recommendation is 35-50 nodes; for Europe, ~1024 nodes
      corresponds to roughly 4-5 substations per cluster and is where institutional
      practice sits. Beyond that the extra nodes cost solve time and buy spurious
      precision. Hofmann 2018's saturation of injection principal components at N~512 is
      the structural version of the same limit.
  - pitfall: >
      Cluster membership is not stable as N changes. With non-hierarchical methods
      (k-means, k-medoids) the partition at N=50 is not a refinement of the partition at
      N=40, so "the same node" means different geography at two resolutions and per-node
      results cannot be compared across a sweep.
    evidence: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    note: >
      Compare sweeps only on aggregate or spatially-mapped quantities, never node by node.
      If nested resolutions are needed, use HAC (bottom-up merging IS nested) or fix a
      custom busmap hierarchy. Both models also seed k-means with n_init=1000 and
      random_state=0 for exactly this reason — do not lower n_init to save time.
  - pitfall: >
      Standard aggregation flattens voltage levels and removes transformers, so an
      aggregated network's impedances describe a single-voltage abstraction of a
      multi-voltage grid. This biases transmission expansion planning specifically.
    evidence: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    note: >
      Both workflows map everything to 380 kV before clustering, unconditionally. For a
      transmission-expansion or grid-security study on a mixed-voltage subsystem this is a
      known unmodelled bias with no config remedy; the voltage-aware alternative is
      external (NPAP) and bypasses the workflow's own aggregation step. Route such users
      to distribution-and-voltage-aware-aggregation.
  - pitfall: >
      The busmap silently determines the candidate topology of EVERY other carrier, not
      just electricity: hydrogen, methane and CO2 pipeline candidates are generated
      between neighbouring clustered regions. Coarsening the electrical network therefore
      coarsens the pipeline design space, and a 4.3% total-cost underestimate at
      one-node-per-country versus 181 regions is the measured consequence.
    evidence: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    note: >
      For any carrier-network routing question, treat the node count as part of the
      answer's resolution, not as a compute setting. Hofmann 2025 states the mirroring
      explicitly. Do not run an H2 or CO2 network study at country resolution and report
      pipeline routes.
  - pitfall: >
      In pypsa-earth, setting `cluster_options.alternative_clustering: true` makes the
      `clusters` wildcard IRRELEVANT — the busmap comes from GADM shapes and the node
      count is whatever the GADM level yields. The run succeeds, the filename still says
      the requested cluster count, and the network has a different number of buses.
    evidence: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    note: >
      Verified by grep, not just by the paper: `clustering_for_n_clusters` branches to
      `busmap_for_gadm_clusters(...)` and never passes `n_clusters` at all. Always assert
      `len(n.buses)` after the run when GADM clustering is on, and set
      `build_shape_options.gadm_layer_id` deliberately rather than relying on the
      requested count. Compounding this, `get_GADM_layer` silently falls back to the
      DEEPEST AVAILABLE layer when the requested id exceeds it, so the same
      `gadm_layer_id: 2` can mean different administrative depths in different countries
      of one run.
  - pitfall: >
      Administrative boundaries are uncorrelated with congestion. Clustering to NUTS or
      GADM units produces a policy-legible geography whose node borders are in the wrong
      places for physics, and the coverage is uneven: non-NUTS countries need fallbacks,
      and some are left at raw substation resolution inside an otherwise administrative
      model.
    evidence: "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
    note: >
      Choose administrative zoning when the QUESTION is administrative (bidding-zone
      reform, national or state policy, 24/7 matching), and k-means or HAC when the
      question is physical. Xiong's own use is the third legitimate case: as an
      experimental control to hold bus count fixed while something else varies. Check the
      per-country boundary coverage before promising a level — eur caps BA/MD/UA/XK at
      level 1.
  - pitfall: >
      Coarse resolution understates cross-border and regional balancing needs, and the
      usual fix — an exogenous import or transfer cap standing in for the bottlenecks the
      model cannot see — turns a resolution problem into a hand-tuned assumption.
    evidence: "2025_Seibold_Germany-Industry-Transformation.pdf"
    note: >
      Seibold's 125 TWh/a and 30 GW German import caps are the honest form of this: state
      the cap, state that it substitutes for unresolved grid detail, and sign it off with
      the user. Geis 2026 measures the same effect from the other side — node-by-node
      flexibility requirements exceed the system-aggregated ones because network
      constraints amplify them.
