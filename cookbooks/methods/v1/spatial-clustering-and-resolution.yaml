id: spatial-clustering-and-resolution
title: "Spatial clustering / network reduction (k-means, HAC, administrative zoning)"
summary: >
  Replace a transmission network of thousands of substations with N representative
  buses by assigning every original bus to a cluster and aggregating the components,
  demand and resource time series inside each cluster into one equivalent node.
question: >
  How many nodes should I use, by which method — and what does that aggregation do to
  the answer I actually care about?
aliases:
  - "spatial clustering"
  - "network reduction"
  - "network aggregation"
  - "spatial aggregation"
  - "spatial resolution"
  - "k-means clustering"
  - "hierarchical agglomerative clustering"
  - "HAC"
  - "Ward's method"
  - "greedy modularity clustering"
  - "k-medoids"
  - "busmap"
  - "one node per country"
  - "copperplate"
  - "zonal aggregation"
  - "administrative clustering"
  - "GADM clustering"
  - "NUTS clustering"
  - "Voronoi cells"
  - "disaggregation"
  - "inverse clustering"
when_to_use:
  - "how many nodes should I use"
  - "what spatial resolution do I need for this question"
  - "is 37 nodes enough or do I need 100"
  - "one node per country versus a real grid"
  - "will a coarser model change my answer"
  - "my run is too slow, can I use fewer nodes"
  - "I need more detail in Germany but not in the rest of Europe"
  - "I want the model to use bidding zones / NUTS regions / states as nodes"
  - "how do I model congestion inside a country"
  - "does the model see the transmission bottleneck I care about"
  - "why is curtailment so low in my model"
  - "can I trust the siting of wind and solar at this resolution"
  - "how do I get nodal detail back out of a coarse run"
  - "I want no grid at all — just a single copperplate node"
family: spatial-resolution
prevalence:
  papers: 61
  tier1: 38
  tier2: 23
  sweep_hits: 76
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) attributed 62 papers to this
    method; this card drops one (2023_Dergunova, whose ~15 "industrial clusters" are a
    hand-drawn geography of named sites, with no busmap and no clustering algorithm —
    mention-only, and flagged as such in EVIDENCE_INDEX.md), leaving 61. The other
    flagged suspect, 2018_Hoersch_PyPSA-Eur, is KEPT but re-roled from `extends` to
    `canonical-use`: its own novel kernel k-means is a cross-model topology COMPARISON
    rather than a network reduction, but the paper defines the substation/Voronoi base
    topology that every clustering run in both models starts from, so it is far more
    than a mention. The regex screen returned 76, over-counting mainly on "cluster"
    used for non-spatial clustering (weather-regime k-means, time-series clustering)
    and on papers that merely cite a node count from someone else's study. At 61 of
    100 this is the third most prevalent method in the corpus, and it is the only one
    where essentially EVERY paper must make the choice whether or not it studies it:
    50 of the 61 are `routine-use`, which is precisely why the four `defines`/
    `critiques` papers carry so much weight in `pitfalls`.
procedure:
  - step: >
      Build the base topology at full resolution: substations become buses, each bus
      gets a catchment polygon (Voronoi cell, or an administrative polygon), and
      national load is distributed into those polygons by GDP and population. The
      corpus's starting sizes are 3567-6795 buses for Europe (5323 nodes / 6572 HVAC
      lines in Frysztacki 2022 before pre-aggregation).
    handle: "rule base_network -> build_bus_shapes"
    provenance: "scripts/base_network.py:build_bus_shapes"
  - step: >
      Pre-aggregate the topology before any clustering: map all voltage levels onto one
      (380 kV), drop converters, and recursively remove univalent "stub" buses — every
      paper that documents its procedure does this first, because dead-ends carry no
      routing information. Optionally aggregate all buses with no injection to the
      electrically nearest substation (Dijkstra on line lengths), which took Frysztacki
      2022 from 5323 to 2435 nodes.
    handle: "clustering.simplify_network.{remove_stubs,to_substations}"
    provenance: "scripts/simplify_network.py:simplify_network_to_380; scripts/simplify_network.py:remove_stubs; scripts/simplify_network.py:aggregate_to_substations"
  - step: >
      Decide the per-country cluster BUDGET before clustering anything. The house method
      splits the total N across (country, synchronous_zone) groups proportionally to
      mean load, solved as a small integer quadratic programme so the shares round
      consistently. This is why 37 is a floor for Europe (33 countries, four split
      across synchronous zones) and why clusters never straddle a national border.
    handle: "distribute_n_clusters_to_countries(n, n_clusters, load, focus_weights=)"
    provenance: "scripts/cluster_network.py:distribute_n_clusters_to_countries"
  - step: >
      Choose the similarity the clustering optimises, which is the actual methodological
      decision. Four families appear in the corpus: geographic k-means on bus
      coordinates weighted by load + conventional capacity (the default, and what
      "PyPSA clustering" means in ~40 of these papers); Ward hierarchical agglomerative
      clustering on renewable feature vectors (annual capacity factors, or the full
      hourly time series), constrained to merge only line-connected clusters; greedy
      modularity maximisation on electrical admittance; and k-medoids on haversine
      distance. Geographic k-means uses distance because distance sets grid expansion
      cost; HAC uses resource similarity because that is what aggregation destroys.
    handle: "clustering.cluster_network.algorithm: kmeans|hac (+ hac_features)"
    provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
  - step: >
      Run the algorithm per (country, sub_network) group and emit a busmap: a Series
      mapping every original bus to a cluster id. Everything downstream is a function
      of this one object, which is why an externally-computed busmap is a first-class
      input in both models. The k-means call is deliberately over-seeded — n_init=1000,
      max_iter=30000, tol=1e-6 — because a single seed gives an unstable partition.
    handle: "busmap_for_n_clusters(...) -> busmap; or clustering.mode: custom_busmap"
    provenance: "scripts/cluster_network.py:busmap_for_n_clusters; scripts/cluster_network.py:custom_busmap; scripts/cluster_network.py:clustering_for_n_clusters"
  - step: >
      Aggregate the network onto the busmap: sum demand and per-technology potentials,
      capacity-weighted-average the availability time series, collapse intra-cluster
      lines, and replace each inter-cluster bundle with one equivalent line (capacity
      summed, impedance the parallel equivalent, length the crow-flies distance times a
      routing factor of ~1.25). Per-attribute strategies are configurable because the
      right strategy differs by attribute (sum p_nom, max ramp limits, any committable).
    handle: "clustering_for_n_clusters(n, busmap, aggregation_strategies=)"
    provenance: "scripts/cluster_network.py:clustering_for_n_clusters"
  - step: >
      Re-aggregate the geography as well: cluster the onshore and offshore region
      polygons through the same busmap so land eligibility, potentials and profiles are
      consistent with the buses. Getting this wrong is the classic silent error — a
      network at N buses whose potentials are still keyed to the old regions.
    handle: "cluster_regions(busmaps, regions)"
    provenance: "scripts/cluster_network.py:cluster_regions"
  - step: >
      (the step the critiques demand) Sweep N and report the sensitivity, rather than
      asserting one resolution. The corpus's sweeps span 6-1250 nodes; the recurring
      finding is that TOTAL SYSTEM COST is nearly resolution-invariant while the
      TECHNOLOGY MIX, curtailment and siting are not, so a study that only reports cost
      will conclude, wrongly, that resolution does not matter.
    handle: null
    provenance: null
  - step: >
      (extension) Separate resource resolution from network resolution instead of
      moving them together. Two routes exist: keep the resource regions fine while
      coarsening the transmission network (earth's two-stage simpl/clusters scheme), or
      bin each bus's catchment into capacity-factor classes so one bus carries several
      site qualities (eur's resource_classes). Frysztacki 2021 shows the two resolution
      directions bias the answer with similar magnitude and OPPOSITE sign, so moving
      them together silently cancels part of the error.
    handle: "scenario.simpl + scenario.clusters (earth) / renewable.<tech>.resource_classes (eur)"
    provenance: "scripts/simplify_network.py:cluster; scripts/build_renewable_profiles.py:resource_classes"
  - step: >
      (extension) Invert the clustering: map a coarse capacity-expansion result back
      onto the high-resolution network and re-solve dispatch there, to test whether the
      coarse plan is even operable. Frysztacki 2023 compares three inverse methods —
      uniform spread subject to the land-use bound, per-cluster re-optimisation holding
      the technology totals, and a min-excess objective — then measures the load
      shedding and curtailment that appear at 1250 nodes.
    handle: null
    provenance: null
variants:
  - id: kmeans-geographic
    what: >
      k-means on bus coordinates, weighted by mean load and conventional capacity at
      each substation, run inside each country/synchronous-zone budget. The corpus
      default and the meaning of "clustered with PyPSA" in most of these papers. Cheap,
      stable under re-seeding, and it optimises the quantity that sets expansion cost
      (geographic distance) rather than the quantity aggregation destroys (resource
      heterogeneity).
    papers:
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2018_Hofmann_Principal-flow-patterns_EPL.pdf"
      - "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2025_Che_space-based-solar-power-european-decarbonization.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
  - id: hierarchical-agglomerative
    what: >
      Ward-linkage HAC that merges only line-CONNECTED clusters, with the similarity
      taken from renewable feature vectors — annual capacity factors, or the full hourly
      wind/solar time series. Buys resource-aware clusters (nodes group by what the
      weather does, not by where they are) and guarantees contiguity, which geographic
      k-means does not. Costs a feature-extraction pass over the weather cutout, and the
      merge order makes the partition sensitive to the feature choice.
    papers:
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
  - id: administrative-zoning
    what: >
      Use existing political or market geography as the busmap: countries, NUTS1/2/3,
      GADM levels, bidding zones, or a published TSO zone map. Node count is then a
      property of the boundary system, not a number you choose. The right variant
      whenever the QUESTION is administrative — bidding-zone reform, national policy,
      state-level targets — and the wrong one whenever the question is physical, because
      administrative borders are uncorrelated with congestion.
    papers:
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2025_Xiong_Modelling-High-Voltage-Grid-Open-Data_NatSciData.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
      - "2025_Rahdan_high-impact-consumers-behavioural-flexibility.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
  - id: heterogeneous-focus-weights
    what: >
      Non-uniform resolution: spend the cluster budget where the question lives and
      coarsen elsewhere. A named share of N is reserved per country (focus_weights), or
      the whole model is rebuilt per focus region. Cheapest way to answer a regional
      question inside a continental model — 30 German nodes with 1-3 per neighbour, or
      60 European nodes re-allocated seven different ways.
    papers:
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
  - id: simplification-and-stub-removal
    what: >
      The pre-clustering reduction on its own: single-voltage mapping, converter
      removal, recursive stub trimming, aggregation of non-injecting buses to the
      electrically closest substation. Halves the node count with almost no information
      loss (5323 -> 2435 in Frysztacki 2022) and is what makes the subsequent clustering
      well-posed; it is also the stage where "electrically closest" quietly replaces
      "geographically closest".
    papers:
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
  - id: decoupled-resource-and-network-resolution
    what: >
      Hold one resolution fixed while moving the other: fine resource regions on a
      coarse transmission network, or a fine network fed by coarse profiles. The only
      variant that can attribute a resolution bias to a CAUSE, because the two
      directions bias results with similar magnitude and opposite sign. Realised as
      earth's two-stage simpl/clusters iteration, eur's per-bus resource classes, or
      Frysztacki 2021's three-case design.
    papers:
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2025_Seibold_Germany-Industry-Transformation.pdf"
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
  - id: inverse-disaggregation
    what: >
      Push a coarse result back down to high resolution and re-solve dispatch there, to
      test whether the coarse plan is operable at all. Three methods: uniform spread
      under the land-use bound, per-cluster re-optimisation holding technology totals,
      and a min-excess objective. The result is a feasibility verdict on the coarse
      answer, reported as load shedding and curtailment at the fine resolution — the
      most direct existing answer to "can I trust my 37-node plan".
    papers:
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
  - id: copperplate-and-single-node
    what: >
      Delete the grid rather than reduce it: one node for the whole region, or infinite
      intra-zone capacity inside named groups of regions. A deliberate upper bound on
      what perfect transmission buys, and the cheap counterfactual for an
      interconnection question. Used as the MAIN resolution when the study is about
      something else entirely (technology learning, biomass chains) — which is defensible
      only if the answer does not depend on transport.
    papers:
      - "2023_Zeyen_Endogenous-learning-green-hydrogen_NatComms.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
  - id: alternative-similarity-metrics
    what: >
      Similarities the two workflows do not expose by config: greedy modularity
      maximisation on electrical admittance, k-medoids on haversine distance
      (non-hierarchical, so cluster membership churns as k moves), voltage-AWARE
      partitioning that keeps voltage levels and transformers intact, and kernel k-means
      combining geographic distance with reactance distance. Each exists because
      geographic k-means ignores electrical topology by design.
    papers:
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
      - "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
      - "2026_Barnes_near-term-emission-targets.pdf"
literature:
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: defines
    note: >
      The founding paper of this method in the PyPSA family, and the six-step procedure
      the card's `procedure` follows: aggregate univalent buses, weight each bus by local
      load and conventional generation, run k-means on GEOGRAPHIC coordinates with 10
      restarts under a per-country budget proportional to mean load, then build the
      equivalent buses, generators (availability weighted-averaged, potentials summed)
      and lines (length 1.25x crow-flies, capacity summed, impedance the parallel
      equivalent). Reduces 4653 substations to k in {37...362} and studies how the
      optimum moves. States plainly that topology and electrical distance are IGNORED on
      purpose, because geographic distance is what determines expansion cost. Its result
      is the number the whole corpus cites: VRES cost ~10% lower at 362 nodes than at
      one-node-per-country.
  - paper: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    tier: 1
    role: defines
    note: >
      The method-comparison paper, and the single most useful citation when a user asks
      "which algorithm". Implements and compares four: k-means on coordinates, Ward HAC
      on annual capacity factors, Ward HAC on hourly time series, and Clauset-Newman-Moore
      greedy modularity on electrical admittance — swept 37-397 nodes in steps of 30 plus
      67/97/127 in detail, benchmarked against a 1250-node reference solution that cost
      24 days and 240 GB. Also documents the pre-aggregation that makes clustering
      well-posed (univalent merge, then non-substation buses to the electrically closest
      substation by Dijkstra: 5323 -> 2435) and the copperplate-within-cluster
      aggregation semantics. Evaluated on renewable siting accuracy and power-flow
      estimation, not on total cost — which is the point.
  - paper: "2023_Frysztacki_Inverse-methods-disaggregation_Energy.pdf"
    tier: 1
    role: defines
    note: >
      Defines the INVERSE of this method, and is the only paper in the corpus that tests
      whether a coarse plan is operable rather than merely cheap. Uses HAC on renewable
      capacity-factor time-series similarity (bottom-up, merging only line-connected
      clusters) for expansion at 37-217 clusters, then disaggregates back to 1250 nodes
      by three methods — uniform under the land-use bound, per-cluster re-optimisation
      holding technology totals, and a min-excess objective minimising curtailed surplus
      — and reports the resulting load shedding and curtailment. Also runs a copperplate
      sensitivity with intra-cluster transmission set to infinity to separate the
      aggregation's implicit grid from its resource smoothing. This is the source of the
      `inverse-disaggregation` variant, which pass 1 had no slug for.
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: extends
    note: >
      Separates the two things everyone else moves together. Three-case design: (1)
      resource and network resolution varied in tandem; (2) network fixed at 37 nodes,
      resource resolution varied 37-1024; (3) resource fixed at 1024 sites, network
      varied 37-1024. Finding to relay verbatim: the two effects are of SIMILAR MAGNITUDE
      AND OPPOSITE SIGN, so a tandem sweep partially cancels its own error and understates
      how much resolution matters. Documents the load-and-conventional-capacity-weighted
      k-means with country/synchronous-zone boundaries never crossed (hence the 37 floor)
      and the exact solver settings both models still use (n_init=1000, maxiter=30000,
      tol=1e-6). Cluster budget partitioned across the 37 zones proportionally to load.
  - paper: "2020_Frysztacki_Curtailment-Germany-Spatial-Resolution_EEM.pdf"
    tier: 1
    role: extends
    note: >
      The validation study, and the sharpest single argument against picking a node
      count by feel. Sweeps Germany from 306 down to 6 nodes against measured 2013-2018
      curtailment and finds four qualitative stages in which the curtailment bias
      CHANGES SIGN — so there is no monotone "coarser means less congestion" rule to
      correct for. Chooses 246 nodes as the operating point for validation. Also
      contributes an a-priori excess-energy measure that quantifies node-assignment
      error WITHOUT solving the LP, which is the cheapest available screen for whether a
      chosen resolution is adequate.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: extends
    note: >
      Defines earth's spatial machinery and the eur/earth asymmetry this card turns on.
      Four methods offered — renewable-potential-aware hierarchical clustering,
      line-impedance density clustering, weighted k-means on node locations, and GADM
      administrative-zone aggregation — plus the novel TWO-ITERATION scheme: the first
      iteration fixes resource resolution by aggregating generators, storage, lines and
      demand together; an optional second iteration re-clusters ONLY the transmission
      network, holding resource resolution fixed. That is Frysztacki 2021's decomposition
      made into a config surface, and it is exactly what earth's surviving
      simpl/clusters wildcard pair does. Demonstrated on Nigeria at 4-54 nodes and
      Africa at 420.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: extends
    note: >
      The single-country resolution sweep, and the only paper in the corpus that gives a
      defensible LOWER BOUND on cell size. Sweeps Spain's ~700-bus HV network to
      {2,8,15,24,35,50,65,80,100} k-means clusters and finds wind capacities stabilise
      above ~35 nodes, recommending 35-50 for a single country. Crucially argues the
      Voronoi cell must not shrink below the ERA5 0.25-degree grid cell (~28 km
      characteristic length), because below that the profile is resolving weather data
      that does not exist and capacity factors are overestimated in coastal and
      mountainous zones. That is a hard ceiling on useful resolution that no
      config key enforces.
  - paper: "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
    tier: 1
    role: critiques
    note: >
      A 30-node one-per-country study that names its own aggregation as the binding
      limitation: "the distribution of wind and solar capacities within each country was
      fixed. Further heterogeneity of renewables could be exploited by fine-tuning the
      distribution within each country, or by using a finer-scale model." The critique is
      specifically that country-level aggregation understates the benefit of siting
      heterogeneity and can bias transmission needs in EITHER direction — cited here
      because it is the honest version of what ~13 `administrative-zoning` papers in this
      corpus do without saying so.
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: critiques
    note: >
      The counterweight, and the reason this card must not simply tell users to add
      nodes. Using a purpose-built misallocation pseudometric (cross-constraining
      solutions from two parameter scenarios) on PyPSA-Eur at 45/64/90/128 nodes and
      1-24 h, finds "the expansion problem is much less sensitive to changes in the
      spatial resolution as it is to changes in the temporal resolution" — below 4
      EUR/MWh from 45 to 128 nodes at any temporal resolution. Gives the physical reason:
      mean inter-node distance runs 350 km at 45 nodes to 60 km at 1000, both well below
      Europe's ~670 km wind correlation length, so aggregation loses little
      meteorologically relevant information. Explicitly scoped to hourly-or-coarser data;
      sub-hourly could change it. Read together with Frysztacki: cost is insensitive,
      the mix and the congestion are not.
  - paper: "2018_Hoersch_PyPSA-Eur_EnergyStratRev.pdf"
    tier: 1
    role: canonical-use
    note: >
      Defines the base topology every clustering run in this book starts from — 3657
      substations / 6001 lines, Voronoi catchments, national load distributed by NUTS3
      GDP and population — and recommends clustering to 362-1500 buses as the REMEDY for
      local load-assignment error, i.e. clustering as an accuracy measure rather than
      only a cost measure. Its own novel contribution, a kernel k-means combining an RBF
      over Euclidean distance with the pseudo-inverse of the admittance matrix
      (K = exp(-||a-b||^2/N) + nu B^dagger, k=80, 20 restarts, nu=200), is a cross-MODEL
      topology comparison rather than a network reduction; re-roled from pass 1's
      `extends` on exactly that ground.
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: canonical-use
    note: >
      The library paper, and the reason `pypsa_primitive` is non-null: clustering is
      documented as a first-class PyPSA feature ("a variety of network clustering
      algorithms to reduce the number of buses while preserving important transmission
      lines"), demonstrated by reducing the GridKit European network from ~5000 to 256
      buses for investment optimisation. Method detail is deferred to Hoersch & Brown
      2017 — cite this for "the primitive is library code", not for the procedure.
  - paper: "2018_Hofmann_Principal-flow-patterns_EPL.pdf"
    tier: 1
    role: canonical-use
    note: >
      The cleanest published demonstration that resolution effects SATURATE, and the
      best answer available to "when do more nodes stop buying anything". Sweeps 4653
      nodes down through eleven resolutions {1024, 724, 502, 362, 256, 181, 128, 90, 64,
      45, 37} and finds the number of injection principal components grows like log(N)
      up to N~512 (mean inter-node distance ~138 km) and then saturates, while the flow
      PCs stay at ~8 across every resolution. A structural argument for a ceiling, not
      just an empirical one.
  - paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    tier: 2
    role: routine-use
    note: >
      Bypasses the workflow's aggregation step entirely (builds generator/load data with
      the PyPSA-Eur pipeline, then partitions with NPAP's
      geographical_kmedoids_haversine) to compare voltage-UNAWARE against voltage-AWARE
      partitioning at k in {250,500,1000,3000} against the full 6795-bus grid. Two facts
      worth relaying: standard aggregation flattens voltage levels and transformers,
      which biases expansion planning; and k-medoids is non-hierarchical, so cluster
      membership churns substantially as k moves — a stability property geographic
      k-means shares and HAC does not.
  - paper: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    tier: 1
    role: routine-use
    note: >
      A rare in-corpus use of HAC at scale for a physical question: 600 nodes / 1042
      corridors, clustered by merging neighbouring regions with similar wind and solar
      capacity factors specifically to preserve renewable variability AND topology.
      Notes the aggregation artefact that matters for its own question — multiple
      circuits between the same aggregated pair become electrically identical and
      therefore trip simultaneously in a cascade.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
