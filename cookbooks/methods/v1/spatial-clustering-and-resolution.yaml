pypsa_primitive:
  symbol: "pypsa/clustering/spatial.py:get_clustering_from_busmap"
  pypsa_version: "0.30.3"
  exposed_by: "both — pypsa-eur and pypsa-earth each call it from scripts/cluster_network.py"
  reachable_via: >
    Directly, and it is the rare case in this book where the primitive is fully exposed
    rather than stranded. The busmap constructors are library code too:
    `busmap_by_kmeans`, `busmap_by_hac(feature=, affinity='euclidean', linkage='ward')`,
    `busmap_by_greedy_modularity` and `busmap_by_stubs(matching_attrs=)`. A driver can
    build any busmap it likes as a pandas Series over `n.buses.index` and call
    `get_clustering_from_busmap(n, busmap, bus_strategies=, line_strategies=,
    generator_strategies=, one_port_strategies=, custom_line_groupers=)` to get a
    `Clustering(n, busmap, linemap)` back — which is exactly what an alternative
    similarity metric or an externally-computed zoning needs.
  note: >
    Two consequences for the ladder. First, ANY new similarity metric is an L2/L5 busmap
    function plus one existing call, never a re-implementation of the aggregation — the
    hard part (component aggregation, time-series weighting, equivalent lines, per-attribute
    strategies) is library code and identical in both models. Second, both workflows also
    accept a busmap as a FILE, so a metric prototyped outside the workflow can be fed back
    in at L1 with no code change at all. `busmap_by_stubs` and `busmap_by_greedy_modularity`
    are present in the library but not reachable from either model's config surface —
    modularity is coded in both cluster_network.py scripts yet blocked in pypsa-eur by its
    pydantic config schema (see the eur `levers` note). Soft anchor: pypsa is a conda
    dependency, so this is pinned to a version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: spatial-clustering
        role: >
          the method itself — `scenario.clusters` plus
          `clustering.cluster_network.algorithm`; registry status `working`
      - id: network-simplification
        role: >
          the pre-aggregation stage (380 kV mapping, converter removal, stub trimming,
          optional aggregation to substations) that every documented procedure in the
          literature performs first
      - id: administrative-clustering
        role: "the administrative-zoning variant: NUTS0/1/2/3 or bidding zones, per-country overridable"
      - id: bidding-zone-shapes
        role: >
          builds the DK1/DK2, Nordic and Italian zone geometries that administrative
          level `bz` consumes — eur-only, no earth counterpart
      - id: custom-busmap
        role: >
          the escape hatch: an arbitrary bus->zone CSV or a polygon GeoJSON, which is how
          every alternative similarity metric and every published TSO zone map enters
      - id: focus-weights
        role: "the heterogeneous-resolution variant — reserves a share of N for named countries"
      - id: copperplate-regions
        role: "the copperplate variant, applied to named region groups after clustering"
      - id: renewable-potentials-land-eligibility
        role: >
          carries `renewable.<tech>.resource_classes`, eur's answer to decoupling resource
          resolution from network resolution (bins each bus's catchment by capacity factor)
      - id: temporal-resolution-nh
        role: "the other half of the tractability trade — coarsen time before coarsening space"
    available:
      verdict: turnkey
      how: >
        `scenario.clusters` is a wildcard list; `clustering.mode` selects busmap /
        administrative / custom_busmap / custom_busshapes;
        `clustering.cluster_network.algorithm` selects kmeans or hac (hac pulls weather
        features from a dedicated rule); `clustering.focus_weights`,
        `clustering.copperplate_regions`, `clustering.simplify_network.*` and
        `clustering.aggregation_strategies` parameterise it. A resolution SWEEP is
        literally `clusters: [37, 64, 128]` — snakemake fans it out. Two special wildcard
        values exist: `all` short-circuits clustering entirely (busmap = identity), and
        `adm` hands the busmap to administrative mode.
      missing: >
        Procedure step 8 (sweep AND REPORT the sensitivity) has no handle: the sweep is
        free, the comparison is not — nothing cross-tabulates a metric against N.
        Procedure step 10 (inverse disaggregation) has no handle at all. Step 9 is only
        half-available: `resource_classes` bins site quality within a bus, but eur
        computes renewable profiles on the ALREADY-CLUSTERED regions
        (`regions_onshore_base_s_{clusters}`), so there is no way to hold resource
        resolution fixed while varying network resolution — the `simpl` wildcard that
        older releases used for exactly this is GONE at this ref. Not available by config:
        greedy modularity (coded but schema-blocked), k-medoids, voltage-aware
        partitioning, and clustering across national borders.
      provenance: "scripts/cluster_network.py:busmap_for_n_clusters; scripts/cluster_network.py:clustering_for_n_clusters"
    levers:
      - key: "scenario.clusters"
        effect: >
          The node count(s). A list, so `[37, 64, 128]` IS the resolution sweep. Accepts
          integers, `all` (no clustering) and `adm` (administrative mode); the wildcard
          constraint is `[0-9]+(m|c)?|all|adm`. Hard floor: N must be >= the number of
          (country, sub_network) groups — 37 for the default European country set — and
          <= the base bus count, asserted before any clustering runs.
        default: "[50]"
        provenance: "Snakefile:clusters; scripts/cluster_network.py:distribute_n_clusters_to_countries"
      - key: "clustering.mode"
        effect: >
          busmap (algorithmic, the default) | administrative (NUTS/bidding zones) |
          custom_busmap (a CSV at data/busmaps/) | custom_busshapes (polygons at
          data/busshapes/). Selects the whole branch taken in cluster_network's main, and
          also switches `simplify_network` from `remove_stubs` to
          `remove_stubs_within_admin` so stubs are not trimmed across administrative
          borders.
        default: "'busmap'"
        provenance: "scripts/lib/validation/config/clustering.py:mode; scripts/simplify_network.py:remove_stubs_within_admin"
      - key: "clustering.cluster_network.algorithm"
        effect: >
          kmeans | hac. NOTE the asymmetry with earth: cluster_network.py ALSO implements a
          `modularity` branch calling `busmap_by_greedy_modularity`, but the pydantic
          config schema restricts this key to Literal["kmeans","hac"], so the modularity
          path is unreachable by config in eur while it is reachable in earth (which has no
          config validation). Treat modularity as L2 here, not L0.
        default: "'kmeans'"
        provenance: "scripts/lib/validation/config/clustering.py:algorithm; scripts/cluster_network.py:busmap_by_greedy_modularity"
      - key: "clustering.cluster_network.hac_features"
        effect: >
          Which cutout variables form the HAC feature vector. Only consumed when algorithm
          is hac; triggers `rule build_hac_features`, which aggregates the rastered cutout
          onto the pre-cluster Voronoi cells. Defaults to 100 m wind and direct influx,
          i.e. wind + solar resource similarity — the same feature family Frysztacki 2022
          and 2023 cluster on.
        default: "['wnd100m', 'influx_direct']"
        provenance: "config/config.default.yaml:hac_features; scripts/build_hac_features.py:features"
      - key: "clustering.focus_weights"
        effect: >
          Dict of country -> share of the total cluster budget, e.g. {DE: 0.6}. The
          remainder is renormalised across the other countries. The heterogeneous-resolution
          lever, and the cheapest way to answer a regional question inside a continental
          model. Asserted to sum to <= 1.0. Only applies when mode is busmap.
        default: "False"
        provenance: "config/config.default.yaml:focus_weights; scripts/cluster_network.py:distribute_n_clusters_to_countries"
      - key: "clustering.administrative.level"
        effect: >
          0 (country) | 1 (NUTS1) | 2 (NUTS2) | 3 (NUTS3) | 'bz' (bidding zones). Sets the
          node count implicitly. BA, MD, UA and XK can only reach level 1, which the script
          logs rather than errors on — so a level-2 or level-3 request produces a run with
          mixed administrative depth.
        default: "1"
        provenance: "scripts/lib/validation/config/clustering.py:level; scripts/cluster_network.py:busmap_for_admin_regions"
      - key: "clustering.administrative.countries"
        effect: >
          Per-country level override, e.g. {DE: 1, FR: 2}. Overwrites the global level for
          named countries — the administrative equivalent of focus_weights, i.e.
          policy-aligned zones at heterogeneous depth.
        default: "{}"
        provenance: "scripts/lib/validation/config/clustering.py:countries; scripts/cluster_network.py:busmap_for_admin_regions"
      - key: "clustering.build_bidding_zones.aggregate_to_tyndp"
        effect: >
          Reshapes the bidding-zone geometry to the TYNDP topology (aggregates the southern
          Norwegian zones, extracts Crete from Greece). Only reached at administrative level
          'bz'. No earth counterpart exists.
        default: "False"
        provenance: "config/config.default.yaml:aggregate_to_tyndp; rules/build_electricity.smk:build_bidding_zones"
      - key: "clustering.build_bidding_zones.remove_islands"
        effect: >
          Drops the Balearics, Bornholm, Canaries, Orkney, Shetland, Azores and Madeira from
          the bidding-zone shapes — the small-island nodes that otherwise become their own
          clusters and can dominate a low-N budget.
        default: "False"
        provenance: "config/config.default.yaml:remove_islands; rules/build_electricity.smk:build_bidding_zones"
      - key: "clustering.copperplate_regions"
        effect: >
          List of groups of region names; each group's buses are joined by infinite-capacity
          links AFTER clustering, deleting intra-group branches. The cheap interconnection
          counterfactual. Note the ordering: this runs on the already-clustered network, so
          it removes constraints between clusters, it does not merge buses before clustering.
        default: "[]"
        provenance: "config/config.default.yaml:copperplate_regions; scripts/cluster_network.py:copperplate_buses"
      - key: "clustering.simplify_network.remove_stubs"
        effect: >
          Recursively aggregates radial dead-ends before clustering. On by default, and the
          one pre-aggregation step every documented procedure in the literature performs.
        default: "True"
        provenance: "config/config.default.yaml:remove_stubs; scripts/simplify_network.py:remove_stubs"
      - key: "clustering.simplify_network.to_substations"
        effect: >
          Aggregates all buses with no injection to the electrically closest substation —
          Frysztacki 2022's 5323 -> 2435 pre-reduction. Off by default, which means the
          default pipeline hands more buses to k-means than the literature's procedure does.
        default: "False"
        provenance: "config/config.default.yaml:to_substations; scripts/simplify_network.py:aggregate_to_substations"
      - key: "clustering.simplify_network.remove_stubs_across_borders"
        effect: >
          Whether stub trimming may cross a national border. Off by default, consistent with
          the corpus convention that clusters never straddle borders.
        default: "False"
        provenance: "config/config.default.yaml:remove_stubs_across_borders; scripts/simplify_network.py:remove_stubs"
      - key: "clustering.aggregation_strategies"
        effect: >
          Per-attribute aggregation rules for generators and buses. The defaults that matter
          are `committable: any` and `ramp_limit_up/down: max` — i.e. a cluster is committable
          if ANY member was, and inherits the LOOSEST ramp limit, which systematically
          relaxes unit-commitment behaviour as N falls.
        default: "{'generators': {'committable': 'any', 'ramp_limit_up': 'max', 'ramp_limit_down': 'max'}, 'buses': {}}"
        provenance: "config/config.default.yaml:aggregation_strategies; scripts/cluster_network.py:clustering_for_n_clusters"
      - key: "clustering.exclude_carriers"
        effect: >
          Carriers left un-aggregated during clustering — keeps named technologies at
          per-unit granularity while everything else collapses.
        default: "[]"
        provenance: "config/config.default.yaml:exclude_carriers; scripts/add_electricity.py:exclude_carriers"
      - key: "renewable.onwind.resource_classes"
        effect: >
          Number of capacity-factor bins per bus catchment. THE resource-resolution lever
          in eur, and the only in-config way to decouple resource from network resolution
          at this ref: with nbins > 1 each bus grows several generators of the same carrier
          at different site qualities, so 50 buses can carry 150 resource classes. Default
          1 means resource resolution EQUALS network resolution — exactly the conflation
          Frysztacki 2021 warns against. Present per technology (onwind, offwind-ac,
          offwind-dc, offwind-float, solar, solar-hsat).
        default: "1"
        provenance: "config/config.default.yaml:resource_classes; scripts/build_renewable_profiles.py:resource_classes"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Snapshot averaging. Listed here because spatial and temporal resolution are
          spent from one compute budget, and Schyska 2020's finding is that the temporal
          axis buys more accuracy per unit of compute than the spatial one.
        default: "False (hourly)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours"
    assembly:
      - step: >
          Pick the variant from the QUESTION, not from the compute budget: administrative
          zoning if the question is defined on market or policy geography, k-means for a
          physical question about cost or capacity, HAC when resource heterogeneity is the
          subject, custom_busmap when a published zone map must be honoured.
        uses: [spatial-clustering, administrative-clustering, custom-busmap]
        config: "clustering.mode; clustering.cluster_network.algorithm"
        code: null
        provenance: "scripts/cluster_network.py:busmap_for_admin_regions; scripts/cluster_network.py:busmap_from_shapes"
      - step: >
          Set the pre-aggregation. Turn `to_substations` ON to reproduce the literature's
          documented procedure (it is off by default); leave `remove_stubs` on and
          `remove_stubs_across_borders` off.
        uses: [network-simplification]
        config: "clustering.simplify_network.{to_substations,remove_stubs,remove_stubs_across_borders}"
        code: null
        provenance: "scripts/simplify_network.py:aggregate_to_substations"
      - step: >
          Set the budget: a total N in `scenario.clusters`, optionally skewed by
          `focus_weights` toward the countries the question lives in. Remember the floor of
          one cluster per (country, sub_network) and that the split is load-proportional.
        uses: [spatial-clustering, focus-weights]
        config: "scenario.clusters; clustering.focus_weights"
        code: null
        provenance: "scripts/cluster_network.py:distribute_n_clusters_to_countries"
      - step: >
          Decouple resource from network resolution by raising
          `renewable.<tech>.resource_classes` above 1. This is the eur-specific move and it
          is the only config-level answer to the resource/network conflation, because
          profiles are built on the already-clustered regions here.
        uses: [renewable-potentials-land-eligibility]
        config: "renewable.<tech>.resource_classes"
        code: null
        provenance: "scripts/build_renewable_profiles.py:resource_classes"
      - step: >
          Make the sweep a sweep: `clusters: [37, 64, 128, 256]` fans out through snakemake
          for free. The comparison across those runs is what has no handle — make_summary
          aggregates within a run, so the cross-N table is the piece to write.
        uses: [spatial-clustering, summary-outputs]
        config: "scenario.clusters"
        code: "scripts/make_summary.py (cross-resolution comparison is not implemented)"
        provenance: "scripts/make_summary.py:calculate_capacities"
      - step: >
          For an alternative similarity metric (modularity, k-medoids, voltage-aware,
          kernel k-means), do NOT patch cluster_network.py: compute the busmap externally,
          write it to data/busmaps/base_s_{clusters}_{base_network}.csv and set
          `clustering.mode: custom_busmap`. The aggregation half is then unchanged library
          code and the referee can still check the bus count.
        uses: [custom-busmap]
        config: "clustering.mode: custom_busmap"
        code: "a standalone busmap script; pypsa/clustering/spatial.py provides the constructors"
        provenance: "scripts/cluster_network.py:custom_busmap"
      - step: >
          For an inverse-disaggregation study, add a post-solve script that reads the solved
          coarse network plus the saved `busmap_base_s_{clusters}.csv`, spreads capacities
          onto the fine regions by one of the three published rules, and re-solves dispatch
          with `solving.options` fixed-capacity. The busmap is persisted as an output for
          exactly this kind of use.
        uses: [spatial-clustering, operations-only-solve]
        config: null
        code: "new script; no rule owns disaggregation"
        provenance: "rules/build_electricity.smk:cluster_network"
    boundary:
      - variant: kmeans-geographic
        rung: L0
        note: >
          The default path. Set `scenario.clusters` and run; a sweep is a list. Nothing to
          write.
      - variant: hierarchical-agglomerative
        rung: L1
        note: >
          `clustering.cluster_network.algorithm: hac` — a non-default value, and it pulls in
          `rule build_hac_features` (a cutout aggregation pass) plus an extra
          aggregate_to_substations call in simplify_network for buses without Voronoi
          shapes. Feature choice via `hac_features`. Still pure config.
      - variant: administrative-zoning
        rung: L1
        note: >
          Needs a specific COMBINATION: `clustering.mode: administrative` AND
          `scenario.clusters: [adm]` AND `clustering.administrative.level`. Level 'bz' also
          triggers `rule build_bidding_zones`. Setting mode without the `adm` wildcard is
          the silent-failure combination the config docstring warns about.
      - variant: heterogeneous-focus-weights
        rung: L1
        note: >
          `clustering.focus_weights: {DE: 0.6}`, non-default and must sum to <= 1.0.
          Administrative equivalent is `clustering.administrative.countries`. Both L1.
      - variant: simplification-and-stub-removal
        rung: L0
        note: >
          `remove_stubs` is ON by default, so the core of this variant is L0.
          `to_substations` is L1 (off by default) and is what the literature's procedure
          actually does.
      - variant: copperplate-and-single-node
        rung: L1
        note: >
          Two routes, both config. `clustering.copperplate_regions: [[...]]` for named
          groups; or a low `clusters` value for a coarse model. A true single European node
          is not reachable by `clusters` (the floor is one per country/sub_network), so
          whole-region copperplating goes through copperplate_regions or a custom busmap.
      - variant: decoupled-resource-and-network-resolution
        rung: L1
        note: >
          Half-available, and the honest rung is L1-for-half. `renewable.<tech>.resource_classes
          > 1` gives resource resolution finer than network resolution inside each bus — a
          config flip. But the CONVERSE (fine network, coarse resource) and true
          two-stage control are NOT reachable: profiles are built on
          `regions_onshore_base_s_{clusters}`, and the `simpl` wildcard older releases used
          for this is gone at this ref. Frysztacki 2021's three-case design therefore needs
          rule surgery (L4) in eur, while earth still has the wildcards for it.
      - variant: alternative-similarity-metrics
        rung: L2
        note: >
          Two sub-cases. Greedy modularity is already coded in
          `cluster_network.py:busmap_for_country` but blocked by the pydantic schema's
          Literal["kmeans","hac"] — a one-line schema edit, hence L2 not L0. Genuinely new
          metrics (k-medoids, voltage-aware, kernel k-means) are L2 as a standalone busmap
          script fed back in via `clustering.mode: custom_busmap` — the aggregation half
          stays library code. Only patching cluster_network.py in place would be L5, and it
          is the wrong route.
      - variant: inverse-disaggregation
        rung: L5
        note: >
          Nothing in the repo maps a result back down. The ingredients exist — the busmap is
          persisted as `busmap_base_s_{clusters}.csv`, the fine regions and the land-use
          upper bounds are on disk, and a fixed-capacity re-solve is standard — so this is a
          post-processing harness plus (for two of the three methods) a small per-cluster LP,
          not a reformulation. Frysztacki 2023 specifies all three rules.
    where:
      - change: "unblock the greedy-modularity algorithm"
        anchor: "scripts/lib/validation/config/clustering.py -> _ClusterNetworkConfig.algorithm Literal"
        provenance: "scripts/lib/validation/config/clustering.py:algorithm"
      - change: "inject an externally computed busmap (any new similarity metric)"
        anchor: "clustering.mode: custom_busmap -> data/busmaps/base_s_{clusters}_{base_network}.csv"
        provenance: "scripts/cluster_network.py:custom_busmap"
      - change: "inject an externally computed zoning as polygons"
        anchor: "clustering.mode: custom_busshapes -> data/busshapes/*.geojson"
        provenance: "scripts/cluster_network.py:busmap_from_shapes"
      - change: "hold resource resolution independent of network resolution (full two-stage control)"
        anchor: "rule build_renewable_profiles input resource_regions (currently regions_onshore_base_s_{clusters})"
        provenance: "rules/build_electricity.smk:build_renewable_profiles"
      - change: "cross-resolution comparison of a metric"
        anchor: "scripts/make_summary.py (rule make_summary) — aggregates within a run, not across clusters"
        provenance: "scripts/make_summary.py:calculate_capacities"
      - change: "inverse disaggregation of a solved coarse result"
        anchor: "new script consuming resources/busmap_base_s_{clusters}.csv + regions_onshore_base_s.geojson"
        provenance: "rules/build_electricity.smk:cluster_network"
    data_dependencies:
      - input: "weather cutout variables named in clustering.cluster_network.hac_features"
        required_for: hierarchical-agglomerative
        availability: >
          exists by default — the default European cutout carries wnd100m and
          influx_direct; rule build_hac_features aggregates them onto the pre-cluster
          Voronoi cells. A non-default feature name must exist in the cutout or the rule
          fails.
      - input: "NUTS3 / admin shapes (nuts3_shapes.geojson -> admin_shapes.geojson)"
        required_for: administrative-zoning
        availability: >
          exists by default for NUTS countries; BA, MD, UA and XK come from OSM boundary
          extracts and are capped at level 1, which the script LOGS rather than errors on —
          so a level-2/3 request silently yields mixed administrative depth.
      - input: "bidding-zone geometries (bidding_zones.geojson)"
        required_for: administrative-zoning
        availability: >
          must be built — rule build_bidding_zones from ENTSO-E-py and ElectricityMaps
          shapes; only wired as an input when clustering.mode == administrative.
      - input: "a busmap CSV or busshapes GeoJSON"
        required_for: alternative-similarity-metrics
        availability: >
          absent — user-supplied. Index must match the buses of networks/base_s.nc; the
          expected path is data/busmaps/base_s_{clusters}_{base_network}.csv where
          {base_network} follows electricity.base_network (osm-prebuilt by default).
      - input: "a high-resolution reference solution to disaggregate against"
        required_for: inverse-disaggregation
        availability: >
          must be built — and this is the expensive part: the corpus's references are 1250
          nodes (24 days / 240 GB in Frysztacki 2022) and 1024 nodes.
    cost_profile:
      solves: >
        One solve per value in `scenario.clusters`, so a sweep costs the sum over N — but
        the clustering itself is also non-trivial: the per-country budget is a small integer
        QP solved with scip on every run, and HAC additionally costs a full cutout
        aggregation pass (rule build_hac_features).
      relative: >
        Superlinear in N and the dominant cost axis in this book. Concrete corpus
        anchors: 181 nodes hourly electricity-only took ~13 h on 8 cores / 180 GB
        (Parzen 2021); the 1250-node reference took 24 days / 240 GB (Frysztacki 2022);
        250 nodes was the ceiling for running six power-flow formulations
        (Neumann 2022). Sector-coupled models sit an order of magnitude lower in N for the
        same budget — 37-100 nodes is the sector-coupled norm against 250-1024 for
        electricity-only.
      note: >
        The corpus's mitigations, in the order they cost least: (1) spend the budget
        unevenly with focus_weights rather than raising N globally; (2) coarsen TIME
        instead — Schyska 2020 finds the temporal axis dominates the spatial one for
        expansion sensitivity, so segmentation to 750-1500 steps buys more accuracy per
        core-hour than doubling nodes; (3) raise `resource_classes` instead of N when the
        question is about siting rather than congestion, since extra classes add
        generators, not buses or lines; (4) two-fidelity design — coarse N for the sweep,
        one fine run for validation (Neumann 2023: 37 nodes 4 h for 500 draws, 128 nodes
        2 h for validation).
    verifies:
      - variant: kmeans-geographic
        check: "len(n.buses.query('carrier == \"AC\"')) == int(clusters)"
        over: run
        note: >
          The requested node count actually materialised. Fails loudly if the per-country
          budget assertion was bypassed, and is the check that catches an
          administrative-mode misconfiguration where the filename says one thing and the
          network is another.
      - variant: administrative-zoning
        check: "n.buses.index.str.contains('|'.join(expected_admin_codes)).all()"
        over: run
        note: >
          Bus names carry the administrative region id in administrative mode. If they look
          like k-means cluster ids instead, `clustering.mode` was set but
          `scenario.clusters: [adm]` was not — the run succeeds with the wrong busmap.
      - variant: heterogeneous-focus-weights
        check: "busmap.str.startswith(focus_country).sum() / len(busmap) > uniform_share"
        over: run
        note: >
          The focus country actually received its extra share. A silent failure here (weights
          not summing as intended, or mode not busmap) leaves a uniformly clustered network
          that answers a different question.
      - variant: decoupled-resource-and-network-resolution
        check: "n.generators.query('carrier == \"onwind\"').groupby('bus').size().max() == resource_classes"
        over: run
        note: >
          resource_classes > 1 must produce several onwind generators per bus. If every bus
          has exactly one, the setting never reached build_renewable_profiles and the run is
          silently at conflated resolution.
      - variant: copperplate-and-single-node
        check: "(n.links.query('carrier == \"copper\"').p_nom == float('inf')).all()"
        over: run
        note: >
          Copperplate links exist and are unconstrained. Absent links mean
          `copperplate_regions` named regions that do not match bus names after clustering —
          the group is skipped without error.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: spatial-clustering
        role: >
          the method itself — and uniquely, TWO wildcards: `scenario.simpl` and
          `scenario.clusters`, the two-stage scheme eur has dropped; registry status `working`
      - id: gadm-admin-clustering
        role: >
          the administrative variant, and the genuine capability difference: GADM shapes
          replace Voronoi cells at build_bus_regions, so potentials themselves are computed
          on administrative units
      - id: custom-busmap
        role: "the escape hatch for any alternative similarity metric or externally-defined zoning"
      - id: renewable-potentials-land-eligibility
        role: >
          the resource side — but note earth's surface has NO `resource_classes`; earth's
          answer to resource resolution is the simpl wildcard instead
      - id: temporal-resolution-nh
        role: "the other tractability axis, spent from the same budget"
      - id: augmented-line-connection
        role: >
          relevant because clustering a sparsely-tagged OSM network can leave disconnected
          zones; k-edge augmentation adds minimum-connectivity candidate lines. Registry
          status `partial`, off by default.
      - id: monte-carlo-sampling
        role: >
          the fan-out harness a resolution sweep can reuse if the sweep must be driven by
          something other than the wildcard list — eur has no equivalent
    available:
      verdict: turnkey
      how: >
        `scenario.simpl` and `scenario.clusters` are both wildcard lists, and both stages
        genuinely cluster: `simplify_network.py` calls `cluster(n, int(simpl), ...)` when the
        simpl wildcard is non-empty, then `cluster_network.py` clusters again to `clusters`.
        `cluster_options.simplify_network.*` and `cluster_options.cluster_network.*` each
        carry their OWN `algorithm` and `feature`, so the two stages can use different
        similarity metrics — Parzen 2022's two-iteration scheme is exactly this.
        `cluster_options.alternative_clustering: true` swaps the whole geography to GADM;
        `cluster_options.distribute_cluster` chooses load, pop or gdp as the budget weight;
        `cluster_options.focus_weights` skews it; `subregion.*` overlays custom or GADM
        subregions.
      missing: >
        Same two structural gaps as eur: no cross-resolution comparison of a metric (step 8)
        and no inverse disaggregation (step 10). Additionally earth has no
        `resource_classes` equivalent — within-bus resource binning does not exist — and no
        `copperplate_regions`, so a partial copperplate must go through a custom busmap.
        The binding constraint here is usually DATA, not code: the achievable node count is
        capped by how many substations OSM actually tags in the region, and sparse tagging
        yields a sparse base network silently.
      provenance: "scripts/cluster_network.py:busmap_for_n_clusters; scripts/simplify_network.py:cluster"
    levers:
      - key: "scenario.simpl"
        effect: >
          The FIRST clustering stage, and the lever eur no longer has. A non-empty value is
          cast to int and clusters the network inside simplify_network, before
          cluster_network runs again to `clusters`. Because earth builds renewable profiles
          on the FULL-resolution `regions_onshore.geojson` (pre-simplify), simpl is where
          resource resolution is fixed while `clusters` then reduces the transmission network
          independently — Frysztacki 2021's decomposition available as pure config.
          Wildcard constraint `[a-zA-Z0-9]*|all`; the default `''` skips the stage.
        default: "['']"
        provenance: "Snakefile:simpl; scripts/simplify_network.py:cluster"
      - key: "scenario.clusters"
        effect: >
          The second-stage node count. Accepts an integer, `Nm` (aggregate only conventional
          carriers), `Nflex` (min(N, len(n.buses)) — clamps instead of failing on a sparse
          network, which is an earth-specific concession to OSM coverage), `all`, and `min`
          (one cluster per country/sub_network group). Same floor/ceiling assertions as eur.
        default: "[10]"
        provenance: "Snakefile:clusters; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "cluster_options.alternative_clustering"
        effect: >
          Switches the whole spatial basis to GADM administrative units. Deeper than eur's
          administrative mode: it changes `build_bus_regions` so the bus REGIONS are GADM
          polygons rather than Voronoi cells, so land eligibility, potentials and demand
          disaggregation are all computed on administrative units from the start.
          CRITICAL: when true, `clustering_for_n_clusters` calls `busmap_for_gadm_clusters`
          and never passes `n_clusters` — the requested cluster count is IGNORED while the
          output filename still carries it.
        default: "False"
        provenance: "scripts/cluster_network.py:busmap_for_gadm_clusters; scripts/build_bus_regions.py:get_gadm_shape"
      - key: "build_shape_options.gadm_layer_id"
        effect: >
          Which GADM administrative depth becomes the node set (0 country, 1, 2, ...). The
          real node-count control once alternative_clustering is on. `get_GADM_layer`
          silently falls back to the deepest AVAILABLE layer when the requested id exceeds
          it, so one value can mean different depths in different countries of the same run.
        default: "1"
        provenance: "config.default.yaml:gadm_layer_id; scripts/build_shapes.py:get_GADM_layer"
      - key: "cluster_options.distribute_cluster"
        effect: >
          load | pop | gdp — which quantity the per-country cluster budget is proportional
          to. No eur counterpart (eur is load-only, hardcoded). Matters where load data is
          weak but population or GDP rasters are usable, which is common outside Europe;
          `pop` reads WorldPop and `gdp` the 5-arcmin GDP raster.
        default: "['load']"
        provenance: "config.default.yaml:distribute_cluster; scripts/cluster_network.py:distribute_clusters"
      - key: "cluster_options.cluster_network.algorithm"
        effect: >
          kmeans | hac | modularity. Unlike eur there is NO pydantic config schema, so the
          `modularity` branch calling `busmap_by_greedy_modularity` is reachable by config
          here while it is schema-blocked in eur — earth is the cheaper place to try
          Frysztacki 2022's fourth algorithm.
        default: "'kmeans'"
        provenance: "config.default.yaml:algorithm; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "cluster_options.cluster_network.feature"
        effect: >
          The HAC feature spec as a compact string, e.g. `solar+onwind-time` (carriers before
          the dash, `time` or `cap` after) — earth derives the feature from the network's own
          generator profiles via `get_feature_for_hac`, where eur reads a separate cutout
          aggregation. Also drives which carriers' profile-less buses get pre-aggregated.
        default: "'solar+onwind-time'"
        provenance: "config.default.yaml:feature; scripts/cluster_network.py:get_feature_for_hac"
      - key: "cluster_options.simplify_network.algorithm"
        effect: >
          The FIRST stage's algorithm, independent of the second stage's. This separation is
          what makes the two-iteration scheme meaningful: resource-aware HAC at simpl,
          geographic k-means at clusters (or the reverse).
        default: "'kmeans'"
        provenance: "config.default.yaml:algorithm; scripts/simplify_network.py:cluster"
      - key: "cluster_options.simplify_network.feature"
        effect: "The first stage's HAC feature spec, independent of the second stage's."
        default: "'solar+onwind-time'"
        provenance: "config.default.yaml:feature; scripts/simplify_network.py:cluster"
      - key: "cluster_options.focus_weights"
        effect: >
          Country -> budget share, same semantics and same assertion as eur. NOTE: the
          registry index shows focus-weights as eur-only; that is a REGISTRY GAP, not an
          absence — `distribute_clusters` consumes it and both simplify_network and
          cluster_network read it (with a top-level `focus_weights` key taking precedence
          over the nested one).
        default: "False"
        provenance: "config.default.yaml:focus_weights; scripts/cluster_network.py:distribute_clusters"
      - key: "cluster_options.simplify_network.remove_stubs"
        effect: "Recursive dead-end aggregation before the first clustering stage. On by default, as in eur."
        default: "True"
        provenance: "config.default.yaml:remove_stubs; scripts/simplify_network.py:remove_stubs"
      - key: "cluster_options.simplify_network.to_substations"
        effect: "Aggregate non-injecting buses to the closest substation. Off by default, as in eur."
        default: "False"
        provenance: "config.default.yaml:to_substations; scripts/simplify_network.py:aggregate_to_substations"
      - key: "cluster_options.simplify_network.p_threshold_drop_isolated"
        effect: >
          Drops isolated sub-networks below this MW threshold, and `p_threshold_merge_isolated`
          (300 MW) merges those below a second threshold into their nearest neighbour. No eur
          counterpart, and it exists because OSM-derived topologies routinely contain
          disconnected fragments — an earth-specific data-quality lever that silently changes
          the achievable node count.
        default: "20"
        provenance: "config.default.yaml:p_threshold_drop_isolated; scripts/simplify_network.py:drop_isolated_networks"
      - key: "cluster_options.aggregation_strategies"
        effect: >
          Far more explicit than eur's: p_nom/p_nom_max/p_nom_min sum, p_max_pu
          weighted_average, marginal_cost mean, efficiency mean, build_year and lifetime
          MEAN. The build_year/lifetime means are worth flagging to any brownfield or myopic
          user — vintages are averaged away by clustering here.
        default: "{'generators': {'p_nom': 'sum', 'p_max_pu': 'weighted_average', 'build_year': 'mean', 'lifetime': 'mean', ...}, 'one_ports': {...}}"
        provenance: "config.default.yaml:aggregation_strategies; scripts/cluster_network.py:clustering_for_n_clusters"
      - key: "subregion.method"
        effect: >
          false | gadm | custom — overlays a subregion classification onto buses at
          simplify_network and/or cluster_network (`subregion.apply_on`), from GADM
          (`define_by_gadm`) or user polygons (`path_custom_shapes`, `path_custom_offshore`),
          with a `tolerance` in km for the nearest-shape assignment. The earth-side route to
          heterogeneous or bespoke zoning without writing a busmap by hand; no eur equivalent.
        default: "False"
        provenance: "config.default.yaml:subregion; scripts/_helpers.py:nearest_shape"
      - key: "enable.custom_busmap"
        effect: >
          Reads `data/custom_busmap_elec_s{simpl}_{clusters}.csv` instead of running any
          algorithm. Note the path carries BOTH wildcards, so a custom busmap is per
          (simpl, clusters) pair.
        default: "False"
        provenance: "config.default.yaml:custom_busmap; scripts/cluster_network.py:custom_busmap"
      - key: "lines.length_factor"
        effect: >
          Routing detour factor applied to aggregated line lengths — 1.25, the same value
          Hoersch 2017 and Frysztacki 2020 report. In earth this is passed straight into
          `clustering_for_n_clusters(line_length_factor=)` so it shapes the clustered
          network's lengths directly; in eur at this ref the equivalent key is consumed at
          cost attachment in add_electricity instead. Same number, different stage.
        default: "1.25"
        provenance: "config.default.yaml:length_factor; scripts/cluster_network.py:clustering_for_n_clusters"
    assembly:
      - step: >
          Check the DATA first, before choosing N. The achievable node count is bounded by
          OSM substation tagging in the region, and sparse tagging silently yields a sparse
          base network. Consult cookbooks/pypsa-earth/data_quality for the country's grid
          grade; `clusters: Nflex` clamps instead of failing if you must be defensive.
        uses: [spatial-clustering]
        config: "scenario.clusters (Nflex form)"
        code: null
        provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          Choose the spatial BASIS: leave `alternative_clustering: false` for Voronoi cells
          around substations, or set it true for GADM administrative units. This decision
          precedes everything because it changes build_bus_regions, hence the geography that
          potentials and demand are computed on — not just the busmap.
        uses: [gadm-admin-clustering]
        config: "cluster_options.alternative_clustering; build_shape_options.gadm_layer_id"
        code: null
        provenance: "scripts/build_bus_regions.py:get_gadm_shape"
      - step: >
          Pick the budget weight — load where load data is trustworthy, pop or gdp where it
          is not — and skew it with focus_weights if the question is regional.
        uses: [spatial-clustering]
        config: "cluster_options.distribute_cluster; cluster_options.focus_weights"
        code: null
        provenance: "scripts/cluster_network.py:distribute_clusters"
      - step: >
          Set the TWO stages deliberately, which is the earth-specific move: `simpl` fixes
          resource resolution (profiles are built pre-simplify on full-resolution regions),
          `clusters` then reduces the transmission network. Give each stage its own algorithm
          and feature — resource-aware HAC at simpl, geographic k-means at clusters is the
          Parzen 2022 pattern.
        uses: [spatial-clustering]
        config: "scenario.simpl; scenario.clusters; cluster_options.simplify_network.{algorithm,feature}; cluster_options.cluster_network.{algorithm,feature}"
        code: null
        provenance: "scripts/simplify_network.py:cluster; scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          Handle the OSM fragments: `p_threshold_drop_isolated` and
          `p_threshold_merge_isolated` decide which disconnected pieces are dropped or
          merged, and `augmented_line_connection` can add minimum-connectivity candidate
          lines if clustering has left zones unreachable.
        uses: [spatial-clustering, augmented-line-connection]
        config: "cluster_options.simplify_network.p_threshold_{drop,merge}_isolated; augmented_line_connection.add_to_snakefile"
        code: null
        provenance: "scripts/simplify_network.py:drop_isolated_networks; scripts/augmented_line_connections.py:haversine"
      - step: >
          For a bespoke zoning, prefer `subregion.method: custom` with polygon files over
          hand-writing a busmap; fall back to `enable.custom_busmap` with a CSV keyed to the
          (simpl, clusters) pair when the assignment cannot be expressed geographically.
        uses: [custom-busmap]
        config: "subregion.method; subregion.path_custom_shapes; enable.custom_busmap"
        code: null
        provenance: "scripts/_helpers.py:nearest_shape; scripts/cluster_network.py:custom_busmap"
      - step: >
          Verify the node count after the run. This matters more here than in eur because
          the GADM path ignores the requested count entirely and `Nflex` clamps silently.
        uses: [spatial-clustering, gadm-admin-clustering]
        config: null
        code: "assert on len(n.buses) — no rule does this"
        provenance: "scripts/cluster_network.py:busmap_for_gadm_clusters"
    boundary:
      - variant: kmeans-geographic
        rung: L0
        note: "Default path; `scenario.clusters` and go. Same as eur."
      - variant: hierarchical-agglomerative
        rung: L1
        note: >
          `cluster_options.cluster_network.algorithm: hac` with a `feature` string. Cheaper
          to reach than in eur: the feature comes from the network's own generator profiles
          via `get_feature_for_hac`, so there is no extra cutout-aggregation rule to run.
      - variant: administrative-zoning
        rung: L1
        note: >
          `alternative_clustering: true` plus `gadm_layer_id`. Deeper than eur's equivalent —
          it changes the bus REGIONS, not just the busmap — and correspondingly more
          dangerous, since the `clusters` wildcard becomes decorative. L1 for the flip, but
          budget verification time.
      - variant: heterogeneous-focus-weights
        rung: L1
        note: >
          `cluster_options.focus_weights`, live and grep-verified in both simplify_network and
          cluster_network despite the registry index listing this capability as eur-only.
          `subregion` provides a second, geography-driven route.
      - variant: simplification-and-stub-removal
        rung: L0
        note: >
          `remove_stubs` on by default. Earth adds isolated-network handling eur has no
          counterpart for (drop below 20 MW, merge below 300 MW), which is L0/L1 and is
          usually load-bearing on OSM topologies.
      - variant: decoupled-resource-and-network-resolution
        rung: L1
        note: >
          The one variant where earth is clearly AHEAD of eur, and by a whole class of rung.
          Renewable profiles are built on full-resolution `regions_onshore.geojson`, and the
          surviving `simpl` wildcard is a real clustering stage with its own algorithm — so
          "fine resource, coarse network" is a config combination here. In eur the same
          study needs rule surgery (L4). Earth lacks eur's `resource_classes`, so the
          converse trick (several site qualities per bus) is not available.
      - variant: alternative-similarity-metrics
        rung: L1
        note: >
          Lower than eur for one specific reason: earth has NO pydantic config schema, so
          `algorithm: modularity` reaches `busmap_by_greedy_modularity` by config alone.
          Frysztacki 2022's fourth algorithm is therefore an L1 experiment here and an L2
          schema edit in eur. Genuinely new metrics are still L2 via custom_busmap.
      - variant: copperplate-and-single-node
        rung: L1
        note: >
          `clusters: min` gives one node per country/sub_network group — the closest thing to
          a copperplate, and cheaper than eur's route for a single-country study. Earth has NO
          `copperplate_regions` equivalent, so partial copperplating of named groups is L2
          (custom busmap) rather than L0.
      - variant: inverse-disaggregation
        rung: L5
        note: >
          Nothing disaggregates a result, same as eur. The busmap is persisted at
          `resources/.../bus_regions/busmap_elec_s{simpl}_{clusters}.csv` so the ingredients
          are there — but the high-resolution reference solve that makes the exercise
          meaningful is often infeasible in earth for data reasons, not compute reasons: if
          OSM tags 300 substations for the country, there is no 1250-node reference to
          disaggregate onto.
    where:
      - change: "any new similarity metric (busmap computed outside the workflow)"
        anchor: "enable.custom_busmap -> data/custom_busmap_elec_s{simpl}_{clusters}.csv"
        provenance: "scripts/cluster_network.py:custom_busmap"
      - change: "bespoke zoning expressed as polygons rather than a bus list"
        anchor: "subregion.{method,path_custom_shapes,apply_on} -> _helpers.nearest_shape"
        provenance: "scripts/_helpers.py:nearest_shape"
      - change: "second-stage-only re-clustering of the transmission network"
        anchor: "scripts/simplify_network.py::cluster (invoked when the simpl wildcard is non-empty)"
        provenance: "scripts/simplify_network.py:cluster"
      - change: "per-bus resource classes (eur's resource_classes equivalent)"
        anchor: "scripts/build_renewable_profiles.py — no binning exists; would need a new output dimension"
        provenance: "scripts/build_renewable_profiles.py:ExclusionContainer"
      - change: "partial copperplating of named region groups"
        anchor: "no equivalent of clustering.copperplate_regions — route via a custom busmap"
        provenance: "scripts/cluster_network.py:custom_busmap"
      - change: "inverse disaggregation of a solved coarse result"
        anchor: "new script consuming bus_regions/busmap_elec_s{simpl}_{clusters}.csv"
        provenance: "scripts/cluster_network.py:cluster_regions"
    data_dependencies:
      - input: "OSM substation and line extracts (geofabrik PBF via earth_osm)"
        required_for: kmeans-geographic
        availability: >
          region-dependent, and THE binding constraint on this method in earth. Grid
          evidence exists for ~104 countries and osm-grid is graded B when missing; sparse
          tagging silently yields a sparse base network, so the ceiling on N is a data fact
          per country. Corpus scale: 10 nodes for Nigeria (Parzen 2023), 54 for the Nigeria
          demo, 420 for all Africa — an order of magnitude below eur's node counts for the
          same effort.
      - input: "GADM boundary layers (gadm41_<ISO3>.gpkg, or a slice of gadm_410.gpkg)"
        required_for: administrative-zoning
        availability: >
          exists by default for all 105 listed countries and GADM covers everywhere; a
          missing per-country file is fetched on demand (an unreachable server is a hard
          stop, and NO DOWNLOADS is a house rule — stage offline from the global
          gadm_410.gpkg instead). The real risk is DEPTH, not presence: available layer
          count varies by country and `get_GADM_layer` silently falls back to the deepest
          available.
      - input: "WorldPop rasters / 5-arcmin GDP raster"
        required_for: heterogeneous-focus-weights
        availability: >
          exists by default, needed only when `distribute_cluster` is pop or gdp rather than
          load. These are the earth-specific budget weights eur does not offer, and they are
          the right choice precisely where load data is weakest.
      - input: "custom subregion or offshore polygons"
        required_for: alternative-similarity-metrics
        availability: "absent — user-supplied via subregion.path_custom_shapes / path_custom_offshore"
      - input: "a high-resolution reference network to disaggregate onto"
        required_for: inverse-disaggregation
        availability: >
          region-dependent and frequently ABSENT in practice — the fine reference does not
          exist if OSM does not tag enough substations, which is the usual earth situation
          and is a data blocker where eur's is a compute blocker.
    cost_profile:
      solves: >
        One solve per (simpl, clusters) pair, so the two-stage design multiplies the sweep
        grid rather than adding to it. The per-country budget QP runs once per stage per run,
        and with `distribute_cluster: pop|gdp` each stage also reads a global raster.
      relative: >
        Cheaper per node than eur in absolute terms, because earth studies are typically
        single-country and electricity-only — the corpus runs at 10-54 nodes for Nigeria and
        420 for Africa, against 37-1024 for Europe. But the useful ceiling is set by OSM
        coverage rather than by the solver, so "more nodes" is often not purchasable at any
        price.
      note: >
        Earth's mitigations differ from eur's: (1) the two-stage simpl/clusters split lets a
        coarse transmission network keep fine resource detail, which is the cheapest accuracy
        purchase available in either model; (2) `clusters: Nflex` avoids a hard failure on a
        sparse network; (3) `distribute_cluster: pop` or `gdp` gives a defensible budget where
        load data is poor, avoiding a spuriously uneven node allocation; (4) the isolated-network
        thresholds trim OSM fragments that would otherwise consume clusters. Unlike eur there is
        no `resource_classes`, so within-bus resource detail cannot be bought at all.
    verifies:
      - variant: kmeans-geographic
        check: "len(n.buses.query('carrier == \"AC\"')) == int(clusters)"
        over: run
        note: >
          The requested count materialised. In earth this check earns its keep: `Nflex`
          clamps to the available bus count and `min` resolves to a group count, so a run
          named for 50 nodes can legitimately contain fewer — the assertion forces that to
          be a conscious choice rather than a discovery.
      - variant: administrative-zoning
        check: "len(n.buses) != int(clusters) or gadm_layer_yields_exactly(clusters)"
        over: run
        note: >
          The single most valuable check on this card. With `alternative_clustering: true`
          the requested cluster count is never passed to the busmap function, so the
          filename and the network disagree and nothing complains. A failure here means the
          user believes they ran at N nodes and did not.
      - variant: decoupled-resource-and-network-resolution
        check: "len(pypsa.Network(f'elec_s{simpl}.nc').buses) > len(pypsa.Network(f'elec_s{simpl}_{clusters}.nc').buses)"
        over: ensemble
        note: >
          The two stages actually did different things. If the two networks have the same bus
          count, the simpl wildcard was empty or equal to clusters and resource resolution was
          never held above network resolution — the run answers the conflated question.
      - variant: heterogeneous-focus-weights
        check: "busmap.str.startswith(focus_country).sum() / len(busmap) > uniform_share"
        over: run
        note: >
          Same as eur. Additionally worth asserting that `distribute_cluster`'s chosen weight
          raster was actually read — a silent fallback to load defeats the reason pop or gdp
          was selected.
