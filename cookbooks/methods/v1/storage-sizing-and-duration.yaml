id: storage-sizing-and-duration
title: "Storage sizing and duration (energy/power ratio, fixed vs independent)"
summary: >
  Deciding how a storage asset's energy capacity relates to its power capacity in the
  optimisation — one variable at a fixed duration, or separate variables for charging,
  discharging and volume — and letting the resulting duration answer the question.
question: >
  How much storage of what duration does this system need, and is the duration something
  I assume or something the model tells me?
aliases:
  - "energy-to-power ratio"
  - "EP ratio"
  - "E/P ratio"
  - "max_hours"
  - "storage duration"
  - "discharge time at full power"
  - "fixed duration storage"
  - "independent energy and power sizing"
  - "unconstrained storage design"
  - "long-duration energy storage"
  - "LDES"
  - "seasonal storage"
  - "cyclic state of charge"
  - "charger/discharger coupling"
  - "storage volume"
  - "market potential method"
when_to_use:
  - "how much battery storage do we need"
  - "how many hours of storage should we build"
  - "do we need long-duration storage or is 4-hour batteries enough"
  - "how big should the hydrogen store be"
  - "is seasonal storage cost-effective"
  - "should I fix the storage duration or let the model choose it"
  - "compare batteries against hydrogen against pumped heat"
  - "which storage technology wins in my system"
  - "how much thermal storage does the district heating network need"
  - "the model built an absurd amount of storage — why"
  - "my batteries disappeared when I coarsened the time resolution"
  - "what energy capacity goes with that GW of storage"
family: storage
prevalence:
  papers: 48
  tier1: 30
  tier2: 18
  sweep_hits: 53
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) found 48 papers that make a
    storage-sizing decision explicit enough to code — nearly half the corpus, and the
    joint-largest storage-side method in the book. The regex screen returned 53; the
    five-paper gap is mostly papers that say "storage" or "LDES" in a framing sentence
    without stating a sizing representation, which pass 1 correctly excluded. The role
    split is the interesting number: 36 `routine-use` against 1 `defines`, 3 `extends`,
    7 `canonical-use` and 1 `critiques`. That is the signature of a method that became
    invisible infrastructure — almost every PyPSA paper sizes storage, and almost none
    of them treat the sizing choice as a result. The two flagged suspects in
    EVIDENCE_INDEX (2017_Schlachtberger_Benefits-Cooperation, 2024_vanGreevenbroek) were
    both kept: each quotes its own energy/power formulation with numbers, which is a
    sizing decision, not a mention.
procedure:
  - step: >
      Decide, per technology, whether energy and power are ONE decision or TWO. This is
      the fork the whole card turns on, and it is made before any solving: a StorageUnit
      carries a single p_nom variable with energy pinned at max_hours * p_nom, while a
      Store plus charger/discharger Links carries three independent variables (e_nom,
      charger p_nom, discharger p_nom). Parzen reports ~10% total-system-cost difference
      between the two on the same 181-node network.
    handle: "electricity.extendable_carriers.{StorageUnit,Store}"
    provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_storageunits"
  - step: >
      If fixed-duration: pick the duration per technology. The corpus is remarkably
      uniform here — 6 h for batteries and pumped hydro, 168 h (one week) for hydrogen —
      and these are the pypsa-eur/earth defaults, so most published "assumptions" are
      simply the shipped config.
    handle: "electricity.max_hours.<carrier>"
    provenance: "config/config.default.yaml:max_hours; scripts/add_electricity.py:attach_storageunits"
  - step: >
      If independent: build the store, the two conversion links, and the intermediate
      bus, and cost each of them separately (EUR/MWh on the store, EUR/MW on the links).
      The duration then falls out of the solve as a RESULT rather than going in as an
      assumption.
    handle: "scripts/add_electricity.py:attach_stores"
    provenance: "scripts/add_electricity.py:attach_stores; scripts/add_electricity.py:STORE_LOOKUP"
  - step: >
      Decide whether the charger and discharger are separately sizable or coupled.
      Real batteries share one inverter, so charger == efficiency * discharger; real
      hydrogen systems have an electrolyser and a fuel cell that are genuinely separate
      assets. This is a per-technology physical fact that must be asserted as a
      constraint — nothing in the component model enforces it.
    handle: "scripts/solve_network.py:add_battery_constraints"
    provenance: "scripts/solve_network.py:add_battery_constraints"
  - step: >
      Set the state-of-charge boundary condition. Cyclic (soc_0 == soc_T) is the corpus
      default and is what makes a single representative year self-consistent; free
      endpoints with an initial level are the alternative and are what a rolling-horizon
      or multi-period run needs. Every paper in this slice that states its boundary
      condition states cyclic.
    handle: "cyclic_state_of_charge=True / e_cyclic=True at build time"
    provenance: "scripts/add_electricity.py:attach_storageunits; scripts/add_electricity.py:attach_stores"
  - step: >
      Add a volume ceiling where geology or land limits it — salt-cavern potentials for
      hydrogen, land eligibility for pit thermal storage — as e_nom_max on the store.
      Without it a cheap seasonal store is unbounded and the model will happily build a
      continent's worth.
    handle: "rules/build_sector.smk:build_salt_cavern_potentials"
    provenance: "rules/build_sector.smk:build_salt_cavern_potentials; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
  - step: >
      Add a small positive variable cost (or dispatch penalty) on storage operation to
      suppress unintended simultaneous charge/discharge. Parzen measures full-load-hour
      distortions up to 23% for storage without it; his remedy is an explicit variable
      cost additive that keeps the problem linear and convex.
    handle: "solving.options.noisy_costs (eur, ~1e-2 EUR/MWh) / sector.marginal_cost_storage (earth)"
    provenance: "scripts/solve_network.py:noisy_costs"
  - step: >
      Solve, then read the duration back out per asset and per node: e_nom_opt divided
      by discharger p_nom_opt for the store form, or max_hours (unchanged) for the
      StorageUnit form. The distribution across nodes is the finding — Parzen reports H2
      chargers landing at 20-200 h and batteries at 2-4 h across 181 buses.
    handle: null
    provenance: null
  - step: >
      (multi-technology) Repeat with several storage technologies competing in the same
      solve, and read the deployed quantities as the technology ranking. This is
      Parzen's "market potential method": installed capacity from a solved LP, swept
      across possible and probable scenarios, is the system-value signal, and it can
      contradict an LCOS-based ranking of the same technologies.
    handle: null
    provenance: null
  - step: >
      (thermal/physics extension) Make the energy capacity a function of an achievable
      temperature spread rather than a fixed parameter, and add temperature-dependent
      discharge boosting. Schauss does this for PTES: volumetric capacity is the
      investment variable and energetic capacity derives from it, so linearity survives.
    handle: "sector.district_heating.ptes.dynamic_capacity"
    provenance: "scripts/prepare_sector_network.py:add_heat; rules/build_sector.smk:build_ptes_operations"
variants:
  - id: fixed-duration-storageunit
    what: >
      One StorageUnit per technology per bus: a single p_nom investment variable with
      energy capacity pinned at max_hours * p_nom. Halves (or thirds) the storage
      variable count and is why every pre-2021 pan-European PyPSA study did it. Buys
      tractability and a decision variable that is easy to explain; costs you the
      duration as an answer, because you supplied it as an input.
    papers:
      - "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
      - "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
      - "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
  - id: independent-energy-and-power
    what: >
      A Store on its own bus plus a charger Link and a discharger Link, each with its own
      capital cost and its own p_nom variable: three investment variables where the
      StorageUnit had one. The duration becomes a model OUTPUT. The corpus's reported
      endogenous durations — 5.6 h for batteries at a 5% CO2 cap, ~2 days for hydrogen,
      7.4 h average for Nigerian batteries, ~42 h for Danish power-to-heat-to-power —
      are only obtainable this way.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
      - "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
      - "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
  - id: seasonal-and-long-duration
    what: >
      Sizing a store whose cycle is synoptic-to-annual rather than daily: hydrogen at
      168 h to ~7 days, salt caverns at TWh scale, district-heating pit storage at
      tau = 180 days, methane and chemical carriers at existing-infrastructure volumes.
      Distinguished from independent-energy-and-power by what BINDS — the volume ceiling
      and the standing loss, not the converter cost — and by needing the whole year in
      one solve, so it is the variant temporal aggregation is least able to compress.
    papers:
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
      - "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
      - "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2025_Che_space-based-solar-power-european-decarbonization.pdf"
      - "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
      - "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
  - id: cyclic-vs-free-state-of-charge
    what: >
      Whether the state of charge must return to its starting level at the end of the
      horizon. Cyclic over one representative year is what almost every paper in this
      slice does, and it is what makes annual results self-consistent; free endpoints
      are what rolling-horizon dispatch and pathway runs need. Under-appreciated because
      it is a build-time attribute nobody configures: cyclic makes a seasonal store pay
      for a full annual cycle it may not really face, while free endpoints let the model
      end the year empty and understate the volume needed.
    papers:
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
      - "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
  - id: multi-technology-competition
    what: >
      Several storage technologies bidding against each other in one solve, with the
      deployed quantities read as the technology ranking (Parzen's "market potential
      method"). Parzen 2023 runs 20 PNNL technologies in a Nigerian system, splitting
      them into design-unconstrained (charger/store/discharger independent) and
      design-constrained (charger == discharger) families, and reports both single-
      technology and competitive-portfolio scenarios to isolate the synergy benefit.
      This is the variant that most needs multiple max_hours entries and multiple cost
      rows to exist.
    papers:
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
      - "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
      - "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
      - "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
  - id: exogenous-capacity-placement
    what: >
      Duration and volume fixed from outside the model (a scenario total, a national
      projection, observed market data) with only the spatial or temporal allocation
      left to the optimiser. Distinguished because the answer to "how much storage" is
      then not a model output at all — which is legitimate when the user's question is
      about siting or operation, and misleading if they think they asked for a sizing.
    papers:
      - "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
      - "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
literature:
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      The tooling paper that defines both representations and is therefore the origin of
      the choice this card is about. Sec. II-C makes power capacity H and energy capacity
      E separate optimisation variables with separate capital costs, states the SOC
      dynamics with standing loss and charge/discharge efficiencies, and states the
      cyclic condition e_{t=0} = e_{t=T}. It also names the Store as "a simpler variant
      with no power limits or charge/discharge efficiencies" — which is exactly why the
      Store must be paired with Links to represent a real asset.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference application for reading duration as a result. Power and energy
      independently optimised for batteries, hydrogen and thermal stores across CO2 caps
      from 60% to 5%; the headline numbers to quote are 5.6 h battery discharge time and
      ~2 days for hydrogen at the 5% cap, with CTES reaching ~23 days of average heat
      demand. Notably it runs an LCOS screen across discharge times and cycle counts
      BEFORE the system optimisation — the honest version of "which technologies belong
      in the run at all".
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      Establishes the house pattern for the sector-coupled case: batteries with equal
      charge/discharge inverter capacity and independently optimised energy, hydrogen
      split into electrolysis + tank + fuel cell, and hot-water TES treated as two
      distinct technologies at tau = 3 days and tau = 180 days rather than one store with
      a free duration. That two-class TES split is still how pypsa-eur and pypsa-earth do
      thermal storage.
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: extends
    note: >
      The only paper in the corpus that treats the fixed-vs-variable EP ratio as the
      experiment rather than an assumption, and the single most quotable result in this
      card: three scenarios on the same 181-node PyPSA-Eur network — "Fix EP ratio" (H2 at
      100 h, battery at 4 h), "Variable EP ratio" (charger, store, discharger sized
      independently), and "H2-Hub" (two electrolyser/fuel-cell pairs sharing one tank) —
      give a ~10% total system cost reduction (152.9 -> 139.9 BEUR/yr) purely from
      relaxing the ratio. Also the source of the "market potential method": deployed
      capacity from a solved LP read as a technology-valuation signal, which can
      contradict an LCOS ranking. Reported endogenous ratios: H2 chargers 20-200 h,
      batteries 2-4 h across the 181 buses.
  - paper: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    tier: 2
    role: critiques
    note: >
      The corpus's storage critique, and the anchor for `pitfalls`. Formalises unintended
      storage cycling (USC) — simultaneous charge and discharge of the same capacity in an
      LP without a binding renewable target — and measures the damage: full-load-hour
      distortions up to 23% for energy storage and 5% for renewables. Explicitly names
      unconstrained independent energy/power sizing as a configuration that AMPLIFIES USC,
      which is the uncomfortable counterweight to his own 2021 result above. Remedy:
      deliberate variable-cost additives, which keep the problem linear and convex. 120
      scenarios over 10 cost levels x 4 component types x 3 solver accuracy settings, with
      H2 fuel-cell FLH as the distortion metric — note that solver accuracy is one of the
      three axes, i.e. some of this is numerical, not economic.
  - paper: "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference multi-technology-competition study and the clearest statement of the
      per-technology design distinction: "energy storage with unconstrained design is
      modelled such that the model can independently optimize any functional component
      (charger, discharger, store). In contrast, design-constrained technologies such as
      the Lithium-battery are modelled so that the charger and discharger are constrained
      to be equal." 20 PNNL technologies in a 10-node Nigerian PyPSA-Earth system at 8760
      h, single-storage versus competitive scenarios to isolate the synergy benefit,
      resulting EP ratios spanning 4 h to 36 days. Applies his own 2021 remedy: 0.5
      EUR/MWh variable O&M added specifically to avoid USC — the number to reach for when
      a user asks how big the additive should be.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: extends
    note: >
      The cleanest demonstration that the sizing representation changes a headline
      RESULT, not just a cost: "we disentangle charging and storage capacities of both
      hydrogen and batteries in order to better represent the trade-offs between
      additional energy and power capacities instead of a fixed power-to-energy ratio",
      and that decoupling alone cut system-defining-event frequency from one every 1.5
      years to one every ~2 years across 80 weather years. Storage capacities vary
      strongly by weather year, which is why this variant pairs with weather ensembles.
  - paper: "2026_Schauss_Pit-Thermal-Energy-Storage.pdf"
    tier: 1
    role: extends
    note: >
      Extends sizing beyond a constant: PTES volumetric capacity is the investment
      variable and energetic capacity derives from it via volumetric heat capacity times
      temperature spread, with the energy-to-power ratio mu_e2p setting permitted peak
      charge/discharge rates. Temperature assumptions are precomputed exogenously to keep
      the problem linear, and land eligibility caps the potential. Standing loss
      0.18%/day, top temperature 90 C, 68 EUR/m3. This is the mechanism pypsa-eur now
      ships as `ptes.dynamic_capacity`.
  - paper: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference case for asymmetric charge/discharge power, which the coupled-inverter
      battery formulation cannot express: three independent cost components for
      power-to-heat-to-power (P2H converter 88 EUR/kWel, H2P converter 1000 EUR/kWel,
      thermal store 10 EUR/kWh), and the explicit finding that "decoupling charging and
      discharging power capacities allows the system to invest in higher charging power
      and energy capacities... while reducing the discharging power". Optimal discharge
      duration ~42 h in wind-dominated Denmark. Also caps ITES capacity explicitly (Eq.
      A.7) to stop a short-term technology masquerading as seasonal storage — a
      constraint pattern worth copying.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The canonical non-European fixed-duration application, and useful because it states
      every number: battery 6 h at 192 EUR/kWh and 0.81 round-trip, H2 168 h at 11.2
      EUR/kWh and 0.435 round-trip, cyclic SOC, plus reservoir hydro as a StorageUnit with
      fixed power and uncontrollable inflow. Demonstrates that the 6 h / 168 h pair
      travels outside Europe unchanged — which is a warning as much as a precedent.
  - paper: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    tier: 2
    role: canonical-use
    note: >
      The reference for seasonal storage as a dynamics question rather than a capacity
      one: decomposes hydrogen storage into five working pathways and separates "direct"
      (H2 stored before use) from "indirect" (H2 converted to methane before storage),
      then tracks filling levels and LCOS across a myopic 2020-2050 pathway. Establishes
      that indirect storage capacity is measured in MW of electrolyser rather than MWh of
      volume, so a naive "total storage energy" extraction silently omits it.
  - paper: "2023_Dergunova_great-britain-hydrogen-infrastructure.pdf"
    tier: 2
    role: canonical-use
    note: >
      The exogenous-capacity case, and the most useful cautionary comparison in the slice:
      storage sized to balance hourly cluster-level mismatch, energy capacity NOT
      independently optimised but inferred from FES scenario totals, and the resulting
      PyPSA-GB-H2 peak requirement (~55 TWh) diverging substantially from the FES estimate
      — a discrepancy the paper attributes to modelling approach. Also gives the geological
      headroom (~2000 TWh UK salt cavern) that makes the volume ceiling non-binding there.
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: routine-use
    note: >
      Contributes the single most actionable interaction in this card even though its
      sizing is routine (r = 6 h batteries, 168 h hydrogen): batteries at 6 h DISAPPEAR
      from the optimal mix once temporal resolution is coarser than 6 h, because the
      sub-daily variability they arbitrage is filtered away, while 168 h hydrogen survives
      every tested resolution. That is the mechanism behind the temporal-aggregation
      pitfall below, measured rather than asserted.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: routine-use
    note: >
      The pypsa-earth reference point for this card: battery as separate inverter [EUR/MW]
      and Li-Ion stack [EUR/MWh] independently scaled, with the EP ratio emerging from the
      optimisation at 4.6-15.1 h (average 7.4 h) rather than being fixed — i.e. earth's
      default Store+Links configuration, reported as a result. Also the honest negative:
      hydrogen storage exists as an option but is "not significantly optimized, probably
      because we ignore fuel trade with other countries".
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The corpus's widest single-study storage portfolio and a concrete multi-technology
      competition case: home and utility batteries, PHS, hydrogen tanks and caverns, and
      district-heating water pits/tanks, all with energy and power co-optimised, plus
      iron-air batteries at a 39 h energy-to-power ratio available only in the HighFlex
      scenario. Reports 310 GWh / 39 GW battery in 2035 (an 8 h ratio) and 1765 GWh of
      iron-air by 2045 — the clearest example of duration classes segregating by
      technology once several compete.
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      States the three-variable form most explicitly of any paper here — discharge power
      F_s, charge power H_s and energy E_s all optimised independently — over a 70-year
      hourly weather series, and connects storage sizing to price formation: the price is
      only zero when VRE availability exceeds both peak demand and the storage CHARGING
      capacity, which is a sizing variable. The reason charging capacity must be its own
      variable if prices are the question.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      Gives the physical reading of the two duration classes that is worth relaying to
      users verbatim: battery discharge time lands "in the range of 6 hours to
      counterbalance the strong daily pattern of PV generation" and hydrogen at
      approximately 2 days "to balance the synoptic fluctuations of wind generation".
      Duration is set by the driving weather timescale, not by the technology.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      The seasonal-volume reference number and a demonstration that storage volume is
      network-dependent: cost-optimal hydrogen storage of 26-43 TWh WITH a hydrogen
      pipeline network against 21-22 TWh without it. Also contrasts salt cavern against
      steel tank storage cost (a ~2 EUR/kWh delta) which is what decides whether a region
      gets seasonal storage at all.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      The thermal-storage sizing case: TES sized endogenously with separate energy and
      power at tau = 180 days for district heating and tau = 3 days for individual
      buildings, with 85-95% of TES energy landing in district heating. The result that
      matters for interpretation is that TES energy capacity drops 56-75% when building
      retrofitting is available, i.e. the "seasonal" store was largely buffering peaks.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Earliest explicit statement of the fixed-ratio formulation in this corpus:
      "the energy capacity E = h_max * G is proportional to this power capacity", with
      h_max = 6 h for batteries and 168 h for H2 storage, cyclic SOC, standing loss and
      separate charge/discharge efficiencies. The provenance of the two default numbers.
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Same fixed-ratio formulation across three technologies (PHS 6 h, battery 6 h, H2
      168 h) and — the reason it is cited here — the explicit justification: the
      proportionality is "due to computational limits and data availability", stated as a
      simplification rather than a physical claim. The honest version of the assumption.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Makes the consequence of the fixed ratio visible in a sensitivity design: capital
      cost sweeps for batteries and H2 are applied "uniformly across both power and energy
      components", because with one variable there is no way to sweep them separately. A
      fixed-duration model cannot answer "what if energy storage gets cheap but inverters
      do not".
  - paper: "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      Contributes the compute half of the argument: storage introduces inter-temporal
      linkage between snapshots, and the benchmark shows the sparser Kirchhoff formulation
      gains MORE speed-up in the storage-and-expansion mode than in plain dispatch.
      Storage was placed at only 15 buses because more "made computation intractable" —
      the historical reason fixed duration was the default.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Independent energy and charging capacities for batteries and H2 plus water tanks on
      the heat buses, with the two thermal time constants (tau = 3 / 180 days for
      individual / district) and PHS pinned at 170 GW / 204 GWh. A clean example of the
      mixed pattern that is now standard: some technologies endogenous, PHS exogenous.
  - paper: "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Three storage technologies competing (H2, battery, PHS) with cyclic SOC enforced and
      no explicit energy-to-power constraint stated, so duration is left implicit — a
      common and under-reported middle case. Hydro reservoir capacity fixed at today's
      values rather than being an investment variable.
  - paper: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      Fixed-ratio sizing (6 h battery and PHS, 168 h H2, PHS fixed at today's level) used
      as the substrate for flow-tracing storage charge and discharge. Relevant here for
      what it implies about extraction: attributing storage inflow/outflow to generation
      technologies requires the charge and discharge flows to be SEPARATE variables, which
      the StorageUnit form provides as p_store / p_dispatch.
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      States the motive for fixed duration plainly — "to reduce the number of decision
      variables, we tie the energy storage volume to power ratings using a
      technology-specific parameter T_s" — and notes that dispatch is split into separate
      charging and discharging variables to keep the LP convex. Battery and hydrogen
      storage are MGA search directions, so the ratio choice propagates directly into the
      reported near-optimal ranges.
  - paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Same T_s formulation with cyclic SOC, standing losses and separate charge/discharge
      efficiencies, on a 250-node network, with PHS non-extendable for geographical
      reasons. Confirms the fixed-ratio form as the pan-European default at 2-hourly
      resolution.
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: routine-use
    note: >
      Fixed T_s again, but with the storage cost ranges that a sensitivity study needs:
      battery annuity 30-125 EUR/kW/a, hydrogen 111-259 EUR/kW/a inclusive of electrolysis,
      cavern storage and fuel cells. Because the ratio is fixed those ranges are per-kW of
      POWER, which is the unit trap when comparing against a EUR/kWh study.
  - paper: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    tier: 1
    role: routine-use
    note: >
      Hydrogen, battery and hydro-dams with energy and power co-optimised and cyclic SOC
      stated explicitly, evaluated across 37-1250 nodes. Reports storage mean-squared
      error separately from generation across clustering methods — evidence that spatial
      aggregation and storage sizing interact, which is why spatial-clustering is in
      `combines_with`.
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: routine-use
    note: >
      Battery and hydrogen storage extendable across 41 weather years. Contributes one
      structural observation: at 95% emission reduction storage is extendable but not a
      tracked dimension, while at 100% battery and hydrogen storage REPLACE the gas
      dimension in the near-optimal space — storage sizing only becomes a decision
      variable worth reporting at the deepest decarbonisation levels.
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: routine-use
    note: >
      Battery and hydrogen sized endogenously with hydro reservoirs fixed, and uses
      hydrogen storage discharge duration (~7 days) as the calibration anchor for the cost
      threshold of system-defining events. Also reads the duals of the inter-hour SOC
      linking constraint as the marginal value of stored energy — the extraction route for
      "what is a MWh in the store worth".
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Independent energy and power sizing for batteries (inverter 333 EUR/kW, storage 167
      EUR/kWh) and hydrogen (electrolysis 750, storage 0.5 EUR/kWh, turbine 800), with
      base scenarios keeping pumped hydro fixed at 8 h. Proves the storage no-profit /
      cost-recovery-by-arbitrage condition in App. B.3, which is the theoretical statement
      of why an optimally sized store earns exactly its annuity.
  - paper: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    tier: 1
    role: routine-use
    note: >
      Nine storage media co-optimised simultaneously (battery, compressed and liquid H2,
      compressed and liquid CO2, liquid CH4, ammonia, methanol, FT fuel, LOHC), with
      "storage capacities endogenously determined". The must-run constraints on
      methanation and Haber-Bosch (30% each) are what DRIVE the buffer storage sizing —
      a reminder that in a conversion chain the store is sized by downstream inflexibility,
      not by weather. Cavern storage deliberately excluded to keep chains
      location-independent.
  - paper: "2023_Tries_Islanding-Green-Hydrogen.pdf"
    tier: 1
    role: routine-use
    note: >
      Separate inverter (400 EUR/kW) and battery (60 EUR/kWh) components plus hydrogen
      cavern storage, both endogenous, in an islanded-versus-integrated electrolyser
      comparison. Contributes the finding that reduced hydrogen storage need is one of two
      mechanisms behind the portfolio benefit of integration — storage volume as the
      MEASURE of a system-integration benefit.
  - paper: "2024_Alamia_hydrogen-emethanol-power-to-x-biogas.pdf"
    tier: 2
    role: routine-use
    note: >
      Single-node PtX hub with H2 tanks, two CO2 storage forms, Li-ion and thermal storage
      all co-optimised. The detail worth carrying: the Li-ion C-rate is capped at 1 h^-1
      "due to time resolution", an explicit acknowledgement that hourly snapshots put a
      floor on the shortest representable duration.
  - paper: "2024_Gallego-Castillo_PyPSA-Spain-extension-PyPSA-Eur_ESR.pdf"
    tier: 2
    role: routine-use
    note: >
      A PyPSA-Eur fork reporting battery power and energy separately (~25 GW and ~150 GWh,
      i.e. a 6 h outcome) from a split inverter/storage cost (169.3 EUR/kWe, 150.3
      EUR/kWh), with PHS fixed at 8870 MW. Also the negative result: H2 underground storage
      was available but did not appear in the optimum under the 2030 CO2 target — an
      option existing is not an option being used.
  - paper: "2024_Riepin_24-7-carbon-free-energy-procurement_EnergyStratRev.pdf"
    tier: 1
    role: routine-use
    note: >
      Three technology palettes (wind+solar+battery, +LDES, +LDES+clean firm) as an
      explicit competition design, with battery energy 187 EUR/kWh and inverter 215
      EUR/kW against LDES hydrogen caverns at 2.5 EUR/kWhH2 plus a 550 EUR/kWel
      electrolyser and a 1200 EUR/kW fuel cell. The palette structure is the cleanest way
      to present a storage-technology question to a user: same system, storage menu varied.
  - paper: "2025_Che_space-based-solar-power-european-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Batteries, PHS, dams, hydrogen and methane endogenously sized, used to measure what
      a new firm resource does to storage: battery usage cut by over 70% (78% in one
      design) while hydrogen storage expands seasonally. Storage deployment as the
      displacement metric for a competing technology.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: >
      Hot water tanks co-optimised with EGS, plus a flexible-reservoir variant that treats
      the geothermal reservoir itself as storage with a 24 h build-up and a 25% discharge
      surplus above nameplate. A worked example of the pattern "an existing asset given a
      storage representation", which is what `sector.enhanced_geothermal.max_hours`
      exposes.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The exogenous case with a fixed duration: thermal storage at 12 h with 2%/hour
      self-discharge, EV batteries at 50 kWh / 11 kW / 90% round-trip, and grid-level
      battery TOTAL capacity fixed by the FES scenario while the spatial distribution stays
      endogenous. The split between exogenous total and endogenous siting is the honest
      answer when a national projection must be respected.
  - paper: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    tier: 1
    role: routine-use
    note: >
      Storage energy and power capacities inferred from >300 days of Physical Notification
      data rather than nameplate values, then scaled to 25% to represent only the
      wholesale-visible share (the remaining 75% implicitly reserved for balancing). The
      corpus's only empirical calibration of storage sizing, and a warning that nameplate
      capacity is the wrong number for a market study.
  - paper: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    tier: 2
    role: routine-use
    note: >
      Stationary battery energy and power co-optimised while EV battery capacity is tied to
      fleet size at 67 kWh per vehicle. The quantified substitution is the point: removing
      DSM and V2G raises stationary battery capacity by 61% (1871 -> 3008 GWh), so a
      storage sizing answer is only meaningful alongside the demand-flexibility assumption.
  - paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    tier: 2
    role: routine-use
    note: >
      Storage capacity targets set exogenously to match the EC 2040 Impact Assessment with
      the investment model placing them locationally. Contributes the operational
      counterpart to sizing: storage "was found to operate regularly against the system
      needs" under zonal pricing, identified by comparing market positions to a reference
      LMP solve — a sizing that is right on paper and dispatched wrongly.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Battery (cells + inverter) and hydrogen (tank + electrolyser + fuel cell) sized
      independently across 105 decarbonisation/decentralisation scenarios, with the
      threshold result that storage deployment "accelerates sharply" above ~90%
      decarbonisation. Flags conservative hydrogen assumptions as a limitation that
      suppresses hydrogen storage — an input choice deciding a technology's fate.
  - paper: "2026_Geis_Price-Formation-Sector-Coupled_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      The most useful statement of how the sizing representation propagates into prices:
      two storage classes are distinguished for bidding, SOC-only-constrained (gas,
      hydrogen tanks and caverns, where the bid is limited by current SOC and discharge
      efficiency) and capacity-constrained (batteries, PHS, hydro, where the bid is the
      min of converter capacity and SOC). Cyclic SOC applied. Which class an asset falls
      into is decided by whether you gave it a power-limited converter.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Battery and hydrogen storage sized endogenously in a 4-node German extraction with
      hydrogen underground storage reaching 93-100 TWh by 2045 from PyPSA-Eur's own cavern
      potentials. Contributes a negative operational finding: imposing REMIND's storage
      capacities as free capacity in PyPSA-Eur is implemented but DEACTIVATED because it
      increased solve time with no discernible impact.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      A full per-carrier inventory of what is and is not sized: expandable grid batteries,
      hot water tanks, salt caverns (~2700 TWh technical potential, "rarely binding") and
      compressed tanks against non-expandable pumped hydro (8.7 TWh / 56.9 GW), reservoir
      hydro (152.4 TWh / 103.1 GW) and ~1300 TWh of existing gas storage the model chose
      not to expand. The reference for which storage volumes are decisions and which are
      inherited.
pitfalls:
  - pitfall: >
      Unintended storage cycling (USC): the LP charges and discharges the same asset in
      the same snapshot, inflating full-load hours by up to 23% for storage and 5% for
      renewables. It is free in the model whenever no binding renewable target makes the
      round-trip loss costly, and it silently manufactures storage "utilisation".
    evidence: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    note: >
      Add a deliberate small variable cost to the storage components — Parzen 2023 uses
      0.5 EUR/MWh, which is 50x pypsa-eur's `noisy_costs` additive of ~1e-2 EUR/MWh.
      Then verify: count snapshots where charge and discharge both exceed 1 MWh. The
      distortion also moves with solver accuracy (one of Parzen's three scenario axes),
      so a "fix" that only tightens the barrier tolerance has not fixed the model.
  - pitfall: >
      Independent (unconstrained) energy/power sizing AMPLIFIES USC. This is the direct
      tension between the two Parzen papers: relaxing the fixed ratio buys ~10% system
      cost, and it also removes the coupling that was suppressing the artefact.
    evidence: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    note: >
      Do not present independent sizing as strictly better. If you relax the ratio, add
      the variable-cost additive in the SAME change and check the USC count before and
      after. A "10% cheaper" result that is 23% phantom storage utilisation is not a
      cheaper system.
  - pitfall: >
      Cyclic state of charge over a single representative year is an accounting fiction
      for seasonal storage: it forces the store to return to its January level, so the
      model pays for a full annual cycle whether or not the weather year demands one.
      Free endpoints have the opposite failure — the model ends the year empty and the
      required volume is understated.
    evidence: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    note: >
      Cyclic is the right default for a single-year design study and every paper in this
      slice that states its condition uses it. Say so explicitly in the answer, and if
      the user's question is genuinely inter-annual (a multi-year drought, a hydro-year
      sequence) then a single cyclic year cannot answer it — route to weather-year
      ensembles or a multi-year window instead of quietly relying on the cycle.
  - pitfall: >
      Temporal aggregation destroys short-duration storage. 6 h batteries vanish from the
      optimum once resolution is coarser than 6 h because the sub-daily variability they
      arbitrage has been averaged away, while 168 h hydrogen survives every tested
      resolution. The run succeeds and reports "batteries are not cost-effective".
    evidence: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    note: >
      The rule of thumb the measurement supports: never coarsen past the duration of the
      shortest storage technology you intend to size. If compute forces coarsening, use
      TSAM segmentation rather than nH averaging (segments preserve extremes) and report
      the resolution alongside every storage capacity. See
      `temporal-aggregation-and-segmentation` for the mechanics — this card only names
      the storage-side consequence.
  - pitfall: >
      Fixed duration makes a whole class of question unanswerable rather than merely
      approximate. With one variable there is no way to sweep energy and power costs
      separately — Schlachtberger sweeps them "uniformly across both components" because
      the model offers no alternative — and no way to report a duration as a result.
    evidence: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    note: >
      Check the user's question against the representation before running anything. "How
      many hours of storage" and "what if batteries get cheap per kWh" both REQUIRE the
      Store+Links form. If the question is "how much storage power at a given duration",
      fixed duration is correct and cheaper.
  - pitfall: >
      The 6 h / 168 h defaults are the shipped config, not a finding. Ten papers in this
      slice use exactly those two numbers, several outside Europe, and Schlachtberger is
      the only one that states the reason (computational limits and data availability).
      A user reading "6-hour batteries" from a paper is usually reading pypsa's default.
    evidence: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    note: >
      Never present a fixed-duration result as evidence about duration. If duration is
      the question, either switch to Store+Links or sweep max_hours explicitly and show
      the cost curve over it.
  - pitfall: >
      An uncapped cheap store is unbounded. Hydrogen caverns at ~0.5-2.5 EUR/kWh with no
      e_nom_max will absorb arbitrary volume, and thermal stores without a ceiling drift
      into acting as seasonal storage they were never costed for.
    evidence: "2025_Lopez-Ceballos_power-to-heat-to-power-storage.pdf"
    note: >
      Lopez-Ceballos caps ITES explicitly (Eq. A.7) for exactly this reason. Confirm the
      volume ceiling exists and check whether it BINDS: vanGreevenbroek reports the ~2700
      TWh salt cavern potential as "rarely binding", which means the number carrying the
      result is the cost, not the geology — worth telling the user either way.
  - pitfall: >
      Nameplate capacity is the wrong input for a market or operations study. GB storage
      units split capacity across wholesale and balancing, and reproducing observed
      wholesale arbitrage required scaling both energy and power to 25% of the
      PN-inferred values.
    evidence: "2025_Franken_Risk-Reward-National-to-Zonal-Electricity-Market-GB.pdf"
    note: >
      If the question is about revenue, dispatch or prices rather than investment, the
      sizing that matters is the market-visible sizing. Ask what fraction of the fleet is
      contracted elsewhere before taking registry capacities at face value.
  - pitfall: >
      A storage sizing answer is meaningless without the demand-flexibility assumption
      next to it. Removing DSM and V2G raised stationary battery capacity by 61%
      (1871 -> 3008 GWh) in the same model.
    evidence: "2025_Kalweit_endogenous-transformation-land-transport-europe.pdf"
    note: >
      Report EV/DSM assumptions in the same table as the storage capacities. If the user
      wants a single storage number, tell them which flexibility scenario it belongs to.
  - pitfall: >
      Total "storage energy capacity" is not a well-defined extraction across a
      sector-coupled network. Indirect hydrogen storage is measured in MW of electrolyser
      feeding methanation, not MWh of volume, so summing Store e_nom_opt omits it
      entirely; and EV batteries, heat-DSM stores and existing gas volumes are all Stores
      that are not investment decisions.
    evidence: "2024_Xie_direct-indirect-hydrogen-storage-renewable-europe.pdf"
    note: >
      Enumerate carriers explicitly when extracting, filter on e_nom_extendable, and
      state which storage pathways the number covers. Never hand a user a single
      "storage TWh" from a sector-coupled run without that list.
requires_methods: []
combines_with:
