pypsa_primitive:
  symbol: "pypsa/descriptors.py:get_bounds_pu"
  pypsa_version: "0.30.3"
  exposed_by: "both — every StorageUnit built by either model relies on it"
  reachable_via: >
    Already reached, and worth knowing precisely because the fixed-duration coupling is
    not a constraint anyone writes. For c == "StorageUnit" and attr == "state_of_charge",
    get_bounds_pu returns max_pu = max_hours broadcast over snapshots; that per-unit
    bound is then consumed by
    pypsa/optimization/constraints.py:define_operational_constraints_for_extendables,
    which emits soc <= max_hours * p_nom. So "energy = max_hours * power" is a bound on a
    variable, not a named constraint — grep n.model.constraints for it and you will not
    find it. The Store form has no equivalent: its e_nom is an independent nominal
    variable, and the SOC dynamics for both live in
    pypsa/optimization/constraints.py:define_storage_unit_constraints and
    define_store_constraints, where cyclic_state_of_charge / e_cyclic select whether the
    first snapshot's previous SOC wraps around.
  note: >
    This is the sharpest thing to know about the method: the two representations differ at
    the LIBRARY level, in variable count, not at the workflow level. Switching between
    them is a config list edit in both models, but nothing in the LP is renamed, so a
    referee check must count variables and components rather than look for a constraint
    name. Soft anchor: pypsa is a conda dependency pinned by version, not a submodule SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: battery-charger-ratio
        role: >
          the charger==discharger coupling for the Store+Links form; registry status
          `partial` and the reason matters here — the index filter matches only names
          containing 'battery charger/discharger', so the newer storage suite (lfp,
          vanadium, lair, pair, iron-air) is NOT coupled
      - id: tes-constraints
        role: >
          the only place in either model where a fixed energy-to-power ratio is imposed
          as an explicit named constraint rather than a variable bound; `working` and
          active in every heating run
      - id: district-heating-suite
        role: >
          owns the seasonal thermal storage surface (PTES, temperature-limited pit
          storage, supplemental heating) that `seasonal-and-long-duration` rests on
      - id: ates-potentials
        role: >
          registry status `dead-key` — the aquifer store exists but the build rule reads
          two config keys that are absent, so this seasonal option cannot be enabled
          without adding them
      - id: h2-network-retrofit
        role: >
          carries the salt-cavern potentials that become e_nom_max on the seasonal H2
          store — the volume ceiling for the largest storage in any net-zero eur run
      - id: temporal-resolution-nh
        role: >
          the pitfall lever: coarsening past 6 h deletes short-duration batteries from
          the optimum, so this is the setting that most often invalidates a storage answer
      - id: time-segmentation-tsam
        role: >
          the affordability lever to use INSTEAD of nH averaging when storage is the
          question, because segments preserve the extremes that size the store
      - id: rolling-horizon-dispatch
        role: >
          the only config surface in eur that changes the state-of-charge boundary
          condition — enabling it sets cyclic false and initial SOC zero on every
          StorageUnit and Store
      - id: numeric-stability-options
        role: >
          `noisy_costs` is eur's de-facto USC mitigation, at ~1e-2 EUR/MWh — two orders
          of magnitude below the 0.5 EUR/MWh the critique literature recommends
      - id: hydro-inflow-normalization
        role: >
          owns `hydro_max_hours`, the duration of the largest existing storage fleet in
          Europe; the reservoir duration is derived from national energy statistics, not
          configured per plant
      - id: cost-data-pipeline
        role: >
          where the `energy to power ratio` column lives — TES duration is a DATA value
          from technology-data, which is why changing it is L3 and not L1
      - id: enhanced-geothermal
        role: >
          registry `dead-key`; carries `sector.enhanced_geothermal.max_hours` (240), the
          one other fixed-duration key in the config, for the flexible-reservoir variant
      - id: distribution-grid-lv
        role: >
          gates home battery storage — a Store+Links battery behind the LV bus that only
          exists when the stylised distribution grid is switched on
      - id: custom-constraint-hook
        role: >
          the sanctioned landing point for a sizing constraint the shipped functions do
          not cover (a ratio on a non-battery carrier, an ITES ceiling, an asymmetric
          charge/discharge bound)
      - id: summary-outputs
        role: >
          where per-carrier energy and power capacities are already aggregated, i.e. the
          cheapest place to compute the realised duration per node
    available:
      verdict: turnkey
      how: >
        Both representations are one config list away and both are wired end to end.
        `electricity.extendable_carriers.StorageUnit` builds a StorageUnit per bus with
        energy pinned at `electricity.max_hours.<carrier>`; `extendable_carriers.Store`
        builds a Store, a dedicated bus and charger/discharger Links with independent
        capacities. The default at this ref is the Store form (`['battery','H2']`) with
        StorageUnit empty — so the shipped model already sizes energy and power
        independently, and a user asking for the classic 6h/168h fixed-ratio study is the
        one who must change config. attach_stores reads STORE_LOOKUP, which at this ref
        covers nine carriers (battery, home battery, li-ion, lfp, vanadium, lair, pair,
        iron-air, H2, H2 tank), so multi-technology-competition is also a list edit.
        add_battery_constraints couples charger to discharger at solve time, and the TES
        pair (add_TES_energy_to_power_ratio_constraints, add_TES_charger_ratio_constraints)
        does the same for water tanks and pits whenever `sector.tes` is true.
      missing: >
        Procedure steps 8 and 9 have no handle: nothing computes the realised duration
        e_nom_opt/p_nom_opt per asset, and nothing implements the market-potential
        ranking across scenarios. Three surfaces are narrower than they look. (1)
        add_battery_constraints filters on the literal substring 'battery charger' /
        'battery discharger', so of the STORE_LOOKUP suite only battery, home battery and
        li-ion are coupled — lfp, vanadium, pair are `<carrier>-bicharger` and iron-air is
        'iron-air battery charge'/'charge', which the filter misses; attach_stores also
        assigns the discharger ZERO capital cost for every bicharger technology, so their
        discharge sizing is both uncoupled and free. (2) The TES energy-to-power ratio is
        read from the cost table's `energy to power ratio` column, not from config, so
        changing a thermal duration is a data edit. (3) There is no cyclic-SOC config key:
        cyclic is hardcoded true at build time and only `solving.options.rolling_horizon`
        flips it, as a side effect of a different feature.
      provenance: "scripts/add_electricity.py:attach_storageunits; scripts/add_electricity.py:attach_stores; scripts/solve_network.py:add_battery_constraints"
    levers:
      - key: "electricity.extendable_carriers.StorageUnit"
        effect: >
          Carriers built as StorageUnits — one p_nom variable each, energy pinned at
          max_hours. Selects the fixed-duration-storageunit variant.
        default: "[] (empty — no StorageUnits are extendable out of the box)"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_storageunits"
      - key: "electricity.extendable_carriers.Store"
        effect: >
          Carriers built as Store + bus + charger/discharger Links — three independent
          capacity variables each. Selects independent-energy-and-power.
        default: "['battery', 'H2']"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_stores"
      - key: "electricity.max_hours.battery"
        effect: >
          Battery duration in hours for the StorageUnit form; also the duration applied to
          existing batteries when the powerplant dataset has no max_hours of its own.
        default: "6"
        provenance: "config/config.default.yaml:max_hours; scripts/add_electricity.py:attach_storageunits"
      - key: "electricity.max_hours.H2"
        effect: "Hydrogen storage duration in hours for the StorageUnit form — the corpus's 168 h."
        default: "168"
        provenance: "config/config.default.yaml:max_hours; scripts/add_electricity.py:attach_storageunits"
      - key: "electricity.max_hours.iron-air"
        effect: >
          Iron-air duration, the longest in the shipped table and the closest thing to a
          multi-day LDES entry in the electricity-only chain. Only bites in the
          StorageUnit form; as a Store its duration is free.
        default: "100"
        provenance: "config/config.default.yaml:max_hours; scripts/add_electricity.py:attach_storageunits"
      - key: "electricity.max_hours.vanadium"
        effect: >
          Vanadium redox flow duration. Present alongside lfp/lair/pair/iron-air — the
          multi-technology-competition menu is entirely config, no code.
        default: "10"
        provenance: "config/config.default.yaml:max_hours; scripts/add_electricity.py:get_available_storage_carriers"
      - key: "renewable.hydro.hydro_max_hours"
        effect: >
          Method for deriving reservoir hydro duration: energy_capacity_totals_by_country
          or estimate_by_large_installations. Any other value raises. Note the fallback
          for countries with no statistics is hardcoded 6 h, not configurable.
        default: "'energy_capacity_totals_by_country'"
        provenance: "config/config.default.yaml:hydro_max_hours; scripts/add_electricity.py:attach_hydro"
      - key: "renewable.hydro.PHS_max_hours"
        effect: "Duration assigned to pumped hydro units whose dataset value is zero or missing."
        default: "6"
        provenance: "config/config.default.yaml:PHS_max_hours; scripts/add_electricity.py:attach_hydro"
      - key: "sector.tes"
        effect: >
          Builds thermal stores with charger/discharger Links AND activates the only
          explicit fixed-ratio constraint pair in the model. Turning it off removes both
          the storage and the constraint.
        default: "true"
        provenance: "config/config.default.yaml:tes; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.hydrogen_underground_storage"
        effect: >
          Enables salt-cavern H2 stores with e_nom_max from the built potentials. With it
          off, every node falls back to the far more expensive overground tank, which
          suppresses seasonal storage rather than removing it.
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_underground_storage; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: "sector.district_heating.ptes.dynamic_capacity"
        effect: >
          Makes pit-storage energy capacity a temperature-dependent e_max_pu profile
          instead of a constant — the Schauss mechanism, shipped and off by default.
          Requires the build_ptes_operations resource.
        default: "false"
        provenance: "config/config.default.yaml:dynamic_capacity; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.district_heating.ptes.supplemental_heating.enable"
        effect: >
          Derates the pit discharger by a temperature-driven profile, i.e. makes the
          seasonal store's usable power depend on the network temperature rather than on
          its nameplate.
        default: "false"
        provenance: "config/config.default.yaml:supplemental_heating; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.enhanced_geothermal.max_hours"
        effect: >
          Duration of the flexible geothermal reservoir treated as storage (Franken's 24 h
          build-up variant is the published analogue). Dead in practice — the registry
          rates enhanced-geothermal `dead-key` at this ref.
        default: "240"
        provenance: "config/config.default.yaml:enhanced_geothermal; scripts/prepare_sector_network.py:add_enhanced_geothermal"
      - key: "solving.options.rolling_horizon"
        effect: >
          The only key that changes the SOC boundary condition: sets
          state_of_charge_cyclic false, state_of_charge_initial 0, e_cyclic false and
          e_initial 0 on every storage component before solving.
        default: "false"
        provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:optimize_with_rolling_horizon"
      - key: "solving.options.noisy_costs"
        effect: >
          Adds ~1e-2 EUR/MWh to every component's marginal cost, which is eur's de-facto
          USC suppressant. Two orders of magnitude below the critique literature's
          0.5 EUR/MWh — treat as present but not sufficient.
        default: "true"
        provenance: "config/config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Snapshot coarsening. The storage-relevant reading: past 6 h, short-duration
          batteries stop appearing in the optimum. Also accepts a `NSEG` value to route to
          TSAM segmentation instead of averaging.
        default: "false (hourly)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours"
      - key: "clustering.temporal.resolution_sector"
        effect: >
          Same for the sector chain, where the seasonal stores live — the setting that
          decides whether a 180-day thermal store or a TWh cavern is resolvable at all.
        default: "false (hourly)"
        provenance: "config/config.default.yaml:resolution_sector; scripts/prepare_network.py:apply_time_segmentation"
    assembly:
      - step: >
          Choose the representation per carrier by moving names between
          extendable_carriers.StorageUnit and extendable_carriers.Store. A carrier in
          neither list is not extendable at all; a carrier in both is built twice, which is
          double counting and nothing warns you.
        uses: []
        config: "electricity.extendable_carriers.StorageUnit; electricity.extendable_carriers.Store"
        code: null
        provenance: "scripts/add_electricity.py:get_available_storage_carriers"
      - step: >
          For the fixed-duration form, set the duration per carrier in
          electricity.max_hours. A carrier listed under StorageUnit with no max_hours entry
          is SKIPPED with a warning, not defaulted — a silent omission that leaves the
          storage out of the run entirely.
        uses: []
        config: "electricity.max_hours.<carrier>"
        code: null
        provenance: "scripts/add_electricity.py:attach_storageunits"
      - step: >
          For multi-technology competition, add the extra carriers (lfp, vanadium, lair,
          pair, iron-air, H2 tank) to the Store list. STORE_LOOKUP already maps each to its
          store and charger/discharger cost names, and get_available_storage_carriers warns
          and skips anything unimplemented, so the failure mode is a quiet omission rather
          than a crash. Confirm each cost name resolves in the processed cost table.
        uses: [cost-data-pipeline, technology-cost-year]
        config: "electricity.extendable_carriers.Store"
        code: "scripts/add_electricity.py:STORE_LOOKUP"
        provenance: "scripts/add_electricity.py:STORE_LOOKUP; scripts/add_electricity.py:get_available_storage_carriers"
      - step: >
          Decide the charger/discharger coupling and check that it actually applies.
          add_battery_constraints couples only names containing 'battery charger' /
          'battery discharger'. For any other carrier in the suite the two links are
          independently sized AND the bicharger discharger carries zero capital cost, so
          discharge power is free — the single most consequential gap on this surface.
          Widen the filter or add your own equality in the custom hook.
        uses: [battery-charger-ratio, custom-constraint-hook]
        config: "solving.options.custom_extra_functionality"
        code: "scripts/solve_network.py:add_battery_constraints"
        provenance: "scripts/solve_network.py:add_battery_constraints; scripts/add_electricity.py:attach_stores"
      - step: >
          For the sector-coupled seasonal side, leave sector.tes on (which brings the two
          TES ratio constraints with it) and sector.hydrogen_underground_storage on so the
          cavern potentials become e_nom_max. Optionally enable ptes.dynamic_capacity for
          the temperature-dependent capacity, which pulls in the build_ptes_operations
          resource.
        uses: [tes-constraints, district-heating-suite, h2-network-retrofit]
        config: "sector.tes; sector.hydrogen_underground_storage; sector.district_heating.ptes.dynamic_capacity"
        code: null
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - step: >
          To change a THERMAL duration you must edit data, not config: the ratio comes from
          the `energy to power ratio` column of the processed cost table (at this ref 22.5 h
          for central water pit, 60.3 h for central water tank, 0.15 h for decentral water
          tank). Override through the cost pipeline, not in the script.
        uses: [cost-data-pipeline]
        config: "costs.year; costs.overwrites (cost-data-pipeline surface)"
        code: "scripts/solve_network.py:add_TES_energy_to_power_ratio_constraints"
        provenance: "scripts/solve_network.py:add_TES_energy_to_power_ratio_constraints; scripts/prepare_sector_network.py:add_heat"
      - step: >
          Set the USC guard before trusting any utilisation or full-load-hour number.
          noisy_costs is on by default but at ~1e-2 EUR/MWh; to reach the literature's
          0.5 EUR/MWh you add marginal_cost to the storage links in the custom hook, since
          eur has no config key for it (sector.marginal_cost_storage appears in a docstring
          only and is absent from config.default.yaml — a documented key that does not exist).
        uses: [numeric-stability-options, custom-constraint-hook]
        config: "solving.options.noisy_costs; solving.options.custom_extra_functionality"
        code: "scripts/solve_network.py:custom_extra_functionality"
        provenance: "scripts/solve_network.py:noisy_costs; scripts/solve_network.py:custom_extra_functionality"
      - step: >
          Pick the temporal resolution LAST and against the shortest duration in the run.
          Prefer segmentation over averaging when storage is the question. Then extract the
          realised duration per asset — nothing does this, and make_summary is the cheapest
          place to add it.
        uses: [temporal-resolution-nh, time-segmentation-tsam, summary-outputs]
        config: "clustering.temporal.resolution_elec; clustering.temporal.resolution_sector"
        code: "scripts/make_summary.py"
        provenance: "scripts/prepare_network.py:apply_time_segmentation; scripts/make_summary.py:calculate_capacities"
    boundary:
      - variant: fixed-duration-storageunit
        rung: L1
        note: >
          Move carriers into extendable_carriers.StorageUnit and set their max_hours. L1
          rather than L0 because the default StorageUnit list is EMPTY — the out-of-box
          model does not do this variant, so a specific non-default value is required, and
          you must also remove the carrier from the Store list or it is built twice.
      - variant: independent-energy-and-power
        rung: L0
        note: >
          The shipped default: extendable_carriers.Store is ['battery','H2'] and
          attach_stores builds the store, bus and both links with independent capacities.
          Flip nothing. The only caveat is that add_battery_constraints then couples the
          two battery links, so battery power is symmetric by design even here — genuinely
          asymmetric charge/discharge for batteries is L2 (widen or bypass the filter).
      - variant: seasonal-and-long-duration
        rung: L3
        note: >
          Config is L0/L1 (hydrogen_underground_storage true by default; iron-air and H2
          tank are list edits) but the BINDING requirement is data: the cavern potentials
          resource must be built for the study region, and ptes.dynamic_capacity needs
          build_ptes_operations outputs. Enabling ATES pushes this to L1-broken — the
          registry rates ates-potentials `dead-key` because the rule reads two config keys
          that do not exist under `ates`.
      - variant: cyclic-vs-free-state-of-charge
        rung: L2
        note: >
          Cyclic is hardcoded true at build time in both attach functions. The one config
          route, solving.options.rolling_horizon, sets it false as a SIDE EFFECT of
          switching to windowed dispatch, which changes the run's meaning entirely. To make
          endpoints free while keeping a single full-year investment solve you set
          n.stores.e_cyclic / n.storage_units.state_of_charge_cyclic in the custom hook —
          a two-line localised edit, hence L2.
      - variant: multi-technology-competition
        rung: L1
        note: >
          Purely a config list edit: STORE_LOOKUP already covers nine carriers and
          max_hours already has entries for lfp/vanadium/lair/pair/iron-air. L1 not L0
          because the defaults ship only battery and H2. Verify each carrier appears in the
          built network — unimplemented names are warned-and-skipped, not errors.
      - variant: exogenous-capacity-placement
        rung: L1
        note: >
          Existing capacities arrive through the powerplant/brownfield chain with their own
          max_hours (median-filled), and country-carrier capacity limits can pin totals
          while leaving siting endogenous. L1 because it is a config/data combination
          rather than one flip.
    where:
      - change: "widen or replace the charger==discharger coupling beyond the 'battery' name filter"
        anchor: "scripts/solve_network.py::add_battery_constraints (called unconditionally from extra_functionality)"
        provenance: "scripts/solve_network.py:add_battery_constraints"
      - change: "free the state-of-charge endpoints without switching to rolling horizon"
        anchor: "solving.options.custom_extra_functionality -> the user module's entry function"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
      - change: "change a thermal store's energy-to-power ratio"
        anchor: "the `energy to power ratio` column of the processed cost table consumed by add_heat"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/solve_network.py:add_TES_energy_to_power_ratio_constraints"
      - change: "add a storage variable-cost additive at the literature's 0.5 EUR/MWh"
        anchor: "solving.options.custom_extra_functionality, or marginal_cost on the charger/discharger links in attach_stores"
        provenance: "scripts/add_electricity.py:attach_stores"
      - change: "extract realised duration per asset and per node"
        anchor: "scripts/make_summary.py (rule make_summary)"
        provenance: "scripts/make_summary.py:calculate_capacities"
      - change: "add a new storage technology not in the lookup table"
        anchor: "scripts/add_electricity.py::STORE_LOOKUP plus a matching cost-table row"
        provenance: "scripts/add_electricity.py:STORE_LOOKUP"
    data_dependencies:
      - input: "salt-cavern potentials (retrieve_h2_salt_caverns -> build_salt_cavern_potentials)"
        required_for: seasonal-and-long-duration
        availability: >
          exists by default for Europe and is the e_nom_max on the seasonal H2 store;
          nodes with no cavern potential silently fall back to overground tanks at a much
          higher cost, so absence suppresses seasonal storage rather than erroring
      - input: "`energy to power ratio` column in the processed technology-data cost table"
        required_for: seasonal-and-long-duration
        availability: >
          exists by default (22.5 h central water pit, 60.3 h central water tank, 0.15 h
          decentral water tank at this ref) — but note the decentral value implies a tank
          that holds nine minutes of its charger's power, which is worth sanity-checking
          before quoting any decentral TES result
      - input: "PTES temperature / e_max_pu profiles (build_ptes_operations)"
        required_for: seasonal-and-long-duration
        availability: >
          must be built; only needed when ptes.dynamic_capacity or
          ptes.supplemental_heating.enable is set, and it depends on the district-heating
          forward/return temperature profiles upstream
      - input: "ATES aquifer suitability (build_ates_potentials)"
        required_for: seasonal-and-long-duration
        availability: >
          absent in practice — the rule's params read
          sector.district_heating.ates.max_top_temperature and .min_bottom_temperature,
          which do not exist in config.default.yaml, so the build crashes when enabled
      - input: "hydro capacity statistics (E_store[TWh] per country) for reservoir duration"
        required_for: exogenous-capacity-placement
        availability: >
          exists by default for Europe; countries missing from the statistics fall back to
          a HARDCODED 6 h, which is not configurable and not logged as an error
      - input: "cost-table rows for the extended storage suite (lfp, vanadium, lair, pair, iron-air)"
        required_for: multi-technology-competition
        availability: >
          exists by default — all five store and bicharger/charger names resolve in the
          processed cost table at this ref, which is what makes this variant L1
    cost_profile:
      solves: >
        1. This is a representation choice inside a single solve, not a multi-solve method.
        A duration SWEEP is 1 solve per max_hours value (the corpus's fixed-ratio
        sensitivity studies), and the market-potential variant is 1 solve per scenario in
        the possible/probable matrix.
      relative: >
        The Store form is the more expensive one: three nominal variables per asset per bus
        instead of one, plus an extra bus and two link dispatch time series, so a 100-node
        two-technology case adds ~400 nominal variables and 2 x 100 x |snapshots| dispatch
        variables against the StorageUnit form. Hoersch's benchmark is the historical
        evidence — storage's inter-temporal linkage is why the storage-and-expansion mode
        showed the largest formulation-dependent speed-ups, and why storage was placed at
        only 15 of 585 buses in 2017. On modern hardware the Store form at 100 nodes is
        routine; at 1000+ nodes with several technologies it is the storage variables, not
        the network, that dominate.
      note: >
        Do NOT buy the Store form back with coarser snapshots — that is the one mitigation
        this method cannot afford, because coarsening past the shortest duration deletes the
        technology you were trying to size. Spend the compute on resolution and save it on
        spatial clusters or on the technology menu instead. If you must coarsen, use TSAM
        segmentation (resolution_elec = 'NSEG') rather than nH averaging.
    verifies:
      - variant: fixed-duration-storageunit
        check: "(n.storage_units.query('p_nom_extendable').max_hours == expected_max_hours).all()"
        over: run
        note: >
          Catches the worst silent failure on this surface: a carrier listed under
          StorageUnit with no matching electricity.max_hours entry is warned-and-SKIPPED,
          so the storage is simply absent from the network and the run succeeds reporting
          that no storage was needed.
      - variant: fixed-duration-storageunit
        check: "len(n.storage_units.query('carrier == @carrier and p_nom_extendable')) > 0 and len(n.stores.query('carrier == @carrier')) == 0"
        over: run
        note: >
          Guards the double-count: a carrier left in BOTH extendable_carriers lists is
          built as a StorageUnit and as a Store+Links, which halves the effective storage
          cost and nothing warns.
      - variant: independent-energy-and-power
        check: "set(['Store','Link']).issubset(n.components) and len(n.links.query('carrier.str.contains(\"charger\") and p_nom_extendable')) > 0"
        over: run
        note: >
          Confirms the three-variable form was actually built. If the charger links are
          missing the store is unreachable — energy capacity with no way in or out, which
          solves fine at zero.
      - variant: independent-energy-and-power
        check: "'Link-charger_ratio' in n.model.constraints and n.model.constraints['Link-charger_ratio'].size == len(n.links.query('carrier.str.contains(\"battery charger\") and p_nom_extendable'))"
        over: run
        note: >
          The size comparison is the point, not the presence. A registered constraint whose
          row count is smaller than the extendable charger count means the name filter
          missed carriers — exactly what happens to lfp, vanadium, pair and iron-air — and
          their discharge power is then both uncoupled and (for bichargers) free.
      - variant: cyclic-vs-free-state-of-charge
        check: "n.stores.e_cyclic.all() and n.storage_units.state_of_charge_cyclic.all()"
        over: run
        note: >
          Assert the boundary condition you intended. Because rolling_horizon silently
          flips all four attributes, a run can be non-cyclic for a reason unrelated to the
          storage question, and the annual energy balance then no longer closes.
      - variant: seasonal-and-long-duration
        check: "n.stores.query('carrier == \"H2 Store\"').e_nom_max.lt(float('inf')).any()"
        over: run
        note: >
          An infinite ceiling on every H2 store means the cavern potentials never landed.
          The solve still succeeds and will report whatever volume the cost alone implies —
          the classic unbounded-cheap-store failure.
      - variant: multi-technology-competition
        check: "set(expected_carriers).issubset(set(n.stores.carrier.unique()) | set(n.storage_units.carrier.unique()))"
        over: run
        note: >
          get_available_storage_carriers warns and skips names it does not implement, so a
          typo removes a competitor from the comparison without failing. Any
          technology-ranking claim must be preceded by this check.
      - variant: multi-technology-competition
        check: "n.links.query('p_nom_extendable and carrier.str.contains(\"discharger\")').capital_cost.gt(0).all()"
        over: run
        note: >
          Bicharger technologies are given zero discharger capital cost by attach_stores.
          Free discharge power will win a technology comparison on an artefact. If this
          check fails the coupling constraint must be verified present for that carrier
          instead.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: hydro-inflow-normalization
        role: >
          owns the reservoir duration path, and the place earth is genuinely AHEAD of eur:
          `hydro_max_hours_default` is a real config key here where eur hardcodes 6
      - id: temporal-resolution-nh
        role: >
          the same storage-deleting lever as eur, reached through the scenario.opts token
          rather than a clustering key
      - id: time-segmentation-tsam
        role: "the preferred affordability lever when storage duration is the question"
      - id: sector-coupled-workflow
        role: >
          gates the sector-side stores (H2 UHS, water tanks, the Store+Links battery that
          REPLACES the electricity-chain battery) — a different chain from eur's, and the
          one carrying earth's storage bugs
      - id: custom-data-overrides
        role: >
          `custom_data.h2_underground` selects a completely different code branch for
          cavern potentials, and is the sanctioned way to impose regional storage potentials
          that earth has no dataset for
      - id: h2-pipeline-routing
        role: >
          hydrogen network buildout; attach_hydrogen_pipelines ASSERTS that H2 is in the
          Store list, so choosing the StorageUnit form for H2 makes the pipeline option
          unreachable
      - id: numeric-stability-options
        role: "`noisy_costs` is the only always-on USC suppressant in the electricity chain"
      - id: custom-constraint-hook
        role: >
          the single extra_functionality entry point; earth's L2 landing spot for a ratio
          constraint the shipped code does not cover
      - id: existing-baseyear-brownfield
        role: >
          existing batteries enter as StorageUnits sized with the CONFIG max_hours (unlike
          eur, which reads the powerplant dataset), then get converted to Store+Links in
          the sector chain
      - id: monte-carlo-sampling
        role: >
          earth's multi-solve harness — the natural driver for a duration sweep or for
          Parzen's possible/probable scenario matrix, which eur has no equivalent of
      - id: summary-outputs
        role: "where realised duration per node would be computed; nothing does it today"
      - id: carrier-attribute-scaling
        role: >
          per-carrier cost scaling, the cheapest way to sweep store-versus-converter cost
          separately once the Store form is in use
    available:
      verdict: assemble
      how: >
        The two representations exist and are selected the same way as in eur —
        `electricity.extendable_carriers.StorageUnit` vs `.Store` in
        add_extra_components.py, whose module docstring is the clearest statement of the
        contrast in either repo ("This linkage leads to one investment variable per storage
        unit" against "three investment variables for the energy capacity, charging and
        discharging capacity"). Defaults match eur: Store form for battery and H2,
        StorageUnit empty, 6 h and 168 h. add_battery_constraints exists in
        scripts/solve_network.py and couples charger to discharger. But the verdict is
        `assemble` rather than `turnkey` because earth's storage surface is materially
        narrower and partly broken, and getting a defensible answer means wiring around it
        rather than flipping a key.
      missing: >
        Concretely, and all verified at this ref. (1) Only two electricity-chain storage
        carriers exist — attach_stores hardcodes `if "H2" in carriers` and `if "battery" in
        carriers` with no lookup table, so multi-technology-competition is NOT a config edit
        here: there is no lfp/vanadium/lair/pair/iron-air, and adding one is new code.
        (2) There is no energy-to-power constraint on thermal storage at all: add_heat builds
        water-tank stores and both links fully extendable with no ratio coupling, and earth
        has no equivalent of add_TES_energy_to_power_ratio_constraints. (3) The sector-side
        H2 underground store is broken in its default branch: the charger link is wired
        bus0=<electricity bus> instead of the H2 bus, and the discharger repeats the
        charger's direction (bus0=<node>, bus1=<node> H2 UHS), so the cavern can be filled
        from electricity at efficiency 1 and can never discharge. Both branches also build
        UHS buses at ALL nodes while placing Stores only at cavern nodes, leaving orphan
        buses. It is off by default (sector.hydrogen.underground_storage: false), which is
        the only reason this is not louder. (4) `renewable.hydro.extendable` is a dead key
        for hydro — nothing reads it and attach_hydro hardcodes p_nom_extendable=False, so
        reservoir capacity cannot be an investment variable. (5) Procedure steps 8 and 9
        (realised-duration extraction, market-potential ranking) have no handle, same as eur
        — notable because both Parzen papers that define step 9 were run on PyPSA-Earth.
      provenance: "scripts/add_extra_components.py:attach_stores; scripts/add_extra_components.py:attach_storageunits; scripts/prepare_sector_network.py:add_hydrogen"
    levers:
      - key: "electricity.extendable_carriers.StorageUnit"
        effect: >
          Carriers built as StorageUnits at fixed max_hours — one investment variable each.
          Only 'battery' and 'H2' are supported by the lookup dicts in attach_storageunits.
        default: "[]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_storageunits"
      - key: "electricity.extendable_carriers.Store"
        effect: >
          Carriers built as Store + bus + charger/discharger Links — three investment
          variables each. Also a PRECONDITION for H2 pipelines: attach_hydrogen_pipelines
          asserts H2 is in this list.
        default: "['battery', 'H2']"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_stores"
      - key: "electricity.max_hours.battery"
        effect: >
          Battery duration for the StorageUnit form, AND the duration applied to existing
          batteries from powerplants.csv, AND the fallback duration when the sector chain
          converts existing batteries into Store+Links. One key doing three jobs.
        default: "6"
        provenance: "config.default.yaml:max_hours; scripts/add_electricity.py:attach_existing_batteries"
      - key: "electricity.max_hours.H2"
        effect: "Hydrogen duration for the StorageUnit form — the corpus's 168 h."
        default: "168"
        provenance: "config.default.yaml:max_hours; scripts/add_extra_components.py:attach_storageunits"
      - key: "renewable.hydro.hydro_max_hours"
        effect: >
          Method for reservoir duration: energy_capacity_totals_by_country or
          estimate_by_large_installations. Unlike eur, an unrecognised value does not raise —
          max_hours_country is simply left unbound and the code fails later.
        default: "'energy_capacity_totals_by_country'"
        provenance: "config.default.yaml:hydro_max_hours; scripts/add_electricity.py:attach_hydro"
      - key: "renewable.hydro.hydro_max_hours_default"
        effect: >
          Duration assumed for reservoirs in countries with no capacity statistics. THE
          earth-ahead lever on this surface: eur hardcodes 6 with no override, and outside
          Europe the statistics are missing far more often, so this key is load-bearing
          rather than cosmetic.
        default: "6.0"
        provenance: "config.default.yaml:hydro_max_hours_default; scripts/add_electricity.py:attach_hydro"
      - key: "renewable.hydro.PHS_max_hours"
        effect: "Duration for pumped hydro units whose dataset value is zero."
        default: "6"
        provenance: "config.default.yaml:PHS_max_hours; scripts/add_electricity.py:attach_hydro"
      - key: "sector.tes"
        effect: >
          Builds thermal stores with charger/discharger links. Note what it does NOT do
          here: no energy-to-power ratio constraint follows, so earth's water tanks have
          fully independent energy and power with no coupling of any kind.
        default: "true"
        provenance: "config.default.yaml:tes; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.tes_tau"
        effect: >
          Thermal time constant in days per system type, converted to a standing loss of
          1 - exp(-1/24/tau). Alive here and the ONLY duration-shaping knob for thermal
          storage in earth; the equivalent key is dead in eur, where the ratio comes from
          the cost table instead.
        default: "{decentral: 3, central: 180}"
        provenance: "config.default.yaml:tes_tau; scripts/prepare_sector_network.py:add_heat"
      - key: "sector.marginal_cost_storage"
        effect: >
          Variable cost applied to battery discharger links. This is Parzen's USC remedy as
          a first-class config key — earth has it and eur does not (eur's
          marginal_cost_storage exists only in a docstring). Default 0 means the remedy is
          shipped switched off; the critique literature's value is 0.5 EUR/MWh.
        default: "0"
        provenance: "config.default.yaml:marginal_cost_storage; scripts/prepare_sector_network.py:add_storage"
      - key: "sector.hydrogen.underground_storage"
        effect: >
          Enables the salt-cavern H2 store. Off by default, and leaving it off is currently
          the safer choice — see `available.missing` for the link-direction defects in the
          branch this switches on.
        default: "false"
        provenance: "config.default.yaml:underground_storage; scripts/prepare_sector_network.py:add_hydrogen"
      - key: "custom_data.h2_underground"
        effect: >
          Switches cavern potentials from the population-weighted country-level fallback to
          a user CSV at data/custom/h2_underground_<demand>_<year>.csv. The sanctioned route
          for a region earth has no cavern dataset for — and the branch whose charger is at
          least wired to the right bus.
        default: "false"
        provenance: "config.default.yaml:h2_underground; scripts/prepare_sector_network.py:add_hydrogen"
      - key: "solving.options.noisy_costs"
        effect: >
          Small marginal-cost additive on all components; earth's only always-on USC
          suppressant in the electricity chain, and far below the 0.5 EUR/MWh the critique
          literature uses.
        default: "true"
        provenance: "config.default.yaml:noisy_costs; scripts/solve_network.py:noisy_costs"
    assembly:
      - step: >
          Choose the representation per carrier in extendable_carriers, exactly as in eur.
          Read add_extra_components.py's module docstring first — it states the tradeoff in
          the model's own words (one investment variable versus three) and is the best
          available justification text for a bundle.
        uses: []
        config: "electricity.extendable_carriers.StorageUnit; electricity.extendable_carriers.Store"
        code: null
        provenance: "scripts/add_extra_components.py:attach_stores; scripts/add_extra_components.py:attach_storageunits"
      - step: >
          If H2 pipelines are also wanted, H2 MUST stay in the Store list —
          attach_hydrogen_pipelines asserts it. So for hydrogen the choice is not free:
          fixed-duration H2 and a hydrogen network are mutually exclusive here.
        uses: [h2-pipeline-routing]
        config: "electricity.extendable_carriers.Store; electricity.extendable_carriers.Link"
        code: null
        provenance: "scripts/add_extra_components.py:attach_hydrogen_pipelines"
      - step: >
          For multi-technology competition this is where earth stops being config. There is
          no lookup table: attach_stores hardcodes H2 and battery branches (plus a CSP
          thermal store gated on the advanced CSP model). Adding a third storage technology
          means adding a branch and a cost row — L5, against L1 in eur. If the study can be
          framed with two technologies plus CSP-TES, stay in config.
        uses: [carrier-attribute-scaling]
        config: "renewable.csp.csp_model; electricity.renewable_carriers"
        code: "scripts/add_extra_components.py:attach_stores"
        provenance: "scripts/add_extra_components.py:attach_stores"
      - step: >
          Set the USC guard. Unlike eur this is a real config key —
          sector.marginal_cost_storage lands on the battery discharger links — but it
          defaults to 0, and it only applies in the sector chain. For an electricity-only
          run you are left with noisy_costs, or you add marginal_cost in
          extra_functionality.
        uses: [numeric-stability-options, custom-constraint-hook]
        config: "sector.marginal_cost_storage; solving.options.noisy_costs"
        code: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/prepare_sector_network.py:add_storage; scripts/solve_network.py:extra_functionality"
      - step: >
          Set the reservoir-duration fallback deliberately. Outside Europe the hydro
          capacity statistics are missing for most countries, so hydro_max_hours_default is
          the number actually sizing the largest existing storage in the system. Do not
          leave it at 6.0 without saying so — and note that reservoir capacity is not an
          investment variable regardless (renewable.hydro.extendable is not read for hydro).
        uses: [hydro-inflow-normalization]
        config: "renewable.hydro.hydro_max_hours; renewable.hydro.hydro_max_hours_default"
        code: null
        provenance: "scripts/add_electricity.py:attach_hydro"
      - step: >
          For seasonal hydrogen, prefer the custom-data route: set custom_data.h2_underground
          true and supply data/custom/h2_underground_<demand>_<year>.csv. The default branch
          distributes country potentials by node count and wires its charger to the
          electricity bus rather than the H2 bus, so it does not represent a cavern. Verify
          the link directions in the built network before using either branch.
        uses: [custom-data-overrides, sector-coupled-workflow]
        config: "sector.hydrogen.underground_storage; custom_data.h2_underground"
        code: "scripts/prepare_sector_network.py:add_hydrogen"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - step: >
          For thermal storage, shape the duration through tes_tau (the standing loss) and
          accept that energy and power are uncoupled — there is no ratio constraint. If the
          study needs a physically bounded tank, add the equality yourself in
          extra_functionality, mirroring eur's add_TES_energy_to_power_ratio_constraints.
        uses: [sector-coupled-workflow, custom-constraint-hook]
        config: "sector.tes; sector.tes_tau"
        code: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/solve_network.py:extra_functionality"
      - step: >
          Pick the resolution against the shortest duration (scenario.opts nH or NSEG), then
          extract realised durations. If a sweep over max_hours or a possible/probable
          scenario matrix is wanted, the monte-carlo harness is the fan-out earth has and eur
          does not — the Parzen market-potential procedure maps onto it directly.
        uses: [temporal-resolution-nh, time-segmentation-tsam, monte-carlo-sampling, summary-outputs]
        config: "scenario.opts; monte_carlo.options.add_to_snakefile"
        code: "scripts/monte_carlo.py"
        provenance: "scripts/prepare_network.py:apply_time_segmentation; scripts/monte_carlo.py:validate_parameters"
    boundary:
      - variant: fixed-duration-storageunit
        rung: L1
        note: >
          Move battery and/or H2 into extendable_carriers.StorageUnit and set max_hours.
          Same rung as eur, with one extra trap: doing it for H2 breaks H2 pipelines, since
          attach_hydrogen_pipelines asserts H2 is a Store.
      - variant: independent-energy-and-power
        rung: L0
        note: >
          The shipped default and the configuration the PyPSA-Earth paper reports (EP ratio
          emerging at 4.6-15.1 h, average 7.4 h, for Nigeria). Flip nothing. Charger and
          discharger are coupled by add_battery_constraints, which for earth's naming
          (`<bus> battery charger`) does match.
      - variant: seasonal-and-long-duration
        rung: L3
        note: >
          Data-bound and partly broken. Salt-cavern potentials exist only as country totals
          spread over nodes by count, with no geospatial basis ("TODO: fix with real data"
          in the source), so a regional CSV through custom_data.h2_underground is the honest
          route — hence L3 on data rather than L1 on config. Thermal seasonal storage works
          but has no energy-to-power coupling at all.
      - variant: cyclic-vs-free-state-of-charge
        rung: L2
        note: >
          Cyclic is hardcoded at build time in every store and storage unit earth creates,
          and there is NO rolling-horizon option here (the registry has no
          rolling-horizon-dispatch entry for earth), so unlike eur there is not even a
          side-effect route. Free endpoints mean setting the attributes in
          extra_functionality — a localised two-line edit.
      - variant: multi-technology-competition
        rung: L5
        note: >
          The sharpest eur/earth asymmetry on this card: L1 in eur (nine carriers already in
          STORE_LOOKUP), L5 here (two hardcoded branches, no lookup, no extra cost rows
          wired). Ironic given that both Parzen papers defining the competitive
          market-potential procedure ran on PyPSA-Earth — they were forks, and the
          20-technology machinery did not come back upstream.
      - variant: exogenous-capacity-placement
        rung: L1
        note: >
          Existing batteries arrive from powerplants.csv at the config max_hours, and
          per-country carrier limits can pin totals. Cheaper to reason about than eur here
          because the duration comes from one config key rather than a dataset column.
    where:
      - change: "add a storage technology beyond battery / H2 / CSP-TES"
        anchor: "scripts/add_extra_components.py::attach_stores (the hardcoded per-carrier branches)"
        provenance: "scripts/add_extra_components.py:attach_stores"
      - change: "add an energy-to-power ratio constraint for thermal (or any) storage"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "free the state-of-charge endpoints"
        anchor: "scripts/solve_network.py::extra_functionality (set e_cyclic / state_of_charge_cyclic before optimize)"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "fix or replace the H2 underground store wiring (charger bus, discharger direction, orphan buses)"
        anchor: "scripts/prepare_sector_network.py::add_hydrogen (the underground_storage block, both branches)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "raise the storage variable cost to the literature's 0.5 EUR/MWh"
        anchor: "sector.marginal_cost_storage -> the discharger links built in add_storage"
        provenance: "scripts/prepare_sector_network.py:add_storage"
      - change: "make reservoir hydro an investment variable"
        anchor: "scripts/add_electricity.py::attach_hydro (p_nom_extendable is hardcoded False; renewable.hydro.extendable is not read)"
        provenance: "scripts/add_electricity.py:attach_hydro"
      - change: "sweep durations or run the market-potential scenario matrix"
        anchor: "scripts/monte_carlo.py + the monte_carlo rule"
        provenance: "scripts/monte_carlo.py:validate_parameters"
    data_dependencies:
      - input: "hydro capacity statistics (E_store[TWh] per country) for reservoir duration"
        required_for: exogenous-capacity-placement
        availability: >
          region-dependent and the main data gate on this surface — outside Europe the
          statistics are frequently absent, in which case every reservoir in the country
          silently takes hydro_max_hours_default (6.0 h). Check the build log for the
          "Assuming max_hours=..." warning and treat the countries it names as an
          assumption to sign off with the user
      - input: "salt-cavern potentials for hydrogen"
        required_for: seasonal-and-long-duration
        availability: >
          exists only as country-level totals distributed equally over a country's nodes
          (the source marks this a TODO), so it is not a geospatial potential; supply a
          regional CSV via custom_data.h2_underground for anything beyond a sanity check
      - input: "cost-table rows for storage components (battery storage, battery inverter, electrolysis, fuel cell, hydrogen storage tank/underground)"
        required_for: independent-energy-and-power
        availability: >
          exists by default via technology-data, but country_specific_data coverage is
          limited — a EUR/MWh store cost and a EUR/MW converter cost are BOTH needed for the
          duration to be a meaningful output, and if only one is localised the resulting
          ratio is an artefact of mixed cost vintages
      - input: "PNNL-style parameters for additional storage technologies"
        required_for: multi-technology-competition
        availability: >
          absent — earth has no equivalent of eur's extended storage suite in either the
          code or the cost table; Parzen 2023's 20 technologies came from a fork
    cost_profile:
      solves: >
        1 for the representation choice itself. 1 per max_hours value for a duration sweep,
        and 1 per scenario for the market-potential matrix — which is where earth's
        monte_carlo harness earns its place, since it already enumerates samples, rewrites
        the network per sample and collects results.
      relative: >
        Same structural cost as eur — three nominal variables per asset instead of one, plus
        an extra bus and two link dispatch series — but earth's base cases are usually
        smaller (one region, often electricity-only), so the Store form is materially
        cheaper to run here. Parzen's 20-technology Nigerian study at 10 nodes and full 8760
        h is the existence proof that the expensive variant is affordable on an earth-scale
        network, where the same technology count on a sector-coupled eur run would not be.
      note: >
        The tradeoff runs the opposite way from eur: compute is not the constraint here, code
        and data are. Do not coarsen snapshots to buy headroom you do not need — earth's own
        reference study ran hourly precisely because storage duration was the question.
    verifies:
      - variant: independent-energy-and-power
        check: "len(n.links.query('carrier == \"battery charger\" and p_nom_extendable')) == len(n.stores.query('carrier == \"battery\" and e_nom_extendable'))"
        over: run
        note: >
          One charger per extendable store. A mismatch means the sector chain's add_storage
          ran over a different node set than the electricity chain's attach_stores — earth
          REMOVES the electricity-chain battery and rebuilds it, so a partial overlap leaves
          stores with no converter.
      - variant: independent-energy-and-power
        check: "'Link-charger_ratio' in n.model.constraints and n.model.constraints['Link-charger_ratio'].size > 0"
        over: run
        note: >
          Presence and non-zero size. Earth's battery link names do match the filter, but
          the function returns early if nothing is extendable, so an operations-style run
          silently enforces no coupling and charge/discharge power diverge.
      - variant: fixed-duration-storageunit
        check: "(n.storage_units.query('carrier == \"battery\" and p_nom_extendable').max_hours == config['electricity']['max_hours']['battery']).all()"
        over: run
        note: >
          Unlike eur, attach_storageunits here indexes max_hours[carrier] directly rather
          than using .get, so a missing entry raises rather than skipping. This check instead
          guards the opposite error: the same key also sizes EXISTING batteries, so changing
          it to study new-build duration silently rewrites the inherited fleet too.
      - variant: seasonal-and-long-duration
        check: "n.links.query('carrier == \"H2 UHS discharger\"').bus0.str.endswith('H2 UHS').all()"
        over: run
        note: >
          A direction check, and the one that fails at this ref: the default
          underground_storage branch builds the discharger with bus0 = the node and bus1 =
          the UHS bus, i.e. the same direction as the charger, so the cavern fills and can
          never empty. The run succeeds and reports a cheap seasonal store that delivered
          nothing. Pair it with the same test on the charger
          (bus0 must end in ' H2', not be the bare node).
      - variant: cyclic-vs-free-state-of-charge
        check: "n.stores.e_cyclic.all()"
        over: run
        note: >
          Earth has no rolling-horizon option, so cyclic should hold everywhere unless
          someone edited it in extra_functionality. A false here means an undocumented
          hook is changing the annual energy balance.
      - variant: multi-technology-competition
        check: "set(n.stores.carrier.unique()) <= {'battery', 'H2', 'H2 Store Tank', 'H2 UHS', 'csp'} | set(sector_carriers)"
        over: run
        note: >
          Deliberately an upper bound rather than a lower one: it documents that earth can
          only build these storage carriers. If a bundle claims a broader technology
          comparison, this check failing is the evidence that new code — not config — was
          required, and that the comparison the user was promised is not the one that ran.
