id: transmission-expansion-cooptimisation
title: "Transmission expansion co-optimisation (joint generation-and-transmission expansion planning, TEP/GTEP)"
summary: >
  Make line and link capacity a decision variable in the same optimisation that sizes
  generation and storage, under a global volume or cost cap — and deal with the fact
  that expanding a line changes its impedance, which makes the joint problem nonconvex.
question: >
  How much transmission should be built, where, and what does the grid constraint cost
  the rest of the system when you cannot build it?
aliases:
  - "TEP"
  - "transmission expansion planning"
  - "GTEP"
  - "joint generation and transmission expansion planning"
  - "generation and transmission co-optimisation"
  - "co-optimised transmission expansion"
  - "network reinforcement"
  - "grid expansion"
  - "line volume cap"
  - "line volume constraint"
  - "CAP_LV"
  - "transmission volume limit"
  - "TWkm"
  - "MWkm"
  - "GWkm"
  - "iterative impedance update"
  - "responsive line impedances"
  - "adaptive susceptances"
  - "sequential linear programming"
  - "SLP heuristic"
  - "big-M disjunctive TEP"
  - "integer line investment"
  - "post-discretization"
  - "greenfield transmission"
  - "brownfield reinforcement"
  - "candidate line set"
  - "k-edge augmentation"
when_to_use:
  - "how much new transmission does this scenario need"
  - "where should we build new lines or interconnectors"
  - "what does it cost the system if we cannot build the grid"
  - "is it cheaper to build a line or to build storage / local generation"
  - "how much would a 25% grid expansion save"
  - "what if grid expansion is politically blocked"
  - "how many GW of interconnection between these two countries"
  - "should this be HVAC or HVDC"
  - "the model builds implausible amounts of transmission — can I cap it"
  - "does expanding the line change the flows the model computes"
  - "my model gives fractional line capacities — how do I get whole circuits"
  - "how do the TYNDP / NEP projects change the answer"
  - "which corridors are worth reinforcing first"
  - "what is a MWkm cap and what number should I use"
  - "what is the value of grid cooperation between countries"
family: grid-and-security
prevalence:
  papers: 51
  tier1: 38
  tier2: 13
  sweep_hits: 72
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) coded 52 papers; one was struck
    after reviewing the three suspects flagged in EVIDENCE_INDEX.md, leaving 51 — the
    4th most prevalent method in the book. The regex screen returned 72 and OVER-counts
    badly, because "transmission expansion" and "network reinforcement" appear in the
    framing sentence of almost every European paper whether or not line capacity is a
    variable. Struck: 2024_Gallego-Castillo, whose own notes say expansion "was
    disabled for the main results" and a fixed 0.7 derating was used instead — the
    method is named, not exercised. KEPT after review: 2018_Brown (the PyPSA framework
    paper, which is where the iterative-impedance-update recipe of this whole corpus
    comes from, so `defines` is correct even though it is a tooling paper) and
    2023_Neumann_Broad-Ranges (genuinely co-optimises continuous AC+HVDC capacity; it
    explicitly SKIPS the impedance update, which makes it evidence for the
    continuous-capacity-expansion variant and for the first pitfall rather than a
    non-use). Only 3 papers carry `defines` against 11 `canonical-use`: the method was
    settled early (Hörsch 2017, Schlachtberger 2017) and the later literature is almost
    entirely about the NONCONVEXITY — how to handle impedance response and integrality
    — rather than about the co-optimisation itself.
procedure:
  - step: >
      Decide what the candidate set is. Three choices, and it is the single most
      consequential one: (a) REINFORCEMENT ONLY — existing corridors get a continuous
      capacity increment, no new topology (the European default, and what a volume cap
      implicitly assumes); (b) PROJECT LIST — named TYNDP/NEP candidate corridors added
      as components with zero or nominal initial capacity; (c) GREENFIELD/AUGMENTED —
      generate candidate corridors algorithmically where the topology is sparse.
    handle: "transmission_projects.include (b); scripts/augmented_line_connections.py (c, pypsa-earth only)"
    provenance: "scripts/add_transmission_projects_and_dlr.py:attach_transmission_projects"
  - step: >
      Make capacity extendable and give it a capital cost. s_nom_extendable / p_nom_extendable
      true on the candidate branches, s_nom_min pinned to today's capacity so existing
      grid can be reinforced but not removed, and capital_cost = length * length_factor *
      per-MWkm cost, with HVDC additionally carrying a converter-pair cost. The corpus's
      cost anchors: 400 EUR/MW/km HVAC overhead, 1500 EUR/MW/km HVDC, 150 kEUR/MW per
      converter pair.
    handle: "set_transmission_limit -> set_transmission_costs"
    provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/add_electricity.py:set_transmission_costs"
  - step: >
      Choose the expansion BOUND, which in this corpus is almost never the cost signal
      alone. Four shapes: unconstrained (cost decides); a global VOLUME cap
      sum_l(length_l * F_l) <= CAP_LV, the dominant choice; a global COST cap on total
      transmission capex; or per-branch caps. The volume cap exists as a proxy for
      public acceptance and permitting, which no cost term represents.
    handle: "electricity.transmission_limit (eur) / the ll wildcard (earth)"
    provenance: "scripts/prepare_network.py:set_transmission_limit"
  - step: >
      Derate the thermal rating as a static N-1 proxy before expanding, because the
      expansion decision is made against the DERATED capacity: s_max_pu = 0.7 in nearly
      the whole corpus (33% margin in the Victoria/Zhu line of papers). This is not
      cosmetic — it scales the MWkm the model must buy to serve the same flow.
    handle: "lines.s_max_pu -> set_line_s_max_pu"
    provenance: "scripts/prepare_network.py:set_line_s_max_pu"
  - step: >
      Confront the NONCONVEXITY. Susceptance scales with capacity (b_l = 1/x_l and
      x_l ∝ 1/num_parallel), so the KVL constraint sum_l C_lc * x_l * f_lt = 0 contains
      the product of a decision variable and a flow variable: the joint problem is
      bilinear, and with integer circuit additions a bilinear MINLP. There is no way to
      write it as an LP. Every study in this corpus takes one of three exits, and which
      one it took is the single fact to establish before comparing two studies.
    handle: null
    provenance: null
  - step: >
      EXIT A — ignore it: hold impedances at today's values and solve one LP. Cheapest,
      universal by default, and silently answers a different question: the flow pattern
      belongs to today's grid, not the expanded one. Defensible when expansion is small,
      when the network is radial (no cycles, so KVL binds nothing), or when corridors are
      Links rather than Lines (transport model, no KVL at all).
    handle: "solving.options.skip_iterations: true (the default in both models)"
    provenance: "scripts/solve_network.py:optimize_transmission_expansion_iteratively"
  - step: >
      EXIT B — iterate to consistency (sequential linear programming): solve, recompute
      x and r from the optimised capacities, re-solve, until the mean-square capacity
      change falls under a threshold (pypsa's msq_threshold, default 0.05) or an
      iteration cap is hit. The corpus reports 3-5 iterations as typical, 4 as the
      modal value, and up to 274 on a large OSM network. A final pass fixes the branch
      capacities and re-optimises generation only, so the impedances stop moving.
    handle: "n.optimize.optimize_transmission_expansion_iteratively(min_iterations=, max_iterations=, msq_threshold=)"
    provenance: "pypsa/optimization/abstract.py:optimize_transmission_expansion_iteratively"
  - step: >
      EXIT C — solve it exactly as a MILP: binary investment variable per candidate
      line, KVL enforced conditionally through a big-M disjunction so an uninvested
      candidate carries no voltage-law constraint. Correct and expensive; the big-M
      bounds must be derived tightly (shortest-path bound for intra-zone candidates)
      or the relaxation is useless, and inter-zone candidates need extra combinatorics
      because connecting two synchronous zones changes the cycle basis itself.
    handle: null
    provenance: null
  - step: >
      (with B or C) Recover INTEGRALITY. A continuous LP gives fractional circuits,
      which are not buildable. Post-discretization rounds the optimised capacity to
      multiples of a unit size (1700 MW for a 380 kV double circuit) using a threshold
      z on the fractional remainder — z = 0.3 in both the defining heuristic and the
      pypsa default — then re-optimises generation with the integer line capacities
      FIXED. Sequential discretization does the rounding between SLP iterations instead
      of only at the end, which cuts iterations from ~10 to ~4.4.
    handle: "solving.options.post_discretization.{line_unit_size,line_threshold} (pypsa-eur only)"
    provenance: "scripts/solve_network.py:post_discretization"
  - step: >
      Read the answer off the solved network as VOLUME, not capacity: sum of s_nom_opt *
      length in MWkm/TWkm, split by AC and DC, against today's baseline. And read the
      SHADOW PRICE of the volume cap (mu), which is the corpus's most-used derived
      quantity here: it is the maximum EUR/MWkm at which further expansion still pays,
      i.e. the answer to "is a line worth building" expressed in units a planner can
      compare to a real project cost.
    handle: "n.global_constraints.mu (the lv_limit / lc_limit constraint)"
    provenance: "scripts/prepare_network.py:set_transmission_limit"
  - step: >
      (the standard study design) SWEEP the cap rather than reporting one point. The
      cost-benefit curve of transmission is strongly concave: the corpus repeatedly
      finds most of the benefit captured well before the unconstrained optimum, so the
      deliverable is the curve and its knee, not a single optimal volume. Reported
      sweeps run 0 to ~3-6x today's volume in 5-10 steps.
    handle: null
    provenance: null
variants:
  - id: continuous-capacity-expansion
    what: >
      The baseline: branch capacity is a continuous variable bounded below by today's
      capacity and above by a per-branch or global cap, with impedances held fixed. What
      you get by default in both models. Cheap, and the honest description of the
      majority of the corpus — including studies that state plainly that impedance
      response was ignored.
    papers:
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
      - "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
      - "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
      - "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
  - id: volume-cap
    what: >
      A single global constraint sum_l(length_l * F_l) <= CAP_LV, expressed as a multiple
      of today's line volume. THE dominant variant of this corpus, and the reason a
      transmission study is usually a sweep: line costs become dual to the cap, so
      several studies zero the line capex in the objective and add it back in
      post-processing. Reported caps cluster hard at +25% (public-acceptance proxy);
      wider sweeps run 0 to 6x. The cap's shadow price is the headline output.
    papers:
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
      - "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
      - "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
      - "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
      - "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
      - "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
      - "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
      - "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
      - "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
      - "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
      - "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
      - "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
  - id: cost-cap
    what: >
      The same idea with capital cost as the metric instead of length-weighted capacity:
      total transmission capex bounded by a multiple of today's. Materially different
      from a volume cap even at the same nominal multiple, because it prices submarine
      versus overhead sections and converter pairs, so it steers the model toward cheap
      onshore corridors where a volume cap is indifferent. Rare in the literature but it
      is pypsa-earth's DEFAULT bound, so any earth study inherits it silently.
    papers:
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
  - id: iterative-impedance-update
    what: >
      Exit B: sequential linear programming around the bilinearity. Solve, rescale x and
      r from the optimised capacities, re-solve until the mean-square capacity change is
      under threshold, then fix capacities for a final generation-only pass. The
      standard correction, and the one thing that makes a co-optimised network
      physically self-consistent. Reported at 3-5 iterations, up to 274 in the worst
      case. Orthogonal to every other variant — it wraps them.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
      - "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
      - "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
      - "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
  - id: discrete-line-additions
    what: >
      Exit C and its heuristic cousins: integrality of circuit additions taken seriously.
      Either an exact big-M MILP with a binary per candidate line and KVL enforced
      conditionally, or the cheap route — solve continuously, round to unit sizes at a
      threshold z (0.3), and re-optimise generation with lines fixed. The heuristic
      combination reaches within 1.5% of the exact MILP objective for 82% less compute,
      which is why post-discretization rather than MILP is what shipped.
    papers:
      - "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
      - "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
      - "2025_Lindner_PyPSA-DE_EEM.pdf"
  - id: explicit-project-lists
    what: >
      Candidates are named real projects — TYNDP corridors, the German NEP, PCI lists —
      filtered by permitting status, rather than free expansion of existing corridors.
      Turns the output from "the model wants 40 GW somewhere" into "these specific
      projects are in the cost-optimal set", which is the form a policy question
      actually takes. Also the only variant that can add NEW topology in pypsa-eur.
    papers:
      - "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
      - "2025_Lindner_PyPSA-DE_EEM.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
      - "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
  - id: candidate-set-augmentation
    what: >
      Generate the candidate corridors algorithmically where no project list exists and
      the topology is too sparse to reinforce: k-edge augmentation over the graph
      complement so every bus reaches a minimum connectivity degree, plus long-distance
      HVDC options. The greenfield answer, and pypsa-earth's genuine advantage — there
      is no pypsa-eur equivalent, and it is the only route to expansion on a network
      that is radial or disconnected after clustering.
    papers:
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
      - "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
  - id: exogenous-then-optimised
    what: >
      Two-stage: capacities are first scaled exogenously to an external target (TYNDP
      NTCs, a network development plan, a uniform factor), and only the residual is
      co-optimised — or nothing is, and the "expansion" is entirely exogenous. Common in
      sector-coupled and market studies where the grid is background, and in pathway
      studies that fix transmission to plan values up to 2030 and co-optimise after.
      Worth naming because it is frequently reported in the same words as a
      co-optimisation.
    papers:
      - "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
      - "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
      - "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
      - "2025_Franken_Geothermal-Market-Integration.pdf"
      - "2022_Victoria_Speed-technological-transformations_Joule.pdf"
      - "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
literature:
  - paper: "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
    tier: 1
    role: defines
    note: >
      The reference treatment of the nonconvexity, and the paper to cite whenever a user
      asks whether the impedance response matters. States the problem exactly: with
      integer line investment and responsive susceptances the joint problem is a bilinear
      MINLP, and develops the three-part heuristic family that everything downstream
      uses — (A) relax the integer investment variables, (B) iterate an SLP update of
      susceptances to the current optimal capacity, converging when the objective moves
      less than 1000 EUR/a or at 10 iterations, (C) post-facto discretization of the
      fractional capacities at threshold z = 0.3 (or a sweep over z in {0.1..0.5})
      followed by a generation-only re-optimisation with line capacities fixed. Adds
      SEQUENTIAL discretization — round Gamma to the nearest integer between iterations —
      which cuts convergence from ~10 iterations to ~4.4. Benchmarked against an exact
      big-M MILP in Gurobi at MIPGap 0.5-1.5% with a 72 h walltime, on the German
      subnetwork at 20-100 nodes and 100-400 tsam snapshots, under a +25% MWkm cap, a
      70% electricity renewable target and a 70% line loading limit. The headline number
      to relay: the best heuristic (heur-iter-seqdisc-postdisc) is 82% faster with at
      most 1.5% cost deviation from the exact solution. This is the justification for
      pypsa's post_discretization defaults, including line_threshold = 0.3.
  - paper: "2020_Neumann_Transmission-Expansion-Cycle-Flows_ACMeEnergy.pdf"
    tier: 1
    role: defines
    note: >
      The exact-MILP side: a cycle-based reformulation of TEP with LOPF, benchmarked
      against the standard angle-based one. Binary investment variables per candidate
      line, with KVL enforced CONDITIONALLY through big-M disjunctions so an uninvested
      candidate imposes no voltage law. The contributions that matter operationally are
      the big-M derivations — a shortest-path bound for intra-zone candidates (Theorem
      3.1), a separate bound for inter-zone candidates, and slack constraints — because a
      loose big-M makes the relaxation worthless. Also solves the problem everyone else
      dodges: connecting two previously separate synchronous zones CHANGES THE CYCLE
      BASIS, handled via a subnetwork-graph forest structure. Benchmark: 672 European
      generation+transmission co-expansion problems, 250-1000 nodes, 1-75 representative
      snapshots, 1-2 candidate lines per corridor, standard 380 kV type at ~1.7 GW per
      candidate, 40 MtCO2 budget, Gurobi 9.0 with a 6 h limit. Ran on a custom pypsa TEP
      branch (pypsa/tree/tep-v2) which was never merged — which is why exact MILP TEP is
      L5 in both models today.
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      Where the iterative-impedance-update recipe of this entire corpus enters the PyPSA
      family, stated in one sentence worth quoting verbatim to users: because branch
      capacities can be continuously expanded to represent added circuits, the impedances
      would also decrease, so "to keep the optimisation problem linear ... x_ell can be
      left fixed in each optimisation problem, updated and then the optimisation problem
      rerun, in up to 5 iterations to ensure convergence". Continuous expansion
      co-optimised with generation and storage; branch capital costs in the objective;
      integer expansion via big-M MILP named as an external extension and explicitly not
      in the main codebase. A tooling paper, but `defines` is right — this is the
      provenance of `skip_iterations` in both models.
  - paper: "2017_Hoersch_Spatial-scale-generation-transmission_EEM.pdf"
    tier: 1
    role: canonical-use
    note: >
      The canonical volume-cap-plus-impedance-update study, and the origin of the
      European house style. Co-optimises generation and transmission for a 95%
      CO2-reduced European system at 37-362 buses and 2920 snapshots, with the cap
      written as sum_l(length_l * F_l) <= CAP_trans over both HVAC and HVDC, swept at
      x = 1.0, 1.125, 1.25, 1.5, 2.0 and 3.0 times today's volume. Two practices to copy:
      line costs are set to ZERO in the objective because they are dual to the cap and
      added back in post-processing, and the volume cap's shadow price mu_trans is
      reported and interpreted as the maximum line cost per MWkm at which expansion still
      pays. Impedances held fixed per iteration and updated up to 4 times. Only existing
      corridors are expanded — no new topology.
  - paper: "2017_Schlachtberger_Benefits-Cooperation-Renewable-Network_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The cap-sweep-as-the-result study, and the clearest demonstration that the answer
      to "how much transmission" is a curve rather than a number: CAP_LV swept from 0 to
      ~500 TWkm on a 30-node (one bus per country) hourly European model under a 95% CO2
      target, showing strongly NON-LINEAR cost benefits of grid cooperation. Uses a
      transport model rather than DC power flow, so the impedance nonconvexity does not
      arise at all — the cleanest illustration that the exit you take depends on the
      formulation you chose. Cost anchors this book quotes: 400 EUR/kW/km overhead times
      a 1.25 detour factor plus converter pairs at 150000 EUR/MW, great-circle distance
      between country centroids plus 25%, and an n-1 factor f = 1.5 applied A POSTERIORI
      by scaling NTCs rather than inside the LP. Gurobi barrier, 1-2 h per scenario,
      duality gap < 2e-6.
  - paper: "2018_Brown_Synergies-sector-coupling-transmission_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The volume-cap sweep extended to a sector-coupled system, and the source of the
      "compromise grid" framing that is the most useful thing to offer a user who does
      not want an unconstrained answer: a grid at 4x today's NTC already captures 66-78%
      of the total cost benefit. Also the demonstration that the optimal volume is not a
      property of the grid but of the rest of the system — it falls from 557 TWkm
      (heating-only coupling) to 201 TWkm (electricity-only) as sector-coupling
      flexibility is added. Notes explicitly that capacity is length-weighted because
      length drives both cost and public-acceptance concerns.
  - paper: "2018_Zhu_CO2-prices-electricity-heating_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for reading the cap's dual as the decision-relevant output: the KKT
      multiplier mu_LV of the volume constraint reported as the shadow price of added
      transmission volume, alongside the two-scenario design (free expansion vs today's
      volume) that this book recommends as the cheapest honest bracket. HVDC assumed for
      all expandable corridors at 400 kEUR/MWkm. Anchors the corpus's baseline numbers:
      today's European NTC volume ~31.6 TWkm, cost-optimal volume for a 5% emissions
      target 196 TWkm, i.e. about 6x today's.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The non-European reference, and the one that separates the TOPOLOGY choice from the
      capacity choice: three distinct candidate topologies compared on a 31-node hourly
      Chinese model — regional AC only, regional AC plus unidirectional HVDC, and fully
      connected UHVAC — each then swept over a volume cap from 0.25x to 1.5x its own
      unconstrained optimum. The pattern to copy when a user's region has no existing
      meshed grid to reinforce. Optimal volumes at 90% CO2 reduction: 2231 TWkm (AC+HVDC)
      and 1851 TWkm (UHVAC), against European numbers two orders of magnitude smaller —
      a useful calibration that "how much transmission" is regionally specific.
      Converter-pair costs 150000 EUR/MW and an n-1 factor of 1.5.
  - paper: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The cleanest single statement of the standard European recipe, and the paper that
      pins the interaction with spatial resolution: the cap is a fraction x of the
      existing 2018 line volume with x in {0, 9, 12, 18, 25, 35, 50}%, line costs zeroed
      in the objective and added post-hoc because the cap replaces them, impedances held
      fixed and updated iteratively up to 4 times, a 0.7 security buffer, and no new
      topology beyond TYNDP 2018 planned lines. Run at 37-1024 nodes, which is why it is
      also the reference for the pitfall that the required MWkm is a function of the
      clustering, not only of the scenario.
  - paper: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The best-documented iterative-impedance-update procedure in the corpus, and the
      only paper that quantifies what the formulation does to the EXPANSION answer rather
      than to the dispatch: a lossy model builds 20% LESS network reinforcement than a
      transport model on the same system. Runs 3 iterations, with the final iteration
      fixing line capacities so impedances stabilise, and uses a concrete convergence
      criterion — line expansion choices unchanged between iterations — rather than a
      tolerance on the objective. Per-branch caps rather than only a global one: HVAC up
      to max(2x existing, +5 GW), HVDC up to 20 GW per link, TYNDP 2018 projects
      included, existing capacity reinforceable but not removable.
  - paper: "2020_Neumann_Near-Optimal-Feasible-Space_EPSR.pdf"
    tier: 1
    role: canonical-use
    note: >
      The greenfield-with-caps configuration, and the reference for combining this method
      with MGA: simultaneous expansion of AC lines (continuously, up to 4x current
      capacity) and NEW HVDC corridors taken from TYNDP 2018 (capped at 30 GW each),
      co-optimised with storage and generation, with the impedance dependence handled by
      sequential linear programming. Transmission VOLUME in TWkm is used as one of the
      MGA search directions, which is the corpus's canonical way of turning "how much
      grid" into a range rather than a point.
  - paper: "2023_Neumann_Hydrogen-Network-Europe_Joule.pdf"
    tier: 1
    role: canonical-use
    note: >
      The multi-carrier co-optimisation: electricity grid expansion and hydrogen network
      buildout (new plus retrofit pipelines) in the SAME linear problem, with the
      scenario matrix crossing "electricity grid expandable / fixed at today" against
      "hydrogen network allowed / not". The reference for a user whose question is really
      about substitution between wires and molecules. Uses the pypsa-eur config vocabulary
      explicitly — "lvopt" for cost-optimal expansion versus "lv1.0" for no expansion —
      which makes it the easiest paper to translate into a bundle. 181 k-means regions,
      lines >= 220 kV, impedances inferred from standard voltage-level types, +25% on
      crow-fly distance, 70% loading cap.
  - paper: "2023_Glaum_Offshore-Wind-North-Sea-Floating_EEM.pdf"
    tier: 1
    role: canonical-use
    note: >
      Endogenous TOPOLOGY rather than endogenous capacity, on the one part of the
      European system where it is defensible: offshore connection options start at ZERO
      capacity and the model decides which to build, so the candidate set is the
      modelling contribution. Deliberately mixes formulations — full LOPF on the existing
      onshore AC network, transport model for the new offshore HVDC, where reactance is
      meaningless before the corridor exists. Onshore overhead lines capped at 100% or
      150% of today's MWkm while underground and submarine cables are UNCAPPED, which is
      the sharpest example in the corpus of a volume cap encoding public acceptance
      rather than physics.
  - paper: "2025_Lindner_PyPSA-DE_EEM.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for the continuous-then-discretised route as shipped practice: new
      lines "are not built as discrete units, but optimized continuously and discretized
      in a further step as soon as a certain maximum loading is exceeded", co-optimised
      with generation and storage across all planning periods, over both onshore and
      offshore HVAC and HVDC. Also the corpus's most decision-relevant single result for
      this method: the co-optimised answer is a THIRD LESS transmission expansion than
      the official German network development plan — the comparison to quote when a user
      asks how a model answer relates to a real plan.
  - paper: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    tier: 1
    role: critiques
    note: >
      The critique this card needs: transmission reinforcement does not automatically
      improve robustness, because if the added capacity is fully used for economic
      dispatch it increases long-distance transfers and thereby AMPLIFIES structural
      imbalances. The paper's counter-design is instructive — a greedy corridor-selection
      algorithm adding one 380 kV circuit at a time to minimise a grid-stability metric,
      with the added capacity RESERVED for stability margin and unavailable to dispatch,
      so it is deliberately not a co-optimisation. Cheap at the margin: 12 additional
      lines restore the stability metric to its reference level for ~0.14 bn EUR/yr at a
      20% CO2 target, staying under 2.5 bn EUR/yr at 0%, costed at 4.5 MEUR/km from the
      German NEP. The reason a cost-optimal expansion plan cannot be presented as a
      resilience plan.
  - paper: "2017_Eriksen_Optimal-heterogeneity-renewable_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      The pre-PyPSA ancestor of this method, and the clearest example of expansion done
      WITHOUT co-optimisation: transmission capacity is sized ex post at the 99% quantile
      of the absolute flows produced by a synchronised balancing dispatch on a fixed
      renewable layout, then all capacities are scaled by a single uniform factor zeta
      swept over [0,1] to minimise LCOE. The optimum lands at zeta = 0.55-0.65 — i.e.
      deliberately UNDER-building relative to the flows the dispatch wants, which is the
      earliest quantitative statement in this corpus that the unconstrained optimum is not
      where the cost curve is flat. Cost anchors: 400 EUR/km/MW AC, 1500 EUR/km/MW HVDC
      plus 150 kEUR/MW per converter pair. 30 nodes, one per country.
  - paper: "2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf"
    tier: 1
    role: routine-use
    note: >
      Supplies the compute argument for this method rather than the method: joint
      generation-and-transmission expansion is the benchmark case where the formulation
      choice matters MOST — up to 213x speedup for the cycle (Kirchhoff) encoding against
      the angle one, versus at most 20x for dispatch alone. Pure Angle timed out (10^4 s)
      on 55% of the larger instances. The number to quote when a co-optimised run is too
      slow: the encoding, not the model size, may be the problem.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      The three-point bracket used as a design pattern rather than a sweep: zero
      transmission, a "compromise" 125 TWkm (~4x today's NTC) and unconstrained optimal,
      with EVERY sensitivity run repeated at all three. The cheapest way to keep a
      transmission assumption from silently driving a study about something else.
      Transport model, HVDC point-to-point or phase-shifted HVAC for international links.
  - paper: "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      The unconstrained baseline, stated explicitly — line capacities are free parameters
      and "unlimitedly expandable", with the volume constraint formulated but deliberately
      not used in the main results. Useful as the honest opposite pole to the +25% studies,
      and its 16450 mEUR/TWkm/a line annuity is a checkable cost anchor.
  - paper: "2018_Tranberg_Flow-based-storage-usage_EEM.pdf"
    tier: 1
    role: routine-use
    note: >
      A +50% volume cap (150% of today) chosen as a "moderate expansion" with no impedance
      update, used as the fixed background for a flow-tracing study. Representative of the
      largest class in this corpus: the cap is an assumption, not a result, and is picked
      for plausibility rather than derived.
  - paper: "2019_Victoria_Photovoltaics-European-energy-system_ProgPV.pdf"
    tier: 1
    role: routine-use
    note: >
      HVDC-only expansion with the cap released progressively from today's volume to
      unconstrained, reporting the knee: most of the cost benefit is captured by ~3x
      today's volume on a 30-node network. One of the corpus's several independent
      estimates of where the concave benefit curve flattens.
  - paper: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    tier: 1
    role: routine-use
    note: >
      Base case at 62 TWkm (2x today), swept from zero to the unconstrained optimum of
      159 TWkm (~5x current), with the cap's shadow price mu_LV tracked throughout. Uses a
      33% rather than 30% security margin and a 25% length penalty for non-straight
      routing — the variation in these two conventions is worth knowing before comparing
      MWkm numbers across papers.
  - paper: "2020_Victoria_Early-decarbonisation-pays-off_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      The pathway pattern: transmission fixed at TYNDP 2030 values through 2030 and only
      co-optimised afterwards. Quantifies what the fixing costs — releasing expansion
      after 2030 yields ~3x the 2030 transmission volume, 1.3% lower cumulative system
      cost, more onshore and offshore wind and less hydrogen storage. The clearest
      demonstration that a fixed grid displaces its value into other technologies rather
      than removing it.
  - paper: "2021_Brown_Market-value-variable-renewables_EnergyEcon.pdf"
    tier: 1
    role: routine-use
    note: >
      Expansion as one flexibility option among several, on a deliberately small 5-node
      network, with base scenarios at fixed 2010 NTCs. Contributes the market-theoretic
      side this card otherwise lacks: a no-profit rule for lines derived under multi-node
      KVL (App. B.4), showing the rule survives with a KVL distortion term — i.e. under
      cost-optimal expansion a line exactly recovers its capital cost from congestion
      rent. That is the theoretical basis for reading the cap's shadow price as a
      willingness-to-pay.
  - paper: "2021_Gazafroudi_Network-Boosters-Corrective-Grid-Security.pdf"
    tier: 1
    role: routine-use
    note: >
      Co-optimises generation investment with the siting and sizing of "network boosters"
      (storage/flexibility used correctively after outages) on a FIXED topology — no new
      lines. The nearest thing in the corpus to "what do I build INSTEAD of a line", and
      it compares a simultaneous single-LP formulation against a sequential two-stage one,
      which is the same design question this method faces.
  - paper: "2021_Parzen_beyond-cost-reduction-value-energy-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      A +25% volume cap on both HVAC and HVDC, justified in the text by "the increasing
      political difficulty to develop new transmission lines" — the clearest statement of
      what the number is actually encoding. One of six independent papers in this corpus
      converging on +25%, which is why this book treats it as the default to offer.
  - paper: "2021_Parzen_reducing-model-distortions-unintended-storage.pdf"
    tier: 2
    role: routine-use
    note: >
      Same +25% cap over a TYNDP 2018 baseline, with offshore wind connected by HVAC or
      HVDC depending on distance. Cited here as the second half of the pair showing the
      +25% convention travelling between studies as an inherited assumption.
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: routine-use
    note: >
      Transmission investment as one of the five dimensions of an MGA search space rather
      than a scalar output — AC and DC both extendable over a partial-greenfield 2020
      baseline. The template for answering "how much transmission" as a RANGE that is
      near-optimal across weather years instead of a single cost-optimal number.
  - paper: "2022_Millinger_Biofuel-mandates-cost-effective_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      A +50% volume cap with the grid deliberately converted to an HVDC LOSSY TRANSPORT
      model — the combination that removes the impedance nonconvexity entirely while
      keeping losses, and therefore the cheapest defensible configuration for a
      sector-coupled study where the grid is not the object of interest.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: routine-use
    note: >
      The pypsa-earth reference and the only description of the augmented-line candidate
      generation in the literature: k-edge augmentation ensuring every node reaches at
      least k connections (three nearest HVAC neighbours in the 2060 run) plus a minimum
      spanning tree, candidates added at 1 MW initial capacity so expansion is a
      continuous variable from near-zero, and a random selection of >600 km pairs given
      HVDC options. Brownfield expansion on top of existing infrastructure. Essential
      reading before promising greenfield expansion outside Europe, because it is the only
      place the method is documented at all.
  - paper: "2022_Victoria_Speed-technological-transformations_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      Transmission fixed in the baseline and co-optimised only in a sensitivity, at a 2x
      volume cap, for one carbon budget rather than the full matrix — with the result that
      grid expansion reduces cumulative cost by 2%. The realistic pattern for
      sector-coupled pathway studies, where the compute cost of co-optimising the grid
      across every horizon and budget is prohibitive.
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: routine-use
    note: >
      A +25% cap over the 2019 grid in each annual LP, with CONGESTION RENTS (the duals of
      the line constraints) extracted post-solve to identify which weather events drove
      the transmission investment. The pattern to copy when the user's question is not
      "how much" but "why there" — the dual, not the capacity, carries the diagnosis.
  - paper: "2023_Neumann_Broad-Ranges-Investment-Robust_iScience.pdf"
    tier: 1
    role: routine-use
    note: >
      Continuous reinforcement of existing AC and HVDC (>= 220 kV from the ENTSO-E
      transparency map), reinforceable but not removable, with transmission volume in TWkm
      reported as an output and used as an MGA direction. Explicitly states that "changes
      of line expansion to line impedance are ignored" — the corpus's most quotable
      admission of Exit A, from an author who elsewhere developed Exit B, which is why
      this book treats skipping the update as a defensible choice rather than an error.
  - paper: "2023_Parzen_value-competing-energy-storage-decarbonized.pdf"
    tier: 2
    role: routine-use
    note: >
      Cost-optimal grid expansion with NO volume cap stated, in a Nigerian pypsa-earth
      study — the uncapped configuration that earth's default `ll: copt` actually produces.
      Its HVDC overhead cost of 432 EUR/kW over a 40-year lifetime is a checkable anchor
      for a non-European study.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: routine-use
    note: >
      A 125% SYSTEM-WIDE cap under which individual connections may be reinforced far more
      — the model consistently builds ~4x the Ireland-UK interconnection. The concrete
      demonstration that a global volume cap is not a per-corridor limit and does not
      prevent implausible single-corridor answers; if a user cares about one corridor,
      they need a per-branch cap.
  - paper: "2024_Chanal_carbon-capture-solvent-cost-energy-system.pdf"
    tier: 2
    role: routine-use
    note: >
      A 2x volume cap on the 2022 grid with a lossy transport model, justified as
      appropriate at 37-node resolution. The resolution-dependent-formulation argument
      made explicitly rather than by default.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Onshore expansion swept at 100%, 110%, 130% and unconstrained alongside endogenous
      offshore HVDC, with a 20 GW per-line cap. The most complete set of offshore cost
      anchors in the corpus: HVDC cable 0.9 EUR/kW/km, offshore platform 480 EUR/kW,
      onshore converter 120 EUR/kW, plus a 2% constant and 2.3%/1000 km HVDC loss split.
  - paper: "2024_JRC_Future-proofing-power-market-redispatch-congestion.pdf"
    tier: 2
    role: routine-use
    note: >
      The exogenous-then-optimised pattern in its clearest form, and the only paper here
      that caps expansion PER COUNTRY: cross-border capacities first scaled to TYNDP NTC
      targets (not an optimisation), then inner-zonal AC and DC line capacity co-optimised
      subject to a country-level circuit-length budget gamma at 10%, 20% or 35%. New HVDC
      candidates in DE, PL and FR at zero initial capacity. Generation is entirely
      exogenous — a transmission-only co-optimisation, which is a legitimate and much
      cheaper study shape.
  - paper: "2025_DiBella_European-green-industrial-transformation.pdf"
    tier: 1
    role: routine-use
    note: >
      Expansion allowed with no volume cap at all, the 70% utilisation cap doing the only
      restraining — the configuration a user gets by accident if they enable expansion and
      do not think about the bound. Worth citing as the shape to check for when reviewing
      someone else's transmission number.
  - paper: "2025_Franken_Geothermal-Market-Integration.pdf"
    tier: 1
    role: routine-use
    note: >
      The decision to NOT co-optimise, documented with its reasoning: expansion prohibited
      in the base case because sensitivity runs showed a small effect and the compute
      overhead was not worth it, with +12.5% and +25% GWkm sensitivities retained as a
      check. The honest template for telling a user that this method is not worth its cost
      for their question — and note that the sensitivity is what licenses the claim.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Cost-capped rather than volume-capped, and calibrated to real plans: the bound is
      cumulative transmission INVESTMENT accumulated to 2040 under the Holistic Network
      Design, against an annual-budget cap in a "historic" counterfactual. HVDC
      interconnectors to mainland Europe fixed exogenously from the OFGEM list. The
      reference for translating a national network plan into an expansion bound.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: routine-use
    note: >
      A 125% volume cap with no-expansion and 200% sensitivities, and one practice worth
      copying verbatim: transmission is FIXED at current levels in the validation dispatch
      runs, so an adequacy assessment is not contaminated by an expansion the investment
      run chose. 90-node network.
  - paper: "2025_Hofmann_H2-CO2-Network-Strategies_NatEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Electricity expansion capped at ~20-25% while H2 and CO2 pipeline expansion is
      UNCONSTRAINED — the asymmetry that structurally determines the substitution result
      in every wires-versus-molecules study. Its own methods and discussion state 20% and
      25% respectively, a discrepancy worth noting as evidence of how loosely these caps
      are reported. Resistive losses as 95.75% efficiency per 1000 km.
  - paper: "2025_Neumann_Green-energy-steel-imports-net-zero_NatComms.pdf"
    tier: 1
    role: routine-use
    note: >
      The most fully specified per-branch cap set in the corpus — 15 GW HVAC, 25 GW HVDC,
      50.7 GW H2 pipelines — co-optimised with generation, storage and conversion, with
      dynamic line rating allowing up to 30% uplift on existing lines and utilisation
      limited to 70% of the DYNAMIC capacity. The reference for a study where the per-link
      bound, not a global volume, is the credible constraint.
  - paper: "2025_Thomassen_JRC_Locational-Price-Signals-Europe_nodal-zonal-national.pdf"
    tier: 2
    role: routine-use
    note: >
      Per-country MWkm caps at system-optimal, 40% and 20%, with cross-border capacity
      further bounded by the constrained country's own optimal level, and HVDC candidates
      from TYNDP and national plans. Determines grid expansion needs SEPARATELY for each
      market-design scenario — the correct pattern when the question is how much grid a
      market arrangement requires, since a zonal market and a nodal one need different
      networks.
  - paper: "2026_Aden_spatial-equity-decentralization-decarbonization.pdf"
    tier: 2
    role: routine-use
    note: >
      Reports AC and HVDC expansion separately as the decarbonisation target tightens: AC
      capacity rises substantially while HVDC stays roughly constant. The disaggregation to
      copy — an aggregate TWkm number hides which technology the model is actually
      choosing.
  - paper: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    tier: 1
    role: routine-use
    note: >
      A +25% MWkm cap justified by reference to the TSOs' TYNDP, binding exactly (265 TWkm
      today optimising to 332 TWkm), with "today's transmission" and "no power
      transmission" counterfactuals. A cap that binds is a cap doing the modelling, which
      is the fact to report alongside the volume.
  - paper: "2026_Odenweller_REMIND-PyPSA-Eur_ProgEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Endogenous expansion inside each single-year pypsa-eur solve of a four-node Germany,
      with approximated grid losses fed BACK into the coupled IAM's electricity balance.
      The one instance in the corpus of a co-optimised transmission result being consumed
      by another model rather than reported.
  - paper: "2026_Stoeckl_voltage-aware-grid-aggregation-european-network.pdf"
    tier: 2
    role: routine-use
    note: >
      Reinforcement-only continuous expansion where the CANDIDATE SET is derived from a
      prior dispatch run — lines and transformers loaded above 70% across all time steps
      or above 90% at least once. A cheap, defensible alternative to letting every branch
      be extendable, and the corpus's reminder that transformers are lines in a DC
      formulation and therefore expansion candidates too.
  - paper: "2026_Xiong_Projects-of-Common-Interest_ERL.pdf"
    tier: 1
    role: routine-use
    note: >
      The project-list variant applied to a policy question: TYNDP 2020 plus German NEP
      2037/2045 electricity projects enabled, with H2 and CO2 pipelines either fixed at
      the PCI list or endogenously expandable across scenarios. Notes that continuous
      (non-discretised) pipeline capacity may underestimate true costs — the integrality
      pitfall stated for carriers other than electricity.
  - paper: "2026_Zhang_E-biofuels-hard-to-electrify.pdf"
    tier: 1
    role: routine-use
    note: >
      A 1.5x volume cap on the 2022 line volume with a lossy electricity model, plus a
      sensitivity adding endogenous H2 and CO2 network expansion whose exclusion from the
      baseline is named as affecting absolute results. Another instance of the
      electricity-capped / molecules-uncapped asymmetry.
pitfalls:
  - pitfall: >
      The default run is Exit A: `skip_iterations` is TRUE in both models, so expanding
      lines does not change their impedance and the optimised flow pattern belongs to
      today's grid. The run succeeds, the numbers look reasonable, and nothing tells you
      the physics is inconsistent with the capacities you were just told to build.
    evidence: "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
    note: >
      Set skip_iterations false whenever lines are extendable AND the network is meshed AND
      corridors are Lines rather than Links — all three, because the update is pointless
      otherwise. Budget for it: iterations multiply solve count, and the pypsa defaults
      (eur max 3, earth max 6) are below the 4-5 the corpus reports as needed. On
      pypsa-earth verify the tuple defect in this card's earth section FIRST; the iterative
      branch there does not run at all.
  - pitfall: >
      A global volume cap is not a per-corridor limit. A study capped at 125% system-wide
      can and does build 4x a single interconnector, because the cap only constrains the
      length-weighted SUM. Users hear "we limited expansion to 25%" and infer a per-line
      bound that was never imposed.
    evidence: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    note: >
      If the user's question is about a specific corridor, use per-branch caps
      (lines.max_extension / links.max_extension in eur, the `l` factor grammar in earth)
      or per-country budgets, and report the per-corridor result, not only the aggregate
      TWkm.
  - pitfall: >
      The volume cap is a proxy for permitting and public acceptance, not an engineering
      or economic quantity — and when it binds, IT is doing the modelling, not the cost
      minimisation. The corpus's convergence on +25% is convention, not evidence, and it is
      inherited between papers as an unexamined assumption.
    evidence: "2026_Glaum_Minimal-Methanol-Backstop_Joule.pdf"
    note: >
      Always report whether the cap binds (check the constraint's shadow price: nonzero
      means it binds) and sweep it rather than asserting one value. The corpus's honest
      minimum is the three-point bracket — zero, a compromise level, unconstrained — with
      every other conclusion checked at all three.
  - pitfall: >
      Continuous capacities are not buildable. A 380 kV double circuit is ~1.7 GW; a
      solution proposing 0.4 of one is an artefact of the relaxation, and the aggregate
      TWkm hides it. Rounding after the fact without re-optimising generation gives a
      network that does not serve the dispatch the model just costed.
    evidence: "2019_Neumann_Heuristics-Transmission-Expansion_EEM.pdf"
    note: >
      Use post-discretization (eur, iterative mode only) or its published recipe: round at
      threshold z = 0.3 of the unit size, then re-optimise generation with line capacities
      FIXED. Expect a cost deviation, and quote the benchmarked bound — under 1.5% against
      an exact MILP for the full heuristic combination.
  - pitfall: >
      More transmission is not more robust. If the added capacity is absorbed by economic
      dispatch it increases long-distance transfers and can amplify structural imbalance —
      so a cost-optimal expansion plan cannot be presented as a resilience or security
      measure, which is exactly how a user is likely to hear it.
    evidence: "2026_Titz_Cascading-Failures-Critical-Infrastructures.pdf"
    note: >
      Separate the two questions. If resilience is the goal, reinforcement must be sized
      against a stability criterion with the added margin RESERVED and unavailable to
      dispatch — a different problem, and cheap in the cited study (12 lines, ~0.14 bn
      EUR/yr). Never let a cost-optimal MWkm number answer a security question.
  - pitfall: >
      The MWkm the model wants is a function of the spatial clustering, not only of the
      scenario. Clustering absorbs intra-cluster corridors into a single bus, so a coarse
      network needs less "transmission" by construction while hiding congestion inside its
      buses. Cross-study MWkm comparisons at different bus counts are close to meaningless.
    evidence: "2021_Frysztacki_Network-resolution-wind-solar_ApplEnergy.pdf"
    note: >
      Always state the bus count next to the volume, and never compare a 37-node result to
      a 1024-node one. Pair this card with spatial-clustering-and-resolution before
      promising an absolute expansion number.
  - pitfall: >
      Reported MWkm depends on three conventions that vary silently between papers: the
      security derating (0.7 vs 0.67), the length detour factor (typically +25%), and
      whether the number is total volume or ADDED volume. A "150% of today" cap means
      different things depending on which.
    evidence: "2019_Victoria_Storage-technologies-decarbonisation_EnConvMgmt.pdf"
    note: >
      In both models the cap is a multiple of TOTAL existing volume (factor * ref, with
      s_nom_min pinned to today's), so `v1.25` allows 25% ADDED, not 25% total. State the
      derating and the length factor with every volume number you report.
  - pitfall: >
      The formulation changes the expansion answer, not just its runtime: a lossy model
      builds 20% less reinforcement than a transport model on the same system, because a
      transport model lets power route freely and ignores the cost of moving it far.
      Choosing the cheap formulation biases the answer toward more transmission.
    evidence: "2022_Neumann_Linear-power-flow-transmission-loss_ApplEnergy.pdf"
    note: >
      For a study whose deliverable IS the transmission number, enable losses (eur:
      solving.options.transmission_losses, on by default at 2 tangents; earth: absent, see
      that section). If a transport model is used for tractability, say that the expansion
      number is an upper bound.
requires_methods:
