pypsa_primitive:
  symbol: "pypsa/optimization/abstract.py:optimize_transmission_expansion_iteratively"
  pypsa_version: "0.30.3"
  exposed_by: "both — each model's solve_network calls it in the not-skip_iterations branch"
  reachable_via: >
    Already reached: solving.options.skip_iterations false routes the solve through it in
    both workflows. Signature at 0.30.3:
    optimize_transmission_expansion_iteratively(n, snapshots=None, msq_threshold=0.05,
    min_iterations=1, max_iterations=100, track_iterations=False, line_unit_size=None,
    link_unit_size=None, line_threshold=None, link_threshold=None,
    fractional_last_unit_size=False, **kwargs). Note the library defaults differ from both
    models' config defaults. Two behaviours are worth knowing because neither model
    documents them: (1) update_line_params rescales x (AC) and r (DC) ONLY for extendable
    lines with an empty `type`; typed lines are updated through num_parallel = s_nom_opt /
    base_s_nom instead, so a network built from standard line types takes the second path.
    (2) After the loop it always performs a FINAL solve with branch capacities fixed and
    extendability off — which is exactly Neumann 2019's step C, and is where
    discretize_branch_components (pypsa/optimization/abstract.py:discretized_capacity)
    applies the unit-size rounding. The global bound itself is a separate primitive pair,
    define_transmission_volume_expansion_limit and define_transmission_expansion_cost_limit
    in pypsa/optimization/global_constraints.py, triggered by a GlobalConstraint component
    with type transmission_volume_expansion_limit or transmission_expansion_cost_limit.
  note: >
    Unusually for this book, the hard part of the method is NOT missing one layer down —
    both the SLP loop and the post-discretization it wraps are library code, and both
    models call them. What is absent from pypsa entirely is Exit C: there is no binary
    line-investment variable, no big-M disjunctive KVL, and no candidate-line combinatorics
    for joining synchronous zones. Neumann 2020 implemented those on a pypsa fork
    (pypsa/tree/tep-v2) that was never merged, so exact MILP TEP is L5 against the library,
    not just against the workflows. Soft anchor: pypsa is a conda dependency, pinned to a
    version string rather than a SHA.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: transmission-expansion-limits
        role: >
          the method's main switch: electricity.transmission_limit makes lines and DC links
          extendable and imposes the global volume ('v') or cost ('c') bound. Registry
          status `working`; note the `ll` WILDCARD IS GONE at this ref — it is a config key,
          or an lv/lc token in the {opts} wildcard
      - id: iterative-impedance-expansion
        role: >
          Exit B, the SLP impedance update. `working` but skipped by default, and
          auto-skipped when no line is extendable
      - id: post-discretization
        role: >
          Exit C's cheap substitute: rounds continuous expansion to unit sizes between SLP
          iterations. Registry status `partial` for one reason — it is only read in the
          iterative branch, so it silently does nothing at defaults
      - id: transmission-projects
        role: >
          the explicit-project-lists variant, and the ONLY way to add new topology in eur:
          TYNDP2020, German NEP and manual candidate lines/links filtered by permitting
          status. Earth has no equivalent id at all
      - id: line-security-margin
        role: >
          the 0.7 derating the expansion decision is made against — it scales the MWkm the
          model must buy for the same flow
      - id: transmission-losses
        role: >
          on by default at 2 tangents, and load-bearing for the ANSWER: a lossy model
          builds ~20% less reinforcement than a transport model. Earth's registry has no
          such id
      - id: dynamic-line-rating
        role: >
          the alternative to expansion — up to ~30% more capacity on existing lines from
          weather, used exactly that way in Neumann 2025. Off by default; earth lacks it
      - id: contingency-scopf
        role: >
          registry status `absent`: expansion is sized against the uniform 0.7 proxy, never
          against real contingencies, which is what the Titz critique is about
      - id: solver-choice
        role: >
          where the method's cost is actually paid; the barrier/PDLP profiles are what make
          a meshed co-optimised expansion LP finish
      - id: interconnection-queues
        role: >
          registry status `absent` for GENERATORS, but its note records that the
          transmission side IS covered by transmission-projects — the distinction to make
          when a user asks about project pipelines
    available:
      verdict: assemble
      how: >
        Every surface exists and the default run already co-optimises: electricity.
        transmission_limit: vopt makes lines and DC links extendable with s_nom_min pinned
        to today's capacity, set_transmission_costs prices them per MWkm with HVDC carrying
        converter-pair costs, set_line_nom_max bounds each branch via lines/links.
        max_extension, and transmission_projects adds TYNDP2020/NEP candidates by
        permitting status. It is `assemble` rather than `turnkey` because the DEFAULTS give
        you the least defensible member of the family — unconstrained expansion (vopt) with
        fixed impedances (skip_iterations true) and fractional circuits (post_discretization
        off) — and because the three settings that make it defensible interact: post-
        discretization is read ONLY in the iterative branch, so enabling it without setting
        skip_iterations false is a silent no-op. Wiring the volume cap, the impedance loop
        and the discretization together correctly is the assembly below.
      missing: >
        Procedure step 5's Exit C has no handle: no binary line-investment variable, no
        big-M disjunctive KVL, no synchronous-zone connection combinatorics — Neumann 2020
        built those on an unmerged pypsa fork. Step 10's cap sweep has no handle either;
        the {opts} lv/lc token plus run.scenarios can fan it out, but nothing assembles the
        cost-benefit curve or locates its knee, and no rule reports the cap's shadow price
        as EUR/MWkm. Also absent: any per-country or per-zone volume budget (the cap is
        global or per-branch, never regional, so the JRC/Thomassen designs are code work),
        and any ex-post check that the impedance loop converged rather than hit
        max_iterations — track_iterations records the trace but nothing reads it.
      provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/solve_network.py:collect_kwargs; scripts/prepare_network.py:set_line_nom_max"
    levers:
      - key: "electricity.transmission_limit"
        effect: >
          THE switch. First character is the metric — 'v' = length-weighted volume (MWkm),
          'c' = capital cost; the rest is 'opt' (unbounded, cost decides) or a float > 1.0
          as a multiple of TODAY'S TOTAL. So v1.25 allows 25% ADDED volume, and v1.0 fixes
          the grid (nothing is made extendable, which also makes skip_iterations moot). The
          metric choice is not cosmetic: 'v' weights by length only, while 'c' uses
          capital_cost and therefore distinguishes overhead from submarine sections and
          includes HVDC converter pairs — a cost cap steers toward cheap onshore corridors
          where a volume cap is indifferent. Overridable per-run by an lv<f>/lc<f> token in
          the {opts} wildcard.
        default: "'vopt' (unbounded, cost-optimal expansion)"
        provenance: "config/config.default.yaml:transmission_limit; scripts/prepare_network.py:set_transmission_limit; scripts/_helpers.py:update_config_from_wildcards"
      - key: "solving.options.skip_iterations"
        effect: >
          true = one LP with today's impedances (Exit A); false = the SLP loop that updates
          x and r from the optimised capacities (Exit B) and finishes with a
          capacities-fixed generation-only pass. Auto-forced true when no line is
          extendable, so setting it false is safe as a standing policy for expansion
          studies. This is also the gate on post_discretization.
        default: "true"
        provenance: "config/config.default.yaml:skip_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: "solving.options.max_iterations"
        effect: >
          Cap on the SLP loop. The binding cost control, and the default is below what the
          corpus reports as needed (4-5 typical, 274 in the worst case), so a converged run
          is not the default outcome.
        default: "3"
        provenance: "config/config.default.yaml:max_iterations; scripts/solve_network.py:collect_kwargs"
      - key: "solving.options.min_iterations"
        effect: >
          Floor on the SLP loop regardless of the mean-square convergence threshold. Note
          pypsa's msq_threshold (0.05) is NOT exposed as a config key in either model — the
          convergence criterion itself is not tunable from config.
        default: "2"
        provenance: "config/config.default.yaml:min_iterations; scripts/solve_network.py:collect_kwargs"
      - key: "solving.options.track_iterations"
        effect: >
          Records branch capacities and the objective at every SLP iteration onto the
          network (s_nom_opt_0, s_nom_opt_1, ... and objective_N). The only way to tell a
          converged impedance loop from one that hit max_iterations — which the corpus's
          reported 274-iteration case shows is a real distinction.
        default: "false"
        provenance: "config/config.default.yaml:track_iterations; scripts/solve_network.py:collect_kwargs"
      - key: "solving.options.post_discretization.enable"
        effect: >
          Rounds line and link expansion to integer unit sizes between SLP iterations and in
          the final fixed pass — the shipped version of Neumann 2019's step C. READ ONLY IN
          THE ITERATIVE BRANCH: collect_kwargs merges it in mode='iterative' only, so with
          skip_iterations left at its default true this key does nothing and no warning is
          emitted.
        default: "false"
        provenance: "config/config.default.yaml:post_discretization; scripts/solve_network.py:post_discretization"
      - key: "solving.options.post_discretization.line_unit_size"
        effect: >
          MW per discrete line unit — one 380 kV double circuit. Matches the ~1.7 GW
          candidate line of Neumann 2020, so the shipped default is the literature value.
        default: "1700"
        provenance: "config/config.default.yaml:line_unit_size; scripts/solve_network.py:post_discretization"
      - key: "solving.options.post_discretization.line_threshold"
        effect: >
          Fractional remainder above which a partial unit is rounded UP. 0.3 is exactly the
          z = 0.3 of the defining heuristic, whose benchmark reports <= 1.5% cost deviation
          against an exact MILP.
        default: "0.3"
        provenance: "config/config.default.yaml:line_threshold; scripts/solve_network.py:post_discretization"
      - key: "solving.options.post_discretization.link_unit_size"
        effect: >
          Per-carrier discrete unit sizes for links — DC 2000 MW, H2 pipeline 1200 MW, gas
          pipeline 1500 MW — which is how the integrality question extends to the
          non-electric carriers Xiong 2026 flags as under-costed when left continuous.
        default: "{DC: 2000, H2 pipeline: 1200, gas pipeline: 1500}"
        provenance: "config/config.default.yaml:link_unit_size; scripts/solve_network.py:post_discretization"
      - key: "lines.max_extension"
        effect: >
          PER-BRANCH cap in MW: set_line_nom_max sets s_nom_max = s_nom + max_extension.
          The answer to the global-cap-is-not-a-per-corridor-limit pitfall, and the way to
          reproduce Neumann 2022's max(2x, +5 GW) style bounds. Also load-bearing for
          losses, which require finite s_nom_max on extendable branches.
        default: "20000"
        provenance: "config/config.default.yaml:max_extension; scripts/prepare_network.py:set_line_nom_max"
      - key: "links.max_extension"
        effect: >
          Same per-branch cap for DC links (p_nom_max = p_nom + max_extension), applied only
          to carrier == 'DC'. The lever for the corpus's per-HVDC-corridor limits — 20 GW in
          Neumann 2022, 25 GW in Neumann 2025, 30 GW in Neumann 2020.
        default: "30000"
        provenance: "config/config.default.yaml:max_extension; scripts/prepare_network.py:set_line_nom_max"
      - key: "lines.s_max_pu"
        effect: >
          The static N-1 derating the expansion is sized against. 0.7 across the corpus;
          raising it to 1.0 reduces the MWkm the model must buy for the same flow, so it is
          not a cosmetic setting when the deliverable is a transmission number.
        default: "0.7"
        provenance: "config/config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "lines.length_factor"
        effect: >
          Detour markup on crow-fly length (+25%, the corpus convention) feeding both the
          capital cost and the volume the cap counts. BUT see the pitfall below and the
          `where` entry: prepare_network re-derives line capex through set_transmission_costs
          with the DEFAULT factor of 1.0, discarding this scaling.
        default: "1.25"
        provenance: "config/config.default.yaml:length_factor; scripts/add_electricity.py:set_transmission_costs"
      - key: "links.length_factor"
        effect: >
          The same detour markup for DC links, and subject to the same silent overwrite in
          prepare_network.
        default: "1.25"
        provenance: "config/config.default.yaml:length_factor; scripts/add_electricity.py:set_transmission_costs"
      - key: "transmission_projects.enable"
        effect: >
          Turns on the candidate-project pipeline — the only route to NEW topology in eur.
          Adds new buses, lines and links, and applies capacity adjustments to existing ones,
          from prepared csv files.
        default: "true"
        provenance: "config/config.default.yaml:transmission_projects; scripts/add_transmission_projects_and_dlr.py:attach_transmission_projects"
      - key: "transmission_projects.include"
        effect: >
          Which project sets to draw candidates from: tyndp2020, nep (German NEP) and manual.
          Selecting these is what turns "the model wants 40 GW somewhere" into "these named
          projects are in the cost-optimal set" — the Xiong 2026 / Lindner 2025 study shape.
        default: "{tyndp2020: true, nep: true, manual: true}"
        provenance: "config/config.default.yaml:transmission_projects; scripts/build_transmission_projects.py:add_projects"
      - key: "transmission_projects.status"
        effect: >
          Permitting-status filter on candidates (under_construction, in_permitting,
          confirmed). The lever for a policy question about whether a project pipeline
          delivers: tighten to under_construction for a pessimistic pipeline.
        default: "['under_construction', 'in_permitting', 'confirmed']"
        provenance: "config/config.default.yaml:transmission_projects; scripts/build_transmission_projects.py:add_projects"
      - key: "transmission_projects.new_link_capacity"
        effect: >
          'zero' starts new (non-upgraded) DC candidates at 0 MW so the model must pay to
          build them — the honest candidate treatment, and the Glaum 2023 / JRC 2024 design.
          'keep' starts them at their planned capacity, which asserts the project rather
          than testing it.
        default: "'zero'"
        provenance: "config/config.default.yaml:new_link_capacity; scripts/build_transmission_projects.py:add_projects"
      - key: "lines.dynamic_line_rating.activate"
        effect: >
          Weather-dependent per-line s_max_pu from the cutout — the alternative to building,
          used exactly that way in Neumann 2025 (up to ~30% uplift on existing lines with
          utilisation then limited to 70% of the DYNAMIC capacity). Offer this before an
          expansion study when the user's real constraint is permitting.
        default: "false"
        provenance: "config/config.default.yaml:dynamic_line_rating; scripts/build_line_rating.py:calculate_line_rating"
      - key: "solving.options.transmission_losses"
        effect: >
          Tangent count for the piecewise-linear loss envelope; false disables. Load-bearing
          for THIS method rather than only for the formulation: a lossless/transport model
          builds ~20% more reinforcement. Requires finite s_nom_max, which lines.
          max_extension supplies.
        default: "2"
        provenance: "config/config.default.yaml:transmission_losses; scripts/solve_network.py:collect_kwargs"
    assembly:
      - step: >
          Pick the bound and its metric FIRST, because it determines what the rest of the
          study means. electricity.transmission_limit: vopt for the unconstrained pole,
          v1.0 to fix the grid (nothing becomes extendable), v1.25 for the corpus's default
          +25% MWkm, c1.25 for a cost cap that prices submarine sections and converter
          pairs. The volume constraint lands as a GlobalConstraint of type
          transmission_volume_expansion_limit (or ..._cost_limit) whose RHS is factor * the
          reference volume of the CURRENT grid.
        uses: [transmission-expansion-limits]
        config: "electricity.transmission_limit; or an lv<f>/lc<f> token in {opts}"
        code: null
        provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/_helpers.py:update_config_from_wildcards"
      - step: >
          Add per-branch caps alongside the global one — this is the step people skip, and
          it is what stops a 125%-capped study from building 4x a single interconnector.
          lines.max_extension and links.max_extension are added to today's capacity by
          set_line_nom_max, so they express the corpus's "+5 GW" or "20 GW per HVDC link"
          bounds directly. Keep them FINITE: the default loss constraints raise on an
          infinite s_nom_max for an extendable branch.
        uses: [transmission-expansion-limits, transmission-losses]
        config: "lines.max_extension; links.max_extension"
        code: null
        provenance: "scripts/prepare_network.py:set_line_nom_max"
      - step: >
          Decide the candidate set. Reinforcement-only is the default. For new topology,
          transmission_projects.include selects TYNDP2020/NEP/manual sets and .status
          filters by permitting; set .new_link_capacity to 'zero' so a candidate must be
          bought rather than assumed. There is no algorithmic candidate generation here —
          if the region has no project list and a sparse grid, that is earth's
          k-edge-augmentation territory, or L5 work.
        uses: [transmission-projects]
        config: "transmission_projects.{enable,include,status,new_link_capacity}"
        code: null
        provenance: "scripts/build_transmission_projects.py:add_projects; scripts/add_transmission_projects_and_dlr.py:attach_transmission_projects"
      - step: >
          Turn on Exit B and make it verifiable: skip_iterations false, max_iterations well
          above the default 3 (the corpus needs 4-5, sometimes far more), and
          track_iterations true so the per-iteration capacities and objectives land on the
          network. Without track_iterations you cannot distinguish convergence from hitting
          the cap, and the run reports success either way.
        uses: [iterative-impedance-expansion]
        config: "solving.options.{skip_iterations,min_iterations,max_iterations,track_iterations}"
        code: null
        provenance: "scripts/solve_network.py:collect_kwargs; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - step: >
          Only NOW enable post_discretization, and only if the previous step set
          skip_iterations false — collect_kwargs merges the post_discretization block in
          mode='iterative' exclusively, so the enable flag is a silent no-op in single-pass
          mode. The shipped defaults already encode the literature (1700 MW line unit,
          threshold 0.3); pypsa's final fixed-capacity pass supplies the generation-only
          re-optimisation the heuristic requires.
        uses: [post-discretization, iterative-impedance-expansion]
        config: "solving.options.post_discretization.{enable,line_unit_size,line_threshold,link_unit_size,link_threshold}"
        code: null
        provenance: "scripts/solve_network.py:post_discretization"
      - step: >
          Repair the length-factor overwrite if the cost of transmission is load-bearing for
          the answer. set_transmission_limit calls set_transmission_costs(n, costs) with no
          length factors, so line and link capital_cost are recomputed at factor 1.0,
          discarding the +25% detour markup add_electricity applied. prepare_network's rule
          does not even pass lines.length_factor as a param. Either add the two params and
          forward them, or set costs so the markup is already inside the per-MWkm figure —
          and note that a 'c' cost cap is computed from these same capital_costs, so the
          bound moves with the bug.
        uses: [transmission-expansion-limits, cost-data-pipeline]
        config: "lines.length_factor; links.length_factor"
        code: "scripts/prepare_network.py — the set_transmission_costs call inside set_transmission_limit"
        provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/add_electricity.py:set_transmission_costs"
      - step: >
          Fan the cap out into a SWEEP, which is the actual deliverable. Two routes: the
          lv<f>/lc<f> token in the {opts} wildcard, which is already a wildcard so the
          expansion is free, or run.scenarios for a managed matrix. Nothing then assembles
          the cost-benefit curve — collect total system cost and volume per run in
          make_summary and locate the knee yourself.
        uses: [scenario-matrix, summary-outputs]
        config: "{opts} lv/lc tokens, or run.scenarios.{enable,file}"
        code: "scripts/make_summary.py"
        provenance: "scripts/_helpers.py:update_config_from_wildcards; scripts/make_summary.py:calculate_capacities"
      - step: >
          Report the cap's SHADOW PRICE, the corpus's most decision-relevant output, which
          no rule extracts. It is the dual of the GlobalConstraint named lv_limit / lc_limit
          on the solved network (n.global_constraints.mu, renamed mu_<iteration> when
          track_iterations is on) and is read as the maximum EUR/MWkm at which further
          expansion still pays — directly comparable to a real project cost. Nonzero also
          tells you the cap BINDS, i.e. that it, not the cost minimisation, produced the
          number.
        uses: [summary-outputs]
        config: "solving.options.assign_all_duals (for completeness of the dual set)"
        code: "new extraction; nearest anchor is scripts/make_summary.py"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - step: >
          Offer dynamic line rating as the alternative to building. Neumann 2025's design —
          up to 30% weather-driven uplift on existing lines, utilisation then capped at 70%
          of the dynamic rating — often answers the user's real question (more throughput
          without permitting) at a fraction of the expansion capex. It needs a cutout, so
          it is region-dependent.
        uses: [dynamic-line-rating, line-security-margin]
        config: "lines.dynamic_line_rating.{activate,cutout,correction_factor,max_line_rating}"
        code: null
        provenance: "scripts/build_line_rating.py:calculate_line_rating; scripts/add_transmission_projects_and_dlr.py:attach_line_rating"
    boundary:
      - variant: continuous-capacity-expansion
        rung: L0
        note: >
          The shipped default. electricity.transmission_limit: vopt already makes lines and
          DC links extendable with s_nom_min at today's capacity, priced per MWkm, bounded
          per-branch by max_extension. Nothing to do — which is precisely why it is the
          variant users get without choosing it.
      - variant: volume-cap
        rung: L0
        note: >
          One value: transmission_limit: v1.25 (or an lv1.25 token in {opts}). The whole
          grammar is in the string — 'v' plus a multiple of today's total length-weighted
          volume, so v1.25 permits 25% ADDED. v1.0 fixes the grid entirely.
      - variant: cost-cap
        rung: L0
        note: >
          transmission_limit: c1.25. Same mechanism, capital_cost as the metric, so
          submarine fractions and HVDC converter pairs are priced in. Confirm the
          length-factor repair first — the cost cap's RHS is computed from the same
          capital_cost that set_transmission_costs silently rescales.
      - variant: iterative-impedance-update
        rung: L1
        note: >
          Config exists and is fully wired, but every default is the wrong value: skip_
          iterations true, max_iterations 3 against a corpus norm of 4-5, track_iterations
          false. L1 for the specific non-default combination, and the compute consequence is
          multiplicative. msq_threshold is not exposed at all, so the convergence criterion
          itself is fixed at pypsa's 0.05.
      - variant: discrete-line-additions
        rung: L1
        note: >
          The post-discretization heuristic (Neumann 2019's step C) is L1: enable it AND set
          skip_iterations false, since collect_kwargs only merges the block in iterative
          mode. Defaults already match the literature (1700 MW, z = 0.3). The EXACT big-M
          MILP of Neumann 2020 is a different story and is L5 — no binary line-investment
          variable exists in pypsa 0.30.3, and the fork that had one was never merged.
      - variant: explicit-project-lists
        rung: L1
        note: >
          transmission_projects is on by default; the study is in the non-default values —
          which sets to include, which permitting statuses to accept, and new_link_capacity
          'zero' so candidates must be bought. L3 rather than L1 if the user's projects are
          not in the shipped TYNDP2020/NEP/manual data and a candidate csv must be authored.
      - variant: exogenous-then-optimised
        rung: L1
        note: >
          Reachable as a pair of runs at different caps, or as a myopic pathway with
          transmission fixed to plan values in early horizons — foresight: myopic is working
          here. L4 for the JRC/Thomassen shape, where the budget is PER COUNTRY: no
          per-region volume constraint exists, so it needs a new GlobalConstraint per
          country plus rule plumbing.
      - variant: candidate-set-augmentation
        rung: L5
        note: >
          Absent. Nothing generates candidate corridors algorithmically — the registry has
          no id for it on the eur side, and transmission_projects only reads prepared
          project files. Writing it means a new script producing candidate Line/Link rows
          plus a rule, i.e. the earth capability ported. This is the one place earth is
          straightforwardly ahead, and it matters exactly where eur is weakest: sparse or
          radial networks with no project pipeline.
    where:
      - change: "exact big-M MILP TEP with binary line investment (Exit C)"
        anchor: "solving.options.custom_extra_functionality -> the user module's entry function; new binary variables and disjunctive KVL in linopy"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
      - change: "per-country / per-region expansion budget instead of a global cap"
        anchor: "scripts/prepare_network.py:set_transmission_limit — add GlobalConstraint rows per region, or an extra_functionality constraint"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - change: "algorithmic candidate-corridor generation (greenfield / augmentation)"
        anchor: "new script + rule producing candidate rows; nearest existing anchor is attach_transmission_projects, which consumes csvs of new lines/links"
        provenance: "scripts/add_transmission_projects_and_dlr.py:attach_transmission_projects"
      - change: "stop set_transmission_costs discarding the length_factor markup"
        anchor: "scripts/prepare_network.py:set_transmission_limit (its set_transmission_costs call takes no length factors, and rule prepare_network passes none)"
        provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/add_electricity.py:set_transmission_costs"
      - change: "extract the volume/cost cap shadow price as EUR/MWkm"
        anchor: "the GlobalConstraint named lv_limit / lc_limit on the solved network; report alongside scripts/make_summary.py outputs"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - change: "assemble the cap sweep into a cost-benefit curve and find its knee"
        anchor: "scripts/make_summary.py over runs expanded by the {opts} lv/lc token"
        provenance: "scripts/make_summary.py:calculate_capacities"
    cost_profile:
      solves: >
        1 for the default single-pass LP. With Exit B: min_iterations to max_iterations
        full expansion LPs plus one final fixed-capacity generation-only solve — so 3-4 at
        eur's defaults, 5-6 at the corpus norm, and the reported worst case is 274. With
        post-discretization the count is unchanged (rounding happens inside the loop) but
        each later solve is smaller because branches get fixed. A cap sweep multiplies all
        of it by the number of cap points, typically 5-10.
      relative: >
        Exit A is free — the co-optimised LP is the same LP, just with more variables (one
        s_nom per branch). Exit B costs 3-6x a single solve. A 6-point cap sweep with Exit B
        is ~20-35x. The exact MILP is a different regime entirely: Neumann 2020 needed a
        6-hour wall-time limit at 1% MIP gap for 250-1000 nodes at 1-75 snapshots, and
        Neumann 2019 gave its exact benchmark 72 hours.
      note: >
        The expansion variables themselves are cheap; what makes this method expensive is
        the ITERATIONS and the SWEEP, both multiplicative. Two mitigations are L0/L1 here
        and both are used by the corpus: coarsen time (clustering.temporal.resolution_elec,
        or tsam segmentation — Neumann 2019 ran 100-400 snapshots for exactly this reason)
        and reduce clusters. A third is formulation-level and cheap: the cycle/Kirchhoff
        encoding pypsa builds unconditionally is up to 213x faster than the angle form for
        joint expansion specifically, so a slow co-optimised run is not a candidate for
        reformulation — it is a candidate for fewer snapshots.
    verifies:
      - variant: volume-cap
        check: "abs((n.lines.s_nom_opt * n.lines.length).sum() + (n.links.query(\"carrier == 'DC'\").eval('p_nom_opt * length')).sum() - rhs) <= 1e-6 * rhs or (n.lines.s_nom_opt * n.lines.length).sum() <= rhs + 1e-6"
        over: run
        note: >
          The length-weighted total must not exceed the GlobalConstraint's constant. Failure
          means the cap was declared but never bound into the LP — the classic silent
          failure when the constraint type string does not match the one pypsa queries for,
          in which case the run succeeds and reports an unconstrained expansion under a
          capped label.
      - variant: continuous-capacity-expansion
        check: "n.lines.s_nom_extendable.any() and (n.lines.s_nom_min >= n.lines.s_nom - 1e-6).all()"
        over: run
        note: >
          Nothing is extendable means transmission_limit was 'v1.0' or a value <= 1.0 and
          the study silently answered a fixed-grid question. s_nom_min below today's
          capacity means existing grid can be REMOVED, which no paper in this corpus
          intends.
      - variant: iterative-impedance-update
        check: "hasattr(n, 'objective_2') and n.iteration >= 2"
        over: run
        note: >
          Requires track_iterations. Absent iteration attributes mean the solve took the
          single-pass branch — either skip_iterations was left true, or no line was
          extendable and pypsa auto-skipped, so the impedances never moved and the reported
          flow pattern belongs to today's grid.
      - variant: discrete-line-additions
        check: "((n.lines.s_nom_opt % 1700) < 1e-6).all() or ((n.lines.s_nom_opt % 1700) > 1700 - 1e-6).all()"
        over: run
        note: >
          Capacities not on the unit grid mean post_discretization did not fire — almost
          always because skip_iterations was left at its default true, so the block was
          never merged into the kwargs. The run succeeds and returns fractional circuits.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: transmission-expansion-limits
        role: >
          the method's switch, but reached through the `ll` WILDCARD rather than a config
          key — the structural difference from eur, and it buys a free sweep dimension
      - id: augmented-line-connection
        role: >
          earth's genuine advantage and the only implementation of candidate-set
          augmentation in either model: k-edge augmentation over the graph complement
          generates candidate corridors where there is nothing to reinforce. Registry status
          `partial`, off by default
      - id: iterative-impedance-expansion
        role: >
          Exit B. Registry says `working`, and the config keys exist and are read — but the
          branch is defective at this ref (see available.missing), so treat the registry
          status as optimistic
      - id: hvdc-as-lines
        role: >
          decides whether DC corridors are Lines (KVL applies, so the impedance
          nonconvexity is real for them) or Links (transport, no KVL) — a config key with no
          eur equivalent, and it determines whether Exit B matters for the DC layer at all
      - id: line-security-margin
        role: "the same 0.7 derating the expansion is sized against; identical surface to eur"
      - id: contingency-scopf
        role: >
          registry status `absent`, as in eur — expansion is never sized against real
          contingencies
      - id: spatial-clustering
        role: >
          load-bearing here in a way it is not in eur: after clustering, many earth regions
          are radial, and on a radial network there are no cycles, so the impedance
          nonconvexity vanishes and Exit A is exactly correct
      - id: solver-choice
        role: >
          HiGHS-capable, and earth base cases are small (10-54 nodes in the reference paper),
          which is what makes the multiplicative cost of Exit B and a cap sweep affordable
          here
      - id: summary-outputs
        role: >
          where a cap sweep's cost-benefit curve is assembled; the make_summary rule already
          accepts an `all`/`vall`/`call` ll wildcard that expands over the configured ll list
    available:
      verdict: assemble
      how: >
        The core co-optimisation works and is reached differently from eur: the `ll` wildcard
        (regex (v|c|l)([0-9.]+|opt|all)|all) carries the bound, so every cap point is a
        separate output path and a sweep costs no extra plumbing — make_summary even accepts
        `vall`/`call` to aggregate across the configured ll list, which is the volume-cap
        sweep of Schlachtberger 2017 as a first-class wildcard. set_transmission_limit is
        near-identical to eur's, and earth adds a THIRD metric eur lacks: ll_type 'l' sets a
        per-line multiplier (s_nom_max = s_nom * factor, p_nom_max likewise) instead of a
        global constraint, which is the per-corridor bound eur can only express through
        max_extension. Earth's other real advantage is upstream: augmented_line_connection
        generates candidate corridors by k-edge augmentation, the only algorithmic candidate
        generation in either model, and the only way to get expansion on a network with
        nothing to reinforce.
      missing: >
        Four gaps, one of them fatal to a variant. (1) THE ITERATIVE BRANCH DOES NOT RUN.
        solve_network wraps its three SLP settings in 1-tuples via trailing commas —
        kwargs["track_iterations"] = (cf_solving.get("track_iterations", False),) and
        likewise min_iterations and max_iterations — and pypsa's loop body opens with
        `if iteration > max_iterations`, comparing int to tuple, which raises TypeError
        before the first solve. So skip_iterations: false is not a slow path here, it is a
        crash: Exit B is unavailable until three commas are deleted. (2) No discretization
        surface at all — no post_discretization key, no line_unit_size, nothing; `post-
        discretization` is absent from earth's registry, so Exit C's cheap substitute is
        code work. (3) No transmission project pipeline and no dynamic line rating — both
        `transmission-projects` and `dynamic-line-rating` are absent from earth's registry,
        so explicit-project-lists has no handle and there is no non-build alternative to
        offer. (4) No transmission losses (see linearised-optimal-power-flow), which biases
        earth toward MORE reinforcement exactly where distances are longest. Also: lines.
        s_nom_max defaults to inf and there is no lines.max_extension, so the default
        expansion is per-branch unbounded.
      provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/solve_network.py:optimize_transmission_expansion_iteratively; scripts/augmented_line_connections.py:haversine"
    levers:
      - key: "scenario.ll"
        effect: >
          THE switch, and a wildcard rather than a config key — the grammar is
          (v|c|l)(<float>|opt|all). 'v' = length-weighted volume, 'c' = capital cost, and
          'l' = a PER-LINE multiplier with no eur equivalent (s_nom_max = s_nom * factor,
          applied to every line and DC link, no global constraint added). 'opt' means
          unbounded. Because it is a wildcard, a list here IS the cap sweep. TRAP: 'lopt'
          passes the wildcard regex but crashes — the 'l' branch does float(factor)
          unconditionally, so float("opt") raises. Only vopt/copt are valid unbounded
          values, and the registry's surface line listing "lopt/copt" is wrong on that
          point.
        default: "['copt'] — a COST metric, unbounded; note eur's default is volume-based"
        provenance: "config.default.yaml:ll; scripts/prepare_network.py:set_transmission_limit"
      - key: "lines.s_nom_max"
        effect: >
          Global ceiling on line capacity, clipped onto s_nom_max after the bound is
          applied. inf by default, and earth has no lines.max_extension, so unless this is
          set the default expansion has NO per-branch limit — the 4x-single-interconnector
          failure mode is unguarded here. Also the precondition for ever adding losses.
        default: "inf"
        provenance: "config.default.yaml:s_nom_max; scripts/prepare_network.py:set_line_nom_max"
      - key: "links.p_nom_max"
        effect: "Same global ceiling for links, clipped by set_line_nom_max. inf by default."
        default: "inf"
        provenance: "config.default.yaml:p_nom_max; scripts/prepare_network.py:set_line_nom_max"
      - key: "lines.s_max_pu"
        effect: >
          The 0.7 static N-1 derating the expansion is sized against; identical surface and
          identical consumer name to eur.
        default: "0.7"
        provenance: "config.default.yaml:s_max_pu; scripts/prepare_network.py:set_line_s_max_pu"
      - key: "lines.length_factor"
        effect: >
          Detour markup (+25%) on crow-fly length feeding capital cost. Subject to the SAME
          silent overwrite as eur: set_transmission_limit calls update_transmission_costs(n,
          costs) with the default length_factor of 1.0, and rule prepare_network does not
          pass one — so the markup add_electricity applied is discarded, and with earth's
          default cost cap the BOUND itself moves with it.
        default: "1.25"
        provenance: "config.default.yaml:length_factor; scripts/add_electricity.py:update_transmission_costs"
      - key: "electricity.hvdc_as_lines"
        effect: >
          false = HVDC corridors are Links (transport model, no KVL, so no impedance
          nonconvexity on the DC layer); true = Lines pulled into cycle KVL weighted by
          resistance. No eur equivalent. Decide it before enabling Exit B, because with the
          default it only affects the AC layer.
        default: "false"
        provenance: "config.default.yaml:hvdc_as_lines; scripts/base_network.py:hvdc_as_lines"
      - key: "solving.options.skip_iterations"
        effect: >
          true = single LP with today's impedances; false = the SLP loop, WHICH RAISES
          TypeError at this ref because of the 1-tuple kwargs. Auto-forced true when no line
          is extendable, which is why the defect has gone unnoticed — the default config
          never reaches the broken branch.
        default: "true"
        provenance: "config.default.yaml:skip_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: "solving.options.min_iterations"
        effect: >
          Floor on the SLP loop; default 4 against eur's 2, which is closer to the corpus
          norm — but the value is wrapped in a 1-tuple before it reaches pypsa, so it does
          not take effect.
        default: "4"
        provenance: "config.default.yaml:min_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: "solving.options.max_iterations"
        effect: >
          Cap on the SLP loop; default 6, twice eur's 3 and better matched to the corpus.
          Same 1-tuple defect, and this is the one that raises: pypsa's loop body opens with
          `if iteration > max_iterations`.
        default: "6"
        provenance: "config.default.yaml:max_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: "solving.options.track_iterations"
        effect: >
          Would record per-iteration capacities and objectives. Also 1-tuple-wrapped, and a
          1-tuple is always truthy, so this would be forced ON regardless of the configured
          value if the branch ran at all.
        default: "false"
        provenance: "config.default.yaml:track_iterations; scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - key: "augmented_line_connection.add_to_snakefile"
        effect: >
          Generates candidate corridors and inserts a rule between cluster_network and the
          rest of the DAG. Evaluated at Snakefile PARSE time inside a python `if`, and
          cluster_network's output filename branches on it (elec_s{simpl}_{clusters}_pre_
          augmentation.nc), so flipping it restructures the DAG rather than changing a
          parameter — treat it as a structural change in a bundle, not a config tweak.
        default: "false"
        provenance: "config.default.yaml:add_to_snakefile; scripts/augmented_line_connections.py:haversine"
      - key: "augmented_line_connection.connectivity_upgrade"
        effect: >
          The k in k_edge_augmentation: the minimum edge-connectivity every bus must reach,
          so candidate HVAC corridors are added (shortest-first, weighted by haversine
          length) until the graph is k-edge-connected. k = 2 removes single points of
          failure; the reference paper used 3 (each node reaching its three nearest
          neighbours). This is also what CREATES cycles on a radial network, which is what
          makes KVL and the impedance nonconvexity meaningful at all.
        default: "2"
        provenance: "config.default.yaml:connectivity_upgrade; scripts/augmented_line_connections.py:haversine"
      - key: "augmented_line_connection.new_line_type"
        effect: >
          Which candidate technologies to add: ['HVAC'] adds the k-edge Lines, ['HVDC'] adds
          the long-distance Links, both adds both. Note the default is HVAC-only, so a
          greenfield study wanting long HVDC corridors must set this explicitly.
        default: "['HVAC']"
        provenance: "config.default.yaml:new_line_type; scripts/augmented_line_connections.py:haversine"
      - key: "augmented_line_connection.min_expansion"
        effect: >
          Initial/minimum capacity in MW on each candidate (s_nom_min for Lines, p_nom_min
          for Links). The default 1 MW reproduces the reference paper's "added with 1 MW
          initial capacity to create expansion options" — near-zero so the model pays for
          essentially the whole corridor, but nonzero so the branch exists in the topology
          and contributes to the cycle basis.
        default: "1"
        provenance: "config.default.yaml:min_expansion; scripts/augmented_line_connections.py:haversine"
      - key: "augmented_line_connection.min_DC_length"
        effect: >
          Minimum km for a pair to be eligible as an HVDC candidate. CAVEAT: eligible pairs
          are not all added — the script takes a fixed 1% random sample (random_state=1)
          plus the single shortest and single longest, so the HVDC candidate set is a small
          arbitrary draw, not an optimised or exhaustive one. Reproducible, but not a
          defensible candidate set for a study whose answer is which HVDC corridor to build.
        default: "600"
        provenance: "config.default.yaml:min_DC_length; scripts/augmented_line_connections.py:haversine"
    assembly:
      - step: >
          Choose the `ll` value deliberately, because earth's default is not eur's. copt is
          a COST metric and unbounded; the corpus's standard bound is volume-based, so a
          European-comparable study wants v1.25 (or a list for a sweep). Remember 'v1.25'
          allows 25% ADDED volume, and that lopt is invalid — the 'l' branch calls
          float(factor) unconditionally.
        uses: [transmission-expansion-limits]
        config: "scenario.ll (wildcard; a list here is the sweep)"
        code: null
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - step: >
          Bound expansion per branch, which earth does NOT do by default: lines.s_nom_max
          and links.p_nom_max are inf and there is no max_extension equivalent, so nothing
          stops a single corridor absorbing the whole global allowance. Either set finite
          ceilings, or use the 'l' metric (ll: l2.0) which caps EVERY branch at a multiple
          of its own capacity — the cleanest per-corridor bound available in either model.
        uses: [transmission-expansion-limits]
        config: "lines.s_nom_max; links.p_nom_max; or scenario.ll with the 'l' metric"
        code: null
        provenance: "scripts/prepare_network.py:set_line_nom_max; scripts/prepare_network.py:set_transmission_limit"
      - step: >
          If the clustered network is radial or sparse — which is the common case outside
          Europe — generate candidates before trying to expand: augmented_line_connection.
          add_to_snakefile true, connectivity_upgrade 2-3, new_line_type set to include
          HVDC if long corridors are in scope, min_expansion 1 MW. Verify the resulting
          candidate set by hand: HVDC candidates are a 1% random sample of eligible long
          pairs, so inspect the added Links rather than trusting the algorithm to have
          proposed the corridor the user cares about. Note this restructures the DAG.
        uses: [augmented-line-connection, spatial-clustering]
        config: "augmented_line_connection.{add_to_snakefile,connectivity_upgrade,new_line_type,min_expansion,min_DC_length}"
        code: null
        provenance: "scripts/augmented_line_connections.py:haversine"
      - step: >
          Decide whether the impedance nonconvexity exists in your run AT ALL before
          spending anything on Exit B. It exists only if there are Lines (not just Links)
          forming cycles. electricity.hvdc_as_lines false — the default — puts all HVDC in
          Links, and a radial AC layer has an empty cycle basis. In either case Exit A is
          exactly correct and the fix below is unnecessary.
        uses: [hvdc-as-lines, spatial-clustering]
        config: "electricity.hvdc_as_lines"
        code: null
        provenance: "scripts/base_network.py:hvdc_as_lines"
      - step: >
          To use Exit B, FIX THE 1-TUPLE KWARGS FIRST. In solve_network's
          not-skip_iterations branch, three assignments carry trailing commas so
          track_iterations, min_iterations and max_iterations arrive at pypsa as 1-tuples;
          pypsa's loop opens with `if iteration > max_iterations`, which raises TypeError
          against a tuple before any solve. Delete the three commas, then set skip_iterations
          false. The configured defaults (min 4, max 6) are already closer to the corpus norm
          than eur's once they actually apply.
        uses: [iterative-impedance-expansion]
        config: "solving.options.{skip_iterations,min_iterations,max_iterations,track_iterations}"
        code: "scripts/solve_network.py — the three kwargs assignments in the else branch"
        provenance: "scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - step: >
          For integrality, call pypsa's discretization yourself — there is no config surface.
          Once the tuple fix is in, optimize_transmission_expansion_iteratively already
          accepts line_unit_size, link_unit_size, line_threshold and link_threshold and
          performs the final fixed-capacity generation-only pass, so this is passing four
          kwargs plus a new solving.options block, not implementing the heuristic. Use the
          literature values: 1700 MW per 380 kV double circuit, threshold 0.3.
        uses: [iterative-impedance-expansion]
        config: "a new solving.options.post_discretization block (does not exist here)"
        code: "scripts/solve_network.py — add the four kwargs alongside the SLP settings"
        provenance: "pypsa/optimization/abstract.py:discretized_capacity"
      - step: >
          Repair the length-factor overwrite if transmission cost matters — and with earth's
          default COST cap it matters doubly, because the bound's RHS is computed from the
          same capital_cost. set_transmission_limit calls update_transmission_costs(n, costs)
          with length_factor defaulting to 1.0, discarding the +25% markup add_electricity
          applied, and rule prepare_network passes no length factor.
        uses: [transmission-expansion-limits]
        config: "lines.length_factor"
        code: "scripts/prepare_network.py — the update_transmission_costs call inside set_transmission_limit"
        provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/add_electricity.py:update_transmission_costs"
      - step: >
          Sweep the cap and assemble the curve. Put a list in scenario.ll and the wildcard
          does the fan-out for free; make_summary accepts an `ll` of `all`, `vall` or `call`
          and expands over the configured list, so the aggregation across cap points is
          already wired — unlike eur, where the sweep needs {opts} tokens or run.scenarios.
          Locating the knee, and extracting the cap's shadow price from the lv_limit /
          lc_limit GlobalConstraint, is still yours to write.
        uses: [summary-outputs, transmission-expansion-limits]
        config: "scenario.ll as a list; the {ll} wildcard as all/vall/call for make_summary"
        code: "scripts/make_summary.py"
        provenance: "scripts/make_summary.py:make_summary; scripts/prepare_network.py:set_transmission_limit"
    boundary:
      - variant: continuous-capacity-expansion
        rung: L0
        note: >
          Default: ll copt already makes lines and DC links extendable with s_nom_min pinned
          to today's. Less guarded than eur, though — s_nom_max and p_nom_max are inf and
          there is no max_extension, so the default expansion is per-branch unbounded.
      - variant: cost-cap
        rung: L0
        note: >
          Earth's DEFAULT metric (copt), and c1.25 is one wildcard character from it. Cheaper
          to reach than in eur, but confirm the length-factor repair first: the cost cap's
          RHS is computed from the capital_cost that update_transmission_costs silently
          rescales, so the bug moves the bound itself, not just the objective.
      - variant: volume-cap
        rung: L0
        note: >
          ll: v1.25. Identical semantics to eur (multiple of today's total length-weighted
          volume, so v1.25 = 25% added) but reached through the wildcard, which means a list
          of values is a sweep with no extra plumbing. Note this is NOT the default here, so
          a European-comparable study must set it explicitly.
      - variant: candidate-set-augmentation
        rung: L1
        note: >
          The one variant where earth is decisively ahead of eur, and it is a config flip
          plus parameters: k-edge augmentation over the graph complement generates candidate
          HVAC corridors, plus long HVDC options. L1 rather than L0 because add_to_snakefile
          restructures the DAG at parse time, connectivity_upgrade and new_line_type both
          need non-default values for a useful candidate set, and the HVDC draw must be
          inspected — it is a 1% random sample, not an optimised candidate set. In eur this
          variant is L5.
      - variant: iterative-impedance-update
        rung: L2
        note: >
          Config exists, is read, and is WIRED TO A CRASH: the three SLP kwargs are wrapped
          in 1-tuples by trailing commas and pypsa's loop compares them to an int, raising
          TypeError before the first solve. So this is a small localised code fix (delete
          three commas), not a config flip — L2 against eur's L1. The one silver lining is
          that skip_iterations is auto-forced true when nothing is extendable, so a
          non-expansion run never touches the branch.
      - variant: discrete-line-additions
        rung: L2
        note: >
          No config surface and no registry id, but the pypsa primitive earth already calls
          accepts the unit sizes and thresholds and performs the final fixed-capacity pass —
          so this is four kwargs and a new config block, downstream of the tuple fix. L2,
          not L5: the asymmetry against eur's L1 is a wiring gap, not a capability gap. The
          exact big-M MILP remains L5 in both models.
      - variant: explicit-project-lists
        rung: L3
        note: >
          Absent: no transmission_projects surface, no TYNDP/NEP ingestion, and no registry
          id. It is L3 rather than L5 because the mechanism is data, not code — candidate
          corridors are just Line/Link rows with a build cost and near-zero initial capacity,
          which is exactly what augmented_line_connections already adds programmatically. The
          work is sourcing a credible project list for the region, which outside Europe
          usually does not exist in machine-readable form — check
          cookbooks/pypsa-earth/data_quality before promising it.
      - variant: exogenous-then-optimised
        rung: L2
        note: >
          Two runs at different ll values gets the bracket. Scaling existing capacities to an
          external NTC target first, or fixing early horizons to a plan, has no config
          surface — a localised edit in prepare_network before set_transmission_limit, since
          the reference volume is computed from whatever capacities are in the network at
          that point.
    where:
      - change: "fix the 1-tuple SLP kwargs so the iterative impedance branch runs at all"
        anchor: "scripts/solve_network.py::solve_network, the not-skip_iterations else branch — three assignments with trailing commas"
        provenance: "scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - change: "post-discretization of line/link expansion"
        anchor: "scripts/solve_network.py — pass line_unit_size / link_unit_size / line_threshold / link_threshold into the iterative call"
        provenance: "scripts/solve_network.py:optimize_transmission_expansion_iteratively"
      - change: "stop update_transmission_costs discarding the length_factor markup"
        anchor: "scripts/prepare_network.py:set_transmission_limit (its update_transmission_costs call takes no length_factor, and rule prepare_network passes none)"
        provenance: "scripts/prepare_network.py:set_transmission_limit; scripts/add_electricity.py:update_transmission_costs"
      - change: "per-branch expansion ceilings, absent by default"
        anchor: "scripts/prepare_network.py:set_line_nom_max (clips s_nom_max/p_nom_max from lines.s_nom_max and links.p_nom_max)"
        provenance: "scripts/prepare_network.py:set_line_nom_max"
      - change: "a credible HVDC candidate set instead of a 1% random sample"
        anchor: "scripts/augmented_line_connections.py — the random_sample draw over intracountry_edges above min_DC_length"
        provenance: "scripts/augmented_line_connections.py:haversine"
      - change: "exogenous pre-scaling of existing capacities to an external NTC target"
        anchor: "scripts/prepare_network.py, before set_transmission_limit — the cap's reference volume is computed from the capacities present at that point"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
      - change: "extract the volume/cost cap shadow price as EUR/MWkm"
        anchor: "the GlobalConstraint named lv_limit / lc_limit on the solved network; report via scripts/make_summary.py"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
    data_dependencies:
      - input: "a machine-readable candidate transmission project list for the region (TYNDP/NEP equivalent)"
        required_for: explicit-project-lists
        availability: >
          absent — earth ships no project pipeline and no ingestion for one. Outside Europe a
          credible list usually does not exist in structured form; treat any candidate set as
          an assumption to sign off with the user, or fall back to
          candidate-set-augmentation, which needs no external data
      - input: "OSM-derived line topology with per-line voltage, circuit count and a usable line type"
        required_for: iterative-impedance-update
        availability: >
          region-dependent — the SLP update rescales x and r only for extendable lines with
          an empty `type`, and updates typed lines through num_parallel, so which path a
          network takes depends on how completely base_network typed its lines. Where OSM
          voltage or circuit data is thin, the impedances the loop converges to are not more
          trustworthy than the ones it started from
      - input: "regional HVAC/HVDC unit costs per MWkm and converter-pair costs"
        required_for: cost-cap
        availability: >
          exists by default via technology-data, but these are European figures; with earth's
          default COST metric the cap's RHS is computed from them, so a wrong cost makes the
          BOUND wrong, not just the objective. Confirm before using c<f> outside Europe
    cost_profile:
      solves: >
        1 for the default single pass. Exit B would be min_iterations..max_iterations LPs
        plus a final fixed-capacity solve — 5-7 at earth's configured defaults, which are
        better matched to the corpus than eur's — once the tuple defect is fixed. A cap sweep
        multiplies by the number of ll values, and because ll is a wildcard the fan-out is
        free to express.
      relative: >
        Exit A is free. Exit B is 5-7x a single solve at earth's defaults. But the base case
        is usually much smaller than eur's (10-54 nodes in the reference paper,
        electricity-only), so the absolute cost of a full cap sweep with impedance updates is
        often lower here than a single sector-coupled eur run — the model-choice tradeoff
        runs in earth's favour for this method.
      note: >
        Two earth-specific cost notes. First, augmentation ADDS branches — k-edge
        augmentation to k = 3 on a sparse network can add a large number of extendable
        candidates, each a new variable and, worse, each new cycle a new KVL constraint, so
        the candidate set is a cost lever as much as a modelling one. Second, the absence of
        transmission losses makes each solve cheaper than the equivalent eur run while
        biasing the answer toward more reinforcement — a cost saving paid for in the result,
        not in compute.
    verifies:
      - variant: volume-cap
        check: "((n.lines.s_nom_opt * n.lines.length).sum() + n.links.query(\"carrier == 'DC'\").eval('p_nom_opt * length').sum()) <= rhs + 1e-6"
        over: run
        note: >
          Same check as eur. A violation means the GlobalConstraint was declared but not
          bound into the LP; the run succeeds and reports an unconstrained expansion under a
          capped label.
      - variant: continuous-capacity-expansion
        check: "n.lines.s_nom_extendable.any() or n.links.query(\"carrier == 'DC'\").p_nom_extendable.any()"
        over: run
        note: >
          Nothing extendable means the ll factor was <= 1.0, so the study answered a
          fixed-grid question. On earth also check that s_nom_max is FINITE somewhere — the
          defaults leave it at inf, so an extendable-but-unbounded network is the normal
          state, not an error, and per-corridor results should be read with that in mind.
      - variant: candidate-set-augmentation
        check: "n.lines.index.str.contains('lines new').any() or n.links.index.str.contains('lines new').any()"
        over: run
        note: >
          Candidate corridors are named 'lines new <bus0> <-> <bus1>' with an ' AC' or ' DC'
          suffix. None present means add_to_snakefile did not take effect — most likely the
          config was changed without re-parsing the Snakefile, since the rule is created
          inside a parse-time `if` and cluster_network's output filename branches on the same
          flag.
      - variant: iterative-impedance-update
        check: "hasattr(n, 'objective_2')"
        over: run
        note: >
          On earth, absence means one of three things and they need distinguishing: the
          single-pass branch was taken, nothing was extendable so pypsa auto-skipped, or the
          iterative branch raised TypeError on the 1-tuple kwargs. Only the third is a defect;
          check the log for TypeError before concluding the setting was ignored.
