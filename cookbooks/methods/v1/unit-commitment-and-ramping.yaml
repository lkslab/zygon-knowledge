pypsa_primitive:
  symbol: "pypsa/optimization/constraints.py:define_operational_constraints_for_committables"
  pypsa_version: "0.30.3"
  exposed_by: >
    pypsa-eur, fully (conventional.unit_commitment turns the attributes on and
    solving.options.linearized_unit_commitment selects MILP vs relaxation);
    pypsa-earth, partially (no key sets the attributes, but the generic
    `conventional:` per-carrier attribute channel reaches them — see that section)
  reachable_via: >
    Set n.generators.committable = True on fixed-capacity thermal generators plus any
    of min_up_time, min_down_time, start_up_cost, shut_down_cost, stand_by_cost,
    p_min_pu, ramp_limit_start_up, ramp_limit_shut_down; then call
    n.optimize(linearized_unit_commitment=False|True). Ramp limits alone need only
    ramp_limit_up / ramp_limit_down and no committable flag —
    define_ramp_limit_constraints is indexed independently of get_committable_i. The
    binary/continuous switch is a single flag: define_status_variables reads
    n._linearized_uc and passes binary=not n._linearized_uc.
  note: >
    This is the field that resets expectations for this method. The whole formulation —
    binaries, rolling min up/down windows, transition costs in the objective, ramp
    limits including the looser start-up/shut-down ramps, AND the Hua et al. (2017)
    tightened linear relaxation — is library code at 0.30.3. Nothing here is L5 on
    either model: the work is data (per-carrier parameters), configuration, and
    avoiding the extendable/committable collision. Soft anchor: pypsa is a conda
    dependency, not a submodule, so the claim is pinned to a version string.
models:
  - model: pypsa-eur
    version_anchor:
      ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d"
      date: "2026-07-25"
    functionality:
      - id: linearized-unit-commitment
        role: >
          the method itself — registry status `partial`: both the data table and both
          config keys exist, and the registry already flags the missing 'oil' column
      - id: operations-only-solve
        role: >
          where UC belongs — a dedicated rule that fixes capacities from a prior
          expansion run, which is the only way to avoid the extendable/committable
          collision without editing extendable_carriers
      - id: rolling-horizon-dispatch
        role: >
          the affordability lever for binary UC: sequential windows keep the MILP tree
          small. `working` here and the reason binary-uc is even discussable on eur
      - id: spatial-clustering
        role: >
          decides what a committable generator IS — add_electricity runs on an already
          clustered network, so every committable unit is a carrier-at-a-bus aggregate
      - id: temporal-resolution-nh
        role: >
          silently rescales ramp limits and min up/down times, which are counted in
          snapshots — see the pitfall
      - id: time-segmentation-tsam
        role: >
          incompatible with UC in practice: segments have unequal durations, so
          consecutive-snapshot ramp and min-up-time constraints lose their meaning
      - id: solver-choice
        role: >
          load-bearing only for binary-uc — gurobi/cplex/copt handle the MILP,
          highs is markedly weaker on branch-and-bound at this scale
      - id: operational-reserves
        role: >
          the usual companion: the GenX-style hourly reserve requirement is the LP
          proxy users reach for when UC is too expensive, and the two answer
          overlapping questions about thermal flexibility
      - id: numeric-stability-options
        role: >
          noisy_costs breaks degeneracy, which matters more for a MILP than an LP;
          check_objective gives you the regression test the pitfalls above need
    available:
      verdict: assemble
      how: >
        Both halves exist and are wired. conventional.unit_commitment (default false)
        makes add_electricity read data/unit_commitment.csv, which is a tracked input to
        rule add_electricity, and turn its columns into per-generator attributes:
        committable is set by carrier membership in the csv's columns, the eight
        parameter rows (ramp_limit_up/down, ramp_limit_start_up/shut_down, p_min_pu,
        min_up_time, min_down_time, start_up_cost) are mapped per carrier with pypsa
        defaults filling gaps, and start_up_cost is multiplied by p_nom because the
        table is per-MW while pypsa expects a total. Independently,
        solving.options.linearized_unit_commitment (default TRUE) is placed into
        model_kwargs by collect_kwargs and forwarded to pypsa's create_model, selecting
        the relaxation. So the default UC configuration on eur is: off; and when
        switched on, relaxed.
      missing: >
        Procedure steps 9 and 11 have no handle. Step 9 (reconcile with clustering) is
        the important one and is not merely absent but MISREPRESENTED:
        clustering.aggregation_strategies.generators does list committable: any,
        ramp_limit_up: max and ramp_limit_down: max, but that dict is consumed only by
        load_and_aggregate_powerplants, which filters it with `if k in ppl.columns` —
        and the powerplant table has no such columns, because the UC attributes are
        attached LATER, by attach_conventional_generators. clustering_for_n_clusters
        passes only line and bus strategies to get_clustering_from_busmap, never
        generator strategies. Net effect: those three entries are dead config at this
        ref. It does no harm, because add_electricity runs AFTER cluster_network so UC
        attributes are only ever created on already-clustered generators — but a user
        reading the config key will believe an aggregation is being performed that is
        not. Step 11 (stochastic UC) is absent entirely. Also missing: a shut_down_cost
        column, so the tightened relaxation never activates; and any guard against
        committable-plus-extendable.
      provenance: "scripts/add_electricity.py:unit_commitment; scripts/solve_network.py:collect_kwargs"
    levers:
      - key: "conventional.unit_commitment"
        effect: >
          The master switch. True makes add_electricity read data/unit_commitment.csv
          and set committable plus the eight parameter attributes on thermal generators
          whose carrier is a COLUMN of that csv. False leaves every generator freely
          dispatchable with no warning that UC data exists.
        default: "false"
        provenance: "config/config.default.yaml:unit_commitment; scripts/add_electricity.py:unit_commitment"
      - key: "solving.options.linearized_unit_commitment"
        effect: >
          Selects linearised-relaxed-uc (true, the default) or binary-uc (false).
          Forwarded into model_kwargs and read by pypsa as n._linearized_uc, which
          define_status_variables inverts into the `binary=` argument. Setting it false
          is the single change that turns an LP into a MILP.
        default: "true"
        provenance: "config/config.default.yaml:linearized_unit_commitment; scripts/solve_network.py:collect_kwargs"
      - key: "electricity.conventional_carriers"
        effect: >
          Determines which carriers exist as fixed-capacity thermal generators at all,
          and therefore which of them can pick up UC data. The default list has nine
          entries; the csv covers five. Narrowing this to the covered five is the
          cheapest honest fix for the oil pitfall.
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: "electricity.extendable_carriers"
        effect: >
          OCGT and CCGT are extendable by default AND are committable when UC is on,
          which is the collision in the pitfalls. Removing them here is the config-only
          way to keep UC clean in an expansion run.
        default: "Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: "solving.options.rolling_horizon"
        effect: >
          Splits the solve into sequential windows (cyclic storage disabled), which is
          how a binary UC MILP is made tractable — each window is an independent tree.
          Pair with horizon/overlap; the overlap must exceed the largest min_up_time or
          commitment decisions are truncated at every window edge.
        default: "false"
        provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:optimize_with_rolling_horizon"
      - key: "solving.options.horizon"
        effect: "Window length in snapshots for the rolling-horizon solve."
        default: "365"
        provenance: "config/config.default.yaml:horizon; scripts/solve_network.py:collect_kwargs"
      - key: "solving.options.overlap"
        effect: >
          Snapshots of overlap between consecutive windows. Must be at least the longest
          min_up_time / min_down_time for commitment to carry across the seam; the
          default 0 truncates it.
        default: "0"
        provenance: "config/config.default.yaml:overlap; scripts/solve_network.py:collect_kwargs"
      - key: "solving.solver.name"
        effect: >
          Irrelevant to the relaxation, decisive for binary-uc: the shipped default is
          gurobi and the MILP is only realistically solvable on a commercial
          branch-and-bound solver at network scale.
        default: "'gurobi'"
        provenance: "config/config.default.yaml:solver; scripts/solve_network.py:solver_options"
      - key: "clustering.temporal.resolution_elec"
        effect: >
          Coarsening buys back MILP time but rescales the ramp and min-up-time
          parameters by the same factor, since both are per-snapshot. Change it and the
          csv must change too.
        default: "false (hourly)"
        provenance: "config/config.default.yaml:resolution_elec; scripts/prepare_network.py:average_every_nhours"
    assembly:
      - step: >
          Decide the variant FIRST, because ramp-limits-only needs no commitment at all.
          If ramp limits are enough, keep conventional.unit_commitment false and set
          ramp_limit_up / ramp_limit_down directly on the thermal generators from a
          small post-add_electricity edit — the problem stays an LP and the whole
          MILP/dual/clustering discussion below disappears.
        uses: [linearized-unit-commitment]
        config: "conventional.unit_commitment: false"
        code: "scripts/add_electricity.py:attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          Fix the data table. Copy data/unit_commitment.csv and add columns for every
          carrier in electricity.conventional_carriers you intend to commit — oil,
          geothermal, waste and biomass have none — or narrow conventional_carriers to
          the five that do. Add a shut_down_cost row equal to start_up_cost if you want
          the tightened relaxation. Remember start_up_cost is per MW and gets multiplied
          by p_nom.
        uses: [linearized-unit-commitment]
        config: "conventional.unit_commitment: true; electricity.conventional_carriers"
        code: "data/unit_commitment.csv (input of rule add_electricity)"
        provenance: "scripts/add_electricity.py:unit_commitment; rules/build_electricity.smk:add_electricity"
      - step: >
          Break the extendable/committable collision. Either remove OCGT and CCGT from
          electricity.extendable_carriers, or run the UC solve as a dispatch problem via
          the solve_operations_network rule so capacities are already fixed. The second
          is what the corpus does and is what commitment means.
        uses: [operations-only-solve]
        config: "electricity.extendable_carriers"
        code: "scripts/solve_operations_network.py:fix_optimal_capacities"
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - step: >
          Choose MILP or relaxation. Leave solving.options.linearized_unit_commitment
          true for anything above a handful of nodes; set it false only for binary-uc,
          and then only with a commercial solver and a rolling horizon.
        uses: [linearized-unit-commitment, solver-choice]
        config: "solving.options.linearized_unit_commitment; solving.solver.name"
        code: "scripts/solve_network.py:collect_kwargs"
        provenance: "scripts/solve_network.py:collect_kwargs"
      - step: >
          For binary-uc, enable the rolling horizon and set overlap >= the longest
          min_up_time in the csv (10 h for nuclear in the shipped table; the default
          overlap of 0 silently truncates commitment at every seam).
        uses: [rolling-horizon-dispatch]
        config: "solving.options.rolling_horizon: true; solving.options.horizon; solving.options.overlap"
        code: "scripts/solve_network.py:optimize_with_rolling_horizon"
        provenance: "scripts/solve_network.py:optimize_with_rolling_horizon"
      - step: >
          Verify, do not assume. Check n.generators.query('committable').carrier.unique()
          against the carriers you named, and grep the solver log for pypsa's
          "cannot be tightened" warning. Both failures are silent.
        uses: [numeric-stability-options]
        config: "solving.check_objective"
        code: "scripts/solve_network.py:check_objective_value"
        provenance: "scripts/solve_network.py:check_objective_value"
    boundary:
      - variant: ramp-limits-only
        rung: L2
        note: >
          No config key sets ramp limits without commitment: conventional.unit_commitment
          is all-or-nothing and pulls in p_min_pu, min up/down and start-up costs with
          the ramp rows. A three-line edit in attach_conventional_generators (or a
          post-processing step over n.generators) that writes only ramp_limit_up /
          ramp_limit_down. Cheapest variant by a wide margin and the right default
          recommendation — the problem stays an LP, duals stay valid, and it removes
          the specific artefact Karkossa blames.
      - variant: must-run-minimum-load
        rung: L2
        note: >
          Setting p_min_pu > 0 on a NON-committable generator is a must-run floor in
          pypsa. Reachable via a small edit, or in the sector chain by writing p_min_pu
          on a Link; there is no config key for either. Hampp's 30%/94.25% synthesis
          floors are this pattern. Watch the interaction: if the same generator is also
          committable, p_min_pu silently changes meaning from must-run to minimum
          stable level.
      - variant: linearised-relaxed-uc
        rung: L1
        note: >
          Genuinely one flip: conventional.unit_commitment: true, with
          linearized_unit_commitment already true by default. The only reason this is
          L1 and not L0 is that the shipped csv is incomplete (no oil/geothermal/
          waste/biomass columns, no shut_down_cost row), so a defensible run needs a
          specific non-default value of electricity.conventional_carriers or an edited
          data file — which pushes a rigorous run to L3.
      - variant: binary-uc
        rung: L1
        note: >
          Two keys: conventional.unit_commitment: true and
          solving.options.linearized_unit_commitment: false. L1 on CONFIG; the cost is
          entirely computational, not implementation. Add solving.options.rolling_horizon
          and a commercial solver, and treat any run above ~10 nodes x 8760 h as
          needing a benchmark before it is promised.
      - variant: clustered-unit-commitment
        rung: L1
        note: >
          Nothing to build: add_electricity runs after cluster_network, so committable
          generators are ALREADY carrier-at-a-bus aggregates and every UC run on eur is
          implicitly this variant. The L1 label is about mechanics only — the parameter
          reconciliation (fleet-average p_min_pu, aggregate start_up_cost) is a
          modelling judgement with no code path, and the three
          clustering.aggregation_strategies.generators entries that appear to handle it
          are dead at this ref.
    where:
      - change: "add UC parameters for carriers the shipped csv omits, and a shut_down_cost row"
        anchor: "data/unit_commitment.csv, declared as input `unit_commitment` of rule add_electricity"
        provenance: "rules/build_electricity.smk:add_electricity; scripts/add_electricity.py:unit_commitment"
      - change: "set ramp limits (or a must-run p_min_pu) without turning on commitment"
        anchor: "scripts/add_electricity.py::attach_conventional_generators, the n.add('Generator', ...) call"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "select MILP vs relaxation and forward it to pypsa"
        anchor: "scripts/solve_network.py::collect_kwargs -> model_kwargs['linearized_unit_commitment']"
        provenance: "scripts/solve_network.py:collect_kwargs"
      - change: "run UC as dispatch so commitment does not fight the investment variable"
        anchor: "rule solve_operations_network -> scripts/solve_operations_network.py::fix_optimal_capacities"
        provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
      - change: "keep the MILP tractable by windowing"
        anchor: "scripts/solve_network.py::optimize_with_rolling_horizon (mode 'rolling_horizon' in collect_kwargs)"
        provenance: "scripts/solve_network.py:optimize_with_rolling_horizon"
    data_dependencies:
      - input: "per-carrier UC parameters for oil, geothermal, waste and biomass"
        required_for: "linearised-relaxed-uc, binary-uc (any run with the default conventional_carriers)"
        availability: >
          absent — data/unit_commitment.csv covers OCGT, CCGT, coal, lignite and nuclear
          only. Must be authored; Glismann Table E.8 gives defensible European values for
          gas and coal but nothing for oil, geothermal, waste or biomass
      - input: "shut_down_cost per carrier"
        required_for: "linearised-relaxed-uc (to get the tightened relaxation)"
        availability: >
          absent — no row in the shipped csv, so it defaults to 0 and the tightening is
          skipped with a warning
      - input: "unit-level rather than fleet-level UC parameters"
        required_for: clustered-unit-commitment
        availability: >
          absent — powerplantmatching supplies capacity, efficiency and dates but no
          commitment attributes, so fleet-average parameters are the only option at any
          clustering level
    cost_profile:
      solves: >
        1 for ramp-limits-only, must-run-minimum-load and linearised-relaxed-uc — all
        remain LPs. 1 MILP for binary-uc, or ceil(8760/horizon) MILPs under a rolling
        horizon.
      relative: >
        ramp-limits-only and must-run-minimum-load: within noise of a plain solve (a
        handful of extra inter-temporal constraints). linearised-relaxed-uc: roughly
        2-5x, and worse than it needs to be because the shipped csv leaves the
        relaxation untightened — pypsa says so in the log. binary-uc: unbounded in
        practice; the tree grows with (committable units x snapshots) and the corpus
        runs it only single-node (Welfonder's one portfolio, Glismann's one bus).
        Nobody in this corpus solved a binary UC on a multi-node European network.
      note: >
        The mitigations, in the order to try them: (1) use ramp-limits-only, which
        answers most users' actual question at zero cost; (2) keep the relaxation and
        set shut_down_cost = start_up_cost so the tightening activates; (3) restrict
        committable carriers to the few that bind; (4) rolling_horizon with overlap >=
        max min_up_time; (5) fewer clusters. Do NOT reach for
        clustering.temporal.resolution_elec without rescaling the csv, and do not
        combine UC with time-segmentation-tsam at all.
    verifies:
      - variant: linearised-relaxed-uc
        check: "set(n.generators.query('committable').carrier.unique()) >= set(declared_uc_carriers)"
        over: run
        note: >
          A carrier you named that is missing from this set got no UC data — almost
          always because it has no column in unit_commitment.csv (oil is the shipped
          example). The run succeeded and that carrier is freely dispatchable.
      - variant: linearised-relaxed-uc
        check: "not n.generators.query('committable and p_nom_extendable').shape[0]"
        over: run
        note: >
          Any generator that is both committable and extendable has its dispatch capped
          at the pre-expansion p_nom by the commitment constraint while its investment
          variable is unbounded — built capacity that cannot run. True of OCGT and CCGT
          under eur's default config.
      - variant: binary-uc
        check: "set(n.generators_t.status.stack().unique()) <= {0.0, 1.0}"
        over: run
        note: >
          Fractional statuses mean the relaxation ran, not the MILP — i.e.
          solving.options.linearized_unit_commitment was still true, or the flag never
          reached create_model. The classic silent failure for this variant: the run
          looks like a MILP and is an LP.
      - variant: ramp-limits-only
        check: "n.generators.ramp_limit_up.notna().any() and not n.generators.committable.any()"
        over: run
        note: >
          Confirms the cheap variant actually got what it asked for: ramp limits present,
          no binaries introduced. If committable is set anywhere, conventional.unit_commitment
          was left on and the problem is no longer a plain LP.
  - model: pypsa-earth
    version_anchor:
      ref: "8435f4c8cc05f30088933b37b7db497ff860dc53"
      date: "2026-07-25"
    functionality:
      - id: unit-commitment
        role: >
          the method itself — registry status `partial`, and correctly so: the note
          already says "PyPSA supports committable generators but no pypsa-earth code
          sets committable=True or ramp data". Note the id differs from eur's
          (`unit-commitment` vs `linearized-unit-commitment`), which is itself the
          asymmetry: there is no relaxation to name here
      - id: spatial-clustering
        role: >
          load-bearing in a way it is not on eur: add_electricity runs BEFORE
          cluster_network here, so UC attributes set at add_electricity time must
          survive aggregation — which is exactly why the committable/ramp_limit
          aggregation strategies exist in this config and are live
      - id: existing-baseyear-brownfield
        role: >
          where committable units come from: attach_conventional_generators adds existing
          plants aggregated by (bus, carrier, grouping_year) with p_nom_extendable=False,
          which is precisely the fixed-capacity shape commitment requires
      - id: temporal-resolution-nh
        role: "rescales ramp limits and min up/down times, counted in snapshots"
      - id: time-segmentation-tsam
        role: "incompatible with consecutive-snapshot ramp constraints"
      - id: solver-choice
        role: >
          the binding constraint for binary UC here, and worse than on eur: earth's
          shipped profile is open-source-first (HiGHS/CBC/GLPK reachable), and CBC and
          GLPK are not viable branch-and-bound solvers at this scale
      - id: operational-reserves
        role: >
          the LP proxy that IS available and `working` here — the recommended
          substitute when the question is thermal flexibility and UC is not worth it
      - id: custom-constraint-hook
        role: >
          where an explicit reserve or must-run constraint would land if the generic
          conventional-attribute channel below is not enough
      - id: monte-carlo-sampling
        role: >
          the only in-repo many-solve harness, and the nearest existing thing to
          Welfonder's stochastic UC — it samples parameters, not scenarios sharing
          first-stage binaries, so it is a starting point and not the method
      - id: numeric-stability-options
        role: "noisy_costs matters more for a MILP than an LP"
    available:
      verdict: assemble
      how: >
        Sharper than the registry's `partial` implies, in both directions. First the
        negative: there is genuinely NO unit-commitment feature. Grepping the whole
        repo for `committable` outside .pixi returns exactly three hits, all config —
        config.default.yaml, configs/scenarios/config.GH.yaml and a doc snippet — and
        zero hits in scripts/. Likewise no hits for min_up_time, start_up_cost or
        ramp_limit anywhere in scripts/. solving.options has eight keys and
        linearized_unit_commitment is not among them; solve_network builds its kwargs
        dict explicitly and never sets it, so n._linearized_uc stays 0 and any UC here
        is a TRUE MILP — earth has no linear relaxation available at all, which is the
        exact opposite of eur's default. Now the positive, and it is the finding of this
        section: earth has an undocumented generic per-carrier attribute channel. The
        top-level `conventional:` mapping (absent from config.default.yaml, read as
        config.get("conventional", {}) in the Snakefile) is looped over in
        attach_conventional_generators as `for attr in set(conventional_config[carrier])
        & set(n.generators)` — an intersection with the Generator dataframe's COLUMNS,
        which by pypsa default include committable, min_up_time, min_down_time,
        start_up_cost, shut_down_cost, ramp_limit_up, ramp_limit_down and p_min_pu. So
        `conventional: {coal: {committable: true, min_up_time: 8, p_min_pu: 0.38,
        ramp_limit_up: 0.9}}` sets those attributes with no code change, and the
        Snakefile even routes any value starting with "data/" to a country-specific csv
        input. That makes earth L1 for the attributes and, unusually, MORE flexible than
        eur's fixed five-column table. IMPORTANT CAVEAT on that route: `conventional:`
        has NO entry in config.default.yaml at this ref, which is why it is not listed
        under `levers` below — a lever must resolve as a dot-path in the shipped config
        and this one does not. It is a live consumer without a declared surface: the
        opposite of a dead key, and undocumented, so a bundle using it must add the
        top-level `conventional:` block itself and cannot cite a default.
      missing: >
        Procedure step 7 (choose MILP or relaxation) has NO handle here — that is the
        one real capability gap versus eur, and it is the expensive half. Step 9
        (clustering reconciliation) has partial machinery: unlike eur, the
        cluster_options.aggregation_strategies.generators entries for committable ('any')
        and ramp_limit_up/down ('max') ARE live, because clustering happens after
        add_electricity and the strategies reach get_clustering_from_busmap via
        generator_strategies. 'any' is the correct-but-blunt choice: one committable unit
        in a cluster makes the whole aggregate committable. Step 11 (stochastic UC) is
        absent. Also missing: any per-carrier parameter DATA (no unit_commitment.csv
        equivalent, and technology-data carries no commitment attributes), and no
        dispatch-only rule to run commitment in — operations-only-solve is `absent` here.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/solve_network.py:solve_network"
    levers:
      - key: "cluster_options.aggregation_strategies.generators"
        effect: >
          The only committable-aware key that ships. committable: any and
          ramp_limit_up/down: max are passed as generator_strategies into
          get_clustering_from_busmap, so UC attributes set before clustering survive it.
          Live plumbing with no producer at this ref — until you supply the producer via
          the `conventional:` channel below, at which point it becomes load-bearing.
        default: "{p_nom: sum, p_nom_max: sum, p_nom_min: sum, p_min_pu: mean, p_max_pu: weighted_average, marginal_cost: mean, committable: any, ramp_limit_up: max, ramp_limit_down: max, efficiency: mean, build_year: mean, lifetime: mean}"
        provenance: "config.default.yaml:aggregation_strategies; scripts/cluster_network.py:busmap_for_n_clusters"
      - key: "electricity.conventional_carriers"
        effect: >
          Which carriers become the fixed-capacity, non-extendable existing generators
          that commitment can apply to. Same nine-minus-waste list as eur.
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: "electricity.extendable_carriers"
        effect: >
          Only OCGT is extendable among conventionals by default, and — crucially —
          earth adds extendable conventionals as SEPARATE generators from the existing
          fleet (p_nom_extendable=True, no p_nom), so the eur committable/extendable
          collision does not arise as long as the `conventional:` channel targets
          carriers by name. It would still hit the extendable OCGT generators, which
          share the carrier.
        default: "Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: "solving.solver.name"
        effect: >
          Decisive for binary UC, which is the only kind available here. The
          open-source-runnable profiles (cbc, glpk) will not close a UC MILP at network
          scale; gurobi or cplex is effectively required.
        default: "'gurobi'"
        provenance: "config.default.yaml:solver; scripts/solve_network.py:solver_options"
      - key: "electricity.operational_reserve.activate"
        effect: >
          The recommended LP substitute: an hourly reserve requirement of
          epsilon_load x load + epsilon_vres x VRE + contingency, co-optimised with
          dispatch. Answers "does the system have enough flexible headroom" without any
          binaries. `working` here, same as eur.
        default: "false (epsilon_load 0.02, epsilon_vres 0.02, contingency 0)"
        provenance: "config.default.yaml:operational_reserve; scripts/solve_network.py:add_operational_reserve_margin"
      - key: "solving.options.load_shedding"
        effect: >
          Set to 100 EUR/kWh by default here (eur ships it off). Relevant because a UC
          run is far easier to make infeasible — minimum load plus min-down-time can
          make a snapshot unservable — and load shedding turns that infeasibility into
          a diagnosable cost.
        default: "100"
        provenance: "config.default.yaml:load_shedding; scripts/solve_network.py:get_load_shedding_capacity"
    assembly:
      - step: >
          Prefer ramp-limits-only or the reserve proxy. Set
          conventional: {coal: {ramp_limit_up: 0.9, ramp_limit_down: 0.9}, ...} — ramp
          limits need no committable flag, since pypsa indexes
          define_ramp_limit_constraints independently of get_committable_i. The problem
          stays an LP. If the question is flexibility headroom rather than plant
          physics, use electricity.operational_reserve instead and skip UC entirely.
        uses: [unit-commitment, operational-reserves]
        config: "conventional.<carrier>.ramp_limit_up/down; electricity.operational_reserve.activate"
        code: "scripts/add_electricity.py:attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          Author the parameter data. There is no unit_commitment.csv here and
          technology-data carries no commitment attributes, so every value is yours to
          justify. Glismann Table E.8 gives European figures (CCGT p_min 50 MW, ramp
          0.25 p.u./ISP, min_up/down 12 ISP; coal p_min 400 MW, min_up/down 20 ISP;
          start-up EUR 6k-50k) — for a non-European region these must be declared as
          transferred assumptions. Use the "data/..." form for country-specific values.
        uses: [unit-commitment]
        config: "conventional.<carrier>.{p_min_pu,min_up_time,min_down_time,start_up_cost,shut_down_cost}"
        code: "data/custom/<your csv>, wired via the Snakefile's conventional_<carrier>_<attr> input"
        provenance: "Snakefile:add_electricity; scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          Set committable: true through the same channel, on the carriers you have data
          for. Note this also hits the separately-added EXTENDABLE generators of the same
          carrier (OCGT by default), which reintroduces the extendable/committable
          collision — remove OCGT from extendable_carriers, or accept that the newly
          built OCGT is capped by a commitment constraint on p_nom = 0.
        uses: [unit-commitment, existing-baseyear-brownfield]
        config: "conventional.<carrier>.committable: true; electricity.extendable_carriers"
        code: "scripts/add_electricity.py:attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - step: >
          Check the clustering aggregation actually did what you want. Unlike eur these
          strategies are live: committable aggregates by 'any' and ramp limits by 'max',
          both of which are permissive. Confirm on the clustered network before solving,
          because a single committable plant per cluster commits the aggregate.
        uses: [spatial-clustering]
        config: "cluster_options.aggregation_strategies.generators"
        code: "scripts/cluster_network.py"
        provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
      - step: >
          Decide whether you need the relaxation. If you do, this is the only genuine
          code step: solve_network builds kwargs explicitly and never sets
          linearized_unit_commitment, so add
          kwargs["linearized_unit_commitment"] = cf_solving.get("linearized_unit_commitment",
          False) alongside the existing solver_name/solver_options assignments, and add
          the key to config.default.yaml. Mirror eur's collect_kwargs. Two lines plus a
          config entry.
        uses: [unit-commitment, solver-choice]
        config: "solving.options.linearized_unit_commitment (new key)"
        code: "scripts/solve_network.py:solve_network"
        provenance: "scripts/solve_network.py:solve_network"
      - step: >
          Fix capacities so commitment means something. There is no operations rule here
          (operations-only-solve is `absent`), so the assembly is: set
          extendable_carriers to empty for the conventional carriers, or set
          p_nom_extendable=False everywhere and re-solve a prior run's network. Enable
          load_shedding while doing it — UC infeasibilities are common and otherwise
          uninformative.
        uses: [existing-baseyear-brownfield]
        config: "electricity.extendable_carriers; solving.options.load_shedding"
        code: "scripts/solve_network.py:solve_network"
        provenance: "scripts/solve_network.py:get_load_shedding_capacity"
    boundary:
      - variant: ramp-limits-only
        rung: L1
        note: >
          CHEAPER than on eur, and the one place earth is ahead: the generic
          `conventional:` channel writes ramp_limit_up/down per carrier with no code
          edit, whereas eur's only switch is the all-or-nothing
          conventional.unit_commitment. Config only, and the problem stays an LP. L1
          rather than L0 for a specific reason worth relaying: the top-level
          `conventional:` block has no entry in config.default.yaml, so the bundle must
          ADD the block, not change a value — a live consumer with no declared surface.
          Still the recommendation for almost every earth user who asks about ramping.
      - variant: must-run-minimum-load
        rung: L1
        note: >
          Same channel and the same caveat: conventional.<carrier>.p_min_pu on a
          non-committable generator is a must-run floor, config-only, but the
          `conventional:` block must be added rather than edited. For the sector chain
          the equivalent on a Link has no channel at all and is L2.
      - variant: binary-uc
        rung: L3
        note: >
          Config reaches the attributes (L1) but there is no parameter data to put in
          them and none in technology-data — every p_min_pu, min_up_time and
          start_up_cost must be authored, and for a non-European region there is no
          published fleet source to transfer from. The DATA is the boundary, which is
          earth's characteristic failure mode. Compute makes it worse: binary UC is the
          only UC available here, and the open-source solver profiles cannot close it.
      - variant: linearised-relaxed-uc
        rung: L2
        note: >
          The one variant where earth needs code and eur does not. solve_network builds
          its kwargs dict by hand and never sets linearized_unit_commitment, so
          n._linearized_uc stays 0. A two-line addition mirroring eur's collect_kwargs,
          plus the config key. Small and localised, but it must be written — and until
          it is, every UC run on earth is a full MILP.
      - variant: clustered-unit-commitment
        rung: L1
        note: >
          The aggregation strategies are already correct and already live here, which is
          the reverse of eur where they are dead config. Because add_electricity precedes
          cluster_network, attributes set per carrier are aggregated by
          get_clustering_from_busmap using committable: any and ramp_limit: max. Config
          only. The 'any' rule is blunt — one committable plant commits the cluster —
          so state it rather than rely on it.
    where:
      - change: "add the linearised-relaxation switch (the one real code gap vs eur)"
        anchor: "scripts/solve_network.py::solve_network, the kwargs dict built before n.optimize"
        provenance: "scripts/solve_network.py:solve_network"
      - change: "set committable / ramp / min-load attributes per carrier"
        anchor: "config `conventional:` -> Snakefile rule add_electricity params.conventional -> scripts/add_electricity.py::attach_conventional_generators"
        provenance: "Snakefile:add_electricity; scripts/add_electricity.py:attach_conventional_generators"
      - change: "country-specific UC parameter tables"
        anchor: "conventional.<carrier>.<attr>: 'data/...' -> Snakefile input conventional_<carrier>_<attr>"
        provenance: "Snakefile:add_electricity"
      - change: "make UC attributes survive spatial aggregation"
        anchor: "cluster_options.aggregation_strategies.generators -> scripts/cluster_network.py::busmap_for_n_clusters"
        provenance: "scripts/cluster_network.py:busmap_for_n_clusters"
      - change: "fixed-capacity existing fleet that commitment applies to"
        anchor: "scripts/add_electricity.py::aggregate_ppl_by_bus_carrier_year (p_nom_extendable=False branch)"
        provenance: "scripts/add_electricity.py:aggregate_ppl_by_bus_carrier_year"
    data_dependencies:
      - input: "per-carrier UC parameters (p_min_pu, min up/down time, start-up cost, ramp limits)"
        required_for: "binary-uc, linearised-relaxed-uc, ramp-limits-only"
        availability: >
          absent — no unit_commitment.csv equivalent and technology-data carries no
          commitment attributes. Must be authored. For European countries Glismann's
          Table E.8 is transferable; outside Europe there is no source in this corpus and
          the values become an assumption to sign off with the user
      - input: "a matched existing thermal fleet with plausible per-unit capacities"
        required_for: "binary-uc, clustered-unit-commitment"
        availability: >
          region-dependent — powerplant matching quality varies sharply by country in
          earth, and commitment is meaningless on a fleet whose unit sizes are wrong.
          Check cookbooks/pypsa-earth/data_quality before promising a UC study
      - input: "a commercial MILP solver"
        required_for: binary-uc
        availability: >
          must be provided — cbc and glpk are reachable via solving.solver.name but will
          not close a UC MILP at network scale, and earth has no relaxation to fall back on
    cost_profile:
      solves: >
        1 LP for ramp-limits-only and must-run-minimum-load. 1 MILP for binary-uc, with
        no rolling-horizon rule to window it (rolling horizon is comment-only in
        solve_network here) and no relaxation to fall back on.
      relative: >
        ramp-limits-only: within noise. binary-uc: the worst position of any method-model
        pair in this card. Earth lacks BOTH of eur's mitigations — no
        linearized_unit_commitment flag (L2 to add) and no rolling-horizon rule — so the
        MILP is monolithic. Earth's usual compensations do apply and are real: single
        countries and electricity-only runs mean far fewer committable units than a
        35-country eur network, so a national UC study is genuinely tractable here where
        the equivalent eur run is not.
      note: >
        Order of mitigations: (1) use ramp-limits-only, which is L1 and config-only here
        and answers most questions; (2) use electricity.operational_reserve as the
        flexibility proxy; (3) restrict committable to the two or three carriers that
        bind; (4) add the linearized_unit_commitment switch (L2, two lines) before
        scaling up; (5) shrink the country set. Do not coarsen
        clustering.temporal.resolution_nh without rescaling min_up_time, which counts
        snapshots.
    verifies:
      - variant: ramp-limits-only
        check: "n.generators.ramp_limit_up.notna().any() and not n.generators.committable.any()"
        over: run
        note: >
          Confirms the `conventional:` channel wrote the attribute at all. A silent no-op
          here means the key name was not a Generator column and the
          set(conventional_config[carrier]) & set(n.generators) intersection dropped it —
          no error is raised, the attribute is simply never set.
      - variant: clustered-unit-commitment
        check: "n.generators.query('committable').p_nom.gt(0).all()"
        over: run
        note: >
          A committable generator with p_nom == 0 has its dispatch bounded to zero by
          the commitment constraint. This is what happens when committable: true is
          applied by carrier and catches the separately-added extendable OCGT generators,
          which are created with no p_nom.
      - variant: binary-uc
        check: "set(n.generators_t.status.stack().unique()) <= {0.0, 1.0}"
        over: run
        note: >
          Should always pass on earth at this ref, since no relaxation switch exists — a
          fractional status means someone added the linearized_unit_commitment kwarg and
          left it on, so the run is an LP labelled as a MILP.
