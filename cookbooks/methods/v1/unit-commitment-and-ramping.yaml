id: unit-commitment-and-ramping
title: "Unit commitment and ramping (UC; MILP and its linear relaxation)"
summary: >
  Represent a thermal unit as an on/off decision rather than a freely-dispatchable
  block: a binary status variable gating output between a minimum load and rated
  power, priced start-ups, minimum up/down times, and limits on how fast output may
  change between snapshots.
question: >
  Does the plant have to be switched on to produce, what does switching it on cost,
  and how fast can it move — and does any of that change the dispatch, the price or
  the capacity mix?
aliases:
  - "unit commitment"
  - "UC"
  - "MILP unit commitment"
  - "linearised unit commitment"
  - "linear relaxation of unit commitment"
  - "committable generators"
  - "binary on/off status"
  - "start-up cost"
  - "shut-down cost"
  - "minimum up time"
  - "minimum down time"
  - "minimum stable level"
  - "minimum load"
  - "must-run"
  - "ramp rate"
  - "ramp limit"
  - "ramping constraints"
  - "thermal cycling"
  - "inter-temporal generator constraints"
when_to_use:
  - "the model runs coal plants up and down hourly, real plants cannot do that"
  - "add start-up costs so gas is not cycled for free"
  - "my modelled prices are far too smooth compared to the real market"
  - "the model never shows negative or spiking prices like reality does"
  - "how much does inflexibility of the existing thermal fleet cost the system"
  - "plants have a minimum load, they cannot go below 40% output"
  - "how fast can nuclear follow the residual load"
  - "does must-run capacity cause renewable curtailment"
  - "represent the plant as being either on or off, not continuously dimmable"
  - "how much are we understating flexibility needs by ignoring commitment"
  - "the electrolyser / synthesis plant needs a minimum load to keep running"
  - "will adding ramp limits change the answer, and is it worth the solve time"
family: markets-and-prices
prevalence:
  papers: 5
  tier1: 2
  tier2: 3
  sweep_hits: 27
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) assigned 6 papers to this slug; one
    of them, 2017_Hoersch_Linear-Optimal-Power-Flow-Cycle-Flows_EPSR.pdf, is EXCLUDED
    here as mention-only — pass 1's own note says "unit commitment is listed as a
    motivation for the LOPF formulation study but is not explicitly implemented in the
    benchmark runs", and it is flagged as a suspect in _qa/EVIDENCE_INDEX.md. That
    leaves 5. The regex screen returned 27, over 5x the hand-coded count, and the gap
    is diagnostic rather than noise: the alias set ("ramping", "minimum load",
    "must-run", "start-up") appears in almost every paper's *discussion of what it
    omitted*. This method is much more often named as a known limitation than
    implemented — which is precisely the finding the `critiques` role captures below.
    Note also the role split: 2 `defines` and 0 `extends`. The formulation is settled
    and lives in PyPSA the library; nobody in this corpus generalises it, they either
    switch it on or explain why they did not.
procedure:
  - step: >
      Decide which units are committable at all. In practice this is a per-carrier
      decision on the THERMAL fleet (coal, lignite, nuclear, CCGT, OCGT), never on
      variable renewables, and it must be a fixed-capacity unit — commitment is a
      decision about an existing physical block, not about a capacity variable.
    handle: "n.generators.committable (bool, per generator)"
    provenance: "pypsa/component_attrs/generators.csv:committable"
  - step: >
      Introduce, per committable unit and snapshot, a status variable u in {0,1} plus
      start_up and shut_down transition variables. This is the step that turns the LP
      into a MILP, and the whole cost profile of the method follows from it.
    handle: "define_status_variables / define_start_up_variables / define_shut_down_variables"
    provenance: "pypsa/optimization/variables.py:define_status_variables"
  - step: >
      Gate dispatch on the status: p_min_pu * p_nom * u <= p <= p_max_pu * p_nom * u.
      The lower bound is the minimum stable level — this is what makes p_min_pu mean
      "minimum load when running" rather than "must-run floor".
    handle: "define_operational_constraints_for_committables"
    provenance: "pypsa/optimization/constraints.py:define_operational_constraints_for_committables"
  - step: >
      Add minimum up/down time as rolling-window constraints on the status: once
      started the unit must stay up min_up_time snapshots, once stopped down for
      min_down_time. Seed the window with up_time_before / down_time_before so the
      first snapshots are not spuriously free.
    handle: "min_up_time / min_down_time / up_time_before / down_time_before"
    provenance: "pypsa/optimization/constraints.py:define_operational_constraints_for_committables"
  - step: >
      Price the transitions: start_up_cost and shut_down_cost enter the objective
      multiplied by the transition variables; stand_by_cost, if set, is priced against
      the status variable itself.
    handle: "start_up_cost / shut_down_cost / stand_by_cost in the objective"
    provenance: "pypsa/optimization/optimize.py:define_objective"
  - step: >
      Add ramp limits: |p_t - p_{t-1}| <= ramp_limit_{up,down} * p_nom, with the
      separate, looser ramp_limit_start_up / ramp_limit_shut_down applying in the
      transition snapshots. Ramp limits are INDEPENDENT of commitment — they apply to
      any generator with the attribute set, committable or not.
    handle: "define_ramp_limit_constraints"
    provenance: "pypsa/optimization/constraints.py:define_ramp_limit_constraints"
  - step: >
      Choose MILP or its linear relaxation. Relaxing u, start_up and shut_down to
      [0,1] continuous makes the problem an LP again at the cost of allowing units to
      be "partly on"; PyPSA additionally tightens the relaxation with the Hua et al.
      (2017) constraints, but ONLY when start_up_cost equals shut_down_cost.
    handle: "linearized_unit_commitment=True -> n._linearized_uc"
    provenance: "pypsa/optimization/optimize.py:linearized_unit_commitment"
  - step: >
      Populate the parameters per carrier: p_min_pu, min_up_time, min_down_time,
      start_up_cost (currency per unit, so per-MW figures must be multiplied by p_nom),
      ramp_limit_up/down. The corpus values are narrow and quotable: p_min_pu 0.2-0.5,
      min_up/down 0-10 h in PyPSA-Eur's shipped table and 8-20 ISP in Glismann's Dutch
      fleet, ramp 0.25 p.u./ISP, start-up EUR 6k-50k per unit.
    handle: "data/unit_commitment.csv (pypsa-eur) — no equivalent table exists in pypsa-earth"
    provenance: "scripts/add_electricity.py:unit_commitment"
  - step: >
      Reconcile with spatial clustering. After aggregation one generator represents a
      fleet of units, so a single binary status and a single p_min_pu now gate a whole
      carrier-at-a-bus block. Nothing in either workflow validates this reconciliation;
      it is the step users skip.
    handle: null
    provenance: null
  - step: >
      Run it as a DISPATCH problem, not an expansion problem. Commitment presupposes
      fixed capacity, and the corpus never co-optimises binary commitment with
      investment — Welfonder fixes the portfolio, Karkossa fixes capacities from a
      prior run, Glismann clears a market at given capacity.
    handle: "the dispatch-only / operations solve"
    provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
  - step: >
      (extension) Make it stochastic: generate an ensemble of price and demand
      realisations, and solve the commitment as a two-stage problem where the binary
      here-and-now decisions are shared across scenarios. Welfonder's ARIMAX-based
      1000-realisation pipeline is the corpus's only instance.
    handle: null
    provenance: null
variants:
  - id: ramp-limits-only
    what: >
      Set ramp_limit_up / ramp_limit_down (and nothing else) on thermal generators.
      No binaries, no start-up cost, no minimum load: the problem stays a pure LP and
      the extra cost is a handful of inter-temporal constraints. This is very often
      sufficient — it removes the physically absurd full-range-in-one-hour swings that
      motivate most users' requests — and it is the variant to reach for first.
    papers:
      - "2021_Glismann_ancillary-services-acquisition-model.pdf"
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
  - id: must-run-minimum-load
    what: >
      A continuous minimum-output floor with NO commitment binary: p_min_pu > 0 on a
      non-committable generator, which PyPSA reads as an unconditional must-run
      condition rather than a minimum stable level. Still an LP. Hampp uses exactly
      this for chemical synthesis plants (30% for methanation and Haber-Bosch, 94.25%
      for methanol/Fischer-Tropsch, i.e. max three weeks downtime a year), which is
      the sector-coupling face of this method: process minimum load, not thermal
      commitment.
    papers:
      - "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
  - id: linearised-relaxed-uc
    what: >
      Full commitment formulation with u, start_up and shut_down relaxed to [0,1]
      continuous. Keeps start-up costs, minimum load and min up/down times in the
      model and keeps the problem an LP, so duals stay well-defined and prices remain
      readable. The unit can be fractionally committed, which understates the cost of
      inflexibility but is the only variant that scales to a European network at
      hourly resolution. PyPSA-Eur's default when UC is switched on at all.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
  - id: binary-uc
    what: >
      True MILP: u, start_up, shut_down binary. The only variant that actually enforces
      "on or off". Buys the discrete behaviour that produces realistic start-up
      patterns and price spikes; costs a branch-and-bound tree whose size grows with
      (committable units x snapshots), and destroys the dual/price interpretation
      unless you re-solve a fixed-status LP afterwards. The corpus runs it only on
      single-node or single-portfolio problems.
    papers:
      - "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
      - "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
      - "2021_Glismann_ancillary-services-acquisition-model.pdf"
  - id: clustered-unit-commitment
    what: >
      Commitment on generators that are already spatial/technology aggregates of many
      physical units. One status variable now gates a whole fleet block, so p_min_pu
      becomes a fleet-average minimum load and start_up_cost must be scaled to the
      aggregate p_nom. The right reading of the relaxed variant on a clustered network
      is "fraction of the fleet online", which is arguably MORE faithful than a binary
      on a 10 GW block — a point worth making to users who ask for "proper" MILP UC.
    papers:
      - "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
literature:
  - paper: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    tier: 1
    role: defines
    note: >
      The formulation reference for everything in this book: Sec. II-E states "unit
      commitment can be turned on for any generator. This introduces a time series of
      new binary status variables u_{n,r,t} in {0,1}", and Eqs. 16-20 give binary
      gating (16), minimum up and down times as rolling summations (17-18), and
      start-up/shut-down costs as continuous auxiliary variables linked by inequality
      to the binary transitions (19-20), added to the objective. Ramp limits r^u, r^d
      per unit of nominal power are Eq. 7 and are separate from commitment, optionally
      supplemented by start-up/shut-down ramping limits. Cite this paper for WHAT the
      constraints are; the implementation is pypsa's, not a model's.
  - paper: "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
    tier: 2
    role: defines
    note: >
      The corpus's only open-source stochastic UC tool, built as modular extensions to
      PyPSA on top of PyPSA's `committable` generators. MILP with binary commitment
      x_delta^{t,g}, minimum load and maximum power per generator AND per BESS, start-up
      and shut-down times, ramping (Eqs. 1-11). Demonstrated on a single-node German
      portfolio — 60 MWth waste-to-energy plant (15 MW_e), 6 MW / 6 MWh BESS, 10 MW /
      50 MWh heat storage — trading day-ahead and aFRR under price and heat-demand
      uncertainty, with ARIMAX-generated realisations. Two lessons to relay: (a) the
      extension point is PyPSA's committable machinery, not a reformulation, and (b)
      the demonstrated scale is ONE portfolio, which is the honest ceiling for binary
      UC plus stochastics.
  - paper: "2021_Glismann_ancillary-services-acquisition-model.pdf"
    tier: 2
    role: routine-use
    note: >
      The best source in the corpus for PARAMETER VALUES, and the clearest example of
      UC as market machinery rather than as a modelling refinement. ASAM embeds PyPSA
      as a dispatch engine per agent and per market-clearing step, using PyPSA's binary
      status u_{n,s,t} with minimum stable level, min up/down time, ramp up/down and
      start-up/shut-down cost (Table 3; Eqs. C.3 operating-level and C.4 min-up-time
      in the redispatch clearing; Appendix D for agent portfolio dispatch). Quotable
      fleet parameters (Table E.8): old gas CCGT p_min 50 MW, ramp 0.25 p.u./ISP,
      min_up = min_down = 12 ISP; coal p_min 400 MW, ramp 0.25, min_up = min_down =
      20 ISP; start-up costs EUR 6k-50k. Also the corpus's link between UC and
      all-or-none block orders: p_min_pu is what decides whether an order can be
      partially called. All runs are single-node, so the MILP never met a network.
  - paper: "2023_Hampp_Import-chemical-energy-carriers-Germany_PLOSONE.pdf"
    tier: 1
    role: routine-use
    note: >
      The must-run-minimum-load variant, and the reason this card is not only about
      thermal power plants. "Most components may be freely dispatched without
      restrictions on ramping rates and minimum must-run capacities ... Must-run
      capacities are only enforced for the synthesis of methane, ammonia, methanol and
      FT fuel." Implemented as continuous minimum availability fractions on synthesis
      capacity — 30% for methanation and Haber-Bosch, 94.25% for methanol and FT (max
      three weeks downtime per year) — with no binaries and no start-up costs. The
      practical pattern to copy when a user asks for "minimum load" on a Link.
  - paper: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    tier: 2
    role: critiques
    note: >
      The card's critique, and unusually useful because it is a PyPSA-Eur study (v2025.07.0,
      39 nodes, electricity-only, hourly, 2020-2024, 35 countries) that states its own
      omission and then measures the consequence. Sec. II.A: "the model does not include
      unit commitment constraints such as start-up costs, minimum up/down times, or
      thermal cycling limitations." Sec. IV attributes the failure to reproduce intra-day
      price spikes partly to the absence of "ramping constraints, efficiency differences,
      different fuel costs due to long-term agreements, startup costs, and outages". The
      honest framing for an interview: omitting UC does not bias annual energy much, but
      it systematically flattens the price distribution, so any question about price
      VOLATILITY (as opposed to price level) needs at least ramp-limits-only.
pitfalls:
  - pitfall: >
      pypsa-eur's data/unit_commitment.csv has columns for OCGT, CCGT, coal, lignite
      and nuclear ONLY. `oil`, `geothermal`, `waste` and `biomass` are all in the
      default electricity.conventional_carriers list and get NO unit-commitment data:
      `ppl.carrier.isin(unit_commitment)` tests membership in the csv's COLUMNS, so
      those carriers silently receive committable=False and remain freely dispatchable
      while every other thermal carrier is constrained. The run succeeds, the log says
      nothing, and the uncommitted carriers become the system's cheap flexibility.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      Add the missing columns to a copy of the csv before trusting a UC run, or narrow
      electricity.conventional_carriers to the five the table covers and say so. Verify
      after the fact with the `verifies` check below: every carrier you named must
      appear in n.generators.query('committable').carrier.unique().
  - pitfall: >
      The linear relaxation's tightening constraints are applied only when
      start_up_cost == shut_down_cost for ALL committable units. pypsa-eur's shipped
      table sets start_up_cost but has no shut_down_cost column, so shut_down_cost
      stays at its default 0 and the costs are never equal: the tightening is skipped
      and pypsa emits a WARNING ("the linear relaxation of the unit commitment cannot
      be tightened ... this might result in a longer solving time"). The default UC
      configuration therefore runs the LOOSEST relaxation and the slowest one.
    evidence: "2018_Brown_PyPSA-Python-for-Power-System-Analysis_JORS.pdf"
    note: >
      Grep the solver log for that warning before reporting relaxed-UC results. If you
      want the tightened relaxation, set shut_down_cost equal to start_up_cost in the
      csv — a modelling choice to declare, not a free fix.
  - pitfall: >
      A generator can be both committable and p_nom_extendable, and pypsa will happily
      build both constraint families over it: the committable constraints are indexed
      by get_committable_i with NO extendable exclusion, and they bound dispatch by
      the STATIC p_nom. In pypsa-eur's default config OCGT and CCGT are in
      electricity.extendable_carriers AND are given committable=True, so newly built
      OCGT/CCGT capacity is capped at the existing fleet's p_nom by the commitment
      constraint while the investment variable is free — expansion that cannot be
      dispatched.
    evidence: "2024_Welfonder_open-source-stochastic-unit-commitment-PyPSA.pdf"
    note: >
      Run UC on a dispatch problem with fixed capacities (operations-only-solve, or
      p_nom_extendable false everywhere). If you must combine them, remove the UC
      carriers from extendable_carriers first, and check the objective against a
      no-UC run — a large unexplained cost jump is this bug.
  - pitfall: >
      Binary UC destroys the dual variables. There is no meaningful marginal price for
      a MILP, so nodal prices, CO2 shadow prices and every metric derived from them are
      not comparable to an LP run — and pypsa will still write numbers into
      n.buses_t.marginal_price. This is the single most common silent
      misinterpretation when a user asks for "realistic prices" and gets given MILP UC.
    evidence: "2021_Glismann_ancillary-services-acquisition-model.pdf"
    note: >
      If the question is about PRICES, use linearised-relaxed-uc (LP, duals valid), or
      run the MILP, fix the resulting statuses, and re-solve as an LP to recover prices.
      See shadow-prices-and-marginal-values.
  - pitfall: >
      On a clustered network the commitment parameters are fleet averages applied to
      one aggregate generator. A binary status on a 10 GW carrier-at-a-bus block means
      the whole national coal fleet switches off together, which is less realistic than
      the relaxation it was chosen over. p_min_pu = 0.38 on that block is also not the
      fleet minimum: a real fleet reaches a much lower aggregate floor by shutting
      individual units.
    evidence: "2026_Karkossa_optimal-dispatch-models-recreate-reality.pdf"
    note: >
      At coarse clustering prefer linearised-relaxed-uc and read the status as "fraction
      of fleet online". Reserve binary-uc for few-node or single-portfolio studies, which
      is what the corpus does.
  - pitfall: >
      Commitment and ramp constraints are defined between CONSECUTIVE snapshots, so
      temporal aggregation silently neuters them: at 3-hourly resolution a
      0.25 p.u./h ramp limit becomes an effective 0.75 p.u. step, and a min_up_time of
      4 (interpreted in snapshots, not hours) becomes 12 hours. Both parameters must be
      rescaled when resolution changes; nothing in either workflow does it.
    evidence: "2021_Glismann_ancillary-services-acquisition-model.pdf"
    note: >
      min_up_time and min_down_time are counted in SNAPSHOTS by definition. Rescale the
      csv whenever clustering.temporal.resolution_elec changes, and never combine UC with
      time-segmentation-tsam, where snapshots have unequal, non-consecutive durations.
requires_methods:
  - operational-dispatch-and-rolling-horizon
