id: weather-year-ensembles
title: "Weather-year ensembles / inter-annual variability sampling"
summary: >
  Run the same system over many historical weather years — either as one solve per
  year or as a single solve over all of them — to separate genuine design robustness
  from the luck of one year.
question: >
  Is this answer a property of the system, or of the weather year I happened to model,
  and how much does the design move if the weather is different?
aliases:
  - "weather year"
  - "multiple weather years"
  - "inter-annual variability"
  - "interannual variability"
  - "design year"
  - "climate year"
  - "year-to-year variability"
  - "weather-year ensemble"
  - "multi-year optimisation"
  - "ERA5 reanalysis years"
  - "climate reanalysis"
  - "climate projection years"
  - "representative weather year"
when_to_use:
  - "is this result robust to the weather year"
  - "you used 2013 — what happens in a bad wind year"
  - "how much do capacities change from year to year"
  - "which weather year should I design for"
  - "run it over 30 years of weather instead of one"
  - "how much storage do I need to survive the worst year on record"
  - "does climate change alter the cost-optimal system"
  - "give me error bars on the capacity numbers"
  - "is one year enough for a capacity expansion study"
  - "test the design against a year it was not designed for"
family: temporal-resolution
prevalence:
  papers: 18
  tier1: 10
  tier2: 8
  sweep_hits: 62
  basis: >
    Hand-coded pass 1 over all 100 PDFs (2026-07-25) attributed 18 papers to this
    method. The regex screen returned 62 — by far the largest over-count in the book,
    and for a mechanical reason: the pattern includes '\bera5\b', and essentially every
    PyPSA paper mentions ERA5 because that is where atlite's capacity factors come
    from. Naming your reanalysis is not running an ensemble. The 18 retained are papers
    that either run multiple weather years, or make and defend an explicit single-year
    choice (role `routine-use`) — the latter matter to this card because "we used the
    PyPSA-Eur default 2013" is the baseline the method is arguing against, and 9 of the
    18 are exactly that. Only 8 papers run a genuine multi-year ensemble; the corpus's
    ensemble sizes are 3, 4, 38, 40, 41, 70 and 80 years.
procedure:
  - step: >
      Decide what the ensemble is FOR, because it fixes everything downstream. Three
      distinct purposes appear in the corpus and they are not interchangeable: (a) put
      error bars on a design (re-solve per year, report the spread), (b) produce ONE
      design robust to all sampled years (co-optimise across years, or intersect
      per-year results), (c) test a design built in one year against the others
      (dispatch-only, capacities fixed).
    handle: null
    provenance: null
  - step: >
      Choose the years. The corpus does this three ways: the full available record
      (38, 40, 41, 70, 80 years), a deliberately hard/easy bracket (1987 hard, 2020
      easy; or 1985/1987/2010 as "difficult" years), or a shuffled subsequence of
      growing length (1, 4, 16, 32, 48, 70) to show at what N the answer stops moving.
      Note the last one is the only construction that actually ANSWERS "is one year
      enough".
    handle: null
    provenance: null
  - step: >
      Obtain weather data for those years. This is the step that decides the boundary
      rung, and it is a DATA question, not a config question: a reanalysis cutout must
      exist covering each year and each region at the model's spatial extent.
    handle: "atlite.cutouts / atlite.default_cutout, and the cutout retrieve-or-build switch"
    provenance: "config/config.default.yaml:default_cutout; rules/common.smk:input_cutout"
  - step: >
      Move the snapshot window onto each year — and move the DEMAND year with it.
      Capacity factors follow the cutout; electricity demand comes from a separate
      observed series with its own, much shorter, coverage. Getting this wrong pairs
      2013 load with 1985 weather and destroys the temperature/demand correlation that
      is precisely what a cold-still-winter ensemble is trying to capture. Papers that
      go pre-2010 regress load on heating/cooling degree days instead.
    handle: "snapshots.{start,end,inclusive}; load.fixed_year"
    provenance: "scripts/_helpers.py:get_snapshots; scripts/build_electricity_demand.py:fixed_year"
  - step: >
      Re-derive every weather-dependent resource per year: VRE availability profiles,
      hydro inflow, temperature-driven heat demand, and (if modelled) hydro
      normalisation. A weather-year ensemble is not a solve-time sweep — it invalidates
      most of the resource-building half of the DAG, which is where its real cost sits.
    handle: "the profile-building rules, keyed on the cutout"
    provenance: "rules/build_electricity.smk:build_renewable_profiles; scripts/build_hydro_profile.py:eia_norm_year"
  - step: >
      Then EITHER (sequential) solve one independent capacity-expansion problem per
      year and collect N designs, OR (joint) concatenate the years into one snapshot
      set and solve once for a single design that must serve all of them. These are
      different problems: the sequential route gives a DISTRIBUTION of designs and
      scales linearly; the joint route gives ONE design and scales super-linearly in
      memory. Grochowicz reports 3.5-4 GB and ~23 min for one year against ~134 GB and
      1-2 days for the joint 41-year problem on the same network.
    handle: "the standard solve, once per year; or a multi-range snapshots spec plus cutout concatenation"
    provenance: "scripts/solve_network.py:solve_network; scripts/_helpers.py:load_cutout"
  - step: >
      Scale annualised quantities to the number of years actually in the snapshot set.
      Capital costs, CO2 caps and transmission volume limits are all per-year
      constants; a joint multi-year solve that leaves them unscaled is silently solving
      a different problem.
    handle: "Nyears = snapshot_weightings.objective.sum() / 8760"
    provenance: "scripts/prepare_network.py:Nyears"
  - step: >
      Aggregate across the ensemble: mean and spread (or error bars) per capacity,
      cost and curtailment quantity. Nothing in either workflow computes a
      cross-year distribution; per-run summary tables are the input to a script you
      write.
    handle: null
    provenance: null
  - step: >
      (validation, the step most studies skip) Cross-test: fix the capacities from the
      design built in year i and re-solve DISPATCH ONLY under year j, for all pairs.
      Grochowicz runs the full 40x40 matrix. This is what converts "the designs differ"
      into "designing for the wrong year costs you X", and it is the only step that
      detects a design that is infeasible out of sample.
    handle: "rule solve_operations_network, with capacities fixed from the expansion run"
    provenance: "scripts/solve_operations_network.py:fix_optimal_capacities"
variants:
  - id: single-design-year
    what: >
      One weather year, chosen and defended. The default and the corpus majority (9 of
      18 papers), usually 2013 because it is the PyPSA-Eur default, sometimes a
      deliberately low-wind year as a one-shot stress case. Buys nothing about
      robustness; the honest version STATES the choice as an assumption rather than
      leaving it implicit, and that is exactly what these papers do.
    papers:
      - "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
      - "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
      - "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
      - "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
  - id: multi-year-sequential-ensemble
    what: >
      One independent solve per year, N designs collected and compared. Cost scales
      LINEARLY in N and every solve is embarrassingly parallel, which is why this is
      how every large ensemble in the corpus was actually run (38, 40, 41, 70, 80
      years). Gives a distribution of designs and therefore error bars — but note that
      no single one of those designs is robust to the others.
    papers:
      - "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
  - id: multi-year-in-one-optimisation
    what: >
      All years concatenated into ONE snapshot set and solved once, giving a single
      design that must serve every sampled year. This is the only construction that
      directly answers "one design robust to all of these" without post-processing.
      A different and much larger problem: memory grows with the total snapshot count,
      and the corpus's 41-year joint solve needed ~134 GB and 1-2 days against 4 GB and
      23 min per single year. Universally paired with coarsening (3-hourly or
      segmentation) and country-level spatial resolution.
    papers:
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
  - id: growing-subsequence-convergence
    what: >
      Solve over 1, then 4, then 16, 32, 48, 70 years of a shuffled year sequence and
      watch when the reported quantity stops moving. The only construction in the
      corpus that answers "how many years do I need" rather than assuming an answer,
      and it is cheap to add to a joint or sequential study you are already running.
      Brown finds the distinction is regime-dependent: with inelastic demand the price
      duration curve never settles, with elastic demand it settles quickly.
    papers:
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
      - "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
  - id: difficult-year-bracket
    what: >
      Two or three years chosen for DIFFICULTY rather than sampled — a hard year and
      an easy year, identified from a prior full ensemble. Buys most of the robustness
      signal for 2-3x a single solve instead of 40x, and is the pragmatic default when
      the base case is expensive (sector-coupled, multi-horizon). Its validity is
      entirely inherited from whichever full ensemble picked the years, which must be
      cited.
    papers:
      - "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
      - "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
      - "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
      - "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
  - id: cross-year-design-validation
    what: >
      Fix capacities from the year-i design and re-solve dispatch only under year j,
      over all pairs. Converts a spread of designs into a cost of being wrong, and is
      the only construction that finds out-of-sample infeasibility. Cheap relative to
      expansion (dispatch LPs), but N^2 of them.
    papers:
      - "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
      - "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
      - "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
  - id: climate-projection-years
    what: >
      Weather years drawn from downscaled CLIMATE MODEL output (EURO-CORDEX under
      RCP 8.5) rather than reanalysis, so the ensemble spans future decades and
      multiple GCMs instead of the historical record. A genuinely different data path:
      the fields are a climate model's, not an observation-constrained reanalysis's,
      and no PyPSA workflow has a retrieval route for them. Answers "does the
      cost-optimal system change under climate change", which reanalysis cannot.
    papers:
      - "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
      - "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
  - id: reanalysis-climatology-only
    what: >
      Use the multi-decade reanalysis record as a meteorological sample WITHOUT running
      the optimisation — count events, classify weather regimes, characterise
      inter-annual spread in capacity factors. Vastly cheaper (no LP at all) and often
      the right first step: it tells you whether the years you are about to spend
      compute on are actually different from each other.
    papers:
      - "2023_Mockert_Dunkelflauten-Germany_MetApps.pdf"
literature:
  - paper: "2023_Grochowicz_weather-induced-extreme-events-renewable.pdf"
    tier: 2
    role: defines
    note: >
      Sets the modern pattern this card describes: 40 independent annual capacity
      expansions on PyPSA-Eur (July-June windows, deliberately, to keep winters
      intact), each year giving its own optimal design, and the SHADOW PRICES rather
      than the capacities as the primary analysis object. Also introduces the cross-year
      validation matrix — 1600 dispatch simulations over all 40x40 design-year x
      weather-year pairs. States the tradeoff explicitly: single-year solves buy
      spatial/temporal resolution that a joint multi-year solve cannot afford. The
      July-June window is a concrete detail to relay; a calendar-year ensemble splits
      every winter across two members.
  - paper: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    tier: 2
    role: extends
    note: >
      The composition with MGA, and the source of the compute numbers this card quotes
      for the sequential-vs-joint distinction: 41 years (1980-2020) at 3-hourly, one
      node per country, each single-year solve 3.5-4 GB / ~23 min with Gurobi on 2
      threads, against ~134 GB and 1-2 days for the equivalent JOINT 41-year
      optimisation on the same network. Also demonstrates the load-side fix for
      pre-2010 years: load regressed on HDD/CDD and weekly profiles from ENTSO-E
      2010-2014 rather than taken from observation. Robust design becomes the Chebyshev
      centre of the intersected per-year near-optimal spaces.
  - paper: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The reference for the sequential-versus-joint comparison done deliberately: four
      single-year runs (2011-2014) AND joint optimisations over 1, 2, 3 and 4
      consecutive years, asking directly whether one weather year suffices for capacity
      design. Limited to four years by data availability — specifically the need for
      CONSISTENT load and hydro inflow alongside the weather, which is the same
      constraint pypsa-eur still has. The clearest early statement that the ensemble's
      binding limit is the demand and inflow series, not the reanalysis.
  - paper: "2018_Schlott_Climate-Change-Renewable-Network_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The climate-projection variant: three EURO-CORDEX ensemble members (CNRM-CM5,
      EC-EARTH, MPI-ESM-LR downscaled with RCA-4) under RCP 8.5 at 0.11 deg / 3-hourly,
      split into four periods (HIS 1970-2005, BOC 2006-2037, MOC 2038-2069, EOC
      2070-2100) and further into non-overlapping 6-8-year sub-intervals, each
      independently optimised. Ensemble mean AND spread of system cost reported. The
      structural point for this book: the weather input is a climate model's output, so
      neither model's cutout retrieval path applies and the data must be brought in
      from outside.
  - paper: "2019_Liu_Hydro-power-storage-transmission-China_ApplEnergy.pdf"
    tier: 1
    role: canonical-use
    note: >
      The largest single-source ensemble outside Europe: 38 CFSR reanalysis years
      (1979-2016) over a 31-province Chinese model, each solved separately, with mean
      and standard deviation across years as error bars on capacities, curtailment and
      transmission cost. Notably the dataset is one CONSISTENT 38-year series covering
      wind, solar, hydro inflow AND temperature-driven cooling demand together — the
      thing pypsa-eur's default data stack does not supply, and the reason a non-European
      ensemble is often a data-assembly project rather than a config change.
  - paper: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    tier: 2
    role: canonical-use
    note: >
      The largest ensemble in the corpus and the best-documented cost: 80 independent
      hourly 90-node PyPSA-Eur v0.13 capacity expansions, one per ERA5 year 1941-2021,
      each ~60 GB RAM and ~3 h on an HPC cluster. Keeps the July-June window and
      explicitly disregards leap years. Demand is adjusted for temperature-dependent
      heating/cooling per weather year — i.e. the demand series is regenerated with the
      weather, not held fixed. Quote the 80 x 60 GB x 3 h figure to any user who asks
      for "the full record at hourly resolution".
  - paper: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    tier: 1
    role: canonical-use
    note: >
      70 weather years (1951-2020, Bloomfield et al. 2022 ESSD, ERA-based) on a
      single-node model, and the source of the growing-subsequence construction: solve
      over 1, 4, 16, 32, 48 and 70 years of a Fischer-Yates-shuffled sequence (seed
      123) and watch convergence. The finding is a warning about the whole method:
      whether the ensemble converges is REGIME-dependent, not a property of the
      weather — inelastic demand gives price variance that keeps growing with years
      added (high prices clustering in the wind-scarce 1960s), elastic demand settles.
      Also splits 35 years for long-term design and 35 held out for out-of-sample
      dispatch, the cleanest train/test discipline in the corpus.
  - paper: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    tier: 2
    role: canonical-use
    note: >
      Provides the metric for comparing designs ACROSS years rather than eyeballing the
      spread: a pseudometric that re-solves each period's LP with the other period's
      optimal capacities imposed as a lower bound and sums the additional cost. On
      PyPSA-Eur at 45-128 nodes with CNRM/EURO-CORDEX climate data, four 6-7-year
      slices (1970-1976, 2000-2006, 2038-2044, 2094-2101), all six pairwise
      combinations: worst pair 5.1 EUR/MWh, best 3.5 EUR/MWh, and the conclusion that
      2000-2006 is UNREPRESENTATIVE. Directly relevant to users who assume a recent
      decade is a safe default.
  - paper: "2023_vanGreevenbroek_regional-overall-energy-system-flexibility.pdf"
    tier: 2
    role: canonical-use
    note: >
      The difficult-year-bracket variant done properly: three years (1985, 1987, 2010)
      selected as "difficult" following Grochowicz, crossed with four cost/land-use
      variants into a 12-scenario set on sector-coupled PyPSA-Eur-Sec at 1500 time
      segments. Shows the pragmatic pattern for expensive base cases — weather year as
      one dimension of a scenario matrix rather than a standalone ensemble — and that
      the year selection's validity is borrowed from a prior full-ensemble study.
  - paper: "2026_Geis_Managing-the-Mismatch-Flexibility_AdvApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      A three-year sensitivity (2013, 2020, 2023) on a sector-coupled German model,
      main results from a single year. Useful because it QUANTIFIES what the small
      bracket bought: daily flexibility needs vary by at most 15%, weekly 18%, annual
      20% — an order-of-magnitude answer to "how much does the weather year matter"
      for a flexibility question, contextualised against IEA's 30% figure for annual
      flexibility.
  - paper: "2024_vanGreevenbroek_robust-european-green-hydrogen-strategy.pdf"
    tier: 2
    role: routine-use
    note: >
      Two-year bracket (1987 difficult, 2020 easy, both identified from Grochowicz's
      full ensemble) as one of six scenario dimensions across 216 scenarios, so 432
      full multi-horizon pathway optimisations. The example to cite when a user wants a
      weather ensemble on top of a myopic pathway: the year count collapses to two
      because the base case is already 6 horizons x 216 scenarios. States plainly that
      no extreme-event stress test beyond the 1987 choice was performed.
  - paper: "2021_Zeyen_Mitigating-heat-demand-peaks_Energy.pdf"
    tier: 1
    role: routine-use
    note: >
      Multiple historical ERA5 weather years as an SI robustness check on a
      sector-coupled 48-node heat study. Relevant specifically because heat demand is
      the most weather-sensitive load in the model — an ensemble is more load-driven
      than VRE-driven here, which changes which data must move with the year. The
      number of years is not stated in the main text.
  - paper: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    tier: 1
    role: critiques
    note: >
      The explicit statement of the tradeoff, from the other side: a spatial-resolution
      sweep from 37 to 1250 nodes could only be afforded by fixing a single weather
      year (2013), and the authors name single-year use as a limitation of the work
      rather than a choice. The card's critique payload — resolution in one dimension is
      bought by collapsing another, and a weather ensemble competes directly with
      spatial detail for the same compute budget.
  - paper: "2023_Mockert_Dunkelflauten-Germany_MetApps.pdf"
    tier: 1
    role: routine-use
    note: >
      The no-optimisation variant: 40 years of ERA5 (1979-2018) run through atlite for
      capacity factors only, with weather-regime classification and demand anomalies,
      no network model at all. Establishes the inter-annual spread that matters — 0 to
      10 Dunkelflaute events per extended winter — which is the argument for why one
      year cannot be representative, obtained for the cost of a data pass.
  - paper: "2024_Glaum_Offshore-power-hydrogen-North-Sea_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Cited for the baseline this method argues against, stated at its cleanest: "we
      take the weather year of 2013 which is the default year in PyPSA-Eur", on a
      130-node sector-coupled offshore study with ERA5 + SARAH-2. No sensitivity to the
      choice. The default is doing unexamined work in a large fraction of the
      literature, including papers whose conclusions are about VRE siting.
  - paper: "2025_Franken_Power-system-benefits-transport-heating-flexibility-GB_ApplEnergy.pdf"
    tier: 1
    role: routine-use
    note: >
      Single ERA5 year (2019) applied uniformly to VRE capacity factors and the ESPENI
      demand profile on a GB fork. The instructive detail is the CONSISTENCY: weather
      and demand come from the same year, which is what pypsa-eur's default
      configuration gives you and what a careless weather-year change breaks.
  - paper: "2026_Duque-Perez_demand-scenarios-weather-variability.pdf"
    tier: 2
    role: routine-use
    note: >
      The pypsa-earth data point, and the only weather-year sensitivity on earth in the
      corpus: one low-wind ERA5 year (2016) selected on nominal wind full-load hours,
      on a 14-node sector-coupled Morocco model. Result worth relaying because it is a
      negative one: weather variability moved system cost by +0.84% on average, which
      the authors attribute to spatial diversification of renewables. A one-year
      sensitivity, not an ensemble — consistent with earth's registry status.
  - paper: "2022_Parzen_PyPSA-Earth-global-open-energy-model-Africa_ApplEnergy.pdf"
    tier: 2
    role: routine-use
    note: >
      Establishes what weather years pypsa-earth actually ships: demand predictions for
      2030/2040/2050/2100 each paired with ERA5 weather years 2011, 2013 and 2018, with
      ERA5 nominally spanning 1959-2021. The demonstration runs use one year. The gap
      between "ERA5 covers 1959-2021" and "three years are provided" is the earth
      ladder in one sentence.
pitfalls:
  - pitfall: >
      The demand series does not move with the weather. Observed load data covers only
      roughly the last fifteen years, while the reanalysis covers decades — so a
      pre-2010 weather year either has no load at all or gets a fixed recent year's
      load pasted on, which decorrelates temperature from demand. That correlation is
      the entire mechanism behind cold-still-winter stress, so the ensemble
      systematically UNDERSTATES the hard years it was built to find.
    evidence: "2018_Schlachtberger_Cost-optimal-scenarios-weather_Energy.pdf"
    note: >
      Schlachtberger capped the ensemble at four years for exactly this reason
      (consistent load and hydro inflow). Either stay inside the observed-load window,
      or replace the load series with a temperature regression as Grochowicz does
      (HDD/CDD plus weekly profiles fitted on ENTSO-E) — and say which you did. Never
      combine a distant weather year with load.fixed_year and call it an ensemble.
  - pitfall: >
      Solving per year and solving across years answer different questions, and users
      routinely ask for one while meaning the other. N separate solves give a
      DISTRIBUTION of N designs, none of which is robust to the other years; one joint
      solve gives ONE design robust to all sampled years. Reporting the mean of the N
      per-year designs is not the joint solution and can be infeasible under any
      individual year.
    evidence: "2022_Grochowicz_intersecting-near-optimal-spaces-weather.pdf"
    note: >
      Fix the purpose before the ensemble (procedure step 1). If the user needs one
      robust design and the joint solve is unaffordable — 134 GB versus 4 GB in
      Grochowicz — the defensible substitutes are intersecting per-year near-optimal
      spaces (see mga-near-optimal-space) or validating a candidate design across all
      years with cross-year-design-validation. Averaging is not one of them.
  - pitfall: >
      A recent decade is not a safe default. Schyska's cross-constraining metric finds
      the 2000-2006 period UNREPRESENTATIVE relative to other slices, at a misallocation
      cost of up to 5.1 EUR/MWh between period pairs — and 2013, the pypsa-eur default,
      sits in that neighbourhood.
    evidence: "2020_Schyska_sensitivity-power-system-expansion-models.pdf"
    note: >
      Do not defend a single year by its recency. Either justify it against a published
      ensemble (a named difficult/easy year), or run the difficult-year-bracket variant
      — two or three years is enough to expose whether the default was lucky.
  - pitfall: >
      Whether the ensemble converges is a property of the model's regime, not of the
      weather. Brown shows the price duration curve never settles as years are added
      under perfectly inelastic demand (scarcity events cluster in a wind-poor decade),
      while it settles quickly with elastic demand. So "we used 30 years, that is
      enough" is not a statement about the number 30.
    evidence: "2025_Brown_Price-formation-without-fuel-costs_EnergyEcon.pdf"
    note: >
      Test convergence rather than assuming it (growing-subsequence-convergence: 1, 4,
      16, 32, 48 years of a shuffled sequence). Be especially wary for quantities
      dominated by tails — prices, scarcity rents, peaking and long-duration storage
      capacity — as opposed to annual energy, which settles fast.
  - pitfall: >
      A weather ensemble competes with spatial and temporal resolution for the same
      compute budget, and the trade is usually made silently. Frysztacki's 37-to-1250-node
      sweep had to fix one weather year to be affordable and names it as a limitation;
      the ensemble studies in the corpus run at country resolution and 3-hourly for the
      mirror-image reason.
    evidence: "2022_Frysztacki_clustering-methods-spatial-reduction_EnergyInformatics.pdf"
    note: >
      Decide which dimension the question actually needs before promising both. Cost the
      ensemble against cost_profile below, and coarsen deliberately (segmentation
      preserves extremes better than nH averaging, which matters more here than
      elsewhere because the extremes ARE the signal).
  - pitfall: >
      Calendar-year windows split every winter across two ensemble members, so the
      single most system-defining event type — the multi-day December-January
      cold-and-still spell — is systematically cut in half.
    evidence: "2025_Grochowicz_resilience-metrics-backup-investments.pdf"
    note: >
      Use July-June windows, as both Grochowicz studies do, and handle leap days
      explicitly (they drop them). This is one line of snapshot config and it changes
      which events the ensemble can see.
