id: electricity-load
title: Baseline electricity load
summary: >-
  The exogenous hourly electricity demand time series attached to the network's
  AC buses — where the country-level profile comes from, how it is scaled, and
  how it lands on nodes as Load components.
when_to_use:
  - "electricity demand / load time series"
  - "how much power does the country consume in the model"
  - "change / scale the electricity load"
  - "use a different demand dataset or demand year"
  - "load profile looks wrong / too high / too low"
  - "add a big new consumer (data center, factory, desalination plant) to the grid"
  - "hourly demand curve"
  - "where does the load data come from"
  - "known in pypsa-eur as: Electric load, electric demand, electricity"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Rule build_demand_profiles creates resources/demand_profiles.csv: hourly
        country-level electricity demand from one of two sources — (a) GEGIS
        machine-learning predictions shipped as continental NetCDF/CSV files under
        data/ssp2-2.6/{prediction_year}/era5_{weather_year}/ (path assembled by
        get_load_paths_gegis; the SSP is hardcoded to "ssp2-2.6" as a legacy option),
        or (b) the DemandCast dataset (data/demand/forecasts_on_historical_period.parquet,
        hourly forecasts on historical weather 2000-2024, read by read_demcast_load).
        The country series is scaled by load_options.scale (scalar, or per-country
        dict with a DEFAULT fallback) and split across the LV-substation bus regions
        of each country by 0.6*GDP + 0.4*population weights computed from the GADM
        shapes (nested function upsample). attach_load in add_electricity.py then
        adds one Load per bus with this p_set.
      mechanism: >-
        build_demand_profiles(n, load_source, ...) reads the source selected by
        load_options.source ("gegis" or "demcast"; "ssp" is a deprecated alias for
        gegis), filters to config countries, applies the scale factor, intersects
        GADM sub-national shapes with the onshore Voronoi regions
        (shapes_to_shapes) and distributes each country's hourly series with
        factors = normed(0.6 * normed(gdp_n) + 0.4 * normed(pop_n)); zero-weight
        countries fall back to a uniform split. The result is trimmed to the
        snapshot window and written as a bus x time CSV consumed by the
        add_electricity rule.
      not_covered: >-
        Only one SSP trajectory exists (folder name "ssp2-2.6" is hardcoded);
        GEGIS files cover the weather/prediction-year combinations present in the
        data bundles only; DemandCast is historical-weather-only (2000-2024) with
        no future prediction year. There is no demand elasticity (pure p_set), no
        sub-national metered load data, and no explicit data-center or
        desalination electricity demand category anywhere in the workflow (the
        strings do not occur in scripts or config) — such loads can only enter via
        the uniform scale factor or a manual edit. Sector-coupled runs later
        rescale the residential/services share of this profile to UN-statistics
        energy totals in add_residential/add_services.
      provenance: "Snakefile:rule build_demand_profiles ; scripts/build_demand_profiles.py:get_load_paths_gegis ; scripts/build_demand_profiles.py:read_demcast_load ; scripts/add_electricity.py:def attach_load"
    levers:
      - key: load_options.source
        effect: "Selects the demand dataset: \"gegis\" (SSP2-2.6 prediction NetCDFs) or \"demcast\" (DemandCast parquet); \"ssp\" is accepted as deprecated alias for gegis."
        default: "\"gegis\""
        provenance: "config.default.yaml:load_options ; scripts/build_demand_profiles.py:load_source"
      - key: load_options.weather_year
        effect: "Weather year of the load profile; for GEGIS it picks the era5_{year} folder (data available for 2011, 2013, 2018 per config comment), for DemandCast it filters the parquet to that year (2000-2024)."
        default: "2013"
        provenance: "config.default.yaml:weather_year ; scripts/build_demand_profiles.py:weather_year"
      - key: load_options.prediction_year
        effect: "Demand projection year of the GEGIS dataset (folder level in the load path); only used when source is gegis."
        default: "2030"
        provenance: "config.default.yaml:prediction_year ; scripts/build_demand_profiles.py:prediction_year"
      - key: load_options.scale
        effect: "Multiplies the load time series; accepts a scalar (2 = double all countries) or a per-country dict with a DEFAULT key for unlisted countries."
        default: "1"
        provenance: "config.default.yaml:scale ; scripts/build_demand_profiles.py:DEFAULT_VAL"
    boundary:
      - variant: "Scale total electricity demand up/down (whole region or per country)"
        rung: L0
        note: "load_options.scale as scalar or {country: factor, DEFAULT: x} dict — no code."
      - variant: "Switch to DemandCast historical demand"
        rung: L1
        note: "Set load_options.source: demcast and a weather_year in 2000-2024; the parquet must be present (databundle key demandcast_full in configs/bundle_config.yaml) — the script raises if missing."
      - variant: "Different weather year / prediction year"
        rung: L1
        note: "Config keys exist but only combinations shipped in the data bundles resolve (GEGIS: era5_2011/2013/2018, prediction years like 2030); anything else 404s at file level."
      - variant: "Supply your own hourly country demand series"
        rung: L3
        note: "Drop a CSV in the GEGIS layout (semicolon-separated with region_code/time/Electricity demand columns, read by load_demand_csv) at the path get_load_paths_gegis expects, or overwrite resources/demand_profiles.csv (bus x snapshot) directly before add_electricity runs."
      - variant: "Add a single large consumer (data center, mine, desalination) at a specific bus"
        rung: L2
        note: "No hook exists; smallest edit is adding a constant/profiled Load in attach_load (add_electricity.py) or post-processing demand_profiles.csv for the target bus column."
      - variant: "A different SSP trajectory for GEGIS"
        rung: L3
        note: "ssp is hardcoded to \"ssp2-2.6\" in get_load_paths_gegis and only that folder is in the bundles; needs both the code constant changed and matching NetCDFs supplied."
    where:
      - change: "Demand source selection, scaling, custom-CSV ingestion"
        anchor: "scripts/build_demand_profiles.py functions get_load_paths_gegis / load_demand_csv / read_demcast_load"
        provenance: "scripts/build_demand_profiles.py:load_demand_csv"
      - change: "Nodal distribution weights (0.6 GDP / 0.4 pop hardcoded)"
        anchor: "scripts/build_demand_profiles.py nested function upsample inside build_demand_profiles"
        provenance: "scripts/build_demand_profiles.py:def upsample"
      - change: "Attaching loads to the network (place to add a bespoke Load)"
        anchor: "scripts/add_electricity.py function attach_load (rule add_electricity)"
        provenance: "scripts/add_electricity.py:def attach_load"
    data_dependencies:
      - input: "GEGIS demand NetCDFs data/ssp2-2.6/{prediction_year}/era5_{weather_year}/{continent}.nc"
        required_for: "Default gegis source"
        availability: "retrieved via data bundles (configs/bundle_config.yaml lists ssp2-2.6 files); limited year combinations"
      - input: "DemandCast parquet data/demand/forecasts_on_historical_period.parquet"
        required_for: "source: demcast"
        availability: "must be downloaded (bundle key demandcast_full); script errors if absent"
      - input: "resources/shapes/gadm_shapes.geojson with gdp and pop columns"
        required_for: "GDP/population disaggregation to buses"
        availability: "built by build_shapes from WorldPop + GDP rasters — region-dependent downloads"
    demand_dimensions:
      driver: "Country-level GDP/population-based ML prediction (GEGIS ssp2-2.6) or DemandCast hourly forecast; magnitude tuned by load_options.scale"
      spatial: "Within each country: 0.6*GDP + 0.4*pop over GADM shapes intersected with bus regions (hardcoded weights)"
      temporal: "Hourly profile taken directly from the source dataset for load_options.weather_year"
      scenario: "load_options.prediction_year picks the GEGIS projection year; no demand wildcard at the electricity-only stage"
  - model: pypsa-eur
    version_anchor: {ref: "3e32e3c619f6ab79ada87759d6b915e9d5f3ff56", date: "2026-06-16"}
    out_of_box:
      covers: >-
        Rule build_electricity_demand stitches measured hourly country load
        2010-2025 from three sources (ENTSO-E, OPSD, GB NESO;
        entsoe.combine_first(opsd).combine_first(neso)), fills small gaps by
        linear interpolation and large gaps by copying week-shifted time slices
        (fill_large_gaps), applies hardcoded per-country manual fixes
        (manual_adjustment) plus template-year fills for UA/MD/AL/BA/XK/MK/CY,
        and optionally supplements remaining holes with a synthetic
        machine-learning demand series. Rule build_electricity_demand_base
        disaggregates the country series to base bus regions (upsample_load);
        attach_load in add_electricity.py multiplies by load.scaling_factor and
        adds the Load components.
      mechanism: >-
        The gap-filling pipeline is driven entirely by the load: config block
        (fill_gaps.enable, fill_gaps.interpolate_limit,
        fill_gaps.time_shift_for_large_gaps, manual_adjustments,
        supplement_synthetic — the synthetic file comes from rule
        retrieve_synthetic_electricity_demand). load.fixed_year lets one demand
        year be reused regardless of the weather snapshots (reindexed onto the
        snapshot year). An assert stops the workflow if any NaNs survive.
      not_covered: >-
        Historical/measured demand only — there is no built-in projection of
        future electricity demand for the electricity-only workflow (only the
        uniform load.scaling_factor); no explicit data-center or desalination
        demand category (neither string occurs in scripts or config); demand is
        inelastic p_set. Sector-coupled runs add electrified heat/transport/
        industry demand on top of this base via separate rules, not via this one.
      provenance: "rules/build_electricity.smk:rule build_electricity_demand ; scripts/build_electricity_demand.py:manual_adjustment ; scripts/build_electricity_demand.py:fill_large_gaps ; scripts/add_electricity.py:def attach_load"
    levers:
      - key: load.scaling_factor
        effect: "Uniform multiplier applied to the nodal load in attach_load (load *= scaling)."
        default: "1.0"
        provenance: "config/config.default.yaml:scaling_factor ; scripts/add_electricity.py:def attach_load"
      - key: load.fixed_year
        effect: "If set to a year, that demand year is used and reindexed onto the snapshot year (decouples demand year from weather year); false uses the snapshot window."
        default: "false"
        provenance: "config/config.default.yaml:fixed_year ; scripts/build_electricity_demand.py:fixed_year"
      - key: load.fill_gaps.enable
        effect: "Toggles interpolation of small gaps (interpolate_limit hours) and week-shift copying of large gaps (time_shift_for_large_gaps)."
        default: "true"
        provenance: "config/config.default.yaml:fill_gaps ; scripts/build_electricity_demand.py:fill_large_gaps"
      - key: load.supplement_synthetic
        effect: "Fills remaining missing data with the retrieved synthetic (ML-modelled) load series."
        default: "true"
        provenance: "config/config.default.yaml:supplement_synthetic ; scripts/build_electricity_demand.py:synthetic_load"
      - key: load.manual_adjustments
        effect: "Applies the hardcoded per-country outlier removals and time-slice copies in manual_adjustment."
        default: "true"
        provenance: "config/config.default.yaml:manual_adjustments ; scripts/build_electricity_demand.py:manual_adjustment"
      - key: load.substation_only
        effect: "Restricts load allocation to regions of buses tagged substation_lv in the base network."
        default: "true"
        provenance: "config/config.default.yaml:substation_only ; scripts/build_electricity_demand_base.py:substation_only"
    boundary:
      - variant: "Scale electricity demand (e.g. electrification uplift)"
        rung: L0
        note: "load.scaling_factor — but it is a single uniform factor, not per-country."
      - variant: "Use one fixed demand year across weather years"
        rung: L0
        note: "load.fixed_year: 2019 etc."
      - variant: "Per-country scaling"
        rung: L2
        note: "No per-country dict exists (unlike pypsa-earth); smallest edit is scaling columns in build_electricity_demand.py or the load DataFrame in attach_load."
      - variant: "Supply your own country demand time series"
        rung: L3
        note: "Replace/patch resources/electricity_demand.csv (UTC index x ISO-2 columns) between build_electricity_demand and build_electricity_demand_base."
      - variant: "Add a single large consumer (data center, desalination) at a bus"
        rung: L2
        note: "No hook; add a Load in attach_load (add_electricity.py) or edit the nodal netCDF resources/electricity_demand_base_s.nc."
      - variant: "Endogenous demand growth / elasticity"
        rung: L5
        note: "Load is exogenous p_set throughout; price-responsive demand needs new component logic."
    where:
      - change: "Gap-filling / source merging / demand-year selection"
        anchor: "scripts/build_electricity_demand.py (rule build_electricity_demand)"
        provenance: "scripts/build_electricity_demand.py:repeat_years"
      - change: "Country-to-node disaggregation"
        anchor: "scripts/build_electricity_demand_base.py function upsample_load (rule build_electricity_demand_base)"
        provenance: "scripts/build_electricity_demand_base.py:upsample_load"
      - change: "Load attachment and scaling (place to add a bespoke Load)"
        anchor: "scripts/add_electricity.py function attach_load"
        provenance: "scripts/add_electricity.py:def attach_load"
    data_dependencies:
      - input: "OPSD / ENTSO-E / NESO hourly country load CSVs"
        required_for: "The measured base series"
        availability: "exists by default (retrieve_electricity_demand_* rules)"
      - input: "Synthetic electricity demand CSV"
        required_for: "supplement_synthetic gap filling (not available for UA, MD, XK, CY, MT)"
        availability: "exists by default (rule retrieve_synthetic_electricity_demand)"
      - input: "JRC ENERGY atlas raster, GB DESNZ consumption workbook, NUTS3 shapes"
        required_for: "Nodal disaggregation (see demand-spatial-disaggregation)"
        availability: "exists by default (retrieve rules)"
    demand_dimensions:
      driver: "Measured national consumption (ENTSO-E/OPSD/NESO), synthetic fill; magnitude tuned by load.scaling_factor"
      spatial: "Energy-atlas raster (EU27) > GB local-authority statistics > NUTS3 GDP/pop key (load.distribution_key)"
      temporal: "Actual metered hourly profiles of the chosen years; load.fixed_year decouples demand from weather year"
      scenario: "None built in for electricity-only runs — a single scaling_factor; sector pathway machinery lives elsewhere"
