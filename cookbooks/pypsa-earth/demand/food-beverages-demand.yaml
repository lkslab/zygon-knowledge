id: food-beverages-demand
title: "Food, beverages & tobacco demand"
summary: >
  Industrial energy demand of the food, beverages and tobacco sector — process heat
  (ovens, drying, steam), refrigeration and machinery electricity — and how it is
  quantified, located, projected and served in the model.

when_to_use:
  - "add or change food industry demand"
  - "food and beverage processing energy"
  - "dairy / brewery / bakery energy demand"
  - "electrify food-industry heat"
  - "food industry steam and boilers"
  - "refrigeration and cooling load of food processing"
  - "tobacco industry energy"
  - "decarbonise food manufacturing"
  - "grow the food sector in a scenario"
  - "food industry heat pumps"

models:

  - model: pypsa-earth
    version_anchor: { ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08" }

    out_of_box:
      covers: >
        Country-level final energy of the subsector 'food and tobacco' (electricity,
        gas, oil, coal, biomass, heat) from UN Statistics Division energy balances,
        grown to the planning horizon by a per-country CAGR, distributed to nodes and
        served as annual-constant loads.
      mechanism: >
        Rule build_base_industry_totals parses the UNSD txt exports in
        data/demand/unsd/data, maps 'consumption by food and tobacco' (and 'food,
        beverage and tobacco industry') transactions via data/unsd_transactions.csv
        to the clean subsector 'food and tobacco' and pivots to country x carrier
        totals (MWh). Rule build_industry_demand scales a unit production index by
        (1+CAGR)^(planning_horizon-base_year) using the 'food and tobacco' column of
        data/demand/industry_growth_cagr.csv, distributes it to nodes via the
        industrial distribution key — the plant database has no food-industry
        technology, so the GDP-share key applies — multiplies with the country
        carrier totals and sums over all subsectors into
        industrial_energy_demand_per_node (nodes x carriers). In
        prepare_sector_network, add_industry turns each carrier column into constant
        loads: 'industry electricity', 'gas for industry', 'solid biomass for
        industry', 'naphtha for industry', 'H2 for industry', 'low-temperature heat
        for industry' (p_set = annual energy / 8760).
      not_covered: >
        No physical production or output index (energy only); no process detail
        (ovens, drying, steam, cooling are not distinguished) and no temperature
        bands; subsector identity is lost after build_industry_demand (energy pooled
        per carrier with all other industry); no process emissions for this subsector
        (emission factor 0); loads are annual-constant; no config lever to switch the
        sector's fuel mix (e.g. electrify its heat).
      provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals; data/unsd_transactions.csv:food and tobacco; scripts/build_industry_demand.py:clean_industry_list; scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: sector.enable.industry
        effect: "Gates the whole industry demand block (add_industry) in prepare_sector_network; false removes all industrial loads including food & tobacco."
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:enable[\"industry\"]"
      - key: demand_data.base_year
        effect: "UNSD energy-balance year used as base and as start year of the CAGR growth exponent."
        default: "2019"
        provenance: "config.default.yaml:base_year; scripts/build_base_industry_totals.py:base_year; Snakefile:build_base_industry_totals"
      - key: demand_data.update_data
        effect: "Re-downloads the UNSD energy balances into data/demand/unsd/data (needed on first run)."
        default: "true"
        provenance: "config.default.yaml:update_data; Snakefile:unsd_paths"
      - key: demand_data.other_industries
        effect: "Intended toggle for the unspecified 'other' industry aggregate alongside the named subsectors (note: in create_industry_base_totals the drop call's result is not assigned, so the 'other' column persists regardless)."
        default: "false"
        provenance: "config.default.yaml:other_industries; scripts/build_base_industry_totals.py:include_other"
      - key: custom_data.industry_demand
        effect: "Replaces the whole UNSD+CAGR chain with a user file data/custom/industry_demand_{demand}_{planning_horizons}.csv (country x carrier x subsector), letting you set the food & tobacco energy and carrier split directly."
        default: "false"
        provenance: "config.default.yaml:industry_demand; scripts/build_industry_demand.py:snakemake.params.industry_demand"
      - key: custom_data.industry_database
        effect: "Uses data/custom/industrial_database.csv instead of the built default plant database for the spatial distribution keys — the only way to get food-plant-based spatial allocation."
        default: "false"
        provenance: "config.default.yaml:industry_database; scripts/build_industrial_distribution_key.py:snakemake.params.industry_database"

    boundary:
      - variant: "Turn industrial (incl. food & tobacco) demand on/off"
        rung: L0
        note: "sector.enable.industry."
      - variant: "Change base year of the demand data"
        rung: L1
        note: "demand_data.base_year (must exist in the UNSD data)."
      - variant: "Change food-sector growth trajectory"
        rung: L3
        note: "No config key — edit the 'food and tobacco' column (per country or DEFAULT row) in data/demand/industry_growth_cagr.csv."
      - variant: "Electrify food-industry heat / set demand level or carrier split directly"
        rung: L3
        note: >
          There is no route-switching or electrification lever for this subsector and
          no temperature-band machinery in pypsa-earth; the carrier split is fixed by
          the UNSD base data. The functional path is custom_data.industry_demand:
          true plus an authored data/custom/industry_demand_{demand}_{planning_horizons}.csv
          in which the food column's gas/oil/biomass rows are shifted to electricity
          (or heat).
      - variant: "Locate food demand at plants instead of GDP-weighting"
        rung: L3
        note: "custom_data.industry_database: true + data/custom/industrial_database.csv with food-plant rows; the default database has no food technology mapping."
      - variant: "Add a time profile (e.g. seasonal processing campaigns)"
        rung: L5
        note: "Loads are scalar p_set = annual/8760 in add_industry; a profile needs new code and the subsector is not separable in the nodal file anyway."
      - variant: "Model food-industry heat as its own load with endogenous supply choice"
        rung: L4
        note: "Requires keeping the subsector separate through build_industry_demand (it is summed away), new columns in industrial_energy_demand_per_node and new buses/loads/links in add_industry."

    where:
      - change: "Override demand level / carrier split"
        anchor: "custom_data.industry_demand + data/custom/industry_demand_{demand}_{planning_horizons}.csv, read in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:snakemake.params.industry_demand"
      - change: "Growth trajectory"
        anchor: "data/demand/industry_growth_cagr.csv column 'food and tobacco' (rule build_industry_demand input industry_growth_cagr)"
        provenance: "Snakefile:industry_growth_cagr; data/demand/industry_growth_cagr.csv:food and tobacco"
      - change: "Spatial allocation keys"
        anchor: "build_nodal_distribution_key in build_industrial_distribution_key.py (GDP fallback — no food facilities in default database)"
        provenance: "scripts/build_industrial_distribution_key.py:build_nodal_distribution_key"
      - change: "Subsector aggregation / carrier totals"
        anchor: "create_industry_base_totals in build_base_industry_totals.py and the nodal dot-product in build_industry_demand.py"
        provenance: "scripts/build_base_industry_totals.py:create_industry_base_totals; scripts/build_industry_demand.py:country_to_nodal"
      - change: "Load construction"
        anchor: "add_industry in prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_industry"

    data_dependencies:
      - input: "UNSD energy balances (data/demand/unsd/data, downloaded when demand_data.update_data)"
        required_for: "default base totals"
        availability: "must be built; subsector coverage region-dependent, missing subsector columns filled 0"
      - input: "data/unsd_transactions.csv transaction-to-subsector mapping"
        required_for: "default base totals"
        availability: "exists by default"
      - input: "data/demand/industry_growth_cagr.csv"
        required_for: "growth to planning horizon"
        availability: "exists by default; DEFAULT row fallback for missing countries"
      - input: "Clustered population and GDP layouts"
        required_for: "GDP-share spatial keys"
        availability: "built by the workflow"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "custom demand override / electrification scenarios"
        availability: "absent; user-authored"

    demand_dimensions:
      driver: "National subsector final energy from UNSD balances (no output index), scaled by (1+CAGR)^years from industry_growth_cagr.csv"
      spatial: "GDP-share key per country (no food plants in the default industrial database)"
      temporal: "Annual-constant: p_set = annual energy / 8760, no profile"
      scenario: "{demand} wildcard tags the scenario files; per-country CAGR columns and demand_data.base_year set the growth path"

  - model: pypsa-eur
    version_anchor: { ref: "3e32e3c619f6ab79ada87759d6b915e9d5f3ff56", date: "2026-06-16" }

    out_of_box:
      covers: >
        'Food, beverages and tobacco' as an own subsector with a physical output
        index, country-specific energy intensities per carrier, population-based
        spatial allocation, and optional endogenous temperature-banded process-heat
        supply.
      mechanism: >
        build_industrial_energy_demand_per_country_today reads JRC-IDEES
        energy-balance sheet FC_IND_FBT_E per country;
        build_industrial_production_per_country reads 'Physical output (index)' from
        the FBT Industry sheet (non-EU27 scaled by Eurostat energy ratios).
        build_industry_sector_ratios derives future best-in-class intensities
        (food_beverages_tobacco: ovens, specific process heat, drying and process
        cooling electrified with measured electric efficiencies, steam processing
        assigned to biomass); build_industry_sector_ratios_intermediate blends
        today's country ratios toward these via industry.sector_ratios_fraction_future.
        build_industry_sector_ratios_endogenous instead splits the sector's heat
        carriers into temperature bands using the Fleiter et al. 2025 'Food, drink
        and tobacco' rows. Production is unchanged into the future
        (build_industrial_production_per_country_tomorrow only modifies
        steel/aluminium/HVC). The sector is not in the hotmaps sector_mapping, so it
        is distributed to nodes by the population key, multiplied with ratios in
        build_industrial_energy_demand_per_node, and turned into loads in
        add_industry: constant exogenous loads ('industry electricity',
        'low-temperature heat for industry', 'solid biomass for industry', 'gas for
        industry'), or with sector.industry_t.endogen the band demands become
        'heat100-200 industry' etc. buses with competing supply links (biomass, gas
        w/wo CC, industrial heat pump, electric boiler, hydrogen depending on band)
        at must_run p_min_pu.
      not_covered: >
        No sub-processes (dairy vs brewing vs baking are one aggregate) and no
        production growth lever (production tomorrow = today); no site database for
        food plants (population proxy only); no process emissions (the sector ratio
        carries none); no route-switching key like steel's primary fractions —
        'electrify food-industry heat' runs exclusively through the cross-cutting
        sector.industry_t temperature-band machinery; loads are annual-constant.
      provenance: "scripts/build_industrial_energy_demand_per_country_today.py:FC_IND_FBT_E; scripts/build_industry_sector_ratios.py:food_beverages_tobacco; scripts/build_industry_sector_ratios_endogenous.py:process_temperature_band_mapper; scripts/build_industrial_production_per_node.py:sector_mapping; scripts/prepare_sector_network.py:add_t_industry100_200"

    levers:
      - key: sector.industry
        effect: "Master switch for industrial demand incl. food, beverages & tobacco."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:options[\"industry\"]"
      - key: sector.industry_t.endogen
        effect: "Switches from fixed-carrier exogenous industry loads to temperature-banded process-heat demand with endogenous supply-technology choice — the lever behind 'electrify food-industry heat'."
        default: "false"
        provenance: "config/config.default.yaml:endogen; scripts/prepare_sector_network.py:options[\"industry_t\"][\"endogen\"]"
      - key: sector.industry_t.endogenise_sectors.Food, beverages and tobacco
        effect: "Per-sector opt-out: false keeps this sector's heat as flat fuels (exogenous treatment) even when endogen is on."
        default: "true"
        provenance: "config/config.default.yaml:endogenise_sectors; scripts/build_industry_sector_ratios_endogenous.py:endogenise_sectors"
      - key: sector.industry_t.must_run
        effect: "p_min_pu of the band supply links — how baseload the industrial heat supply must run."
        default: "0.8"
        provenance: "config/config.default.yaml:must_run; scripts/prepare_sector_network.py:must_run"
      - key: sector.industry_t.heat100-200.heat_pumps
        effect: "Allows industrial heat pumps in the 100-200C band where most food process heat sits (sibling keys: biomass, methane, electric_boiler; heat200-500 has biomass/methane/hydrogen)."
        default: "true"
        provenance: "config/config.default.yaml:heat_pumps; scripts/prepare_sector_network.py:add_t_industry100_200"
      - key: industry.sector_ratios_fraction_future
        effect: "Per-year blend between today's country energy intensities and the electrified/biomass best-in-class ratios."
        default: "{2020: 0.0, 2025: 0.05, 2030: 0.2, 2035: 0.45, 2040: 0.7, 2045: 0.85, 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: industry.reference_year
        effect: "JRC-IDEES year for today's energy demand and production index."
        default: "2023"
        provenance: "config/config.default.yaml:reference_year; scripts/build_industrial_production_per_country.py:reference_year"

    boundary:
      - variant: "Let the model choose how food process heat is supplied (heat pumps, e-boilers, biomass, gas, H2)"
        rung: L0
        note: "Flip sector.industry_t.endogen: true — 'Food, beverages and tobacco' is in endogenise_sectors by default; this cross-cutting band machinery, not a sector-specific key, carries the ask."
      - variant: "Force or forbid specific band technologies"
        rung: L1
        note: "sector.industry_t.heat100-200 / heat200-500 / heat>500 tech flags + must_run."
      - variant: "Faster/slower efficiency transformation of the sector"
        rung: L1
        note: "industry.sector_ratios_fraction_future per-year values."
      - variant: "Change food-sector production trajectory"
        rung: L2
        note: "No config key — build_industrial_production_per_country_tomorrow leaves this sector untouched; add a scaling for its column there (small localised edit)."
      - variant: "Change the temperature-band split assumed for food processing"
        rung: L2
        note: "Edit the 'Food, beverages and tobacco' entry of process_temperature_band_mapper in build_industry_sector_ratios_endogenous.py."
      - variant: "Change the exogenous future carrier assumption (e.g. steam to hydrogen instead of biomass)"
        rung: L2
        note: "Edit food_beverages_tobacco() in build_industry_sector_ratios.py."
      - variant: "Site-based spatial allocation (food factories instead of population)"
        rung: L3
        note: "Needs a facility dataset plus a sector_mapping entry in build_industrial_production_per_node.py / build_industrial_energy_demand_per_node_today.py and a matching key column in build_industrial_distribution_key.py."
      - variant: "Disaggregate into sub-branches (dairy, brewing, ...) with own processes"
        rung: L5
        note: "Bespoke; JRC-IDEES aggregate is the finest resolution wired in."

    where:
      - change: "Production trajectory"
        anchor: "rule build_industrial_production_per_country_tomorrow / its script"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:industrial_production_per_country_tomorrow"
      - change: "Temperature-band shares"
        anchor: "process_temperature_band_mapper entry 'Food, drink and tobacco' in build_industry_sector_ratios_endogenous.py (input data/ente202300981-sup-0001-suppdata-s1.xlsx)"
        provenance: "scripts/build_industry_sector_ratios_endogenous.py:process_temperature_band_mapper; rules/build_sector.smk:process_temperature_bands"
      - change: "Exogenous future intensities"
        anchor: "food_beverages_tobacco() in build_industry_sector_ratios.py"
        provenance: "scripts/build_industry_sector_ratios.py:food_beverages_tobacco"
      - change: "Spatial allocation"
        anchor: "sector_mapping fallback to 'population' in build_industrial_production_per_node.py and build_industrial_energy_demand_per_node_today.py"
        provenance: "scripts/build_industrial_production_per_node.py:sector_mapping; scripts/build_industrial_energy_demand_per_node_today.py:population"
      - change: "Band supply technologies"
        anchor: "add_t_industry100_200 / add_t_industry200_500 / add_t_industry500 in prepare_sector_network.py"
        provenance: "scripts/prepare_sector_network.py:add_t_industry100_200; scripts/prepare_sector_network.py:add_t_industry200_500; scripts/prepare_sector_network.py:add_t_industry500"

    data_dependencies:
      - input: "JRC-IDEES 2021/2023 EnergyBalance + Industry workbooks (rule retrieve_jrc_idees)"
        required_for: "today's demand, production index, sector ratios"
        availability: "exists by default via retrieval; EU27 detail, non-EU27 scaled by Eurostat ratios"
      - input: "Eurostat energy balances"
        required_for: "non-EU27 country scaling"
        availability: "exists by default via retrieval"
      - input: "data/ente202300981-sup-0001-suppdata-s1.xlsx (Fleiter et al. 2025 temperature bands)"
        required_for: "endogenous band splitting"
        availability: "exists by default (shipped in data/)"
      - input: "Clustered population layout"
        required_for: "population-based spatial key"
        availability: "built by the workflow"

    demand_dimensions:
      driver: "JRC-IDEES physical output index x MWh/t sector ratios per country"
      spatial: "Population key (sector absent from hotmaps sector_mapping)"
      temporal: "Annual-constant loads (p_set = annual/nhours); endogenous bands add constant heat demand served by dispatchable links with must_run floor"
      scenario: "planning_horizons drives sector_ratios_fraction_future interpolation; production constant across horizons for this sector"

reference_taxonomy:
  framework: "FORECAST (Fraunhofer ISI)"
  concepts:
    - "Process-level products (dairy, brewing, baking, sugar) rather than one FBT aggregate"
    - "Temperature-banded process heat and process cooling demand per process"
    - "Cross-cutting technologies (steam systems, refrigeration, motors) shared across subsectors"
    - "Efficiency-measure diffusion over time instead of a single best-in-class blend factor"
  sources:
    - "https://www.forecast-model.eu/"
