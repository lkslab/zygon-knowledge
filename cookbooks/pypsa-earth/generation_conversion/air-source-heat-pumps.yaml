id: air-source-heat-pumps
title: Air-source heat pumps
summary: Electric heat pumps that extract heat from ambient air to supply building space and water heating, with temperature-dependent efficiency (COP).

when_to_use:
  - "add air-source heat pumps"
  - "ASHP"
  - "electrify heating with heat pumps"
  - "heat pump rollout / adoption scenario"
  - "how efficient are heat pumps in this climate"
  - "temperature-dependent heat pump COP"
  - "replace gas boilers with heat pumps"
  - "air-to-water heat pump"
  - "heat pump sink temperature / flow temperature"
  - "known in pypsa-eur as: heat pumps, heat pump, air heat pump, residential rural air heat pump, residential urban decentral air heat pump, services rural air heat pump, services urban decentral air heat pump, urban central air heat pump, Ambient, power-to-heat"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Air-sourced heat pumps are added by default (when sector.enable.heat is true) as
        extendable Link components from the electricity bus to the heat bus of every URBAN
        heat system node ("residential urban decentral", "services urban decentral",
        "urban central"): in add_heat, heat_pump_type = "air" if "urban" in name.
        Efficiency is an hourly COP time series when sector.time_dep_hp_cop is true,
        computed in build_cop_profiles from the Staffell et al. (2012) quadratic
        coefficient_of_performance(delta_T, source="air") with
        delta_T = heat_pump_sink_T - population-weighted ERA5 air temperature
        (build_temperature_profiles, atlite cutout.temperature). Costs come from the
        technology-data cost rows "decentral air-sourced heat pump" /
        "central air-sourced heat pump". If sector.electricity_distribution_grid is true,
        heat pump Links are re-wired to draw from the "low voltage" bus.
      mechanism: >
        Pipeline: rule build_temperature_profiles (ERA5 cutout + population layout ->
        temp_air_*.nc) -> rule build_cop_profiles (params heat_pump_sink_T -> cop_air_*.nc)
        -> rule prepare_heat_data (reindexes COP to snapshots -> ashp_cop csv) -> rule
        prepare_sector_network / add_heat (n.madd Link, carrier
        "{name} {heat_pump_type} heat pump", p_nom_extendable=True, capital_cost scaled by
        efficiency). Snakefile HEAT input dict gates these inputs on sector.enable.heat.
      not_covered: >
        No air-source heat pumps at RURAL nodes (rural systems get ground-source only —
        hard-coded split in add_heat). No space cooling service. No hybrid heat-pump/boiler
        units, no part-load or defrost-cycle behaviour beyond the COP curve, no minimum
        outdoor-temperature cut-off. Existing heat pump stock is only brought in via the
        myopic/existing-capacities pathway (build_existing_heating_distribution) whose raw
        data is a European study.
      provenance: "scripts/prepare_sector_network.py:add_heat"

    levers:
      - key: sector.heat_pump_sink_T
        effect: Sink (flow) temperature in Celsius used for delta_T in the COP calculation; lower values raise COP everywhere.
        default: "55"
        provenance: "config.default.yaml:heat_pump_sink_T; scripts/build_cop_profiles.py:heat_pump_sink_T"
      - key: sector.time_dep_hp_cop
        effect: If true, Link efficiency is the hourly COP series; if false, the static efficiency from the costs table is used.
        default: "true"
        provenance: "config.default.yaml:time_dep_hp_cop; scripts/prepare_sector_network.py:time_dep_hp_cop"
      - key: sector.enable.heat
        effect: Master switch for the heat sector; disables add_heat (and thus all heat pumps) and the HEAT input branch.
        default: "true"
        provenance: "config.default.yaml:enable; Snakefile:HEAT"
      - key: sector.electricity_distribution_grid
        effect: If true, heat pump Links have bus0 moved to the "low voltage" bus so distribution-grid capacity/cost applies to their electricity draw.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"

    boundary:
      - variant: "Have air-source heat pumps compete for heat supply"
        rung: L0
        note: "Default behaviour when the heat sector is enabled; Links are p_nom_extendable."
      - variant: "Change flow/sink temperature (e.g. low-temperature radiators at 35C)"
        rung: L1
        note: "Set sector.heat_pump_sink_T; consumed by rule build_cop_profiles."
      - variant: "Use a constant (non-weather) COP"
        rung: L1
        note: "Set sector.time_dep_hp_cop: false; falls back to costs-table efficiency."
      - variant: "Offer air-source heat pumps at rural nodes too"
        rung: L2
        note: "The air/ground split is the hard-coded line heat_pump_type = 'air' if 'urban' in name in add_heat; edit it or add a second Link set."
      - variant: "Different COP regression (e.g. manufacturer curve)"
        rung: L2
        note: "Replace the quadratic in coefficient_of_performance (build_cop_profiles.py)."
      - variant: "Represent today's installed heat pump stock (brownfield)"
        rung: L3
        note: "Needs country rows in data/existing_infrastructure/existing_heating_raw.csv consumed by build_existing_heating_distribution; shipped data is from a European mapping study, so non-European regions need new data."
      - variant: "Hybrid heat pump + backup boiler as one unit, cold-climate cut-off, or cooling service"
        rung: L5
        note: "No component logic exists; requires bespoke Python in prepare_sector_network."

    where:
      - change: "Allow ASHP at rural nodes / change air-vs-ground assignment"
        anchor: "scripts/prepare_sector_network.py:add_heat (heat_pump_type assignment)"
        provenance: "scripts/prepare_sector_network.py:heat_pump_type"
      - change: "COP functional form"
        anchor: "scripts/build_cop_profiles.py:coefficient_of_performance"
        provenance: "scripts/build_cop_profiles.py:coefficient_of_performance"
      - change: "Air temperature inputs feeding the COP"
        anchor: "rule build_temperature_profiles (atlite cutout.temperature, population-weighted)"
        provenance: "scripts/build_temperature_profiles.py:temperature"
      - change: "Existing heat pump capacities"
        anchor: "rule build_existing_heating_distribution + data/existing_infrastructure/existing_heating_raw.csv"
        provenance: "Snakefile:build_existing_heating_distribution"

    data_dependencies:
      - input: "ERA5 cutout (temperature field) covering the model region"
        required_for: "COP time series and heat demand profiles"
        availability: "must be built or retrieved (enable.retrieve_cutout / build_cutout)"
      - input: "Population layouts (WorldPop population in gadm_shapes + UNCTAD urban percent)"
        required_for: "Population-weighting of temperatures and urban/rural node split"
        availability: "must be built (build_population_layouts; build_shapes worldpop_method)"
      - input: "UNSD energy balances (heat demand totals per country)"
        required_for: "Sizing the heat load the pumps serve"
        availability: "must be built (build_base_energy_totals, demand_data.update_data)"
      - input: "data/existing_infrastructure/existing_heating_raw.csv"
        required_for: "Brownfield/existing heat pump stock"
        availability: "region-dependent (European source study)"
