id: ammonia-ships
title: Ammonia-fuelled ships
summary: >
  Ammonia (NH3) as a maritime fuel — shipping demand served by green/blue ammonia
  instead of fuel oil or hydrogen.

when_to_use:
  - "ammonia ships / NH3 shipping fuel"
  - "green ammonia for maritime transport"
  - "ammonia bunkering"
  - "decarbonise shipping with ammonia"
  - "alternative marine fuels"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT a shipping fuel option. Shipping (add_shipping) offers only
        sector.shipping_hydrogen_share (H2 load at port nodes) with the remainder as
        oil. HOWEVER, a full ammonia value chain DOES exist when
        sector.ammonia.enable is true: add_ammonia creates per-node "NH3" carrier
        buses, Haber-Bosch Links (H2 + electricity -> NH3), ammonia crackers (NH3 ->
        H2), liquid ammonia Stores, and an industrial NH3 Load — it is just not wired
        to shipping demand.
      mechanism: >
        add_shipping maps country navigation demand (UNSD totals) to nodes by port
        fraction and splits it H2/oil only. add_ammonia (guarded by
        options["ammonia"]["enable"]) builds the NH3 supply side for industry. The
        missing piece is purely a demand hookup: an NH3-for-shipping share and a Load
        on spatial.ammonia.nodes at port-weighted nodes.
      not_covered: >
        Any shipping->NH3 link: no shipping_ammonia_share key, no NH3 bunkering
        load, no ammonia-engine efficiency assumption, no NH3 bunker-fuel emissions
        accounting (NH3 carrier is defined with co2_emissions=0, so combustion N2O/NOx
        effects are out of scope anyway).
      provenance: "scripts/prepare_sector_network.py:add_shipping"

    levers:
      - key: sector.ammonia.enable
        effect: "Turns on the NH3 value chain (Haber-Bosch, cracker, NH3 store, industrial demand) that a shipping load would draw from."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - key: sector.shipping_hydrogen_share
        effect: "Existing low-carbon shipping lever (H2 only); the pattern to copy for an ammonia share. Cannot deliver NH3 itself."
        default: "AB_2030: 0.05 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:shipping_hydrogen_share"
      - key: sector.enable.shipping
        effect: "Master switch for shipping demand."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"

    boundary:
      - variant: "Ammonia as an exogenous shipping fuel share"
        rung: L2
        note: >
          Localised edit in add_shipping: add a shipping_ammonia_share (read via
          options, keyed {demand}_{planning_horizon} like the H2 share via get()),
          convert demand with an NH3-propulsion efficiency assumption, and madd a
          Load on spatial.ammonia.nodes with the port weighting. Supply side already
          exists via add_ammonia. The new key must also be added to your config.
      - variant: "Ammonia-engine efficiency / cost grounded in data"
        rung: L3
        note: "Needs a costs.csv row or explicit assumption for NH3 marine propulsion (only 'fuel cell' efficiency is used for the H2 share today); technology-data may not carry it."
      - variant: "Port-level NH3 bunkering infrastructure (storage/loading as investable assets)"
        rung: L4
        note: "New components + data at ports beyond the nodal NH3 store; rule/config plumbing."
      - variant: "Endogenous fuel competition (NH3 vs H2 vs oil shipping)"
        rung: L5
        note: "Shares are exogenous; competition needs bespoke decision logic."

    where:
      - change: "Add the shipping-ammonia share and NH3 bunkering load"
        anchor: "scripts/prepare_sector_network.py function add_shipping (copy the shipping_hydrogen_share + 'H2 for shipping' Load pattern)"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
      - change: "NH3 buses/production/storage the load would draw from"
        anchor: "scripts/prepare_sector_network.py function add_ammonia"
        provenance: "scripts/prepare_sector_network.py:add_ammonia"
      - change: "Port weighting used to localise the load"
        anchor: "rule prepare_ports -> scripts/prepare_ports.py"
        provenance: "scripts/prepare_ports.py:download_ports"

    data_dependencies:
      - input: "UNSD navigation energy totals (domestic + international)"
        required_for: "the demand an NH3 share would be carved from"
        availability: "must be built (build_base_energy_totals)"
      - input: "World Port Index ports.csv"
        required_for: "locating NH3 bunkering demand at nodes"
        availability: "must be built (prepare_ports runtime download)"
      - input: "costs rows: 'Haber-Bosch', 'Ammonia cracker', 'NH3 (l) storage tank incl. liquefaction'"
        required_for: "NH3 supply chain economics (already consumed by add_ammonia)"
        availability: "exists by default (retrieve_cost_data)"
      - input: "NH3 marine engine efficiency/cost assumption"
        required_for: "converting shipping energy demand into NH3 demand"
        availability: "absent (must be supplied)"
