id: battery-electric-cars
title: Battery electric cars
summary: >
  Passenger battery-electric vehicles as part of land transport demand — how much
  road transport is electrified and how EV batteries interact with the power system.

when_to_use:
  - "add electric cars"
  - "battery electric vehicles / BEVs / EVs"
  - "electrify road transport"
  - "increase EV share / EV uptake scenario"
  - "how much electricity do electric cars need"
  - "model EV charging demand"
  - "transport electrification"
  - "known in pypsa-eur as: land transport EV, EV battery"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Land transport is ONE aggregate demand (all road vehicles together), split
        exogenously into an electric share, a fuel-cell share, and a remainder ICE-oil
        share. The electric share becomes, per cluster node: a "Li ion" carrier bus
        ("EV battery"), a "BEV charger" Link from the AC bus (efficiency =
        sector.bev_charge_efficiency, p_nom = number of cars x charge rate x electric
        share), and a "land transport EV" Load on the EV battery bus following a
        weekly traffic profile.
      mechanism: >
        Rule prepare_sector_network calls add_land_transport, which reads the share
        via get(options["land_transport_electric_share"], demand_sc + "_" +
        investment_year) — i.e. keys like "AB_2030" combining the {demand} and
        {planning_horizons} wildcards. If sector.dynamic_transport.enable is true the
        shares are instead keyed by the Co2L opts wildcard. The demand time series is
        built upstream by rule prepare_transport_data from country energy totals
        ("total road" + non-electric rail), shaped by a weekly German traffic count
        (data/emobility/KFZ__count), corrected for EV vs ICE efficiency
        (bev_plug_to_wheel_efficiency x bev_charge_efficiency) and for
        temperature-dependent vehicle heating (EV_/ICE_ degree factors). Per-node car
        counts come from resources transport_data.csv (rule
        prepare_transport_data_input: WHO GHO registered-vehicle statistics completed
        with Wikipedia), distributed by population fraction. Charger p_nom uses
        options.get("bev_charge_rate", 0.011) — a hardcoded default, not a
        config.default.yaml key.
      not_covered: >
        No vehicle segmentation — cars, trucks, buses, two-wheelers are one aggregate;
        the shares apply to all road transport uniformly. EV uptake is exogenous (a
        share), never optimised. BEV charger p_nom is fixed, not extendable, and no
        charging-infrastructure cost is charged. bev_charge_rate has no config key.
        Smart charging and V2G are separate toggles (see smart-ev-chargers,
        vehicle-to-grid recipes).
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers:
      - key: sector.enable.land_transport
        effect: "Master switch — if false, add_land_transport is skipped and no transport demand enters the network."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"
      - key: sector.land_transport_electric_share
        effect: >
          Fraction of aggregate land transport demand served by EVs, keyed
          {demand}_{planning_horizon} (e.g. AB_2030). Also used upstream in
          prepare_energy_totals to scale total road demand by EV efficiency gains.
        default: "AB_2030: 0.01 (dict per scenario/year; e.g. NZ_2050: 0.68)"
        provenance: "scripts/prepare_sector_network.py:land_transport_electric_share"
      - key: sector.land_transport_fuel_cell_share
        effect: "Fraction served by FCEVs; remainder 1 - electric - fuel_cell becomes ICE oil demand. Sum must be <= 1 (asserted)."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_fuel_cell_share"
      - key: sector.dynamic_transport.enable
        effect: "If true, EV/FCEV shares are read from sector.dynamic_transport.* keyed by the Co2L opts wildcard instead of {demand}_{planning_horizon}."
        default: "false"
        provenance: "scripts/prepare_sector_network.py:dynamic_transport"
      - key: sector.bev_charge_efficiency
        effect: "BEV (dis-)charging efficiency applied to the BEV charger Link (and V2G Link)."
        default: "0.9"
        provenance: "scripts/prepare_sector_network.py:bev_charge_efficiency"
      - key: sector.bev_plug_to_wheel_efficiency
        effect: "kWh/km plug-to-wheel assumption; with bev_charge_efficiency defines the EV efficiency gain that deflates road demand when electrified."
        default: "0.2"
        provenance: "scripts/prepare_transport_data.py:bev_plug_to_wheel_efficiency"
      - key: sector.transport_internal_combustion_efficiency
        effect: "ICE efficiency dividing the remaining oil share of transport demand (bigger oil demand for lower efficiency)."
        default: "0.3"
        provenance: "scripts/prepare_sector_network.py:transport_internal_combustion_efficiency"
      - key: sector.EV_lower_degree_factor
        effect: "Per-degree increase of EV consumption below the heating deadband; shapes the temperature correction of the EV demand series."
        default: "0.98"
        provenance: "scripts/prepare_transport_data.py:EV_lower_degree_factor"
      - key: sector.EV_upper_degree_factor
        effect: "Per-degree increase of EV consumption above the deadband (cooling)."
        default: "0.63"
        provenance: "scripts/prepare_transport_data.py:EV_upper_degree_factor"

    boundary:
      - variant: "Turn land transport (incl. EVs) on/off"
        rung: L0
        note: "sector.enable.land_transport, default already true."
      - variant: "Set a specific EV uptake for a scenario/year"
        rung: L1
        note: >
          Set sector.land_transport_electric_share for the exact key
          {demand}_{planning_horizons} of your run (e.g. AB_2030: 0.5). Missing keys
          raise KeyError in get().
      - variant: "EV share driven by CO2 target instead of scenario"
        rung: L1
        note: "sector.dynamic_transport.enable: true and fill the Co2L-keyed share dicts."
      - variant: "Change EV efficiency / charger power assumptions"
        rung: L1
        note: "bev_charge_efficiency, bev_plug_to_wheel_efficiency are config; but the per-car charger rating bev_charge_rate (0.011 MW) is only an options.get default — changing it is L2."
      - variant: "Change per-car charger power rating (bev_charge_rate)"
        rung: L2
        note: "Hardcoded default in add_land_transport (options.get('bev_charge_rate', 0.011)); either edit the default or add the key to your config (it is read via options.get so a custom config entry works, but it is absent from config.default.yaml)."
      - variant: "Make charger capacity extendable / cost charging infrastructure"
        rung: L2
        note: "Edit the BEV charger n.madd in add_land_transport: p_nom_extendable=True plus a capital_cost (commented-out hints exist in the function)."
      - variant: "Use your own transport demand time series"
        rung: L3
        note: "custom_data.transport_demand: true switches prepare_transport_data to use 'total road' energy totals directly; supplying a bespoke series means replacing the resources transport_*.csv input the rule produces."
      - variant: "Country-specific traffic/charging weekly profiles (non-German)"
        rung: L3
        note: "The weekly shape is data/emobility/KFZ__count (German BASt counts) wired in rule prepare_transport_data; substitute the data file or repoint the rule input."
      - variant: "Endogenous (optimised) EV uptake"
        rung: L5
        note: "Shares are exogenous scalars multiplied into fixed Loads; making uptake a decision variable needs new component logic and constraints."

    where:
      - change: "EV/FCEV/ICE split, EV battery buses, BEV charger links, EV loads"
        anchor: "scripts/prepare_sector_network.py function add_land_transport (rule prepare_sector_network)"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "Transport demand time series, availability/DSM profiles, nodal car counts"
        anchor: "rule prepare_transport_data -> scripts/prepare_transport_data.py function prepare_transport_data"
        provenance: "scripts/prepare_transport_data.py:prepare_transport_data"
      - change: "Country vehicle stock and fuel-efficiency table"
        anchor: "rule prepare_transport_data_input -> scripts/prepare_transport_data_input.py"
        provenance: "scripts/prepare_transport_data_input.py:download_number_of_vehicles"
      - change: "Base road energy demand per country"
        anchor: "rule build_base_energy_totals (UNSD balances) then rule prepare_energy_totals (projection with EV/FCEV shares)"
        provenance: "Snakefile:build_base_energy_totals"

    data_dependencies:
      - input: "UNSD energy balances (data/demand/unsd) -> energy_totals 'total road' per country"
        required_for: "any land transport demand"
        availability: "must be built (downloaded by build_base_energy_totals when demand_data.update_data is true); country coverage varies"
      - input: "WHO GHO registered-vehicle counts + Wikipedia vehicles-per-capita (downloaded at runtime)"
        required_for: "nodal charger p_nom and EV battery sizes ('number cars')"
        availability: "region-dependent (live download; falls back to data/temp_hard_coded/transport_data.csv if URLs fail)"
      - input: "data/emobility/KFZ__count and Pkw__count weekly traffic counts"
        required_for: "hourly shape of transport demand and plug-in availability"
        availability: "exists by default (shipped in repo; German data applied globally)"
      - input: "temp_air_total (cutout-derived air temperature)"
        required_for: "temperature correction of EV/ICE demand"
        availability: "must be built (needs cutout for the region)"
