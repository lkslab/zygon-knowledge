id: behind-the-meter-der
title: Behind-the-meter DER
summary: >-
  Distributed energy resources on the customer side of the meter — rooftop solar,
  home batteries, and the low-voltage grid connecting them to demand.
when_to_use:
  - "behind the meter solar / storage"
  - "rooftop PV"
  - "home batteries / residential storage"
  - "distributed energy resources"
  - "low voltage / distribution grid modelling"
  - "self-consumption of solar"
  - "customer-sited generation"
  - "known in pypsa-eur as: home battery, home battery storage, home battery charger, home battery discharger"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        A low-voltage layer per cluster region with BTM assets on it.
        add_electricity_distribution_grid (sector.electricity_distribution_grid) adds
        one "low voltage" Bus per node plus a bidirectional "electricity distribution
        grid" Link (costed, with static losses via sector.transmission_efficiency)
        and moves AC loads, all *electricity sector loads, BEV chargers, V2G, heat
        pumps, resistive heaters and micro-CHP onto it. "solar rooftop" Generators
        are added on the LV buses with p_nom_max from either population
        (kW_per_m2 x m2_per_person x population layout) or building footprints
        (use_building_size with solar_rooftop_layout inputs); existing utility solar
        is re-priced to 'solar-utility' so rooftop competes at 'solar-rooftop' cost.
        "home battery" Bus+Store+charger/discharger Links complete the BTM set
        (sector.home_battery).
      mechanism: >-
        prepare_sector_network.py:add_electricity_distribution_grid does all of the
        above in the sector network; building-footprint potentials come from the
        solar_rooftop_layout CSVs produced by the buildings rules (Snakefile inputs
        solar_rooftop_layout, from download_global_buildings.py /
        cluster_global_buildings.py).
      not_covered: >-
        No retail tariffs, net metering, or self-consumption incentives (everything
        trades at system marginal value); one LV bus per cluster region — no feeders,
        voltage, or hosting-capacity limits; no BTM asset adoption behaviour
        (deployment is cost-optimal, bounded by p_nom_max); no BTM assets in the
        electricity-only workflow (this whole block lives in prepare_sector_network).
      provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Master switch for the LV layer; without it none of the BTM assets are built."
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.enable
        effect: "Adds rooftop PV generators on LV buses."
        default: "true"
        provenance: "config.default.yaml:solar_rooftop ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.kW_per_m2
        effect: "Panel density assumption in the rooftop potential."
        default: "0.1"
        provenance: "config.default.yaml:kW_per_m2 ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.m2_per_person
        effect: "Roof area per person for the population-based potential."
        default: "20"
        provenance: "config.default.yaml:m2_per_person ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.use_building_size
        effect: "Switch potential basis from population to building-footprint data (solar_rooftop_layout inputs)."
        default: "false"
        provenance: "config.default.yaml:use_building_size ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.home_battery
        effect: "Adds home battery store + charger/discharger on LV buses."
        default: "true"
        provenance: "config.default.yaml:home_battery ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.transmission_efficiency
        effect: "Sub-key 'electricity distribution grid'.efficiency_static sets distribution losses (default 0.97, i.e. 3% loss, deducted from AC demand)."
        default: "{electricity distribution grid: {efficiency_static: 0.97}, ...}"
        provenance: "config.default.yaml:transmission_efficiency ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.marginal_cost_storage
        effect: "Marginal cost on the home-battery discharger."
        default: "0"
        provenance: "config.default.yaml:marginal_cost_storage ; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
    boundary:
      - variant: "Enable BTM rooftop PV + home batteries"
        rung: L0
        note: "All defaults are already on."
      - variant: "Change rooftop potential assumptions"
        rung: L1
        note: "sector.solar_rooftop.kW_per_m2 / m2_per_person; or use_building_size: true for footprint-based potential."
      - variant: "Building-footprint-based potentials"
        rung: L1
        note: "use_building_size: true; functionally L3 in practice because the building layout inputs must be built for the region (buildings download + clustering rules)."
      - variant: "Cap or force BTM adoption (policy scenario)"
        rung: L2
        note: "Edit p_nom_max / p_nom_min of the rooftop Generators or home-battery Store in add_electricity_distribution_grid; no config key for adoption limits."
      - variant: "Retail tariff / net-metering behaviour"
        rung: L5
        note: "No tariff concept; needs bespoke costs/constraints distinguishing BTM flows from grid flows."
      - variant: "Feeder-level distribution constraints"
        rung: L5
        note: "One LV bus per region; sub-regional feeders would need new topology-building logic."
    where:
      - change: "All BTM asset definitions, potentials, adoption caps"
        anchor: "scripts/prepare_sector_network.py function add_electricity_distribution_grid"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "Building-footprint rooftop layout inputs"
        anchor: "Snakefile input solar_rooftop_layout (built via scripts/download_global_buildings.py and scripts/cluster_global_buildings.py)"
        provenance: "Snakefile:solar_rooftop_layout"
    data_dependencies:
      - input: "Population layouts (pop_layout) for the default rooftop potential"
        required_for: "Population-based rooftop p_nom_max"
        availability: "exists by default (built by population layout rules)"
      - input: "solar_rooftop_layout CSVs from global buildings data"
        required_for: "use_building_size: true"
        availability: "must be built; region-dependent (building dataset coverage)"
      - input: "Cost rows 'solar-rooftop', 'solar-utility', 'home battery storage', 'home battery inverter', 'electricity distribution grid' (technology-data)"
        required_for: "All BTM assets"
        availability: "exists by default"
