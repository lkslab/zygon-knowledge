id: biogas-anaerobic-digestion
title: Biogas / anaerobic digestion
summary: >-
  Biogas produced from organic feedstocks (manure, waste, crops) via anaerobic
  digestion, and its upgrading into the natural-gas system.
when_to_use:
  - "add biogas"
  - "anaerobic digestion / digesters"
  - "biomethane / upgrade biogas to the gas grid"
  - "manure or organic waste to energy"
  - "green gas potential"
  - "renewable gas supply"
  - "known in pypsa-eur as: biogas, biogas to gas, biogas to gas CC"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        A finite biogas resource and its upgrading into the gas network. add_biomass
        creates per-node "biogas" buses with Stores whose energy content is
        sector.biogas_potential (TWh/a, whole modelled area) split equally across
        nodes, marginal cost from the "biogas" cost row; a "biogas to gas" Link
        upgrades biogas into the gas buses using "biogas upgrading" costs, and books a
        NEGATIVE gas CO2-intensity on the "co2 atmosphere" bus (efficiency2 =
        -CO2-intensity of gas), so downstream combustion of the upgraded gas nets to
        zero atmospheric CO2.
      mechanism: >-
        prepare_sector_network.py:add_biomass — n.madd Store on spatial.gas.biogas
        buses (e_nom = biogas_pot_spatial) and n.madd Link spatial.gas.biogas_to_gas
        (bus0 biogas, bus1 gas, bus2 "co2 atmosphere"). Runs only when
        sector.enable.biomass is true.
      not_covered: >-
        Anaerobic digestion itself is NOT modelled — the potential is one exogenous
        config scalar with no feedstock (manure/waste/crop) resource assessment, no
        digester capacity or cost, and no spatial differentiation. There is no direct
        use of raw biogas (no biogas engine/CHP link) — the only sink is upgrading to
        the gas grid.
      provenance: "scripts/prepare_sector_network.py:add_biomass"
    levers:
      - key: sector.biogas_potential
        effect: "Total biogas available per year (TWh/a) for the whole modelled area; becomes the biogas Store e_nom, split equally across nodes."
        default: "0.5"
        provenance: "config.default.yaml:biogas_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.enable.biomass
        effect: "Gates the entire biogas machinery (created inside add_biomass)."
        default: "true"
        provenance: "config.default.yaml:biomass ; scripts/prepare_sector_network.py:add_biomass"
    boundary:
      - variant: "Raise/lower the national biogas potential"
        rung: L0
        note: "sector.biogas_potential (single scalar; embed your AD feedstock estimate here)."
      - variant: "Change upgrading cost assumptions"
        rung: L3
        note: "Override the 'biogas upgrading' and 'biogas' rows in the costs CSV (technology-data output, or data/costs.csv when enable.retrieve_cost_data is false)."
      - variant: "Per-region biogas potentials"
        rung: L2
        note: "Replace the equal split (biogas_pot_spatial) in add_biomass with a per-node series."
      - variant: "Direct biogas use (engine/CHP on raw biogas)"
        rung: L2
        note: "Add a biogas->AC (or ->heat) Link in add_biomass next to the existing 'biogas to gas' Link; needs a cost row for the engine."
      - variant: "Model digesters explicitly (feedstock supply curves, digester capacity)"
        rung: L5
        note: "New component logic: feedstock buses/stores + digestion Links; nothing exists to parameterise."
    where:
      - change: "Upgrading cost data"
        anchor: "costs CSV rows 'biogas upgrading' / 'biogas' (Snakefile rule retrieve_cost_data, config costs.technology_data_version)"
        provenance: "Snakefile:retrieve_cost_data"
      - change: "Per-region potentials / direct biogas use / digester modelling"
        anchor: "scripts/prepare_sector_network.py function add_biomass (biogas Store and 'biogas to gas' Link)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
    data_dependencies:
      - input: "Cost rows 'biogas' and 'biogas upgrading' (technology-data)"
        required_for: "Biogas store marginal cost and upgrading link costs"
        availability: "exists by default"
      - input: "National/regional AD feedstock assessment (manure, MSW, crop residues)"
        required_for: "Setting sector.biogas_potential to a defensible value or per-region potentials"
        availability: "absent — must be supplied by the user; the default 0.5 TWh/a is a placeholder"
