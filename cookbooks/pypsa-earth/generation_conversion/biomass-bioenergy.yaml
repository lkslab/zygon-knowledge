id: biomass-bioenergy
title: Biomass / bioenergy
summary: >-
  Use of solid biomass and biogas resources for power, heat (CHP) and industry,
  including the biomass resource potential, its transport between regions, and
  conversion technologies.
when_to_use:
  - "add biomass power plants"
  - "model bioenergy"
  - "solid biomass potential for my country"
  - "wood / agricultural residues as fuel"
  - "biomass CHP / district heating from biomass"
  - "burn crop waste for electricity"
  - "limit or expand how much biomass the model can use"
  - "biomass transport between regions"
  - "existing bagasse / wood-fired plants"
  - "known in pypsa-eur as: biomass, solid biomass, solid biomass import, solid biomass transport, unsustainable solid biomass, solid biomass to hydrogen, biomass boiler, residential rural biomass boiler, residential urban decentral biomass boiler, services rural biomass boiler, services urban decentral biomass boiler"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Two chains. (1) Power-only chain: existing biomass power plants enter the
        electricity network as dispatchable Generators because "biomass" is in
        electricity.conventional_carriers; the powerplant table maps OSM fuel tags
        biomass/biofuel/biogas to powerplantmatching Fueltype "Bioenergy". (2) Sector
        chain (sector.enable.biomass): add_biomass creates per-node "solid biomass" and
        "biogas" buses with Stores whose energy content is the config potential split
        EQUALLY across nodes; a "biomass EOP" Link converts solid biomass to
        electricity; optional "solid biomass transport" Links between nodes; an
        "urban central solid biomass CHP" Link (plus a CC variant when sector.cc) at
        district-heating buses; add_industry adds a "solid biomass for industry"
        demand fed from the same stores; add_services adds a "services biomass" load.
        In the sector network the elec-network biomass Generators are converted to
        Links drawing from the solid biomass buses via sector.conventional_generation.
      mechanism: >-
        build_powerplants.py:convert_osm_to_pm maps OSM biomass tags to "Bioenergy";
        add_electricity.py:attach_conventional_generators adds them as Generators.
        prepare_sector_network.py:add_biomass reads
        sector.solid_biomass_potential / sector.biogas_potential (TWh/a for the WHOLE
        modelled area), divides by the node count, and builds Stores + conversion
        Links; costs come from the technology-data rows "solid biomass", "biomass EOP",
        "central solid biomass CHP", "biomass CHP capture".
        convert_conventional_generators_to_links re-wires biomass Generators as Links
        with bus0 on the solid biomass buses.
      not_covered: >-
        No spatially resolved biomass potentials (single scalar split equally across
        nodes — flagged as a TODO in add_biomass); no biomass feedstock classes or
        cost-supply curves; no biomass-to-liquids / biokerosene; no agriculture
        biomass demand in the network (the "agriculture biomass" column exists in the
        energy-totals data but add_agriculture only creates electricity and oil loads);
        the plain "biomass EOP" link books no atmospheric CO2 (combustion is treated
        as carbon-neutral).
      provenance: "scripts/prepare_sector_network.py:add_biomass"
    levers:
      - key: sector.enable.biomass
        effect: "Master switch for the sector biomass chain (add_biomass is only called when true)."
        default: "true"
        provenance: "config.default.yaml:biomass ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.solid_biomass_potential
        effect: "Total solid biomass energy available per year for the whole modelled area (TWh/a); becomes Store e_nom split equally across nodes."
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biogas_potential
        effect: "Total biogas potential (TWh/a) for the whole modelled area; see the biogas recipe."
        default: "0.5"
        provenance: "config.default.yaml:biogas_potential ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_transport
        effect: "If true, adds 'solid biomass transport' Links along the network topology so nodes can trade biomass at a per-km cost."
        default: "true"
        provenance: "config.default.yaml:biomass_transport ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_transport_default_cost
        effect: "Fallback transport cost (EUR/km/MWh) for countries missing from the transport-cost CSV."
        default: "0.1"
        provenance: "config.default.yaml:biomass_transport_default_cost ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.chp
        effect: "Enables the 'urban central solid biomass CHP' Link at district-heating buses."
        default: "true"
        provenance: "config.default.yaml:chp ; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.cc
        effect: "Adds the CC variants: 'urban central solid biomass CHP CC' and 'solid biomass for industry CC' (see BECCS recipe)."
        default: "true"
        provenance: "config.default.yaml:cc ; scripts/prepare_sector_network.py:add_biomass"
      - key: electricity.conventional_carriers
        effect: "Keeping 'biomass' in this list attaches existing biomass power plants as Generators in the electricity network."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers ; scripts/add_electricity.py:attach_conventional_generators"
      - key: sector.conventional_generation
        effect: "Maps generator technology to fuel carrier ('biomass: biomass'); controls the Generator-to-Link conversion in the sector network."
        default: "{OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass}"
        provenance: "config.default.yaml:conventional_generation ; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
    boundary:
      - variant: "Turn the biomass sector chain on/off"
        rung: L0
        note: "sector.enable.biomass."
      - variant: "Change the total biomass / biogas resource"
        rung: L0
        note: "Single scalars sector.solid_biomass_potential / sector.biogas_potential (whole modelled area)."
      - variant: "Include/exclude existing biomass power plants"
        rung: L1
        note: "Edit the electricity.conventional_carriers list."
      - variant: "Country- or node-specific biomass potentials"
        rung: L2
        note: "add_biomass splits one scalar equally across nodes; replace the equal split with a per-node series (small localised edit — the code carries a TODO for exactly this)."
      - variant: "Spatially resolved potentials from a dataset (e.g. residues map)"
        rung: L3
        note: "Needs a new data input (per-region potential table) plus the L2 edit in add_biomass to consume it."
      - variant: "Country-specific biomass transport costs"
        rung: L3
        note: "Edit data/temp_hard_coded/biomass_transport_costs.csv (indexed by 2-letter country code)."
      - variant: "New biomass conversion route (biomass-to-liquids, biokerosene, pellets)"
        rung: L5
        note: "New Link logic in prepare_sector_network; no such carrier exists."
    where:
      - change: "Per-node biomass potential split / new potential data input"
        anchor: "scripts/prepare_sector_network.py function add_biomass (biomass_pot_spatial / biogas_pot_spatial)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "Biomass transport cost data"
        anchor: "Snakefile rule prepare_sector_network input biomass_transport_costs -> data/temp_hard_coded/biomass_transport_costs.csv"
        provenance: "Snakefile:biomass_transport_costs"
      - change: "Existing biomass plant mapping from OSM/powerplantmatching"
        anchor: "scripts/build_powerplants.py function convert_osm_to_pm ('biomass'/'biofuel'/'biogas' -> 'Bioenergy')"
        provenance: "scripts/build_powerplants.py:convert_osm_to_pm"
      - change: "New biomass conversion Link"
        anchor: "scripts/prepare_sector_network.py function add_biomass (pattern: 'biomass EOP' / 'urban central solid biomass CHP' Links)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
    data_dependencies:
      - input: "Technology cost rows 'solid biomass', 'biomass EOP', 'central solid biomass CHP', 'biogas' (retrieved from PyPSA/technology-data, version costs.technology_data_version)"
        required_for: "All biomass conversion links and store marginal costs"
        availability: "exists by default (Snakefile rule retrieve_cost_data)"
      - input: "data/temp_hard_coded/biomass_transport_costs.csv"
        required_for: "sector.biomass_transport per-country costs"
        availability: "exists by default; region-dependent coverage (missing countries fall back to sector.biomass_transport_default_cost)"
      - input: "Powerplantmatching / OSM powerplant data (Fueltype 'Bioenergy')"
        required_for: "Existing biomass generators in the power chain"
        availability: "region-dependent (OSM completeness varies)"
      - input: "UNSD energy balances (data/demand/unsd/data) via energy totals"
        required_for: "'services biomass' and residential biomass demand levels"
        availability: "must be built (downloaded when demand_data.update_data)"
