id: building-retrofit
title: Building envelope retrofit / insulation
summary: Reducing building space-heat demand through insulation, renovation and envelope efficiency measures.

when_to_use:
  - "building retrofit"
  - "insulation"
  - "building renovation scenario"
  - "energy efficiency in buildings"
  - "reduce heating demand"
  - "demand-side efficiency for space heating"
  - "thermal envelope upgrade"
  - "building codes / efficiency standards"
  - "known in pypsa-eur as: retrofitting, building retrofitting"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Only an EXOGENOUS space-heat demand reduction. In add_heat, if
        sector.reduce_space_heat_exogenously is true, the factor
        sector.reduce_space_heat_exogenously_factor (default 0.29) scales down the
        "residential space" and "services space" heat demand columns uniformly:
        heat_demand[sector + " space"] = (1 - dE) * heat_demand[sector + " space"].
        The factor may be a dict keyed by planning horizon (resolved via get(...,
        investment_year)), so a renovation trajectory over myopic horizons is possible.
        Water heating demand is untouched. The config comments state the default factors
        are Europe-specific (EU calculator LTS scenario) and that a negative factor can
        represent demand growth.
      mechanism: >
        rule prepare_sector_network -> add_heat -> reduce_space_heat_exogenously block,
        applied to the heat_demand csv produced by prepare_heat_data before loads are
        added to the heat buses.
      not_covered: >
        No ENDOGENOUS retrofitting: there is no retrofit investment option, no cost-vs-
        savings supply curve, no building-stock data, and no per-country or per-node
        differentiation of the reduction factor (a single scalar/dict applies to all
        nodes and both sectors). Grepping this repository finds no building
        retrofit/insulation logic (the only "retrofit" config key is
        H2_retrofit_capacity_per_CH4 for gas pipelines). Note: this is a claim about
        pypsa-earth at this commit only.
      provenance: "scripts/prepare_sector_network.py:reduce_space_heat_exogenously"

    levers:
      - key: sector.reduce_space_heat_exogenously
        effect: Enables the exogenous space-heat demand reduction.
        default: "false"
        provenance: "config.default.yaml:reduce_space_heat_exogenously; scripts/prepare_sector_network.py:reduce_space_heat_exogenously"
      - key: sector.reduce_space_heat_exogenously_factor
        effect: "Per-unit reduction of space heat demand; scalar or dict {planning_horizon: factor}; negative values increase demand."
        default: "0.29"
        provenance: "config.default.yaml:reduce_space_heat_exogenously_factor; scripts/prepare_sector_network.py:reduce_space_heat_exogenously_factor"

    boundary:
      - variant: "Apply a uniform space-heat demand reduction (renovation proxy)"
        rung: L0
        note: "Flip sector.reduce_space_heat_exogenously to true (default factor 0.29)."
      - variant: "Year-dependent renovation trajectory across planning horizons"
        rung: L1
        note: "Give reduce_space_heat_exogenously_factor as a dict keyed by planning horizon (get(..., investment_year) resolves it)."
      - variant: "Country- or node-differentiated retrofit depth"
        rung: L2
        note: "The factor is applied uniformly in add_heat; a small edit there can map a per-country factor onto heat_demand columns (plus a data table if read from file, an L3 addition)."
      - variant: "Region-appropriate reduction factors (defaults are Europe-derived)"
        rung: L3
        note: "No dataset shipped; user must derive factors for the target region and set them in config — flagged in config comments as needing regional adjustment."
      - variant: "Endogenous retrofit investment (cost-optimal insulation vs supply)"
        rung: L5
        note: "Requires new component logic (e.g. retrofit 'generators' on heat buses with cost-potential steps), new building-stock/cost data (L3) and likely a new rule (L4); nothing exists in this repo."

    where:
      - change: "Where the exogenous reduction is applied"
        anchor: "scripts/prepare_sector_network.py:add_heat (reduce_space_heat_exogenously block)"
        provenance: "scripts/prepare_sector_network.py:reduce_space_heat_exogenously"
      - change: "Space heat demand series being scaled"
        anchor: "rule prepare_heat_data output heat_demand csv (columns 'residential space', 'services space')"
        provenance: "scripts/prepare_heat_data.py:prepare_heat_data"
      - change: "Weather-driven space heat shape (degree-day basis)"
        anchor: "rule build_heat_demand (atlite cutout.heat_demand)"
        provenance: "scripts/build_heat_demand.py:heat_demand"

    data_dependencies:
      - input: "Regionally appropriate reduction factors"
        required_for: "Any non-European retrofit scenario"
        availability: "absent (defaults are Europe-specific per config comments)"
      - input: "UNSD energy balances + ERA5 cutout + population layouts"
        required_for: "The baseline space heat demand being reduced"
        availability: "must be built (build_base_energy_totals, build_heat_demand, build_population_layouts)"
