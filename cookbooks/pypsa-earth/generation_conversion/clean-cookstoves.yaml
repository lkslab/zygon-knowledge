id: clean-cookstoves
title: Clean cookstoves
summary: Replacing traditional biomass cooking with improved/clean cookstoves (efficient biomass, LPG, biogas or electric), reducing fuel use.

when_to_use:
  - "clean cookstoves"
  - "improved cookstoves"
  - "traditional biomass cooking"
  - "firewood / charcoal cooking transition"
  - "LPG for cooking"
  - "reduce household biomass use"
  - "clean cooking access scenario (SDG7)"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT represented as a technology — no cookstove, stove-efficiency or cooking
        category exists anywhere in the scripts or config ("cook" does not appear at
        this commit). Household biomass use (which contains traditional cooking) enters
        as the UNSD-derived column "residential biomass" in build_base_energy_totals
        ("consumption by households" branch), is split into heat vs non-heat by
        fuel_shares.csv "biomass residential heat share", projected with
        efficiency_gains_cagr.csv and growth_factors_cagr.csv in prepare_energy_totals,
        and becomes a "residential biomass" Load on the solid-biomass carrier buses in
        add_residential. A share can be moved to electricity via fuel_shares.csv
        "biomass to elec share" (non-heat) and "biomass to elec heat share" (heat).
      mechanism: >
        rule build_base_energy_totals -> rule prepare_energy_totals (fuel share
        reallocation and CAGR projections, DEFAULT-row fallback via fill_country_data)
        -> prepare_sector_network add_residential (Load "residential biomass" at
        spatial.biomass.nodes).
      not_covered: >
        No stove stock or efficiency model, no traditional-vs-improved stove
        distinction, no biomass-to-LPG switching lever (fuel_shares only has *-to-elec
        columns), no health/air-quality accounting, no cooking load profile. A
        cookstove-efficiency improvement can only be expressed as an exogenous demand
        reduction or fuel reallocation in the demand data.
      provenance: "scripts/prepare_energy_totals.py:biomass to elec share"

    levers:
      - key: sector.enable.residential
        effect: Gates add_residential, i.e. whether the residential biomass load exists in the network.
        default: "true"
        provenance: "config.default.yaml:enable; scripts/prepare_sector_network.py:add_residential"
      - key: demand_data.base_year
        effect: UNSD year for the baseline residential biomass consumption.
        default: "2019"
        provenance: "config.default.yaml:base_year; Snakefile:build_base_energy_totals"
      - key: sector.efficiency_heat_biomass_to_elec
        effect: Efficiency credit applied when residential biomass HEAT demand is shifted to electricity (used with fuel_shares 'biomass to elec heat share').
        default: "0.9"
        provenance: "config.default.yaml:efficiency_heat_biomass_to_elec; scripts/prepare_energy_totals.py:efficiency_heat_biomass_to_elec"

    boundary:
      - variant: "Represent improved-stove efficiency as declining biomass demand over time"
        rung: L3
        note: "Set a negative CAGR in the 'residential biomass' column of data/demand/efficiency_gains_cagr.csv for the country (DEFAULT row fallback); compounded to the planning horizon in prepare_energy_totals (calculate_end_values)."
      - variant: "Switch a share of biomass cooking to electricity"
        rung: L3
        note: "Edit 'biomass to elec share' (non-heat) in data/demand/fuel_shares.csv for the country; applied 1:1 with no stove-efficiency factor — fold the efficiency gain into the share."
      - variant: "Switch biomass cooking to LPG/biogas"
        rung: L2
        note: "No biomass-to-oil/gas share column exists; needs a new column in fuel_shares.csv (L3 data) plus a small edit in prepare_energy_totals to consume it and credit 'residential oil'/'residential gas'."
      - variant: "Endogenous stove-choice competition (traditional vs improved vs LPG vs electric on cost)"
        rung: L5
        note: "Requires an explicit cooking demand bus and stove conversion components — no such logic exists; also needs demand separation that UNSD-based columns do not provide."

    where:
      - change: "Biomass demand projection factors"
        anchor: "data/demand/efficiency_gains_cagr.csv + data/demand/growth_factors_cagr.csv, consumed in prepare_energy_totals (calculate_end_values)"
        provenance: "scripts/prepare_energy_totals.py:calculate_end_values"
      - change: "Fuel-switching shares"
        anchor: "data/demand/fuel_shares.csv ('biomass to elec share', 'biomass residential heat share'), consumed in prepare_energy_totals"
        provenance: "data/demand/fuel_shares.csv:biomass to elec share"
      - change: "Residential biomass load placement"
        anchor: "scripts/prepare_sector_network.py:add_residential (Load 'residential biomass')"
        provenance: "scripts/prepare_sector_network.py:residential biomass"
      - change: "Baseline extraction from UNSD"
        anchor: "scripts/build_base_energy_totals.py:calc_sector ('consumption by households', biomass_fuels)"
        provenance: "scripts/build_base_energy_totals.py:calc_sector"

    data_dependencies:
      - input: "UNSD energy statistics database (household biomass consumption)"
        required_for: "Baseline traditional-cooking fuel demand"
        availability: "must be built (build_base_energy_totals; demand_data.update_data)"
      - input: "data/demand/fuel_shares.csv"
        required_for: "Country biomass heat/non-heat split and electrification shares"
        availability: "region-dependent (few country rows; DEFAULT fallback)"
      - input: "data/demand/efficiency_gains_cagr.csv"
        required_for: "Stove-efficiency-as-demand-decline trajectories"
        availability: "exists by default (DEFAULT row; country rows region-dependent)"
      - input: "Solid biomass potential (sector.solid_biomass_potential)"
        required_for: "Supply side that the residential biomass load draws on"
        availability: "exists by default (single aggregate config value, not spatially resolved)"
