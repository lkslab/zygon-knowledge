id: compressed-air-storage
title: Compressed-air storage (CAES)
summary: Compressed-air energy storage — electricity stored as pressurised air (typically in caverns), including adiabatic CAES.
when_to_use:
  - compressed air storage / CAES
  - adiabatic CAES / A-CAES
  - cavern-based electricity storage (non-hydrogen)
  - air storage in salt caverns
  - "known in pypsa-eur as: pair, pair charger, pair discharger"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Nothing CAES-specific — grounded absence: no CAES/compressed-air carrier,
        config key, or code branch exists in scripts/ or config.default.yaml. The
        generic Store + charger/discharger Links machinery in attach_stores could
        represent it, but only "H2" and "battery" branches exist.
      mechanism: >
        Not built by any rule. Entry points are attach_stores / attach_storageunits
        in scripts/add_extra_components.py (rule add_extra_components), with
        hardcoded carrier branches and lookup_store / lookup_dispatch dicts limited
        to H2 and battery. The retrieved technology-data v0.13.2 costs file ships
        "Compressed-Air-Adiabatic-store" and "Compressed-Air-Adiabatic-bicharger"
        rows (verified in a locally built costs_2030_elec.csv) — cost data exists
        upstream, unconsumed. For geologically constrained siting, the H2 salt-cavern
        block in add_hydrogen (scripts/prepare_sector_network.py) is the in-repo
        template: country potentials from a CSV mapped to per-node e_nom_max.
      not_covered: >
        Everything technology-specific: carrier, cost mapping, cavern siting
        constraints, heat integration of adiabatic CAES.
      provenance: scripts/add_extra_components.py:attach_stores
    levers:
      - key: electricity.extendable_carriers.Store
        effect: Carrier list read by attach_stores — config-side half of a distinct CAES carrier (needs code branch).
        default: "[battery, H2]"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: electricity.extendable_carriers.StorageUnit
        effect: Carrier list read by attach_storageunits — config-side half of a fixed-duration CAES StorageUnit.
        default: "[]"
        provenance: scripts/add_extra_components.py:attach_storageunits
      - key: electricity.max_hours.battery
        effect: Proxy route — generic battery StorageUnit with CAES-like duration and overridden costs.
        default: "6"
        provenance: scripts/process_cost_data.py:costs_for_storage
    boundary:
      - variant: CAES as a re-costed generic storage (proxy)
        rung: L1
        note: Battery carrier with CAES duration (electricity.max_hours.battery) and cost/efficiency overrides via the costs section (load_costs override maps; investment map present only as comment in config.default.yaml). Replaces Li-ion in the run.
      - variant: Distinct siting-free CAES Store+Link carrier
        rung: L2
        note: >
          New branch in attach_stores (Store cost from "Compressed-Air-Adiabatic-store",
          charger and discharger Links from "Compressed-Air-Adiabatic-bicharger") plus
          the carrier in electricity.extendable_carriers.Store. Costs rows exist in
          retrieved technology-data v0.13.2 — no data work.
      - variant: Distinct fixed-duration CAES StorageUnit
        rung: L2
        note: Extend lookup_store/lookup_dispatch in attach_storageunits, add carrier to extendable_carriers.StorageUnit + electricity.max_hours, and synthesise its combined capital-cost row in load_costs.
      - variant: Cavern-constrained CAES (regional e_nom_max potentials)
        rung: L3
        note: Needs a cavern-potential dataset (none exists for CAES in the repo) plus the L2 branch; mirror the pattern in add_hydrogen where data/hydrogen_salt_cavern_potentials.csv country totals become per-node e_nom_max.
      - variant: Diabatic CAES with gas co-firing / TES-coupled heat recovery
        rung: L5
        note: Multi-input link topology and heat coupling have no template for storage; bespoke component logic.
    where:
      - change: New Store+Link storage carrier
        anchor: scripts/add_extra_components.py, function attach_stores (rule add_extra_components)
        provenance: scripts/add_extra_components.py:attach_stores
      - change: New StorageUnit carrier (cost lookup dicts)
        anchor: scripts/add_extra_components.py, function attach_storageunits (lookup_store / lookup_dispatch)
        provenance: scripts/add_extra_components.py:lookup_store
      - change: Combined capital-cost row for a new StorageUnit carrier
        anchor: scripts/process_cost_data.py, function load_costs (helper costs_for_storage)
        provenance: scripts/process_cost_data.py:costs_for_storage
      - change: Template for potential-limited cavern stores
        anchor: scripts/prepare_sector_network.py, function add_hydrogen, underground_storage block (rule prepare_sector_network)
        provenance: scripts/prepare_sector_network.py:underground_storage
    data_dependencies:
      - input: technology-data costs rows "Compressed-Air-Adiabatic-store" / "Compressed-Air-Adiabatic-bicharger" (rule retrieve_cost_data, costs.technology_data_version v0.13.2)
        required_for: Distinct CAES carrier
        availability: exists by default in the retrieved costs file; absent from the offline fallback data/costs.csv
      - input: CAES cavern/geology potential data per region
        required_for: Cavern-constrained CAES
        availability: absent — must be provided by the user
