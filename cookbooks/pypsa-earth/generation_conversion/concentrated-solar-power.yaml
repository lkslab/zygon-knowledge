id: concentrated-solar-power
title: Concentrated solar power (CSP)
summary: Solar-thermal tower plants concentrating direct irradiation, optionally with thermal energy storage (TES) that decouples solar collection from electric dispatch.

when_to_use:
  - add CSP / concentrated solar
  - solar tower / solar thermal power plant
  - solar with built-in thermal storage
  - dispatchable solar
  - CSP with molten salt storage
  - csp_model simple vs advanced

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        A full renewable.csp config block exists (atlite resource method 'csp', installation
        SAM_solar_tower, land eligibility, csp_model simple|advanced with default 'advanced'),
        and the workflow is fully wired: the build_renewable_profiles rule accepts technology
        'csp' (onshore regions), load_costs creates a 'csp' costs row aliased from 'csp-tower',
        and attach_stores in add_extra_components adds the advanced TES representation. BUT 'csp'
        is NOT in the default electricity.renewable_carriers list, so out of the box no CSP
        appears in the network — activating it is pure config.
      mechanism: >
        With 'csp' added to electricity.renewable_carriers (and extendable_carriers.Generator to
        make it optimisable): rule build_renewable_profiles builds profile_csp.nc (atlite csp
        method, copernicus grid_codes [20,30,40,60,90], natura, capacity_per_sqkm 2.392); the
        add_electricity rule auto-adds profile_csp.nc as input (inputs are generated for every
        tech in config['renewable'] that is in renewable_carriers) and attach_wind_and_solar adds
        csp Generators per bus. If renewable.csp.csp_model == 'advanced', attach_stores in
        scripts/add_extra_components.py rewires each csp generator onto a dedicated '<bus> csp'
        Bus and adds a TES Store (costs 'csp-tower TES') plus a power-block Link to the main bus
        (efficiency/capex from 'csp-tower'), so solar heat can be stored before conversion. With
        'simple', csp stays a plain generator.
      not_covered: >
        No parabolic-trough or other collector geometries (installation is SAM_solar_tower; other
        atlite installations would need config + matching costs rows); TES sizing is optimised but
        there is no solar-multiple coupling constraint between collector field, store, and power
        block beyond their separate capex terms; renewable.csp.copernicus.distancing_codes /
        distance_to_codes keys in config.default.yaml are not read by build_renewable_profiles
        (it reads 'distance' and 'distance_grid_codes').
      provenance: "scripts/add_extra_components.py:attach_stores"

    levers:
      - key: electricity.renewable_carriers
        effect: "Add 'csp' here to activate CSP (not included by default)."
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro] (no csp)"
        provenance: "config.default.yaml:renewable_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: "Add 'csp' to allow capacity expansion of the collector/generator."
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT] (no csp)"
        provenance: "config.default.yaml:extendable_carriers"
      - key: renewable.csp.csp_model
        effect: "'simple' = plain generator; 'advanced' = generator + csp bus + TES Store + power-block Link."
        default: "advanced"
        provenance: "scripts/add_extra_components.py:csp_model"
      - key: renewable.csp.resource.installation
        effect: "atlite CSP installation model used for the heat profile."
        default: "SAM_solar_tower"
        provenance: "config.default.yaml:SAM_solar_tower"
      - key: renewable.csp.capacity_per_sqkm
        effect: "MW installable per km2 of eligible land."
        default: "2.392"
        provenance: "scripts/build_renewable_profiles.py:capacity_per_sqkm"
      - key: renewable.csp.copernicus.grid_codes
        effect: "Eligible land-cover classes for CSP siting."
        default: "[20, 30, 40, 60, 90]"
        provenance: "scripts/build_renewable_profiles.py:grid_codes"
      - key: renewable.csp.natura
        effect: "Exclude protected areas."
        default: "true"
        provenance: "scripts/build_renewable_profiles.py:natura"
      - key: renewable.csp.potential
        effect: "'simple' or 'conservative' p_nom_max method."
        default: "simple"
        provenance: "scripts/build_renewable_profiles.py:potential"
      - key: renewable.csp.clip_p_max_pu
        effect: "Zero out tiny capacity factors."
        default: "1.e-2"
        provenance: "scripts/build_renewable_profiles.py:clip_p_max_pu"
      - key: renewable.csp.cutout
        effect: "Weather cutout; 'auto' resolves to atlite.default."
        default: "auto"
        provenance: "scripts/_helpers.py:update_cutout_config"

    boundary:
      - variant: "turn CSP on (with TES)"
        rung: L1
        note: "add 'csp' to electricity.renewable_carriers (+ extendable_carriers.Generator); csp_model 'advanced' is already default. Profile input wiring to add_electricity is automatic."
      - variant: "CSP without storage"
        rung: L0
        note: "renewable.csp.csp_model: simple (given csp is activated as above)."
      - variant: "change TES cost/efficiency assumptions"
        rung: L3
        note: "TES Store/Link read 'csp-tower TES' and 'csp-tower' rows from the retrieved technology-data csv; override via the costs overwrite mechanism in load_costs (config costs.investment/... mappings) or a custom costs file."
      - variant: "parabolic trough instead of tower"
        rung: L3
        note: "renewable.csp.resource.installation to another atlite installation + point the hardcoded 'csp-tower' cost lookups (load_costs alias and attach_stores) at trough rows — small code edit plus costs data."
      - variant: "fixed solar-multiple / coupled field-store-block sizing constraint"
        rung: L5
        note: "no mechanism; needs a custom constraint in solve_network."

    where:
      - change: "CSP heat profile and potential"
        anchor: "rule build_renewable_profiles -> scripts/build_renewable_profiles.py (technology 'csp', onshore regions)"
        provenance: "Snakefile:rule build_renewable_profiles"
      - change: "generator attachment (both csp_model variants)"
        anchor: "attach_wind_and_solar in scripts/add_electricity.py"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar"
      - change: "advanced model: csp bus + TES Store + power-block Link"
        anchor: "attach_stores in scripts/add_extra_components.py (rule add_extra_components)"
        provenance: "scripts/add_extra_components.py:attach_stores"
      - change: "csp cost row aliasing from csp-tower"
        anchor: "load_costs in scripts/process_cost_data.py"
        provenance: "scripts/process_cost_data.py:csp-tower"

    data_dependencies:
      - input: "ERA5 cutout with direct-irradiation fields"
        required_for: "atlite csp method"
        availability: "same cutout as solar/wind; retrieved or built via build_cutout"
      - input: "technology-data costs file (csp-tower, csp-tower TES rows)"
        required_for: "generator, TES store, and power-block costs"
        availability: "retrieved by rule retrieve_cost_data; rows present in technology-data v0.13.2"
      - input: "Copernicus land cover raster + natura.tiff"
        required_for: "siting eligibility"
        availability: "retrieved by databundle / pregenerated"
      - input: "powerplants.csv"
        required_for: "existing CSP capacity (only if present in powerplantmatching for the region)"
        availability: "built by rule build_powerplants; CSP fleet data sparse"
