id: district-heating
title: District heating networks
summary: Centralised heat networks supplying urban demand from large heat sources (CHP, large heat pumps, boilers) with distribution losses.

when_to_use:
  - "district heating"
  - "heat networks"
  - "urban central heating"
  - "CHP supplying heat"
  - "expand district heating share"
  - "centralised vs decentralised heating"
  - "heat network losses"
  - "large-scale heat pumps for cities"
  - "known in pypsa-eur as: district heating, ptes heat pump, urban central ptes heat pump, river_water heat, river_water heat pump, sea_water heat, sea_water heat pump"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        An "urban central" heat system per node. create_nodes_for_heat_sector computes a
        per-node district heating fraction: today's country share comes from
        energy_totals["district heat share"] (set in prepare_energy_totals from
        data/demand/district_heating.csv column "current"), distributed by urban
        population; it is then moved toward the maximum
        sector.district_heating.potential (default 0.3 of urban demand) by
        sector.district_heating.progress (default 1, i.e. jump straight to potential;
        can be a dict per planning horizon). add_heat assigns that fraction of urban
        space+water demand to the "urban central heat" bus, marked up by
        sector.district_heating.district_heating_loss (default 0.15). Supply on the
        urban central bus: central air-sourced heat pump, central resistive heater and
        central gas boiler (if sector.boilers), central water tanks TES
        (sector.tes_tau.central = 180 days), "urban central gas CHP" (+ CC variant if
        sector.cc) when sector.chp is true, and solid-biomass CHP added in add_biomass
        at nodes with district heating.
      mechanism: >
        data/demand/district_heating.csv -> rule prepare_energy_totals ("district heat
        share" column, DEFAULT-row fallback via fill_country_data) -> rule
        prepare_heat_data (district_heat_share csv) -> rule prepare_sector_network:
        create_nodes_for_heat_sector (dist_fraction per node) -> add_heat (urban central
        bus, load with loss markup, central supply technologies).
      not_covered: >
        No explicit pipe network: heat distribution within a node is a single loss
        factor, there is no inter-node heat transport, no network investment cost, and
        no temperature levels. The shipped district_heating.csv contains only DEFAULT,
        MA and TN rows, ALL ZERO for both "current" and "potential" columns — so today's
        DH share is zero everywhere and expansion comes purely from the config
        potential/progress interpolation. No waste-heat or geothermal DH sources.
      provenance: "scripts/prepare_sector_network.py:create_nodes_for_heat_sector"

    levers:
      - key: sector.district_heating.potential
        effect: Maximum fraction of urban heat demand that district heating may reach.
        default: "0.3"
        provenance: "config.default.yaml:district_heating; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: sector.district_heating.progress
        effect: Interpolation (0=today's share, 1=full potential) between current and maximum DH share; scalar or dict by planning horizon.
        default: "1"
        provenance: "config.default.yaml:progress; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: sector.district_heating.district_heating_loss
        effect: Fractional markup on urban central heat load representing network losses.
        default: "0.15"
        provenance: "config.default.yaml:district_heating_loss; scripts/prepare_sector_network.py:district_heating_loss"
      - key: sector.chp
        effect: Adds "urban central gas CHP" (and CC variant with sector.cc) on district heating nodes.
        default: "true"
        provenance: "config.default.yaml:chp; scripts/prepare_sector_network.py:urban central gas CHP"
      - key: sector.tes_tau.central
        effect: Time constant (days) for standing losses of central water-tank storage on the DH bus.
        default: "180"
        provenance: "config.default.yaml:tes_tau; scripts/prepare_sector_network.py:tes_tau"

    boundary:
      - variant: "Turn district heating expansion up or down"
        rung: L1
        note: "sector.district_heating.potential and .progress (dict per horizon for a rollout path)."
      - variant: "Change network loss assumption"
        rung: L1
        note: "sector.district_heating.district_heating_loss."
      - variant: "Set today's actual DH share for a country"
        rung: L3
        note: "Add/edit the country row in data/demand/district_heating.csv (columns current, potential); DEFAULT row (all zero) is the fallback for missing countries via fill_country_data in prepare_energy_totals. Note: the shipped file only lists MA and TN besides DEFAULT, all zeros."
      - variant: "Node-level (sub-national) DH shares instead of country shares scaled by urban population"
        rung: L2
        note: "Edit the dist_fraction_node construction in create_nodes_for_heat_sector."
      - variant: "Add another central supply technology (e.g. central solar thermal exists already; waste heat, geothermal DH do not)"
        rung: L5
        note: "New Link/Generator logic on the urban central heat bus in add_heat, plus cost rows (L3)."
      - variant: "Explicit heat transport between nodes / pipe investment"
        rung: L5
        note: "No heat network component exists; bespoke Links between heat buses and cost data required."

    where:
      - change: "DH share computation (current -> potential interpolation, urban weighting)"
        anchor: "scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
        provenance: "scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - change: "Country DH share data and DEFAULT fallback"
        anchor: "data/demand/district_heating.csv + prepare_energy_totals (fill_country_data, 'district heat share')"
        provenance: "scripts/prepare_energy_totals.py:district heat share"
      - change: "Urban central bus, load with loss markup, central technologies"
        anchor: "scripts/prepare_sector_network.py:add_heat (name == 'urban central' branches)"
        provenance: "scripts/prepare_sector_network.py:urban central"
      - change: "Biomass CHP at DH nodes"
        anchor: "scripts/prepare_sector_network.py:add_biomass (AC buses with district heating)"
        provenance: "scripts/prepare_sector_network.py:add_biomass"

    data_dependencies:
      - input: "data/demand/district_heating.csv (country rows: DEFAULT, MA, TN — all zeros)"
        required_for: "Today's district heating share per country"
        availability: "exists by default but effectively empty; region-dependent — most countries fall back to DEFAULT=0"
      - input: "Urban population layouts (WorldPop + UNCTAD urban percent)"
        required_for: "Distributing the country DH share to nodes and bounding it by urban fraction"
        availability: "must be built (build_population_layouts)"
      - input: "UNSD energy balances (urban heat demand totals)"
        required_for: "Magnitude of the urban central heat load"
        availability: "must be built (build_base_energy_totals)"
      - input: "Technology cost rows (central gas CHP, central water tank storage, central air-sourced heat pump)"
        required_for: "Costing central supply options"
        availability: "exists by default (retrieve_cost_data from technology-data)"
