id: dynamic-line-rating-facts
title: Dynamic line rating / FACTS
summary: Weather-dependent thermal ratings of overhead lines (DLR) and flexible AC transmission devices (FACTS) that push more power through the existing grid.
when_to_use:
  - "dynamic line rating / ampacity forecasting"
  - "get more out of the existing grid without building lines"
  - "weather-dependent transmission capacity"
  - "FACTS devices / SVC / STATCOM / phase shifters"
  - "seasonal line ratings"
  - "why are line capacities constant all year"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Not covered. Line capacities are static: s_nom is derived once from the
        standard line type per voltage class (_set_lines_s_nom_from_linetypes in
        base_network.py), and the usable fraction is a single scalar applied to
        all lines and all snapshots — lines.s_max_pu (default 0.7), set in
        base_network (_set_electrical_parameters_lines) and re-applied in
        prepare_network (set_line_s_max_pu writes n.lines["s_max_pu"], logged as
        the N-1 security margin). No script computes weather-dependent ratings
        (there is no line_rating rule in the Snakefile, unlike pypsa-eur), and no
        FACTS devices exist — power flow is linearised (solve_network.py), so
        controllable impedance/phase devices have no native representation.
      mechanism: >
        Static rating chain: lines.ac_types type -> i_nom -> s_nom
        (_set_lines_s_nom_from_linetypes) x lines.s_max_pu (set_line_s_max_pu).
        The underlying PyPSA Line attribute s_max_pu accepts "static or series",
        i.e. a time series per line is representable by the framework even though
        this workflow only ever sets a scalar.
      not_covered: >
        Weather-coupled ampacity, per-line or per-season margins, any FACTS
        device, phase-shifting transformers (Transformer components carry only x,
        s_nom, type from the transformers config), and reactive compensation.
      provenance: "scripts/prepare_network.py:set_line_s_max_pu"
    levers:
      - key: lines.s_max_pu
        effect: "Uniform static derating of all lines — the only rating knob; raising it (e.g. 0.8) crudely mimics an average DLR uplift, at the cost of the N-1 margin it represents."
        default: "0.7"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - key: lines.ac_types
        effect: "Choosing a heavier conductor type per voltage raises the static s_nom baseline."
        default: "132..750 kV standard types"
        provenance: "scripts/base_network.py:_set_lines_s_nom_from_linetypes"
      - key: scenario.ll
        effect: "Not a rating lever, but the substitute question — allowing expansion (copt/vX) is how the model currently 'creates' transfer capacity."
        default: "[\"copt\"]"
        provenance: "scripts/prepare_network.py:set_transmission_limit"
    boundary:
      - variant: "Uniform higher/lower static rating"
        rung: L0
        note: "lines.s_max_pu."
      - variant: "Seasonal or per-line s_max_pu profiles (crude DLR proxy)"
        rung: L2
        note: "Replace the scalar assignment in set_line_s_max_pu (prepare_network.py) with a per-line time series into n.lines_t.s_max_pu — PyPSA's Line.s_max_pu is 'static or series' and its own attribute docs name weather-dependent dynamic line rating as the use case. Simple seasonal profiles need no new data (L2)."
      - variant: "Weather-driven DLR from reanalysis (temperature/wind along line routes)"
        rung: L4
        note: "Needs a new snakemake rule computing per-line ampacity series from the atlite ERA5 cutout plus line geometries (all_lines_build_network.geojson from rule build_osm_network), wired into prepare_network — pypsa-eur has such a rule; pypsa-earth does not."
      - variant: "FACTS / phase-shifter dispatch"
        rung: L5
        note: "No representation in the linearised LP; nearest bespoke approximation is editing line impedances or adding controllable Link shunts — genuinely out of scope."
    where:
      - change: "Rating assignment (scalar today; entry point for series)"
        anchor: "scripts/prepare_network.py:set_line_s_max_pu"
        provenance: "scripts/prepare_network.py:set_line_s_max_pu"
      - change: "Static s_nom derivation from line types"
        anchor: "scripts/base_network.py:_set_lines_s_nom_from_linetypes"
        provenance: "scripts/base_network.py:_set_lines_s_nom_from_linetypes"
      - change: "Line geometries for a weather-DLR rule"
        anchor: "rule build_osm_network output all_lines_build_network.geojson"
        provenance: "Snakefile:build_osm_network"
      - change: "Weather data source for a DLR rule"
        anchor: "rule build_cutout / atlite cutouts config (atlite.cutouts)"
        provenance: "config.default.yaml:cutouts"
    data_dependencies:
      - input: "ERA5 cutout (atlite) covering the modelled region"
        required_for: "weather-driven DLR (L4)"
        availability: "exists by default (enable.retrieve_cutout: true) or must be built (enable.build_cutout)"
      - input: "line route geometries (resources/.../all_lines_build_network.geojson)"
        required_for: "mapping weather to individual lines"
        availability: "must be built (rule build_osm_network, standard workflow)"
