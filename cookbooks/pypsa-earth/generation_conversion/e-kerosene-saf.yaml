id: e-kerosene-saf
title: E-kerosene / sustainable aviation fuel
summary: Synthetic jet fuel for aviation — how aviation demand is met and how power-to-liquid output can (implicitly) supply it.
when_to_use:
  - "sustainable aviation fuel (SAF)"
  - "e-kerosene / synthetic jet fuel"
  - "decarbonise aviation"
  - "SAF blending mandate"
  - "aviation fuel demand modelling"
  - "power-to-liquid for aircraft"
  - "known in pypsa-eur as: methanol-to-kerosene"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        There is NO distinct kerosene/SAF carrier. Aviation (sector.enable.aviation, default true)
        is a fixed Load "kerosene for aviation" placed on the SHARED oil buses (spatial.oil.nodes),
        distributed to nodes via an airports table scaled by national energy totals. The oil bus is
        supplied by (a) an extendable fossil "oil" Generator at fuel cost and (b) the
        Fischer-Tropsch Link (H2 + stored CO2 + electricity -> oil) when sector.fischer_tropsch is
        on. Because supply and demand share one bus, FT e-fuel implicitly supplies aviation
        whenever it is cost-optimal or CO2-constrained — that IS the e-kerosene mechanism, and it
        is indistinguishable from e-diesel/e-naphtha on the same bus. Aviation CO2 is booked as a
        fixed negative Load on "co2 atmosphere" computed from the kerosene demand times oil CO2
        intensity (international share included only if sector.international_bunkers); the FT link
        separately consumes stored CO2, which is how synthetic supply nets out emissions
        system-wide rather than per-flight.
      mechanism: >
        scripts/prepare_sector_network.py:add_aviation (load + emissions);
        scripts/prepare_sector_network.py:H2_liquid_fossil_conversions (FT supply);
        oil bus/store/generator fallback created in scripts/prepare_sector_network.py:add_shipping
        ('if "oil" not in n.buses.carrier.unique()' block). Airports come from
        resources/<run>/airports.csv (rule prepare_airports; sector.airport_sizing_factor), or
        data/custom/airports.csv when custom_data.airports is true.
      not_covered: >
        No dedicated kerosene or SAF carrier/bus; no blending mandate or minimum-synthetic-share
        constraint for aviation; no aviation efficiency improvements or demand elasticity (fixed
        p_set from energy totals); no hydrogen- or electric-powered aircraft; emissions are tied to
        the demand volume, not to the fossil/synthetic supply split (accounting closes via the FT
        link's stored-CO2 draw, not per fuel unit delivered to aviation).
      provenance: "scripts/prepare_sector_network.py:add_aviation"
    levers:
      - key: sector.enable.aviation
        effect: Master switch for the aviation kerosene load and its emissions load.
        default: "true"
        provenance: "config.default.yaml:aviation; Snakefile:prepare_sector_network"
      - key: sector.fischer_tropsch
        effect: Enables the FT link — the only synthetic route into the oil bus, hence the only e-kerosene supply.
        default: "true"
        provenance: "config.default.yaml:fischer_tropsch; scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - key: sector.min_part_load_fischer_tropsch
        effect: p_min_pu of the FT link (must-run share once built).
        default: "0.9"
        provenance: "config.default.yaml:min_part_load_fischer_tropsch; scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - key: sector.international_bunkers
        effect: Whether international aviation emissions count toward the CO2 balance (demand itself always includes international + domestic).
        default: "false"
        provenance: "config.default.yaml:international_bunkers; scripts/prepare_sector_network.py:add_aviation"
      - key: sector.airport_sizing_factor
        effect: Scaling used when preparing the airports table that spatially distributes aviation demand.
        default: "3"
        provenance: "config.default.yaml:airport_sizing_factor; scripts/prepare_airports.py:airport_sizing_factor"
      - key: custom_data.airports
        effect: Use a user-supplied data/custom/airports.csv for demand distribution.
        default: "false"
        provenance: "config.default.yaml:airports; Snakefile:prepare_sector_network"
      - key: sector.oil.spatial_oil
        effect: Per-node oil buses vs a single "Earth oil" bus — determines whether FT output and kerosene demand are co-located or copperplated.
        default: "true"
        provenance: "config.default.yaml:spatial_oil; scripts/prepare_sector_network.py:define_spatial"
    boundary:
      - variant: "Let the optimiser choose synthetic vs fossil jet fuel"
        rung: L0
        note: Default — shared oil bus + FT on; a CO2 cap (opts Co2L) is what actually pushes FT into aviation supply.
      - variant: "Change aviation demand volume"
        rung: L3
        note: p_set comes from energy totals ("total international aviation" + "total domestic aviation") and the demand/planning_horizons wildcards; adjust the energy-totals inputs or supply custom airports/demand data — no direct config scalar for aviation.
      - variant: "SAF blending mandate (minimum synthetic share of aviation fuel)"
        rung: L5
        note: Impossible on the shared bus without new structure — either a custom constraint tying FT output to kerosene load (approximate, system-level), or the L4 variant below.
      - variant: "Dedicated kerosene/SAF carrier separated from diesel/naphtha"
        rung: L4
        note: New kerosene bus + moving the add_aviation load onto it + refinery/FT product-split links + emissions rebooking; touches add_aviation, H2_liquid_fossil_conversions and the oil-bus supply block.
      - variant: "Hydrogen aircraft"
        rung: L5
        note: No demand-side representation; would mirror the shipping H2-share pattern (add_shipping) for aviation.
    where:
      - change: "Aviation load placement and emissions accounting"
        anchor: "scripts/prepare_sector_network.py:add_aviation"
        provenance: "scripts/prepare_sector_network.py:add_aviation"
      - change: "Synthetic supply into the oil bus"
        anchor: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - change: "Fossil oil fallback supply (generator/store on oil bus)"
        anchor: "scripts/prepare_sector_network.py:add_shipping (oil bus creation block)"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
      - change: "Custom mandate constraints"
        anchor: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "resources/<run>/airports.csv (rule prepare_airports) or data/custom/airports.csv"
        required_for: "spatial distribution of aviation demand"
        availability: "must be built (auto); custom file user-supplied"
      - input: "energy totals csv (aviation columns) from prepare_energy_totals / demand wildcards"
        required_for: "aviation demand volume"
        availability: "must be built; region-dependent (UNSD-based)"
      - input: "technology-data costs csv rows: Fischer-Tropsch, oil (CO2 intensity, fuel cost)"
        required_for: "synthetic and fossil supply economics"
        availability: "must be built (rule retrieve_cost_data)"
