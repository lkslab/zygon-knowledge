id: e-methanol
title: E-methanol
summary: Synthetic methanol produced from hydrogen and captured CO2 (methanolisation), as a fuel or chemical feedstock.
when_to_use:
  - "add e-methanol / green methanol production"
  - "methanol as shipping fuel"
  - "methanolisation of CO2"
  - "methanol-to-X (kerosene, olefins) chains"
  - "power-to-methanol"
  - "known in pypsa-eur as: methanol, methanol transport, methanolisation, biomass-to-methanol, biomass-to-methanol CC, Methanol steam reforming, Methanol steam reforming CC, methanol-to-olefins/aromatics, allam methanol, CCGT methanol, CCGT methanol CC, OCGT methanol"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        NOTHING — grounded absence. A case-insensitive search for "methanol" across scripts/, the
        Snakefile and config.default.yaml at this commit returns no matches: there is no methanol
        carrier, bus, link, demand or config key anywhere in the workflow. Methanol-adjacent COST
        rows do already exist in the retrieved technology-data costs file (methanolisation,
        methanol, biomass-to-methanol, Methanol steam reforming, methanol-to-kerosene,
        methanol-to-olefins/aromatics, shipping fuel methanol), so the economic data is available
        even though no component consumes it.
      mechanism: >
        n/a — not represented. The nearest implemented patterns to copy are the H2+CO2 synthesis
        links: scripts/prepare_sector_network.py:h2_hc_conversions (Sabatier: bus0 H2 bus, bus1
        gas bus, bus2 co2 stored with negative efficiency2 = CO2 consumption) and
        scripts/prepare_sector_network.py:H2_liquid_fossil_conversions (Fischer-Tropsch: multi-bus
        link with electricity input on bus3). An e-methanol link is structurally identical with
        bus1 = a new methanol bus and efficiencies from the "methanolisation" cost row.
      not_covered: >
        Everything: methanol carrier/bus, methanolisation link, methanol demand (shipping,
        chemicals), methanol-to-kerosene, biomass-to-methanol.
      provenance: "scripts/prepare_sector_network.py:h2_hc_conversions"
    levers: []
    boundary:
      - variant: "Any methanol representation at all"
        rung: L4
        note: >
          New carrier + per-node buses + methanolisation Link (H2 + co2 stored + AC -> methanol)
          added in prepare_sector_network, plus at least one methanol Load (e.g. carve a share out
          of shipping oil demand in add_shipping) — a new function called from the
          prepare_sector_network main block; no new external data needed because the
          "methanolisation" cost row is already retrieved.
      - variant: "Methanol as shipping fuel with a configurable share"
        rung: L4
        note: Mirror the sector.shipping_hydrogen_share mechanism in add_shipping (a new config key + demand split), on top of the L4 supply chain above.
      - variant: "Methanol-to-kerosene for aviation"
        rung: L5
        note: Requires the methanol chain plus a new conversion link into the oil/kerosene demand structure (see e-kerosene recipe for how aviation draws on the oil bus).
      - variant: "Endogenous methanol export"
        rung: L5
        note: Export machinery is H2-only (add_export); a methanol export bus needs new rule plumbing.
    where:
      - change: "Add methanolisation supply link (template)"
        anchor: "scripts/prepare_sector_network.py:h2_hc_conversions (Sabatier link pattern) and H2_liquid_fossil_conversions (multi-input FT pattern)"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
      - change: "Hook a new add_methanol function into the workflow"
        anchor: "scripts/prepare_sector_network.py main block (sequence of add_* calls guarded by options flags); Snakefile rule prepare_sector_network"
        provenance: "Snakefile:prepare_sector_network"
      - change: "Methanol demand carve-out from shipping"
        anchor: "scripts/prepare_sector_network.py:add_shipping (shipping_hydrogen_share split pattern)"
        provenance: "scripts/prepare_sector_network.py:add_shipping"
    data_dependencies:
      - input: "technology-data costs csv rows: methanolisation, methanol, shipping fuel methanol, methanol-to-kerosene"
        required_for: "any methanol variant"
        availability: "exists once retrieve_cost_data has run (rows confirmed present in a built costs file at technology_data_version v0.13.2)"
      - input: "CO2 source (co2 stored buses via sector.cc / sector.dac / co2_network)"
        required_for: "methanolisation feedstock"
        availability: "exists by default in the sector workflow"
