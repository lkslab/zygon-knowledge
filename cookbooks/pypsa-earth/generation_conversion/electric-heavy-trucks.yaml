id: electric-heavy-trucks
title: Electric heavy trucks
summary: >
  Battery-electric heavy-duty road freight (HGVs/lorries) — electrifying truck
  transport demand as a distinct vehicle segment.

when_to_use:
  - "electric trucks / e-trucks / battery trucks"
  - "electrify road freight / heavy goods vehicles / HGVs / lorries"
  - "truck electrification scenario"
  - "heavy-duty vehicle decarbonisation"
  - "freight transport electricity demand"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered as a distinct segment. All road transport — cars, trucks, buses —
        is ONE aggregate demand ("total road" from UNSD energy balances), split only
        by fuel: sector.land_transport_electric_share (EV),
        sector.land_transport_fuel_cell_share (FCEV), remainder ICE oil. Raising the
        electric share electrifies trucks and cars indistinguishably, with
        passenger-car assumptions (battery size bev_energy, charge rate, car counts
        from WHO vehicle statistics).
      mechanism: >
        add_land_transport in prepare_sector_network splits the aggregate demand
        series (built by rule prepare_transport_data from energy totals shaped by the
        German KFZ__count all-vehicle traffic profile) by the exogenous shares keyed
        {demand}_{planning_horizon}. There is no truck wildcard, no truck share key,
        and no truck-specific efficiency or battery parameter anywhere in the sector
        config.
      not_covered: >
        Truck-vs-car disaggregation, truck-specific charging power/battery capacity,
        depot vs en-route charging, freight activity data (tkm). Note the repo ships
        an unused truck traffic profile data/emobility/Lkw__count that could seed a
        truck-specific demand shape.
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers:
      - key: sector.land_transport_electric_share
        effect: "Electrifies the WHOLE road aggregate (trucks included, not separable), keyed {demand}_{planning_horizon}."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_electric_share"
      - key: sector.land_transport_fuel_cell_share
        effect: "H2 share of the same aggregate; remainder is ICE oil."
        default: "AB_2030: 0.01 (dict per scenario/year)"
        provenance: "scripts/prepare_sector_network.py:land_transport_fuel_cell_share"
      - key: sector.enable.land_transport
        effect: "Master switch for the whole land transport block."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"

    boundary:
      - variant: "Electrify road freight together with all other road transport"
        rung: L1
        note: "Only as part of the aggregate: raise sector.land_transport_electric_share. Cannot target trucks alone."
      - variant: "Approximate a truck-only electrification by share arithmetic"
        rung: L1
        note: "Compute the electric share offline as (truck energy fraction of total road) x (truck electrification) and set it — honest kludge, EV parameters stay car-like."
      - variant: "Separate truck demand from the road aggregate"
        rung: L3
        note: >
          Needs a data-driven disaggregation of 'total road' into truck vs non-truck
          energy (UNSD does not provide it) plus a truck demand shape — the repo's
          unused data/emobility/Lkw__count weekly truck counts can supply the shape —
          then new share keys and a second load block in add_land_transport (the code
          edit itself is small, the data split is the blocker).
      - variant: "Truck segment with own share keys, charger/battery parameters, wildcards"
        rung: L4
        note: "New columns/outputs through rule prepare_transport_data and new config keys consumed in add_land_transport — rule plumbing plus config schema changes."
      - variant: "Endogenous truck fleet/charging optimisation"
        rung: L5
        note: "Bespoke component logic; nothing to build on out of the box."

    where:
      - change: "Where a truck-specific split/loads would be added"
        anchor: "scripts/prepare_sector_network.py function add_land_transport"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "Where truck demand series/profiles would be produced"
        anchor: "rule prepare_transport_data -> scripts/prepare_transport_data.py"
        provenance: "Snakefile:prepare_transport_data"
      - change: "Unused truck traffic profile that can seed a truck demand shape"
        anchor: "data/emobility/Lkw__count (sibling of the wired-in KFZ__count input)"
        provenance: "Snakefile:traffic_data_KFZ"

    data_dependencies:
      - input: "UNSD energy balances 'total road' (no truck/car split)"
        required_for: "aggregate demand that any truck share would be carved from"
        availability: "must be built; truck disaggregation absent"
      - input: "data/emobility/Lkw__count (German weekly truck traffic counts)"
        required_for: "truck-specific demand shape (variant L3+)"
        availability: "exists by default but NOT wired into any rule"
      - input: "Truck stock / freight activity data for the target region"
        required_for: "truck-specific charger and battery sizing"
        availability: "absent (vehicle stats used are total registered vehicles from WHO)"
