id: electric-resistance-heating
title: Electric resistance heating
summary: Direct electric heating (resistive heaters, electric boilers) converting electricity to heat at ~100% efficiency.

when_to_use:
  - "electric resistance heating"
  - "resistive heaters"
  - "electric boiler"
  - "direct electric heating"
  - "power-to-heat"
  - "electrode boiler in district heating"
  - "space heaters / baseboard heating"
  - "known in pypsa-eur as: resistive heater, residential rural resistive heater, residential urban decentral resistive heater, services rural resistive heater, services urban decentral resistive heater, urban central resistive heater"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Resistive heaters are added by default in add_heat as extendable Link
        components from the electricity bus to the heat bus of EVERY heat system node
        (all five systems: residential/services rural, residential/services urban
        decentral, urban central), carrier "{name} resistive heater", with efficiency,
        capital cost and lifetime from the technology-data rows
        "decentral resistive heater" / "central resistive heater". QUIRK: they are
        gated by sector.boilers — the same flag also adds gas boilers, so config alone
        cannot enable one without the other. With sector.electricity_distribution_grid
        true, resistive heater Links draw from the "low voltage" bus
        (add_electricity_distribution_grid rewires bus0 for carriers containing
        "resistive heater").
      mechanism: >
        rule prepare_sector_network -> add_heat, inside the options["boilers"] block:
        n.madd Link with key = f"{name_type} resistive heater"; competes against heat
        pumps, gas boilers, solar thermal and (via TES water tanks) storage on each
        heat bus.
      not_covered: >
        No separate electric-boiler technology distinct from resistive heaters; no
        storage/night-storage heater as a combined unit (TES water tanks are a separate
        Store on the heat bus); no way to toggle resistive heaters independently of gas
        boilers via config; existing resistive-heater stock only via the
        build_existing_heating_distribution pathway (European source data).
      provenance: "scripts/prepare_sector_network.py:resistive heater"

    levers:
      - key: sector.boilers
        effect: Enables BOTH resistive heaters and gas boilers on all heat buses (single flag).
        default: "true"
        provenance: "config.default.yaml:boilers; scripts/prepare_sector_network.py:resistive heater"
      - key: sector.electricity_distribution_grid
        effect: If true, resistive heaters draw from the low voltage bus, so distribution grid capacity/cost applies.
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.tes
        effect: Water-tank thermal storage on each heat bus — pairs with resistive heaters for load shifting (closest to storage heaters).
        default: "true"
        provenance: "config.default.yaml:tes; scripts/prepare_sector_network.py:water tanks"
      - key: sector.enable.heat
        effect: Master switch; without the heat sector there are no heat buses or resistive heaters.
        default: "true"
        provenance: "config.default.yaml:enable; Snakefile:HEAT"

    boundary:
      - variant: "Let resistive heaters compete for heat supply"
        rung: L0
        note: "Default (sector.boilers true); Links are p_nom_extendable."
      - variant: "Remove both resistive heaters and gas boilers"
        rung: L0
        note: "sector.boilers: false — removes both, by construction."
      - variant: "Enable resistive heaters WITHOUT gas boilers (or vice versa)"
        rung: L2
        note: "Split the single options['boilers'] gate in add_heat into two flags (small localised edit; optionally add a new config key)."
      - variant: "Represent existing resistive-heater stock (brownfield)"
        rung: L3
        note: "data/existing_infrastructure/existing_heating_raw.csv rows consumed by build_existing_heating_distribution; shipped data is from a European study."
      - variant: "Night-storage heater as one integrated component, or dispatch restrictions"
        rung: L5
        note: "No integrated storage-heater component; needs bespoke Link+Store logic beyond the generic water tanks."

    where:
      - change: "Resistive heater addition (and the shared boilers gate)"
        anchor: "scripts/prepare_sector_network.py:add_heat (options['boilers'] block, key = f\"{name_type} resistive heater\")"
        provenance: "scripts/prepare_sector_network.py:resistive heater"
      - change: "Low-voltage rewiring of resistive heaters"
        anchor: "scripts/prepare_sector_network.py:add_electricity_distribution_grid (carrier contains 'resistive heater')"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "Existing resistive heater capacities"
        anchor: "rule build_existing_heating_distribution + data/existing_infrastructure/existing_heating_raw.csv"
        provenance: "Snakefile:build_existing_heating_distribution"

    data_dependencies:
      - input: "Technology cost rows 'decentral resistive heater' / 'central resistive heater'"
        required_for: "Investment cost, efficiency, lifetime"
        availability: "exists by default (retrieve_cost_data from technology-data)"
      - input: "UNSD energy balances + ERA5 cutout + population layouts"
        required_for: "The heat demand resistive heaters can serve"
        availability: "must be built (build_base_energy_totals, build_heat_demand, build_population_layouts)"
      - input: "data/existing_infrastructure/existing_heating_raw.csv"
        required_for: "Brownfield resistive heater stock"
        availability: "region-dependent (European source study)"
