id: electrolysers
title: Electrolysers
summary: Electricity-to-hydrogen conversion capacity (alkaline, PEM, SOEC) as an investable technology in the energy system.
when_to_use:
  - "add electrolysers / electrolysis"
  - "make hydrogen from electricity"
  - "power-to-hydrogen / power-to-X entry point"
  - "compare alkaline vs PEM vs SOEC"
  - "hydrogen production from renewables"
  - "where does H2 electrolysis capacity come from"
  - "limit or force electrolyser build-out"
  - "known in pypsa-eur as: H2 Electrolysis, H2 electrolysis, power-to-H2"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        TWO separate chains, depending on workflow stage. (1) Sector-coupled chain: the
        prepare_sector_network rule adds one extendable Link per node for every technology listed
        in sector.hydrogen.production_technologies. Default list includes "H2 Electrolysis"
        (generic, technology-data row "electrolysis", AC bus -> "<node> H2" bus). Optional list
        values (documented inline in config.default.yaml) include "Alkaline electrolyzer large/
        medium/small", "PEM electrolyzer", "SOEC", whose efficiencies are 1/electricity-input from
        the corresponding technology-data rows. Existing electricity-only H2 components are removed
        first (remove_carrier_related_components). (2) Power-only chain: with "H2" in
        electricity.extendable_carriers.Store (default), add_extra_components creates per-bus
        "<bus> H2" buses with a Store plus an "H2 electrolysis" charge Link and an "H2 fuel cell"
        discharge Link; alternatively "H2" in extendable_carriers.StorageUnit gives a single
        StorageUnit with electrolysis charge efficiency and max_hours from electricity.max_hours.H2.
      mechanism: >
        scripts/prepare_sector_network.py:add_hydrogen builds a tech_params dict keyed by
        technology name (cost row, buses, efficiencies) and calls n.madd("Link", ...) per selected
        technology, p_nom_extendable=True, capital_cost from the costs csv. If
        sector.hydrogen.hydrogen_colors is true, electrolysers feed a per-node "grid H2" bus that
        connects to the main H2 bus via a zero-cost link (colour accounting). With hydrogen_colors
        and a hydrogen network, nuclear buses additionally get "high-temp electrolysis" links into
        "pink H2" buses. The power-only chain lives in
        scripts/add_extra_components.py:attach_stores / attach_storageunits.
      not_covered: >
        No per-node or system-wide cap on electrolyser capacity (all links are freely extendable,
        no p_nom_max lever); no dedicated water consumption modelling (only an optional marginal
        water-cost adder via custom_data.water_costs -> add_custom_water_cost, applied to links
        with carrier "H2 Electrolysis" only); no stack degradation, part-load efficiency curves,
        or minimum load for electrolysers; no brownfield existing electrolyser fleet.
      provenance: "scripts/prepare_sector_network.py:add_hydrogen"
    levers:
      - key: sector.hydrogen.production_technologies
        effect: >
          Which H2 production Links are instantiated per node. Any subset of the names in the
          tech_params dict of add_hydrogen; electrolyser choices are "H2 Electrolysis",
          "Alkaline electrolyzer large/medium/small", "PEM electrolyzer", "SOEC".
        default: '["H2 Electrolysis", "SMR", "SMR CC"]'
        provenance: "config.default.yaml:production_technologies; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.hydrogen.hydrogen_colors
        effect: Routes each production technology through a colour-tagged intermediate bus (grid/green/grey/blue/pink H2) for origin accounting.
        default: "false"
        provenance: "config.default.yaml:hydrogen_colors; scripts/prepare_sector_network.py:add_hydrogen"
      - key: electricity.extendable_carriers.Store
        effect: Including "H2" adds the power-only Bus-Store-Link chain ("H2 electrolysis" + "H2 fuel cell" links) at every bus in the electricity-only workflow.
        default: "[battery, H2]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_stores"
      - key: electricity.extendable_carriers.StorageUnit
        effect: Including "H2" adds a single H2 StorageUnit per bus (electrolysis store efficiency, fuel-cell dispatch efficiency) instead of the three-variable Store-Link chain.
        default: "[] (commented suggestion: battery, H2)"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_extra_components.py:attach_storageunits"
      - key: electricity.max_hours.H2
        effect: Energy-to-power ratio of the H2 StorageUnit variant (hours at full dispatch).
        default: "168"
        provenance: "config.default.yaml:max_hours; scripts/add_extra_components.py:attach_storageunits"
      - key: policy_config.hydrogen.matching_technologies
        effect: Which electrolyser carriers count as matched production in the RES temporal-matching constraint (see green-hydrogen recipe).
        default: '["H2 Electrolysis", "Alkaline electrolyzer large", "Alkaline electrolyzer medium", "Alkaline electrolyzer small", "PEM electrolyzer", "SOEC"]'
        provenance: "config.default.yaml:matching_technologies; scripts/solve_network.py:hydrogen_temporal_constraint"
      - key: costs.year
        effect: Selects the technology-data cost vintage (costs_{year}.csv) from which electrolyser CAPEX/efficiency are read.
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; scripts/prepare_sector_network.py:add_hydrogen"
    boundary:
      - variant: "Have electrolysers as an investment option (sector run)"
        rung: L0
        note: Already on — "H2 Electrolysis" is in the default production_technologies list.
      - variant: "Model a specific electrolyser class (Alkaline size classes / PEM / SOEC)"
        rung: L1
        note: Add the exact names to sector.hydrogen.production_technologies; cost rows ship with technology-data.
      - variant: "Electrolysis + H2 storage in an electricity-only run"
        rung: L0
        note: Default — "H2" is in electricity.extendable_carriers.Store, handled by attach_stores.
      - variant: "Custom electrolyser CAPEX/efficiency assumptions"
        rung: L3
        note: Override rows in the costs csv (resources/costs_{year}_sec.csv from retrieve_cost_data, or set enable.retrieve_cost_data false and edit data/costs.csv); no per-tech config override key exists in the sector chain.
      - variant: "Cap or force electrolyser capacity per node/country"
        rung: L2
        note: No config key; set p_nom_max/p_nom_min in the link_kwargs built inside add_hydrogen (small localised edit), or add a custom constraint (L5) in solve_network extra_functionality.
      - variant: "Add a new production technology not in the tech_params dict"
        rung: L2
        note: Add an entry to the tech_params dict in add_hydrogen (buses, efficiencies, cost row name); needs a matching costs row (L3 if absent from technology-data).
      - variant: "Existing/brownfield electrolyser fleet"
        rung: L5
        note: No existing-capacity path for electrolysers; would need bespoke additions (add_existing_baseyear handles other techs).
    where:
      - change: "Capacity bounds or new technology entries for H2 production links"
        anchor: "scripts/prepare_sector_network.py:add_hydrogen (tech_params dict / link_kwargs)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "Power-only electrolysis/fuel-cell chain"
        anchor: "scripts/add_extra_components.py:attach_stores"
        provenance: "scripts/add_extra_components.py:attach_stores"
      - change: "Cost assumptions"
        anchor: "Snakefile rule retrieve_cost_data -> resources costs csv; config costs.year / costs.technology_data_version"
        provenance: "Snakefile:retrieve_cost_data"
      - change: "Custom system-level electrolyser constraints"
        anchor: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "resources/<run>/costs_{planning_horizons}_sec.csv (technology-data, rows: electrolysis, Alkaline electrolyzer large/medium/small size, PEM electrolyzer small size, SOEC, fuel cell)"
        required_for: "all electrolyser variants"
        availability: "must be built — retrieved automatically by retrieve_cost_data (costs.technology_data_version, default v0.13.2); rows confirmed present in a built costs file"
      - input: "data/custom/water_costs.csv style input via custom_data.water_costs"
        required_for: "water-cost adder on H2 Electrolysis marginal cost"
        availability: "absent by default (custom_data.water_costs: false)"
