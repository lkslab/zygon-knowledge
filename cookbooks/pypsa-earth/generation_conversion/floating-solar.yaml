id: floating-solar
title: Floating solar
summary: Photovoltaic arrays floated on water bodies (reservoirs, lakes, near-shore sea), often colocated with hydropower dams.

when_to_use:
  - add floating solar / floatovoltaics
  - solar panels on reservoirs or lakes
  - FPV
  - solar on hydropower dams
  - offshore / marine solar
  - land is scarce, put solar on water

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        NOT covered. There is no floating-solar carrier, config block, or cost wiring anywhere
        ('floating' occurs nowhere in config.default.yaml or scripts/), and the default solar
        eligibility mask points the other way: renewable.solar.copernicus.grid_codes
        [20, 30, 40, 50, 60, 90, 100] are land classes — permanent water bodies (Copernicus
        class 80) and open sea (200) are excluded from solar siting.
      mechanism: >
        Absence mechanism: build_renewable_profiles restricts solar to onshore regions
        (regions_onshore.geojson in the build_renewable_profiles rule input for technology
        'solar') and to the configured land classes via the Copernicus ExclusionContainer. The
        atlite pv method itself is water-agnostic, so a water-sited PV profile CAN be produced by
        config alone (a new renewable.<tech> block with method pv and water grid codes) — what is
        genuinely missing is any floating-solar cost row read by the workflow and any
        reservoir/colocation logic.
      not_covered: >
        No costs row for floating PV is read anywhere in the workflow (unlike floating offshore
        wind, where technology-data ships offwind-float rows); no water-body inventory beyond the
        Copernicus raster classes; no colocation with hydro reservoirs (no link between hydro
        StorageUnits from attach_hydro and any solar siting); no evaporation/cooling effects.
      provenance: "scripts/build_renewable_profiles.py:grid_codes"

    levers:
      - key: renewable.solar.copernicus.grid_codes
        effect: "Crude proxy only: adding water classes (80 inland water, 200 sea) lets ordinary 'solar' be sited on water at land-PV cost — no distinct carrier."
        default: "[20, 30, 40, 50, 60, 90, 100]"
        provenance: "scripts/build_renewable_profiles.py:grid_codes"
      - key: electricity.renewable_carriers
        effect: "Where any new floating-solar carrier must be registered."
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro]"
        provenance: "config.default.yaml:renewable_carriers"

    boundary:
      - variant: "crude screening: allow PV on water surfaces at land-PV cost"
        rung: L1
        note: "add Copernicus water classes to renewable.solar.copernicus.grid_codes (or a copied renewable.<name> block restricted to [80]); costs and carrier remain plain 'solar'."
      - variant: "distinct 'floating solar' carrier with its own cost and potential"
        rung: L4
        note: "config gets the profile built (rule build_renewable_profiles is wildcarded over config['renewable'], atlite pv method works over water), and add_electricity auto-wires the profile input — but NO floating-PV costs row exists in the retrieved technology-data csv or the workflow's cost lookups, and a name like 'solar-floating' would need attach_wind_and_solar's costs.at[carrier, ...] lookup satisfied: requires adding a costs row (custom costs csv or technology-data fork) and, for inland-reservoir-only siting, a dedicated water-body eligibility input beyond raster class 80. Data + wiring across retrieve_cost_data makes this L4 rather than L3."
      - variant: "colocation with hydro reservoirs (shared connection, capped by reservoir area)"
        rung: L5
        note: "no link between hydro plant locations (attach_hydro) and solar siting; bespoke logic."
      - variant: "wave/temperature performance effects of water siting"
        rung: L5
        note: "not representable in the atlite pv pipeline as configured."

    where:
      - change: "water-surface eligibility for a PV profile"
        anchor: "renewable.<tech>.copernicus.grid_codes + rule build_renewable_profiles -> scripts/build_renewable_profiles.py (ExclusionContainer block)"
        provenance: "scripts/build_renewable_profiles.py:ExclusionContainer"
      - change: "carrier attachment and per-carrier cost lookup"
        anchor: "attach_wind_and_solar in scripts/add_electricity.py"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar"
      - change: "supplying a floating-PV costs row"
        anchor: "rule retrieve_cost_data output resources/costs_<year>.csv (or enable.retrieve_cost_data: false with a custom data/costs.csv)"
        provenance: "Snakefile:rule retrieve_cost_data"

    data_dependencies:
      - input: "Copernicus land cover raster (water classes 80/200)"
        required_for: "any water-surface eligibility proxy"
        availability: "retrieved by databundle; global"
      - input: "floating-PV cost row (capex/FOM/lifetime)"
        required_for: "distinct floating-solar carrier"
        availability: "absent — not in the retrieved technology-data costs file; must be added by the user"
      - input: "reservoir/water-body polygon inventory"
        required_for: "reservoir-restricted or hydro-colocated siting"
        availability: "absent from the workflow"
      - input: "ERA5 cutout"
        required_for: "PV profile over water cells"
        availability: "exists by default"
