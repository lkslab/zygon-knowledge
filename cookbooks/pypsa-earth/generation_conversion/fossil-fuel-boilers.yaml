id: fossil-fuel-boilers
title: Fossil-fuel boilers for heating (gas and oil boilers)
summary: >
  Gas- and oil-fired boilers supplying building space and water heating — the
  incumbent fossil heating technologies that heat pumps, resistive heaters and
  solar thermal compete against in sector-coupled runs.

when_to_use:
  - "gas heating"
  - "gas boiler"
  - "oil boiler"
  - "fossil heating baseline"
  - "keep existing gas heating in the model"
  - "phase out gas boilers"
  - "ban fossil boilers for new buildings"
  - "condensing boiler / conventional boiler"
  - "heating fuel switch away from oil and gas"
  - "hydrogen-ready boiler / H2 boiler"
  - "what do heat pumps compete against for heating"
  - "known in pypsa-eur as: gas boiler, gas boilers, gas boiler marginal, residential rural gas boiler, residential urban decentral gas boiler, services rural gas boiler, services urban decentral gas boiler, urban central gas boiler, oil boiler, residential rural oil boiler, services rural oil boiler, residential urban decentral oil boiler, urban central oil boiler, services urban decentral oil boiler, retrofitted H2 boiler"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        GAS boilers are added by default (sector.boilers true, sector.enable.heat
        true) as extendable Links on the heat bus of ALL five heat systems
        ("residential rural", "services rural", "residential urban decentral",
        "services urban decentral", "urban central"): in add_heat, Link
        "{node} {name} gas boiler" with bus0 = spatial.gas.nodes (nodal "<node> gas"
        buses since sector.gas.spatial_gas is true), bus1 = the heat bus, bus2 =
        "co2 atmosphere" (efficiency2 = gas CO2 intensity), costed from the
        "decentral gas boiler" / "central gas boiler" rows of the sector costs file
        (costs_<year>_sec.csv). They compete endogenously against heat pumps,
        resistive heaters, water-tank TES, solar thermal, and (urban central) gas
        CHP for the heat-bus load. Gas fuel comes from the extendable Store +
        Generator at fuel cost that add_carrier_buses places on each gas bus (plus
        biogas upgrading from add_biomass). Beware a second, EXOGENOUS
        representation of incumbent fossil heating: prepare_energy_totals splits
        residential gas/oil into a "residential heat gas" / "residential heat oil"
        portion using data/demand/fuel_shares.csv, and add_residential SUBTRACTS
        those from the heat-bus load, re-adding them as fixed fuel Loads directly
        on the gas/oil buses (carriers "residential gas"/"residential oil", with a
        matching negative co2-atmosphere load for their emissions); add_services
        does the same for "services gas"/"services oil" (no heat split). So the
        incumbent fossil-heated demand share is fixed fuel burn, and the optimised
        gas boilers only compete for the remaining heat-bus demand.
      mechanism: >
        rule prepare_heat_data (heat demand, COPs, district heat share) -> rule
        prepare_sector_network / scripts/prepare_sector_network.py: add_heat builds
        heat buses and loads via create_nodes_for_heat_sector, then madds the
        "{name_type} gas boiler" Link per heat system under options["boilers"];
        add_carrier_buses (called from convert_conventional_generators_to_links)
        supplies the gas/oil buses; add_residential / add_services attach the
        exogenous fossil-heating fuel loads scaled from energy_totals built by rule
        prepare_energy_totals (data/demand/fuel_shares.csv). Costs from rule
        retrieve_cost_data (technology-data, processed by
        process_cost_data.py load_costs for the power workflow).
      not_covered: >
        No greenfield OIL boilers: config.default.yaml has sector.oil_boilers
        (default false) but the key is read by NO script — a dead key — and
        add_heat contains no oil boiler block. Oil boiler Links exist only in the
        brownfield path (add_heating_capacities_installed_before_baseyear in
        add_existing_baseyear.py, which also vintages gas boilers and assimilates
        coal boilers into oil boilers via build_existing_heating_distribution),
        but that call is COMMENTED OUT in add_existing_baseyear main
        ("TODO: not implemented in -sec yet") and the rule only exists under
        foresight myopic — so no existing gas/oil boiler stock is actually added
        in any run today. No hydrogen boilers or H2-ready/retrofitted boilers
        anywhere (no component, and no H2 boiler row in the retrieved sector
        costs file). No endogenous fuel-switching of the incumbent fossil-heated
        demand: the exogenous shift keys move it to ELECTRICITY demand (not the
        heat bus) via fuel_shares "to elec heat share" columns. No boiler stock
        turnover, no per-country boiler bans.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:add_residential"

    levers:
      - key: sector.boilers
        effect: >
          Gates the greenfield gas boiler Links on all heat buses — but also the
          resistive heaters (one flag for both blocks); false removes fossil AND
          electric boilers together.
        default: "true"
        provenance: "config.default.yaml:boilers; scripts/prepare_sector_network.py:gas boiler"
      - key: sector.oil_boilers
        effect: >
          DEAD KEY — present in config.default.yaml (pypsa-eur heritage) but read
          by no script; flipping it does nothing. Greenfield oil boilers require a
          code edit (see boundary).
        default: "false"
        provenance: "config.default.yaml:oil_boilers"
      - key: sector.enable.heat
        effect: "Master switch for add_heat — disables all heating technologies including gas boilers."
        default: "true"
        provenance: "config.default.yaml:enable; Snakefile:HEAT"
      - key: sector.chp
        effect: "Adds the urban central gas CHP (+ CC variant) — the other fossil heat supplier on the district-heating bus."
        default: "true"
        provenance: "config.default.yaml:chp; scripts/prepare_sector_network.py:urban central gas CHP"
      - key: sector.micro_chp
        effect: "With sector.chp true, adds decentral 'micro gas CHP' Links on the non-central heat systems — a second decentral gas heating option."
        default: "false"
        provenance: "config.default.yaml:micro_chp; scripts/prepare_sector_network.py:micro gas CHP"
      - key: sector.efficiency_heat_gas_to_elec
        effect: >
          Conversion efficiency applied when the fuel_shares.csv "gas to elec heat
          share" moves incumbent gas-heated demand into electricity demand in
          prepare_energy_totals — shrinks the exogenous "residential heat gas"
          fuel load.
        default: "0.9"
        provenance: "config.default.yaml:efficiency_heat_gas_to_elec; scripts/prepare_energy_totals.py:efficiency_heat_gas_to_elec"
      - key: sector.efficiency_heat_oil_to_elec
        effect: "Same as above for the oil-heated share ('oil to elec heat share')."
        default: "0.9"
        provenance: "config.default.yaml:efficiency_heat_oil_to_elec; scripts/prepare_energy_totals.py:efficiency_heat_oil_to_elec"
      - key: sector.district_heating.potential
        effect: >
          Max fraction of urban heat demand on the "urban central" bus (with
          district_heating.progress) — shifts demand between the central gas
          boiler / gas CHP catchment and the decentral gas boilers.
        default: "0.3"
        provenance: "config.default.yaml:district_heating; scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - key: fossil_reserves
        effect: "Initial energy (TWh) in the fossil fuel Stores on the carrier buses boilers draw from (only 'oil: 100' set by default; gas store starts empty and cyclic)."
        default: "oil: 100"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: sector.gas.spatial_gas
        effect: "Nodal '<node> gas' buses (true, flagged ALWAYS TRUE) vs a single 'Earth gas' bus feeding all gas boilers."
        default: "true"
        provenance: "config.default.yaml:spatial_gas; scripts/prepare_sector_network.py:define_spatial"
      - key: costs.year
        effect: "Selects the technology-data cost year for the 'decentral/central gas boiler' rows (costs_<year>_sec.csv)."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; Snakefile:retrieve_cost_data"

    boundary:
      - variant: "fossil (gas) boilers as the heating incumbent heat pumps compete against"
        rung: L0
        note: >
          default: sector.boilers gas boiler Links on every heat bus, plus the
          exogenous residential/services fossil fuel loads.
      - variant: "remove ALL boilers (gas + resistive) from new build"
        rung: L0
        note: "sector.boilers: false — removes both technology blocks together."
      - variant: "ban fossil boilers only, keep electric options (new-build gas boiler ban)"
        rung: L2
        note: >
          no separate switch — the resistive heater and gas boiler madd blocks sit
          under the same options["boilers"] flag in add_heat; delete/gate the gas
          boiler block (small localised edit).
      - variant: "shift part of the incumbent gas/oil-heated demand to electricity (exogenous electrification)"
        rung: L1
        note: >
          sector.efficiency_heat_gas_to_elec / efficiency_heat_oil_to_elec set the
          conversion efficiency; the SHARE shifted comes from the "gas to elec heat
          share" / "oil to elec heat share" columns of data/demand/fuel_shares.csv
          (per-country edits are L3).
      - variant: "change per-country fossil heating shares (how much residential gas/oil is heating)"
        rung: L3
        note: >
          edit data/demand/fuel_shares.csv (columns "gas residential heat share",
          "oil residential heat share", "space to water heat share"; DEFAULT row
          used for unlisted countries) read by rule prepare_energy_totals.
      - variant: "add decentral gas micro-CHP alongside boilers"
        rung: L1
        note: "sector.chp: true (default) + sector.micro_chp: true."
      - variant: "greenfield OIL boilers as an optimisable heating option"
        rung: L2
        note: >
          sector.oil_boilers is a dead key; mirror the gas boiler madd block in
          add_heat with bus0 = spatial.oil.nodes, efficiency2 = oil CO2 intensity —
          the "decentral oil boiler" costs row already exists in the retrieved
          sector costs file (and is used in add_existing_baseyear.py).
      - variant: "represent today's installed gas/oil boiler stock (brownfield vintages)"
        rung: L3
        note: >
          machinery exists but is disabled: rule build_existing_heating_distribution
          + add_heating_capacities_installed_before_baseyear (vintaged gas boiler,
          oil boiler, heat pump, resistive heater Links) — the call is commented out
          in add_existing_baseyear main and the rule requires foresight: myopic
          (L2 to re-enable); the input data/existing_infrastructure/
          existing_heating_raw.csv is from a European mapping study, so
          non-European regions additionally need new data (L3).
      - variant: "make the incumbent fossil-heated demand endogenously switchable to heat pumps"
        rung: L2
        note: >
          add_residential subtracts "residential heat gas"/"residential heat oil"
          from the heat-bus loads and fixes them as fuel Loads; stop the
          subtraction/re-addition there (and zero the matching emissions loads) so
          that demand sits on the heat buses where boilers and heat pumps compete.
      - variant: "hydrogen / H2-ready boilers"
        rung: L3
        note: >
          honest hole: no H2 boiler component exists and no H2 boiler row is in
          the retrieved sector costs file — needs a new Link block in add_heat from
          the H2 buses (code, L2) PLUS an authored costs row (data, L3). (proxy:
          none faithful; gas boiler + decarbonised gas supply is the closest
          existing fossil-boiler analogue.)
      - variant: "change gas/oil boiler cost or efficiency assumptions"
        rung: L1
        note: >
          costs.year selects the technology-data vintage of the "decentral/central
          gas boiler" rows; editing individual rows means touching the retrieved
          costs csv or technology-data source (L3).
      - variant: "boiler stock turnover / per-country new-build boiler ban years"
        rung: L5
        note: "no vintage/turnover or regulation machinery for heating exists; bespoke Python."

    where:
      - change: "gas boiler Link definitions (and any new oil/H2 boiler block)"
        anchor: "scripts/prepare_sector_network.py::add_heat — madd block under options['boilers'] using key '{name_type} gas boiler'"
        provenance: "scripts/prepare_sector_network.py:gas boiler"
      - change: "heat-system split the boilers are offered on (rural/urban decentral/central)"
        anchor: "scripts/prepare_sector_network.py::create_nodes_for_heat_sector (district_heating potential/progress)"
        provenance: "scripts/prepare_sector_network.py:create_nodes_for_heat_sector"
      - change: "fuel supply to the boiler (gas/oil Store + Generator at fuel cost)"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses (fossil_reserves param)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "exogenous incumbent fossil-heating fuel loads and heat-bus subtraction"
        anchor: "scripts/prepare_sector_network.py::add_residential / ::add_services; upstream split in scripts/prepare_energy_totals.py (fuel_shares)"
        provenance: "scripts/prepare_sector_network.py:add_residential; scripts/prepare_energy_totals.py:fuel_shares"
      - change: "brownfield gas/oil boiler vintages (currently disabled)"
        anchor: "scripts/add_existing_baseyear.py::add_heating_capacities_installed_before_baseyear; rule build_existing_heating_distribution; rule add_existing_baseyear (foresight myopic only)"
        provenance: "scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear; Snakefile:build_existing_heating_distribution"
      - change: "coal-to-oil boiler assimilation in the existing-stock data"
        anchor: "scripts/build_existing_heating_distribution.py (existing_heating['oil boiler'] += coal boiler)"
        provenance: "scripts/build_existing_heating_distribution.py:oil boiler"
      - change: "boiler cost rows"
        anchor: "rule retrieve_cost_data -> resources/<run>/costs_<year>_sec.csv rows 'decentral gas boiler', 'central gas boiler', 'decentral oil boiler'"
        provenance: "Snakefile:retrieve_cost_data; scripts/add_existing_baseyear.py:decentral oil boiler"

    data_dependencies:
      - input: "technology-data sector costs file costs_<year>_sec.csv (rows decentral/central gas boiler, decentral oil boiler, gas + oil CO2 intensity and fuel price)"
        required_for: "boiler capex, efficiency, emissions and fuel cost"
        availability: "must be built (rule retrieve_cost_data; costs.technology_data_version)"
      - input: "data/demand/fuel_shares.csv"
        required_for: "splitting residential gas/oil into heating vs other use and any exogenous elec-shift"
        availability: "exists by default; DEFAULT row applies to countries without their own row — region-dependent accuracy"
      - input: "UNSD energy balances -> energy_totals (residential/services gas and oil totals)"
        required_for: "sizing the exogenous fossil heating fuel loads and the heat-bus demand remainder"
        availability: "must be built (rules build_base_energy_totals / prepare_energy_totals); region-dependent"
      - input: "heat demand + district heat share resources from rule prepare_heat_data"
        required_for: "the heat-bus loads the boilers compete for (demand side lives in the demand book, e.g. residential space heating demand)"
        availability: "must be built (needs ERA5 cutout + population layouts)"
      - input: "data/existing_infrastructure/existing_heating_raw.csv"
        required_for: "brownfield gas/oil boiler stock (disabled path)"
        availability: "exists by default but European-source; non-European regions need new data"
