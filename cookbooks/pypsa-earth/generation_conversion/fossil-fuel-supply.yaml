id: fossil-fuel-supply
title: Fossil fuel supply chains (oil, natural gas, coal)
summary: >
  Primary supply of fossil fuels — natural gas, oil and coal/lignite — including
  where they come from (domestic production vs imports), fuel prices, reserves,
  and downstream processing such as refining.
when_to_use:
  - "where does gas come from in the model"
  - "natural gas supply / gas imports / LNG"
  - "domestic gas or oil production"
  - "fuel imports / fuel import price"
  - "oil price assumption / gas price assumption / coal price"
  - "fossil fuel reserves"
  - "refinery / oil refining / oil products (naphtha, kerosene, diesel)"
  - "gas pipeline network for methane"
  - "coal supply for power plants and industry"
  - "limit or phase out fossil fuel extraction"
  - "known in pypsa-eur as: gas, fossil gas, natural gas, methane, oil primary, oil refining, imported oil"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Power-only workflow: fossil fuel supply is entirely implicit. Fuel prices
        come from the technology-data costs file ('fuel' attribute of the gas/oil/
        coal/lignite rows) and are folded into each generator's marginal cost as
        VOM + fuel/efficiency in process_cost_data.py::load_costs (OCGT/CCGT
        inherit the 'gas' fuel price); there are no fuel buses, no supply limits
        and no fuel infrastructure. Sector-coupled workflow
        (prepare_sector_network): convert_conventional_generators_to_links
        replaces fossil power generators (OCGT, CCGT, oil, coal, lignite per
        sector.conventional_generation) with Links drawing from explicit per-node
        fuel buses. Each fuel bus is created by add_carrier_buses with (a) an
        extendable cyclic Store (seeded with a free initial stock if the carrier
        appears in fossil_reserves, default oil: 100 TWh) and (b) a
        p_nom_extendable Generator with marginal_cost = costs.at[carrier,
        "fuel"] — i.e. unlimited primary fossil supply at the world-market fuel
        price, available identically at every node. The oil bus is also created
        as a fallback in add_shipping / add_land_transport with the same
        unlimited-generator pattern. Fossil demands drawing on these buses: gas —
        gas for industry, residential and services gas, gas boilers, gas CHPs,
        SMR and other reforming routes (add_hydrogen); oil — naphtha for
        industry, kerosene for aviation, shipping oil, land transport ICE,
        residential, services, agriculture and rail oil; coal — converted coal
        power plants and coal-gasification H2 only. Gas can additionally be
        supplied by upgraded biogas (add_biomass, potential set by
        sector.biogas_potential) and by Sabatier methanation of H2
        (h2_hc_conversions). A real gas pipeline dataset (GEM GGIT, rule
        prepare_gas_network) is retrieved and clustered to the network regions —
        but it is only used to route repurposed H2 pipelines in add_hydrogen,
        not to transport methane.
      mechanism: >
        Rule prepare_sector_network runs scripts/prepare_sector_network.py:
        define_spatial builds per-carrier node lists (nodal buses when
        sector.<carrier>.spatial_<carrier> is true, otherwise one global "Earth
        <carrier>" bus); convert_conventional_generators_to_links calls
        add_carrier_buses per fuel carrier; demand functions attach Loads to the
        fuel buses. Fuel prices come from resources/costs_<year>_sec.csv built by
        rule process_cost_data (prepare_costs) from the retrieved technology-data
        file (rule retrieve_cost_data). Rule prepare_gas_network clusters the
        GGIT pipeline data into
        resources/gas_networks/gas_network_elec_s{simpl}_{clusters}.csv, consumed
        as the "pipelines" input for H2 pipeline routing/repurposing.
      not_covered: >
        No fossil-fuel field or extraction-site locations (a deliberate
        simplification — supply is a uniform extendable generator at every fuel
        bus); no distinction between domestic production and imports; no LNG
        terminals, import/export entry points or cross-border fuel trade; no
        methane transport network between nodes (sector.gas.network is commented
        "ALWAYS FALSE for now (NOT USED)" and no code adds gas pipeline Links —
        the GGIT network only shapes repurposed H2 pipelines); one world price
        per fuel, no regional price differentiation or fuel transport cost; no
        refinery step — a single "oil" carrier serves naphtha, kerosene, diesel
        and fuel oil demands undifferentiated; fossil_reserves only seeds a free
        initial Store stock, it does not cap cumulative extraction; industrial
        final coal demand is accounted only as a CO2 emissions load and is not
        drawn from the coal bus.
      provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:convert_conventional_generators_to_links; scripts/process_cost_data.py:load_costs"
    levers:
      - key: sector.conventional_generation
        effect: >
          Maps power technologies to fuel carriers (OCGT/CCGT -> gas, oil ->
          oil, coal -> coal, lignite -> lignite); determines which fossil fuel
          buses are created and which generators become fuel-consuming Links in
          sector runs. Removing an entry keeps that technology as a plain
          generator with implicit fuel.
        default: "{OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass}"
        provenance: "config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - key: fossil_reserves
        effect: >
          Carrier -> TWh mapping; seeds the fuel bus Store with a free initial
          energy stock (e_initial, non-cyclic) in add_carrier_buses. Not a hard
          cap — the extendable fuel generator still supplies unlimited fuel at
          the fuel price.
        default: "oil: 100 (TWh)"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses; Snakefile:fossil_reserves"
      - key: sector.gas.spatial_gas
        effect: >
          true -> one gas bus per node ("<node> gas"); false -> a single global
          "Earth gas" bus (config comment says ALWAYS TRUE; industry gas demand
          aggregation follows this flag).
        default: "true"
        provenance: "config.default.yaml:spatial_gas; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.oil.spatial_oil
        effect: "Same nodal-vs-global switch for the oil bus."
        default: "true"
        provenance: "config.default.yaml:spatial_oil; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.coal.spatial_coal
        effect: "Same nodal-vs-global switch for the coal bus."
        default: "true"
        provenance: "config.default.yaml:spatial_coal; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.lignite.spatial_lignite
        effect: "Same nodal-vs-global switch for the lignite bus."
        default: "false (single Earth lignite bus)"
        provenance: "config.default.yaml:spatial_lignite; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.coal.shift_to_elec
        effect: >
          true shifts residential and services final coal demand to electricity
          when building energy totals; false discards that coal demand (it is
          never served from the coal bus either way).
        default: "true"
        provenance: "config.default.yaml:shift_to_elec; Snakefile:shift_coal_to_elec; scripts/build_base_energy_totals.py:shift_coal_to_elec"
      - key: electricity.conventional_carriers
        effect: >
          Power-only workflow: which existing fossil fleets (oil, OCGT, CCGT,
          coal, lignite) are attached from powerplantmatching with implicit fuel
          in their marginal cost.
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Adding fossil techs (OCGT is in by default) allows new fossil power
          capacity at buses that already host that carrier; fuel remains
          implicit in marginal cost.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: costs.year
        effect: >
          Selects the technology-data cost file (costs_<year>.csv) from which
          the gas/oil/coal/lignite 'fuel' prices are taken.
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; scripts/process_cost_data.py:load_costs"
      - key: sector.hydrogen.production_technologies
        effect: >
          Which fossil-fuel-to-H2 conversion routes exist (SMR, SMR CC, Natural
          gas steam reforming, Coal gasification, Heavy oil partial oxidation
          ...) drawing on the gas/coal/oil buses; remove them to forbid
          fossil-based hydrogen.
        default: "[H2 Electrolysis, SMR, SMR CC]"
        provenance: "config.default.yaml:production_technologies; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.methanation
        effect: "Enables Sabatier links producing synthetic methane into the gas buses from H2 (a non-fossil gas supply route)."
        default: "true"
        provenance: "config.default.yaml:methanation; scripts/prepare_sector_network.py:h2_hc_conversions"
      - key: sector.biogas_potential
        effect: "TWh/a of biogas (split equally across nodes) that can be upgraded into the gas buses — the other non-fossil gas supply route."
        default: "0.5"
        provenance: "config.default.yaml:biogas_potential; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.gas.network_data
        effect: >
          Which real gas pipeline dataset prepare_gas_network retrieves and
          clusters (GGIT global or IGGIELGN European) — note this only feeds H2
          pipeline routing/repurposing, not methane transport.
        default: "GGIT"
        provenance: "config.default.yaml:network_data; scripts/prepare_gas_network.py:download_GGIT_gas_network"
      - key: custom_data.gas_network
        effect: >
          true bypasses prepare_gas_network and reads a user-supplied
          data/custom/pipelines.csv as the (H2-routing) pipeline network.
        default: "false"
        provenance: "config.default.yaml:gas_network; Snakefile:prepare_gas_network"
    boundary:
      - variant: "change gas / oil / coal price assumptions"
        rung: L1
        note: >
          load_costs (elec) and prepare_costs (sec) both read per-attribute
          overwrites from the costs config — add a costs.fuel block, e.g.
          costs.fuel: {gas: 10.1} (the block is present but commented out in
          config.default.yaml); alternatively costs.year selects a different
          technology-data vintage
      - variant: "remove fossil generation from the power mix"
        rung: L1
        note: >
          drop oil/OCGT/CCGT/coal/lignite from electricity.conventional_carriers
          (power-only) or from sector.conventional_generation (sector runs)
      - variant: "forbid fossil-based hydrogen (SMR etc.)"
        rung: L1
        note: "remove SMR / SMR CC and other fossil routes from sector.hydrogen.production_technologies"
      - variant: "single global fuel bus instead of per-node fuel buses"
        rung: L0
        note: >
          set sector.<carrier>.spatial_<carrier> false (lignite already default
          false; the spatial_gas comment says ALWAYS TRUE — industry gas demand
          handling supports both branches)
      - variant: "cap national fossil fuel extraction / finite reserves"
        rung: L2
        note: >
          no cap exists: fossil_reserves only seeds a free Store stock while the
          fuel Generator in add_carrier_buses stays unlimited; a small localised
          edit is needed (e.g. set p_nom_max or an e_sum_max-style limit on the
          fuel generators, or make the Store the only source)
      - variant: "country- or node-specific fuel prices (import vs domestic price spreads)"
        rung: L2
        note: >
          marginal_cost is the single costs.at[carrier, "fuel"] value for all
          nodes; edit add_carrier_buses (and the oil fallback in add_shipping /
          add_land_transport) to pass a per-node price vector
      - variant: "methane transport through the real gas pipeline network"
        rung: L2
        note: >
          the clustered GGIT network (rule prepare_gas_network ->
          gas_network_elec_s{simpl}_{clusters}.csv) is already an input of rule
          prepare_sector_network, but is only used to route repurposed H2
          pipelines; add a function madd-ing gas Links between nodal gas buses
          from that CSV (sector.gas.network is a dead flag marked NOT USED)
      - variant: "use a custom gas pipeline dataset"
        rung: L3
        note: "custom_data.gas_network: true plus authoring data/custom/pipelines.csv (affects H2 routing today)"
      - variant: "LNG import terminals or explicit fuel import/export entry points"
        rung: L5
        note: >
          no import infrastructure concept exists — every node already has its
          own unlimited fuel generator; bespoke buses/links/stores and siting
          data would be needed
      - variant: "locate fossil-fuel fields / production sites"
        rung: L5
        note: >
          deliberately not modelled — supply is uniform at every fuel bus; would
          need new siting data and bespoke component logic to concentrate supply
          at field locations
      - variant: "oil refining step / differentiated oil products (naphtha, kerosene, diesel)"
        rung: L5
        note: >
          a single "oil" carrier serves naphtha for industry, kerosene for
          aviation, shipping oil, land transport and heating oil; splitting into
          products with a refinery conversion needs new buses/links throughout
          the demand functions
      - variant: "make industrial coal demand consume from the coal bus"
        rung: L2
        note: >
          add_industry only books industry coal emissions on the co2 atmosphere
          bus (spatial.coal.industry nodes are defined but unused); localised
          edit to add a coal Load plus Link like the gas-for-industry pattern
    where:
      - change: "fossil fuel bus + unlimited supply generator + reserve store (sector)"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses (called from convert_conventional_generators_to_links per sector.conventional_generation entry)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "oil bus fallback creation with unlimited oil generator"
        anchor: "scripts/prepare_sector_network.py::add_shipping (also add_land_transport); guarded by 'oil' not in n.buses.carrier.unique()"
        provenance: "scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:add_land_transport"
      - change: "nodal vs global fuel bus topology"
        anchor: "scripts/prepare_sector_network.py::define_spatial (sector.<carrier>.spatial_<carrier> flags)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "fuel price assumptions (elec + sector cost files)"
        anchor: "scripts/process_cost_data.py::load_costs (elec scope) and ::prepare_costs (sec scope); rules retrieve_cost_data + process_cost_data"
        provenance: "scripts/process_cost_data.py:load_costs; scripts/process_cost_data.py:prepare_costs; Snakefile:retrieve_cost_data"
      - change: "real gas pipeline data retrieval and clustering"
        anchor: "Snakefile rule prepare_gas_network -> scripts/prepare_gas_network.py::cluster_gas_network"
        provenance: "Snakefile:prepare_gas_network; scripts/prepare_gas_network.py:cluster_gas_network"
      - change: "where the clustered gas network is consumed (H2 repurposing only)"
        anchor: "scripts/prepare_sector_network.py::add_hydrogen -> add_links_repurposed_H2_pipelines (sector.hydrogen.gas_network_repurposing)"
        provenance: "scripts/prepare_sector_network.py:add_links_repurposed_H2_pipelines; config.default.yaml:gas_network_repurposing"
      - change: "industrial coal demand accounting"
        anchor: "scripts/prepare_sector_network.py::add_industry (industry coal emissions load)"
        provenance: "scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:industry coal emissions"
      - change: "fossil final-energy demand construction (which loads sit on the fuel buses)"
        anchor: "scripts/prepare_sector_network.py::add_industry / add_aviation / add_shipping / add_land_transport / add_residential / add_services / add_agriculture / add_rail_transport"
        provenance: "scripts/prepare_sector_network.py:add_aviation; scripts/prepare_sector_network.py:add_rail_transport"
    data_dependencies:
      - input: "technology-data costs file rows gas/oil/coal/lignite with 'fuel' attribute (resources/costs_<year>.csv -> costs_<year>_sec.csv)"
        required_for: "fuel prices in both workflows"
        availability: "exists by default via rules retrieve_cost_data + process_cost_data"
      - input: "GEM GGIT global gas pipeline dataset (downloaded by prepare_gas_network)"
        required_for: "gas-route-based H2 pipeline repurposing; any future methane network"
        availability: "exists by default (downloaded); global coverage, filtered by sector.gas.network_data_GGIT_status"
      - input: "data/custom/pipelines.csv"
        required_for: "custom pipeline network (custom_data.gas_network: true)"
        availability: "absent — user-authored"
      - input: "UN energy balances (build_base_energy_totals) for residential/services/transport/industry gas-oil-coal final demand"
        required_for: "the fossil demand loads placed on the fuel buses"
        availability: "region-dependent — downloaded when demand_data.update_data is true; quality varies by country"
      - input: "powerplantmatching fleet (OCGT/CCGT/oil/coal/lignite plants)"
        required_for: "existing fossil power capacity that becomes fuel-consuming links in sector runs"
        availability: "region-dependent — verify the fleet appears in resources/<run>/powerplants.csv"
