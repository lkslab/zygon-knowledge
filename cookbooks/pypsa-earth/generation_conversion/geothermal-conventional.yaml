id: geothermal-conventional
title: Geothermal (conventional)
summary: >
  Conventional (hydrothermal) geothermal power stations as dispatchable
  generators based on the existing plant fleet.
when_to_use:
  - "add geothermal power"
  - "model existing geothermal plants"
  - "geothermal electricity in the mix"
  - "expand geothermal capacity"
  - "remove geothermal"
  - "volcanic / hydrothermal power stations"
  - "geothermal baseload"
  - "known in pypsa-eur as: geothermal, geothermal heat, geothermal district heat, geothermal heat direct utilisation, geothermal organic rankine cycle"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        The existing geothermal fleet is modelled by default: "geothermal" is in
        electricity.conventional_carriers, plants come from the powerplantmatching
        database (rule build_powerplants; Geothermal fueltype, fuel_to_lifetime 15
        years in configs/powerplantmatching_config.yaml), and
        attach_conventional_generators adds them as non-extendable, fully
        dispatchable Generators (p_max_pu defaults to 1) aggregated by
        (bus, carrier, grouping_year), with costs/efficiency/lifetime from the
        "geothermal" row of the retrieved technology-data costs file.
      mechanism: >
        Snakefile rule build_powerplants -> resources/<run>/powerplants.csv (carrier
        names mapped to lower case pypsa names in
        scripts/add_electricity.py::load_powerplants); rule add_electricity calls
        attach_conventional_generators, which also creates extendable geothermal
        generators if the carrier is listed in
        electricity.extendable_carriers.Generator — but only at buses that already
        host geothermal plants.
      not_covered: >
        No resource assessment: there is no geothermal potential map, no
        time-varying availability, and no new-site (greenfield) siting logic —
        coverage is strictly the plants known to powerplantmatching (or supplied via
        custom_powerplants). Geothermal heat supply in the sector-coupled workflow
        is not modelled either (the "central geothermal heat source" costs row is
        not consumed by prepare_sector_network.py).
      provenance: "scripts/add_electricity.py:attach_conventional_generators"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing geothermal fleet."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Add "geothermal" to allow expansion — candidates only at buses with
          existing geothermal plants.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "Pandas query on DateIn/DateOut columns; controls which fleet vintages enter the model."
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' injects rows from data/custom_powerplants.csv (Fueltype Geothermal) for plants or candidate sites missing from powerplantmatching."
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: >
          Country-wise min/max capacity limits per carrier via
          data/agg_p_nom_minmax.csv, enforced by add_CCL_constraints when "CCL" is
          in the opts wildcard (the config comment names geothermal explicitly).
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "config.default.yaml:agg_p_nom_limits"
      - key: costs.year
        effect: "Cost year for the technology-data file supplying the 'geothermal' row."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version"
    boundary:
      - variant: "run without geothermal"
        rung: L0
        note: "remove 'geothermal' from electricity.conventional_carriers"
      - variant: "expand geothermal at existing sites"
        rung: L1
        note: "add 'geothermal' to electricity.extendable_carriers.Generator"
      - variant: "cap/force geothermal capacity per country"
        rung: L1
        note: "electricity.agg_p_nom_limits + 'CCL' in scenario.opts; author rows in data/agg_p_nom_minmax.csv"
      - variant: "add known plants or candidate sites missing from the database"
        rung: L3
        note: "rows in data/custom_powerplants.csv (Fueltype Geothermal) with electricity.custom_powerplants: merge"
      - variant: "override geothermal cost assumptions"
        rung: L1
        note: >
          per-attribute overwrites read by load_costs in process_cost_data.py
          (investment/FOM/VOM/fuel/efficiency/lifetime, marginal_cost/capital_cost);
          the investment block is present but commented out in config.default.yaml
      - variant: "greenfield geothermal at any bus"
        rung: L2
        note: >
          the extendable block of attach_conventional_generators derives
          carrier_buses from the existing fleet; small localised edit to offer the
          carrier at all buses (or seed sites via custom_powerplants, L3)
      - variant: "resource-constrained geothermal potentials (site/temperature maps)"
        rung: L5
        note: "no potential-map machinery exists for geothermal; needs bespoke data + rule + p_nom_max logic"
      - variant: "geothermal district heat in sector runs"
        rung: L5
        note: "not wired into prepare_sector_network.py; would need new component logic despite the costs row existing"
    where:
      - change: "fleet attachment + extendable geothermal"
        anchor: "scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "fleet construction / custom sites"
        anchor: "Snakefile rule build_powerplants; scripts/build_powerplants.py::add_custom_powerplants; configs/powerplantmatching_config.yaml (fuel_to_lifetime Geothermal)"
        provenance: "configs/powerplantmatching_config.yaml:fuel_to_lifetime"
      - change: "country capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "cost assumptions"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data"
        provenance: "scripts/process_cost_data.py:load_costs"
    data_dependencies:
      - input: "powerplantmatching database (Geothermal fueltype)"
        required_for: "existing fleet and expansion buses"
        availability: "region-dependent — strong for e.g. Kenya/Indonesia-type geothermal countries only insofar as the ppm sources cover them; verify resources/<run>/powerplants.csv"
      - input: "costs row 'geothermal' in retrieved technology-data"
        required_for: "capital/marginal cost, efficiency, lifetime"
        availability: "exists by default via rule retrieve_cost_data (costs.technology_data_version)"
      - input: "data/custom_powerplants.csv"
        required_for: "plants/candidate sites missing from powerplantmatching"
        availability: "template exists by default; rows user-authored"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps/floors (CCL)"
        availability: "template exists by default; rows must be authored"
