id: ground-source-heat-pumps
title: Ground-source heat pumps
summary: Electric heat pumps that extract heat from the ground (soil) for building heating, with soil-temperature-dependent efficiency (COP).

when_to_use:
  - "add ground-source heat pumps"
  - "GSHP"
  - "geothermal heat pump for buildings"
  - "soil-sourced heat pump"
  - "borehole / ground-loop heat pump"
  - "rural heating electrification"
  - "heat pump efficiency from soil temperature"
  - "known in pypsa-eur as: ground heat pump, geothermal heat pump, urban central geothermal heat pump, residential rural ground heat pump, services rural ground heat pump"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Ground-sourced heat pumps are added by default (when sector.enable.heat is true)
        as extendable Link components from the electricity bus to the heat bus of the
        RURAL heat system nodes ("residential rural", "services rural"): in add_heat,
        heat_pump_type = "air" if "urban" in name, else "ground". Efficiency is an hourly
        COP series when sector.time_dep_hp_cop is true, computed in build_cop_profiles
        from coefficient_of_performance(delta_T, source="soil") — the Staffell et al.
        (2012) quadratic 8.77 - 0.150*delta_T + 0.000734*delta_T**2 — with
        delta_T = heat_pump_sink_T - population-weighted ERA5 soil temperature
        (build_temperature_profiles, atlite cutout.soil_temperature). Costs from
        technology-data row "decentral ground-sourced heat pump". With
        sector.electricity_distribution_grid true, the Link draws from the low voltage bus.
      mechanism: >
        Pipeline: rule build_temperature_profiles (temp_soil_*.nc) -> rule
        build_cop_profiles (cop_soil_*.nc) -> rule prepare_heat_data (gshp_cop csv) ->
        rule prepare_sector_network / add_heat (n.madd Link, carrier
        "{name} ground heat pump", p_nom_extendable=True).
      not_covered: >
        No ground-source heat pumps at urban nodes (urban systems get air-source only,
        hard-coded). No ground-loop/borehole drilling potential or land constraint — GSHP
        capacity is unlimited at rural nodes. No deep-geothermal district heat source.
        Existing GSHP stock only via build_existing_heating_distribution (European source
        data; that script assumes all ground-sourced units sit in rural areas).
      provenance: "scripts/prepare_sector_network.py:add_heat"

    levers:
      - key: sector.heat_pump_sink_T
        effect: Sink temperature in Celsius entering delta_T for the soil COP curve.
        default: "55"
        provenance: "config.default.yaml:heat_pump_sink_T; scripts/build_cop_profiles.py:heat_pump_sink_T"
      - key: sector.time_dep_hp_cop
        effect: Hourly soil-temperature COP if true; static costs-table efficiency if false.
        default: "true"
        provenance: "config.default.yaml:time_dep_hp_cop; scripts/prepare_sector_network.py:time_dep_hp_cop"
      - key: sector.enable.heat
        effect: Master switch for the heat sector; disables add_heat entirely.
        default: "true"
        provenance: "config.default.yaml:enable; Snakefile:HEAT"
      - key: sector.electricity_distribution_grid
        effect: Moves heat pump electricity draw to the low voltage bus (distribution costs apply).
        default: "true"
        provenance: "config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:add_electricity_distribution_grid"

    boundary:
      - variant: "Have ground-source heat pumps compete for rural heat supply"
        rung: L0
        note: "Default when heat sector is enabled; extendable Link at rural nodes."
      - variant: "Change sink/flow temperature"
        rung: L1
        note: "sector.heat_pump_sink_T, consumed by rule build_cop_profiles."
      - variant: "Offer GSHP at urban (decentral or district-heating) nodes"
        rung: L2
        note: "Edit the heat_pump_type assignment in add_heat or add a parallel Link set with cop['ground']."
      - variant: "Different soil COP regression"
        rung: L2
        note: "Edit the source == 'soil' branch of coefficient_of_performance."
      - variant: "Represent existing GSHP stock (brownfield)"
        rung: L3
        note: "Country rows in data/existing_infrastructure/existing_heating_raw.csv for build_existing_heating_distribution; shipped data is European."
      - variant: "Borehole/ground potential limits or drilling cost supply curve"
        rung: L5
        note: "No potential constraint exists; needs new data plus bespoke constraint/component logic."

    where:
      - change: "Urban vs rural heat pump technology assignment"
        anchor: "scripts/prepare_sector_network.py:add_heat (heat_pump_type assignment)"
        provenance: "scripts/prepare_sector_network.py:heat_pump_type"
      - change: "Soil COP functional form"
        anchor: "scripts/build_cop_profiles.py:coefficient_of_performance"
        provenance: "scripts/build_cop_profiles.py:coefficient_of_performance"
      - change: "Soil temperature inputs"
        anchor: "rule build_temperature_profiles (atlite cutout.soil_temperature)"
        provenance: "scripts/build_temperature_profiles.py:soil_temperature"
      - change: "Existing GSHP capacities"
        anchor: "rule build_existing_heating_distribution + data/existing_infrastructure/existing_heating_raw.csv"
        provenance: "Snakefile:build_existing_heating_distribution"

    data_dependencies:
      - input: "ERA5 cutout (soil temperature field) covering the model region"
        required_for: "Soil COP time series"
        availability: "must be built or retrieved (enable.retrieve_cutout / build_cutout)"
      - input: "Population layouts (WorldPop + UNCTAD urban percent)"
        required_for: "Rural/urban split that decides where GSHPs appear"
        availability: "must be built (build_population_layouts)"
      - input: "UNSD energy balances (heat demand totals per country)"
        required_for: "Sizing the rural heat load"
        availability: "must be built (build_base_energy_totals)"
      - input: "data/existing_infrastructure/existing_heating_raw.csv"
        required_for: "Brownfield GSHP stock"
        availability: "region-dependent (European source study)"
