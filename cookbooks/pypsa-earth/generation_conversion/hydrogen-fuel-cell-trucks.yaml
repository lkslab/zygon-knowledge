id: hydrogen-fuel-cell-trucks
title: Hydrogen fuel-cell trucks
summary: >
  Hydrogen fuel-cell heavy road freight — trucks running on H2 via fuel cells
  instead of diesel or batteries.

when_to_use:
  - "hydrogen trucks / fuel cell trucks / FCEV freight"
  - "H2 for road freight / heavy-duty hydrogen"
  - "fuel cell electric vehicles"
  - "hydrogen refuelling demand for trucks"
  - "decarbonise trucking with hydrogen"
  - "known in pypsa-eur as: land transport fuel cell"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Covered ONLY as the aggregate fuel-cell share of ALL road transport, not
        truck-specific. sector.land_transport_fuel_cell_share (keyed
        {demand}_{planning_horizon}, e.g. AB_2030) routes that fraction of the single
        land transport demand to a "land transport fuel cell" Load on each node's H2
        bus, scaled by 1 / sector.transport_fuel_cell_efficiency. H2 supply comes
        from the hydrogen system added by add_hydrogen (electrolysis, SMR, per
        sector.hydrogen.production_technologies).
      mechanism: >
        add_land_transport in rule prepare_sector_network: the 'fuel_cell_share > 0'
        block adds the H2 load (skipped when the h2_policy reference-case flags
        remove H2 loads). The same share is also applied upstream in rule
        prepare_energy_totals ('total road fcev' efficiency gains) when projecting
        road demand. With sector.dynamic_transport.enable the share is instead keyed
        by the Co2L opts wildcard.
      not_covered: >
        Truck-vs-car split (the share applies to cars too), refuelling-station
        infrastructure and its costs, hydrogen distribution to stations (load sits
        directly on the nodal H2 bus), vehicle stock and purchase costs, endogenous
        fuel choice.
      provenance: "scripts/prepare_sector_network.py:add_land_transport"

    levers:
      - key: sector.land_transport_fuel_cell_share
        effect: "Fraction of aggregate road demand served by FCEVs (trucks + cars together), keyed {demand}_{planning_horizon}."
        default: "AB_2030: 0.01 (dict per scenario/year; e.g. NZ_2050: 0.28)"
        provenance: "scripts/prepare_sector_network.py:land_transport_fuel_cell_share"
      - key: sector.transport_fuel_cell_efficiency
        effect: "Tank-to-wheel FCEV efficiency; H2 demand = share / efficiency x transport demand."
        default: "0.5"
        provenance: "scripts/prepare_sector_network.py:transport_fuel_cell_efficiency"
      - key: sector.dynamic_transport.enable
        effect: "Switch to Co2L-wildcard-keyed FCEV shares (sector.dynamic_transport.land_transport_fuel_cell_share)."
        default: "false"
        provenance: "scripts/prepare_sector_network.py:dynamic_transport"
      - key: sector.enable.land_transport
        effect: "Master switch for the land transport block."
        default: "true"
        provenance: "Snakefile:prepare_sector_network"
      - key: sector.hydrogen.production_technologies
        effect: "Which H2 production routes can serve the FCEV load."
        default: '["H2 Electrolysis", "SMR", "SMR CC"]'
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"

    boundary:
      - variant: "Add hydrogen road transport for a scenario/year"
        rung: L1
        note: "Set sector.land_transport_fuel_cell_share for the run's {demand}_{planning_horizons} key; must keep fuel_cell + electric shares <= 1 (asserted)."
      - variant: "Approximate truck-only H2 by share arithmetic"
        rung: L1
        note: "Fold the truck fraction of road energy into the share value offline; not truck-specific in the model."
      - variant: "Truck-specific H2 demand distinct from cars"
        rung: L3
        note: "Same blocker as electric-heavy-trucks: 'total road' has no truck split; needs disaggregated demand data (data/emobility/Lkw__count can shape it) plus a second share/load block in add_land_transport."
      - variant: "Refuelling-station infrastructure and H2 trucking logistics"
        rung: L5
        note: "No station or distribution representation exists; bespoke components."
      - variant: "Endogenous choice between battery and H2 trucks"
        rung: L5
        note: "Shares are exogenous; fuel competition would need new decision variables/constraints."

    where:
      - change: "FCEV H2 load creation (the fuel_cell_share block)"
        anchor: "scripts/prepare_sector_network.py function add_land_transport"
        provenance: "scripts/prepare_sector_network.py:add_land_transport"
      - change: "H2 buses/production the load draws from"
        anchor: "scripts/prepare_sector_network.py function add_hydrogen"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "Upstream demand projection applying the FCEV share"
        anchor: "rule prepare_energy_totals -> scripts/prepare_energy_totals.py"
        provenance: "scripts/prepare_energy_totals.py:land_transport_fuel_cell_share"

    data_dependencies:
      - input: "UNSD energy balances 'total road'"
        required_for: "the aggregate demand the FCEV share applies to"
        availability: "must be built (build_base_energy_totals)"
      - input: "costs file rows for H2 production (electrolysis/SMR) and 'fuel cell'"
        required_for: "supplying and pricing the H2 the load consumes"
        availability: "exists by default (retrieve_cost_data)"
      - input: "Truck-segment demand data"
        required_for: "truck-specific variants (L3+)"
        availability: "absent (only unused German Lkw traffic-count shape in data/emobility)"
