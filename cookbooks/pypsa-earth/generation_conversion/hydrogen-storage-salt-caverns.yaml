id: hydrogen-storage-salt-caverns
title: Hydrogen storage (salt caverns)
summary: Large-scale underground hydrogen storage in salt caverns — cheap, geologically constrained energy capacity for seasonal H2 balancing.
when_to_use:
  - hydrogen salt caverns / underground hydrogen storage
  - UHS / geological H2 storage
  - cheap seasonal hydrogen storage
  - where can hydrogen be stored underground
  - hydrogen tank vs cavern storage costs
  - "known in pypsa-eur as: hydrogen storage, H2 Store, H2 storage"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Sector chain only, and OFF by default (sector.hydrogen.underground_storage:
        false). When enabled, add_hydrogen adds "H2 UHS" Buses/Stores with
        potential-limited e_nom_max from data/hydrogen_salt_cavern_potentials.csv —
        country totals in TWh (only DZ: 1000, MA: 300, TN: 100, NG: 100, BJ: 20)
        split equally across each country's nodes and converted to MWh — at capital
        cost from costs row "hydrogen storage underground", plus free extendable
        UHS charger/discharger Links. The default (and everywhere-else fallback) is
        overground tank storage: an "H2 Store Tank" Store at every node priced at
        costs row "hydrogen storage tank type 1 including compressor". A second,
        custom-data branch (custom_data.h2_underground: true) reads per-region
        potentials from data/custom/h2_underground_{demand}_{planning_horizons}.csv
        (columns id_region, storage_cap_MWh, country) instead.
      mechanism: >
        rule prepare_sector_network runs scripts/prepare_sector_network.py; inside
        add_hydrogen the block gated on
        snakemake.params.sector_options["hydrogen"]["underground_storage"] chooses
        between the custom branch (snakemake.params.h2_underground, wired from
        config custom_data.h2_underground in the Snakefile) and the default CSV
        branch (snakemake.input.h2_cavern = data/hydrogen_salt_cavern_potentials.csv).
        Caution on the default CSV branch as written: both the "H2 UHS charger" and
        "H2 UHS discharger" Links are created with bus0=spatial.nodes (the
        electricity bus) and bus1 at the UHS bus — i.e. the same orientation, and
        connected to the electricity rather than the H2 bus (the custom branch uses
        bus0=spatial.nodes + " H2"); review orientation before relying on results.
        Overground tanks are added unconditionally at all nodes after the block.
      not_covered: >
        The power-only chain has no cavern option at all — attach_stores
        (scripts/add_extra_components.py) prices the H2 Store with the "hydrogen
        storage tank" row only. Cavern data covers just five countries at country
        (not geological/nodal) resolution, split equally across nodes (marked TODO
        in code). No cushion gas, injection/withdrawal rate limits, or
        cavern-construction lead times.
      provenance: scripts/prepare_sector_network.py:underground_storage
    levers:
      - key: sector.hydrogen.underground_storage
        effect: Master switch for salt-cavern H2 stores ("H2 UHS") in the sector chain.
        default: "false"
        provenance: scripts/prepare_sector_network.py:underground_storage
      - key: custom_data.h2_underground
        effect: Switches the cavern potential source from the shipped country CSV to user files data/custom/h2_underground_{demand}_{planning_horizons}.csv with per-region storage_cap_MWh.
        default: "false"
        provenance: scripts/prepare_sector_network.py:add_hydrogen
      - key: electricity.extendable_carriers.Store
        effect: Keeps "H2" tank storage in the power-only chain (Store + electrolysis/fuel-cell Links) — the non-cavern baseline.
        default: "[battery, H2]"
        provenance: scripts/add_extra_components.py:attach_stores
      - key: electricity.max_hours.H2
        effect: Duration of the H2 StorageUnit representation (tank-cost based) if "H2" is added to extendable_carriers.StorageUnit.
        default: "168"
        provenance: scripts/process_cost_data.py:costs_for_storage
    boundary:
      - variant: Enable salt-cavern H2 storage (region within DZ/MA/TN/NG/BJ)
        rung: L0
        note: Flip sector.hydrogen.underground_storage to true — but review the charger/discharger bus wiring noted in mechanism.
      - variant: Cavern storage for a country not in the shipped CSV
        rung: L3
        note: Add a "ct,TWh" row to data/hydrogen_salt_cavern_potentials.csv (country ISO2 + TWh potential); no code change.
      - variant: Node-resolved / bespoke cavern potentials
        rung: L3
        note: Set custom_data.h2_underground true and provide data/custom/h2_underground_{demand}_{planning_horizons}.csv (id_region, storage_cap_MWh, country).
      - variant: Change tank-vs-cavern cost assumptions
        rung: L1
        note: Costs rows "hydrogen storage underground" and "hydrogen storage tank type 1 including compressor" come from technology-data; override via the costs-section maps read by prepare_costs (investment/FOM/... via config.get — keys present only as comments in config.default.yaml).
      - variant: Salt caverns in the power-only workflow
        rung: L2
        note: attach_stores hardcodes the tank cost for the H2 Store; add a cavern-cost variant with regional e_nom_max there (reuse the CSV), since no underground option exists in that chain.
      - variant: Fix/parameterise UHS charger-discharger wiring or add charging efficiency/cost
        rung: L2
        note: Edit the two n.madd("Link", ... "H2 UHS charger"/"H2 UHS discharger") calls in the underground_storage block (efficiency/capital_cost lines are currently commented out or zero).
      - variant: Injection/withdrawal rate limits, cushion gas
        rung: L5
        note: No hook; bespoke constraints on the UHS Store/Links.
    where:
      - change: Cavern storage block (both CSV and custom branches, link wiring, potentials-to-nodes logic)
        anchor: scripts/prepare_sector_network.py, function add_hydrogen, underground_storage block (rule prepare_sector_network)
        provenance: scripts/prepare_sector_network.py:add_hydrogen
      - change: Country cavern potentials
        anchor: data/hydrogen_salt_cavern_potentials.csv (Snakefile input h2_cavern of rule prepare_sector_network)
        provenance: data/hydrogen_salt_cavern_potentials.csv:DZ
      - change: Overground tank fallback cost
        anchor: scripts/prepare_sector_network.py, "H2 Store Tank" madd after the underground block
        provenance: scripts/prepare_sector_network.py:hydrogen storage tank type 1 including compressor
      - change: Power-only chain H2 storage cost
        anchor: scripts/add_extra_components.py, function attach_stores, H2 branch (rule add_extra_components)
        provenance: scripts/add_extra_components.py:attach_stores
    data_dependencies:
      - input: data/hydrogen_salt_cavern_potentials.csv (country, TWh)
        required_for: Default cavern branch
        availability: region-dependent — shipped in the repo, rows only for DZ, MA, TN, NG, BJ; other countries silently get no caverns
      - input: data/custom/h2_underground_{demand}_{planning_horizons}.csv
        required_for: Custom per-region cavern potentials (custom_data.h2_underground)
        availability: absent — must be provided by the user
      - input: costs rows "hydrogen storage underground" and "hydrogen storage tank type 1 including compressor" (technology-data via rule retrieve_cost_data; "hydrogen storage underground" also in offline fallback data/costs.csv)
        required_for: Cavern and tank capital costs
        availability: exists by default
