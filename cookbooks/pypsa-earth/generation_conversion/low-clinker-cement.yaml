id: low-clinker-cement
title: Low-clinker / alternative cement
summary: >
  Reducing cement emissions by cutting the clinker ratio, using supplementary
  cementitious materials, or alternative binders/chemistries.

when_to_use:
  - "low clinker cement"
  - "clinker substitution"
  - "green cement"
  - "alternative cement chemistry"
  - "cement process emissions"
  - "decarbonise cement"
  - "SCM / fly ash / calcined clay cement"
  - "cement kiln fuel switching"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Cement only inside the aggregate UNSD industry "non-metallic minerals":
        annual fuel/electricity demand per carrier from UNSD balances, plus
        cement process emissions computed in build_industry_demand as SFI
        cement-plant capacity x 1000 x 0.542 tCO2/t (emission_factors
        "non-metallic minerals", noted 'taken for cement') x
        sector.industry_util_factor. Process emissions become a per-node
        "process emissions" load/bus in add_industry, vented to the atmosphere
        via a "process emissions" link or captured via "process emissions CC"
        when sector.cc is true. Plant locations come from the SFI Global Cement
        Database (data/industry/SFI-Global-Cement-Database-July-2021.xlsx,
        technology label "Cement").
      mechanism: >
        rule build_industrial_database (create_cement_db) -> distribution keys
        and capacity-based process emissions in build_industry_demand ->
        add_industry loads in prepare_sector_network.
      not_covered: >
        No clinker ratio, no clinker/cement distinction, no SCM or alternative
        binder options, no endogenous choice between cement routes. The only
        endogenous decarbonisation channel for cement is post-combustion /
        process CCS. Lower-clinker cement can only be represented by scaling
        down the process-emission factor and/or fuel demand exogenously.
      provenance: "scripts/build_industry_demand.py:emission_factors"

    levers:
      - key: sector.industry_util_factor
        effect: "Linear scale on cement (and steel/refinery) process emissions derived from plant capacities."
        default: "0.7"
        provenance: "config.default.yaml:industry_util_factor"
      - key: sector.cc
        effect: "Enables 'process emissions CC' (and gas/biomass for industry CC) links — the endogenous alternative to clinker reduction."
        default: "true"
        provenance: "config.default.yaml:cc"
      - key: custom_data.industry_demand
        effect: "Custom per-country industry demand csv — route to impose reduced kiln fuel and process-emission rows."
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: custom_data.industry_database
        effect: "Custom plant database (data/custom/industrial_database.csv) — controls where cement demand/emissions land."
        default: "false"
        provenance: "config.default.yaml:industry_database"
      - key: sector.enable.industry
        effect: "Gates all industry loads including cement process emissions."
        default: "true"
        provenance: "config.default.yaml:industry"

    boundary:
      - variant: "uniformly reduce cement process emissions (crude low-clinker proxy)"
        rung: L1
        note: "lower sector.industry_util_factor — but it also scales steel and refinery process emissions; cement-specific use is a misuse."
      - variant: "cement-specific clinker-ratio reduction (change the 0.542 tCO2/t factor)"
        rung: L2
        note: "edit emission_factors['non-metallic minerals'] in build_industry_demand — the single hardcoded number encoding clinker intensity."
      - variant: "reduced kiln fuel demand from clinker substitution / alternative binders"
        rung: L3
        note: >
          Scale the 'non-metallic minerals' column of the fuel rows via
          data/custom/industry_demand_{demand}_{planning_horizons}.csv
          (custom_data.industry_demand: true), including custom
          'process emissions' rows, or edit industry_base_totals in
          build_industry_demand.
      - variant: "year-/scenario-dependent clinker trajectory"
        rung: L3
        note: "one custom industry_demand csv per {demand}_{planning_horizons}; the default CAGR file (data/demand/industry_growth_cagr.csv) only scales activity, not emission intensity."
      - variant: "endogenous choice between conventional, low-clinker and CCS cement routes"
        rung: L5
        note: "requires a cement-output bus with competing production links and costs — nothing exists; bespoke Python in prepare_sector_network."

    where:
      - change: "cement process-emission factor and utilisation"
        anchor: "emission_factors dict + NMM_emissions calculation in build_industry_demand"
        provenance: "scripts/build_industry_demand.py:emission_factors"
      - change: "cement plant locations/capacities"
        anchor: "create_cement_db in build_industrial_database (SFI xlsx, status 'Operating')"
        provenance: "scripts/build_industrial_database.py:create_cement_db"
      - change: "process-emission handling in the network (vent vs CC)"
        anchor: "add_industry — 'process emissions' bus/Load/Link and 'process emissions CC' link (costs 'cement capture')"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "kiln fuel rows (non-metallic minerals column of industry totals)"
        anchor: "rule build_industry_demand — industry_base_totals; custom data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"

    data_dependencies:
      - input: "data/industry/SFI-Global-Cement-Database-July-2021.xlsx"
        required_for: "cement plant capacities (process emissions + distribution keys)"
        availability: "exists by default (shipped in data/industry); plant coverage region-dependent"
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "non-metallic minerals fuel/electricity baseline"
        availability: "must be built; region-dependent"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "imposed low-clinker fuel/emission rows"
        availability: "absent — user-supplied"
      - input: "technology-data costs csv ('cement capture' rows)"
        required_for: "the CCS alternative on process emissions"
        availability: "must be built (enable.retrieve_cost_data)"
