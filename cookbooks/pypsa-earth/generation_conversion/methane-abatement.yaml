id: methane-abatement
title: Methane leak detection / abatement
summary: >-
  Cutting methane emissions from fossil supply chains (leaks, venting, flaring) and
  accounting for methane's climate impact alongside CO2.
when_to_use:
  - "methane leaks / fugitive emissions"
  - "methane abatement in oil and gas"
  - "CH4 accounting / CO2-equivalent emissions"
  - "upstream emissions of natural gas"
  - "flaring and venting"
  - "GWP of methane in the model"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing methane-specific — emissions accounting is CO2-only and
        combustion-only. Grounded absence: no CH4/leakage/fugitive/GWP/CO2e concept
        exists in scripts or config. What exists: fuel carriers get a co2_emissions
        attribute from the cost data (add_carrier_buses sets it from the carrier's
        'CO2 intensity'; in the electricity workflow _add_missing_carriers_from_costs
        imports the *_emissions cost columns onto Carriers); in the sector network
        combustion Links book CO2 onto the "co2 atmosphere" bus (e.g.
        convert_conventional_generators_to_links efficiency2, 'gas for industry'
        links in add_industry). CO2 is then constrained/priced via add_co2limit
        (prepare_network, electricity.co2limit / automatic_emission) or
        add_co2_budget (co2_budget config) in the sector workflow.
      mechanism: >-
        The only lever surface is the CO2 machinery. Because gas upstream leakage is
        proportional to gas burned, the standard workaround is to inflate the gas
        'CO2 intensity' in the cost data to a CO2-EQUIVALENT intensity (combustion +
        GWP-weighted upstream leakage) — every gas-consuming link then carries the
        leakage penalty automatically, since all of them read
        costs.at["gas", "CO2 intensity"].
      not_covered: >-
        Explicit CH4 as a gas/greenhouse species, leak-rate differentiation by supply
        source (domestic vs imported, pipeline vs LNG), abatement technologies or
        cost curves (LDAR, flare replacement), venting/flaring, non-energy methane
        (agriculture, waste), and any warming metric other than lumping into CO2.
      provenance: "scripts/prepare_sector_network.py:add_co2"
    levers:
      - key: electricity.co2limit
        effect: "Absolute CO2 cap (tCO2/a) applied via add_co2limit when a Co2L wildcard is active — prices whatever is inside 'CO2 intensity', including any CO2e uplift you add."
        default: "7.75e+7 (European default)"
        provenance: "config.default.yaml:co2limit ; scripts/prepare_network.py:add_co2limit"
      - key: electricity.automatic_emission
        effect: "Derive the CO2 base from historical country emissions of a base year instead of the manual co2base."
        default: "false"
        provenance: "config.default.yaml:automatic_emission ; scripts/prepare_network.py:add_co2limit"
      - key: electricity.automatic_emission_base_year
        effect: "Base year for the automatic emission baseline."
        default: "1990"
        provenance: "config.default.yaml:automatic_emission_base_year ; scripts/prepare_network.py:add_co2limit"
      - key: co2_budget.enable
        effect: "Sector-workflow CO2 budget by planning-horizon year (add_co2_budget)."
        default: "false"
        provenance: "config.default.yaml:co2_budget ; scripts/prepare_sector_network.py:add_co2_budget"
    boundary:
      - variant: "Tighten the CO2 cap (indirectly penalising gas use, hence leaks)"
        rung: L0
        note: "electricity.co2limit / Co2L wildcard / co2_budget."
      - variant: "Count methane leakage as CO2e on all gas use"
        rung: L3
        note: >-
          Data edit: raise the 'gas' row 'CO2 intensity' in the costs CSV to a CO2e
          value (e.g. combustion 0.198 + leak_rate x GWP100 x CH4-per-MWh). Every
          gas link (power, industry, heat, SMR) picks it up. Caveat: it also scales
          the CC capture terms and the biogas-upgrading credit, which read the same
          number — check those links if precision matters.
      - variant: "Leakage on domestic production only / differentiated by supply route"
        rung: L2
        note: "Add an emission efficiency term to the gas supply Generators/Stores created in add_carrier_buses (or a dedicated atmosphere output on import/extraction links) instead of the fuel intensity."
      - variant: "Explicit CH4 tracking bus with GWP conversion"
        rung: L5
        note: "New 'ch4 atmosphere' carrier/store and emission terms on every methane-touching link, plus a combined warming constraint — bespoke, mirrors the add_co2 pattern."
      - variant: "Abatement supply curve (LDAR, flare gas recovery)"
        rung: L5
        note: "New abatement Links/variables against the leak stream; nothing to parameterise exists."
    where:
      - change: "CO2e uplift of gas intensity (data route)"
        anchor: "costs CSV row 'gas', column 'CO2 intensity' (Snakefile rule retrieve_cost_data or data/costs.csv)"
        provenance: "Snakefile:retrieve_cost_data"
      - change: "Supply-side leakage terms"
        anchor: "scripts/prepare_sector_network.py function add_carrier_buses (fuel Store+Generator per carrier)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "Combustion accounting links that read gas CO2 intensity"
        anchor: "scripts/prepare_sector_network.py functions convert_conventional_generators_to_links and add_industry ('gas for industry')"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - change: "Explicit CH4 species / warming constraint"
        anchor: "scripts/prepare_sector_network.py function add_co2 (pattern for an atmosphere species) and scripts/solve_network.py function extra_functionality"
        provenance: "scripts/prepare_sector_network.py:add_co2"
    data_dependencies:
      - input: "Cost row 'gas' with 'CO2 intensity' (technology-data)"
        required_for: "The CO2e-uplift route"
        availability: "exists by default"
      - input: "Country/route-specific methane leak rates (e.g. IEA Methane Tracker)"
        required_for: "Any defensible leakage number"
        availability: "absent — must be supplied by the user"
      - input: "Abatement cost curves"
        required_for: "The L5 abatement variant"
        availability: "absent"
