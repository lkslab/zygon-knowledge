id: ocean-cdr
title: Ocean-based CDR
summary: >-
  Marine carbon removal — ocean alkalinity enhancement, direct ocean capture,
  macroalgae sinking and similar pathways that use the ocean as the carbon sink.
when_to_use:
  - "ocean carbon removal"
  - "ocean alkalinity enhancement / OAE"
  - "direct ocean capture"
  - "seaweed / kelp carbon sinking"
  - "marine CDR"
  - "blue carbon removal technologies"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing — no ocean-CDR concept exists anywhere in the workflow, config, or
        cost data (the only "ocean"/"wave" hits are map-plotting colours and
        bathymetry documentation). Grounded absence. The carbon machinery it is
        absent from: add_co2 ("co2 atmosphere" Bus+Store with e_min_pu=-1 so net
        removal is representable, "co2 stored" Buses/Stores capped by the
        sequestration constraint) and add_dac (the single existing
        atmosphere-removal Link, the pattern any new exogenous-removal technology
        copies).
      mechanism: >-
        None. Structurally, an ocean-CDR pathway is an electricity-(and possibly
        heat-)consuming Link with bus0 "co2 atmosphere" sinking into a new dedicated
        marine-removal store with its own rate/total caps — NOT into "co2 stored",
        whose budget represents geological sequestration
        (sector.co2_sequestration_potential).
      not_covered: >-
        Everything: no marine chemistry, no coastal siting, no vessel/energy
        logistics, no permanence or leakage treatment, no cost rows.
      provenance: "scripts/prepare_sector_network.py:add_co2"
    levers:
      - key: sector.dac
        effect: "Closest existing removal option (a stand-in only); the sole atmosphere-removal links in the model."
        default: "true"
        provenance: "config.default.yaml:dac ; scripts/prepare_sector_network.py:add_dac"
      - key: sector.co2_sequestration_potential
        effect: "Only relevant if ocean-CDR carbon is crudely dumped into 'co2 stored'; a faithful implementation uses its own store outside this cap."
        default: "200"
        provenance: "config.default.yaml:co2_sequestration_potential ; scripts/solve_network.py:add_co2_sequestration_limit"
    boundary:
      - variant: "Any ocean-CDR representation at all"
        rung: L5
        note: >-
          Bespoke Python: new removal Link(s) from "co2 atmosphere" with energy
          inputs, a new marine store/carrier, and a removal-rate cap (new constraint
          alongside add_co2_sequestration_limit in extra_functionality). Nearest
          template: the add_dac Link; siting at coastal nodes could reuse the
          offshore-region shapes but nothing is wired for it.
      - variant: "Crude stand-in: cost-tuned DAC-like backstop"
        rung: L2
        note: "Clone the add_dac link with ocean-CDR cost/energy numbers if lumping into the geological budget is acceptable."
    where:
      - change: "New marine removal link / store / cap"
        anchor: "scripts/prepare_sector_network.py functions add_dac (link template) and add_co2 (carbon buses); scripts/solve_network.py function extra_functionality (rate cap)"
        provenance: "scripts/prepare_sector_network.py:add_dac"
      - change: "Coastal siting inputs (if spatialised)"
        anchor: "resources offshore_shapes from scripts/build_shapes.py (offshore region geometries)"
        provenance: "Snakefile:offshore_shapes"
    data_dependencies:
      - input: "Ocean-CDR techno-economics (EUR/tCO2, energy per tCO2) per pathway"
        required_for: "The L5/L2 pathway"
        availability: "absent — must be supplied"
      - input: "Regional marine deployment potential"
        required_for: "A defensible removal cap"
        availability: "absent — must be supplied"
