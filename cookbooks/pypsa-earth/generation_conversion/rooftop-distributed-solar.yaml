id: rooftop-distributed-solar
title: Rooftop / distributed solar
summary: Customer-side PV on building rooftops connected at the distribution level, distinct from ground-mounted utility-scale PV.

when_to_use:
  - add rooftop solar
  - solar panels on houses / buildings
  - distributed / behind-the-meter PV
  - residential solar
  - solar on the distribution grid
  - split solar into rooftop and utility
  - rooftop PV potential from building footprints
  - "known in pypsa-eur as: solar rooftop"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Two distinct rungs — distinguish them. (1) Power-only (electricity) chain: rooftop is NOT
        a separate carrier; it only enters as a cost blend — load_costs sets the 'solar' capital
        cost to rooftop_share * solar-rooftop + (1 - rooftop_share) * solar-utility (default
        rooftop_share 0.14). (2) Sector-coupled chain: rooftop is first-class — with
        sector.electricity_distribution_grid: true and sector.solar_rooftop.enable: true,
        add_electricity_distribution_grid in prepare_sector_network adds 'solar rooftop'
        Generators on '<bus> low voltage' buses, with p_nom_max from population
        (kW_per_m2 * m2_per_person * population layout) or, if use_building_size: true, from
        Microsoft GlobalMLBuildingFootprints building areas clustered per region
        (rule cluster_global_buildings). When rooftop is enabled the existing utility 'solar'
        generators are re-costed to pure solar-utility.
      mechanism: >
        Sector chain: prepare_sector_network.py, add_electricity_distribution_grid — reads
        options['solar_rooftop'], computes per-bus potential, and n.madd("Generator", ...,
        suffix=" rooftop", bus=<bus> + " low voltage", carrier="solar rooftop",
        capital_cost=costs.at["solar-rooftop", "fixed"], p_max_pu copied from the utility solar
        profile at the same bus (same weather resource, different cost/connection point).
        Building-footprint potential path: rule cluster_global_buildings (params install_ratio,
        tolerance from sector.solar_rooftop) produces solar_rooftop_layout csvs consumed when
        use_building_size is true. Power-only chain: scripts/process_cost_data.py, load_costs,
        rooftop_share blend only.
      not_covered: >
        In the power-only chain there is no separate rooftop generator, no distribution grid, and
        no rooftop potential limit — only the blended cost. In the sector chain rooftop reuses the
        utility solar profile (no separate rooftop-specific orientation/shading resource
        assessment), and building-size potentials require the optional GlobalMLBuildingFootprints
        download.
      provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"

    levers:
      - key: costs.rooftop_share
        effect: "Power-only chain: weight of solar-rooftop cost in the blended 'solar' capital cost."
        default: "0.14"
        provenance: "scripts/process_cost_data.py:rooftop_share"
      - key: sector.electricity_distribution_grid
        effect: "Adds low-voltage buses + distribution links; prerequisite for rooftop generators."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:electricity_distribution_grid"
      - key: sector.solar_rooftop.enable
        effect: "Adds 'solar rooftop' generators on low-voltage buses in the sector chain."
        default: "true"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - key: sector.solar_rooftop.kW_per_m2
        effect: "PV power density used to convert roof area to MW potential."
        default: "0.1"
        provenance: "scripts/prepare_sector_network.py:kW_per_m2"
      - key: sector.solar_rooftop.m2_per_person
        effect: "Roof area per person for the population-based potential (used when use_building_size is false)."
        default: "20"
        provenance: "scripts/prepare_sector_network.py:m2_per_person"
      - key: sector.solar_rooftop.use_building_size
        effect: "Switch potential basis from population to Microsoft building-footprint areas."
        default: "false"
        provenance: "scripts/prepare_sector_network.py:use_building_size"
      - key: sector.solar_rooftop.install_ratio
        effect: "Mapping building-size [m2] -> installable roof fraction, applied when clustering buildings."
        default: "{0: 0, 10: 0.3, 100: 0.36, 200: 0.41, 450: 0.49, 2300: 0.66}"
        provenance: "Snakefile:rule cluster_global_buildings"
      - key: sector.solar_rooftop.tolerance
        effect: "Max distance [km] to allocate a building to the nearest bus region."
        default: "100"
        provenance: "Snakefile:rule cluster_global_buildings"

    boundary:
      - variant: "tune rooftop vs utility cost mix in the power-only model"
        rung: L0
        note: "costs.rooftop_share (0 = utility only, 1 = rooftop only); no separate carrier appears."
      - variant: "rooftop as an explicit competing technology"
        rung: L0
        note: "already default in the sector-coupled chain (sector.solar_rooftop.enable + electricity_distribution_grid, both true by default); run the sector workflow (prepare_sector_network)."
      - variant: "change rooftop potential assumptions (density, area per person)"
        rung: L0
        note: "sector.solar_rooftop.kW_per_m2 / m2_per_person."
      - variant: "building-footprint-based rooftop potential"
        rung: L3
        note: "sector.solar_rooftop.use_building_size: true + enable.download_global_buildings: true — requires downloading GlobalMLBuildingFootprints parquet per country (rule download_global_buildings), then rule cluster_global_buildings builds the layout."
      - variant: "rooftop as separate carrier in the POWER-ONLY chain"
        rung: L2
        note: "no key; smallest path is a second renewable.<name> solar block plus a costs row alias, or edit attach_wind_and_solar — the stock power-only chain has no LV buses so it competes at the same bus as utility solar."
      - variant: "rooftop-specific resource profile (orientation/shading distinct from utility)"
        rung: L2
        note: "sector chain copies the utility solar p_max_pu; changing it means editing add_electricity_distribution_grid or adding a dedicated renewable profile."
      - variant: "net-metering / retail-tariff behaviour of rooftop owners"
        rung: L5
        note: "no mechanism; generators are centrally optimised."

    where:
      - change: "rooftop generator creation, potential formula, LV connection"
        anchor: "add_electricity_distribution_grid in scripts/prepare_sector_network.py (rule prepare_sector_network)"
        provenance: "scripts/prepare_sector_network.py:add_electricity_distribution_grid"
      - change: "building-footprint clustering into per-region roof area"
        anchor: "rule cluster_global_buildings -> scripts/cluster_global_buildings.py"
        provenance: "Snakefile:rule cluster_global_buildings"
      - change: "power-only cost blend"
        anchor: "load_costs in scripts/process_cost_data.py"
        provenance: "scripts/process_cost_data.py:load_costs"

    data_dependencies:
      - input: "population layouts (build_population_layouts / clustered layouts)"
        required_for: "default population-based rooftop potential"
        availability: "built by the sector workflow (WorldPop-based); exists for all regions"
      - input: "GlobalMLBuildingFootprints parquet data/global_buildings/<country>_global_buildings_raw.parquet"
        required_for: "use_building_size potential"
        availability: "must be downloaded (enable.download_global_buildings, default false); region-dependent coverage"
      - input: "technology-data costs file (solar-rooftop, solar-utility rows)"
        required_for: "rooftop capex and the rooftop_share blend"
        availability: "retrieved by rule retrieve_cost_data (exists by default)"
      - input: "utility solar generators + profiles in the elec network"
        required_for: "rooftop p_max_pu (copied per bus)"
        availability: "exists by default ('solar' in electricity.renewable_carriers)"
