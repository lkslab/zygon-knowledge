id: synchronous-condensers
title: Synchronous condensers
summary: Rotating machines providing inertia, short-circuit strength and reactive power without generating energy — grid stability hardware, not an energy asset.
when_to_use:
  - "add synchronous condensers"
  - "reactive power compensation"
  - "inertia after coal/gas retirements"
  - "short-circuit level / system strength hardware"
  - "convert retired thermal plants to condensers"
  - "voltage support equipment"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Not covered. The model is a linear optimal power flow / capacity-expansion
        LP (solve_network.py, network.optimize): there is no reactive power, no
        short-circuit calculation, and no inertia in the formulation, so a device
        whose entire value is reactive/inertial support has nothing to be paid for.
        The grid itself is built from OSM as Lines/Links/Transformers in
        base_network (transformers get only x, s_nom, type from the transformers
        config section); generators are active-power-only components attached in
        add_electricity. No script references synchronous condensers.
      mechanism: >
        Nearest mechanisms: conventional plants (which implicitly provide the
        services a condenser replaces) are attached from powerplantmatching in
        add_electricity via electricity.conventional_carriers; the operational
        reserve constraint (electricity.operational_reserve, solve_network.py
        add_operational_reserve_margin) is the only stability-adjacent constraint.
      not_covered: >
        The device itself, its capital cost recovery, reactive dispatch, inertia
        contribution, and retire-and-convert pathways for thermal plants.
      provenance: "scripts/solve_network.py:solve_network"
    levers:
      - key: electricity.conventional_carriers
        effect: "Which synchronous (rotating) generation technologies exist in the model — the implicit carriers of the services condensers provide."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers"
      - key: electricity.operational_reserve.activate
        effect: "Reserve-margin constraint — closest existing lever if the underlying user need is 'keep dispatchable capacity online'."
        default: "false"
        provenance: "scripts/solve_network.py:add_operational_reserve_margin"
    boundary:
      - variant: "Represent condenser investment cost in system totals"
        rung: L3
        note: "Add a costs-file row and a zero-energy component (or post-processing line item); without a constraint that values the service, the LP will never build it."
      - variant: "Minimum synchronous capacity online (condensers count toward it)"
        rung: L5
        note: "Custom constraint in solve_network's extra_functionality: per-snapshot floor on committed capacity of a labelled synchronous carrier set; condensers then enter as a cheap way to satisfy it. Bespoke Python plus a user-supplied requirement level."
      - variant: "Reactive power / voltage studies"
        rung: L5
        note: "Out of scope of the linearised LP; requires exporting the network to a power-flow tool."
    where:
      - change: "Custom synchronous-capacity constraint"
        anchor: "scripts/solve_network.py:extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
      - change: "Existing rotating plant fleet (what condensers would supplement)"
        anchor: "rule build_powerplants -> scripts/add_electricity.py (attach of conventional_carriers)"
        provenance: "config.default.yaml:conventional_carriers"
    data_dependencies:
      - input: "costs row for synchronous condenser CAPEX/FOM"
        required_for: "any costed representation"
        availability: "absent — must be added to the costs file"
      - input: "requirement level for synchronous capacity (per country/region)"
        required_for: "L5 constraint variant"
        availability: "absent — user-provided assumption"
