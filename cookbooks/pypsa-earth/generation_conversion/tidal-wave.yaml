id: tidal-wave
title: Tidal / wave (emerging)
summary: >-
  Marine renewables — tidal stream/range and wave energy converters — as
  variable-profile electricity generators.
when_to_use:
  - "tidal energy / tidal stream / tidal range"
  - "wave power / wave energy converters"
  - "marine renewables"
  - "ocean energy generation"
  - "add a new renewable technology with a custom profile"
models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >-
        Nothing — no tidal or wave carrier, resource chain, or cost handling exists
        (the only 'wave' hit in config is a plotting colour). Grounded absence. The
        machinery it is absent from is the GENERIC renewable-technology chain, which
        is technology-parametrised end to end: rule build_renewable_profiles runs per
        {technology} wildcard, reading config.renewable[technology] (cutout, atlite
        resource method, potentials, land/sea eligibility from copernicus/gebco/
        natura and the offshore_shapes regions) and writing
        profile_{technology}.nc; rule add_electricity takes profile_{tech} for every
        tech that is BOTH a key of the renewable config AND listed in
        electricity.renewable_carriers, and attach_wind_and_solar turns profiles into
        Generators (extendable via electricity.extendable_carriers.Generator).
      mechanism: >-
        None for tidal/wave specifically. The binding gap is upstream physics: the
        profile builder computes availability with atlite conversion methods
        (resource.method wind/pv/csp/hydro in the shipped config) — there is no
        tidal or wave method, so a new entry cannot be satisfied by config alone; the
        profile must come from a new producer.
      not_covered: >-
        Tidal currents/range and wave climate resources, marine-energy cost rows,
        device technology detail, and any eligibility layers specific to marine
        energy (shipping lanes etc. beyond what natura/gebco give).
      provenance: "scripts/build_renewable_profiles.py:filter_cutout_region"
    levers:
      - key: electricity.renewable_carriers
        effect: "A new technology name must be added here (and have a renewable.<tech> config section) for its profile to be requested and attached."
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro]"
        provenance: "config.default.yaml:renewable_carriers ; Snakefile:add_electricity"
      - key: electricity.extendable_carriers
        effect: "Add the new carrier under Generator to let the optimiser build capacity."
        default: "Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers ; scripts/add_electricity.py:attach_wind_and_solar"
    boundary:
      - variant: "Tidal/wave as a generator with an externally computed profile"
        rung: L4
        note: >-
          Needs rule plumbing, not just data: add renewable.tidal (cutout etc.) and
          the carrier to renewable_carriers/extendable_carriers, add a cost row, and
          provide profile_tidal.nc in the exact format of profile_{technology}.nc —
          but build_renewable_profiles will be invoked for the new wildcard and has
          no tidal method, so you must add a new/overriding rule (or a script branch)
          that produces the profile from your resource data.
      - variant: "Crude stand-in: site-specific tidal plants as conventional/custom powerplants with a fixed profile"
        rung: L3
        note: "Abuse electricity.custom_powerplants plus a p_max_pu time series set after the fact — data + post-processing, no new rule, but outside the renewable chain (no potentials)."
      - variant: "Native resource assessment (tidal currents / wave climate from a hydrodynamic dataset)"
        rung: L5
        note: "New conversion logic in build_renewable_profiles (an atlite-style method does not exist for tidal/wave) including marine eligibility handling."
    where:
      - change: "New technology config section + carrier lists"
        anchor: "config.default.yaml renewable: section (csp entry is the best template for a non-wind/solar tech) and electricity.renewable_carriers"
        provenance: "config.default.yaml:renewable_carriers"
      - change: "Profile production for the new wildcard"
        anchor: "Snakefile rule build_renewable_profiles (per-{technology} wildcard; inputs cutout, offshore_shapes, gebco, natura) and scripts/build_renewable_profiles.py"
        provenance: "Snakefile:build_renewable_profiles"
      - change: "Attaching the profile as Generators"
        anchor: "scripts/add_electricity.py function attach_wind_and_solar (consumes profile_{tech} inputs of rule add_electricity)"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar"
    data_dependencies:
      - input: "Tidal/wave resource time series or hydrodynamic model output for the target coast"
        required_for: "Any profile above the crude stand-in"
        availability: "absent — no cutout variable covers it; must be supplied"
      - input: "Marine-energy cost row (CAPEX/FOM/lifetime)"
        required_for: "All variants"
        availability: "absent — no tidal/wave row in the shipped cost data; add to the costs CSV"
      - input: "Offshore region shapes (regions_offshore.geojson) and bathymetry (gebco)"
        required_for: "Siting/eligibility of marine technologies"
        availability: "exists by default (built by the workflow)"
