id: utility-scale-solar-pv
title: Utility-scale solar PV
summary: Ground-mounted photovoltaic generation sited on eligible land, with weather-driven hourly output and land-availability-limited expansion potential.

when_to_use:
  - add solar power
  - add solar farms / solar parks
  - utility-scale PV
  - ground-mounted photovoltaics
  - increase / limit solar potential
  - change solar panel type or orientation
  - solar capacity factors look wrong
  - exclude protected areas or cities from solar siting
  - how much solar can this country build
  - "known in pypsa-eur as: solar, solar PV, solar-hsat"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Solar PV is a default renewable carrier ('solar' in electricity.renewable_carriers) and
        default extendable. Hourly per-bus capacity-factor profiles and installable potentials
        (p_nom_max) are computed by rule build_renewable_profiles from the ERA5 cutout with atlite,
        excluding land by Copernicus land-cover class and natura protected areas. Generators are
        attached per bus in add_electricity with existing capacity from powerplants.csv and
        country capacity gaps filled to IRENA statistics.
      mechanism: >
        rule build_renewable_profiles (technology wildcard 'solar', atlite pv method with
        panel/orientation from renewable.solar.resource, ExclusionContainer over copernicus
        grid codes + natura raster) writes profile_solar.nc with profile, p_nom_max, weight;
        attach_wind_and_solar in scripts/add_electricity.py then does n.madd("Generator", ...)
        with p_max_pu from the profile, p_nom_max from the potential, p_nom_extendable if
        'solar' is in electricity.extendable_carriers.Generator, and capital_cost from the
        technology-data costs file. NOTE: the default 'solar' capital cost is a blend of
        solar-rooftop and solar-utility weighted by costs.rooftop_share (load_costs in
        scripts/process_cost_data.py) — for pure utility-scale costing set rooftop_share to 0.
      not_covered: >
        No distinct rooftop vs utility split in the power-only chain (single blended 'solar'
        carrier; see rooftop-distributed-solar recipe); no tracking-type choice beyond the atlite
        panel/orientation settings; no sub-bus siting decisions (one aggregated generator per bus).
      provenance: "scripts/add_electricity.py:attach_wind_and_solar"

    levers:
      - key: electricity.renewable_carriers
        effect: "Include/exclude 'solar' as a modelled carrier; controls which profile files are built and attached."
        default: "[solar, onwind, offwind-ac, offwind-dc, hydro]"
        provenance: "config.default.yaml:renewable_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: "Whether solar capacity is optimisable (p_nom_extendable) beyond existing plants."
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers"
      - key: renewable.solar.capacity_per_sqkm
        effect: "MW installable per km2 of eligible land; linearly scales p_nom_max."
        default: "4.6"
        provenance: "scripts/build_renewable_profiles.py:capacity_per_sqkm"
      - key: renewable.solar.correction_factor
        effect: "Multiplier on the raw atlite capacity factor time series (calibration to observed full-load hours)."
        default: "0.854337"
        provenance: "scripts/build_renewable_profiles.py:correction_factor"
      - key: renewable.solar.copernicus.grid_codes
        effect: "Copernicus land-cover classes counted as eligible land for PV."
        default: "[20, 30, 40, 50, 60, 90, 100]"
        provenance: "scripts/build_renewable_profiles.py:grid_codes"
      - key: renewable.solar.natura
        effect: "If true, exclude natura protected-area raster cells from siting."
        default: "true"
        provenance: "scripts/build_renewable_profiles.py:natura"
      - key: renewable.solar.potential
        effect: "'simple' sums cell potentials; 'conservative' divides by max capacity factor — method for p_nom_max."
        default: "simple"
        provenance: "scripts/build_renewable_profiles.py:potential"
      - key: renewable.solar.resource.panel
        effect: "atlite panel model used for PV conversion."
        default: "CSi"
        provenance: "config.default.yaml:panel"
      - key: renewable.solar.resource.orientation
        effect: "Panel orientation; 'latitude_optimal' or explicit slope/azimuth."
        default: "latitude_optimal"
        provenance: "config.default.yaml:latitude_optimal"
      - key: renewable.solar.clip_p_max_pu
        effect: "Capacity factors below this are set to 0 (numerical clean-up)."
        default: "1.e-2"
        provenance: "scripts/build_renewable_profiles.py:clip_p_max_pu"
      - key: renewable.solar.cutout
        effect: "Which atlite cutout supplies weather data; 'auto' resolves to atlite.default."
        default: "auto"
        provenance: "scripts/_helpers.py:update_cutout_config"
      - key: costs.rooftop_share
        effect: "Weight of solar-rooftop vs solar-utility cost in the blended 'solar' capital cost; 0 = pure utility-scale cost."
        default: "0.14"
        provenance: "scripts/process_cost_data.py:rooftop_share"
      - key: costs.marginal_cost.solar
        effect: "Overwrites the marginal cost of solar in the costs table."
        default: "0.01"
        provenance: "scripts/process_cost_data.py:load_costs"
      - key: electricity.estimate_renewable_capacities
        effect: "Controls IRENA-based existing-capacity gap filling (stats/year/p_nom_min/p_nom_max) for solar."
        default: "stats: irena, year: 2023, p_nom_min: 1, p_nom_max: false"
        provenance: "scripts/add_electricity.py:get_irena_targets_for_carrier"

    boundary:
      - variant: "enable/disable solar or make it non-extendable"
        rung: L0
        note: "electricity.renewable_carriers and electricity.extendable_carriers.Generator."
      - variant: "change land-use density, eligible land classes, or protected-area exclusion"
        rung: L0
        note: "renewable.solar.capacity_per_sqkm / copernicus.grid_codes / natura."
      - variant: "fixed-tilt vs latitude-optimal panels, different panel technology"
        rung: L1
        note: "renewable.solar.resource.orientation (slope/azimuth dict) and resource.panel — atlite pv method options."
      - variant: "pure utility-scale cost basis (no rooftop blend)"
        rung: L1
        note: "set costs.rooftop_share: 0; capital cost becomes solar-utility only (load_costs)."
      - variant: "different weather year"
        rung: L3
        note: "needs a new ERA5 cutout: change snapshots and enable.build_cutout (CDS API) or retrieve a matching cutout; atlite.cutouts config."
      - variant: "country/region-specific max build limits"
        rung: L1
        note: "electricity.agg_p_nom_limits points to data/agg_p_nom_minmax.csv — config key plus editing that csv."
      - variant: "single-axis tracking as a separate competing carrier alongside fixed PV"
        rung: L3
        note: "add a new renewable.<name> block (atlite pv supports tracking via resource options) — the build_renewable_profiles rule is wildcarded over config['renewable'] keys and add_electricity auto-wires profile inputs for carriers in renewable_carriers; needs a costs row for the new carrier name in the costs csv (or costs overwrite)."
      - variant: "bespoke sub-bus siting or exclusion beyond raster criteria"
        rung: L5
        note: "no hook; would require custom logic in build_renewable_profiles."

    where:
      - change: "profile and potential computation (exclusions, resource method)"
        anchor: "rule build_renewable_profiles -> scripts/build_renewable_profiles.py"
        provenance: "Snakefile:rule build_renewable_profiles"
      - change: "generator attachment, costs, IRENA gap filling"
        anchor: "attach_wind_and_solar in scripts/add_electricity.py"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar"
      - change: "capital-cost blending / cost overwrites"
        anchor: "load_costs in scripts/process_cost_data.py"
        provenance: "scripts/process_cost_data.py:load_costs"
      - change: "new cutout for a different weather year"
        anchor: "rule build_cutout + atlite.cutouts config"
        provenance: "Snakefile:rule build_cutout"

    data_dependencies:
      - input: "ERA5 cutout (cutouts/<name>.nc, default cutout-2013-era5)"
        required_for: "all solar profiles"
        availability: "retrieved via enable.retrieve_cutout for supported regions; must be built via build_cutout (CDS API key) for other weather years"
      - input: "Copernicus land cover raster data/copernicus/PROBAV_LC100_global_v3.0.1_2019-nrt_Discrete-Classification-map_EPSG-4326.tif"
        required_for: "land eligibility exclusion"
        availability: "retrieved by databundle (enable.retrieve_databundle); global"
      - input: "natura.tiff exclusion raster"
        required_for: "protected-area exclusion (renewable.solar.natura)"
        availability: "pregenerated by default; rebuild via enable.build_natura_raster"
      - input: "powerplants.csv (powerplantmatching + OSM)"
        required_for: "existing solar capacity per bus"
        availability: "built by rule build_powerplants; coverage region-dependent"
      - input: "technology-data costs file resources/costs_<year>.csv (solar-utility, solar-rooftop rows)"
        required_for: "capital and marginal costs"
        availability: "retrieved by rule retrieve_cost_data (exists by default)"
      - input: "IRENA capacity statistics (via powerplantmatching)"
        required_for: "electricity.estimate_renewable_capacities gap filling"
        availability: "exists by default, years 2000-2023"
