id: waste-heat-recovery
title: Waste-heat recovery
summary: >
  Capturing industrial excess/waste heat and reusing it on-site or feeding it
  into district heating networks.

when_to_use:
  - "waste heat recovery"
  - "industrial excess heat"
  - "use factory waste heat for district heating"
  - "heat recovery from kilns / furnaces"
  - "excess heat to heat network"
  - "industrial heat integration"

models:
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}

    out_of_box:
      covers: >
        Nothing. Industry appears only as flat per-carrier demand loads
        (add_industry); no heat output from industrial processes exists that
        could be recovered. The only textual trace is the comment "assume
        enough local waste heat for CC" above the "process emissions CC" link —
        i.e. capture heat requirements are assumed free, not modelled. There is
        no Fischer-Tropsch/electrolysis waste-heat-to-district-heat option
        either (no such link in prepare_sector_network).
      mechanism: >
        add_industry attaches one-directional loads (gas/biomass/oil/coal/
        electricity/low-temperature heat); district heat buses ("urban central
        heat") are supplied only by heat pumps, resistive heaters, gas boilers,
        CHP and solar thermal in add_heat.
      not_covered: >
        No industrial excess-heat source, no waste-heat-to-DH link, no on-site
        heat cascading, no ORC power recovery. Waste-heat recovery can only be
        approximated exogenously by shrinking industry fuel rows and/or the
        "low-temperature heat" rows in the demand data, or endogenously only
        after writing a new component.
      provenance: "scripts/prepare_sector_network.py:add_industry"

    levers:
      - key: custom_data.industry_demand
        effect: "Route to encode on-site waste-heat reuse as reduced fuel/heat rows in the custom industry demand csv."
        default: "false"
        provenance: "config.default.yaml:industry_demand"
      - key: sector.enable.industry
        effect: "Gates the industry loads whose implied waste heat is at stake."
        default: "true"
        provenance: "config.default.yaml:industry"
      - key: sector.district_heating.potential
        effect: "Max district-heating share of urban demand — bounds how much recovered heat a DH feed-in could ever displace."
        default: "0.3"
        provenance: "config.default.yaml:district_heating"

    boundary:
      - variant: "on-site waste-heat reuse (lower net fuel/steam demand)"
        rung: L3
        note: >
          Exogenous: scale down the relevant industry columns'
          fuel and 'heat' rows via
          data/custom/industry_demand_{demand}_{planning_horizons}.csv
          (custom_data.industry_demand: true) or edit industry_base_totals in
          build_industry_demand.
      - variant: "fixed industrial excess-heat feed-in to district heating"
        rung: L2
        note: >
          Small localised addition in prepare_sector_network: a Generator or
          negative Load on the 'urban central heat' buses next to the existing
          supply in add_heat, sized from plant capacities in
          resources/industrial_database.csv.
      - variant: "endogenous waste-heat recovery (heat output coupled to industrial activity, competing with other DH supply)"
        rung: L5
        note: "industrial loads have no activity variable or heat output port; requires re-modelling industry demand as links with a heat by-product — bespoke Python."

    where:
      - change: "district-heat supply stack where recovered heat would feed in"
        anchor: "add_heat in prepare_sector_network ('urban central heat' bus technologies)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "the assumption that CC waste heat is free"
        anchor: "add_industry — comment above the 'process emissions CC' link"
        provenance: "scripts/prepare_sector_network.py:add_industry"
      - change: "industry demand rows to shrink (exogenous route)"
        anchor: "rule build_industry_demand — industry_base_totals; custom data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        provenance: "scripts/build_industry_demand.py:country_to_nodal"
      - change: "plant locations to size a feed-in"
        anchor: "rule build_industrial_database output resources/industrial_database.csv"
        provenance: "Snakefile:build_industrial_database"

    data_dependencies:
      - input: "data/demand/unsd/data/*.txt (UNSD energy balances)"
        required_for: "baseline industry fuel/heat rows being reduced"
        availability: "must be built; region-dependent"
      - input: "resources/industrial_database.csv (GEM/SFI plants)"
        required_for: "locating and sizing potential excess-heat sources"
        availability: "must be built (rule build_industrial_database); region-dependent coverage"
      - input: "data/custom/industry_demand_{demand}_{planning_horizons}.csv"
        required_for: "exogenous waste-heat savings"
        availability: "absent — user-supplied"
