schema_version: 2
id: locational-electricity-markets
title: Locational electricity markets
rank: 15
question: >
  Should electricity be priced by node, by zone, or nationally — and what would
  a market-zone reconfiguration change? For earth study regions this is the
  power-pool / market-reform variant of the EU bidding-zone question: prices,
  congestion rent, redispatch burden, siting signals, and who wins or loses.
when_to_use:
  - "nodal vs zonal vs national pricing comparison"
  - "market-zone split / reconfiguration study"
  - "how much redispatch does the current single zone cause"
  - "flow-based vs NTC cross-zonal capacity comparison"
  - "locational price spreads and congestion rent"
  - "investment-signal distortion from zonal averaging"

recipes:
  generation_conversion: [hv-transmission-lines, hvdc-interconnectors]
  demand: [electricity-load, demand-spatial-disaggregation]

methods:
  - id: investment-geography
    role: "where auctioned capacity lands WITHOUT locational signals — eta-blended
           sub-market siting of fixed country targets (cost-optimal vs even spread,
           Thomassen §3.2); run per market design so siting answers to the design"
  - id: flow-based-market-coupling
    role: "stage 1 — zonal clearing with zonal PTDFs on CNECs and hourly optimized
           GSKs (Thomassen §3.3), NTC and autarky runs bracketing it; the
           nodal/LMP design needs no stage 2"
  - id: redispatch
    role: "stage 2 — nodal repair of the FIXED zonal schedule, minimising remedial
           cost plus a volume penalty, cross-zonal countertrading capped at 30%
           (Thomassen §3.4). The stage-1/stage-2 wedge IS the answer to what the
           zonal design costs"
  - id: pathway-myopic
    role: "the timing dimension — sequential horizons with capacity carry-over, so
           market-design verdicts are made on the system the pathway builds, not
           on today's fleet"

defaults:
  - aspect: nodal-lmp-duals
    is: "LMPs and congestion rent fall out of any solved network's duals — bus
         marginal prices ARE locational prices at whatever resolution the network
         was clustered to"
    note: "no spec needed: nothing to change, so nothing to cite. The nodal
           benchmark of every comparison is a plain solve read through its duals"

gap_assessment: >
  The two-stage pipeline — eta-blended siting, flow-based zonal clearing, priced
  nodal redispatch — is verified end-to-end on earth, but two data facts bound
  it. First, earth ships no bidding-zone dataset and has no 'bz' clustering
  level: every market-relevant zone map is a user-authored custom busmap over
  GADM admin units (political, not market, boundaries), so the zone map — the
  study's dominant assumption, chosen before any solving — must be confirmed
  with the user, never assumed. Second, osm-grid data quality bounds how much
  to trust nodal price geography: a sparse OSM topology reports little
  congestion for the wrong reason, so gate the nodal stage on the country's
  data_quality scorecard. The compressed essay warnings apply unchanged: one
  nodal solve is not "the market after redispatch" (it is the efficient bound —
  Weber's shortcut deletes the wedge being asked about); the redispatch stage
  must minimise volume or weighted volume, never system cost, or it silently
  reports zonal pricing as free; NTC caps are the optimistic abstraction
  against flow-based. The named residual gap is the welfare split: the pipeline
  prices the wedge but does not extract who pays it — per-unit producer surplus
  and distributional risk-reward (Franken) and per-design consumer cost
  (Thomassen) remain post-processing, not a wired output.
coverage: partial
models:
  - model: pypsa-earth
