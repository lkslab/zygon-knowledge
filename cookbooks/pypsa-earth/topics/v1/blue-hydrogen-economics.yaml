gap_assessment: >
  Ready: "SMR" (grey) and "SMR CC" (blue) are in the DEFAULT production
  technology list, so blue hydrogen is investable out of the box, with coal
  gasification CC and other routes one config line away; colour accounting
  routes CC output to per-node blue-H2 buses and set_color_shares enforces a
  blue share of hydrogen load as a solve-time constraint; captured CO2 flows
  into the full sequestration chain. The breakeven study — sweep gas price,
  CO2 price, capture and electrolyser capex, read the blue/green split —
  is scenario-matrix work. Caveats that matter for economics: NO upstream
  methane supply-chain (fugitive) emissions, which is the crux of the
  blue-hydrogen climate debate — only combustion/process CO2 is counted; the
  capture rate is one global sector.cc_fraction shared by all CC technologies
  (a per-tech rate is a small documented code edit); no brownfield existing
  SMR fleet (greenfield extendable links only); and gas supply itself is
  nodal-unlimited at fuel price (no gas transmission constraints — see the
  gas-network dead key), so gas-delivery bottlenecks never bind.
