id: blue-hydrogen-economics
title: Blue hydrogen economics
rank: 58
question: >
  When does gas-with-capture hydrogen beat green electrolysis — at what gas
  price, capture cost, and CO2 constraint — and what does enforcing a blue
  share of national hydrogen supply cost? Central to Gulf "barrels to
  molecules" export strategies.
