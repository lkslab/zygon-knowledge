id: carbon-pricing-sensitivity
title: Carbon pricing sensitivity
rank: 83
question: >
  How does the mix, dispatch, emissions, and system cost respond to a CO2
  price — the switching price for coal-to-gas or fossil-to-clean, the
  abatement delivered per $/tCO2, and the shadow price a cap implies? ETS
  design, carbon-tax proposals, CBAM exposure all reduce to this sweep.
when_to_use:
  - "what does a carbon price of X do to the mix"
  - "carbon price sweep / abatement vs price curve"
  - "coal-to-gas switching price"
  - "shadow price of a CO2 cap"
  - "ETS or carbon-tax scenario for [country]"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants,
                          utility-scale-solar-pv]
  demand: [electricity-load]
functionality:
  - id: emission-pricing
    role: "core — Ep token adds the price to marginal costs by carrier emission factor"
  - id: co2-cap
    role: "the inverse question: the Co2L constraint's dual IS the shadow carbon price"
  - id: scenario-matrix
    role: "a list of Ep tokens in scenario.opts is the whole sweep"
  - id: carrier-attribute-scaling
    role: "fuel-cost sensitivities alongside (switching prices move with gas prices)"
  - id: nodal-marginal-prices
    role: "pass-through of the carbon price into electricity prices from duals"
  - id: summary-outputs
    role: "emissions, dispatch, and cost per run — the abatement-curve raw material"
gap_assessment: >
  Genuinely ready: carbon-price sensitivity is a one-token exercise —
  scenario.opts: [Ep25, Ep50, Ep100, ...] expands into parallel runs, the
  price enters every emitting carrier's marginal cost, and the summaries give
  emissions and cost per point, so price-vs-abatement curves and switching
  prices fall out of a single scenario list. The dual route works too: run
  with Co2L caps instead and read the CO2 constraint's shadow price, which is
  the marginal abatement cost the cap implies — the two directions
  cross-validate each other. Caveats are the model's usual ones, not
  pricing-specific: LP dispatch has no unit commitment, so coal responds to
  prices more smoothly than real must-run fleets do; the price applies to
  modelled combustion only (power-sector runs miss non-power emissions unless
  you use the sector chain); and demand never responds to the resulting
  electricity price (demand-elasticity is absent), so pass-through effects on
  consumption are outside scope.
coverage: ready
models:
  - model: pypsa-earth
