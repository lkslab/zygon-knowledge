id: climate-finance-eligibility-gco2-kwh
title: Climate-finance eligibility (gCO2/kWh)
rank: 38
question: >
  Does a plan keep grid carbon intensity under climate-finance thresholds
  (~100 gCO2/kWh for many MDB/JETP instruments) — and what is the cheapest
  expansion path that stays eligible? Models here feed directly into
  loan/grant eligibility for development-bank buyers.
when_to_use:
  - "grid carbon intensity trajectory (gCO2/kWh)"
  - "does the plan clear the 100 gCO2/kWh threshold"
  - "climate-finance / MDB eligibility screening"
  - "cheapest expansion path under an intensity cap"
  - "JETP-consistent power plan"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants,
                          utility-scale-solar-pv, onshore-wind,
                          conventional-hydropower, hvdc-interconnectors]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: carbon-intensity-metrics
    role: "core, partial — gCO2/kWh is a few lines of post-processing on the summaries, no native column"
  - id: co2-cap
    role: "enforce eligibility: set the annual budget to threshold x projected generation"
  - id: emission-pricing
    role: "carbon-price sensitivity as the softer policy alternative"
  - id: summary-outputs
    role: "emissions and generation by carrier — the inputs to the intensity calculation"
  - id: scenario-matrix
    role: "intensity trajectory across demand/policy scenarios"
  - id: myopic-foresight
    role: "year-by-year intensity path, not just an end-state number"
  - id: equity-self-sufficiency
    role: "attribute imports when interconnected neighbours have different intensities (EQ constraint as a lever)"
gap_assessment: >
  Substantively easy, mechanically slightly unfinished. Everything needed to
  compute average grid intensity exists — CO2 by carrier and generation
  totals in the summary outputs — but there is no native gCO2/kWh metric, so
  the headline number every financier asks for is a short post-processing
  step (and marginal intensity comes from the CO2-constraint dual).
  Enforcing eligibility works by translating the threshold into a Co2L
  budget (threshold x expected demand) — an approximation, since the cap
  fixes tonnes while the threshold ratios tonnes to realized generation;
  iterate once if generation shifts materially. Real gaps at the edges:
  accounting rules matter and are not modelled — imported power's embodied
  intensity across interconnectors, generation vs consumption basis, and
  average vs marginal all change eligibility, and the model gives you the
  raw material, not the rulebook. No uncertainty statement on the intensity
  estimate beyond scenario sweeps. Close to ready; scored partial for the
  missing native metric and accounting layer.
coverage: partial
models:
