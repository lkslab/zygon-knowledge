id: cooling-ac-peak-demand
title: Cooling / AC peak demand
rank: 49
question: >
  How fast does air-conditioning growth reshape peak demand, and can the system
  ride heat waves? India's "brutal cooling/AC peaks" are the defining framing:
  AC stock growth plus cooling degree days is becoming the peak driver across
  hot emerging economies.
when_to_use:
  - "AC demand growth scenario"
  - "cooling peak on hot days / heat-wave stress"
  - "cooling degree days in demand profiles"
  - "India-style evening AC peak study"
  - "district cooling options"
recipes:
  generation_conversion: [air-source-heat-pumps]
  demand: [space-cooling-demand, electricity-load, demand-temporal-profiles, industrial-process-cooling]
functionality:
  - id: weather-year-selection
    role: "cooling is implicit in the weather-year-matched base electricity profiles — pick a hot year deliberately"
  - id: safe-reserve-margin
    role: "deterministic peak-adequacy check under a scaled-up load"
  - id: load-shedding-voll
    role: "unserved-energy diagnosis when the (implicit) cooling peak binds"
  - id: demand-elasticity
    role: "absent — no price-responsive AC or cooling demand response"
  - id: scenario-matrix
    role: "load-growth scenarios via the demand wildcard as a crude AC-growth proxy"
gap_assessment: >
  Grounded absence as an end-use. There is no space-cooling or AC logic
  anywhere: build_heat_demand computes heating degree-days only,
  prepare_heat_data knows space/water HEATING, and no cooling carrier, load or
  config key exists (space-cooling-demand recipe, repo-wide grep). Cooling
  electricity is only implicit inside the GEGIS/DemandCast base profiles and
  UNSD electricity totals — present but unidentifiable, not separately
  scalable, and not consistently weather-driven for future scenarios. That
  means AC-growth studies can only scale total load (demand scenarios), which
  smears the growth across all hours instead of concentrating it in hot
  afternoons/evenings — precisely wrong for peak questions. Building the real
  thing: an L4 rule mirroring build_heat_demand (the installed atlite exposes
  cutout.cooling_demand, so the conversion exists upstream), plus L3 country
  cooling totals (absent from UNSD extraction) and AC-stock data, plus a load
  block in prepare_sector_network. District cooling and heat-pump
  reversibility have no analogue at all (L5).
coverage: gap
