id: curtailment-minimization
title: "Curtailment minimization"
rank: 12
question: >
  How much VRE gets curtailed, where and why (grid vs surplus), and what mix
  of transmission, storage, and flexible loads absorbs it cheapest? The
  cost-of-not-building-the-grid framing (congestion + curtailment) is central
  to TSO and regulator debates from TYNDP to REZ planning.
when_to_use:
  - "how much wind/solar is being curtailed and why"
  - "grid vs storage vs electrolysers to soak up surplus"
  - "curtailment cost of delayed transmission"
  - "where do zero-price hours cluster"
  - "value of flexible P2X loads for surplus absorption"
recipes:
  generation_conversion: [grid-scale-batteries, hv-transmission-lines,
                          hvdc-interconnectors, electrolysers,
                          dynamic-line-rating-facts]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: summary-outputs
    role: "core — curtailment per carrier is reported directly in the summary tables"
  - id: transmission-expansion-limits
    role: "sweep lv/lc to trace the grid-vs-curtailment trade-off (constrained counterfactual)"
  - id: nodal-marginal-prices
    role: "zero/near-zero duals locate and time-stamp surplus; congestion rent from line duals"
  - id: spatial-clustering
    role: "curtailment concentrates at network bottlenecks — too-coarse zones average it away"
  - id: sector-coupled-workflow
    role: "electrolysers, heat, and EVs as endogenous surplus sinks in the sector chain"
  - id: carrier-attribute-scaling
    role: "storage/VRE cost sensitivities to test which absorber wins"
  - id: unit-commitment
    role: "must-run inflexibility that drives real-world curtailment is not modelled (LP relaxation)"
gap_assessment: >
  Strong core: curtailment is an endogenous outcome of the LP and is reported
  per carrier in the summaries, so the standard study — quantify curtailment
  under a constrained grid, then let transmission/storage/electrolysers
  expand and watch it fall — runs out of the box, with nodal duals locating
  the binding corridors. Honest limits: (1) modelled curtailment is purely
  economic; real-world drivers like must-run thermal minimum load, ramping,
  and negative-price bidding are absent (no unit commitment data, no market
  bids), so the model tends to understate curtailment on inflexible systems;
  (2) operational curtailment on a fixed fleet needs a dispatch-only solve,
  which is not wired in (assembly required); (3) sub-hourly effects vanish
  at hourly resolution. Grid data quality varies by country — check the
  osm-grid data_quality scorecard before trusting bottleneck locations.
coverage: ready
models:
  - model: pypsa-earth
