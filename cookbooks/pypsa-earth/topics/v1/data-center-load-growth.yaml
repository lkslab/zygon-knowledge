gap_assessment: >
  There is no data-center load category anywhere in the model: demand is
  built top-down from national statistics disaggregated by population/GDP
  (see the demand book), so a hyperscale campus — large, flat, point-sited —
  has no native representation. The honest workaround is manual: scale
  national demand via load_options for the aggregate effect, or add a
  constant Load at a chosen bus by editing the network, then let the
  standard workflow answer the system questions (capacity, grid, prices,
  adequacy) — which it does well once the load exists. What you cannot get
  without real code: data-center-specific profiles and flexibility
  (curtailable training load), 24/7 carbon-free-energy matching constraints
  (h2-color-accounting is the nearest analogue, for H2 only), and any
  siting logic that trades land/fiber/water against grid headroom. Demand
  baselines in candidate host countries are often the weakest input — check
  the data_quality electricity-demand and demand-growth-cagr grades before
  trusting growth scenarios built on them.
