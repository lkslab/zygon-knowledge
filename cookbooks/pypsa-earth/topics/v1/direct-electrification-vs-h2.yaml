id: direct-electrification-vs-h2
title: "Direct electrification vs H2"
rank: 78
question: >
  Which end-uses justify hydrogen and which should electrify directly — heat
  pumps vs H2 boilers, battery trucks vs fuel cells, electric process heat vs
  H2 furnaces? The defining sector-coupling question of the post-hype era:
  "where does hydrogen actually make sense".
when_to_use:
  - "hydrogen vs direct electrification by sector"
  - "heat pumps vs hydrogen heating"
  - "battery vs fuel-cell trucks"
  - "efficiency penalty of the hydrogen route"
  - "merit order of hydrogen end-uses"
recipes:
  generation_conversion: [air-source-heat-pumps, electric-process-heat,
                          electric-heavy-trucks, hydrogen-fuel-cell-trucks,
                          h2-dri-steel, electrolysers]
  demand: [land-transport-demand, industrial-process-heat-temperature-bands,
           residential-space-heating-demand]
functionality:
  - id: sector-coupled-workflow
    role: "core — electricity and H2 routes compete for the same supply in one LP"
  - id: co2-cap
    role: "the carbon budget is what forces the choice between routes"
  - id: h2-pipeline-routing
    role: "H2 delivery cost vs grid delivery cost shapes the spatial answer"
  - id: distribution-grid-lv
    role: "electrified heat/transport pays a distribution-grid reinforcement cost"
  - id: bev-dsm-v2g
    role: "flexibility credit of the electric route (EVs shift; H2 trucks do not)"
  - id: carrier-attribute-scaling
    role: "sweep electrolyser/heat-pump cost assumptions the answer hinges on"
  - id: scenario-matrix
    role: "transport and heating shares are swept as scenarios, not optimized"
gap_assessment: >
  Strong, with one structural nuance. The supply side of the question is
  fully endogenous: both routes draw on one co-optimized system, so the
  electrolysis efficiency penalty, when-is-power-cheap economics, H2
  transport and storage costs, and the carbon budget jointly decide which
  route serves flexible margins — heat supply per node (heat pump vs gas vs
  H2-adjacent options) is chosen by the optimizer. The nuance: end-use
  shares in transport are exogenous config knobs
  (land_transport_electric_share / fuel_cell_share per horizon), and
  industry demand arrives as fixed per-carrier loads from the demand
  scenario — so for those sectors the model prices route choices you posit
  rather than making them; the honest study design is a scenario matrix over
  share combinations, comparing total system cost. That is standard practice
  for this question and well supported. Endogenizing the transport/industry
  route choice itself (demand as a multi-input link) is a code extension.
