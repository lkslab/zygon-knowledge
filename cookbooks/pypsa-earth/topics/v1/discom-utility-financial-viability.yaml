id: discom-utility-financial-viability
title: DISCOM / utility financial viability
rank: 39
question: >
  Is the utility financially viable under a given expansion plan — do tariffs
  cover procurement cost plus losses, how do rooftop PV defection and
  subsidized agricultural load erode revenue, and what does DISCOM distress
  feed back into what is actually buildable? India's binding constraint.
when_to_use:
  - "DISCOM financial distress / cost-recovery study"
  - "does the utility's revenue cover its power purchase cost"
  - "rooftop solar revenue erosion for the utility"
  - "losses and subsidized load in the utility balance"
  - "bankability feedback on the expansion plan"
recipes:
  generation_conversion: [rooftop-distributed-solar, utility-scale-solar-pv,
                          grid-scale-batteries]
  demand: [electricity-distribution-losses, electricity-load,
           residential-electricity-demand, agriculture-energy-demand]
functionality:
  - id: financial-viability-actors
    role: "the missing core — no utility actor, tariffs, revenue, or balance sheet"
  - id: nodal-marginal-prices
    role: "nearest proxy: system prices as the utility's procurement-cost benchmark"
  - id: demand-elasticity
    role: "absent — no tariff-driven consumption or defection response"
  - id: summary-outputs
    role: "system cost and energy volumes — the raw inputs to an offline viability calculation"
  - id: discount-rate-dimension
    role: "one social discount rate; no actor-specific WACC or credit constraint"
  - id: distribution-grid-lv
    role: "rooftop PV behind the meter — the volumes that bypass utility sales (sector runs)"
gap_assessment: >
  Out of scope for a single-social-planner model: pypsa-earth has no actors,
  so there is no utility that buys wholesale, sells at regulated tariffs,
  eats technical and commercial losses, and goes insolvent — the entire
  causal chain of the DISCOM question (financial-viability-actors absent).
  What the model contributes is one honest input: the cost side.
  Nodal/zonal marginal prices give a procurement-cost benchmark, summary
  outputs give volumes, distribution losses are representable on the demand
  side, and rooftop PV in sector runs quantifies the energy that bypasses
  utility sales. A viability assessment is then an offline spreadsheet —
  model procurement cost vs assumed tariff schedule and collection rates —
  with no feedback: the model cannot make DISCOM distress constrain what
  gets built (its financing appears nowhere), cannot price cross-subsidies,
  and cannot endogenize defection since demand is price-inelastic. Treat
  pypsa-earth as the cost engine inside a separate utility-finance model,
  not as an answer to this topic.
coverage: gap
models:
  - model: pypsa-earth
