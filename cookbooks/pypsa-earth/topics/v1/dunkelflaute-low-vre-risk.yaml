id: dunkelflaute-low-vre-risk
title: "Dunkelflaute / low-VRE risk"
rank: 14
question: >
  What happens in a multi-day cold, dark, still spell — how deep and long are
  the worst wind+solar droughts, what firm capacity or storage bridges them,
  and at what cost of unserved energy? The defining adequacy fear of
  high-VRE systems, coincident with heating peaks in winter climates.
when_to_use:
  - "worst-case wind drought / dunkelflaute stress test"
  - "how long must storage or backup bridge a low-VRE spell"
  - "cold-snap plus wind-lull coincidence with heat demand"
  - "unserved energy risk at high renewable shares"
  - "which weather year is the system-stress year"
recipes:
  generation_conversion: [gas-power-plants, long-duration-storage,
                          hydrogen-storage-salt-caverns, stationary-fuel-cells]
  demand: [electricity-load, residential-space-heating-demand]
functionality:
  - id: weather-year-selection
    role: "core — pick known dunkelflaute years (cutout + demand weather year consistently)"
  - id: scenario-matrix
    role: "weather-year sweep as parallel runs; compare firm capacity and shedding across years"
  - id: load-shedding-voll
    role: "VOLL slack quantifies unserved energy in the stress year instead of infeasibility"
  - id: time-segmentation-tsam
    role: "nSEG segmentation preserves the extreme spell when coarsening; uniform nH can smear it"
  - id: safe-reserve-margin
    role: "deterministic firm-capacity floor as the adequacy backstop"
  - id: multi-weather-year
    role: "capacity choices robust across all years in ONE solve — absent"
  - id: probabilistic-adequacy
    role: "no LOLE/EUE or outage draws; adequacy stays deterministic"
  - id: sector-coupled-workflow
    role: "heat electrification makes the cold snap a demand spike too — only visible sector-coupled"
gap_assessment: >
  Workable but manual: with a chosen stress weather year, hourly chronology,
  VOLL load shedding, and TSAM segmentation that keeps extremes, the model
  answers "does this system survive the 2012-style dunkelflaute and what
  does bridging it cost" — and the sector chain adds the crucial
  heat-demand coincidence. The structural gap is that each optimization sees
  exactly one weather year: there is no multi-year solve, so capacity sized
  on a mild year silently fails a harsh one, and robustness must be
  assembled by hand (sweep years via the scenario matrix, take the envelope,
  or re-dispatch a fixed system against other years — itself unwired, see
  operations-only-solve). No probabilistic adequacy metrics (LOLE/EUE) and
  no forced outages, so results are weather stress tests, not reliability
  statistics.
coverage: partial
