id: energy-affordability-equity
title: Energy affordability / equity
rank: 93
question: >
  Who pays for the transition — how do system costs and prices fall on
  regions and households, and does decarbonization stay affordable? High
  social need with a weak paying buyer; strong in the NGO/academic and
  development-finance space.
when_to_use:
  - "distributional impact of the transition"
  - "electricity prices by region / who pays"
  - "affordability of a decarbonization pathway"
  - "energy poverty in system scenarios"
  - "equity framing of system-cost results"
recipes:
  generation_conversion: [solar-home-systems, clean-cookstoves]
  demand: [electricity-load, residential-electricity-demand,
           demand-spatial-disaggregation, cooking-energy-demand]
functionality:
  - id: nodal-marginal-prices
    role: "the one distributional signal — price incidence by node, aggregable to any zone"
  - id: gadm-admin-clustering
    role: "report costs/prices on the admin units the equity question is asked about"
  - id: equity-self-sufficiency
    role: "EQ constraint is inter-COUNTRY production equity — not household equity, despite the name"
  - id: load-shedding-voll
    role: "unserved energy by node is a crude deprivation signal"
  - id: demand-elasticity
    role: "absent — fixed loads mean no affordability feedback on consumption"
  - id: financial-viability-actors
    role: "the missing core — no households, tariffs, income groups, or actor-level costs"
gap_assessment: >
  pypsa-earth is a single social planner minimizing total system cost: there
  are no households, income groups, tariffs, or subsidy flows, so
  distributional questions cannot be answered inside the model. What it does
  supply is the price side of incidence: nodal marginal prices from duals,
  demand-weighted to zones, and GADM clustering aligns those zones with real
  jurisdictions; WorldPop/GDP-based load disaggregation gives a spatial
  demand map to weight against. The EQ opts token enforces national
  self-sufficiency shares — an equity constraint between countries, not
  within them. A defensible affordability study is therefore post-processing:
  scenario price/cost deltas by admin region crossed with external income
  and expenditure data. Household-level burden, tariff design, and energy
  poverty metrics all live outside the model (financial-viability-actors is
  absent outright).
coverage: gap
models:
  - model: pypsa-earth
