id: green-h2-export-cost-benchmarking
title: "Green-H2 export cost benchmarking"
rank: 77
question: >
  At what delivered cost can a country export green hydrogen, how does that
  cost move with export volume, and can it compete with the Gulf, Chile, and
  Australia? The "from barrels to molecules" question — Gulf diversification,
  African/Latin American export hubs, EU import benchmarks.
when_to_use:
  - "levelized cost of exported green hydrogen"
  - "H2 export supply curve vs volume"
  - "can my country compete with NEOM / Chile / Australia"
  - "export volume vs domestic decarbonization trade-off"
  - "RE matching rules on exported hydrogen"
recipes:
  generation_conversion: [green-hydrogen, electrolysers, green-ammonia,
                          hydrogen-storage-salt-caverns]
  demand: [hydrogen-export-demand, electricity-load]
functionality:
  - id: h2-export-chain
    role: "core — export bus at ports, exogenous TWh wildcard or endogenous volume against a price"
  - id: scenario-matrix
    role: "the h2export volume list sweeps out the export supply-cost curve"
  - id: h2-color-accounting
    role: "green-share and temporal-matching constraints mirror importer certification rules"
  - id: h2-pipeline-routing
    role: "domestic H2 transport from renewable sites to export ports"
  - id: sector-coupled-workflow
    role: "exports compete with domestic power/heat/industry demand for the same renewables"
  - id: summary-outputs
    role: "cost decomposition (RE, electrolysis, storage, transport) behind the benchmark number"
gap_assessment: >
  The model's showcase. The export chain is first-class: H2 buses at real
  ports feed an export bus with optional buffer storage, demand is either a
  swept exogenous volume (flat or ship-batch profile) or endogenous against
  an assumed world price, and RE temporal-matching/additionality constraints
  reproduce importer certification rules — all while the exporting system's
  own demand, grid, and decarbonization are co-optimized, which is exactly
  what pure LCOH spreadsheets miss. The volume sweep yields a genuine
  marginal-cost-of-export curve. Residual limits to keep in the caveats
  section of any benchmark: a single aggregate export bus (no
  per-destination shipping costs or market prices, so "delivered to
  Rotterdam vs Japan" needs post-processing), hydrogen only (ammonia or
  methanol export carriers are an L4 extension — mirror add_export), and a
  deterministic ship schedule. For cross-country league tables, run the same
  configuration per candidate exporter.
coverage: ready
