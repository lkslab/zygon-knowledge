id: grid-congestion-redispatch
title: "Grid congestion / redispatch"
rank: 16
question: >
  Where does the grid bind, what does congestion cost, and how much
  redispatch (and curtailment) does it force? Redispatch bills in the
  billions (DE, GB) make this a headline TSO/regulator question — the
  operational face of the transmission bottleneck.
when_to_use:
  - "where are the binding lines / congested corridors"
  - "congestion cost and congestion rent quantification"
  - "redispatch volume and cost estimation"
  - "which reinforcements relieve congestion cheapest"
  - "storage or DLR as congestion relief"
recipes:
  generation_conversion: [hv-transmission-lines, hvdc-interconnectors,
                          dynamic-line-rating-facts, grid-scale-batteries]
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: nodal-marginal-prices
    role: "core — congested lines carry non-zero duals; congestion rent and price spreads directly"
  - id: transmission-expansion-limits
    role: "congested (lv1.0) vs expanded runs price the cost of not building"
  - id: line-security-margin
    role: "s_max_pu 0.7 is the only reliability margin — congestion is against derated limits"
  - id: contingency-scopf
    role: "true N-1 security-constrained OPF, the TSO-grade congestion tool, is absent"
  - id: operations-only-solve
    role: "redispatch = re-dispatch of a fixed system; no dispatch-only or two-stage run wired in"
  - id: spatial-clustering
    role: "congestion analysis needs near-full topology; clustering hides intra-zonal binding lines"
  - id: unit-commitment
    role: "redispatch costs hinge on start-up/min-load, which the LP relaxation lacks"
  - id: network-plots
    role: "line-loading maps to visualize where flows saturate"
gap_assessment: >
  Congestion identification and pricing work: solve near full OSM topology
  with a fixed grid and line loadings, duals, and congestion rents show
  exactly where and when the network binds, and reinforcement candidates
  are ranked by re-running with expansion enabled. Redispatch proper does
  not exist: it requires a two-stage setup (zonal/market dispatch, then
  feasibility-restoring re-dispatch against the physical grid) plus
  start-up/min-load costs — none of which is wired in (no dispatch-only
  rule, no unit commitment data, no N-1 constraints), so redispatch volumes
  and costs can only be approximated by manually chaining a coarse-zone run
  with a nodal re-solve at fixed capacities. Corridor-level trust also
  depends on per-country OSM grid quality — check the data_quality
  scorecard first.
coverage: partial
models:
