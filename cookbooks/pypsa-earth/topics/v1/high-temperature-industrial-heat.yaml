gap_assessment: >
  No temperature bands, no endogenous switching. Industrial heat above the
  district-heating level is invisible as heat: it is embedded in fixed "gas for
  industry" / coal / oil / biomass loads from UNSD balances, and the model
  never knows the temperature that fuel delivers (pypsa-eur's heat100-200 /
  200-500 / >500 carriers have no counterpart here — the temperature-bands
  demand recipe documents the full contrast). Only the low-temperature slice
  is endogenous: a flat "low-temperature heat for industry" load on urban
  central heat buses, where heat pumps (COP built for 55C sink — not process
  temperatures), resistive heaters, boilers, CHP and water tanks compete.
  There is no industrial high-temperature heat pump, electric furnace or H2
  furnace technology; the residential/services fuel-shift levers explicitly
  skip industry. Electrification of process heat is an L3 exogenous edit
  (custom_data.industry_demand csv moving fuel MWh into electricity rows),
  after which the power system responds endogenously. Fuel-CC links are the
  only in-model abatement for the high-T fuel loads.
