id: methane-gas-phase-down
title: Methane / gas phase-down
rank: 97
question: >
  How fast can gas use decline, what replaces it across power, heat, and
  industry, and how do methane leaks change the climate case for gas?
  Post-2022 security-of-supply legacy plus the Global Methane Pledge.
when_to_use:
  - "gas phase-down pathway"
  - "cap or price natural gas consumption"
  - "what replaces gas in power / heat / industry"
  - "methane leakage in the emissions accounting"
  - "green gas substitution for fossil gas"
recipes:
  generation_conversion: [methane-abatement, gas-power-plants,
                          natural-gas-pipelines, e-sng,
                          biogas-anaerobic-digestion]
  demand: []
functionality:
  - id: gas-usage-limit
    role: "core — CH4L opts token caps total gas-fired dispatch as a declining budget"
  - id: co2-cap
    role: "Co2L squeezes gas out on combustion emissions alone"
  - id: emission-pricing
    role: "Ep prices gas by its CO2 intensity — the carbon-price route to phase-down"
  - id: fleet-retirement-filter
    role: "retire gas plant vintages by date query"
  - id: gas-network-links
    role: "dead key — pipelines are clustered but never built, gas supply is nodal-unlimited"
gap_assessment: >
  The phase-down half works: the CH4L token caps total gas consumption
  (note the numberless variant needs the electricity.gaslimit key, absent
  from the default config), Co2L/Ep price gas down, sector runs track gas
  across power, heat, and industry so substitution (heat pumps,
  electrification, H2) is endogenous, and e-SNG plus biogas upgrading feed
  the same gas bus as green substitutes. The methane half is the hole:
  emissions accounting is CO2-only and combustion-only — no CH4 species,
  no leak rates by supply route, no venting/flaring, no abatement cost
  curves (LDAR etc.). The methane-abatement recipe documents the standard
  workaround: inflate the gas 'CO2 intensity' cost row to a CO2-equivalent
  value so every gas-consuming link carries a GWP-weighted leakage penalty
  — with the caveat that CC capture terms read the same number. Gas
  infrastructure cannot be phased down either: sector.gas.network is a dead
  key, so there are no gas transport assets to retire.
coverage: partial
