id: model-reproducibility
title: Model reproducibility
rank: 87
question: >
  Can someone else (or you, next year) rerun the study and get the same
  numbers — pinned environment, declared data provenance, config-as-code run
  definitions? The transparency push (EU, academia, dev banks) that favors
  auditable open models over black-box consultancy tools.
when_to_use:
  - "make this study rerunnable / auditable"
  - "pin the environment and data versions"
  - "same config, same result — why do numbers differ"
  - "open, transparent alternative to black-box tools"
  - "archive a run for review or publication"
recipes:
  generation_conversion: []
  demand: []
functionality:
  - id: scenario-matrix
    role: "core — the run IS the config: every wildcard and option lives in yaml under version control"
  - id: solver-choice
    role: "solver + options declared in config; solver version pinned by the lockfile"
  - id: numeric-stability-options
    role: "caveat lever — noisy_costs perturbs costs to break degeneracy; disable for bit-repeatability"
  - id: iterative-impedance-expansion
    role: "iteration counts fixed in config, so the solve sequence is declared too"
  - id: summary-outputs
    role: "canonical result tables to diff between reruns"
  - id: solve-statistics
    role: "per-run topology/computation metrics — the audit trail across runs"
gap_assessment: >
  Strong by construction: a pypsa-earth study is a Snakemake DAG driven
  entirely by yaml config — deterministic rules from data retrieval to solved
  network, with every scenario dimension a declared wildcard — and this repo
  pins the full software stack (Python, solvers, geo libraries) in pixi.lock,
  so "clone, pixi install, snakemake" reproduces the environment exactly.
  Honest residuals: upstream data sources are retrieved live, and OSM extracts
  or GADM versions can drift between retrieval dates, so archive the data
  bundle (or record retrieval dates) alongside the config for true
  rerunnability; noisy_costs deliberately adds small random cost perturbations
  for numerical hygiene, and LP solutions can be degenerate, so identical
  objectives may hide slightly different capacity splits across solver
  versions or thread counts — fix seeds/options or disable noise when
  bit-level repeatability matters more than solve robustness. Within one
  pinned environment and archived inputs, reruns reproduce.
coverage: ready
models:
