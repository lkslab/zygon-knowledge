gap_assessment: >
  Read the topic two ways. Internal multi-sector coupling is a strength:
  pypsa-earth's sector chain puts electricity, heating, land transport,
  industry, shipping, aviation, and the H2/fuel layer into a single
  co-optimized network — hard-linked coupling with hourly chronology, which
  is exactly what most "couple our sector models" projects are trying to
  approximate (gas is the weak sector: no pipeline network, nodal-unlimited
  supply). External model coupling is the gap: there are no built interfaces
  to OSeMOSYS/TIMES-style planning models, no macro-economic feedback, no
  harness for iterating with a demand or land-use model — coupling today
  means files: exogenous demands, fuel prices, and capacity constraints enter
  via config/csv (CCL limits, custom demand inputs), and solved networks
  export as netCDF/csv for downstream models. That soft-linking works and is
  how dev-bank tool chains actually operate, but every exchange schema and
  convergence loop is yours to build; nothing in the model speaks another
  model's format natively.
