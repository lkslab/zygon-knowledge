id: multi-sector-model-coupling
title: Multi-sector model coupling
rank: 90
question: >
  How do power, heat, transport, industry, and fuels get modelled together —
  inside one optimization, or by stitching separate models (OSeMOSYS, TIMES,
  macro/economic models) into a chain? The interoperability pain the
  community names alongside speed and data.
