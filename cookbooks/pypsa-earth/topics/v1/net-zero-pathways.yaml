id: net-zero-pathways
title: Net-zero pathways
rank: 9
question: >
  What is the least-cost path to net zero by 2040/2050 — which scenario
  family (electrification-led, hydrogen-led, efficiency-led) wins, what
  gets built when, and what is robust across deep uncertainty? The umbrella
  deliverable most governments, TSOs, and consultancies ultimately buy.
when_to_use:
  - "net-zero pathway for [country] by [year]"
  - "decarbonization scenario study / NDC analysis"
  - "electrification-led vs hydrogen-led contrast"
  - "carbon budget or carbon price trajectory runs"
  - "what to build this decade vs next"
recipes:
  generation_conversion: [green-hydrogen, coal-power-plants, beccs, direct-air-capture]
  demand: [demand-scenarios-and-growth, electricity-load, land-transport-demand,
           residential-space-heating-demand]
functionality:
  - id: co2-cap
    role: "core — Co2L budget per horizon defines the pathway constraint"
  - id: emission-pricing
    role: "carbon-price runs (Ep) as the policy-sensitivity axis"
  - id: sector-coupled-workflow
    role: "net zero is a whole-economy claim — heat/transport/industry/fuels"
  - id: myopic-foresight
    role: "sequential horizons with carry-forward; partial, sector chain only"
  - id: existing-baseyear-brownfield
    role: "seeds today's fleet with build years; heating part commented out"
  - id: fleet-retirement-filter
    role: "coal/gas phase-out dates as a pandas query"
  - id: scenario-matrix
    role: "scenario families as combinatorial run lists"
  - id: mga-near-optimal
    role: "robustness across near-optimal alternatives — absent"
gap_assessment: >
  Overnight net-zero snapshots are fully standard: a sector-coupled run
  with a tight Co2L cap answers "what does net-zero [year] look like" for
  any country, including hydrogen, CCS/DAC, and negative emissions — and
  scenario families are just opts/demand lists. The transition itself is
  weaker: the myopic multi-horizon chain (planning_horizons + brownfield
  carry-forward) exists but is partial — less battle-tested than overnight,
  brownfield heating is commented out, and there is no perfect-foresight
  multi-period optimization, so "what to build this decade" inherits
  myopia's known distortions. Robustness language should be modest:
  scenario sweeps and (off-by-default) Monte Carlo exist, MGA/near-optimal
  exploration does not, so "robust across uncertainty" means "consistent
  across the scenarios we ran". Distributional and equity questions are out
  of scope (single planner, one discount rate). Sector-demand baselines
  gate credibility for whole-economy claims — check the data_quality
  sector-demand and demand-growth-cagr grades before promising a national
  pathway.
coverage: partial
models:
  - model: pypsa-earth
