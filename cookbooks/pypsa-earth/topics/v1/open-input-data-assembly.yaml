id: open-input-data-assembly
title: Open input-data assembly
rank: 86
question: >
  Where do consistent, open, country-resolved inputs — grid topology, plant
  fleet, demand, weather, shapes, costs — come from, and how trustworthy are
  they per country? The perennial time-sink the modelling community ranks
  among its top pains, and the problem pypsa-earth was built to solve.
when_to_use:
  - "get model-ready input data for [country]"
  - "open data pipeline for grid / fleet / demand / weather"
  - "how good is the input data for country X"
  - "avoid hand-assembling planning-study inputs"
  - "reproducible data provenance for a study"
recipes:
  generation_conversion: []
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: gadm-admin-clustering
    role: "GADM shapes retrieved and wired as the admin-zoning basis everywhere"
  - id: weather-year-selection
    role: "ERA5/SARAH atlite cutouts — the weather layer behind every profile"
  - id: hydro-inflow-normalization
    role: "raw reanalysis calibrated to IRENA/EIA statistics, not used blind"
  - id: fleet-retirement-filter
    role: "powerplantmatching fleet arrives queryable (dates, techs) per country"
  - id: spatial-clustering
    role: "assembled data re-aggregates consistently to any study resolution"
  - id: solve-statistics
    role: "measured build evidence (topology, fragmentation) per assembled region"
gap_assessment: >
  This is pypsa-earth's raison d'être and it is ready: the Snakemake retrieve
  and build rules pull OSM grid extracts (earth-osm), GADM boundaries,
  WorldPop/GDP rasters, powerplantmatching fleets, UNSD energy balances,
  atlite cutouts, and technology costs automatically for any of ~190
  countries, and every downstream rule consumes only these — no hand-curated
  national files required to get a running model. The honest question is not
  whether data arrives but how good it is where you are, and that is exactly
  what the data_quality book exists for: datasets.yaml registers every
  country-resolved source with its consumer and missing-country behavior, and
  the generated countries/<ISO2>.yaml scorecards grade each dataset A-D per
  country — C (silent proxy fallback, e.g. German BDEW/traffic profiles
  applied globally) and D (feature silently disappears) are the tiers that
  bite. Wire any assembly task to that book first: assembly is automated,
  fitness-for-purpose is per-country and must be checked, not assumed.
coverage: ready
models:
  - model: pypsa-earth
