gap_assessment: >
  Demand-side aggregate, exogenous switching. Steel exists as UNSD "iron and
  steel" final energy per carrier, grown by CAGR and sited at Global Steel
  Plant Tracker locations; "H2 for industry" loads are first-class and the H2
  supply side (electrolysis vs SMR vs SMR CC, pipelines, storage) is fully
  endogenous. But default industrial H2 demand is ZERO — the UNSD carrier
  mapping has no hydrogen commodity, so the row is zero-filled — and there is
  no DRI process component, no BF-BOF vs H2-DRI investment choice, no
  iron-ore/scrap layer. Imposing H2-DRI is an L3 data edit: supply
  data/custom/industry_demand_{demand}_{planning_horizons}.csv with steel
  coal/gas moved into hydrogen + EAF electricity rows
  (custom_data.industry_demand: true), and cut the steel process-emission
  factor (0.025 tCO2/t in build_industry_demand). Once imposed, the system
  response — electrolyser siting, H2 network, renewables build — is exactly
  what the model optimizes well. Endogenous route choice is L5 bespoke work.
