id: storage-revenue-stacking
title: Storage revenue stacking
rank: 69
question: >
  What does a storage asset earn across stacked revenue streams — energy
  arbitrage, capacity payments, ancillary services, congestion — and does
  the business case close? The storage-investor question; arbitrage alone
  rarely carries a project.
when_to_use:
  - "business case / revenue stack for a battery"
  - "storage earnings beyond energy arbitrage"
  - "capacity market plus ancillary revenue for storage"
  - "merchant storage investment case"
  - "how storage revenue shifts as VRE share rises"
recipes:
  generation_conversion: [grid-scale-batteries, pumped-hydro-storage,
                          long-duration-storage, iron-air-batteries]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: nodal-marginal-prices
    role: "arbitrage revenue: storage dispatch valued at nodal duals — the one stream that works"
  - id: market-design-mechanisms
    role: "absent — no capacity remuneration, ancillary products, or settlement to stack"
  - id: operational-reserves
    role: "reserve-constraint duals give a shadow price for the reserve stream, unremunerated"
  - id: safe-reserve-margin
    role: "adequacy contribution is a constraint, not a capacity payment"
  - id: temporal-resolution-nh
    role: "hourly floor — FFR/FCR-type fast markets are invisible"
  - id: unit-commitment
    role: "no ramp/start costs, so price spikes that fatten real stacks are muted"
gap_assessment: >
  One stream out of the stack. Energy arbitrage is well captured: solve the
  system, value each storage unit's charge/discharge at its bus's nodal
  duals, and you have location-specific arbitrage revenue that correctly
  reflects VRE shares, congestion, and storage saturation (revenue
  cannibalization across scenarios is a genuinely strong use). Everything
  else in a real stack is missing because pypsa-earth has no markets:
  capacity payments, aFRR/FCR and other ancillary products, and imbalance
  revenues do not exist. Partial proxies: the operational-reserve
  constraint dual is a shadow reserve price, and the SAFE margin implies an
  adequacy value, but neither is paid to assets without hand post-
  processing. Structural floors compound this — hourly resolution hides
  sub-hourly products, and the frictionless LP smooths the scarcity spikes
  that drive merchant returns. Read model results as the long-run
  energy-value component (a lower bound on total stack value); a dispatch-
  against-markets model downstream is needed for a bankable revenue case.
coverage: partial
models:
  - model: pypsa-earth
