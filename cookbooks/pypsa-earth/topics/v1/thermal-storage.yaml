id: thermal-storage
title: Thermal storage
rank: 47
question: >
  How much flexibility can heat storage provide — building tanks buffering heat
  pumps, seasonal district-heat stores, CSP molten salt — and what is it worth
  to the power system? Thermal storage is the cheap flexibility the heat
  transition keeps under-using.
when_to_use:
  - "value of thermal energy storage / TES"
  - "hot water tanks buffering heat pumps"
  - "seasonal heat storage for district heating"
  - "CSP with molten-salt storage"
  - "heat storage vs batteries as flexibility"
recipes:
  generation_conversion: [thermal-storage, concentrated-solar-power, district-heating, solar-thermal, air-source-heat-pumps]
  demand: [residential-space-heating-demand, services-heat-demand]
functionality:
  - id: sector-coupled-workflow
    role: "core — water-tank stores with charger/discharger at every heat bus (sector.tes, default on)"
  - id: temporal-resolution-nh
    role: "coarse nH averaging washes out the daily cycling that pays for decentral tanks"
  - id: time-segmentation-tsam
    role: "segmentation keeps extremes while staying tractable for full-year storage chronology"
  - id: weather-year-selection
    role: "seasonal storage value hinges on the chosen weather year's heat demand profile"
  - id: summary-outputs
    role: "storage capacities/cycling by carrier in the standard summaries"
gap_assessment: >
  Strong core, two flavours. Sector chain: every residential/services
  urban/rural heat bus gets an extendable water-tank Store with
  charger/discharger links; standing losses come from sector.tes_tau (3 days
  decentral, 180 days central — i.e. genuinely seasonal on district-heat
  buses), all default-on and co-optimized against heat pumps, boilers, CHP and
  solar thermal. Power chain: CSP with the "advanced" model gets a heat bus,
  TES Store and power-block link — but "csp" is not in the default renewable
  carrier list, so add it to electricity.renewable_carriers first. Gaps: no
  power-to-heat-to-power (Carnot battery / pumped thermal) pathway, no
  industrial high-temperature heat storage, and no pit/aquifer/borehole
  stores — technology-data ships "central water pit storage" rows but no code
  consumes them (water-tank cost keys are hardcoded). Note the district-heat
  caveat: central tanks only matter where a DH share exists, and the shipped
  DH-share data is all-zero by default (see district-heating-optimization).
coverage: ready
