id: time-of-use-tariff-design
title: "Time-of-use tariff design"
rank: 76
question: >
  What tariff structure — time-of-use bands, critical-peak pricing, dynamic
  retail prices — shifts demand where the system needs it, and what is the
  system value of customers responding? A regulator/retailer question riding
  the smart-meter rollout in every liberalizing market.
when_to_use:
  - "design a time-of-use tariff"
  - "system value of ToU / dynamic pricing"
  - "how much load shifts under peak pricing"
  - "cost-reflective retail tariff bands"
  - "smart meter enabled tariff scenarios"
recipes:
  generation_conversion: [smart-meters, smart-ev-chargers, behind-the-meter-der]
  demand: [demand-temporal-profiles, residential-electricity-demand,
           electricity-load]
functionality:
  - id: demand-elasticity
    role: "absent — the core mechanism (price-responsive demand) does not exist"
  - id: market-design-mechanisms
    role: "absent — no retail layer, tariffs, or billing to design"
  - id: financial-viability-actors
    role: "absent — no actor sees a tariff; single planner, one objective"
  - id: nodal-marginal-prices
    role: "the one usable output: system marginal prices as the cost-reflective ToU shape"
  - id: bev-dsm-v2g
    role: "EV shifting is an upper bound on what a perfect ToU signal could achieve"
gap_assessment: >
  Gap. Tariff design needs three things the model does not have: a retail
  price layer, demand that responds to it, and a customer/retailer actor —
  all absent (loads are fixed exogenous profiles; the only endogenous
  shifting is EV DSM, which responds to system cost directly, not to any
  tariff). Two honest indirect uses exist. First, a solved network's nodal
  marginal prices are exactly the cost-reflective signal a ToU tariff tries
  to approximate — time-banding those duals is legitimate tariff-shape
  input, and the smart-meters recipe documents this route. Second,
  hand-built counterfactuals: reshape load profiles to an assumed tariff
  response (exogenous elasticity applied to demand-temporal-profiles data)
  and compare system costs across runs — a what-if on the response, never a
  prediction of it. Endogenous tariff response would be a code addition
  (elastic demand bands), and welfare analysis of tariff design a different
  model class altogether.
coverage: gap
