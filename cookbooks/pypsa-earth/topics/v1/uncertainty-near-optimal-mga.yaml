id: uncertainty-near-optimal-mga
title: Uncertainty / near-optimal spaces (MGA)
rank: 84
question: >
  What else is (nearly) as cheap as the optimum — the space of maximally
  different systems within a few percent of least cost — and how do input
  uncertainties propagate into it? The methodological push beyond single
  least-cost runs that the modelling community itself ranks as a top pain.
when_to_use:
  - "modelling to generate alternatives / MGA"
  - "near-optimal feasible space within X% cost slack"
  - "how different could the mix be at similar cost"
  - "propagate cost/demand uncertainty through the model"
  - "is this technology choice structural or an artefact of the optimum"
recipes:
  generation_conversion: []
  demand: []
functionality:
  - id: mga-near-optimal
    role: "the topic's core method — absent; no cost-slack exploration is wired in"
  - id: monte-carlo-sampling
    role: "the parametric half that DOES exist: LHS over any network quantity, one solve per sample, off by default"
  - id: scenario-matrix
    role: "structured (non-sampled) uncertainty via combinatorial run lists"
  - id: carrier-attribute-scaling
    role: "manual probing — perturb a carrier's cost/potential and watch the optimum move"
  - id: multi-weather-year
    role: "weather uncertainty only via one-year-per-run sweeps, never inside one solve"
gap_assessment: >
  Be precise about what exists: parametric uncertainty fan-out is real —
  monte_carlo.* wires chaospy/pyDOE2/scipy Latin-hypercube sampling over
  arbitrary PyPSA expressions (loads, capacity factors, costs), launching one
  solve per sample through the normal Snakemake DAG; it is off by default and
  the analysis of the resulting run ensemble is yours to write. Near-optimal
  exploration is not there at all: no MGA objective, no epsilon-cost-slack
  constraint, no vertex enumeration of the near-optimal polytope — nothing
  like PyPSA-Eur's generate_alternatives or the near-optimal literature's
  machinery, even though PyPSA/linopy can express the extra constraint and
  replacement objective in a few lines of a custom extra_functionality. Until
  someone writes that hook, "what else is nearly as cheap" can only be
  approximated by carrier-attribute-scaling sweeps, which probe the space
  along chosen axes rather than mapping it. Core method missing: gap.
coverage: gap
