id: behind-the-meter-der
title: Behind-the-meter DER
summary: >
  Distributed energy resources on the customer side of the meter — rooftop
  solar, home batteries, building-level micro CHP, demand-side flexibility in
  buildings — and the low-voltage layer connecting them to demand.
when_to_use:
  - "behind the meter solar / storage"
  - "rooftop PV"
  - "home batteries / residential storage"
  - "distributed energy resources"
  - "low voltage / distribution grid modelling"
  - "self-consumption of solar"
  - "customer-sited generation"
  - "residential demand response / heat DSM"
  - "prosumers"
  - "pypsa-eur carrier names: solar rooftop, home battery, home battery charger, home battery discharger, low voltage, electricity distribution grid, heat dsm"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Sector runs build the full BTM set by default. With
        sector.electricity_distribution_grid true (default),
        insert_electricity_distribution_grid adds one "low voltage" Bus per AC
        node plus a bidirectional extendable "electricity distribution grid"
        Link (cost row of the same name); static distribution losses
        (sector.transmission_efficiency."electricity distribution grid"
        .efficiency_static, default 0.97) are deducted from the electricity
        demand time series, and the function re-points onto the LV bus: every
        Load whose carrier contains "electric" (regular, industry and
        agriculture electricity), BEV chargers (bus0), V2G (bus1), non-industrial
        heat pumps and resistive heaters (their electricity terminals), and
        micro gas CHP output. "solar rooftop" Generators are then cloned from
        the existing utility "solar" generators (one per node and resource-class
        bin, same p_max_pu profile) on the LV buses, priced at the
        "solar-rooftop" cost row while utility solar is re-priced to
        "solar-utility"; their p_nom_max comes from rule
        build_clustered_solar_rooftop_potentials. A "home battery" Bus + Store
        (cost row "home battery storage") with "home battery charger" /
        "home battery discharger" Links (cost row "home battery inverter")
        completes the set — charger and discharger sizes are tied by
        add_battery_constraints in the solver (name-based match on "battery
        charger"/"battery discharger"). Optional building-level flexibility:
        "micro gas CHP" Links (sector.chp.micro_chp, default false — see the
        combined-heat-and-power recipe) and a residential heat DSM Store
        ("{heat_system} heat dsm", sector.residential_heat.dsm.enable, default
        false) that lets buildings overheat/undercool within a
        restriction_value share of peak residential space heat, with a
        time-window profile from rule build_hourly_heat_demand and standing
        losses of a decentral water tank. EV batteries as BTM storage are the
        transport family (add_EVs; sector.bev_dsm / sector.v2g). In
        myopic/perfect foresight, existing national solar capacity is split
        between utility and rooftop vintages by
        existing_capacities.solar_rooftop_ratio (default 0.5) in
        add_existing_baseyear.
      mechanism: >
        rule prepare_sector_network runs
        scripts/prepare_sector_network.py::insert_electricity_distribution_grid
        (gated on options["electricity_distribution_grid"]); rooftop p_nom_max
        per (bus, resource-class bin) is built by rule
        build_clustered_solar_rooftop_potentials from the population layout and
        the solar class regions — the input is only requested when "solar" is in
        electricity.renewable_carriers. insert_gas_distribution_costs adds gas
        distribution grid cost to micro CHP and decentral gas boilers
        (sector.gas_distribution_grid). The heat DSM Store is added inside
        add_heat per residential heat system; its daily-window profile comes
        from heat_dsm_profile in scripts/build_hourly_heat_demand.py.
      not_covered: >
        No retail tariffs, net metering or self-consumption incentives —
        everything trades at system marginal value on one LV bus per cluster
        region; no feeders, voltage or hosting-capacity limits. BTM adoption is
        cost-optimal, not behavioural: rooftop is bounded by the potentials
        file but the home battery Store and charger/discharger are unbounded
        extendables with no adoption cap key. The rooftop potential assumption
        (0.1 kW/m2 x 20 m2/person) is HARDCODED in
        build_clustered_solar_rooftop_potentials.py — unlike pypsa-earth there
        are no kW_per_m2/m2_per_person config keys and no building-footprint
        option. There is no home-battery on/off config switch either — the
        Store comes unconditionally with the LV layer.
        sector.electricity_distribution_grid_cost_factor is a DEAD KEY at this
        ref: it exists in config, is validated, and is set by the "dist" opts
        wildcard (update_config_from_wildcards), but no script reads it —
        distribution grid cost scaling only works via adjustments.sector (the
        shipped config example is exactly this factor). No BTM assets exist in
        the electricity-only workflow; the whole block lives in
        prepare_sector_network. Rooftop generators do not receive the
        "electricity grid connection" cost adder (add_electricity_grid_connection
        only touches onwind/solar/solar-hsat).
      provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/build_clustered_solar_rooftop_potentials.py:build_clustered_solar_rooftop_potentials; scripts/solve_network.py:add_battery_constraints; scripts/prepare_sector_network.py:heat dsm; scripts/_helpers.py:electricity_distribution_grid_cost_factor; scripts/add_existing_baseyear.py:solar_rooftop_ratio"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Master switch for the LV layer; false removes the low voltage buses, the distribution Link, rooftop solar and home batteries in one flip (loads stay on the HV bus)."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: sector.transmission_efficiency
        effect: "Sub-entry 'electricity distribution grid'.efficiency_static (default 0.97) sets distribution losses; active only while 'electricity distribution grid' is in transmission_efficiency.enable."
        default: "{enable: [DC, H2 pipeline, ..., electricity distribution grid], electricity distribution grid: {efficiency_static: 0.97}}"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:efficiency_static"
      - key: adjustments.sector
        effect: "Per-component/carrier attribute factor or absolute overrides applied after network assembly — the WORKING way to scale distribution grid cost (the shipped example is factor.Link.'electricity distribution grid'.capital_cost: 1.0) or to cap BTM assets (e.g. absolute.Store.'home battery'.e_nom_max)."
        default: "{factor: {Link: {electricity distribution grid: {capital_cost: 1.0}}}, absolute: false}"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:modify_attribute; scripts/prepare_sector_network.py:maybe_adjust_costs_and_potentials"
      - key: electricity.renewable_carriers
        effect: "Rooftop only exists if 'solar' is listed: the potentials input is conditional on it and the rooftop generators are clones of the utility solar generators."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "rules/build_sector.smk:solar_rooftop_potentials; scripts/prepare_sector_network.py:solar rooftop"
      - key: sector.chp.micro_chp
        effect: "true adds building-level 'micro gas CHP' Links on the decentral heat systems, electricity output on the LV bus (see combined-heat-and-power recipe)."
        default: "false"
        provenance: "config/config.default.yaml:micro_chp; scripts/prepare_sector_network.py:micro gas CHP"
      - key: sector.residential_heat.dsm.enable
        effect: "true adds a 'heat dsm' Store on residential rural/urban-decentral and urban central heat buses — building thermal inertia as BTM flexibility; direction ([overheat, undercool]) sets the sign, restriction_value (per investment year, 0.06 in 2020 to 0.4 in 2050) the size relative to peak residential space heat, restriction_time the daily windows."
        default: "false"
        provenance: "config/config.default.yaml:residential_heat; scripts/prepare_sector_network.py:heat dsm; scripts/build_hourly_heat_demand.py:heat_dsm_profile"
      - key: sector.gas_distribution_grid
        effect: "true adds gas distribution grid capital cost (electricity distribution grid cost x gas_distribution_grid_cost_factor) to micro gas CHP and decentral gas boilers."
        default: "true"
        provenance: "config/config.default.yaml:gas_distribution_grid; scripts/prepare_sector_network.py:insert_gas_distribution_costs"
      - key: existing_capacities.solar_rooftop_ratio
        effect: "Myopic/perfect foresight: share of the existing national solar fleet booked as rooftop vintages (carrier 'solar rooftop', cost row 'solar-rooftop') instead of utility solar."
        default: "0.5"
        provenance: "config/config.default.yaml:solar_rooftop_ratio; scripts/add_existing_baseyear.py:solar_rooftop_ratio"
      - key: sector.bev_dsm
        effect: "EV batteries as BTM storage (Store behind the BEV charger); with sector.v2g they feed back to the LV bus; sector.bev_dsm_availability (0.5) is the participation share — transport family, cross-noted here."
        default: "true"
        provenance: "config/config.default.yaml:bev_dsm; scripts/prepare_sector_network.py:add_EVs"
    boundary:
      - variant: "run with rooftop PV + home batteries + LV grid"
        rung: L0
        note: "default — sector.electricity_distribution_grid true and 'solar' in renewable_carriers is all it takes"
      - variant: "run without any BTM layer"
        rung: L0
        note: "sector.electricity_distribution_grid: false"
      - variant: "residential heat DSM (overheat/undercool flexibility)"
        rung: L0
        note: "sector.residential_heat.dsm.enable: true; tune direction/restriction_value/restriction_time at L1"
      - variant: "building-level micro gas CHP"
        rung: L0
        note: "sector.chp.micro_chp: true (see combined-heat-and-power recipe)"
      - variant: "scale distribution grid cost"
        rung: L1
        note: "adjustments.sector.factor.Link.'electricity distribution grid'.capital_cost (ships as the config example); do NOT use sector.electricity_distribution_grid_cost_factor or the 'dist' wildcard — the key is read by nothing"
      - variant: "cap home battery or rooftop adoption (policy scenario)"
        rung: L1
        note: "adjustments.sector absolute/factor on Store 'home battery' e_nom_max or Generator 'solar rooftop' p_nom_max; per-node caps need an edit in insert_electricity_distribution_grid (L2)"
      - variant: "change rooftop potential assumptions (kW/m2, m2/person)"
        rung: L2
        note: "hardcoded '0.1 * 20 * pop' in build_clustered_solar_rooftop_potentials.py — no config key exists (pypsa-earth has one; eur does not)"
      - variant: "rooftop potential from building footprints or an external dataset"
        rung: L3
        note: "author resources/solar_rooftop_potentials_s_{clusters}.csv in the (bus, bin) format the rule outputs — data swap, no new components"
      - variant: "retail tariff / net-metering behaviour"
        rung: L5
        note: "no tariff concept; needs bespoke cost/constraint logic distinguishing BTM flows from grid flows (custom_extra_functionality is the hook, see virtual-power-plants recipe)"
      - variant: "feeder-level distribution constraints / hosting capacity"
        rung: L5
        note: "one LV bus per cluster region; sub-regional topology needs new network-building logic"
      - variant: "BTM assets in the electricity-only workflow"
        rung: L5
        note: "the whole block lives in prepare_sector_network; replicating it in add_electricity is bespoke"
    where:
      - change: "all BTM asset definitions, LV re-pointing, loss deduction, adoption caps"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (rule prepare_sector_network, gated on sector.electricity_distribution_grid)"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "rooftop potential computation (hardcoded density assumptions)"
        anchor: "scripts/build_clustered_solar_rooftop_potentials.py (rule build_clustered_solar_rooftop_potentials)"
        provenance: "rules/build_sector.smk:build_clustered_solar_rooftop_potentials"
      - change: "residential heat DSM store and its profile"
        anchor: "scripts/prepare_sector_network.py::add_heat ('heat dsm' block) and scripts/build_hourly_heat_demand.py::heat_dsm_profile (rule build_hourly_heat_demand)"
        provenance: "scripts/prepare_sector_network.py:heat dsm; scripts/build_hourly_heat_demand.py:heat_dsm_profile"
      - change: "home battery charger/discharger size coupling"
        anchor: "scripts/solve_network.py::add_battery_constraints (name-based 'battery charger'/'battery discharger' match)"
        provenance: "scripts/solve_network.py:add_battery_constraints"
      - change: "existing rooftop vintages in brownfield runs"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear (solar_rooftop_ratio split)"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - change: "dead cost-factor key and the 'dist' wildcard that sets it"
        anchor: "scripts/_helpers.py::update_config_from_wildcards (dist opts) — repair means wiring the factor into insert_electricity_distribution_grid"
        provenance: "scripts/_helpers.py:update_config_from_wildcards"
    data_dependencies:
      - input: "population layout + cutout + solar class regions (inputs of rule build_clustered_solar_rooftop_potentials)"
        required_for: "rooftop p_nom_max per (bus, bin)"
        availability: "exists by default (built by the workflow)"
      - input: "cost rows 'solar-rooftop', 'solar-utility', 'home battery storage', 'home battery inverter', 'battery inverter', 'battery storage', 'electricity distribution grid', 'micro CHP', 'decentral water tank storage' (standing losses for heat DSM)"
        required_for: "all BTM assets"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "residential_heat_dsm_profile CSV"
        required_for: "sector.residential_heat.dsm.enable"
        availability: "must be built (rule build_hourly_heat_demand outputs it alongside hourly heat demand)"
      - input: "avail_profile / dsm_profile transport CSVs (rule build_transport_demand)"
        required_for: "EV-as-BTM-storage variants"
        availability: "must be built (transport chain, exists by default in sector runs)"
