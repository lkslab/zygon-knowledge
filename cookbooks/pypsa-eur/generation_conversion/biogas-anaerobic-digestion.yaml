id: biogas-anaerobic-digestion
title: Biogas / anaerobic digestion
summary: >
  Biogas from organic feedstocks (manure, sludge) via anaerobic digestion, and
  its upgrading into the methane / natural-gas system as biomethane.
when_to_use:
  - "add biogas"
  - "anaerobic digestion / digesters"
  - "biomethane / upgrade biogas to the gas grid"
  - "biogas to gas"
  - "manure or sewage sludge to energy"
  - "renewable / green gas supply"
  - "biogas potential for my region"
  - "biogas upgrading with carbon capture"
  - "ENSPRESO biogas classes"
  - "pypsa-eur carrier names: biogas, unsustainable biogas, biogas to gas, biogas to gas CC"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        A regionally-resolved biogas resource whose only route to use is
        upgrading into the gas network. rule build_biomass_potentials derives
        the "biogas" carrier from the ENSPRESO commodities mapped by
        biomass.classes.biogas — "Manure solid, liquid" (MINBIOGAS1) and
        "Sludge" (MINBIOSLU1) — regionalised to the clustered nodes, scaled
        by biomass.share_sustainable_potential_available. Alongside it,
        add_unsustainable_potentials builds an "unsustainable biogas" column
        from the Eurostat primary-production balance carrier R5300 (Biogases)
        scaled by biomass.share_unsustainable_use_retained. In
        prepare_sector_network add_biomass creates "biogas" buses (per node
        when sector.gas_network is true, else one "EU biogas" bus) with a
        Generator whose e_sum_max equals the sustainable biogas potential and
        marginal cost is the "biogas" cost-row fuel price; if any
        unsustainable potential exists a second, non-extendable Generator is
        added with e_sum_min = e_sum_max so the retained unsustainable biogas
        is FORCED into the system. With sector.biogas_upgrading true
        (default) a "biogas to gas" Link upgrades biogas into the gas buses
        at the "biogas" efficiency, charging "biogas" capital cost + "biogas
        upgrading" capital cost and booking efficiency2 =
        -CO2-intensity-of-gas onto "co2 atmosphere" (so downstream methane
        combustion nets to zero). sector.biogas_upgrading_cc (default false)
        adds a parallel "biogas to gas CC" Link that additionally captures
        the upgrading CO2 to the co2 stored buses (extra cost from "biogas
        CC" + "biomass CHP capture" rows). The upgraded biomethane is then
        indistinguishable from fossil gas at the gas bus and feeds every gas
        consumer (CHP, boilers, OCGT/CCGT, industry).
      mechanism: >
        rule build_biomass_potentials (scripts/build_biomass_potentials.py):
        the biomass.classes.biogas grouper sums manure+sludge into "biogas";
        add_unsustainable_potentials adds "unsustainable biogas" from the
        Eurostat R5300 carrier. rule prepare_sector_network runs add_biomass
        (gated by sector.biomass), which reads
        biomass_potentials_s_{clusters}_{planning_horizons}.csv, builds the
        biogas buses/generators and the biogas-to-gas upgrading Link(s);
        define_spatial fixes the nodal-vs-EU namespace from
        sector.gas_network. Costs come from rule process_cost_data.
      not_covered: >
        Anaerobic digestion itself is not a modelled process — there is no
        digester component, capacity, or investment decision; the potential
        is an exogenous per-region resource ceiling read from ENSPRESO
        manure+sludge, with no other feedstocks (energy-crop or food-waste
        biogas is not represented; municipal waste is a separate carrier, see
        waste-to-energy). The ONLY sink for raw biogas is upgrading to
        methane — there is no biogas engine / biogas CHP / direct biogas
        boiler link, so biogas cannot make electricity or heat without first
        becoming grid gas. biomass.classes.biogas cannot be expanded to new
        ENSPRESO commodities beyond what the mapping names without them being
        picked up (a class outside the four hard-coded output columns is
        dropped by the groupby). The whole chain is gated on sector.biomass
        (there is no independent biogas switch). No methane-slip / fugitive-
        emission accounting on digestion or upgrading (see methane-abatement).
      provenance: "scripts/prepare_sector_network.py:biogas to gas; scripts/prepare_sector_network.py:add_biomass; scripts/build_biomass_potentials.py:add_unsustainable_potentials; config/config.default.yaml:biogas"
    levers:
      - key: sector.biogas_upgrading
        effect: "true (default) adds the 'biogas to gas' Link that upgrades biogas into the gas network as biomethane; false leaves the biogas resource stranded (no sink)."
        default: "true"
        provenance: "config/config.default.yaml:biogas_upgrading; scripts/prepare_sector_network.py:biogas to gas"
      - key: sector.biogas_upgrading_cc
        effect: "true adds a parallel 'biogas to gas CC' Link that captures the upgrading CO2 to the co2 stored buses (negative-emission biomethane), priced with the 'biogas CC' and 'biomass CHP capture' cost rows."
        default: "false"
        provenance: "config/config.default.yaml:biogas_upgrading_cc; scripts/prepare_sector_network.py:biogas to gas CC"
      - key: biomass.classes
        effect: "The 'biogas' entry maps ENSPRESO commodities ('Manure solid, liquid'; 'Sludge') into the biogas potential — the resource-side handle on how much biogas each region has."
        default: "biogas: [Manure solid, liquid; Sludge]"
        provenance: "config/config.default.yaml:classes; scripts/build_biomass_potentials.py:grouper"
      - key: biomass.scenario
        effect: "ENSPRESO scenario (ENS_Low/Med/High) scaling the manure+sludge biogas potentials along with all other biomass."
        default: "ENS_Med"
        provenance: "config/config.default.yaml:ENS_Med; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
      - key: biomass.share_unsustainable_use_retained
        effect: "Per-horizon fraction of Eurostat-derived unsustainable biogas (carrier R5300) forced into the system as a non-extendable generator with e_sum_min = e_sum_max."
        default: "{2020: 1, 2025: 1, 2030: 0.66, 2035: 0.33, 2040: 0, 2045: 0, 2050: 0}"
        provenance: "config/config.default.yaml:share_unsustainable_use_retained; scripts/build_biomass_potentials.py:_calc_unsustainable_potential"
      - key: sector.gas_network
        effect: "true resolves biogas per node (nodes + ' biogas'); false pools it on a single 'EU biogas' bus. Also determines whether upgraded biomethane enters nodal or EU gas."
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.biomass
        effect: "Master gate — add_biomass (and thus the entire biogas chain) only runs when true."
        default: "true"
        provenance: "config/config.default.yaml:biomass; scripts/prepare_sector_network.py:add_biomass"
    boundary:
      - variant: "biogas upgraded to biomethane (default)"
        rung: L0
        note: "sector.biogas_upgrading true + sector.biomass true — resource from ENSPRESO manure+sludge, upgraded into the gas buses"
      - variant: "negative-emission biomethane (capture upgrading CO2)"
        rung: L0
        note: "sector.biogas_upgrading_cc: true adds the 'biogas to gas CC' Link"
      - variant: "more/less biogas resource region-wide"
        rung: L0
        note: "biomass.scenario ENS_High/ENS_Low (rebuilds the potentials CSV); no scalar override"
      - variant: "add feedstocks to the biogas potential (e.g. move a commodity into biogas)"
        rung: L1
        note: "edit biomass.classes.biogas — but only commodities already in ENSPRESO can be remapped; anything outside the four output columns is dropped"
      - variant: "single EU biogas pool"
        rung: L1
        note: "sector.gas_network: false pools biogas (and gas) on EU buses"
      - variant: "override biogas / upgrading cost assumptions"
        rung: L3
        note: "edit the 'biogas', 'biogas upgrading', 'biogas CC' rows via data/custom_costs.csv (costs.custom_cost_fn) or the technology-data source"
      - variant: "direct biogas use (biogas engine / CHP on raw biogas)"
        rung: L2
        note: "no such link — add a biogas -> AC (or -> heat) Link in add_biomass beside the 'biogas to gas' Link; needs a cost row for the engine"
      - variant: "own per-region biogas potential dataset"
        rung: L3
        note: "supply the 'biogas' column of the biomass_potentials CSV directly, or rewire build_biomass_potentials' ENSPRESO inputs"
      - variant: "explicit anaerobic-digestion process (feedstock supply curves, digester capacity/cost)"
        rung: L5
        note: "nothing to parameterise — needs new feedstock buses/stores and digestion Links; the potential is a bare resource ceiling"
      - variant: "methane-slip / fugitive emissions on digestion or upgrading"
        rung: L5
        note: "the CO2 accounting has no CH4/GWP term; crediting or charging slip requires bespoke emission terms (cf. methane-abatement recipe)"
    where:
      - change: "biogas potential (sustainable + unsustainable), class mapping"
        anchor: "scripts/build_biomass_potentials.py (rule build_biomass_potentials; biomass.classes.biogas grouper; add_unsustainable_potentials R5300 branch)"
        provenance: "scripts/build_biomass_potentials.py:add_unsustainable_potentials; rules/build_sector.smk:build_biomass_potentials"
      - change: "biogas buses/generators and the upgrading Link(s)"
        anchor: "scripts/prepare_sector_network.py::add_biomass (biogas Store/Generator, 'biogas to gas' and 'biogas to gas CC' Links)"
        provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:biogas to gas CC"
      - change: "nodal vs EU biogas namespace"
        anchor: "scripts/prepare_sector_network.py::define_spatial (sector.gas_network -> spatial.gas.biogas / biogas_to_gas)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
    data_dependencies:
      - input: "JRC ENSPRESO_BIOMASS.xlsx (MINBIOGAS1 manure, MINBIOSLU1 sludge)"
        required_for: "the sustainable biogas potential"
        availability: "retrieved by the workflow (rule retrieve_enspreso_biomass); Europe/NUTS-2013 only"
      - input: "Eurostat energy balances (R5300 Biogases, nrg_bal PPRD)"
        required_for: "the unsustainable biogas potential"
        availability: "must be built (built by the workflow)"
      - input: "cost rows 'biogas', 'biogas upgrading', 'biogas CC', 'biomass CHP capture'"
        required_for: "biogas fuel price and upgrading (± CC) economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "per-node gas buses (gas network chain)"
        required_for: "the sink for upgraded biomethane"
        availability: "exists by default in sector runs (build_gas_network chain)"
