id: clean-cookstoves
title: Clean cookstoves
summary: >
  Replacing traditional biomass cooking with improved/clean cookstoves
  (efficient biomass, LPG, biogas or electric), reducing fuel use.
when_to_use:
  - "clean cookstoves"
  - "improved cookstoves"
  - "traditional biomass cooking"
  - "firewood / charcoal cooking transition"
  - "LPG for cooking"
  - "reduce household biomass use"
  - "clean cooking access scenario (SDG7)"
  - "pypsa-eur: not represented — no cookstove, stove or traditional-biomass concept exists in this European model"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        NOT represented, and — unlike in pypsa-earth — the underlying policy
        problem barely exists in the modelled region: the strings "cookstove"
        and "stove" appear nowhere in scripts, rules or config at this ref, and
        the only "cooking" artefacts are unused energy-totals columns (see the
        electric-cooking recipe and the demand book's cooking-energy-demand).
        Household solid-biomass use IS in the model, but exclusively as
        HEATING: JRC-IDEES/Eurostat residential energy feeds the heat demand
        chain, and decentral biomass is served by the extendable "biomass
        boiler" links added in add_biomass on the four decentral heat systems
        (gated by sector.biomass_boiler, default true), with existing biomass
        boiler stock in the myopic vintages
        (add_heating_capacities_installed_before_baseyear, existing_heating_raw
        column 'biomass boiler'). Any traditional-cooking biomass hiding in
        national statistics is therefore implicitly folded into heating demand
        or dropped with the rest of non-electric cooking energy.
      mechanism: >
        Nothing to run. The adjacent chains are: build_energy_totals (cooking
        columns, unused downstream) and add_biomass (biomass boiler links,
        solid biomass supply from build_biomass_potentials).
      not_covered: >
        Everything: no stove stock, stove-efficiency tiers,
        traditional-vs-improved distinction, LPG-for-cooking carrier, cooking
        health/air-quality accounting, or fuel-switching lever. Representing a
        clean-cooking programme in pypsa-eur would first require an explicit
        cooking demand (see the electric-cooking recipe's L2 carve-out), after
        which stove classes would be new conversion links with efficiency and
        cost data that exist nowhere in the repo or in technology-data rows
        consumed here.
      provenance: "scripts/build_energy_totals.py:total residential cooking; scripts/prepare_sector_network.py:add_biomass; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear; config/config.default.yaml:biomass_boiler"
    levers:
      - key: sector.biomass_boiler
        effect: "Nearest existing lever — decentral biomass heating links (the technology any residential-biomass reduction scenario would actually interact with)."
        default: "true"
        provenance: "config/config.default.yaml:biomass_boiler; scripts/prepare_sector_network.py:biomass_boiler"
    boundary:
      - variant: "clean-cookstove programme / cooking fuel transition"
        rung: L5
        note: "no cooking demand exists to transition; needs the explicit cooking carve-out (electric-cooking recipe, L2 code + L3 profile) plus new stove-class links with user-supplied efficiency/cost data"
      - variant: "reduce residential biomass use (heating proxy)"
        rung: L1
        note: "the closest in-model action: disable sector.biomass_boiler or constrain solid biomass potentials (biomass chapter / build_biomass_potentials) — this is heating, not cooking"
      - variant: "LPG cooking carrier"
        rung: L5
        note: "no LPG carrier exists at all (oil products are aggregated); a cooking LPG chain is bespoke"
    where:
      - change: "where a cooking demand would have to be created first"
        anchor: "scripts/prepare_sector_network.py::build_heat_demand (electricity-subtraction template) + scripts/build_energy_totals.py cooking columns"
        provenance: "scripts/prepare_sector_network.py:build_heat_demand; scripts/build_energy_totals.py:total residential cooking"
      - change: "the residential biomass technology that exists instead"
        anchor: "scripts/prepare_sector_network.py::add_biomass (biomass boiler block)"
        provenance: "scripts/prepare_sector_network.py:biomass boiler"
    data_dependencies:
      - input: "cooking demand split by fuel + stove efficiency/cost data"
        required_for: "any cookstove representation"
        availability: "absent (cooking totals per country exist unused in energy_totals; stove data absent entirely)"
