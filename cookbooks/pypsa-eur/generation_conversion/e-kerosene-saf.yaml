id: e-kerosene-saf
title: E-kerosene / sustainable aviation fuel (SAF)
summary: >
  Synthetic jet fuel for aviation — how aviation demand is modelled, which
  synthetic routes can serve it, and what "SAF" does and does not mean in
  a model where all liquid fuels share one oil pool.
when_to_use:
  - "sustainable aviation fuel / SAF"
  - "e-kerosene / synthetic jet fuel"
  - "power-to-liquids for aviation"
  - "aviation decarbonisation"
  - "SAF blending mandate / quota"
  - "aviation fuel demand"
  - "methanol-to-jet"
  - "hydrogen aircraft"
  - "pypsa-eur carrier names: kerosene for aviation, Fischer-Tropsch, methanol-to-kerosene, oil"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Aviation demand is exogenous and ON by default (sector.aviation:
        true): add_aviation sums "total international aviation" + "total
        domestic aviation" from the population-weighted energy totals,
        scales by sector.aviation_demand_factor, and attaches it as
        "kerosene for aviation" Loads on dedicated kerosene buses (nodal,
        since sector.regional_oil_demand is true by default). Each kerosene
        bus is fed by a Link from the SINGLE "EU oil" bus
        (spatial.oil.nodes is hardcoded to ["EU oil"]) that charges the
        full fossil-oil CO2 intensity to "co2 atmosphere" at the point of
        combustion. E-kerosene therefore exists ONLY implicitly: the
        Fischer-Tropsch links (nodal H2 + co2 stored -> EU oil, see
        e-diesel-fischer-tropsch) put synthetic hydrocarbons into the same
        pool, and their climate benefit is booked at SYNTHESIS (CO2
        withdrawn from co2 stored), not at the aviation load — fossil oil
        (extendable "oil primary" generator + refining link with
        industry.oil_refining_emissions), biomass-to-liquid,
        electrobiofuels and unsustainable bioliquids all feed the same
        fungible bus. The ONE dedicated synthetic-jet technology is
        "methanol-to-kerosene" (sector.methanol.methanol_to_kerosene,
        default false): a multilink consuming EU methanol plus nodal H2 and
        delivering DIRECTLY onto the kerosene buses (bypassing the oil
        pool), emitting oil-intensity CO2 per methanol input. Under a tight
        CO2 budget the optimiser endogenously shifts the pool towards
        synthetic supply — that emergent share is what "SAF" means here.
      mechanism: >
        rule prepare_sector_network -> add_aviation (kerosene buses, loads
        and the oil->kerosene links; plus the optional methanol-to-kerosene
        block); supply routes are built in add_industry (Fischer-Tropsch),
        add_biomass (BtL/electrobiofuels/bioliquids) and add_carrier_buses
        (fossil oil). Aviation energy totals come from the energy-totals
        chain (pop_weighted_energy_totals input).
      not_covered: >
        No SAF blending mandate or synthetic-share constraint exists — the
        kerosene bus cannot distinguish the origin of oil arriving from the
        pool, so a quota needs a custom constraint on the supply links, not
        a config key. No hydrogen aircraft (aviation demand is 100%
        kerosene; no H2 or electric aviation carrier). No split of
        Fischer-Tropsch output into kerosene/diesel/naphtha fractions
        (single generic oil commodity). No non-CO2 aviation effects
        (contrails, altitude factors). Aviation demand does not respond to
        price (fixed Load, scaled only by aviation_demand_factor).
      provenance: "scripts/prepare_sector_network.py:add_aviation; scripts/prepare_sector_network.py:kerosene for aviation; scripts/prepare_sector_network.py:methanol-to-kerosene; scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:Fischer-Tropsch; scripts/prepare_sector_network.py:add_carrier_buses"
    levers:
      - key: sector.aviation
        effect: "Gates add_aviation entirely — false removes aviation demand from the system."
        default: "true"
        provenance: "config/config.default.yaml:aviation; scripts/prepare_sector_network.py:add_aviation"
      - key: sector.aviation_demand_factor
        effect: "Scales total aviation energy demand (e.g. 0.8 for demand reduction scenarios); logged as a warning when != 1."
        default: "1.0"
        provenance: "config/config.default.yaml:aviation_demand_factor; scripts/prepare_sector_network.py:aviation_demand_factor"
      - key: sector.methanol.methanol_to_kerosene
        effect: "true adds the dedicated methanol+H2 -> kerosene route ('methanol-to-kerosene' links delivering straight onto the kerosene buses)."
        default: "false"
        provenance: "config/config.default.yaml:methanol_to_kerosene; scripts/prepare_sector_network.py:methanol-to-kerosene"
      - key: sector.regional_oil_demand
        effect: "true (default) creates nodal 'kerosene for aviation' buses/loads; false collapses to one EU kerosene bus — accounting granularity only, supply is a single EU oil pool either way."
        default: "true"
        provenance: "config/config.default.yaml:regional_oil_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.fossil_fuels
        effect: "false removes the fossil supply generators for ALL fossil carriers (oil included) — the bluntest way to force fully synthetic/biogenic aviation fuel; not aviation-specific."
        default: "true"
        provenance: "config/config.default.yaml:fossil_fuels; scripts/prepare_sector_network.py:add_carrier_buses"
      - key: industry.oil_refining_emissions
        effect: "tCO2/MWh charged by the 'oil refining' link between the primary and usable oil bus — raises the well-to-tank penalty of fossil kerosene relative to FT fuel (which enters downstream of refining)."
        default: "0.013"
        provenance: "config/config.default.yaml:oil_refining_emissions; scripts/prepare_sector_network.py:add_carrier_buses"
    boundary:
      - variant: "let the optimiser choose fossil vs synthetic jet fuel under a CO2 cap"
        rung: L0
        note: "default — FT/BtL/electrobiofuels and fossil oil compete in the EU oil pool; the co2_budget drives the synthetic share"
      - variant: "scale aviation demand"
        rung: L1
        note: "sector.aviation_demand_factor"
      - variant: "dedicated methanol-to-jet route"
        rung: L0
        note: "sector.methanol.methanol_to_kerosene: true"
      - variant: "force 100% non-fossil fuels system-wide"
        rung: L1
        note: "sector.fossil_fuels: false — removes fossil oil AND coal/gas/lignite supply; there is no oil-only or aviation-only switch"
      - variant: "SAF blending mandate (minimum synthetic share of aviation fuel)"
        rung: L5
        note: "origin is not tracked through the oil pool; needs a custom constraint tying FT/BtL/methanol-to-kerosene dispatch to the kerosene load, injected via the custom_extra_functionality hook in solve_network"
      - variant: "kerosene as a separate commodity with its own synthesis routes"
        rung: L2
        note: "the demand-side kerosene buses already exist; re-point synthesis outputs (e.g. an FT kerosene fraction) to spatial.oil.kerosene instead of spatial.oil.nodes in add_industry — cost rows for product splits are the user's problem (L3)"
      - variant: "hydrogen or battery-electric aviation"
        rung: L2
        note: "no such carrier; add an H2-share split in add_aviation analogous to the shipping share machinery in add_shipping (shares + efficiency ratios), plus assumptions"
      - variant: "price-elastic or route-based aviation demand"
        rung: L5
        note: "fixed exogenous Load from energy totals; elasticity is bespoke"
    where:
      - change: "aviation demand, kerosene buses, oil->kerosene delivery, methanol-to-kerosene"
        anchor: "scripts/prepare_sector_network.py::add_aviation"
        provenance: "scripts/prepare_sector_network.py:add_aviation"
      - change: "synthetic supply into the oil pool"
        anchor: "scripts/prepare_sector_network.py::add_industry (Fischer-Tropsch block); ::add_biomass (biomass to liquid / electrobiofuels)"
        provenance: "scripts/prepare_sector_network.py:Fischer-Tropsch; scripts/prepare_sector_network.py:electrobiofuels"
      - change: "fossil oil supply + refining emissions"
        anchor: "scripts/prepare_sector_network.py::add_carrier_buses (oil branch, oil_refining_emissions)"
        provenance: "scripts/prepare_sector_network.py:add_carrier_buses; scripts/prepare_sector_network.py:oil_refining_emissions"
      - change: "custom SAF-share constraints"
        anchor: "solve_network.py::extra_functionality custom_extra_functionality hook"
        provenance: "scripts/solve_network.py:custom_extra_functionality"
      - change: "oil spatial resolution (single EU pool)"
        anchor: "scripts/prepare_sector_network.py::define_spatial (spatial.oil block)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
    data_dependencies:
      - input: "energy totals with 'total international aviation' / 'total domestic aviation' columns (pop-weighted)"
        required_for: "the aviation load"
        availability: "must be built (energy-totals chain); default in sector workflow"
      - input: "cost rows 'Fischer-Tropsch', 'methanol-to-kerosene', 'oil' (fuel price + CO2 intensity)"
        required_for: "synthetic routes and fossil competitor economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "co2 stored buses with captured CO2 (for FT feedstock)"
        required_for: "the e-fuel synthesis side"
        availability: "exists by default (add_co2_tracking + capture chain)"
