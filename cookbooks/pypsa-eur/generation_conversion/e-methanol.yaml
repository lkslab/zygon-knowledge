id: e-methanol
title: E-methanol (power/H2 + CO2 methanol synthesis)
summary: >
  Synthetic methanol produced from hydrogen, electricity and captured CO2
  (methanolisation) — the power-to-methanol route feeding shipping and
  industrial methanol demand.
when_to_use:
  - "e-methanol / green methanol"
  - "methanol synthesis from hydrogen and CO2"
  - "power-to-methanol / methanolisation"
  - "methanol for shipping"
  - "industrial methanol demand"
  - "methanol imports"
  - "CO2 utilisation to methanol"
  - "pypsa-eur carrier names: methanolisation, methanol, shipping methanol, industry methanol, import methanol"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        The synthesis route is ON by default, but it lives inside
        add_industry: an extendable "methanolisation" Link is added at every
        H2 location with bus0 = nodal H2, bus1 = the methanol bus, bus2 =
        electricity (consumed, negative efficiency2) and bus3 = co2 stored
        (consumed, negative efficiency3), with energetics from the
        "methanolisation" cost row (hydrogen-input, electricity-input,
        carbondioxide-input) and a must-run floor p_min_pu =
        sector.min_part_load_methanolisation (0.3). Methanol itself is
        ALWAYS a single "EU methanol" bus — define_spatial hardcodes
        spatial.methanol.nodes to ["EU methanol"] regardless of other
        spatial switches (copperplate methanol; only the DEMAND buses
        regionalise via sector.methanol.regional_methanol_demand, default
        false). add_methanol (gated by sector.methanol) creates the
        methanol carrier/bus/Store via add_carrier_buses (storage priced
        from "General liquid hydrocarbon storage (product)"). Demands:
        "shipping methanol" loads with a share ramping 0 (2020) to 1.0
        (2050) of shipping energy (add_shipping,
        sector.shipping_methanol_share — combustion CO2 charged to
        atmosphere at the methanolisation carbondioxide-input), and
        "industry methanol" loads from the industrial demand chain
        (add_industry). Methanolisation waste heat can serve district
        heating (sector.use_methanolisation_waste_heat 0.25, bus4 in
        add_waste_heat, heat-output/hydrogen-input from the cost row).
        Optional fixed-price imports: "import methanol" links (sector.imports)
        that draw the combustion CO2 from "co2 atmosphere" so imported
        e-methanol is carbon-accounted as climate-neutral.
      mechanism: >
        rule prepare_sector_network: add_methanol builds the EU methanol
        bus/store (plus the OTHER methanol-chain technologies — see
        not_covered); the methanolisation synthesis link and the industry
        methanol demand are built inside add_industry (so sector.industry
        must be true for the e-methanol route to exist); shipping demand in
        add_shipping; waste heat in add_waste_heat.
      not_covered: >
        This recipe covers ONLY the power/H2+CO2 synthesis route. The rest
        of the methanol chain has its own recipes: biomass-to-methanol
        (sector.methanol.biomass_to_methanol, default true, + CC variant),
        methanol-to-power (OCGT on methanol enabled by default), methanol
        reforming (to H2), and methanol-to-kerosene (see e-kerosene-saf).
        No regional methanol production/transport — the single EU bus makes
        methanol freely tradable and synthesis siting only matters through
        the H2/electricity/CO2/heat side. No CO2-source discrimination:
        methanolisation draws from the pooled co2 stored buses (DAC,
        biogenic and fossil capture are fungible). No methanol export
        machinery (imports only). If sector.industry is false there is no
        methanolisation link at all — the synthesis route silently
        disappears while shipping methanol demand (if shipping is on) would
        still need supply from biomass-to-methanol or imports.
      provenance: "scripts/prepare_sector_network.py:methanolisation; scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:add_shipping; scripts/prepare_sector_network.py:add_waste_heat; scripts/prepare_sector_network.py:import methanol"
    levers:
      - key: sector.min_part_load_methanolisation
        effect: "p_min_pu of the methanolisation links — must-run floor as a fraction of built capacity in every snapshot."
        default: "0.3"
        provenance: "config/config.default.yaml:min_part_load_methanolisation; scripts/prepare_sector_network.py:methanolisation"
      - key: sector.shipping_methanol_share
        effect: "Per-horizon share of shipping energy served by methanol (efficiency ratio sector.shipping_oil_efficiency / sector.shipping_methanol_efficiency applied) — the dominant methanol demand by 2050."
        default: "0 (2020) ramping to 1.0 (2050)"
        provenance: "config/config.default.yaml:shipping_methanol_share; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.methanol.regional_methanol_demand
        effect: "true regionalises the shipping/industry methanol DEMAND buses (supply stays on the single EU methanol bus)."
        default: "false"
        provenance: "config/config.default.yaml:regional_methanol_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: sector.use_methanolisation_waste_heat
        effect: "Fraction of methanolisation waste heat (heat-output per hydrogen-input) delivered to urban central heat buses."
        default: "0.25"
        provenance: "config/config.default.yaml:use_methanolisation_waste_heat; scripts/prepare_sector_network.py:add_waste_heat"
      - key: sector.methanol.biomass_to_methanol
        effect: "The competing biogenic methanol supply route (own recipe family) — set false to make methanolisation and imports the only supply."
        default: "true"
        provenance: "config/config.default.yaml:biomass_to_methanol; scripts/prepare_sector_network.py:add_biomass_to_methanol"
      - key: sector.imports.enable
        effect: "true adds 'import methanol' at sector.imports.price.methanol (121 EUR/MWh default), carbon-accounted against the atmosphere bus."
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:import methanol"
      - key: costs.overwrites
        effect: "Override the 'methanolisation' investment/VOM/lifetime (the hydrogen-input/electricity-input/carbondioxide-input attributes need data/custom_costs.csv rows)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "e-methanol synthesis as an investment option"
        rung: L0
        note: "default — requires sector.industry true (the link is created in add_industry)"
      - variant: "methanol as shipping fuel with a configurable share"
        rung: L0
        note: "default ramp reaches 100% by 2050; adjust sector.shipping_methanol_share"
      - variant: "flexible (load-following) synthesis"
        rung: L1
        note: "sector.min_part_load_methanolisation: 0"
      - variant: "e-methanol-only supply (no biogenic methanol)"
        rung: L1
        note: "sector.methanol.biomass_to_methanol: false (and _cc false, already default)"
      - variant: "restrict synthesis CO2 to DAC or biogenic sources"
        rung: L5
        note: "CO2 is pooled on the co2 stored buses — needs bespoke source-tracked buses or a custom constraint"
      - variant: "regional methanol balancing with transport"
        rung: L2
        note: "define_spatial hardcodes the single EU methanol bus; nodalising needs edits there plus new transport links (no config key)"
      - variant: "e-methanol export"
        rung: L2
        note: "no export machinery; add a Load/negative-price Generator on the EU methanol bus (the import methanol block is the accounting template)"
      - variant: "methanol synthesis without the industry sector"
        rung: L2
        note: "move/duplicate the methanolisation block out of add_industry (it is not reachable with sector.industry false)"
      - variant: "change synthesis costs or energetics"
        rung: L1
        note: "costs.overwrites for cost columns; input-coefficient attributes via data/custom_costs.csv rows (L3)"
    where:
      - change: "synthesis link creation (siting, part load, input coefficients)"
        anchor: "scripts/prepare_sector_network.py::add_industry (methanolisation n.add on spatial.h2.locations)"
        provenance: "scripts/prepare_sector_network.py:methanolisation; scripts/prepare_sector_network.py:add_industry"
      - change: "methanol bus/store and the rest of the methanol chain"
        anchor: "scripts/prepare_sector_network.py::add_methanol / ::add_carrier_buses; spatial resolution in ::define_spatial"
        provenance: "scripts/prepare_sector_network.py:add_methanol; scripts/prepare_sector_network.py:add_carrier_buses"
      - change: "shipping methanol demand"
        anchor: "scripts/prepare_sector_network.py::add_shipping (shipping_methanol_share block)"
        provenance: "scripts/prepare_sector_network.py:shipping methanol"
      - change: "waste heat delivery"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat (use_methanolisation_waste_heat branch)"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "import option"
        anchor: "scripts/prepare_sector_network.py::add_import_options (import methanol block)"
        provenance: "scripts/prepare_sector_network.py:import methanol"
    data_dependencies:
      - input: "cost row 'methanolisation' (hydrogen-input, electricity-input, carbondioxide-input, heat-output)"
        required_for: "all synthesis energetics and costs"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "co2 stored buses with captured CO2 supply (capture chain / DAC)"
        required_for: "the CO2 feedstock (bus3)"
        availability: "exists by default (add_co2_tracking; capture technologies per their recipes)"
      - input: "shipping demand (rule build_shipping_demand + energy totals) and industrial methanol demand"
        required_for: "the methanol loads"
        availability: "must be built; default in sector workflow"
