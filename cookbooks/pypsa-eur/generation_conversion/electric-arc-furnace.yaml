id: electric-arc-furnace
title: Electric arc furnace (EAF) steel
summary: >
  Steelmaking in electric arc furnaces — scrap-based secondary steel and the
  electric half of the DRI+EAF route — as the electricity-intensive alternative
  to coal-based integrated steelworks.
when_to_use:
  - "electric arc furnace"
  - "EAF steel"
  - "secondary steel / scrap steel recycling"
  - "electrify steel production"
  - "steel electricity demand"
  - "shift from blast furnace to EAF"
  - "steel primary vs secondary share"
  - "St_primary_fraction / DRI_fraction levers"
  - "where are the EAF plants located"
  - "pypsa-eur sector names: Electric arc, DRI + Electric arc, Integrated steelworks"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        EAF steel is covered on the demand side, active by default in sector
        runs. Three steel routes exist as production columns: "Electric arc"
        (scrap EAF), "DRI + Electric arc" and "Integrated steelworks".
        build_industry_sector_ratios::iron_and_steel derives the future EAF
        energy intensity (MWh/t) from JRC-IDEES: EAF electricity plus fully
        electrified furnaces/refining/rolling and product finishing, smelters
        converted to methane, plus low-enthalpy heat. Route shares are
        exogenous config ramps applied EU-wide in
        build_industrial_production_per_country_tomorrow:
        industry.St_primary_fraction (default 0.6 in 2020 -> 0.3 in 2050)
        shrinks primary steel; "Electric arc" production is computed as the
        residual total_steel - DRI - Integrated steelworks, so secondary EAF
        grows automatically. Country ratios are blended between today's
        JRC-IDEES intensities and the future best-in-class values by
        industry.sector_ratios_fraction_future
        (build_industry_sector_ratios_intermediate). Spatially, EAF production
        is distributed to buses by the GEM Global Steel Plant Tracker: per
        country, capacities from "Nominal EAF steel capacity (ttpa)" (status
        operating/construction/operating pre-retirement/retired, retirement
        after 2025) form the nodal key (build_nodal_distribution_key,
        steel_processes list). The resulting energy lands in
        prepare_sector_network::add_industry as flat loads: "industry
        electricity" on the AC bus, "gas for industry", and "low-temperature
        heat for industry" on the district-heating heat bus.
      mechanism: >
        rule build_industry_sector_ratios (scripts/build_industry_sector_ratios.py::
        iron_and_steel) -> rule build_industry_sector_ratios_intermediate
        (today/future blend) -> rule build_industrial_production_per_country ->
        rule build_industrial_production_per_country_tomorrow (route split) ->
        rule build_industrial_distribution_key (GEM steel tracker,
        prepare_gem_steel_database) -> rule build_industrial_production_per_node
        -> rule build_industrial_energy_demand_per_node -> rule
        prepare_sector_network runs add_industry, which attaches the flat loads
        and rescales national electricity demand downward by "current
        electricity" before re-adding "industry electricity".
      not_covered: >
        There is no EAF component in the network — no capacity, capital cost,
        dispatch or flexibility; steel is a fixed annual energy demand spread
        flat over all snapshots (p_set = annual/8760). No scrap resource: scrap
        availability never constrains the secondary share, which is purely the
        residual of the config ramps. Route choice is not endogenous — the model
        cannot trade EAF against blast furnace on cost or CO2. Route fractions
        are single EU-wide scalars per horizon, not per country. Steel is
        excluded from the new endogenous process-heat machinery: the
        build_industry_sector_ratios_endogenous docstring states the script
        does not cover the steel sector, and "DRI + Electric arc" is in
        sectors_copied_from_exogenous in build_industrial_energy_demand_per_node
        — with sector.industry_t.endogen the "Electric arc" sector keeps
        today's country intensities as flat fuel loads (no temperature-band
        split). No demand-side flexibility on EAF electricity.
      provenance: "scripts/build_industry_sector_ratios.py:iron_and_steel; scripts/build_industrial_production_per_country_tomorrow.py:St_primary_fraction; scripts/build_industrial_distribution_key.py:Nominal EAF steel capacity (ttpa); scripts/build_industrial_energy_demand_per_node.py:sectors_copied_from_exogenous; scripts/prepare_sector_network.py:industry electricity"
    levers:
      - key: industry.St_primary_fraction
        effect: "Per-horizon fraction of total steel from primary routes; lowering it grows the scrap-EAF residual ('Electric arc' = total - DRI - Integrated)."
        default: "{2020: 0.6, ..., 2050: 0.3}"
        provenance: "config/config.default.yaml:St_primary_fraction; scripts/build_industrial_production_per_country_tomorrow.py:St_primary_fraction"
      - key: industry.DRI_fraction
        effect: "Per-horizon fraction of persistent primary steel produced as 'DRI + Electric arc' (also an EAF-based route); the rest stays 'Integrated steelworks'."
        default: "{2020: 0, ..., 2050: 1}"
        provenance: "config/config.default.yaml:DRI_fraction; scripts/build_industrial_production_per_country_tomorrow.py:dri_fraction"
      - key: industry.sector_ratios_fraction_future
        effect: "Progress from today's country-specific steel energy intensities towards the future best-in-class EAF ratios (0 = today, 1 = fully future)."
        default: "{2020: 0.0, 2025: 0.05, 2030: 0.2, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: sector.industry
        effect: "Master switch — false removes add_industry and with it all steel demand."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
      - key: industry.reference_year
        effect: "Base year for today's industrial production statistics from which the future route split is derived."
        default: "2023"
        provenance: "config/config.default.yaml:reference_year; rules/build_sector.smk:build_industrial_production_per_country"
    boundary:
      - variant: "more/less scrap-EAF steel (change secondary share)"
        rung: L1
        note: "lower/raise industry.St_primary_fraction for the relevant horizons — EAF production is the residual"
      - variant: "full EAF steel system by 2040"
        rung: L1
        note: "St_primary_fraction: {2040: 0} (all steel secondary) or combine with DRI_fraction: {2040: 1} to keep primary but make it DRI+EAF"
      - variant: "country-specific route shares"
        rung: L2
        note: "the fractions are EU-wide scalars applied uniformly (fraction_persistent_primary uses EU totals in build_industrial_production_per_country_tomorrow); per-country shares need a small edit there"
      - variant: "change EAF electricity intensity"
        rung: L2
        note: "no config key — the intensity is computed from JRC-IDEES in iron_and_steel (build_industry_sector_ratios.py); edit that function or post-process the industry_sector_ratios.csv resource (L3)"
      - variant: "site EAF at different/new locations"
        rung: L3
        note: "distribution follows the GEM steel tracker xlsx (retrieve_gem_steel_plant_tracker); supply an edited data/gem_gspt file or adjust prepare_gem_steel_database filters (L2)"
      - variant: "endogenous EAF vs blast-furnace choice on cost/CO2"
        rung: L5
        note: "requires modelling steel routes as competing Links with a steel demand bus — nothing in the workflow represents steel as a material flow in the network"
      - variant: "scrap availability constraint on secondary steel"
        rung: L5
        note: "no scrap resource exists anywhere in the chain; needs new data and either a production-side constraint or network components"
      - variant: "flexible / load-shifting EAF operation"
        rung: L5
        note: "steel demand is a flat Load; flexibility needs the demand converted to a Link+Store structure (bespoke)"
    where:
      - change: "EAF / DRI+EAF / integrated route energy intensities"
        anchor: "scripts/build_industry_sector_ratios.py::iron_and_steel (rule build_industry_sector_ratios)"
        provenance: "scripts/build_industry_sector_ratios.py:iron_and_steel; rules/build_sector.smk:build_industry_sector_ratios"
      - change: "route split between EAF, DRI+EAF and integrated steelworks"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py (St_primary_fraction / DRI_fraction application)"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:fraction_persistent_primary"
      - change: "spatial allocation of EAF production (GEM steel tracker)"
        anchor: "scripts/build_industrial_distribution_key.py::prepare_gem_steel_database and ::build_nodal_distribution_key (steel_processes loop)"
        provenance: "scripts/build_industrial_distribution_key.py:prepare_gem_steel_database; scripts/build_industrial_distribution_key.py:steel_processes"
      - change: "attachment of steel energy as network loads"
        anchor: "scripts/prepare_sector_network.py::add_industry (rule prepare_sector_network)"
        provenance: "scripts/prepare_sector_network.py:add_industry"
    data_dependencies:
      - input: "JRC-IDEES Iron and steel sheets (FC_IND_IS_EA_E for Electric arc)"
        required_for: "today's and future EAF energy intensities"
        availability: "retrieved by the workflow (rule retrieve_jrc_idees); EU27 coverage, non-EU countries filled from production-weighted averages"
      - input: "GEM Global Steel Plant Tracker xlsx (EAF capacity, status, retirement dates)"
        required_for: "nodal distribution of EAF production"
        availability: "retrieved by the workflow (rule retrieve_gem_steel_plant_tracker); population fallback where a country has no plants"
      - input: "industrial production per country (JRC-IDEES + supplementary statistics)"
        required_for: "steel tonnages the route split acts on"
        availability: "must be built (rule build_industrial_production_per_country)"
