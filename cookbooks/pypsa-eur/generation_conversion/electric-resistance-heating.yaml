id: electric-resistance-heating
title: Electric resistance heating
summary: >
  Direct electric heating (resistive heaters / electric boilers) converting
  electricity to heat at ~unity efficiency in buildings and district heating.
when_to_use:
  - "electric resistance heating"
  - "resistive heaters"
  - "direct electric heating"
  - "electric boiler / electrode boiler in district heating"
  - "power-to-heat"
  - "electric radiators / storage heaters"
  - "cheap power-to-heat for surplus renewables"
  - "pypsa-eur carrier names: urban central resistive heater, urban decentral resistive heater, rural resistive heater (unclustered: residential rural resistive heater, ...); industry: heat100-200 industry electric boiler steam"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        On by default (sector.resistive_heaters: true). add_heat adds an
        extendable Link "{heat_system} resistive heater" at every heat bus of
        all five heat systems: bus0 = the electricity node, bus1 = the heat bus
        (NOT reversed, unlike the heat pumps — p_nom is in MW_electric), with
        efficiency and costs from the technology-data rows
        "decentral resistive heater" / "central resistive heater"
        (heat_system.central_or_decentral); capital_cost is multiplied by the
        efficiency (converting the per-MW_th cost row onto the electric
        capacity) and by sector.overdimension_heat_generators (1.1 decentral /
        1.0 central). With sector.electricity_distribution_grid true (default),
        insert_electricity_distribution_grid moves bus0 of EVERY resistive
        heater — urban central electrode boilers included — to the
        "low voltage" bus, so all of them pay distribution grid cost. In
        district heating the central resistive heater is the classic
        surplus-renewables sink alongside the water pit storage. Myopic/perfect
        foresight: the existing stock (existing_heating_raw.csv column
        "resistive heater", distributed by population and sector split in
        build_existing_heating_distribution) enters as vintaged links in
        add_heating_capacities_installed_before_baseyear, with marginal cost
        including the gas/heating efficiency ratio corrections from
        heating_efficiencies. Industry has a separate electrode boiler:
        "heat100-200 industry electric boiler steam" (cost row "electric boiler
        steam") in the endogenous industry heat bands of add_industry — see
        the electric-process-heat topic.
      mechanism: >
        rule prepare_sector_network runs add_heat; the resistive heater block
        sits in the per-heat-system loop right after the heat pumps (key =
        f-string on heat_system.central_or_decentral + ' resistive heater').
        cluster_heat_buses (default true) merges the residential/services
        duplicates into "rural resistive heater" / "urban decentral resistive
        heater". Existing stock: rule build_existing_heating_distribution ->
        rule add_existing_baseyear.
      not_covered: >
        No night-storage-heater representation (a resistive heater plus the
        independent water-tank store on the same bus is the nearest composite;
        no charge-window restriction exists — the residential heat DSM store,
        sector.residential_heat.dsm, is a separate demand-side mechanism, off
        by default). No per-system enable switch: sector.resistive_heaters is
        one global boolean covering all five heat systems. No capacity caps or
        adoption limits (extendable, unbounded). Marginal electricity cost is
        the only operating cost — no VOM row is applied in add_heat.
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/prepare_sector_network.py:resistive_heaters; scripts/definitions/heat_system.py:resistive_heater_costs_name; scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear; scripts/prepare_sector_network.py:electric boiler steam"
    levers:
      - key: sector.resistive_heaters
        effect: "Master switch for resistive heaters in all five heat systems."
        default: "true"
        provenance: "config/config.default.yaml:resistive_heaters; scripts/prepare_sector_network.py:resistive_heaters"
      - key: sector.electricity_distribution_grid
        effect: "true makes all resistive heaters (central included) draw from the low voltage bus."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: sector.overdimension_heat_generators
        effect: "Capital-cost multiplier for peak oversizing."
        default: "{decentral: 1.1, central: 1.0}"
        provenance: "config/config.default.yaml:overdimension_heat_generators; scripts/prepare_sector_network.py:overdim_factor"
      - key: sector.boilers
        effect: "Companion lever — gas boilers on the same buses; disabling them (with heating kept) channels heat electrification through resistive heaters and heat pumps."
        default: "true"
        provenance: "config/config.default.yaml:boilers; scripts/prepare_sector_network.py:add_heat"
      - key: costs.overwrites
        effect: "Override 'central resistive heater' / 'decentral resistive heater' investment, efficiency, lifetime."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: existing_capacities.grouping_years_heat
        effect: "Myopic vintages for the existing resistive-heater stock."
        default: "[1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019]"
        provenance: "config/config.default.yaml:grouping_years_heat; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
    boundary:
      - variant: "resistive heaters compete for heat supply everywhere"
        rung: L0
        note: "default"
      - variant: "remove resistive heaters"
        rung: L0
        note: "sector.resistive_heaters: false"
      - variant: "resistive heaters only in district heating (or only in buildings)"
        rung: L2
        note: "single global flag; guard the add_heat resistive heater block by heat_system (e.g. == HeatSystem.URBAN_CENTRAL)"
      - variant: "existing resistive heater stock (brownfield)"
        rung: L0
        note: "automatic in myopic runs from existing_heating_raw.csv"
      - variant: "night-storage heater with charge-window restriction"
        rung: L5
        note: "needs a coupled heater+store component with time-restricted charging; the water tank store and the DSM profile machinery (heat_dsm_profile in build_hourly_heat_demand) are the available building blocks"
      - variant: "cap resistive heater capacity per node/country"
        rung: L2
        note: "no key; set p_nom_max on the n.add call in add_heat (per-country needs a small mapping there or a custom constraint, L5)"
      - variant: "industrial electrode boiler"
        rung: L0
        note: "separate chain — 'heat100-200 industry electric boiler steam' is added in the endogenous industry heat bands (add_industry), not controlled by sector.resistive_heaters"
    where:
      - change: "resistive heater link creation (all systems)"
        anchor: "scripts/prepare_sector_network.py::add_heat (options['resistive_heaters'] block)"
        provenance: "scripts/prepare_sector_network.py:resistive_heaters; scripts/prepare_sector_network.py:resistive heater"
      - change: "cost-row naming per system"
        anchor: "scripts/definitions/heat_system.py::resistive_heater_costs_name (central/decentral)"
        provenance: "scripts/definitions/heat_system.py:resistive_heater_costs_name"
      - change: "low-voltage re-pointing"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (rh filter on carrier contains 'resistive heater')"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "existing stock distribution + vintaging (myopic)"
        anchor: "scripts/build_existing_heating_distribution.py::build_existing_heating; scripts/add_existing_baseyear.py::add_heating_capacities_installed_before_baseyear"
        provenance: "scripts/build_existing_heating_distribution.py:build_existing_heating; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
      - change: "industry electrode boiler"
        anchor: "scripts/prepare_sector_network.py::add_industry ('electric boiler steam' block in the heat bands)"
        provenance: "scripts/prepare_sector_network.py:electric boiler steam"
    data_dependencies:
      - input: "cost rows 'central resistive heater', 'decentral resistive heater', 'electric boiler steam'"
        required_for: "capital cost, efficiency, lifetime"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "data/existing_infrastructure/existing_heating_raw.csv (column 'resistive heater')"
        required_for: "myopic existing stock"
        availability: "exists by default in the repo"
