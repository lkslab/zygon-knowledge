id: floating-offshore-wind
title: Floating offshore wind
summary: >
  Wind turbines on floating platforms in deep water beyond fixed-bottom
  depth limits.
when_to_use:
  - "add floating offshore wind"
  - "floating wind turbines / platforms"
  - "deep-water offshore wind"
  - "wind beyond 60 m water depth"
  - "offwind-float"
  - "shelf too deep for fixed-bottom offshore wind"
  - "pypsa-eur carrier names: offwind-float, offshore wind (Float)"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Fully covered as a first-class default carrier (in contrast to
        pypsa-earth, where floating wind is absent). 'offwind-float' is in
        both electricity.renewable_carriers and
        electricity.extendable_carriers.Generator. Its renewable block
        occupies the depth BAND between fixed-bottom and the abyss:
        min_depth 60 m (a GEBCO exclusion with invert=True in
        determine_availability_matrix removes everything shallower — no
        double counting with offwind-ac/dc, which stop at max_depth 60) and
        max_depth 1000 m; shipping lanes (ship_threshold 400) and natura
        areas are excluded like the fixed-bottom carriers; no shore-distance
        bands (both min/max_shore_distance empty), so float competes at any
        distance in the 60-1000 m band. Turbine:
        NREL_ReferenceTurbine_5MW_offshore, capacity_per_sqkm 2,
        correction_factor 0.8855, landfall_length 40 km. Costing is
        float-specific: attach_wind_and_solar has an explicit branch — for
        midcar 'float' the turbine capex comes from the carrier's OWN
        'offwind-float' cost row (ac/dc share the generic 'offwind' row),
        plus 'offwind-float-station' plus the distance-dependent connection
        adder built from 'offwind-float-connection-submarine' /
        '-underground' rows and lines.length_factor. All four
        offwind-float* rows exist in the processed technology-data costs
        file. Sector runs keep the carrier (pypsa_eur Generator keep-list
        includes offwind-float) and update_wind_solar_costs in
        prepare_sector_network.py re-applies the same float-specific branch
        at planning-year costs. Myopic land-use bookkeeping
        (add_land_use_constraint) and CCL aggregation
        (agg_offwind -> 'offwind-all') both include offwind-float.
      mechanism: >
        rule determine_availability_matrix (offwind-float params: gebco
        max_depth AND min_depth exclusions, ship_density, natura, offshore
        regions) -> rule build_renewable_profiles (atlite wind method,
        average_distance to the onshore region shoreline) -> rule
        add_electricity (attach_wind_and_solar: 'Take 'offwind-float'
        capital cost for 'float'' branch). No float-specific solver logic —
        it is an ordinary VRE generator once attached.
      not_covered: >
        No existing floating fleet: electricity.estimate_renewable_
        capacities.technology_mapping maps ALL powerplantmatching 'Offshore'
        plants to offwind-ac, and add_existing_renewables in
        add_existing_baseyear.py has no float entry in its tech_map — myopic
        runs build no floating vintages. No floating-specific physics
        (mooring, platform motion losses, dynamic cabling) beyond the same
        scalar correction_factor as fixed-bottom, and the same turbine
        family (the default float turbine is an older 5 MW reference than
        the fixed-bottom 2020ATB 5.5 MW machine). No depth-dependent cost
        scaling within the 60-1000 m band (one capex for the whole band).
        The AC/DC connection distinction does not exist for float — one set
        of float connection rows regardless of distance.
      provenance: "scripts/add_electricity.py:attach_wind_and_solar; scripts/determine_availability_matrix.py:min_depth; config/config.default.yaml:offwind-float; scripts/prepare_sector_network.py:update_wind_solar_costs; scripts/add_existing_baseyear.py:add_existing_renewables"
    levers:
      - key: electricity.renewable_carriers
        effect: "Include/exclude 'offwind-float'."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; rules/build_electricity.smk:input_profile_tech"
      - key: electricity.extendable_carriers.Generator
        effect: "Whether floating capacity is optimisable."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_wind_and_solar"
      - key: renewable.offwind-float.min_depth
        effect: "Shallow bound [m] of the floating band (inverted GEBCO exclusion); keep aligned with offwind-ac/dc max_depth to avoid overlap or gaps."
        default: "60.0"
        provenance: "config/config.default.yaml:min_depth; scripts/determine_availability_matrix.py:min_depth"
      - key: renewable.offwind-float.max_depth
        effect: "Deep bound [m] of the floating band."
        default: "1000.0"
        provenance: "config/config.default.yaml:max_depth; scripts/determine_availability_matrix.py:max_depth"
      - key: renewable.offwind-float.resource.turbine
        effect: "atlite turbine power curve for the float carrier (accepts {year: turbine} dict)."
        default: "NREL_ReferenceTurbine_5MW_offshore"
        provenance: "config/config.default.yaml:turbine; scripts/build_renewable_profiles.py:models"
      - key: renewable.offwind-float.capacity_per_sqkm
        effect: "MW installable per km2 of eligible deep-water area."
        default: "2"
        provenance: "config/config.default.yaml:capacity_per_sqkm; scripts/build_renewable_profiles.py:capacity_per_sqkm"
      - key: renewable.offwind-float.landfall_length
        effect: "Fixed landfall cable length [km] priced at 'offwind-float-connection-underground'."
        default: "40.0"
        provenance: "config/config.default.yaml:landfall_length; scripts/add_electricity.py:landfall_lengths"
      - key: renewable.offwind-float.ship_threshold
        effect: "Shipping-lane exclusion threshold."
        default: "400"
        provenance: "config/config.default.yaml:ship_threshold; scripts/determine_availability_matrix.py:ship_threshold"
      - key: renewable.offwind-float.correction_factor
        effect: "Scalar derating of the profile (shared 0.8855 offshore default; the place to encode float-specific availability/motion losses as a scalar)."
        default: "0.8855"
        provenance: "config/config.default.yaml:correction_factor; scripts/build_renewable_profiles.py:correction_factor"
      - key: renewable.offwind-float.natura
        effect: "Exclude marine protected areas."
        default: "true"
        provenance: "config/config.default.yaml:natura; scripts/determine_availability_matrix.py:natura"
      - key: solving.agg_p_nom_limits.agg_offwind
        effect: "true merges offwind-float with ac/dc into one 'offwind-all' carrier for CCL country limits."
        default: "false"
        provenance: "config/config.default.yaml:agg_offwind; scripts/solve_network.py:add_CCL_constraints"
      - key: adjustments.electricity
        effect: "Generic per-carrier factor/absolute overrides (e.g. scale offwind-float capital_cost for sensitivity runs)."
        default: "false"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
    boundary:
      - variant: "run with floating wind competing against fixed-bottom"
        rung: L0
        note: "default — nothing to do; the 60 m min_depth / max_depth split keeps the potentials disjoint"
      - variant: "remove floating wind"
        rung: L1
        note: "delete 'offwind-float' from electricity.renewable_carriers and extendable_carriers.Generator"
      - variant: "widen/narrow the floating depth band or restrict to a shore-distance band"
        rung: L1
        note: "renewable.offwind-float.min_depth / max_depth; min_shore_distance / max_shore_distance keys exist in the block (default empty) and are honoured by determine_availability_matrix"
      - variant: "float-specific cost assumptions (platform, mooring, dynamic cable)"
        rung: L1
        note: "override the 'offwind-float', 'offwind-float-station' or 'offwind-float-connection-*' rows via data/custom_costs.csv (costs.custom_cost_fn) — float costing is per-carrier, so overrides do NOT leak onto ac/dc (unlike the shared 'offwind' turbine row)"
      - variant: "cap or force floating wind per country"
        rung: L1
        note: "solving.constraints.CCL + 'offwind-float' rows in data/agg_p_nom_minmax.csv (agg_offwind: false to keep it separate)"
      - variant: "existing/planned floating projects in the fleet"
        rung: L3
        note: "no mapping exists; add rows in data/custom_powerplants.csv (electricity.custom_powerplants) — but note attach_renewable_powerplants only sjoins the tech_map fueltypes, so a float entry also needs the technology_mapping / tech_map extended (small L2 edit in scripts/add_electricity.py)"
      - variant: "myopic floating vintages from statistics"
        rung: L2
        note: "extend tech_map in add_existing_baseyear::add_existing_renewables (currently only solar/onwind/offwind-ac); IRENA does not distinguish float — data choice needed"
      - variant: "depth-dependent floating capex within the band"
        rung: L5
        note: "capital cost is uniform per carrier; depth-graded cost needs either several float carriers with stacked depth bands (config-only but clunky: copy the block N times — the offshore routing in rules/build_electricity.smk keys on the 'offwind' prefix, so 'offwind-float2' style names stay offshore) or bespoke per-cell costing logic"
      - variant: "mooring/motion dynamics, floater choice"
        rung: L5
        note: "no representation; scalar correction_factor is the only hook"
    where:
      - change: "depth band + eligibility"
        anchor: "scripts/determine_availability_matrix.py (min_depth inverted GEBCO exclusion; rule determine_availability_matrix)"
        provenance: "scripts/determine_availability_matrix.py:min_depth"
      - change: "float-specific capital cost branch"
        anchor: "scripts/add_electricity.py::attach_wind_and_solar (midcar == 'float' branch)"
        provenance: "scripts/add_electricity.py:midcar"
      - change: "sector-run re-costing (same float branch)"
        anchor: "scripts/prepare_sector_network.py::update_wind_solar_costs (midtech == 'float')"
        provenance: "scripts/prepare_sector_network.py:midtech"
      - change: "existing/planned float fleet attachment"
        anchor: "scripts/add_electricity.py::attach_renewable_powerplants + electricity.estimate_renewable_capacities.technology_mapping; myopic: scripts/add_existing_baseyear.py::add_existing_renewables tech_map"
        provenance: "scripts/add_electricity.py:attach_renewable_powerplants; scripts/add_existing_baseyear.py:tech_map"
      - change: "offshore-region routing for any additional float-band carriers"
        anchor: "rules/build_electricity.smk (regions lambdas keyed on technology name in determine_availability_matrix / build_renewable_profiles rules)"
        provenance: "rules/build_electricity.smk:determine_availability_matrix"
    data_dependencies:
      - input: "GEBCO bathymetry (rule retrieve_gebco)"
        required_for: "the 60-1000 m depth band"
        availability: "retrieved by the workflow when depth keys are set"
      - input: "weather cutout + offshore regions/shapes"
        required_for: "profile computation over deep water"
        availability: "same chain as fixed-bottom offshore; exists by default"
      - input: "technology-data cost rows offwind-float / offwind-float-station / offwind-float-connection-submarine / offwind-float-connection-underground"
        required_for: "float-specific costing"
        availability: "exists by default in the processed costs file (rule process_cost_data)"
      - input: "ship density raster"
        required_for: "ship_threshold exclusion"
        availability: "built by rule build_ship_raster"
      - input: "floating project pipeline data (existing/planned plants)"
        required_for: "existing float fleet / myopic vintages"
        availability: "absent — powerplantmatching Offshore is not split by foundation type; user-curated custom_powerplants rows needed"
