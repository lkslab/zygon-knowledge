id: green-hydrogen
title: Green hydrogen (renewable-based H2 supply chain)
summary: >
  Hydrogen produced from (renewable) electricity as a system-wide vector —
  production, delivery, demand sinks, its competition with fossil-based
  hydrogen, and the (absent) machinery for certifying it as "green".
when_to_use:
  - "green hydrogen"
  - "renewable hydrogen supply chain"
  - "hydrogen economy / hydrogen strategy scenario"
  - "clean hydrogen for industry or transport"
  - "RFNBO / RED-II style hydrogen rules"
  - "additionality / temporal matching for H2"
  - "hydrogen colour shares (green vs blue vs grey)"
  - "hydrogen for shipping or fuel-cell cars"
  - "pypsa-eur carrier names: H2 Electrolysis, H2 pipeline, H2 Store, SMR, H2 for industry, H2 for shipping, import H2"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        The full electrolytic H2 chain is in every sector run: production via
        the unconditional nodal "H2 Electrolysis" Links (see electrolysers
        recipe), delivery via greenfield "H2 pipeline" candidates
        (sector.H2_network, default true — see hydrogen-pipelines recipe) and
        optional retrofitted pipes, storage via salt caverns and overground
        tanks (see hydrogen-storage-salt-caverns), and reconversion via
        "H2 Fuel Cell" / "H2 turbine" (see stationary-fuel-cells).
        Demand sinks wired by default: exogenous "H2 for industry" Loads
        from the industrial demand chain (add_industry), hydrogen input to
        Haber-Bosch ammonia (add_ammonia), methanolisation, Fischer-Tropsch
        and Sabatier synthesis, hydrogen direct reduction of steel
        (industry.H2_DRI in the sector-ratios chain), and — behind default-0
        shares — fuel-cell land transport (sector.land_transport_fuel_cell_share,
        add_fuel_cell_cars) and H2 shipping fuel
        (sector.shipping_hydrogen_share, optionally via "H2 liquefaction"
        when sector.shipping_hydrogen_liquefaction is true). Optional H2
        imports at a fixed price appear as "import H2" Generators at former
        gas-pipeline entry points (sector.imports, default off — the
        green-energy-imports recipe owns this). Crucially, "green" is NOT a
        property the model tracks: electrolysers draw from the zonal AC bus
        (any mix), and fossil H2 from "SMR" / "SMR CC" (both default true,
        see blue-hydrogen) lands on the SAME nodal H2 buses. Low-carbon H2
        emerges endogenously from the CO2 budget (co2_budget /
        add_co2limit), not from any hydrogen-specific rule.
      mechanism: >
        rule prepare_sector_network: add_h2_gas_infrastructure builds the H2
        buses, electrolysis, reconversion, storage, pipelines, SMR;
        add_industry / add_ammonia / add_shipping / add_land_transport
        attach the sinks; add_import_options adds imports if enabled. The
        only system-wide greenness driver is the CO2 accounting
        (co2 atmosphere bus + add_co2limit / add_co2_atmosphere_constraint).
      not_covered: >
        No certification, guarantees of origin, additionality, or
        hourly/monthly RES-matching machinery exists ANYWHERE in the
        workflow — no constraint references the origin of electrolysis
        input power, and grid electricity is freely usable. No colour
        tracking either: green, blue and grey H2 are indistinguishable
        once on the H2 bus (shares are only recoverable in post-processing
        from link dispatch). No H2 export demand outside the modelled
        system (imports exist, exports do not). Forcing an all-electrolytic
        supply is possible by switching SMR off, but that still permits
        fossil-power-derived H2 unless the CO2 budget binds.
      provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:add_fuel_cell_cars; scripts/prepare_sector_network.py:H2 liquefaction; scripts/prepare_sector_network.py:add_import_options; scripts/prepare_sector_network.py:add_co2limit; scripts/solve_network.py:add_co2_atmosphere_constraint"
    levers:
      - key: sector.SMR
        effect: "false removes the steam-methane-reforming route — with sector.SMR_cc also false, ALL hydrogen is electrolytic (grid-mix, not certified green)."
        default: "true"
        provenance: "config/config.default.yaml:SMR; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.SMR_cc
        effect: "false removes the capture-equipped SMR route (see blue-hydrogen recipe)."
        default: "true"
        provenance: "config/config.default.yaml:SMR_cc; scripts/prepare_sector_network.py:SMR CC"
      - key: sector.shipping_hydrogen_share
        effect: "Per-horizon share of shipping energy served by H2 (fuel-cell propulsion at fuel cell efficiency); default 0 in ALL years — H2 shipping is opt-in."
        default: "0 for 2020-2050"
        provenance: "config/config.default.yaml:shipping_hydrogen_share; scripts/prepare_sector_network.py:add_shipping"
      - key: sector.shipping_hydrogen_liquefaction
        effect: "true routes shipping H2 through nodal 'H2 liquefaction' Links onto 'H2 liquid' buses before the load."
        default: "false"
        provenance: "config/config.default.yaml:shipping_hydrogen_liquefaction; scripts/prepare_sector_network.py:H2 liquefaction"
      - key: sector.land_transport_fuel_cell_share
        effect: "Per-horizon share of land transport demand served by fuel-cell vehicles drawing from the nodal H2 buses."
        default: "0 for 2020-2050"
        provenance: "config/config.default.yaml:land_transport_fuel_cell_share; scripts/prepare_sector_network.py:add_fuel_cell_cars"
      - key: sector.imports.enable
        effect: "true adds fixed-price green import options, incl. 'import H2' Generators (price sector.imports.price.H2, default 74 EUR/MWh) at former pipeline entry points — see green-energy-imports recipe."
        default: "false"
        provenance: "config/config.default.yaml:imports; scripts/prepare_sector_network.py:add_import_options"
      - key: industry.H2_DRI
        effect: "MWh H2 per tonne of direct-reduced iron — scales the steel-sector H2 demand that arrives in the 'H2 for industry' load as DRI_fraction ramps up."
        default: "1.7"
        provenance: "config/config.default.yaml:H2_DRI; scripts/build_industry_sector_ratios.py:H2_DRI"
      - key: sector.hydrogen_turbine
        effect: "H2 reconversion to power via 'H2 turbine' Links (OCGT costs) — part of the H2 value chain; see stationary-fuel-cells for the fuel-cell route."
        default: "true"
        provenance: "config/config.default.yaml:hydrogen_turbine; scripts/prepare_sector_network.py:H2 turbine"
    boundary:
      - variant: "hydrogen production, transport, storage and demand as investment options"
        rung: L0
        note: "default in every sector run — electrolysis is unconditional, H2_network true, industry H2 loads exogenous"
      - variant: "all-electrolytic hydrogen supply (no fossil H2 routes)"
        rung: L1
        note: "sector.SMR: false and sector.SMR_cc: false — note this makes H2 'electrolytic', not certified 'green' (grid mix applies)"
      - variant: "hydrogen for shipping / fuel-cell cars"
        rung: L1
        note: "raise sector.shipping_hydrogen_share / sector.land_transport_fuel_cell_share above their default-0 schedules"
      - variant: "import green hydrogen at a fixed price"
        rung: L0
        note: "sector.imports.enable: true (limit via sector.imports.limit; the green-energy-imports recipe documents details)"
      - variant: "hourly/monthly RES-matched (RFNBO-style) hydrogen"
        rung: L5
        note: "no origin tracking exists; needs bespoke constraints tying electrolyser dispatch to contracted RES generators — the custom_extra_functionality hook in solve_network is the injection point"
      - variant: "additionality (only NEW renewables power electrolysers)"
        rung: L5
        note: "same as above plus vintage bookkeeping on RES capacity — nothing in the code distinguishes new from existing RES on the AC bus"
      - variant: "track or constrain colour shares of H2 supply"
        rung: L5
        note: "all H2 shares one bus per node; shares are post-processing over link dispatch — constraining them needs a custom constraint over SMR vs electrolysis link-p variables"
      - variant: "hydrogen export demand to outside Europe"
        rung: L2
        note: "no export machinery; add a Load (or negative-price Generator) on chosen H2 buses in add_h2_gas_infrastructure — the 'import H2' block in add_import_options is the siting template"
    where:
      - change: "fossil H2 competitors on the H2 bus"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (SMR / SMR CC blocks)"
        provenance: "scripts/prepare_sector_network.py:SMR CC"
      - change: "H2 demand sinks (industry load, shipping, transport)"
        anchor: "scripts/prepare_sector_network.py::add_industry (H2 for industry) / ::add_shipping / ::add_fuel_cell_cars"
        provenance: "scripts/prepare_sector_network.py:H2 for industry; scripts/prepare_sector_network.py:add_shipping"
      - change: "import options / export template"
        anchor: "scripts/prepare_sector_network.py::add_import_options (import H2 block); solver-side cap in scripts/solve_network.py::add_import_limit_constraint"
        provenance: "scripts/prepare_sector_network.py:import H2; scripts/solve_network.py:add_import_limit_constraint"
      - change: "custom greenness constraints (matching, additionality, colour caps)"
        anchor: "solve_network.py::extra_functionality via the custom_extra_functionality module hook"
        provenance: "scripts/solve_network.py:extra_functionality; scripts/solve_network.py:custom_extra_functionality"
    data_dependencies:
      - input: "industrial H2 demand (industrial_energy_demand chain incl. DRI/chlorine sector ratios)"
        required_for: "the exogenous H2 for industry load"
        availability: "must be built (industry demand rules); default in sector workflow"
      - input: "cost rows 'electrolysis', 'SMR', 'SMR CC', 'fuel cell', 'H2 (g) pipeline'"
        required_for: "supply-side economics of the H2 chain"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "gas_input_nodes_simplified.csv (entry points)"
        required_for: "siting of 'import H2' generators when sector.imports is enabled"
        availability: "must be built (rule build_gas_input_locations); default in sector workflow"
