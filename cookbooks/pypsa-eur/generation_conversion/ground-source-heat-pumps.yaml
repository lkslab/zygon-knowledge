id: ground-source-heat-pumps
title: Ground-source heat pumps
summary: >
  Electric heat pumps drawing on stable ground/soil temperatures for building
  heating, with higher and less weather-sensitive COP than air-source units.
when_to_use:
  - "add ground-source heat pumps"
  - "GSHP"
  - "geothermal heat pump for buildings"
  - "soil-sourced heat pump"
  - "borehole / ground-loop heat pump"
  - "rural heating electrification"
  - "ground vs air heat pump competition"
  - "pypsa-eur carrier names: rural ground heat pump (unclustered: residential rural ground heat pump, services rural ground heat pump)"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Covered by default at RURAL nodes only: sector.heat_pump_sources.rural
        is [air, ground], so add_heat offers both an air- and a ground-source
        heat pump link at every residential rural and services rural heat bus
        and the optimiser picks between them (urban decentral and urban central
        default to air only). The link is reversed like all pypsa-eur heat
        pumps (bus0 = heat bus, bus1 = electricity, efficiency = 1/COP,
        p_min_pu = -1, p_max_pu = 0; p_nom in MW_th), priced from the cost row
        "decentral ground-sourced heat pump" (HeatSystem.heat_pump_costs_name)
        times overdimension_heat_generators.decentral (1.1). COP chain: rule
        build_temperature_profiles computes population-weighted ERA5 SOIL
        temperature (atlite cutout.soil_temperature) -> rule build_cop_profiles
        applies the Staffell et al. (2012) ground regression
        (COP = 8.77 - 0.150*dT + 0.000734*dT^2) against the 55 C sink
        (sector.heat_pump_sink_T_individual_heating); the rule's
        input_heat_source_temperature helper maps source "ground" to the
        temp_soil_total file. Ground is an UNLIMITED source (not in
        sector.district_heating.limited_heat_sources): no resource bus, no
        p_nom_max. sector.electricity_distribution_grid true re-points the
        electricity side to the low voltage bus. Myopic: the existing GSHP
        stock from the 2012 EC mapping study is ALL reassigned to rural systems
        in build_existing_heating_distribution ("move all ground HPs to rural,
        all air to urban") and vintaged in
        add_heating_capacities_installed_before_baseyear.
      mechanism: >
        rule build_temperature_profiles -> temp_soil_total nc -> rule
        build_cop_profiles (DecentralHeatingCopApproximator with
        source_type "ground") -> cop_profiles nc -> rule prepare_sector_network
        add_heat (heat pump loop over params.heat_pump_sources per
        heat_system.system_type). Because heat_pump_sources is read per system
        type, adding "ground" to the urban decentral or urban central lists is
        pure config: the rule-level helpers input_heat_source_temperature (COP
        inputs) key off the union of all three lists, and urban central would
        use the CentralHeatingCopApproximator with soil temperature.
      not_covered: >
        No borehole/ground-loop potential limit, drilling-cost supply curve, or
        land-area constraint — GSHP capacity is unbounded wherever offered
        (contrast the limited_heat_sources machinery, which exists only for
        district heating sources with a heat_source_power CSV, wired solely for
        urban central via input_heat_source_power). No ground thermal depletion
        or brine/borehole vs horizontal-loop distinction; the soil temperature
        is the undisturbed atlite value. No urban GSHP by default (config-only
        to change). Not to be confused with deep geothermal district heat
        (sector.district_heating.limited_heat_sources.geothermal, see
        district-heating recipe) or EGS (enhanced-geothermal recipe).
      provenance: "scripts/prepare_sector_network.py:add_heat; scripts/build_cop_profiles/decentral_heating_cop_approximator.py:_approximate_cop_ground_source; scripts/build_temperature_profiles.py:soil_temperature; rules/build_sector.smk:input_heat_source_temperature; scripts/build_existing_heating_distribution.py:build_existing_heating"
    levers:
      - key: sector.heat_pump_sources
        effect: "'ground' in the rural list by default; add it to 'urban decentral' or 'urban central' to offer GSHP there, or remove it to drop GSHP."
        default: "{urban central: [air], urban decentral: [air], rural: [air, ground]}"
        provenance: "config/config.default.yaml:heat_pump_sources; scripts/prepare_sector_network.py:add_heat"
      - key: sector.heat_pump_sink_T_individual_heating
        effect: "Sink temperature for the decentral ground COP regression (shared with air-source)."
        default: "55.0"
        provenance: "config/config.default.yaml:heat_pump_sink_T_individual_heating; rules/build_sector.smk:build_cop_profiles"
      - key: sector.time_dep_hp_cop
        effect: "Hourly soil-temperature-dependent COP vs static costs-table efficiency."
        default: "true"
        provenance: "config/config.default.yaml:time_dep_hp_cop; scripts/prepare_sector_network.py:add_heat"
      - key: sector.overdimension_heat_generators
        effect: "Capital-cost multiplier for peak oversizing (decentral 1.1 applies to GSHP)."
        default: "{decentral: 1.1, central: 1.0}"
        provenance: "config/config.default.yaml:overdimension_heat_generators; scripts/prepare_sector_network.py:add_heat"
      - key: sector.electricity_distribution_grid
        effect: "true makes GSHP draw from the low voltage bus (distribution grid cost)."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: costs.overwrites
        effect: "Override the 'decentral ground-sourced heat pump' investment/lifetime/efficiency."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: existing_capacities.grouping_years_heat
        effect: "Myopic vintage intervals for the existing GSHP stock."
        default: "[1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019]"
        provenance: "config/config.default.yaml:grouping_years_heat; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
    boundary:
      - variant: "GSHP competes for rural heat supply"
        rung: L0
        note: "default — rural list holds [air, ground], both offered at every rural heat bus"
      - variant: "offer GSHP in urban decentral (or urban central district heating)"
        rung: L1
        note: "append 'ground' to the respective sector.heat_pump_sources list; the COP chain resolves temp_soil automatically (urban central then uses the Jensen central approximator with soil temperature)"
      - variant: "change sink/flow temperature"
        rung: L1
        note: "sector.heat_pump_sink_T_individual_heating (decentral systems)"
      - variant: "different soil COP regression"
        rung: L2
        note: "coefficients hardcoded in _approximate_cop_ground_source (scripts/build_cop_profiles/decentral_heating_cop_approximator.py)"
      - variant: "existing GSHP stock (brownfield)"
        rung: L0
        note: "automatic in myopic runs; note build_existing_heating_distribution forces ALL existing ground heat pumps into rural systems"
      - variant: "borehole/ground potential limit per node"
        rung: L2
        note: "no key; set p_nom_max on the GSHP n.add in add_heat (static cap) — the limited_heat_sources potential machinery only serves urban central sources and would need rule plumbing (L4) to feed a ground potential CSV"
      - variant: "drilling-cost supply curve / depth-dependent cost"
        rung: L5
        note: "single capital cost per technology; a supply curve needs multiple cost tranches (new links) or bespoke code — the EGS potential machinery (build_egs_potentials) is the nearest template"
      - variant: "seasonal ground thermal depletion / regeneration"
        rung: L5
        note: "soil temperature is exogenous weather data; feedback of extraction on source temperature is not modelled anywhere (closest analogue: ptes temperature machinery in build_ptes_operations)"
    where:
      - change: "GSHP link creation per system"
        anchor: "scripts/prepare_sector_network.py::add_heat (heat pump loop; costs via HeatSystem.heat_pump_costs_name)"
        provenance: "scripts/prepare_sector_network.py:add_heat; scripts/definitions/heat_system.py:heat_pump_costs_name"
      - change: "ground COP regression"
        anchor: "scripts/build_cop_profiles/decentral_heating_cop_approximator.py::_approximate_cop_ground_source (rule build_cop_profiles)"
        provenance: "scripts/build_cop_profiles/decentral_heating_cop_approximator.py:_approximate_cop_ground_source"
      - change: "soil temperature input"
        anchor: "scripts/build_temperature_profiles.py (cutout.soil_temperature, rule build_temperature_profiles)"
        provenance: "scripts/build_temperature_profiles.py:soil_temperature"
      - change: "which temperature file feeds which source name"
        anchor: "rules/build_sector.smk::input_heat_source_temperature (replace_names maps ground -> soil_total)"
        provenance: "rules/build_sector.smk:input_heat_source_temperature; rules/build_sector.smk:replace_names"
      - change: "existing stock reassignment to rural + vintaging"
        anchor: "scripts/build_existing_heating_distribution.py::build_existing_heating; scripts/add_existing_baseyear.py::add_heating_capacities_installed_before_baseyear"
        provenance: "scripts/build_existing_heating_distribution.py:build_existing_heating; scripts/add_existing_baseyear.py:add_heating_capacities_installed_before_baseyear"
    data_dependencies:
      - input: "atlite cutout with soil temperature (sector.heat_demand_cutout)"
        required_for: "temp_soil_total -> ground COP"
        availability: "exists by default (cutout chain)"
      - input: "cost row 'decentral ground-sourced heat pump' (and 'central ground-sourced heat pump' if offered in urban central)"
        required_for: "capital cost, lifetime, static efficiency"
        availability: "decentral row exists by default in technology-data; verify the central row before adding 'ground' to urban central"
      - input: "data/existing_infrastructure/existing_heating_raw.csv (column 'ground heat pump')"
        required_for: "myopic existing stock"
        availability: "exists by default in the repo"
