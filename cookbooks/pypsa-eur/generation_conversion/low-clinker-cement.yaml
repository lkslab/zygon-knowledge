id: low-clinker-cement
title: Low-clinker cement
summary: >
  Cutting cement CO2 by substituting clinker with supplementary cementitious
  materials (SCMs, calcined clays, limestone fillers) — reducing both process
  emissions from calcination and kiln fuel demand per tonne of cement.
when_to_use:
  - "low clinker cement"
  - "clinker substitution / clinker ratio"
  - "SCM / calcined clay / LC3 cement"
  - "reduce cement process emissions"
  - "green cement"
  - "cement decarbonisation"
  - "cement kiln fuel"
  - "cement energy demand"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Nothing clinker-substitution-specific. Cement exists as an exogenous
        demand sector: build_industry_sector_ratios::nonmetalic_mineral_products
        derives MWh/t and tCO2/t from JRC-IDEES ("Cement: Clinker production
        (kilns)" fuels kept as biomass plus everything-else-to-methane;
        calcination process emissions per tonne from the IDEES emissions
        sheet). Cement tonnage passes UNCHANGED through
        build_industrial_production_per_country_tomorrow — unlike steel,
        aluminium and HVC, cement has NO future-route lever there. Process
        emissions become part of the "process emissions" Load in add_industry,
        which can be vented or captured by the always-present "process
        emissions CC" Link (cement capture cost row) — capture, not clinker
        reduction, is the model's only endogenous cement-CO2 measure. With
        sector.industry_t.endogen, Cement is endogenised by default: its kiln
        fuel is mapped to the Fleiter "Clinker" temperature rows (mostly the
        heat>500 band, where the menu is methane or hydrogen, each gas variant
        with CC), so the KILN FUEL choice becomes endogenous — the clinker
        share still does not. Spatially, cement is distributed by the GEM
        cement tracker with a hardcoded clinker_cement_ratio = 0.737 (used
        only as a capacity conversion in the distribution key, not as a
        modelling lever).
      mechanism: >
        rule build_industry_sector_ratios (Cement block) -> rule
        build_industry_sector_ratios_intermediate (today/future blend via
        industry.sector_ratios_fraction_future) -> rule
        build_industrial_production_per_country(_tomorrow) -> rule
        build_industrial_distribution_key (prepare_gem_cement_database,
        clinker/integrated/grinding capacity logic) -> rule
        build_industrial_energy_demand_per_node -> add_industry ("process
        emissions" load + fuel/electricity loads; band buses if endogen).
      not_covered: >
        No clinker-share parameter anywhere in config — neither production
        tonnage nor the process-emission intensity (tCO2/t cement) can be
        reduced from config to represent SCM substitution. No SCM/calcined
        clay technology, availability data or cost row. No distinction
        between clinker and cement as products in the energy model (only the
        distribution key knows the difference). No endogenous choice between
        clinker substitution and capture — capture is available, substitution
        is not representable without edits. Cement demand is not
        price-elastic.
      provenance: "scripts/build_industry_sector_ratios.py:nonmetalic_mineral_products; scripts/build_industrial_production_per_country_tomorrow.py:HVC_primary_fraction; scripts/prepare_sector_network.py:process emissions CC; scripts/build_industrial_distribution_key.py:clinker_cement_ratio; scripts/build_industry_sector_ratios_endogenous.py:Clinker"
    levers:
      - key: industry.sector_ratios_fraction_future
        effect: "Blends today's cement intensities towards the future ratios (fuel-switching to methane/biomass, electrified grinding) — affects energy, not the calcination emission factor path."
        default: "{2020: 0.0, ..., 2050: 1.0}"
        provenance: "config/config.default.yaml:sector_ratios_fraction_future; scripts/build_industry_sector_ratios_intermediate.py:sector_ratios_fraction_future"
      - key: sector.industry_t.endogenise_sectors.Cement
        effect: "With industry_t.endogen true, moves cement kiln heat into the temperature bands so the fuel (gas vs hydrogen at >500 °C, plus CC variants) is chosen endogenously."
        default: "true (inactive while industry_t.endogen is false)"
        provenance: "config/config.default.yaml:endogenise_sectors; scripts/build_industry_sector_ratios_endogenous.py:Cement"
      - key: sector.co2_sequestration_potential
        effect: "Per-horizon cap on sequestered CO2 — governs how much captured cement process CO2 can actually be stored."
        default: "{2020: 0, 2025: 0, 2030: 40, 2035: 100, 2040: 180, 2045: 250, 2050: 250} (MtCO2/a)"
        provenance: "config/config.default.yaml:co2_sequestration_potential; scripts/solve_network.py:add_co2_sequestration_limit"
      - key: sector.industry
        effect: "Master switch for industry demand incl. cement."
        default: "true"
        provenance: "config/config.default.yaml:industry; scripts/prepare_sector_network.py:add_industry"
    boundary:
      - variant: "capture cement process emissions instead of reducing clinker"
        rung: L0
        note: "already endogenous — the 'process emissions CC' link (cement capture cost row) is always added; sequestration limits and CO2 network govern uptake (see industrial-ccs recipe)"
      - variant: "endogenous kiln fuel choice (gas vs hydrogen vs CC)"
        rung: L0
        note: "sector.industry_t.endogen: true with the default Cement flag — heat>500 band menu"
      - variant: "lower clinker ratio: cut cement process emissions per tonne by X%"
        rung: L2
        note: "no config key — scale the 'process emission' entry of the Cement block in build_industry_sector_ratios.py (future ratios) and note today's country ratios blend in via fraction_future; alternatively post-process the industry_sector_ratios_{year} resource (L3)"
      - variant: "lower cement demand (material efficiency)"
        rung: L2
        note: "no cement demand factor exists (contrast sector.HVC_demand_factor for chemicals); scale the Cement column in build_industrial_production_per_country(_tomorrow) — a one-line edit"
      - variant: "SCM/calcined-clay production as a technology with its own energy demand"
        rung: L5
        note: "needs new material-flow representation (clinker vs SCM buses, calcination link at ~800 °C, availability data) — nothing to build on"
      - variant: "endogenous clinker-substitution vs capture trade-off"
        rung: L5
        note: "requires clinker share as a decision variable — bespoke components plus cost data"
      - variant: "re-site cement production"
        rung: L3
        note: "edit the GEM cement tracker input (rule retrieve_gem_cement_concrete_tracker) or the capacity logic in prepare_gem_cement_database (L2)"
    where:
      - change: "cement energy and process-emission intensities"
        anchor: "scripts/build_industry_sector_ratios.py::nonmetalic_mineral_products (Cement block)"
        provenance: "scripts/build_industry_sector_ratios.py:nonmetalic_mineral_products"
      - change: "cement production tomorrow (currently pass-through)"
        anchor: "scripts/build_industrial_production_per_country_tomorrow.py (add a Cement scaling analogous to the HVC block)"
        provenance: "scripts/build_industrial_production_per_country_tomorrow.py:HVC_primary_fraction"
      - change: "process emission venting vs capture"
        anchor: "scripts/prepare_sector_network.py::add_industry ('process emissions' and 'process emissions CC' links)"
        provenance: "scripts/prepare_sector_network.py:process emissions CC"
      - change: "cement siting from GEM tracker"
        anchor: "scripts/build_industrial_distribution_key.py::prepare_gem_cement_database and the cement key block"
        provenance: "scripts/build_industrial_distribution_key.py:prepare_gem_cement_database"
      - change: "cement temperature-band mapping"
        anchor: "scripts/build_industry_sector_ratios_endogenous.py::process_temperature_band_mapper (Cement -> Clinker rows)"
        provenance: "scripts/build_industry_sector_ratios_endogenous.py:process_temperature_band_mapper"
    data_dependencies:
      - input: "JRC-IDEES Non-metallic mineral products sheets"
        required_for: "cement intensities and calcination emissions"
        availability: "retrieved by the workflow (rule retrieve_jrc_idees)"
      - input: "GEM Global Cement and Concrete Tracker xlsx"
        required_for: "nodal cement distribution (clinker/integrated/grinding capacities)"
        availability: "retrieved by the workflow (rule retrieve_gem_cement_concrete_tracker)"
      - input: "cost row 'cement capture' in the technology-data costs file"
        required_for: "the capture alternative to clinker reduction"
        availability: "exists by default via retrieve_cost_data"
      - input: "SCM / calcined clay availability and cost data"
        required_for: "any real clinker-substitution technology"
        availability: "absent — would have to be sourced"
