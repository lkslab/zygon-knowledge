id: natural-gas-pipelines
title: Natural gas pipeline network
summary: >
  The methane transmission grid — real pipeline topology and capacities,
  clustering to model regions, expansion candidates, compression losses,
  and retrofitting pipelines to hydrogen.
when_to_use:
  - "gas network / gas grid"
  - "gas pipelines"
  - "gas transmission capacity"
  - "repurpose gas pipelines for hydrogen / H2 retrofit"
  - "SciGRID gas data"
  - "gas transport between regions"
  - "new gas pipeline / interconnector"
  - "gas distribution grid"
  - "pypsa-eur carrier names: gas pipeline, gas pipeline new, H2 pipeline retrofitted"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        A REAL, data-derived gas grid, on by default (sector.gas_network:
        true). rule build_gas_network parses the SciGRID_gas IGGIELGN pipe
        segments: capacities from reported max flow (437.5 MW per MCM/day)
        cross-checked against a diameter-based estimate (diameter_to_capacity,
        European Hydrogen Backbone interpolation), implausible capacities and
        lengths corrected, pipes under 10 km treated as bidirectional
        (prepare_dataset). rule cluster_gas_network maps endpoints to the
        clustered onshore/offshore regions, drops intra-region pipes,
        aggregates parallel pipes (capacity summed, p_min_pu = -1 kept only if
        all parallels are bidirectional) and names them "gas pipeline <r0> <->
        <r1>" (reindex_pipes). In prepare_sector_network,
        add_h2_gas_infrastructure turns them into "gas pipeline" Links between
        per-node gas buses — by default NON-extendable with p_nom fixed at
        today's capacity and zero investment relevance (lifetime inf). It then
        guarantees minimum topology: a graph of pipes > 1500 MW is checked for
        connectivity and k_edge_augmentation (k =
        sector.gas_network_connectivity_upgrade) proposes extendable
        "gas pipeline new" candidate Links (bidirectional, CH4 pipeline
        capital cost) where regions would otherwise be disconnected.
        Compression is a real ELECTRICITY demand: lossy_bidirectional_links
        ("gas pipeline" is in sector.transmission_efficiency.enable) wires
        bus2 to the electricity bus at each pipe's origin with efficiency2 =
        -compression_per_1000km (0.01) x length/1000 — gas flow consumes
        power at the sending node in either direction.
        H2 retrofit: with sector.H2_retrofit: true, gas pipes become
        extendable-DOWN (p_nom_max = today's capacity, p_nom_min = 0, tiny
        0.1 EUR/MWkm/a cost to prefer decommissioning) and a parallel
        "H2 pipeline retrofitted" candidate is added per pipe with p_nom_max
        = p_nom * sector.H2_retrofit_capacity_per_CH4; the WIRED solver
        constraint add_pipe_retrofit_constraint (always called from
        extra_functionality) enforces gas + H2/0.6 = original capacity per
        corridor. In myopic foresight, add_brownfield carries retrofit
        decisions across horizons by subtracting already-retrofitted capacity
        from both the remaining gas grid and the remaining retrofit potential.
      mechanism: >
        rules build_gas_network -> cluster_gas_network ->
        prepare_sector_network (inputs clustered_gas_network +
        gas_input_nodes); entry-point/LNG/production/storage siting comes from
        rule build_gas_input_locations (see fossil-fuel-supply recipe).
        Post-solve discretisation of pipe capacities to 1500 MW units is
        available via solving.options.post_discretization. The gas
        DISTRIBUTION grid is not a network at all — sector.gas_distribution_
        grid just adds distribution capex to decentral gas boilers and micro
        CHP (insert_gas_distribution_costs).
      not_covered: >
        No endogenous NEW gas corridors beyond the connectivity augmentation —
        "gas pipeline new" candidates only appear where the >1500 MW graph is
        disconnected (with the default full SciGRID network usually few or
        none); arbitrary new interconnectors need an edit. Existing pipes are
        never expandable (p_nom_max = p_nom even under H2_retrofit — capacity
        can only move to hydrogen or be decommissioned). No intra-nodal gas
        constraints (each region is a single gas bus), no pressure/linepack
        modelling, no gas storage injection/withdrawal rate limits (storage is
        an energy Store — see fossil-fuel-supply). Pipe build_year from
        SciGRID is parsed but no age-based retirement is applied (lifetime
        inf). H2_retrofit defaults to FALSE — the retrofit market is opt-in.
      provenance: "scripts/build_gas_network.py:prepare_dataset; scripts/build_gas_network.py:diameter_to_capacity; scripts/cluster_gas_network.py:build_clustered_gas_network; scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/add_brownfield.py:add_brownfield"
    levers:
      - key: sector.gas_network
        effect: "Master switch: true = real per-node gas grid with fixed pipeline Links; false = single EU gas bus (no pipes, unlimited supply)."
        default: "true"
        provenance: "config/config.default.yaml:gas_network; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.H2_retrofit
        effect: "true enables pipeline repurposing: gas pipes become decommissionable and 'H2 pipeline retrofitted' candidates appear, coupled by add_pipe_retrofit_constraint."
        default: "false"
        provenance: "config/config.default.yaml:H2_retrofit; scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/solve_network.py:add_pipe_retrofit_constraint"
      - key: sector.H2_retrofit_capacity_per_CH4
        effect: "MW H2 obtainable per MW CH4 capacity when retrofitting (energy-basis conversion factor)."
        default: "0.6"
        provenance: "config/config.default.yaml:H2_retrofit_capacity_per_CH4; scripts/solve_network.py:add_pipe_retrofit_constraint"
      - key: sector.gas_network_connectivity_upgrade
        effect: "k for k_edge_augmentation — how many independent paths every gas region must have; raises the number of 'gas pipeline new' candidates."
        default: "1"
        provenance: "config/config.default.yaml:gas_network_connectivity_upgrade; scripts/prepare_sector_network.py:add_h2_gas_infrastructure"
      - key: sector.transmission_efficiency
        effect: "The 'gas pipeline' entry (compression_per_1000km: 0.01) sets length-dependent compression electricity demand at the sending bus (bus2/efficiency2 wired by lossy_bidirectional_links); remove 'gas pipeline' from the enable list to disable."
        default: "enable includes gas pipeline; compression_per_1000km: 0.01"
        provenance: "config/config.default.yaml:transmission_efficiency; scripts/prepare_sector_network.py:lossy_bidirectional_links"
      - key: sector.gas_distribution_grid
        effect: "true adds distribution-grid capital cost (times sector.gas_distribution_grid_cost_factor) to decentral gas consumers — a cost adder, not a network."
        default: "true"
        provenance: "config/config.default.yaml:gas_distribution_grid; scripts/prepare_sector_network.py:insert_gas_distribution_costs"
      - key: solving.options.post_discretization
        effect: "enable: true snaps optimised pipeline capacities to integer units (link_unit_size gas pipeline: 1500 MW, threshold 0.3) after solving."
        default: "enable: false"
        provenance: "config/config.default.yaml:post_discretization; scripts/solve_network.py:post_discretization"
      - key: clustering.mode
        effect: "Region definition (busmap/administrative) determines gas bus granularity — pipes cluster to whatever regions_onshore the electricity clustering produced."
        default: "busmap"
        provenance: "config/config.default.yaml:mode; scripts/cluster_gas_network.py:load_bus_regions"
    boundary:
      - variant: "run with today's gas grid, fixed capacities"
        rung: L0
        note: "default (sector.gas_network true, H2_retrofit false)"
      - variant: "ignore gas transport (copperplate gas)"
        rung: L0
        note: "sector.gas_network: false"
      - variant: "let the model repurpose gas pipes to hydrogen"
        rung: L0
        note: "sector.H2_retrofit: true — the retrofit constraint is already wired into extra_functionality; tune the yield with H2_retrofit_capacity_per_CH4 (L1)"
      - variant: "stronger guaranteed connectivity / more new-pipe candidates"
        rung: L1
        note: "raise sector.gas_network_connectivity_upgrade (k-edge augmentation)"
      - variant: "remove or change compression losses"
        rung: L1
        note: "edit sector.transmission_efficiency (drop 'gas pipeline' from enable or change compression_per_1000km)"
      - variant: "allow expansion of existing gas pipeline capacity"
        rung: L2
        note: "in add_h2_gas_infrastructure the non-retrofit branch sets p_nom_extendable False with p_nom_max inf unused — flip extendable True and give a CH4 pipeline capital cost (the cost row 'CH4 (g) pipeline' is already used for new pipes)"
      - variant: "add a specific planned pipeline / interconnector"
        rung: L3
        note: "append a row to the clustered gas network CSV (resources gas_network_base_s_{clusters}.csv) or the upstream gas_network.csv — columns bus0, bus1, p_nom, p_min_pu, length, name"
      - variant: "change capacity estimates for poorly-reported pipes"
        rung: L2
        note: "tune the correction thresholds / diameter mapping in build_gas_network.py::prepare_dataset (correction_threshold_p_nom, diameter_to_capacity)"
      - variant: "pipe-level decommissioning by age"
        rung: L2
        note: "build_year survives into the cleaned data; apply lifetimes in add_h2_gas_infrastructure instead of lifetime=inf"
      - variant: "explicit gas distribution network below the region level"
        rung: L5
        note: "only a capex adder exists (insert_gas_distribution_costs); a real distribution topology is out of scope of the data and code"
      - variant: "linepack / pressure / flow physics"
        rung: L5
        note: "pipes are transport Links with static efficiency — no gas flow physics anywhere"
    where:
      - change: "raw pipe parsing, capacity/length corrections, bidirectionality"
        anchor: "scripts/build_gas_network.py::prepare_dataset / ::diameter_to_capacity (rule build_gas_network)"
        provenance: "scripts/build_gas_network.py:prepare_dataset; rules/build_sector.smk:build_gas_network"
      - change: "clustering pipes to regions, parallel-pipe aggregation, naming"
        anchor: "scripts/cluster_gas_network.py::build_clustered_gas_network / ::aggregate_parallel_pipes / ::reindex_pipes (rule cluster_gas_network)"
        provenance: "scripts/cluster_gas_network.py:aggregate_parallel_pipes; scripts/cluster_gas_network.py:reindex_pipes"
      - change: "gas pipeline Links, retrofit candidates, connectivity augmentation"
        anchor: "scripts/prepare_sector_network.py::add_h2_gas_infrastructure (gas_network / H2_retrofit blocks)"
        provenance: "scripts/prepare_sector_network.py:add_h2_gas_infrastructure; scripts/prepare_sector_network.py:gas pipeline new"
      - change: "retrofit coupling constraint (gas + H2 = original capacity)"
        anchor: "scripts/solve_network.py::add_pipe_retrofit_constraint (always called in ::extra_functionality)"
        provenance: "scripts/solve_network.py:add_pipe_retrofit_constraint; scripts/solve_network.py:extra_functionality"
      - change: "carrying retrofit state across myopic horizons"
        anchor: "scripts/add_brownfield.py::add_brownfield (h2_retrofit branch)"
        provenance: "scripts/add_brownfield.py:add_brownfield"
      - change: "compression losses"
        anchor: "scripts/prepare_sector_network.py::lossy_bidirectional_links (sector.transmission_efficiency loop in __main__)"
        provenance: "scripts/prepare_sector_network.py:lossy_bidirectional_links"
    data_dependencies:
      - input: "SciGRID_gas IGGIELGN_PipeSegments.geojson"
        required_for: "the entire pipeline topology and capacities"
        availability: "retrieved by rule retrieve_gas_infrastructure_data (European coverage only)"
      - input: "clustered onshore/offshore region geometries (regions_onshore_base_s_{clusters})"
        required_for: "mapping pipe endpoints to gas buses"
        availability: "must be built (clustering chain), default in workflow"
      - input: "cost rows 'CH4 (g) pipeline', 'H2 (g) pipeline repurposed'"
        required_for: "new pipeline candidates and retrofit economics"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "gas_input_nodes_simplified.csv (entry/LNG/production/storage per region)"
        required_for: "which gas buses keep supply generators (see fossil-fuel-supply)"
        availability: "must be built (rule build_gas_input_locations)"
