id: nuclear-fusion
title: Nuclear fusion (emerging)
summary: >
  Fusion power plants as a prospective firm low-carbon generation technology
  (tokamak/stellarator/inertial concepts, no operating fleet today).
when_to_use:
  - "add fusion power"
  - "model nuclear fusion"
  - "fusion reactors in future scenarios"
  - "tokamak / stellarator electricity"
  - "what if fusion becomes available by 2050"
  - "firm clean generation beyond fission"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Not covered — grounded absence. "fusion" appears nowhere in
        config/config.default.yaml, rules/ or scripts/ (the only repo hit is a
        Spanish wind farm named "Fusionado" in the shipped powerplants
        archive). It is not in electricity.conventional_carriers ([nuclear,
        oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]) or
        electricity.renewable_carriers, there is no fusion cost row in the
        processed technology-data file, and no plants exist in
        powerplantmatching.
      mechanism: >
        Nearest machinery for introducing it: the conventional-carrier
        pipeline. attach_conventional_generators attaches any carrier listed
        in electricity.conventional_carriers / extendable_carriers.Generator
        that has cost data and powerplant rows; add_everywhere_powerplants can
        seed zero-capacity candidate units of a given fueltype at every
        substation; overwrite_costs can create cost rows that do not exist in
        technology-data from data/custom_costs.csv (it concatenates missing
        technologies). Conventional nuclear is the closest template for a
        firm, low-carbon, fuel-priced generator.
      not_covered: >
        Everything: no carrier, no cost row, no availability data, no siting
        logic, no fuel cycle. Any fusion representation is user-constructed.
      provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators; scripts/build_powerplants.py:add_everywhere_powerplants; scripts/process_cost_data.py:overwrite_costs"
    levers:
      - key: electricity.extendable_carriers.Generator
        effect: "The list a new 'fusion' carrier (or the 'nuclear' proxy) must join to be expandable; extendable candidates are placed only at buses with powerplant rows of that carrier, so fusion needs seeded rows (everywhere_powerplants or custom_powerplants)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.conventional_carriers
        effect: "The list a new fusion carrier joins for (custom) plants to be attached with fixed capacity."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.everywhere_powerplants
        effect: "Seeds zero-capacity plants of the listed fueltypes at ALL substations — with a fusion fueltype/carrier wired through, this gives buildable-anywhere fusion candidates ('Nuclear' works out of the box for the proxy route)."
        default: "[] (empty)"
        provenance: "config/config.default.yaml:everywhere_powerplants; scripts/build_powerplants.py:add_everywhere_powerplants"
      - key: electricity.custom_powerplants
        effect: "Pandas query (or true) to inject user-authored fusion candidate units from data/custom_powerplants.csv."
        default: "false"
        provenance: "config/config.default.yaml:custom_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - key: costs.custom_cost_fn
        effect: "Custom costs CSV that can CREATE a 'fusion' technology row (investment, FOM, VOM, fuel, efficiency, lifetime, zero CO2 intensity) — overwrite_costs concatenates technologies missing from technology-data."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: costs.overwrites
        effect: "Config-level cost overwrites for the costed-down-nuclear proxy route (deprecated in favour of custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: solving.constraints.CCL
        effect: "Country-wise capacity caps/floors per carrier from data/agg_p_nom_minmax.csv — e.g. to limit fusion deployment per country."
        default: "false"
        provenance: "config/config.default.yaml:CCL; scripts/solve_network.py:add_CCL_constraints"
    boundary:
      - variant: "crude proxy: fusion as costed-down extendable nuclear"
        rung: L1
        note: >
          add 'nuclear' to electricity.extendable_carriers.Generator, seed all
          buses with electricity.everywhere_powerplants: ['Nuclear'], and
          overwrite nuclear costs via costs.overwrites — conflates the two
          technologies and inherits the nuclear availability derating
          (conventional.nuclear.p_max_pu)
      - variant: "distinct fusion carrier in the electricity workflow"
        rung: L3
        note: >
          (a) 'fusion' cost row in data/custom_costs.csv (costs.custom_cost_fn),
          (b) carrier in electricity.conventional_carriers /
          extendable_carriers.Generator, (c) candidate rows in
          data/custom_powerplants.csv whose Fueltype yields the 'fusion'
          carrier (fueltype-to-carrier mapping happens in
          load_and_aggregate_powerplants via powerplantmatching's
          to_pypsa_names — verify the resulting carrier string on
          powerplants_s_{clusters}.csv before trusting placement)
      - variant: "availability-year gating (fusion buildable only from e.g. 2050)"
        rung: L3
        note: >
          set DateIn on the custom rows — build_year/lifetime are carried onto
          the generators by load_and_aggregate_powerplants and
          attach_conventional_generators — and use myopic foresight so
          planning horizons before DateIn exclude it; in overnight runs
          electricity.powerplants_filter can drop it instead
      - variant: "fusion as an extendable Link in sector runs"
        rung: L3
        note: >
          add '<fusion-row-name>: <carrier>' to sector.conventional_generation
          (add_generation prices the per-node Link from the cost row of that
          name and hooks bus0 to the carrier's spatial nodes) — the carrier
          must have a namespace in define_spatial, so either reuse one (e.g.
          uranium, which at this ref lacks a fuel-supply generator in
          add_carrier_buses — see the conventional-nuclear recipe) or add a
          namespace (L2 on top)
      - variant: "cap fusion per country"
        rung: L1
        note: "solving.constraints.CCL: true + rows in data/agg_p_nom_minmax.csv"
      - variant: "fusion-specific operational detail (tritium breeding, pulsed operation, recirculating power)"
        rung: L5
        note: "no machinery exists; bespoke component logic plus constraints in solve_network.py extra_functionality"
    where:
      - change: "introducing the carrier (attachment + extendable placement)"
        anchor: "scripts/add_electricity.py::attach_conventional_generators / ::load_and_aggregate_powerplants (rule add_electricity)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/add_electricity.py:load_and_aggregate_powerplants"
      - change: "cost row creation / overrides"
        anchor: "scripts/process_cost_data.py::overwrite_costs (rule process_cost_data; costs.custom_cost_fn)"
        provenance: "scripts/process_cost_data.py:overwrite_costs; config/config.default.yaml:custom_cost_fn"
      - change: "candidate fusion units (seeded everywhere or user-authored)"
        anchor: "scripts/build_powerplants.py::add_everywhere_powerplants / ::add_custom_powerplants (rule build_powerplants)"
        provenance: "scripts/build_powerplants.py:add_everywhere_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - change: "sector-run generation Links keyed by cost-row name"
        anchor: "scripts/prepare_sector_network.py::add_generation (sector.conventional_generation; spatial namespaces in define_spatial)"
        provenance: "scripts/prepare_sector_network.py:add_generation; scripts/prepare_sector_network.py:define_spatial"
      - change: "bespoke operational constraints"
        anchor: "scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality"
    data_dependencies:
      - input: "fusion cost row (investment, FOM, VOM, efficiency, lifetime, zero CO2 intensity)"
        required_for: "any fusion carrier"
        availability: "absent — author in data/custom_costs.csv (created by overwrite_costs) or a fork of technology-data"
      - input: "data/custom_powerplants.csv candidate units"
        required_for: "placing fusion capacity at buses (extendable placement follows powerplant rows)"
        availability: "template exists by default; rows user-authored"
      - input: "powerplantmatching database"
        required_for: "nothing directly — no fusion plants exist in it"
        availability: "absent for fusion by definition"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "per-country deployment caps (CCL)"
        availability: "template exists by default; rows user-authored"
