id: offshore-wind
title: Offshore wind (fixed-bottom)
summary: >
  Fixed-bottom wind generation in maritime zones, split into near-shore
  (AC-connected) and far-shore (DC-connected) carriers with depth-, shore-
  distance- and shipping-lane-limited potentials and endogenous
  grid-connection cost adders.
when_to_use:
  - "add offshore wind"
  - "wind at sea / marine wind farms"
  - "offwind-ac / offwind-dc"
  - "change allowed water depth or distance from shore"
  - "offshore wind connection cost"
  - "increase or limit offshore wind potential"
  - "exclude shipping lanes from wind siting"
  - "existing offshore wind fleet"
  - "pypsa-eur carrier names: offwind-ac, offwind-dc, offshore wind (AC), offshore wind (DC)"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Fully covered with two fixed-bottom carriers, both default renewable
        AND extendable: 'offwind-ac' (max_shore_distance 30 km, i.e. within
        30 km of the coast) and 'offwind-dc' (min_shore_distance 30 km,
        beyond it), both limited to max_depth 60 m via the GEBCO bathymetry
        exclusion — deeper water is covered by the separate default
        'offwind-float' carrier (min_depth 60, its own recipe). Eligibility
        in rule determine_availability_matrix additionally excludes natura
        areas and busy shipping lanes (ship_threshold 400 on the
        rule build_ship_raster density raster); shore-distance bands are
        buffered country_shapes geometries. rule build_renewable_profiles
        (atlite wind method, turbine NREL_ReferenceTurbine_2020ATB_5.5MW,
        capacity_per_sqkm 2, correction_factor 0.8855) writes per-offshore-
        region profiles, p_nom_max and average_distance — for offshore
        technologies the distance of each eligible cell to the ONSHORE
        region shape (shoreline proxy). attach_wind_and_solar prices each
        carrier as: costs.at['offwind' (generic turbine row), 'capital_cost']
        + costs.at['<carrier>-station'] + connection_cost, where
        connection_cost = lines.length_factor * (average_distance *
        '<carrier>-connection-submarine' + landfall_length *
        '<carrier>-connection-underground'); landfall_length is 20 km (ac) /
        30 km (dc) from the renewable.<carrier>.landfall_length key.
        Existing offshore capacity: powerplantmatching plants with
        Technology 'Offshore' are force-attached via
        attach_renewable_powerplants under technology_mapping Offshore ->
        'offwind-ac' (ALL existing offshore lands on the ac carrier).
        Sector runs keep the carriers (pypsa_eur keep-list) and
        update_wind_solar_costs in prepare_sector_network.py re-derives the
        same connection-cost formula at the planning-year costs. Myopic
        vintages for offwind-ac via add_existing_renewables; the per-horizon
        land-use bookkeeping in add_land_use_constraint covers offwind-ac/dc.
      mechanism: >
        rule determine_availability_matrix (offshore branch: regions =
        regions_offshore_base_s_{clusters}.geojson; GEBCO max_depth/min_depth
        rasters, ship_density raster, min/max_shore_distance geometry
        buffers, natura) -> rule build_renewable_profiles (offshore regions;
        average_distance to the matching onshore region geometry) -> rule
        add_electricity (attach_wind_and_solar supcar 'offwind' branch adds
        the connection-cost adder and station cost). CCL country limits can
        treat all offshore carriers as one via
        solving.agg_p_nom_limits.agg_offwind ('offwind-all').
      not_covered: >
        Connection is a capital-cost ADDER, not modelled network components —
        no explicit offshore hub / meshed offshore grid topology, no
        endogenous AC-vs-DC choice (the split is a geometric 30 km rule via
        the shore-distance keys, not an optimisation). Both carriers share
        one turbine and the generic 'offwind' turbine capex row (only the
        station/connection rows differ; float is the only carrier with its
        own turbine row). Existing offshore capacity is not split ac/dc —
        technology_mapping maps 'Offshore' to a single carrier string.
        No wake modelling beyond the scalar correction_factor 0.8855. No
        international offshore bidding-zone assignment logic beyond the
        offshore Voronoi regions.
      provenance: "scripts/add_electricity.py:attach_wind_and_solar; scripts/determine_availability_matrix.py:ship_threshold; scripts/determine_availability_matrix.py:max_shore_distance; scripts/build_renewable_profiles.py:average_distance; scripts/prepare_sector_network.py:update_wind_solar_costs; config/config.default.yaml:technology_mapping"
    levers:
      - key: electricity.renewable_carriers
        effect: "Include/exclude 'offwind-ac' / 'offwind-dc' (remove for landlocked scopes; the assert in determine_availability_matrix fires if offshore regions are empty)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; scripts/determine_availability_matrix.py:regions"
      - key: electricity.extendable_carriers.Generator
        effect: "Whether offshore capacity is optimisable."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_wind_and_solar"
      - key: renewable.offwind-ac.max_depth
        effect: "Maximum water depth [m] for fixed-bottom eligibility (GEBCO np.greater exclusion; same key under offwind-dc). Raising it steals area from offwind-float's 60-1000 m band unless float's min_depth is raised too."
        default: "60.0"
        provenance: "config/config.default.yaml:max_depth; scripts/determine_availability_matrix.py:max_depth"
      - key: renewable.offwind-ac.max_shore_distance
        effect: "offwind-ac restricted to within this distance [m] of the country shapes."
        default: "30000.0"
        provenance: "config/config.default.yaml:max_shore_distance; scripts/determine_availability_matrix.py:max_shore_distance"
      - key: renewable.offwind-dc.min_shore_distance
        effect: "offwind-dc restricted to beyond this distance [m] from shore."
        default: "30000.0"
        provenance: "config/config.default.yaml:min_shore_distance; scripts/determine_availability_matrix.py:min_shore_distance"
      - key: renewable.offwind-ac.ship_threshold
        effect: "Cells with ship density above this are excluded (same key under offwind-dc/-float); lower = stricter shipping-lane exclusion."
        default: "400"
        provenance: "config/config.default.yaml:ship_threshold; scripts/determine_availability_matrix.py:ship_threshold"
      - key: renewable.offwind-ac.resource.turbine
        effect: "atlite offshore turbine power curve (per-carrier key; accepts {year: turbine} dict for myopic technology evolution)."
        default: "NREL_ReferenceTurbine_2020ATB_5.5MW"
        provenance: "config/config.default.yaml:turbine; scripts/build_renewable_profiles.py:models"
      - key: renewable.offwind-ac.landfall_length
        effect: "Fixed onshore/landfall cable length [km] priced at the '<carrier>-connection-underground' cost row (dc default 30, float 40)."
        default: "20.0"
        provenance: "config/config.default.yaml:landfall_length; scripts/add_electricity.py:landfall_lengths"
      - key: renewable.offwind-ac.capacity_per_sqkm
        effect: "MW installable per km2 of eligible sea area (same default under offwind-dc)."
        default: "2"
        provenance: "config/config.default.yaml:capacity_per_sqkm; scripts/build_renewable_profiles.py:capacity_per_sqkm"
      - key: renewable.offwind-ac.correction_factor
        effect: "Scalar wake/availability derating of the profile."
        default: "0.8855"
        provenance: "config/config.default.yaml:correction_factor; scripts/build_renewable_profiles.py:correction_factor"
      - key: renewable.offwind-ac.natura
        effect: "Exclude marine natura areas (same key under offwind-dc)."
        default: "true"
        provenance: "config/config.default.yaml:natura; scripts/determine_availability_matrix.py:natura"
      - key: lines.length_factor
        effect: "Scales the crow-flies distance in the offshore connection-cost adder (and transmission line lengths generally)."
        default: "1.25"
        provenance: "config/config.default.yaml:length_factor; scripts/add_electricity.py:line_length_factor"
      - key: electricity.estimate_renewable_capacities.technology_mapping
        effect: "Maps powerplantmatching 'Offshore' onto ONE carrier (default offwind-ac) for existing-fleet forcing."
        default: "{Offshore: offwind-ac, Onshore: onwind, PV: solar}"
        provenance: "config/config.default.yaml:technology_mapping; scripts/add_electricity.py:attach_renewable_powerplants"
      - key: solving.agg_p_nom_limits.agg_offwind
        effect: "true lumps offwind-ac/dc/float into one 'offwind-all' carrier in CCL country capacity limits."
        default: "false"
        provenance: "config/config.default.yaml:agg_offwind; scripts/solve_network.py:add_CCL_constraints"
      - key: adjustments.electricity
        effect: "Generic per-carrier factor/absolute overrides in prepare_network (e.g. scale offwind-dc capital_cost)."
        default: "false"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
    boundary:
      - variant: "run with AC + DC fixed-bottom offshore expansion"
        rung: L0
        note: "default; existing fleet forced onto offwind-ac"
      - variant: "allow deeper fixed-bottom sites / shift the AC-DC boundary"
        rung: L1
        note: "renewable.offwind-*.max_depth / max_shore_distance / min_shore_distance (keep float's min_depth consistent to avoid double-counting the 60 m band)"
      - variant: "stricter shipping-lane or protected-area exclusion"
        rung: L1
        note: "renewable.offwind-*.ship_threshold / natura"
      - variant: "different turbine or per-horizon turbine evolution"
        rung: L1
        note: "renewable.offwind-*.resource.turbine (single name or {year: turbine} dict; myopic profile switching via add_brownfield::adjust_renewable_profiles)"
      - variant: "cap or force offshore wind per country"
        rung: L1
        note: "solving.constraints.CCL + data/agg_p_nom_minmax.csv rows; agg_offwind: true for one aggregate offshore limit"
      - variant: "override station/connection cost assumptions"
        rung: L1
        note: "rows 'offwind-ac-station' / 'offwind-ac-connection-submarine' / '-underground' (and dc twins) in data/custom_costs.csv (costs.custom_cost_fn); the turbine part is the shared 'offwind' row"
      - variant: "split existing offshore fleet between ac and dc"
        rung: L2
        note: "technology_mapping maps 'Offshore' to a single carrier string; splitting by distance/plant needs a small edit in attach_renewable_powerplants (or curated data/custom_powerplants.csv rows, L3)"
      - variant: "distance-independent or user-defined connection cost formula"
        rung: L2
        note: "the formula is hardcoded in the supcar == 'offwind' branch of attach_wind_and_solar (and mirrored in prepare_sector_network::update_wind_solar_costs — edit BOTH for sector runs)"
      - variant: "explicit offshore grid: hubs, shared cables, meshed topology as network components"
        rung: L5
        note: "no mechanism — connection is a cost adder; modelled offshore buses/links would be bespoke network construction"
    where:
      - change: "offshore eligibility masks (depth, shore bands, shipping, natura)"
        anchor: "scripts/determine_availability_matrix.py (offshore branch; rule determine_availability_matrix with regions_offshore input)"
        provenance: "scripts/determine_availability_matrix.py:max_depth; rules/build_electricity.smk:regions_offshore_base_s_{clusters}.geojson"
      - change: "profile + average_distance computation over offshore regions"
        anchor: "scripts/build_renewable_profiles.py (offwind branch: distance to onshore region shapes)"
        provenance: "scripts/build_renewable_profiles.py:offshore_regions; scripts/build_renewable_profiles.py:average_distance"
      - change: "connection-cost formula + generator attachment"
        anchor: "scripts/add_electricity.py::attach_wind_and_solar (supcar == 'offwind' branch)"
        provenance: "scripts/add_electricity.py:connection_cost"
      - change: "sector-run re-costing of offshore carriers"
        anchor: "scripts/prepare_sector_network.py::update_wind_solar_costs"
        provenance: "scripts/prepare_sector_network.py:update_wind_solar_costs"
      - change: "existing-fleet carrier assignment"
        anchor: "scripts/add_electricity.py::attach_renewable_powerplants (electricity.estimate_renewable_capacities.technology_mapping)"
        provenance: "scripts/add_electricity.py:attach_renewable_powerplants"
      - change: "shipping-density raster"
        anchor: "rule build_ship_raster (input to determine_availability_matrix when ship_threshold set)"
        provenance: "rules/build_electricity.smk:build_ship_raster"
    data_dependencies:
      - input: "weather cutout (default europe-2013-sarah3-era5)"
        required_for: "offshore wind profiles"
        availability: "retrieved from archive by default"
      - input: "GEBCO bathymetry (rule retrieve_gebco)"
        required_for: "max_depth exclusion"
        availability: "retrieved by the workflow when a depth key is set"
      - input: "ship density raster (rule build_ship_raster)"
        required_for: "ship_threshold exclusion"
        availability: "built by the workflow from retrieved ship density data"
      - input: "offshore_shapes.geojson + regions_offshore_base_s_{clusters}.geojson (EEZ-based bus regions) and country_shapes.geojson for shore-distance buffers"
        required_for: "siting area, per-bus aggregation, shore bands"
        availability: "built by rules build_shapes / simplify_network / cluster_network"
      - input: "natura.tiff raster"
        required_for: "marine protected-area exclusion"
        availability: "retrieved by the workflow"
      - input: "technology-data cost rows 'offwind', 'offwind-ac-station', 'offwind-ac-connection-submarine', 'offwind-ac-connection-underground' (+ dc twins)"
        required_for: "capex incl. connection adder"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "powerplantmatching database (Technology Offshore)"
        required_for: "existing offshore fleet (forced onto offwind-ac)"
        availability: "retrieved by the workflow (rule build_powerplants)"
