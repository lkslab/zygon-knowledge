id: rooftop-distributed-solar
title: Rooftop / distributed solar
summary: >
  Customer-side PV on building rooftops connected at the distribution level,
  distinct from ground-mounted utility-scale PV.
when_to_use:
  - "add rooftop solar"
  - "solar panels on houses / buildings"
  - "distributed / behind-the-meter PV"
  - "residential solar"
  - "solar on the distribution grid / low voltage"
  - "split solar into rooftop and utility"
  - "rooftop PV potential"
  - "pypsa-eur carrier names: solar rooftop, low voltage, electricity distribution grid"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Two distinct rungs — distinguish them. (1) Electricity-only
        workflow: rooftop is NOT represented at all. There is no rooftop
        carrier, no distribution grid, and — unlike pypsa-earth — not even a
        cost blend: prepare_costs in scripts/process_cost_data.py sets the
        'solar' row's capital_cost to the pure 'solar-utility' value. (2)
        Sector workflow: rooftop is first-class and ON by default. With
        sector.electricity_distribution_grid true,
        insert_electricity_distribution_grid in prepare_sector_network.py
        adds per-node 'low voltage' buses, extendable 'electricity
        distribution grid' links (costed from the 'electricity distribution
        grid' row), re-points electric loads / BEV chargers / heat pumps /
        resistive heaters / micro CHP to the LV side, re-costs the existing
        HV 'solar' generators to 'solar-utility', and adds extendable
        'solar rooftop' Generators on the LV buses: capital_cost from the
        'solar-rooftop' cost row, p_max_pu COPIED from the utility solar
        generator at the same bus (same weather resource, different cost
        and connection point), p_nom_max from
        resources/solar_rooftop_potentials_s_{clusters}.csv. That potential
        is built by rule build_clustered_solar_rooftop_potentials from the
        WorldPop-style population layout with HARDCODED assumptions —
        'potentials = 0.1 * 20 * pd.Series(pop, ...)', i.e. 0.1 kW/m2 times
        20 m2/person (2 kW/person) — there are no config keys for these
        numbers (pypsa-earth has kW_per_m2/m2_per_person keys; pypsa-eur
        does not). Home batteries ('home battery' store + charger/
        discharger links on LV) are added in the same function. Myopic
        runs additionally split the EXISTING solar fleet: existing_
        capacities.solar_rooftop_ratio (default 0.5) sends half of the
        IRENA solar vintages to 'solar rooftop' with 'solar-rooftop' costs
        in add_existing_baseyear.py. 'solar rooftop' participates in
        add_land_use_constraint (myopic p_nom_max bookkeeping) and in CCL
        solar aggregation (solving.agg_p_nom_limits.agg_solar ->
        'solar-all').
      mechanism: >
        rule prepare_sector_network runs insert_electricity_distribution_grid
        when options['electricity_distribution_grid'] is true; the rooftop
        potentials input is wired only if 'solar' is in
        electricity.renewable_carriers (rules/build_sector.smk
        solar_rooftop_potentials lambda) — with the file empty the rooftop
        generator block is skipped (if len(fn) > 0). rule
        build_clustered_solar_rooftop_potentials intersects the population
        layout with the solar class regions (regions_by_class_{clusters}_
        solar.geojson), so rooftop potential follows the same bus/bin
        structure as utility solar.
      not_covered: >
        No rooftop in the electricity-only workflow at any rung short of
        code (no LV buses exist there). No dedicated rooftop switch: rooftop
        arrives with the distribution grid — disabling rooftop but keeping
        the LV layer has no config key. No rooftop-specific resource
        assessment (p_max_pu is the utility-solar profile — no orientation
        mix, shading, or temperature derating distinct from ground-mount).
        Potential assumptions (0.1 kW/m2, 20 m2/person) are hardcoded — no
        building-footprint data path (pypsa-earth's use_building_size has no
        eur counterpart). No commercial/residential rooftop split as
        carriers, although the costs file ships 'solar-rooftop residential'
        and 'solar-rooftop commercial' rows (only the aggregate
        'solar-rooftop' row is read). No net metering / retail tariff
        behaviour — rooftop is centrally optimised like any generator. The
        config key sector.electricity_distribution_grid_cost_factor exists
        (and is settable via the 'dist' opts wildcard in _helpers.py) but is
        READ NOWHERE at this ref — a dead key; use adjustments.sector
        (factor on 'electricity distribution grid' capital_cost, present in
        the default config) instead.
      provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/build_clustered_solar_rooftop_potentials.py:potentials = 0.1 * 20; scripts/process_cost_data.py:solar-utility; scripts/add_existing_baseyear.py:solar_rooftop_ratio; rules/build_sector.smk:build_clustered_solar_rooftop_potentials; scripts/_helpers.py:electricity_distribution_grid_cost_factor"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Master switch for the LV layer in sector runs — adds LV buses, distribution links, home batteries AND the 'solar rooftop' generators; false removes all of them."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: existing_capacities.solar_rooftop_ratio
        effect: "Myopic runs: share of existing IRENA solar capacity assigned to 'solar rooftop' vintages (rest is utility 'solar'); 0 disables existing rooftop."
        default: "0.5"
        provenance: "config/config.default.yaml:solar_rooftop_ratio; scripts/add_existing_baseyear.py:solar_rooftop_ratio"
      - key: electricity.renewable_carriers
        effect: "'solar' must be present for the rooftop potentials input (and the copied profile) to exist."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; rules/build_sector.smk:solar_rooftop_potentials"
      - key: adjustments.sector
        effect: "Factor/absolute attribute overrides in sector networks; the default config already carries the hook scaling Link 'electricity distribution grid' capital_cost (set != 1.0 to make the LV connection dearer/cheaper, shifting the rooftop-vs-utility balance)."
        default: "{factor: {Link: {electricity distribution grid: {capital_cost: 1.0}}}, absolute: false}"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
      - key: solving.agg_p_nom_limits.agg_solar
        effect: "true lumps 'solar rooftop' with solar/solar-hsat into one 'solar-all' carrier in CCL country limits (separate rooftop limits need agg_solar false + own CSV rows)."
        default: "false"
        provenance: "config/config.default.yaml:agg_solar; scripts/solve_network.py:add_CCL_constraints"
      - key: costs.custom_cost_fn
        effect: "Override the 'solar-rooftop' investment/lifetime (rooftop capex) via data/custom_costs.csv rows."
        default: "data/custom_costs.csv"
        provenance: "config/config.default.yaml:custom_cost_fn; scripts/process_cost_data.py:overwrite_costs"
      - key: sector.electricity_distribution_grid_cost_factor
        effect: "DEAD KEY at this ref: defined in config and set by the 'dist' opts wildcard, but consumed by no script (only the gas twin gas_distribution_grid_cost_factor is read) — do not rely on it; use adjustments.sector."
        default: "1.0"
        provenance: "config/config.default.yaml:electricity_distribution_grid_cost_factor; scripts/_helpers.py:electricity_distribution_grid_cost_factor"
    boundary:
      - variant: "rooftop as an explicit competing technology"
        rung: L0
        note: "already default in sector runs (sector.electricity_distribution_grid true + 'solar' in renewable_carriers); run the sector workflow"
      - variant: "no rooftop (and no LV layer)"
        rung: L0
        note: "sector.electricity_distribution_grid: false — removes rooftop, LV buses, home batteries and LV re-pointing together"
      - variant: "existing rooftop fleet in myopic runs"
        rung: L0
        note: "existing_capacities.solar_rooftop_ratio (default 0.5 already active)"
      - variant: "make the distribution connection cost drive rooftop competitiveness"
        rung: L1
        note: "adjustments.sector factor on Link 'electricity distribution grid' capital_cost (hook already in default config); NOT the dead electricity_distribution_grid_cost_factor key"
      - variant: "change rooftop capex"
        rung: L1
        note: "'solar-rooftop' row in data/custom_costs.csv"
      - variant: "keep LV layer but drop the rooftop generator (or vice versa)"
        rung: L2
        note: "no key — comment out the rooftop n.add('Generator', ...) block in insert_electricity_distribution_grid (it is already conditional on the potentials file being non-empty, so an alternative is patching the rule input to [])"
      - variant: "different rooftop potential assumptions (kW/m2, m2/person)"
        rung: L2
        note: "hardcoded 'potentials = 0.1 * 20 * ...' in build_clustered_solar_rooftop_potentials.py — one-line edit; no config keys (deliberate contrast to pypsa-earth)"
      - variant: "building-footprint-based potentials"
        rung: L3
        note: "no building dataset in the workflow; replace the population-based formula in build_clustered_solar_rooftop_potentials.py with a roof-area layer (new input data + the same output CSV format bus,bin,potential)"
      - variant: "rooftop-specific profile (orientation/shading distinct from utility)"
        rung: L2
        note: "p_max_pu is copied from the utility solar generators (n.generators_t.p_max_pu[solar]) in insert_electricity_distribution_grid; point it at a dedicated profile instead — building that profile cleanly means a new renewable.<name> block plus the L4 rule-routing caveat (onshore tuple in rules/build_electricity.smk)"
      - variant: "residential vs commercial rooftop carriers"
        rung: L2
        note: "cost rows 'solar-rooftop residential' / 'solar-rooftop commercial' already exist in the processed costs file; duplicate the rooftop n.add block with split potentials (potential split itself is the harder data question)"
      - variant: "rooftop in the electricity-only workflow"
        rung: L5
        note: "no LV buses exist there; either accept a same-bus second solar carrier (new renewable block + L4 rule routing) or port the LV machinery — bespoke"
      - variant: "net metering / retail-tariff self-consumption behaviour"
        rung: L5
        note: "no mechanism; generators are centrally optimised"
    where:
      - change: "rooftop generator creation, LV re-pointing, home batteries, utility re-costing"
        anchor: "scripts/prepare_sector_network.py::insert_electricity_distribution_grid (rule prepare_sector_network, options electricity_distribution_grid)"
        provenance: "scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "potential formula (0.1 kW/m2 * 20 m2/person on population layout)"
        anchor: "scripts/build_clustered_solar_rooftop_potentials.py (rule build_clustered_solar_rooftop_potentials)"
        provenance: "scripts/build_clustered_solar_rooftop_potentials.py:potentials = 0.1 * 20; rules/build_sector.smk:build_clustered_solar_rooftop_potentials"
      - change: "electricity-only 'solar' priced pure utility (no rooftop blend)"
        anchor: "scripts/process_cost_data.py::prepare_costs"
        provenance: "scripts/process_cost_data.py:prepare_costs"
      - change: "myopic existing rooftop vintages"
        anchor: "scripts/add_existing_baseyear.py (solar_rooftop_ratio split in the capacity pivot; cost_key_dict 'solar rooftop' -> 'solar-rooftop')"
        provenance: "scripts/add_existing_baseyear.py:cost_key_dict"
      - change: "myopic land-use bookkeeping incl. rooftop"
        anchor: "scripts/solve_network.py::add_land_use_constraint (carrier list includes 'solar rooftop')"
        provenance: "scripts/solve_network.py:add_land_use_constraint"
    data_dependencies:
      - input: "population layout pop_layout_total.nc (rule build_clustered_solar_rooftop_potentials input)"
        required_for: "rooftop potential"
        availability: "built by the sector workflow"
      - input: "regions_by_class_{clusters}_solar.geojson (class regions from build_renewable_profiles for 'solar')"
        required_for: "bus/bin allocation of rooftop potential"
        availability: "built whenever 'solar' is a renewable carrier"
      - input: "utility 'solar' generators + profiles in the elec network"
        required_for: "rooftop p_max_pu (copied per bus)"
        availability: "exists by default"
      - input: "technology-data cost rows 'solar-rooftop', 'electricity distribution grid', 'home battery storage', 'home battery inverter'"
        required_for: "rooftop capex, LV link cost, home batteries"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "IRENASTAT capacity statistics"
        required_for: "myopic existing rooftop vintages (solar_rooftop_ratio split)"
        availability: "exists by default (pm.data.IRENASTAT)"
