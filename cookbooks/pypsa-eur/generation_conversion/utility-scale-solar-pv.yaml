id: utility-scale-solar-pv
title: Utility-scale solar PV
summary: >
  Ground-mounted photovoltaic generation sited on eligible land, with
  weather-driven hourly output and land-availability-limited expansion
  potential, including fixed-tilt and single-axis-tracking variants.
when_to_use:
  - "add solar power"
  - "solar farms / solar parks"
  - "utility-scale PV"
  - "ground-mounted photovoltaics"
  - "single-axis tracking solar"
  - "increase / limit solar potential"
  - "change panel type or orientation"
  - "solar capacity factors look wrong"
  - "exclude protected areas or land classes from solar siting"
  - "how much solar can a country build"
  - "existing solar fleet / installed PV capacity"
  - "pypsa-eur carrier names: solar, solar-hsat"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Fully covered with TWO competing utility-scale carriers by default:
        'solar' (fixed-tilt, resource.orientation slope 35 / azimuth 180) and
        'solar-hsat' (horizontal single-axis tracking, resource.tracking:
        horizontal), both in electricity.renewable_carriers AND
        electricity.extendable_carriers.Generator. Land eligibility is
        computed by rule determine_availability_matrix (CORINE land-cover
        grid codes — an explicit include-list of classes; natura protected
        areas excluded when renewable.<tech>.natura is true; optional LUISA
        50m land-cover alternative via renewable.<tech>.luisa) at
        excluder_resolution 100 m. rule build_renewable_profiles then turns
        the availability matrix into per-cluster-region hourly profiles and
        p_nom_max with atlite (pv method), at capacity_per_sqkm 5.1 (solar) /
        4.43 (solar-hsat) MW/km2, optionally split into several capacity-
        factor resource classes per region (resource_classes, default 1;
        generators are then indexed "bus bin"). attach_wind_and_solar in
        scripts/add_electricity.py adds one Generator per bus(+bin) and
        carrier with p_max_pu, p_nom_max and capital_cost =
        costs.at[carrier, 'capital_cost']. IMPORTANT cost detail: prepare_
        costs in scripts/process_cost_data.py sets the 'solar' row's
        capital_cost to the 'solar-utility' row's value — the 'solar'
        carrier is priced PURE utility-scale (no rooftop blend, unlike
        pypsa-earth) — and renames 'solar-utility single-axis tracking' to
        'solar-hsat'. Existing PV capacity: with electricity.estimate_
        renewable_capacities.from_powerplantmatching true (default),
        attach_renewable_powerplants spatially joins powerplantmatching PV
        plants into the class regions and sets p_nom AND p_nom_min (existing
        capacity is forced into the extendable generators); an IRENASTAT
        country-total alternative exists (from_irenastat, default false,
        via estimate_renewable_capacities). Because fixed and tracking PV
        compete for the same land, extra_functionality in solve_network.py
        ALWAYS adds add_solar_potential_constraints when both carriers are
        active: solar_p_nom + solar_hsat_p_nom * (5.1/4.43) <= joint region
        potential. Myopic runs: add_existing_renewables in
        add_existing_baseyear.py builds IRENA-based vintage generators
        (existing solar split rooftop/utility by existing_capacities.
        solar_rooftop_ratio, see rooftop recipe), add_land_use_constraint
        subtracts existing capacity from p_nom_max per horizon, and
        multi-year panel models (resource.panel given as a {year: model}
        dict) are consumed by adjust_renewable_profiles in add_brownfield.py.
      mechanism: >
        rule determine_availability_matrix (per-technology atlite
        ExclusionContainer over CORINE/LUISA/natura) -> rule
        build_renewable_profiles (profile_{clusters}_{technology}.nc with
        profile, p_nom_max, average_distance per bus and resource-class bin;
        low-CF/low-potential buses dropped via min_p_max_pu / min_p_nom_max
        code defaults) -> rule add_electricity (attach_wind_and_solar;
        attach_renewable_powerplants for the existing fleet; update_p_nom_max).
        Profiles are built directly at clustered-region resolution
        (clustering happens upstream in rules simplify_network /
        cluster_network), so no renewable re-aggregation step exists.
        Costs come from rule process_cost_data (prepare_costs). The joint
        solar/solar-hsat land constraint is applied in solve_network.py::
        extra_functionality without any config switch whenever both carriers
        are in renewable_carriers and extendable_carriers.
      not_covered: >
        No rooftop carrier in the electricity-only workflow (rooftop enters
        only in sector runs, see rooftop-distributed-solar recipe; the
        'solar' carrier here is utility-priced). No vertical/east-west or
        dual-axis tracking carrier out of the box (only fixed and hsat
        blocks exist; a further variant needs a new renewable.<name> block —
        but note the onshore-region routing for availability/profiles is
        hardcoded to the technology names ("onwind", "solar", "solar-hsat")
        in rules/build_electricity.smk, so a NEW carrier name needs a rule
        edit). No agrivoltaics or dual-land-use logic. No sub-region siting
        detail beyond the resource-class bins. The min_p_max_pu /
        min_p_nom_max bus-dropping thresholds are read with params.get in
        build_renewable_profiles.py but are NOT present in
        config.default.yaml (code-default 0.0 — dormant hooks).
      provenance: "scripts/add_electricity.py:attach_wind_and_solar; scripts/determine_availability_matrix.py:ExclusionContainer; scripts/build_renewable_profiles.py:capacity_per_sqkm; scripts/process_cost_data.py:solar-utility; scripts/solve_network.py:add_solar_potential_constraints; scripts/add_electricity.py:attach_renewable_powerplants; scripts/add_brownfield.py:adjust_renewable_profiles"
    levers:
      - key: electricity.renewable_carriers
        effect: "Include/exclude 'solar' and 'solar-hsat' as modelled carriers; controls which profile files are built and attached."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]"
        provenance: "config/config.default.yaml:renewable_carriers; rules/build_electricity.smk:input_profile_tech"
      - key: electricity.extendable_carriers.Generator
        effect: "Whether solar / solar-hsat capacity is optimisable (p_nom_extendable) beyond the existing fleet."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_wind_and_solar"
      - key: renewable.solar.capacity_per_sqkm
        effect: "MW installable per km2 of eligible land; linearly scales p_nom_max (solar-hsat has its own key, default 4.43; their ratio also sets the land_use_factor in the joint solar potential constraint)."
        default: "5.1"
        provenance: "config/config.default.yaml:capacity_per_sqkm; scripts/build_renewable_profiles.py:capacity_per_sqkm"
      - key: renewable.solar.corine
        effect: "CORINE land-cover classes eligible for PV (plain include-list; same key under solar-hsat). Fewer classes = less potential."
        default: "[1..20, 26, 31, 32]"
        provenance: "config/config.default.yaml:corine; scripts/determine_availability_matrix.py:grid_codes"
      - key: renewable.solar.natura
        effect: "true excludes the natura protected-area raster from siting."
        default: "true"
        provenance: "config/config.default.yaml:natura; scripts/determine_availability_matrix.py:natura"
      - key: renewable.solar.luisa
        effect: "Alternative 50m LUISA land-cover exclusion (list of codes or false); can be combined with corine."
        default: "false"
        provenance: "config/config.default.yaml:luisa; scripts/determine_availability_matrix.py:luisa"
      - key: renewable.solar.resource.orientation
        effect: "Panel slope/azimuth for the atlite pv conversion (fixed tilt for 'solar')."
        default: "{slope: 35.0, azimuth: 180.0}"
        provenance: "config/config.default.yaml:orientation; scripts/build_renewable_profiles.py:resource"
      - key: renewable.solar-hsat.resource.tracking
        effect: "atlite tracking mode of the hsat carrier ('horizontal' by default; the plain solar block has tracking: null)."
        default: "horizontal"
        provenance: "config/config.default.yaml:tracking; scripts/build_renewable_profiles.py:resource"
      - key: renewable.solar.resource_classes
        effect: "Number of capacity-factor bins per region — splits each region's potential into separate generators ('bus bin carrier') for better resource differentiation."
        default: "1"
        provenance: "config/config.default.yaml:resource_classes; scripts/build_renewable_profiles.py:resource_classes"
      - key: renewable.solar.correction_factor
        effect: "Multiplier on the raw atlite capacity factor time series."
        default: "1.0"
        provenance: "config/config.default.yaml:correction_factor; scripts/build_renewable_profiles.py:correction_factor"
      - key: renewable.solar.clip_p_max_pu
        effect: "Capacity factors below this are set to 0 (numerical clean-up)."
        default: "0.01"
        provenance: "config/config.default.yaml:clip_p_max_pu; scripts/build_renewable_profiles.py:clip_p_max_pu"
      - key: renewable.solar.cutout
        effect: "Which atlite cutout supplies weather data; 'default' resolves to atlite.default_cutout (europe-2013-sarah3-era5)."
        default: "default"
        provenance: "config/config.default.yaml:default_cutout; rules/common.smk:input_cutout"
      - key: electricity.estimate_renewable_capacities
        effect: "Existing-fleet attachment: from_powerplantmatching (default true, plant-level sjoin into class regions) or from_irenastat (country totals distributed by CF-weighted potential); expansion_limit can cap p_nom_max relative to installed; skipped for myopic (handled in add_existing_baseyear)."
        default: "{enable: true, from_powerplantmatching: true, from_irenastat: false, year: 2024, expansion_limit: false}"
        provenance: "config/config.default.yaml:estimate_renewable_capacities; scripts/add_electricity.py:attach_renewable_powerplants"
      - key: solving.constraints.CCL
        effect: "true activates per-country per-carrier capacity min/max from solving.agg_p_nom_limits.file (data/agg_p_nom_minmax.csv); agg_solar: true lumps solar, solar-hsat and solar rooftop into one 'solar-all' limit."
        default: "false"
        provenance: "config/config.default.yaml:CCL; scripts/solve_network.py:add_CCL_constraints"
      - key: adjustments.electricity
        effect: "Generic factor/absolute overrides on component attributes per carrier in prepare_network (e.g. scale solar capital_cost or p_nom_max) — maybe_adjust_costs_and_potentials."
        default: "false"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:maybe_adjust_costs_and_potentials"
      - key: costs.overwrites
        effect: "Deprecated config hook to override investment/FOM/lifetime etc. per technology in prepare_costs; preferred: rows in data/custom_costs.csv (costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
    boundary:
      - variant: "run with fixed-tilt + tracking solar competing under a joint land budget"
        rung: L0
        note: "default — both carriers active, add_solar_potential_constraints applied automatically in extra_functionality (no switch to turn the joint constraint off short of removing one carrier)"
      - variant: "solar-only or hsat-only (drop one variant)"
        rung: L1
        note: "remove the other carrier from electricity.renewable_carriers and extendable_carriers.Generator; the joint constraint then deactivates itself (it requires both)"
      - variant: "stricter/looser siting (land classes, protected areas, density)"
        rung: L1
        note: "renewable.solar.corine / natura / luisa / capacity_per_sqkm (repeat for solar-hsat)"
      - variant: "resource-quality-differentiated solar within a region"
        rung: L1
        note: "renewable.solar.resource_classes > 1 — bins each region's potential by capacity factor into separate generators"
      - variant: "different weather year"
        rung: L1
        note: "set atlite.default_cutout to 'europe-1940-2024-era5' (in atlite.cutouts, ERA5-only) and move snapshots; the default sarah3-era5 cutout is 2013-only. A year outside archived cutouts needs data.cutout.source: build + CDS API (L3)"
      - variant: "cap or force solar per country"
        rung: L1
        note: "solving.constraints.CCL: true + rows in data/agg_p_nom_minmax.csv (agg_solar to treat all solar carriers as one); BAU_mincapacities (solving.constraints.BAU) gives an EU-wide floor per carrier"
      - variant: "override solar investment cost or lifetime"
        rung: L1
        note: "row in data/custom_costs.csv (costs.custom_cost_fn) or costs.overwrites (deprecated); note prepare_costs overwrites the 'solar' capital_cost with 'solar-utility' AFTER raw-attribute overwrites — target 'solar-utility' (or use the prepared-attribute capital_cost column, applied last)"
      - variant: "evolving panel/efficiency per planning horizon (myopic)"
        rung: L1
        note: "give renewable.solar.resource.panel as a {year: model} dict — build_renewable_profiles emits one profile per year, add_brownfield::adjust_renewable_profiles picks the closest year <= horizon"
      - variant: "correct existing PV fleet (add missing plants)"
        rung: L3
        note: "data/custom_powerplants.csv + electricity.custom_powerplants (rule build_powerplants), or switch to from_irenastat country totals (L1)"
      - variant: "third PV variant (e.g. east-west vertical, agrivoltaics) as a competing carrier"
        rung: L4
        note: "a new renewable.<name> block alone is NOT enough: the onshore-regions routing in rules/build_electricity.smk hardcodes the tuple (onwind, solar, solar-hsat) in both determine_availability_matrix and build_renewable_profiles rule inputs — extend those lambdas, add the carrier to renewable_carriers/extendable_carriers, supply a costs row (data/custom_costs.csv can ADD new technology rows via overwrite_costs), and extend land_use_factors in add_solar_potential_constraints if it should share the land budget"
      - variant: "bespoke sub-region siting rules beyond raster criteria"
        rung: L5
        note: "no hook; custom exclusion logic in determine_availability_matrix.py"
    where:
      - change: "land eligibility (corine/luisa/natura exclusions, resolution)"
        anchor: "scripts/determine_availability_matrix.py (rule determine_availability_matrix; per-tech params from config renewable)"
        provenance: "scripts/determine_availability_matrix.py:ExclusionContainer; rules/build_electricity.smk:determine_availability_matrix"
      - change: "profile/p_nom_max computation, resource classes, panel model per year"
        anchor: "scripts/build_renewable_profiles.py (rule build_renewable_profiles)"
        provenance: "scripts/build_renewable_profiles.py:resource_classes; rules/build_electricity.smk:build_renewable_profiles"
      - change: "generator attachment + existing-fleet forcing"
        anchor: "scripts/add_electricity.py::attach_wind_and_solar / ::attach_renewable_powerplants / ::estimate_renewable_capacities (rule add_electricity)"
        provenance: "scripts/add_electricity.py:attach_wind_and_solar; scripts/add_electricity.py:estimate_renewable_capacities"
      - change: "solar cost rows: 'solar' aliased to solar-utility, hsat renamed from 'solar-utility single-axis tracking'"
        anchor: "scripts/process_cost_data.py::prepare_costs (rule process_cost_data)"
        provenance: "scripts/process_cost_data.py:prepare_costs"
      - change: "joint solar/solar-hsat land budget; myopic land-use bookkeeping"
        anchor: "scripts/solve_network.py::add_solar_potential_constraints (called from ::extra_functionality) and ::add_land_use_constraint"
        provenance: "scripts/solve_network.py:add_solar_potential_constraints; scripts/solve_network.py:add_land_use_constraint"
      - change: "myopic vintages of existing solar"
        anchor: "scripts/add_existing_baseyear.py::add_existing_renewables (IRENA year-by-year capacity diffs distributed by p_nom_max)"
        provenance: "scripts/add_existing_baseyear.py:add_existing_renewables"
    data_dependencies:
      - input: "weather cutout (atlite.default_cutout europe-2013-sarah3-era5; europe-1940-2024-era5 available in atlite.cutouts)"
        required_for: "all PV profiles"
        availability: "retrieved from archive by default (data.cutout.source: archive, rule retrieve_cutout); building other years needs source: build + CDS API"
      - input: "CORINE land-cover raster (retrieve_corine) / optional LUISA basemap"
        required_for: "land eligibility"
        availability: "retrieved by the workflow; Europe-only (MD/UA handled by determine_availability_matrix_MD_UA)"
      - input: "natura.tiff protected-area raster"
        required_for: "natura exclusion"
        availability: "retrieved by the workflow (NATURA_DATASET)"
      - input: "powerplantmatching database (Fueltype PV) via rule build_powerplants"
        required_for: "existing solar fleet (from_powerplantmatching)"
        availability: "retrieved by the workflow; good European coverage"
      - input: "technology-data cost rows 'solar-utility', 'solar-utility single-axis tracking', 'solar-rooftop'"
        required_for: "capital costs ('solar' capital_cost = solar-utility; hsat renamed)"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "IRENASTAT statistics (via powerplantmatching)"
        required_for: "from_irenastat gap filling and myopic add_existing_renewables vintages"
        availability: "exists by default (pm.data.IRENASTAT)"
