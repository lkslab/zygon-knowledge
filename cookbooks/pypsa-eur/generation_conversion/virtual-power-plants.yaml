id: virtual-power-plants
title: Virtual power plants (VPP)
summary: >
  Aggregating many small distributed assets (rooftop PV, home batteries, EVs,
  flexible loads) so they are dispatched as one coordinated plant.
when_to_use:
  - "virtual power plant"
  - "VPP / aggregator"
  - "aggregate distributed batteries and EVs"
  - "coordinate rooftop solar and home storage"
  - "demand response aggregation"
  - "value of aggregated flexibility"
  - "flexibility pool / prosumer fleet dispatch"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        The EFFECT a VPP delivers — coordinated, system-optimal dispatch of all
        distributed assets — is the model's default behaviour, so "VPP" as a
        business construct has no separate model meaning: rule solve_network
        builds ONE linear program in which every flexible component is
        co-optimised against total system cost, i.e. the whole system already
        behaves like a perfectly coordinated aggregator (grounded absence: no
        "aggregator" or "VPP" concept exists in scripts or config). The
        distributed pool itself is rich in sector runs: home batteries and
        "solar rooftop" on low-voltage buses
        (insert_electricity_distribution_grid — see behind-the-meter-der
        recipe), EV batteries with smart charging and V2G (add_EVs, with
        sector.bev_dsm_availability = 0.5 as the one native participation-rate
        knob), residential heat DSM stores (sector.residential_heat.dsm),
        thermal storage, and — if sector.industry_t.endogen is switched on —
        flexible industrial heat links whose p_min_pu is
        sector.industry_t.must_run (0.8). Two eur-specific pieces of machinery
        matter for VPP studies: (1) limited-foresight OPERATION is L1 —
        solving.options.rolling_horizon: true dispatches the network via
        optimize_with_rolling_horizon with solving.options.horizon/overlap
        windows, giving a myopic-operation counterfactual without any code; (2)
        bespoke aggregator constraints have a shipped user hook —
        solving.options.custom_extra_functionality points to
        data/custom_extra_functionality.py, which extra_functionality imports
        and calls at solve time, so portfolio-level constraints need no repo
        edit.
      mechanism: >
        scripts/solve_network.py solves the single central LP/MILP;
        extra_functionality collects all supplementary constraints and ends by
        loading the custom_extra_functionality module. What a VPP study can
        vary out of the box is the SIZE of the coordinated flexibility pool
        (asset switches and shares below) and the FORESIGHT of its operation
        (rolling_horizon). The uncoordinated counterfactual must be
        constructed: switch flexibility off or zero it via
        adjustments.sector, then compare system cost.
      not_covered: >
        Aggregator economics (fees, revenue split), market bidding or
        price-taking behaviour, imperfect control or partial participation
        (except EVs via bev_dsm_availability — home batteries and rooftop have
        no share key and no on/off switch separate from the LV layer), forecast
        ERROR (rolling horizon shortens foresight but within each window the
        forecast is perfect), telecoms/latency, and any explicit "with vs
        without VPP" construct — the model has no uncoordinated dispatch mode,
        only the absence/limitation of the flexible assets themselves.
      provenance: "scripts/solve_network.py:extra_functionality; scripts/solve_network.py:optimize_with_rolling_horizon; scripts/prepare_sector_network.py:insert_electricity_distribution_grid; scripts/prepare_sector_network.py:add_EVs"
    levers:
      - key: sector.electricity_distribution_grid
        effect: "Creates the low-voltage layer carrying rooftop PV and home batteries — the residential half of the pool; false removes all of it at once."
        default: "true"
        provenance: "config/config.default.yaml:electricity_distribution_grid; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - key: sector.bev_dsm
        effect: "EV batteries participate as schedulable storage (Store behind the BEV charger with a state-of-charge floor profile)."
        default: "true"
        provenance: "config/config.default.yaml:bev_dsm; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.v2g
        effect: "Adds V2G Links so the EV pool can discharge to the grid, sized p_nom x bev_dsm_availability."
        default: "true"
        provenance: "config/config.default.yaml:v2g; scripts/prepare_sector_network.py:add_EVs"
      - key: sector.bev_dsm_availability
        effect: "Share of the EV fleet's battery energy available for DSM and of charger power available for V2G — the one native 'participation rate' knob for any pool asset."
        default: "0.5"
        provenance: "config/config.default.yaml:bev_dsm_availability; scripts/prepare_sector_network.py:bev_dsm_availability"
      - key: sector.residential_heat.dsm.enable
        effect: "Adds building thermal inertia ('heat dsm' Stores) to the flexibility pool (see behind-the-meter-der recipe)."
        default: "false"
        provenance: "config/config.default.yaml:residential_heat; scripts/prepare_sector_network.py:heat dsm"
      - key: sector.industry_t.endogen
        effect: "Endogenises industrial heat supply as links with p_min_pu = sector.industry_t.must_run (0.8) — 20% of industrial heat capacity becomes schedulable flexible load in the pool."
        default: "false"
        provenance: "config/config.default.yaml:industry_t; scripts/prepare_sector_network.py:add_t_industry100_200"
      - key: solving.options.rolling_horizon
        effect: "true dispatches with limited foresight in windows of solving.options.horizon snapshots (default 365) and overlap (default 0) — the L1 approximation of imperfect aggregator foresight."
        default: "false"
        provenance: "config/config.default.yaml:rolling_horizon; scripts/solve_network.py:optimize_with_rolling_horizon"
      - key: solving.options.custom_extra_functionality
        effect: "Path to a user Python module whose same-named function is called inside extra_functionality at solve time — the shipped hook for bespoke aggregator/portfolio constraints without touching repo code."
        default: "../data/custom_extra_functionality.py"
        provenance: "config/config.default.yaml:custom_extra_functionality; scripts/solve_network.py:custom_extra_functionality"
      - key: adjustments.sector
        effect: "Factor/absolute overrides per component+carrier+attribute — the config route to scale or zero pool members that have no own switch (e.g. absolute.Store.'home battery'.e_nom_max: 0 for a no-home-battery counterfactual)."
        default: "{factor: {Link: {electricity distribution grid: {capital_cost: 1.0}}}, absolute: false}"
        provenance: "config/config.default.yaml:adjustments; scripts/prepare_network.py:modify_attribute"
    boundary:
      - variant: "represent a fully effective VPP (coordinated DER dispatch)"
        rung: L0
        note: "already the default — the central LP co-optimises every enabled flexible asset"
      - variant: "vary EV participation rate of the pool"
        rung: L1
        note: "sector.bev_dsm_availability (energy AND V2G power scale with it)"
      - variant: "participation share for home batteries / rooftop PV"
        rung: L1
        note: "no dedicated share key, but adjustments.sector factor on Store 'home battery' e_nom_max / Generator 'solar rooftop' p_nom_max does it from config; a proper share parameter inside insert_electricity_distribution_grid is L2"
      - variant: "uncoordinated counterfactual (no VPP)"
        rung: L1
        note: "switch flexibility off (sector.bev_dsm/v2g false, residential_heat.dsm false) and zero home batteries via adjustments.sector; the system-cost delta against the default is the coordination value"
      - variant: "limited-foresight operation of the pool"
        rung: L1
        note: "solving.options.rolling_horizon: true with horizon/overlap — eur has this natively (optimize_with_rolling_horizon); note capacities must be fixed for a pure dispatch run"
      - variant: "aggregator constraints (portfolio bid caps, joint ramp limits, regional pooling)"
        rung: L5
        note: "bespoke constraints on grouped variables — but the delivery vehicle is the shipped custom_extra_functionality module (a data-path Python file), so no repo code edit; only a new file plus the config path"
      - variant: "explicit market agent / bidding behaviour"
        rung: L5
        note: "the model is a social planner; agent-based or bilevel constructs are outside the LP formulation entirely"
    where:
      - change: "participation scaling / zeroing of home batteries and rooftop PV"
        anchor: "adjustments.sector (config) applied by scripts/prepare_network.py::modify_attribute; asset creation in scripts/prepare_sector_network.py::insert_electricity_distribution_grid"
        provenance: "scripts/prepare_network.py:modify_attribute; scripts/prepare_sector_network.py:insert_electricity_distribution_grid"
      - change: "EV flexibility pool (charger, DSM store, V2G)"
        anchor: "scripts/prepare_sector_network.py::add_EVs (avail_profile / dsm_profile from rule build_transport_demand)"
        provenance: "scripts/prepare_sector_network.py:add_EVs; rules/build_sector.smk:build_transport_demand"
      - change: "custom aggregator constraints"
        anchor: "data/custom_extra_functionality.py (solving.options.custom_extra_functionality), loaded at the end of scripts/solve_network.py::extra_functionality"
        provenance: "scripts/solve_network.py:extra_functionality; config/config.default.yaml:custom_extra_functionality"
      - change: "limited-foresight dispatch mode"
        anchor: "scripts/solve_network.py rolling_horizon branch (n.optimize.optimize_with_rolling_horizon; solving.options.horizon/overlap)"
        provenance: "scripts/solve_network.py:optimize_with_rolling_horizon"
    data_dependencies:
      - input: "DER cost rows ('home battery storage', 'home battery inverter', 'solar-rooftop', 'electricity distribution grid'; technology-data)"
        required_for: "the DER pool the VPP question is about"
        availability: "exists by default"
      - input: "EV fleet, availability and DSM profiles (rule build_transport_demand outputs)"
        required_for: "EV participation variants"
        availability: "must be built (transport chain; exists by default in sector runs)"
      - input: "data/custom_extra_functionality.py"
        required_for: "bespoke aggregator constraints"
        availability: "template ships in the repo; content user-authored"
