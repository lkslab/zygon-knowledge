id: waste-heat-recovery
title: Waste-heat recovery
summary: >
  Capturing excess/waste heat from industrial and power-to-X processes and
  reusing it, chiefly by feeding district heating networks.
when_to_use:
  - "waste heat recovery"
  - "industrial excess heat"
  - "use factory waste heat for district heating"
  - "electrolyser waste heat"
  - "Fischer-Tropsch or methanolisation heat to heat network"
  - "fuel cell heat recovery"
  - "excess heat to heat network"
  - "pypsa-eur keys: use_electrolysis_waste_heat, use_fischer_tropsch_waste_heat"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Power-to-X waste heat is covered, on by default, for exactly six
        donors. add_waste_heat (gated by sector.heating) retrofits an extra
        output bus onto the existing process Links at nodes that have an
        "urban central heat" bus: Fischer-Tropsch, Sabatier (methanation),
        Haber-Bosch, methanolisation, H2 Electrolysis and H2 Fuel Cell. The
        config values are FRACTIONS, not booleans — they scale the
        recoverable share of the theoretical waste heat: e.g. Fischer-Tropsch
        efficiency3 = (0.95 - electric efficiency) *
        sector.use_fischer_tropsch_waste_heat (default 0.25); electrolysis
        uses (0.84 - efficiency) * 0.25; fuel cell (0.95 - efficiency) * 1;
        Haber-Bosch uses 0.15 of total energy input scaled via the
        cf_industry NH3 conversion factors; methanolisation reads the
        "heat-output" attribute of its cost row. The recovered heat competes
        freely in the district-heating merit order and effectively raises the
        donor's economics wherever DH demand exists.
      mechanism: >
        rule prepare_sector_network calls add_waste_heat AFTER the supply
        blocks have created the donor links; it edits n.links in place
        (bus2/bus3/bus4 = "urban central heat", efficiencyN as above) only
        for links whose node hosts an urban central heat bus — nodes without
        district heating recover nothing. The waste-heat fractions multiply
        directly into the link efficiencies.
      not_covered: >
        No INDUSTRIAL process waste heat: cement kilns, steel, glass, the
        "gas for industry" links and the new industry_t temperature-band
        links have no heat byproduct output — industry only consumes heat.
        DAC is a heat CONSUMER (add_dac draws from urban central /
        services urban decentral heat), not a donor. SMR, biogas upgrading
        and nuclear have no waste-heat hook. Process-emission capture heat is
        waved through ("assume enough local waste heat for CC" comment above
        the process emissions CC link — capture heat demand is not modelled
        at all). No on-site reuse, heat cascading between industries, ORC
        power recovery, or temperature-level accounting of the recovered
        heat; recovery is only into urban central district heating, so the
        district-heating footprint (sector.district_heating.potential and
        progress) caps total recovery.
      provenance: "scripts/prepare_sector_network.py:add_waste_heat; scripts/prepare_sector_network.py:use_fischer_tropsch_waste_heat; scripts/prepare_sector_network.py:add_dac; scripts/prepare_sector_network.py:assume enough local waste heat for CC; config/config.default.yaml:use_electrolysis_waste_heat"
    levers:
      - key: sector.use_fischer_tropsch_waste_heat
        effect: "Fraction of Fischer-Tropsch waste heat (0.95 minus fuel efficiency) recoverable to district heating; 0/false disables."
        default: "0.25"
        provenance: "config/config.default.yaml:use_fischer_tropsch_waste_heat; scripts/prepare_sector_network.py:use_fischer_tropsch_waste_heat"
      - key: sector.use_electrolysis_waste_heat
        effect: "Fraction of electrolyser waste heat (0.84 minus H2 efficiency) to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_electrolysis_waste_heat; scripts/prepare_sector_network.py:use_electrolysis_waste_heat"
      - key: sector.use_fuel_cell_waste_heat
        effect: "Fraction of H2 fuel cell waste heat to district heating — the only donor defaulting to full recovery."
        default: "1"
        provenance: "config/config.default.yaml:use_fuel_cell_waste_heat; scripts/prepare_sector_network.py:use_fuel_cell_waste_heat"
      - key: sector.use_methanolisation_waste_heat
        effect: "Fraction of methanolisation heat-output (from the cost row) to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_methanolisation_waste_heat; scripts/prepare_sector_network.py:use_methanolisation_waste_heat"
      - key: sector.use_methanation_waste_heat
        effect: "Fraction of Sabatier waste heat to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_methanation_waste_heat; scripts/prepare_sector_network.py:use_methanation_waste_heat"
      - key: sector.use_haber_bosch_waste_heat
        effect: "Fraction of Haber-Bosch waste heat (0.15 of total energy input, converted via the NH3 factors) to district heating."
        default: "0.25"
        provenance: "config/config.default.yaml:use_haber_bosch_waste_heat; scripts/prepare_sector_network.py:use_haber_bosch_waste_heat"
      - key: sector.district_heating.potential
        effect: "Sets where urban central heat buses exist — waste heat can only be recovered at those nodes, and DH demand caps useful recovery."
        default: "0.6 (with per-horizon progress ramp)"
        provenance: "config/config.default.yaml:district_heating; scripts/prepare_sector_network.py:add_heat"
      - key: sector.heating
        effect: "Gates add_waste_heat entirely."
        default: "true"
        provenance: "config/config.default.yaml:heating; scripts/prepare_sector_network.py:add_waste_heat"
    boundary:
      - variant: "P2X waste heat into district heating"
        rung: L0
        note: "default for all six donors (at 25% recovery except fuel cell at 100%)"
      - variant: "full recovery / disable recovery per donor"
        rung: L1
        note: "set the respective sector.use_*_waste_heat to 1 or 0 — values are multiplicative fractions"
      - variant: "add a donor process (e.g. SMR, biogas upgrading CC)"
        rung: L2
        note: "add a block in add_waste_heat assigning a spare busN + efficiencyN on that carrier's links, mirroring the Sabatier block"
      - variant: "industrial excess heat (cement/steel/glass) into district heating"
        rung: L2
        note: "mechanically: give e.g. the 'heat>500 industry gas' links in add_t_industry500 an extra urban-central-heat output; a defensible potential-based version needs excess-heat data per site and temperature (L3), and a proper representation with recovery investment cost is L5"
      - variant: "waste heat as heat-pump SOURCE instead of direct use"
        rung: L5
        note: "district heating heat-pump sources are configured heat sources (heat_pump_sources) with dedicated potential rules — no industrial-excess-heat source chain exists (limited_heat_sources knows geothermal and river_water only)"
      - variant: "on-site reuse within industry (cascading between temperature bands)"
        rung: L2
        note: "no such link; a band-to-band Link (heat>500 -> heat100-200 bus) in the add_t_industry functions would be a small localised edit"
      - variant: "ORC electricity from waste heat"
        rung: L5
        note: "no ORC technology; needs new links + cost rows and a heat source to draw on"
    where:
      - change: "donor list, recovery fractions and bus wiring"
        anchor: "scripts/prepare_sector_network.py::add_waste_heat"
        provenance: "scripts/prepare_sector_network.py:add_waste_heat"
      - change: "which nodes can receive waste heat"
        anchor: "scripts/prepare_sector_network.py::add_heat (urban central heat bus creation, district heat share)"
        provenance: "scripts/prepare_sector_network.py:add_heat"
      - change: "industrial band links that could donate heat"
        anchor: "scripts/prepare_sector_network.py::add_t_industry200_500 / ::add_t_industry500"
        provenance: "scripts/prepare_sector_network.py:add_t_industry500"
      - change: "Haber-Bosch waste-heat conversion factors"
        anchor: "config industry.MWh_H2_per_tNH3_electrolysis / MWh_elec_per_tNH3_electrolysis / MWh_NH3_per_tNH3 (cf_industry in add_waste_heat)"
        provenance: "config/config.default.yaml:MWh_NH3_per_tNH3; scripts/prepare_sector_network.py:MWh_NH3_per_tNH3"
    data_dependencies:
      - input: "urban central heat buses with district heating demand (build_district_heat_share chain)"
        required_for: "any waste-heat recovery — donors at nodes without DH recover nothing"
        availability: "exists by default in sector runs; footprint set by district_heating potential/progress"
      - input: "donor links (Fischer-Tropsch, Sabatier, Haber-Bosch, methanolisation, H2 Electrolysis, H2 Fuel Cell)"
        required_for: "the six default recovery channels"
        availability: "exists by default in sector runs (respective supply blocks)"
      - input: "methanolisation cost row with heat-output attribute"
        required_for: "methanolisation recovery efficiency"
        availability: "exists by default via retrieve_cost_data"
      - input: "industrial excess-heat potentials by site and temperature"
        required_for: "genuine industrial waste-heat recovery"
        availability: "absent — no such dataset in the workflow"
