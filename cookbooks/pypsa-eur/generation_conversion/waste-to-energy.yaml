id: waste-to-energy
title: Waste-to-energy (waste incineration, waste CHP, municipal solid waste)
summary: >
  Energy recovery from waste streams — municipal solid waste and
  non-recycled plastics (HVC) — in incineration/CHP plants producing
  electricity and district heat, optionally with carbon capture.
when_to_use:
  - "waste to energy"
  - "waste incineration"
  - "municipal solid waste / MSW"
  - "burn plastics / HVC waste"
  - "waste CHP"
  - "energy from garbage / refuse"
  - "waste incineration with carbon capture"
  - "existing waste-fired power plants"
  - "pypsa-eur carrier names: waste, waste CHP, waste CHP CC, municipal solid waste, non-sequestered HVC, HVC to air"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Waste-to-energy is first-class in BOTH workflows. Electricity
        workflow: "waste" is in electricity.conventional_carriers by default,
        so existing waste incineration plants from powerplantmatching are
        attached as conventional Generators; rule process_cost_data
        synthesises the "waste" cost row by copying the "waste CHP" row and
        setting its CO2 intensity to the oil value (prepare_costs), so waste
        dispatch carries costs and emissions. Sector workflow (two opt-in
        chains): (1) Plastics chain — add_industry always builds a
        "non-sequestered HVC" waste stream: the fraction of naphtha-derived
        plastics that is neither process-emitted nor sequestered
        (industry.HVC_environment_sequestration_fraction) accumulates in
        population-distributed Stores that MUST be emptied by the final
        snapshot, either through "HVC to air" links (decay to CO2) or — with
        industry.waste_to_energy: true — through extendable "waste CHP" Links
        (bus0 = non-sequestered HVC, bus1 = electricity, bus2 = urban central
        heat where a district heating bus exists, bus3 = co2 atmosphere; cost
        row "waste CHP" with efficiency-heat). industry.waste_to_energy_cc
        adds a "waste CHP CC" variant capturing sector.cc_fraction of the oil
        CO2 intensity into the co2 stored buses. (2) MSW chain —
        sector.municipal_solid_waste: true adds "municipal solid waste" buses
        and Generators whose potentials come from build_biomass_potentials
        (ENSPRESO class "Municipal waste" under biomass.classes, plus the
        eurostat "Renewable municipal waste" unsustainable share), with
        e_sum_min = e_sum_max forcing full use; an MSW->non-sequestered-HVC
        link (with a negative oil-CO2 offset because MSW is counted
        carbon-neutral) feeds the same waste CHP fleet. MSW can be
        transported between nodes when sector.biomass_transport is on.
      mechanism: >
        Electricity: rule build_powerplants + rule add_electricity
        (attach_conventional_generators). Sector: rule prepare_sector_network
        — add_industry creates the HVC waste stream and the waste CHP / CC
        links (gated on cf_industry waste_to_energy flags, i.e. the industry:
        config chapter passed as params); add_biomass creates MSW buses,
        generators, transport links and the operational GlobalConstraint
        ("msw limit"); define_spatial regionalises MSW (spatial.msw) with
        biomass_spatial and the HVC stream with sector.regional_oil_demand.
        A guard in add_biomass forces municipal_solid_waste to false unless
        industry waste-to-energy is enabled alongside sector.industry.
      not_covered: >
        Both sector flags default to FALSE — the default sector run vents all
        plastic waste carbon via "HVC to air" and has no MSW. The existing
        waste fleet (electricity workflow "waste" generators) is power-only
        and is dropped in sector runs (remove_elec_base_techs keep-list) —
        there is no brownfield waste CHP; add_existing_baseyear has no waste
        mapping. Waste CHP heat only reaches nodes that have an "urban central
        heat" bus (empty bus2 elsewhere — plants there are effectively
        electricity-only). No landfill gas, no anaerobic-digestion pathway
        distinct from biogas, no refuse-derived-fuel export, no gate-fee
        (negative fuel price) representation: MSW marginal cost is hardcoded 0
        with its costs-row fuel price commented out in add_biomass. The waste
        CHP has no back-pressure constraint (same dormancy as all CHP — see
        combined-heat-and-power recipe).
      provenance: "scripts/prepare_sector_network.py:waste CHP; scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:non-sequestered HVC; scripts/process_cost_data.py:prepare_costs; scripts/add_electricity.py:attach_conventional_generators; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
    levers:
      - key: industry.waste_to_energy
        effect: "true adds extendable 'waste CHP' Links burning non-sequestered HVC into electricity + district heat at every node."
        default: "false"
        provenance: "config/config.default.yaml:waste_to_energy; scripts/prepare_sector_network.py:waste CHP"
      - key: industry.waste_to_energy_cc
        effect: "true adds the 'waste CHP CC' variant (capture share sector.cc_fraction of the oil CO2 intensity to co2 stored)."
        default: "false"
        provenance: "config/config.default.yaml:waste_to_energy_cc; scripts/prepare_sector_network.py:waste CHP CC"
      - key: sector.municipal_solid_waste
        effect: "true adds MSW buses/generators from biomass potentials and the MSW->HVC-waste feed link; auto-disabled with a warning unless industry waste-to-energy and sector.industry are also on."
        default: "false"
        provenance: "config/config.default.yaml:municipal_solid_waste; scripts/prepare_sector_network.py:add_biomass"
      - key: electricity.conventional_carriers
        effect: "'waste' entry attaches the existing waste incineration fleet in the electricity workflow; remove it to drop them."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: industry.HVC_environment_sequestration_fraction
        effect: "Share of plastics waste permanently sequestered (never burnable) — scales the fuel available to waste CHP down."
        default: "0.0"
        provenance: "config/config.default.yaml:HVC_environment_sequestration_fraction; scripts/prepare_sector_network.py:add_industry"
      - key: sector.cc_fraction
        effect: "Capture rate of the waste CHP CC (and SMR CC) links."
        default: "0.9"
        provenance: "config/config.default.yaml:cc_fraction; scripts/prepare_sector_network.py:waste CHP CC"
      - key: sector.regional_oil_demand
        effect: "true distributes the non-sequestered HVC waste stream (and hence waste CHP fuel) across nodes by population; false pools it at one EU bus."
        default: "true"
        provenance: "config/config.default.yaml:regional_oil_demand; scripts/prepare_sector_network.py:define_spatial"
      - key: biomass.classes
        effect: "The 'municipal solid waste' class maps ENSPRESO feedstock 'Municipal waste' into the MSW potential; edit to re-scope what counts as MSW."
        default: "municipal solid waste: [Municipal waste]"
        provenance: "config/config.default.yaml:municipal solid waste; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
      - key: sector.biomass_transport
        effect: "true adds inter-node MSW transport links (with biomass transport costs) so waste can move to CHP sites."
        default: "false (biomass_spatial: true gives regional MSW without transport)"
        provenance: "config/config.default.yaml:biomass_transport; scripts/prepare_sector_network.py:add_biomass"
      - key: industry.HVC_primary_fraction
        effect: "Upstream: plastics production route shares (with mechanical/chemical recycling fractions) set how much naphtha — and therefore burnable HVC waste — exists per horizon."
        default: "ramps 0.88 (2020) to 0.4 (2050)"
        provenance: "config/config.default.yaml:HVC_primary_fraction; scripts/prepare_sector_network.py:add_industry"
    boundary:
      - variant: "existing waste incineration plants dispatching in the electricity workflow"
        rung: L0
        note: "default — 'waste' in electricity.conventional_carriers, costs synthesised from the waste CHP row"
      - variant: "burn plastic waste in CHPs (sector run)"
        rung: L0
        note: "industry.waste_to_energy: true (requires sector.industry true, default); heat side needs district heating nodes"
      - variant: "waste CHP with carbon capture"
        rung: L1
        note: "industry.waste_to_energy_cc: true (+ waste_to_energy for the unabated variant alongside); capture rate via sector.cc_fraction"
      - variant: "municipal solid waste as a fuel"
        rung: L1
        note: "sector.municipal_solid_waste: true together with industry.waste_to_energy: true and sector.biomass/industry on — the add_biomass guard silently disables MSW otherwise"
      - variant: "change MSW potential or scope"
        rung: L3
        note: "edit biomass.classes 'municipal solid waste' membership (config, L1) only re-maps existing ENSPRESO categories; different totals need edited biomass_potentials data or another biomass.scenario"
      - variant: "gate fees (negative waste fuel price)"
        rung: L2
        note: "MSW generator marginal_cost is hardcoded 0 in add_biomass (costs-row lookup commented out); set a negative marginal_cost there"
      - variant: "force or cap waste incineration capacity"
        rung: L2
        note: "no config key; set p_nom_min/p_nom_max on the waste CHP n.add calls in add_industry — note the HVC store must still be emptiable (HVC to air remains the relief valve)"
      - variant: "brownfield waste CHP fleet in sector runs"
        rung: L5
        note: "no waste mapping in add_existing_baseyear and the elec-workflow waste generators are dropped by remove_elec_base_techs; carrying them into sector networks with heat output is bespoke"
      - variant: "electricity-only waste plant expansion"
        rung: L1
        note: "add 'waste' to electricity.extendable_carriers.Generator (candidates at existing waste plant buses)"
      - variant: "landfill gas / RDF export / separate waste heat-only boilers"
        rung: L5
        note: "no such chains exist anywhere in the workflow"
    where:
      - change: "waste CHP and waste CHP CC links; HVC waste stream (stores, HVC to air)"
        anchor: "scripts/prepare_sector_network.py::add_industry (naphtha / non-sequestered HVC / waste_to_energy blocks)"
        provenance: "scripts/prepare_sector_network.py:add_industry; scripts/prepare_sector_network.py:HVC to air"
      - change: "MSW buses, generators, transport, msw limit constraint, MSW->HVC feed"
        anchor: "scripts/prepare_sector_network.py::add_biomass (municipal_solid_waste blocks)"
        provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:msw limit"
      - change: "MSW potential from ENSPRESO + eurostat renewable municipal waste"
        anchor: "scripts/build_biomass_potentials.py::enspreso_biomass_potentials (rule build_biomass_potentials; biomass.classes config)"
        provenance: "scripts/build_biomass_potentials.py:enspreso_biomass_potentials; rules/build_sector.smk:build_biomass_potentials"
      - change: "electricity-workflow waste fleet and its synthesised cost row"
        anchor: "scripts/add_electricity.py::attach_conventional_generators; scripts/process_cost_data.py::prepare_costs (waste = waste CHP row)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/process_cost_data.py:waste CHP"
      - change: "spatial resolution of the waste stream (regional vs EU)"
        anchor: "scripts/prepare_sector_network.py::define_spatial (spatial.msw, spatial.oil.non_sequestered_hvc)"
        provenance: "scripts/prepare_sector_network.py:define_spatial; scripts/prepare_sector_network.py:non_sequestered_hvc"
    data_dependencies:
      - input: "cost rows 'waste CHP', 'waste CHP CC' (efficiency, efficiency-heat, VOM) and 'biomass CHP capture'"
        required_for: "waste CHP economics and the CC variant; also the elec-workflow 'waste' carrier"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "industrial_energy_demand (naphtha column, process emission from feedstock)"
        required_for: "sizing the non-sequestered HVC waste stream"
        availability: "must be built (industry demand chain, default in sector workflow)"
      - input: "biomass_potentials CSV with 'municipal solid waste' column (ENSPRESO + eurostat)"
        required_for: "MSW potentials"
        availability: "must be built (rule build_biomass_potentials); exists by default"
      - input: "urban central heat buses"
        required_for: "the heat output of waste CHP"
        availability: "must be built (heat workflow); waste CHP at non-DH nodes degrades to power-only"
      - input: "powerplantmatching database (fueltype Waste)"
        required_for: "existing waste fleet in the electricity workflow"
        availability: "retrieved by the workflow; coverage of small incinerators varies"
      - input: "co2 stored buses / sequestration chain"
        required_for: "waste CHP CC"
        availability: "exists by default in sector runs"
