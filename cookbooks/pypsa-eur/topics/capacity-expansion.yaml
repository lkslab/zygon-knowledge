schema_version: 2
id: capacity-expansion
title: Capacity expansion
rank: 4
question: >
  What generation, storage, and grid mix meets demand at least cost under
  policy constraints — the canonical IRP/master-plan question every planner,
  regulator, and development bank asks, for any country and target year.
when_to_use:
  - "least-cost generation mix for [country] by [year]"
  - "integrated resource plan / power development plan"
  - "how much solar/wind/storage/gas should we build"
  - "system cost of a renewables or emissions target"
  - "greenfield vs brownfield expansion study"
recipes:
  generation_conversion: [utility-scale-solar-pv, onshore-wind, offshore-wind,
                          gas-power-plants, conventional-nuclear, grid-scale-batteries]
  demand: [electricity-load, demand-scenarios-and-growth, demand-temporal-profiles]
methods:
  - id: existing-fleet
    role: "which pre-built capacity the optimiser sees — the greenfield/brownfield
           starting point, and the first thing to check when a mix looks wrong"
  - id: pathway-myopic
    role: "sequential horizons with capacity carry-over — answers WHEN capacity
           gets built and what retires, not just the end state"
  - id: pathway-perfect
    role: "all horizons co-optimized in one LP — the no-regret benchmark; the cost
           gap against myopic IS the value of foresight"
defaults:
  - aspect: overnight-foresight
    is: "one target year, all capacity decided at once against that year's costs —
         the shipped config default (foresight: overnight)"
    note: "no method spec because there is nothing to change, so there is nothing
           to cite. Reach for a pathway method only when the question is about
           timing; an end-state mix does not need one."
gap_assessment: >
  The model's core purpose, and stronger here than anywhere in the family:
  pypsa-eur co-optimizes generation, storage, and transmission with hourly
  chronology on validated European data (ENTSO-E demand, OSM/TYNDP grid,
  powerplantmatching fleet), and — unlike pypsa-earth — offers all three
  foresight modes as first-class citizens: overnight snapshots, a
  battle-tested myopic chain, and true perfect-foresight multi-period
  optimization with inter-period carbon budgets. Unit commitment exists as
  a linearized LP option with shipped start-up/min-load data, softening
  the pure-LP caveat. Constraint machinery covers the policy asks — CO2
  caps/prices, carbon-budget pathways, per-country carrier limits (CCL) —
  though BAU floors and the SAFE reserve margin need user-added config
  keys, and the config is schema-validated so typos fail fast. Residual
  honesty: builds are still continuous (post-discretization is optional
  and iterative-only), demand growth to target years is the user's
  scenario input, and scope is Europe — a non-European IRP needs
  pypsa-earth, where data quality, not machinery, is the gate. One split
  worth stating early: the model shipping a mode is not the same as us
  having proven it. The myopic chain is verified end-to-end here; our
  perfect-foresight spec is still draft on eur (blocked upstream), so a
  perfect-foresight pathway is a pypsa-earth answer today.
coverage: ready
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
