schema_version: 2
id: marginal-price-prediction
title: "Marginal price prediction"
rank: 101
question: >
  What will marginal electricity (or hydrogen, or heat) prices look like in
  this system — their temporal shape over the day and the year, their spatial
  distribution across nodes or zones, and their statistics: mean, duration
  curve, zero-price share, spike frequency, hours at the ceiling? The
  modelling substrate is ordinary capacity expansion; what changes is that the
  price series itself is the deliverable, not a by-product.
when_to_use:
  - "what will electricity prices be in 2030 / 2040 in this scenario"
  - "price duration curve for my scenario"
  - "when and where are prices high, zero or negative"
  - "capture price / market value my asset would earn"
  - "how often does the price spike, and to what level"
  - "hydrogen or heat price in the model"
recipes:
  generation_conversion: [gas-power-plants, fossil-fuel-supply,
                          grid-scale-batteries, hv-transmission-lines,
                          hvdc-interconnectors, transmission-expansion-projects]
  demand: [electricity-load, demand-temporal-profiles,
           demand-spatial-disaggregation]
methods:
  - id: price-formation
    role: "the core: hourly-rung solve with an explicit VOLL ceiling and all
           duals written — makes the price series a bounded first-class
           output instead of a solver artefact"
  - id: existing-fleet
    role: "which fleet sets the margin: the merit order IS the ingested
           fleet; date filters and anchoring decide the thermal-priced and
           zero-price hours"
  - id: multi-scenario
    role: "price statistics across futures — repeat the extraction over
           demand/CO2 variants with harmonised collection"
  - id: pathway-myopic
    role: "the trajectory: how the duration curve reshapes horizon by
           horizon as the system decarbonises"
  - id: flow-based-market-coupling
    role: "spatial prices under the market design actually in force — zonal
           clearing prices when the question is the market price, not the
           nodal shadow price"
plots:
  - id: marginal_prices
    role: "the level: snapshot-weighted mean price per bus carrier vs
           baseline"
  - id: price_duration
    role: "the statistics: duration curve with zero-price share, p95 and
           ceiling-hours in its headline numbers"
  - id: price_heatmap
    role: "the temporal shape: hour-of-day x month chronology the duration
           curve destroys"
  - id: region_map
    role: "the spatial distribution: regional mean price as a choropleth"
    params: {quantity: price}
  - id: dispatch_weeks
    role: "why the price is what it is — the hourly balance behind the
           priced hours"
defaults:
  - aspect: nodal-lmp-duals
    is: "LMPs and congestion rent fall out of any solved network's duals —
         bus marginal prices ARE locational prices at whatever resolution
         the network was clustered to"
  - aspect: expansion-prices
    is: "the shipped solve is long-term co-optimised: its prices carry
         investment pressure and satisfy the zero-profit identity (each
         technology's market value equals its annualised cost)"
    note: "merit-order prices of a FIXED fleet — the market-comparable
           short-term reading — are the operations-solve fork inside the
           price-formation method, not the default."
gap_assessment: >
  Strong: the solved network prices every carrier bus at every snapshot for
  free, pypsa-eur's own summaries already emit correctly weighted
  weighted_prices and market_values, a real dispatch-only rule
  (solve_operations_network) gives short-term prices of a fixed fleet, and
  since the price-formation method landed, ceiling, resolution and duals are
  a verified mechanical setup rather than folklore. What stays manual, per
  the v1 essays: decomposing the series by price-setting regime
  (zero/storage/thermal/scarcity), KKT price-setter identification, revenue
  concentration and per-technology cost-recovery ratios. Honesty rungs: the
  upper tail is a config number — always report the VOLL and the
  hours-at-ceiling share beside any statistic; expansion-run duals are not
  market forecasts (competitive benchmark of a cost-minimising planner, no
  bidding, no demand elasticity, no market design); noisy_costs jitters
  marginal costs by ~1e-2 EUR/MWh, so zero-price tests need a <0.1
  tolerance; the visible spatial spread is set by the clustering, and the
  policy instrument (cap vs tax) flips the market-value trend.
coverage: ready
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-08-07"}
