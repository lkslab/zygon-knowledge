id: biomass-bioenergy-allocation
title: "Biomass / bioenergy allocation"
rank: 66
question: >
  Where should scarce sustainable biomass go — power, heat, industry,
  biofuels, or BECCS for negative emissions — and what does each competing
  claim displace? The allocation question sharpens as carbon targets
  tighten and biomass becomes the binding renewable resource.
when_to_use:
  - "best use of limited biomass potential"
  - "biomass for power vs heat vs fuels vs BECCS"
  - "how much bioenergy does the least-cost system burn"
  - "negative emissions from biomass under a CO2 cap"
  - "sustainable biomass supply as a system constraint"
recipes:
  generation_conversion: [biomass-bioenergy, biogas-anaerobic-digestion,
                          waste-to-energy, beccs, advanced-biofuels,
                          biomass-to-methanol]
  demand: [residential-space-heating-demand,
           industrial-process-heat-temperature-bands, shipping-demand]
functionality:
  - id: sector-master-switches
    role: "core — one network holds all competing biomass uses (power, CHP, heat, industry, fuels, BECCS); allocation is endogenous"
  - id: co2-cap
    role: "the tightening budget that makes biomass and BECCS scarce and valuable (Co2L or the cb carbon-budget token)"
  - id: co2-network-sequestration
    role: "CO2 pipeline network and CO2Stop regional storage potentials behind BECCS — spatially resolved, unlike earth"
  - id: co2-sequestration-limit
    role: "the seq<f> sequestration budget that BECCS competes for against DAC and industrial CCS"
  - id: methanol-suite
    role: "biomass-to-methanol opens a liquid-fuel claim on the same potential"
  - id: wildcard-opts-grammar
    role: "the biomasstransport sector_opts token prices inter-regional solid-biomass transport"
  - id: carrier-attribute-scaling
    role: "sweep biomass potential/cost multipliers — the key sensitivity"
  - id: scenario-matrix
    role: "allocation shifts across CO2 levels and ENSPRESO potential scenarios in parallel runs"
  - id: summary-outputs
    role: "supply/withdrawal by carrier shows where each PJ of biomass went; nodal_energy_balance for the regional split"
gap_assessment: >
  The core allocation logic is native and better provisioned than in
  pypsa-earth. Solid biomass, biogas and waste are potentials-limited
  resources drawn on simultaneously by power, CHP, district and
  decentral heat, industry, upgrading-to-gas, biomass-to-methanol/
  Fischer-Tropsch style fuel routes, and BECCS — the model decides the
  split endogenously and the shadow price on the potential is a direct
  scarcity signal. Europe-specific inputs are strong: ENSPRESO potentials
  per region with selectable scenario (high/med/low), a switchable
  unsustainable-biomass class with phase-down of existing use, optional
  solid-biomass imports at a price, and — unlike earth — a
  biomasstransport option so the resource is not locked in its region,
  plus spatially resolved sequestration potentials and a CO2 network
  behind the BECCS claim. Caveats: potentials are per-class aggregates,
  not feedstock-level supply curves with cost steps; transport is a
  simple distance-cost layer, not logistics; and dedicated road-fuel
  biofuel routes are thinner than the power/heat/BECCS/shipping-fuel
  paths. For "where should biomass go under a carbon budget" at
  national/EU scale, ready; for feedstock- or logistics-level questions,
  not the right tool.
coverage: ready
models:
