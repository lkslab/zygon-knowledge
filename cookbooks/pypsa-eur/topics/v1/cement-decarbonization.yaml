id: cement-decarbonization
title: Cement decarbonization
rank: 44
question: >
  How does cement cut its process CO2 — carbon capture, clinker substitution,
  kiln fuel switching — and what does each route cost the energy system?
  Cement's calcination CO2 is irreducible by fuel choice alone, which makes it
  the canonical CCS-vs-material-change trade-off.
when_to_use:
  - "cement / clinker decarbonization pathway"
  - "carbon capture at cement plants"
  - "low-clinker or SCM cement scenario"
  - "cement kiln electrification or fuel switching"
  - "process emissions abatement in minerals"
recipes:
  generation_conversion: [low-clinker-cement, industrial-ccs, co2-transport-and-sequestration, industry-process-heat-endogenous, direct-air-capture]
  demand: [cement-minerals-demand, industrial-process-emissions, industrial-material-production-drivers]
functionality:
  - id: co2-network-sequestration
    role: "core endogenous route — process emissions CC (cement capture cost row), CO2 pipeline network, CO2Stop regional storage potentials"
  - id: co2-sequestration-limit
    role: "the annual sequestration budget the captured calcination CO2 competes for"
  - id: sector-master-switches
    role: "industry chain: cement/ceramics/glass tonnage to nodal fuel loads and process-emission buses"
  - id: industry-t-endogenous
    role: "cement is in the default endogenise list — kiln/process heat bands choose gas(+CC)/H2/biomass/electric endogenously when enabled"
  - id: co2-budget-pathway
    role: "the tightening budget that forces capture vs venting"
  - id: emission-pricing
    role: "carbon-price sensitivity on the capture decision"
  - id: scenario-matrix
    role: "sweep clinker-intensity / production assumptions across parallel runs"
gap_assessment: >
  Capture and (optionally) kiln heat are endogenous; material change is not.
  Cement, ceramics and glass are separate products with kt/a tonnage per
  country (JRC-IDEES), per-tonne intensities, limestone-calcination process
  emissions per tonne, and siting from the GEM cement tracker (clinker
  capacities, integrated vs grinding). Calcination CO2 lands on process-
  emission buses that are vented or captured by the always-present "process
  emissions CC" link (cement capture costs) feeding a REAL CO2 pipeline
  network with regional sequestration potentials — the capture route is
  genuinely optimized, well beyond earth's nodal budget. Kiln fuel switching:
  with sector.industry_t.endogen (off by default), cement's process heat is
  split into temperature bands with competing gas(+CC)/hydrogen/biomass/
  electric supply; by default kilns stay on methane exogenously. The missing
  third: clinker substitution has NO lever — cement tonnage passes unchanged
  through build_industrial_production_per_country_tomorrow (unlike steel/HVC/
  aluminium there is no future-route split for cement), and no SCM or
  clinker/cement-ratio machinery exists. Low-clinker scenarios are L2 edits
  of the per-tonne intensity and process-emission factors. So the canonical
  capture-vs-material-change trade-off can only be run as capture (endogenous)
  vs user-edited material scenarios (exogenous) — hence partial, but on a much
  deeper data base than earth.
coverage: partial
