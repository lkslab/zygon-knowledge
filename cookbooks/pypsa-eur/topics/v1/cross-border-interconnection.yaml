id: cross-border-interconnection
title: Cross-border interconnection
rank: 7
question: >
  What is cross-border transmission worth — which interconnectors pay off,
  how much does trade cut system cost, and how do power pools or new HVDC
  links change each country's mix and import dependence?
when_to_use:
  - "value of an interconnector between two countries"
  - "European market integration / trade benefit study"
  - "autarky vs trade counterfactual"
  - "import dependence / self-sufficiency targets"
  - "where to add cross-border capacity first"
recipes:
  generation_conversion: [hvdc-interconnectors, hv-transmission-lines, uhv-dc,
                          green-energy-imports, transmission-expansion-projects]
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: autarky
    role: "core counterfactual — config electricity.autarky works; the ATK opts token is BROKEN at this ref (KeyError), use config"
  - id: equity-self-sufficiency
    role: "EQ caps import dependence per country — always give a value (EQ0.7c); bare EQ crashes"
  - id: transmission-expansion-limits
    role: "interconnector capacity co-optimized under volume/cost bounds"
  - id: transmission-projects
    role: "real TYNDP/NEP interconnector candidates by permitting status"
  - id: copperplate-regions
    role: "merge regions into one node — cheap full-interconnection counterfactual"
  - id: transmission-losses
    role: "default-on losses make long-link economics honest"
  - id: nodal-marginal-prices
    role: "price convergence and congestion rent quantify link value"
  - id: administrative-clustering
    role: "NUTS/bidding-zone clustering keeps borders and market zones meaningful"
  - id: scenario-matrix
    role: "with/without-link sweeps as scenario runs"
gap_assessment: >
  A genuine strength: pypsa-eur is natively multi-country across ~33
  European countries with cross-border lines, per-country ENTSO-E demand,
  and bidding-zone-aware clustering assembled by default. The valuation
  loop is first-class and better instrumented than earth: solve with
  trade, re-solve under autarky or a self-sufficiency floor, read the
  system-cost delta, price convergence, and congestion rents — with
  interconnector expansion co-optimized, real TYNDP/NEP candidate links
  injectable by permitting status, default-on transmission losses, and
  copperplate_regions for the frictionless-trade bookend. Two wiring traps
  at this ref: the ATK/ATKc opts token is broken (writes a nonexistent
  top-level config key) — set electricity.autarky in config instead — and
  a bare EQ token crashes, so always pass a valued form like EQ0.7c.
  Structural limits are the family's: a single social planner, so trade is
  optimal dispatch, not strategic behaviour — no market-coupling
  frictions, wheeling charges, or political import reliability (an EQ
  sensitivity is the crude proxy) — and no per-country WACC. Non-European
  power pools (EAPP, ASEAN) are out of scope; use pypsa-earth.
coverage: ready
models:
  - model: pypsa-eur
