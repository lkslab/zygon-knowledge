id: curtailment-minimization
title: "Curtailment minimization"
rank: 12
question: >
  How much VRE gets curtailed, where and why (grid vs surplus), and what mix
  of transmission, storage, and flexible loads absorbs it cheapest? The
  cost-of-not-building-the-grid framing (congestion + curtailment) is central
  to TSO and regulator debates from TYNDP to REZ planning.
when_to_use:
  - "how much wind/solar is being curtailed and why"
  - "grid vs storage vs electrolysers to soak up surplus"
  - "curtailment cost of delayed transmission"
  - "where do zero-price hours cluster"
  - "value of flexible P2X loads for surplus absorption"
recipes:
  generation_conversion: [grid-scale-batteries, hv-transmission-lines,
                          hvdc-interconnectors, electrolysers,
                          dynamic-line-rating-facts,
                          transmission-expansion-projects]
  demand: [electricity-load, demand-temporal-profiles]
functionality:
  - id: curtailment-mode
    role: "core — explicit curtailment accounting: VRE fixed to profile with negative curtailment generators, so curtailed energy is a dispatched carrier"
  - id: summary-outputs
    role: "curtailment per carrier also falls out of the standard summary tables"
  - id: transmission-expansion-limits
    role: "sweep the transmission_limit config key (lv/lc opts token) to trace the grid-vs-curtailment trade-off — the ll wildcard is gone at this ref"
  - id: nodal-marginal-prices
    role: "zero/near-zero duals locate and time-stamp surplus; congestion rent from line duals"
  - id: transmission-losses
    role: "losses are on by default, so surplus absorption is priced against realistic deliverability"
  - id: dynamic-line-rating
    role: "weather-dependent line ratings (off by default) test DLR as a curtailment-relief measure"
  - id: operations-only-solve
    role: "operational curtailment on a fixed fleet is a wired dispatch-only rule, not manual assembly"
  - id: spatial-clustering
    role: "curtailment concentrates at network bottlenecks — too-coarse zones average it away"
  - id: sector-master-switches
    role: "electrolysers, heat, and EVs as endogenous surplus sinks with the sector layers on"
  - id: linearized-unit-commitment
    role: "LP-relaxed start-up/min-load/ramping (off by default) recovers some of the must-run inflexibility that drives real curtailment"
gap_assessment: >
  Strong core, stronger than the pypsa-earth equivalent: curtailment is an
  endogenous outcome of the LP, reported per carrier, and the dedicated
  curtailment mode makes it an explicit dispatched carrier instead of a
  residual; the standard study — quantify curtailment under a constrained
  grid, then let transmission/storage/electrolysers expand and watch it
  fall — runs out of the box, and the operational variant (fixed fleet,
  dispatch-only) is a wired rule rather than manual assembly. Linearized
  unit commitment (off by default) recovers part of the must-run rigidity
  that pure LPs miss, though it stays a relaxation: no integer commitment,
  no negative-price bidding, no market behaviour, so curtailment on
  inflexible or badly-bid systems is still understated. Sub-hourly effects
  vanish at hourly resolution. European grid topology (OSM-prebuilt or
  TYNDP projects) is well-validated, so bottleneck locations are far more
  trustworthy than in global models.
coverage: ready
models:
  - model: pypsa-eur
