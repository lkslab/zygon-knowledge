id: data-center-load-growth
title: Data-center load growth
rank: 3
question: >
  How does AI/data-center demand growth reshape the power system — how much
  new capacity and grid, where should hyperscale load sit, and can it be
  served clean and firm? The defining new demand driver in the US, and
  spreading to every grid courting hyperscalers.
