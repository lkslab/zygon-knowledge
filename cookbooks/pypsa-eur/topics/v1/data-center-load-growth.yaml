gap_assessment: >
  No data-center load category exists: electricity demand comes from
  historical ENTSO-E national timeseries scaled and disaggregated by
  population/GDP, so a hyperscale campus — large, flat, point-sited — has
  no native representation. The workaround is the same as everywhere in
  the family: scale national loads (load.scaling_factor / CF+ injection)
  for the aggregate effect, or add a constant Load at a chosen bus by
  editing the network, then let the standard workflow answer the system
  questions — capacity, grid, prices, adequacy — which it does well once
  the load exists, with better siting granularity than earth thanks to
  focus_weights (high resolution around the host region) and the real
  TYNDP grid context. What you cannot get without code: data-center
  profiles and flexibility (curtailable training load — demand is
  inelastic), 24/7 carbon-free-energy matching constraints (the
  custom_extra_functionality hook is the sanctioned landing point for
  one), and siting logic trading land/fiber/water against grid headroom.
  European demand baselines are measured, not synthetic — a genuine
  advantage over earth for growth-scenario credibility.
