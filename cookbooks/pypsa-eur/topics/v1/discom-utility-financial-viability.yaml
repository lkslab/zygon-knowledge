id: discom-utility-financial-viability
title: DISCOM / utility financial viability
rank: 39
question: >
  Is the utility financially viable under a given expansion plan — do tariffs
  cover procurement cost plus losses, how do rooftop PV defection and
  subsidized agricultural load erode revenue, and what does DISCOM distress
  feed back into what is actually buildable? India's binding constraint.
when_to_use:
  - "DISCOM financial distress / cost-recovery study"
  - "does the utility's revenue cover its power purchase cost"
  - "rooftop solar revenue erosion for the utility"
  - "losses and subsidized load in the utility balance"
  - "bankability feedback on the expansion plan"
recipes:
  generation_conversion: [rooftop-distributed-solar, utility-scale-solar-pv,
                          electricity-distribution-grid, grid-scale-batteries]
  demand: [electricity-distribution-losses, electricity-load,
           residential-electricity-demand, agriculture-energy-demand]
functionality:
  - id: market-design-mechanisms
    role: "nearest registry id to the missing core — no actors, tariffs, revenue, settlement, or balance sheets of any kind"
  - id: nodal-marginal-prices
    role: "nearest proxy: system prices as the utility's procurement-cost benchmark"
  - id: demand-elasticity
    role: "absent — no tariff-driven consumption or defection response"
  - id: summary-outputs
    role: "system cost and energy volumes — the raw inputs to an offline viability calculation"
  - id: discount-rate-dimension
    role: "one social discount rate (tech WACC from the costs table); no actor-specific WACC or credit constraint"
  - id: distribution-grid-lv
    role: "rooftop PV and losses behind the costed LV link — the volumes that bypass utility sales (sector runs)"
gap_assessment: >
  Out of scope for a single-social-planner model, in pypsa-eur exactly as
  in pypsa-earth: there are no actors, so there is no utility that buys
  wholesale, sells at regulated tariffs, eats technical and commercial
  losses, and goes insolvent — the entire causal chain of the DISCOM
  question is unrepresented (nothing in the functionality registry even
  names a utility-finance layer; market-design-mechanisms is the closest
  absent id). What the model contributes is one honest input: the cost
  side. Nodal/zonal marginal prices give a procurement-cost benchmark, the
  summary tables give volumes and weighted prices, distribution losses and
  the LV grid link are represented in sector runs, and rooftop PV behind
  the meter quantifies the energy that bypasses utility sales. A viability
  assessment is then an offline spreadsheet — model procurement cost vs
  assumed tariff schedules and collection rates — with no feedback: the
  model cannot make utility distress constrain what gets built (its
  financing appears nowhere), cannot price cross-subsidies, and cannot
  endogenize defection since demand is price-inelastic. The framing is
  also Indian/developing-country while eur's data is European, so even the
  cost-engine role usually belongs to pypsa-earth here. Treat PyPSA as the
  cost engine inside a separate utility-finance model, not as an answer to
  this topic.
coverage: gap
models:
  - model: pypsa-eur
