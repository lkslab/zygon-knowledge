gap_assessment: >
  Methanol is the model's DEFAULT deep-decarbonization shipping fuel — the
  full chain runs out of the box. sector.shipping_methanol_share ramps 0
  (2025) to 1.0 (2050) while oil falls to zero; add_shipping builds "shipping
  methanol" loads with an engine-efficiency conversion, fed from the methanol
  bus with combustion CO2 booked to the atmosphere at the methanolisation
  carbon content (carbon-neutral overall). Supply is genuinely optimized:
  extendable methanolisation links at every H2 location (H2 + electricity +
  co2 stored, must-run floor 0.3), biomass-to-methanol (+CC), methanol
  storage, and priced imports as the competing route. Delivered cost falls
  out of the methanol bus dual and market_values summaries. Caveats: the fuel
  COMPETITION is exogenous — shares per config, so "when does MeOH beat H2"
  is a scenario comparison, not an endogenous fuel choice; there is no
  shipping_ammonia_share at this ref, so the three-way MeOH/NH3/H2 race needs
  a user-added share key even though the NH3 supply chain exists (L2);
  and methanol is copperplated on one "EU methanol" bus (define_spatial
  hardcodes it — only demand regionalises via regional_methanol_demand), so
  no port-level methanol siting or transport. Contrast pypsa-earth, where
  methanol is absent entirely.
