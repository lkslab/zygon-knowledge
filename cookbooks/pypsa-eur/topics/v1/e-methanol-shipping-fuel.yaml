  - "e-methanol production cost / power-to-methanol"
  - "green shipping fuel choice (MeOH vs NH3 vs H2)"
  - "methanol bunkering demand at ports"
  - "IMO-compliant marine fuel scenarios"
  - "methanolisation of captured CO2"
