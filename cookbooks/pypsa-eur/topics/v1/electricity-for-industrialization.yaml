gap_assessment: >
  The machinery is all here and battle-tested — bottom-up industrial demand
  by subsector from JRC-IDEES production data, distributed to real site
  locations, scaled per horizon via config/scenario overrides, then
  generation, storage and transmission co-optimized to serve it, with a
  validated scenario-management layer earth lacks. But the topic as posed
  is a developing-country question, and pypsa-eur's entire input pipeline
  (JRC-IDEES, Hotmaps, NUTS shapes, ENTSO-E/OSM-Europe grid, Eurostat
  balances) is hard-wired to Europe: you cannot point it at Ghana or
  Vietnam, which is precisely where the productive-use agenda lives — that
  is pypsa-earth's territory. What eur answers well is the European
  homologue: reindustrialization, new gigafactory/data-hall-scale
  industrial load, or onshoring scenarios — grow subsector production
  drivers in a scenario file and read off build-ahead capacity, grid
  reinforcement, cost and carbon intensity per future. Shared caveats with
  earth remain: future plant siting is exogenous, there is no
  cost-competitiveness feedback on demand (loads fixed per scenario), and
  reliability is a planning margin, not outage statistics. Scored partial
  purely for geographic scope: the machinery is ready, the topic's home
  turf is out of reach.
