id: electricity-for-industrialization
title: Electricity-for-industrialization
rank: 37
question: >
  What power system does industrialization need — if a country grows mining,
  manufacturing, and processing loads (the African productive-use agenda),
  where does that demand land, what supply and grid must be built ahead of
  it, and at what cost and carbon intensity?
