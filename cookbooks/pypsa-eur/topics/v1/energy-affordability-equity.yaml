id: energy-affordability-equity
title: Energy affordability / equity
rank: 93
question: >
  Who pays for the transition — how do system costs and prices fall on
  regions and households, and does decarbonization stay affordable? High
  social need with a weak paying buyer; in Europe framed as energy poverty,
  retail price incidence, and the distributional politics of heat
  decarbonization.
when_to_use:
  - "distributional impact of the transition"
  - "electricity prices by region / who pays"
  - "affordability of a decarbonization pathway"
  - "energy poverty in system scenarios"
  - "equity framing of system-cost results"
recipes:
  generation_conversion: [electricity-distribution-grid, rooftop-distributed-solar,
                          building-retrofit]
  demand: [electricity-load, residential-electricity-demand,
           residential-space-heating-demand, demand-spatial-disaggregation]
functionality:
  - id: nodal-marginal-prices
    role: "the core distributional signal — nodal/zonal price incidence from duals, with weighted_prices and market_values tables shipped in the summaries"
  - id: administrative-clustering
    role: "report costs/prices on NUTS1/2/3 or bidding zones — the jurisdictions the equity question is asked about"
  - id: bidding-zone-shapes
    role: "zonal-split scenarios (who wins/loses from reconfiguration) on real bidding-zone geometries"
  - id: equity-self-sufficiency
    role: "EQ is inter-COUNTRY production equity, not household equity — and a bare EQ token crashes; always give a value like EQ0.7c"
  - id: distribution-grid-lv
    role: "a household-facing cost layer: LV grid reinforcement, rooftop PV, home batteries and heat pumps sit behind an explicit distribution link — a step toward retail-cost decomposition, though no tariffs"
  - id: building-retrofit-endogenous
    role: "heat-cost burden lever: endogenous retrofit (off by default) trades building investment against energy bills — the closest thing to an affordability decision in the model"
  - id: load-shedding-voll
    role: "unserved energy by node and carrier is a crude deprivation signal"
  - id: demand-elasticity
    role: "absent — fixed loads mean no affordability feedback on consumption"
  - id: market-design-mechanisms
    role: "absent — no tariffs, bills, or actor-level cost allocation; the planner minimizes total system cost only"
gap_assessment: >
  pypsa-eur is a single social planner minimizing total system cost: there
  are no households, income groups, tariffs, or subsidy flows, so
  distributional questions cannot be answered inside the model. The price
  side of incidence is well supplied — nodal duals aggregated to
  demand-weighted zonal prices in the shipped summaries, and administrative
  (NUTS/bidding-zone) clustering aligns model zones with real
  jurisdictions, so scenario price/cost deltas per region cross cleanly
  with external income and expenditure statistics. Two eur-specific slices
  go further than earth: the stylized distribution grid separates a
  household-facing LV cost layer (rooftop PV, home storage, heat pumps,
  reinforcement) from the wholesale system, and endogenous building
  retrofit puts the heat-affordability trade-off (invest in the building vs
  pay for energy) inside the optimization. The EQ constraint is national
  self-sufficiency — equity between countries, not within them. Household
  burden, tariff design, and energy-poverty metrics remain external
  post-processing; there is no actor-level accounting of any kind.
coverage: gap
