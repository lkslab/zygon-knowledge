id: geothermal-niche-baseload
title: Geothermal / niche baseload
rank: 99
question: >
  What role does geothermal play as firm low-carbon baseload — expanding
  the fleet where the resource exists (Italy, Iceland, Turkey) and whether
  EGS opens it up elsewhere? Niche globally, central in a handful of
  regions, with growing EGS interest.
when_to_use:
  - "geothermal in the capacity mix"
  - "expand geothermal at existing fields"
  - "geothermal as firm/baseload alternative to gas"
  - "EGS / next-generation geothermal role"
  - "geothermal district heating role"
recipes:
  generation_conversion: [geothermal-conventional, enhanced-geothermal,
                          district-heating]
  demand: [district-heating-demand-share]
functionality:
  - id: fleet-retirement-filter
    role: "the existing hydrothermal fleet comes from powerplantmatching (36 EU units, mostly Italy); custom_powerplants injects candidate sites"
  - id: country-carrier-capacity-limits
    role: "CCL caps/floors per country — the stand-in for national resource limits on extendable geothermal"
  - id: cost-data-pipeline
    role: "essential before making geothermal extendable: the shipped cost row has ZERO investment (and 0.12 tCO2/MWh intensity) — override via custom_costs.csv or candidates are free"
  - id: enhanced-geothermal
    role: "a full EGS chain (gridded EU potentials, wells supply curve, ORC, district heat, flexible reservoir) exists — but it is dead-key at defaults: var_cf: true hits a hardcoded placeholder path; set var_cf false or patch the call"
  - id: district-heating-suite
    role: "geothermal district heat is wired but dormant — appending 'geothermal' to sector.heat_pump_sources 'urban central' activates source generators with real Fraunhofer-ISI regional potentials, heat pumps, and direct utilisation"
  - id: safe-reserve-margin
    role: "geothermal counts as firm capacity toward the SAFE margin — but the config key has no default entry, add it yourself"
  - id: carrier-attribute-scaling
    role: "cost/potential sensitivity sweeps once the carrier is extendable"
gap_assessment: >
  Substantially more machinery than pypsa-earth, but the extra pieces need
  care. The existing hydrothermal POWER fleet is in by default as
  dispatchable conventional generators (Italy-heavy); expansion at
  existing sites works only after overriding the zero-investment cost row,
  with CCL as the resource cap — and in sector runs the geothermal power
  fleet is silently DROPPED unless appended to the pypsa_eur keep-list.
  EGS exists as a real chain (unlike earth): Aghahosseini & Breyer gridded
  CAPEX/potentials, cost-stepped well supply curves, ORC to electricity,
  automatic CHP into district heating, and a flexible-reservoir constraint
  — but it is off by default and broken at defaults (the var_cf
  capacity-factor input is a hardcoded placeholder path; run with var_cf:
  false or apply the one-line fix), sector-only, and single-EU-node for
  drilling. Geothermal DISTRICT HEAT is a one-list config activation with
  shipped regional potential data — genuinely useful in the European heat
  context. Still missing: any resource assessment for new power sites
  (potential maps, greenfield siting) and time-varying availability;
  resource-constrained geothermal power strategy needs external data.
coverage: partial
models:
