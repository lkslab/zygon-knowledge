id: green-ammonia-exports
title: Green ammonia exports
rank: 41
question: >
  Can a country produce and ship green ammonia competitively — at what delivered
  cost, from which ports, backed by how much wind/solar/electrolysis? The Gulf
  ("barrels to molecules": NEOM, Oman), Chile's Atacama, Brazil and Australia all
  frame their export strategies around NH3, not just H2.
when_to_use:
  - "green ammonia export study"
  - "NH3 export terminal / shipping economics"
  - "Haber-Bosch sizing against an export offtake"
  - "hydrogen vs ammonia as the export vector"
  - "Europe as ammonia importer / delivered-cost benchmark"
recipes:
  generation_conversion: [green-ammonia, green-hydrogen, electrolysers, ammonia-ships, green-energy-imports]
  demand: [hydrogen-export-demand, chemicals-demand]
functionality:
  - id: ammonia-value-chain
    role: "core supply chain — Haber-Bosch (elec+H2 inputs), cracker, liquid NH3 store, industrial demand; on by default"
  - id: h2-export-chain
    role: "absent — the export machinery the topic needs; eur has no export bus, wildcard or endogenous export price for ANY fuel"
  - id: green-energy-imports
    role: "the mirror eur actually models: priced NH3 imports at real entry infrastructure — the delivered-cost benchmark an exporter must beat"
  - id: import-limit-constraint
    role: "volume cap on the import side for security-of-supply framings"
  - id: h2-network-retrofit
    role: "moves H2 from inland renewables to the nodes hosting Haber-Bosch"
  - id: nodal-marginal-prices
    role: "production-cost decomposition from H2/NH3 bus duals — needs sector.ammonia: regional, since the default is one EU NH3 bus"
  - id: custom-constraint-hook
    role: "cheapest landing point for a fixed NH3 export offtake Load at a port node"
  - id: scenario-matrix
    role: "sweep exogenous export volumes / import prices as parallel runs (no h2export wildcard here)"
gap_assessment: >
  The value chain is first-class, the export is not in the model at all —
  the inverse of pypsa-earth's problem. sector.ammonia (default true) builds
  Haber-Bosch links with electricity+H2 inputs at every node, an ammonia
  cracker, extendable liquid-NH3 storage and industrial NH3 demand; but by
  default all NH3 sits on a single copperplate "EU NH3" bus — set
  sector.ammonia: "regional" before reading port-level siting or duals. There
  is NO export mechanism of any kind: no export bus, no h2export wildcard
  (which earth has), no endogenous export pricing — eur is written as the
  IMPORTING side, with priced H2/NH3/methanol imports at real entry points
  (sector.imports). That import price is the natural competitiveness benchmark:
  a would-be exporter's delivered cost must beat it. Workable proxy for an
  export study inside Europe (e.g. Iberia, Norway): add a fixed NH3 offtake
  Load at a port node via the custom extra_functionality hook and sweep volumes
  through the scenario matrix — losing endogenous export volume/price and the
  ship chain (no shipping_ammonia_share exists). For Gulf/Chile/Australia
  exporter geographies, eur is the wrong instrument; pypsa-earth's h2export
  machinery is the sibling starting point.
