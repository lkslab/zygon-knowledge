id: grid-congestion-redispatch
title: "Grid congestion / redispatch"
rank: 16
question: >
  Where does the grid bind, what does congestion cost, and how much
  redispatch (and curtailment) does it force? Redispatch bills in the
  billions (DE, GB) make this a headline TSO/regulator question — the
  operational face of the transmission bottleneck.
when_to_use:
  - "where are the binding lines / congested corridors"
  - "congestion cost and congestion rent quantification"
  - "redispatch volume and cost estimation"
  - "which reinforcements relieve congestion cheapest"
  - "storage or DLR as congestion relief"
recipes:
  generation_conversion: [hv-transmission-lines, hvdc-interconnectors,
                          dynamic-line-rating-facts, grid-scale-batteries,
                          transmission-expansion-projects]
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: nodal-marginal-prices
    role: "core — congested lines carry non-zero duals; congestion rent and price spreads directly"
  - id: operations-only-solve
    role: "fixed-fleet dispatch rule — one half of a two-stage redispatch approximation, wired"
  - id: rolling-horizon-dispatch
    role: "production-cost-style sequential dispatch for operational congestion studies"
  - id: transmission-expansion-limits
    role: "congested (transmission_limit: v1.0) vs expanded runs price the cost of not building"
  - id: transmission-projects
    role: "test whether the TYNDP/NEP project pipeline actually relieves the binding corridors"
  - id: dynamic-line-rating
    role: "weather-dependent ratings (off by default) as a congestion-relief measure"
  - id: line-security-margin
    role: "s_max_pu 0.7 is the only reliability margin — congestion is against derated limits"
  - id: contingency-scopf
    role: "true N-1 security-constrained OPF, the TSO-grade congestion tool, is absent"
  - id: linearized-unit-commitment
    role: "start-up/min-load costs that drive redispatch bills exist only as an off-by-default LP relaxation"
  - id: spatial-clustering
    role: "congestion analysis needs near-full topology; clustering hides intra-zonal binding lines"
  - id: plotting-suite
    role: "line-loading maps to visualize where flows saturate"
gap_assessment: >
  Congestion identification and pricing work well: solve on the validated
  European topology (optionally with TYNDP/NEP projects layered in) with a
  fixed grid, and line loadings, duals, and congestion rents show exactly
  where and when the network binds; reinforcement candidates are ranked by
  re-running with expansion enabled, and default-on transmission losses
  plus optional DLR make the operational picture more physical than in
  pypsa-earth. Redispatch proper is closer but still not turnkey: the
  wired operations-only and rolling-horizon rules supply the fixed-fleet
  dispatch stage, so a zonal-market-then-nodal-redispatch chain can be
  assembled from existing rules — but nothing orchestrates the two stages,
  unit-commitment costs are an off-by-default LP relaxation (no integer
  start-ups), and there are no N-1 constraints, so absolute redispatch
  volumes/costs remain approximations rather than TSO-grade numbers.
coverage: partial
models:
  - model: pypsa-eur
