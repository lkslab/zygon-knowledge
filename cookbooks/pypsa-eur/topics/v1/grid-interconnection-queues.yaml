id: grid-interconnection-queues
title: Grid interconnection queues
rank: 2
question: >
  Which projects stuck in the connection queue should be prioritized, where
  does the grid have headroom for new generation, and what upgrades unlock
  the most queued capacity? The acute developer/regulator pain in the US
  (2000+ GW queued), and increasingly UK, EU, and beyond.
when_to_use:
  - "which queued projects can actually connect"
  - "where is there grid headroom for new generation"
  - "connection cost / upgrade allocation for a project"
  - "queue reform / cluster study analysis"
  - "curtailment risk for a project at a specific node"
recipes:
  generation_conversion: [hv-transmission-lines, hvdc-interconnectors,
                          transmission-expansion-projects]
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: interconnection-queues
    role: "the core ask — generator-project queue/pipeline machinery is absent"
  - id: transmission-projects
    role: "the TRANSMISSION half of the queue exists: TYNDP/NEP projects with permitting-status filters"
  - id: fleet-retirement-filter
    role: "inject known generation projects by hand via custom_powerplants"
  - id: nodal-marginal-prices
    role: "nodal duals proxy where connection is valuable vs congested"
  - id: transmission-expansion-limits
    role: "what upgrades relieve binding corridors, at zonal resolution"
  - id: spatial-clustering
    role: "clustering destroys the substation-level detail queues live at"
  - id: line-security-margin
    role: "headroom is s_max_pu-derated thermal capacity, not real N-1"
  - id: contingency-scopf
    role: "real connection studies are contingency-based — not wired in"
gap_assessment: >
  Still not what the model does, but pypsa-eur covers one half that earth
  cannot: the transmission_projects machinery ingests real TYNDP2020 and
  German NEP candidate projects filtered by permitting status
  (under_construction, in_permitting, confirmed...), which is genuine
  project-pipeline modelling — for grid projects. The GENERATOR queue —
  queue positions, cluster studies, per-project connection-cost allocation
  — has no representation; interconnection-queues is absent outright.
  What the workflow delivers is the system-level shadow of the problem:
  solve at high spatial resolution and read nodal prices, congested lines,
  and curtailment to map where new capacity is valuable — a headroom
  heat-map, not a queue study. Known generation projects can be injected
  via custom_powerplants, but that is manual scenario assembly. The hard
  blocker is methodological: connection studies are N-1/contingency-based,
  and there is no SCOPF — only the static s_max_pu margin. Treat pypsa-eur
  as context for queue-reform debates and zonal headroom screening, not a
  tool that processes a queue.
coverage: gap
models:
