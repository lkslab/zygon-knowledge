id: high-resolution-spatial-modelling
title: High-resolution spatial modelling
rank: 89
question: >
  How finely can the model resolve space — real substations and lines instead
  of copper-plate zones, siting-relevant renewable profiles, admin-unit
  results — and where does resolution stop paying? The counterpoint to the
  tractability topic: what detail is actually available.
when_to_use:
  - "model [country] at substation / full-grid resolution"
  - "nodal results instead of zonal averages"
  - "siting-relevant renewable profiles per node"
  - "results per NUTS region / bidding zone"
  - "how many clusters do I need for this question"
recipes:
  generation_conversion: [hv-transmission-lines, utility-scale-solar-pv,
                          onshore-wind, electricity-distribution-grid]
  demand: [demand-spatial-disaggregation, electricity-load]
functionality:
  - id: spatial-clustering
    role: "core — cluster anywhere between the full OSM HV topology and one node, kmeans or resource-feature hac, profiles re-aggregated consistently"
  - id: network-simplification
    role: "the ceiling is base_s: the real grid mapped to 380 kV with stubs trimmed (the old simpl wildcard is gone)"
  - id: administrative-clustering
    role: "resolve to NUTS1/2/3 or bidding zones when the audience thinks in policy geometries"
  - id: bidding-zone-shapes
    role: "real bidding-zone geometries (DK1/DK2, NO/SE, IT zones) built as a first-class clustering target"
  - id: custom-busmap
    role: "arbitrary user-defined zonal maps by csv or polygon file for bespoke study geometries"
  - id: focus-weights
    role: "high resolution where the question lives, coarse elsewhere — per-country cluster budgets"
  - id: base-network-source
    role: "OSM-derived grid by default; TYNDP reference grid as an alternative topology truth"
  - id: renewable-potentials-land-eligibility
    role: "resource CLASSES bin site quality within each region — sub-nodal resource signal beyond the cutout grid"
  - id: distribution-grid-lv
    role: "below-HV is one stylized LV bus per node with reinforcement cost — not a feeder model"
  - id: distribution-power-flow
    role: "true distribution-level resolution is out of scope entirely"
gap_assessment: >
  Ready, with more zonal machinery than any sibling model. Ceiling: the base
  network is the real OSM-derived (or TYNDP) European HV grid — thousands
  of substations and lines — and the clusters setting runs anywhere between
  that and one node per country, with renewable profiles, demand
  disaggregation, and the plant fleet re-aggregated consistently at every
  level. The zonal-geometry options are the standout: administrative
  clustering to NUTS1/2/3, real bidding-zone shapes as a clustering target,
  custom busmaps/shapes for bespoke geometries, and focus_weights to spend
  the cluster budget where the question lives. Resource-side resolution
  goes below the node: resource classes bin each region's wind/solar sites
  by quality, so a coarse network can still see good-vs-bad siting — a
  partial answer to the "profiles are bounded by the cutout grid" caveat
  (the ~0.25 degree ERA5 cell remains the weather floor). Honest limits:
  solve cost climbs fast with bus count (see solver-speed-scalability), so
  full-topology capacity expansion is for network truth, clustered runs for
  optimization; and nothing below the HV grid is resolved — distribution
  is a linear cost proxy per node, with feeder-level modelling absent.
coverage: ready
models:
  - model: pypsa-eur
