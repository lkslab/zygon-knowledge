gap_assessment: >
  This is the topic pypsa-eur just built machinery for — and this ref is the
  commit that introduced it. With sector.industry_t.endogen: true, industrial
  heat for a configurable sector list (cement, ceramics, glass, pulp/paper,
  food, chemicals subsectors, non-ferrous, machinery...) is converted from
  today's carrier intensities into temperature bands heat100-200, heat200-500
  and heat>500 (heat<100 folds into the district-heat-served low-T load) via
  Fleiter et al. band mappings, each band a nodal bus + load with competing
  extendable links: 100-200C biomass(+CC), gas(+CC), high-temperature heat
  pumps, electric boiler steam; 200-500C biomass, gas, hydrogen; >500C
  gas(+CC), hydrogen. Exactly the question — technology choice per band is
  endogenous, and the grid impact of electrification follows. Caveats keeping
  this shy of unqualified: endogen defaults FALSE (default runs keep heat
  inside exogenous per-carrier sector ratios); the >500C menu has no electric
  option (no plasma/resistance furnace — kiln electrification still cannot
  win endogenously); iron & steel is handled by route shares, not bands; no
  industrial heat storage inside the bands; and the machinery is brand-new at
  this ref, so lightly battle-tested. Still a decisive step beyond earth,
  where temperature is invisible and switching is purely exogenous.
coverage: ready
