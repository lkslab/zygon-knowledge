id: high-temperature-industrial-heat
title: High-temperature industrial heat
rank: 45
question: >
  Which technologies serve industrial heat at each temperature level —
  heat pumps to ~150C, electric boilers and resistance to ~500C, hydrogen or
  biomass furnaces above — and what does electrifying process heat do to the
  grid? The unsolved core of industrial decarbonization.
when_to_use:
  - "electrify industrial process heat"
  - "high-temperature heat pump vs electric boiler vs H2 furnace"
  - "industrial steam demand decarbonization"
  - "temperature-banded industry heat study"
  - "kiln / furnace fuel switching"
recipes:
  generation_conversion: [industry-process-heat-endogenous, industrial-heat-pumps, electric-boilers, electric-process-heat, waste-heat-recovery]
  demand: [industrial-process-heat-temperature-bands, industrial-crosscutting-electricity]
functionality:
  - id: industry-t-endogenous
    role: "core — per-subsector heat split into heat100-200/200-500/>500 bands with competing extendable supply links; off by default"
  - id: sector-master-switches
    role: "the industry chain that carries the (default exogenous) per-carrier fuel loads the bands replace"
  - id: co2-network-sequestration
    role: "gas/biomass +CC band options and 'gas for industry CC' — the capture alternative to electrification"
  - id: gas-network-links
    role: "methane feeding industrial heat rides a real capacitated pipeline network, not a nodal-unlimited bus"
  - id: h2-network-retrofit
    role: "H2 delivery for the hydrogen furnace options in the 200-500C and >500C menus"
  - id: carrier-attribute-scaling
    role: "cost sensitivity on band technologies (e.g. HT heat pump capex) without touching cost files"
  - id: scenario-matrix
