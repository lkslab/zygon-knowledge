id: hydropower-drought-risk
title: Hydropower drought risk
rank: 50
question: >
  What happens to a hydro-dominant system in a dry year — how much firming,
  storage or imports does drought resilience need? Alpine and Nordic
  reservoirs, Iberian droughts and the 2022 European hydro crunch make this a
  live reliability question well beyond the classic Brazil/Andes framing.
when_to_use:
  - "dry-year / drought stress test for a hydro system"
  - "hydro inflow sensitivity scenarios"
  - "firming a hydro-dominant grid (Norway, Alps, Iberia)"
  - "climate variability of reservoir inflows"
  - "2022-style low-hydro European stress year"
recipes:
  generation_conversion: [conventional-hydropower, run-of-river-hydro, pumped-hydro-storage, gas-power-plants]
  demand: [electricity-load]
functionality:
  - id: hydro-inflow-normalization
    role: "core lever — country inflows normalized to EIA annual generation; dry years via eia_norm_year and capacity correction"
  - id: weather-year-selection
    role: "85 years of ERA5 cutout — pick historically dry years for physically consistent runoff + VRE"
  - id: multi-weather-year
    role: "cutout concatenation over multi-year snapshots exists, but no probabilistic adequacy metrics on top"
  - id: operations-only-solve
    role: "re-dispatch a fixed capacity build under a dry year — the natural drought stress-test rule (eur-only)"
  - id: monte-carlo-sampling
    role: "absent — earth has an LHS module for inflow fan-outs; here draws must be enumerated as scenarios"
  - id: load-shedding-voll
    role: "unserved energy under drought quantifies the resilience gap"
  - id: scenario-matrix
    role: "sweep normalization years x weather years as parallel runs"
gap_assessment: >
  Deterministic drought scenarios run cleanly; hydrology is coarser than
  earth's and stochastic treatment is absent. Inflows are COUNTRY-level:
  atlite runoff over national shapes, normalized to EIA annual hydro
  generation (renewable.hydro.eia_norm_year picks a specific statistical
  year — set a dry one — with optional capacity correction), then split
  across the powerplantmatching fleet; contrast earth's per-plant HydroBASINS
  catchments. A dry-year study is one config change, and the 1940-2024 ERA5
  cutout supplies real dry weather years with consistent VRE; the dedicated
  operations-only rule re-solves a fixed build under stress — a clean
  drought-test pattern earth lacks. Limits: one national inflow profile per
  country (no plant, cascade or river-chain detail; reservoir max_hours from
  aggregate energy-capacity statistics), no reservoir operating rules beyond
  cyclic state of charge, the existing fleet is non-extendable (firming comes
  from other carriers), the standard workflow runs a single weather year, and
  there is no probabilistic inflow ensemble — and unlike earth, no
  monte-carlo module, so distributional views must be hand-enumerated through
  the scenario matrix. Europe's hydro statistics are solid, so the data
  caveats that plague earth (EIA gaps, missing max_hours) largely vanish.
coverage: partial
models:
