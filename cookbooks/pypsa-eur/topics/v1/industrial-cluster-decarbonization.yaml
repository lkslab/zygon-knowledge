id: industrial-cluster-decarbonization
title: Industrial cluster decarbonization
rank: 33
question: >
  How does an industrial cluster (port, chemical park, steel hub) decarbonize
  as a coupled energy hub — which route per process (electrification, H2,
  CCS, biomass), what shared H2/CO2/heat infrastructure, and what does the
  cluster do to the surrounding grid?
when_to_use:
  - "decarbonization pathway for an industrial cluster / port"
  - "electrification vs hydrogen vs CCS per process"
  - "shared H2 or CO2 infrastructure for co-located industry"
  - "grid impact of an industrial hub's fuel switch"
  - "industrial cluster as an energy hub study"
