gap_assessment: >
  Stronger here than in pypsa-earth. The demand side is site-keyed:
  Hotmaps/GEM-derived industrial site databases distribute steel, cement,
  chemicals, ammonia and refinery demand to actual plant locations, so a
  real cluster's load lands on the right bus. The infrastructure side is
  genuinely modelled, not stylized: a CO2 pipeline network with regional
  sequestration potentials and cost curve, an H2 network with gas-pipe
  retrofitting coupled to the real SciGRID_gas methane grid, and — with
  industry_t.endogen — endogenous per-temperature-band process-heat
  technology choice, so the electrification-vs-H2-vs-biomass route is an
  optimizer decision rather than pure config. What keeps it partial: steel
  and chemicals routes remain exogenous shares (St_primary_fraction,
  DRI_fraction, MeOH/HVC routes are per-horizon config, not per-plant
  decisions); a cluster is still one bus, so intra-site steam integration,
  waste-heat exchange between neighbours, and process scheduling are out of
  scope; and there is one social discount rate — no per-owner investment
  logic or stranded-asset accounting. Good for "what supply system and
  shared H2/CO2 infrastructure should this cluster get"; pair with a
  site-level process model for inside-the-fence questions.
coverage: partial
