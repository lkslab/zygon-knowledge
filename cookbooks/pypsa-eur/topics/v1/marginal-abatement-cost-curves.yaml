id: marginal-abatement-cost-curves
title: "Marginal abatement cost curves"
rank: 67
question: >
  What does the next tonne of CO2 cost to abate, which measures deliver
  cheap abatement first, and how does the system-wide MACC bend as targets
  tighten? The lingua franca of climate-policy economics — ministries and
  carbon-price setters ask for the curve.
when_to_use:
  - "marginal abatement cost curve for the power/energy system"
  - "what carbon price delivers this emissions target"
  - "cheapest next tonne of abatement"
  - "abatement cost by measure / technology"
  - "system cost vs emissions-reduction frontier"
recipes:
  generation_conversion: [beccs, direct-air-capture, industrial-ccs,
                          green-hydrogen, building-retrofit]
  demand: [industrial-process-emissions, demand-scenarios-and-growth]
functionality:
  - id: co2-cap
    role: "core — sweep Co2L and the constraint dual IS the marginal abatement cost"
  - id: co2-budget-pathway
    role: "cb tokens / co2_budget give the intertemporal version — abatement cost along a cumulative budget"
  - id: emission-pricing
    role: "the inverse sweep: set Ep, read resulting emissions — price-to-quantity map"
  - id: dynamic-emission-pricing
    role: "Ept benchmarks the curve against the actual ETS price path — an axis earth lacks"
  - id: scenario-matrix
    role: "the sweep machinery — a list of Co2L/cb values in scenario files fans out the whole curve"
  - id: summary-outputs
    role: "the CO2 shadow price is delivered as metrics 'co2_shadow' per run — no dual extraction needed"
  - id: carbon-intensity-metrics
    role: "gCO2/kWh per point still needs a few lines of post-processing"
  - id: numeric-stability-options
    role: "noisy_costs tempers the saw-toothed dual near degenerate optima"
  - id: sector-master-switches
    role: "extends the curve past power into heat/industry/transport abatement"
gap_assessment: >
  Derivable, not delivered — same verdict as pypsa-earth, from a stronger
  base. The sweep itself is textbook: fan out Co2L (or cb budgets) via
  scenario files, and each run's make_summary already reports the CO2
  shadow price (metrics 'co2_shadow'), which IS the marginal abatement
  cost at that budget; differencing total system costs between adjacent
  caps gives the smoother secant version, and the Ep sweep gives the same
  curve from the price axis, with Ept anchoring it to the observed ETS
  path. Because the optimization re-dispatches and re-invests at every
  point — across power, heat, industry and transport with the sector
  layers on, and across time with perfect foresight's carbon-budget
  constraint — this is a proper general-equilibrium MACC, better than
  bottom-up measure-stacking curves that ignore interactions. What does
  not exist is MACC tooling: no rule assembles the sweep into a curve, no
  decomposition attributes abatement between cap levels to technologies
  or measures (genuinely fiddly, since everything shifts at once), and no
  per-sector marginal costs unless sector-specific budgets are hand-added
  via the custom-constraint hook. Expect noisy duals near degeneracy —
  noisy_costs is on by default and cost-differencing is sturdier than raw
  duals.
coverage: partial
