id: methane-gas-phase-down
title: Methane / gas phase-down
rank: 97
question: >
  How fast can gas use decline, what replaces it across power, heat, and
  industry, and how do methane leaks change the climate case for gas?
  Post-2022 security-of-supply legacy plus the Global Methane Pledge and
  the EU methane regulation.
when_to_use:
  - "gas phase-down pathway"
  - "cap or price natural gas consumption"
  - "what replaces gas in power / heat / industry"
  - "methane leakage in the emissions accounting"
  - "green gas substitution for fossil gas"
recipes:
  generation_conversion: [methane-abatement, gas-power-plants,
                          natural-gas-pipelines, fossil-fuel-supply,
                          e-sng, biogas-anaerobic-digestion]
  demand: []
functionality:
  - id: gas-usage-limit
    role: "CH4L caps gas-fired dispatch as a declining budget — electricity workflow only (Generators; its carrier list's 'CHP' member never exists), no bite in sector runs where gas plants are Links"
  - id: co2-budget-pathway
    role: "the sector-run brake — per-horizon CO2 budgets squeeze gas out across power, heat, and industry simultaneously"
  - id: co2-cap
    role: "Co2L squeezes gas on combustion emissions in the electricity chain"
  - id: emission-pricing
    role: "Ep prices gas by CO2 intensity — the carbon-price route to phase-down"
  - id: dynamic-emission-pricing
    role: "Ept runs the phase-down against actual ETS spot prices — a lever earth lacks"
  - id: gas-network-links
    role: "the REAL SciGRID gas network with entry points (LNG/pipeline/production) — gas infrastructure exists as capacitated assets, unlike earth's dead key"
  - id: fleet-retirement-filter
    role: "retire gas plant vintages by date query"
  - id: cost-data-pipeline
    role: "the CO2e-uplift route for leakage: a custom_costs.csv 'gas'/'CO2 intensity' row propagates a GWP-weighted penalty to every gas-consuming link"
  - id: h2-network-retrofit
    role: "the after-life of the gas grid: retrofit gas pipes to H2, capacity-coupled by the pipe-retrofit constraint"
gap_assessment: >
  The phase-down half is stronger than in pypsa-earth: sector runs track
  gas through a REAL clustered pipeline network with LNG/pipeline/production
  entry capacities, so supply routes and infrastructure are explicit and
  the gas grid can even be retrofitted to hydrogen (capacity-coupled);
  substitution (heat pumps, electrification, H2, e-SNG, biogas into the
  same grid) is endogenous under co2_budget pathways, static or ETS-dynamic
  CO2 prices, or the CH4L fuel budget (electricity chain only — in sector
  runs the brake is the CO2 budget and entry capacities). The methane half
  remains the hole: emissions accounting is CO2-only and combustion-only —
  no CH4 species, no leak rates by supply route (the lng/pipeline/production
  split exists in the data but is summed per node), no venting/flaring, no
  abatement cost curves. The methane-abatement recipe documents the
  workaround: uplift the gas 'CO2 intensity' to a CO2-equivalent value via
  custom_costs.csv — with the caveat that the same number scales CC capture
  splits and the biogas-upgrading credit; and eur ships a live template for
  doing it properly — the oil chain's upstream refining-emissions link
  (industry.oil_refining_emissions) is the exact pattern a route-specific
  gas-leakage implementation clones.
