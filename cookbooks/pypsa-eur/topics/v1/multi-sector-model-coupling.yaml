gap_assessment: >
  Read the topic two ways. Internal multi-sector coupling is the model's
  crown jewel and the most complete in the open-model landscape:
  electricity, heating (four building archetypes plus district heat), land
  transport, industry (with optional endogenous process heat), shipping,
  aviation, agriculture, and the full fuel layer — H2 with a routed pipeline
  network, a REAL capacitated methane grid, ammonia, methanol, Fischer-
  Tropsch, and a CO2 transport-and-sequestration network — all hard-linked
  in one hourly co-optimized network. Every weak sector the earth card
  flags (dead gas key, no methanol loop) is working machinery here.
  External model coupling remains the gap, identically to earth: no built
  interfaces to TIMES/PRIMES/OSeMOSYS-style models, no macro-economic
  feedback, no convergence harness for iterating with a demand or land-use
  model. Soft-linking is file-based but well-provisioned: exogenous
  demands, custom costs per horizon, CCL capacity constraints, and priced
  green-energy import routes give clean injection points for upstream
  models, and solved networks export as netCDF/csv downstream — but every
  exchange schema and iteration loop is yours to build; nothing speaks
  another model's format natively.
