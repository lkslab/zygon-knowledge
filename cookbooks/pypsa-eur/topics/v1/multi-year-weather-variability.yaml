id: multi-year-weather-variability
title: Multi-year weather variability
rank: 25
question: >
  Is the plan robust across weather years, not just the one it was optimized
  for? Inter-annual wind/solar/hydro/demand variability drives adequacy risk
  (Dunkelflaute years, drought years) — the field's standard critique of
  single-weather-year capacity expansion.
when_to_use:
  - "results across multiple weather years"
  - "is 2013 a representative weather year"
  - "inter-annual variability of wind / solar / hydro"
  - "stress-test the plan against a bad weather year"
  - "drought year / low-wind year sensitivity"
recipes:
  generation_conversion: [onshore-wind, utility-scale-solar-pv, conventional-hydropower, offshore-wind]
  demand: [demand-temporal-profiles, electricity-load]
functionality:
  - id: weather-year-selection
    role: "the strong lever: the shipped europe-1940-2024-era5 cutout makes any of 85 weather years a snapshot-window change"
  - id: multi-weather-year
    role: "partial — load_cutout concatenates cutouts along time and Nyears scaling exists, but the standard workflow runs one year and nothing weights year probabilities"
  - id: operations-only-solve
    role: "the dedicated dispatch-only rule earth lacks: fix capacities from the design year, re-dispatch against other years"
  - id: rolling-horizon-dispatch
    role: "sequential-window dispatch for long re-simulation horizons at fixed capacities"
  - id: scenario-matrix
    role: "one expansion run per weather year via scenario files, compare designs ex post"
  - id: hydro-inflow-normalization
    role: "hydro-year scenarios via the EIA normalization year"
  - id: load-shedding-voll
    role: "per-year unserved energy is the stress-test metric in re-dispatch runs"
  - id: probabilistic-adequacy
    role: "no LOLE/EUE across year distributions — absent"
gap_assessment: >
  Partial, but meaningfully further along than pypsa-earth. The mechanics are
  friendlier: one shipped ERA5 cutout spans 1940-2024, so sweeping weather
  years is a snapshot-window change rather than a per-year cutout build, and
  multi-year snapshots are half-wired (load_cutout concatenates cutouts on
  the time axis, cost annualization scales by Nyears) — a multi-year single
  solve is reachable with care, though it is not the tested standard path and
  temperature-driven demand/COP inputs must be checked to follow the window.
  Crucially, the stress-test half that needed hand assembly in earth is a
  dedicated rule here: solve_operations_network fixes optimal capacities and
  re-dispatches, optionally rolling-horizon, with per-carrier VOLL shedding —
  so the design-year-vs-test-year loop is genuinely supported. What is still
  missing is the statistics: no probability weighting across years inside one
  optimization, no LOLE/EUE or forced-outage machinery, and no monte-carlo
  module (earth has one), so "adequate in 39 of 40 years" remains an ex-post
  tally the user scripts around scenario sweeps. SARAH-based solar only
  exists for cutout years with influx data — pure-ERA5 years use a different
  solar basis; keep the comparison internally consistent.
coverage: partial
models:
