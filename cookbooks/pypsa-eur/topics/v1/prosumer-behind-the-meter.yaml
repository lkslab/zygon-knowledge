id: prosumer-behind-the-meter
title: "Prosumer / behind-the-meter"
rank: 75
question: >
  How do households and businesses with their own solar, storage, and EVs
  behave — self-consumption, net metering, tariff response — and what does
  prosumage do to the rest of the system? The customer-side twin of the DER
  topic: same assets, but the question is behaviour and bills.
when_to_use:
  - "prosumer self-consumption modelling"
  - "behind-the-meter solar + battery economics"
  - "net metering / feed-in tariff scenarios"
  - "grid defection / self-sufficiency of households"
  - "what prosumers do to utility load shapes"
recipes:
  generation_conversion: [behind-the-meter-der, rooftop-distributed-solar,
                          smart-meters, vehicle-to-grid]
  demand: [residential-electricity-demand, services-electricity-demand,
           building-heat-dsm]
functionality:
  - id: distribution-grid-lv
    role: "core proxy — BTM PV/battery/EV sit on an LV bus behind a costed, lossy grid link (default on)"
  - id: sector-master-switches
    role: "prosumer assets exist only in the sector chain, none in power-only runs"
  - id: bev-dsm-v2g
    role: "endogenously flexible BTM asset: EV charging shifts and V2G feeds the LV bus"
  - id: residential-heat-dsm
    role: "prosumer-side heat flexibility (overheat/undercool within comfort bands) — earth has no equivalent"
  - id: demand-elasticity
    role: "absent — no tariff-responsive demand, so no behavioural prosumer"
  - id: market-design-mechanisms
    role: "absent — no retail tariff, net metering, or bill; single social planner"
  - id: nodal-marginal-prices
    role: "everything trades at system marginal value — the anti-prosumer assumption"
  - id: carrier-attribute-scaling
    role: "cap home-battery/rooftop adoption via adjustments.sector as exogenous uptake scenarios"
gap_assessment: >
  Partial, with a hard behavioural ceiling — but the physics layer is richer
  than pypsa-earth's. Rooftop PV, an (unbounded-by-default) home-battery
  store and EVs sit on a default-on low-voltage bus behind a costed
  distribution link with static losses, so implicit self-consumption emerges
  whenever local generation beats importing across that link, and the
  system-side effect of prosumage (duck-curve load shapes, displaced utility
  solar, distribution reinforcement) falls out of the sector LP; residential
  heat DSM adds a building-side flexibility channel earth lacks entirely.
  What is structurally missing is the prosumer as an actor: no retail
  tariffs, no net-metering or feed-in rules, no price-elastic demand — all
  flows are valued at system marginal cost by one planner, so bill savings,
  tariff-driven adoption, and grid defection under bad tariff design cannot
  be posed (the behind-the-meter-der recipe marks tariff behaviour L5, via
  the custom_extra_functionality hook at best). Use it for "what optimal
  prosumage does to the system"; use a household-level bill-optimization
  model for "what prosumers will actually do".
coverage: partial
models:
