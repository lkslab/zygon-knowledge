id: refinery-chemicals-feedstock
title: "Refinery / chemicals feedstock"
rank: 79
question: >
  How do refineries and chemical plants decarbonize their feedstocks —
  naphtha for plastics, hydrogen for ammonia and methanol, green vs fossil
  routes — and what does that do to power and H2 demand? The
  non-energy-use corner of industrial decarbonization.
