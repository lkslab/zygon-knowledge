gap_assessment: >
  Partial, but far richer than pypsa-earth's version of the same verdict.
  The chemicals side is wired end-to-end: basic chemicals split into
  ammonia/HVC/chlorine/methanol from JRC-IDEES + USGS tonnages, per-node
  naphtha loads with steam-cracker feedstock emissions booked separately, a
  non-sequestered HVC waste chain (plastics carbon returns via HVC-to-air or
  waste CHP +/- CC, with landfill and recycling fractions), endogenous
  Haber-Bosch ammonia, and an oil-refining process-emission link ("oil
  primary" -> "oil refining", industry.oil_refining_emissions) — so "what
  does greening ammonia/methanol/plastics do to power and H2 systems" runs
  today with honest carbon accounting, and green synfuels (FT naphtha,
  biogas, e-methanol, imports) compete on the same buses. Two bounds keep
  this at partial: route choice on the demand side is exogenous — HVC
  primary/recycling shares and production tonnages are per-horizon config
  posits, not decisions; and there is still no refinery process model — the
  refining link is a fixed emission factor with no explicit refinery
  hydrogen demand, so the hydrocracker H2-to-electrolysis switch and
  refinery-closure questions named in this topic have no representation
  (fossil-fuel-supply documents the single-EU-bus oil structure). Chlorine
  and methanol tonnages are EU-scalar allocations, not per-country data.
coverage: partial
