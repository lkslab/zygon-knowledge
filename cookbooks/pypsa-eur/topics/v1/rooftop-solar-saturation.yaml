id: rooftop-solar-saturation
title: Rooftop solar saturation
rank: 36
question: >
  How much rooftop PV can a system absorb before its value collapses or the
  distribution grid pushes back — where is the economic saturation point,
  and what (storage, export limits, network reinforcement) extends it?
when_to_use:
  - "how much rooftop solar is too much"
  - "value deflation of distributed PV at high penetration"
  - "distribution reinforcement cost of rooftop PV growth"
  - "rooftop vs utility-scale solar split"
  - "export limits or batteries to extend PV hosting"
recipes:
  generation_conversion: [rooftop-distributed-solar, behind-the-meter-der,
                          electricity-distribution-grid, utility-scale-solar-pv,
                          grid-scale-batteries, smart-meters]
  demand: [residential-electricity-demand, services-electricity-demand,
           demand-temporal-profiles]
functionality:
  - id: distribution-grid-lv
    role: "core surface — rooftop PV on LV buses behind a costed distribution link (default-on in sector runs)"
  - id: distribution-power-flow
    role: "absent — no feeder voltage/thermal limits, so physical hosting capacity is a cost proxy"
  - id: distribution-grid-cost-factor
    role: "dead-key — the advertised reinforcement-cost knob (config + dist token) is read by no script; scale via adjustments instead"
  - id: carrier-attribute-scaling
    role: "the working lever: sweep 'electricity distribution grid' capital_cost and rooftop PV cost/potential to trace the saturation frontier"
  - id: demand-elasticity
    role: "absent — adoption is optimizer-chosen, not tariff-driven prosumer behaviour"
  - id: nodal-marginal-prices
    role: "value deflation shows up as falling market value for solar as shares rise (market_values summary table)"
  - id: sector-master-switches
    role: "prerequisite for the LV layer, home batteries, and EV coincidence"
  - id: renewable-potentials-land-eligibility
    role: "rooftop potential bounds from land-use rasters cap the buildable share"
gap_assessment: >
  Economic saturation is answerable: in sector runs rooftop PV competes
  behind LV buses against utility-scale solar, its captured value falls
  endogenously with penetration (visible directly in the market_values
  summary), home batteries and EV charging extend it, and a linear
  distribution-grid reinforcement cost stands in for network pushback —
  sweeping that cost and PV assumptions traces a credible saturation
  frontier. One eur-specific trap: the dedicated
  electricity_distribution_grid_cost_factor knob (and its dist wildcard
  token) is a dead key at this ref — no script reads it — so reinforcement
  sensitivity must go through adjustments.sector on the distribution-grid
  capital cost, which is the config's own default example. Two things
  remain proxies, not physics: there is no feeder-level power flow, so
  voltage-rise and thermal hosting limits (the binding constraint for real
  DNSPs) reduce to one linear cost; and adoption is the planner's choice,
  not household economics — no tariffs, self-consumption incentives, or
  payback logic, so the model finds the socially optimal rooftop share,
  which can differ wildly from uncoordinated adoption. Electricity-only
  runs lack the LV layer entirely (rooftop PV then sits on the HV bus).
  Use for system-value and reinforcement-budget questions; not for hosting
  capacity per feeder or adoption forecasting.
coverage: partial
