gap_assessment: >
  The headline comparison runs out of the box: sector runs with land
  transport electrified give an uncontrolled-charging baseline (fixed
  profile), and switching on BEV DSM lets the planner shift charging
  within availability windows derived from European mobility data — with
  V2G as a further step — so the system value of smart charging (cost,
  peak, curtailment uptake) is a clean on/off experiment, and the EV share
  itself is swept via the exogenous transport-share pathway. Limits, same
  in kind as pypsa-earth's: fleets are aggregated per node with a single
  availability profile, so charger siting, home-vs-public split, and
  charging-behaviour heterogeneity are not represented; shifting is
  perfect-foresight planner control, not a tariff or aggregator mechanism
  (demand elasticity and market products absent); and distribution-level
  binding is only a linear LV cost proxy, so "where networks bind" needs
  an external distribution tool. Partial: system value yes, local grid
  impact and program design no.
coverage: partial
