id: solver-speed-scalability
title: "Solver speed / scalability"
rank: 88
question: >
  How do you make a sector-coupled, hourly, spatially-resolved optimization
  actually solve — and what resolution can you afford before the solver or
  RAM gives out? The number-one methodological pain the modelling community
  reports: everyone wants faster.
when_to_use:
  - "run is too slow / solver runs out of memory"
  - "trade off resolution against solve time"
  - "which solver and options for a big model"
  - "make a continental sector run tractable"
  - "speed up a scenario sweep"
recipes:
  generation_conversion: []
  demand: []
functionality:
  - id: temporal-resolution-nh
    role: "core lever — nH averaging (plus sector-chain 'sn' thinning) cuts snapshots linearly; the first knob to turn"
  - id: time-segmentation-tsam
    role: "smarter than averaging: adaptive segments keep extremes at the same size"
  - id: spatial-clustering
    role: "the other axis — cluster count from thousands of substations down to a handful, distributed across countries"
  - id: network-simplification
    role: "380 kV mapping and stub removal shrink the base problem before clustering even starts"
  - id: solver-choice
    role: "tuned presets per solver (gurobi numeric-focus/fallback, HiGHS ipm, copt-gpu PDLP); barrier without crossover dominates at scale"
  - id: iterative-impedance-expansion
    role: "skip_iterations is the DEFAULT — the 2-5x resolve cost is opt-in, not opt-out"
  - id: rolling-horizon-dispatch
    role: "temporal decomposition earth lacks: sequential windows break a year of dispatch into tractable pieces"
  - id: operations-only-solve
    role: "cheap dispatch-only reruns of a solved design via a dedicated rule — no expansion variables"
  - id: post-discretization
    role: "unit-size rounding of expansion, but only bites in iterative mode (skip_iterations false)"
  - id: remote-solving-oetc
    role: "hand the linopy model to OETC cloud hardware when local RAM is the wall (needs credentials)"
  - id: numeric-stability-options
    role: "noisy costs + clipping keep barrier iterations from stalling"
gap_assessment: >
  A richer tractability toolbox than earth's, and the earth card's two
  headline absences are present here. The orthogonal levers all exist —
  temporal (nH averaging, tsam segmentation, snapshot thinning), spatial
  (simplification + clustering with per-country distribution), solve-path
  (impedance iteration off by default), and per-solver tuned option presets
  including HiGHS for open-source runs and an experimental GPU first-order
  profile (copt-gpu). On top, pypsa-eur has genuine decomposition earth
  lacks: rolling-horizon splits dispatch into sequential windows, and
  solve_operations_network re-simulates a fixed design without expansion
  variables — together the production-cost-style cheap path. Scenario
  sweeps parallelize trivially through Snakemake, with shared-resources
  caching avoiding recomputation. The honest limits: capacity expansion
  itself is still one monolithic LP — no Benders, no temporal decomposition
  of the investment problem — so continental sector-coupled hourly runs
  still climb into hundreds of GB of RAM and days of barrier time, and
  memory usually dies before CPU; transmission losses (on by default) and
  linearized UC each multiply problem size, so switching them off is part
  of the speed toolkit. Above a certain size the answer to "faster" remains
  "coarser" — but the resolution ladder down is complete and well-paved.
coverage: ready
