id: stranded-asset-risk
title: "Stranded-asset risk"
rank: 68
question: >
  Which fossil assets — plants, pipelines, new gas builds — end up
  underutilized or retired before recovering their capital as targets
  tighten, and what does building them anyway cost? The finance-side lens
  on transition pathways: investors, JETP negotiators, and regulators ask.
when_to_use:
  - "stranding risk of a new gas plant"
  - "which coal assets retire before end of life"
  - "utilization decline of fossil fleet along a pathway"
  - "cost of overbuilding fossil capacity now"
  - "lock-in from investments made this decade"
recipes:
  generation_conversion: [coal-power-plants, gas-power-plants,
                          oil-power-plants, natural-gas-pipelines,
                          fossil-fuel-boilers]
  demand: [electricity-load, demand-scenarios-and-growth]
functionality:
  - id: myopic-foresight
    role: "core — sequential horizons show assets built early going idle later; battle-tested in eur, unlike earth"
  - id: perfect-foresight
    role: "the anticipation counterfactual — myopic-vs-perfect pathway cost deltas price the lock-in from short-sighted investment"
  - id: existing-baseyear-brownfield
    role: "seeds today's power AND heating fleets with build years so ageing and stranding are visible"
  - id: fleet-retirement-filter
    role: "DateIn/DateOut queries and custom_powerplants force early-retirement or forced-build counterfactuals"
  - id: co2-budget-pathway
    role: "the tightening budget that does the stranding, per horizon or cumulative"
  - id: pipe-retrofit-constraint
    role: "gas pipelines get an exit ramp — H2 retrofitting is an alternative to stranding, endogenously"
  - id: global-summary
    role: "make_cumulative_costs discounts pathway costs — the aggregate price of overbuilding"
  - id: discount-rate-dimension
    role: "stranding is a discounting question; one system WACC from the costs table stands in for every owner's"
  - id: scenario-matrix
    role: "stranding is scenario-contingent — sweep budgets and demand paths"
gap_assessment: >
  The physical half is genuinely strong — stronger than pypsa-earth,
  whose myopic chain is less battle-tested. Myopic pathways carry
  build-year-resolved power and heating fleets forward, age them between
  horizons, and let a tightening carbon budget strand them visibly:
  capacity factors collapse, plants retire at or before lifetime, and
  comparing pathways with and without a forced-in asset (p_nom_min or
  custom_powerplants) prices the lock-in, with make_cumulative_costs
  discounting the pathway delta. pypsa-eur adds two levers earth lacks:
  the myopic-vs-perfect-foresight comparison isolates the cost of
  investing without anticipation — the essence of stranding — and gas
  pipes can escape via endogenous H2 retrofitting instead of writing
  off. The financial half remains post-processing: no owner balance
  sheets, book values, remaining debt, or incidence of the write-down —
  stranded-VALUE numbers mean combining model capacity factors and
  retirements with off-model asset financials, and the single planner
  discount rate stands in for heterogeneous WACCs. Utilization,
  retirement timing, and pathway cost: ready. Who eats the loss and how
  big the write-down is: outside the model.
coverage: partial
models:
  - model: pypsa-eur
