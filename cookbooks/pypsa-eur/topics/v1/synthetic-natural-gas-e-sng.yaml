id: synthetic-natural-gas-e-sng
title: Synthetic natural gas (e-SNG)
rank: 98
question: >
  Can synthetic methane from hydrogen plus captured CO2 keep existing gas
  users decarbonized — and when does e-SNG beat direct electrification or
  H2 conversion? Niche but concrete: gas utilities and countries with large
  sunk gas infrastructure.
when_to_use:
  - "e-SNG / e-methane in the mix"
  - "methanation of green hydrogen"
  - "power-to-gas (methane) economics"
  - "green gas for existing gas demand"
  - "Sabatier vs direct H2 use"
recipes:
  generation_conversion: [e-sng, electrolysers, green-hydrogen,
                          direct-air-capture, biogas-anaerobic-digestion,
                          natural-gas-pipelines, co2-transport-and-sequestration]
  demand: []
functionality:
  - id: gas-network-links
    role: "SNG injects into the REAL clustered gas grid (nodal buses), so siting interacts with pipeline flows and entry-point-limited fossil supply — earth's equivalent is nodal-unlimited"
  - id: co2-network-sequestration
    role: "the carbon feedstock: captured CO2 (point-source and DAC) on co2-stored buses, optionally piped — Sabatier withdraws it so downstream combustion nets out"
  - id: h2-network-retrofit
    role: "delivers H2 feedstock to methanation sites over the H2 network (greenfield or retrofitted pipes)"
  - id: co2-budget-pathway
    role: "the driver — a tightening budget is what makes e-SNG displace fossil gas economically"
  - id: green-energy-imports
    role: "the competing route: priced green gas (and H2/NH3/methanol) imports at entry points, volume-capped — domestic Sabatier vs imported e-SNG in one solve"
  - id: pipe-retrofit-constraint
    role: "the counterfactual to SNG: converting the gas grid to H2 instead, capacity-coupled"
  - id: custom-constraint-hook
    role: "a green-gas quota (minimum SNG share of gas demand) is bespoke — molecules are fungible on the gas buses"
gap_assessment: >
  Runs out of the box: Sabatier methanation is ON by default
  (sector.methanation: true) — an extendable link at every node taking
  nodal H2 plus stored CO2 into the gas bus, with technology-data costs, a
  30% min-part-load floor (configurable to zero), waste heat to district
  heating, and brownfield carry-forward in myopic pathways. Because the
  product is ordinary gas on the REAL gas network, e-SNG serves every gas
  demand (CHPs, boilers, OCGT/CCGT, industry, SMR) and competes against
  entry-point-limited fossil supply, biogas upgrading, BioSNG
  (sector.biosng, off by default), and priced green imports — a richer
  competitive frame than earth's nodal-unlimited gas. Differences from the
  earth card to note: eur has NO HELMETH direct-electricity route (Sabatier
  is the only power-to-methane path), while the CO2 feedstock side is
  stronger (DAC, regional sequestration, optional CO2 pipelines). The
  e-sng recipe documents the real limits: no green-gas quota constraint,
  no biogenic-only restriction on the pooled CO2 feedstock, no injection
  or gas-quality limits beyond pipeline capacities, and no SNG export
  machinery — all custom-constraint or code territory.
coverage: ready
