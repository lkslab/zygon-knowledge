gap_assessment: >
  Materially stronger than pypsa-earth here, enough to change the verdict.
  The supply side is shared family strength: sector-coupled co-optimization
  of batteries, pumped hydro, H2, and electrolysers with hourly chronology,
  flexibility need by duration read from storage cycling and price
  spreads. The decisive difference is the demand side, which was earth's
  hole: pypsa-eur has EV battery-shifting and V2G, residential heating DSM
  (comfort-band load shifting on building thermal inertia), thermal
  storage that is properly sized via energy-to-power constraints, and
  endogenous industrial process-heat technology choice — so clean demand
  flexibility genuinely competes against peakers rather than being
  structurally absent. Remaining honest limits: no price-elastic or
  tariff-responsive demand (flexibility is engineered levers, not
  behaviour), no industrial load-shedding tranches beyond the industry_t
  must_run slack, hourly floor hides the balancing timescale, and value is
  a single energy price plus a reserve constraint — no capacity or
  ancillary revenue stacking, so aggregator/VPP business cases still need
  external modelling. For infrastructure-scale "how much, what duration,
  from what source" the study is ready.
