id: tidal-wave-emerging
title: Tidal / wave (emerging)
rank: 100
question: >
  Can marine renewables — tidal stream/range and wave energy — contribute
  as predictable variable generation? Emerging and small globally, but
  live in a few coastal systems (UK, France, Iberia, island grids).
when_to_use:
  - "tidal energy in the system mix"
  - "wave power contribution"
  - "marine renewables scenario"
  - "predictable-cycle variable generation"
  - "add a new renewable carrier with a custom profile"
recipes:
  generation_conversion: [tidal-wave, offshore-wind]
  demand: []
functionality:
  - id: renewable-potentials-land-eligibility
    role: "the chain the technology is absent from — the profile builder dispatches only to atlite conversion methods (wind/pv/...), none covering tidal or wave; marine eligibility layers (GEBCO, ship density, natura) DO exist"
  - id: cost-data-pipeline
    role: "custom_costs.csv CONCATENATES unknown technology rows — a tidal/wave cost row needs no code"
  - id: fleet-retirement-filter
    role: "custom_powerplants is the crude stand-in: known tidal plants as fixed capacity (static availability only from config)"
  - id: country-carrier-capacity-limits
    role: "CCL caps as marine-resource limits once a carrier exists"
  - id: weather-year-selection
    role: "the ERA5 cutouts carry no tidal or wave variables — the profile cannot come from the shipped weather data"
  - id: scenario-matrix
    role: "with/without-marine scenarios once a carrier is wired in"
gap_assessment: >
  Nothing exists: no tidal or wave carrier, cost row, or resource method —
  the only marine hits in the code are protected areas, seawater
  temperature for district heating, and submarine cable cost rows. The
  mitigating structure, documented in the tidal-wave recipe, is that the
  renewable chain is technology-parametrised end to end and eur even ships
  the exact precedent for a non-atlite profile: hydro is excluded from the
  generic profile rule and built by its own dedicated rule — a tidal
  implementation mirrors that shape (add renewable.tidal config +
  carrier-list entries, a custom_costs.csv row — which unlike earth needs
  no code — then a dedicated producer rule emitting the profile and
  class-regions files in the shipped format from external hydrodynamic or
  wave-climate data; L4, L5 for native resource assessment). Two reusable
  assets: marine siting/eligibility layers (bathymetry, ship density,
  protected areas, offshore region shapes) exist by default, and the
  offshore-wind connection-cost machinery (submarine/underground distance
  costing) can be borrowed for device grid connection. The crude stand-in
  is site-specific plants via custom_powerplants with a p_max_pu series
  set in post-processing. Resource data and device costs must come from
  the user.
coverage: gap
models:
