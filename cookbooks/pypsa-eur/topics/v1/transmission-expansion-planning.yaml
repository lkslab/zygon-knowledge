id: transmission-expansion-planning
title: Transmission expansion planning
rank: 1
question: >
  Where and when should transmission be built, what does congestion or
  non-building cost, and which corridors are robust across scenarios? The
  highest-urgency topic globally: FERC 1920 (US), UHV (China), power pools
  (Africa/ASEAN), REZs (Australia).
when_to_use:
  - "where should we build transmission"
  - "grid expansion plan / TYNDP-style study"
  - "cost of not building the grid"
  - "corridor selection under uncertainty"
  - "co-optimize generation and transmission"
recipes:
  generation_conversion: [hv-transmission-lines, hvdc-interconnectors, uhv-dc,
                          transmission-expansion-projects, dynamic-line-rating-facts]
  demand: [electricity-load, demand-spatial-disaggregation]
functionality:
  - id: transmission-expansion-limits
    role: "core — line/link expansion co-optimized under volume/cost bounds (transmission_limit config or lv/lc token; the old ll wildcard is gone)"
  - id: transmission-projects
    role: "REAL candidate corridors — TYNDP2020 and German NEP projects filtered by permitting status"
  - id: iterative-impedance-expansion
    role: "keeps impedances consistent as capacities grow (skipped by default)"
  - id: transmission-losses
    role: "piecewise-linear line losses on by default — value-of-grid numbers include loss savings"
  - id: dynamic-line-rating
    role: "weather-dependent thermal ratings sharpen congestion analysis (off by default)"
  - id: spatial-clustering
    role: "choose zonal resolution; corridor detail dies below ~substation resolution"
  - id: line-security-margin
    role: "s_max_pu proxies N-1 — no true contingency planning"
  - id: contingency-scopf
    role: "true security-constrained planning is not wired in"
  - id: scenario-matrix
    role: "TYNDP-style multi-scenario sweeps via scenario yaml files"
  - id: mga-near-optimal
    role: "robust corridor choice wants near-optimal spaces — absent"
gap_assessment: >
  The strongest platform for this topic in the PyPSA family: pypsa-eur
  co-optimizes generation, storage, and line/link expansion on the
  OSM-derived (or TYNDP reference) European grid, with transmission losses
  on by default, iterative impedance updates, and — unlike pypsa-earth — a
  genuine candidate-project pipeline: TYNDP2020 and German NEP lines/links
  can be injected filtered by permitting status, so a "which planned
  projects pay off" study is config, not code. Dynamic line rating adds
  weather-aware ratings. Value-of-transmission counterfactuals (vopt vs
  v1.0, congestion rent from nodal duals) run out of the box; note the
  transmission limit is now a config key or lv/lc opts token — the ll
  wildcard is gone. Two real gaps remain: reliability is a static s_max_pu
  margin (no N-1/SCOPF, which is what TSO planning legally requires), and
  robustness machinery is scenario sweeps only — no MGA/near-optimal
  exploration, and no Monte Carlo (which earth has). Continental scope is
  Europe; other regions need pypsa-earth.
coverage: ready
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
