  co2stop-sequestration:
    grade: D
    detail: "no storage unit for this country in the fork's conservative offshore CO2Stop table (resources/co2_sequestration_potentials.geojson, 2026-10-12): every \"co2 sequestered\" store is capped at 0 in a one-country run, so a net-zero cap needs the export allowance (co2-budget note (j))"
