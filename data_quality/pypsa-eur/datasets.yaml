- id: ffe-industry-load-profiles
  title: "FfE normed industrial electrical load profiles (open data id 59, Germany 2017)"
  path: data/ffe_industry_load_profiles/primary/2017-v1/ffe_industry_load_profiles.json
  code_convention: global
  coverage_class: proxy-global
  consumer: "scripts/build_industrial_energy_demand_per_node.py:load_ffe_profiles; scripts/build_industrial_energy_demand_per_node.py:map_profiles_to_snapshots; scripts/build_industrial_energy_demand_per_node.py:build_electricity_profiles"
  missing_behavior: "no per-country data exists at all: the German 2017 hourly branch profiles shape every country's industrial electricity, weighted by the node's JRC-IDEES sector mix and moved onto the target calendar with the country's own holidays (holidays package; a country without a calendar gets none, with a warning); a node without industrial electricity gets a flat profile"
  tier_when_missing: C
  used_by: [demand-temporal-profiles, industrial-crosscutting-electricity, industry-load-profiles]
  notes: "retrieved by rules/retrieve.smk:retrieve_ffe_industry_load_profiles (dataset ffe_industry_load_profiles in data/versions.csv, data.ffe_industry_load_profiles config, CC-BY-4.0, FfE eXtremOS); eleven NACE branches (iron and steel, non-metallic minerals, transport equipment, machinery, mining, food and tobacco, paper/pulp/print, wood, construction, textile, non-specified), no chemicals or non-ferrous profile, so INDUSTRY_SECTOR_TO_PROFILE maps chemicals to paper/pulp/print, non-ferrous metals to iron and steel and pharmaceuticals to food; industrial_electricity_profile_<horizon>.csv is always written, used only with industry.temporal_electricity_industry_load (method industry-load-profiles, not a carrier card)"
