- id: unit-commitment-parameters
  title: "Unit commitment parameters per conventional carrier"
  path: data/unit_commitment.csv
  code_convention: global
  coverage_class: proxy-global
  consumer: "scripts/add_electricity.py:attach_conventional_generators"
  missing_behavior: "parameters are per-carrier with no country dimension — every country's OCGT/CCGT/coal/lignite/nuclear units get identical German-literature UC parameters, and carriers absent from the csv (oil, biomass, geothermal) get PyPSA component defaults (no min-up/down times, free ramps), silently"
  tier_when_missing: C
  used_by: [coal-power-plants, gas-power-plants, conventional-nuclear, oil-power-plants]
  notes: "columns only OCGT, CCGT, coal, lignite, nuclear — no oil column despite oil being a default conventional carrier; only active when conventional.unit_commitment: true (default false)"

- id: technology-costs
  title: "Technology cost assumptions (PyPSA technology-data v0.14.0)"
  path: data/costs/archive/v0.14.0/costs_2050.csv
  code_convention: global
