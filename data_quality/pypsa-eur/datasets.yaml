  used_by: [district-heating, district-heating-demand-share, residential-space-heating-demand, demand-spatial-disaggregation]
  notes: "global indicator csv, ISO3 codes (Kosovo = XKX); drives pop_layout urban/rural/total which underpins heat demand disaggregation and district-heating shares"

- id: jrc-energy-atlas
  title: "JRC Energy Atlas spatial electricity demand raster (2019)"
  path: data/jrc_energy_atlas/archive/2026-02-16/electricity_tot_demand_2019.tif
  code_convention: gridded
  coverage_class: continent-file
  consumer: "scripts/build_electricity_demand_base.py:energy_atlas_distribution_keys"
  missing_behavior: "energy_atlas_distribution_keys explicitly skips countries not in cc.EU27as('ISO2'), so non-EU27 countries fall through combine_first to the NUTS3 GDP/pop distribution keys (nuts3_distribution_keys) for spatial load disaggregation"
  tier_when_missing: C
  used_by: [electricity-load, demand-spatial-disaggregation]
  notes: "EU27-only demand raster; in the default scope AL BA CH GB ME MK NO RS XK use GDP(0.6)/pop(0.4) NUTS3 keys instead (GB additionally uses the DESNZ LAD data); probe: zonal sum of the GeoTIFF per country"

- id: district-heating-potentials
  title: "District heating areas, ISI geothermal heat potentials, BGR aquifer shapes (ATES)"
  path:
    - data/dh_areas/
    - data/geothermal_heat_utilisation_potentials/
    - data/aquifer_data/
  code_convention: gridded
  coverage_class: continent-file
  consumer: "scripts/build_dh_areas.py:handle_missing_countries; scripts/build_geothermal_heat_potential.py:get_heat_source_power; scripts/build_ates_potentials.py:suitable_aquifers"
  missing_behavior: "dh_areas.handle_missing_countries defaults to 'fill' which substitutes whole-country geometries for countries missing from the DH areas dataset (with 'ignore' they silently get no district heat, 'raise' aborts); geothermal potentials outside EU27 LAU regions raise a ValueError unless ignore_missing_regions is set, in which case those regions get no geothermal heat source; ATES potential exists only where BGR/IHME aquifer polygons overlap DH areas"
  tier_when_missing: C
  used_by: [district-heating, aquifer-thermal-storage, thermal-storage]
  notes: "all three are runtime-retrieved (dataset_version entries dh_areas, geothermal_heat_utilisation_potentials, aquifer_data in data/versions.csv; folders not on disk at this ref); ISI potentials are EU27-only (explicit log about 'onshore regions outside EU 27'); IHME1500 aquifer map covers most of Europe"

- id: retro-building-stock
  title: "Building stock and retrofit cost data (EU Building Observatory + Invert/EE-Lab)"
  path: data/retro/
  code_convention: ISO2
  coverage_class: country-listed
  consumer: "scripts/build_retro_cost.py:prepare_building_stock_data"
  missing_behavior: "countries missing from data_building_stock.csv are first patched from floor_area_missing.csv, and anything still missing gets floor area estimated from population via the map_for_missings country-group averages (area_per_pop * ct_total) with estimated=1 flags"
  tier_when_missing: C
  used_by: [building-retrofit, residential-space-heating-demand]
  notes: "data_building_stock.csv covers EU28 (lowercase ISO2, uk/gr codes); floor_area_missing.csv adds AL BA CH ME MK NO PL RS — XK relies entirely on the population-based estimate; retrofit branch is off unless sector.retrofitting.retro_endogen is enabled"

- id: co2stop-sequestration
  title: "CO2 storage potentials (CO2Stop / CO2JRC)"
  path: data/co2stop/archive/26-august-2020/
  code_convention: gridded
  coverage_class: continent-file
  consumer: "scripts/build_co2_sequestration_potentials.py:create_capacity_map_storage; scripts/build_clustered_co2_sequestration_potentials.py:allocate_sequestration_potential"
  missing_behavior: "allocate_sequestration_potential overlays CO2Stop polygons with bus regions, so regions in countries outside the CO2Stop survey simply receive zero sequestration potential and prepare_sector_network caps their 'co2 sequestered' store at e_nom_max=0 — silently"
  tier_when_missing: D
  used_by: [co2-transport-and-sequestration, industrial-ccs, beccs, direct-air-capture, allam-cycle]
  notes: "regional_co2_sequestration_potential.enable is true by default; CO2Stop was an EU project — storage units/traps cover EU member states + NO/UK shelf, with no data for AL BA CH ME MK RS XK; probe: intersect CO2Stop_Polygons shapefiles with country shapes"

