# France baseline — overlay on the template's installed config/config.yaml
# (snakemake deep-merges; everything not listed here is inherited from the GB
# baseline: 5 clusters, 168H sector-opts, overnight 2050, europe-2013 cutout,
# gurobi). FR is in JRC-IDEES (EU-27) so no companion country is needed, and
# hotmaps carries FR 'Non-ferrous metals' sites (19), so the Portugal-class
# crash in build_industrial_energy_demand_per_node_today cannot fire
# (checked 2026-07-30 against the template's Industrial_Database.csv).
# Prepared 2026-07-30 at submodule 849c8858; built in the write-enabled
# template (the eur pattern — no authoring twin exists at this SHA).
run:
  name: france

countries:
- FR

# France CANNOT reach net-zero in this dataset at 5 clusters: a
# minimize-emissions probe on the prepared network floors at +13.3 Mt/yr
# net CO2 (Germany reaches -51.8), with every capture route present and
# unlimited — the binding limit is France's finite clustered renewable
# potential, past which marginal DAC power comes from gas and self-defeats.
# The default co2_budget.2050: 0.0 is therefore structurally INFEASIBLE
# (hit 2026-07-31: 'Infeasible model' + 10 h of IIS grinding). 5% of 1990
# (~19-20 Mt for FR scope) clears the 13.3 Mt floor with honest headroom.
# NOTE for interviews: the FR baseline is near-zero-2050, not net-zero.
co2_budget:
  2050: 0.05

sector:
  # France's salt caverns are onshore-only (Lorraine/Bresse basins); the
  # default [onshore, nearshore] crashes prepare_sector_network's
  # add_h2_gas_infrastructure with KeyError 'nearshore' — the script
  # checks intersection but then indexes the full list (upstream
  # partial-scope bug, same class as the PT hotmaps crash; hit
  # 2026-07-30 at job 66/67). Config-level scope fix, no code change.
  hydrogen_underground_storage_locations:
  - onshore
