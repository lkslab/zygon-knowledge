# Execution profile for the pypsa-eur baseline — consumed by referee/workspace.py
# and bin/harness. Machine-local paths are HINTS only; the env knob wins.
# Binary resolution order: $ZYGON_SNAKEMAKE_EUR > binary_hint > $ZYGON_SNAKEMAKE
# > snakemake on PATH.
model: pypsa-eur

# the res/v1 install, NOT the enderpearl root env — only this one carries the
# pip-installed dotenv/ruamel the eur Snakefile imports (see fixtures/BASELINE.md)
snakemake:
  env_knob: ZYGON_SNAKEMAKE_EUR
  binary_hint: /home/lukas/Desktop/res/v1/pypsa-eur/.pixi/envs/default/bin/snakemake
  prepend_path: /home/lukas/Desktop/res/v1/pypsa-eur/.pixi/envs/default/bin
  # env vars that must NOT leak into model invocations (a user profile would
  # override our --workflow-profile none)
  env_clean: [SNAKEMAKE_PROFILE]

# interpreter with the modelling stack (pypsa) — for check_network /
# check_extraction subprocesses; override with ZYGON_PYTHON
python_hint: /home/lukas/Desktop/res/v1/pypsa-eur/.pixi/envs/default/bin/python

invocation:
  # eur installs the baseline as config/config.yaml in the template; bundles
  # overlay into that file in the runspace. No --configfile needed.
  style: installed-config
  configfile: null
  # the network targets ONLY, not rule all: the default target drags the
  # summary/plot tail into invalidation AND execution, and a cosmetic plot
  # rule crashing (a new carrier without a tech_colors entry) fails an
  # otherwise-good solve (issue #4, runs/issues/interview-evals-20260728.md).
  # Networks are everything extraction/figures consume; the baseline settles
  # against these trivially (subset of all). Changed 2026-07-30 — smoke
  # invalidation sets re-pinned to match.
  targets:
  - "resources/{run.name}/networks/base_s_{scenario.clusters}_{scenario.opts}_{scenario.sector_opts}_{scenario.planning_horizons}.nc"
  - "results/{run.name}/networks/base_s_{scenario.clusters}_{scenario.opts}_{scenario.sector_opts}_{scenario.planning_horizons}.nc"
  flags: ["--workflow-profile", "none"]

cores: 4

# run-scoped output subtrees, REAL-copied (mtime-preserving) into every clone
# instead of hardlinked: template file inodes are a-w and snakemake refuses to
# plan over write-protected existing outputs. These hold every file a rerun
# may overwrite; everything else stays hardlinked and frozen.
writable_subtrees:
- "resources/{run.name}"
- "results/{run.name}"

budget:
  # with network-only targets an L0/L1 delta from prepare_sector_network down
  # is ~2-10 jobs (was ~26 when rule all pulled the 16-job summary/plot tail);
  # a full T3 rebuild is ~74 — 40 still separates them
  max_jobs: 40
  timeout_s: 3600
  # the no-download hard rule, made mechanical: any proposed job matching this
  # regex refuses execution, --force cannot override
  deny_rules: "^(retrieve_|download_|build_cutout)"
  # laptop-class envelope: job count can't see job COST — a 168H->3H bundle
  # passed a 27-job gate and ran 5x the smoke (2026-07-28). On the 5-node
  # baseline nothing finer than daily; cluster count never moves (a change
  # rebuilds the whole resources chain)
  envelope:
    temporal_floor_h: 24
    pinned_keys: ["scenario.clusters", "snapshots"]

# documented prerequisite, never checked — an absent license makes the solve
# fail loudly, which is the honest failure mode
requires: [gurobi-license]

# path templates rendered from the EFFECTIVE config (default <- installed
# overlay), so a bundle that changes a wildcard-bearing key retargets
# correctly. {dotted.key} resolves via deep_get; single-element lists collapse.
verify:
  networks:
  - stage: prepared
    path: "resources/{run.name}/networks/base_s_{scenario.clusters}_{scenario.opts}_{scenario.sector_opts}_{scenario.planning_horizons}.nc"
  - stage: solved
    path: "results/{run.name}/networks/base_s_{scenario.clusters}_{scenario.opts}_{scenario.sector_opts}_{scenario.planning_horizons}.nc"
