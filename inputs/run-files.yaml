id: run-files
title: Input files of a run
models:
- model: pypsa-eur
  version_anchor:
    ref: 8ac32b87db61256db24d133791ed13fa101bb68f
    date: '2026-11-24'
  files:
  - path: resources/{run}/cell_capacity_factor_{technology}.nc
    source: grid
    shows: Average capacity factor in every weather cell, for the onshore technologies onwind, solar and solar-hsat, cut to the onshore regions.
    question: Where are onshore wind and solar resources good?
    query:
      variable: capacity_factor
      window:
        file: resources/{run}/onshore_regions.geojson
  - path: resources/{run}/cell_capacity_factor_{technology}.nc
    source: grid
    shows: Average capacity factor in every weather cell, for the offshore technologies offwind-ac, offwind-dc and offwind-float, cut to the offshore regions.
    question: Where are offshore wind resources good?
    query:
      variable: capacity_factor
      window:
        file: resources/{run}/offshore_regions.geojson
  - path: resources/{run}/availability_matrix_{technology}.nc
    source: grid
    shows: Eligible land share of every weather cell, summed over the model regions, for onwind, solar and solar-hsat.
    question: How much land is eligible for onshore wind or solar, and where?
    query:
      reduce:
        bus: sum
      window:
        file: resources/{run}/onshore_regions.geojson
  - path: resources/{run}/availability_matrix_{technology}.nc
    source: grid
    shows: Eligible sea share of every weather cell, summed over the model regions, for offwind-ac, offwind-dc and offwind-float.
    question: How much sea area is eligible for offshore wind, and where?
    query:
      reduce:
        bus: sum
      window:
        file: resources/{run}/offshore_regions.geojson
  - path: resources/{run}/availability_raster_{technology}.tif
    source: grid
    shows: The model's per-pixel verdict on where onwind, solar and solar-hsat may be built, at the excluder resolution (100 m by default), cut to the onshore regions. Regions in Moldova and Ukraine carry the plain excluder's verdict, not their separate availability matrix.
    question: Where exactly may onshore wind or solar be built?
    query:
      classes:
      - {label: excluded, codes: [0], color: "#bdbdbd"}
      - {label: eligible, codes: [1], color: "#31a354"}
  - path: resources/{run}/availability_raster_{technology}.tif
    source: grid
    shows: The model's per-pixel verdict on where offwind-ac, offwind-dc and offwind-float may be built, at the excluder resolution (200 m by default), cut to the offshore regions. Regions in Moldova and Ukraine carry the plain excluder's verdict, not their separate availability matrix.
    question: Where exactly may offshore wind be built?
    query:
      classes:
      - {label: excluded, codes: [0], color: "#bdbdbd"}
      - {label: eligible, codes: [1], color: "#31a354"}
  - path: resources/{run}/onshore_regions.geojson
    source: geometry
    shows: The onshore regions the network is clustered into.
    question: Which regions does the model resolve?
    query: {}
  - path: resources/{run}/offshore_regions.geojson
    source: geometry
    shows: The offshore regions attached to the clustered buses.
    question: Which offshore regions does the model resolve?
    query: {}
  - path: resources/{run}/powerplants.csv
    source: geometry
    shows: Conventional power plants by location, split by fuel type and sized by capacity in MW.
    question: Where does the existing conventional fleet sit?
    query:
      lon: lon
      lat: lat
      category: Fueltype
      value: Capacity
  - path: resources/{run}/costs_{horizon}_processed.csv
    source: table
    shows: Investment cost in EUR/MW of a selection of the generation technologies (onwind, offwind, offwind-float, solar-hsat, OCGT, CCGT, nuclear, coal and lignite) for the planning horizon; the other rows of the file mix units (stores per MWh, lines per km) and are left out.
    question: What generation cost assumptions does the run use?
    query:
      x: technology
      value: investment
      filters:
        technology:
        - onwind
        - offwind
        - offwind-float
        - solar-hsat
        - OCGT
        - CCGT
        - nuclear
        - coal
        - lignite
