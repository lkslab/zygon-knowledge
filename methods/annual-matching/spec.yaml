id: annual-matching
title: annual matching — the 100 % renewable PPA rung, and monthly RFNBO matching
family: markets-and-prices
what: 'The volumetric procurement rules a data centre or electrolyser is held to
  before hourly matching: contracted generation over the whole year (Riepin et al.
  2024, Eq. 1 — the "100 % renewable PPA") or per calendar month (the RFNBO
  transitional regime until end-2029) must cover a share x of the consumer''s
  demand. Same consumer, palette and payload as hourly-matching, one constraint
  row per window instead of one per snapshot, so annual, monthly and hourly
  premiums sit side by side in one run set. Storage discharge is NOT credited
  under the annual rule: a fossil-charged battery would satisfy it.

  '
when_to_use:
- cost of a 100 % annual renewable PPA for a large consumer
- monthly vs annual matching under the RFNBO delegated act
- the volumetric baseline the 24/7 premium is measured against
- does an annual PPA reduce emissions or move them
models:
- model: pypsa-eur
  version_anchor:
    ref: b3606ff14c838bf1bda9cbf5289ea2ff68756fbb
    date: '2026-10-26'
  execution:
  - kind: config
    key: zygon_cfe
    value:
      consumer:
        name: datacentre
        bus: DE0 0AC
        p_mw: 100
        profile: flat
        grid_capacity: 10
      palette:
      - onwind
      - solar
      - battery
      potential_share: 1.0
      excess_share: 0.2
      credit_storage:
        hour: true
        month: true
        year: false
      charge_from_portfolio_only: false
      basis:
        year: available
        month: available
        hour: dispatched
      grid_cfe:
        series: null
      reference: nomatch
      variants:
        nomatch:
          window: none
        annual-080:
          window: year
          score: 0.8
        annual-100:
          window: year
          score: 1.0
        monthly-100:
          window: month
          score: 1.0
      labels:
      - nomatch
      - annual-080
      - annual-100
      - monthly-100
      indicators:
      - procurement_cost
      - premium
      - system_cost_delta
      - cfe_score
      - procured_capacity
      - scope2_emissions
      - grid_exchange
    note: 'window year = one row over the year (Eq. 1), month = twelve rows; score
      is the matched share. credit_storage.year MUST stay false. Add the hourly-*
      variants of hourly-matching to the same block for the full ladder. `bus` is
      the clustered AC bus name when known; for a study that only knows a place,
      leave `bus: ""` and set `near: [lon, lat]` (optionally `country: <ISO2>`) and
      the payload picks the nearest AC bus at build time, at any spatial resolution.

      '
  - kind: config
    key: solving.options.load_shedding
    value:
      enable: true
      default_cost: 2000
    note: 'declared VOLL so imports and non-participants'' prices are bounded (the
      price-formation setting).

      '
  - kind: payload
    source: hourly-matching
    note: 'SHARES the zygon_cfe payload shipped under methods/hourly-matching/payload/pypsa-eur
      (rules/zygon_cfe.smk, scripts/build_cfe_network.py, zygon_cfe_constraints.py,
      zygon_cfe_collect.py, the config.yaml fragment). Stage it once; both specs read one
      zygon_cfe config block.
      A run whose labels lack the reference variant reads it from the sibling
      run that solves it (one-variant-per-scenario bundles). Dry-run validated
      on 9a0c6bc5 (lkslab/pypsa-eur, 2026-09-16) and on 09e8910a (Snakemake
      9.27, 2026-10-26); not yet solved end to end.

      '
  - kind: invocation
    note: 'extra_targets: results/{run.name}/zygon_cfe/{zygon_cfe.indicators}.csv (the
      collect rule is per run: each scenario''s own labels, read through
      config_provider). replace_verify_networks (NOT verify_networks): {stage:
      solved, path: results/{run.name}/cfe/{zygon_cfe.labels}/solved_{planning_horizons}.nc}
      (one per variant per scenario) and {stage: collected, path:
      results/{run.name}/zygon_cfe/{zygon_cfe.indicators}.csv}. The study''s answer
      lives in the VARIANT network: the profile''s own solved network
      (results/{run.name}/networks/solved_*.nc) carries no consumer and is identical
      across the scenarios, and the settlement takes the first solved verify path as
      the scenario''s network, so extending the profile''s list makes every
      comparison read five identical base networks and report the rules as
      ineffective (seen 2026-10-26). Optional zygon_cfe.baseline: true adds the
      run''s own solved network (no consumer) to the collect inputs for the
      additionality reading.

      '
  invalidates:
  - build_cfe_network
  - solve_cfe_network
  - zygon_cfe_collect
  budget:
    jobs: 13
    class: hours
  success_metric:
  - name: annual-rule-holds
    needs: solved
    check: all((nv[v].snapshot_weightings.generators @ (nv[v].generators_t.p_max_pu[[g for g in nv[v].generators.index if g.startswith('zcfe:datacentre:') and g in nv[v].generators_t.p_max_pu.columns]] * nv[v].generators.p_nom_opt[[g for g in nv[v].generators.index if g.startswith('zcfe:datacentre:') and g in nv[v].generators_t.p_max_pu.columns]]).sum(axis=1)) >= float(v.split('-')[1]) / 100 * 0.999 * (nv[v].snapshot_weightings.generators @ nv[v].loads_t.p_set['zcfe:datacentre:load']) for v in nv if v.startswith('annual-'))
    expect: over the year the contracted plants' available generation (the PPA volume, curtailed or sold) covers the matched share of demand — storage uncredited
  - name: monthly-rule-holds
    needs: solved
    check: >-
      (lambda n, pre: (lambda vre, dis, ch, w: (((n.generators_t.p_max_pu[vre] * n.generators.p_nom_opt[vre]).sum(axis=1)
      + (-n.links_t.p1[dis]).clip(lower=0).sum(axis=1) - n.links_t.p0[ch].clip(lower=0).sum(axis=1)).mul(w).groupby(n.snapshots.month).sum()
      >= 0.999 * n.loads_t.p_set[pre + 'load'].mul(w).groupby(n.snapshots.month).sum()).all() and n.snapshots.month.nunique() == 12)(
      [g for g in n.generators.index if g.startswith(pre) and g in n.generators_t.p_max_pu.columns],
      [l for l in n.links.index if l.startswith(pre) and n.links.at[l, 'bus1'] == pre + 'bus' and n.links.at[l, 'carrier'] != 'zcfe import'],
      [l for l in n.links.index if l.startswith(pre) and n.links.at[l, 'bus0'] == pre + 'bus' and n.links.at[l, 'carrier'] != 'zcfe export'],
      n.snapshot_weightings.generators))(nv['monthly-100'], 'zcfe:datacentre:')
    expect: twelve calendar-month windows, each covered by the contracted plants' available generation plus net storage
  - name: rule-costs-something
    needs: solved
    check: float(nv['annual-100'].objective) >= float(nv['annual-080'].objective) - 1e-6 * abs(float(nv['nomatch'].objective)) and float(nv['annual-080'].objective) >= float(nv['nomatch'].objective) - 1e-6 * abs(float(nv['nomatch'].objective)) and float(nv['monthly-100'].objective) >= float(nv['nomatch'].objective) - 1e-6 * abs(float(nv['nomatch'].objective))
    expect: 'nested feasible sets: a higher annual share never lowers system cost, and any rule costs at least the no-rule case'
  - name: premium-is-delta
    needs: solved
    check: all(abs(float(collected['premium'].set_index('network')['value'][v]) - (float(collected['procurement_cost'].set_index('network')['value'][v]) - float(collected['procurement_cost'].set_index('network')['value']['nomatch']))) < 1e-6 for v in set(collected['premium']['network']))
    expect: the collected premium is procurement cost minus the no-rule grid-purchase cost, per MWh
  - name: indicators-complete
    needs: solved
    check: set(collected) >= {'procurement_cost', 'premium', 'system_cost_delta', 'cfe_score', 'procured_capacity', 'scope2_emissions', 'grid_exchange'} and all({'network', 'value'} <= set(collected[q].columns) and collected[q]['value'].notna().all() for q in collected) and set(collected['premium']['network']) == set(nv)
    expect: one long-format CSV per indicator, every variant present, no NaN
notes: 'Annual matching certifies the paperwork, not the electrons: the consumer runs
  flat on the grid mix and settles up with summer solar, so its scope-2 number (grid
  imports x the zone''s hourly intensity, collected) can stay high while the rule is
  met — report it beside the premium. The rule counts AVAILABLE generation of the
  contracted plants (basis), the volume a PPA sells whether consumed, sold or
  curtailed; counting dispatch instead makes the LP build a lossy loop as a sink. The
  monthly regime keeps most within-month arbitrage and is what a pre-2030 project is
  held to. The deliverable is the ladder nomatch / annual / monthly / hourly in ONE
  zygon_cfe block: "how much more expensive is 24/7" is the hourly premium minus the
  annual premium from the same run set.

  '
