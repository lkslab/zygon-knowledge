id: co2-budget
title: co2-budget — the CO2 cap every pypsa-eur run carries
family: policy-and-constraints
what: >-
  pypsa-eur enforces an emissions target as a global constraint on CO2, never as a
  technology share. compose_network calls scripts/prepare_network.py:apply_co2_budget_constraints,
  which reads the top-level co2_budget block, picks the value for the current horizon with
  scripts/co2_budget.py:bound_value_for_horizon, and adds one GlobalConstraint per bound
  through scripts/prepare_network.py:add_co2limit: CO2Limit-upper for co2_budget.upper,
  CO2Limit-lower for co2_budget.lower, both with carrier_attribute co2_emissions and the
  constant in tonnes over the modelled years. How the solver enforces it depends on the
  workflow. Electricity-only (sector.enabled false): type primary_energy, PyPSA's native
  constraint, which sums every generator's dispatch times its carrier's co2_emissions factor.
  Sector-coupled (the shipped default): type co2_atmosphere, and
  scripts/solve_network.py:add_co2_atmosphere_constraint bounds the end-of-horizon level of
  the non-cyclic "co2 atmosphere" store on the bus with carrier co2 instead; emissions reach
  that store through the CO2 bus wiring of every emitting link (efficiency2 on gas, oil, process links, negative on DAC
  and sequestration), the carrier attribute only identifies the store. Either way there is
  no user decision about which technologies "count": the model's wiring decides. With
  relative: true (default) the values are fractions of the 1990 emissions the model computes
  for the study's countries (scripts/prepare_sector_network.py:co2_emissions_year, EEA data
  plus a Eurostat estimate for the Balkan countries); with relative: false they are absolute
  Gt CO2 per year. The default trajectory has been run on this anchor: with the full
  country list, 10% of 1990 gave a cap of 460 Mt, so the model's economy-wide 1990
  baseline is about 4.6 Gt.
when_to_use:
- the user names an emissions target (net zero by year, X% below 1990, a carbon budget)
- the user asks what the default run already caps, or wants an uncapped run
- the user says "clean share" or "renewable share" and it has to become a CO2 reduction
- system cost under an emissions target
- the CO2 shadow price (the dual of CO2Limit-upper, n.global_constraints.mu) as a result
models:
- model: pypsa-eur
  version_anchor:
    ref: 6128bf7effbe7243bcc46b2770d04cebe45613a5
    date: '2026-10-26'
  # No execution entries on purpose: co2_budget.* is a study-frame key the bundle
  # sets citing the tracker's emissions_target, never a method lever. This card is
  # the grounding the scoper relays and the consultant settles the key against.
  execution: []
  invalidates:
  - compose_network
  - solve_network
  budget:
    jobs: 0
    class: minutes
  success_metric:
  - name: cap-in-the-network
    needs: prepared
    check: n.global_constraints.index.str.startswith('CO2Limit').any()
    expect: >-
      a CO2Limit global constraint exists whenever co2_budget.upper or lower has a value
      for the horizon; the name holds in every foresight mode, including the
      perfect-foresight Co2Budget case
  - name: cap-type-matches-workflow
    needs: prepared
    check: >-
      set(n.global_constraints[n.global_constraints.index.str.startswith('CO2Limit')].type)
      <= ({'co2_atmosphere', 'Co2Budget'} if (n.buses.carrier == 'co2').any()
      else {'primary_energy'})
    expect: >-
      sector runs carry co2_atmosphere (or Co2Budget under perfect foresight with a scalar
      budget), electricity-only runs primary_energy; a mismatch means the wrong solver
      routine enforces the cap
  - name: cap-constant-is-the-target
    needs: solved
    check: >-
      abs(n.global_constraints.loc['CO2Limit-upper', 'constant']
      - n.meta['co2_budget']['upper'][str(n.meta['wildcards']['horizon'])]
      * 4.6e9 * n.snapshot_weightings.objective.sum() / 8760) < 0.15 * 4.6e9
      if n.meta['co2_budget']['relative'] else True
    expect: >-
      for the full default country list the constant is the fraction times roughly 4.6 Gt
      (the 1990 economy-wide baseline the model computes) times the modelled years; a
      constant far above that means the baseline included sectors the run does not
      model, see note (b)
notes: >-
  (a) The shipped default is already a cap: co2_budget.upper is {2020: 0.72, 2025: 0.648,
  2030: 0.45, 2035: 0.25, 2040: 0.1, 2045: 0.05, 2050: 0.0} with relative: true,
  emissions_scope: CO2 and lower: null (config/config.default.yaml:co2_budget); "no
  explicit target" is not an uncapped run, and this now holds for electricity-only runs
  too, which the pre-streamline workflow left uncapped unless electricity.co2limit_enable
  was set. An electricity-only run with planning_horizons [2050] is capped at zero and may
  be infeasible. (b) What is counted follows the workflow, but the 1990 baseline does NOT
  follow sector.enabled. scripts/prepare_sector_network.py:determine_emission_sectors
  builds the baseline from the sector.transport, sector.heating, sector.industry and
  sector.agriculture toggles, which stay true in the shipped config when sector.enabled is
  false. An electricity-only run with defaults therefore gets fraction x economy-wide 1990
  emissions (about 4.6 Gt for the full country list) as a cap on power-sector emissions
  alone, far looser than the fraction suggests. Power-only against a power-only baseline
  needs those four toggles false as well; a sector run counts whatever sectors are on and
  its baseline matches. Same key, different meaning: say which reading the study uses.
  (c) Translation, one value per planning horizon: "net zero by Y" -> {Y: 0.0}; "X% below
  1990 by Y" -> {Y: 1 - X/100}; a horizon the user does not change keeps the shipped
  fraction because config files and run.scenarios overrides are deep-merged, never
  replaced; interpolation between horizons is the user's call, one number each. "X% clean"
  or "X% renewable" has no co2_budget equivalent: ask which CO2 reduction against 1990 it
  stands for. (d) An uncapped run is co2_budget.upper: null (with lower null), an explicit
  decision; a single year is switched off with {Y: null}. (e) The schema
  (scripts/lib/validation/config/co2_budget.py:Co2BudgetConfig) accepts any integer year,
  so an unlisted year does not fail the config check. The trap is the reverse: a planning
  horizon with no key in upper (and none in lower) gets no CO2 constraint at all, silently,
  with no log line, because bound_value_for_horizon returns None and add_co2limit skips
  None. Always give every planning horizon an explicit value or an explicit null. (f)
  Units: with relative: false, upper and lower are Gt CO2 per year; the pre-streamline
  electricity.co2limit was in t CO2 per year, so an old number copied unchanged is a billion
  times too loose. (g) Foresight: overnight and myopic add one constraint per horizon
  network. Perfect foresight with the per-year mapping adds one constraint per investment
  period, CO2Limit-upper-<year>, enforced by scripts/solve_network.py:add_carbon_constraint
  on the store level change within that period; only a scalar upper (one number, no years)
  becomes a single cumulative budget of type Co2Budget over all periods
  (scripts/solve_network.py:add_carbon_budget_constraint), added at the last horizon. upper
  and lower must both be scalars or both be mappings, and lower must stay below upper for
  every horizon. (h) Limits: pypsa-eur has no renewable- or clean-share constraint (CCL caps
  capacity per country and carrier, EQ is a self-sufficiency share, BAU and SAFE are floors
  and reserve margins); hourly- and annual-matching are procurement rules for one consumer,
  not system targets. A price instead of a cap is costs.emission_prices, a different card.
  pypsa-earth still caps through the Co2L opts wildcard and electricity.co2limit; see the
  coal-power-plants carrier card.
  (i) A one-country or small-selection sector run meets the cap with the selection's own
  sinks: the Europe-wide annual injection cap (sector.co2_sequestration_potential, 180
  Mt/a in 2040) is loose, what binds is the regional CO2Stop potential annualised over 25
  years (NL at 10 clusters: 113 Mt in one offshore region, so 4.5 Mt/a), and under it must
  fit the emissions nothing abates — coal for industry (no synthetic coal, no capture; NL
  2040 1.7 TWh, 0.56 Mt) and the uncaptured 5% of process emissions (NL 2040 about 0.17
  Mt) — while every other combustion is made neutral with captured CO2 through DAC-fed
  Fischer-Tropsch and methanolisation, at a large electricity cost the country's own
  potentials have to carry (there is no electricity import in a one-country run). For NL
  2040 that arithmetic works (about 0.7 Mt unavoidable against 4.5 Mt/a), so net zero as
  such did not make the 2026-10-09 NL hydrogen study infeasible; the biomass limit did
  (the biomass-bioenergy carrier card has the trap: a single country's exogenous
  industrial biomass demand against its own potential). Symptom of an infeasible cap
  either way: Gurobi reports "Numerical trouble ... Model may be infeasible or unbounded"
  or "Infeasible model" within minutes of barrier, then computes an IIS until the job's
  runtime kills it, so a solve_network job that dies at its time limit after an early
  infeasible line is a scenario infeasibility, not a solver-size problem; check the sinks and the biomass balance of the selection before resizing anything. The structural fix for the biomass side on this fork is [[industry-heat-endogenous]] (the industrial biomass load becomes band heat supplied under the limit); [[industry-routes-endogenous]] is a second, partial way out (steel and cement leave the flat demand, the kiln biomass competes under the limit; for NL 2040 that alone removes 0.35 of the 16.0 TWh/a, so it complements industry-heat-endogenous rather than replacing it). On the process-emission side, build_industrial_energy_demand_per_node clips a negative per-node process emission to zero with a warning: JRC-IDEES gives HVC a negative process emission in later horizons, three NL 2040 nodes summed negative, and compose_network would have turned that into a CO2 withdrawal no sink can serve, an infeasibility with the same symptom; and with solving.options.infeasibility_diagnosis.time_limit set (fork, backend config) the IIS computation stops after that many seconds instead of running to the job's kill.
  (j) The sink itself can be absent: with sector.regional_co2_sequestration_potential.enable
  (the default) each region's "co2 sequestered" store is capped by the country's own
  CO2Stop storage, and the fork's conservative offshore table holds none for SE, FI, EE
  and LU and zero for AT, ES, FR, NO, HR, HU and RS (resource
  co2_sequestration_potentials.geojson, checked 2026-10-12; SI and BE are near zero). In
  such a one-country run the clustered potential file is empty, every store's e_nom_max
  is 0, captured CO2 (DAC included) has nowhere to go, and a zero cap with any process
  emission is infeasible before the solver starts (SE 2050, 2026-10-11: both scenarios
  "Infeasible model" within a minute; the diagnostician's 5%-of-1990 relaxation answers a
  different question). The study decision the consultant raises at emissions_target for
  one of these countries: an export allowance to shared storage,
  sector.regional_co2_sequestration_potential.enable false and
  sector.co2_sequestration_potential {<horizon>: <Mt/a>} at a figure the user accepts
  (a North Sea or Baltic storage contract; the run then reports what it sequesters
  against that allowance, and the results state it as an assumption), or a residual cap
  (emissions_target above zero) stated as a limitation. The data-quality card flags the
  gap (co2stop-sequestration D); the mechanism is on the co2-transport-and-sequestration
  carrier card.
