id: existing-fleet
title: existing-fleet ingestion — which pre-built capacity the optimiser sees
family: tooling-and-reproducibility
what: 'Every run, in every foresight mode, ingests the real generation fleet: powerplantmatching
  (+OSM on earth) plants attach non-extendable with build_year/lifetime, and existing
  renewables anchor p_nom_min from PPM/IRENA statistics. This method controls WHICH
  fleet enters — date filters, custom plant lists, statistical anchoring. The demonstrative
  execution flips renewable anchoring OFF (pure greenfield): the one direction of
  the lever that a single run can decide mechanically.

  '
when_to_use:
- what should be built given today's fleet
- remove or correct existing plants for my country
- greenfield vs brownfield comparison
- existing renewable capacity looks wrong
models:
- model: pypsa-eur
  version_anchor:
    ref: a6c45e5a2d926ba9a5566cba24d905cff9f89939
    date: '2026-09-09'
  execution:
  - kind: config
    key: electricity.estimate_renewable_capacities.enable
    value: false
    note: 'switch off PPM-derived existing solar/onwind/offwind anchoring — renewable
      generators lose their p_nom_min floors; conventional fleet attachment is untouched.
      Rebased on a6c45e5 (2026-09-10), not yet re-run against an a6c45e5 install.

      '
  invalidates:
  - compose_network
  - solve_network
  budget:
    jobs: 12
    class: minutes
  success_metric:
  - name: greenfield-anchors-cleared
    needs: prepared
    check: (n.generators.query("carrier in ['solar','onwind','offwind-ac']").p_nom_min
      == 0).all()
    expect: 'renewable p_nom_min floors gone (baseline GB carries ~15 GW solar / ~21
      GW onwind anchors)

      '
  - name: fleet-still-attached
    needs: prepared
    check: ((~n.generators.p_nom_extendable) & (n.generators.p_nom > 0)).sum() >=
      10
    expect: 'non-extendable existing units (nuclear/gas/biomass/ror) still in the
      network — the flip touches anchoring only

      '
- model: pypsa-earth
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-08-01'
  execution:
  - kind: config
    key: electricity.powerplants_filter
    value: (DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn !=
      DateIn) and Fueltype != 'Solar' and Fueltype != 'Wind'
    note: 'filter runs AFTER the PPM/OSM/custom merge in build_powerplants — the Fueltype
      exclusion zeroes caps_existing and the p_nom_min anchors.

      '
  invalidates:
  - build_powerplants
  - add_electricity
  - solve_network
  budget:
    jobs: 30
    class: hour
  success_metric:
  - name: greenfield-anchors-cleared
    needs: solved
    check: (n.generators.query("carrier in ['solar','onwind']").p_nom_min == 0).all()
    expect: powerplants-derived p_nom_min floors gone from solar and onwind
  - name: fleet-cohorts-present
    needs: solved
    check: ((~n.generators.p_nom_extendable) & (n.generators.p_nom > 0) & (n.generators.carrier
      != 'load shedding')).sum() >= 5
    expect: 'existing conventional units (CCGT/oil/coal/nuclear/ror cohorts) still
      attached with build_year set

      '
notes: 'Mode-invariant: this ingestion is the substrate for the baseyear cohorts in
  [[pathway-myopic]]. NEGATIVE KNOWLEDGE (falsified by eval 2026-08-01, issue #9):
  on earth `estimate_renewable_capacities.stats: false` is NOT greenfield despite
  its config comment — attach_wind_and_solar anchors p_nom_min = caps_existing from
  powerplants.csv unconditionally; `stats` only gates the IRENA gap-fill, and Mexico''s
  gap is zero (flip = no-op). The powerplants filter is the live lever. Other directions
  TUNE rather than clear (`year`, eur `expansion_limit`, `custom_powerplants` — L3
  on earth) and need pair-run metrics, not spec''d in v2.0. Earth re-triggers ~29
  jobs on any electricity flip; honest cost.

  '
