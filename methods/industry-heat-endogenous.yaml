id: industry-heat-endogenous
title: industry-heat-endogenous — let the model choose how industrial process heat is supplied
family: sector-coupling
what: >-
  With sector.industry_heat.enable the industrial process heat of the covered subsectors
  stops being an exogenous fuel share and becomes three temperature-band demands per
  node (heat100-200, heat200-500 and heat500+ industry) that extendable supply links
  compete for: solid biomass and gas steam boilers with carbon-capture twins, an
  industrial high-temperature heat pump and an electric steam boiler at 100-200 °C,
  solid biomass and gas direct firing (with CC) and hydrogen firing at 200-500 °C, gas
  direct firing (with CC) and hydrogen firing above 500 °C, every newly built link with a
  minimum part load (sector.industry_heat.min_part_load). The bands come from the
  horizon-free rule rules/build_sector.smk:build_industry_sector_ratios_endogenous, which
  splits today's per-country fuel intensities (JRC-IDEES) by the temperature shares of
  data/industry_heat_temperature_shares.csv (mostly Fleiter et al. 2025) for every
  subsector in that file not listed in sector.industry_heat.exclude_sectors (steel never;
  "DRI + Electric arc" and the HVC recycling routes keep their exogenous ratios);
  build_industrial_energy_demand_per_node overwrites the covered subsectors' ratios with
  them, and scripts/prepare_sector_network.py:add_industry calls add_industry_heat when
  the switch is on. The exogenous "solid biomass for industry" and "gas for industry"
  loads shrink to the non-covered sectors' share; process emissions, naphtha, methanol
  and the electricity baseline are unchanged. Upstream PyPSA/pypsa-eur#1943; the
  mechanism card industry-process-heat-endogenous carries the detail.
when_to_use:
- electrifying industrial process heat
- industrial heat pumps, electric boilers or hydrogen for process heat
- which fuel should industry burn, biomass or gas or hydrogen, per temperature level
- a single-country sector study whose industrial biomass demand exceeds the country's potential
- how much industrial heat can be electrified and what it does to the grid
models:
- model: pypsa-eur
  version_anchor:
    ref: ee7c6d86e475ee17a6af6d49ebf5ba8118b16723
    date: '2026-11-24'
  execution:
  - kind: config
    key: sector.industry_heat.enable
    value: true
    note: >-
      the switch. It also adds the endogenous ratios as an input of the per-node
      demand rule, so an exogenous-vs-endogenous pair is a legitimate two-scenario
      study but builds the industrial demand per scenario.
  - kind: config
    key: sector.industry_heat.min_part_load
    value: 0.8
    note: >-
      p_min_pu on every newly built band supply link, the shipped default: built heat
      capacity runs near baseload, as on-site plants do. Lower it for a flexibility
      study; one global scalar for all bands and technologies.
  - kind: config
    key: sector.industry_heat.technologies
    value:
      heat100-200: [solid biomass, gas, heat pump, electric boiler]
      heat200-500: [solid biomass, gas, hydrogen]
      heat500+: [gas, hydrogen]
    note: >-
      the menu per band, shipped defaults. Solid biomass and gas bring their CC twin
      along (gated by industry.solid_biomass_for_industry_cc / gas_for_industry_cc);
      "electrification only" at 100-200 °C is [heat pump, electric boiler]. Heat pump
      and electric boiler only work in heat100-200. Every band must stay in the dict,
      a missing band drops its demand. Hydrogen firing is priced at ten times gas
      (placeholder).
  - kind: config
    key: sector.industry_heat.exclude_sectors
    value:
    - Pulp production
    note: >-
      subsectors of the shares file that keep exogenous fuel shares, the shipped default
      (pulp burns its own by-products). Steel, HVC recycling and DRI are not in the file.
      Set it once in the base config: the key is read by a horizon-free rule, so a
      per-scenario difference makes the harness rebuild the resources per scenario
      rather than share them.
  - kind: invocation
    note: >-
      config only, no code: the workflow ships the rule, the data file
      (data/industry_heat_temperature_shares.csv) and add_industry_heat, so a bundle sets
      the keys and nothing else. Read the result off the band loads (carrier
      "heat100-200 industry", "heat200-500 industry", "heat500+ industry") and the links
      feeding them (carriers "<band> industry <technology>"); the technology split per
      band is the answer, the remaining "solid biomass for industry" and "gas for
      industry" loads are the non-covered rest. Geothermal enters the 100-200 °C band
      not through the technology lists but through sector.enhanced_geothermal.industry_heat
      (a "geothermal industry heat" link per region from the EGS surface heat, cited on
      the enhanced-geothermal carrier card).
  invalidates:
  - build_industrial_energy_demand_per_node
  - compose_network
  - solve_network
  budget:
    jobs: 2
    class: hours
  success_metric:
  - name: band-demands-present
    needs: prepared
    check: n.loads.carrier.isin(['heat100-200 industry', 'heat200-500 industry', 'heat500+ industry']).any()
    expect: a band load per node with industrial production once the switch is on
  - name: band-supply-built
    needs: solved
    check: n.links.loc[n.links.bus1.str.endswith(' industry') & n.links.carrier.str.startswith('heat'), 'p_nom_opt'].sum() > 0
    expect: the optimiser built supply for the bands; the carrier mix of that capacity is the result
notes: >-
  The covered subsectors are rebuilt from today's intensities for every carrier, so the
  industry.sector_ratios_fraction_future blend of [[industry-fuel-switching]] no longer
  reaches them: their electricity baseline is today's, and efficiency progress has to
  come from the band technologies. The band demand is fuel input, so it overstates
  useful heat by today's boiler losses. The route keys of [[industry-fuel-switching]]
  still decide the production the bands are derived from, and steel stays entirely
  exogenous. With [[industry-routes-endogenous]] on as well (sector.endogenous_sectors),
  the listed sectors leave the bands: the per-node rule zeroes Integrated steelworks and
  DRI + Electric arc for steel and Cement for cement after the band overwrite, so there
  is no double count and the kiln heat is chosen on the cement route's own heat bus
  (solid biomass, gas, waste). For a one-country run the method is the structural way
  out of the biomass trap recorded in [[co2-budget]] note (i): the exogenous "solid
  biomass for industry" load that the biomass limit could not cover becomes band demand
  that biomass, gas, electricity and hydrogen compete for under the limit. No existing
  heat supply is added, so the first horizon builds all of today's industrial heat
  supply. Under [[pathway-myopic]] inherited band links keep their built capacity with
  p_min_pu 0, so they may idle when band demand falls or an emission limit binds. The
  hydrogen firing cost is a placeholder (ten times gas); a study whose answer hinges on
  hydrogen-versus-electricity in the upper bands says so. The industrial heat pump draws
  electricity at the catalogue COP with free, unlimited source heat; the electric steam
  boiler likewise, both from the low-voltage bus when the distribution grid is modelled,
  so the two electric options compete on equal terms. Pair with [[co2-budget]] for the
  target that prices the fuels and [[h2-network-expansion]] when the hydrogen for the
  upper bands is part of the question. The method needs sector.biomass on (the
  100-500 °C biomass links draw from the solid-biomass buses, and the remaining
  exogenous industrial biomass load needs them too): with it off compose_network stops
  with "Industry demand includes solid biomass, but `sector.biomass` is disabled" (IT
  2035, 2026-10-11), so a sectors key that lists industry keeps biomass, and
  fossil_fuels for the gas it competes against.
