id: pathway-myopic
title: myopic pathway — sequential horizons with capacity carry-over
family: foresight-and-pathways
what: 'Capacity expansion with limited foresight: solve horizon t, carry its optimised
  capacities into t+1 as fixed assets (p_nom = p_nom_opt, extendable off), retire
  by build_year + lifetime, lock transmission (s_nom_min = prior s_nom_opt), then
  solve t+1 with its own cost year. The first horizon seeds the real pre-existing
  stock (add_existing_baseyear age cohorts); later horizons inherit through add_brownfield.
  Answers WHEN capacity gets built and what retires, not just the end-state mix.

  '
when_to_use:
- pathway to 2050 via 2030/2040 milestones
- when must capacity be built, not just how much
- what retires and what carries over
- myopic vs overnight results
models:
- model: pypsa-eur
  version_anchor:
    ref: 6128bf7effbe7243bcc46b2770d04cebe45613a5
    date: '2026-10-26'
  execution:
  - kind: config
    key: foresight
    value: myopic
    note: 'no separate myopic rule set at a6c45e5 (the streamlined workflow, #1838):
      rules/compose.smk chains compose_network per horizon — add_existing_baseyear
      seeds the first horizon, later horizons read the previous solved network
      (input network_previous) and apply add_brownfield inside compose_network;
      solve_network then solves solved_{horizon}.nc in sequence. Rebased on a6c45e5
      2026-09-10, not yet re-run.

      '
  - kind: config
    key: planning_horizons
    value:
    - 2030
    - 2050
    note: 'top-level list at a6c45e5 (the old scenario.planning_horizons wildcard is
      gone); two horizons keep the job count inside the budget gate; the harness fans
      the profile''s target templates out per horizon.

      '
  - kind: invocation
    note: 'no target changes needed — the baseline profile''s prepared and solved
      templates carry {planning_horizons} and render one composed_/solved_ head per
      horizon; artifacts land per horizon automatically.

      '
  invalidates:
  - compose_network
  - solve_network
  budget:
    jobs: 21
    class: hour
  success_metric:
  - name: two-horizons-solved
    needs: solved
    check: len([h for h in ns if h]) == 2
    expect: one solved network per planning horizon (2030 and 2050)
  - name: cohort-carried
    needs: solved
    check: ((n.generators.build_year == 2030) & ~n.generators.p_nom_extendable).any()
      or ((n.links.build_year == 2030) & ~n.links.p_nom_extendable).any()
    expect: '2030-built assets present in the 2050 network as fixed (non-extendable)
      capacity — the brownfield hand-over happened

      '
  - name: transmission-locked
    needs: solved
    check: (ns[2050].lines.s_nom_min >= ns[2030].lines.s_nom_opt - 1e-3).all()
    expect: '2030''s optimised line capacity is 2050''s floor — grid expansion is
      irreversible along the pathway

      '
- model: pypsa-earth
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-08-01'
  execution:
  - kind: config
    key: foresight
    value: myopic
    note: 'activates the Snakefile''s myopic branch: add_existing_baseyear (first
      horizon) and add_brownfield ride the SECTOR chain — only it carries the {planning_horizons}
      wildcard on earth.

      '
  - kind: config
    key: scenario.planning_horizons
    value:
    - 2030
    - 2050
    note: '2030 sector prenetwork is prebuilt in the baseline; the 2050 prenetwork
      chain (energy totals, demand, cops) is pure compute from cached data.

      '
  - kind: config
    key: sector.land_transport_fuel_cell_share
    value:
      AB_2030: 0.01
      AB_2050: 0.05
    note: prepare_energy_totals/prepare_sector_network index these dicts by demand+horizon
      (AB_2050) — defaults stop at 2030 (KeyError otherwise).
  - kind: config
    key: sector.land_transport_electric_share
    value:
      AB_2030: 0.01
      AB_2050: 0.4
    note: EV share rising 1% -> 40% across the pathway — visible in the capacity-expansion
      ledger.
  - kind: config
    key: sector.shipping_hydrogen_share
    value:
      AB_2030: 0.05
      AB_2050: 0.3
  - kind: code
    where: scripts/solve_network.py:prepare_network
    do: 'guard the myopic branch: call add_land_use_constraint(n) only when "location"
      is in n.buses.columns — under foresight myopic the POWER re-solve runs this
      same script without bus locations or a planning_horizons wildcard and crashes
      otherwise (issue #11). Sector postnetworks keep the constraint.

      '
  - kind: invocation
    note: 'bundle invocation: extra_targets + verify_networks (stage solved) = the
      profile''s prenetworks template, prenetworks -> postnetworks, _{export.h2export}export
      appended before .nc.

      '
  invalidates:
  - add_existing_baseyear
  - add_brownfield
  - solve_network_myopic
  budget:
    jobs: 55
    class: hours
  success_metric:
  - name: two-horizons-solved
    needs: solved
    check: len([h for h in ns if h]) == 2
    expect: one solved sector postnetwork per horizon (2030 and 2050)
  - name: cohort-carried
    needs: solved
    check: ((n.generators.build_year == 2030) & ~n.generators.p_nom_extendable & (n.generators.p_nom
      > 0)).any() or ((n.links.build_year == 2030) & ~n.links.p_nom_extendable & (n.links.p_nom
      > 0)).any()
    expect: '2030-optimised assets fixed into the 2050 network by add_brownfield

      '
  - name: transmission-locked
    needs: solved
    check: (ns[2050].lines.s_nom_min >= ns[2030].lines.s_nom_opt - 1e-3).all()
    expect: 2030's line build is 2050's floor
notes: 'Substrate: [[existing-fleet]] ingestion feeds the baseyear cohorts. Earth
  caveat (negative knowledge): add_heating_capacities_installed_before_ baseyear is
  defined but its call is commented out in add_existing_baseyear''s __main__ — the
  earth pathway carries POWER cohorts only; do not promise heating-stock aging on
  earth. Cost files are per horizon (retrieve_ rules are deny-gated): eur pre-caches
  data/costs/archive/v0.14.0/costs_{2025..2050 in 5y steps}.csv — any such milestone
  is a legal horizon; earth has resources/mexico-power/costs_2050.csv only
  (ceremonies 2026-08-01/04). Each horizon solves with its OWN cost year; only add_existing_baseyear
  values existing stock at first-horizon costs. Perfect-foresight counterpart: [[pathway-perfect]]. Eur exception to the fixed carry-over: with [[industry-heat-endogenous]] on, add_brownfield carries the inherited industry_t band links shrink-only (p_nom_extendable with p_nom_max = built capacity, p_nom_min 0, capital cost = fixed O&M only), so a band demand that falls in a later horizon never collides with the must-run floor of fixed capacity; every other carried cohort stays fixed and non-extendable. Eur industry plants: with [[industry-routes-endogenous]] on (sector.endogenous_sectors.enable), the first horizon also seeds the existing industry fleet — the horizon-free rule rules/build_sector.smk:build_industry_plants locates the blast furnaces, gas DRI, ammonia and methanol units of the Fraunhofer ISI site database (EU27, GB, NO), the GEM cement tracker plants and data/ammonia_plants.csv elsewhere, and scripts/add_existing_baseyear.py:add_existing_industry adds them as dated non-extendable links (clinker kiln, cement production, gas DRI, BOF, plus Haber-Bosch with sector.ammonia and grey methanol with sector.methanol) grouped by existing_capacities.grouping_years_industry. Blast furnaces retire at their pledged phase-out year plus sector.steel_bof.pledge_delay (pledge true, the default) or at the catalogue lifetime (pledge false), so the BOF phase-out is a pledge assumption the study states, not a model outcome; cement capacities are GEM nominal capacities, above actual production.

  '
