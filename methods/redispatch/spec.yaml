id: redispatch
title: redispatch — nodal repair of a zonal market schedule, priced
family: markets-and-prices
what: 'The stage-2 of the two-stage market simulation (Thomassen et al. 2025 §3.4):
  the zonal market outcome is FIXED; the TSO buys upward/downward deviations so physical
  flows respect line ratings, minimising remedial cost plus a volume penalty, with
  cross-zonal countertrading capped. The wedge between stage 1 and stage 2 (redispatch
  volume, cost) is the answer to "what does the zonal design cost us". Standalone
  it clears its own NTC stage 1; set stage1: fbmc to consume the [[flow-based-market-coupling]]
  artifact instead.

  '
when_to_use:
- redispatch volume and cost of a zonal market
- congestion management cost quantification
- two-stage zonal-clearing-then-nodal-redispatch study
- countertrading / cross-zonal remedial action
models:
- model: pypsa-eur
  version_anchor:
    ref: a6c45e5a2d926ba9a5566cba24d905cff9f89939
    date: '2026-09-09'
  execution:
  - kind: config
    key: redispatch.snapshots
    value:
      start: '2013-03-01'
      end: '2013-03-02'
    note: 'one day of operations, sliced inside the redispatch rule — never via the
      global snapshots key (pinned).

      '
  - kind: config
    key: redispatch.line_scaling
    value: 0.5
    note: 'congestion-inducing derate for the test day; without binding lines the
      stage is a no-op and proves nothing.

      '
  - kind: config
    key: redispatch.cross_zonal_cap
    value: 0.3
    note: 'JRC reference: at most 30% of remedial volume from outside the congested
      zones; unbounded countertrading understates cost.

      '
  - kind: payload
    note: 'redispatch_core.py + solve_redispatch.py + rules/redispatch.smk; patches
      Snakefile include + redispatch: config section. File-disjoint from the FBMC
      payload — the two compose.
      Rebased on a6c45e5 (2026-09-10), not yet re-run against an a6c45e5 install.

      '
  - kind: invocation
    note: 'extra target results/{run.name}/redispatch/composed_{planning_horizons}_rd.nc;
      replace_verify_networks -> solved = that artifact
      (post-redispatch dispatch + meta).

      '
  invalidates:
  - solve_redispatch
  budget:
    jobs: 2
    class: minutes
  success_metric:
  - name: stage1-infeasible
    needs: solved
    check: n.meta['redispatch']['overload_pre_mwh'] > 0
    expect: the zonal schedule violates line ratings — the wedge exists
  - name: nonzero-redispatch
    needs: solved
    check: n.meta['redispatch']['volume_mwh'] > 0
    expect: the stage bound — zero volume on a congested day is the no-op failure
  - name: feasibility-restored
    needs: solved
    check: n.meta['redispatch']['overload_post_mwh'] < 1.0
    expect: post-redispatch flows respect every line rating
  - name: balanced-actions
    needs: solved
    check: "abs(n.meta['redispatch']['volume_up_mwh']\n    - n.meta['redispatch']['volume_dn_mwh'])\
      \ < 1.0\n"
    expect: upward and downward activations balance hourly energy
  - name: bus-reallocation
    needs: solved
    check: n.meta['redispatch']['top_up_bus'] != n.meta['redispatch']['top_down_bus']
    expect: generation relocated across buses — congestion relief moved injections,
      not merit order
  - name: countertrading-capped
    needs: solved
    check: 'n.meta[''redispatch''][''cross_zonal_share''] <= n.meta[''redispatch''][''cross_zonal_cap'']
      + 1e-6

      '
    expect: remedial volume outside congested zones respects the cap
- model: pypsa-earth
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-08-02'
  execution:
  - kind: config
    key: redispatch.snapshots
    value:
      start: '2013-03-01'
      end: '2013-03-02'
    note: 'one day inside the ghana baseline''s prebuilt week (2013-03-01..07); sliced
      in-rule, global snapshots stay pinned.

      '
  - kind: config
    key: redispatch.line_scaling
    value: 0.3
    note: 'at 0.5 Ghana''s radial grid does not yet overload physically (the NTC haircut
      binds first); 0.3 makes the intra-zonal line bind — the market-blind congestion
      this stage exists to price.

      '
  - kind: config
    key: redispatch.cross_zonal_cap
    value: 0.3
    note: JRC reference countertrading cap.
  - kind: payload
    note: 'earth tree of the same core: redispatch_core.py + solve_redispatch.py +
      rules/redispatch.smk (included via Snakefile patch); redispatch: section into
      the root config.default.yaml.

      '
  - kind: invocation
    note: 'extra target results/{run.name}/redispatch/elec_s{scenario.simpl}_ {scenario.clusters}_ec_l{scenario.ll}_{scenario.opts}_rd.nc;
      replace_verify_networks -> solved = that artifact.

      '
  invalidates:
  - solve_redispatch
  budget:
    jobs: 2
    class: minutes
  success_metric:
  - name: stage1-infeasible
    needs: solved
    check: n.meta['redispatch']['overload_pre_mwh'] > 0
    expect: the zonal schedule violates line ratings — the wedge exists
  - name: nonzero-redispatch
    needs: solved
    check: n.meta['redispatch']['volume_mwh'] > 0
    expect: the stage bound — zero volume on a congested day is the no-op failure
  - name: feasibility-restored
    needs: solved
    check: n.meta['redispatch']['overload_post_mwh'] < 1.0
    expect: post-redispatch flows respect every line rating
  - name: balanced-actions
    needs: solved
    check: 'abs(n.meta[''redispatch''][''volume_up_mwh''] - n.meta[''redispatch''][''volume_dn_mwh''])
      < 1.0

      '
    expect: upward and downward activations balance hourly energy
  - name: bus-reallocation
    needs: solved
    check: n.meta['redispatch']['top_up_bus'] != n.meta['redispatch']['top_down_bus']
    expect: congestion relief moved injections across buses, not merit order
  - name: countertrading-capped
    needs: solved
    check: 'n.meta[''redispatch''][''cross_zonal_share''] <= n.meta[''redispatch''][''cross_zonal_cap'']
      + 1e-6

      '
    expect: remedial volume outside congested zones respects the cap
notes: 'beta defaults to ''auto'' = max marginal-cost spread + 1 (Thomassen''s rule):
  volume must dominate or the stage does economic re-optimization (un-shedding arbitrage,
  merit swaps) and reports congestion as free. total_cost = market_cost + rd_cost
  is the number to compare against a nodal benchmark; the artifact carries both in
  n.meta[''redispatch'']. With stage1: fbmc the zone map and window come from the
  FBMC artifact''s meta (authoritative) and the bundle must carry BOTH method_payload
  changes; the DAG wires the fbmc artifact in as rule input. Storage frozen; line_scaling
  is a declared test derate. On earth, split zones are latitude halves, not market
  zones — earth ships no bidding-zone data.

  '
