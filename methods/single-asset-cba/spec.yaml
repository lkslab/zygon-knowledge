  - name: asset-landed
    needs: solved
    check: ('zygon-cba-mx01-hvdc' in nv['pint-mx01-hvdc'].links.index) and ('zygon-cba-mx01-hvdc'
      not in nv['ref'].links.index) and float(nv['toot-mx0-nuclear'].generators.loc['MX0
      0 nuclear', 'p_nom']) == 0.0 and float(nv['ref'].generators.loc['MX0 0 nuclear',
      'p_nom']) > 0
    expect: the PINT asset exists only in its variant; the TOOT asset is taken out
