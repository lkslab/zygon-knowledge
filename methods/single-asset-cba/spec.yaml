  - name: asset-fixed-capex-excluded
    needs: solved
    check: (not bool(nv['pint-mx01-hvdc'].links.loc['zygon-cba-mx01-hvdc', 'p_nom_extendable']))
      and float(nv['pint-mx01-hvdc'].links.loc[ 'zygon-cba-mx01-hvdc', 'capital_cost'])
      == 0.0 and (not bool(nv['toot-mx0-nuclear'].generators.loc['MX0 0 nuclear',
      'p_nom_extendable']))
    expect: the assessed asset is capacity-fixed with zero counted capex — guideline
      B1 semantics, mechanically
  - name: sew-sign
    needs: solved
    check: (float(nv['ref'].objective) - float(nv['pint-mx01-hvdc'].objective) >=
      -1e-4 * abs(float(nv['ref'].objective))) and (float(nv['toot-mx0-nuclear'].objective)
      - float(nv['ref'].objective) >= -1e-4 * abs(float(nv['ref'].objective)))
    expect: 'LP bounds for the zero-capex asset variants: a free fixed asset cannot
      raise cost (PINT), taking one out cannot lower it (TOOT); demand variant excluded'
  - name: demand-variant-landed
    needs: solved
    check: bool(np.allclose(nv['pint-mx-demand-up'].loads_t.p_set[['MX0 0', 'MX1 0',
      'MX2 0', 'MX3 0']].values, 1.1 * nv['ref'].loads_t.p_set[['MX0 0', 'MX1 0',
      'MX2 0', 'MX3 0']].values, rtol=1e-9)) and float(nv['pint-mx-demand-up'].objective)
      >= float(nv['ref'].objective) * (1 - 1e-4)
    expect: the scaled load series is exactly 1.1x the reference's and serving the
