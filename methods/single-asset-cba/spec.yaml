id: single-asset-cba
title: single-asset CBA — TOOT/PINT run set against a fixed reference grid
family: grid-and-security
what: 'ENTSO-E CBA-guideline project assessment: solve the system WITH and WITHOUT
  one intervention against a fixed reference grid and monetise the delta. Directions:
  PINT (put in) and TOOT (taken out). The intervention is component-generic — a line,
  an HVDC link, a plant, storage, a composite production pathway (e.g. green steel
  = bus + conversion link + load), or a demand change (set/scale reach time-varying
  series). Supply assets are capacity-fixed with zero counted capex, their own cost
  compared off-model. Per variant vs reference: B1 SEW system-cost delta, B2 CO2 variation,
  B3 RES integration.

  '
when_to_use:
- cost-benefit analysis of a specific project, asset, or intervention
- is this line / plant / interconnector worth building — with/without counterfactual
- TYNDP or PCI style project assessment (PINT / TOOT)
- effect of a production pathway (e.g. green steel) or a demand change vs without
  it
models:
- model: pypsa-eur
  version_anchor:
    ref: 6128bf7effbe7243bcc46b2770d04cebe45613a5
    date: '2026-10-26'
  execution:
  - kind: config
    key: zygon_cba
    value:
      reference: ref
      variants:
        ref: []
        pint-gbie-hvdc:
        - op: add
          component: links
          name: zygon-cba-gbie-hvdc
          params:
            bus0: GB0 1AC
            bus1: IE1 0AC
            carrier: DC
            p_nom: 2000
            p_nom_extendable: false
            p_min_pu: -1
            efficiency: 1.0
            capital_cost: 0.0
            marginal_cost: 0.0
        toot-gb0-nuclear:
        - op: zero
          component: generators
          where:
            index: GB0 0AC nuclear
        pint-gbie-demand-up:
        - op: scale
          component: loads
          where:
            carrier: electricity
          attr: p_set
          value: 1.1
      labels:
      - ref
      - pint-gbie-hvdc
      - toot-gb0-nuclear
      - pint-gbie-demand-up
      networks:
      - results/baseline/cba/ref/solved_2050.nc
      - results/baseline/cba/pint-gbie-hvdc/solved_2050.nc
      - results/baseline/cba/toot-gb0-nuclear/solved_2050.nc
      - results/baseline/cba/pint-gbie-demand-up/solved_2050.nc
      indicators:
      - b1_sew
      - b2_co2
      - b3_res
    note: 'labels carry direction (pint-/toot-, enforced). Verification set: free
      2 GW GB-IE link in, fixed GB0 nuclear out, electricity demand x1.1 — a real
      study names its own intervention.

      '
  - kind: payload
    note: 'rules/zygon_cba.smk + build_cba_network.py + zygon_cba_collect.py; solve_cba_network
      mirrors the model''s own solve_network rule, running the model''s own solve_network.py; ships the
      zygon_cba: config.yaml fragment, staged into the submission directory and
      included through custom_rules.
      Rebased on a6c45e5 (2026-09-10), not yet re-run against an a6c45e5 install.

      '
  - kind: invocation
    note: 'extra_targets results/zygon_cba/{zygon_cba.indicators}.csv; verify_networks:
      solved = {zygon_cba.networks} (fans out one per variant) + collected = the indicator
      CSVs.

      '
  invalidates:
  - build_cba_network
  - solve_cba_network
  - zygon_cba_collect
  budget:
    jobs: 10
    class: hour
  success_metric:
  - name: cba-pair-complete
    needs: solved
    check: set(collected['b1_sew']['network']) == {'pint-gbie-demand-up', 'ref', 'toot-gb0-nuclear',
      'pint-gbie-hvdc'} and set(collected['b1_sew']['network']) <= set(nv)
    expect: the reference plus PINT, TOOT and demand-scale variants all solved and
      collected (labels read from the run's own output, not assumed)
  - name: asset-landed
    needs: solved
    check: ('zygon-cba-gbie-hvdc' in nv['pint-gbie-hvdc'].links.index) and ('zygon-cba-gbie-hvdc'
      not in nv['ref'].links.index) and float(nv['toot-gb0-nuclear'].generators.loc['GB0
      0AC nuclear', 'p_nom']) == 0.0 and float(nv['ref'].generators.loc['GB0 0AC nuclear',
      'p_nom']) > 0
    expect: the PINT asset exists only in its variant; the TOOT asset is taken out
      of its variant and present in the reference
  - name: asset-fixed-capex-excluded
    needs: solved
    check: (not bool(nv['pint-gbie-hvdc'].links.loc['zygon-cba-gbie-hvdc', 'p_nom_extendable']))
      and float(nv['pint-gbie-hvdc'].links.loc[ 'zygon-cba-gbie-hvdc', 'capital_cost'])
      == 0.0 and (not bool(nv['toot-gb0-nuclear'].generators.loc['GB0 0AC nuclear',
      'p_nom_extendable']))
    expect: the assessed asset is capacity-fixed with zero counted capex — guideline
      B1 semantics, mechanically
  - name: sew-sign
    needs: solved
    check: (float(nv['ref'].objective) - float(nv['pint-gbie-hvdc'].objective) >=
      -1e-4 * abs(float(nv['ref'].objective))) and (float(nv['toot-gb0-nuclear'].objective)
      - float(nv['ref'].objective) >= -1e-4 * abs(float(nv['ref'].objective)))
    expect: 'LP bounds for the zero-capex asset variants: a free fixed asset cannot
      raise cost (PINT), taking one out cannot lower it (TOOT); demand variant excluded'
  - name: demand-variant-landed
    needs: solved
    check: bool(np.allclose(nv['pint-gbie-demand-up'].loads_t.p_set[list(nv['ref'].loads.index[nv['ref'].loads.carrier
      == 'electricity'])].values, 1.1 * nv['ref'].loads_t.p_set[list(nv['ref'].loads.index[nv['ref'].loads.carrier
      == 'electricity'])].values, rtol=1e-9)) and float(nv['pint-gbie-demand-up'].objective)
      >= float(nv['ref'].objective) * (1 - 1e-4)
    expect: the scaled load series is exactly 1.1x the reference's and serving the
      extra inelastic demand cannot cheapen the system
  - name: b1-is-objective-delta
    needs: solved
    check: all(abs(float(collected['b1_sew'].set_index('network')['value'][v]) - ((float(nv['ref'].objective)
      - float(nv[v].objective)) if v.startswith('pint-') else (float(nv[v].objective)
      - float(nv['ref'].objective)))) <= 1e-6 * abs(float(nv['ref'].objective)) for
      v in set(collected['b1_sew']['network']) - {'ref'})
    expect: collected B1 equals the direction-signed objective delta — the CSV is
      the networks' numbers
  - name: indicators-complete
    needs: solved
    check: set(collected) >= {'b1_sew', 'b2_co2', 'b3_res'} and all({'network', 'direction',
      'value'} <= set(collected[q].columns) and collected[q]['value'].notna().all()
      for q in ('b1_sew', 'b2_co2', 'b3_res'))
    expect: one long-format CSV per indicator (B1/B2/B3), each carrying network/direction/value
      fully populated
- model: pypsa-earth
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-08-07'
  execution:
  - kind: config
    key: zygon_cba
    value:
      reference: ref
      variants:
        ref: []
        pint-mx01-hvdc:
        - op: add
          component: links
          name: zygon-cba-mx01-hvdc
          params:
            bus0: MX0 0
            bus1: MX1 0
            carrier: DC
            p_nom: 1000
            p_nom_extendable: false
            p_min_pu: -1
            efficiency: 1.0
            capital_cost: 0.0
            marginal_cost: 0.0
        toot-mx0-nuclear:
        - op: zero
          component: generators
          where:
            index: MX0 0 nuclear
        pint-mx-demand-up:
        - op: scale
          component: loads
          where:
            index:
            - MX0 0
            - MX1 0
            - MX2 0
            - MX3 0
          attr: p_set
          value: 1.1
      labels:
      - ref
      - pint-mx01-hvdc
      - toot-mx0-nuclear
      - pint-mx-demand-up
      networks:
      - results/mexico-power/cba/ref/elec_s_4_ec_lcopt_Co2L.nc
      - results/mexico-power/cba/pint-mx01-hvdc/elec_s_4_ec_lcopt_Co2L.nc
      - results/mexico-power/cba/toot-mx0-nuclear/elec_s_4_ec_lcopt_Co2L.nc
