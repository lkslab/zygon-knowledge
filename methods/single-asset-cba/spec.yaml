      - float(nv['ref'].objective)))) <= 1e-6 * abs(float(nv['ref'].objective)) for
      v in set(collected['b1_sew']['network']) - {'ref'})
    expect: collected B1 equals the direction-signed objective delta — the CSV is
      the networks' numbers
  - name: indicators-complete
    needs: solved
    check: set(collected) >= {'b1_sew', 'b2_co2', 'b3_res'} and all({'network', 'direction',
      'value'} <= set(collected[q].columns) and collected[q]['value'].notna().all()
      for q in ('b1_sew', 'b2_co2', 'b3_res'))
    expect: one long-format CSV per indicator (B1/B2/B3), each carrying network/direction/value
      fully populated
notes: 'Guideline caveats: TOOT and PINT are order-dependent when several projects
  are assessed — each intervention needs its own run set against the SAME reference;
  B6-B8 adequacy/flexibility/stability are out of scope (deterministic LP); the system
  re-optimises around the perturbation, so B1 is a planner''s welfare delta. Under
  a BINDING CO2 cap B2 is ~0 by construction. The sew-sign LP bounds hold only for
  zero-capex asset variants (PINT assets ship capital_cost 0 + non-extendable; TOOT
  targets must be NON-extendable in the reference) — for a demand-side intervention
  B1 is the (negative) cost of serving it, no bound applies. Eur trap: DC links carry
  ''-reversed'' twins — TOOT both. Figures: compare_scenarios.

  '
