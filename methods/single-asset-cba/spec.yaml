      - b2_co2
      - b3_res
    note: 'labels carry direction (pint-/toot-, enforced). Test set: a free 1 GW MX0-MX1
      link in (no native transmission), fixed MX0 nuclear out, all demand x1.1 — a
      real study names its own intervention.

      '
  - kind: payload
    note: 'rules/zygon_cba.smk + build_cba_network.py + zygon_cba_collect.py; solve_cba_network
      reuses the model''s own solve_network.py (multi-scenario''s pattern); patches
      Snakefile + config.

      '
  - kind: invocation
    note: 'extra_targets results/zygon_cba/{zygon_cba.indicators}.csv; verify_networks:
      solved = {zygon_cba.networks} (fans out one per variant) + collected = the indicator
      CSVs.

      '
  invalidates:
  - build_cba_network
  - solve_cba_network
  - zygon_cba_collect
  budget:
    jobs: 38
    class: hour
  success_metric:
  - name: cba-pair-complete
    needs: solved
    check: set(collected['b1_sew']['network']) == {'pint-mx01-hvdc', 'ref', 'pint-mx-demand-up',
      'toot-mx0-nuclear'} and set(collected['b1_sew']['network']) <= set(nv)
    expect: the reference plus PINT, TOOT and demand-scale variants all solved and
