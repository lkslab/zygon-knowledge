id: advanced-biofuels
title: Advanced biofuels (BtL, electrobiofuels, BioSNG, bioH2, biogas upgrading)
summary: >
  Conversion of solid biomass and biogas into drop-in liquid fuels, grid
  gas and hydrogen — with optional carbon capture — plus the legacy
  unsustainable bioliquids that are forced into the oil pool.
when_to_use:
  - "advanced biofuels / second-generation biofuels"
  - "biomass to liquid / BtL"
  - "electrobiofuels / e-biofuels"
  - "BioSNG / biomethane from gasification"
  - "biogas upgrading to grid gas"
  - "biomass-derived hydrogen / bioH2"
  - "biodiesel / bioethanol / bioliquids"
  - "biofuels with carbon capture (BECCS to fuels)"
  - "pypsa-eur carrier names: biomass to liquid, electrobiofuels, BioSNG, biogas to gas, solid biomass to hydrogen, unsustainable bioliquids"
  - "advanced / second-generation biofuels"
  - "biomass-to-liquids (BtL), biodiesel, bioethanol"
  - "biogas upgrading to biomethane"
  - "biomass gasification for hydrogen"
  - "bioenergy with carbon capture (BECCS) fuel routes"
  - "biojet / biokerosene"
  - "known in pypsa-eur as: biomass to liquid, unsustainable bioliquids, electrobiofuels"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        add_biomass wires a rich conversion menu on the nodal solid-biomass
        and biogas buses (potentials from rule build_biomass_potentials,
        JRC ENSPRESO scenario biomass.scenario ENS_Med for biomass.year
        2030, spatially disaggregated to regions). ON by default:
        "biomass to liquid" (sector.biomass_to_liquid, BtL cost row) —
        extendable links solid biomass -> the single EU oil bus, with the
        unconverted biogenic carbon returned to the atmosphere bus;
        "electrobiofuels" (sector.electrobiofuels) — a biomass+H2 hybrid
        Fischer-Tropsch (code comment: "Experimental version - use with
        caution") that uses the BtL-stored carbon share (BtL "C stored" x
        FT costs) to convert MORE of the biogenic carbon into fuel per
        tonne of biomass; and "biogas to gas" upgrading
        (sector.biogas_upgrading — biogas + upgrading cost rows) feeding
        the gas grid with a negative atmosphere coefficient (biogenic
        credit). OFF by default: "biomass to liquid CC"
        (sector.biomass_to_liquid_cc, capture to co2 stored), "BioSNG"
        gasification to grid gas (sector.biosng) and its CC variant
        (sector.biosng_cc), biogas upgrading CC
        (sector.biogas_upgrading_cc), and "solid biomass to hydrogen"
        with capture (sector.bioH2, uses sector.cc_fraction, lifetime
        hardcoded 25). Forced legacy route: whenever unsustainable
        potentials are nonzero, "unsustainable bioliquids" Generators are
        added with e_sum_min = e_sum_max = potential — the model MUST
        consume the whole unsustainable bioliquid potential (priced at the
        "biodiesel crops" fuel cost, converted to the EU oil bus at BtL
        VOM), phasing out via biomass.share_unsustainable_use_retained
        (1.0 in 2020 -> 0 by 2040).
      mechanism: >
        rule prepare_sector_network -> add_biomass (gated by
        sector.biomass), reading biomass_potentials from rule
        build_biomass_potentials (enspreso_biomass_potentials +
        add_unsustainable_potentials, controlled by
        biomass.share_unsustainable_use_retained and
        biomass.share_sustainable_potential_available). Liquid products
        land on the copperplate EU oil bus; gaseous ones on the nodal gas
        buses. Solid biomass moves between regions either as transport
        links (sector.biomass_transport) or via a transport-cost markup
        with a global limit (sector.biomass_spatial, the default).
      not_covered: >
        No distinct bioethanol/biodiesel/biojet carriers and no blending
        mandates — all liquid output is generic oil, fungible with fossil
        and FT fuel (aviation gets it only via the shared pool, see
        e-kerosene-saf). No feedstock classes beyond the ENSPRESO
        categories in biomass.classes (no dedicated energy-crop vs residue
        pricing per technology). No imported liquid biofuels — the only
        import hook is SOLID biomass (sector.solid_biomass_import, default
        off, with an upstream emissions factor). Biomass CHP and boilers
        are covered by combined-heat-and-power / biomass-bioenergy
        recipes; municipal waste by waste-to-energy.
      provenance: "scripts/prepare_sector_network.py:add_biomass; scripts/prepare_sector_network.py:biomass to liquid; scripts/prepare_sector_network.py:electrobiofuels; scripts/prepare_sector_network.py:unsustainable bioliquids; scripts/prepare_sector_network.py:biogas to gas; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
    levers:
      - key: sector.biomass_to_liquid
        effect: "Adds/removes the BtL links (solid biomass -> EU oil)."
        default: "true"
        provenance: "config/config.default.yaml:biomass_to_liquid; scripts/prepare_sector_network.py:biomass to liquid"
      - key: sector.biomass_to_liquid_cc
        effect: "Adds the capture variant (BtL 'CO2 stored' x capture rate to co2 stored, capture capex from the 'biomass CHP capture' row)."
        default: "false"
        provenance: "config/config.default.yaml:biomass_to_liquid_cc; scripts/prepare_sector_network.py:biomass to liquid CC"
      - key: sector.electrobiofuels
        effect: "Adds/removes the biomass+H2 hybrid FT links (higher fuel yield per biomass, consumes nodal H2)."
        default: "true"
        provenance: "config/config.default.yaml:electrobiofuels; scripts/prepare_sector_network.py:electrobiofuels"
      - key: sector.biosng
        effect: "Adds gasification-based 'BioSNG' links (solid biomass -> gas grid); sector.biosng_cc adds the capture variant."
        default: "false (biosng_cc also false)"
        provenance: "config/config.default.yaml:biosng; scripts/prepare_sector_network.py:BioSNG"
      - key: sector.bioH2
        effect: "Adds 'solid biomass to hydrogen' CC links (biomass -> nodal H2, capture share sector.cc_fraction) — a negative-emission H2 route."
        default: "false"
        provenance: "config/config.default.yaml:bioH2; scripts/prepare_sector_network.py:solid biomass to hydrogen"
      - key: sector.biogas_upgrading
        effect: "Adds 'biogas to gas' upgrading links into the grid; sector.biogas_upgrading_cc adds the amine-scrubbing CC variant."
        default: "true (biogas_upgrading_cc false)"
        provenance: "config/config.default.yaml:biogas_upgrading; scripts/prepare_sector_network.py:biogas to gas"
      - key: biomass.share_unsustainable_use_retained
        effect: "Per-horizon share of TODAY'S unsustainable biomass/bioliquid use that is retained — and force-consumed (e_sum_min = e_sum_max); drives the forced bioliquids to zero by 2040."
        default: "1.0 (2020) -> 0 (2040 onward)"
        provenance: "config/config.default.yaml:share_unsustainable_use_retained; scripts/build_biomass_potentials.py:share_unsustainable_use_retained"
      - key: biomass.scenario
        effect: "ENSPRESO potential scenario (ENS_Low / ENS_Med / ENS_High) — the overall sustainable feedstock ceiling; biomass.year picks the reference year."
        default: "ENS_Med (year 2030)"
        provenance: "config/config.default.yaml:scenario; scripts/build_biomass_potentials.py:enspreso_biomass_potentials"
      - key: sector.solid_biomass_import
        effect: "enable: true adds an EU solid biomass import Store at a fixed price/limit with an upstream emissions factor — the only biofuel-adjacent import."
        default: "enable: false (price 54, max_amount 1390 TWh)"
        provenance: "config/config.default.yaml:solid_biomass_import; scripts/prepare_sector_network.py:solid_biomass_import"
      - key: sector.biomass_transport
        effect: "true adds explicit inter-regional solid-biomass transport links with country transport costs; default false uses the biomass_spatial markup + global limit instead."
        default: "false (biomass_spatial: true)"
        provenance: "config/config.default.yaml:biomass_transport; scripts/prepare_sector_network.py:add_biomass"
    boundary:
      - variant: "BtL and electrobiofuels as investment options"
        rung: L0
        note: "both default true"
      - variant: "BtL with carbon capture / BioSNG / bioH2"
        rung: L0
        note: "flip sector.biomass_to_liquid_cc / sector.biosng(_cc) / sector.bioH2"
      - variant: "stop force-consuming unsustainable bioliquids"
        rung: L1
        note: "set biomass.share_unsustainable_use_retained to 0 for all horizons (the generators carry e_sum_min = potential — they are a must-burn, not an option)"
      - variant: "more or less biomass feedstock"
        rung: L1
        note: "biomass.scenario (ENS_Low/Med/High), biomass.year, biomass.classes composition"
      - variant: "biofuel blending mandates or distinct biodiesel/bioethanol carriers"
        rung: L5
        note: "all liquids pool on EU oil; per-fuel carriers + quota constraints are bespoke (custom_extra_functionality for the quota side)"
      - variant: "dedicated biojet route to the aviation bus"
        rung: L2
        note: "re-point (a fraction of) the BtL output from spatial.oil.nodes to spatial.oil.kerosene in add_biomass — the kerosene demand buses exist already"
      - variant: "import liquid biofuels"
        rung: L2
        note: "no hook; clone the solid_biomass_import Store/Link pattern onto the EU oil bus with an emissions factor"
      - variant: "regional biofuel plants with capacity caps"
        rung: L2
        note: "set p_nom_max on the respective n.add calls in add_biomass (links are nodal via spatial.biomass.nodes)"
      - variant: "custom potentials for a specific country/region"
        rung: L3
        note: "override the biomass_potentials csv resource (rule build_biomass_potentials output) or adjust biomass.classes"
    where:
      - change: "all conversion links (BtL, BtL CC, electrobiofuels, BioSNG, bioH2, biogas upgrading, forced bioliquids)"
        anchor: "scripts/prepare_sector_network.py::add_biomass"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "feedstock potentials (sustainable + unsustainable, spatial disaggregation)"
        anchor: "scripts/build_biomass_potentials.py::enspreso_biomass_potentials / ::add_unsustainable_potentials (rule build_biomass_potentials)"
        provenance: "scripts/build_biomass_potentials.py:add_unsustainable_potentials; rules/build_sector.smk:build_biomass_potentials"
      - change: "biomass spatial handling (transport links vs markup)"
        anchor: "scripts/prepare_sector_network.py::add_biomass (biomass_transport / biomass_spatial branches) and ::define_spatial (spatial.biomass)"
        provenance: "scripts/prepare_sector_network.py:define_spatial"
      - change: "cost rows"
        anchor: "scripts/process_cost_data.py::prepare_costs (rows 'BtL', 'electrobiofuels', 'BioSNG', 'biogas', 'biogas upgrading', 'solid biomass to hydrogen', 'biodiesel crops')"
        provenance: "scripts/process_cost_data.py:prepare_costs"
    data_dependencies:
      - input: "JRC ENSPRESO biomass potentials + eurostat energy balances (unsustainable shares)"
        required_for: "all feedstock ceilings and the forced bioliquid volumes"
        availability: "retrieved by the workflow (rule build_biomass_potentials inputs); European coverage"
      - input: "cost rows 'BtL' (incl. 'CO2 stored', 'C stored', capture rate), 'electrobiofuels', 'BioSNG', 'biogas', 'biogas upgrading', 'biodiesel crops', 'fuelwood'"
        required_for: "conversion economics and carbon splits"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "biomass transport cost csv (per-country EUR/km/MWh)"
        required_for: "biomass_transport links or the biomass_spatial markup"
        availability: "exists by default (workflow data)"
      - input: "EU oil bus / nodal gas buses / nodal H2 buses as product destinations"
        required_for: "BtL + electrobiofuels / BioSNG + biogas / bioH2 respectively"
        availability: "exists by default in sector runs"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        GASEOUS and HYDROGEN bio-routes exist; LIQUID biofuels do not. With sector.enable.biomass
        (default true), add_biomass creates per-node "biogas" and "solid biomass" buses and Stores
        whose energy comes from two config totals (sector.biogas_potential,
        sector.solid_biomass_potential, TWh/a for the WHOLE modelled area, split equally across
        nodes — flagged in-code as a TODO for real potentials), a "biogas to gas" upgrading Link
        into the natural gas bus (credits gas CO2 intensity to atmosphere, "biogas upgrading"
        costs), a "biomass EOP" electricity link, optional inter-node "solid biomass transport"
        links, and (with district heating + sector.chp) solid-biomass CHP incl. a CC variant.
        Additionally, add_hydrogen offers non-default production_technologies "Solid biomass steam
        reforming", "Biomass gasification", "Biomass gasification CC" (solid biomass -> H2, tagged
        "green H2" under hydrogen_colors). Industry can burn solid biomass ("solid biomass for
        industry" spatial carriers).
      mechanism: >
        scripts/prepare_sector_network.py:add_biomass (buses, stores, upgrading, transport, CHP);
        scripts/prepare_sector_network.py:add_hydrogen (biomass-to-H2 tech_params entries).
      not_covered: >
        No liquid biofuel production anywhere: grep for "biofuel"/"BtL"/"biodiesel"/"bioethanol"
        across scripts and config matches only a powerplantmatching fueltype string in
        build_powerplants.py ("biofuel" -> "Bioenergy" mapping for existing power plants). There is
        no biomass -> oil-bus link, no biokerosene, no ethanol carrier. Biomass potentials are
        config scalars, not geodata; no sustainability tiers or feedstock classes (single "solid
        biomass" + "biogas" carriers); no anaerobic-digestion feedstock modelling. BtL,
        biomass-to-methanol and BioSNG COST rows do exist in the retrieved technology-data file
        but nothing consumes them.
      provenance: "scripts/prepare_sector_network.py:add_biomass"
    levers:
      - key: sector.enable.biomass
        effect: Master switch for the biomass chain.
        default: "true"
        provenance: "config.default.yaml:biomass; Snakefile:prepare_sector_network"
      - key: sector.biogas_potential
        effect: Total biogas resource (TWh/a, whole modelled area) available for upgrading.
        default: "0.5"
        provenance: "config.default.yaml:biogas_potential; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.solid_biomass_potential
        effect: Total solid biomass resource (TWh/a, whole modelled area).
        default: "40"
        provenance: "config.default.yaml:solid_biomass_potential; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_transport
        effect: Enables inter-node solid biomass transport links (and per-node biomass buses instead of one Earth bus).
        default: "true"
        provenance: "config.default.yaml:biomass_transport; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.biomass_transport_default_cost
        effect: Fallback EUR/km/MWh transport cost for countries missing from the transport-cost csv.
        default: "0.1"
        provenance: "config.default.yaml:biomass_transport_default_cost; scripts/prepare_sector_network.py:add_biomass"
      - key: sector.hydrogen.production_technologies
        effect: Add "Solid biomass steam reforming" / "Biomass gasification" / "Biomass gasification CC" to unlock bio-hydrogen.
        default: '["H2 Electrolysis", "SMR", "SMR CC"] (biomass routes not included)'
        provenance: "config.default.yaml:production_technologies; scripts/prepare_sector_network.py:add_hydrogen"
      - key: sector.cc
        effect: Enables CC variants (biomass CHP CC; required spatial industry-CC carriers).
        default: "true"
        provenance: "config.default.yaml:cc_fraction; scripts/prepare_sector_network.py:add_biomass"
    boundary:
      - variant: "Biogas upgrading to grid gas"
        rung: L0
        note: Default on; volume limited by sector.biogas_potential.
      - variant: "Raise/localise biomass availability"
        rung: L1
        note: Config totals; but SPATIALLY resolved potentials are L3 — the equal split across nodes is hardcoded in add_biomass, so real geodata needs both a data source and a small edit there (L2+L3).
      - variant: "Biomass-derived hydrogen (incl. BECCS-H2)"
        rung: L1
        note: Extend production_technologies with the biomass entries; cost rows ship with technology-data.
      - variant: "Liquid biofuels (BtL diesel/kerosene into the oil bus)"
        rung: L4
        note: New link solid biomass -> spatial.oil.nodes using the existing "BtL" cost row, mirroring H2_liquid_fossil_conversions; plus a config flag and main-block hook. No new external data strictly required.
      - variant: "Bioethanol / biodiesel as distinct carriers with blending mandates"
        rung: L5
        note: New carriers, demand splits in transport, and quota constraints — none of the structure exists.
      - variant: "Feedstock-differentiated sustainable biomass classes"
        rung: L5
        note: Single biomass carrier today; classes need new carriers/buses and potential data.
    where:
      - change: "Biomass buses, potentials, upgrading, transport, CHP"
        anchor: "scripts/prepare_sector_network.py:add_biomass"
        provenance: "scripts/prepare_sector_network.py:add_biomass"
      - change: "Bio-hydrogen production entries"
        anchor: "scripts/prepare_sector_network.py:add_hydrogen (tech_params biomass entries)"
        provenance: "scripts/prepare_sector_network.py:add_hydrogen"
      - change: "BtL link template (multi-bus synthesis link into oil bus)"
        anchor: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
        provenance: "scripts/prepare_sector_network.py:H2_liquid_fossil_conversions"
    data_dependencies:
      - input: "sector.biogas_potential / sector.solid_biomass_potential config scalars (no external dataset)"
        required_for: "all biomass routes"
        availability: "exists by default; region-realistic values are the user's responsibility (defaults are placeholders for the whole area)"
      - input: "data/temp_hard_coded/biomass_transport_costs.csv"
        required_for: "biomass_transport: true"
        availability: "exists in repo; countries missing from it fall back to biomass_transport_default_cost"
      - input: "technology-data costs csv rows: biogas upgrading, biomass EOP, central solid biomass CHP, H2 production biomass gasification (CC), BtL (unused but present)"
        required_for: "existing routes and the L4 BtL variant"
        availability: "must be built (rule retrieve_cost_data); rows confirmed in built costs file"
