id: gas-power-plants
title: Gas power plants (OCGT / CCGT)
summary: >
  Natural-gas-fired power stations — open-cycle (OCGT) peakers and combined-cycle
  (CCGT) plants — as dispatchable thermal generation, with an existing fleet,
  greenfield expansion, and (in sector runs) explicit fuel supply from the gas
  network.
when_to_use:
  - "add gas power plants"
  - "gas turbines / gas peakers"
  - "OCGT / CCGT capacity expansion"
  - "model existing gas-fired fleet"
  - "remove gas / gas phase-out"
  - "limit gas generation or gas fuel use"
  - "change gas fuel price or gas plant efficiency"
  - "natural gas in the power mix"
  - "backup generation for renewables"
  - "unit commitment / ramping for gas plants"
  - "gas-to-power in sector-coupled runs"
  - "pypsa-eur carrier names: OCGT, CCGT, allam gas, H2 turbine"
  - "gas-fired power in sector-coupled runs (gas bus, fuel supply)"
  - "known in pypsa-eur as: OCGT, OCGT marginal, OCGT-heat, CCGT, CCGT marginal, allam, gas-to-power/heat"
models:
  - model: pypsa-eur
    version_anchor: {ref: "849c8858d2536ccf8eed0c2e838d22a474a7ee5d", date: "2026-07-23"}
    out_of_box:
      covers: >
        Fully covered on both fleet and expansion side. Electricity workflow:
        "OCGT" and "CCGT" are both in electricity.conventional_carriers AND both
        in electricity.extendable_carriers.Generator by default, so the existing
        fleet (from the powerplantmatching database via rule build_powerplants,
        where fueltype "Natural Gas" rows are re-labelled OCGT/CCGT by
        replace_natural_gas_technology and carrier_dict in
        load_and_aggregate_powerplants) is attached as Generators with
        p_nom_min = p_nom, and the same carriers are simultaneously extendable.
        rule process_cost_data copies the "gas" cost row's fuel price and CO2
        intensity onto the OCGT and CCGT rows (prepare_costs), so marginal cost
        = VOM + gas fuel / efficiency and CO2 policies bind on gas dispatch.
        Optional per-carrier unit commitment (ramp limits, min up/down time,
        start-up cost, p_min_pu from data/unit_commitment.csv) is wired via
        conventional.unit_commitment, solved as linearized UC
        (solving.options.linearized_unit_commitment). Optional monthly dynamic
        fuel prices from World Bank commodity data via
        conventional.dynamic_fuel_price (rule build_fossil_fuel_prices); in
        attach_conventional_generators the gas price series is assigned to both
        OCGT and CCGT. Sector workflow: remove_elec_base_techs strips the gas
        generators (the pypsa_eur keep-list holds only nuclear among
        conventionals) and add_generation re-adds OCGT and CCGT as extendable
        Links at EVERY node (sector.conventional_generation: {OCGT: gas, CCGT:
        gas}), drawing from per-node gas buses (sector.gas_network true) with
        CO2 to "co2 atmosphere" — greenfield siting is unrestricted there. With
        myopic/perfect foresight, add_existing_baseyear rebuilds the existing
        OCGT/CCGT fleet as gas->AC Links with build_year and lifetime per
        grouping year (add_power_capacities_installed_before_baseyear).
      mechanism: >
        rule build_powerplants -> powerplants_s_{clusters}.csv; rule
        add_electricity runs scripts/add_electricity.py whose
        attach_conventional_generators adds fleet + extendable candidates with
        costs from rule process_cost_data (scripts/process_cost_data.py::
        prepare_costs); rule prepare_network applies add_co2limit /
        add_gaslimit / add_emission_prices from config switches
        (electricity.co2limit_enable, electricity.gaslimit_enable,
        costs.emission_prices.enable — the Co2L / CH4L / Ep opts wildcards
        merely set these keys via update_config_from_wildcards). Sector: rule
        prepare_sector_network runs add_generation (gas Links per node) after
        add_carrier_buses has created gas buses, supply and stores.
      not_covered: >
        In the electricity workflow, extendable OCGT/CCGT candidates only
        appear at buses that already host a plant of that carrier in the
        powerplantmatching data — greenfield siting at all substations needs
        electricity.everywhere_powerplants (L1, empty by default). No gas power
        plant with carbon capture exists in either workflow as a plain
        generator: capture on gas-to-power is only available in sector runs as
        "urban central gas CHP CC" (see combined-heat-and-power recipe) or as
        the Allam cycle ("allam gas", sector.allam_cycle_gas, default false —
        covered by its own recipe). No hydrogen retrofitting of existing gas
        turbines (an independent extendable "H2 turbine" Link using OCGT costs
        exists in sector runs via sector.hydrogen_turbine, but it is a new
        asset, not a conversion). Unit commitment attributes apply per carrier
        Europe-wide from one CSV — no per-plant or per-country UC data. In the
        electricity-only workflow gas fuel is an unlimited commodity at the
        costs-row price (no supply, import or storage modelling — sector runs
        add all of that, see fossil-fuel-supply and natural-gas-pipelines
        recipes). Methanol-fired OCGT ("OCGT methanol", enabled by default via
        sector.methanol.methanol_to_power.ocgt) is a separate technology, not
        documented here.
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/process_cost_data.py:prepare_costs; scripts/prepare_sector_network.py:add_generation; scripts/build_powerplants.py:replace_natural_gas_technology; scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing gas fleet (remove 'OCGT'/'CCGT' to drop existing gas plants; without them p_nom of any remaining candidates is 0)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, waste, biomass]"
        provenance: "config/config.default.yaml:conventional_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.extendable_carriers.Generator
        effect: "Which gas technologies can be expanded — both OCGT and CCGT are extendable by default (candidates only at buses with existing plants of the same carrier, unless everywhere_powerplants is used)."
        default: "[solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, OCGT, CCGT]"
        provenance: "config/config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.everywhere_powerplants
        effect: "Fueltypes for which zero-capacity plants are placed at ALL substations (add_everywhere_powerplants) — e.g. ['Natural Gas'] gives greenfield OCGT/CCGT expansion candidates at every bus."
        default: "[] (empty)"
        provenance: "config/config.default.yaml:everywhere_powerplants; scripts/build_powerplants.py:add_everywhere_powerplants"
      - key: electricity.powerplants_filter
        effect: "Pandas query on the fleet (DateIn/DateOut) — tighten to retire or exclude gas units by commissioning/retirement year."
        default: "(DateOut > 2025 or DateOut != DateOut) and (DateIn < 2026 or DateIn != DateIn)"
        provenance: "config/config.default.yaml:powerplants_filter; scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.custom_powerplants
        effect: "Pandas query (or true) to inject user rows from data/custom_powerplants.csv — e.g. planned gas plants missing from powerplantmatching."
        default: "false"
        provenance: "config/config.default.yaml:custom_powerplants; scripts/build_powerplants.py:add_custom_powerplants"
      - key: conventional.unit_commitment
        effect: "true attaches committable attributes (ramp limits, min up/down times, start-up cost, p_min_pu) per carrier from data/unit_commitment.csv to OCGT/CCGT (and coal/lignite/nuclear); solved as linearized UC."
        default: "false"
        provenance: "config/config.default.yaml:unit_commitment; scripts/add_electricity.py:attach_conventional_generators"
      - key: conventional.dynamic_fuel_price
        effect: "true replaces the static gas fuel price with a monthly World Bank commodity price series (rule build_fossil_fuel_prices), applied to both OCGT and CCGT marginal costs."
        default: "false"
        provenance: "config/config.default.yaml:dynamic_fuel_price; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.co2limit_enable
        effect: "true adds a CO2 cap GlobalConstraint of electricity.co2limit tCO2/a in the electricity workflow — the main brake on gas dispatch (the 'Co2L' opts wildcard sets this key)."
        default: "false (co2limit: 77500000.0)"
        provenance: "config/config.default.yaml:co2limit_enable; scripts/prepare_network.py:add_co2limit"
      - key: electricity.gaslimit_enable
        effect: "true adds a gas-usage GlobalConstraint of electricity.gaslimit MWh_th/a on the OCGT/CCGT/CHP carriers (the 'CH4L' opts wildcard sets this key)."
        default: "false (gaslimit: false)"
        provenance: "config/config.default.yaml:gaslimit_enable; scripts/prepare_network.py:add_gaslimit"
      - key: costs.emission_prices
        effect: "enable: true adds a static CO2 price (co2, currency/tCO2) to gas marginal costs; dynamic: true uses a daily spot CO2 price series instead (the 'Ep'/'Ept' opts wildcards set these keys)."
        default: "{enable: false, co2: 0.0, dynamic: false, rolling_window: 90}"
        provenance: "config/config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: costs.overwrites
        effect: "Per-technology overwrites of investment/lifetime/FOM/VOM/efficiency/fuel applied in prepare_costs (e.g. {fuel: {gas: 30}, efficiency: {CCGT: 0.58}}); deprecated in favour of the data/custom_costs.csv file (costs.custom_cost_fn)."
        default: "{} (empty)"
        provenance: "config/config.default.yaml:overwrites; scripts/process_cost_data.py:overwrite_costs"
      - key: sector.conventional_generation
        effect: "Sector runs: generator->fuel mapping consumed by add_generation; OCGT and CCGT Links from the gas bus are added at every node. Removing an entry removes that technology from sector networks entirely."
        default: "{OCGT: gas, CCGT: gas}"
        provenance: "config/config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:add_generation"
      - key: solving.constraints.CCL
        effect: "true activates per-country per-carrier capacity min/max from data/agg_p_nom_minmax.csv (solving.agg_p_nom_limits.file) — the hook for national gas build caps/floors."
        default: "false"
        provenance: "config/config.default.yaml:CCL; scripts/solve_network.py:add_CCL_constraints"
    boundary:
      - variant: "run with existing gas fleet plus OCGT and CCGT expansion"
        rung: L0
        note: "default — OCGT/CCGT in both conventional_carriers and extendable_carriers.Generator (note: unlike pypsa-earth, CCGT is extendable by default)"
      - variant: "gas phase-out (no existing plants, no expansion)"
        rung: L1
        note: "remove 'OCGT'/'CCGT' from electricity.conventional_carriers AND extendable_carriers.Generator; for sector runs also empty sector.conventional_generation"
      - variant: "greenfield OCGT/CCGT candidates at every bus (electricity workflow)"
        rung: L1
        note: "electricity.everywhere_powerplants: ['Natural Gas'] places zero-capacity plants at all substations (add_everywhere_powerplants); in sector runs this is already the default via add_generation"
      - variant: "unit commitment (ramping, min up/down, start-up cost)"
        rung: L0
        note: "conventional.unit_commitment: true — carrier-level values from data/unit_commitment.csv, linearized UC in the solver; edit that CSV for different values (L3)"
      - variant: "monthly-varying gas fuel price"
        rung: L0
        note: "conventional.dynamic_fuel_price: true (rule build_fossil_fuel_prices from World Bank data, conventional.fuel_price_rolling_window smoothing)"
      - variant: "cap or force gas capacity per country"
        rung: L1
        note: "solving.constraints.CCL: true + author rows for OCGT/CCGT in data/agg_p_nom_minmax.csv"
      - variant: "limit total gas-fired fuel use (gas budget)"
        rung: L1
        note: "electricity.gaslimit_enable: true + gaslimit in MWh_th (or 'CH4L<TWh>' in scenario.opts); acts on Generators only — in sector runs constrain the gas supply side instead (fossil-fuel-supply recipe)"
      - variant: "carbon cap or carbon price on gas dispatch"
        rung: L1
        note: "electricity.co2limit_enable + co2limit, or costs.emission_prices.enable + co2 (dynamic: true for spot-price series); sector runs use the co2_budget chapter and the co2 atmosphere accounting instead"
      - variant: "override gas fuel price, efficiency or investment cost"
        rung: L1
        note: "costs.overwrites (config, deprecated) or a row in data/custom_costs.csv (costs.custom_cost_fn) — the gas fuel price propagates to both OCGT and CCGT in prepare_costs"
      - variant: "derate availability / set p_max_pu per carrier or per country"
        rung: L1
        note: "add a block under conventional: (e.g. conventional: {OCGT: {p_max_pu: 0.9}}); a CSV path gives country-specific values, applied via conventional_params in attach_conventional_generators (the nuclear block is the template)"
      - variant: "add a planned/missing gas plant"
        rung: L3
        note: "row in data/custom_powerplants.csv + electricity.custom_powerplants: true"
      - variant: "gas power drawing from the real gas network with entry-point-limited supply (sector run)"
        rung: L0
        note: "automatic — add_generation puts OCGT/CCGT Links on per-node gas buses; supply/pipelines per fossil-fuel-supply and natural-gas-pipelines recipes"
      - variant: "CCGT with carbon capture as a utility power plant"
        rung: L2
        note: "no gas+CC power link exists; clone the coal_cc block in add_h2_gas_infrastructure (gas bus0, capture energetics from the 'biomass CHP capture' row at gas CO2 intensity) — the Allam cycle (sector.allam_cycle_gas) is the existing near-substitute, see its own recipe"
      - variant: "retrofit existing gas turbines to hydrogen"
        rung: L5
        note: "not modelled; 'H2 turbine' (sector.hydrogen_turbine, default true) is an independent new-build Link with OCGT costs — coupling it to existing OCGT capacity needs a bespoke constraint"
    where:
      - change: "fleet attachment + extendable candidates + UC attributes + dynamic fuel price assignment"
        anchor: "scripts/add_electricity.py::attach_conventional_generators (rule add_electricity)"
        provenance: "scripts/add_electricity.py:attach_conventional_generators; rules/build_electricity.smk:add_electricity"
      - change: "powerplantmatching Natural Gas -> OCGT/CCGT relabelling; everywhere/custom plants"
        anchor: "scripts/build_powerplants.py::replace_natural_gas_technology / add_everywhere_powerplants / add_custom_powerplants (rule build_powerplants)"
        provenance: "scripts/build_powerplants.py:replace_natural_gas_technology; scripts/build_powerplants.py:add_everywhere_powerplants"
      - change: "gas fuel price + CO2 intensity copied onto OCGT/CCGT rows; cost overwrites"
        anchor: "scripts/process_cost_data.py::prepare_costs and ::overwrite_costs (rule process_cost_data)"
        provenance: "scripts/process_cost_data.py:prepare_costs; scripts/process_cost_data.py:overwrite_costs"
      - change: "CO2 cap / gas budget / emission price in the electricity workflow"
        anchor: "scripts/prepare_network.py::add_co2limit / add_gaslimit / add_emission_prices"
        provenance: "scripts/prepare_network.py:add_gaslimit; scripts/prepare_network.py:add_co2limit"
      - change: "sector greenfield OCGT/CCGT Links from gas buses"
        anchor: "scripts/prepare_sector_network.py::add_generation (consumes sector.conventional_generation)"
        provenance: "scripts/prepare_sector_network.py:add_generation"
      - change: "brownfield gas fleet in myopic/perfect foresight"
        anchor: "scripts/add_existing_baseyear.py::add_power_capacities_installed_before_baseyear (rule add_existing_baseyear)"
        provenance: "scripts/add_existing_baseyear.py:add_power_capacities_installed_before_baseyear"
      - change: "country-wise capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints (solving.constraints.CCL)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
    data_dependencies:
      - input: "powerplantmatching database (fueltype Natural Gas, technologies OCGT/CCGT)"
        required_for: "existing fleet and (without everywhere_powerplants) the siting of extendable candidates"
        availability: "retrieved by the workflow (rule build_powerplants input); good European coverage"
      - input: "cost rows 'OCGT', 'CCGT', 'gas' in the technology-data costs file"
        required_for: "capital/marginal cost, efficiency, lifetime, fuel price, CO2 intensity"
        availability: "exists by default via retrieve_cost_data + rule process_cost_data"
      - input: "data/unit_commitment.csv (columns OCGT, CCGT, coal, lignite, nuclear)"
        required_for: "unit commitment attributes when conventional.unit_commitment is true"
        availability: "exists by default in the repo"
      - input: "monthly_fuel_price.csv from World Bank commodity prices"
        required_for: "conventional.dynamic_fuel_price"
        availability: "must be built (rule build_fossil_fuel_prices, data retrieved by workflow)"
      - input: "data/custom_powerplants.csv"
        required_for: "user-added gas plants"
        availability: "template exists by default; rows user-authored"
      - input: "per-node gas buses with supply (SciGRID-based gas network)"
        required_for: "sector-run OCGT/CCGT fuel input"
        availability: "must be built (rules build_gas_network / build_gas_input_locations / cluster_gas_network); exists by default in sector workflow"
  - model: pypsa-earth
    version_anchor: {ref: "8435f4c8cc05f30088933b37b7db497ff860dc53", date: "2026-07-08"}
    out_of_box:
      covers: >
        Gas power is covered by default on both the fleet and the expansion side.
        "OCGT" and "CCGT" are in electricity.conventional_carriers, so the existing
        fleet comes from the powerplantmatching database (rule build_powerplants;
        fueltype "Natural Gas" with technologies CCGT/OCGT parsed in
        configs/powerplantmatching_config.yaml, fuel_to_lifetime 40 years) and is
        attached by attach_conventional_generators as non-extendable Generators
        aggregated by (bus, carrier, grouping_year). "OCGT" is additionally in
        electricity.extendable_carriers.Generator by default, so extendable OCGT
        candidates are added — but only at buses that already host OCGT plants.
        Marginal cost, capital cost, efficiency and lifetime come from the
        OCGT/CCGT rows of the technology-data costs file; load_costs copies the
        "gas" row's fuel price and CO2 intensity onto both carriers
        (costs.at["OCGT", "fuel"] = costs.at["gas", "fuel"], same for
        co2_emissions), so CO2 caps (Co2L in opts -> add_co2limit) and emission
        prices (Ep -> add_emission_prices) act on gas dispatch. In sector-coupled
        runs, convert_conventional_generators_to_links turns every OCGT/CCGT
        generator into a Link drawing from a per-node gas bus (with CO2 released
        to "co2 atmosphere" via bus2), and add_carrier_buses gives the gas bus an
        extendable supply Generator priced at the gas fuel cost plus an extendable
        Store.
      mechanism: >
        Electricity workflow: rule build_powerplants -> resources/<run>/powerplants.csv;
        rule add_electricity runs scripts/add_electricity.py, whose carrier_dict maps
        powerplantmatching technologies ("ocgt"/"ccgt"/"ccgt, thermal") to the
        OCGT/CCGT carriers and attach_conventional_generators adds fleet plus
        extendable candidates with costs from
        process_cost_data.py::load_costs (rule retrieve_cost_data). Emissions/limits
        are wired in scripts/prepare_network.py (add_co2limit, add_emission_prices,
        add_gaslimit for the CH4L opt). Sector workflow: prepare_sector_network.py
        replaces the generators with gas->AC Links via
        convert_conventional_generators_to_links using the
        sector.conventional_generation mapping (OCGT: gas, CCGT: gas).
      not_covered: >
        CCGT is not extendable by default (only OCGT is in
        electricity.extendable_carriers.Generator); extendable OCGT/CCGT candidates
        are only placed at buses that already host plants of that carrier
        (carrier_buses in attach_conventional_generators) — no greenfield siting at
        arbitrary buses, so regions with no existing gas fleet in powerplantmatching
        get no gas expansion candidates at all. No unit commitment, ramping limits
        or start-up costs; no time-varying availability/outage profiles. No
        Allam-cycle gas turbine and no gas power plant with carbon capture in the
        electricity workflow (capture on gas exists in sector runs only as
        "urban central gas CHP CC" and SMR CC, not as a utility CCGT+CC). No
        hydrogen retrofitting of gas turbines. In the electricity-only workflow gas
        fuel is an unlimited commodity at a fixed price — no gas supply, import or
        extraction modelling (sector runs add per-node gas buses with an extendable
        supply generator and optional GGIT pipeline network data).
      provenance: "scripts/add_electricity.py:attach_conventional_generators; scripts/process_cost_data.py:load_costs; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
    levers:
      - key: electricity.conventional_carriers
        effect: "Include/exclude the existing gas fleet (remove 'OCGT'/'CCGT' to drop existing gas plants)."
        default: "[nuclear, oil, OCGT, CCGT, coal, lignite, geothermal, biomass]"
        provenance: "config.default.yaml:conventional_carriers"
      - key: electricity.extendable_carriers.Generator
        effect: >
          Which gas technologies can be expanded — OCGT is included by default; add
          "CCGT" to allow combined-cycle expansion. Candidates appear only at buses
          with existing plants of the same carrier.
        default: "[solar, onwind, offwind-ac, offwind-dc, OCGT]"
        provenance: "config.default.yaml:extendable_carriers; scripts/add_electricity.py:attach_conventional_generators"
      - key: electricity.powerplants_filter
        effect: "Pandas query on the fleet (DateIn/DateOut) — tightening it retires or excludes gas units by commissioning/retirement year."
        default: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
        provenance: "config.default.yaml:powerplants_filter"
      - key: electricity.custom_powerplants
        effect: "'merge'/'replace' injects user rows from data/custom_powerplants.csv (Fueltype Natural Gas, Technology CCGT/OCGT) — e.g. planned plants missing from powerplantmatching."
        default: "false"
        provenance: "scripts/build_powerplants.py:add_custom_powerplants"
      - key: electricity.agg_p_nom_limits
        effect: >
          Country-wise min/max capacity limits per carrier (CSV at
          data/agg_p_nom_minmax.csv), enforced by add_CCL_constraints when "CCL" is
          in the opts wildcard — the hook for national gas build caps/floors.
        default: "file: data/agg_p_nom_minmax.csv, include_existing: false"
        provenance: "config.default.yaml:agg_p_nom_limits; scripts/solve_network.py:add_CCL_constraints"
      - key: electricity.co2limit
        effect: "Annual CO2 cap (tCO2) applied by add_co2limit when 'Co2L' (no number) is in opts — the main brake on gas dispatch; default opts 'Co2L-3h' uses this value."
        default: "7.75e+7 (European default, needs regional adjustment)"
        provenance: "config.default.yaml:co2limit; scripts/prepare_network.py:add_co2limit"
      - key: costs.emission_prices
        effect: "CO2 price (currency/tCO2) added to gas marginal costs by add_emission_prices when 'Ep' (no number) is in opts."
        default: "co2: 0."
        provenance: "config.default.yaml:emission_prices; scripts/prepare_network.py:add_emission_prices"
      - key: costs.year
        effect: "Selects the technology-data cost year (costs_<year>_elec.csv) from which the OCGT/CCGT/gas rows are taken."
        default: "2030"
        provenance: "config.default.yaml:technology_data_version; scripts/process_cost_data.py:load_costs"
      - key: costs.marginal_cost
        effect: "Per-carrier marginal-cost overwrite applied after load_costs computes VOM + fuel/efficiency — add e.g. OCGT/CCGT entries to force a dispatch cost directly."
        default: "entries for solar/onwind/offwind/hydro/H2/battery only (no gas entries)"
        provenance: "config.default.yaml:marginal_cost; scripts/process_cost_data.py:load_costs"
      - key: sector.conventional_generation
        effect: "Sector runs: generator-to-fuel-carrier mapping used when converting OCGT/CCGT generators to Links from the gas bus; removing an entry keeps that carrier as a plain generator."
        default: "OCGT: gas, CCGT: gas, oil: oil, coal: coal, lignite: lignite, biomass: biomass"
        provenance: "config.default.yaml:conventional_generation; scripts/prepare_sector_network.py:convert_conventional_generators_to_links"
      - key: fossil_reserves
        effect: "Sector runs: initial energy (TWh) in the per-carrier fuel Store created by add_carrier_buses — add a 'gas' entry to seed finite gas reserves."
        default: "oil: 100 (no gas entry, so the gas store starts empty and cyclic)"
        provenance: "config.default.yaml:fossil_reserves; scripts/prepare_sector_network.py:add_carrier_buses"
    boundary:
      - variant: "run with the existing gas fleet plus OCGT expansion"
        rung: L0
        note: "default behaviour — OCGT/CCGT in conventional_carriers, OCGT in extendable_carriers.Generator"
      - variant: "gas phase-out (no existing plants, no expansion)"
        rung: L1
        note: >
          remove 'OCGT'/'CCGT' from electricity.conventional_carriers AND 'OCGT'
          from electricity.extendable_carriers.Generator
      - variant: "allow new CCGT build at existing sites"
        rung: L1
        note: "add 'CCGT' to electricity.extendable_carriers.Generator; expansion restricted to buses already hosting CCGT plants"
      - variant: "cap or force gas capacity per country"
        rung: L1
        note: >
          electricity.agg_p_nom_limits + 'CCL' in scenario.opts; author rows in
          data/agg_p_nom_minmax.csv for carriers OCGT/CCGT
      - variant: "limit total gas-fired fuel use (gas budget)"
        rung: L1
        note: >
          add 'CH4L+<MWh_th>' to scenario.opts — add_gaslimit puts a GlobalConstraint
          on the gas_usage attribute of OCGT/CCGT/CHP carriers; the numberless
          'CH4L' fallback reads an electricity 'gaslimit' key that is NOT present in
          config.default.yaml, so pass the number in the wildcard
      - variant: "carbon cap or carbon price on gas dispatch"
        rung: L1
        note: >
          'Co2L' / 'Co2L<fraction>' in scenario.opts with electricity.co2limit /
          electricity.co2base (default opts is 'Co2L-3h'), or 'Ep' with
          costs.emission_prices.co2 — both act through the co2_emissions the gas
          carriers inherit from the "gas" costs row
      - variant: "override gas fuel price, plant efficiency or investment cost"
        rung: L1
        note: >
          load_costs reads per-attribute overwrites from the costs config
          (investment/FOM/VOM/fuel/efficiency/lifetime blocks are present but
          commented out in config.default.yaml, with CCGT/gas examples); add e.g.
          costs.fuel: {gas: 10.1} or costs.efficiency: {CCGT: 0.58} — the gas fuel
          price propagates to both OCGT and CCGT marginal cost
      - variant: "derate gas plant availability (static or per-country p_max_pu)"
        rung: L1
        note: >
          add a top-level 'conventional:' block (e.g. conventional: OCGT: p_max_pu:
          0.9) — absent from config.default.yaml but read via config.get("conventional")
          in rule add_electricity and applied per-carrier in
          attach_conventional_generators; a data/ CSV path gives country-specific values
      - variant: "add a planned/missing gas plant"
        rung: L3
        note: "row in data/custom_powerplants.csv (Fueltype Natural Gas, Technology CCGT or OCGT) + electricity.custom_powerplants: merge"
      - variant: "greenfield OCGT/CCGT at any bus (regions with no existing gas fleet)"
        rung: L2
        note: >
          the extendable block in attach_conventional_generators derives
          carrier_buses from the existing fleet; small localised edit to place
          candidates at all buses (or seed sites via custom_powerplants, L3)
      - variant: "gas-fired power drawing from an explicit gas supply (sector run)"
        rung: L0
        note: >
          automatic in prepare_sector_network — OCGT/CCGT generators become Links
          from per-node gas buses (sector.conventional_generation), gas supplied by
          the add_carrier_buses store/generator; pipeline data via GGIT is a
          separate custom_data.gas_network / sector.gas option
      - variant: "unit commitment, ramping or start-up costs for gas turbines"
        rung: L5
        note: "no committable/UC machinery in the workflow; bespoke component settings and solver plumbing needed"
      - variant: "CCGT with carbon capture in the power sector"
        rung: L5
        note: >
          no gas+CC electricity generator exists (sector runs only have urban
          central gas CHP CC and SMR CC); new link logic plus a costs row needed
      - variant: "Allam-cycle gas turbine"
        rung: L5
        note: "absent from the codebase entirely (no costs row, no carrier, no capture wiring); bespoke component logic required"
    where:
      - change: "fleet attachment + extendable gas generators (incl. carrier_buses siting restriction)"
        anchor: "scripts/add_electricity.py::attach_conventional_generators"
        provenance: "scripts/add_electricity.py:attach_conventional_generators"
      - change: "powerplantmatching technology -> OCGT/CCGT carrier mapping"
        anchor: "scripts/add_electricity.py carrier_dict (in load_powerplants preprocessing)"
        provenance: "scripts/add_electricity.py:carrier_dict"
      - change: "fleet construction and matching config"
        anchor: "Snakefile rule build_powerplants; configs/powerplantmatching_config.yaml (Natural Gas fueltype, fuel_to_lifetime)"
        provenance: "Snakefile:rule build_powerplants; configs/powerplantmatching_config.yaml:fuel_to_lifetime"
      - change: "cost assumptions: fuel price + CO2 intensity copied from 'gas' row onto OCGT/CCGT, marginal cost = VOM + fuel/efficiency"
        anchor: "scripts/process_cost_data.py::load_costs; rule retrieve_cost_data"
        provenance: "scripts/process_cost_data.py:load_costs"
      - change: "CO2 cap / emission price / gas usage limit via opts wildcard"
        anchor: "scripts/prepare_network.py::add_co2limit / add_emission_prices / add_gaslimit (opts Co2L / Ep / CH4L)"
        provenance: "scripts/prepare_network.py:add_gaslimit; scripts/prepare_network.py:add_co2limit"
      - change: "country-wise capacity limits"
        anchor: "scripts/solve_network.py::add_CCL_constraints (activated by 'CCL' in opts)"
        provenance: "scripts/solve_network.py:add_CCL_constraints"
      - change: "per-carrier attribute overrides (p_max_pu etc.) via the undocumented 'conventional:' config block"
        anchor: "Snakefile rule add_electricity params conventional; applied in attach_conventional_generators"
        provenance: "Snakefile:rule add_electricity; scripts/add_electricity.py:attach_conventional_generators"
      - change: "sector conversion of gas generators to gas-bus Links + gas fuel supply"
        anchor: "scripts/prepare_sector_network.py::convert_conventional_generators_to_links; ::add_carrier_buses"
        provenance: "scripts/prepare_sector_network.py:convert_conventional_generators_to_links; scripts/prepare_sector_network.py:add_carrier_buses"
    data_dependencies:
      - input: "powerplantmatching database (Natural Gas fueltype, CCGT/OCGT technologies)"
        required_for: "existing fleet AND the buses where extendable OCGT/CCGT can be placed"
        availability: "region-dependent — coverage outside Europe varies and technology labels are often missing; verify OCGT/CCGT rows appear in resources/<run>/powerplants.csv for the target countries, else expansion candidates are silently absent"
      - input: "costs rows 'OCGT', 'CCGT' and 'gas' in retrieved technology-data (costs.technology_data_version)"
        required_for: "capital/marginal cost, efficiency, lifetime, fuel price, CO2 intensity"
        availability: "exists by default via rule retrieve_cost_data"
      - input: "data/custom_powerplants.csv"
        required_for: "adding gas plants missing from powerplantmatching / seeding expansion sites"
        availability: "template exists by default; rows user-authored"
      - input: "data/agg_p_nom_minmax.csv"
        required_for: "country capacity caps/floors (CCL)"
        availability: "template exists by default; rows must be authored for OCGT/CCGT"
      - input: "GGIT gas pipeline dataset or resources/custom_data/pipelines.csv"
        required_for: "explicit gas transport topology in sector runs (custom_data.gas_network / sector.gas.network_data)"
        availability: "GGIT retrieved by the workflow; custom pipelines.csv user-authored; default sector.gas.network is false"
