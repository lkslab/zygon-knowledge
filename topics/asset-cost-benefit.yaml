id: asset-cost-benefit
title: Asset cost-benefit
question: |
  Is a specific asset worth building — what system cost does one interconnector, line, plant, or storage project save, who captures the benefit, and how does the case hold up across scenarios? The standard regulator/TSO study for EU PCIs, TYNDP project assessment, and merchant HVDC, and the same with/without machinery for any single intervention — an asset, a production pathway (hydrogen-routed green steel put in or taken out), or a demand change.
when_to_use:
- cost-benefit analysis of an interconnector or a specific project
- value of a new cross-border link
- is this one asset (line, plant, storage, electrolyser) worth building
- build vs no-build counterfactual for a corridor or project
- TYNDP / PCI style project assessment (PINT or TOOT)
- who benefits from interconnection on each side
- >-
  what does hydrogen-routed green steel (or another new production pathway) do to
  the system vs without it
- effect of a demand change or a new large load vs without it
models:
- model: pypsa-eur
  approach: >-
    One of pypsa-eur's strongest topics, and since the single-asset-cba method landed
    the canonical study is a verified mechanical pipeline, not a sketch of steps: declare
    the asset (any component, or a composite like bus + conversion link + load), solve
    reference and perturbed variants with the model's own solver, and B1/B2/B3 fall
    out direction-signed against the reference, with real TYNDP/NEP candidates loadable
    via transmission_projects when the asset is a listed project. The intervention
    is not confined to supply: a production pathway lands as a composite add and a
    demand change as set/scale ops that reach the time-varying load series, so B1
    reads as the (negative) cost of serving it. System design under a whole demand
    scenario stays the capacity-expansion topic; this card prices the delta of one
    named intervention.
  trade_offs: []
  limitations:
  - >-
    splitting B1 into producer/consumer surplus per side and congestion rent is manual:
    read nodal prices and link duals off the solved pair yourself
  - >-
    benefits are what a deterministic cost-minimising planner sees — no probabilistic
    adequacy (B6), flexibility (B7) or stability (B8) indicators, and no CBCA/wheeling
    revenue-allocation layer
  - >-
    under the binding net-zero cap B2 is ~0 by construction
  methods:
  - id: co2-budget
    role: >-
      the frame the B2 CO2 benefit lives in — under the shipped default the cap binds,
      so an asset's emissions delta is ~0 by construction and its value shows up in B1
      through the CO2 shadow price; settle emissions_target against this card before
      reading B2, and say whether the pair runs sector-coupled or power-only
  - id: existing-fleet
    role: >-
      the reference grid's substrate — control which pre-built fleet the with/without
      pair sees before trusting any delta
  - id: single-asset-cba
    role: >-
      the headline: PINT/TOOT run set against the fixed reference; B1 system-cost,
      B2 CO2 and B3 RES deltas monetise the asset mechanically, its own capex compared
      off-model
  - id: multi-scenario
    role: >-
      the guideline's scenario dimension — repeat the with/without pair across demand/CO2
      variants with harmonised collection to show the case holds beyond one future
  - id: pathway-myopic
    role: >-
      the timing dimension — does the benefit persist across horizons as the system
      decarbonises around the asset
  defaults:
  - aspect: overnight-foresight
    is: >-
      one target year, all capacity decided at once (foresight: overnight); the CBA
      run set inherits it
    note: >-
      reach for a pathway method only when timing is the question — a single-horizon
      benefit does not need one.
  - aspect: transmission-expansion
    is: >-
      the shipped config co-optimises line/link expansion under transmission_limit,
      so the rest of the grid adapts around the assessed asset; the asset itself is
      pinned non-extendable by the CBA method
    note: >-
      a strict fixed-reference-grid reading wants expansion frozen — see the transmission-expansion-projects
      carrier card for the levers.
  version_anchor:
    ref: a6c45e5a2d926ba9a5566cba24d905cff9f89939
    date: '2026-09-09'
- model: pypsa-earth
  approach: >-
    A strong pypsa-earth topic, and since the single-asset-cba method landed the canonical
    study is a verified mechanical pipeline: declare the asset (any component, or
    a composite like bus + conversion link + load), solve reference and perturbed
    variants with the model's own solver, and B1/B2/B3 fall out direction-signed against
    the reference. Multi-country scope is native, so power-pool cases need no special
    assembly, and EQ adds the self-sufficiency constraint real interconnection politics
    impose. A production pathway lands as a composite add and a demand change as set/scale
    ops that reach the time-varying load series, so B1 reads as the (negative) cost
    of serving it. System design under a whole demand scenario stays the capacity-expansion
    topic; this card prices the delta of one named intervention.
  trade_offs:
  - >-
    TOOT and PINT are order-dependent when several projects queue, so each asset buys its
    own run set against the same reference; one set answers one asset
  - >-
    OSM grid completeness varies by country and the coarse settled baselines carry little
    or no native inter-zonal transmission, so the interconnector case leans on PINT (put
    the candidate in) rather than TOOT of an existing corridor
  limitations:
  - >-
    splitting B1 into producer/consumer surplus per side and congestion rent is manual:
    read country-level duals off the solved pair yourself
  - >-
    benefits are what a deterministic cost-minimising planner sees — no probabilistic
    adequacy (B6), flexibility (B7) or stability (B8) indicators, and no wheeling-charge
    or transmission-tariff layer for revenue allocation
  - >-
    under a binding CO2 cap B2 is ~0 by construction
  methods:
  - id: existing-fleet
    role: >-
      the reference grid's substrate — control which pre-built fleet the with/without
      pair sees before trusting any delta
  - id: single-asset-cba
    role: >-
      the headline: PINT/TOOT run set against the fixed reference; B1 system-cost,
      B2 CO2 and B3 RES deltas monetise the asset mechanically, its own capex compared
      off-model
  - id: multi-scenario
    role: >-
      the guideline's scenario dimension — repeat the with/without pair across demand/CO2
      variants with harmonised collection to show the case holds beyond one future
  - id: pathway-myopic
    role: >-
      the timing dimension — does the benefit persist across horizons as the system
      decarbonises around the asset
  - id: pathway-perfect
    role: >-
      the no-regret multi-horizon benchmark for the case — verified on earth, where
      the perfect-foresight chain runs end to end
  defaults:
  - aspect: overnight-foresight
    is: >-
      one target year, all capacity decided at once — the shipped default; the CBA
      run set inherits it
    note: >-
      reach for a pathway method only when timing is the question — a single-horizon
      benefit does not need one.
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-08-07'
