    date: '2026-10-26'
- model: pypsa-earth
  approach: >-
    The model's bread and butter: pypsa-earth exists to run exactly this study for
    any country from open data — atlite renewable potentials, OSM grid, powerplantmatching
    fleet, GEGIS-style demand — and co-optimises generation, storage and transmission
    with hourly chronology, which most incumbent IRP tools (LEAP, screening curves)
    cannot. Constraint machinery covers the usual policy asks: CO2 caps and prices,
    per-country carrier limits, reserve margins, BAU floors. Both the myopic chain
    and a ported perfect-foresight branch are verified specs here, the latter shipping
    its code surgery as a pre-tested payload rather than something to re-author per
    study.
  trade_offs: []
  limitations:
  - >-
    investment is LP: unit-commitment data is never populated, so no lumpy builds or
    start-up costs
  methods:
  - id: existing-fleet
    role: >-
      which pre-built capacity the optimiser sees — the greenfield/brownfield starting
      point, and the first thing to check when a mix looks wrong
  - id: pathway-myopic
    role: >-
      sequential horizons with capacity carry-over — answers WHEN capacity gets built
      and what retires, not just the end state
  - id: pathway-perfect
    role: >-
      all horizons co-optimized in one LP — earth has no native perfect branch, so
      the method ships the port as its own pre-tested payload
  defaults:
  - aspect: overnight-foresight
    is: >-
      one target year, all capacity decided at once against that year's costs — the
      shipped config default (foresight: overnight)
    note: >-
      no method spec because there is nothing to change, so there is nothing to cite.
      Reach for a pathway method only when the question is about timing; an end-state
      mix does not need one.
