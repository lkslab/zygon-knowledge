id: capacity-expansion
title: Capacity expansion
question: |
  What generation, storage, and grid mix meets demand at least cost under policy constraints — the canonical IRP/master-plan question every planner, regulator, and development bank asks, for any country and target year.
when_to_use:
- least-cost generation mix for [country] by/in [year]
- integrated resource plan / power development plan
- how much solar/wind/storage/gas should we build
- system cost under emissions target
- greenfield vs brownfield expansion study
models:
- model: pypsa-eur
  coverage: ready
  approach: >-
    The bread-and-butter application: pypsa-eur co-optimises generation, storage and
    transmission on validated European data (ENTSO-E demand, OSM/TYNDP grid, powerplantmatching
    fleet) and offers all three foresight modes as first-class citizens — overnight
    snapshots, myopic chain, and true perfect-foresight during multi-period
    optimisation with inter-period carbon budgets.
    Can be power-sector only, but can cover sectors heat, transport, industry, biomass, agriculture.
    Constraint machinery covers the policy asks — CO2 caps and prices, carbon-budget
    pathways, per-country carrier limits (CCL) — and the config is schema-validated
    so typos fail fast.
    Should be run at high temporal (at least 3-hourly) resolution for accurate balancing-economics.
    Spatial resolution is also important.
  pitfalls:
  - >-
    If run at low spatio-temporal resolution can underestimate the cost of renewables
  - >-
    penny-switching; vastly different model solutions could be only marginally more expensive.
    sensitivies can help to make sure the findings are robust
  - >-
    BAU floors and the SAFE reserve margin need user-added config keys; they are not
    on by default
  - >-
    builds are continuous — post-discretisation is optional and iterative-only, so
    no lumpy investment out of the box
  - >-
    scope is Europe: a non-European IRP is a pypsa-earth answer, where data quality can
    be lower in some regions
  - >-
    the model shipping a mode is not the same as us having proven it — the perfect-foresight
    spec is still draft on eur (blocked upstream), so a perfect-foresight pathway
    is a pypsa-earth answer today
  methods:
  - id: existing-fleet
    role: >-
      which pre-built capacity the optimiser sees — the greenfield/brownfield starting
      point, and the first thing to check when a mix looks wrong
  - id: pathway-myopic
    role: >-
      sequential horizons with capacity carry-over — answers WHEN capacity gets built
      and what retires, not just the end state
  defaults:
  - aspect: overnight-foresight
    is: >-
      one target year, all capacity decided at once against that year's costs — the
      shipped config default (foresight: overnight)
    note: >-
      no method spec because there is nothing to change, so there is nothing to cite.
      Reach for a pathway method only when the question is about timing; an end-state
      mix does not need one.
  version_anchor:
    ref: 849c8858d2536ccf8eed0c2e838d22a474a7ee5d
    date: '2026-07-23'
- model: pypsa-earth
  coverage: ready
  approach: >-
    The model's bread and butter: pypsa-earth exists to run exactly this study for
    any country from open data — atlite renewable potentials, OSM grid, powerplantmatching
    fleet, GEGIS-style demand — and co-optimises generation, storage and transmission
    with hourly chronology, which most incumbent IRP tools (LEAP, screening curves)
    cannot. Constraint machinery covers the usual policy asks: CO2 caps and prices,
    per-country carrier limits, reserve margins, BAU floors. Both the myopic chain
    and a ported perfect-foresight branch are verified specs here, the latter shipping
    its code surgery as a pre-tested payload rather than something to re-author per
    study.
  pitfalls:
  - >-
    investment is LP: unit-commitment data is never populated, so no lumpy builds
    or start-up costs
  - >-
    results are only as good as country inputs — check the data_quality scorecard
    grades for power-fleet and electricity-demand before presenting a mix to a ministry;
    the fleet and demand baselines gate credibility more than the optimiser does
  methods:
  - id: existing-fleet
    role: >-
      which pre-built capacity the optimiser sees — the greenfield/brownfield starting
      point, and the first thing to check when a mix looks wrong
  - id: pathway-myopic
    role: >-
      sequential horizons with capacity carry-over — answers WHEN capacity gets built
      and what retires, not just the end state
  - id: pathway-perfect
    role: >-
      all horizons co-optimized in one LP — earth has no native perfect branch, so
      the method ships the port as its own pre-tested payload
  defaults:
  - aspect: overnight-foresight
    is: >-
      one target year, all capacity decided at once against that year's costs — the
      shipped config default (foresight: overnight)
    note: >-
      no method spec because there is nothing to change, so there is nothing to cite.
      Reach for a pathway method only when the question is about timing; an end-state
      mix does not need one.
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-07-08'
