id: capacity-expansion
title: Capacity expansion
question: |
  What generation, storage, and grid mix meets demand at least cost under policy constraints — the canonical IRP/master-plan question every planner, regulator, and development bank asks, for any country and target year.
when_to_use:
- least-cost generation mix for [country] by/in [year]
- integrated resource plan / power development plan
- how much solar/wind/storage/gas should we build
- system cost under emissions target
- greenfield vs brownfield expansion study
models:
- model: pypsa-eur
  approach: >-
    The bread-and-butter application: pypsa-eur co-optimises generation, storage and
    transmission on validated European data (ENTSO-E demand, OSM/TYNDP grid, powerplantmatching
    fleet) and offers all three foresight modes as first-class citizens — overnight
    snapshots, myopic chain, and true perfect-foresight during multi-period
    optimisation with inter-period carbon budgets.
    Can be power-sector only, but can cover sectors heat, transport, industry, biomass, agriculture.
    Constraint machinery covers the policy asks — CO2 caps and prices, carbon-budget
    pathways, per-country carrier limits (CCL) — and the config is schema-validated
    so typos fail fast.
    Should be run at high temporal (at least 3-hourly) resolution for accurate balancing-economics.
    Spatial resolution is also important.
  trade_offs:
  - >-
    renewable-integration economics only show at fine spatial and temporal resolution
    (3-hourly or finer, enough nodes to see the grid); coarser runs understate the cost of
    renewables, so this is the dial most expansion studies protect and pay for elsewhere
  - >-
    penny-switching: vastly different capacity mixes can be only marginally more
    expensive, so a robust finding buys a sensitivity set (scenarios) rather than more
    detail in a single run
  - >-
    the shipped default is fully sector-coupled: an electricity-only question silently
    inherits heat, transport and industry demand unless sector.enabled is set false or the
    sector toggles are narrowed one by one; coupling buys the cross-sector interactions
    and pays in solve time and data breadth
  limitations:
  - >-
    BAU floors and the SAFE reserve margin need user-added config keys; they are not on by
    default
  - >-
    builds are continuous — post-discretisation is optional and iterative-only, so no
    lumpy investment out of the box
  methods:
  - id: co2-budget
    role: >-
      how the emissions target enters the model and what the shipped default already
      caps — the consultant settles emissions_target against this card, never a share
  - id: existing-fleet
    role: >-
      which pre-built capacity the optimiser sees — the greenfield/brownfield starting
      point, and the first thing to check when a mix looks wrong
  - id: pathway-myopic
    role: >-
      sequential horizons with capacity carry-over — answers WHEN capacity gets built
      and what retires, not just the end state
  - id: multi-scenario
    role: >-
      the guideline's scenario dimension — repeat the with/without pair across demand/CO2
      variants with harmonised collection to show the case holds beyond one future
  - id: geothermal-geology
    role: >-
      enhanced geothermal as a firm low-carbon candidate in a sector run — per-region
      supply curves from the subsurface temperature model, off by default; read the cost
      per region, not the (very large, technical) potential
  defaults:
  - aspect: overnight-foresight
    is: >-
      one target year, all capacity decided at once against that year's costs — the
      shipped config default (foresight: overnight)
    note: >-
      no method spec because there is nothing to change, so there is nothing to cite.
      Reach for a pathway method only when the question is about timing; an end-state
      mix does not need one.
  - aspect: sector-coupling
    is: >-
      every sector on — sector.enabled and the transport, heating, biomass, industry,
      shipping, aviation, agriculture and fossil_fuels toggles are all true in the
      shipped config
    note: >-
      the sector scope is a settled decision, never a default to fall into: power only
      is sector.enabled false, a subset switches the toggles off one by one. The
      emissions cap counts whatever sectors are in, but its 1990 baseline follows the
      transport, heating, industry and agriculture toggles, not sector.enabled — a
      power-only run with those toggles left true is capped against economy-wide 1990
      emissions (see the co2-budget method card)
  version_anchor:
