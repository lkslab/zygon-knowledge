id: clean-procurement
title: Clean procurement
question: |
  How can a large electricity consumer — a data centre, a hyperscale campus, a C&I site, an electrolyser — procure clean electricity, what does each procurement rule cost, and what does it build? The canonical comparison: how much more expensive is it to run a data centre on hourly-matched 98%-clean electricity than on an annual-matched 100% renewable PPA, and which mix of wind, solar, batteries, long-duration storage and clean firm capacity does each rule buy. The RFNBO hourly-matching rule for green hydrogen is the sibling case — the same constraint algebra at a different grouping, and the only one either model ships machinery for.
when_to_use:
- >-
  how much more expensive is 24/7 hourly-matched clean power than a 100% renewable
  PPA
- >-
  run a data centre / hyperscale campus on carbon-free energy every hour, not on annual
  average
- CFE score / 24/7 CFE target for a large consumer
- >-
  hourly vs monthly vs annual matching — what does each rule cost and what does it
  build
- >-
  which mix of wind, solar, batteries, long-duration storage and clean firm does a
  procurement strategy buy
- >-
  additionality — must the procured supply be new capacity, and does it cut emissions
  or move them
- same bidding zone / deliverability / geographic correlation requirement
- guarantees of origin, RECs or certificates vs physical hourly matching
- RFNBO / delegated act hourly matching for an electrolyser
- >-
  who pays for strictness — what a matching rule does to everyone else's electricity
  price
- scope 2 / gCO2/kWh of a matched consumer's electricity
- corporate PPA or hourly PPA structure for a C&I load
models:
- model: pypsa-eur
  approach: >-
    The matching rule now ships as the zygon_cfe payload cited by the hourly-matching
    and annual-matching methods, built to Riepin 2024's design: build_cfe_network puts
    ONE participating consumer (a flat load at its own bus behind the zone's AC bus)
    with a contracted portfolio of new assets cloned from the zone's own onwind, solar,
    battery, H2-chain and firm components, an import link and a capped export link;
    zygon_cfe_constraints adds the rule at solve time as the solve rule's own
    custom_extra_functionality — one row per snapshot (hour), per calendar month, or
    per year, plus the 20% excess cap and an optional portfolio-only charging rule; and
    zygon_cfe_collect turns the run set (nomatch / annual / monthly / hourly x CFE
    score) into the consumer's premium in EUR/MWh over the grid-mix purchase, the
    system-cost delta, the ex-post CFE score, the procured mix and scope-2 emissions.
    The CFE score sweep is the emission-reduction ladder: 0.8 to 1.0 hourly, against
    the annual rung and no rule. Grid imports are uncredited by default (one linear
    solve); Riepin's bilinear grid-CFE credit is a documented two-pass. Limitations:
    the payload has been exercised standalone (rows counted per window on the
    3-hourly fixture) but not through an eval solve, and additionality, cross-zone
    deliverability and gCO2/kWh certification remain readings, not constraints.
  trade_offs:
  - >-
    the snapshot resolution IS the strictness: ideal is 1-hourly, and 3-hourly was still
    used in Riepin 2024; never coarsen further and never segment, so the study pays for
    its matching rule in time steps and saves on nodes instead
  - >-
    what counts is a formulation choice the payload makes explicit (basis): the hourly
    rule counts dispatched supply plus NET storage minus excess (Riepin Eq. 2), the annual
    and monthly windows count the contracted plants' AVAILABLE generation, the volume a
    PPA sells whether consumed, sold or curtailed — crediting gross discharge or
    dispatched generation under a binding excess cap made the first end-to-end runs build
    a lossy charger/discharger loop as an energy sink
  - >-
    strictness redistributes cost as much as it adds it — the price duration curve and
    non-participating consumers' cost belong beside the premium, so extract them from the
    start
  limitations:
  - >-
    an annual rule that credits storage discharge is satisfiable by a battery charged on
    fossil power — credit_storage.year stays false, and the collected scope-2 number is
    what shows the annual rule moving emissions rather than cutting them
  - >-
    crediting grid imports at the grid's hourly CFE share is bilinear — the payload runs
    linear by default; the two-pass (grid_cfe.series pointed at the collector's
    grid_cfe_factor.csv) is an assumption until you report the passes and the residual
  - >-
    additionality is a reading, not a constraint: the portfolio is new by construction and
    zygon_cfe.baseline gives the counterfactual objective, but the background system re-
    optimises around the consumer; Schumm 2025's build-year filter is not implemented
  - >-
    deliverability is the consumer's own zone bus by construction — a portfolio spread
    over zones needs a second consumer or code, and nothing tracks a GO or REC through
    storage
  - >-
    the installed baseline sets solving.options.custom_extra_functionality to "" and the
    payload rule passes its own hook, so a user hook is bypassed on solve_cfe_network only
  - >-
    there is no gCO2/kWh column: scope-2 is the collector's import x zonal hourly
    generation intensity, an average not a marginal, and it moves with the basis
  - >-
    the hook logs matching rows against the window count and raises on a mismatch; read
    the solver log before believing a variant, and check n.meta['zygon_cfe']
  methods:
  - id: co2-budget
    role: >-
      the background emissions policy the consumer buys clean power inside — the shipped
      default already caps the whole system, so a matching rule's scope-2 saving and
      premium are measured against a decarbonising grid, not a fossil one; settle
      emissions_target against this card, never as a renewable share
  - id: hourly-matching
    role: >-
      the headline: Riepin's 24/7 rule as a CFE-score sweep (hourly-090/098/100) in
      one run set with the no-rule counterfactual — premium per MWh, system-cost
      delta, procured mix, scope-2, and the grid-CFE two-pass when imports must count
  - id: annual-matching
    role: >-
      the volumetric rungs the premium is measured against: the 100% renewable PPA
      (one row over the year, storage uncredited) and the monthly RFNBO regime, from
      the same payload and config block
  - id: price-formation
    role: >-
      the cost to everyone else: bounded prices with a declared VOLL and all duals,
      and the price duration curve per regime — strictness is a cost allocation across
      the system, not a line item on the consumer
  - id: multi-scenario
    role: >-
      the background dimension: background CO2 policy or target year as run.scenarios
      overrides, and its collect rule composes with the per-run zygon_cfe tables
      (results/<run>/zygon_cfe/<indicator>.csv) for harmonised
      cost, capacity and price tables across regimes — it fans out runs, the constraint
      lives in the payload
  - id: single-asset-cba
    role: >-
      the additionality reference read the guideline way: PINT the consumer alone as a
      demand op against the fixed reference — B1 is the grid-mix cost of serving the
      load, the number the premium starts from
  - id: existing-fleet
    role: >-
      the reference grid's substrate — control which pre-built fleet the with/without
      pair sees before trusting any delta
  defaults:
  - aspect: no-procurement-rule
    is: >-
      loads are fixed p_set profiles on the low-voltage buses and nothing constrains
      where their electricity comes from — a default run is the no-rule counterfactual,
      the grid-mix cost of serving the load, not a 100% renewable PPA and not a CFE
      score
    note: >-
      the installed baseline sets solving.options.custom_extra_functionality to ""; the
      zygon_cfe solve rule passes its own hook, so no config edit turns the rule on
      outside that rule.
  plots:
  - id: price_duration
    role: >-
      who pays: the duration curve per matching regime, the result Schumm 2025 leads
      with
  - id: dispatch_weeks
    role: 'what the rule buys: the hourly balance in the weeks where matching binds'
  - id: compare_system_cost
    role: 'what the rule costs the system: total cost per regime beside the premium'
  version_anchor:
    ref: a6c45e5a2d926ba9a5566cba24d905cff9f89939
    date: '2026-09-09'
- model: pypsa-earth
  approach: >-
    The only place in the family with shipped matching machinery, built for the sibling
    case: policy_config.hydrogen.temporal_matching takes no_temporal_matching | hour
    | month | year, and hydrogen_temporal_constraint in scripts/solve_network.py adds
    one RESconstraints_{label} row per window — weighted Generator-p plus StorageUnit-p_dispatch
    over temporal_matching_carriers >= allowed_excess times the weighted Link-p of
    matching_technologies. Annual, monthly and hourly RFNBO regimes for an electrolyser
    are a config flip, exercised by the Morocco studies (Schumm 2025: 14 nodes, 3-hourly,
    264 runs across the four regimes); allowed_excess at 1/x is the CFE-score sweep.
    A data-centre consumer reaches the rule at L2: the constraint reads Link-p only,
    so model the site as a Link off the AC bus and add its carrier to matching_technologies.
    The reference build (is_reference plus remove_h2_load) works and is the counterfactual
    network for an additionality reading.
  trade_offs:
  - >-
    the default temporal_matching_carriers list credits reservoir hydro and run-of-river
    discharge, which most matching rules do not certify — prune it to what the rule
    credits (Duque-Perez's annual matching without batteries is the same edit)
  - >-
    coarse snapshots weaken the rule: keep the resolution and cut nodes instead
  - >-
    the price duration curve and domestic consumer cost belong beside the product cost:
    Schumm 2025 finds stricter matching lowers domestic electricity prices, up to 31% —
    the regime is a cost allocation, not a line item, so extract both
  limitations:
  - >-
    grid imports are not credited at the grid's CFE share — no bilinear term, so the 24/7
    CFE-score form with grid crediting is not this constraint
  - >-
    no spatial grouper: the constraint sums over every eligible component in the network,
    and policy_config.hydrogen.spatial_matching is a dead key with no consumer in the
    repo, so a same-bidding-zone claim on stock earth is unenforced
  - >-
    additionality is cosmetic: n_ref is loaded from path_to_ref and passed in but never
    read, so additionality true and false add the same constraint while the run logs
    success; re_country_load is dead too
  - >-
    a plain Load (the electricity-load carrier card's attach_load variant) is invisible to
    the rule — only Link-p over matching_technologies counts
  - >-
    any annual rule crediting storage discharge is satisfiable by a battery charged on
    fossil power
  - >-
    the constraint is reachable from the electricity-only solve rule, where it finds no
    electrolyser Links and adds vacuous rows — count RESconstraints_ rows against
    |snapshots|, 12 or the year count before believing anything
  - >-
    there is no gCO2/kWh column and no GO tracking through storage or pipelines
  methods:
  - id: single-asset-cba
    role: >-
      the no-rule rung and the additionality reference: PINT the consumer as a demand
      op on the prepared network against the fixed reference — B1 is the grid-mix
      cost of serving the load, and the solved reference is the network path_to_ref
      would point at once n_ref is actually read
  - id: price-formation
    role: >-
      the cost to everyone else: bounded hourly prices with a declared VOLL (never
      the shipped 100 EUR/kWh cap) and the price duration curve per regime — the domestic-consumer
      reading Schumm 2025 leads with
  - id: multi-scenario
    role: >-
      the collection half only: temporal_matching and allowed_excess are solve-time
      config keys, not prepared-network edits, so the declarative variants cannot
      switch the regime — fan the regimes out as separate config-override runs and
      point the collection at their networks for the harmonised cost, capacity and
      price tables
  defaults:
  - aspect: temporal-matching-off
    is: >-
      policy_config.hydrogen.temporal_matching ships as "no_temporal_matching" — a
      default run enforces no procurement rule; temporal_matching_carriers ships as
      [csp, solar, onwind, offwind-ac, offwind-dc, ror, hydro] and matching_technologies
      as the six electrolyser Link carriers, so no data-centre or C&I consumer is
      under the rule until its Link carrier is added
    note: >-
      additionality ships false, and true changes nothing at this ref — the flag is
      cosmetic until n_ref is read inside hydrogen_temporal_constraint.
  plots:
  - id: price_duration
    role: >-
      who pays: the duration curve per matching regime, the result Schumm 2025 leads
      with
  - id: dispatch_weeks
    role: 'what the rule buys: the hourly balance in the weeks where matching binds'
  version_anchor:
    ref: 8435f4c8cc05f30088933b37b7db497ff860dc53
    date: '2026-09-10'
