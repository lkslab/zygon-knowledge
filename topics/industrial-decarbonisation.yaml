id: industrial-decarbonisation
title: Industrial decarbonisation
question: >-
  How does a region's industry — steel, chemicals, cement, aluminium, refining — get off
  fossil fuels: which production routes, how much hydrogen and electricity they need and
  where, what process emissions remain and whether to capture them, and what the switch
  costs the energy system — the question industrial clusters, ports, sector bodies and the
  ministries funding the transition ask.
when_to_use:
- industrial decarbonisation of steel / cement / chemicals / aluminium
- hydrogen direct reduction versus blast furnace
- industrial hydrogen and electricity demand by region
- process emissions and industrial carbon capture
- electrifying industrial process heat
- what does an industrial cluster need from the energy system
models:
- model: pypsa-eur
  approach: >-
    pypsa-eur treats industry as demand whose shape the study decides: production per
    country (JRC-IDEES, Eurostat) is moved to the configured route shares per horizon
    (rules/build_sector.smk:build_industrial_production_per_country_tomorrow — primary vs
    scrap steel, DRI share, primary aluminium, chemicals from naphtha vs recycling), energy
    intensities blend from today's to the transformed ones
    (industry.sector_ratios_fraction_future), and the result is distributed to clusters
    by the Hotmaps and GEM site lists and added by
    scripts/prepare_sector_network.py:add_industry as electricity, "H2 for industry",
    process heat, gas, methanol and naphtha loads plus process emissions with a capture
    option; the ammonia chain is explicit. The energy system then responds: where the
    hydrogen is made, what the grid needs, what the cap does to process emissions. The
    industry-fuel-switching method settles the route keys and says which may vary per
    scenario (the route shares and the ratio blend, per horizon) and which hold for the
    whole submission (the intensities, sector.ammonia, the site lists). Process heat has
    two treatments: by default it is an exogenous fuel share inside those loads; with
    the industry-heat-endogenous method (sector.industry_t.endogen) the heat of the
    endogenised sectors becomes three temperature-band loads per node (100-200,
    200-500, 500+ °C) that steam boilers, direct firing, an industrial heat pump, an
    electric boiler and hydrogen firing compete for under the carbon cap and the
    biomass limit, so the study reads a technology choice instead of assuming one.
    Steel and cement have a route branch on top: with the industry-routes-endogenous
    method (sector.endogenous_sectors.enable) primary steel and cement leave the demand
    tables and become per-node tonnage loads met by competing production links —
    scripts/prepare_sector_network.py:add_steel (blast furnace on coal, H2 or gas DRI
    feeding an electric arc furnace, the furnace CO2 vented or captured) and
    scripts/prepare_sector_network.py:add_cement (clinker kiln fired by solid biomass,
    gas or waste, cement finishing, kiln capture retrofit) — and under myopic or perfect
    foresight today's plants from rules/build_sector.smk:build_industry_plants (the
    Fraunhofer ISI site database, the GEM cement tracker) enter as dated brownfield
    links with the blast furnaces retiring at their pledged year; secondary (scrap) EAF
    steel stays an exogenous electricity load. Industry electricity is flat unless the
    industry-load-profiles method gives it the hourly FfE branch shape. The
    target comes from co2-budget, the hydrogen supply from h2-network-expansion when
    that is the question, the timing from pathway-myopic. The carrier cards
    h2-dri-steel, electric-arc-furnace, low-clinker-cement, electrolytic-chemicals,
    industrial-ccs, electric-process-heat, industrial-process-heat-temperature-bands,
    industry-process-heat-endogenous, steel-routes-endogenous and
    cement-routes-endogenous carry the levers. Results are read off the
    industry loads per cluster (the tabulated industrial_energy_demand_<horizon>.csv,
    its exogenous or endogenous block) and what the system built to serve them.
  trade_offs:
  - >-
    the route split is a decision the model prices, not one it finds — the study is a
    scenario set, one per route pathway (fast DRI, slow DRI, scrap-heavy), compared on
    system cost and hydrogen need, rather than one run read as the answer
  - >-
    industry demand lands on the clusters that hold the sites, so the cluster count
    decides whether a steel region is its own node or part of a larger one — a cluster-level
    question pins spatial_resolution and pays for it
  - >-
    the hydrogen question and the industry question pull on each other: scoping out the
    backbone keeps the run small but leaves "where does the hydrogen come from" to a
    per-node electrolyser answer
  - >-
    process heat exogenous or endogenous is a choice about what the study assumes and
    what it finds: the exogenous shares fix the fuel mix by assumption (and carry the
    shipped electrification trajectory), the endogenous bands let the model pick the
    technology per temperature level but start from today's intensities for the
    endogenised sectors and add a must-run floor to every heat plant — a study whose
    question is the heat supply itself turns the method on and says which sectors
  - >-
    steel and cement routes by assumption or priced by the model: the shares
    (DRI_fraction and the JRC-IDEES intensities) are the calibrated demand the study
    assumes; industry-routes-endogenous lets the model pick BF vs DRI and the kiln fuel,
    but at technology-data intensities that do not match JRC-IDEES (a Europe-wide
    validation found steel coal at 7.5 TWh/a exogenous against 123 TWh/a once the blast
    furnace is priced at 5.34 MWh coal per tonne), with flat steel and cement loads and
    no clinker trade, so an NL run builds a kiln the country has not had since 2019 — the
    study says which reading it wants and, for the priced one, reports the route outcome
    against the exogenous demand it replaced
  - >-
    import routes are not modelled — no HBI, scrap, clinker or steel trade with the rest
    of the world, and no switch to drop one domestic route — so a "domestic hydrogen DRI
    versus imported iron" question is the endogenous two-route case read for its hbi bus
    marginal price (the landed-HBI break-even, a number the analyst reads off the solved
    network after the run), never a staged import route or a re-solve; a forbidden route
    is a solving.options.custom_extra_functionality hook capping its links
  limitations:
  - >-
    country totals distributed by site lists, never a site: no plant business case, no
    single works, no port cluster as an entity — the answer is the demand and the build
    around a cluster
  - >-
    production routes are inputs except for primary steel and cement under
    industry-routes-endogenous (off by default), and even then secondary (scrap) EAF
    steel stays an exogenous electricity load with no scrap availability constraint and
    no flexible EAF, there is no electric or hydrogen kiln, the clinker ratio is fixed
    per finishing link, there is no clinker or steel trade between nodes, and
    industry.DRI_fraction no longer acts on primary steel. Process heat is split by
    temperature band only with the industry-heat-endogenous method
    (sector.industry_t.endogen, off by default), and then steel stays out of the bands
    (and cement too when its route is endogenous), the endogenised sectors lose the
    exogenous efficiency and electrification blend (today's intensities), there is no
    electric option above 200 °C and hydrogen firing carries a placeholder cost; no
    industrial flexibility or load shifting either way (industry-load-profiles shapes the
    electricity load by branch, it does not make it flexible, and its shapes are German
    profiles projected to every country)
  - >-
    the intensities behind the routes (industry.H2_DRI, elec_DRI, the MWh_* keys) and
    sector.ammonia are read by horizon-free rules — a per-scenario change to them is
    silently dead under shared resources, so they are settled once for the submission
  - >-
    cement and lime process emissions have one capture option at a fixed capture rate
    (the "cement capture" cost row; industry.process_emissions_cc false removes it), the
    endogenous cement route one kiln retrofit; no clinker substitution, no CCU
    accounting beyond the synthesis routes
  - >-
    a one-country run supplies industry's exogenous solid biomass demand from the
    country's own potential only (the biomass limit sums the selected countries): where
    the demand is larger the run is infeasible by construction (NL 2040: 16 TWh/a against
    3.5 TWh/a), so a single-country industry study turns on industry-heat-endogenous
    (the exogenous biomass load shrinks to the non-endogenised sectors' share and the
    bands choose their fuel under the limit; industry-routes-endogenous on top shrinks it
    further, the kiln biomass then competing under the limit too), or
    sector.solid_biomass_import, and says which
  - >-
    a one-country net-zero run also needs a CO2 sink of its own: with the regional CO2Stop
    potential on (the default) a country the table holds no storage for (SE, FI, EE, LU,
    AT, ES, FR, NO, HR, HU, RS) caps every "co2 sequestered" store at zero, so captured
    process CO2 and DAC have nowhere to go and a zero cap is infeasible before the solver
    starts — the study settles an export allowance to shared storage
    (sector.regional_co2_sequestration_potential.enable false,
    sector.co2_sequestration_potential at an accepted Mt/a) or a residual cap, and says
    which (co2-budget note (j))
  methods:
  - id: industry-fuel-switching
    role: >-
      the production route shares and intensity blend per horizon — what each key moves,
      which vary per scenario, and the demand they produce
  - id: co2-budget
    role: >-
      the emissions target that prices the routes; process emissions count against it,
      which is what makes capture worth buying
  - id: h2-network-expansion
    role: >-
      where the industrial hydrogen comes from — per-node electrolysis, a backbone, or
      imports — when the supply side is part of the question
  - id: pathway-myopic
    role: >-
      when the switch has to happen — horizons with carry-over so a 2030 DRI plant's
      hydrogen demand persists into 2040
  - id: industry-heat-endogenous
    role: >-
      the heat supply of the endogenised sectors as a model choice per temperature
      band — the method for a question about electrifying, hydrogen-firing or keeping
      biomass in industrial heat, and for a one-country run the biomass limit cannot
      otherwise feed
  - id: industry-routes-endogenous
    role: >-
      primary steel and cement routes as a model choice — BF vs H2 or gas DRI, kiln fuel,
      vent or capture — with today's plants as brownfield under myopic foresight; the
      method for a question about which steel route or whether to capture at kilns
  - id: industry-load-profiles
    role: >-
      the hourly shape of industry electricity (FfE branch profiles) instead of a flat
      load — when industrial demand timing matters to the power side
  questions:
  - key: industry_heat
    question: How should the model treat industrial process heat?
    options:
    - value: bands
      label: Split into temperature bands, supply chosen by the model
      detail: >-
        heat at 100–200, 200–500 and above 500 °C each picks from heat pumps, electric
        boilers, biomass, gas or hydrogen at today's intensities; steel stays out
      default: true
      methods: [industry-heat-endogenous]
    - value: exogenous
      label: Keep the shipped fuel shares inside the industry loads
      detail: >-
        pypsa-eur's default; process heat follows the assumed electrification
        trajectory, no priced choice
  defaults:
  - aspect: route-trajectory
    is: >-
      the shipped trajectories: DRI share 0.05 in 2030 rising to 1 in 2050, primary steel
      falling to 0.3, primary aluminium to 0.2, chemicals to 0.4 primary with recycling
      taking the rest, intensities fully transformed by 2050
    note: >-
      a route pathway is a settled assumption per scenario, never a default to fall
      into: the study names the shares it assumes for each horizon
  - aspect: ammonia-chain
    is: sector.ammonia true — Haber-Bosch from hydrogen and an ammonia cracker, one EU bus
    note: >-
      "regional" puts an ammonia bus per cluster; either way it is set once for the
      submission
  - aspect: industry-heat
    is: >-
      exogenous (sector.industry_t.endogen false) — process heat stays a fuel share
      inside the industry loads, following the shipped electrification trajectory
    note: >-
      industry-heat-endogenous switches to the temperature bands; the industry_heat
      question asks which treatment the study runs, since the two read differently (an
      assumed mix versus a priced choice at today's intensities)
  - aspect: industry-routes
    is: exogenous (sector.endogenous_sectors.enable false) — steel and cement follow the route shares and the JRC-IDEES intensities
    note: >-
      industry-routes-endogenous switches primary steel and cement to priced routes at
      technology-data intensities; the study says which treatment it runs
  - aspect: industry-load-profiles
    is: flat (industry.temporal_electricity_industry_load false)
    note: industry-load-profiles gives industry electricity the hourly FfE branch shape
  plots:
  - id: capacity_mix
    role: hydrogen, electricity and capture capacity the industry demand pulls in, per scenario
  - id: compare_system_cost
    role: route pathways against each other on system cost and hydrogen need
  - id: region_map
    role: industrial hydrogen and electricity demand per cluster
  - id: industrial_sites
    role: where today's steelworks, cement kilns, refineries and chemical plants stand and what they emit, before a run
  - id: emission_history
    role: the emissions since 1990 by sector, industrial processes and manufacturing among them
  - id: energy_balance
    role: "today's industrial energy use by carrier: the gas, coal and oil to switch"
  - id: industry_heat_demand
    role: >-
      today's process heat per temperature band (below 100, 100-200, 200-500, above
      500 °C), the demand each band's supply options compete for, before a run
  - id: technology_costs
    query: {family: industry_steam}
    role: >-
      what the steam band's options cost, 100-200 °C: gas, electric and biomass boilers
      against the high-temperature heat pump
  - id: technology_costs
    query: {family: industry_firing}
    role: >-
      what direct firing above 200 °C costs: gas against solid fuels, hydrogen a
      placeholder at ten times gas
