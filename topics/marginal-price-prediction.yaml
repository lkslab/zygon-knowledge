id: marginal-price-prediction
title: Marginal price prediction
question: |
  What will marginal electricity (or hydrogen, or heat) prices look like in this system — their temporal shape over the day and the year, their spatial distribution across nodes or zones, and their statistics: mean, duration curve, zero-price share, spike frequency, hours at the ceiling? The modelling substrate is ordinary capacity expansion; what changes is that the price series itself is the deliverable, not a by-product.
when_to_use:
- what will electricity prices be in 2030 / 2040 in this scenario
- price duration curve for my scenario
- when and where are prices high, zero or negative
- capture price / market value my asset would earn
- how often does the price spike, and to what level
- hydrogen or heat price in the model
models:
- model: pypsa-eur
  coverage: ready
  approach: >-
    Strong: the solved network prices every carrier bus at every snapshot for free,
    pypsa-eur's own summaries already emit correctly weighted weighted_prices and
    market_values, and a real dispatch-only rule (solve_operations_network) gives
    short-term prices of a fixed fleet. Since the price-formation method landed, ceiling,
    resolution and duals are a verified mechanical setup rather than folklore. What
    stays manual, per the v1 essays: decomposing the series by price-setting regime
    (zero/storage/thermal/scarcity), KKT price-setter identification, revenue concentration
    and per-technology cost-recovery ratios.
  pitfalls:
  - >-
    the upper tail is a config number — always report the VOLL and the hours-at-ceiling
    share beside any statistic
  - >-
    expansion-run duals are not market forecasts: a competitive benchmark of a cost-minimising
    planner, with no bidding, no demand elasticity and no market design
  - >-
    noisy_costs jitters marginal costs by ~1e-2 EUR/MWh, so zero-price tests need
    a <0.1 tolerance
  - the visible spatial spread is set by the clustering
  - the policy instrument (cap vs tax) flips the market-value trend
  recipes:
    generation_conversion:
    - gas-power-plants
    - fossil-fuel-supply
    - grid-scale-batteries
    - hv-transmission-lines
    - hvdc-interconnectors
    - transmission-expansion-projects
    demand:
    - electricity-load
    - demand-temporal-profiles
    - demand-spatial-disaggregation
  methods:
  - id: price-formation
    role: >-
      the core: hourly-rung solve with an explicit VOLL ceiling and all duals written
      — makes the price series a bounded first-class output instead of a solver artefact
  - id: existing-fleet
    role: >-
      which fleet sets the margin: the merit order IS the ingested fleet; date filters
      and anchoring decide the thermal-priced and zero-price hours
  - id: multi-scenario
    role: >-
      price statistics across futures — repeat the extraction over demand/CO2 variants
      with harmonised collection
  - id: pathway-myopic
    role: >-
      the trajectory: how the duration curve reshapes horizon by horizon as the system
      decarbonises
  - id: flow-based-market-coupling
    role: >-
      spatial prices under the market design actually in force — zonal clearing prices
      when the question is the market price, not the nodal shadow price
  defaults:
  - aspect: nodal-lmp-duals
    is: >-
      LMPs and congestion rent fall out of any solved network's duals — bus marginal
      prices ARE locational prices at whatever resolution the network was clustered
      to
  - aspect: expansion-prices
    is: >-
      the shipped solve is long-term co-optimised: its prices carry investment pressure
      and satisfy the zero-profit identity (each technology's market value equals
      its annualised cost)
    note: >-
      merit-order prices of a FIXED fleet — the market-comparable short-term reading
      — are the operations-solve fork inside the price-formation method, not the default.
  plots:
  - id: marginal_prices
    role: 'the level: snapshot-weighted mean price per bus carrier vs baseline'
  - id: price_duration
    role: >-
      the statistics: duration curve with zero-price share, p95 and ceiling-hours
      in its headline numbers
  - id: price_heatmap
    role: 'the temporal shape: hour-of-day x month chronology the duration curve destroys'
  - id: region_map
    role: 'the spatial distribution: regional mean price as a choropleth'
    params:
      quantity: price
  - id: dispatch_weeks
    role: why the price is what it is — the hourly balance behind the priced hours
  version_anchor:
    ref: 849c8858d2536ccf8eed0c2e838d22a474a7ee5d
    date: '2026-08-07'
- model: pypsa-earth
  coverage: partial
  approach: >-
    Workable but narrower than eur: the solved power network prices every bus at every
    snapshot, and the price-formation method makes ceiling, resolution and duals explicit
    (the gh1 fixture runs the full weather year at native hourly resolution). There
    is no dispatch-only rule, so short-term merit-order prices of a fixed fleet mean
    freezing capacities by hand (extendable off) rather than flipping a config key.
  pitfalls:
  - >-
    make_summary's price tables do not apply snapshot weightings and there is no market_values
    output — compute weighted means and capture prices from n.buses_t.marginal_price
    yourself, as the plot cards do
  - >-
    the sector chain's shipped temporal rungs (144h sopts) destroy the scarcity tail,
    so carrier prices beyond electricity are coarse-resolution only
  - >-
    spatial price claims inherit the OSM grid: check the country's data_quality scorecard
    before trusting nodal price geography, and prefer zonal aggregates over single-node
    prices
  - >-
    load shedding ships enabled at 100 EUR/kWh, so every default price series is silently
    capped — report VOLL and hours-at-ceiling beside every statistic
  - expansion duals are a competitive benchmark, not a market forecast
  - noisy_costs (~1e-2 EUR/MWh) means zero-price tests need a <0.1 tolerance
  recipes:
    generation_conversion:
    - gas-power-plants
    - fossil-fuel-supply
    - grid-scale-batteries
    - hv-transmission-lines
    - hvdc-interconnectors
    demand:
    - electricity-load
    - demand-temporal-profiles
    - demand-spatial-disaggregation
  methods:
  - id: price-formation
    role: >-
      the core: hourly-rung solve with an explicit VOLL ceiling and all duals written
      — makes the price series a bounded first-class output instead of a solver artefact
  - id: existing-fleet
    role: >-
      which fleet sets the margin: the merit order IS the ingested fleet; the powerplants
      filter decides the thermal-priced and zero-price hours
  - id: multi-scenario
    role: >-
      price statistics across futures — repeat the extraction over demand/CO2 variants
      with harmonised collection
  - id: pathway-myopic
    role: >-
      the trajectory: how the duration curve reshapes horizon by horizon as the system
      decarbonises
  - id: flow-based-market-coupling
    role: >-
      spatial prices under a zonal market design — zonal clearing prices over a user-authored
      zone map when the question is the market price, not the nodal shadow price
  defaults:
  - aspect: nodal-lmp-duals
    is: >-
      LMPs and congestion rent fall out of any solved network's duals — bus marginal
      prices ARE locational prices at whatever resolution the network was clustered
      to
  - aspect: voll-ceiling-shipped-on
    is: >-
      load shedding ships ENABLED at 100 EUR/kWh — every default earth price series
      is silently capped at 100000 EUR/MWh, and the cap is soft (finite shedding p_nom
      per bus)
    note: >-
      the price-formation method replaces the silent number with a declared VOLL;
      never report earth price spikes without naming the cap.
  plots:
  - id: marginal_prices
    role: 'the level: snapshot-weighted mean price per bus carrier vs baseline'
  - id: price_duration
    role: >-
      the statistics: duration curve with zero-price share, p95 and ceiling-hours
      in its headline numbers
  - id: price_heatmap
    role: 'the temporal shape: hour-of-day x month chronology the duration curve destroys'
  - id: region_map
    role: 'the spatial distribution: regional mean price as a choropleth'
    params:
      quantity: price
  - id: dispatch_weeks
    role: why the price is what it is — the hourly balance behind the priced hours
