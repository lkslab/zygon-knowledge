id: procurement
title: Procurement
question: >-
  How should firm capacity and energy be procured and remunerated: energy-only spot
  markets, capacity markets, strategic reserves, reliability options? What would each
  design procure, at what clearing price, and with what dispatch and investment signals?
  Market design as such, not least-cost planning.
when_to_use:
- capacity market vs energy-only vs strategic reserve
- what would a capacity auction procure / clear at
- missing-money problem for firm capacity
- derating factors for storage and VRE in capacity markets
- capacity remuneration mechanism design
- introduce a spot market / marginal pricing
- bidding-zone reconfiguration price outcomes
- what prices would a competitive market produce
- dispatch and price outcomes under market reform
- bidding, scarcity pricing, market power questions
- provincial vs unified market design (China)
