id: storage-dispatch
title: Storage dispatch
question: >-
  How much storage does the system need, of what duration and where, how is it dispatched
  against prices and constraints, and what does it earn across arbitrage, capacity
  and ancillary revenues? Sizing for planners, dispatch and the business case for
  developers and investors, from grid batteries to seasonal hydrogen.
when_to_use:
- how much battery storage does [system] need
- optimal battery power vs energy (duration) split
- where to site grid-scale batteries
- battery value / arbitrage revenue at a node
- storage vs grid vs peakers as substitutes
- how much long-duration / seasonal storage do we need
- hydrogen caverns vs pumped hydro vs iron-air for multi-day gaps
- storage duration mix at high VRE shares
- seasonal storage gap under deep decarbonization
- storage vs grid vs flexible demand as substitutes
- business case / revenue stack for a battery
- storage earnings beyond energy arbitrage
- capacity market plus ancillary revenue for storage
- merchant storage investment case
- how storage revenue shifts as VRE share rises
models:
- model: pypsa-eur
  approach: >-
    Both halves of the question are wired. Sizing: the electricity workflow builds
    battery and H2 as Store + charger/discharger Links at every bus
    (electricity.extendable_carriers.Store defaults to [battery, H2]), so power and
    energy are independent decisions and the duration is a RESULT, not an input;
    add_battery_constraints couples the battery charger and discharger; the
    StorageUnit path with electricity.max_hours (6 h battery, 168 h H2, and the wired
    iron-air/pair/lair/vanadium tokens) is the fixed-duration alternative; the sector
    chain adds cavern-priced, potential-capped seasonal H2 stores with fuel-cell and
    turbine re-electrification, home batteries, EV batteries and water tanks and pits.
    The settled sector baselines carry the utility battery Store and links at every AC
    bus (5-node 168h and 2-node 3h fixtures verified 2026-09-10 at the previous anchor — the grid-scale-batteries
    carrier card's claim that sector runs strip them is wrong at this ref). Business
    case: the price-formation method gives bounded prices and all duals (marginal
    storage value from the energy-balance dual), solve_operations_network re-dispatches
    a fixed fleet for market-comparable prices, and the storage-economics payload turns
    any solved network into the per-asset table — arbitrage revenue at the prices the
    asset faces, annualised cost, cost recovery (the LP zero-profit identity puts a
    freely built asset at ~1, verified 0.997-0.9996 on both baselines), cycles, capture
    and charge price, spread, realised duration, utilisation. A pre-scoped unit is a
    single-asset-cba composite (bus + store + two links) whose B1 is its system value.
  trade_offs:
  - >-
    coarsening past the shortest duration deletes it from the optimum — on the 168h
    fixture no battery is built and the cycle numbers are meaningless; size and value
    storage on the 3h fixture (config.de1.yaml) or finer, never on a weekly rung, and pay
    with nodes instead
  - >-
    cyclic state of charge over one weather year is an accounting fiction for seasonal
    stores (it pays for a full annual cycle); free endpoints understate the volume; an
    inter-annual question buys a weather-year ensemble, not one cyclic year
  - >-
    a storage answer belongs to its flexibility assumption — removing DSM and V2G raised
    stationary battery capacity 61% in the same model; the EV and DSM settings are a
    scenario axis to run, and to report beside the capacities
  limitations:
  - >-
    unintended storage cycling: the LP charges and discharges in the same snapshot when
    the round trip is free; noisy_costs (~1e-2 EUR/MWh) is two orders below the 0.5
    EUR/MWh Parzen recommends — add a variable cost and count simultaneous charge and
    discharge snapshots before quoting utilisation
  - >-
    the 6 h / 168 h StorageUnit durations are the shipped config, not a finding — duration
    is only a result in the Store + Links form
  - >-
    energy arbitrage is the only revenue stream: no capacity market, no aFRR/FCR or sub-
    hourly products, no imbalance settlement — read cost_recovery as the long-run energy-
    value share of a stack, a lower bound on a merchant case
  - >-
    marginal storage value needs solving.options.assign_all_duals: true (absent from
    config.default.yaml, bare .get() in solve_network) — both settled baselines were
    solved without it, so their mu_energy_balance frames are empty
  - >-
    the newer chemistry tokens (lfp, vanadium, pair, lair) have an uncoupled, zero-cost
    discharger in the Store form — audit their duration results
  - >-
    "storage TWh" is ill-defined across a sector-coupled network (EV batteries, water
    tanks, gas and H2 stores, indirect storage in MW of electrolyser) — enumerate the
    carriers the number covers
  - >-
    market-visible capacity is not nameplate: GB units split between wholesale and
    balancing, so an operations study of the real fleet needs the contracted share
  methods:
  - id: co2-budget
    role: >-
      how the emissions target enters the model and what the shipped default already
      caps — the consultant settles emissions_target against this card, never a share
  - id: price-formation
    role: >-
      the substrate every revenue number sits on: fine-resolution solve with a
      declared VOLL ceiling and all duals written, so prices, spreads and the marginal
      storage value are chosen system properties, not solver artefacts
  - id: storage-economics
    role: >-
      the business case per asset: revenue, annualised cost, cost recovery, cycles,
      capture and charge price, spread, realised duration and marginal storage value,
      from any solved network — the baseline, a price-formation run, CBA variants or
      myopic horizons
  - id: single-asset-cba
    role: >-
      a pre-scoped unit: PINT a fixed-size bus + store + charger + discharger composite
      against the fixed reference — B1 is its system value, and storage-economics on
      the same variant is its merchant value
  - id: multi-scenario
    role: >-
      revenue cannibalisation: repeat the extraction across VRE-share, CO2 and battery
      cost variants with harmonised collection — how the spread and cost recovery
      move as the system decarbonises
  - id: existing-fleet
    role: >-
      which storage is already there: electricity.estimate_battery_capacities attaches
      the powerplantmatching battery fleet as fixed units, and the PHS/hydro fleet is
      always ingested
  - id: pathway-myopic
    role: >-
      the timing dimension: when storage gets built and how its value shifts horizon
      by horizon as VRE shares rise and thermal plant retires
  defaults:
  - aspect: endogenous-duration
    is: >-
      battery and H2 enter as Store + charger/discharger Links at every bus
      (electricity.extendable_carriers.Store: [battery, H2]); energy and power are
      separate variables and the duration falls out of the solve
    note: >-
      a fixed-duration question (how much 4 h storage) moves the token to
      extendable_carriers.StorageUnit with electricity.max_hours — the carrier cards
      hold the levers.
  - aspect: cyclic-soc
    is: >-
      every Store and StorageUnit is cyclic (e_cyclic / cyclic_state_of_charge) over
      the single weather year
    note: rolling_horizon is the only config surface that changes it (cyclic off, initial zero).
  - aspect: no-degradation
    is: no cycle limits, degradation or state-of-charge-dependent behaviour anywhere
    note: an L5 custom constraint in extra_functionality; add_battery_constraints is the pattern.
  plots:
  - id: dispatch_weeks
    role: 'how the store is dispatched: the hourly balance in the weeks that set its value'
  - id: price_duration
    role: 'what it earns against: the duration curve, zero-price share and ceiling hours'
  - id: marginal_prices
    role: 'the level: snapshot-weighted mean price per bus carrier vs baseline'
  - id: capacity_mix
    role: 'how much and of what: optimal storage power and energy beside generation'
  - id: compare_system_cost
    role: 'what storage saves the system: total cost across variants or with/without'
