id: storage-dispatch
title: Storage dispatch
question: >-
  How much storage does the system need, of what duration and where, how is it dispatched
  against prices and constraints, and what does it earn across arbitrage, capacity
  and ancillary revenues? Sizing for planners, dispatch and the business case for
  developers and investors, from grid batteries to seasonal hydrogen.
when_to_use:
- how much battery storage does [system] need
- optimal battery power vs energy (duration) split
- where to site grid-scale batteries
- battery value / arbitrage revenue at a node
- storage vs grid vs peakers as substitutes
- how much long-duration / seasonal storage do we need
- hydrogen caverns vs pumped hydro vs iron-air for multi-day gaps
- storage duration mix at high VRE shares
- seasonal storage gap under deep decarbonization
- storage vs grid vs flexible demand as substitutes
- business case / revenue stack for a battery
- storage earnings beyond energy arbitrage
- capacity market plus ancillary revenue for storage
- merchant storage investment case
- how storage revenue shifts as VRE share rises
