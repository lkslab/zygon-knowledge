    verified for pypsa-earth yet. This card descends from the
    v1 cards transmission-expansion-planning (archived under archive/cookbooks/pypsa-earth/topics/v1/);
    the levers it can describe live in the carrier cards under carriers/ that carry a section for this model.
  trade_offs: []
  limitations:
  - >-
    no method spec is verified for pypsa-earth yet: the study runs on carrier levers and
    default config, and its results are unverified for this model
