id: cfd-ppa-settlement
title: Subsidies, CfDs and PPAs settled on one wind farm
summary: >-
  The cost-recovery year is solved once and nothing about the dispatch changes; the
  wind farm's hourly output and price are then settled under an energy-only market, a
  two-sided contract for difference, a fixed premium, a cap-and-floor, a pay-as-produced
  PPA and a baseload PPA, plus a CfD variant that pays no top-up in zero-price hours.
  Same electrons, different cheques: which scheme carries which risk, and what each
  costs the counterparty.
concepts: [cfd, ppa, subsidy, revenue, market-value, capture-rate, cost-recovery, price-risk]
answers:
- "what does a wind farm earn under a CfD versus the market"
- "how much does a contract for difference cost the government in a windy year"
- "what strike price makes a CfD revenue-neutral"
- "what is the difference between a pay-as-produced and a baseload PPA"
- "what is a capture rate and why is wind's below one"
builds_on: [price-duration-and-cost-recovery, capacity-expansion-single-node]
setup:
  buses: electricity and hydrogen, as in price-duration-and-cost-recovery
  components: identical to price-duration-and-cost-recovery (the 20 % cap year); settlement is post-processing
  snapshots: 2190 snapshots (a year every 4 hours), weight 4 h
  profiles: the base model's seeded load, wind and solar
  assumptions:
  - {name: strike, value: 70, unit: EUR/MWh, note: "two-sided CfD"}
  - {name: premium, value: 20, unit: EUR/MWh, note: "paid on top of the market price"}
  - {name: floor and cap, value: "30 and 120 EUR/MWh on the market price"}
  - {name: PPA price, value: 65, unit: EUR/MWh, note: "pay-as-produced and baseload alike"}
  - {name: baseload volume, value: "the farm's mean output, flat in every hour"}
  - {name: zero-price rule, value: "no CfD top-up in hours with a price at or below zero"}
method: |
  One `n.optimize()`, then arithmetic on `buses_t.marginal_price` and the wind
  generator's `generators_t.p` with snapshot weights. Market revenue is price times
  energy; the CfD pays strike times energy (the top-up is strike minus price, negative
  above the strike); the premium adds a constant per MWh; cap-and-floor clips the price;
  the pay-as-produced PPA is a fixed price on actual output; the baseload PPA is market
  revenue plus a swap of (PPA price minus market price) on a flat contracted volume, so
  the farm buys back the volume in still hours. Support cost is each scheme's revenue
  minus the market revenue. The revenue-neutral strike is the market value (revenue per
  MWh), and the capture rate is market value over the time-weighted mean price.
knobs:
- {name: "STRIKE, PREMIUM, FLOOR, CAP, PPA_PRICE, BASELOAD_PRICE", in: module constants, effect: "move the cheques; the market revenue and the physical dispatch never change"}
- {name: cap_fraction, in: "BASE.build (price-duration-and-cost-recovery)", effect: "more zero-price hours lower the capture rate and raise the CfD's cost"}
- {name: WINDOW, in: module constant, effect: "the ten days the two intuition figures draw"}
figures:
- id: cfd_intuition
  file: figures/cfd_intuition.json
  title: "What a CfD does: the price against the strike"
  shows: >-
    Ten days of the year's price, mostly zero with a few scarcity spikes to about 450 EUR/MWh,
    against the 70 EUR/MWh strike. Green is the top-up the farm receives while the price is below
    the strike, orange what it pays back while the price is above: per MWh produced it earns the
    strike either way.
- id: ppa_intuition
  file: figures/ppa_intuition.json
  title: "What a PPA does: a fixed price, and whose volume"
  shows: >-
    Top: the same ten days against a 65 EUR/MWh PPA price; a pay-as-produced PPA settles like a
    CfD, with a company in place of the state. Bottom: the farm's output against the flat volume
    a baseload PPA promises; the orange shortfall (bought at spot) falls in the still hours, which
    are the spike hours: that is shape risk.
- id: revenue_by_scheme
  file: figures/revenue_by_scheme.json
  title: Annual wind revenue by scheme
  shows: >-
    One bar per scheme, same output and prices. The CfD and the pay-as-produced PPA remove price
    risk; the premium and the floor add to it; the baseload PPA goes negative because the farm buys
    back the flat volume in still, expensive hours.
- id: monthly_revenue
  file: figures/monthly_revenue.json
  title: "Monthly revenue: market, CfD, premium"
  shows: >-
    Market revenue follows wind and price; the CfD follows wind only, so windy months with low
    prices are where the top-up is largest.
teach:
- concept: cfd
  gap: >-
    A wind farm is paid the market price for what it produces, and it has to pay back its
    capital over twenty years. In a system full of wind and solar the price sits at zero much of
    the time (whenever renewables alone cover demand) and spikes rarely, so the farm cannot know
    what it will earn; lenders price that uncertainty in, and the farm gets expensive or is not built.
  remedy: >-
    A contract for difference fixes the price per MWh produced at a strike. When the market pays
    less, the state tops the farm up to the strike; when it pays more, the farm hands the excess
    back. The farm earns the strike either way and still sells its power on the market as usual.
  figure: cfd_intuition
  example: >-
    In this toy year the price is zero in about 65 % of hours and wind earns about 60 EUR/MWh on
    the market (capture rate about 0.4 of the mean price); a 70 EUR/MWh strike costs the state
    about 8 MEUR a year net (share_hours_zero_price_pct, market_value_eur_mwh, capture_rate,
    support_cost_meur_a).
- concept: ppa
  gap: >-
    The same revenue risk as for a CfD, seen from a buyer who wants a stable electricity cost
    for years ahead, such as a factory or a data centre.
  remedy: >-
    A power purchase agreement is the same hedge struck privately: the buyer pays a fixed price
    for the farm's power, topping up when the market is low and keeping the difference when it is
    high. What is new is the volume: pay-as-produced takes whatever the farm makes, so the buyer
    carries the weather; baseload promises a flat amount, so the farm must buy the shortfall in
    still hours, and those are the expensive ones.
  figure: ppa_intuition
  builds_on_concept: cfd
  example: >-
    Pay-as-produced at 65 EUR/MWh gives the farm exactly 65 per MWh; the baseload PPA at the same
    price leaves it at about -21 MEUR for the year, because the shortfall is bought back in spike
    hours (revenue_per_mwh_eur, revenue_meur_a).
pypsa_example:
  model: renewable-revenue-risk
  why: >-
    Where the zero-price hours that make CfDs and PPAs necessary come from: the same single-node
    PyPSA model solved at rising renewable shares, showing the zero-price hours grow, wind's
    capture rate fall and its week-to-week revenue swing harder.
  figures: [zero_price_and_capture_rate, weekly_wind_revenue, price_duration_by_case]
numbers:
- {id: wind_energy_gwh, label: Wind output over the year, unit: GWh}
- {id: mean_price_eur_mwh, label: Time-weighted mean price, unit: EUR/MWh}
- {id: market_value_eur_mwh, label: Market revenue per MWh of wind, unit: EUR/MWh}
- {id: capture_rate, label: Market value over mean price, unit: ratio}
- {id: revenue_neutral_strike_eur_mwh, label: Strike at which the CfD pays out nothing net, unit: EUR/MWh}
- {id: lcoe_eur_mwh, label: Annualised cost per MWh, unit: EUR/MWh, note: "equals market value at the LP optimum"}
- {id: revenue_meur_a, label: Revenue per scheme, unit: MEUR/a}
- {id: support_cost_meur_a, label: Revenue minus market revenue per scheme, unit: MEUR/a}
- {id: revenue_per_mwh_eur, label: Revenue per MWh per scheme, unit: EUR/MWh}
- {id: share_hours_zero_price_pct, label: Share of hours at zero price, unit: "%"}
- {id: share_wind_energy_at_zero_price_pct, label: Share of wind energy produced at zero price, unit: "%"}
limitations:
- Settlement does not feed back into dispatch: a farm on a CfD would curtail in negative-price hours, which needs the contract inside the optimisation.
- No negative prices in this system, so the zero-price rule bites on the zero hours only.
- One farm, one year; scheme costs scale with the weather year.
sources:
- {title: "PyPSA example: Subsidies, CfDs and PPAs", url: "https://docs.pypsa.org/latest/examples/cfd-ppa-settlement/"}
- {title: "PyPSA user guide: Statistics (revenue, market value)", url: "https://docs.pypsa.org/latest/user-guide/statistics/"}
pypsa: "1.3.0"
