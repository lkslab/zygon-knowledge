id: cfd-ppa-settlement
title: Subsidies, CfDs and PPAs settled on one wind farm
summary: >-
  The cost-recovery year is solved once and nothing about the dispatch changes; the
  wind farm's hourly output and price are then settled under an energy-only market, a
  two-sided contract for difference, a fixed premium, a cap-and-floor, a pay-as-produced
  PPA and a baseload PPA, plus a CfD variant that pays no top-up in zero-price hours.
  Same electrons, different cheques: which scheme carries which risk, and what each
  costs the counterparty.
concepts: [cfd, ppa, subsidy, revenue, market-value, capture-rate, cost-recovery, price-risk]
answers:
- "what does a wind farm earn under a CfD versus the market"
- "how much does a contract for difference cost the government in a windy year"
- "what strike price makes a CfD revenue-neutral"
- "what is the difference between a pay-as-produced and a baseload PPA"
- "what is a capture rate and why is wind's below one"
builds_on: [price-duration-and-cost-recovery, capacity-expansion-single-node]
setup:
  buses: electricity and hydrogen, as in price-duration-and-cost-recovery
  components: identical to price-duration-and-cost-recovery (the 20 % cap year); settlement is post-processing
  snapshots: 2190 snapshots (a year every 4 hours), weight 4 h
  profiles: the base model's seeded load, wind and solar
  assumptions:
  - {name: strike, value: 70, unit: EUR/MWh, note: "two-sided CfD"}
  - {name: premium, value: 20, unit: EUR/MWh, note: "paid on top of the market price"}
  - {name: floor and cap, value: "30 and 120 EUR/MWh on the market price"}
  - {name: PPA price, value: 65, unit: EUR/MWh, note: "pay-as-produced and baseload alike"}
  - {name: baseload volume, value: "the farm's mean output, flat in every hour"}
  - {name: zero-price rule, value: "no CfD top-up in hours with a price at or below zero"}
method: |
  One `n.optimize()`, then arithmetic on `buses_t.marginal_price` and the wind
  generator's `generators_t.p` with snapshot weights. Market revenue is price times
  energy; the CfD pays strike times energy (the top-up is strike minus price, negative
  above the strike); the premium adds a constant per MWh; cap-and-floor clips the price;
  the pay-as-produced PPA is a fixed price on actual output; the baseload PPA is market
  revenue plus a swap of (PPA price minus market price) on a flat contracted volume, so
  the farm buys back the volume in still hours. Support cost is each scheme's revenue
  minus the market revenue. The revenue-neutral strike is the market value (revenue per
  MWh), and the capture rate is market value over the time-weighted mean price.
knobs:
- {name: strike, premium, floor, cap, PPA price, in: module constants, effect: "move the cheques; the market revenue and the physical dispatch never change"}
- {name: cap fraction, in: BASE (price-duration-and-cost-recovery), effect: "more zero-price hours lower the capture rate and raise the CfD's cost"}
figures:
- id: revenue_by_scheme
  file: figures/revenue_by_scheme.json
  title: Annual wind revenue by scheme
  shows: One bar per scheme; the gap to the market bar is the support cost or the shape-risk loss.
- id: monthly_revenue
  file: figures/monthly_revenue.json
  title: Monthly revenue under market, CfD and premium
  shows: Market revenue follows wind and price; the CfD follows wind only.
- id: price_vs_strike_week
  file: figures/price_vs_strike_week.json
  title: Price, strike and top-up in one February week
  shows: The top-up per MWh, positive in cheap hours and negative above the strike.
numbers:
- {id: wind_energy_gwh, label: Wind output over the year, unit: GWh}
- {id: mean_price_eur_mwh, label: Time-weighted mean price, unit: EUR/MWh}
- {id: market_value_eur_mwh, label: Market revenue per MWh of wind, unit: EUR/MWh}
- {id: capture_rate, label: Market value over mean price, unit: ratio}
- {id: revenue_neutral_strike_eur_mwh, label: Strike at which the CfD pays out nothing net, unit: EUR/MWh}
- {id: lcoe_eur_mwh, label: Annualised cost per MWh, unit: EUR/MWh, note: "equals market value at the LP optimum"}
- {id: revenue_meur_a, label: Revenue per scheme, unit: MEUR/a}
- {id: support_cost_meur_a, label: Revenue minus market revenue per scheme, unit: MEUR/a}
- {id: revenue_per_mwh_eur, label: Revenue per MWh per scheme, unit: EUR/MWh}
- {id: share_hours_zero_price_pct, label: Share of hours at zero price, unit: "%"}
- {id: share_wind_energy_at_zero_price_pct, label: Share of wind energy produced at zero price, unit: "%"}
limitations:
- Settlement does not feed back into dispatch: a farm on a CfD would curtail in negative-price hours, which needs the contract inside the optimisation.
- No negative prices in this system, so the zero-price rule bites on the zero hours only.
- One farm, one year; scheme costs scale with the weather year.
sources:
- {title: "PyPSA example: Subsidies, CfDs and PPAs", url: "https://docs.pypsa.org/latest/examples/cfd-ppa-settlement/"}
- {title: "PyPSA user guide: Statistics (revenue, market value)", url: "https://docs.pypsa.org/latest/user-guide/statistics/"}
pypsa: "1.3.0"
