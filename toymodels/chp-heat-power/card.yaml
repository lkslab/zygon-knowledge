id: chp-heat-power
title: Backpressure and extraction CHP against a boiler and a heat pump
summary: >-
  Two kinds of combined heat and power plant serve an electricity and a heat load over a
  winter fortnight, beside a gas boiler and a heat pump. The backpressure unit has a
  fixed heat-to-power ratio (one Link with two outputs); the extraction-condensing unit
  moves inside a feasible region between an iso-fuel line and a backpressure line, two
  custom linopy constraints on two Links that share one fuel budget.
concepts: [chp, cogeneration, heat, multi-output-link, custom-constraint, extra-functionality, heat-pump, gas-boiler]
answers:
- "how do I model a CHP plant in PyPSA"
- "what is the difference between a backpressure and an extraction-condensing CHP"
- "when does a CHP condense more power and let the boiler cover heat"
- "how do I add a feasible operating region with extra_functionality"
builds_on: []
setup:
  buses: electricity, heat, gas
  components:
  - a gas supply Generator on the gas bus at a fixed fuel price
  - wind and an OCGT peaker on the electricity bus, load shedding on both electricity and heat
  - Link "CHP" (backpressure) gas to electricity (bus1) and heat (bus2) with efficiency and efficiency2
  - Links "CHP extraction power" and "CHP extraction heat" from gas, coupled by two constraints
  - Link "gas boiler" gas to heat and Link "heat pump" electricity to heat
  - an electricity Load (daily shape) and a winter heat Load
  snapshots: 336 hourly snapshots (8-21 January), weight 1
  profiles: daily load 70-130 MW; the January slice of the degree-day heat profile; AR(1) wind; seed 42
  assumptions:
  - {name: gas price, value: 30, unit: EUR/MWh thermal}
  - {name: backpressure CHP, value: "100 MW fuel, 40 % electric, 45 % heat"}
  - {name: extraction CHP, value: "200 MW fuel, eta_el 0.45, c_v 0.15, c_m 0.75"}
  - {name: gas boiler, value: "120 MW thermal, 90 %"}
  - {name: heat pump, value: "25 MW electric, COP 2.8"}
  - {name: wind and OCGT, value: "150 MW wind, 200 MW OCGT at 120 EUR/MWh"}
method: |
  The extraction plant follows the PyPSA power-to-gas-boiler-chp example. Its power link
  has efficiency eta_el; its heat link has "efficiency" eta_el / c_v, so that the fuel it
  draws equals the power given up for the heat it makes. `extra_functionality` then adds
  two linopy constraints on `n.model["Link-p"]` (dimension `name` in PyPSA 1.3):
  p_power + p_heat <= F_max (the iso-fuel top line) and p_power >= (c_m / c_v) p_heat
  (the backpressure line). The backpressure plant needs no constraint: one Link with
  bus2 = heat and efficiency2 fixes the ratio. Heat prices are the heat bus duals.
knobs:
- {name: c_v and c_m, in: "C_V, C_M", effect: "the shape of the feasible region: a lower c_v makes heat cheaper to extract, a higher c_m narrows the region"}
- {name: gas price, in: GAS_COST, effect: "moves the CHPs against the heat pump"}
- {name: heat pump size, in: HEAT_PUMP_MW_EL, effect: "more heat pump means the CHPs condense more in windy hours"}
figures:
- id: chp_feasible_region
  file: figures/chp_feasible_region.json
  title: Feasible region of the extraction CHP
  shows: >-
    What the extraction plant can do, power against heat. With full fuel it can make 90 MW of power and no heat
    (top left) or trade power for heat along the iso-fuel line; the backpressure line is the most heat it can take
    for the power it makes. It can run anywhere in the green region. The grey dots are its hours: most sit on the
    backpressure line, making the most heat, and some move up into the region when power is dear.
- id: heat_supply
  file: figures/heat_supply.json
  title: Heat supply over the fortnight
  shows: Stacked heat from both CHPs, the boiler and the heat pump against the heat load.
- id: power_vs_heat
  file: figures/power_vs_heat.json
  title: Extraction CHP power and heat against the electricity price
  shows: The unit condenses more when the price is high and extracts more heat when wind pushes it down.
teach:
- concept: chp
  gap: >-
    A power plant burning gas turns less than half of the fuel into electricity; the rest leaves as heat up the
    chimney or into a river. A boiler makes only heat. A combined heat and power plant makes both from the same fuel
    and wastes far less, but it cannot choose them freely: taking more heat out of its steam leaves less to make
    power. A model with separate power plants and boilers cannot see that trade-off. The picture
    (chp_feasible_region) shows what one such plant can do.
  remedy: >-
    Model the plant's feasible region. A backpressure plant makes heat and power in a fixed ratio: one link from the
    gas bus with two outputs, electricity and heat. An extraction plant can move within a region, between a line
    of full fuel (more heat costs a little power) and a line of maximum heat extraction; in PyPSA that is two links
    sharing one fuel budget, tied by two custom constraints. The optimiser then decides each hour where in the
    region to run, depending on what power and heat are worth.
  figure: chp_feasible_region
  example: >-
    The extraction plant sits on its backpressure line, making the most heat, in about 88 % of hours; both CHPs use
    about 85 % of their fuel, and together they supply about 70 % of the heat and 58 % of the electricity; heat
    costs between 10 and 33 EUR/MWh (hours_extraction_on_backpressure_line_pct,
    extraction_fuel_utilisation_pct, heat_share_pct, electricity_from_chp_pct, heat_price_range_eur_mwh). One layer
    deeper, heat_supply shows who makes the heat and power_vs_heat how the plant follows the electricity price.
numbers:
- {id: heat_share_pct, label: Share of heat from each source, unit: "%"}
- {id: extraction_heat_to_power_ratio, label: Realised heat over power of the extraction unit, unit: ratio}
- {id: extraction_fuel_utilisation_pct, label: (Power + heat) over fuel of the extraction unit, unit: "%"}
- {id: backpressure_fuel_utilisation_pct, label: The same for the backpressure unit (fixed at 85 %), unit: "%"}
- {id: hours_extraction_on_backpressure_line_pct, label: Share of hours the extraction unit sits on the backpressure line, unit: "%"}
- {id: hours_extraction_full_condensing_pct, label: Share of hours it makes no heat at all, unit: "%"}
- {id: mean_price_eur_mwh, label: Mean electricity and heat prices, unit: EUR/MWh}
- {id: heat_price_range_eur_mwh, label: Lowest and highest heat price, unit: EUR/MWh}
- {id: gas_burned_gwh, label: Fuel over the fortnight, unit: GWh}
- {id: total_cost_meur, label: Objective over the fortnight, unit: MEUR}
- {id: electricity_from_chp_pct, label: CHP share of electricity demand, unit: "%"}
limitations:
- No minimum load, start-up cost or ramp on the CHPs; combine with unit-commitment for that.
- The heat bus is lumped; no network losses, no thermal storage (see sector-coupling-single-node for a tank).
sources:
- {title: "PyPSA example: Backpressure CHPs", url: "https://docs.pypsa.org/latest/examples/chp-fixed-heat-power-ratio/"}
- {title: "PyPSA example: Extraction-Condensing CHPs", url: "https://docs.pypsa.org/latest/examples/power-to-gas-boiler-chp/"}
- {title: "PyPSA user guide: custom constraints", url: "https://docs.pypsa.org/latest/user-guide/optimization/custom-constraints/"}
pypsa: "1.3.0"
