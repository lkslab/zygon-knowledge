id: component-generator
title: What a Generator is
summary: >-
  One bus, one load, two Generators built from the same PyPSA component: a wind farm whose
  availability changes every hour and a gas plant that is always available but costs
  55 EUR/MWh to run. The smallest network that shows what a Generator's attributes do: it
  is one decision per hour, bounded by its capacity times its availability, and the
  optimiser fills the load with the cheaper one first.
concepts: [pypsa-component, generator, p-max-pu, marginal-cost]
answers:
- "what is a Generator in PyPSA"
- "what do p_nom, marginal_cost and p_max_pu mean"
- "how can a wind farm and a gas plant be the same component"
- "why does the gas plant only run when the wind is short, and why is some wind curtailed"
builds_on: []
setup:
  buses: one electricity bus (AC) called grid
  components:
  - a Generator onwind with p_nom 2000 MW, marginal_cost 0 and an hourly p_max_pu series (wind availability)
  - a Generator CCGT with p_nom 1200 MW, marginal_cost 55 EUR/MWh and the default p_max_pu of 1
  - one Load with a two-hump daily shape, well under the gas plant alone so nothing is ever unserved
  snapshots: 24 hourly snapshots, weight 1 (one day)
  profiles: synthetic wind capacity factor (AR(1) on the logit scale, mean 0.35, seed 42) and daily load, seed 42
  assumptions:
  - {name: bus, value: "grid for both Generators: the bus whose balance their output enters (required)"}
  - {name: carrier, value: "onwind and CCGT: a label the model uses for colours, groupings and carrier-wide constraints"}
  - {name: p_nom, value: "2000 MW wind, 1200 MW gas: the capacity the output is bounded by", unit: MW}
  - {name: marginal_cost, value: "0 for wind, 55 for gas: what one more MWh costs, the term each Generator adds to the objective", unit: EUR/MWh}
  - {name: p_max_pu, value: "an hourly series between 0.16 and 0.51 for wind, the default 1 for gas: the share of p_nom available in each snapshot", unit: per unit}
  - {name: p_min_pu, value: "default 0 for both: the Generator may always produce nothing", unit: per unit}
  - {name: efficiency, value: "default 1: only matters once primary energy or emissions are accounted for", unit: per unit}
  - {name: p_nom_extendable, value: "default False: the capacity is given, not a decision"}
  - {name: sign, value: "default 1: output counts as generation at the bus"}
method: |
  Plain `n.optimize()` with HiGHS. A Generator contributes one variable per snapshot,
  `p[g, t]`, bounded by `p_nom * p_min_pu[t] <= p[g, t] <= p_nom * p_max_pu[t]`, enters its
  bus's balance with `+p[g, t]` and the objective with `marginal_cost * p[g, t]`. That is the
  whole component: every other attribute either changes one of those three things or is
  ignored by the optimisation. The optimiser dispatches the free wind first and the gas plant
  for what is left, and curtails wind whenever its upper bound exceeds the load.
knobs:
- {name: wind_p_nom, in: "build(wind_p_nom=...)", effect: "more wind capacity raises the upper bound; the output follows it until the load is met and the rest is curtailed"}
- {name: gas_p_nom, in: "build(gas_p_nom=...)", effect: "below the peak minus the wind available in that hour, the problem becomes infeasible: a Generator cannot exceed its bound"}
- {name: gas_marginal_cost, in: "build(gas_marginal_cost=...)", effect: "scales the total cost one to one; the dispatch does not change as long as gas stays dearer than wind"}
figures:
- id: generator_schematic
  file: figures/generator_schematic.json
  title: Two Generators on one bus
  shows: >-
    The network as a one-line diagram: the busbar grid, the two Generators hung off it as
    circles marked G in their carrier colours, each with the attributes that define it
    (bus, p_nom, marginal_cost, p_max_pu), and the load below, muted because it is not the
    subject. The wind farm and the gas plant differ only in the values of those attributes.
- id: dispatch_within_bounds
  file: figures/dispatch_within_bounds.json
  title: Output stays inside p_nom times p_max_pu
  shows: >-
    Hourly output of the two Generators stacked, the wind farm's upper bound p_nom times
    p_max_pu as a dashed line and the load as a line. Wind output rides its bound whenever
    the bound is below the load and the gas plant fills the gap; where the bound rises above
    the load the wind output stops at the load and the difference is curtailed.
teach:
- concept: generator
  gap: >-
    A power plant is many things at once: a turbine, a fuel contract, a site, an operator's
    plan. An optimiser needs one thing it can decide. Without a fixed idea of what a plant is,
    a wind farm and a gas plant look like different objects, and it is unclear what the
    optimiser is choosing when it "runs" one of them.
  remedy: >-
    In PyPSA a Generator is one number per hour, its output, with three things around it: the
    bus it sits on, an upper bound (p_nom times p_max_pu, a time series for wind, 1 for gas) and
    a cost per MWh (marginal_cost). The schematic (generator_schematic) shows exactly that: the
    same symbol twice, the values beside it the only difference. Everything the optimiser does
    with a plant follows from those three things.
  figure: generator_schematic
  example: >-
    The wind farm could give 16,800 MWh over the day (wind_available_mwh) and delivers 16,107
    (wind_energy_mwh); the 693 MWh difference (wind_curtailed_mwh) is the hours where its bound
    sits above the load. The gas plant runs in 17 of 24 hours (hours_gas_runs) for 4,850 MWh
    (gas_energy_mwh), and the day costs 266,758 EUR (total_cost_eur), all of it gas. One layer
    deeper, dispatch_within_bounds shows the wind output riding its dashed bound.
numbers:
- {id: wind_energy_mwh, label: Wind energy delivered over the day, unit: MWh, formula: "sum_t p_onwind,t"}
- {id: wind_available_mwh, label: Wind energy the bound would allow, unit: MWh, formula: "sum_t p_nom * p_max_pu_t"}
- {id: wind_curtailed_mwh, label: Wind energy curtailed, unit: MWh, formula: "sum_t max(0, p_nom * p_max_pu_t - p_onwind,t)"}
- {id: gas_energy_mwh, label: Gas energy delivered over the day, unit: MWh, formula: "sum_t p_CCGT,t"}
- {id: hours_gas_runs, label: Hours the gas plant produces, unit: h, formula: "count of hours with p_CCGT,t > 0"}
- {id: total_cost_eur, label: Total dispatch cost for the day, unit: EUR, formula: "sum_t sum_g marginal_cost_g * p_{g,t}"}
- {id: peak_load_mw, label: Peak load, unit: MW, formula: max_t load_t}
- {id: wind_p_max_pu_range, label: Lowest and highest hourly wind availability, unit: per unit, formula: "[min_t p_max_pu_t, max_t p_max_pu_t]"}
limitations:
- Capacities are given, so nothing about building a Generator (p_nom_extendable, capital_cost); see capacity-expansion-single-node.
- No ramping, start-up costs or minimum up-times: the output is a free variable between its bounds every hour; see unit-commitment.
- efficiency and carrier do nothing here, since no fuel is tracked and no emissions are capped; see carbon-management and capacity-expansion-single-node.
sources:
- {title: "PyPSA user guide: Generator", url: "https://docs.pypsa.org/latest/user-guide/components/generators/"}
- {title: "PyPSA example: Electricity Market", url: "https://docs.pypsa.org/latest/examples/simple-electricity-market-examples/"}
pypsa: "1.3.0"
