id: cost-sensitivity
title: Sensitivity of the optimal mix to technology costs
summary: >-
  The two-fortnight single-node expansion (wind, solar, gas, battery under a 20 % CO2
  cap) re-solved with each overnight cost moved 30 % up and down on its own (a tornado)
  and with 16 joint draws from a Latin hypercube over all four costs (a crude global
  sensitivity). Which cost the answer hangs on, and which technologies are structural
  rather than a cost call.
concepts: [sensitivity-analysis, uncertainty, capacity-expansion, technology-cost, tornado, latin-hypercube]
answers:
- "which technology cost assumption matters most for the result"
- "how robust is the optimal mix to capital cost uncertainty"
- "how do I run a one-at-a-time sensitivity on a PyPSA model"
- "what is a cheap alternative to a full Sobol analysis"
builds_on: [capacity-expansion-single-node]
setup:
  buses: one electricity bus
  components:
  - extendable Generators onwind, solar, CCGT and an extendable StorageUnit battery, costs from the base model
  - a load-shedding Generator and one GlobalConstraint on CO2
  snapshots: 112 snapshots (two fortnights at 4-hour resolution), weighted to a year
  profiles: the base model's load, wind and solar sliced to 8-21 January and 8-21 July
  assumptions:
  - {name: swing, value: "plus or minus 30 % on each overnight cost"}
  - {name: draws, value: "16 Latin-hypercube points in the four-dimensional box, seed 7"}
  - {name: co2 cap, value: "20 % of this network's own unconstrained emissions"}
  - {name: technology costs, value: "as capacity-expansion-single-node at multiplier 1"}
method: |
  25 solves of `n.optimize()`: the base, eight one-at-a-time cases and sixteen joint
  draws, all fresh networks with the capital cost of one or more technologies scaled
  through `finance.capital_cost`. Elasticity of system cost to a parameter is the
  relative cost change over the relative cost-input change across the two one-at-a-time
  cases. The Latin hypercube stratifies each dimension into 16 bins and pairs them
  randomly (numpy only). A least-squares fit of cost on the four multipliers gives a
  crude share of variance per parameter; it is a linear proxy, not Sobol indices.
knobs:
- {name: swing and draws, in: "SWING, DRAWS, SEED", effect: "wider swings and more draws for a fuller picture at proportional solve time"}
- {name: parameters, in: PARAMS, effect: "add fuel price or the discount rate as further dimensions"}
- {name: cap, in: CAP_FRACTION, effect: "a tight cap makes gas cost irrelevant and wind cost decisive"}
figures:
- id: tornado
  file: figures/tornado.json
  title: Tornado of system cost against each cost moved 30 %
  shows: Change in annual system cost per parameter, low and high, longest bar first.
- id: capacity_ranges
  file: figures/capacity_ranges.json
  title: Capacity across 16 joint cost draws
  shows: Minimum, median and maximum optimal capacity per technology over the draws.
- id: cost_vs_wind_capex
  file: figures/cost_vs_wind_capex.json
  title: System cost against the wind cost draw
  shows: One point per draw; the scatter around the trend is the other three costs.
numbers:
- {id: base_cost_meur_a, label: System cost at multiplier 1, unit: MEUR/a}
- {id: base_capacity_mw, label: Optimal capacity at multiplier 1, unit: MW}
- {id: cost_elasticity, label: Relative cost change per relative cost-input change, per parameter, unit: ratio}
- {id: dominant_parameter, label: The parameter with the largest elasticity}
- {id: tornado_cost_meur_a, label: System cost at -30 % and +30 % per parameter, unit: MEUR/a}
- {id: capacity_range_across_draws_mw, label: Min, median, max capacity per technology over the draws, unit: MW}
- {id: cost_range_across_draws_meur_a, label: Lowest and highest system cost over the draws, unit: MEUR/a}
- {id: variance_share_linear_fit, label: Share of cost variance attributed to each parameter by a linear fit, unit: fraction}
limitations:
- Two fortnights and 16 draws: the shape of the sensitivities is right, the digits are not.
- The variance shares come from a linear fit; interactions and nonlinearity are invisible to it (the PyPSA GSA example uses SALib's Sobol indices for that).
sources:
- {title: "PyPSA example: Global Sensitivity Analysis", url: "https://docs.pypsa.org/latest/examples/gsa/"}
pypsa: "1.3.0"
