id: ev-charging-v2g
title: "Electric vehicles: uncontrolled, smart and vehicle-to-grid charging"
summary: >-
  A fleet of 100,000 electric vehicles on a market bus over one week, charged three
  ways. Uncontrolled charging draws full power the moment the cars plug in after the
  evening commute; smart charging waits for the cheap night hours; vehicle-to-grid also
  sells back into the evening peak. Same cars, same driving, same fleet of power plants.
concepts: [electric-vehicles, smart-charging, vehicle-to-grid, flexible-load, storage, arbitrage, peak-load]
answers:
- "what does uncontrolled EV charging do to the evening peak"
- "how much does smart charging save compared with charging on arrival"
- "what can vehicle-to-grid earn and how hard does it cycle the batteries"
- "how do I model an EV fleet with availability and driving demand in PyPSA"
builds_on: [storage-arbitrage]
setup:
  buses: grid (AC) and EV (the fleet's batteries)
  components:
  - the storage-arbitrage fleet (nuclear, lignite, CCGT, OCGT) plus 6 GW of wind and load shedding on the grid bus
  - a Store "EV battery" for the whole fleet with a 20 % floor, cyclic in the optimised cases
  - a Load "driving" on the EV bus in the commute hours
  - a Link "battery charger" grid to EV with an availability profile (plugged in 19:00-07:00 and 11:00-14:00 on weekdays, all day at weekends)
  - in the V2G case a second Link "battery discharger" EV to grid with the same availability
  snapshots: 168 hourly snapshots (seven days), weight 1
  profiles: daily load 5000 to 10000 MW; AR(1) wind; the plug-in and driving patterns above; seed 42
  assumptions:
  - {name: fleet, value: "100,000 cars, 40 kWh each (4000 MWh), 11 kW chargers (1100 MW), 10 kWh driven per weekday (1000 MWh)"}
  - {name: charger efficiency, value: 0.9, note: "each way; V2G pays it twice"}
  - {name: minimum state of charge, value: "20 %"}
  - {name: driving hours, value: "07:00, 08:00, 17:00, 18:00 on weekdays"}
  - {name: fleet prices, value: "as storage-arbitrage"}
method: |
  Three solves of the same network. Uncontrolled: the charging schedule is not a decision;
  it is simulated hour by hour (full power whenever plugged in and not full, starting
  full) and fixed on the charger with p_min_pu = p_max_pu, so the optimiser only
  dispatches the plants around it. Smart: the charger is free within its availability and
  the cyclic store must cover the driving load; `n.optimize()` places charging in the
  cheapest hours. V2G: a discharger link back to the grid lets the fleet arbitrage. The
  fleet's bill is price times grid draw; V2G revenue is price times what it sells back;
  cycles are driving plus resold energy over the fleet's capacity.
knobs:
- {name: fleet size and chargers, in: "N_EV, EV_KWH, CHARGER_KW, DRIVE_KWH_PER_DAY", effect: "scale the fleet against a 10 GW system; a million cars would move the price"}
- {name: availability, in: "PLUGGED_HOURS, DRIVING_HOURS", effect: "workplace charging (plugged at midday) is what lets solar in"}
- {name: minimum state of charge, in: MIN_SOC, effect: "the driver's comfort margin; higher floors cut V2G revenue"}
figures:
- id: peak_intuition
  file: figures/peak_intuition.json
  title: "Same cars, same energy: when they charge is what matters"
  shows: >-
    Two weekdays of demand without the cars (grey), then with 100,000 electric cars added. Charged the moment
    they plug in after the evening commute (orange), they add about 560 MW on top of the evening peak of about
    10,000 MW. Charged in the cheap hours instead (dashed green), the same energy goes in at night and around
    midday, and the peak does not grow.
- id: charging_vs_price
  file: figures/charging_vs_price.json
  title: Charging power against the price
  shows: Grid draw of the fleet per case, V2G net of what it sells back, with the smart-case price on the right axis.
- id: state_of_charge
  file: figures/state_of_charge.json
  title: Fleet state of charge
  shows: Energy in the fleet's batteries per case as a share of capacity.
- id: cost_comparison
  file: figures/cost_comparison.json
  title: System cost and the fleet's electricity bill
  shows: Dispatch cost of the whole system and the fleet's net charging cost per case.
teach:
- concept: smart-charging
  gap: >-
    Electric cars add a lot of demand, and people plug them in when they get home, just as everyone else turns
    on lights, cookers and heating. Charged at once, a fleet lands its whole demand on the evening peak, the
    most expensive hours, the ones that decide how many power plants and how much grid are needed. Yet a car
    parked overnight rarely needs to charge at 18:00. The picture (peak_intuition) shows the same cars charged
    both ways.
  remedy: >-
    Smart charging lets the car wait: it only has to be ready by morning, so it charges when power is cheap and
    plentiful, overnight or when the wind blows. The energy is the same; its timing moves out of the peak into
    the troughs, so the peak does not grow and the fleet pays less. In PyPSA the fleet is a store (the
    batteries) behind a charger link that is only available while the cars are plugged in, with the driving as
    a load on the battery bus.
  figure: peak_intuition
  example: >-
    Charging at once adds about 560 MW to the week's peak and costs the fleet about 380,000 EUR at about 69
    EUR/MWh; charging smartly adds nothing to the peak and costs about 140,000 at 25 EUR/MWh, and the whole
    system saves about 206,000 EUR in the week (peak_load_increase_mw, charging_cost_eur,
    avg_charging_price_eur_mwh, system_cost_saving_vs_uncontrolled_eur). One layer deeper, charging_vs_price
    shows each case's charging against the price.
- concept: vehicle-to-grid
  gap: >-
    Smart charging only shifts when the cars take power. But a parked fleet is also a large battery that sits
    idle most of the day.
  remedy: >-
    Vehicle-to-grid lets the plugged-in cars also sell power back into the evening peak and refill later, like
    a stationary battery, as long as they are charged enough for the next drive. The fleet then earns the price
    spread, and the system needs less peak generation, at the cost of more battery cycles.
  figure: charging_vs_price
  builds_on_concept: smart-charging
  example: >-
    With vehicle-to-grid the fleet sells about 8,300 MWh back in the week and its net electricity bill falls to
    about 8,000 EUR; the system saves about 518,000 EUR against uncontrolled charging, but the batteries cycle
    about 3.6 times instead of 1.25 (discharged_to_grid_mwh, net_ev_cost_eur,
    system_cost_saving_vs_uncontrolled_eur, cycles). One layer deeper, state_of_charge and cost_comparison.
numbers:
- {id: "uncontrolled / smart / vehicle-to-grid", label: Per-case block with the fields below}
- {id: system_cost_eur, label: Dispatch cost of the whole system for the week, unit: EUR}
- {id: charging_cost_eur, label: Price times grid draw, unit: EUR}
- {id: v2g_revenue_eur, label: Price times energy sold back, unit: EUR}
- {id: net_ev_cost_eur, label: Charging cost minus V2G revenue, unit: EUR}
- {id: avg_charging_price_eur_mwh, label: Energy-weighted price paid when charging, unit: EUR/MWh}
- {id: peak_load_increase_mw, label: Increase of the week's peak grid load from the fleet, unit: MW}
- {id: charged_mwh, label: Energy delivered into the batteries, unit: MWh}
- {id: discharged_to_grid_mwh, label: Energy sold back (V2G), unit: MWh}
- {id: cycles, label: Equivalent full cycles in the week, unit: count}
- {id: system_cost_saving_vs_uncontrolled_eur, label: System cost saved by smart charging and by V2G, unit: EUR}
- {id: fleet, label: The fleet's size, battery, charger and driving assumptions}
limitations:
- One aggregate battery stands for the fleet; no per-car availability spread, no battery degradation cost on V2G cycles.
- Perfect foresight of prices in the smart and V2G cases; a real aggregator bids on forecasts.
- The uncontrolled case starts the week full and is not cyclic, the optimised cases are.
sources:
- {title: "PyPSA example: Electric Vehicles", url: "https://docs.pypsa.org/latest/examples/battery-electric-vehicle-charging/"}
- {title: "Data Science for ESM: sector-coupling workshop (EV section)", url: "https://fneum.github.io/data-science-for-esm/dsesm/workshop-pypsa-sector-coupling/"}
pypsa: "1.3.0"
