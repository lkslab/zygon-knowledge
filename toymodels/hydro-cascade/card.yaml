id: hydro-cascade
title: "Chained hydro reservoirs: turbines, spill and water values"
summary: >-
  Two reservoirs in series on one river, each with a turbine and a spillway, against a
  gas backup and an electricity load in a snowmelt fortnight and a late-summer dry one.
  Water is counted in the energy a turbine can make from it; what the upper station
  releases arrives in the lower reservoir. The price on each reservoir bus is the water
  value, what one more stored unit is worth downstream.
concepts: [hydro, reservoir, cascade, water-value, spill, inflow, storage, shadow-price]
answers:
- "how do I chain reservoirs so the upper station's outflow feeds the lower one"
- "what is a water value and where do I read it in PyPSA"
- "when does a hydro system spill and why is water free in the wet season"
- "why is water in the lower reservoir worth less than in the upper"
builds_on: []
setup:
  buses: electricity (AC); water upper, water lower, sea (water)
  components:
  - forced-inflow Generators on each water bus (p_min_pu = p_max_pu = inflow profile)
  - Store per reservoir (cyclic, starts half full) and a huge Store "sea" as the sink
  - Link "turbine upper" water upper to electricity (bus1) and water lower (bus2), so released water arrives downstream
  - Link "spill upper" water upper to water lower, no power
  - Link "turbine lower" water lower to electricity and sea, Link "spill lower" water lower to sea
  - a CCGT backup and load shedding on the electricity bus, an annual-shaped Load
  snapshots: 112 snapshots, two fortnights (8-21 April, 8-21 August) at 3-hour resolution, weighted to a year
  profiles: snowmelt-shaped inflow with a spring peak and a dry late summer plus rain noise; annual load; seed 42/43
  assumptions:
  - {name: upper reservoir, value: "25 GWh, 80 MW turbine, 45 MW mean inflow"}
  - {name: lower reservoir, value: "6 GWh, 60 MW turbine, 12 MW local mean inflow"}
  - {name: backup, value: "150 MW CCGT at 60 EUR/MWh; load shedding at 3000"}
  - {name: mean load, value: 100, unit: MW}
  - {name: spill, value: "0.01 EUR/MWh tie-breaker so turbining is preferred to spilling"}
method: |
  One `n.optimize()`. The cascade is topology: multi-output Links with bus2 and
  efficiency2 = 1 pass turbined water to the next reservoir; spill Links pass it without
  generating. Inflow is a Generator whose minimum equals its maximum, so the reservoir
  must store, turbine or spill it. Water values are the marginal prices of the water
  buses (`n.buses_t.marginal_price["water upper"]`), the duals of the reservoir balances;
  no extra dual assignment is needed. In the wet fortnight the value sits at the spill
  cost; in the dry one it rises to the thermal cost the water displaces, and the lower
  reservoir's water is worth about half the upper's because it passes one turbine, not two.
knobs:
- {name: reservoir and turbine sizes, in: RES, effect: "a bigger upper reservoir carries melt water into the dry fortnight and spills less"}
- {name: inflow, in: "INFLOW_MEAN_MW and inflow()", effect: "the wet-dry contrast drives the water value swing"}
- {name: representative weeks, in: WEEKS, effect: "pick other fortnights of the synthetic hydrological year"}
- {name: backup cost, in: CCGT_COST, effect: "the ceiling of the dry-season water value"}
figures:
- id: reservoir_levels
  file: figures/reservoir_levels.json
  title: Reservoir levels
  shows: Fill level of both reservoirs; the upper fills through the melt, the lower cycles on the upper's releases.
- id: turbine_and_spill_flows
  file: figures/turbine_and_spill_flows.json
  title: Turbine and spill flows
  shows: Stacked flows through the two turbines and the two spillways.
- id: prices_and_water_values
  file: figures/prices_and_water_values.json
  title: Electricity price and water values
  shows: The electricity price and the two water bus prices over the two fortnights.
numbers:
- {id: hydro_energy_gwh, label: Energy from both turbines, unit: GWh/a}
- {id: hydro_share_pct, label: Hydro over demand, unit: "%"}
- {id: inflow_gwh, label: Inflow per reservoir, unit: GWh/a}
- {id: spill_gwh, label: Water spilled per station, unit: GWh/a}
- {id: spill_share_of_arrivals_pct, label: Spill over water arriving at each reservoir, unit: "%"}
- {id: water_value_eur_mwh, label: Mean, wet and dry water value per reservoir, unit: EUR/MWh}
- {id: electricity_price_eur_mwh, label: Mean, wet and dry electricity price, unit: EUR/MWh}
- {id: thermal_hours_pct, label: Share of hours the CCGT runs, unit: "%"}
- {id: thermal_energy_gwh, label: CCGT energy, unit: GWh/a}
- {id: reservoir_level_range_pct, label: Lowest and highest fill per reservoir, unit: "%"}
- {id: load_shed_mwh, label: Energy not served, unit: MWh}
limitations:
- Two fortnights with a cyclic store, so the melt water carried through the unmodelled summer is implied, not simulated; the year-long version is a resolution knob away.
- Constant head: one unit of water makes the same energy at any fill level, and no travel time between stations (see the PyPSA link-delay example).
- Wet-season prices sit at the spill tie-breaker (slightly negative), an artefact of forced inflow.
sources:
- {title: "PyPSA example: Chained Hydro Reservoirs", url: "https://docs.pypsa.org/latest/examples/chained-hydro-reservoirs/"}
- {title: "PyPSA example: Water Values", url: "https://docs.pypsa.org/latest/examples/water-value/"}
pypsa: "1.3.0"
