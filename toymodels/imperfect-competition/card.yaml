id: imperfect-competition
title: Cournot competition against a linear demand curve
summary: >-
  Two generators with different constant costs face a linear demand curve. Perfect
  competition is a PyPSA welfare maximisation (a quadratic programme, the demand curve
  entering as a sink with a quadratic marginal cost); the Cournot-Nash equilibrium is
  solved in closed form and confirmed by iterated best responses, each a small linopy
  QP; a monopoly closes the range. Withheld quantity, markup and deadweight loss follow.
concepts: [imperfect-competition, cournot, market-power, welfare, deadweight-loss, demand-elasticity, quadratic-programming]
answers:
- "how much does a strategic generator withhold and what does it do to the price"
- "what is the deadweight loss of market power"
- "how do I put a smooth demand curve into PyPSA"
- "how do I solve a Cournot equilibrium with linopy"
builds_on: [demand-elasticity]
setup:
  buses: one market bus
  components:
  - two Generators (firm 1, firm 2) with constant marginal cost and a capacity that never binds
  - one Generator "demand" with sign -1, marginal_cost -A and marginal_cost_quadratic B/2, so its dispatch cost is minus the utility A Q - B/2 Q^2
  snapshots: one snapshot
  profiles: none
  assumptions:
  - {name: inverse demand, value: "P = 200 - 0.1 Q (EUR/MWh, Q in MW)"}
  - {name: firm 1, value: "20 EUR/MWh"}
  - {name: firm 2, value: "40 EUR/MWh"}
  - {name: capacity, value: "2000 MW each, not binding"}
method: |
  Competitive: `n.optimize()` with HiGHS' QP solver (`solver_options={"solver":
  "choose"}`; the interior-point LP option does not accept a quadratic objective). The
  objective is cost minus utility, so the solve maximises welfare and the bus dual is the
  competitive price. Cournot: firm i maximises (A - B (q_i + q_j)) q_i - c_i q_i given
  q_j; the best response is (A - c_i - B q_j) / (2B), the Nash equilibrium
  q_1 = (A - 2 c_1 + c_2) / (3B), q_2 = (A - 2 c_2 + c_1) / (3B). Iterated best responses
  each solve a one-variable linopy QP (`m.add_objective(B q q + (c - A + B q_j) q)`)
  and converge to the same point. Monopoly: the cheaper firm alone, q = (A - c) / (2B).
  Surpluses are the usual triangles and rectangles under the linear curve; deadweight
  loss is competitive welfare minus the regime's welfare.
knobs:
- {name: A, B, in: module constants, effect: "a steeper demand curve (larger B) gives more market power"}
- {name: firm costs, in: FIRMS, effect: "asymmetric costs shift output to the cheaper firm; equal costs give the textbook symmetric Cournot"}
- {name: capacity, in: CAPACITY, effect: "a binding capacity turns the game into a capacity-constrained one"}
figures:
- id: market_power_intuition
  file: figures/market_power_intuition.json
  title: Holding back to lift the price
  shows: >-
    One market hour: the grey line is what consumers would pay for each MW, falling from 200 EUR/MWh.
    Under competition the cheaper firm sells until the price reaches its cost, 1,800 MW at 20. Two
    firms that each hold back output sell only about 1,130 MW, and the price rises to about 87. Green
    is the firms' margin, blue what consumers keep, and vermillion the deadweight loss: power worth
    more than it costs that nobody makes, plus the dearer firm 2 producing where firm 1 could.
- id: quantity_by_regime
  file: figures/quantity_by_regime.json
  title: Quantity supplied by regime
  shows: Output per firm under competition, Cournot and monopoly.
- id: best_responses
  file: figures/best_responses.json
  title: Best-response functions
  shows: Each firm's output as a function of the other's; they cross at the Nash equilibrium.
- id: welfare_by_regime
  file: figures/welfare_by_regime.json
  title: Welfare by regime
  shows: Consumer surplus, producer surplus and deadweight loss stacked to the competitive welfare.
teach:
- concept: market-power
  gap: >-
    An energy model, like a textbook market, assumes every plant offers its power at its running
    cost, because no single seller can move the price. With only a few large generators that fails:
    a firm that holds some capacity back pushes the price up, loses the margin on the withheld MWh
    and gains a higher price on every MWh it still sells. When the gain is bigger, holding back pays,
    and a cost-based model never sees it. The picture (market_power_intuition) shows how far the
    outcome moves.
  remedy: >-
    A Cournot model gives each firm a choice of how much to offer, knowing its output moves the
    price, and looks for the point where neither firm wants to change given what the other does (the
    Nash equilibrium). It shows how much is withheld and how high the price climbs, which is what
    market monitoring and bidding rules try to prevent. Here PyPSA solves the competitive benchmark,
    the Cournot outcome comes from each firm's best response.
  figure: market_power_intuition
  example: >-
    Competition sells 1,800 MW at 20 EUR/MWh; two Cournot firms sell about 1,133 MW at about 87, a
    markup of about 47 EUR/MWh over the dearer firm's cost; a monopolist would sell 900 MW at 110
    (total_quantity_mw, price_eur_mwh, markup_over_marginal_cost_eur_mwh, quantity_withheld_mw). One
    layer deeper, best_responses shows each firm's reply to the other crossing at the equilibrium and
    quantity_by_regime the output per firm.
- concept: deadweight-loss
  gap: >-
    Withholding moves money from consumers to producers, which is a question of fairness. But
    something is also lost outright, and that is the part an economist counts as the cost of market
    power.
  remedy: >-
    The deadweight loss is the welfare no one gets: MWh that consumers valued above their cost but
    that were not made, and output from the dearer firm where the cheaper one could have produced.
    It is the vermillion area in the same picture (market_power_intuition), between the demand line
    and the cost, beyond the withheld quantity.
  figure: market_power_intuition
  builds_on_concept: market-power
  example: >-
    Consumer surplus falls from about 162 kEUR per hour under competition to about 64 under Cournot,
    producers gain about 66, and about 32 kEUR per hour is lost outright; a monopoly loses about 41
    (consumer_surplus_keur_h, producer_surplus_keur_h, deadweight_loss_keur_h). One layer deeper,
    welfare_by_regime stacks the three per regime.
numbers:
- {id: demand_curve, label: Intercept and slope of the inverse demand}
- {id: marginal_cost_eur_mwh, label: Cost per firm, unit: EUR/MWh}
- {id: quantity_mw, label: Output per firm (per regime), unit: MW}
- {id: total_quantity_mw, label: Total output, unit: MW}
- {id: price_eur_mwh, label: Market price, unit: EUR/MWh}
- {id: markup_over_marginal_cost_eur_mwh, label: Price minus the marginal producer's cost, unit: EUR/MWh}
- {id: lerner_index, label: Markup over price, unit: ratio}
- {id: consumer_surplus_keur_h, label: Consumer surplus, unit: kEUR/h}
- {id: producer_surplus_keur_h, label: Producer surplus, unit: kEUR/h}
- {id: deadweight_loss_keur_h, label: Welfare lost against competition, unit: kEUR/h}
- {id: quantity_withheld_mw, label: Competitive minus regime output, unit: MW}
- {id: competitive_price_pypsa_dual_eur_mwh, label: The bus dual of the QP, unit: EUR/MWh}
- {id: cournot_analytic_mw, label: Closed-form Cournot outputs for the check, unit: MW}
limitations:
- Cournot is solved outside PyPSA; PyPSA's role is the competitive benchmark. A network-constrained Cournot needs a complementarity formulation.
- Linear demand and constant costs keep everything closed-form; real bids are stepwise.
sources:
- {title: "PyPSA example: Imperfect Competition", url: "https://docs.pypsa.org/latest/examples/imperfect-competition/"}
pypsa: "1.3.0"
