models:
- id: merit-order-dispatch
  title: Merit order and marginal pricing
  summary: One bus, five thermal units, one day; the price is the marginal cost of the last unit needed.
  concepts: [dispatch, merit-order, marginal-price, producer-rent, economic-dispatch]
  answers:
  - why the price is set by gas even when nuclear is running
  - how much baseload plants earn when a peaker sets the price
  figures:
  - {id: merit_order_rent, shows: the staircase at the evening peak, one price for all, the cheaper units' rent shaded}
  - {id: merit_order_curve, shows: supply staircase with the day's min and peak load marked}
  - {id: dispatch_stack, shows: hourly dispatch stacked in merit order}
  - {id: price_series, shows: hourly bus price}
  numbers: [total_cost_eur, avg_price_eur_mwh, peak_price_eur_mwh, consumer_payment_eur, producer_rent_eur, hours_marginal]
  runtime_s: 1
  builds_on: []
- id: nodal-prices-lopf
  title: Nodal prices in a congested triangle
  summary: Three-bus AC triangle with one small line; as load grows the line binds and prices split by bus.
  concepts: [lopf, nodal-pricing, lmp, congestion, kirchhoff, loop-flow, congestion-rent]
  answers:
  - why nodal prices differ between buses
  - what congestion rent is and who collects it
  figures:
  - {id: nodal_prices, shows: price per bus per load level}
  - {id: line_flows, shows: flow vs rating per line at peak}
  - {id: congestion_rent_by_line, shows: rent per line and load level}
  numbers: [peak_prices_eur_mwh, peak_price_spread_eur_mwh, congestion_rent_peak_eur_h, cost_of_congestion_eur, first_congested_level]
  runtime_s: 2
  builds_on: []
- id: unit-commitment
  title: Unit commitment and its prices
  summary: Two committable units with start-up costs and minimum times; MILP dispatch, fixed-status prices and linearised prices.
  concepts: [unit-commitment, milp, start-up-cost, min-up-time, part-load, uc-prices, integrality-gap]
  answers:
  - how start-up costs and minimum up times change dispatch
  - how to get prices out of a mixed-integer model
  figures:
  - {id: unit_status, shows: on/off bands per unit}
  - {id: dispatch_stack, shows: stacked dispatch with minimum part loads}
  - {id: price_uc_vs_relaxed, shows: fixed-commitment vs linearised prices}
  numbers: [total_cost_uc_eur, integrality_gap_pct, start_ups, avg_price_fixed_status_eur_mwh, avg_price_linearised_eur_mwh]
  runtime_s: 4
  builds_on: [merit-order-dispatch]
- id: storage-arbitrage
  title: Battery arbitrage against a price-forming fleet
  summary: A price-taking battery over a windy week; charges in the troughs, discharges at the peaks, revenue is the captured spread.
  concepts: [storage, battery, arbitrage, price-spread, cycles, round-trip-efficiency, revenue]
  answers:
  - how much a battery earns from arbitrage
  - how many cycles a day a battery runs
  figures:
  - {id: charge_vs_price, shows: signed battery power against the price}
  - {id: state_of_charge, shows: energy in the battery over the week}
  - {id: daily_revenue, shows: revenue per day}
  numbers: [revenue_eur, revenue_per_mw_eur, full_cycles, round_trip_loss_pct, avg_charge_price_eur_mwh, avg_discharge_price_eur_mwh]
  runtime_s: 1
  builds_on: [merit-order-dispatch]
- id: capacity-expansion-single-node
  title: Single-node capacity expansion under a CO2 cap
  summary: Greenfield wind, solar, gas, battery and hydrogen against a stylised year for five CO2 caps; the base of the planning toys.
  concepts: [capacity-expansion, investment, co2-cap, shadow-price, annuity, lcoe, curtailment, hydrogen, storage]
  answers:
  - what mix is cheapest under a CO2 cap
  - what CO2 price a cap implies
  - when hydrogen storage enters
  figures:
  - {id: capacity_mix_by_cap, shows: stacked capacity per cap}
  - {id: cost_breakdown_by_cap, shows: annual cost per technology per cap}
  - {id: price_duration, shows: price duration curve per cap}
  numbers: [total_cost_meur_a, avg_cost_eur_mwh, co2_price_eur_t, capacity_mw, curtailment_pct, vre_share_pct]
  runtime_s: 55
  builds_on: []
- id: screening-curves
  title: Screening curves and the optimal thermal mix
  summary: Cost-per-MW lines in full-load hours read against a load duration curve; PyPSA reproduces the arithmetic.
  concepts: [screening-curve, load-duration-curve, capacity-expansion, breakeven, full-load-hours, lcoe, scarcity-pricing]
  answers:
  - how many full-load hours a CCGT needs to beat an OCGT
  - how to read the optimal mix off a load duration curve
  figures:
  - {id: screening_intuition, shows: cost lines over full-load hours above the load duration curve, breakevens dropped through both, load bands per technology}
  - {id: screening_curves, shows: cost lines with breakeven hours}
  - {id: load_duration_curve, shows: load duration curve with capacity bands}
  - {id: optimal_mix, shows: LP vs analytic capacities}
  numbers: [breakeven_full_load_hours, optimal_capacity_mw, analytic_capacity_mw, lcoe_eur_mwh, full_load_hours]
  runtime_s: 1
  builds_on: []
- id: price-duration-and-cost-recovery
  title: Price duration and cost recovery
  summary: The 20 % cap case of the base model checked for zero profit; every built technology recovers capital, fuel and carbon cost exactly.
  concepts: [cost-recovery, zero-profit, price-duration-curve, scarcity-pricing, market-value, revenue, carbon-price]
  answers:
  - whether wind and solar recover their costs at market prices
  - where a wind farm's revenue comes from when the price is zero half the time
  figures:
  - {id: margin_intuition, shows: sorted prices against the gas level, the scarcity margin that pays for a MW of gas shaded}
  - {id: price_duration, shows: log-scale price duration curve}
  - {id: revenue_vs_cost, shows: revenue beside stacked cost per technology}
  - {id: revenue_split, shows: scarcity vs ordinary-hour margin per generator}
  numbers: [cost_recovery_ratio, co2_price_eur_t, gas_price_level_eur_mwh, market_value_eur_mwh, lcoe_eur_mwh, share_of_hours_pct, scarcity_rent_share_pct]
  runtime_s: 12
  builds_on: [capacity-expansion-single-node]
- id: redispatch
  title: Zonal market, redispatch and nodal pricing
  summary: Four buses, a north-south bottleneck; nodal reference vs a copper-plate market plus the operator's redispatch.
  concepts: [redispatch, zonal-market, nodal-pricing, congestion, curtailment, market-design]
  answers:
  - what redispatch is and how to model it
  - how much a zonal market with redispatch costs compared to nodal pricing
  figures:
  - {id: redispatch_geography, shows: the made-up country with where power is made and used and the lines between}
  - {id: redispatch_intuition, shows: the market's planned north-south transfer against what the lines carry}
  - {id: price_by_bus, shows: nodal price per bus against the single zonal price}
  - {id: cost_comparison, shows: daily cost by market design}
  - {id: redispatch_volume, shows: ramp up and down per unit}
  - {id: line_loading, shows: overload implied by the market schedule}
  numbers: [cost_nodal_eur, cost_zonal_plus_redispatch_eur, cost_redispatch_eur, efficiency_loss_pct, redispatch_up_mwh, wind_curtailed_mwh]
  runtime_s: 4
  builds_on: [nodal-prices-lopf]
- id: stochastic-cvar
  title: Stochastic investment and CVaR risk aversion
  summary: Uncertain gas price; deterministic, two-stage stochastic and CVaR plans compared, with EVPI, VSS and the hedging premium.
  concepts: [stochastic-programming, scenarios, cvar, risk-aversion, evpi, vss, two-stage, uncertainty]
  answers:
  - how to plan capacity under an uncertain fuel price
  - what CVaR risk aversion does to the mix and what it costs in expectation
  figures:
  - {id: capacity_mix_by_strategy, shows: capacity per plan}
  - {id: cost_distribution, shows: realised cost per scenario per plan}
  - {id: omega_sweep, shows: expected vs worst-case cost over omega}
  numbers: [evpi_meur_a, vss_meur_a, cvar_premium_meur_a, worst_case_cost_meur_a, capacity_mw, omega_sweep]
  runtime_s: 30
  builds_on: [capacity-expansion-single-node]
- id: myopic-pathway
  title: Myopic pathway with brownfield carry-over
  summary: 2030, 2040, 2050 solved in sequence with inherited builds, lifetime retirements, falling costs and a tightening cap.
  concepts: [pathway, myopic-foresight, brownfield, build-year, lifetime, retirement, co2-cap, cost-decline]
  answers:
  - how to run a sequence of horizons with capacity carried over
  - when existing coal retires and what replaces it
  figures:
  - {id: capacity_by_horizon, shows: stacked capacity per horizon}
  - {id: emissions_path, shows: emissions against the cap}
  - {id: cost_by_horizon, shows: new capex, inherited capex and opex per horizon}
  numbers: [cumulative_new_build_mw, emission_reduction_2050_vs_2030_pct, coal_retired_by, "2030", "2040", "2050"]
  runtime_s: 6
  builds_on: [capacity-expansion-single-node]
- id: sector-coupling-single-node
  title: "Sector coupling: electricity, heat and hydrogen"
  summary: The base model plus a heat bus (heat pump with seasonal COP, boiler, tank) and a hydrogen demand under a CO2 cap.
  concepts: [sector-coupling, heat-pump, cop, electrolysis, hydrogen, thermal-storage, energy-balance, flexible-load]
  answers:
  - how to add heat and hydrogen to an electricity model
  - what electrification does to electricity demand and the mix
  figures:
  - {id: energy_balance_electricity, shows: weekly electricity balance per carrier}
  - {id: energy_balance_heat, shows: weekly heat balance}
  - {id: flexible_load_week, shows: heat pump and electrolyser draw against the price in a winter week}
  numbers: [heat_pump_share_of_heat_pct, seasonal_cop_mean, electricity_demand_uplift_pct, lcoh_eur_mwh, co2_price_eur_t, capacity_mw]
  runtime_s: 20
  builds_on: [capacity-expansion-single-node]
- id: transmission-expansion
  title: Transmission expansion between a windy and a load-rich zone
  summary: One extendable link between a wind zone and a load zone swept over link cost; congestion rent pays for the link at the optimum.
  concepts: [transmission-expansion, link, congestion-rent, curtailment, cost-benefit, interconnector, price-spread]
  answers:
  - how much transmission is worth building to a wind region
  - whether an interconnector pays for itself from congestion rent
  figures:
  - {id: capacity_vs_cost, shows: link and southern gas capacity vs link cost}
  - {id: system_cost_tradeoff, shows: stacked cost per case}
  - {id: flow_duration, shows: sorted link flows per case}
  numbers: [link_mw, link_cost_recovery_ratio, wind_curtailment_pct, congestion_rent_meur_a, saving_vs_no_link_meur_a]
  runtime_s: 10
  builds_on: [capacity-expansion-single-node]
- id: rolling-horizon
  title: Rolling horizon versus perfect foresight
  summary: Two windy weeks with an 8-hour battery, solved with full foresight and with 24-hour rolling windows; the cost gap is the value of the forecast.
  concepts: [rolling-horizon, foresight, dispatch, storage, battery, arbitrage, myopic-foresight]
  answers:
  - what perfect foresight assumes and how much it flatters storage
  - how to dispatch a PyPSA model day by day with a rolling window
  figures:
  - {id: state_of_charge, shows: battery state of charge per solve}
  - {id: price_comparison, shows: hourly price per solve}
  - {id: cost_and_revenue, shows: extra cost over foresight and battery revenue per solve}
  numbers: [cost_eur, cost_gap_pct, battery_revenue_eur, battery_cycles, cases]
  runtime_s: 33
  builds_on: [storage-arbitrage]
- id: water-values
  title: Water values for a seasonal reservoir
  summary: A snowmelt reservoir over a year; the reservoir balance dual is the water value, and giving it to a rolling solve recovers most of the foresight gap.
  concepts: [water-value, hydro, reservoir, rolling-horizon, foresight, shadow-price, storage, spill]
  answers:
  - what a water value is and where it comes from in a model
  - how to give a myopic dispatch a value for stored energy
  figures:
  - {id: reservoir_level, shows: stored energy per approach over the year}
  - {id: water_value, shows: reservoir balance dual against the price}
  - {id: cost_comparison, shows: annual cost per approach}
  numbers: [cost_gap_pct, water_value_eur_mwh, cost_meur_a, spill_gwh, hydro_gwh]
  runtime_s: 47
  builds_on: [rolling-horizon]
- id: security-constrained-lopf
  title: Security-constrained optimal power flow (N-1)
  summary: The three-bus triangle dispatched plainly and N-1 secure, re-checked under every single line outage with a linear power flow.
  concepts: [sclopf, n-1, contingency, lopf, congestion, nodal-pricing, security-of-supply]
  answers:
  - what N-1 security means for dispatch and what it costs
  - how bad the overload after a line outage is with a plain OPF
  figures:
  - {id: post_contingency_plain, shows: post-outage loading per line, plain dispatch}
  - {id: post_contingency_secure, shows: post-outage loading per line, secure dispatch}
  - {id: nodal_prices, shows: bus prices plain vs N-1}
  - {id: cost_comparison, shows: dispatch cost plain vs N-1}
  numbers: [cost_of_security_pct, worst_post_contingency_loading_pct, worst_case, nodal_prices_eur_mwh, spare_capacity_held_mw]
  runtime_s: 3
  builds_on: [nodal-prices-lopf]
- id: reserve-constraints
  title: Operating reserve as a custom constraint
  summary: An upward reserve requirement added through extra_functionality with a linopy variable per unit; the requirement's dual is the reserve price.
  concepts: [reserve, custom-constraint, extra-functionality, linopy, dispatch, reserve-price, shadow-price]
  answers:
  - how to add a constraint PyPSA does not have built in
  - how to add a reserve requirement and read its price
  figures:
  - {id: dispatch_with_reserve, shows: dispatch by carrier with the reserve held on top}
  - {id: reserve_provision, shows: reserve held per unit over time}
  - {id: prices, shows: energy price with and without reserve, and the reserve price}
  numbers: [reserve_cost_eur, reserve_cost_share_pct, reserve_price_eur_mw_h, reserve_held_share_pct, requirement_mw]
  runtime_s: 1
  builds_on: [merit-order-dispatch]
- id: maintenance-scheduling
  title: Maintenance scheduling
  summary: A coal unit must take a 72-hour outage in a fortnight with a weekend dip; PyPSA's maintenance attributes pick the window and a forced timing shows the cost of getting it wrong.
  concepts: [maintenance, scheduling, milp, dispatch, outage, availability]
  answers:
  - when a plant should schedule its outage
  - what maintainable, maintenance_duration and maintenance_events do
  figures:
  - {id: unit_availability, shows: availability bands per unit with the chosen outage}
  - {id: dispatch_stack, shows: dispatch around the outage}
  - {id: price_series, shows: prices with optimal vs forced timing}
  - {id: cost_comparison, shows: fortnight cost by timing}
  numbers: [chosen_window, saving_eur, saving_pct, cost_optimal_eur, cost_forced_eur, peaker_energy_mwh]
  runtime_s: 9
  builds_on: [unit-commitment]
- id: line-loading-limits
  title: Static, dynamic and emergency line ratings
  summary: One line whose rating follows the hour; static, dynamic and emergency ratings compared on cost, hours at limit and congestion rent.
  concepts: [line-rating, dynamic-line-rating, congestion, congestion-rent, lopf, transmission]
  answers:
  - how to give a line a time-varying rating
  - what dynamic line rating and a short overload allowance are worth
  figures:
  - {id: flow_vs_limit, shows: flow per case against the dashed limits}
  - {id: price_spread, shows: price spread across the line per case}
  - {id: cost_and_rent, shows: cost and congestion rent per case}
  numbers: [cost_eur, hours_at_limit, congestion_rent_eur, saving_vs_static_eur, ratings_pu]
  runtime_s: 2
  builds_on: [nodal-prices-lopf]
- id: mga-near-optimal
  title: Near-optimal alternatives (MGA)
  summary: The two-fortnight expansion re-solved within a cost slack while each capacity is pushed to its min and max; which capacities the optimum really pins down.
  concepts: [mga, near-optimal, capacity-expansion, co2-cap, investment, uncertainty]
  answers:
  - how robust the optimal capacity mix is and what else costs nearly the same
  - how to run modelling-to-generate-alternatives in PyPSA
  figures:
  - {id: capacity_ranges, shows: min, optimum and max per technology within the slack}
  - {id: alternative_mixes, shows: the stacked mix of every alternative}
  - {id: range_vs_slack, shows: wind capacity range against cost slack}
  numbers: [optimum_cost_meur_a, slack_cost_meur_a, capacity_range_mw, wind_range_by_slack_mw, co2_price_eur_t]
  runtime_s: 23
  builds_on: [capacity-expansion-single-node]
- id: perfect-foresight-pathway
  title: Perfect-foresight pathway vs myopic
  summary: The myopic pathway's horizons solved as one multi-period problem; capacities, cost and emissions beside the committed myopic results.
  concepts: [pathway, perfect-foresight, myopic-foresight, multi-investment-periods, build-year, lifetime, co2-cap, cost-decline]
  answers:
  - the difference between perfect-foresight and myopic pathway planning
  - how to set up multi_investment_periods in PyPSA
  figures:
  - {id: capacity_perfect_vs_myopic, shows: stacked capacity per horizon for both foresights}
  - {id: cost_per_horizon, shows: annual cost per horizon for both plans}
  - {id: emissions_path, shows: emissions of both plans against the cap}
  numbers: [pathway_cost_meur, foresight_gap_pct, builds_more_than_myopic_in, cumulative_new_build_mw, perfect_foresight]
  runtime_s: 7
  builds_on: [myopic-pathway]
- id: modular-committable-expansion
  title: Modular and committable expansion
  summary: Gas buildable only in 100 MW blocks and committable with start-up costs, against the continuous relaxation; the zero-profit identity breaks.
  concepts: [capacity-expansion, modular-expansion, unit-commitment, milp, integrality-gap, cost-recovery, zero-profit, start-up-cost]
  answers:
  - what discrete plant sizes do to the optimal mix
  - why lumpy investment breaks cost recovery
  figures:
  - {id: capacity_continuous_vs_modular, shows: capacity per technology, LP vs MILP}
  - {id: dispatch_with_commitment, shows: winter fortnight dispatch with committed gas}
  - {id: cost_recovery_lp_vs_milp, shows: revenue vs cost per technology in the LP and the MILP}
  numbers: [integrality_gap_pct, gas_blocks_built, cost_recovery_ratio, gas_profit_meur_a, capacity_mw]
  runtime_s: 24
  builds_on: [capacity-expansion-single-node, unit-commitment, price-duration-and-cost-recovery]
- id: weather-year-uncertainty
  title: Weather-year uncertainty in investment
  summary: Three weather years as scenarios with their own wind and solar series; deterministic vs stochastic plans, EVPI and VSS for weather.
  concepts: [stochastic-programming, scenarios, uncertainty, weather-year, evpi, vss, two-stage, curtailment]
  answers:
  - how to put different weather years into one stochastic problem
  - what planning on one weather year costs when another arrives
  figures:
  - {id: capacity_by_plan, shows: capacity per deterministic and stochastic plan}
  - {id: cost_by_weather_year, shows: realised cost of the normal-year and stochastic plans per year}
  - {id: curtailment_by_weather_year, shows: curtailment of both plans per year}
  numbers: [evpi_meur_a, vss_meur_a, expected_cost_meur_a, capacity_range_over_deterministic_plans_mw, cost_by_weather_meur_a]
  runtime_s: 18
  builds_on: [capacity-expansion-single-node, stochastic-cvar]
- id: time-series-aggregation
  title: Time series aggregation
  summary: The year-long expansion at full resolution, with 12-hour averaging and with two and four representative fortnights; capacity, cost and price errors with solve time.
  concepts: [time-series-aggregation, representative-weeks, resolution, capacity-expansion, complexity]
  answers:
  - how coarse the time resolution can be before the mix is wrong
  - what representative weeks get right and wrong
  figures:
  - {id: capacity_by_method, shows: capacity per technology per aggregation}
  - {id: cost_by_method, shows: annual cost per aggregation}
  - {id: price_duration_by_method, shows: price duration curves per aggregation}
  numbers: [cost_error_pct, capacity_error_pct, solve_s, snapshots, co2_price_eur_t]
  runtime_s: 32
  builds_on: [capacity-expansion-single-node]
- id: spatial-clustering
  title: Spatial clustering of a six-bus network
  summary: A six-bus, two-region network solved nodally and after clustering to two buses; what happens to prices, flows and cost.
  concepts: [spatial-clustering, busmap, lopf, nodal-pricing, congestion, network-reduction]
  answers:
  - what clustering to fewer buses does to prices and flows
  - how to cluster a PyPSA network with a busmap
  figures:
  - {id: prices_nodal_vs_clustered, shows: mean price per bus, nodal beside the region price}
  - {id: line_loading, shows: mean loading per line before and after}
  - {id: tie_flow, shows: west-to-east transfer over the week in both models}
  numbers: [cost_difference_pct, mean_intra_region_price_spread_eur_mwh, mean_west_east_spread_eur_mwh, tie_flow_mwh, wind_curtailed_pct]
  runtime_s: 3
  builds_on: [nodal-prices-lopf]
- id: demand-elasticity
  title: Price-responsive demand and market clearing
  summary: The merit-order day cleared with a fixed load, with demand bid blocks and with a linear demand curve; elastic demand shaves the peak and turns cost into welfare.
  concepts: [demand-elasticity, demand-bids, welfare, consumer-surplus, producer-surplus, marginal-price, merit-order]
  answers:
  - how to model price-elastic demand and what it does to the peak price
  - how to compute consumer and producer surplus from a dispatch
  figures:
