# The entry point for an agent: one row per toy model. Read this file first, then the
# model's card.yaml for the explanation, results.yaml for the numbers, and
# figures/<id>.json for the charts (pypsa-app figure.json contract, ready to render).
pypsa: "1.3.0"
solver: highs
how_to_run: "cd ../pypsa-app && uv run python <zygon-knowledge>/toymodels/_lib/run.py <slug>"
layout:
  card: toymodels/<slug>/card.yaml
  code: toymodels/<slug>/model.py
  results: toymodels/<slug>/results.yaml
  figures: toymodels/<slug>/figures/<figure_id>.json
  preview: toymodels/<slug>/preview.html
