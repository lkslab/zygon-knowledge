id: line-loading-limits
title: Static, dynamic and emergency line ratings
summary: >-
  One line between a cheap generator and a load with a peaker, over three hot days. The
  conductor carries less in the afternoon heat and more at night. Three cases compare a
  conservative static rating, a dynamic rating that follows the hour, and the dynamic
  rating with a two-hour emergency allowance at the evening peak; the difference is
  peaker fuel and congestion rent.
concepts: [line-rating, dynamic-line-rating, congestion, congestion-rent, lopf, transmission]
answers:
- "how do I give a line a time-varying rating in PyPSA"
- "what is dynamic line rating worth"
- "how much does a short-term overload allowance save"
- "how does congestion rent change with the rating"
builds_on: [nodal-prices-lopf]
setup:
  buses: A (generation) and B (load)
  components:
  - Generator coal at A (cheap, large) and OCGT at B (the peaker), plus load shedding at B
  - one Line A-B with s_nom 1000 MW and a per-unit rating series `s_max_pu`
  - a Load at B with the daily shape
  snapshots: 72 hourly snapshots (three days), weight 1
  profiles: daily load 600 to 1700 MW without noise
  assumptions:
  - {name: coal A, value: "2000 MW at 20 EUR/MWh"}
  - {name: OCGT B, value: "1500 MW at 120 EUR/MWh"}
  - {name: ratings, value: "1.0 p.u. at night, 0.8 p.u. from 12:00 to 18:59 (hot afternoon), 1.1 p.u. from 18:00 to 19:59 in the emergency case"}
  - {name: static case, value: "0.8 p.u. all day, the conservative planning value"}
  - {name: value_of_lost_load, value: 3000, unit: EUR/MWh}
method: |
  The rating enters as a time series on the Line's `s_max_pu` (passed to `n.add` as a
  Series indexed by snapshot); PyPSA bounds the flow by `s_nom * s_max_pu` per
  snapshot. Each case is one `n.optimize()`. Congestion rent is flow times the price
  difference across the line, positive only in the hours the line is full; hours at
  limit count the snapshots where flow reaches the rating.
knobs:
- {name: derating, in: "HOT_PU, HOT_HOURS", effect: "how much and how long the heat takes off the line"}
- {name: emergency allowance, in: "EMERGENCY_PU, EMERGENCY_HOURS", effect: "the size and length of the short-term overload"}
- {name: load shape, in: "BASE_MW, PEAK_MW", effect: "a lower night makes the dynamic rating's night headroom worthless"}
figures:
- id: rating_intuition
  file: figures/rating_intuition.json
  title: How much a line may carry depends on the weather
  shows: >-
    Three hot days on the one line. The dashed level is the static rating, 800 MW, set for the hottest
    afternoon and kept all day; green is what it lets through. The blue line is a rating that follows the
    weather: 1,000 MW at night and in the morning, 800 in the afternoon heat, and 1,100 for two hours at the
    evening peak under an emergency allowance. The light blue area is the room a static rating throws away.
- id: flow_vs_limit
  file: figures/flow_vs_limit.json
  title: Line flow against its rating
  shows: Flow per case with the static and the dynamic-plus-emergency limits dashed.
- id: price_spread
  file: figures/price_spread.json
  title: Price spread across the line
  shows: Price at B minus price at A per case; zero with room on the line, the peaker's premium when full.
- id: cost_and_rent
  file: figures/cost_and_rent.json
  title: Three-day cost and congestion rent by rating
  shows: Dispatch cost and congestion rent per case.
teach:
- concept: dynamic-line-rating
  gap: >-
    What limits a power line is heat: current warms the conductor, and a hot conductor stretches and sags
    towards the ground. How much current it can take depends on the weather: far more on a cool, windy night
    than on a still, hot afternoon. Operators traditionally use one static rating, safe for the worst
    afternoon, all day and night, so on most hours the line could carry more than it is allowed to. When the
    line is the bottleneck, that unused room is paid for with expensive local generation. The picture
    (rating_intuition) shows how much room that is.
  remedy: >-
    A dynamic line rating follows the conditions hour by hour, from measured or forecast temperature and
    wind, so the line carries more whenever it safely can. A short emergency rating adds a little more for an
    hour or two, because a conductor heats up slowly. In PyPSA a time-varying rating is the line's `s_max_pu`
    given as a time series.
  figure: rating_intuition
  example: >-
    Over the three days the dynamic rating cuts the peaker's output from about 28.9 to 18.9 GWh and the
    dispatch cost from about 4.6 to 3.6 MEUR, and the two-hour emergency allowance saves another 0.1 MEUR;
    the line is full in 72 of 72 hours under the static rating and 60 under the dynamic one
    (peaker_energy_mwh, cost_eur, saving_vs_static_eur, hours_at_limit). One layer deeper, flow_vs_limit shows
    the flow riding each limit and price_spread the price gap across the line whenever it is full.
numbers:
- {id: "static rating / dynamic rating / dynamic + emergency", label: Per-case block with the fields below}
- {id: cost_eur, label: Dispatch cost over three days, unit: EUR}
- {id: hours_at_limit, label: Hours the line is full, unit: h}
- {id: congestion_rent_eur, label: Flow times price spread summed, unit: EUR}
- {id: mean_price_spread_eur_mwh, label: Mean price difference B minus A, unit: EUR/MWh}
- {id: peaker_energy_mwh, label: OCGT energy, unit: MWh}
- {id: energy_over_line_mwh, label: Energy transferred over the line, unit: MWh}
- {id: saving_vs_static_eur, label: Cost saving of each case against the static rating, unit: EUR}
- {id: ratings_pu, label: The three rating levels, unit: p.u.}
limitations:
- The rating is a given time series, not computed from weather; the app's seasonal-line-ratings guide is where that lives.
- An emergency rating in reality is limited by conductor temperature history; here it is a fixed two-hour window.
sources:
- {title: "PyPSA example: Line Loading Limits", url: "https://docs.pypsa.org/latest/examples/line-loading-limits/"}
- {title: "PyPSA user guide: Seasonal line ratings", url: "https://docs.pypsa.org/latest/user-guide/seasonal-line-ratings/"}
pypsa: "1.3.0"
