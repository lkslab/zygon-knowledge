id: merit-order-dispatch
title: Merit order and marginal pricing
summary: >-
  One bus, five thermal generators, one day of hourly load. The cheapest units run
  first and the price in every hour is the marginal cost of the last unit needed. The
  smallest optimisation PyPSA solves, and the reference for every price question.
concepts: [dispatch, merit-order, marginal-price, producer-rent, economic-dispatch]
answers:
- "why is the electricity price set by gas even when nuclear and lignite are running"
- "what is the merit order and how does it set the price"
- "how much do baseload plants earn when the price is set by the peaker"
- "show me a dispatch stack over a day"
builds_on: []
setup:
  buses: one electricity bus (AC)
  components:
  - five Generator components with fixed capacity and constant marginal cost, no ramping, no commitment
  - a load-shedding Generator at the value of lost load as the last step of the stack
  - one Load with a two-hump daily shape (morning ramp, evening peak, night trough)
  snapshots: 24 hourly snapshots, weight 1 (one day)
  profiles: synthetic daily load between base and peak, 2 % noise, seed 42
  assumptions:
  - {name: nuclear, value: "2000 MW at 10 EUR/MWh"}
  - {name: lignite, value: "3000 MW at 25 EUR/MWh"}
  - {name: CCGT, value: "4000 MW at 55 EUR/MWh"}
  - {name: OCGT, value: "2000 MW at 110 EUR/MWh"}
  - {name: oil, value: "1000 MW at 180 EUR/MWh"}
  - {name: load, value: "5000 MW at night to 10500 MW at the evening peak"}
  - {name: value_of_lost_load, value: 3000, unit: EUR/MWh}
method: |
  Plain `n.optimize()` with HiGHS: a linear programme minimising the sum of marginal
  cost times dispatch subject to the bus balance and capacity limits. The price is the
  dual of the bus balance (`n.buses_t.marginal_price`), which equals the marginal cost
  of the unit that is partially loaded in that hour. Producer rent per unit is the
  price minus its marginal cost, times its output.
knobs:
- {name: fleet, in: "FLEET dict or build(fleet=...)", effect: "change capacities or costs; a plant that never becomes marginal earns pure rent"}
- {name: load shape, in: "build(base_mw=..., peak_mw=...)", effect: "push the peak above the fleet to see load shedding set the price"}
figures:
- id: merit_order_curve
  file: figures/merit_order_curve.json
  title: Merit order curve
  shows: >-
    Generators sorted by marginal cost as a staircase over cumulative capacity, with
    the day's minimum and peak load marked; the step each load line cuts is that hour's
    price.
- id: dispatch_stack
  file: figures/dispatch_stack.json
  title: Dispatch stack
  shows: Hourly dispatch stacked in merit order; the top of the stack is the load.
- id: price_series
  file: figures/price_series.json
  title: Hourly price
  shows: The bus marginal price, stepping between the marginal costs of CCGT and OCGT.
numbers:
- {id: total_cost_eur, label: Total dispatch cost for the day, unit: EUR, formula: "sum_t sum_g mc_g * p_{g,t}"}
- {id: avg_price_eur_mwh, label: Load-weighted average price, unit: EUR/MWh, formula: "sum_t price_t * load_t / sum_t load_t"}
- {id: peak_price_eur_mwh, label: Highest hourly price, unit: EUR/MWh, formula: max_t price_t}
- {id: min_price_eur_mwh, label: Lowest hourly price, unit: EUR/MWh, formula: min_t price_t}
- {id: consumer_payment_eur, label: What consumers pay for the day, unit: EUR, formula: "sum_t price_t * load_t"}
- {id: producer_rent_eur, label: Rent per carrier (price minus marginal cost times output), unit: EUR, formula: "sum_t (price_t - mc_g) * p_{g,t}"}
- {id: hours_marginal, label: Hours each carrier is the price-setting unit, unit: h, formula: "count of hours with 0 < p_g < p_nom_g"}
- {id: peak_load_mw, label: Peak load, unit: MW, formula: max_t load_t}
- {id: load_shed_mwh, label: Energy not served, unit: MWh, formula: "sum_t p_shed,t"}
limitations:
- No network, no ramping, no start-up costs: prices are exactly the marginal cost steps. See unit-commitment for how commitment changes that.
- Fixed capacities, so nothing about cost recovery; see screening-curves and price-duration-and-cost-recovery.
sources:
- {title: "PyPSA example: Electricity Market", url: "https://docs.pypsa.org/latest/examples/simple-electricity-market-examples/"}
- {title: "PyPSA example: Demand and Supply Bids", url: "https://docs.pypsa.org/latest/examples/demand-supply-bids/"}
pypsa: "1.3.0"
