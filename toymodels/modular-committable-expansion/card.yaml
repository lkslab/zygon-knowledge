id: modular-committable-expansion
title: Modular and committable expansion
summary: >-
  What changes when gas can only be built in 100 MW blocks and has to be committed
  with a minimum part load and start-up costs. The two-fortnight single node is solved
  as a linear relaxation and as the mixed-integer problem; the lumpy plan costs more
  and, with prices from a fixed-commitment re-solve, gas no longer breaks even. The
  zero-profit identity of the LP is gone.
concepts: [capacity-expansion, modular-expansion, unit-commitment, milp, integrality-gap, cost-recovery, zero-profit, start-up-cost]
answers:
- "what happens to the optimal mix when plants come in discrete blocks"
- "can I combine committable and extendable in PyPSA"
- "why do lumpy investments break cost recovery"
builds_on: [capacity-expansion-single-node, unit-commitment, price-duration-and-cost-recovery]
setup:
  buses: one electricity bus
  components:
  - extendable Generators onwind, solar and an extendable StorageUnit battery, continuous
  - Generator CCGT extendable with p_nom_mod (100 MW blocks), committable, minimum part load 40 %, start-up cost, min up/down 2 snapshots
  - a load-shedding Generator and one GlobalConstraint on CO2
  snapshots: 112 snapshots (two fortnights at 3-hour resolution), weighted to a year
  profiles: the base model's load, wind and solar sliced to the two fortnights
  assumptions:
  - {name: co2 cap, value: "30 % of the unconstrained two-fortnight emissions"}
  - {name: block size, value: 100, unit: MW}
  - {name: start-up cost, value: 20000, unit: EUR per start}
  - {name: technology costs, value: "as capacity-expansion-single-node"}
method: |
  Relaxation: `n.optimize()` with continuous capacities. MILP: `p_nom_mod=100` makes the
  gas capacity an integer number of blocks, `committable=True` with `p_min_pu`,
  `start_up_cost`, `min_up_time`, `min_down_time` adds the commitment binaries; PyPSA
  links commitment and extendable capacity with a big-M formulation. Solved with HiGHS
  at a relative MIP gap of 1e-4. Prices: a MILP has no duals, so the MILP's capacities
  and gas commitment are frozen in an LP (p_min_pu/p_max_pu from the status) whose duals
  are the dispatch prices, the same trick as unit-commitment. Cost recovery per
  technology is revenue at those prices against annualised capital cost, fuel, carbon
  (the LP's CO2 dual) and start-up costs.
knobs:
- {name: block size, in: BLOCK_MW, effect: "smaller blocks shrink the integrality gap toward zero"}
- {name: start-up cost and minimum load, in: GAS_UC, effect: "stiffer commitment pushes more of the year onto wind, solar and the battery"}
- {name: cap fraction, in: CAP_FRACTION, effect: "the tighter the cap the fewer gas hours and the worse a whole block pays"}
figures:
- id: capacity_continuous_vs_modular
  file: figures/capacity_continuous_vs_modular.json
  title: Capacity, continuous relaxation vs blocks with commitment
  shows: >-
    What the optimiser builds when any size is allowed (blue) and when gas comes in 100 MW blocks that must be
    committed with a minimum load and start-up costs (orange). Gas snaps from about 95 MW to one whole block; wind
    grows from about 510 to 540 MW and solar from about 320 to 400, because a committed gas plant can no longer
    follow every dip and the system leans on more wind and solar instead.
- id: dispatch_with_commitment
  file: figures/dispatch_with_commitment.json
  title: Dispatch in the winter fortnight with commitment
  shows: Stacked dispatch; committed gas holds its minimum part load and avoids cycling.
- id: cost_recovery_lp_vs_milp
  file: figures/cost_recovery_lp_vs_milp.json
  title: Revenue against cost, the zero-profit identity breaks
  shows: >-
    Each technology's revenue at the model's own prices against its cost. With continuous sizes (LP) every pair
    matches exactly: the zero-profit rule. With blocks and commitment (MILP) the gas plant earns about 11 MEUR
    against about 39 MEUR of cost, and wind recovers only about two thirds of its cost.
teach:
- concept: modular-expansion
  gap: >-
    A linear capacity expansion can build any amount of anything: about 95 MW of gas, run at any level down to zero
    whenever that suits. Real plants come in fixed sizes, and a gas turbine that is on must run above a minimum and
    costs money to start. The tidy LP answer can be one no plant manufacturer or operator could deliver. The picture
    (capacity_continuous_vs_modular) compares the two.
  remedy: >-
    Make the lumpiness part of the problem: gas can only be built in whole blocks, and each block is committed hour
    by hour with a minimum load and start-up costs. The optimiser then chooses whole units and a schedule they can
    follow, which makes it a mixed-integer problem, slower to solve and more expensive than the LP. In PyPSA a
    generator gets `p_nom_mod` (the block size) and `committable=True`.
  figure: capacity_continuous_vs_modular
  example: >-
    Gas becomes one 100 MW block, committed 46 % of the time with 21 starts in the two fortnights, and the system
    costs about 109 MEUR a year instead of 98, 10.6 % more (capacity_mw, gas_blocks_built,
    gas_hours_committed_pct, gas_start_ups_in_two_fortnights, cost_milp_meur_a, cost_relaxed_meur_a,
    integrality_gap_pct). One layer deeper, dispatch_with_commitment shows the committed gas holding its minimum.
- concept: zero-profit
  gap: >-
    In a linear model every technology that is built earns exactly its cost back from the prices the model itself
    produces, which is what makes an optimum look like a working market. That neat identity rests on everything
    being divisible.
  remedy: >-
    With blocks and commitment it breaks. An integer problem has no prices of its own; prices from re-solving with
    the commitment fixed pay each hour's running cost but not the start-ups, minimum loads and lumpy capacity, so a
    plant can be needed and still lose money. That is why real markets add uplift or make-whole payments and why
    capacity mechanisms exist.
  figure: cost_recovery_lp_vs_milp
  builds_on_concept: modular-expansion
  example: >-
    In the LP every cost_recovery_ratio is 1.0; with blocks and commitment gas recovers about 27 % of its cost and
    loses about 28 MEUR a year, wind about 67 %, solar just over 100 % (cost_recovery_ratio, gas_profit_meur_a).
    price-duration-and-cost-recovery shows the identity holding in the LP.
numbers:
- {id: cost_relaxed_meur_a, label: LP annual cost, unit: MEUR/a}
- {id: cost_milp_meur_a, label: MILP annual cost, unit: MEUR/a}
- {id: integrality_gap_pct, label: MILP over LP cost, unit: "%"}
- {id: capacity_mw, label: Capacity per technology, relaxed and modular, unit: MW}
- {id: gas_blocks_built, label: Number of 100 MW blocks, unit: count}
- {id: gas_start_ups_in_two_fortnights, label: Gas start-ups over the 28 modelled days, unit: count}
- {id: gas_hours_committed_pct, label: Share of the year gas is on, unit: "%"}
- {id: cost_recovery_ratio, label: Revenue over cost per technology, LP and MILP, unit: ratio}
- {id: gas_profit_meur_a, label: Gas revenue minus cost in the MILP at fixed-commitment prices, unit: MEUR/a}
- {id: co2_price_eur_t, label: CO2 dual in the LP and in the fixed-commitment LP, unit: EUR/t}
limitations:
- The fixed-commitment LP's CO2 dual can be zero (gas dispatch is fixed by the commitment), so the carbon term in the MILP's cost recovery may vanish; the identity still breaks, for the right reason.
- Two fortnights; a whole 100 MW block against a 100 MW mean load exaggerates the lumpiness on purpose.
sources:
- {title: "PyPSA example: Modular Capacity Expansion", url: "https://docs.pypsa.org/latest/examples/modular-expansion/"}
- {title: "PyPSA example: Committable and Extendable", url: "https://docs.pypsa.org/latest/examples/committable-extendable/"}
- {title: "PyPSA example: Modular and Committable", url: "https://docs.pypsa.org/latest/examples/modular-committable/"}
pypsa: "1.3.0"
