id: price-duration-and-cost-recovery
title: Price duration and cost recovery
summary: >-
  Do the technologies an optimiser builds earn their money back at the prices the same
  optimiser produces? The single-node expansion at a 20 % CO2 cap, read through its
  price duration curve and a revenue-versus-cost check per technology. In a linear
  programme every technology built recovers exactly its annualised capital, operating
  and carbon cost: the zero-profit condition of a competitive market.
concepts: [cost-recovery, zero-profit, price-duration-curve, scarcity-pricing, market-value, revenue, carbon-price]
answers:
- "do wind and solar recover their costs at market prices"
- "where does the revenue of a wind farm come from when the price is zero half the time"
- "what does a price duration curve of a high-renewables system look like"
- "what is the market value of wind versus its LCOE"
- "why does gas look over-recovering unless you charge it the CO2 price"
builds_on: [capacity-expansion-single-node]
setup:
  buses: electricity and hydrogen, as in capacity-expansion-single-node
  components: identical to capacity-expansion-single-node at the 20 % cap
  snapshots: 2190 snapshots (a year every 4 hours), weight 4 h
  profiles: the same seeded load, wind and solar as the base model
  assumptions:
  - {name: co2 cap, value: "20 % of the unconstrained emissions, read from the base model's results.yaml"}
  - {name: everything else, value: "see capacity-expansion-single-node"}
method: |
  One `n.optimize()`. Revenue per technology from `n.statistics.revenue()` (net of what a
  component pays for its inputs, so the electrolyser's electricity bill is deducted and
  storage earns its spread). Cost is `statistics.capex()` (annualised) plus `opex()`,
  plus for gas the carbon cost: the CO2 constraint's shadow price times its emissions.
  That carbon term is what the market price already contains when gas is marginal
  (price = fuel cost + CO2 price x emission factor), so without it gas would appear to
  over-recover by exactly that amount. The margin split classifies hours as scarcity
  when the price is above the gas level (set by storage or lost load).
knobs:
- {name: cap fraction, in: "build(cap_fraction=...)", effect: "tighter caps raise the CO2 price and shift wind's revenue into scarcity hours"}
- {name: value of lost load, in: BASE.VOLL, effect: "the height of the scarcity spike; total scarcity rent is what the cap and VOLL leave for capital cost"}
figures:
- id: margin_intuition
  file: figures/margin_intuition.json
  title: The few hours that pay for the plants
  shows: >-
    Every hour of the year sorted by price, dearest first. For about 2,100 hours gas is the last
    plant needed and the price sits at its running cost plus carbon, about 454 EUR/MWh (dashed); for
    most of the year it is lower, and for about 5,700 hours zero. Only in about 256 scarcity hours
    does it climb above, up to about 1,570. The green area over the dashed line is what one MW of gas
    earns above its running cost over the year, about 90,500 EUR, the same as a MW of gas costs to
    build per year.
- id: price_duration
  file: figures/price_duration.json
  title: Price duration curve (log scale)
  shows: Sorted prices; a few hours at the value of lost load, a block at the gas-plus-carbon level, a long tail at zero.
- id: revenue_vs_cost
  file: figures/revenue_vs_cost.json
  title: Revenue against annualised cost
  shows: Revenue beside stacked capital, operating and carbon cost per built technology; the bars match.
- id: revenue_split
  file: figures/revenue_split.json
  title: Where the margin comes from
  shows: Margin above marginal cost per generator split into scarcity hours and ordinary hours.
teach:
- concept: scarcity-pricing
  gap: >-
    In a market that pays the running cost of the last plant needed, the plant that is last
    never earns more than it spends on fuel. A gas plant that is mostly the last one needed, or a
    peaker that runs a few dozen hours a year, would then never pay back what it cost to build, and
    nobody would build it. Yet the system needs it for the calm, cold evenings. The picture
    (margin_intuition) shows where its money comes from.
  remedy: >-
    In the few hours when even the last plant is not enough, the price is no longer set by a
    plant's running cost but by scarcity: storage asking what its stored energy is worth, or
    consumers who would rather go without. The price climbs far above the gas plant's cost, and
    those few hours of margin pay for the plant. The spikes are not a failure of the market; they
    are how it pays for capacity that is needed but rarely used.
  figure: margin_intuition
  example: >-
    Gas sets about 454 EUR/MWh when it runs (fuel plus the CO2 price), yet a MW of gas earns about
    90,500 EUR over its running cost in the year, all of it in about 256 scarcity hours, which is
    exactly the 90,500 EUR a MW costs to build per year (gas_price_level_eur_mwh,
    gas_scarcity_margin_eur_per_mw_a, gas_capital_cost_eur_per_mw_a, scarcity_hours_h; CCGT's
    scarcity_rent_share_pct is 100). One layer deeper, price_duration shows the whole year on a log
    scale and revenue_split splits each generator's margin into scarcity and ordinary hours.
- concept: cost-recovery
  gap: >-
    An optimiser chooses what to build for the whole system, not for any one investor. It is fair
    to ask whether the plants it picks would actually earn their money back if they were paid the
    prices that same optimum produces, or whether the plan quietly relies on subsidies.
  remedy: >-
    At the optimum of a linear model every technology it builds earns exactly its cost back from the
    prices, no more and no less: the zero-profit condition of a competitive market. If a technology
    earned more, building one more MW would lower the total cost, so the optimiser would have built
    it; if it earned less, it would have built less. Wind earns in ordinary hours, gas in the
    scarcity hours, storage on the spread, and each lands on its cost.
  figure: margin_intuition
  builds_on_concept: scarcity-pricing
  example: >-
    Wind earns about 45 MEUR against about 45 MEUR of annualised cost, solar about 19 against 19,
    gas about 47 against 47 including its carbon cost; every cost_recovery_ratio is 1.0 and wind's
    market value equals its LCOE at about 60 EUR/MWh (revenue_meur_a, annualised_cost_meur_a,
    cost_recovery_ratio, market_value_eur_mwh, lcoe_eur_mwh). One layer deeper, revenue_vs_cost puts
    revenue beside the stacked cost per technology.
numbers:
- {id: co2_price_eur_t, label: CO2 shadow price, unit: EUR/t}
- {id: gas_price_level_eur_mwh, label: Price when gas is marginal, unit: EUR/MWh, formula: "60 + co2_price * 0.37"}
- {id: carbon_cost_ccgt_meur_a, label: Implicit carbon cost paid by gas, unit: MEUR/a}
- {id: cost_recovery_ratio, label: Revenue over cost per technology (1.0 at the optimum), unit: ratio}
- {id: zero_profit_residual_pct, label: Revenue minus cost over cost, unit: "%"}
- {id: revenue_meur_a, label: Revenue per technology, unit: MEUR/a}
- {id: annualised_cost_meur_a, label: Capex plus opex plus carbon per technology, unit: MEUR/a}
- {id: market_value_eur_mwh, label: Revenue per MWh generated, unit: EUR/MWh}
- {id: lcoe_eur_mwh, label: Cost per MWh generated, unit: EUR/MWh, note: "equals market value at the optimum"}
- {id: share_of_hours_pct, label: Share of hours at zero, at the gas level, above it (scarcity), in between, unit: "%"}
- {id: mean_price_eur_mwh, label: Time-weighted mean price, unit: EUR/MWh}
- {id: load_weighted_price_eur_mwh, label: Load-weighted mean price, unit: EUR/MWh}
- {id: max_price_eur_mwh, label: Highest price (the value of lost load), unit: EUR/MWh}
- {id: consumer_payment_meur_a, label: Load times price over the year, unit: MEUR/a}
- {id: system_cost_meur_a, label: Objective, unit: MEUR/a}
- {id: scarcity_hours_h, label: Hours with the price above the gas level, unit: h}
- {id: gas_scarcity_margin_eur_per_mw_a, label: What a MW of gas earns above its running cost and carbon, unit: EUR/MW/a, formula: "sum_t max(0, price_t - gas level) * weight_t"}
- {id: gas_capital_cost_eur_per_mw_a, label: Annualised cost of building a MW of gas, unit: EUR/MW/a}
- {id: scarcity_rent_share_pct, label: Share of each generator's margin earned in scarcity hours, unit: "%"}
limitations:
- Exact cost recovery is a property of the LP with perfect foresight and no lumpiness; real markets recover less or need capacity payments.
- With a MILP (unit commitment, discrete builds) the identity breaks; see the PyPSA modular-expansion example.
sources:
- {title: "PyPSA example: Screening Curves (zero-profit check)", url: "https://docs.pypsa.org/latest/examples/generation-investment-screening-curve/"}
- {title: "PyPSA user guide: Statistics (revenue, market value)", url: "https://docs.pypsa.org/latest/user-guide/statistics/"}
- {title: "Brown & Reichenberg, Decreasing market value of variable renewables", url: "https://github.com/nworbmot/market-value"}
pypsa: "1.3.0"
