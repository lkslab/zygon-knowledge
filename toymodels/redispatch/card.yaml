id: redispatch
title: Zonal market, redispatch and nodal pricing
summary: >-
  A windy, cheap north and a load-heavy south joined by two small lines. Three solves
  on one day: the nodal reference, a copper-plate zonal market that clears as if the
  lines were infinite, and the operator's redispatch that freezes the market schedule
  and pays units to ramp up or down until the flows fit. The gap between market plus
  redispatch and nodal pricing is the cost of pretending the grid is not there.
concepts: [redispatch, zonal-market, nodal-pricing, congestion, curtailment, market-design]
answers:
- "what is redispatch and how is it modelled"
- "how much does a zonal market with redispatch cost compared to nodal pricing"
- "why is wind curtailed in the north while gas runs in the south"
- "how do you fix a market schedule and re-solve on the real grid"
builds_on: [nodal-prices-lopf]
setup:
  buses: N1, N2 (north), S1, S2 (south), 380 kV
  components:
  - Generators onwind at N1 (with a profile), coal at N2, CCGT at S1, OCGT at S2, load shedding everywhere
  - Lines N1-N2 and S1-S2 (large), N1-S1 and N2-S2 (the 400 MW bottlenecks), equal reactance
  - Loads at every bus with a daily shape
  - in the redispatch network, per unit an "up" twin (headroom at cost plus a premium) and a "down" twin (negative output refunding cost minus the premium)
  snapshots: 24 hourly snapshots, weight 1
  profiles: daily load shape scaled to 300/300/1500/1500 MW; wind with 50 % mean capacity factor; seed 42
  assumptions:
  - {name: onwind N1, value: "3000 MW at 0 EUR/MWh"}
  - {name: coal N2, value: "1000 MW at 30 EUR/MWh"}
  - {name: CCGT S1, value: "2000 MW at 60 EUR/MWh"}
  - {name: OCGT S2, value: "1500 MW at 120 EUR/MWh"}
  - {name: north-south lines, value: "400 MW each"}
  - {name: redispatch premium, value: 10, unit: EUR/MWh, note: "paid on top of cost for ramping up; deducted from the refund for ramping down"}
  - {name: value_of_lost_load, value: 3000, unit: EUR/MWh}
method: |
  Follows the PyPSA scigrid-redispatch example. (1) Nodal: `n.optimize()` on the real
  grid. (2) Zonal market: the same network with every line rating multiplied by 100,
  so the market ignores the bottleneck. (3) Redispatch: rebuild the real grid, fix each
  unit's output to its market schedule through p_min_pu = p_max_pu, and add for each
  unit a ramp-up generator with the remaining headroom at marginal cost plus the
  premium and a ramp-down generator with p_min_pu = -schedule, p_max_pu = 0 at marginal
  cost minus the premium, so its negative output refunds the avoided cost less the
  premium (curtailing zero-cost wind costs the premium). Solving (3) finds the cheapest
  set of adjustments that make the flows feasible. Redispatch cost is objective (3)
  minus objective (2).
knobs:
- {name: bottleneck rating, in: LINES, effect: "wider north-south lines shrink both redispatch volume and the nodal price split"}
- {name: premium, in: REDISPATCH_PREMIUM, effect: "the operator's transaction cost; zero makes redispatch as cheap as nodal in this toy"}
- {name: wind size, in: GENS, effect: "more northern wind means more curtailment under every design"}
figures:
- id: redispatch_geography
  file: figures/redispatch_geography.json
  title: Where power is made, where it is used, and the lines between
  shows: >-
    The toy's four buses as a made-up country. The windy, thinly populated north (wind, then
    coal) makes far more than it uses and is coloured green; the south's city and industry use
    far more than they make and are purple. A broad blue arrow is what the zonal market plans to
    move south, about 2 GW; the two red 400 MW lines are all that joins the halves, drawn at their
    width on the same scale. Each plant is labelled with its cost, the order the market picks
    them in.
- id: redispatch_intuition
  file: figures/redispatch_intuition.json
  title: "What redispatch fixes: the market's plan against the grid"
  shows: >-
    The day's north-to-south transfer as the zonal market plans it (about 1.3 to 2.4 GW, since
    the market sees no lines) against the 800 MW the two corridor lines carry. The green part
    is what the lines carry; the orange band above it is what the operator must turn down in the
    north and up in the south, hour by hour. (In the morning the physics lets a little less than 800 MW through, because power splits
    over both lines by their impedance and one fills first; the picture is the principle.)
- id: price_by_bus
  file: figures/price_by_bus.json
  title: One zonal price against a price per bus
  shows: >-
    The day's mean nodal price at each bus against the one zonal price of about 59 EUR/MWh:
    about 14 at N1 and negative at N2 in the windy north, 65 and 116 in the south. The zonal price
    tells every plant power is worth the same everywhere; the nodal prices say where it is short.
- id: cost_comparison
  file: figures/cost_comparison.json
  title: Daily system cost by market design
  shows: Nodal, zonal market as cleared, and zonal plus redispatch; the zonal bar is a fiction, the third is what is paid.
- id: redispatch_volume
  file: figures/redispatch_volume.json
  title: Redispatch volumes by unit
  shows: Energy ramped up (southern gas) and down (northern wind and coal) per unit.
- id: line_loading
  file: figures/line_loading.json
  title: Line loading implied by the zonal schedule
  shows: Flows the market schedule would push through the real grid, in percent of the rating; the bottlenecks run far above 100 %.
teach:
- concept: redispatch
  gap: >-
    Power is often made far from where it is used: wind where it is windy and few people live,
    demand in the cities and industry. Most of Europe trades power in zones, one price for a whole
    country, and the zonal market clears as if power could travel freely inside the zone: it
    simply takes the cheapest plants, wherever they are. The grid has limits. Here the cheap wind
    and coal sit in the north, most of the demand in the south, and the two lines between them
    carry 800 MW together; the market plans to send around 2 GW south, a schedule the grid cannot
    carry. The map (redispatch_geography) pictures exactly this: where power is made, where it is
    used, the market's plan and the thin lines.
  remedy: >-
    After the market has cleared, the grid operator redispatches: it pays plants on the surplus
    side of the bottleneck to produce less (northern coal and wind) and plants on the short side to
    produce more (southern gas), by the same amount so supply still meets demand, until the flows
    fit the lines. The market result stands; redispatch is a correction bought on top of it and
    paid for through grid fees.
  figure: redispatch_geography
  example: >-
    The market schedule would load the north-south lines to about 340 % of their rating. The
    operator turns about 30 GWh down in the north (23 GWh of coal first, since that saves fuel, then
    6 GWh of wind curtailed) and the same amount up in southern gas, for about 2.0 MEUR on a day the
    market itself cleared at 1.6 MEUR (max_line_loading_market_pct, redispatch_by_unit_mwh,
    wind_curtailed_mwh, cost_redispatch_eur, cost_zonal_market_eur). One layer deeper,
    redispatch_intuition shows the plan against the lines hour by hour, the excess being the
    redispatch; redispatch_volume shows who ramps.
- concept: nodal-pricing
  gap: >-
    A single zonal price tells every plant and consumer that power is worth the same everywhere,
    though northern power cannot reach the south. So the market keeps planning a schedule the grid
    cannot carry, the correction is paid for separately, and nobody is told that a new plant or a
    flexible consumer would be worth more in the south and less in the north.
  remedy: >-
    Nodal pricing puts the grid into the market: every bus gets its own price, set by the cheapest
    plant that can still reach it. Where power is stuck behind the bottleneck it is cheap, where it
    is short it is expensive, and the schedule the market clears already fits the lines, so nothing
    needs redispatching.
  figure: price_by_bus
  builds_on_concept: redispatch
  example: >-
    Nodal prices average about 14 EUR/MWh at N1, 65 at S1 and 116 at S2, against one zonal price
    of about 59; N2's is even negative, because power fed in there lands on the full lines. The
    nodal day costs about 3.0 MEUR, zonal plus redispatch about 3.6 MEUR, 20 % more
    (avg_price_eur_mwh, cost_nodal_eur, cost_zonal_plus_redispatch_eur, efficiency_loss_pct);
    cost_comparison shows the three designs side by side. With a zero premium the two would cost
    the same here, so this toy's whole gap is the operator's premium.
numbers:
- {id: cost_nodal_eur, label: Nodal dispatch cost for the day, unit: EUR}
- {id: cost_zonal_market_eur, label: Zonal market clearing cost, unit: EUR}
- {id: cost_redispatch_eur, label: Cost of the redispatch actions, unit: EUR, formula: "objective(redispatch) - objective(market)"}
- {id: cost_zonal_plus_redispatch_eur, label: What the zonal design actually costs, unit: EUR}
- {id: efficiency_loss_pct, label: Zonal plus redispatch over nodal, unit: "%"}
- {id: redispatch_up_mwh, label: Energy ramped up, unit: MWh}
- {id: redispatch_down_mwh, label: Energy ramped down, unit: MWh}
- {id: redispatch_by_unit_mwh, label: Up and down per unit, unit: MWh}
- {id: wind_curtailed_mwh, label: Wind curtailed under each design, unit: MWh}
- {id: avg_price_eur_mwh, label: Mean price per bus (nodal) and the single zonal price, unit: EUR/MWh, note: "N2 can go negative: injecting there loads the bottleneck through the loop"}
- {id: max_line_loading_market_pct, label: Worst line overload implied by the market schedule, unit: "%"}
limitations:
- Cost-based redispatch with a flat premium; real redispatch is compensated by rules that differ by country.
- With a zero premium, cost-based redispatch reaches the nodal optimum exactly, so the whole gap here is the premium. In practice the gap also comes from strategic bidding ahead of expected redispatch (inc-dec), investment signals that ignore the grid and the limited set of units an operator can call, none of which a one-day LP holds.
- One zone on each side, so no zonal price difference to exploit; a two-zone market with a fixed transfer capacity is the next step.
sources:
- {title: "PyPSA example: Redispatch", url: "https://docs.pypsa.org/latest/examples/scigrid-redispatch/"}
- {title: "PyPSA-GB tutorial: market dispatch and balancing", url: "https://pypsa-gb.readthedocs.io/en/latest/tutorials/index.html"}
pypsa: "1.3.0"
