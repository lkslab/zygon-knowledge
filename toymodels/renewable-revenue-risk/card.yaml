id: renewable-revenue-risk
title: Zero-price hours and wind revenue risk
summary: >-
  The single-node capacity expansion solved at four CO2 caps, so the optimal system goes
  from about half to almost all wind and solar. Read from a wind farm's side: the share of
  hours at zero price grows from under a fifth to four fifths, wind's capture rate halves,
  and what wind earns per MWh swings from week to week far more. The reason CfDs and PPAs
  exist, produced by an actual PyPSA optimisation.
concepts: [cannibalisation, capture-rate, market-value, revenue-risk, price-duration-curve, capacity-expansion, co2-cap]
answers:
- "why do renewables earn less as their share grows"
- "why does the electricity price fall to zero so often in a renewable system"
- "why is a wind farm's revenue so uncertain"
- "how does PyPSA show the need for CfDs or PPAs"
builds_on: [capacity-expansion-single-node, price-duration-and-cost-recovery]
setup:
  buses: electricity and hydrogen, as in capacity-expansion-single-node
  components: identical to capacity-expansion-single-node (extendable wind, solar, CCGT, battery, hydrogen chain, load shedding)
  snapshots: 2190 snapshots (a year every 4 hours), weight 4 h
  profiles: the base model's seeded load, wind and solar
  assumptions:
  - {name: CO2 caps, value: "none, 50 %, 20 % and 5 % of the unconstrained emissions", note: "the cap is what drives the wind and solar share"}
  - {name: zero price, value: "at or below 0.001 EUR/MWh"}
  - {name: weeks, value: "ISO weeks, the last partial week folded into week 52"}
method: |
  One `n.optimize()` per cap: the optimiser chooses capacities and dispatch together, so
  every case is a least-cost system, not a fixed fleet with more wind bolted on. From
  `buses_t.marginal_price` and the wind generator's `generators_t.p` with snapshot weights:
  the share of hours at zero price, wind's market value (revenue over output), its capture
  rate (market value over the time-weighted mean price), and the market value week by week.
  The price is zero whenever wind and solar alone cover demand, so the more of them the
  system builds, the more of wind's own output lands in those hours.
knobs:
- {name: cases, in: "sweep(cases)", effect: "CO2 caps as fractions of the unconstrained emissions (None for no cap); more and tighter caps trace the curve further"}
- {name: cap_fraction, in: "build(cap_fraction=...)", effect: "one case on its own, for a rerun of a single system"}
figures:
- id: zero_price_and_capture_rate
  file: figures/zero_price_and_capture_rate.json
  title: "More wind and solar: more zero-price hours, less per MWh for wind"
  shows: >-
    One point per optimal system, against its wind and solar share of generation. Hours at
    zero price rise from about 18 % to 80 %; wind's capture rate falls from about 0.67 to 0.33,
    because wind produces most exactly when the price is zero.
- id: weekly_wind_revenue
  file: figures/weekly_wind_revenue.json
  title: What wind earns per MWh, week by week
  shows: >-
    The least and the most renewable case. At about half wind and solar, wind earns a fairly
    steady amount per MWh each week; at almost all, it earns nothing for weeks on end and then
    hundreds of EUR/MWh in a few still autumn weeks. That swing is what a CfD or a PPA
    flattens.
- id: price_duration_by_case
  file: figures/price_duration_by_case.json
  title: Price duration curves by wind and solar share
  shows: >-
    The year's prices sorted from high to low for each case. The block at zero widens with the
    wind and solar share, and the revenue left concentrates in fewer, higher-priced hours.
teach:
- concept: cannibalisation
  gap: >-
    Wind farms all produce at the same time, when it is windy. The more of them a system has,
    the more often they alone cover demand, and then the price is set by a plant that burns
    nothing: zero.
  remedy: >-
    Nothing in the market fixes this; it is why wind earns less per MWh than the average price
    (its capture rate is below one) and why that gap widens with every farm added. Support
    schemes and contracts (CfDs, PPAs) exist to make the revenue bankable anyway; storage,
    flexible demand and hydrogen raise the zero-price hours' value.
  figure: zero_price_and_capture_rate
  example: >-
    Hours at zero price go from about 18 % at half wind and solar to about 80 % near all of it;
    wind's capture rate falls from 0.67 to 0.33 (share_hours_zero_price_pct, wind_capture_rate
    per case).
- concept: revenue-risk
  gap: >-
    A farm's income is price times output, and in a renewable-heavy system the price is either
    zero or very high, so a single windy or still month decides the year.
  remedy: >-
    The week-by-week earning shows the risk directly; a contract that fixes the price per MWh
    replaces that line with a flat one.
  figure: weekly_wind_revenue
  example: >-
    The week-to-week coefficient of variation of wind's earning per MWh goes from about 0.9 to
    about 2.2 between the least and the most renewable case (weekly_wind_value_cv).
numbers:
- {id: vre_share_pct, label: Wind and solar share of generation, unit: "%"}
- {id: wind_capacity_mw, label: Wind capacity built, unit: MW}
- {id: share_hours_zero_price_pct, label: Share of hours at zero price, unit: "%"}
- {id: share_wind_energy_at_zero_price_pct, label: Share of wind output produced at zero price, unit: "%"}
- {id: mean_price_eur_mwh, label: Time-weighted mean price, unit: EUR/MWh}
- {id: wind_market_value_eur_mwh, label: Wind market revenue per MWh, unit: EUR/MWh}
- {id: wind_capture_rate, label: Wind market value over mean price, unit: ratio}
- {id: weekly_wind_value_min_eur_mwh, label: Lowest weekly wind earning per MWh, unit: EUR/MWh}
- {id: weekly_wind_value_max_eur_mwh, label: Highest weekly wind earning per MWh, unit: EUR/MWh}
- {id: weekly_wind_value_cv, label: Week-to-week coefficient of variation of wind's earning per MWh, unit: ratio}
- {id: co2_cap_fraction, label: CO2 cap as a fraction of the unconstrained emissions, unit: ratio}
limitations:
- One node and one synthetic weather year; real systems trade across borders, which fills some zero-price hours.
- An LP with perfect foresight: the mean price rises with the cap because scarcity hours carry every technology's capital cost (zero profit), so wind's market value in EUR/MWh stays roughly flat while its capture rate falls.
- No negative prices and no flexible demand beyond the battery and the hydrogen chain.
- The sweep solves four year-long expansions, about a minute; a rerun with more caps takes proportionally longer.
sources:
- {title: "PyPSA user guide: Statistics (revenue, market value)", url: "https://docs.pypsa.org/latest/user-guide/statistics/"}
- {title: "Hirth (2013): The market value of variable renewables", url: "https://doi.org/10.1016/j.eneco.2013.02.004"}
pypsa: "1.3.0"
