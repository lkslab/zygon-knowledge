id: sector-coupling-single-node
title: "Sector coupling: electricity, heat and hydrogen"
summary: >-
  The single-node capacity expansion gains a heat bus (heat pump with a seasonal COP,
  gas boiler, hot-water tank, winter-peaked heat demand) and a hydrogen demand on the
  hydrogen bus, under a CO2 cap. Coupling adds flexible electric load: the heat pump
  and electrolyser run when wind and solar are surplus, and the tank and hydrogen store
  carry that energy across hours and weeks.
concepts: [sector-coupling, heat-pump, cop, electrolysis, hydrogen, thermal-storage, energy-balance, flexible-load]
answers:
- "how do I add heat and hydrogen to an electricity model"
- "what does electrification do to electricity demand and the capacity mix"
- "how does a heat pump's COP vary over the year and why does it matter"
- "what is the levelised cost of hydrogen from surplus renewables"
- "how do I plot an energy balance per carrier"
builds_on: [capacity-expansion-single-node]
setup:
  buses: electricity (AC), heat, hydrogen (H2)
  components:
  - everything in capacity-expansion-single-node (wind, solar, CCGT, battery, electrolyser, H2 store, fuel cell)
  - Link heat pump electricity to heat with a time-varying efficiency (the COP), extendable
  - Generator gas boiler on the heat bus with its own CO2 factor, extendable
  - Store water tanks on the heat bus with a standing loss, extendable
  - Load heat demand (winter-peaked) and Load H2 demand (flat) on the hydrogen bus
  snapshots: 2190 snapshots (a year every 4 hours), weight 4 h
  profiles: base-model load, wind, solar; degree-day-like heat demand; COP 2.5 in mid-winter to 4.0 in mid-summer; seed 42
  assumptions:
  - {name: heat demand, value: "mean 60 MW thermal, winter peak about four times the summer floor"}
  - {name: hydrogen demand, value: "20 MW flat"}
  - {name: heat pump, value: "600 EUR/kW electric, 20 a, COP profile"}
  - {name: gas boiler, value: "100 EUR/kW thermal, 20 a, efficiency 0.9, 67 EUR/MWh thermal, 0.41 t/MWh thermal"}
  - {name: water tanks, value: "3 EUR/kWh, 25 a, 0.5 % standing loss per hour"}
  - {name: co2 cap, value: "20 % of the electricity-only unconstrained emissions, covering power and boiler"}
method: |
  One `n.optimize()` on the extended network. The COP enters as a time series on the
  Link's efficiency (passed to `n.add` as a Series); the CO2 constraint is
  `primary_energy` over every carrier with an emission factor, so the boiler competes
  with the power sector for the same budget. Balances per bus are assembled from the
  signed flows of generators, storage, stores, links (p0 at bus0, p1 at bus1) and loads.
  The levelised cost of hydrogen is the electrolyser and store cost plus the electricity
  bought at the bus price, divided by hydrogen produced.
knobs:
- {name: cap fraction, in: "build(cap_fraction=...)", effect: "loosen it and the gas boiler returns for the coldest weeks; tighten it and the tank grows"}
- {name: heat and hydrogen demand, in: "MEAN_HEAT_MW, H2_DEMAND_MW", effect: "how much of the power system the other sectors pull along"}
- {name: COP swing, in: profiles.cop, effect: "a flatter COP makes winter cheaper for the heat pump"}
- {name: tank cost and loss, in: HEAT_TECH, effect: "cheap, tight tanks turn into seasonal heat storage"}
figures:
- id: energy_balance_electricity
  file: figures/energy_balance_electricity.json
  title: Electricity balance, weekly means
  shows: Supply stacked above zero and withdrawals below, per carrier, as weekly means over the year.
- id: energy_balance_heat
  file: figures/energy_balance_heat.json
  title: Heat balance, weekly means
  shows: Heat pump, boiler and tank supply against the heat load, weekly means.
- id: flexible_load_week
  file: figures/flexible_load_week.json
  title: Flexible load in a winter week
  shows: Electric draw of the heat pump and the electrolyser against the electricity price for one January week.
numbers:
- {id: total_cost_meur_a, label: Annual system cost, unit: MEUR/a}
- {id: heat_pump_share_of_heat_pct, label: Heat pump share of heat supplied, unit: "%"}
- {id: heat_supplied_over_demand_pct, label: Heat supplied over heat demand, unit: "%", note: "above 100 % is tank standing loss"}
- {id: seasonal_cop_mean, label: Heat delivered over electricity drawn by the heat pump, unit: ratio}
- {id: capacity_mw, label: Optimal capacity per carrier including heat pump (electric) and boiler (thermal), unit: MW}
- {id: storage_mwh, label: Water tank and hydrogen store energy capacity, unit: MWh}
- {id: electricity_demand_uplift_pct, label: Heat pump plus electrolyser electricity over the electric load, unit: "%"}
- {id: electrolyser_capacity_factor_pct, label: Electrolyser utilisation, unit: "%"}
- {id: lcoh_eur_mwh, label: Levelised cost of hydrogen, unit: EUR/MWh}
- {id: mean_price_eur_mwh, label: Mean price on the electricity, heat and hydrogen buses, unit: EUR/MWh}
- {id: co2_price_eur_t, label: CO2 shadow price, unit: EUR/t}
- {id: emissions_kt, label: Power plus boiler emissions, unit: kt}
- {id: load_shed_mwh, label: Electricity not served, unit: MWh}
limitations:
- Heat is one lumped bus; no district-heat network, no building thermal inertia, no CHP.
- Hydrogen demand is flat and must be met; there is no hydrogen import or pipeline.
- Synthetic COP and heat profiles; shapes matter, levels do not.
sources:
- {title: "PyPSA example: Single-Node Sector-Coupling", url: "https://docs.pypsa.org/latest/examples/sector-coupling-single-node/"}
- {title: "PyPSA example: Heat Pumps and Thermal Storage", url: "https://docs.pypsa.org/latest/examples/power-to-heat-water-tank/"}
- {title: "Data Science for ESM: sector-coupling workshop", url: "https://fneum.github.io/data-science-for-esm/dsesm/workshop-pypsa-sector-coupling/"}
pypsa: "1.3.0"
