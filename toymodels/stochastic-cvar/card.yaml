id: stochastic-cvar
title: Stochastic investment and CVaR risk aversion
summary: >-
  Investment under an uncertain gas price. One node with wind, solar, gas and a
  battery over two representative fortnights; the gas price is low, mid or high with
  known probabilities but unknown when capacities are chosen. Three deterministic
  plans, a two-stage stochastic plan that minimises expected cost, and CVaR-weighted
  plans that also penalise the expensive tail. Yields the value of perfect information,
  the value of the stochastic solution and the price of insurance.
concepts: [stochastic-programming, scenarios, cvar, risk-aversion, evpi, vss, two-stage, uncertainty]
answers:
- "how do I plan capacity when the fuel price is uncertain"
- "what is the value of the stochastic solution and the expected value of perfect information"
- "what does CVaR risk aversion do to the capacity mix"
- "how much does hedging against the bad scenario cost in expectation"
- "how do I use n.set_scenarios and n.set_risk_preference"
builds_on: [capacity-expansion-single-node]
setup:
  buses: one electricity bus
  components:
  - extendable Generators onwind, solar, CCGT and an extendable StorageUnit battery, costs from the base model
  - a load-shedding Generator at the value of lost load
  snapshots: 112 snapshots (two fortnights at 4-hour resolution), each weighted 8760/112 h
  profiles: the base model's load, wind and solar sliced to 8-21 January and 8-21 July
  assumptions:
  - {name: gas price scenarios, value: "low 40, mid 80, high 160 EUR/MWh electric"}
  - {name: probabilities, value: "0.3, 0.4, 0.3"}
  - {name: alpha, value: 0.9, note: "confidence level; CVaR averages the worst 10 % of the cost distribution, here the worst scenario"}
  - {name: omega, value: "0.5 for the headline CVaR plan; swept 0, 0.25, 0.5, 0.75, 1"}
  - {name: technology costs, value: "as capacity-expansion-single-node"}
method: |
  Deterministic plans: `n.optimize()` with one gas price. Stochastic: `n.set_scenarios
  ({low: .3, mid: .4, high: .3})` turns the network into a scenario tree with shared
  investment (first stage) and per-scenario dispatch (second stage); the gas price is
  set per scenario on the (scenario, name)-indexed generator table; the objective is
  expected cost. Risk aversion: `n.set_risk_preference(alpha, omega)` after
  set_scenarios adds CVaR to the objective, (1 - omega) x expected cost + omega x CVaR_alpha.
  The mid-price plan is evaluated under every scenario by fixing its capacities and
  re-solving dispatch (EEV). EVPI = stochastic cost minus the probability-weighted
  deterministic costs; VSS = EEV minus stochastic cost; CVaR premium = expected cost
  of the CVaR plan minus the risk-neutral one. Under scenarios, static tables are
  indexed (scenario, name), time series carry a scenario column level, and
  `buses_t.marginal_price` is probability-weighted.
knobs:
- {name: scenarios and probabilities, in: "GAS_PRICE, PROB", effect: "more or wider scenarios; the value of the stochastic solution grows with spread"}
- {name: alpha and omega, in: "ALPHA, OMEGAS, CVAR_OMEGA", effect: "omega 0 is risk-neutral, omega 1 minimises the tail alone; with three scenarios the tail is the worst one"}
- {name: representative weeks, in: profiles.representative_weeks, effect: "more weeks for fidelity at the cost of solve time"}
figures:
- id: cost_distribution
  file: figures/cost_distribution.json
  title: Realised annual cost under each gas price
  shows: >-
    What a year costs under each plan once the gas price turns out low (40 EUR/MWh), mid (80) or high (160). The
    plan built for the mid price is cheapest if the price is low or mid, and dearest, about 120 MEUR, if it is
    high. The stochastic plan, built for all three at once, is never the best and never the worst; the CVaR plan
    gives up a little more in the cheap years to cut the expensive one to about 112.
- id: capacity_mix_by_strategy
  file: figures/capacity_mix_by_strategy.json
  title: Capacity by planning strategy
  shows: Stacked capacities for the three deterministic plans, the risk-neutral stochastic plan and the CVaR plan.
- id: omega_sweep
  file: figures/omega_sweep.json
  title: Expected vs worst-case cost as risk aversion grows
  shows: Expected cost rises and the worst case falls as omega goes from 0 to 1.
teach:
- concept: stochastic-programming
  gap: >-
    Power plants are built for decades, but nobody knows what gas will cost over their lives. A plan optimised for
    one expected price is the cheapest possible system if that price comes true, and can be expensive if it does
    not; a plan that ignores the uncertainty cannot say how exposed it is. The picture (cost_distribution) shows
    what each plan costs once the price is known.
  remedy: >-
    Stochastic programming plans for several futures at once. The capacities are decided now, the same in every
    future (the first stage); the dispatch adapts to whichever future happens (the second stage); the objective is
    the cost weighted by each future's probability. The plan hedges: a bit more wind than the mid-price plan, so a
    high gas price hurts less. In PyPSA `n.set_scenarios` turns a network into such a scenario tree.
  figure: cost_distribution
  example: >-
    With gas at 40, 80 or 160 EUR/MWh (probabilities 0.3, 0.4, 0.3) the stochastic plan builds about 190 MW of wind
    against 150 for the mid-price plan and costs about 84 MEUR a year on average; knowing the price in advance would
    save about 5.1 MEUR (the value of perfect information), planning for the mid price alone would lose about 0.3
    MEUR (the value of the stochastic solution) (capacity_mw, expected_cost_meur_a, evpi_meur_a, vss_meur_a). One
    layer deeper, capacity_mix_by_strategy shows every plan's mix.
- concept: cvar
  gap: >-
    Minimising the average cost treats a painful expensive year the same as a mild cheap one, as long as they
    average out. A utility or a country may care much more about the bad year.
  remedy: >-
    CVaR, the conditional value at risk, is the average cost of the worst outcomes, here the worst tenth, which is
    the high-price year. Adding it to the objective with a weight omega trades a higher average for a lower worst
    case: insurance. At omega 0 the plan is risk-neutral, at 1 it minimises the worst case alone. In PyPSA it is
    `n.set_risk_preference(alpha, omega)`.
  figure: omega_sweep
  builds_on_concept: stochastic-programming
  example: >-
    At omega 0.5 the plan builds about 260 MW of wind, the average cost rises by about 1.3 MEUR a year and the
    worst year falls from about 116 to 112 MEUR (capacity_mw, cvar_premium_meur_a, worst_case_cost_meur_a,
    omega_sweep).
numbers:
- {id: capacity_mw, label: Capacity per carrier for every plan, unit: MW}
- {id: expected_cost_meur_a, label: Wait-and-see, stochastic, mid-plan (EEV) and CVaR expected costs, unit: MEUR/a}
- {id: evpi_meur_a, label: Expected value of perfect information, unit: MEUR/a, formula: "stochastic - sum_s p_s * deterministic_s"}
- {id: vss_meur_a, label: Value of the stochastic solution, unit: MEUR/a, formula: "EEV - stochastic"}
- {id: cvar_premium_meur_a, label: Expected cost of hedging, unit: MEUR/a, formula: "E[cost | CVaR plan] - E[cost | risk-neutral plan]"}
- {id: worst_case_cost_meur_a, label: Cost in the high-price scenario, stochastic vs CVaR plan, unit: MEUR/a}
- {id: cost_by_scenario_meur_a, label: Realised cost per scenario per plan, unit: MEUR/a}
- {id: omega_sweep, label: Expected and worst-case cost and capacities per omega, unit: MEUR/a and MW}
limitations:
- Two fortnights stand in for the year, so absolute costs are rough; the comparisons between plans are what matters.
- Three scenarios make CVaR at alpha 0.9 identical to the worst case; with many scenarios it averages a tail.
- Only the gas price is uncertain; weather-year or demand uncertainty needs per-scenario time series, which set_scenarios also supports.
sources:
- {title: "PyPSA example: Stochastic Optimization", url: "https://docs.pypsa.org/latest/examples/stochastic-optimization/"}
- {title: "PyPSA user guide: Stochastic Optimization (CVaR section)", url: "https://docs.pypsa.org/latest/user-guide/optimization/stochastic/"}
- {title: "PyPSA Labs workshop: stochastic and CVaR notebook", url: "https://pypsalabs.github.io/workshop-202609/"}
pypsa: "1.3.0"
