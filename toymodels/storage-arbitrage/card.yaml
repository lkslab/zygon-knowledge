id: storage-arbitrage
title: Battery arbitrage against a price-forming fleet
summary: >-
  A small battery on a bus where a thermal fleet and a week of variable wind set the
  price. The battery is a price-taker: it charges in the cheap windy hours and
  discharges at the evening peak, and its revenue is the price spread it captures net
  of round-trip losses. The reference for any storage revenue question.
concepts: [storage, battery, arbitrage, price-spread, cycles, round-trip-efficiency, revenue]
answers:
- "how much does a battery earn from arbitrage"
- "how many cycles a day does a battery run and when does it charge"
- "what price spread does a 4-hour battery need"
- "why does the battery not fully flatten the price"
builds_on: [merit-order-dispatch]
setup:
  buses: one electricity bus
  components:
  - four thermal Generators (nuclear, lignite, CCGT, OCGT) with fixed capacity and marginal cost
  - an onshore wind Generator with a synthetic availability profile
  - one StorageUnit (the battery) with cyclic state of charge and a tiny marginal cost to break ties
  - a Load with the daily shape and a load-shedding Generator
  snapshots: 168 hourly snapshots (seven days), weight 1
  profiles: daily load 5000 to 10000 MW; AR(1) wind with 35 % mean capacity factor; seed 42
  assumptions:
  - {name: nuclear, value: "2000 MW at 10 EUR/MWh"}
  - {name: lignite, value: "2500 MW at 25 EUR/MWh"}
  - {name: CCGT, value: "3000 MW at 55 EUR/MWh"}
  - {name: OCGT, value: "3000 MW at 110 EUR/MWh"}
  - {name: wind, value: "6000 MW, zero marginal cost"}
  - {name: battery, value: "500 MW, 4 hours, 95 % charge and 95 % discharge efficiency, cyclic"}
  - {name: battery marginal cost, value: 0.5, unit: EUR/MWh, note: "avoids degenerate charge/discharge cycling at flat prices"}
method: |
  `n.optimize()`: the battery's charging and discharging are decision variables tied by
  the state-of-charge balance with losses on both legs and a cyclic condition (the week
  ends where it started). The price is the bus dual. Revenue is price times the signed
  storage power (positive when discharging) summed over hours; cycles are discharged
  energy over usable energy capacity. Because the battery is small next to the fleet it
  barely moves the price, so the numbers read as a price-taker's revenue.
knobs:
- {name: battery size, in: "build(battery_mw=..., max_hours=...)", effect: "a large battery flattens the price and its own revenue per MW falls"}
- {name: wind capacity, in: "build(wind_mw=...)", effect: "more wind means more zero-price hours and a wider spread"}
- {name: fleet, in: FLEET, effect: "a thinner mid-merit widens the daily spread"}
figures:
- id: charge_vs_price
  file: figures/charge_vs_price.json
  title: Battery power against the price
  shows: Signed battery power (discharge positive) on the left axis and the hourly price on the right; charging sits in the price troughs.
- id: state_of_charge
  file: figures/state_of_charge.json
  title: State of charge
  shows: Energy in the battery over the week, cyclic.
- id: daily_revenue
  file: figures/daily_revenue.json
  title: Daily arbitrage revenue
  shows: Revenue per day; windy days with a deep trough pay best.
numbers:
- {id: revenue_eur, label: Arbitrage revenue over the week, unit: EUR, formula: "sum_t price_t * p_t (p > 0 discharging)"}
- {id: revenue_per_mw_eur, label: Revenue per MW of battery power over the week, unit: EUR/MW}
- {id: full_cycles, label: Equivalent full cycles in the week, unit: count, formula: "discharged energy / (p_nom * max_hours)"}
- {id: round_trip_loss_pct, label: Energy lost between charge and discharge, unit: "%", formula: "100 * (1 - discharged / charged)"}
- {id: avg_charge_price_eur_mwh, label: Energy-weighted price when charging, unit: EUR/MWh}
- {id: avg_discharge_price_eur_mwh, label: Energy-weighted price when discharging, unit: EUR/MWh}
- {id: mean_daily_price_spread_eur_mwh, label: Mean of the daily max minus min price, unit: EUR/MWh}
- {id: avg_price_eur_mwh, label: Simple mean price over the week, unit: EUR/MWh}
- {id: wind_share_pct, label: Wind energy over demand, unit: "%"}
- {id: wind_curtailed_mwh, label: Wind available but not dispatched, unit: MWh}
limitations:
- Perfect foresight over the week; a real battery bids on forecasts. See the PyPSA rolling-horizon and water-value examples.
- Capacity is fixed, so this says nothing about whether the battery pays for itself; price-duration-and-cost-recovery does.
sources:
- {title: "PyPSA example: Electricity Market (storage section)", url: "https://docs.pypsa.org/latest/examples/simple-electricity-market-examples/"}
- {title: "PyPSA example: Storage Units as Links & Stores", url: "https://docs.pypsa.org/latest/examples/replace-generator-storage-units-with-store/"}
- {title: "PyPSA example: Rolling-Horizon Optimization", url: "https://docs.pypsa.org/latest/examples/rolling-horizon/"}
pypsa: "1.3.0"
