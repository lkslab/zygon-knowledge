id: time-series-aggregation
title: Time series aggregation
summary: >-
  How much of a year can be thrown away before the plan changes? The year-long
  single-node expansion at a 20 % CO2 cap is solved at its full 4-hourly resolution,
  with 12-hour averaging, and with two and four representative fortnights weighted up
  to a year. Capacities, cost, the CO2 price and the price duration curve are compared
  against the full run, with solve time.
concepts: [time-series-aggregation, representative-weeks, resolution, capacity-expansion, complexity]
answers:
- "how coarse can the time resolution be before the capacity mix is wrong"
- "what do representative weeks get right and wrong"
- "why does averaging kill the battery"
builds_on: [capacity-expansion-single-node]
setup:
  buses: electricity and hydrogen, as in the base model
  components: identical to capacity-expansion-single-node at the 20 % cap
  snapshots: 2190 (full, 4-hourly), 730 (12-hour means), 168 (two fortnights), 336 (four fortnights); weights sum to 8760 h in every case
  profiles: the base model's load, wind and solar, averaged or sliced
  assumptions:
  - {name: co2 cap, value: "20 % of the unconstrained full-resolution emissions, the same tonnes in every variant"}
  - {name: representative fortnights, value: "8-21 January and July; plus April and October for the four-week variant"}
method: |
  The full network comes from the base model's build. Averaging: every time series is
  resampled to 12-hour means and the snapshot weighting set to 12. Representative
  weeks: `n.set_snapshots(subset)` on a copy keeps only those timestamps, weighted by
  8760 over the number of snapshots. All variants are solved with `n.optimize()`; the
  errors are relative to the full run. `tsam` (clustering into typical periods) is not
  installed in the app environment, so that method is not shown.
knobs:
- {name: averaging window, in: "_averaged(n, hours)", effect: "6 h keeps the daily cycle; 24 h removes it"}
- {name: which weeks, in: FOUR_WEEKS and profiles.representative_weeks, effect: "the choice of weeks matters more than their number"}
figures:
- id: averaging_intuition
  file: figures/averaging_intuition.json
  title: What averaging throws away
  shows: >-
    A September week of load minus the wind and solar the full plan builds: below zero there is power to spare,
    above zero something else must supply it. At the model's 4-hour resolution (grey) it swings by about 170 MW
    a day, a solar surplus at midday and a shortfall at night. Averaged over 12 hours (orange) the swing shrinks to
    about 65 MW, so the battery that would carry the midday surplus into the night looks worthless.
- id: capacity_by_method
  file: figures/capacity_by_method.json
  title: Optimal capacity by aggregation method
  shows: Capacity per technology for every variant; the battery vanishes under averaging.
- id: cost_by_method
  file: figures/cost_by_method.json
  title: Annual system cost by aggregation method
  shows: Cost per variant.
- id: price_duration_by_method
  file: figures/price_duration_by_method.json
  title: Price duration curves by aggregation method
  shows: Sorted prices per variant, axis clipped at 400 EUR/MWh.
teach:
- concept: time-series-aggregation
  gap: >-
    A year of hourly weather and demand makes a large optimisation, and a real model multiplies that by hundreds
    of regions and technologies. So models shrink time: average neighbouring hours, or pick a few representative
    weeks and weight them up to a year. But the hours thrown away are not random: averaging smooths out the daily
    swings that storage is built for, and a few typical weeks miss the rare calm, cold spells that decide how much
    firm capacity is needed. The picture (averaging_intuition) shows what averaging removes from one week.
  remedy: >-
    Treat the time resolution as a modelling choice to test, not a detail: solve the same problem at full
    resolution and in the reduced form and compare what changes. Averaging keeps the whole year but loses the
    within-day shape; representative periods keep the shape but lose the extremes. Here even the total cost is
    off by a tenth or more, and the capacities, storage above all, by far more. Choose the method by what the
    question depends on.
  figure: averaging_intuition
  example: >-
    Averaged to 12 hours, the battery disappears (44 MW at full resolution, none averaged), solar is overbuilt by
    about 40 %, and the cost comes out 12 % low; two representative fortnights overbuild wind by about 80 % and
    miss most of the hydrogen chain, with the cost 10 % high; they solve in about 2 s against 12 (capacity_mw,
    capacity_error_pct, cost_error_pct, solve_s). One layer deeper, capacity_by_method compares every method's mix
    and price_duration_by_method the prices each one produces.
numbers:
- {id: snapshots, label: Number of snapshots (per variant), unit: count}
- {id: solve_s, label: Solve time, unit: s}
- {id: cost_meur_a, label: Annual cost, unit: MEUR/a}
- {id: cost_error_pct, label: Cost relative to the full run, unit: "%"}
- {id: capacity_mw, label: Capacity per technology, unit: MW}
- {id: capacity_error_pct, label: Capacity relative to the full run, unit: "%"}
- {id: h2_store_mwh, label: Hydrogen store size, unit: MWh}
- {id: co2_price_eur_t, label: CO2 shadow price, unit: EUR/t}
- {id: load_weighted_price_eur_mwh, label: Load-weighted price, unit: EUR/MWh}
limitations:
- Four badly chosen fortnights can be worse than two; the point is that selection, not count, matters.
- No clustering-based typical periods (tsam) in this environment.
sources:
- {title: "PyPSA example: Time Series Aggregation", url: "https://docs.pypsa.org/latest/examples/time-series-aggregation/"}
pypsa: "1.3.0"
