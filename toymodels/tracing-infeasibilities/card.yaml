id: tracing-infeasibilities
title: Tracing an infeasible dispatch problem
summary: >-
  One bus, three days, two thermal units with ramp limits and minimum outputs, no load
  shedding, and a load spike that is both too high and too fast. The solve says
  "infeasible" and nothing else. HiGHS computes an irreducible infeasible subset, the
  smallest set of constraints and bounds that cannot hold together, which is read back
  into PyPSA's constraint names and snapshots. Adding load shedding repairs the model
  and the price then points at the same hours.
concepts: [infeasibility, iis, debugging, ramp-limits, load-shedding, value-of-lost-load]
answers:
- "my PyPSA model is infeasible, how do I find out why"
- "how do I get an irreducible infeasible subset with HiGHS"
- "why does everyone add a load-shedding generator"
- "how do ramp limits make a dispatch problem infeasible"
builds_on: [unit-commitment]
setup:
  buses: one electricity bus
  components:
  - coal Generator 1000 MW, 30 EUR/MWh, minimum 30 %, ramp 10 % per hour up and down
  - CCGT Generator 500 MW, 60 EUR/MWh, minimum 20 %, ramp 30 % per hour
  - a Load with the daily shape 700 to 1300 MW and a 2-hour spike to 1900 MW on day two
  - repaired case only: a load-shedding Generator at the value of lost load
  snapshots: 72 hourly snapshots, weight 1
  profiles: synthetic daily load, seed 42, with the spike overwritten
  assumptions:
  - {name: spike, value: "1900 MW for two hours from 18:00 on day two, 400 MW above the fleet"}
  - {name: value_of_lost_load, value: 3000, unit: EUR/MWh}
method: |
  `n.optimize.create_model()` then `n.model.solve(solver_name="highs")` keeps the solver
  model attached after an infeasible solve. linopy's own `compute_infeasibilities()`
  supports only Gurobi and Xpress, but the highspy object is reachable as
  `n.model.solver_model`: set `presolve` off and `iis_strategy` to 2, `run()` again and
  `getIis()` returns row and column indices. linopy names rows `c<label>` and columns
  `x<label>`, and every constraint and variable in `n.model` carries a `labels` array,
  so the labels map back to PyPSA constraint names (`Bus-nodal_balance`,
  `Generator-p-ramp_limit_up`, ...) and their snapshot and component coordinates. The
  repair adds a load-shedding generator and solves normally; its price hits the value of
  lost load in exactly the hours the subset named.
knobs:
- {name: spike height and length, in: SPIKE, effect: "a spike below the fleet but above the ramp reach is still infeasible, and the subset then holds ramp constraints only"}
- {name: ramp limits and minimums, in: UNITS, effect: "loosen them until the subset empties"}
- {name: with_shedding, in: "build(with_shedding=True)", effect: "the repaired network"}
figures:
- id: load_vs_reachable
  file: figures/load_vs_reachable.json
  title: The load spike against what the fleet can reach
  shows: >-
    Three days of load against the fleet's 1,500 MW (dashed). On the second evening a two-hour spike asks for
    1,900 MW, more than the fleet has, and the hour before it ramps faster than the coal plant can follow. Green
    is what the fleet can actually deliver once load may be shed; the vermillion block is the demand no dispatch
    can meet, about 930 MWh.
- id: iis_constraints
  file: figures/iis_constraints.json
  title: Constraint families in the irreducible infeasible subset
  shows: How many constraints of each PyPSA name are in the subset.
- id: price_after_repair
  file: figures/price_after_repair.json
  title: Price after adding load shedding
  shows: The value of lost load in the spike hours, scarcity around them from the ramps.
teach:
- concept: infeasibility
  gap: >-
    A model can ask for the impossible: more load than the plants can make, or a ramp faster than they can
    follow. Then there is no answer at all, and the solver says only one word, infeasible, with no hint which
    of the thousands of constraints are to blame. In a large model that can cost days. The picture
    (load_vs_reachable) shows a small case where the cause is visible by eye.
  remedy: >-
    Two tools. The solver can compute an irreducible infeasible subset (IIS): the smallest set of constraints
    that cannot all hold together, so removing any one of them makes the rest feasible, which points straight
    at the hours and the limits in conflict. And for the fix, give the model a way out at a high price, load
    shedding at the value of lost load, so it always solves and shows where and how much it had to shed. In
    PyPSA with HiGHS the IIS is read back into PyPSA's constraint names and snapshots.
  figure: load_vs_reachable
  example: >-
    The IIS holds 12 constraints and 8 bounds, all in the four hours around the spike: the bus balances,
    the plants' capacity limits and the coal plant's ramp limits; the spike exceeds the fleet by 400 MW, and
    with load shedding about 930 MWh is shed over two hours (iis_size, iis_constraints_by_name, iis_hours,
    load_over_capacity_mw, shed_energy_mwh). One layer deeper, iis_constraints counts the families in the subset.
- concept: value-of-lost-load
  gap: >-
    Adding load shedding makes the model solve, but at what price should shedding enter, and what does that
    do to the results?
  remedy: >-
    Shedding is priced at the value of lost load, what consumers would pay to avoid an outage, typically
    thousands of EUR per MWh. The model then sheds only when nothing else can serve the load, and in those
    hours the price rises to that value: the price itself marks the hours the IIS pointed at.
  figure: price_after_repair
  builds_on_concept: infeasibility
  example: >-
    After the repair the price reaches 3,000 EUR/MWh, the value of lost load, in the two spike hours
    (max_price_after_repair_eur_mwh, hours_at_voll).
numbers:
- {id: solver_condition, label: Termination condition of the broken solve}
- {id: iis_size, label: Constraints and variable bounds in the subset, unit: count}
- {id: iis_constraints_by_name, label: Subset members by PyPSA constraint name, unit: count}
- {id: iis_hours, label: Snapshots the subset touches}
- {id: fleet_capacity_mw, label: Installed capacity, unit: MW}
- {id: peak_load_mw, label: The spike, unit: MW}
- {id: load_over_capacity_mw, label: Spike minus capacity, unit: MW}
- {id: shed_energy_mwh, label: Energy not served after the repair, unit: MWh}
- {id: hours_with_shedding, label: Hours with shedding, unit: h}
- {id: max_price_after_repair_eur_mwh, label: Highest price after the repair, unit: EUR/MWh}
- {id: hours_at_voll, label: Hours priced at the value of lost load, unit: h}
- {id: repaired_cost_eur, label: Objective of the repaired solve, unit: EUR}
limitations:
- The subset is one of possibly several irreducible ones; HiGHS returns the first it finds.
- Works for LPs; for a MILP the same call applies to the relaxation only.
sources:
- {title: "PyPSA example: Tracing Infeasibilities", url: "https://docs.pypsa.org/latest/examples/tracing-infeasibilities/"}
- {title: "linopy troubleshooting: infeasible model", url: "https://linopy.readthedocs.io/en/latest/infeasible-model.html"}
pypsa: "1.3.0"
