id: unit-commitment
title: Unit commitment and its prices
summary: >-
  Two committable thermal units with start-up costs, minimum part load and minimum
  up/down times, plus a peaker, over two days. A mixed-integer solve decides when units
  switch on; a second solve with the commitment frozen recovers prices, and a
  linearised commitment shows how the relaxation prices start-ups into the hours that
  cause them.
concepts: [unit-commitment, milp, start-up-cost, min-up-time, part-load, uc-prices, integrality-gap]
answers:
- "how do start-up costs and minimum up times change dispatch"
- "why are there no prices from a mixed-integer model, and how do you get them"
- "why does a unit run at minimum load overnight instead of switching off"
- "what is the integrality gap"
builds_on: [merit-order-dispatch]
setup:
  buses: one electricity bus
  components:
  - coal and CCGT Generators with committable=True, start-up cost, p_min_pu, min_up_time, min_down_time
  - an OCGT peaker without commitment and a load-shedding Generator
  - one Load with the daily shape over two days
  snapshots: 48 hourly snapshots, weight 1
  profiles: synthetic daily load 700 to 1600 MW, seed 42
  assumptions:
  - {name: coal, value: "1000 MW, 30 EUR/MWh, min load 40 %, start-up 5000 EUR, min up/down 4 h"}
  - {name: CCGT, value: "800 MW, 60 EUR/MWh, min load 30 %, start-up 1500 EUR, min up/down 2 h"}
  - {name: OCGT, value: "500 MW at 120 EUR/MWh, always available"}
  - {name: value_of_lost_load, value: 3000, unit: EUR/MWh}
method: |
  Three solves. (1) `n.optimize()` with committable generators is a MILP (HiGHS, gap
  1e-6): binary status per unit and hour, start-up variables, minimum up/down time
  constraints. A MILP has no duals, so `buses_t.marginal_price` is not meaningful.
  (2) Fixed-status LP: copy the network, set committable=False and p_min_pu/p_max_pu
  from the MILP's status per hour, solve; its duals are the dispatch prices given that
  commitment, the pattern of the uc-prices example. (3) `n.optimize(linearized_unit_
  commitment=True)`: status becomes continuous in [0, 1]; the LP keeps start-up costs
  and gives prices that can fall below every marginal cost or rise above them.
knobs:
- {name: start-up costs, in: UNITS dict, effect: "raise coal's start-up to see it stay on all night at minimum load"}
- {name: min up/down times, in: UNITS dict, effect: "longer times force longer on/off blocks and more peaker use"}
- {name: load range, in: "build(base_mw=..., peak_mw=...)", effect: "a deeper trough forces a cycling decision"}
figures:
- id: commitment_intuition
  file: figures/commitment_intuition.json
  title: A plant is on or off, and on means at least its minimum
  shows: >-
    The CCGT over two days. Dispatched as if it could run at any level (dashed blue), it spends 29 hours
    at a few dozen to 240 MW, inside the shaded band a running CCGT cannot enter: below its 240 MW minimum.
    With commitment (orange) it is either off or at 240 MW and above; in the hours it is off, the
    expensive peaker (green) covers the small gaps, cheaper than starting the CCGT again.
- id: unit_status
  file: figures/unit_status.json
  title: Commitment status
  shows: One band per unit, raised while committed; minimum times keep coal on through the trough.
- id: dispatch_stack
  file: figures/dispatch_stack.json
  title: Dispatch
  shows: Stacked dispatch; committed units never dip below their minimum part load, the peaker fills the evening.
- id: price_uc_vs_relaxed
  file: figures/price_uc_vs_relaxed.json
  title: Prices, fixed vs linearised commitment
  shows: The fixed-commitment price is the flexible unit's marginal cost; the linearised price spikes in start-up hours.
teach:
- concept: unit-commitment
  gap: >-
    A simple dispatch model treats a power plant like a tap: it can run at any level from zero to full,
    change every hour, and switch on and off for free. Real thermal plants cannot. Once on, a gas or coal
    plant has a minimum it cannot go below, starting it costs fuel and wear, and once started or stopped it
    must stay that way for a few hours. A tap-like model plans schedules no plant could follow. The picture
    (commitment_intuition) shows the gas plant both ways.
  remedy: >-
    Unit commitment adds an on/off decision per plant and hour: a plant that is on runs between its
    minimum and full output, a start costs a fixed amount, and minimum up and down times apply. The
    optimiser then weighs keeping a plant at its minimum, switching it off and covering with something
    dearer, or paying for another start. The on/off choices are integer variables, so the problem becomes a
    mixed-integer programme; in PyPSA a generator gets `committable=True` with `p_min_pu`, `start_up_cost`
    and `min_up_time`.
  figure: commitment_intuition
  example: >-
    Dispatched as a tap, the CCGT would run below its 240 MW minimum in 29 of the 48 hours. With commitment it
    starts 8 times, sits at its minimum for 13 hours, and the peaker makes about 690 MWh; the two days cost
    about 2.08 MEUR instead of 2.00 (hours_plain_ccgt_below_min_load, start_ups, hours_at_min_load,
    peaker_energy_mwh, total_cost_uc_eur, total_cost_plain_dispatch_eur). One layer deeper, unit_status shows
    which unit is on when and dispatch_stack the whole schedule.
- concept: uc-prices
  gap: >-
    Prices in a linear model are the duals of the energy balance: what one more MWh would cost. A model with
    on/off decisions has no such duals, and the start-up costs and minimum loads that shape the schedule do
    not show up in any single hour's marginal cost.
  remedy: >-
    Two common answers. Fix the commitment the integer problem chose and re-solve the dispatch as a linear
    problem: its prices are the marginal cost of the flexible unit, sometimes below every plant's cost when a
    unit is held at its minimum. Or relax the on/off variables to fractions (a linearised commitment), which
    spreads start-up costs into the hours that cause them. Neither pays a plant exactly its start-up cost;
    that gap is why markets add uplift payments.
  figure: price_uc_vs_relaxed
  builds_on_concept: unit-commitment
  example: >-
    With the commitment fixed the load-weighted price is about 69 EUR/MWh; the linearised commitment gives
    about 58, and costs 3.5 % less than the integer schedule, the integrality gap (avg_price_fixed_status_eur_mwh,
    avg_price_linearised_eur_mwh, integrality_gap_pct).
numbers:
- {id: total_cost_uc_eur, label: MILP objective, unit: EUR}
- {id: total_cost_linearised_eur, label: Linearised-commitment objective, unit: EUR}
- {id: integrality_gap_pct, label: MILP over linearised cost, unit: "%", formula: "100 * (uc - linearised) / linearised"}
- {id: start_ups, label: Start-ups per unit in two days, unit: count}
- {id: start_up_cost_share_pct, label: Start-up cost share of MILP cost, unit: "%"}
- {id: hours_at_min_load, label: Hours each unit sits exactly at its minimum, unit: h}
- {id: hours_committed, label: Hours each unit is on, unit: h}
- {id: avg_price_fixed_status_eur_mwh, label: Load-weighted price from the fixed-status LP, unit: EUR/MWh}
- {id: avg_price_linearised_eur_mwh, label: Load-weighted price from the linearised LP, unit: EUR/MWh}
- {id: min_price_linearised_eur_mwh, label: Lowest linearised price, unit: EUR/MWh}
- {id: total_cost_plain_dispatch_eur, label: The same two days dispatched without commitment, unit: EUR}
- {id: hours_plain_ccgt_below_min_load, label: Hours the dispatch without commitment runs the CCGT between zero and its minimum load, unit: h}
- {id: peaker_energy_mwh, label: OCGT energy over two days, unit: MWh}
limitations:
- No ramp limits and no reserve requirement; both are one attribute away (ramp_limit_up, and the reserve example).
- The fixed-status price ignores the cost of the commitment itself; make-whole payments are how real markets handle that.
sources:
- {title: "PyPSA example: Unit Commitment", url: "https://docs.pypsa.org/latest/examples/unit-commitment/"}
- {title: "PyPSA example: Negative Prices in Linearized UC", url: "https://docs.pypsa.org/latest/examples/uc-prices/"}
- {title: "PyPSA user guide: Unit Commitment", url: "https://docs.pypsa.org/latest/user-guide/optimization/unit-commitment/"}
pypsa: "1.3.0"
